id: win2016-tcp-keep-alive-interval

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Odstęp między pakietami podtrzymującymi połączenie skrócony
    en: The interval between connection keep-alive packets shortened
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie skraca czas, po jakim maszyna sprawdza, czy połączenie, przez
    które nic nie przechodzi, nadal ma drugą stronę.

    Połączenie, w którym obie strony milczą, wygląda tak samo niezależnie od
    tego, czy druga strona istnieje. Maszyna trzyma je otwarte i zajmuje na
    nie zasoby, dopóki się nie upewni, że rozmówcy nie ma. Domyślny czas
    tego upewniania się liczony jest w godzinach.

    Znaczenie ma to z dwóch powodów. Pierwszy jest odpornościowy: połączenia
    porzucone zajmują miejsce w tablicy, a tablica jest skończona. Kto otwiera
    połączenia i porzuca je, zapełnia ją i doprowadza do tego, że maszyna
    przestaje przyjmować nowe. Skrócenie czasu sprzątania zmniejsza liczbę
    połączeń, jaką napastnik musi otworzyć, żeby to osiągnąć — a raczej
    zwiększa tempo, w jakim maszyna z tego wychodzi.

    Drugi powód dotyczy sesji. Połączenie porzucone przez człowieka, ale
    podtrzymane po stronie maszyny, trzyma otwartą sesję ze wszystkim, co
    się z nią wiąże. Szybsze zamknięcie połączenia oznacza szybsze
    zamknięcie tego, co za nim stoi.

    Wartość wymagana skraca odstęp do pięciu minut, a wartości niższe
    spełniają zasadę tak samo.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wolniejsze
    sprzątanie połączeń porzuconych, czyli tańsze doprowadzenie maszyny do
    stanu, w którym nie przyjmuje nowych, i dłużej żyjące sesje porzucone.
  en: |
    The setting shortens the time after which the machine checks whether a
    connection nothing passes through still has another side.

    A connection in which both sides are silent looks the same whether the other
    side exists or not. The machine holds it open and spends resources on it until
    it makes sure the other party is gone. The default time of that making sure is
    counted in hours.

    This matters for two reasons. The first is one of resilience: abandoned
    connections take up room in a table, and the table is finite. Whoever opens
    connections and abandons them fills it and brings it about that the machine
    stops taking new ones. Shortening the time of clearing up lessens the number of
    connections an attacker must open to achieve that - or rather quickens the pace
    at which the machine comes out of it.

    The second reason concerns sessions. A connection abandoned by a person but held
    up on the machine's side keeps a session open with everything that goes with it.
    Closing the connection sooner means closing what stands behind it sooner.

    The required value shortens the interval to five minutes, and lower values
    satisfy the principle just as well.

    What an attacker gains while the item goes unmet: a slower clearing up of
    abandoned connections, which is to say a cheaper way of bringing the machine to
    a state where it takes no new ones, and longer-lived abandoned sessions.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", choć skutek nie polega tu na tym,
    że coś przestaje działać.

    Skrócenie odstępu zwiększa ruch podtrzymujący. Na maszynie z setkami
    otwartych połączeń oznacza to stały, niewielki ruch w tle, który
    wcześniej występował rzadziej. Samo w sobie nie jest to problemem —
    staje się nim tam, gdzie łącze jest rozliczane za ilość albo wąskie:
    łącza zapasowe, połączenia przez sieć komórkową, tunele przez sieć
    publiczną.

    Druga rzecz jest ważniejsza i częściej zaskakuje. Połączenia, które
    dotąd przeżywały długie okresy ciszy, zaczynają być zamykane szybciej.
    Dotyczy to zwłaszcza połączeń trzymanych celowo: sesji do bazy danych
    w puli, tuneli zarządzających, połączeń oprogramowania przemysłowego
    czekającego na zdarzenie. Aplikacja, która nie umie nawiązać połączenia
    ponownie, zgłosi błąd dopiero wtedy, gdy będzie chciała czegoś użyć.

    Skutek jest więc opóźniony i mylący — pojawia się nie przy zmianie,
    tylko przy pierwszym użyciu po przerwie. Dlatego wyliczenie aplikacji
    trzymających połączenia bezczynnie jest tu częścią wdrożenia.

    Czego to nie psuje: połączeń aktywnych, usług, nowych połączeń,
    łączności jako takiej.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", though the effect here does not consist
    in something ceasing to work.

    Shortening the interval increases keep-alive traffic. On a machine with hundreds
    of open connections that means a steady, small background traffic that occurred
    less often before. That is no problem in itself - it becomes one where the link
    is charged by volume or is narrow: spare links, connections over a mobile
    network, tunnels across a public network.

    The second thing matters more and surprises more often. Connections that until
    now survived long spells of silence begin to be closed sooner. This concerns
    above all connections held deliberately: pooled database sessions, management
    tunnels, connections of industrial software waiting for an event. An application
    unable to make its connection afresh will report an error only when it wants to
    use something.

    The effect is therefore delayed and misleading - it appears not at the change
    but at the first use after a pause. Enumerating the applications that hold
    connections idle is for that reason part of the rollout here.

    What this does not break: active connections, services, new connections, or
    connectivity as such.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Sesje do bazy danych trzymane w puli oraz tunele zarządzające zaczynają być zamykane szybciej po okresie ciszy
      - Oprogramowanie przemysłowe czekające na zdarzenie przez otwarte połączenie zgłosi błąd dopiero przy pierwszym użyciu po przerwie
      - Na łączu rozliczanym za ilość albo wąskim stały ruch podtrzymujący staje się zauważalnym kosztem
      - Połączenia aktywne, usługi, nowe połączenia i łączność jako taka pozostają bez zmian
    en:
      - Pooled database sessions and management tunnels begin to be closed sooner after a spell of silence
      - Industrial software waiting for an event over an open connection will report an error only at the first use after a pause
      - On a link charged by volume, or a narrow one, the steady keep-alive traffic becomes a noticeable cost
      - Active connections, services, new connections and connectivity as such stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działają aplikacje trzymające połączenia bezczynnie przez długi czas i nie sprawdzono, czy umieją nawiązać je ponownie
      - Maszyna łączy się przez łącze rozliczane za ilość, przez sieć komórkową albo przez wąski tunel
    en:
      - Applications holding connections idle for long spells run on the machine and it has not been checked whether they can make them afresh
      - The machine connects over a link charged by volume, over a mobile network, or through a narrow tunnel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is given in milliseconds; five minutes is three hundred
      # thousand and anything lower is compliant as well.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'KeepAliveTime'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '300000'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'KeepAliveTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'KeepAliveTime' -Value 300000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Porównanie jest „nie większe niż", bo wpis opisuje górną granicę odstępu.
    Maszyna ustawiona ostrzej spełnia zasadę z nawiązką i audyt nie ma
    powodu tego karać.

    Punkt należy do poziomu drugiego i jest to ocena trafna. Nie zamyka
    drogi ataku — zmniejsza koszt, jaki maszyna ponosi, gdy ktoś ją zaleje
    porzuconymi połączeniami, i skraca życie sesji porzuconych. Jest to
    utwardzenie, nie zabezpieczenie.

    Reguła idzie w parze z dwoma punktami o liczbie powtórzeń wysyłki, i te
    trzy razem opisują, jak szybko maszyna przestaje czekać na stronę, która
    zamilkła. Wdrażane osobno dają wynik połowiczny, bo połączenie może
    umrzeć na każdym z tych etapów.
  en: |
    The comparison is "not greater than", since the entry describes the upper bound
    of the interval. A machine set more strictly satisfies the principle and more,
    and the audit has no reason to punish it.

    The item belongs to the second level and that judgement is right. It shuts no
    road of attack - it lessens the cost the machine bears when somebody floods it
    with abandoned connections, and shortens the life of abandoned sessions. It is a
    hardening rather than a safeguard.

    The rule goes in a trio with the two items on the number of send repeats, and
    the three together describe how quickly the machine stops waiting for a side
    that has fallen silent. Rolled out apart they give a half result, since a
    connection can die at any of those stages.
