id: win2025-logon-hours-expiry-forced-logoff

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wylogowanie po upływie dozwolonych godzin pracy wymuszane
    en: Signing out once the allowed working hours pass enforced
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisane w zasadach zabezpieczeń rozstrzyga, czy upływ
    dozwolonych godzin pracy ma kończyć trwające sesje, czy tylko
    zamykać drogę do zakładania nowych.

    Jest to ten sam zamysł, który niesie ustawienie usługi serwera
    plików, ale sięgnięty z drugiej strony: nie przez wpis usługi, lecz
    przez zasadę konta. Obie części opisują to samo ograniczenie i obie
    trzeba mieć, żeby ograniczenie działało.

    Na serwerze rozstrzyga jedna okoliczność, która zmienia wagę tego
    punktu całkowicie. Na serwerze członkowskim zasada lokalna dotyczy
    kont lokalnych. Na kontrolerze domeny zasada lokalna jest zasadą
    domeny — wprowadzona tutaj obowiązuje wszystkie konta domenowe,
    a więc wszystkich ludzi i wszystkie usługi w niej pracujące.

    Znaczy to, że ten sam przełącznik, ustawiony na dwóch różnych
    maszynach, ma zasięg różniący się o kilka rzędów wielkości. Nie jest
    to niuans do przypisu i piszę o tym wprost, bo od tego zależy, czy
    zmiana jest czynnością porządkową, czy decyzją dotyczącą całej
    organizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    założoną w dozwolonych godzinach i trwającą poza nimi, mimo że
    ograniczenie czasowe na koncie wyznaczono.
  en: |
    The setting written in the security policy settles whether the passing of the permitted
    working hours is to end the sessions under way, or only to shut the road to the opening of
    new ones.

    It is the same design the file server service's setting carries, but reached from the other
    side: not through the service's entry but through the account's rule. Both parts describe the
    same narrowing and both must be held for the narrowing to work.

    On a server one circumstance settles the matter and changes this item's weight wholly. On a
    member server the local policy bears on local accounts. On a domain controller the local
    policy is the domain's policy - brought in here it binds every domain account, and so every
    person and every service working within it.

    That means the same switch, set on two different machines, has a reach differing by orders of
    magnitude. It is no nuance for a footnote and I write of it outright, for upon it hangs
    whether the change is a tidying or a decision bearing on the whole organisation.

    What an attacker gains while the item goes unmet: a session opened within the permitted hours
    and lasting beyond them, though a bound in time was set on the account.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy ludzi i na kontrolerze domeny
    jest decyzją dotyczącą całej organizacji, a nie jednej maszyny.

    Podniosłem klasę względem paczki stanowiska roboczego wyłącznie
    z powodu zasięgu. Sama czynność jest tak samo prosta, ale
    wprowadzona na kontrolerze domeny dotknie każdego konta w domenie.
    Przed zmianą ustal, na której maszynie ją wykonujesz — to pytanie
    jest tutaj ważniejsze niż samo ustawienie.

    Skutek widoczny jest wtedy, gdy godziny logowania są na kontach
    wyznaczone: sesje kończą się o stałej porze, a nie trwają do woli.
    Tam, gdzie godzin nie wyznaczono, zmiana nie robi nic — i tak jest
    najczęściej.

    Przypadkiem do rozważenia szczególnie na kontrolerze domeny są konta
    usługowe. Konto usługowe z godzinami logowania odziedziczonymi po
    szablonie konta ludzkiego przestanie pracować w nocy, a zadanie,
    które prowadziło, zgłosi niepowodzenie do własnego dziennika i do
    nikogo więcej.

    Warto oddzielić dwie rzeczy, bo bywają mylone. Zasada ta nie skraca
    ani nie wydłuża godzin logowania — nie dotyczy tego, kiedy wolno
    pracować, tylko tego, co dzieje się z sesją w chwili, gdy ten czas
    mija.

    Zmiana nie wymaga przerwy i wchodzi w życie przy najbliższym upływie
    godzin. Wycofanie odtwarza wartość zapisaną w kopii; przy braku
    zapisanej wartości wycofanie odmawia działania, zamiast wpisywać
    wartość zgadywaną.
  en: |
    The change surely changes how people work and on a domain controller is a decision bearing on
    the whole organisation rather than on one machine.

    I raised the class against the working station's pack by reason of reach alone. The deed
    itself is as simple, but brought in on a domain controller it will touch every account in the
    domain. Before the change settle on which machine you are making it - that question is here
    weightier than the setting itself.

    The effect shows where sign-in hours are set on the accounts: sessions end at a fixed time
    rather than lasting at will. Where no hours were set the change does nothing - and so it most
    often is.

    A case to be weighed, on a domain controller above all, is service accounts. A service account
    with sign-in hours inherited from a human account's template will stop working through the
    night, and the job it led will report its failure to a log of its own and to nobody else.

    Two things are worth keeping apart, being at times confused. The rule neither shortens nor
    lengthens the sign-in hours - it does not bear on when work is allowed, only on what becomes
    of a session at the moment that time passes.

    The change takes no break and comes into force at the nearest passing of the hours. The
    undoing restores the value kept in the backup; where no value was kept, the undoing refuses
    to act rather than writing a guessed one.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - scripting-and-automation
  what_breaks:
    pl:
      - Na kontrolerze domeny zmiana dotyczy wszystkich kont domenowych, a nie tylko tej maszyny
      - Konto usługowe z wyznaczonymi godzinami logowania przestanie pracować poza nimi
      - Zadanie nocne zgłosi niepowodzenie do własnego dziennika i do nikogo więcej
      - Tam, gdzie godzin logowania nie wyznaczono, zmiana nie robi nic
    en:
      - On a domain controller the change bears on every domain account and not on this machine alone
      - A service account with sign-in hours set will stop working outside them
      - A nightly job will report its failure to a log of its own and to nobody else
      - Where no sign-in hours were set the change does nothing
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest kontrolerem domeny, a skutków dla kont domenowych nie przejrzano
      - Konta usługowe mają godziny logowania odziedziczone po szablonie konta ludzkiego
    en:
      - The machine is a domain controller and the effects for domain accounts were never looked over
      - Service accounts hold sign-in hours inherited from a human account's template
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting lives in the security policy rather than in the registry,
      # so it is read from an export of that policy.
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ForceLogoffWhenHourExpire\s*=\s*(\d+)') { $Matches[1] }
        else { 'MISSING' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^ForceLogoffWhenHourExpire\s*=\s*(\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'ForceLogoffWhenHourExpire'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ForceLogoffWhenHourExpire = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ForceLogoffWhenHourExpire = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-force-logoff-when-logon-hours-expire

notes:
  pl: |
    Na serwerze członkowskim zasada lokalna dotyczy kont lokalnych.
    Na kontrolerze domeny zasada lokalna jest zasadą domeny i obowiązuje
    wszystkie konta domenowe — stąd podniesiona klasa uciążliwości.

    Ustawienie leży w zasadach zabezpieczeń, a nie w rejestrze, więc
    odczyt idzie przez eksport zasad. Bez uprawnień administratora
    eksport się nie powiedzie i sprawdzenie zwróci osobny wynik zamiast
    niezgodności.

    Czytaj razem z rozłączaniem sesji sieciowych na usłudze serwera
    plików. Obie części opisują to samo ograniczenie z dwóch stron.
  en: |
    On a member server the local policy bears on local accounts. On a domain controller the local
    policy is the domain's policy and binds every domain account - thence the raised class of
    disruption.

    The setting lies in the security policy rather than in the registry, so the reading goes
    through an export of that policy. Without administrative rights the export will not succeed
    and the check returns an outcome of its own rather than non-compliance.

    Read together with the disconnecting of network sessions at the file server service. Both
    parts describe the same narrowing from two sides.
