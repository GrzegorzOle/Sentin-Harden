id: win2016-settings-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Sync your settings
  title:
    pl: Przenoszenie ustawień systemu do chmury zablokowane
    en: The carrying of system settings to the cloud blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje przenoszenie ustawień systemu do chmury i między
    maszynami.

    Mechanizm ten zapamiętuje ustawienia profilu i odtwarza je na innej
    maszynie, do której ten sam profil się zaloguje. Brzmi to niewinnie
    i w dużej części jest — dopóki nie spojrzy się, co dokładnie obejmuje.

    Obejmuje bowiem także rzeczy, które ustawieniami są tylko z nazwy:
    zapamiętane poświadczenia, hasła sieci bezprzewodowych i dane
    uwierzytelniające przechowywane przez system. Znaczy to, że materiał
    uwierzytelniający opuszcza maszynę i trafia do magazynu poza
    organizacją, a stamtąd na każdą inną maszynę, na której ten profil się
    zaloguje.

    Na serwerze jest to sytuacja wprost niepożądana. Poświadczenia
    zapamiętane na serwerze są poświadczeniami administracyjnymi, a maszyna,
    na którą trafią, może być dowolna.

    Punkt wymaga dwóch wartości. Sam przełącznik zostawia wybór
    użytkownikowi, a ustawienie, które użytkownik może cofnąć, jest
    sugestią, nie zasadą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę,
    którą zapamiętane poświadczenia opuszczają maszynę i trafiają tam,
    gdzie ich nikt nie pilnuje.
  en: |
    The setting blocks the carrying of the system's settings to the cloud and between machines.

    That mechanism remembers a profile's settings and restores them on another machine the same profile
    logs on to. It sounds innocent and in large part is - until one looks at what exactly it takes in.

    For it takes in also things that are settings in name alone: remembered credentials, the passwords of
    wireless networks and authenticating data held by the system. That means authenticating material
    leaves the machine and lands in a store outside the organisation, and from there on every other
    machine that profile logs on to.

    On a server that is a state of affairs plainly unwanted. Credentials remembered on a server are
    administrative credentials, and the machine they land on may be any at all.

    The item calls for two values. The switch alone leaves the choice with the user, and a setting a user
    can undo is a suggestion rather than a policy.

    What an attacker gains while the item goes unmet: a road by which remembered credentials leave the
    machine and land where nobody guards them.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze skutek jest zwykle żaden.

    Rzecz do ustalenia dotyczy tego, czy ktokolwiek loguje się na tę
    maszynę profilem przenoszonym między urządzeniami. Na serwerze zwykle
    nie, bo loguje się na niego konto administracyjne używane na miejscu.

    Jeżeli jednak tak jest, wykonanie punktu odbiera przenoszenie ustawień.
    Osoba przyzwyczajona do tego, że jej układ pulpitu, ustawienia
    regionalne i zapamiętane hasła pojawiają się same, będzie musiała je
    ustawić raz.

    Rzecz druga dotyczy zapamiętanych haseł sieci bezprzewodowych. Po
    zmianie przestaną się przenosić, a na maszynie, która do sieci łączy
    się bezprzewodowo i polegała na tym mechanizmie, trzeba je wprowadzić
    ręcznie.

    Objaw jest natychmiastowy i czytelny: ustawienia po prostu nie
    przychodzą. Nikt nie będzie szukał przyczyny długo.

    Czego to nie psuje: logowania, profili mobilnych w domenie,
    przekierowanych folderów, aplikacji, usług, sieci przewodowej.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on a server the consequence is as a rule none.

    The thing to be established is whether anybody logs on to this machine by a profile carried between
    devices. On a server as a rule not, an administrative account used on the spot logging on to it.

    If it is so, though, carrying the item out takes the carrying of settings away. A person used to their
    desktop's layout, regional settings and remembered passwords appearing of themselves will have to set
    them once.

    The second matter concerns the remembered passwords of wireless networks. After the change they will
    cease to be carried, and on a machine connecting to the network wirelessly and relying on that
    mechanism they have to be entered by hand.

    The symptom is immediate and legible: the settings simply do not come. Nobody will look for the cause
    long.

    What this does not break: logging on, roaming profiles within a domain, redirected folders,
    applications, services, or the wired network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Ustawienia profilu przestają przychodzić na maszynę i trzeba je ustawić raz na miejscu
      - Zapamiętane hasła sieci bezprzewodowych przestają się przenosić i trzeba je wprowadzić ręcznie
      - Objaw jest natychmiastowy i czytelny, więc nikt nie będzie szukał przyczyny długo
      - Profile mobilne w domenie i przekierowane foldery działają dalej i punkt ich nie dotyczy
      - Logowanie, aplikacje, usługi i sieć przewodowa pozostają bez zmian
    en:
      - A profile's settings cease to come to the machine and have to be set once on the spot
      - The remembered passwords of wireless networks cease to be carried and have to be entered by hand
      - The symptom is immediate and legible, so nobody will look for the cause long
      - Roaming profiles within a domain and redirected folders work on and the item does not concern them
      - Logging on, applications, services and the wired network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś loguje się na tę maszynę profilem przenoszonym między urządzeniami i polega na przychodzących ustawieniach
      - Maszyna łączy się z siecią bezprzewodowo i hasła sieci są dostarczane tym mechanizmem
    en:
      - Somebody logs on to this machine by a profile carried between devices and relies on the settings coming in
      - The machine connects to the network wirelessly and the network passwords are delivered by that mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch itself and the entry taking the
      # choice away from the user. Switched off but left to the user is reported
      # apart, because it is a suggestion rather than a policy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DisableSettingSync'
        $override = $item.'DisableSettingSyncUserOverride'
        if ($null -eq $switch -or $null -eq $override) { 'MISSING' }
        elseif ([int]$switch -ne 2) { 'NOT_BLOCKED' }
        elseif ([int]$override -ne 1) { 'USER_CAN_OVERRIDE' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('DisableSettingSync', 'DisableSettingSyncUserOverride')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both values are needed. The switch alone leaves the choice with the user,
    # and a setting a user can undo is a suggestion rather than a policy.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    if (-not (Test-Path -Path $path)) { $null = New-Item -Path $path -Force }
    Set-ItemProperty -Path $path -Name 'DisableSettingSync' -Value 2 -Type DWord
    Set-ItemProperty -Path $path -Name 'DisableSettingSyncUserOverride' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt jest w tym bloku jedyny o kategorii wysokiej i warto go z niego
    wyjąć przy pokazywaniu. Cztery poprzednie reguły dotyczą hałasu; ta
    dotyczy materiału uwierzytelniającego opuszczającego maszynę.

    Argument, który tę różnicę niesie, musi paść w pierwszym zdaniu opisu.
    Nazwa ustawienia mówi o przenoszeniu ustawień, a przedmiotem są
    zapamiętane poświadczenia. Użytkownik, który przeczyta tylko nazwę,
    odłoży ten punkt na koniec listy.

    Konstrukcja z dwóch wartości jest drugą rzeczą wartą pokazania. Audyt
    rozróżnia stan, w którym przenoszenie jest wyłączone, ale użytkownik
    może je włączyć z powrotem — i zgłasza go osobno, bo jest to sugestia,
    nie zasada. Rozróżnienie to bywa pomijane przez narzędzia sprawdzające
    jedną wartość i daje fałszywe zielone.

    Profile mobilne w domenie to osobny mechanizm i punkt ich nie dotyczy.
    Warto to powiedzieć wprost, bo obie rzeczy nazywa się potocznie
    przenoszeniem ustawień.
  en: |
    The item is in this block the only one of a high category and is worth taking out of it in the showing.
    The four rules before concern noise; this one concerns authenticating material leaving the machine.

    The argument bearing that difference must fall in the description's first sentence. The setting's name
    speaks of the carrying of settings, and the subject is remembered credentials. A user who reads the name
    alone will put this item at the list's end.

    The build from two values is the second thing worth showing. The audit tells apart the state in which
    the carrying is switched off but the user may switch it back on - and reports it apart, it being a
    suggestion and not a policy. That distinction is at times passed over by tools checking one value, and
    gives a false green.

    Roaming profiles within a domain are a separate mechanism and the item does not concern them. That is
    worth saying outright, both things being called colloquially the carrying of settings.
