id: win10-bitlocker-secure-boot-integrity

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Sprawdzanie spójności startu oparte na bezpiecznym rozruchu
    en: Startup integrity checking based on secure boot
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wiąże sprawdzanie spójności startu z mechanizmem
    bezpiecznego rozruchu zamiast z ręcznie ułożoną listą pomiarów.

    Moduł sprzętowy wydaje klucz do dysku wtedy, gdy stan maszyny przy
    starcie zgadza się z zapamiętanym. Pytanie brzmi, co dokładnie jest
    porównywane. Lista układana ręcznie opisuje wybrane elementy
    rozruchu i pomija resztę — a każdy element pominięty jest miejscem,
    w którym da się coś podmienić bez utraty dostępu do klucza.

    Oparcie sprawdzenia na bezpiecznym rozruchu przenosi tę decyzję na
    mechanizm, który i tak pilnuje podpisów wszystkich składników
    uruchamianych przed systemem. Zakres jest przez to szerszy
    i spójniejszy, a przy tym nie wymaga utrzymywania listy przy każdej
    aktualizacji.

    Odnotowuję warunek: maszyna musi mieć bezpieczny rozruch włączony.
    Bez niego ustawienie nie ma na czym się oprzeć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: elementy
    rozruchu poza listą pomiarów, które da się podmienić, nie tracąc
    dostępu do klucza.
  en: |
    The setting ties the checking of the start's soundness to the mechanism of secure boot instead of to a list of
    measurements laid out by hand.

    The hardware module gives the disk's key up where the machine's state at the start agrees with the one held in
    mind. The question is what exactly is set against what. A list laid out by hand sets out chosen parts of the
    start and passes the rest over - and every part passed over is a place at which something may be changed
    without the key being lost.

    The resting of the check upon secure boot carries that decision over to a mechanism that watches the
    signatures of every part started before the system anyway. The reach is by that wider and of a piece, and
    withal calls for no keeping up of a list at every update.

    I set down the condition: the machine must have secure boot switched on. Without it the setting has nothing to
    rest upon.

    What an attacker gains while the item goes unmet: the parts of the start outside the list of measurements,
    which may be changed without the key being lost.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie dotyka ani szyfrowania, ani sposobu odblokowania dysku.
    Zmienia wyłącznie to, na podstawie czego moduł sprzętowy rozstrzyga,
    czy stan startu jest ten sam.

    Odnotowuję, że skutek pojawia się przy kolejnym starcie, a nie od
    razu. Jest to zmiana w ustaleniach rozruchu, a te obowiązują od
    następnego uruchomienia maszyny.

    Miejsce, w którym bywa odczuwalna, to maszyna z wyłączonym bezpiecznym
    rozruchem. Ustawienie nie ma wtedy na czym się oprzeć i sprawdzanie
    wraca do zachowania domyślnego. Nie jest to awaria, ale punkt
    przestaje wnosić cokolwiek.

    Na maszynie z włączonym bezpiecznym rozruchem zmiana bywa
    korzystna także dla pracy: aktualizacja składników rozruchu przestaje
    wymagać przebudowania listy pomiarów, więc spada liczba przypadków,
    w których maszyna prosi o klucz odzyskiwania po aktualizacji.

    Czego to nie psuje: startu maszyny, logowania, dostępu do plików,
    wydajności, udziałów plikowych, drukowania.
  en: |
    The class is "no disruption".

    The change touches neither the enciphering nor the manner of unlocking the disk. It changes only what the
    hardware module settles by, in judging whether the state of the start is the same.

    I set down that the consequence comes at the next start and not at once. It is a change in the settlings of
    the start, and those hold from the machine's next running.

    The place at which it is at times felt is a machine with secure boot switched off. The setting has then
    nothing to rest upon and the checking falls back to its default behaviour. It is no fault, but the item ceases
    to bring anything.

    Upon a machine with secure boot switched on the change is at times a good one for the work as well: an update
    of the start's parts ceases to call for the list of measurements to be built again, so the number of cases in
    which the machine asks for the key of recovery after an update falls.

    What this does not break: the machine's start, logging on, the way to files, speed, file shares, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
  what_breaks:
    pl:
      - Na maszynie z wyłączonym bezpiecznym rozruchem ustawienie nie ma na czym się oprzeć i nie wnosi niczego
      - Skutek pojawia się przy kolejnym starcie maszyny, a nie od razu po zapisaniu wartości
      - Aktualizacja składników rozruchu przestaje wymagać przebudowania listy pomiarów
      - Spada przez to liczba przypadków, w których maszyna prosi o klucz odzyskiwania po aktualizacji
      - Start maszyny, logowanie, dostęp do plików, wydajność, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Upon a machine with secure boot switched off the setting has nothing to rest upon and brings nothing
      - The consequence comes at the machine s next start and not at once upon the writing of the value
      - An update of the start s parts ceases to call for the list of measurements to be built again
      - The number of cases in which the machine asks for the key of recovery after an update falls by that
      - The machine s start, logging on, the way to files, speed, file shares and printing stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna ma wyłączony bezpieczny rozruch i ustawienie nie ma się na czym oprzeć
    en:
      - The machine has secure boot switched off and the setting has nothing to rest upon
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'OSAllowSecureBootForIntegrity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'OSAllowSecureBootForIntegrity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The check of the start is tied to secure boot instead of to a list of
    # measurements written by hand, which is both stricter and easier to keep up.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'OSAllowSecureBootForIntegrity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną bez uciążliwości. Warto, żeby
    aplikacja umieściła ją wysoko wśród punktów o szyfrowaniu, bo
    pozostałe wymagają planu, a ta jest jednym wpisem bez skutków
    w codziennej pracy.

    Argument wart zachowania dotyczy zakresu porównania. Ochrona modułu
    sprzętowego jest tak szeroka, jak lista tego, co porównuje. Lista
    ułożona ręcznie jest zawsze niepełna, bo trzeba ją utrzymywać —
    a oparcie sprawdzenia na bezpiecznym rozruchu zdejmuje ten obowiązek
    i zarazem rozszerza zakres.

    Odnotowuję skutek dla pracy, bo jest tu rzadkim przypadkiem zbieżności
    interesów. Reguła zaostrzająca sprawdzanie zmniejsza zarazem liczbę
    próśb o klucz odzyskiwania po aktualizacji — czyli zmniejsza
    obciążenie obsługi, zamiast je zwiększać.
  en: |
    The rule closes the block and is the only one in it without disruption. It is well that the application set it
    high among the items about enciphering, the rest calling for a plan while this is one entry with no
    consequences in daily work.

    The argument worth keeping touches the reach of the setting against. The hardware module's guarding is as wide
    as the list of what it sets against. A list laid out by hand is always short of whole, having to be kept up -
    and the resting of the check upon secure boot takes that duty away and widens the reach at the same time.

    I set down the consequence for the work, it being here a rare meeting of interests. A rule that sharpens the
    checking lessens at the same time the number of askings for the key of recovery after an update - which is to
    say it lessens the support's burden instead of raising it.
