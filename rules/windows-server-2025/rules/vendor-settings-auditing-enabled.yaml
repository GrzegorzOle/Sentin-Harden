    Kategoria niska powiedziana wprost, zamiast podnoszonej dla powagi: ta
    reguła niczego nie blokuje i nie odbiera napastnikowi żadnej
    możliwości.

    Wartość jest inna i nie jest żadna. Kanał, którym przychodzą ustawienia
    spoza procedury zmian organizacji, jest miejscem, w którym zapis ma sens
    największy, bo zmiana stamtąd nie zostawia po sobie nic innego.

    Punkt ma sens także wtedy, gdy pobieranie zostało wyłączone — zapis
