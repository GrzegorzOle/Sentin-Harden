id: win2025-vbs-memory-attributes-table-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Tablica atrybutów pamięci oprogramowania układowego wymagana
    en: The firmware memory attributes table required
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby oprogramowanie układowe udostępniało tablicę
    opisującą, które obszary pamięci są wykonywalne, a które zapisywalne.
    Bez tej tablicy system nie ma podstawy, żeby narzucić rozdział
    między jednym a drugim w obszarach należących do oprogramowania
    układowego.

    Zostawiam kategorię wysoką. Rzecz sprowadza się do starej zasady:
    pamięć, do której wolno pisać, nie powinna być pamięcią, z której
    wolno wykonywać. Gdy ten rozdział nie obowiązuje, obszar zapisany
    przez kogoś staje się obszarem wykonywanym przez procesor — a to
    jest najkrótsza droga od błędu do wykonania cudzego kodu.

    Na serwerze waży to dodatkowo z powodu, który nie dotyczy stacji
    roboczych: obszary należące do oprogramowania układowego są na
    serwerze liczniejsze i bogatsze, bo maszyna ma rozbudowaną obsługę
    sprzętu — kontrolery pamięci masowej, karty zarządzania,
    monitorowanie stanu podzespołów. Każdy z tych elementów wnosi własny
    kod do warstwy, o której mowa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obszary
    pamięci oprogramowania układowego, w których zapis i wykonanie nie
    są rozdzielone — czyli miejsce, gdzie własny kod umieszcza się niżej,
    niż sięga cokolwiek w systemie.
  en: |
    The item asks that the firmware give forth a board telling which fields of memory may be run from
    and which written into. Without that board the system has no ground whereon to lay the sundering
    between the one and the other in the fields belonging to the firmware.

    I leave the category high. The thing comes down to an old rule - memory that may be written into
    ought not to be memory that may be run from. Where that sundering holds not, a field written by
    somebody becomes a field run by the reckoner's heart - and that is the shortest road from a slip to
    the running of another's code.

    Upon a server this weighs the more for a ground that touches workstations not - the fields
    belonging to the firmware are upon a server more and richer, the machine having a wide dealing with
    gear - rulers of the mass store, cards of ruling, the watching over of the state of the pieces. Each
    of those brings code of its own into the layer here spoken of.

    What an attacker gains while the item goes unmet - fields of the firmware's memory wherein the
    writing and the running are not sundered; that is, a stead wherein one sets one's own code lower
    than anything within the system reaches.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia", ale powód jest w tej
    grupie odmienny i warto go nazwać wprost, bo zmienia charakter pracy
    z tym punktem.

    Jest to jedyna reguła w tej grupie, której nie da się spełnić
    ustawieniem czegokolwiek w systemie. Albo oprogramowanie układowe tę
    tablicę udostępnia, albo nie. Jeżeli nie — a na serwerach starszych
    oraz takich, których firmware nie był uaktualniany od wdrożenia,
    zdarza się to często — jedyną drogą jest uaktualnienie oprogramowania
    układowego.

    Uaktualnienie firmware serwera nie jest czynnością administracyjną.
    Wymaga narzędzi producenta, bywa zależne od ważnej umowy
    serwisowej, przechodzi przez pełne zamknięcie maszyny, a w razie
    niepowodzenia zostawia sprzęt, który nie startuje i którego nie
    naprawi się zdalnie. Jest to więc zmiana o własnym ryzyku, większym
    niż ryzyko punktu, który ją wymusił.

    Dlatego praktyczne postępowanie wygląda tak: jeżeli po włączeniu tego
    wymagania warstwa wirtualizacji przestaje się uruchamiać, znaczy to,
    że platforma tablicy nie udostępnia. Właściwym wynikiem jest wtedy
    zapisany wyjątek z uzasadnieniem i datą przeglądu wyznaczoną na
    najbliższe planowane uaktualnienie firmware albo na wymianę maszyny.
    Na sprzęcie poza wsparciem producenta może to być wyjątek trwający
    do końca życia tej maszyny — i jest to uczciwy wynik pracy
    z aplikacją, a nie porażka.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I leave the class "needs a witting rolling out", but the ground is in that band another and is
    worth naming outright, it altering the kind of work with that item.

    It is the one rule of that band that may not be met by the setting of anything within the system.
    Either the firmware gives that board forth or it does not. If it does not - and upon older servers,
    and upon such whose firmware was not made anew since the rolling out, it befalls often - the only
    road is the making anew of the firmware.

    The making anew of a server's firmware is no doing of ruling. It takes the maker's tools, it hangs
    at times upon a standing writ of service, it goes through a full shutting down of the machine, and
    at a failing it leaves gear that starts not and that will not be mended from afar. It is therefore
    a change with a hazard of its own, greater than the hazard of the item that forced it.

    Therefore the doing in practice looks thus - if after the switching on of that demand the layer of
    unbodying stops starting, that means the standing-ground gives the board not forth. The right
    outcome is then a written-down exception with a standing by it and a day of looking over set to the
    nearest planned making anew of the firmware or to the swapping of the machine. Upon gear beyond the
    maker's bearing it may be an exception lasting until the end of that machine's life - and it is an
    honest outcome of the work with the application and no failure.

    The change binds after a starting anew and is undone after a further one.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Tam, gdzie oprogramowanie układowe tablicy nie udostępnia, warstwa wirtualizacji przestaje się uruchamiać
      - Punktu nie da się spełnić ustawieniem czegokolwiek w systemie, bo wymaganie dotyczy oprogramowania układowego
      - Jedyną drogą jest uaktualnienie firmware, które ma własne ryzyko, większe niż ryzyko tego punktu
      - Uaktualnienie firmware wymaga narzędzi producenta, pełnego zamknięcia maszyny i nie naprawia się zdalnie po niepowodzeniu
      - Na sprzęcie poza wsparciem producenta właściwym wynikiem bywa wyjątek trwający do końca życia maszyny
    en:
      - Where the firmware gives that board not forth, the layer of unbodying stops starting
      - The item may not be met by the setting of anything within the system, the demand bearing upon the firmware
      - The only road is the making anew of the firmware, which has a hazard of its own, greater than the hazard of that item
      - The making anew of firmware takes the maker's tools and a full shutting down, and at a failing is not mended from afar
      - Upon gear beyond the maker's bearing the right outcome is at times an exception lasting until the end of the machine's life
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie układowe maszyny nie udostępnia tej tablicy, a jego uaktualnienie nie jest zaplanowane
      - Maszyna jest poza wsparciem producenta i nie ma dla niej wydania oprogramowania układowego spełniającego wymaganie
    en:
      - The firmware of the machine gives that board not forth and its making anew is not planned
      - The machine is beyond the maker's bearing and there is for it no make of firmware meeting the demand
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'HVCIMATRequired'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    $name = 'HVCIMATRequired'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The one item here that cannot be satisfied from inside Windows: either
    # the firmware publishes the table or it does not. Where it does not, the
    # virtualisation layer stops starting and the answer is a firmware update -
    # or a recorded exception with a review date.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'HVCIMATRequired' -Value 1 -Type DWord
    # The setting binds after a restart of the machine.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Stara zasada: pamięć, do której wolno pisać, nie powinna być
    pamięcią, z której wolno wykonywać. Bez tej tablicy rozdział nie
    obowiązuje w obszarach należących do oprogramowania układowego,
    a tych jest na serwerze więcej niż na stacji roboczej — kontrolery
    pamięci masowej, karty zarządzania, monitorowanie podzespołów.

    Jedyna reguła w tej grupie, której nie da się spełnić ustawieniem
    czegokolwiek w systemie. Albo firmware tablicę udostępnia, albo nie.

    Uaktualnienie firmware serwera to zmiana o własnym ryzyku, większym
    niż ryzyko punktu, który ją wymusił. Na sprzęcie poza wsparciem
    właściwym wynikiem bywa wyjątek trwający do końca życia maszyny —
    i jest to uczciwy wynik pracy, a nie porażka.
  en: |
    An old rule - memory that may be written into ought not to be memory that may be run from. Without
    that board the sundering holds not in the fields belonging to the firmware, and of those there are
    upon a server more than upon a workstation - rulers of the mass store, cards of ruling, the
    watching over of the pieces.

    The one rule of that band that may not be met by the setting of anything within the system. Either
    the firmware gives that board forth or it does not.

    The making anew of a server's firmware is a change with a hazard of its own, greater than the
    hazard of the item that forced it. Upon gear beyond bearing the right outcome is at times an
    exception lasting until the end of the machine's life - and it is an honest outcome of the work and
    no failure.
