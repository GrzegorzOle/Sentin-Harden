id: win2016-web-publishing-wizards-download-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Pobieranie listy usług zewnętrznych przez kreatory publikowania zablokowane
    en: The fetching of the list of outside services by publishing wizards blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje pobieranie z sieci listy usług zewnętrznych
    proponowanych przez kreatory publikowania plików i zamawiania
    odbitek.

    Punkt jest porządkowy i warto to powiedzieć na początku, zamiast
    dorabiać mu wagę. Pobierana jest lista nazw i adresów, a nie kod.
    Kliknięcie w pozycję z listy i tak wymaga decyzji człowieka.

    Wartość reguły sprowadza się do dwóch rzeczy. Pierwsza: o jedno
    połączenie wychodzące mniej, którego nikt nie zamawiał, a które
    zestawia się przy otwarciu zwykłego okna powłoki. Drugie: lista
    pochodzi spoza organizacji i o jej zawartości organizacja nie
    decyduje — jest to ten sam wzorzec co przy innych treściach
    podsuwanych, tylko w miejscu znacznie mniej odwiedzanym.

    Na serwerze kreatorów tych nie otwiera nikt, więc zmiana jest czystym
    zapisem decyzji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — wartość reguły leży w usunięciu połączenia
    wychodzącego, którego nikt nie zamawiał.
  en: |
    The setting blocks the fetching from the network of the list of outside services proposed by the wizards for
    publishing files and ordering prints.

    The item is one of order and that is worth saying at the outset rather than getting up a weight for it. What is
    fetched is a list of names and addresses, not code. A clicking on an entry from the list calls for a person's
    decision anyway.

    The rule's value comes to two things. The first: one outbound connection fewer that nobody ordered and that is
    set up at the opening of an ordinary shell window. The second: the list comes from outside the organisation and
    the organisation does not decide its content - it is the same pattern as at the other content pushed forward,
    only in a place far less visited.

    On a server nobody opens those wizards, so the change is a pure record of a decision.

    What an attacker gains while the item goes unmet: nothing directly - the rule's value lies in the removal of an
    outbound connection nobody ordered.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Kreatory publikowania i zamawiania odbitek nadal się otwierają. Lista
    proponowanych usług jest po prostu pusta.

    Na serwerze nie zauważy tego nikt, bo kreatorów tych nikt nie otwiera.

    Nie ma znanych regresji.

    Czego to nie psuje: kopiowania plików, udziałów sieciowych, drukowania,
    drukarek sieciowych, powłoki, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The wizards for publishing and for ordering prints still open. The list of proposed services is simply empty.

    On a server nobody will notice it, nobody opening those wizards.

    There are no known regressions.

    What this does not break: the copying of files, network shares, printing, network printers, the shell, services,
    or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - printing
  what_breaks:
    pl:
      - Lista usług zewnętrznych w kreatorze publikowania i zamawiania odbitek pozostaje pusta
      - Same kreatory nadal się otwierają, więc droga nie znika, tylko nie ma czego z niej wybrać
      - Kopiowanie plików, udziały sieciowe, drukowanie i drukarki sieciowe pozostają bez zmian
      - Powłoka, usługi systemowe i aplikacje serwerowe pozostają bez zmian
    en:
      - The list of outside services in the wizard for publishing and ordering prints stays empty
      - The wizards themselves still open, so the road does not go, only there is nothing to choose from it
      - The copying of files, network shares, printing and network printers stay unchanged
      - The shell, system services and server applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Publikowanie plików przez usługę wybieraną z tej listy jest na tej maszynie przyjętą drogą pracy
    en:
      - The publishing of files through a service chosen from that list is on this machine an accepted way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry lies in the shell branch, not with the other items from the
      # internet communication section.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'NoWebServices'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoWebServices'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wizards still open - their list is simply empty. What is fetched is a
    # list of names and addresses, not code.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoWebServices' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/jj592685(v=ws.11)

notes:
  pl: |
    Punkt zamyka blok i jest w nim najlżejszy. Warto go pokazywać na
    końcu i opisywać skromnie, bo skromny jest.

    Rzecz warta odnotowania dotyczy położenia wpisu. Punkt należy do
    sekcji o komunikacji z internetem, a wartość siedzi w gałęzi powłoki,
    razem z ustawieniami o zupełnie innym przeznaczeniu. Warto to
    powiedzieć w komentarzu audytu, bo przy ręcznym szukaniu prowadzi to
    do wniosku, że ustawienia nie ma.

    Argument wart zachowania jest ten sam co przy pozostałych regułach
    bloku, tylko słabszy: kanał działa sam, treść pochodzi spoza
    organizacji, a nikt tego nie zamawiał. Blok warto zamknąć tą regułą
    właśnie dlatego, że pokazuje wzorzec w postaci najsłabszej — i przez
    to najłatwiejszej do rozpoznania w innych miejscach.

    Kategoria niska oddaje to właściwie. Podnoszenie jej byłoby
    nadużyciem, a opisywanie tego punktu jako obrony przed czymkolwiek
    osłabiłoby wiarygodność całego zestawu.
  en: |
    The item shuts the block and is the lightest in it. It is worth showing at the end and describing modestly, modest
    being what it is.

    Worth noting a matter touching the entry's place. The item belongs to the section about communication with the
    internet, and the value sits in the shell branch, along with settings of a wholly different purpose. That is worth
    saying in the audit's comment, at a searching by hand leading as it does to the conclusion that the setting is not
    there.

    The argument worth keeping is the same as at the block's other rules, only weaker: the channel works of itself, the
    content comes from outside the organisation, and nobody ordered it. The block is worth shutting with this rule for
    just that reason - it shows the pattern in its weakest shape, and thereby the easiest to recognise elsewhere.

    The low category renders that rightly. A raising of it would be an abuse, and describing this item as a defence
    against anything would weaken the whole set's credit.
