id: win11-font-providers-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Fonts
  title:
    pl: Pobieranie czcionek z sieci wyłączone
    en: Fetching fonts from the network switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    System potrafi dociągnąć brakującą czcionkę z usługi w sieci, kiedy dokument
    albo strona odwołuje się do kroju, którego na maszynie nie ma. Dzieje się to
    samo, w tle i bez pytania.

    Znaczenie ma to, czym czcionka jest dla systemu. Nie jest obrazkiem — jest
    programem opisującym kształty, a jego przetwarzanie odbywa się w kodzie
    blisko jądra i historycznie bywało źródłem błędów pozwalających wykonać
    dowolny kod. Mechanizm dociągający pliki tego rodzaju na podstawie tego,
    o co poprosił otwarty dokument, jest więc powierzchnią wartą zamknięcia,
    nawet jeśli samo źródło jest zaufane.

    Drugi skutek dotyczy tego, co maszyna wypuszcza na zewnątrz: każde takie
    zapytanie jest połączeniem nawiązanym z powodu treści otwartego dokumentu.
    Wyłączenie mechanizmu usuwa obie rzeczy naraz.
  en: |
    The system can fetch a missing font from a service on the network when a
    document or page refers to a face the machine does not have. This happens by
    itself, in the background and without asking.

    What matters is what a font is to the system. It is not a picture - it is a
    program describing shapes, and processing it happens in code close to the
    kernel, which has historically been a source of faults letting arbitrary code
    run. A mechanism fetching files of that kind on the strength of what an open
    document asked for is therefore a surface worth closing, even if the source
    itself is trusted.

    The second effect concerns what the machine lets out: every such query is a
    connection made because of the content of an open document. Switching the
    mechanism off removes both things at once.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na stanowiskach otwiera się dokumenty składane
    krojami spoza zestawu zainstalowanego w systemie.

    Skutek jest wyłącznie wizualny i nie blokuje niczego. Dokument odwołujący się
    do nieobecnego kroju zostanie złożony krojem zastępczym — tekst pozostaje
    czytelny, ale łamanie wierszy i szerokość kolumn potrafią się przesunąć.
    Dla materiałów, w których układ ma znaczenie — umów drukowanych z szablonu,
    materiałów firmowych, dokumentów składanych do wydruku — jest to różnica
    widoczna.

    Objawem jest dokument wyglądający inaczej niż u nadawcy, a nie komunikat
    o błędzie. Tym trudniej powiązać go z przyczyną, więc warto wiedzieć, że ten
    punkt jest wdrożony.

    Lekarstwem jest zainstalowanie potrzebnych krojów na stanowiskach zamiast
    polegania na dociąganiu ich z sieci.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    What needs checking is whether documents set in faces outside the set installed
    on the system are opened at the stations.

    The effect is purely visual and blocks nothing. A document referring to an
    absent face will be set in a substitute - the text stays readable, but line
    breaks and column widths can shift. For material where layout matters -
    contracts printed from a template, company material, documents set for print -
    that is a visible difference.

    The symptom is a document looking different from how it did at the sender's, not
    an error message. That makes it the harder to tie to its cause, so it is worth
    knowing this item has been applied.

    The remedy is installing the faces needed at the stations rather than relying on
    fetching them from the network.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - user-interface
    - printing
  what_breaks:
    pl:
      - Dokumenty odwołujące się do krojów nieobecnych w systemie zostaną złożone krojem zastępczym
      - Układ materiałów, w których szerokość kolumn i łamanie wierszy mają znaczenie, może się przesunąć
      - Wydruk z szablonu firmowego może wyglądać inaczej niż u nadawcy dokumentu
    en:
      - Documents referring to faces absent from the system are set in a substitute
      - The layout of material where column widths and line breaks matter may shift
      - A printout from a company template may look different from how it did at the sender's
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko składa materiały graficzne albo drukarskie i opiera się na krojach dociąganych na żądanie
    en:
      - The station sets graphic or print material and relies on faces fetched on demand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnableFontProviders'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnableFontProviders'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFontProviders' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-grouppolicy

notes:
  pl: |
    Punkt nie usuwa żadnej czcionki i nie zmienia sposobu składania tekstu
    krojami już obecnymi w systemie. Dotyczy wyłącznie dociągania tych, których
    nie ma.

    Wpis leży w gałęzi zasad wspólnej z kilkoma innymi punktami. Usunięcie całej
    gałęzi przy wycofywaniu zmiany zdjęłoby przy okazji tamte ustawienia, dlatego
    polecenie wycofania zdejmuje pojedynczą wartość i usuwa gałąź wyłącznie
    wtedy, gdy przed zmianą jej nie było.
  en: |
    The item removes no font and does not change how text is set in faces already
    present on the system. It concerns only fetching those that are not.

    The entry sits in a policy key shared with several other items. Removing the
    whole key when undoing the change would take those settings down with it, which
    is why the rollback command lifts a single value and removes the key only if it
    was not there before the change.
