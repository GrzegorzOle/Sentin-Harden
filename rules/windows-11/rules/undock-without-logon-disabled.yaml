id: win11-undock-without-logon-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wysunięcie maszyny ze stacji dokującej bez zalogowania zablokowane
    en: Releasing the machine from its dock without signing in blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Komputer przenośny wpięty w stację dokującą da się z niej wysunąć poleceniem
    systemu, bez ruszania zatrzasku. Domyślnie polecenie to jest dostępne
    również z ekranu logowania — czyli dla kogoś, kto nie podał żadnych
    poświadczeń.

    Skutek jest prosty: maszyna zablokowana, stojąca w biurze, może zostać
    wyjęta przez dowolną osobę przechodzącą obok, a wyjęcie wygląda na
    czynność zwyczajną. Nie ma alarmu, nie ma śladu, nie ma nawet zerwanego
    zatrzasku, który zwróciłby czyjąś uwagę.

    Punktu nie należy przeceniać i trzeba to powiedzieć wprost: stacja dokująca
    ma zwykle zwolnienie mechaniczne, a komputer da się wyjąć siłą. To jednak
    jest widoczne, a wyjęcie poleceniem systemu nie. Punkt zamyka drogę
    wygodną i cichą, zostawiając tę, która wymaga zachowania rzucającego się
    w oczy.

    Wartość praktyczna zależy więc od miejsca. W biurze otwartym dla
    odwiedzających, w recepcji i na sali konferencyjnej jest realna; w pokoju
    zamkniętym na klucz — żadna.
  en: |
    A portable computer set in a dock can be released from it by a system command,
    without touching the catch. By default that command is available from the sign-in
    screen as well - that is, to somebody who has given no credentials.

    The effect is simple: a locked machine standing in an office can be taken out by
    anybody walking past, and the taking looks like an ordinary act. There is no
    alarm, no trace, not even a broken catch to draw anyone's attention.

    The item should not be overrated and this is worth saying outright: a dock usually
    has a mechanical release, and a computer can be taken out by force. That, however,
    is visible, and taking it out by a system command is not. The item closes the
    convenient, quiet route and leaves the one that takes behaviour which stands out.

    Its practical worth therefore depends on the place. In an office open to visitors,
    at a reception desk and in a meeting room it is real; in a room locked with a key
    - none.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ludzie korzystają ze stacji dokujących i czy
    wysuwają z nich maszyny przy zablokowanym ekranie.

    Po wdrożeniu polecenie wysunięcia znika z ekranu logowania. Żeby wyjąć
    maszynę bez użycia zatrzasku, trzeba się najpierw zalogować. Dla osoby,
    która po prostu zabiera swój komputer na spotkanie, jest to jeden krok
    więcej — drobny, ale wykonywany kilka razy dziennie.

    Drugi skutek dotyczy sprzętu współdzielonego. Na stanowisku, z którego
    korzysta kilka osób, wyjęcie maszyny przez kogoś, kto akurat nie ma na niej
    konta, przestanie być możliwe inaczej niż zatrzaskiem.

    Na sprzęcie nowszym zmiana bywa bez znaczenia. Stacje dokujące podłączane
    jednym przewodem nie mają wysuwania sterowanego przez system — maszynę
    odłącza się przez wyjęcie wtyczki, a tego żadne ustawienie nie obejmuje.
    Punkt dotyczy więc przede wszystkim sprzętu ze stacją mechaniczną.

    Nie ma restartu.
  en: |
    What needs checking is whether people use docks and whether they release machines
    from them with the screen locked.

    After the rollout the release command disappears from the sign-in screen. To take
    a machine out without using the catch one has to sign in first. For somebody
    simply taking their computer to a meeting that is one step more - a small one, but
    taken several times a day.

    The second effect concerns shared equipment. At a station used by several people,
    taking the machine out by somebody who happens to have no account on it stops
    being possible other than by the catch.

    On newer equipment the change can be of no consequence. Docks attached by a single
    cable have no release driven by the system - the machine is detached by pulling
    the plug, and no setting covers that. So the item concerns equipment with a
    mechanical dock above all.

    There is no restart.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Polecenie wysunięcia maszyny znika z ekranu logowania
      - Zabranie komputera ze stacji dokującej wymaga wcześniejszego zalogowania
      - Na sprzęcie współdzielonym wyjęcie maszyny przez osobę bez konta wymaga użycia zatrzasku
      - Stacje podłączane jednym przewodem pozostają bez zmian
    en:
      - The release command disappears from the sign-in screen
      - Taking a computer out of its dock takes signing in first
      - On shared equipment, taking the machine out by a person without an account takes using the catch
      - Docks attached by a single cable stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko jest współdzielone, a maszynę wyjmują osoby bez konta na niej
      - Zatrzask stacji dokującej jest uszkodzony i wysunięcie poleceniem jest jedyną drogą
    en:
      - The station is shared and the machine is taken out by people with no account on it
      - The dock's catch is broken and the command is the only way of releasing it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'UndockWithoutLogon'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'UndockWithoutLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'UndockWithoutLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/devices-allow-undock-without-having-to-log-on

notes:
  pl: |
    Punkt jest jednym z nielicznych w tej paczce, których wartość zależy nie od
    konfiguracji maszyny, tylko od tego, gdzie ona stoi. Na stanowisku
    stacjonarnym bez stacji dokującej jest zgodnością bez żadnego skutku —
    i tak też należy go czytać, zamiast szukać w nim zysku, którego tam nie ma.

    Ustawienie nie obejmuje odłączenia fizycznego. Wyjęcie maszyny zatrzaskiem,
    wyciągnięcie przewodu albo zabranie całej stacji razem z komputerem działa
    tak samo jak przed wdrożeniem.

    Wartość wpisu jest odwrotna do tego, co sugeruje jego nazwa: zero blokuje
    wysuwanie bez zalogowania, jedynka je dopuszcza. Przy sprawdzaniu ręcznym
    łatwo o pomyłkę w tę stronę.

    Gałąź zasad systemowych jest wspólna z kilkudziesięcioma innymi
    ustawieniami, więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The item is one of the few in this pack whose worth depends not on the machine's
    configuration but on where it stands. At a stationary station with no dock it is
    compliance with no effect at all - and that is how it should be read, rather than
    looking in it for a gain that is not there.

    The setting does not cover physical detaching. Taking the machine out by the
    catch, pulling the cable or carrying off the whole dock along with the computer
    works just as it did before.

    The entry's value runs opposite to what its name suggests: zero blocks releasing
    without signing in, one admits it. When checking by hand a slip in that direction
    is easy.

    The system policies key is shared with several dozen other settings, so rollback
    removes the entry alone.
