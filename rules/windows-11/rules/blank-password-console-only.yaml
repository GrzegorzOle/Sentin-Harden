id: win11-blank-password-console-only

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta lokalne z pustym hasłem tylko przy konsoli
    en: Local accounts with a blank password only at the console
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Konto lokalne z pustym hasłem wygląda na problem, który rozwiązuje się przez
    nadanie hasła — i tak jest. Zanim jednak ktokolwiek te konta odnajdzie, warto
    zamknąć drogę, którą da się z nich skorzystać zdalnie.

    Ten punkt sprawia, że konto bez hasła działa wyłącznie przy fizycznej
    konsoli maszyny. Przestaje działać przez sieć: przy udziałach plikowych,
    przy zdalnym zarządzaniu, przy pulpicie zdalnym i przy każdej innej drodze,
    która sprowadza się do podania nazwy konta i hasła przez sieć.

    Zamyka to jedną z najtańszych metod wejścia, jakie istnieją. Napastnik
    w sieci lokalnej nie musi niczego łamać ani zgadywać — wystarczy, że
    odnajdzie konto, przy którym ktoś kiedyś pominął hasło. Konta takie powstają
    nieumyślnie: przy zakładaniu konta serwisowego „na chwilę", przy resetach
    i przy kontach domyślnych zostawionych przez instalatory.
  en: |
    A local account with a blank password looks like a problem solved by giving it
    a password - and so it is. Before anybody finds those accounts, though, it is
    worth closing the road by which they can be used remotely.

    This item makes an account with no password work only at the machine's
    physical console. It stops working over the network: at file shares, at remote
    management, at remote desktop, and at every other road that comes down to
    supplying an account name and password across the network.

    That closes one of the cheapest ways in that exist. An attacker on the local
    network need break nothing and guess nothing - it is enough to find an account
    where somebody once skipped the password. Such accounts arise unintentionally:
    while setting up a service account "for a moment", during resets, and among
    default accounts left behind by installers.

disruption_description:
  pl: |
    Nic nie przestaje działać na maszynie, na której konta mają hasła. Punkt
    dotyczy wyłącznie kont z hasłem pustym, a takich nie powinno być.

    Tam, gdzie takie konto istnieje i jest używane przez sieć, przestanie ono
    działać. W praktyce spotyka się to przy prostym udostępnianiu plików
    w małych sieciach, gdzie „konto bez hasła" pełni rolę udostępnienia dla
    wszystkich, oraz przy urządzeniach — skanerach, drukarkach wielofunkcyjnych,
    rejestratorach — odkładających pliki na stanowisko przez konto założone
    naprędce.

    Rozwiązaniem jest nadanie takiemu kontu hasła, a nie cofnięcie tego punktu.
    Ustawienie to jest zachowaniem domyślnym systemu i cofnięcie go stawia
    maszynę w stanie gorszym niż domyślny.

    Konta domenowe tego nie dotyczą — punkt mówi o kontach lokalnych maszyny.

    Nie ma restartu. Zmiana obowiązuje od razu.
  en: |
    Nothing stops working on a machine whose accounts have passwords. The item
    concerns only accounts with a blank password, and there should be none.

    Where such an account exists and is used over the network, it will stop
    working. In practice this turns up in simple file sharing on small networks,
    where "an account with no password" serves as a share for everybody, and with
    devices - scanners, multifunction printers, recorders - dropping files onto a
    station through an account set up in haste.

    The answer is to give such an account a password, not to undo this item. The
    setting is the system's default behaviour, and undoing it puts the machine in
    a state worse than the default.

    Domain accounts are not affected - the item speaks of the machine's local
    accounts.

    There is no restart. The change takes effect at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - remote-desktop
  what_breaks:
    pl:
      - Konta lokalne bez hasła przestaną działać przez sieć, w tym przy udziałach plikowych i pulpicie zdalnym
      - Urządzenia odkładające pliki na stanowisko przez konto bez hasła stracą do niego dostęp
    en:
      - Local accounts with no password stop working over the network, including at file shares and remote desktop
      - Devices dropping files onto the station through an account with no password lose access to it
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków - konto lokalne bez hasła używane przez sieć wymaga nadania hasła, a nie cofnięcia tego punktu
    en:
      - No known cases - a local account with no password used over the network needs a password given to it, not this item undone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'LimitBlankPasswordUse'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'LimitBlankPasswordUse'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitBlankPasswordUse' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-limit-local-account-use-of-blank-passwords-to-console-logon-only

notes:
  pl: |
    Reguła sprawdza ograniczenie, a nie obecność kont z pustym hasłem. Wynik
    „spełniony" nie znaczy, że takich kont nie ma — znaczy, że nie da się ich
    użyć przez sieć. Wyszukanie samych kont jest osobną czynnością i nie należy
    zieleni w tym punkcie czytać jako potwierdzenia, że wszystkie konta lokalne
    mają hasła.

    Ograniczenie działa na drodze sieciowej, nie na samym haśle. Konto bez hasła
    pozostaje kontem bez hasła i przy konsoli maszyny zaloguje się bez pytania.
  en: |
    The rule checks the restriction, not the presence of accounts with a blank
    password. A result of "met" does not mean there are no such accounts - it means
    they cannot be used over the network. Finding the accounts themselves is a
    separate task, and green here should not be read as confirmation that all local
    accounts have passwords.

    The restriction works on the network road, not on the password itself. An
    account with no password remains an account with no password and will sign in
    at the machine's console without being asked.
