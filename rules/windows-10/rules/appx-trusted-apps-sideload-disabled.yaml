id: win10-appx-trusted-apps-sideload-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji z pominięciem sklepu wyłączone
    en: The laying on of packages of applications past the store switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość zainstalowania pakietu aplikacji z pliku,
    poza drogą przez sklep systemowy.

    Sklep nie jest wyłącznie miejscem pobierania. Jest miejscem, w którym
    pakiet przeszedł przegląd, ma wskazanego wydawcę i ma historię wydań.
    Pakiet wzięty z pliku nie ma żadnej z tych rzeczy — ma wyłącznie
    podpis, który wystarczy, żeby system go przyjął.

    Zagrożenie polega na tym, że podpis da się zdobyć. Certyfikat
    podpisujący kosztuje niewiele i bywa wystawiany na nazwę myląco
    podobną do znanej. Po podpisaniu pakiet instaluje się bez ostrzeżenia,
    a użytkownik nie ma jak odróżnić go od pakietu ze sklepu.

    Drugim skutkiem jest to, że instalacja z pliku nie zostawia śladu
    w tym samym miejscu co instalacja ze sklepu. Spis oprogramowania
    prowadzony po stronie organizacji przestaje być pełny.

    Odnotowuję, że punkt nie dotyczy pakietów wdrażanych przez
    administratora narzędziem zarządzania. Ta droga zostaje otwarta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    podpisanego pakietu z pliku, bez przeglądu i bez wydawcy do sprawdzenia.
  en: |
    The setting takes away the power of laying on a package of an application out of a file, past the road through
    the system's store.

    The store is not solely a place of drawing. It is a place where a package went through a review, has a named
    issuer and has a history of issues. A package taken from a file has none of those things - it has only a
    signature, and that suffices for the system to take it.

    The danger lies in this, that a signature may be got. A certificate of signing costs little and is at times
    made out upon a name misleadingly near a known one. Once signed, the package is laid on with no warning, and
    the user has no means of telling it from a package out of the store.

    The second upshot is that a laying on from a file leaves no trace in the same place as a laying on from the
    store. A setting down of software kept upon the body's side ceases to be full.

    I set down that the item touches not packages rolled out by an administrator with a tool of governing. That
    road stays open.

    What an attacker gains while the item goes unmet: the laying on of a signed package out of a file, with no
    review and no issuer to be looked into.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    w organizacji rozdaje się własne pakiety poza sklepem.

    Miejscem wartym uwagi są narzędzia wewnętrzne wydawane jako pakiety.
    Nie trafiają do sklepu, bo są przeznaczone dla jednej organizacji,
    i instalują się właśnie tą drogą. Po zmianie przestaną.

    Odnotowuję, że rozwiązaniem jest wdrażanie ich narzędziem zarządzania,
    a nie zniesienie punktu. Ta droga pozostaje otwarta i daje przy okazji
    ślad w spisie oprogramowania.

    Miejscem drugim są wersje robocze przekazywane do sprawdzenia przed
    wydaniem. Tam instalacja z pliku bywa jedyną drogą, a punkt ją
    zamyka — co na stanowisku testowym jest kosztem realnym.

    Skutek pojawia się natychmiast, bez restartu. Pakiety zainstalowane
    wcześniej działają dalej.

    Czego to nie psuje: sklepu systemowego, pakietów wdrażanych
    narzędziem zarządzania, pakietów już zainstalowanych, programów
    klasycznych, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether packages of one's own are handed out in
    the body past the store.

    The place worth notice is inner tools issued as packages. They come not to the store, being meant for one
    body, and are laid on by this very road. After the change they will cease to be.

    I set down that the answer is the rolling of them out with a tool of governing and no lifting of the item.
    That road stays open and gives besides a trace upon the setting down of software.

    The second place is working versions handed over to be looked at before an issue. There the laying on from a
    file is at times the one road, and the item shuts it - which upon a station of trial is a true cost.

    The consequence shows at once, with no restart. Packages laid on earlier work on.

    What this does not break: the system's store, packages rolled out with a tool of governing, packages already
    laid on, programs of the older make, logging on, or printing.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia wewnętrzne wydawane jako pakiety poza sklepem przestaną się instalować z pliku
      - Wersje robocze przekazywane do sprawdzenia przed wydaniem stracą jedyną drogę instalacji na stanowisku testowym
      - Rozwiązaniem jest wdrażanie takich pakietów narzędziem zarządzania, co zostawia ślad w spisie oprogramowania
      - Pakiety zainstalowane wcześniej działają dalej, a zmiana dotyczy instalacji następnych
      - Sklep systemowy, pakiety wdrażane centralnie, programy klasyczne, logowanie i drukowanie pozostają bez zmian
    en:
      - Inner tools issued as packages past the store will cease to be laid on from a file
      - Working versions handed over to be looked at before an issue will lose the one road of laying on upon a station of trial
      - The answer is the rolling out of such packages with a tool of governing, which leaves a trace upon the setting down of software
      - Packages laid on earlier work on, and the change touches those laid on afterwards
      - The system s store, packages rolled out from the middle, programs of the older make, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem testowym, na którym instaluje się wersje robocze pakietów przed wydaniem
      - Narzędzia wewnętrzne są rozdawane jako pliki pakietów i nie ma narzędzia zarządzania
    en:
      - The machine is a station of trial upon which working versions of packages are laid on before an issue
      - Inner tools are handed out as files of packages and there is no tool of governing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowAllTrustedApps'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowAllTrustedApps'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAllTrustedApps' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/sideload-apps-in-windows

notes:
  pl: |
    Reguła bywa mylona z punktem o instalowaniu przez użytkowników bez
    uprawnień i warto, żeby aplikacja rozdzieliła je wprost. Tamten pyta,
    kto instaluje. Ten pyta, skąd pakiet pochodzi. Wdrożenie jednego nie
    zastępuje drugiego.

    Argument wart postawienia wprost dotyczy podpisu. Podpis nie jest
    poręczeniem za treść — jest poręczeniem za tożsamość wydawcy, a ta
    bywa kupiona na nazwę podobną do znanej. Sklep dokłada przegląd
    i historię, czyli to, czego podpis nie daje.

    Odnotowuję, że droga przez narzędzie zarządzania pozostaje otwarta.
    Warto, żeby aplikacja to wymieniła, bo punkt wygląda na zamknięcie
    własnego oprogramowania, a zamyka wyłącznie instalację z pliku przez
    użytkownika.
  en: |
    The rule is at times taken for the item about laying on by users without rights, and it is well that the
    application part them outright. That one asks who lays on. This one asks whence the package comes. The rolling
    out of one stands not in the other's stead.

    The argument worth putting outright touches the signature. A signature is no warrant for the content - it is a
    warrant for the issuer's name, and that is at times bought upon a name near a known one. The store adds a
    review and a history, which is to say the very thing a signature does not give.

    I set down that the road through a tool of governing stays open. It is well that the application name that,
    the item otherwise looking like a shutting out of one's own software, while it shuts solely the laying on from
    a file by a user.
