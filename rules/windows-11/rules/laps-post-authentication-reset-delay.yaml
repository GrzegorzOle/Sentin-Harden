id: win11-laps-post-authentication-reset-delay

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Zwłoka przed sprzątaniem po użyciu hasła najwyżej osiem godzin
    en: Delay before clearing up after the password's use at most eight hours
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, ile godzin od zalogowania lokalnym administratorem
    maszyna czeka, zanim zmieni hasło i zamknie sesję.

    Punkt ma sens wyłącznie razem z regułą o samym sprzątaniu i jest jej
    drugą połową. Tamta mówi, że sprzątanie ma nastąpić; ta mówi, po jakim
    czasie — a bez tego zwłoka może być ustawiona tak długa, że sprzątanie
    przestaje cokolwiek znaczyć.

    Dwie wartości są tu szczególne i trzeba je rozróżnić. Zero nie oznacza
    natychmiast — oznacza, że zwłoki nie ma i mechanizm nie zadziała.
    Wartości powyżej ośmiu godzin rozciągają okno na cały dzień pracy
    i dłużej.

    Osiem godzin odpowiada długości jednej zmiany. Sens tego progu jest
    taki: hasło użyte podczas naprawy traci ważność najpóźniej wtedy, gdy
    kończy się dzień pracy osoby, która je odczytała.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dłuższe okno,
    w którym hasło już ujawnione jest jeszcze ważne. Reguła o sprzątaniu bez
    tej reguły daje poczucie zabezpieczenia, a nie zabezpieczenie.
  en: |
    The setting settles how many hours from a sign-in as the local administrator the
    machine waits before it changes the password and closes the session.

    The item makes sense only together with the rule about the clearing up itself and is
    its other half. That one says the clearing up is to happen; this one says after how
    long - and without it the delay can be set so long that the clearing up stops meaning
    anything.

    Two values are special here and have to be told apart. Zero does not mean at once - it
    means there is no delay and the mechanism will not act. Values above eight hours
    stretch the window over a whole working day and longer.

    Eight hours matches the length of one shift. The threshold's sense is this: a password
    used during a repair loses its validity at the latest when the working day of the
    person who read it ends.

    What an attacker gains while the item goes unmet: a longer window in which a password
    already disclosed is still valid. The rule about clearing up, without this rule, gives
    a feeling of safety rather than safety.

disruption_description:
  pl: |
    Sprawdzenia wymaga długość typowej sesji serwisowej na koncie lokalnego
    administratora.

    Przy ośmiu godzinach zmiana jest dla większości prac niewidoczna:
    naprawa zaczęta i skończona tego samego dnia mieści się w oknie.

    Skutek pojawia się przy pracach rozciągniętych na dobę i dłużej —
    instalacjach nocnych, migracjach, naprawach prowadzonych z przerwami.
    Tam sesja zostanie zamknięta w trakcie, a niezapisana praca przepadnie.

    Wartość zbyt krótka jest osobnym zagrożeniem i warto o tym wiedzieć
    przed zmianą: przy jednej godzinie technik traci sesję w środku pracy,
    a raport pokazuje punkt jako spełniony. Reguła dopuszcza wartości
    krótsze, ale nie zaleca ich — próg jest górny, nie docelowy.

    Zmiana nie wymaga restartu.
  en: |
    The length of a typical service session on the local administrator account needs
    checking.

    At eight hours the change is invisible for most work: a repair begun and finished the
    same day fits within the window.

    The effect appears with work stretched over a day and longer - night installations,
    migrations, repairs carried on with breaks. There the session will be closed midway and
    unsaved work will be lost.

    Too short a value is a threat of its own and it is worth knowing so before the change:
    at one hour a technician loses the session in the middle of work, and the report shows
    the item as met. The rule admits shorter values but does not advise them - the
    threshold is an upper bound rather than a target.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Prace rozciągnięte na dobę i dłużej tracą sesję lokalnego administratora w trakcie
      - Instalacje nocne prowadzone na tym koncie mogą zostać przerwane
      - Naprawa zaczęta i skończona tego samego dnia mieści się w oknie
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - Work stretched over a day and longer loses the local administrator session midway
      - Night installations carried on that account may be broken off
      - A repair begun and finished the same day fits within the window
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedury serwisowe wymagają sesji lokalnego administratora dłuższej niż jedna zmiana
    en:
      - Service procedures take a local administrator session longer than one shift
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is counted in hours. Zero means no delay at all, and with it
      # the clearing up does not happen - so zero is not a compliant state.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PostAuthenticationResetDelay'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[1-8]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PostAuthenticationResetDelay' -ErrorAction SilentlyContinue).'PostAuthenticationResetDelay'
    [pscustomobject]@{
      path        = $path
      name        = 'PostAuthenticationResetDelay'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Eight is the upper bound the item takes and matches one shift.
    Set-ItemProperty -Path $path -Name 'PostAuthenticationResetDelay' -Value 8 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Zero nie jest wartością najostrzejszą, tylko wyłączeniem mechanizmu,
    i jest to najczęstsza pomyłka przy tym ustawieniu. Dlatego stan zgodny
    opisany jest przedziałem od jednej do ośmiu godzin, a nie progiem
    górnym.

    Reguła domyka parę z tą, która ustala samo sprzątanie po użyciu hasła.
    Osobno żadna z nich nie daje pełnego skutku: tamta bez tej pozwala
    odsunąć sprzątanie dowolnie daleko, ta bez tamtej nie ma czego opóźniać.

    Wszystkie ustawienia tego mechanizmu leżą w jednym kluczu.

    Brak wartości nie jest stanem zgodnym, bo bez niej zwłoka nie jest
    określona.
  en: |
    Zero is not the sharpest value but a switching off of the mechanism, and that is the
    commonest mistake with this setting. Hence the compliant state is described by a range
    from one to eight hours rather than by an upper threshold.

    The rule closes the pair with the one fixing the clearing up after the password's use
    itself. Apart, neither gives the full effect: that one without this lets the clearing
    up be pushed arbitrarily far, this one without that has nothing to delay.

    All the settings of that mechanism lie in one key.

    A missing value is not a compliant state, since without it the delay is not fixed.
