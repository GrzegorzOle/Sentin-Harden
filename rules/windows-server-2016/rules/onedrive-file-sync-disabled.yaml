id: win2016-onedrive-file-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > OneDrive
  title:
    pl: Synchronizacja plików z magazynem w chmurze wyłączona
    en: The synchronising of files with cloud storage switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza synchronizację plików między maszyną a magazynem
    w chmurze.

    Rzecz, która czyni ten mechanizm poważnym, polega na tym, że nie
    wymaga on żadnej decyzji o wysłaniu. Wystarczy zapisać plik
    w katalogu objętym synchronizacją — i plik jest już poza maszyną.
    Nikt niczego nie wysyłał, nikt nie klikał „wyślij", a dane wyszły.

    Druga rzecz jest jeszcze ważniejsza i bywa pomijana: mechanizm działa
    w obie strony. Kto zdobędzie dostęp do konta w chmurze, ten pisze na
    dysk tej maszyny. Nie potrzebuje do tego ani konta w systemie, ani
    sieci wewnętrznej, ani żadnej podatności — korzysta z funkcji
    przewidzianej i działającej tak, jak zaprojektowano.

    Znaczy to, że konto w chmurze staje się cichym kontem na tej maszynie,
    z uprawnieniami zapisu w katalogu użytkownika, poza wszystkim, co
    o dostępie do maszyny ustalono.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wynoszenia plików bez decyzji o wysyłce oraz drogę zapisu na dysk
    maszyny za pośrednictwem konta w chmurze.
  en: |
    The setting switches off the synchronising of files between the machine and storage in the cloud.

    The thing that makes this mechanism a grave one is that it calls for no decision to send at all. It is
    enough to save a file in a folder under synchronisation - and the file is already off the machine. Nobody
    sent anything, nobody clicked "send", and the data went out.

    The second matter is weightier still and is at times passed over: the mechanism works both ways. Whoever
    gains access to the account in the cloud writes to this machine's disk. They need for that neither an
    account in the system, nor the internal network, nor any weakness - they use a foreseen function working as
    it was designed to.

    That means the account in the cloud becomes a quiet account on this machine, with the right to write in the
    user's folder, outside everything that was settled about access to the machine.

    What an attacker gains while the item goes unmet: a road for carrying files out without a decision to send,
    and a road for writing to the machine's disk by way of an account in the cloud.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i nie z powodu samej wygody.

    Rzecz do ustalenia przed wykonaniem: czy cokolwiek na tej maszynie
    pisze do katalogu objętego synchronizacją. Bywa, że robi to zadanie
    harmonogramu składujące wyniki, skrypt odkładający raporty albo
    aplikacja zapisująca eksport. Po zmianie zapis nadal się powiedzie —
    plik wyląduje na dysku i zostanie tam. Nic nie zgłosi błędu, a dane
    przestaną docierać tam, gdzie po nie sięgano.

    Jest to objaw najgorszego rodzaju: cicha zmiana zachowania bez
    komunikatu. Ktoś zauważy ją dopiero wtedy, gdy zabraknie raportu za
    miniony miesiąc.

    Rzecz druga dotyczy plików już zsynchronizowanych. Zostają na dysku
    i zostają w chmurze. Reguła zatrzymuje przenoszenie, a nie usuwa
    niczego po żadnej ze stron.

    Zmiana zaczyna obowiązywać po ponownym zalogowaniu.

    Czego to nie psuje: plików już zapisanych na dysku, udziałów
    sieciowych, kopii zapasowych robionych inną drogą, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi, ale wymaga wylogowania.
  en: |
    The class is "needs a planned rollout", and not for the sake of mere convenience.

    The thing to be established before carrying out: whether anything on this machine writes into a folder under
    synchronisation. It happens that a scheduled task laying down results does so, or a script putting away
    reports, or an application saving an export. After the change the writing will still succeed - the file will
    land on the disk and stay there. Nothing will report an error, and the data will cease to reach where they
    were fetched from.

    It is a symptom of the worst kind: a quiet change of behaviour without a message. Somebody will notice it
    only when last month's report is missing.

    The second matter concerns the files already synchronised. They stay on the disk and stay in the cloud. The
    rule stops the carrying and removes nothing on either side.

    The change begins to hold after a fresh logon.

    What this does not break: files already saved on the disk, network shares, backups made by another road,
    services, or applications.

    Calls for no restart and no stopping of a service, but calls for a logoff.

implementation_consequences:
  impact_areas:
    - file-sharing
    - virtualization-and-containers
  what_breaks:
    pl:
      - Zadanie harmonogramu albo skrypt piszący do katalogu synchronizowanego przestaje dostarczać pliki dalej
      - Zapis nadal się powiedzie i nic nie zgłosi błędu, więc brak danych wyjdzie na jaw dopiero po czasie
      - Pliki już zsynchronizowane zostają i na dysku, i w chmurze, bo reguła niczego nie usuwa
      - Zmiana zaczyna obowiązywać po ponownym zalogowaniu, a nie natychmiast
      - Udziały sieciowe, kopie zapasowe robione inną drogą i aplikacje serwerowe pozostają bez zmian
    en:
      - A scheduled task or a script writing into a synchronised folder ceases to carry files further
      - The writing will still succeed and nothing will report an error, so the want of data will come out only after a time
      - Files already synchronised stay both on the disk and in the cloud, the rule removing nothing
      - The change begins to hold after a fresh logon rather than at once
      - Network shares, backups made by another road and server applications stay unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Zadanie, skrypt albo aplikacja na tej maszynie odkłada wyniki do katalogu objętego synchronizacją
      - Synchronizacja jest przyjętą drogą wynoszenia kopii zapasowych poza maszynę
      - Nie ustalono, co na tej maszynie pisze do katalogów synchronizowanych
    en:
      - A task, a script or an application on this machine lays down results in a folder under synchronisation
      - The synchronising is an accepted road for carrying backups off the machine
      - It has not been established what on this machine writes into synchronised folders
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
      $name = 'DisableFileSyncNGSC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
    $name = 'DisableFileSyncNGSC'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Establish first whether any task, script or application writes into a
    # synchronised folder. Such a folder will after this stop being carried
    # anywhere, and nothing will say so.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableFileSyncNGSC' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/sharepoint/use-group-policy

notes:
  pl: |
    Punkt otwiera blok o kanałach, którymi treść przekracza granicę
    maszyny bez niczyjej decyzji. Każda reguła bloku dotyczy drogi
    wychodzącej albo wchodzącej, która działa sama i została przewidziana.

    Ta reguła jest w bloku najpoważniejsza i warto, żeby opis postawił
    oba kierunki, a nie tylko wynoszenie. Kierunek powrotny — zapis na
    dysk maszyny za pośrednictwem konta w chmurze — jest tym, co zmienia
    pozycję z pozycji o poufności w pozycję o dostępie.

    Rzecz warta zapowiedzenia w interfejsie: objaw niepowodzenia jest
    cichy. Zapis się powiedzie, błędu nie będzie, a plik po prostu nie
    pojedzie dalej. Aplikacja, która to zapowie, oszczędzi komuś
    tygodni szukania.

    Warunek do sprawdzenia przed wykonaniem jest jeden i konkretny: co na
    tej maszynie pisze do katalogu objętego synchronizacją. Inwentaryzacja
    pomoże tu tylko częściowo, bo zadanie harmonogramu widać, a katalogu
    docelowego skryptu już niekoniecznie.
  en: |
    The item opens the block about the channels by which content crosses the machine's boundary without
    anybody's decision. Every rule of the block concerns a road out or a road in that works of itself and was
    foreseen.

    This rule is the gravest in the block, and it is well that the description set down both directions and not
    the carrying out alone. The return direction - a writing to the machine's disk by way of an account in the
    cloud - is what turns the entry from one about confidentiality into one about access.

    A thing worth announcing in the interface: the symptom of failure is a quiet one. The writing will succeed,
    there will be no error, and the file simply will not travel on. An application that announces that will spare
    somebody weeks of searching.

    The condition to be checked before carrying out is one and a definite one: what on this machine writes into a
    folder under synchronisation. The inventory will help here only in part, a scheduled task being visible while
    a script's destination folder not necessarily so.
