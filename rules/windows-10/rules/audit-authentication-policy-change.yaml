id: win10-audit-authentication-policy-change

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja zmian zasad uwierzytelniania
    en: The audit of changes to the rules of authentication
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zmiany w zasadach rządzących samym uwierzytelnianiem:
    w relacjach zaufania, w zasadach biletów sieciowych i w tym, komu wolno
    się na tej maszynie zalogować i w jaki sposób.

    Prawo do zalogowania się jest osobne od uprawnień w systemie. Konto może
    mieć dostęp do wszystkiego i nie móc wejść, albo nie mieć uprawnień
    żadnych i wejść przez sieć. Zmiana w tym miejscu nie wygląda na
    podniesienie uprawnień, bo nim nie jest — jest otwarciem drzwi.

    Napastnik korzysta z tego w sposób odwrotny do oczekiwanego: nie nadaje
    sobie praw, tylko dopisuje konto do tych, którym wolno wejść przez
    usługę albo przez pulpit zdalny. Zmiana taka jest cicha i skuteczna po
    każdym restarcie.

    Odnotowuję zakres podkategorii, bo bywa myląca. Nie zapisuje logowań ani
    nieudanych prób; zapisuje zmiany w zasadach, według których logowania są
    rozstrzygane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: cichą zmianę
    w tym, komu wolno wejść na maszynę, widoczną wyłącznie w samych
    zasadach.
  en: |
    The setting writes down changes in the rules governing authentication itself: in trust relationships, in the
    rules of network tickets, and in who may log on to this machine and by what manner.

    The right to log on stands apart from rights within the system. An account may have reach to everything and
    be unable to come in, or have no rights at all and come in over the network. A change in that place does not
    look like a raising of rights, not being one - it is an opening of a door.

    An attacker uses this in a manner opposite to what is looked for: they grant themselves no rights but write
    an account among those free to come in by a service or by a remote desktop. Such a change is quiet and holds
    good after every restart.

    I set down the subcategory's reach, it being at times misleading. It does not write down loggings on nor
    failed attempts; it writes down changes in the rules by which loggings on are settled.

    What an attacker gains while the item goes unmet: a quiet change in who may come in to the machine, seen
    only in the rules themselves.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia żadnej zasady uwierzytelniania i nikomu niczego
    nie odbiera. Zapisuje wyłącznie fakt zmiany.

    Liczba wpisów jest bliska zeru na maszynie samodzielnej. W domenie
    wpisów bywa więcej, bo prawa do zalogowania przychodzą z zasadami
    z zewnątrz i są odświeżane cyklicznie.

    Odnotowuję źródło nieoczywiste: instalator usługi nadający swojemu
    koncie prawo logowania jako usługa zostawia tu wpis. Jest to zapis
    prawidłowy i łatwy do wzięcia za zmianę podejrzaną.

    Zapisywany jest wyłącznie wynik udany, bo podkategoria mówi o zmianach,
    które doszły do skutku.

    Czego to nie psuje: logowania, prawa do zalogowania, relacji zaufania,
    kont domenowych, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no rule of authentication and takes nothing from anybody. It writes down the fact of a
    change alone.

    The number of entries is near nought upon a standalone machine. In a domain the entries are more, the rights
    to log on arriving with rules from without and being refreshed by turns.

    I set down a source that is not plain: an installer of a service granting its own account the right to log
    on as a service leaves an entry here. It is a proper record and easily taken for a suspect change.

    Only the successful outcome is written, the subcategory speaking of changes that came about.

    What this does not break: logging on, the right to log on, trust relationships, domain accounts, file
    shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - W domenie wpisów bywa więcej, bo prawa do zalogowania przychodzą z zasadami z zewnątrz i są odświeżane cyklicznie
      - Instalator usługi nadający swojemu kontu prawo logowania jako usługa zostawia wpis łatwy do wzięcia za zmianę podejrzaną
      - Podkategoria nie zapisuje logowań ani nieudanych prób, tylko zmiany w zasadach, według których logowania są rozstrzygane
      - Zapisywany jest wyłącznie wynik udany, bo próba odrzucona nie jest zmianą
      - Logowanie, prawo do zalogowania, relacje zaufania, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - In a domain the entries are more, the rights to log on arriving with rules from without and being refreshed by turns
      - An installer of a service granting its own account the right to log on as a service leaves an entry easily taken for a suspect change
      - The subcategory writes down neither loggings on nor failed attempts, but changes in the rules by which loggings on are settled
      - Only the successful outcome is written, a refused attempt being no change
      - Logging on, the right to log on, trust relationships, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto odróżnić wpisów instalatorów od zmian wykonanych ręcznie
    en:
      - The record is not gathered away from the machine and there is nobody to part the installers entries from changes made by hand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9230-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9230-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9230-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. This subcategory speaks of changes
    # that came about; a refused attempt is not a change.
    auditpol /set /subcategory:"{0CCE9230-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9230-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-authentication-policy-change

notes:
  pl: |
    Reguła jest w tym bloku najczęściej mylona z czymś innym, bo jej nazwa
    sugeruje zapisywanie logowań. Warto, żeby aplikacja powiedziała wprost,
    że logowania mają podkategorię własną, a ta dotyczy zasad, według
    których logowania są rozstrzygane.

    Argument wart zachowania dotyczy tego, co napastnik tu robi. Nie nadaje
    sobie uprawnień — dopisuje się do tych, którym wolno wejść. Jest to
    zmiana, której nie widać w żadnym przeglądzie uprawnień, bo nie jest
    uprawnieniem.

    Odnotowuję kategorię średnią, mimo że zmiana dotyczy drzwi wejściowych.
    Powodem jest to, że prawo do zalogowania samo w sobie nie daje władzy
    nad maszyną — otwiera drogę, którą trzeba dalej przejść. Punkt
    o zmianach zasad autoryzacji, opisujący uprawnienia już w systemie, stoi
    w tym bloku wyżej i nie jest to przypadek.
  en: |
    The rule is the oftenest in this block mistaken for something else, its name suggesting the writing down of
    loggings on. It is well that the application say outright that loggings on have a subcategory of their own,
    while this touches the rules by which loggings on are settled.

    The argument worth keeping touches what an attacker does here. They grant themselves no rights - they write
    themselves among those free to come in. It is a change seen in no looking over of rights, not being a right.

    I set down the middling category, though the change touches the front door. The reason is that the right to
    log on gives of itself no sway over the machine - it opens a road that has still to be walked. The item about
    changes to the rules of authorisation, which describes rights already within the system, stands higher in
    this block, and that is no chance.
