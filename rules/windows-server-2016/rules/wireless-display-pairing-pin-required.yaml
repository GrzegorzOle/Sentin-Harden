id: win2016-wireless-display-pairing-pin-required

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Connect
  title:
    pl: Kod przy parowaniu z ekranem bezprzewodowym wymagany
    en: A code required at pairing with a wireless display
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga podania kodu przy parowaniu maszyny z ekranem
    bezprzewodowym.

    Bez tego wymagania parowanie odbywa się na podstawie samej bliskości:
    urządzenie zgłasza się, maszyna je przyjmuje, obraz zaczyna wychodzić.
    Znaczy to, że zawartość ekranu opuszcza maszynę do urządzenia, którego
    nikt nie potwierdził, a potwierdzeniem jest wyłącznie to, że urządzenie
    było w zasięgu.

    Zagrożenie jest konkretne i nie wymaga niczego wyrafinowanego.
    Urządzenie odbierające obraz bezprzewodowo można postawić w sąsiednim
    pomieszczeniu albo na korytarzu. Nazwa urządzenia jest dowolna i może
    udawać sprzęt znany obsłudze.

    Ustawienie przyjmuje wartości ze zbioru, nie dwie. Można żądać kodu
    przy pierwszym parowaniu albo za każdym razem. Obie wartości punkt
    spełniają; druga jest ostrzejsza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odebrania obrazu z ekranu maszyny po postawieniu własnego odbiornika
    w zasięgu.
  en: |
    The setting calls for a code to be given at the pairing of the machine with a wireless display.

    Without that call the pairing rests on nearness alone: a device reports itself, the machine takes it in,
    the picture begins to go out. That means the screen's contents leave the machine for a device nobody
    confirmed, and the confirmation is solely that the device was within range.

    The threat is a concrete one and needs nothing refined. A device receiving a picture wirelessly can be
    set in the next room or in a corridor. The device's name is arbitrary and may feign gear known to the
    attendance.

    The setting takes values from a set, not two. A code may be called for at the first pairing or every
    time. Both values meet the item; the second is the tighter.

    What an attacker gains while the item goes unmet: the chance to receive the picture from the machine's
    screen after setting their own receiver within range.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy sposobu pracy
    w pomieszczeniu, w którym ta maszyna stoi.

    Na serwerze bez karty bezprzewodowej zmiana nie robi nic. Na maszynie
    używanej do prezentacji — bo takie bywają wśród maszyn zarządzanych
    razem z serwerami — dochodzi jeden krok: przy parowaniu trzeba wpisać
    kod wyświetlony na ekranie odbiornika.

    Rzecz do rozstrzygnięcia dotyczy wyboru wartości. Żądanie kodu przy
    każdym parowaniu jest ostrzejsze, ale przy sali, w której kilka osób
    po kolei podłącza się do tego samego ekranu, oznacza wpisywanie kodu
    za każdym razem. Żądanie kodu przy pierwszym parowaniu wystarcza tam,
    gdzie sprzęt jest stały, a osoby znane.

    Objaw po wdrożeniu jest czytelny i natychmiastowy: pojawia się pytanie
    o kod. Nikt nie będzie szukał przyczyny.

    Czego to nie psuje: pracy ekranów podłączonych przewodem, kart
    graficznych, rozdzielczości, aplikacji, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the manner of working in the room where this
    machine stands.

    On a server without a wireless card the change does nothing. On a machine used for presentations - and
    such are at times among the machines managed along with servers - one step is added: at the pairing a
    code shown on the receiver's screen has to be typed in.

    The thing to be settled concerns the choice of value. Calling for a code at every pairing is the tighter,
    but in a room where several people connect one after another to the same display it means the code being
    typed every time. Calling for a code at the first pairing suffices where the gear is fixed and the people
    known.

    The symptom after the rollout is legible and immediate: a question about a code appears. Nobody will
    look for the cause.

    What this does not break: the working of displays joined by cable, graphics cards, resolutions,
    applications, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Przy parowaniu z ekranem bezprzewodowym trzeba wpisać kod wyświetlony na odbiorniku
      - Przy wartości ostrzejszej kod trzeba wpisywać za każdym razem, co w sali z kilkoma osobami bywa uciążliwe
      - Objaw jest czytelny i natychmiastowy, więc nikt nie będzie szukał przyczyny
      - Ekrany podłączone przewodem, karty graficzne i rozdzielczości pozostają bez zmian
      - Aplikacje, usługi i sieć pozostają bez zmian
    en:
      - At the pairing with a wireless display a code shown on the receiver has to be typed in
      - At the tighter value the code has to be typed every time, which in a room with several people is at times a nuisance
      - The symptom is legible and immediate, so nobody will look for the cause
      - Displays joined by cable, graphics cards and resolutions stay unchanged
      - Applications, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna paruje się z ekranem bezprzewodowym w trybie bezobsługowym i nie ma komu wpisać kodu
      - Odbiornik obrazu nie potrafi wyświetlić kodu i nie ma innego sposobu jego odczytania
    en:
      - The machine pairs with a wireless display unattended and there is nobody to type the code
      - The receiver cannot show a code and there is no other way of reading it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero never asks for a code,
      # one asks at the first pairing, two asks every time.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
      $name = 'RequirePinForPairing'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(1|2)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
    $name = 'RequirePinForPairing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One asks for a code at the first pairing, two asks every time. Both pass
    # the audit; two is the tighter and worth choosing where a room is open
    # to people from outside.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequirePinForPairing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-wirelessdisplay

notes:
  pl: |
    Punkt jest w bloku jedyny, który czegoś od człowieka wymaga, i warto
    tak go opisać. Pozostałe reguły odbierają maszynie zachowania
    samoczynne; ta dokłada krok przy czynności wykonywanej ręcznie.

    Ustawienie ma wartości ze zbioru, nie przełącznik, i audyt to
    odzwierciedla — przyjmuje dwie wartości zamiast jednej. Jest to drugi
    taki przypadek w tym zestawie, po zakresie danych diagnostycznych,
    i z tego samego powodu: obie odpowiadają świadomej decyzji, a różnią
    się ostrością, nie zgodnością.

    Warto, żeby aplikacja pokazała, co decyduje o wyborze. Nie jest to
    poziom ryzyka, tylko sposób korzystania z pomieszczenia: sprzęt stały
    i osoby znane kontra sala otwarta dla postronnych. Jest to pytanie,
    na które benchmark nie odpowiada i odpowiedzieć nie może.

    Na maszynie bez karty bezprzewodowej punkt jest wyłącznie porządkowy
    i warto to przyznać, zamiast opisywać skutek, którego nie będzie.
  en: |
    The item is in the block the only one that calls for something from a person, and is worth describing so.
    The other rules take behaviours of themselves away from the machine; this one adds a step to an act
    carried out by hand.

    The setting has values from a set rather than a switch, and the audit reflects that - it takes two values
    instead of one. It is the second such case in this set, after the scope of diagnostic data, and for the
    same reason: both answer a knowing decision and differ in tightness, not in compliance.

    It is well that the application show what settles the choice. It is not the level of risk but the manner
    in which the room is used: fixed gear and known people against a hall open to outsiders. It is a question
    the benchmark does not answer and cannot.

    On a machine without a wireless card the item is one of order alone, and that is worth owning rather than
    describing a consequence that will not come.
