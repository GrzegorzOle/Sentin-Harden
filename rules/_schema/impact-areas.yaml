# Impact area dictionary - shared by every system.
#
# The most important dictionary in the project. It is what makes it possible to:
#   1. sum up consequences before applying changes in bulk,
#   2. answer the reverse question: "I use X - which rules will hurt me?",
#   3. tie a warning to what was actually found on the machine.
#
# Areas are DELIBERATELY shared between Windows and Linux. "File sharing" means
# the same thing on both sides, so the reverse question works regardless of the
# operating system.
#
# Adding an area is a design decision, not a detail. Before adding one, check
# whether an existing entry already describes the same thing in other words.

areas:
  - id: file-sharing
    name:
      pl: Udostępnianie plików w sieci
      en: Network file sharing
    description:
      pl: Dostęp do udziałów sieciowych, protokoły plikowe, mapowane dyski.
      en: Access to network shares, file protocols, mapped drives.

  - id: legacy-authentication
    name:
      pl: Starsze mechanizmy uwierzytelniania
      en: Legacy authentication mechanisms
    description:
      pl: Wycofywane protokoły i metody logowania, uwierzytelnianie między systemami.
      en: Deprecated logon protocols and methods, system-to-system authentication.

  - id: accounts-and-passwords
    name:
      pl: Konta i polityka haseł
      en: Accounts and password policy
    description:
      pl: Złożoność, rotacja i blokady haseł, konta lokalne, konta serwisowe.
      en: Password complexity, rotation and lockout, local accounts, service accounts.

  - id: macros-and-documents
    name:
      pl: Makra i treść aktywna w dokumentach
      en: Macros and active content in documents
    description:
      pl: Wykonywanie kodu osadzonego w plikach biurowych i podobnych formatach.
      en: Execution of code embedded in office files and similar formats.

  - id: scripting-and-automation
    name:
      pl: Skrypty i automatyzacja
      en: Scripting and automation
    description:
      pl: Uruchamianie skryptów, polityki wykonywania, zadania harmonogramu.
      en: Script execution, execution policies, scheduled tasks.

  - id: remote-management
    name:
      pl: Zdalne zarządzanie
      en: Remote management
    description:
      pl: Zdalne wykonywanie poleceń, konsole zarządzania, agenci monitorujący.
      en: Remote command execution, management consoles, monitoring agents.

  - id: remote-desktop
    name:
      pl: Pulpit zdalny
      en: Remote desktop
    description:
      pl: Graficzny dostęp zdalny do systemu.
      en: Graphical remote access to the system.

  - id: printing
    name:
      pl: Drukowanie
      en: Printing
    description:
      pl: Kolejki wydruku, serwery druku, instalacja sterowników drukarek.
      en: Print queues, print servers, printer driver installation.

  - id: drivers-and-devices
    name:
      pl: Sterowniki i urządzenia
      en: Drivers and devices
    description:
      pl: Instalacja i ładowanie sterowników, urządzenia peryferyjne.
      en: Driver installation and loading, peripheral devices.

  - id: removable-media
    name:
      pl: Nośniki wymienne
      en: Removable media
    description:
      pl: Pamięci USB, dyski zewnętrzne, nagrywarki.
      en: USB storage, external drives, optical writers.

  - id: network-and-firewall
    name:
      pl: Sieć i zapora
      en: Network and firewall
    description:
      pl: Reguły zapory, wykrywanie w sieci, protokoły pomocnicze.
      en: Firewall rules, network discovery, auxiliary protocols.

  - id: encryption-and-tls
    name:
      pl: Szyfrowanie i TLS
      en: Encryption and TLS
    description:
      pl: Wersje protokołów, zestawy szyfrów, wymagania wobec certyfikatów.
      en: Protocol versions, cipher suites, certificate requirements.

  - id: virtualization-and-containers
    name:
      pl: Wirtualizacja i kontenery
      en: Virtualization and containers
    description:
      pl: Funkcje hipernadzorcy, izolacja, środowiska kontenerowe.
      en: Hypervisor features, isolation, container environments.

  - id: updates-and-servicing
    name:
      pl: Aktualizacje i serwisowanie
      en: Updates and servicing
    description:
      pl: Pobieranie i instalacja poprawek, okna serwisowe, wymuszony restart.
      en: Patch download and installation, maintenance windows, forced restarts.

  - id: logging-and-audit
    name:
      pl: Rejestrowanie i audyt
      en: Logging and audit
    description:
      pl: Zakres zdarzeń, rozmiar i retencja dzienników, przekazywanie zdarzeń.
      en: Event scope, log size and retention, event forwarding.

  - id: boot-and-firmware
    name:
      pl: Rozruch i oprogramowanie układowe
      en: Boot and firmware
    description:
      pl: Bezpieczny rozruch, szyfrowanie dysku, ustawienia sprzętowe.
      en: Secure boot, disk encryption, hardware settings.

  - id: web-server-services
    name:
      pl: Usługi serwera WWW
      en: Web server services
    description:
      pl: Konfiguracja serwera aplikacyjnego, moduły, nagłówki, obsługa żądań.
      en: Application server configuration, modules, headers, request handling.

  - id: user-interface
    name:
      pl: Wygląd i zachowanie systemu
      en: System look and behaviour
    description:
      pl: Ekran blokady, komunikaty, personalizacja, dostępne elementy interfejsu.
      en: Lock screen, messages, personalisation, available interface elements.
