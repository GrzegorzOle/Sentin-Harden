id: win11-sandbox-video-input-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Dostęp do kamery z piaskownicy wyłączony
    en: Access to the camera from the sandbox disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy program uruchomiony w piaskownicy ma dostęp do
    kamery maszyny.

    Rozumowanie jest takie samo jak przy mikrofonie, a skutek jeszcze
    bardziej bezpośredni. W piaskownicy uruchamia się to, czemu się nie ufa,
    i zakłada, że cokolwiek się tam zdarzy, tam zostanie. Kamera to założenie
    łamie w sposób, którego nie da się nadrobić żadnym innym ograniczeniem —
    obraz z pomieszczenia jest poza zasięgiem jakiejkolwiek izolacji
    dotyczącej plików i procesów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podgląd
    pomieszczenia i osoby przy maszynie, uruchomiony ze środowiska, które
    z definicji ma prawo zachowywać się podejrzanie.

    Warto dopowiedzieć rzecz, która przy piaskownicy bywa pomijana: nie
    chodzi wyłącznie o obserwację człowieka. Obraz z kamery pokazuje również
    to, co jest w kadrze — dokumenty na biurku, tablicę za plecami, ekran
    drugiego monitora, identyfikator na smyczy. Bywa to materiał
    wartościowszy niż zawartość samej maszyny.

    Dostęp do kamery nie zostawia w piaskownicy śladu przetrwającego jej
    zamknięcie, więc po zakończeniu sesji nie ma czego badać.
  en: |
    The setting settles whether a program started in the sandbox has access to the
    machine's camera.

    The reasoning is the same as with the microphone, and the effect more direct still. In
    the sandbox is run what is not trusted, on the assumption that whatever happens there
    stays there. The camera breaks that assumption in a way no other limit can make good -
    a view of the room is beyond the reach of any isolation concerning files and
    processes.

    What an attacker gains while the item goes unmet: a view of the room and of the person
    at the machine, started from an environment that by definition has leave to behave
    suspiciously.

    One thing is worth adding that with a sandbox is sometimes passed over: it is not only
    about watching a person. The camera's picture shows as well what is in the frame -
    documents on the desk, the board behind one's back, a second monitor's screen, a badge
    on a lanyard. That is sometimes material worth more than the machine's contents.

    Access to the camera leaves in the sandbox no trace outliving its closing, so once the
    session has ended there is nothing to examine.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek uruchamia w piaskownicy programy
    korzystające z obrazu — a jest to zastosowanie jeszcze rzadsze niż przy
    dźwięku.

    Piaskownica służy do sprawdzenia, co robi nieznany plik, i kamera nie jest
    do tego potrzebna. Zastosowania, w których bywa: testowanie programu do
    spotkań albo sterownika kamery przed wdrożeniem na stanowiskach.

    Po zmianie program w piaskownicy zobaczy system bez kamery. Zgłosi brak
    sprzętu, a nie brak uprawnień, co przy testowaniu bywa mylące.

    Poza piaskownicą nic się nie zmienia. Kamera na samej maszynie działa tak
    jak wcześniej, a dostęp do niej dla zwykłych aplikacji jest przedmiotem
    osobnej reguły w tej paczce.
  en: |
    What needs checking is whether anybody runs programs in the sandbox that use a
    picture - and it is a use rarer still than with sound.

    The sandbox serves to see what an unknown file does, and a camera is not needed for
    that. Uses in which it does figure: testing a meetings program or a camera driver
    before a rollout to the stations.

    After the change a program in the sandbox will see a system with no camera. It will
    report a want of hardware rather than a want of rights, which in testing sometimes
    misleads.

    Outside the sandbox nothing changes. The camera on the machine itself works as before,
    and access to it for ordinary applications is the subject of a separate rule in this
    pack.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Program w piaskownicy nie widzi kamery i zgłasza brak sprzętu
      - Testowanie programu do spotkań albo sterownika kamery w piaskownicy przestaje być pełne
      - Kamera na samej maszynie działa tak jak wcześniej
    en:
      - A program in the sandbox does not see the camera and reports a want of hardware
      - Testing a meetings program or a camera driver in the sandbox stops being complete
      - The camera on the machine itself works as before
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica służy do testowania programów korzystających z kamery przed wdrożeniem
    en:
      - The sandbox serves to test programs using a camera before a rollout
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowVideoInput'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $current = (Get-ItemProperty -Path $path -Name 'AllowVideoInput' -ErrorAction SilentlyContinue).'AllowVideoInput'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowVideoInput'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowVideoInput' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Reguła tworzy parę z tą, która dotyczy mikrofonu. Oba punkty prowadzą nie
    do maszyny, lecz do pomieszczenia, w którym ona stoi, i dlatego
    ograniczenia nałożone na pliki i procesy w piaskownicy nie mają na nie
    żadnego wpływu.

    Ustawienie działa wyłącznie na piaskownicę. Na maszynie bez włączonego
    składnika reguła nie ma czego dotyczyć, ale wdrożona wcześniej obejmie go
    od razu po włączeniu.

    Brak wartości nie jest stanem zgodnym, bo domyślnie dostęp bywa dozwolony.
  en: |
    The rule forms a pair with the one about the microphone. Both items lead not to the
    machine but to the room it stands in, and so the limits laid on files and processes in
    the sandbox have no bearing on them at all.

    The setting works on the sandbox alone. On a machine with the component switched off
    the rule has nothing to concern, but applied beforehand it will cover it as soon as it
    is switched on.

    A missing value is not a compliant state, since by default access is sometimes
    allowed.
