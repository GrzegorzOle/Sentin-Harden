id: win2025-vbs-memory-attributes-table-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Tablica atrybutów pamięci oprogramowania układowego wymagana
    en: The firmware memory attributes table required
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby oprogramowanie układowe udostępniało tablicę
    opisującą, które obszary pamięci są wykonywalne, a które zapisywalne.
    Bez tej tablicy system nie ma podstawy, żeby narzucić rozdział
    między jednym a drugim w obszarach należących do oprogramowania
    układowego.

    Zostawiam kategorię wysoką. Rzecz sprowadza się do starej zasady:
    pamięć, do której wolno pisać, nie powinna być pamięcią, z której
    wolno wykonywać. Gdy ten rozdział nie obowiązuje, obszar zapisany
    przez kogoś staje się obszarem wykonywanym przez procesor — a to
    jest najkrótsza droga od błędu do wykonania cudzego kodu.

    Na serwerze waży to dodatkowo z powodu, który nie dotyczy stacji
    roboczych: obszary należące do oprogramowania układowego są na
    serwerze liczniejsze i bogatsze, bo maszyna ma rozbudowaną obsługę
    sprzętu — kontrolery pamięci masowej, karty zarządzania,
    monitorowanie stanu podzespołów. Każdy z tych elementów wnosi własny
    kod do warstwy, o której mowa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obszary
    pamięci oprogramowania układowego, w których zapis i wykonanie nie
    są rozdzielone — czyli miejsce, gdzie własny kod umieszcza się niżej,
    niż sięga cokolwiek w systemie.
  en: |
    The item requires the firmware to publish a table describing which areas of
    memory are executable and which are writable. Without that table the system has
    no basis on which to enforce the separation between the two in the areas that
    belong to the firmware.

    I keep the category high. The matter comes down to an old principle: memory
    that may be written to should not be memory that may be executed from. Where
    that separation does not hold, an area written by somebody becomes an area
    executed by the processor - and that is the shortest route from a bug to the
    execution of someone else's code.

    On a server this weighs more for a reason that does not apply to workstations:
    the areas belonging to the firmware are more numerous and richer on a server,
    because the machine has extensive hardware support - storage controllers,
    management cards, component health monitoring. Each of those brings its own
    code into the layer in question.

    What an attacker gains while the item goes unmet: areas of firmware memory in
    which writing and execution are not separated - that is, a place where one
    plants one's own code lower than anything in the system reaches.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia", ale powód jest w tej
    grupie odmienny i warto go nazwać wprost, bo zmienia charakter pracy
    z tym punktem.

    Jest to jedyna reguła w tej grupie, której nie da się spełnić
    ustawieniem czegokolwiek w systemie. Albo oprogramowanie układowe tę
    tablicę udostępnia, albo nie. Jeżeli nie — a na serwerach starszych
    oraz takich, których firmware nie był uaktualniany od wdrożenia,
    zdarza się to często — jedyną drogą jest uaktualnienie oprogramowania
    układowego.

    Uaktualnienie firmware serwera nie jest czynnością administracyjną.
    Wymaga narzędzi producenta, bywa zależne od ważnej umowy
    serwisowej, przechodzi przez pełne zamknięcie maszyny, a w razie
    niepowodzenia zostawia sprzęt, który nie startuje i którego nie
    naprawi się zdalnie. Jest to więc zmiana o własnym ryzyku, większym
    niż ryzyko punktu, który ją wymusił.

    Dlatego praktyczne postępowanie wygląda tak: jeżeli po włączeniu tego
    wymagania warstwa wirtualizacji przestaje się uruchamiać, znaczy to,
    że platforma tablicy nie udostępnia. Właściwym wynikiem jest wtedy
    zapisany wyjątek z uzasadnieniem i datą przeglądu wyznaczoną na
    najbliższe planowane uaktualnienie firmware albo na wymianę maszyny.
    Na sprzęcie poza wsparciem producenta może to być wyjątek trwający
    do końca życia tej maszyny — i jest to uczciwy wynik pracy
    z aplikacją, a nie porażka.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I keep the class "needs a planned rollout", but the reason differs from the
    rest of this group and is worth naming outright, because it changes the nature
    of the work with this item.

    It is the only rule in this group that cannot be satisfied by setting anything
    in the system. Either the firmware publishes this table or it does not. If it
    does not - and on older servers, and on those whose firmware has not been
    updated since deployment, that happens often - the only route is a firmware
    update.

    Updating a server's firmware is not an administrative task. It requires the
    vendor's tools, sometimes depends on a valid support contract, goes through a
    full shutdown of the machine, and on failure leaves hardware that does not
    start and cannot be repaired remotely. It is therefore a change with a risk of
    its own, greater than the risk of the item that forced it.

    So the practical procedure looks like this: if after switching this requirement
    on the virtualisation layer stops starting, it means the platform does not
    publish the table. The right outcome is then a recorded exception with a
    justification and a review date set to the nearest planned firmware update or
    to the machine's replacement. On hardware past vendor support this may be an
    exception lasting until the end of that machine's life - and that is an honest
    result of working with the application, not a failure.

    The change binds after a restart and is undone after another one.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Tam, gdzie oprogramowanie układowe tablicy nie udostępnia, warstwa wirtualizacji przestaje się uruchamiać
      - Punktu nie da się spełnić ustawieniem czegokolwiek w systemie, bo wymaganie dotyczy oprogramowania układowego
      - Jedyną drogą jest uaktualnienie firmware, które ma własne ryzyko, większe niż ryzyko tego punktu
      - Uaktualnienie firmware wymaga narzędzi producenta, pełnego zamknięcia maszyny i nie naprawia się zdalnie po niepowodzeniu
      - Na sprzęcie poza wsparciem producenta właściwym wynikiem bywa wyjątek trwający do końca życia maszyny
    en:
      - Where the firmware does not publish that table, the virtualisation layer stops starting
      - The item cannot be satisfied by setting anything in the system, because the requirement is on the firmware
      - The only route is a firmware update, which carries a risk of its own, greater than the risk of this item
      - A firmware update requires the vendor's tools and a full shutdown, and on failure cannot be repaired remotely
      - On hardware past vendor support the right outcome is sometimes an exception lasting until the end of the machine's life
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie układowe maszyny nie udostępnia tej tablicy, a jego uaktualnienie nie jest zaplanowane
      - Maszyna jest poza wsparciem producenta i nie ma dla niej wydania oprogramowania układowego spełniającego wymaganie
    en:
      - The machine's firmware does not publish this table and no firmware update is planned
      - The machine is past vendor support and there is no firmware release for it that meets the requirement
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'HVCIMATRequired'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    $name = 'HVCIMATRequired'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The one item here that cannot be satisfied from inside Windows: either
    # the firmware publishes the table or it does not. Where it does not, the
    # virtualisation layer stops starting and the answer is a firmware update -
    # or a recorded exception with a review date.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'HVCIMATRequired' -Value 1 -Type DWord
    # The setting binds after a restart of the machine.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Stara zasada: pamięć, do której wolno pisać, nie powinna być
    pamięcią, z której wolno wykonywać. Bez tej tablicy rozdział nie
    obowiązuje w obszarach należących do oprogramowania układowego,
    a tych jest na serwerze więcej niż na stacji roboczej — kontrolery
    pamięci masowej, karty zarządzania, monitorowanie podzespołów.

    Jedyna reguła w tej grupie, której nie da się spełnić ustawieniem
    czegokolwiek w systemie. Albo firmware tablicę udostępnia, albo nie.

    Uaktualnienie firmware serwera to zmiana o własnym ryzyku, większym
    niż ryzyko punktu, który ją wymusił. Na sprzęcie poza wsparciem
    właściwym wynikiem bywa wyjątek trwający do końca życia maszyny —
    i jest to uczciwy wynik pracy, a nie porażka.
  en: |
    An old principle: memory that may be written to should not be memory that may
    be executed from. Without that table the separation does not hold in the areas
    belonging to the firmware, and there are more of those on a server than on a
    workstation - storage controllers, management cards, component monitoring.

    The only rule in this group that cannot be satisfied by setting anything in the
    system. Either the firmware publishes the table or it does not.

    Updating a server's firmware is a change with a risk of its own, greater than
    the risk of the item that forced it. On hardware past support the right outcome
    is sometimes an exception lasting until the end of the machine's life - and
    that is an honest result of the work, not a failure.
