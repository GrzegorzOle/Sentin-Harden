id: win2025-kernel-dma-protection-enumeration

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Kernel DMA Protection
  title:
    pl: Blokada urządzeń zewnętrznych sięgających wprost do pamięci
    en: External devices reaching straight into memory blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje uruchamianie urządzeń zewnętrznych, które sięgają wprost
    do pamięci maszyny, dopóki nikt się w systemie nie zalogował.
    Urządzenie podłączone do zablokowanej maszyny nie zostanie
    uruchomione, tylko poczeka.

    Zostawiam kategorię wysoką. Urządzenie sięgające wprost do pamięci
    nie prosi systemu o dane — czyta je samo, z pominięciem procesora,
    a więc z pominięciem wszystkiego, czego procesor pilnuje. Uprawnienia,
    logowanie, blokada ekranu: nic z tego nie stoi na tej drodze. Z pamięci
    da się w ten sposób wyjąć klucze szyfrowania dysku i bilety sesji,
    a maszyna nie odnotuje, że ktokolwiek o cokolwiek pytał.

    Na serwerze wychodzi tu napięcie, które warto nazwać wprost, zamiast
    rozstrzygać je w jedną stronę. Z jednej strony serwer stoi
    w zamkniętym pomieszczeniu i nikt nie podchodzi do niego z kablem —
    to argument za tym, że punkt jest mniej pilny niż na laptopie.
    Z drugiej strony dostęp fizyczny do serwera mają ludzie, którzy
    nigdy nie są obserwowani: serwisant producenta przy wymianie
    podzespołu i technik cudzej serwerowni. Rzadkość zdarzenia nie zmienia
    jego skutku, a akurat te osoby przychodzą z własnym sprzętem
    diagnostycznym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    pamięci zablokowanej maszyny bez logowania się do niej i bez
    zostawiania śladu w czymkolwiek, co maszyna zapisuje.
  en: |
    The item blocks the start-up of external devices that reach straight
    into the machine's memory until somebody has signed in. A device
    plugged into a locked machine is not started; it waits.

    I keep the category high. A device reaching straight into memory does
    not ask the system for data - it reads the data itself, bypassing the
    processor and therefore bypassing everything the processor enforces.
    Privileges, sign-in, the lock screen: none of them stands in that way.
    Disk encryption keys and session tickets can be lifted out of memory
    like this, and the machine will not record that anybody asked for
    anything.

    On a server a tension emerges here that is worth naming outright
    instead of settling in one direction. On one hand the server stands in
    a locked room and nobody walks up to it with a cable - an argument that
    the item is less urgent than on a laptop. On the other hand, the people
    with physical access to a server are the ones nobody ever watches: the
    vendor's engineer replacing a component and the technician in somebody
    else's data centre. The rarity of the event does not change its
    consequence, and those particular people arrive with diagnostic
    hardware of their own.

    What an attacker gains while the item goes unmet: a read of a locked
    machine's memory without signing in to it and without leaving a trace
    in anything the machine records.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać konkretny
    scenariusz, przez który tak zostaje, bo bez niego punkt wyglądałby
    na darmowy.

    Zablokowane zostaną nie tylko urządzenia przynoszone z zewnątrz.
    Na serwerze złącza rozszerzeń obsadza się sprzętem, który sięga do
    pamięci wprost z założenia: kartami dostępu do macierzy, kontrolerami
    i adapterami sieciowymi o dużej przepustowości. Dopóki reguła dotyczy
    urządzeń dołączanych na gorąco, obejmie także takie karty, jeżeli
    zostaną dołożone przy maszynie zablokowanej — czyli dokładnie
    w sytuacji serwisowej, w której nikt nie jest zalogowany.

    Praktycznie oznacza to jedno: po dołożeniu sprzętu trzeba się
    zalogować, żeby urządzenie ruszyło. Nie jest to wielka niedogodność,
    ale jest niespodzianką dla serwisanta, który dołożył kartę, zobaczył,
    że system jej nie widzi, i zaczyna szukać usterki w karcie.

    Punkt nie wymaga przerwy, nie wymaga restartu i cofa się natychmiast.
    Zostaje poza trybem zbiorczym wyłącznie przez ten jeden scenariusz.
  en: |
    I keep the class "needs review" and want to point at the concrete
    scenario that keeps it there, because without it the item would look
    free.

    What gets blocked is not only devices brought in from outside. On a
    server the expansion slots hold hardware that reaches into memory
    directly by design: storage fabric cards, controllers, high-throughput
    network adapters. As long as the rule covers hot-attached devices, it
    will also cover such cards if they are added while the machine is
    locked - that is, in exactly the maintenance situation where nobody is
    signed in.

    In practice this means one thing: after adding hardware somebody has to
    sign in for the device to start. It is no great inconvenience, but it
    is a surprise for an engineer who installed a card, saw that the system
    does not see it, and starts looking for a fault in the card.

    The item needs no outage, needs no restart and is undone immediately.
    It stays out of bulk mode solely because of that one scenario.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Urządzenie dołączone przy zablokowanej maszynie nie ruszy, dopóki ktoś się nie zaloguje
      - Obejmuje to karty rozszerzeń sięgające do pamięci wprost, dokładnie w sytuacji serwisowej
      - Serwisant widzi kartę, której system nie uruchamia, i zaczyna szukać usterki w sprzęcie
      - Punkt nie wymaga przerwy ani restartu i cofa się natychmiast
    en:
      - A device attached while the machine is locked will not start until somebody signs in
      - This covers expansion cards reaching into memory directly, in exactly the maintenance situation
      - The engineer sees a card the system does not start and begins looking for a hardware fault
      - The item needs no outage or restart and is undone immediately
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie planowane są prace serwisowe z dokładaniem sprzętu bez możliwości zalogowania się na konsoli
      - Serwer korzysta z kart dołączanych na gorąco, a procedura serwisowa nie przewiduje logowania po ich dołożeniu
    en:
      - Maintenance involving added hardware is planned on this machine with no way to sign in at the console
      - The server uses hot-attached cards and the maintenance procedure does not provide for signing in after adding them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection'
      $name = 'DeviceEnumerationPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection'
    $name = 'DeviceEnumerationPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # After this, hardware added while the machine is locked waits for somebody
    # to sign in before it starts. Tell whoever does the maintenance, or they
    # will look for a fault in the card.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeviceEnumerationPolicy' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/kernel-dma-protection-for-thunderbolt

notes:
  pl: |
    Urządzenie sięgające wprost do pamięci nie prosi systemu o dane, tylko
    czyta je z pominięciem procesora. Uprawnienia, logowanie i blokada
    ekranu nie stoją na tej drodze, a maszyna nie odnotuje, że ktokolwiek
    o cokolwiek pytał.

    Napięcie charakterystyczne dla serwera zostawiam nierozstrzygnięte
    świadomie: serwer stoi w zamkniętym pomieszczeniu, ale dostęp fizyczny
    mają do niego ludzie, których nikt nie obserwuje i którzy przychodzą
    z własnym sprzętem diagnostycznym.

    Poza trybem zbiorczym trzyma ten punkt jeden scenariusz: sprzęt
    dołożony przy zablokowanej maszynie nie ruszy, dopóki ktoś się nie
    zaloguje — czyli dokładnie w sytuacji serwisowej.
  en: |
    A device reaching straight into memory does not ask the system for
    data; it reads it bypassing the processor. Privileges, sign-in and the
    lock screen do not stand in that way, and the machine will not record
    that anybody asked for anything.

    I deliberately leave the tension specific to a server unresolved: the
    server stands in a locked room, but the people with physical access to
    it are the ones nobody watches, and they arrive with diagnostic
    hardware of their own.

    One scenario keeps this item out of bulk mode: hardware added while the
    machine is locked will not start until somebody signs in - that is, in
    exactly the maintenance situation.
