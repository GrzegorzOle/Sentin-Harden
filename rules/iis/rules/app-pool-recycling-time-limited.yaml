id: iis-app-pool-recycling-time-limited

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Basic Configurations
  title:
    pl: Okresowe przetaczanie puli aplikacji ustawione i nie rzadsze niż raz na dobę
    en: Periodic recycling of the application pool is set and no rarer than daily
  level: 1
  profile: application

platform:
  system: iis

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer potrafi co jakiś czas zastąpić proces roboczy puli nowym — stary kończy
    obsługę rozpoczętych żądań i ginie, nowy przejmuje ruch. Wartość zero wyłącza
    ten mechanizm, więc proces żyje tak długo, jak działa serwer.

    Co to odbiera atakującemu: proces roboczy żyjący miesiącami gromadzi w pamięci
    wszystko, co przez niego przeszło. Zmiana, która wstrzyknęła kod do działającego
    procesu — przez lukę w aplikacji albo w bibliotece — trwa dokładnie tyle, ile
    trwa ten proces. Bez przetaczania trwałość takiego wstrzyknięcia jest
    nieograniczona, choć atakujący nie zapisał niczego na dysku i nie założył
    żadnego mechanizmu startowego. Regularne przetaczanie wymusza na nim albo
    powtarzanie ataku, albo zbudowanie trwałości zapisanej gdzieś na maszynie —
    a to jest znacznie bardziej widoczne.

    Przy okazji ginie też skutek wycieków pamięci i narastających uchwytów, przez
    które serwer po kilku tygodniach zaczyna zwalniać bez jednoznacznej przyczyny.
  en: |
    The server can from time to time replace a pool s worker process with a new
    one - the old one finishes the requests it has started and dies, the new one
    takes over the traffic. A value of zero turns that off, so the process lives
    for as long as the server runs.

    What it takes away from an attacker - a worker process alive for months
    gathers in memory everything that has passed through it. A change that
    injected code into a running process, through a flaw in the application or in
    a library, lasts exactly as long as that process does. Without recycling the
    persistence of such an injection is unlimited, even though the attacker wrote
    nothing to disk and set up no startup mechanism. Regular recycling forces
    them either to repeat the attack or to build persistence written somewhere on
    the machine - and that is far more visible.

    Along the way it also removes the effect of memory leaks and growing handle
    counts, through which a server begins to slow down after a few weeks for no
    clear reason.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo przetoczenie puli jest przerwą — krótką, ale
    prawdziwą. Nowy proces musi wystartować i wczytać aplikację, a w tym czasie
    żądania czekają.

    Najbardziej boli to, co proces trzyma w sobie. Sesje przechowywane w pamięci
    procesu przepadają, czyli użytkownicy zostają wylogowani w przypadkowym
    momencie — także w środku wypełniania formularza. Aplikacja z sesją w bazie
    albo w usłudze stanu sesji nie ma tego problemu, więc przed zmianą trzeba
    ustalić, który to przypadek.

    Druga rzecz to moment. Przetaczanie w stałym odstępie liczy się od startu
    puli, więc na serwerze pracującym długo trafia w losowe pory doby, w tym
    w godziny szczytu. Przetaczanie o wyznaczonej godzinie nocnej jest zwykle
    lepszym wyborem — ten punkt ustawia jednak odstęp, bo to ustawienie
    dziedziczone przez wszystkie pule, a harmonogram nocny bywa specyficzny dla
    konkretnej aplikacji.
  en: |
    The change calls for a review, because recycling a pool is an interruption -
    short, but real. The new process has to start and load the application, and
    requests wait meanwhile.

    What hurts most is what the process holds inside. Sessions kept in process
    memory are lost, that is, users are logged out at a random moment - including
    in the middle of filling in a form. An application with sessions in a
    database or in a state service does not have that problem, so before the
    change it has to be established which case this is.

    The second matter is timing. Recycling at a fixed interval counts from the
    pool s start, so on a long-running server it lands at random hours of the
    day, peak hours included. Recycling at an appointed hour of the night is
    usually the better choice - this item sets the interval, though, because that
    is the setting inherited by every pool, while a nightly schedule tends to be
    specific to one application.

implementation_consequences:
  impact_areas:
    - web-server-services
  what_breaks:
    pl:
      - Sesje przechowywane w pamięci procesu przepadają przy każdym przetoczeniu, więc użytkownicy zostają wylogowani w losowym momencie
      - Żądania obsługiwane w chwili przetoczenia czekają na start nowego procesu, co przy ciężkiej aplikacji bywa zauważalne
      - Odstęp liczy się od startu puli, więc na serwerze pracującym długo przetoczenie trafia w losową porę doby, w tym w szczyt
      - Zadania działające wewnątrz aplikacji w tle zostają przerwane i wznawiają się dopiero, gdy nowy proces je uruchomi
      - Pamięć podręczna zbudowana w procesie zostaje odtworzona od zera, więc pierwsze żądania po przetoczeniu są wolniejsze
    en:
      - Sessions kept in process memory are lost at every recycle, so users are logged out at a random moment
      - Requests being served at the moment of the recycle wait for the new process to start, which on a heavy application is noticeable
      - The interval counts from the pool s start, so on a long-running server the recycle lands at a random hour, peak included
      - Jobs running in the background inside the application are interrupted and resume only once the new process starts them
      - A cache built inside the process is rebuilt from nothing, so the first requests after a recycle are slower
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Aplikacje przechowujące sesje w pamięci procesu, dopóki stan sesji nie zostanie przeniesiony do bazy lub usługi
      - Pule z wyznaczonym przetaczaniem o godzinie nocnej, gdzie dodatkowy odstęp wprowadziłby drugie przetoczenie w ciągu dnia
      - Aplikacje wykonujące długie operacje w jednym żądaniu, przerwane przez zamknięcie procesu
    en:
      - Applications keeping sessions in process memory, until session state has been moved to a database or a service
      - Pools with an appointed nightly recycle, where an added interval would bring a second recycle during the day
      - Applications performing long operations within a single request, cut off by the process shutting down
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/recycling/periodicRestart' `
            -Name 'time' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          else {
            # The cmdlet hands this back as a span of time, but the same value read
            # from a raw configuration file arrives as text or as a count of
            # ticks. All three shapes are reduced to one span before comparing -
            # casting a span straight to a number throws, and the rule would
            # then report that it could not check rather than what it found.
            $span = $null
            if ($value -is [TimeSpan]) { $span = $value }
            elseif ($value -is [string] -and $value -match '^\d+$') { $span = [TimeSpan]::FromTicks([int64]$value) }
            elseif ($value -is [string]) { $span = [TimeSpan]::Parse($value) }
            else { $span = [TimeSpan]::FromTicks([int64]$value) }
            $minutes = [int]$span.TotalMinutes
            # Zero here means the pool is never recycled on a timer. It is named
            # rather than folded into the comparison, where it would come out as
            # a value comfortably below the threshold.
            if ($minutes -le 0) { 'NO_RECYCLING' }
            elseif ($minutes -le 1440) { 'WITHIN_LIMIT' }
            else { 'OVER_LIMIT ' + $minutes }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/recycling/periodicRestart' `
      -Name 'time' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    $span = $null
    if ($value -is [TimeSpan]) { $span = $value }
    elseif ($value -is [string] -and $value -match '^\d+$') { $span = [TimeSpan]::FromTicks([int64]$value) }
    elseif ($value -is [string]) { $span = [TimeSpan]::Parse($value) }
    elseif ($null -ne $value) { $span = [TimeSpan]::FromTicks([int64]$value) }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.applicationHost/applicationPools/applicationPoolDefaults/recycling/periodicRestart'
      name    = 'time'
      ticks   = [string]($span.Ticks)
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/recycling/periodicRestart' `
      -Name 'time' -Value ([TimeSpan]::FromHours(24))

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value ([TimeSpan]::FromTicks([int64]$b.ticks))
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/applicationpools/add/recycling/periodicrestart/

notes:
  pl: |
    Punkt rozstrzyga o odstępie czasu, nie o harmonogramie. Przetaczanie
    o wyznaczonej godzinie nocnej jest zwykle lepsze i można je ustawić obok —
    ten odczyt go nie zobaczy, bo pyta wyłącznie o odstęp.

    Zapis obejmuje ustawienia domyślne pul. Pula z własnym ustawieniem
    przetaczania wymaga poprawki na swoim poziomie.
  en: |
    The item settles the interval, not the schedule. Recycling at an appointed
    hour of the night is usually better and can be set alongside - this reading
    will not see it, as it asks only about the interval.

    The setting covers the pool defaults. A pool with a recycling setting of its
    own calls for a correction at its own level.
