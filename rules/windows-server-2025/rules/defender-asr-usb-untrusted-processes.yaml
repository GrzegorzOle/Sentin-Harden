id: win2025-defender-asr-usb-untrusted-processes

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania niepodpisanych programów z nośników wymiennych
    en: Untrusted and unsigned processes from removable media blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła blokuje uruchomienie z nośnika wymiennego programu, który
    nie jest podpisany ani uznany za zaufany.

    Obniżam tu kategorię i chcę powiedzieć dlaczego, bo jest to jedno
    z wyraźniejszych obniżeń w tej paczce.

    Punkt broni przed wzorcem, którego istotą jest człowiek przy
    maszynie. Ktoś znajduje nośnik, ktoś go podłącza, ktoś uruchamia
    z niego program. Na stanowisku roboczym cała ta sekwencja jest
    codziennością i reguła ma tam realną treść. Na serwerze w zamkniętej
    serwerowni nie ma pierwszych dwóch ogniw — nikt tam nie chodzi
    i nikt niczego nie podłącza między jednym a drugim przeglądem
    sprzętu.

    Kategoria niska nie znaczy, że punkt jest bez wartości. Znaczy, że
    napastnik zyskuje tu niewiele, bo żeby cokolwiek zyskać, musi
    najpierw wejść do pomieszczenia, w którym stoi maszyna. Kto to
    potrafi, ma do dyspozycji rzeczy skuteczniejsze niż niepodpisany
    program na pendrivie.

    Wyjątkiem jest serwer terminalowy i każda maszyna, przy której
    faktycznie siadają ludzie. Tam wraca pełna treść reguły, bo wracają
    wszystkie trzy ogniwa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    przy fizycznym dostępie do maszyny — możliwość uruchomienia
    własnego, niepodpisanego programu prosto z nośnika.
  en: |
    The rule blocks the running from a removable medium of a program that is neither signed nor
    held trusted.

    I lower the category here and mean to say why, it being one of the plainer lowerings in this
    pack.

    The item guards against a pattern whose kernel is a person at the machine. Somebody finds a
    medium, somebody plugs it in, somebody runs a program off it. At a working station that whole
    string is an everyday thing and the rule has there a real substance. On a server in a shut
    server room the first two links are not - nobody walks there and nobody plugs anything in
    between one looking over of the gear and the next.

    The low category does not mean the item is without worth. It means the attacker gains here
    little, for to gain anything they must first come into the room the machine stands in. Whoever
    can do that has at hand things worthier than an unsigned program on a stick.

    The exception is a terminal server and every machine people truly sit down at. There the rule's
    full substance comes back, all three links coming back.

    What an attacker gains while the item goes unmet: at bodily access to the machine - the means
    of running their own unsigned program straight off a medium.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedna rzecz i nie jest nią praca codzienna, tylko
    serwis.

    Na serwerze nośnik wymienny podłącza się prawie wyłącznie przy
    czynnościach serwisowych, a te wyglądają dokładnie tak, jak wzorzec
    blokowany przez tę regułę. Inżynier producenta przyjeżdża
    z pendrivem, na którym ma narzędzie do aktualizacji oprogramowania
    kontrolera macierzy, sterownika karty albo oprogramowania
    wewnętrznego płyty. Narzędzia te bywają niepodpisane, bo pochodzą
    z wewnętrznego zaplecza producenta, a nie z jego kanału
    dystrybucyjnego.

    Podobnie wygląda zbieranie danych diagnostycznych przy awarii oraz
    stawianie maszyny od nowa z nośnika przygotowanego na miejscu.

    Objaw pojawi się w najgorszym możliwym momencie: podczas awarii,
    przy obcej osobie, pod presją czasu. To jest dokładnie ten moment,
    w którym ktoś wyłączy zabezpieczenie w całości, zamiast szukać
    właściwego wyłączenia — i już go nie włączy z powrotem.

    Dlatego zostawiam tę regułę poza trybem zbiorczym mimo niskiej
    kategorii. Nie dlatego, że przeszkadza w pracy codziennej, ale
    dlatego, że przeszkadza w serwisie, a skutkiem bywa trwałe
    wyłączenie czegoś większego.

    Praktyczny wniosek: uzgodnij z obsługą, jak ma wyglądać serwis po
    zmianie, zanim zmiana wejdzie. Dziesięć minut rozmowy teraz jest
    tańsze niż decyzja podjęta przy otwartej obudowie.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    One thing needs checking and it is not the daily work but the service.

    On a server a removable medium is plugged in all but only at deeds of service, and those look
    exactly like the pattern this rule blocks. The maker's engineer comes with a stick whereon they
    have a tool for the freshening of the software of an array's controller, of a card's driver, or
    of the board's inner software. Such tools are at times unsigned, coming as they do from the
    maker's inner workings and not from their channel of dealing out.

    The like holds of the gathering of readings of diagnosis at a fault, and of the setting up of a
    machine anew from a medium made ready on the spot.

    The symptom will show at the worst moment there is - in the course of a fault, before a
    stranger, under the press of time. That is exactly the moment somebody switches a guard off
    wholly rather than seek the right leaving out - and never switches it back on.

    Therefore I leave this rule outside the bulk mode despite the low category. Not because it
    hinders the daily work, but because it hinders the service, and the outcome is at times the
    lasting switching off of something greater.

    The working conclusion - settle with the staff how the service is to look after the change,
    before the change comes in. Ten minutes of speaking now is cheaper than a decision made before
    an open casing.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Narzędzie serwisowe producenta uruchamiane z pendrive'a może zostać zablokowane
      - Aktualizacja oprogramowania wewnętrznego sprzętu z nośnika przygotowanego na miejscu nie ruszy
      - Zbieranie danych diagnostycznych przy awarii narzędziem z nośnika przestanie działać
      - Objaw pojawi się podczas awarii, przy obcej osobie i pod presją czasu
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - A maker's tool of service run off a stick may be blocked
      - The freshening of gear's inner software from a medium made ready on the spot will not start
      - The gathering of readings of diagnosis at a fault by a tool off a medium will stop working
      - The symptom will show in the course of a fault, before a stranger and under the press of time
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwis sprzętu na tej maszynie odbywa się narzędziami niepodpisanymi uruchamianymi z nośnika
      - Nie uzgodniono z obsługą, jak ma wyglądać serwis po wprowadzeniu tej blokady
    en:
      - The service of gear on this machine is done by unsigned tools run off a medium
      - It was not settled with the staff how the service is to look after this blocking comes in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Service of the gear is what this strikes on a server, not the daily work.
    # Settle with the staff how service is to look before setting this.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Obniżyłem kategorię, bo wzorzec, przed którym ta reguła broni, ma
    w środku człowieka przy maszynie. Na serwerze w zamkniętej
    serwerowni brakuje dwóch pierwszych ogniw tej sekwencji. Kto potrafi
    wejść do tego pomieszczenia, ma do dyspozycji rzeczy skuteczniejsze
    niż program na pendrivie.

    Reguła zostaje jednak poza trybem zbiorczym, i to jest tu rzecz
    ważniejsza od kategorii. Na serwerze nośnik podłącza się przy
    serwisie, a narzędzia serwisowe producentów bywają niepodpisane.
    Objaw pojawi się podczas awarii, przy obcej osobie i pod presją
    czasu — czyli w momencie, w którym ktoś wyłączy zabezpieczenie
    w całości i już go nie włączy z powrotem.

    Pełna treść reguły wraca na serwerze terminalowym.
  en: |
    I lowered the category, the pattern this rule guards against having a person at the machine
    within it. On a server in a shut server room the first two links of that string are wanting.
    Whoever can come into that room has at hand things worthier than a program on a stick.

    The rule stays outside the bulk mode for all that, and that is here weightier than the
    category. On a server a medium is plugged in at the service, and makers' tools of service are
    at times unsigned. The symptom will show in the course of a fault, before a stranger and under
    the press of time - that is, at the moment somebody switches a guard off wholly and never
    switches it back on.

    The rule's full substance comes back on a terminal server.
