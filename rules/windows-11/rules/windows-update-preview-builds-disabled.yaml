id: win11-windows-update-preview-builds-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Instalowanie wydań przedpremierowych systemu zablokowane
    en: Installing of pre-release system builds blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy maszyna może przejść na wydania przedpremierowe
    systemu — wersje rozsyłane przed publikacją, żeby sprawdzić je w praktyce.

    Wydanie przedpremierowe nie jest wersją gorszą w potocznym sensie. Jest
    wersją, wobec której nie zakończono sprawdzania, i to rozróżnienie jest
    tu całą treścią punktu. Znaczy ono trzy rzeczy naraz.

    Po pierwsze, poprawki bezpieczeństwa dla takiej wersji wychodzą w innym
    rytmie niż dla wydania publicznego, a bywa, że nie wychodzą wcale, bo
    kolejne wydanie przedpremierowe zastępuje poprzednie. Maszyna może więc
    stać przez dłuższy czas na wersji z opisaną i niezałataną podatnością.

    Po drugie, opisy zagrożeń, reguły wykrywania i narzędzia audytu są pisane
    pod wydania publiczne. Maszyna na wersji przedpremierowej bywa dla nich
    nierozpoznawalna albo wynik jej sprawdzenia jest niepewny.

    Po trzecie, wersje przedpremierowe zawierają składniki włączone tymczasowo
    do zbierania danych o działaniu systemu — w szerszym zakresie niż wydanie
    publiczne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno, w którym
    maszyna stoi na kodzie mniej sprawdzonym, gorzej opisanym i nierówno
    łatanym, a sprawdzenie zgodności tego nie pokazuje.

    Punkt jest o przewidywalności, nie o jakości: stan maszyny ma być stanem,
    dla którego istnieją poprawki i opisy.
  en: |
    The setting settles whether the machine may move to pre-release builds of the system -
    versions sent out before publication so as to be tried in practice.

    A pre-release build is not a worse version in the everyday sense. It is a version
    whose checking has not been finished, and that distinction is here the item's whole
    content. It means three things at once.

    First, security fixes for such a version come out on a different rhythm than for a
    published build, and sometimes do not come out at all, because the next pre-release
    build replaces the last. The machine may therefore stand for a long while on a version
    with a described and unpatched weakness.

    Second, threat descriptions, detection rules and audit tools are written for published
    builds. A machine on a pre-release version is sometimes unrecognisable to them, or the
    result of checking it is uncertain.

    Third, pre-release versions hold components switched on for a time to gather data on
    the system's working - in a wider range than a published build.

    What an attacker gains while the item goes unmet: a window in which the machine stands
    on code less checked, worse described and unevenly patched, and a compliance check
    does not show it.

    The item is about predictability, not quality: the machine's state is to be a state
    for which fixes and descriptions exist.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna nie jest jedną z tych, które celowo
    stoją na wydaniu przedpremierowym — bo takie maszyny istnieją i mają
    powód.

    Na stanowisku zwykłym zmiana nie zmienia niczego. Wydania przedpremierowe
    nie są udostępniane samoczynnie; trzeba zgłosić maszynę do programu, więc
    na maszynie, której nikt nie zgłosił, zasada tylko zamyka drogę, z której
    nie korzystano.

    Skutek pojawia się tam, gdzie maszyna jest w programie świadomie: na
    stanowisku testowym, na którym sprawdza się aplikacje przed wydaniem
    kolejnej wersji systemu. Po zmianie maszyna przestanie otrzymywać kolejne
    wydania przedpremierowe i zatrzyma się na tym, które ma.

    Warto wiedzieć, że reguła nie cofa maszyny do wydania publicznego. Maszyna
    stojąca na wersji przedpremierowej na niej pozostanie — zejście z niej
    wymaga osobnej czynności, a czasem ponownej instalacji systemu.

    Zmiana nie wymaga restartu. Aktualizacje publiczne przychodzą dalej bez
    zmiany.
  en: |
    What needs checking is whether the machine is not one of those deliberately standing
    on a pre-release build - since such machines exist and have a reason.

    At an ordinary station the change changes nothing. Pre-release builds are not offered
    of themselves; the machine has to be entered in the programme, so on a machine nobody
    entered the policy only closes a route that was not used.

    The effect appears where the machine is in the programme knowingly: at a test station
    where applications are checked before the next version of the system is published.
    After the change the machine will stop receiving further pre-release builds and will
    stop at the one it has.

    It is worth knowing that the rule does not take the machine back to a published build.
    A machine standing on a pre-release version will stay on it - coming down from it
    takes a separate act, and sometimes a fresh installation of the system.

    The change takes no restart. Published updates come on unchanged.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Maszyna przestaje otrzymywać kolejne wydania przedpremierowe systemu
      - Stanowisko testowe traci możliwość sprawdzania aplikacji przed wydaniem wersji systemu
      - Maszyna stojąca już na wersji przedpremierowej na niej pozostaje
      - Aktualizacje publiczne przychodzą dalej bez zmiany
    en:
      - The machine stops receiving further pre-release builds of the system
      - A test station loses the means of checking applications before a system version is published
      - A machine already standing on a pre-release version stays on it
      - Published updates come on to the machine unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem testowym sprawdzającym aplikacje przed wydaniem wersji systemu
      - Zgłoszenie maszyny do programu wydań przedpremierowych było świadomą decyzją
    en:
      - The machine is a test station checking applications before a system version is published
      - Entering the machine in the pre-release programme was a conscious decision
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The policy switched off writes 1 here; 2 means pre-release builds are
      # managed and allowed.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ManagePreviewBuildsPolicyValue'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $current = (Get-ItemProperty -Path $path -Name 'ManagePreviewBuildsPolicyValue' -ErrorAction SilentlyContinue).'ManagePreviewBuildsPolicyValue'
    [pscustomobject]@{
      path        = $path
      name        = 'ManagePreviewBuildsPolicyValue'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ManagePreviewBuildsPolicyValue' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-servicing-channels-windows-10-updates

notes:
  pl: |
    Wartości w tym miejscu nie da się odczytać intuicyjnie: jedynka oznacza
    zasadę wyłączoną, czyli wydania przedpremierowe zablokowane, a dwójka —
    zasadę włączoną wraz z wyborem, jak szybko mają przychodzić. Stan zgodny
    to jedynka.

    Brak wartości nie jest stanem zgodnym. Bez ustawienia decyzja należy do
    użytkownika z uprawnieniami administratora, który może zgłosić maszynę do
    programu sam.

    Punkt tworzy zestaw z pozostałymi regułami dotyczącymi tego, co maszyna
    przyjmuje jako aktualizację. Wyniki warto czytać razem, bo opisują jedną
    rzecz: czy stan maszyny jest przewidywalny, czy zależy od decyzji
    podejmowanych na miejscu.
  en: |
    The value in this place cannot be read intuitively: a one means the policy switched
    off, that is, pre-release builds blocked, while a two means the policy switched on
    together with a choice of how fast they are to come. The compliant state is one.

    A missing value is not a compliant state. With no setting the decision belongs to a
    user with administrator rights, who may enter the machine in the programme themselves.

    The item forms a set with the other rules about what the machine takes as an update.
    The results are worth reading together, since they describe one thing: whether the
    machine's state is predictable or depends on decisions made on the spot.
