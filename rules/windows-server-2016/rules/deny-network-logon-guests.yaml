id: win2016-deny-network-logon-guests

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa dostępu z sieci dla grupy Goście
    en: Access from the network refused to the Guests group
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wpisuje grupę Goście na listę kont, którym odmawia się dostępu do tej
    maszyny z sieci.

    Odmowa jest tu czymś innym niż brak zgody i ta różnica jest sednem punktu.
    Uprawnienia w systemie sumują się: konto należące do dwóch grup dostaje
    uprawnienia obu. Odmowa łamie tę zasadę — jest silniejsza od każdej zgody
    i działa niezależnie od tego, ile innych grup daje dostęp.

    Praktyczny skutek jest taki, że wpis ten działa również wtedy, gdy ktoś
    w przyszłości doda grupę Goście do grupy uprawnionej. Sama reguła o wyłączeniu
    konta gościa tego nie zapewnia, bo konto da się włączyć z powrotem jednym
    poleceniem.

    Kategoria wysoka, bo dostęp z sieci jest tą drogą, która nie wymaga obecności
    przy maszynie. Serwer 2016 pełniący rolę serwera plików udostępnia zasoby
    dokładnie tym kanałem.

    Na maszynach tego rocznika warto pamiętać, skąd bierze się dostęp gościa:
    odrzucone poświadczenie bywa ponawiane jako połączenie gościa, jeżeli maszyna
    na to pozwala. Ten punkt zamyka drugą połowę tej drogi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do zasobów
    sieciowych maszyny bez żadnego poświadczenia, o ile konto gościa zostanie
    kiedykolwiek włączone.
  en: |
    The item puts the Guests group onto the list of accounts refused access to this
    machine from the network.

    A refusal is something other than an absence of permission, and that difference
    is the heart of the item. Rights in the system add up: an account belonging to
    two groups receives the rights of both. A refusal breaks that principle - it is
    stronger than any permission and works regardless of how many other groups
    grant access.

    The practical effect is that this entry works even if somebody later adds the
    Guests group to a permitted group. The rule disabling the guest account does not
    secure that, because the account can be switched back on with one command.

    The category is high, because access from the network is the road that needs no
    presence at the machine. A Server 2016 in the file server role shares its
    resources by exactly that channel.

    On machines of this vintage it is worth remembering where guest access comes
    from: a refused credential is sometimes retried as a guest connection, if the
    machine permits it. This item closes the second half of that road.

    What an attacker gains while the item goes unmet: access to the machine's
    network resources with no credential at all, should the guest account ever be
    switched on.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Grupa Goście nie jest używana do niczego, co
    działa, a konto gościa jest domyślnie wyłączone.

    Jedyny przypadek wymagający uwagi to maszyna, na której dostęp gościa
    został kiedyś włączony celowo — zwykle po to, żeby urządzenie
    wielofunkcyjne albo stare oprogramowanie mogło zapisać plik na udziale bez
    podawania hasła. Taka konfiguracja nadal się zdarza na serwerach z czasów
    wdrożenia i po tej zmianie przestanie działać.

    Rozwiązaniem nie jest cofnięcie zmiany, tylko konto usługowe dla
    urządzenia. Zajmuje to kwadrans i zostawia ślad w dzienniku, którego
    połączenie gościa nie zostawia.

    Czego to nie psuje: dostępu kont uwierzytelnionych, udostępniania plików,
    pracy domeny ani zarządzania zdalnego.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The Guests group is used for nothing that works,
    and the guest account is disabled by default.

    The one case needing attention is a machine where guest access was once
    switched on deliberately - usually so that a multifunction device or old
    software could write a file to a share without giving a password. Such a setup
    still turns up on servers from the time of deployment, and after this change it
    will stop working.

    The answer is not to undo the change but a service account for the device. That
    takes a quarter of an hour and leaves a trace in the log that a guest
    connection does not.

    What this does not break: access by authenticated accounts, file sharing, the
    domain's work, or remote management.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Urządzenie wielofunkcyjne zapisujące na udziale bez hasła traci dostęp do maszyny
      - Stare oprogramowanie korzystające z połączenia gościa przestaje sięgać po zasoby sieciowe
      - Odmowa działa także wtedy, gdy ktoś w przyszłości doda grupę Goście do grupy uprawnionej
      - Dostęp kont uwierzytelnionych, udostępnianie plików i praca domeny działają bez zmian
    en:
      - A multifunction device writing to a share without a password loses access to the machine
      - Old software using a guest connection stops reaching network resources
      - The refusal works even if somebody later adds the Guests group to a permitted group
      - Access by authenticated accounts, file sharing and the domain's work go on unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na udziale tej maszyny zapisuje urządzenie albo oprogramowanie korzystające z połączenia gościa i nie przygotowano dla niego konta usługowego
    en:
      - A device or software using a guest connection writes to this machine's share and no service account has been prepared for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'S-1-5-32-546'
  comparison: contains

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyNetworkLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    if (-not ($members -contains '*S-1-5-32-546')) { $members += '*S-1-5-32-546' }

    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyNetworkLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyNetworkLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-access-to-this-computer-from-the-network

notes:
  pl: |
    Odmowa jest silniejsza od zgody i to jest cały mechanizm tego punktu.
    Dlatego wpis działa trwale, niezależnie od późniejszych zmian członkostwa
    w grupach — a reguła o wyłączeniu konta gościa takiej trwałości nie daje.

    Polecenie naprawcze dopisuje grupę do listy, zamiast listę zastępować.
    Zastąpienie odebrałoby odmowę komuś, komu ją wcześniej świadomie nadano,
    a odmowa zdjęta po cichu jest gorsza niż jej brak od początku.

    Punkt warto czytać razem z regułą o dostępie z sieci ograniczonym do
    administratorów i użytkowników uwierzytelnionych. Ta mówi, komu się
    odmawia; tamta, komu się pozwala.
  en: |
    A refusal is stronger than a permission, and that is the whole mechanism of
    this item. The entry therefore holds regardless of later changes to group
    membership - and the rule disabling the guest account gives no such permanence.

    The remedy adds the group to the list rather than replacing the list. Replacing
    it would take the refusal from somebody it had been granted against
    deliberately, and a refusal quietly lifted is worse than one never set.

    The item is worth reading together with the rule on network access restricted
    to administrators and authenticated users. This one says who is refused; that
    one, who is permitted.
