id: win2025-routing-and-remote-access-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa routingu i dostępu zdalnego wyłączona
    en: The routing and remote access service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę routingu i dostępu zdalnego. Usługa ta pozwala
    maszynie trasować ruch między sieciami oraz przyjmować połączenia
    zestawiane z zewnątrz do sieci wewnętrznej.

    Zostawiam kategorię wysoką i chcę wskazać, co ją tutaj wyznacza.
    Nie to, że usługa nasłuchuje — nasłuchuje wiele rzeczy w tej paczce.
    To, że stanowi wejście do sieci, a nie do maszyny. Napastnik, który
    przejdzie przez tę drogę, nie zyskuje jednego serwera. Zyskuje adres
    wewnątrz sieci wewnętrznej i wszystko, co z takiego adresu widać.

    Druga rzecz, mniej oczywista: usługa ta obsługuje uwierzytelnianie
    połączeń przychodzących i w swojej historii niesie wiele mechanizmów
    starszych, dopuszczonych po to, by wpuścić klientów, których już nie
    ma. Ustawienie pozostawione kiedyś dla jednego urządzenia obowiązuje
    dalej dla wszystkich.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    wnętrza sieci, a nie do pojedynczej maszyny, często bronioną
    mechanizmem uwierzytelniania dopuszczonym dla klienta, którego już
    nikt nie używa.
  en: |
    The item switches off the service of routing and of the far-off reach. That service lets the
    machine steer traffic between nets and take bindings set up from without into the inner net.

    I leave the category high and would name what here marks it out. Not that the service listens -
    many things in this pack listen. That it stands as a way into the net and not into the machine. An
    attacker who comes over by that road wins no one server. They win a whereabouts within the inner
    net and all that is seen from such a whereabouts.

    The second thing, less plain - that service works the knowing of bindings that come in and bears
    in its story many older workings, let in so that clients might be taken in that are no more. A
    setting left once for one device holds on for all.

    What an attacker gains while the item goes unmet - a road into the inwards of the net and not into
    a single machine, often warded by a working of knowing let in for a client nobody uses any more.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia wobec oceny dla stacji
    roboczej, bo na serwerze jest to dokładnie ten przypadek, który
    opisałem przy pulpicie zdalnym: usługa, która bywa rolą.

    Na stacji roboczej nikt nie trasuje ruchu. Na serwerze ta usługa
    stoi za bramą połączeń zdalnych dla pracowników, za stałym łączem
    między oddziałami, za translacją adresów dla mniejszej lokalizacji.
    Tam, gdzie działa, jest tym, po co maszynę postawiono — i wtedy
    prawidłowym wynikiem pracy z tą regułą jest zapisany wyjątek
    z uzasadnieniem i datą przeglądu, a nie naprawa.

    Skutek zatrzymania jest natychmiastowy i szeroki. Rozłączają się
    wszystkie połączenia zdalne naraz, a więc wszyscy pracujący spoza
    biura jednocześnie. Zrywa się łącze między oddziałami, a wtedy
    przestają działać rzeczy, które z połączeniem zdalnym nie kojarzą się
    wcale: udziały plików, drukarki, uwierzytelnianie w drugiej
    lokalizacji.

    Jest też przypadek najostrzejszy i trzeba go powiedzieć wprost.
    Jeżeli sam wykonujesz tę regułę przez połączenie zestawione właśnie
    przez tę bramę, rozłączysz siebie razem ze wszystkimi — i wrócisz
    dopiero drogą, której na tę okoliczność nie sprawdzałeś.

    Zmiana cofa się natychmiast, ale cofnąć ją musi ktoś, kto jest
    po właściwej stronie bramy.
  en: |
    I raise the class to a witting rolling out against the reckoning for a workstation, it being upon
    a server just that case I set forth at the far-off board - a service that at times is the role.

    Upon a workstation nobody steers traffic. Upon a server that service stands behind the gate of
    far-off bindings for those who work, behind a standing link between outposts, behind the turning
    about of whereabouts for a lesser stead. Where it works, it is that for which the machine was set
    up - and then the right outcome of the work with this rule is a written-down exception with a
    standing by it and a day of looking over, and not a mending.

    The outcome of the stopping is at once and broad. All the far-off bindings are unbound at once,
    and so all who work from outside the house at the same hour. The link between outposts is broken
    off, and then there stop working things that call far-off bindings not at all to mind - shares of
    files, printers, the knowing of people in the other stead.

    There is also the sharpest case and it must be said plainly. If you carry out this rule yourself
    over a binding set up through that very gate, you will unbind yourself along with everyone - and
    you will come back only by a road you looked not to against this hap.

    The change is undone at once, but it must be undone by somebody who is on the right side of the
    gate.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Rozłączają się naraz wszystkie połączenia zdalne, a więc wszyscy pracujący spoza biura
      - Zrywa się stałe łącze między oddziałami, a razem z nim ruch do drugiej lokalizacji
      - Przestają działać udziały plików, drukarki i uwierzytelnianie w drugiej lokalizacji
      - Wykonanie reguły przez połączenie zestawione tą bramą rozłącza wykonującego razem ze wszystkimi
      - Tam, gdzie usługa jest rolą maszyny, prawidłowym wynikiem jest zapisany wyjątek, a nie naprawa
    en:
      - All the far-off bindings are unbound at once, and so all who work from outside the house
      - The standing link between outposts is broken off
      - Shares of files, printers and the knowing of people in the other stead stop working
      - The carrying out of the rule over a binding set up through that gate unbinds the doer along with everyone
      - Where the service is the machine's role, the right outcome is a written-down exception and not a mending
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest bramą połączeń zdalnych dla pracowników albo końcem łącza między oddziałami
      - Regułę wykonuje się przez połączenie zestawione właśnie przez tę bramę
    en:
      - The machine is the gate of far-off bindings for those who work, or the end of a link between outposts
      - The rule is being carried out over a binding set up through that very gate
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Every remote connection drops at once, and any site-to-site link with it.
    # If this machine is the gateway you are connected through, this command
    # disconnects you along with everyone else.
    Stop-Service -Name 'RemoteAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RemoteAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/remote-access

notes:
  pl: |
    Kategorii nie wyznacza to, że usługa nasłuchuje — nasłuchuje wiele
    rzeczy w tej paczce. Wyznacza ją to, że stanowi wejście do sieci,
    a nie do maszyny. Napastnik nie zyskuje jednego serwera, tylko adres
    wewnątrz sieci wewnętrznej i wszystko, co z niego widać.

    Mniej oczywiste: usługa niesie wiele starszych mechanizmów
    uwierzytelniania, dopuszczonych po to, by wpuścić klientów, których
    już nie ma. Ustawienie zostawione kiedyś dla jednego urządzenia
    obowiązuje dalej dla wszystkich.

    Kolejny przypadek usługi, która bywa rolą — tam prawidłowym wynikiem
    jest zapisany wyjątek, nie naprawa.
  en: |
    What marks the category out is not that the service listens - many things in this pack listen. It
    is that it stands as a way into the net and not into the machine. An attacker wins no one server
    but a whereabouts within the inner net and all that is seen from it.

    Less plain - the service bears many older workings of knowing, let in so that clients might be
    taken in that are no more. A setting left once for one device holds on for all.

    Another case of a service that at times is the role - there the right outcome is a written-down
    exception and not a mending.
