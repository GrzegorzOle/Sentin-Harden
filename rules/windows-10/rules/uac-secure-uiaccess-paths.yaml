id: win10-uac-secure-uiaccess-paths

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Programy o dostępie do cudzych okien tylko z miejsc chronionych
    en: Programs reaching into other windows only from guarded places
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby program deklarujący dostęp do okien innych
    programów leżał w katalogu, do którego użytkownik nie może pisać.

    Chodzi o osobne uprawnienie, odrębne od podniesienia uprawnień.
    Program, który je deklaruje, może czytać zawartość cudzych okien,
    wysyłać do nich zdarzenia i rysować ponad nimi — również ponad oknami
    procesów działających z prawami wyższymi niż jego własne. Mechanizm
    powstał dla narzędzi udostępniających ekran i dla oprogramowania
    wspomagającego pracę osób z niepełnosprawnościami.

    Bez tego ustawienia takie uprawnienie może zadeklarować program leżący
    gdziekolwiek — także w katalogu pobrań albo w profilu użytkownika.
    Znaczy to, że plik podmieniony przez kogoś, kto ma prawo pisać tylko
    we własnym profilu, dostaje dostęp do okien procesów, do których nie ma
    żadnych praw.

    Wymaganie katalogu chronionego zamyka tę drogę bez ruszania samego
    mechanizmu. Program, który to uprawnienie faktycznie musi mieć, zostaje
    zainstalowany tam, gdzie instaluje się programy — czyli w miejscu,
    którego podmiana wymaga uprawnień administratora.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    okien procesów uprzywilejowanych z pliku położonego w katalogu, do
    którego ma prawo zapisu.
  en: |
    The setting calls for a program declaring access to other programs' windows to lie in a directory the user
    cannot write to.

    What is at issue is a separate right, distinct from elevation. A program declaring it may read the contents
    of other windows, send events into them and draw over them - over the windows of processes running with
    rights higher than its own as well. The mechanism came about for tools sharing a screen and for software
    helping people with disabilities work.

    Without this setting such a right may be declared by a program lying anywhere at all - in the downloads
    directory or inside the user's profile. That means a file swapped by somebody whose writing rights reach no
    further than their own profile gets access to the windows of processes they have no rights to whatever.

    Calling for a guarded directory closes that road without touching the mechanism itself. A program that must
    truly have the right gets installed where programs are installed - which is to say in a place whose swapping
    calls for an administrator's rights.

    What an attacker gains while the item goes unmet: access to the windows of privileged processes from a file
    lying in a directory they have writing rights to.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie to jest domyślnie włączone i reguła zwykle potwierdza stan
    zastany. Programy instalowane normalnie leżą w katalogu chronionym
    i warunek spełniają bez żadnej czynności.

    Pozostaje jeden przypadek do odnotowania, rzadki i łatwy do rozpoznania:
    narzędzie uruchamiane z profilu użytkownika albo z udziału sieciowego,
    które ma udostępniać ekran lub sterować cudzym oknem. Takie narzędzie
    przestanie dostawać to uprawnienie i objawi się to brakiem reakcji
    na jego działanie, a nie komunikatem o błędzie.

    Zwykłe programy tego uprawnienia nie deklarują w ogóle, więc zmiana
    ich nie dotyczy.

    Nie ma znanych regresji.

    Czego to nie psuje: pulpitu zdalnego systemu, logowania, aplikacji,
    drukowania, sieci, profili, instalacji nowego oprogramowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting is on by default and the rule as a rule confirms the state found. Programs installed in the
    ordinary way lie in a guarded directory and meet the condition without any act.

    One case remains to be noted, a rare one and easy to recognise: a tool run from the user's profile or from a
    network share that is to share the screen or drive somebody else's window. Such a tool will cease getting
    the right, and that will show itself as no reaction to what it does rather than as an error message.

    Ordinary programs do not declare that right at all, so the change does not touch them.

    There are no known regressions.

    What this does not break: the system's own remote desktop, logging on, applications, printing, the network,
    profiles, or the installing of new software.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - remote-management
    - user-interface
  what_breaks:
    pl:
      - Narzędzie udostępniające ekran uruchamiane z profilu użytkownika przestaje dostawać dostęp do cudzych okien
      - Program sterujący cudzym oknem, uruchamiany z udziału sieciowego, przestaje działać bez komunikatu o błędzie
      - Oprogramowanie wspomagające pracę, zainstalowane poza katalogiem chronionym, traci to samo uprawnienie
      - Programy instalowane normalnie leżą w katalogu chronionym i zmiana nie dotyczy ich w żaden sposób
      - Pulpit zdalny systemu, logowanie, drukowanie, praca sieci i profile użytkowników pozostają bez zmian
    en:
      - A screen-sharing tool run from the users profile ceases getting access to other windows
      - A program driving somebody elses window, run from a network share, ceases working without an error message
      - Assistive software installed outside a guarded directory loses the same right
      - Programs installed in the ordinary way lie in a guarded directory and the change does not touch them at all
      - The systems own remote desktop, logging on, printing, the work of the network and users profiles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje narzędzie wspomagające uruchamiane z profilu użytkownika i nie da się go przenieść
      - Obsługa zdalna tej maszyny opiera się na programie uruchamianym z udziału sieciowego
    en:
      - An assistive tool run from the users profile works on the machine and cannot be moved
      - The remote handling of this machine rests on a program run from a network share
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableSecureUIAPaths'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableSecureUIAPaths'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right stays, only the place a program may claim it from narrows. Where
    # a screen-sharing or assistive tool runs from the profile, move it into the
    # installation directory first - it will otherwise stop silently.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableSecureUIAPaths' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-only-elevate-uiaccess-applications-that-are-installed-in-secure-locations

notes:
  pl: |
    Reguła dopełnia blok kontroli konta i dotyczy uprawnienia, które łatwo
    przeoczyć, bo nie nazywa się podniesieniem. Warto, żeby aplikacja
    tłumaczyła to wprost: program z tym uprawnieniem nie dostaje praw
    administratora, tylko dostęp do okien procesów, które te prawa mają.
    Skutek bywa ten sam.

    Objaw niezgodności jest cichy i to jest jedyny koszt tej reguły.
    Narzędzie pozbawione uprawnienia nie mówi, że go nie dostało — po prostu
    nic nie robi. Warto, żeby opis skutków postawił to wprost, bo szukanie
    przyczyny zajmuje wtedy więcej czasu niż sama zmiana.
  en: |
    The rule rounds out the control block and touches a right easy to overlook, it not being called elevation.
    It is well that the application set that out plainly: a program with this right does not get an
    administrator's rights, only access to the windows of processes that have them. The consequence is at times
    the same.

    The symptom of a mismatch is quiet, and that is this rule's only cost. A tool deprived of the right does not
    say it was denied - it simply does nothing. It is well that the description of consequences put that
    outright, the looking for a cause taking then more time than the change itself.
