id: win2025-system-log-size

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > System
  title:
    pl: Maksymalny rozmiar dziennika systemowego
    en: Maximum size of the system log
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę rozmiaru dziennika systemowego. Dziennik
    ten zbiera zapisy o usługach, sterownikach, sprzęcie i zamknięciach
    systemu.

    Podnoszę kategorię wobec oceny dla stacji roboczej, choć mniej niż
    przy dzienniku zabezpieczeń, i powód jest inny niż tam. Tamten
    dziennik służy opisaniu incydentu. Ten służy odpowiedzi na pytanie,
    które na serwerze pada najczęściej ze wszystkich: dlaczego ta maszyna
    się zrestartowała.

    Serwer chodzi miesiącami i zamknięcie systemu jest na nim zdarzeniem,
    a nie codziennością. Kiedy nastąpi bez zapowiedzi, jedynym miejscem,
    w którym da się odróżnić zaplanowany restart od zaniku zasilania,
    zatrzymania przez sterownik albo zakończenia przez mechanizm
    zabezpieczający, jest właśnie ten dziennik. Jeżeli obejmuje on
    ostatnie godziny, odpowiedzi w nim nie będzie — a wtedy pierwszy
    wniosek brzmi zwykle „chyba nic się nie stało", co jest wnioskiem
    najgorszym z możliwych i wyciąganym z pustego miejsca, a nie
    z zapisu.

    Tak samo jak przy dzienniku zabezpieczeń, liczba z benchmarku jest
    dolną granicą, a nie wartością docelową. Na maszynie z wieloma rolami
    i licznymi sterownikami ten dziennik zapisuje się szybciej, niż
    podpowiada doświadczenie ze stacji roboczej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wypchnięcia z dziennika zapisów o zatrzymanych usługach
    i załadowanych sterownikach zwykłym hałasem, bez potrzeby kasowania
    czegokolwiek.
  en: |
    The item sets the lower bound of the size of the system log. That log gathers the writings upon
    services, drivers, gear and the shuttings down of the system.

    I raise the category against the reckoning for a workstation, though less than at the security log,
    and the ground is another than there. That log is for the telling of a breaking. This one is for
    the answering of the question that upon a server is asked the oftenest of all - why did that
    machine start anew.

    A server runs for months and a shutting down is upon it a happening and no everyday thing. When it
    befalls unforetold, the only stead wherein a planned starting anew may be told apart from a falling
    away of the power, a stopping by a driver or an ending by a warding working, is just that log. If
    it hold the last hours, the answer will not be in it - and then the first thought is mostly "belike
    nothing befell", which is the worst thought of all that may be had, and drawn from an empty stead
    and not from a writing.

    As at the security log, the number from the benchmark is a lower bound and no goal. Upon a machine
    with many roles and many drivers that log writes itself faster than the wont of a workstation
    betokens.

    What an attacker gains while the item goes unmet - the might of pushing out of the log the writings
    upon stopped services and loaded drivers by plain noise, with no need to wipe anything at all.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zmiana zapisuje wartość
    w polityce i nie wymaga zatrzymania niczego ani restartu.

    Koszt, tak jak przy dzienniku zabezpieczeń, jest w miejscu na dysku
    i przy wartości z benchmarku jest nieistotny. Nie umiem wskazać
    serwera, na którym te kilkadziesiąt megabajtów cokolwiek by zmieniło.

    Zastrzeżenie dotyczy tylko dobierania rozmiaru poza tę regułę:
    na maszynie z ciasno wymierzonym woluminem systemowym — a takie
    zdarzają się w maszynach wirtualnych stawianych z szablonu — warto
    spojrzeć na zapas wcześniej niż po fakcie.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease". The change writes a worth into the rule and takes neither the
    stopping of anything nor a starting anew.

    The cost, as at the security log, is in room upon the disk, and at the worth from the benchmark it
    is of no weight. I can name no server whereon those few tens of megabytes would alter anything.

    The saving bears only upon the choosing of a size beyond this rule - upon a machine with a tightly
    meted roll of the system, and such befall among the unbodily machines set up off a pattern, it is
    worth looking at the store beforehand rather than after the fact.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Zajęte zostaje dodatkowe miejsce na woluminie systemowym, przy wartości z benchmarku rzędu kilkudziesięciu megabajtów
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Na maszynie wirtualnej z ciasno wymierzonym woluminem systemowym warto spojrzeć na zapas wcześniej niż po fakcie
      - Cofnięcie zmiany nie odzyskuje zapisów nadpisanych w międzyczasie, choć zebranych nie kasuje
    en:
      - Further room upon the roll of the system is taken, at the worth from the benchmark of the order of tens of megabytes
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - Upon an unbodily machine with a tightly meted roll of the system it is worth looking at the store beforehand rather than after the fact
      - The undoing of the change wins not back the writings written over in the meanwhile, though it wipes not those gathered
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wolumin systemowy jest wymierzony bardzo ciasno i nie ma na nim zapasu na dziennik tej wielkości
    en:
      - The roll of the system is meted out very tightly and there is upon it no store for a log of that bigness
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog System -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the log that answers why the machine restarted. A floor, not a
    # target: on a machine with many roles and drivers it fills faster than
    # workstation experience suggests.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

