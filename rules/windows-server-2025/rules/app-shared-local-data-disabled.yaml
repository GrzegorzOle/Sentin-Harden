id: win2025-app-shared-local-data-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Wspólny katalog danych aplikacji dla wszystkich użytkowników wyłączony
    en: A shared application data directory for every user switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wspólny katalog danych aplikacji — miejsce, w którym
    aplikacja może trzymać pliki widoczne dla wszystkich użytkowników
    maszyny, a nie osobno dla każdego.

    Kategoria średnia i chcę nazwać, dlaczego to w ogóle jest problem, bo
    wspólny katalog brzmi jak udogodnienie. Rozdzielenie danych między konta
    nie jest szczegółem technicznym — to jest podstawa, na której stoi
    założenie, że jeden użytkownik nie czyta rzeczy drugiego. Wspólny
    katalog to założenie znosi w jednym miejscu, i to w miejscu, o którym
    nikt nie pamięta przy przeglądzie uprawnień.

    To jest właściwa treść punktu i ważne jest, że działa w obie strony.
    Odczyt: to, co jedna sesja tam zapisze, przeczyta każda inna. Zapis: co
    gorsza, każda inna może też tam napisać — a aplikacja czytająca stamtąd
    swoją konfigurację przyjmie to, co znajdzie, bez pytania, kto to
    położył.

    Na serwerze waży to więcej niż na stanowisku z jednego powodu: na
    serwerze sesje różnych osób bywają otwarte jednocześnie, a różnica
    uprawnień między nimi jest zwykle większa niż na stanowisku.

    Uwaga na wartość: nazwa wpisu jest twierdząca, więc stan pożądany jest
    zapisany zerem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce
    zapisu czytane przez sesje innych użytkowników tej maszyny, poza
    zwykłym podziałem na konta.
  en: |
    The item switches off the shared application data directory - the place
    where an application may keep files visible to every user of the machine
    rather than separately for each.

    The category is medium, and I want to name why this is a problem at all,
    because a shared directory sounds like a convenience. Separating data
    between accounts is not a technical detail - it is the foundation on
    which the assumption rests that one user does not read another's things.
    A shared directory lifts that assumption in one place, and in a place
    nobody remembers when reviewing rights.

    That is the real substance of the item, and it matters that it works both
    ways. Reading: what one session writes there, every other can read.
    Writing: worse, every other can also write there - and an application
    reading its configuration from there will take what it finds, without
    asking who put it in.

    On a server it weighs more than on a workstation for one reason: on a
    server the sessions of different people are sometimes open at once, and
    the difference in rights between them is usually greater than on a
    workstation.

    Mind the value: the entry's name is affirmative, so the desired state is
    written with a zero.

    What an attacker gains while the item goes unmet: a place to write read
    by the sessions of other users of this machine, outside the ordinary
    division into accounts.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie widzę tu nic do stracenia:
    mechanizm dotyczy aplikacji pakietowych, których na wydaniu serwerowym
    praktycznie nie ma.

    Skutek, gdyby taka aplikacja była: przestanie widzieć wspólny katalog
    i zacznie trzymać swoje dane osobno dla każdego użytkownika. Dla
    większości aplikacji to żadna różnica, bo i tak tak pracują. Różnicę
    zobaczy aplikacja, która świadomie dzieliła stan między sesjami — i to
    jest jedyny przypadek wart sprawdzenia.

    Czego to nie psuje: danych aplikacji w profilach użytkowników, klasycznych
    programów, katalogów wspólnych na dysku zakładanych ręcznie, udziałów
    sieciowych ani ról serwera. Punkt dotyczy jednego, ściśle określonego
    mechanizmu, nie współdzielenia plików w ogóle.

    Rzecz do zapamiętania: reguła zamyka dostęp do tego katalogu, ale nie
    usuwa tego, co już w nim leży. Przegląd jego zawartości jest osobną
    czynnością i warto ją wykonać, skoro i tak zaglądamy w to miejsce.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption" and on a server I see nothing to lose: the
    mechanism concerns packaged applications, which are practically absent
    from the server edition.

    The effect, were such an application present: it stops seeing the shared
    directory and begins keeping its data separately for each user. For most
    applications that is no difference, because they work that way anyway.
    The difference will be seen by an application that deliberately shared
    state between sessions - and that is the only case worth checking.

    What this does not break: application data in users' profiles, classic
    programs, shared folders on disk made by hand, network shares, or server
    roles. The item concerns one strictly defined mechanism, not the sharing
    of files in general.

    Something to remember: the rule closes access to that directory but does
    not remove what already lies in it. Reviewing its contents is a separate
    action and worth doing, since we are looking at that place anyway.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Aplikacja pakietowa przestanie widzieć wspólny katalog i zacznie trzymać dane osobno dla każdego użytkownika
      - Różnicę zobaczy tylko aplikacja, która świadomie dzieliła stan między sesjami — dla pozostałych to żadna zmiana
      - Reguła zamyka dostęp do katalogu, ale nie usuwa tego, co już w nim leży
      - Dane aplikacji w profilach, klasyczne programy, katalogi wspólne zakładane ręcznie i udziały sieciowe działają bez zmian
    en:
      - A packaged application stops seeing the shared directory and begins keeping its data separately for each user
      - Only an application that deliberately shared state between sessions will see a difference - for the rest it is no change
      - The rule closes access to the directory but does not remove what already lies in it
      - Application data in profiles, classic programs, shared folders made by hand and network shares work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja pakietowa, która świadomie dzieli stan między sesjami różnych użytkowników
    en:
      - The machine runs a packaged application that deliberately shares state between the sessions of different users
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name is affirmative, so the desired state is written with a
      # zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
      $name = 'AllowSharedLocalAppData'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
    $name = 'AllowSharedLocalAppData'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Separating data between accounts is the foundation of the assumption that
    # one user does not read another's things. The shared directory works both
    # ways: every session can read what another wrote, and can also write there,
    # while an application takes what it finds without asking who put it in.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSharedLocalAppData' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/msix/desktop/desktop-to-uwp-behind-the-scenes

notes:
  pl: |
    Wspólny katalog brzmi jak udogodnienie, a znosi w jednym miejscu
    założenie, na którym stoi podział na konta — i to w miejscu, o którym
    nikt nie pamięta przy przeglądzie uprawnień.

    Działa w obie strony. Odczyt: co jedna sesja zapisze, przeczyta każda
    inna. Zapis: każda inna może też tam napisać, a aplikacja czytająca
    stamtąd konfigurację przyjmie to, co znajdzie.

    Na serwerze waży więcej, bo sesje różnych osób bywają otwarte
    jednocześnie, a różnica uprawnień między nimi jest większa niż na
    stanowisku. Reguła zamyka dostęp, ale nie usuwa tego, co już tam leży.
  en: |
    A shared directory sounds like a convenience, yet it lifts in one place
    the assumption the division into accounts rests on - and in a place
    nobody remembers when reviewing rights.

    It works both ways. Reading: what one session writes, every other reads.
    Writing: every other can also write there, and an application reading its
    configuration from there takes what it finds.

    On a server it weighs more, because the sessions of different people are
    sometimes open at once and the difference in rights between them is
    greater than on a workstation. The rule closes access but does not remove
    what already lies there.
