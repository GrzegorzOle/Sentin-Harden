id: win2025-linguistic-data-collection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Text Input
  title:
    pl: Zbieranie materiału językowego z pisania i pisma odręcznego wyłączone
    en: Collection of language material from typing and handwriting switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza zbieranie materiału językowego z tego, co użytkownik pisze
    i kreśli — materiału przeznaczonego do wysłania poza maszynę.

    Kategoria średnia i chcę wyjaśnić, czym ten punkt różni się od
    poprzedniego, skoro oba dotyczą wpisywanego tekstu. Tamten zatrzymuje
    budowanie słownika przechowywanego lokalnie, na użytek podpowiedzi. Ten
    zatrzymuje wysyłanie próbek na zewnątrz, na użytek ulepszania
    mechanizmów rozpoznawania. Różnica jest w kierunku, a nie w przedmiocie
    — i to ona czyni te punkty osobnymi.

    To jest właściwa treść punktu. Próbka tekstu nie jest statystyką. Jest
    fragmentem tego, co ktoś rzeczywiście napisał, wyjętym z kontekstu
    i wysłanym poza organizację. Nikt nie wybiera, który fragment
    wyjdzie — a reguła „to tylko fragmenty" traci sens w chwili, gdy
    fragmentem okaże się nazwa serwera albo treść polecenia.

    Na serwerze rzecz jest krótka: nie ma powodu, żeby cokolwiek z tego, co
    wpisano w konsoli administracyjnej, wychodziło poza maszynę.

    Uwaga na ścieżkę: ten klucz leży poza gałęzią zasad, w której siedzi
    większość reguł. Ścieżka jest krótsza, niż podpowiada nawyk, i łatwo ją
    zapisać błędnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: bezpośrednio
    nic, ale fragmenty tekstu wpisywanego na tej maszynie opuszczają
    organizację, a ich dobór nie jest niczyją decyzją.
  en: |
    The item switches off the collection of language material from what a
    user types and draws - material meant to be sent outside the machine.

    The category is medium, and I want to explain how this item differs from
    the previous one, given that both concern typed text. That one stops the
    building of a dictionary kept locally, for the sake of suggestions. This
    one stops the sending of samples outwards, for the sake of improving
    recognition. The difference lies in the direction, not the subject - and
    it is what makes these items separate.

    That is the real substance of the item. A sample of text is not a
    statistic. It is a fragment of what somebody actually wrote, lifted out
    of its context and sent outside the organisation. Nobody chooses which
    fragment goes - and the rule "these are only fragments" loses its sense
    the moment a fragment turns out to be a server's name or the body of a
    command.

    On a server the matter is short: there is no reason for anything typed
    into an administrative console to leave the machine.

    Mind the path: this key lies outside the policy branch where most of the
    rules sit. The path is shorter than habit suggests and easy to write
    wrongly.

    What an attacker gains while the item goes unmet: directly nothing, but
    fragments of text typed on this machine leave the organisation, and their
    choosing is nobody's decision.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Wysyłanie próbek nie daje użytkownikowi tej
    maszyny nic, co by na niej zobaczył — korzyść, jeżeli jest, wraca
    kiedyś, do wszystkich, w kolejnym wydaniu mechanizmu rozpoznawania.
    Wyłączenie tego nie zmienia niczego w pracy.

    Czego to nie psuje: pisania, podpowiedzi zbudowanych lokalnie,
    rozpoznawania pisma odręcznego, dyktowania, sprawdzania pisowni,
    układów klawiatury ani języka interfejsu. Punkt dotyczy wyłącznie
    wysyłania materiału, nie jego używania na miejscu.

    Rzecz do zapamiętania: to jest ten z dwóch bliźniaczych punktów, który
    dotyczy wysyłki. Drugi zatrzymuje budowanie słownika lokalnego i ma
    klasę wyższą, bo jego skutek widać w podpowiedziach. Zrobienie jednego
    nie zamyka drugiego.

    Druga rzecz: klucz leży poza gałęzią zasad, więc nie szukaj go tam,
    gdzie leżą pozostałe reguły o wprowadzaniu tekstu.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption". Sending samples gives the user of this
    machine nothing they would see on it - the benefit, if there is one,
    comes back sometime, to everyone, in a later release of the recognition
    mechanism. Switching it off changes nothing in the work.

    What this does not break: typing, suggestions built locally, handwriting
    recognition, dictation, spell checking, keyboard layouts, or the
    interface language. The item covers only the sending of the material, not
    its use on the spot.

    Something to remember: this is the one of the two twin items that
    concerns sending. The other stops the building of the local dictionary
    and has a higher class, because its effect shows in the suggestions.
    Doing one does not close the other.

    A second thing: the key lies outside the policy branch, so do not look
    for it where the other rules about text input lie.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Nic w codziennej pracy — wysyłanie próbek nie daje użytkownikowi tej maszyny niczego, co by na niej zobaczył
      - Pisanie, podpowiedzi zbudowane lokalnie, rozpoznawanie pisma odręcznego i dyktowanie działają bez zmian
      - To jest ten z dwóch bliźniaczych punktów, który dotyczy wysyłki — drugi zatrzymuje budowanie słownika lokalnego
      - Klucz leży poza gałęzią zasad, więc nie szukaj go tam, gdzie leżą pozostałe reguły o wprowadzaniu tekstu
    en:
      - Nothing in daily work - sending samples gives the user of this machine nothing they would see on it
      - Typing, suggestions built locally, handwriting recognition and dictation work unchanged
      - This is the one of the two twin items that concerns sending - the other stops the building of the local dictionary
      - The key lies outside the policy branch, so do not look for it where the other rules about text input lie
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja świadomie uczestniczy w ulepszaniu mechanizmów rozpoznawania i uzgodniła to z osobami pracującymi na tej maszynie
    en:
      - The organisation deliberately takes part in improving recognition mechanisms and has agreed this with the people working on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This key sits outside the Policies\Microsoft branch - the path is
      # shorter than in most rules and it is easy to mistype.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\TextInput'
      $name = 'AllowLinguisticDataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\TextInput'
    $name = 'AllowLinguisticDataCollection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A sample of text is not a statistic: it is a fragment of what somebody
    # actually wrote, lifted out of its context and sent outside. Nobody chooses
    # which fragment goes. The key lies outside the policy branch, so the path is
    # shorter than habit suggests.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\TextInput'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowLinguisticDataCollection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Różnica wobec punktu o zbieraniu danych o wprowadzaniu tekstu jest
    w kierunku, nie w przedmiocie: tamten zatrzymuje budowanie słownika
    lokalnego, ten wysyłanie próbek na zewnątrz.

    Próbka tekstu nie jest statystyką, tylko fragmentem tego, co ktoś
    napisał, wyjętym z kontekstu. Nikt nie wybiera, który fragment wyjdzie,
    a „to tylko fragmenty" traci sens, gdy fragmentem okaże się nazwa
    serwera albo treść polecenia.

    Uwaga na ścieżkę: klucz leży poza gałęzią zasad i jest krótszy, niż
    podpowiada nawyk.
  en: |
    The difference from the item about collecting data on text input lies in
    the direction, not the subject: that one stops the building of a local
    dictionary, this one the sending of samples outwards.

    A sample of text is not a statistic but a fragment of what somebody
    wrote, lifted out of its context. Nobody chooses which fragment goes, and
    "these are only fragments" loses its sense once a fragment turns out to
    be a server's name or the body of a command.

    Mind the path: the key lies outside the policy branch and is shorter than
    habit suggests.
