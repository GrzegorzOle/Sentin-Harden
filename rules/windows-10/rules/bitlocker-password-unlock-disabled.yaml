id: win10-bitlocker-password-unlock-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Odblokowywanie dysków hasłem niedopuszczone
    en: Unlocking drives with a password inadmissible
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie nie dopuszcza odblokowywania zaszyfrowanych dysków hasłem —
    dla żadnej z trzech klas nośników.

    Hasło jest tu najsłabszym z możliwych zabezpieczeń, i to z powodu,
    który nie wynika z jego długości. Hasło do dysku jest sprawdzane poza
    systemem, więc nie obowiązuje przy nim ani blokada po nieudanych
    próbach, ani opóźnienie, ani żaden zapis. Napastnik z dyskiem w ręku
    ma nieograniczoną liczbę prób i nieograniczony czas.

    Drugi powód jest praktyczny. Hasło do dysku jest wpisywane rzadko, więc
    bywa proste, żeby dało się je zapamiętać, albo zapisane obok dysku,
    żeby nie trzeba było go pamiętać. Oba warianty są częstsze niż mocne
    hasło wpisywane z pamięci raz na kwartał.

    Zamiast hasła zostają sposoby związane z maszyną albo z przedmiotem:
    moduł sprzętowy, karta, klucz odzyskiwania. Każdy z nich wymaga czegoś
    więcej niż wiedzy.

    Odnotowuję, że punkt obejmuje trzy wartości, po jednej na klasę
    nośnika. Hasło pozostawione na którejkolwiek z nich jest drogą obejścia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zgadywania hasła do skradzionego dysku bez ograniczeń i bez śladu.
  en: |
    The setting leaves no room for the unlocking of enciphered drives with a password - for none of the three
    classes of drive.

    A password is here the weakest of possible guards, and upon a ground that does not follow from its length. A
    drive's password is checked outside the system, so no locking after failed tries holds at it, no delay and no
    writing down. An attacker with the drive in hand has an unbounded number of tries and unbounded time.

    The second ground is a practical one. A drive's password is typed seldom, so it is at times a simple one, that
    it may be called to mind, or written beside the drive, that it need not be. Both variants are commoner than a
    strong password typed from memory once a quarter.

    In a password's place remain the ways bound to the machine or to an object: the hardware module, a card, a key
    of recovery. Each of those calls for more than knowledge.

    I set down that the item takes in three values, one per class of drive. A password left upon any one of them
    is a way round.

    What an attacker gains while the item goes unmet: the guessing of a stolen drive's password without bound and
    without trace.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czym
    ludzie odblokowują dyski dzisiaj.

    Skutek dotyczy przede wszystkim nośników przenośnych. Dysk zewnętrzny
    zaszyfrowany hasłem daje się otworzyć na dowolnej maszynie — i jest to
    sposób, którego ludzie używają właśnie dlatego, że działa wszędzie.
    Po zmianie taki dysk trzeba otworzyć kluczem odzyskiwania albo kartą,
    a to wymaga obsługi albo czytnika.

    Odnotowuję, że zmiana nie odbiera dostępu do dysków już zaszyfrowanych
    hasłem. Zasada obowiązuje przy zakładaniu ochrony i przy jej zmianie,
    a nie wstecz. Dysk z dotychczasowym hasłem nadal się nim otworzy.

    Warto to powiedzieć wprost, bo tworzy stan pośredni: raport pokaże
    punkt jako spełniony, a w szufladach nadal będą leżeć dyski
    odblokowywane hasłem. Wyjście z tego stanu wymaga przeglądu nośników,
    a nie kolejnego wpisu w rejestrze.

    Czego to nie psuje: dostępu do dysków już zaszyfrowanych, pracy na
    dysku systemowym, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is what people unlock drives with today.

    The consequence touches drives that travel above all. An outside drive enciphered with a password may be
    opened upon any machine at all - and it is a way people use just because it works everywhere. After the change
    such a drive has to be opened with a key of recovery or a card, and that calls for the support or for a
    reader.

    I set down that the change takes no way from drives already enciphered with a password. The policy holds at
    the laying on of the guarding and at its changing, and not backwards. A drive with the password it had will
    still open by it.

    It is worth saying outright, making as it does a middle state: the report will show the item met while drives
    unlocked by a password still lie in the drawers. The way out of that state calls for a going through of the
    drives and not for a further entry in the registry.

    What this does not break: the way into drives already enciphered, work upon the system drive, logging on, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - accounts-and-passwords
  what_breaks:
    pl:
      - Dysk zewnętrzny zaszyfrowany po zmianie nie otworzy się hasłem na obcej maszynie
      - Otwarcie takiego dysku wymaga klucza odzyskiwania albo karty, czyli obsługi albo czytnika
      - Dyski zaszyfrowane hasłem wcześniej nadal się nim otwierają, bo zasada nie działa wstecz
      - Raport pokaże wtedy punkt jako spełniony, choć takie nośniki nadal są w użyciu
      - Dostęp do dysków już zaszyfrowanych, praca na dysku systemowym, logowanie i drukowanie pozostają bez zmian
    en:
      - An outside drive enciphered after the change will not open by a password upon a strange machine
      - The opening of such a drive calls for a key of recovery or a card, which is to say the support or a reader
      - Drives enciphered with a password earlier still open by it, the policy not working backwards
      - The report will then show the item met, though such drives are still in use
      - The way into drives already enciphered, work upon the system drive, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dyski przenośne są otwierane na maszynach spoza organizacji, gdzie nie ma ani czytnika, ani obsługi z kluczem
    en:
      - The travelling drives are opened upon machines outside the body, where there is neither a reader nor support with a key
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. All three have to be
      # at zero, and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $names = @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $names) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne 0) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'ALL_DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # All three classes of drive go in together. A password left open upon any one
    # of them is the way round, and the item would hold only where nobody looked.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      Set-ItemProperty -Path $path -Name $name -Value 0 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła obejmuje wszystkie trzy klasy nośników naraz i warto, żeby
    aplikacja to podkreśliła — bo jest w tej rodzinie wyjątkiem. Pozostałe
    punkty rozstrzygają o jednej klasie; ten zamyka hasło jako drogę wszędzie.

    Argument wart postawienia wprost dotyczy tego, dlaczego hasło do dysku
    jest słabsze od hasła do konta, mimo że wygląda tak samo. Hasło do
    konta chroni mechanizm, który liczy nieudane próby i potrafi konto
    zablokować. Hasło do dysku nie ma za sobą niczego takiego — dysk leży
    w ręku napastnika i odpowiada tyle razy, ile zostanie zapytany.

    Odnotowuję stan pośredni po wdrożeniu, bo jest tu nieunikniony.
    Zasada obowiązuje przy zakładaniu ochrony, a nie wstecz, więc raport
    zielony przy tym punkcie nie znaczy, że w organizacji nie ma dysków
    otwieranych hasłem. Aplikacja powinna powiedzieć to wprost, zamiast
    pozwolić czytelnikowi przyjąć inaczej.
  en: |
    The rule takes in all three classes of drive at once, and it is well that the application stress it - it being
    the exception of this family. The other items settle one class; this shuts the password out as a way
    everywhere.

    The argument worth putting outright touches why a drive's password is weaker than an account's, though it
    looks the same. An account's password is guarded by a mechanism that counts failed tries and can lock the
    account. A drive's password has nothing of the sort behind it - the drive lies in the attacker's hand and
    answers as many times as it is asked.

    I set down the middle state after the rollout, it being here past avoiding. The policy holds at the laying on
    of the guarding and not backwards, so a green report at this item does not mean the body has no drives opened
    by a password. The application ought to say so outright rather than let a reader take it otherwise.
