id: win2025-anonymous-sid-name-translation-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Anonimowe tłumaczenie identyfikatorów na nazwy wyłączone
    en: Anonymous translation of identifiers into names switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje zamiany identyfikatora konta na jego nazwę — i nazwy
    na identyfikator — na żądanie połączenia, które nie podało żadnych
    poświadczeń.

    Wygląda to na drobiazg techniczny i właśnie dlatego bywa pomijane.
    Rzecz w tym, że identyfikatory kont wbudowanych są przewidywalne:
    różnią się tylko przedrostkiem właściwym dla maszyny albo domeny,
    a końcówki są stałe. Napastnik, który zna przedrostek — a dostaje go
    w odpowiedzi na jedno zapytanie — może wyliczyć identyfikatory kolejno
    i zapytać o nazwę każdego z nich.

    Efektem jest pełna lista kont maszyny albo domeny, zbudowana
    identyfikator po identyfikatorze, bez korzystania z żadnego mechanizmu
    wyliczania. Zakazy wyliczania kont i udziałów tej drogi nie zamykają,
    bo tu nikt o listę nie prosi — pyta się o pojedyncze nazwy, po kolei.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obejście
    pozostałych zakazów tej grupy. Jest to droga wolniejsza, ale prowadzi
    do tego samego, a na kontrolerze domeny prowadzi do listy kont całej
    organizacji.

    Właśnie dlatego punkt należy czytać nie jako uzupełnienie, tylko jako
    warunek skuteczności pozostałych.
  en: |
    The setting bans the turning of an account's identifier into its name - and of a name
    into an identifier - at the request of a connection that has given no credentials.

    It looks a technical trifle and is for that very reason passed over. The thing is that
    built-in accounts' identifiers are foreseeable: they differ only by a prefix proper to
    the machine or the domain, and the endings are fixed. An attacker who knows the prefix -
    and gets it in answer to one query - can reckon the identifiers one after another and
    ask for the name of each.

    The result is a full list of the machine's or the domain's accounts, built identifier by
    identifier, with no use of any enumeration mechanism at all. The bans on enumerating
    accounts and shares do not close that road, since nobody asks for a list here - single
    names are asked for, one by one.

    What an attacker gains while the item goes unmet: a way round the other bans of this
    group. It is a slower road but leads to the same thing, and on a domain controller leads
    to the list of the whole organisation's accounts.

    That is exactly why the item is to be read not as a completion but as the condition of
    the others working at all.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z tłumaczenia identyfikatorów korzysta coś,
    co poświadczeń nie podaje — bo dostęp uwierzytelniony nie jest tym
    punktem objęty.

    Na serwerze członkowskim korzysta z niego niewiele i wdrożenie
    przechodzi zwykle niezauważone. Sytuacja zmienia się tam, gdzie serwer
    uczestniczy w relacji zaufania z inną domeną albo obsługuje klientów
    z domeny, z którą relacji nie ma: w takich układach tłumaczenie bywa
    wykonywane właśnie połączeniem anonimowym, bo poświadczeń po drugiej
    stronie nie ma.

    Objawem jest pokazywanie identyfikatora zamiast nazwy. Uprawnienia
    do plików i katalogów zaczynają wyświetlać się jako ciągi znaków,
    a narzędzia raportujące podają identyfikatory tam, gdzie wcześniej były
    nazwiska. Jest to objaw kosmetyczny w skutkach, ale bardzo widoczny
    i bywa zgłaszany jako awaria.

    Same uprawnienia nie zmieniają się w niczym — zmienia się wyłącznie
    to, czy da się je odczytać w postaci czytelnej bez konta.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anything not giving credentials uses the translation of
    identifiers - since authenticated access is not taken in by this item.

    On a member server little uses it and the rollout usually passes unnoticed. The
    situation changes where the server takes part in a trust relation with another domain or
    serves clients from a domain there is no relation with: in such arrangements the
    translation is at times done by an anonymous connection exactly because there are no
    credentials on the other side.

    The symptom is an identifier being shown rather than a name. Rights to files and
    directories start showing as strings of characters, and reporting tools give identifiers
    where names were before. It is a symptom cosmetic in its effects but very visible and is
    at times reported as a fault.

    The rights themselves do not change in any way - what changes is only whether they can
    be read in a legible form with no account.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - legacy-authentication
    - user-interface
  what_breaks:
    pl:
      - Uprawnienia do plików wyświetlają się jako identyfikatory zamiast nazw
      - Narzędzia raportujące bez poświadczeń podają identyfikatory zamiast nazwisk
      - Relacje z domeną, z którą nie ma zaufania, mogą przestać tłumaczyć nazwy
      - Same uprawnienia nie zmieniają się — zmienia się tylko ich czytelność bez konta
    en:
      - Rights to files show as identifiers rather than names
      - Reporting tools with no credentials give identifiers rather than names
      - Relations with a domain there is no trust with may stop translating names
      - The rights themselves do not change - only their legibility with no account does
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer obsługuje klientów z domeny, z którą nie ma relacji zaufania
      - Narzędzie raportujące tłumaczy identyfikatory bez podawania poświadczeń
    en:
      - The server serves clients from a domain there is no trust relation with
      - A reporting tool translates identifiers without giving credentials
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LSAAnonymousNameLookup\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^LSAAnonymousNameLookup\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'LSAAnonymousNameLookup'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LSAAnonymousNameLookup = 0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('LSAAnonymousNameLookup = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-allow-anonymous-sidname-translation

notes:
  pl: |
    Punkt jest w grupie anonimowej warunkiem skuteczności pozostałych,
    a nie ich uzupełnieniem. Bez niego zakazy wyliczania kont i udziałów
    da się obejść, pytając o nazwy pojedynczo, po kolejnych
    identyfikatorach. W raporcie warto to pokazać: pozostałe punkty
    spełnione obok tego niespełnionego opisują ochronę, którą da się
    przejść na piechotę.

    Ustawienie mieszka w zasadzie lokalnej, a nie w rejestrze, więc audyt
    i naprawa idą przez eksport i zapis zasady. Wymaga to uprawnień
    administratora również do samego odczytu.

    Na kontrolerze domeny zasięg jest największy, bo tłumaczone są konta
    całej domeny. Jest to zarazem rola, na której najczęściej spotyka się
    powód, żeby tego nie wyłączać — relacje z domenami, z którymi zaufania
    nie ma.
  en: |
    In the anonymous group the item is the condition of the others working rather than their
    completion. Without it the bans on enumerating accounts and shares can be got round by
    asking for names one by one, along successive identifiers. In the report that is worth
    showing: the other items met beside this one unmet describe a protection that can be
    walked through on foot.

    The setting lives in the local policy rather than in the registry, so the audit and the
    remedy go through the export and the writing of the policy. That takes administrator
    rights for the reading itself as well.

    On a domain controller the reach is the widest, since the whole domain's accounts are
    translated. It is at the same time the role on which the reason not to switch this off
    is met most often - relations with domains there is no trust with.
