id: win2016-print-rpc-listener-authentication-negotiate

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Uwierzytelnianie połączeń przychodzących podsystemu druku przez negocjację
    en: Authentication of incoming connections of the printing subsystem by negotiation
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie mówi, w jaki sposób podsystem druku uwierzytelnia maszyny,
    które się z nim łączą: przez negocjację mechanizmu czy wyłącznie
    mechanizmem domenowym.

    Punkt wymaga słowa wyjaśnienia, bo wartością wymaganą jest tu
    negocjacja, czyli wariant pozornie słabszy. Wygląda to na ustępstwo
    i nie jest nim.

    Mechanizm domenowy sam w sobie jest mocniejszy i gdyby dało się go
    narzucić bez skutków, byłby wyborem oczywistym. Rzecz w tym, że nie da
    się. Wymaga on nazwy zarejestrowanej w katalogu i działa tylko wtedy,
    gdy obie strony są w tej samej domenie albo w domenach, które sobie
    ufają. Połączenie po adresie liczbowym, z maszyny spoza domeny albo
    przez nazwę zastępczą nie spełni tego warunku.

    Narzucenie mechanizmu domenowego nie powoduje wtedy odmowy
    uwierzytelnienia mocniejszego. Powoduje odmowę połączenia w ogóle —
    co jest kłopotem eksploatacyjnym, a nie zyskiem bezpieczeństwa.

    Kategoria niska, bo przy negocjacji strony i tak wybiorą mechanizm
    najmocniejszy z dostępnych. Punkt porządkuje konfigurację, a nie
    odpiera konkretne zagrożenie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    wprost — raczej sytuację, w której połączenia zaczynają być obchodzone
    innymi drogami, bo ta odmawia działania.
  en: |
    The setting says how the printing subsystem authenticates the machines
    connecting to it: by negotiating a mechanism or by the domain mechanism alone.

    The item calls for a word of explanation, the required value here being
    negotiation, which is to say the seemingly weaker variant. That looks like a
    concession and is not one.

    The domain mechanism is in itself the stronger, and if it could be imposed
    without consequence it would be the obvious choice. The matter is that it cannot
    be. It calls for a name registered in the directory and works only where both
    sides are in the same domain or in domains that trust each other. A connection
    by a numeric address, from a machine outside the domain or by a substitute name
    will not meet that condition.

    Imposing the domain mechanism then brings about no refusal of a stronger
    authentication. It brings about a refusal of the connection altogether - which
    is an operating trouble rather than a gain in security.

    A low category, the sides at negotiation choosing the strongest mechanism
    available anyway. The item tidies a configuration rather than turning away a
    particular threat.

    What an attacker gains while the item goes unmet: little outright - rather a
    state of things where connections begin to be worked round by other roads, this
    one refusing to work.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć w praktyce jest to jeden
    z łagodniejszych punktów bloku.

    Wartość wymagana jest wartością domyślną systemu, więc na maszynie,
    której nikt wcześniej nie przestawiał, wdrożenie niczego nie zmienia —
    zapisuje tylko wpis, który dotąd był domyślny.

    Zmiana ma znaczenie tam, gdzie ktoś ustawił narzucenie mechanizmu
    domenowego świadomie. Wdrożenie tej reguły wtedy je cofa i połączenia,
    które dotąd były odrzucane, zaczną przechodzić. Jest to złagodzenie
    i trzeba je nazwać wprost, zamiast przedstawiać jako utwardzenie.

    Sytuacja taka nie jest częsta, ale bywa: administrator narzuca
    mechanizm domenowy, część maszyn traci połączenie z kolejką, sprawa
    zostaje w takim stanie. Wdrożenie tej reguły rozwiązuje wtedy problem,
    o którym nikt nie pamiętał.

    Wymaga zatrzymania usługi wydruku, więc zadania w kolejce zostaną
    przerwane.

    Czego to nie psuje: drukowania, kolejek udostępnianych, instalowania
    sterowników, uwierzytelniania poza podsystemem druku.
  en: |
    The class is "needs review", though in practice it is one of the gentler items
    of the block.

    The required value is the system's default, so on a machine nobody has moved
    before, the rollout changes nothing - it only writes down an entry that was the
    default until now.

    The change matters where somebody has deliberately imposed the domain mechanism.
    Rolling this rule out then undoes that, and connections until now refused will
    begin to pass. It is a loosening and it has to be named outright rather than set
    out as a hardening.

    Such a state of things is not common but does occur: an administrator imposes
    the domain mechanism, some machines lose their connection to the queue, and the
    matter is left so. Rolling this rule out then answers a trouble nobody
    remembered.

    Calls for the print service to be stopped, so jobs in the queue will be broken
    off.

    What this does not break: printing, shared queues, the installing of drivers, or
    authentication outside the printing subsystem.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - accounts-and-passwords
  what_breaks:
    pl:
      - Tam, gdzie ktoś narzucił mechanizm domenowy świadomie, wdrożenie to cofa i połączenia dotąd odrzucane zaczną przechodzić - jest to złagodzenie
      - Zatrzymanie usługi wydruku przerywa zadania stojące w kolejce
      - Na maszynie nieprzestawianej wcześniej wdrożenie zapisuje tylko wartość, która i tak była domyślna
      - Drukowanie, kolejki udostępniane i uwierzytelnianie poza podsystemem druku pozostają bez zmian
    en:
      - Where somebody has deliberately imposed the domain mechanism, the rollout undoes it and connections until now refused will begin to pass - it is a loosening
      - Stopping the print service breaks off jobs standing in the queue
      - On a machine not moved before, the rollout only writes down the value that was the default anyway
      - Printing, shared queues and authentication outside the printing subsystem stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzucenie mechanizmu domenowego jest tu decyzją świadomą i wszystkie maszyny łączące się z kolejką są w domenie
      - Nie da się zatrzymać usługi wydruku bez uzgodnienia okna serwisowego
    en:
      - Imposing the domain mechanism is here a deliberate decision and every machine connecting to the queue is in the domain
      - The print service cannot be stopped without a maintenance window being agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero means negotiation, one forces the domain mechanism alone.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ForceKerberosForRpc'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'ForceKerberosForRpc'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero means negotiation, one the domain mechanism alone. Zero is the value
    # asked for here.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ForceKerberosForRpc' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-print-spooler-service

notes:
  pl: |
    Punkt jest jedynym w bloku, w którym wdrożenie może osłabić
    konfigurację zastaną, i warto postawić to wprost zamiast chować
    w opisie. Aplikacja ma tłumaczyć, a nie wyręczać — użytkownik, który
    narzucił mechanizm domenowy świadomie, powinien zobaczyć, że ta reguła
    mu to cofa, i móc ją odpuścić z zapisanym uzasadnieniem.

    Kategoria niska jest tu szczera. Punkt nie odbiera napastnikowi niczego
    konkretnego. Wartość leży w tym, że konfiguracja niewykonalna bywa
    obchodzona, a obejście jest zwykle gorsze od ustawienia, które działa.

    Wpis wymaga na tym wydaniu systemu aktualizacji z drugiej połowy
    2021 roku, tak samo jak pozostałe trzy reguły o drogach sieciowych.
  en: |
    The item is the only one in the block where the rollout can weaken a
    configuration found in place, and that is worth putting outright rather than
    hiding in the description. The application is to explain rather than to act in
    one's stead - a user who imposed the domain mechanism deliberately should see
    that this rule undoes it for them, and be able to let it go with a written
    justification.

    The low category is honest here. The item takes nothing particular away from an
    attacker. The value lies in an unworkable configuration being at times worked
    round, and a workaround being as a rule worse than a setting that works.

    On this release of the system the entry calls for an update from the second half
    of 2021, as do the other three rules about network roads.
