id: win2016-cached-logons-limited

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Liczba zapamiętanych logowań ograniczona
    en: Number of cached sign-ins limited
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza liczbę logowań domenowych zapamiętanych lokalnie na
    wypadek, gdyby kontroler domeny był nieosiągalny.

    Mechanizm ma sens praktyczny i nie chodzi o to, żeby go wyłączyć. Gdy
    kontroler nie odpowiada, maszyna musi umieć wpuścić kogoś, kto się już na
    niej logował — inaczej awaria sieci zamienia się w awarię dostępu do
    wszystkich serwerów naraz.

    Koszt tego udogodnienia jest jednak konkretny. To, co zostaje zapamiętane,
    nie jest hasłem, tylko wynikiem jego przetworzenia, i wystarcza do ataku
    słownikowego prowadzonego poza maszyną, w dowolnym tempie i bez śladu
    w dzienniku. Do sieci samo w sobie nie wpuszcza, ale hasło odzyskane tą
    drogą jest już zwykłym, działającym hasłem domenowym.

    Na serwerze sprawa wygląda inaczej niż na stacji roboczej i to jest tu
    najważniejsze. Serwer stoi w tej samej serwerowni co kontroler domeny,
    łącze między nimi jest krótkie, a liczba osób logujących się lokalnie do
    konsoli jest niewielka. Powód, dla którego stacja roboczna potrzebuje
    zapamiętanych logowań — praca poza siecią firmy — na serwerze zwykle nie
    występuje.

    Jednocześnie to właśnie na serwerze zapamiętane logowania są najcenniejsze
    dla napastnika: logują się tam administratorzy, a nie zwykli użytkownicy.
    Maszyna, która przechowuje dziesięć ostatnich logowań, przechowuje
    w praktyce komplet poświadczeń zespołu utrzymania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapas materiału
    do łamania haseł administracyjnych, zabrany z maszyny w jednym przebiegu
    i łamany potem bez pośpiechu i bez kontaktu z siecią ofiary.
  en: |
    The setting limits the number of domain sign-ins remembered locally against the
    case of the domain controller being out of reach.

    The mechanism has a practical sense and the point is not to switch it off. When
    the controller does not answer, the machine has to be able to let in somebody
    who has signed in on it before - otherwise a network fault turns into a fault of
    access to every server at once.

    The cost of that convenience is nonetheless a definite one. What is remembered
    is not the password but the outcome of processing it, and it suffices for a
    dictionary attack carried on away from the machine, at any pace and without a
    trace in the log. By itself it lets nobody onto the network, but a password
    recovered that way is already an ordinary working domain password.

    On a server the matter looks different from on a workstation, and that is the
    chief thing here. The server stands in the same room as the domain controller,
    the link between them is short, and the number of people signing in locally at
    the console is small. The reason a workstation needs cached sign-ins - work away
    from the company network - usually does not arise on a server.

    At the same time it is on a server that cached sign-ins are worth most to an
    attacker: it is administrators who sign in there, not ordinary users. A machine
    holding the last ten sign-ins holds in practice the full set of the maintenance
    team's credentials.

    What an attacker gains while the item goes unmet: a store of material for
    cracking administrative passwords, taken off the machine in a single pass and
    cracked afterwards without haste and without contact with the victim's network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Skutek ujawnia się wyłącznie wtedy, gdy
    kontroler domeny jest nieosiągalny — a więc dokładnie wtedy, gdy nikt nie
    ma czasu na diagnozę.

    Scenariusz, który trzeba przejrzeć, jest jeden i konkretny: czy po awarii
    sieci ktokolwiek zdoła zalogować się do konsoli tej maszyny. Przy
    ograniczeniu do czterech wpisów zalogują się cztery osoby, które robiły to
    ostatnio — a nie ta, która akurat dyżuruje. Kolejka wypiera najstarszy wpis
    przy każdym nowym logowaniu, więc konto używane raz na kwartał wypada z niej
    po cichu.

    Zabezpieczeniem przed tym nie jest podniesienie limitu, tylko istnienie
    drogi wejścia niezależnej od domeny: lokalnego konta serwisowego albo
    dostępu przez konsolę zarządzania hipernadzorcy. Jeżeli taka droga jest,
    ograniczenie nie kosztuje nic.

    Osobno warto sprawdzić maszyny odcięte od kontrolera na dłużej — serwery
    w oddziale za wolnym łączem albo w strefie oddzielonej zaporą. Tam
    zapamiętane logowania bywają jedyną drogą wejścia przez całe dnie.

    Czego to nie psuje: logowania przy dostępnym kontrolerze domeny, pracy
    usług, kont lokalnych ani sesji już otwartych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". The effect shows itself only when the domain
    controller is out of reach - which is to say precisely when nobody has time for
    diagnosis.

    The scenario to look over is one and definite: whether after a network fault
    anybody will manage to sign in at this machine's console. With a limit of four
    entries, the four people who did so most recently will sign in - and not the one
    who happens to be on duty. The queue pushes out the oldest entry with every new
    sign-in, so an account used once a quarter drops out of it quietly.

    The safeguard against that is not raising the limit but the existence of a road
    in independent of the domain: a local service account, or access through the
    hypervisor's management console. Where such a road exists, the limit costs
    nothing.

    Worth checking separately are machines cut off from the controller for longer -
    servers in a branch behind a slow link, or in a zone separated by a firewall.
    There cached sign-ins are at times the only road in for whole days.

    What this does not break: signing in while the domain controller is reachable,
    the working of services, local accounts, or sessions already open.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Po awarii kontrolera domeny zalogują się tylko osoby z czterech ostatnich logowań, a nie ta akurat dyżurująca
      - Konto używane rzadko wypada z kolejki po cichu, bo każde nowe logowanie wypiera najstarszy wpis
      - Serwer w oddziale za wolnym łączem albo za zaporą traci drogę wejścia na czas odcięcia od domeny
      - Logowanie przy dostępnym kontrolerze, praca usług i sesje już otwarte pozostają bez zmian
    en:
      - After a domain controller failure only the people from the last four sign-ins will get in, and not the one on duty
      - An account used seldom drops out of the queue quietly, since every new sign-in pushes out the oldest entry
      - A server in a branch behind a slow link or behind a firewall loses its road in for the time it is cut off from the domain
      - Signing in while the controller is reachable, the working of services and sessions already open stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna bywa odcięta od kontrolera domeny na dłużej i nie ma innej drogi wejścia niż zapamiętane logowanie
      - Nie ma lokalnego konta serwisowego ani dostępu przez konsolę zarządzania hipernadzorcy
    en:
      - The machine is at times cut off from the domain controller for longer and has no road in other than a cached sign-in
      - There is no local service account and no access through the hypervisor management console
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'CachedLogonsCount'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'CachedLogonsCount'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is kept as text - that is the type this setting has carried since it
    # appeared, and a number written here is left unread.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'CachedLogonsCount' -Value '4' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-number-of-previous-logons-to-cache-in-case-domain-controller-is-not-available

notes:
  pl: |
    Punkt jest poziomu drugiego i nie bez powodu. Wartość zero, czyli całkowite
    wyłączenie zapamiętywania, bywa proponowana jako surowsza — i jest
    surowsza — ale na serwerze bez alternatywnej drogi wejścia zamienia awarię
    sieci w konieczność wizyty z nośnikiem odzyskiwania.

    Cztery wpisy są kompromisem, nie granicą bezpieczeństwa. Właściwą osłoną
    poświadczeń administracyjnych na tej maszynie są osobne konta do zadań
    administracyjnych i ograniczenie logowania interaktywnego, a nie liczba
    zapamiętanych wpisów.

    Porównanie jest typu „nie więcej niż", więc mniejsza wartość jest zgodna.
    Zero przejdzie ten audyt i jest to zamierzone — reguła nie ma karać za
    ustawienie surowsze od wymaganego.
  en: |
    The item is of the second level, and not without reason. A value of zero -
    remembering switched off altogether - is at times proposed as stricter, and is
    stricter, but on a server without an alternative road in it turns a network
    fault into the need for a visit with recovery media.

    Four entries are a compromise, not a boundary of safety. The proper cover for
    administrative credentials on this machine is separate accounts for
    administrative work and a limit on interactive sign-in, not the number of
    remembered entries.

    The comparison is of the "not greater than" kind, so a smaller value is
    compliant. Zero will pass this audit and that is intended - the rule is not to
    punish a setting stricter than the one required.
