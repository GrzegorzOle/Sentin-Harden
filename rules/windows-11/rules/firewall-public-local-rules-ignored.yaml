id: win11-firewall-public-local-rules-ignored

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Lokalne reguły zapory pomijane w profilu publicznym
    en: Local firewall rules ignored in the public profile
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguły zapory powstają w dwóch miejscach: w polityce, którą ktoś
    zaprojektował, i lokalnie — zwykle przez kliknięcie „zezwól" w okienku,
    które wyskoczyło przy pierwszym uruchomieniu programu. Te drugie powstają
    bez namysłu i zostają na zawsze.

    Profil publiczny opisuje sieć, o której nic nie wiadomo: hotel, lotnisko,
    kawiarnia. Właśnie tam lokalne zezwolenia szkodzą najbardziej, bo otwierają
    port wobec przypadkowych maszyn w tej samej sieci. Pominięcie ich sprawia,
    że w sieci obcej obowiązuje wyłącznie to, co ktoś świadomie zaprojektował.
  en: |
    Firewall rules arise in two places: in a policy somebody designed, and
    locally - usually by clicking "allow" in a box that popped up the first time
    a program ran. The latter arise without thought and stay forever.

    The public profile describes a network nothing is known about: a hotel, an
    airport, a café. That is exactly where local permissions do the most harm,
    because they open a port towards random machines on the same network.
    Ignoring them means that in a foreign network only what somebody
    deliberately designed applies.

disruption_description:
  pl: |
    Zmiana obowiązuje wyłącznie w sieciach oznaczonych jako publiczne, więc
    w biurze i w domu nie zmienia niczego.

    W sieci obcej przestanie działać wszystko, na co użytkownik kiedyś wyraził
    zgodę lokalnie: udostępnianie ekranu, komunikatory z połączeniem
    bezpośrednim, narzędzia do przesyłania plików między laptopami. Dla osoby
    pracującej w podróży bywa to odczuwalne, a przyczyna jest nieoczywista, bo
    ta sama funkcja działa po powrocie do biura.
  en: |
    The change applies only in networks marked as public, so in the office and
    at home it changes nothing.

    In a foreign network everything the user once allowed locally stops working:
    screen sharing, messengers with direct connections, tools for moving files
    between laptops. For somebody working while travelling that is noticeable,
    and the cause is not obvious, because the same function works again on
    return to the office.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - W sieci publicznej przestaną działać funkcje dopuszczone kiedyś lokalnie przez użytkownika
      - Udostępnianie ekranu i przesyłanie plików między urządzeniami w sieci obcej zostanie zablokowane
      - Program poprosi o zgodę, a jej udzielenie nie przyniesie skutku w tym profilu
    en:
      - In a public network, functions once allowed locally by the user stop working
      - Screen sharing and file transfer between devices in a foreign network are blocked
      - A program asks for permission and granting it has no effect in this profile
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje głównie w sieciach oznaczonych jako publiczne i korzysta tam z połączeń bezpośrednich
      - Polityka nie zawiera reguł dla funkcji potrzebnych w podróży
    en:
      - The machine works mostly in networks marked as public and uses direct connections there
      - The policy contains no rules for the functions needed while travelling
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' }
      elseif ($public.AllowLocalFirewallRules -eq 'False') { 'IGNORED' }
      else { 'MERGED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: IGNORED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public |
      Select-Object -Property Name, AllowLocalFirewallRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules $b.AllowLocalFirewallRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Ustawienie nie kasuje reguł lokalnych — przestają być brane pod uwagę
    w tym profilu i wracają do działania po jego zmianie. Wycofanie jest więc
    natychmiastowe i nic nie przepada.

    Stan nieskonfigurowany zachowuje się jak scalanie i tak też jest liczony —
    jako niespełniony. To najczęstszy wynik na maszynie bez polityki zapory.

    Punkt ma sens wyłącznie tam, gdzie reguły przychodzą z polityki. Na maszynie
    bez polityki zapory pominięcie reguł lokalnych oznacza brak jakichkolwiek
    reguł w sieci obcej — co bywa zamierzone, ale trzeba to wiedzieć.
  en: |
    The setting does not delete local rules - they simply stop being taken into
    account in that profile and come back into effect once it changes. The
    rollback is therefore immediate and nothing is lost.

    The not-configured state behaves like merging and is counted as such - as
    unmet. It is the most common result on a machine with no firewall policy.

    The item makes sense only where rules arrive from a policy. On a machine
    with no firewall policy, ignoring local rules means having no rules at all
    in a foreign network - which can be intended, but has to be known.
