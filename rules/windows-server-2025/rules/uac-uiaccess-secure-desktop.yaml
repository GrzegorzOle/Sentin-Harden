id: win2025-uac-uiaccess-secure-desktop

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Programy dostępności nie wyłączają bezpiecznego pulpitu
    en: Accessibility programs do not switch the secure desktop off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy program z uprawnieniem dostępu do
    interfejsu innych aplikacji może wyłączyć bezpieczny pulpit przy
    żądaniu podniesienia uprawnień.

    Bezpieczny pulpit to osobna powierzchnia, na której pojawia się okno
    potwierdzenia. Jej sens polega na odcięciu: programy zwykłe nie mają
    tam dostępu, nie mogą tego okna odczytać, nakryć innym oknem ani
    kliknąć w nim za człowieka. Okno potwierdzenia bez bezpiecznego
    pulpitu wygląda tak samo, ale przestaje być odporne — a wygląda na
    odporne, co jest gorsze niż brak potwierdzenia w ogóle.

    Możliwość jego wyłączenia istnieje z powodu rzeczywistego: część
    narzędzi dostępności nie potrafi czytać bezpiecznego pulpitu, więc
    dla osoby korzystającej z czytnika ekranu okno potwierdzenia staje
    się niewidzialne. Ustawienie jest więc wyborem między dostępnością
    a odpornością tego okna.

    Na serwerze wybór ten jest łatwy, bo jedna strona wagi jest pusta.
    Narzędzia dostępności nie mają tu zastosowania, a okno potwierdzenia
    towarzyszy czynnościom administracyjnym — czyli dokładnie tym,
    przy których zależy nam na odporności.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    działania na oknie potwierdzenia, gdy zostanie ono przeniesione na
    pulpit zwykły. Potwierdzenie przestaje wtedy potwierdzać cokolwiek,
    a człowiek nadal widzi je jako zabezpieczenie.
  en: |
    The setting settles whether a program with the right of access to other applications'
    interface may switch the secure desktop off at an asking for an elevation of rights.

    The secure desktop is a surface of its own on which the confirming window appears. Its
    sense lies in a cutting off: ordinary programs have no access there, cannot read that
    window, cover it with another or click in it for a person. A confirming window without
    the secure desktop looks just the same but stops being proof against tampering - and
    looks proof against it, which is worse than no confirming at all.

    The possibility of switching it off exists for a real reason: some accessibility tools
    cannot read the secure desktop, so for a person using a screen reader the confirming
    window becomes invisible. The setting is thus a choice between that window's
    accessibility and its soundness.

    On a server the choice is easy, since one pan of the scale is empty. Accessibility tools
    have no use here, while the confirming window goes with administrative doings - that is,
    exactly those at which soundness is what we care for.

    What an attacker gains while the item goes unmet: the means of acting on the confirming
    window once it has been moved to the ordinary desktop. The confirming then stops
    confirming anything, while a person still sees it as a safeguard.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie przestaje działać i nikt niczego nie zauważy. Okno
    potwierdzenia pojawia się tak samo i tak samo się je obsługuje —
    zmienia się wyłącznie to, że program dostępności nie może przenieść
    go na pulpit zwykły.

    Na serwerze bez sesji interaktywnych skutek jest zerowy.

    Jedyny przypadek, w którym zmiana jest odczuwalna, to serwer
    terminali z użytkownikiem korzystającym z czytnika ekranu. Dla tej
    osoby okno potwierdzenia stanie się niedostępne — czytnik nie
    odczyta go i użytkownik usłyszy ciszę zamiast pytania. Praca
    zatrzymuje się w sposób trudny do zdiagnozowania, bo na ekranie
    wszystko wygląda poprawnie.

    Jest to sytuacja rzadka, ale warto ją nazwać, bo alternatywą nie
    jest cofnięcie tego punktu. Właściwym rozwiązaniem jest oddzielenie
    czynności wymagających podniesienia od stanowiska korzystającego
    z narzędzi dostępności.
  en: |
    The change has no known side effects and takes no break.

    Nothing stops working and nobody notices anything. The confirming window appears just the
    same and is handled just the same - what changes is only that an accessibility program
    cannot move it to the ordinary desktop.

    On a server with no interactive sessions the effect is nil.

    The one case in which the change is felt is a terminal server with a user working through
    a screen reader. For that person the confirming window will become unreachable - the
    reader will not read it out and the user will hear silence in place of a question. Work
    halts in a way hard to diagnose, since on the screen everything looks right.

    It is a rare situation, but worth naming, since the alternative is not undoing this item.
    The right answer is separating doings that take an elevation from a station working
    through accessibility tools.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - legacy-applications
  what_breaks:
    pl:
      - Na serwerze terminali czytnik ekranu nie odczyta okna potwierdzenia podniesienia
      - Użytkownik usłyszy ciszę zamiast pytania, a na ekranie wszystko wygląda poprawnie
      - Okno potwierdzenia pojawia się i obsługuje się tak samo jak wcześniej
      - Na serwerze bez sesji interaktywnych skutek jest zerowy
    en:
      - On a terminal server a screen reader will not read out the elevation confirming window
      - The user will hear silence in place of a question while on screen all looks right
      - The confirming window appears and is handled just as before
      - On a server with no interactive sessions the effect is nil
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer terminali obsługuje użytkownika korzystającego z czytnika ekranu przy czynnościach wymagających podniesienia
    en:
      - A terminal server serves a user working through a screen reader at doings that take an elevation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero is the compliant value here - it denies accessibility programs the
      # ability to move the elevation prompt off the secure desktop.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableUIADesktopToggle'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'EnableUIADesktopToggle' -ErrorAction SilentlyContinue).'EnableUIADesktopToggle'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableUIADesktopToggle'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableUIADesktopToggle' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-allow-uiaccess-applications-to-prompt-for-elevation-without-using-the-secure-desktop

notes:
  pl: |
    Wartością zgodną jest tu zero. Punkt należy do nielicznych, w których
    zgodność polega na pozostawieniu ustawienia wyłączonego, bo
    wyłączenie oznacza brak możliwości obejścia bezpiecznego pulpitu.

    Punkt czyta się razem z wymaganiem katalogu chronionego dla programów
    dostępności. Tamten przesądza, kto to uprawnienie dostanie; ten —
    co wolno z nim zrobić. Spełnienie obu daje ograniczenie, które
    faktycznie coś ogranicza.

    Sprawdzenie zwraca „MISSING", gdy wartości nie ustawiono. Stan
    domyślny systemu jest zgodny, ale brak jawnego ustawienia znaczy,
    że nic nie broni go przed zmianą — i dlatego jest zgłaszany.
  en: |
    The compliant value here is zero. The item is among the few at which compliance lies in
    leaving a setting switched off, since switching it off means there is no means of getting
    round the secure desktop.

    The item is read together with the requirement of a protected directory for accessibility
    programs. That one settles who gets the right; this one, what may be done with it. Meeting
    both gives a limit that limits something in fact.

    The check returns "MISSING" where the value has not been set. The system's default state
    is compliant, but the want of an explicit setting means nothing guards it against a
    change - and hence it is reported.
