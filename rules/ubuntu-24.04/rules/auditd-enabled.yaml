id: ubuntu2404-auditd-enabled

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.2.1.2
  section: Logging and Auditing > System Accounting (auditd) > Configure auditd Service
  title:
    pl: Usługa auditd jest włączona i działa
    en: Ensure auditd service is enabled and active
  level: 2
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Zdarzenia audytu trafiają do /var/log/audit/audit.log tylko wtedy, gdy
    działa usługa auditd. Jeśli jest wyłączona, jądro przekazuje część
    zdarzeń do dziennika systemowego, a reguły audytu z /etc/audit/rules.d
    nie są wczytywane przy starcie.

    Punkt wymaga, żeby usługa auditd była włączona przy starcie i działała.
  en: |
    Audit events reach /var/log/audit/audit.log only when the auditd service
    runs. If it is off, the kernel passes some events to the system log, and
    the audit rules from /etc/audit/rules.d are not loaded at boot.

    The item requires the auditd service to be enabled at boot and running.

disruption_description:
  pl: |
    Nikt tego nie zauważy: instalacja pakietu auditd od razu włącza
    i uruchamia usługę, więc po punkcie 6.2.1.1 punkt jest zwykle spełniony.
    Usługa zajmuje kilka megabajtów pamięci i pisze w /var/log/audit, którego
    rozmiar ograniczają ustawienia z punktów 6.2.2.
  en: |
    Nobody will notice: installing the auditd package enables and starts the
    service at once, so after item 6.2.1.1 the item is usually met. The
    service uses a few megabytes of memory and writes to /var/log/audit,
    whose size is limited by the settings from items 6.2.2.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brakujący pakiet auditd jest instalowany, co wymaga dostępu do repozytorium pakietów Ubuntu
    en:
      - A missing auditd package is installed, which needs access to the Ubuntu package repository
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || ! command -v dpkg-query >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then
      echo CHECK_ERROR; exit 0
    fi
    if ! [ "$(dpkg-query -W -f='${db:Status-Status}' auditd 2>/dev/null)" = installed ]; then echo NOT_INSTALLED; exit 0; fi
    e=$(systemctl is-enabled auditd.service 2>/dev/null) || true
    a=$(systemctl is-active auditd.service 2>/dev/null) || true
    if [ "$e" = enabled ] && [ "$a" = active ]; then echo ENABLED_ACTIVE
    else echo "NOT_RUNNING:${e:-none}/${a:-unknown}"; fi
  expected: '^ENABLED_ACTIVE$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=svc-on-u1
        s=$(dpkg-query -W -f='${db:Status-Status}' auditd 2>/dev/null) || true
        echo "installed=${s:-not-installed}"
        for u in auditd.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          echo "$u ${e:--} ${a:--}"
        done
        find /etc/systemd/system /run/systemd/system -type l \( -name auditd.service -o -lname '*/auditd.service' \) \
          -printf 'link %p %l\n' 2>/dev/null | sort
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /run/systemd/system ] || { echo "systemd is not running" >&2; exit 1; }
      st() { dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null || true; }
      if [ "$(st auditd)" != installed ]; then
        export DEBIAN_FRONTEND=noninteractive
        o="-y -qq -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
        # Stale package lists end in a download error; refresh them once and retry.
        if ! apt-get install $o auditd; then apt-get update -qq; apt-get install $o auditd; fi
        [ "$(st auditd)" = installed ] || { echo "auditd is still not installed" >&2; exit 1; }
        echo "Installed auditd"
      fi
      for u in ; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        a=$(systemctl is-active "$u" 2>/dev/null) || true
        case "$e" in enabled|enabled-runtime) systemctl disable -q "$u"; echo "Disabled $u" ;; esac
        case "$a" in active|activating|reloading) systemctl stop "$u"; echo "Stopped $u" ;; esac
      done
      e=$(systemctl is-enabled auditd.service 2>/dev/null) || true
      case "$e" in
        masked) systemctl unmask -q auditd.service ;;
        masked-runtime) systemctl unmask -q --runtime auditd.service ;;
      esac
      systemctl enable -q --now auditd.service
      e=$(systemctl is-enabled auditd.service 2>/dev/null) || true
      a=$(systemctl is-active auditd.service 2>/dev/null) || true
      if [ "$e" != enabled ] || [ "$a" != active ]; then
        echo "auditd.service is still not running ($e/$a)" >&2; exit 1
      fi
      echo "Enabled and started auditd.service"
    )

  rollback_command: |
    (
      set -e
      st() { dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null || true; }
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=svc-on-u1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      inst=$(sed -n '2s/^installed=//p' "$b")
      case "$inst" in ""|*[!a-z-]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      lines=$(tail -n +3 "$b" | grep -v '^link ') || true
      links=$(grep '^link ' "$b") || true
      if [ "$(printf '%s\n' "$lines" | cut -d' ' -f1 | tr '\n' ' ')" != "auditd.service " ]; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      while read -r u e a x; do
        case "$e$a" in *[!a-z-]*|"") echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        if [ -z "$a" ] || [ -n "$x" ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      done <<< "$lines"
      if [ -n "$links" ]; then
        while read -r k p t x; do
          bad=0
          if [ -z "$t" ] || [ -n "$x" ]; then bad=1; fi
          case "$p" in /etc/systemd/system/*|/run/systemd/system/*) ;; *) bad=1 ;; esac
          case "$p$t" in *..*) bad=1 ;; esac
          if [ "${p##*/}" != auditd.service ] && [ "${t##*/}" != auditd.service ]; then bad=1; fi
          if [ "$bad" = 1 ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
        done <<< "$links"
      fi
      read -r u e a <<< "$(printf '%s\n' "$lines" | head -n 1)"
      # The unit links in /etc and /run are restored as they were, which also
      # brings back the enabled state hidden under a mask.
      if [ "$inst" = installed ] && [ "$(dpkg-query -W -f='${db:Status-Status}' auditd 2>/dev/null)" = installed ]; then
        case "$a" in active|activating|reloading) ;; *) systemctl stop auditd.service ;; esac
        find /etc/systemd/system /run/systemd/system -type l \( -name auditd.service -o -lname '*/auditd.service' \) -delete 2>/dev/null || true
        if [ -n "$links" ]; then
          while read -r k p t; do
            mkdir -p "$(dirname "$p")"
            ln -s "$t" "$p"
          done <<< "$links"
        fi
        systemctl daemon-reload
      fi
      if [ "$inst" != installed ] && [ "$(st auditd)" = installed ]; then
        # Packages installed since then (audispd-plugins) may need it; then it stays.
        if dpkg -r --dry-run auditd >/dev/null 2>&1; then
          systemctl stop auditd.service
          DEBIAN_FRONTEND=noninteractive apt-get remove -y -qq auditd
          if [ "$inst" = not-installed ] && [ "$(st auditd)" = config-files ]; then dpkg --purge auditd >/dev/null; fi
          echo "Removed auditd again"
        else
          echo "Kept auditd: other installed packages need it now"
        fi
      fi
      start=""
      while read -r u e a; do
        [ "$u" = auditd.service ] && continue
        case "$e" in
          enabled) systemctl enable -q "$u" ;;
          enabled-runtime) systemctl enable -q --runtime "$u" ;;
        esac
        case "$a" in active|activating|reloading) start="$start $u" ;; esac
      done <<< "$lines"
      if [ -n "$start" ]; then systemctl start $start; fi
      echo "Restored the previous state of auditd.service"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man8/auditd.8.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html
  - https://manpages.ubuntu.com/manpages/noble/man8/apt-get.8.html

notes:
  pl: |
    Brak pakietu auditd daje wynik NOT_INSTALLED. Naprawa instaluje go
    poleceniem apt-get install (a gdy listy pakietów są nieaktualne, odświeża
    je i ponawia instalację), odmaskowuje usługę i włącza ją poleceniem
    systemctl enable --now. Przy starcie auditd.service wczytuje reguły
    z /etc/audit/rules.d poleceniem augenrules --load.

    Wycofanie przywraca poprzednie dowiązania jednostki w /etc/systemd/system
    i /run/systemd/system, a usługę zatrzymuje, jeśli wcześniej nie działała.
    Pakiet zainstalowany przez naprawę usuwa, chyba że potrzebują go pakiety
    zainstalowane w międzyczasie (na przykład audispd-plugins); jeśli
    wcześniej nie było go wcale, usuwa też jego pliki konfiguracyjne.
  en: |
    A missing auditd package gives the NOT_INSTALLED result. The remediation
    installs it with apt-get install (and when the package lists are stale,
    refreshes them and retries), unmasks the service and enables it with
    systemctl enable --now. At start auditd.service loads the rules from
    /etc/audit/rules.d with augenrules --load.

    Rollback restores the previous unit links in /etc/systemd/system and
    /run/systemd/system, and stops the service if it was not running before.
    It removes a package installed by the remediation unless packages
    installed in the meantime need it (audispd-plugins, for example); if the
    package was not there at all before, it also removes its configuration
    files.
