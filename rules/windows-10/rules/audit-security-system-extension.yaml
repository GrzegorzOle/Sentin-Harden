id: win10-audit-security-system-extension

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > System
  title:
    pl: Inspekcja rozszerzeń systemu zabezpieczeń
    en: The audit of the extensions of the guarding system
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje dołączenie do systemu zabezpieczeń nowego składnika:
    pakietu uwierzytelniania, dostawcy poświadczeń albo usługi rejestrowanej
    w menedżerze sterowania.

    Składniki te są wywoływane przy każdym logowaniu i widzą poświadczenia
    w postaci, w której są sprawdzane. Dołączenie własnego pakietu jest więc
    najczystszą znaną drogą do zbierania haseł z bieżącej pracy maszyny —
    bez czytania cudzej pamięci, bez podszywania się, w miejscu do tego
    przewidzianym.

    Rzecz istotna dla oceny: dołączenie takiego składnika jest czynnością
    rzadką. W całym życiu maszyny zdarza się przy instalacji systemu, przy
    wdrożeniu narzędzia zabezpieczającego i przy zmianie sposobu logowania.
    Zapis jest więc niemal pusty, a każdy nowy wpis w nim jest pytaniem.

    Odnotowuję, że zapisywany jest wyłącznie wynik udany. Składnik, którego
    nie udało się dołączyć, do systemu zabezpieczeń nie wszedł — i nie jest
    tym, dla czego ten zapis istnieje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: własny
    składnik w torze logowania, widzący każde hasło i niezostawiający śladu
    przy dołączeniu.
  en: |
    The setting writes down the joining to the guarding system of a new component: a package of authentication,
    a provider of credentials, or a service registered with the manager of control.

    Such components are called at every logging on and see credentials in the form in which they are checked.
    The joining of a package of one's own is therefore the cleanest known road to the gathering of passwords out
    of a machine's running work - with no reading of somebody else's memory, no counterfeiting, and in a place
    foreseen for it.

    A thing that matters to the judgement: the joining of such a component is a rare act. In a machine's whole
    life it happens at the installing of the system, at the rolling out of a guarding tool, and at a change in
    the manner of logging on. The record is therefore near empty, and every new entry in it is a question.

    I set down that only the successful outcome is written. A component that failed to be joined did not come
    into the guarding system - and is not what this record is for.

    What an attacker gains while the item goes unmet: a component of their own in the path of logging on, seeing
    every password and leaving no trace at its joining.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie niczego nie zabrania i nie wpływa na to, jakie składniki
    wolno dołączyć. Zapisuje wyłącznie fakt dołączenia.

    Liczba wpisów jest w normalnej pracy bliska zeru. Wpisy pojawiają się
    przy starcie systemu, gdy rejestrowane są usługi, i przy instalacji
    oprogramowania zabezpieczającego.

    Odnotowuję źródło szumu przy starcie: usługi rejestrowane w menedżerze
    sterowania dają wpisy powtarzalne, te same przy każdym uruchomieniu
    maszyny. Są łatwe do odsiania właśnie dlatego, że się powtarzają —
    a wpis, który pojawia się raz, jest wtedy widoczny.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: logowania, dostawców poświadczeń, usług
    systemowych, kont domenowych, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting forbids nothing and bears not upon which components may be joined. It writes down the fact of a
    joining alone.

    The number of entries is in ordinary work near nought. Entries come up at the system's start, when services
    are registered, and at the installing of guarding software.

    I set down a source of noise at the start: services registered with the manager of control give repeating
    entries, the same at every running of the machine. They are easy to sift out for just this, that they
    repeat - and an entry coming up once is then plain to see.

    There are no known regressions for everyday work.

    What this does not break: logging on, providers of credentials, system services, domain accounts, file
    shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Przy starcie systemu pojawiają się wpisy o rejestrowanych usługach, te same przy każdym uruchomieniu maszyny
      - Instalacja oprogramowania zabezpieczającego daje wpisy, które łatwo wziąć za zmianę podejrzaną
      - Zapisywany jest wyłącznie wynik udany, bo składnik nieprzyjęty do systemu zabezpieczeń nie wszedł
      - Ustawienie niczego nie zabrania i nie wpływa na to, jakie składniki wolno dołączyć
      - Logowanie, dostawcy poświadczeń, usługi systemowe, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - At the system s start entries come up about registered services, the same at every running of the machine
      - The installing of guarding software gives entries easily taken for a suspect change
      - Only the successful outcome is written, a component not taken up not having come into the guarding system
      - The setting forbids nothing and bears not upon which components may be joined
      - Logging on, providers of credentials, system services, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto odróżnić wpisu jednorazowego od tych powtarzających się przy starcie
    en:
      - The record is not gathered away from the machine and there is nobody to part a one-off entry from those repeating at the start
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9211-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9211-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9211-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. An extension that was refused did not
    # come into the guarding system, and is therefore not what this record is for.
    auditpol /set /subcategory:"{0CCE9211-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9211-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-security-system-extension

notes:
  pl: |
    Reguła otwiera blok o zdarzeniach systemowych i jest w nim najwyżej
    oceniona razem z inspekcją integralności. Powód jest wspólny: obie
    opisują zdarzenia, które w normalnej pracy nie zachodzą.

    Argument wart postawienia wprost dotyczy tego, gdzie ten składnik
    działa. Pakiet uwierzytelniania nie kradnie poświadczeń — dostaje je,
    bo jest częścią toru, w którym poświadczenia są sprawdzane. Nie ma tu
    nic do wykrycia przez mechanizmy pilnujące pamięci procesów i dlatego
    zapis o dołączeniu jest jedyną informacją, jaka powstaje.

    Odnotowuję szum przy starcie systemu, bo prowadzi do przedwczesnego
    wyłączenia podkategorii. Wpisy o rejestrowanych usługach są
    powtarzalne — i właśnie ta powtarzalność sprawia, że wpis pojawiający
    się raz jest w tym zbiorze widoczny od razu.
  en: |
    The rule opens the block about system events and is weighed the highest in it together with the audit of
    integrity. The reason is a shared one: both describe events that in ordinary work do not happen.

    The argument worth putting outright touches where such a component works. A package of authentication does
    not steal credentials - it is given them, being part of the path in which credentials are checked. There is
    here nothing to be caught by the mechanisms that watch processes' memory, and for that the record of a
    joining is the only word that comes about.

    I set down the noise at the system's start, it leading to an untimely switching off of the subcategory. The
    entries about registered services repeat - and it is that very repeating which makes an entry coming up once
    plain at a glance in this set.
