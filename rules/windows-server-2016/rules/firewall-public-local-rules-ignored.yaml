id: win2016-firewall-public-local-rules-ignored

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Reguły lokalne zapory pomijane w profilu publicznym
    en: Local firewall rules passed over in the public profile
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że w profilu publicznym obowiązują wyłącznie reguły
    przysłane z zasad grupy, a reguły utworzone na samej maszynie są
    pomijane.

    Domyślnie oba zbiory są łączone. Reguła utworzona lokalnie — przez
    administratora maszyny, przez instalator programu albo przez odpowiedź
    w oknie powiadomienia — działa tak samo jak reguła przysłana centralnie.
    Znaczy to, że konfiguracja zapory, którą widać w zasadach grupy, nie jest
    pełnym opisem tego, co maszyna przepuszcza.

    Profil publiczny jest miejscem, w którym ma to znaczenie największe. Jest
    to profil dla sieci nierozpoznanej, czyli tej, o której nic nie wiadomo —
    i właśnie tam maszyna powinna być najostrożniejsza, a nie najbardziej
    zaufana wobec własnych, przypadkowo powstałych wyjątków.

    Wartość zmiany bierze się stąd, że reguły lokalne powstają łatwo
    i zostają na zawsze. Instalator dodaje wyjątek przy instalacji programu,
    program bywa potem odinstalowany, a reguła zostaje. Nikt jej nie
    przegląda, bo nie widać jej w zasadach.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wyjątki
    powstałe lokalnie, nieprzeglądane centralnie, obowiązujące właśnie
    w sieci nierozpoznanej.
  en: |
    The setting brings it about that in the public profile only rules sent down by
    group policy hold, while rules made on the machine itself are passed over.

    By default the two sets are merged. A rule made locally - by the machine's
    administrator, by a program's installer, or by an answer at a notification
    window - works just as a rule sent down centrally does. That means the firewall
    configuration one sees in group policy is not a full description of what the
    machine lets through.

    The public profile is where this matters most. It is the profile for an
    unrecognised network, which is to say one nothing is known about - and it is
    just there that the machine should be at its most careful rather than at its
    most trusting towards its own exceptions, made by accident.

    The value of the change comes of local rules being easy to make and staying for
    ever. An installer adds an exception when a program is installed, the program is
    later uninstalled at times, and the rule remains. Nobody reviews it, since it is
    not to be seen in the policy.

    What an attacker gains while the item goes unmet: exceptions made locally, never
    reviewed centrally, holding in just the network that is unrecognised.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba to, czy maszyna korzysta
    dziś z reguł lokalnych i w którym profilu.

    Na serwerze w domenie, zarządzanym centralnie, reguły lokalne zwykle nie
    są potrzebne i zmiana przechodzi bez echa. Profil publiczny bywa zresztą
    na takim serwerze nieużywany, więc skutku nie ma żadnego.

    Kłopot pojawia się w dwóch sytuacjach. Pierwsza: maszyna czasami trafia
    do profilu publicznego, na przykład przy utracie łączności z kontrolerem
    domeny albo na karcie, której system nie rozpoznaje. Wtedy reguły lokalne
    przestają obowiązywać dokładnie w chwili, gdy maszyna i tak jest
    w gorszym położeniu.

    Druga: usługi dopuszczone wyłącznie regułą lokalną, bo tak zrobił
    instalator. Tych nikt nie wymieni z pamięci — trzeba je wyliczyć
    z konfiguracji zapory i porównać z tym, co przychodzi z zasad grupy.

    Objaw jest ostry, ale wąski: dotyczy wyłącznie profilu publicznego,
    więc pojawia się nagle i wygląda na awarię sieci, a nie na skutek
    zmiany. Warto to zapamiętać przy diagnozie.

    Czego to nie psuje: reguł z zasad grupy, profilu domenowego, profilu
    prywatnego, połączeń wychodzących.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether the machine
    uses local rules today and in which profile.

    On a server in a domain, managed centrally, local rules are as a rule not needed
    and the change passes without echo. The public profile is at any rate at times
    unused on such a server, so there is no effect at all.

    The trouble appears in two situations. The first: the machine at times falls
    into the public profile, at a loss of contact with a domain controller, say, or
    on a card the system does not recognise. Local rules then cease to hold at just
    the moment when the machine is in a worse position anyway.

    The second: services admitted by a local rule alone, because that is how the
    installer did it. Nobody will name those from memory - they have to be
    enumerated from the firewall configuration and set against what comes down from
    group policy.

    The symptom is sharp but narrow: it concerns the public profile alone, so it
    appears suddenly and looks like a network breakdown rather than the upshot of a
    change. Worth remembering at diagnosis.

    What this does not break: rules from group policy, the domain profile, the
    private profile, or outbound connections.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Usługi dopuszczone wyłącznie regułą lokalną przestają być osiągalne, gdy maszyna trafi do profilu publicznego
      - Wyjątki dodane przez instalatory programów przestają obowiązywać i nikt ich nie wymieni z pamięci, trzeba je wyliczyć z konfiguracji zapory
      - Objaw pojawia się nagle, przy zmianie rozpoznania sieci, i wygląda na awarię sieci zamiast na skutek zmiany
      - Reguły z zasad grupy, profil domenowy i profil prywatny pozostają bez zmian
    en:
      - Services admitted by a local rule alone cease to be reachable once the machine falls into the public profile
      - Exceptions added by program installers cease to hold, and nobody will name them from memory - they have to be enumerated from the firewall configuration
      - The symptom appears suddenly, at a change of network recognition, and looks like a network breakdown instead of the upshot of a change
      - Rules from group policy, the domain profile and the private profile stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna korzysta z reguł lokalnych dopuszczających usługi i nie przeniesiono ich do zasad grupy
      - Maszyna nie jest zarządzana centralnie, więc reguły lokalne są jedynym istniejącym zbiorem
    en:
      - The machine uses local rules admitting services and they have not been moved into group policy
      - The machine is not managed centrally, so local rules are the only set there is
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The reading names the state rather than a bare true or false, so that the
      # report says what holds in the public profile instead of naming a switch
      # nobody remembers the sense of.
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' }
      else {
        if ([string]$public.AllowLocalFirewallRules -eq 'False') { 'IGNORED' } else { 'MERGED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'IGNORED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public |
      Select-Object -Property Name, AllowLocalFirewallRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules $b.AllowLocalFirewallRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt jest wart pokazania jako rzecz o przejrzystości, a nie o blokadzie.
    Zmiana sprawia, że konfiguracja zapory widoczna w zasadach grupy staje
    się pełnym opisem tego, co maszyna przepuszcza w profilu publicznym.
    Bez niej opis ten jest niepełny i nikt nie wie o ile.

    Warunkiem rozsądnego wdrożenia jest to, żeby maszyna była zarządzana
    centralnie. Na maszynie bez zasad grupy zmiana ta odcina jedyny
    istniejący zbiór reguł — i wtedy punkt jest nie do zastosowania, a nie
    do przemyślenia.

    Reguła idzie w parze z bliźniaczą, dotyczącą lokalnych reguł zabezpieczeń
    połączeń. Obie wyrażają tę samą decyzję w dwóch zbiorach reguł
    i naturalnie wdraża się je razem.
  en: |
    The item is worth showing as a matter of clarity rather than of blocking. The
    change brings it about that the firewall configuration seen in group policy
    becomes a full description of what the machine lets through in the public
    profile. Without it that description is incomplete, and nobody knows by how
    much.

    The condition of a sensible rollout is that the machine be managed centrally. On
    a machine with no group policy this change cuts off the only set of rules there
    is - and then the item is inapplicable rather than a matter for thought.

    The rule goes in a pair with its twin, on local connection security rules. Both
    express the same decision in two sets of rules and are naturally rolled out
    together.
