id: win2016-device-metadata-retrieval-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Blokada pobierania opisów urządzeń z internetu
    en: Device descriptions not fetched from the internet
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje pobieranie z internetu opisów podłączanych urządzeń —
    ich nazw handlowych, ikon i informacji o producencie.

    Mechanizm istnieje dla wygody. Urządzenie podłączone do maszyny zgłasza
    identyfikator, a system pobiera do niego ładny opis, żeby w liście
    urządzeń widniała nazwa handlowa zamiast ciągu znaków.

    Zagrożenie nie leży w samym pobieranym opisie, tylko w tym, że
    pobieranie jest zdarzeniem wychodzącym, wyzwalanym przez podłączenie
    sprzętu. Maszyna zgłasza na zewnątrz, co do niej właśnie podłączono,
    i robi to w chwili podłączenia.

    Na serwerze warto to zamknąć z dwóch powodów. Po pierwsze, sprzęt
    podłącza się tam rzadko, więc wygoda nic nie znaczy. Po drugie,
    zdarzenie wychodzące związane z podłączeniem urządzenia jest sygnałem
    o maszynie, którego nikt nie zamawiał.

    Punkt nie dotyczy sterowników. Sprzęt działa dalej i pobiera sterownik
    tak samo jak dotąd.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    zdarzenie wychodzące w chwili podłączenia sprzętu i opis pobierany bez
    niczyjej decyzji.
  en: |
    The setting blocks the fetching from the internet of descriptions of plugged-in devices - their
    trade names, icons and word of their maker.

    The mechanism exists for convenience. A device plugged into the machine reports an identifier, and
    the system fetches a handsome description for it, so that a trade name rather than a string of
    characters should stand in the device list.

    The threat lies not in the fetched description itself but in the fetching being an outgoing event,
    set off by hardware being plugged in. The machine reports outward what has just been plugged into
    it, and does so at the moment of plugging.

    On a server that is worth shutting for two reasons. First, hardware is plugged in there seldom, so
    the convenience means nothing. Second, an outgoing event tied to a device's plugging in is a signal
    about the machine that nobody ordered.

    The item does not concern drivers. Hardware works on and picks up its driver just as before.

    What an attacker gains while the item goes unmet: little - an outgoing event at the moment hardware
    is plugged in, and a description fetched at nobody's decision.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana dotyczy wyłącznie opisów, nie sterowników. Urządzenie podłączone
    po zmianie działa tak samo, pobiera sterownik tak samo i zgłasza się
    systemowi tak samo.

    Jedyny widoczny skutek dotyczy nazewnictwa w liście urządzeń: zamiast
    nazwy handlowej pojawi się nazwa ogólna, zbudowana z identyfikatora
    sprzętu. Jest to różnica kosmetyczna, ale warto ją zapowiedzieć, bo
    lista urządzeń wygląda po zmianie mniej czytelnie, a wygląd ten bywa
    brany za objaw kłopotu ze sterownikiem.

    Na serwerze skutek ten dotyczy zwykle kilku pozycji, bo urządzeń
    podłączanych jest tam niewiele.

    Nie wiąże się z tym restart ani zatrzymanie usługi.

    Czego to nie psuje: działania urządzeń, pobierania sterowników, wydruku,
    nośników wymiennych, pracy systemu, sieci. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    The change concerns descriptions alone, not drivers. A device plugged in after the change works the
    same, picks up its driver the same and reports itself to the system the same.

    The one visible consequence concerns the naming in the device list: instead of a trade name a
    general one will appear, built from the hardware's identifier. It is a cosmetic difference, but
    worth announcing, the device list looking after the change less legible, and that look being at
    times taken for a symptom of trouble with a driver.

    On a server that consequence touches as a rule a few entries, few devices being plugged in there.

    No restart or stopping of a service goes with it.

    What this does not break: the working of devices, the fetching of drivers, printing, removable media,
    the system's working, or the network. There are no known regressions.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - W liście urządzeń pojawi się nazwa ogólna zbudowana z identyfikatora sprzętu zamiast nazwy handlowej
      - Lista urządzeń wygląda przez to mniej czytelnie, a wygląd ten bywa brany za objaw kłopotu ze sterownikiem
      - Działanie urządzeń i pobieranie sterowników pozostaje bez zmian
      - Wydruk, nośniki wymienne, praca systemu i sieć pozostają bez zmian
    en:
      - In the device list a general name built from the hardware identifier will appear instead of a trade name
      - The device list looks through that less legible, and that look is at times taken for a symptom of trouble with a driver
      - The working of devices and the fetching of drivers stay unchanged
      - Printing, removable media, the system's working and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa rozpoznaje urządzenia w liście po nazwach handlowych i nie ma innego sposobu ich odróżnienia
    en:
      - The attendance recognises devices in the list by their trade names and there is no other way of telling them apart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
      $name = 'PreventDeviceMetadataFromNetwork'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
    $name = 'PreventDeviceMetadataFromNetwork'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Descriptions only, not drivers - hardware goes on working and picking up
    # its driver the same way. What changes is the labelling in the device list:
    # generic names instead of trade ones.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PreventDeviceMetadataFromNetwork' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-metadata-retrieval-client

notes:
  pl: |
    Punkt zamyka blok i jest w nim najlżejszy. Warto pokazywać go na końcu
    właśnie dlatego: po czterech regułach o wysyłaniu i jednej o pobieraniu
    kodu ta jedna dotyczy pobierania obrazków i nazw.

    Kategoria niska jest tu postawiona zgodnie z kryterium i warto, żeby
    opis to przyznawał zamiast naciągać uzasadnienie. Napastnik nie zyskuje
    przy niespełnieniu tego punktu drogi wejścia ani ułatwienia — zyskuje
    co najwyżej wiedzę, że do maszyny coś podłączono. Wartość reguły leży
    w spójności: maszyna, która nie odzywa się na zewnątrz bez powodu, nie
    odzywa się także przy podłączeniu sprzętu.

    Ostrzeżenie o mniej czytelnej liście urządzeń jest drobiazgiem, ale
    warto je zachować. Jest to jedyny widoczny skutek tej reguły, a skutek
    widoczny bez ostrzeżenia bywa zgłaszany jako usterka.

    Odnotowuję, że ten punkt kończy blok domknięciem kierunku: pierwsze
    cztery reguły zamykały to, co maszyna mówi o sobie, piąta to, co
    przyjmuje do wykonania, a szósta to, co mówi o rzeczach do niej
    podłączanych.
  en: |
    The item shuts the block and is the lightest in it. It is worth showing at the end for just that
    reason: after four rules about sending and one about fetching code, this one concerns the fetching of
    pictures and names.

    The low category is set here in keeping with the criterion, and it is well that the description own
    it rather than strain the warrant. An attacker gains at this item's going unmet neither a road in nor
    an easing - they gain at most the knowledge that something was plugged into the machine. The rule's
    value lies in coherence: a machine that does not speak outward without cause does not speak at a
    plugging in of hardware either.

    The warning about a less legible device list is a trifle, but worth keeping. It is this rule's one
    visible consequence, and a visible consequence without a warning gets reported as a defect.

    Worth noting that this item ends the block by shutting the direction: the first four rules shut what
    the machine says about itself, the fifth what it takes in for carrying out, and the sixth what it
    says about the things plugged into it.
