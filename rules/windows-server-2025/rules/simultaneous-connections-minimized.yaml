id: win2025-simultaneous-connections-minimized

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connection Manager
  title:
    pl: Równoczesne połączenia z wieloma sieciami ograniczone
    en: Simultaneous connections to several networks limited
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe menedżerowi połączeń zrywać połączenie
    bezprzewodowe, gdy maszyna ma łączność kablem. Chodzi o to, żeby nie
    stała jednocześnie w dwóch sieciach i nie łączyła ich sobą.

    Trzymam tu kategorię niską i chcę powiedzieć dlaczego, bo jest to
    obniżenie względem paczki stanowiska roboczego.

    Na stanowisku warunek jest spełniony stale: przenośny komputer ma
    radio i wpina się kablem, gdy trafi na biurko. Na serwerze radia
    zwykle po prostu nie ma. Maszyna w serwerowni ma karty kablowe
    i nic, co by menedżer połączeń nawiązywał — a ustawienie dotyczy
    wyłącznie połączeń nawiązywanych przez niego.

    Na takiej maszynie punkt jest formalnością. Zamyka się w raporcie
    i nic za tym nie stoi. Uważam, że lepiej to napisać wprost, niż
    utrzymywać ocenę, która sugeruje wagę, której tu nie ma.

    Ocena wraca wyżej dokładnie tam, gdzie wraca radio: serwer
    w oddziale, maszyna w miejscu bez pełnego okablowania, sprzęt
    z modemem komórkowym jako łączem zapasowym. Tam maszyna faktycznie
    bywa w dwóch sieciach naraz i tam punkt ma treść.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z radiem możliwość dosięgnięcia jej z sieci
    bezprzewodowej wtedy, gdy stoi ona równocześnie w sieci
    organizacji.
  en: |
    The setting bids the manager of connections break a wireless connection where the machine has
    link by cable. The aim is that it stand not in two nets at once and join them not by itself.

    I keep the category low here and mean to say why, it being a lowering against the working
    station's pack.

    At a station the condition is met always - a carried computer has a radio and is plugged in by
    cable when it comes to a desk. On a server there is mostly simply no radio. A machine in a
    server room has cabled cards and nothing the manager of connections would open - and the
    setting bears on connections opened by it alone.

    On such a machine the item is a formality. It shuts in the report and nothing stands behind it.
    I hold it better written outright than to keep a reckoning that hints at a weight which here is
    not.

    The reckoning comes back higher just where the radio comes back - a server in a branch, a
    machine in a place with no full cabling, gear with a mobile modem as a spare link. There the
    machine is truly at times in two nets at once and there the item has a substance.

    What an attacker gains while the item goes unmet: on a machine with a radio, the means of
    reaching it out of the wireless net while it stands at the same time in the body's net.

disruption_description:
  pl: |
    Sprawdzenia wymaga to samo, co przy zakazie sieci spoza domeny: czy
    ta maszyna ma radio albo modem.

    Jeżeli nie ma, zmiana nie robi nic. Zostawiam ją mimo to poza trybem
    zbiorczym, i to z powodu, który wart jest nazwania. Wybrany wariant
    zrywa połączenie bezprzewodowe w chwili pojawienia się kabla. Jeżeli
    maszyna jest zarządzana zdalnie przez to właśnie radio — a tak bywa
    w oddziałach — zmiana potrafi odciąć sesję, z której się ją wykonuje,
    w momencie, którego nikt nie przewidział: przy przypadkowym wpięciu
    kabla przez kogoś na miejscu.

    Jest to rzadki przypadek, ale dokładnie taki, dla jakiego istnieje
    klasa „wymaga sprawdzenia". Tryb zbiorczy nie wie, przez co jest
    połączony.

    Drugi przypadek to łącze zapasowe. Radio ma zadziałać, gdy kabel
    zawiedzie. Wybrany wariant zrywa radio, dopóki kabel wygląda na
    działający — więc przy awarii, w której kabel jest wpięty, ale nic
    przez niego nie przechodzi, łącze zapasowe nie wejdzie.

    Ustawienie jest wyborem z kilku wariantów, a nie przełącznikiem.
    Audyt zgłasza znalezioną wartość, więc wariant słabszy widać
    w raporcie jako własną liczbę, a nie jako brak ustawienia.

    Ustawienie wiąże po restarcie usługi menedżera połączeń, a cofa się
    natychmiast.
  en: |
    What needs checking is the same as at the ban on nets outside the domain - whether this machine
    has a radio or a modem.

    If it has not, the change does nothing. I leave it outside the bulk mode for all that, and for
    a ground worth naming. The chosen variant breaks the wireless connection at the moment a cable
    shows. If the machine is managed from afar by that very radio - and so it is at times in
    branches - the change can cut the session it is made from, at a moment nobody foresaw: at a
    cable plugged in by chance by somebody on the spot.

    It is a rare case, but just such a one as the class "needs review" is there for. The bulk mode
    knows not what it is joined by.

    The second case is the spare link. The radio is to work when the cable fails. The chosen
    variant breaks the radio so long as the cable looks to be working - so at a fault wherein the
    cable is plugged in but nothing passes by it, the spare link will not come in.

    The setting is a choosing out of several variants and no switch. The audit reports the value
    found, so a weaker variant is seen in the report as a number of its own and not as a want of
    any setting.

    The setting binds after a restart of the service of the manager of connections, and is undone
    at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Połączenie bezprzewodowe zostanie zerwane w chwili, gdy maszyna dostanie łączność kablem
      - Sesja zarządzania idąca przez radio urwie się, jeśli ktoś na miejscu wepnie kabel
      - Łącze zapasowe przez radio nie wejdzie przy awarii, w której kabel jest wpięty, ale nic nie przechodzi
      - Na maszynie bez radia i modemu zmiana nie robi zupełnie nic
      - Ustawienie wiąże dopiero po restarcie usługi menedżera połączeń
    en:
      - The wireless connection will be broken at the moment the machine gets link by cable
      - A session of management going by the radio will break if somebody on the spot plugs a cable in
      - The spare link over the radio will not come in at a fault wherein the cable is in but nothing passes
      - On a machine with no radio and no modem the change does nothing at all
      - The setting binds only after a restart of the service of the manager of connections
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer jest zarządzany zdalnie przez połączenie bezprzewodowe, które ta zmiana zerwie
      - Radio albo modem pełni rolę łącza zapasowego na wypadek awarii łącza kablowego
    en:
      - The server is managed from afar by a wireless connection this change will break
      - The radio or the modem serves as a spare link against a fault of the cabled one
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is a choice out of four, not a switch. Three is the variant
      # the item calls for - wireless dropped while the cable is in. The weaker
      # variants are reported with their own value so the report says which one
      # was found.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
      $name = 'fMinimizeConnections'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    $name = 'fMinimizeConnections'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the machine is managed by the radio, this breaks that connection as
    # soon as a cable shows. Know your way in by the cable first.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fMinimizeConnections' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/

notes:
  pl: |
    Obniżyłem kategorię do niskiej, bo na serwerze w serwerowni radia
    zwykle nie ma, a ustawienie dotyczy wyłącznie połączeń nawiązywanych
    przez menedżera połączeń. Na takiej maszynie jest to formalność
    i lepiej to napisać wprost, niż utrzymywać ocenę sugerującą wagę,
    której tu nie ma. Ocena wraca wyżej tam, gdzie wraca radio.

    Powód, dla którego reguła zostaje poza trybem zbiorczym mimo niskiej
    kategorii: wybrany wariant zrywa radio w chwili pojawienia się
    kabla, więc na maszynie zarządzanej przez radio potrafi urwać sesję
    w momencie, którego nikt nie przewidział.

    Punkt czyta się razem z zakazem łączenia z siecią spoza domeny —
    oba dotyczą tego samego menedżera połączeń.
  en: |
    I lowered the category to low, a server in a server room mostly having no radio, and the
    setting bearing on connections opened by the manager of connections alone. On such a machine it
    is a formality and better written outright than kept as a reckoning hinting at a weight which
    here is not. The reckoning comes back higher where the radio comes back.

    The ground for which the rule stays outside the bulk mode despite the low category - the chosen
    variant breaks the radio at the moment a cable shows, so on a machine managed by the radio it
    can cut a session at a moment nobody foresaw.

    The item is read together with the ban on joining a net outside the domain - both bear on the
    same manager of connections.
