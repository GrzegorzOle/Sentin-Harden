id: win2016-uac-admin-approval-builtin-account

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora objęte kontrolą uprawnień
    en: The built-in administrator account covered by the control of rights
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt obejmuje kontrolą uprawnień również wbudowane konto administratora,
    które domyślnie jest z niej wyjęte.

    Wyjątek ten zasługuje na nazwanie, bo bywa nieznany. Mechanizm kontroli
    uprawnień obejmuje wszystkie konta administracyjne oprócz jednego — tego
    wbudowanego. Konto o pełnej władzy nad maszyną pracuje więc tak, jakby
    mechanizmu nie było wcale, nawet gdy jest on włączony dla wszystkich
    pozostałych.

    Kategoria wysoka, bo to jest luka dokładnie w tym miejscu, w którym
    ochrona miała być najmocniejsza. Program uruchomiony na tym koncie
    dostaje pełne uprawnienia od pierwszej instrukcji, a raport sprawdzający
    kontrolę uprawnień pokazuje ją jako włączoną.

    Na serwerze 2016 rzecz waży więcej niż gdzie indziej, bo na maszynach tego
    rocznika praca na koncie wbudowanym bywa zwyczajem, a nie wyjątkiem.
    Część starych procedur wdrożeniowych wprost zakładała, że administrator
    loguje się właśnie tam.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesja na
    koncie wbudowanym daje pełne uprawnienia bez żadnego potwierdzenia,
    a więc przejęcie tego jednego konta znosi cały mechanizm naraz.
  en: |
    The item brings the built-in administrator account, which is exempt by
    default, under the control of rights as well.

    That exemption deserves naming, because it tends to be unknown. The
    rights-control mechanism covers every administrative account except one -
    the built-in. An account with full power over the machine therefore works
    as though the mechanism did not exist at all, even where it is on for
    everybody else.

    The category is high, because this is a gap in exactly the place where the
    protection was meant to be strongest. A program started under this account
    gets full rights from its first instruction, while a report checking the
    control of rights shows it as switched on.

    On Server 2016 this weighs more than elsewhere, because on machines of this
    vintage working under the built-in account tends to be a habit rather than
    an exception. Some old deployment procedures assumed outright that the
    administrator signs in there.

    What an attacker gains while the item goes unmet: a session under the
    built-in account gives full rights with no confirmation at all, so taking
    that one account cancels the whole mechanism at once.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód dotyczy sposobu pracy, a nie
    aplikacji.

    Po zmianie praca na koncie wbudowanym zacznie wyglądać tak jak na każdym
    innym koncie administracyjnym: czynności wymagające pełnych uprawnień
    będą poprzedzone potwierdzeniem. Dla człowieka przy konsoli jest to
    drobna niedogodność. Dla procedury uruchamianej bez obsługi jest to
    zatrzymanie.

    Najważniejsza rzecz do sprawdzenia: czy coś na tej maszynie loguje się na
    konto wbudowane automatycznie i wykonuje potem czynności administracyjne.
    Na serwerze 2016 bywa to procedura kopii zapasowej, skrypt obsługi
    aplikacji branżowej albo zadanie zaplanowane przy wdrożeniu maszyny.

    Osobna uwaga dotyczy sesji zdalnych. Praca na koncie wbudowanym przez
    pulpit zdalny po tej zmianie wymaga potwierdzeń tak samo jak przy
    konsoli — a to jest właśnie ten sposób pracy, który na serwerze
    przeważa.

    Czego to nie psuje: samego logowania na konto wbudowane, jego uprawnień
    ani niczego, co uprawnień administracyjnych nie wymaga.

    Zmiana wymaga ponownego uruchomienia maszyny.
  en: |
    The class is "needs planned rollout", and the reason concerns the way of
    working rather than applications.

    After the change, working under the built-in account will look like working
    under any other administrative account: actions needing full rights will be
    preceded by a confirmation. For a person at the console that is a small
    inconvenience. For an unattended procedure it is a halt.

    The most important thing to check: does anything on this machine sign in to
    the built-in account automatically and then carry out administrative work.
    On Server 2016 that is sometimes a backup procedure, a script serving a
    line-of-business application, or a task scheduled when the machine was
    deployed.

    A separate note about remote sessions. Working under the built-in account
    through remote desktop will after this change require confirmations just as
    at the console - and that is precisely the way of working that predominates
    on a server.

    What this does not break: signing in to the built-in account itself, its
    rights, or anything that does not need administrative rights.

    The change needs the machine restarted.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
    - updates-and-servicing
  what_breaks:
    pl:
      - Czynności administracyjne na koncie wbudowanym zaczynają wymagać potwierdzenia
      - Procedury logujące się na to konto automatycznie zatrzymują się na potwierdzeniu, którego nikt nie widzi
      - Praca przez pulpit zdalny na tym koncie wymaga potwierdzeń tak samo jak przy konsoli
      - Samo logowanie na konto wbudowane i jego uprawnienia pozostają bez zmian
    en:
      - Administrative actions under the built-in account start requiring confirmation
      - Procedures signing in to this account automatically stop at a confirmation nobody sees
      - Working under this account through remote desktop requires confirmations just as at the console
      - Signing in to the built-in account itself, and its rights, stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na konto wbudowane loguje się automatycznie procedura wykonująca potem czynności administracyjne
    en:
      - A procedure that then carries out administrative work signs in to the built-in account automatically
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'FilterAdministratorToken'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'FilterAdministratorToken'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # By default the built-in account is the one exception to the whole
    # mechanism, so the report can show the control switched on while the most
    # powerful account works outside it. Takes effect after a restart.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FilterAdministratorToken' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-admin-approval-mode-for-the-built-in-administrator-account

notes:
  pl: |
    Punkt ma sens wyłącznie razem z włączoną kontrolą uprawnień. Ustawiony
    przy mechanizmie wyłączonym nie robi nic, choć w rejestrze wygląda tak
    samo — dlatego te dwie reguły warto czytać razem.

    Wpis dotyczy konta rozpoznawanego po identyfikatorze, więc przemianowanie
    konta niczego tu nie zmienia. Reguła przemianowania i ta reguła to dwa
    różne zabezpieczenia tego samego konta.

    Wartość leży w kluczu wspólnym dla całej grupy kontroli uprawnień.
    Przy cofaniu usuwana jest wyłącznie ta jedna wartość.
  en: |
    The item makes sense only alongside the control of rights being on. Set
    while the mechanism is off it does nothing, although in the registry it
    looks the same - which is why the two rules are worth reading together.

    The entry concerns an account recognised by its identifier, so renaming the
    account changes nothing here. The renaming rule and this rule are two
    different safeguards on the same account.

    The value lies in a key shared by the whole rights-control group. Undoing
    removes this one value alone.
