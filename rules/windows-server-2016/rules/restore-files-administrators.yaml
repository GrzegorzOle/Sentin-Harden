id: win2016-restore-files-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odtwarzanie plików tylko dla administratorów
    en: Restoring files restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do odtwarzania plików i katalogów do grupy
    administratorów lokalnych.

    To jest odwrotność uprawnienia do tworzenia kopii zapasowych i wersja
    groźniejsza. Tamto pozwala czytać wszystko z pominięciem uprawnień
    plikowych. To pozwala wszystko zapisać — również nadpisać plik, do którego
    konto nie ma dostępu, i również ustawić uprawnienia zapisywanego pliku
    dowolnie.

    Kategoria krytyczna, bo droga do pełnej władzy nad maszyną jest tu krótka
    i nie wymaga niczego poza samym uprawnieniem. Wystarczy nadpisać plik
    wykonywalny uruchamiany przez usługę systemową albo bibliotekę ładowaną
    przy starcie — i przy następnym uruchomieniu kod napastnika działa na
    koncie systemowym.

    Drugi skutek dotyczy śladów. Posiadacz tego uprawnienia może odtworzyć plik
    razem z jego właścicielem i uprawnieniami, czyli przywrócić stan sprzed
    zmiany. Przegląd uprawnień po takiej operacji nie pokaże niczego.

    Na serwerze 2016 punkt dotyczy tych samych kont co poprzedni, bo
    oprogramowanie kopii zapasowych zwykle prosi o oba uprawnienia naraz.
    Warto jednak rozdzielić decyzję: część narzędzi wykonuje wyłącznie kopie
    i uprawnienia do odtwarzania nie potrzebuje wcale.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapis dowolnego
    pliku na maszynie, łącznie z plikami usług systemowych, i możliwość
    zatarcia śladu przez przywrócenie pierwotnych uprawnień.
  en: |
    The item limits the right to restore files and directories to the local
    administrators group.

    This is the reverse of the right to back files up, and the more dangerous
    version. That one allows everything to be read while bypassing file
    permissions. This one allows everything to be written - including overwriting a
    file the account has no access to, and setting the written file's permissions
    however one likes.

    The critical category applies because the road to full power over the machine
    is short here and needs nothing beyond the right itself. It is enough to
    overwrite an executable run by a system service, or a library loaded at
    startup - and at the next start the attacker's code runs under the system
    account.

    The second effect concerns traces. The holder of this right can restore a file
    together with its owner and permissions, that is, put back the state from
    before the change. A review of permissions after such an operation will show
    nothing.

    On Server 2016 the item concerns the same accounts as the previous one, because
    backup software usually asks for both rights at once. The decision is worth
    separating, though: some tools only make backups and do not need the restoring
    right at all.

    What an attacker gains while the item goes unmet: the writing of any file on
    the machine, including the files of system services, and the ability to erase
    the trace by putting the original permissions back.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" z tego samego powodu co przy kopiach zapasowych:
    decyduje konto, na którym działa oprogramowanie.

    Różnica jest jednak istotna i warto ją wykorzystać. Uprawnienie do
    odtwarzania jest potrzebne wyłącznie wtedy, gdy narzędzie faktycznie
    przywraca dane na tę maszynę. Narzędzie, które tylko wysyła kopie na
    zewnątrz, nie potrzebuje go w codziennej pracy — potrzebuje go dopiero
    w dniu odtwarzania, a wtedy operacją i tak kieruje administrator.

    To jest dobry powód, żeby rozważyć odebranie tego uprawnienia nawet tam,
    gdzie uprawnienie do kopii zostaje. Koszt jest zerowy przez większość czasu,
    a nadać je z powrotem na czas odtwarzania można w minutę.

    Skutek odebrania go narzędziu, które go potrzebuje, jest widoczny od razu:
    odtwarzanie kończy się odmową dostępu. To jest różnica wobec kopii
    zapasowych, gdzie błąd bywa cichy — tutaj widać go przy pierwszej próbie.

    Czego to nie psuje: zapisu plików wynikającego ze zwykłych uprawnień,
    aktualizacji systemu, udostępniania ani odtwarzania wykonywanego przez
    administratora.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review" for the same reason as with backups: the account
    the software runs under decides.

    The difference is material, though, and worth using. The restoring right is
    needed only where the tool actually puts data back onto this machine. A tool
    that merely sends copies elsewhere does not need it in daily work - it needs it
    on the day of a restore, and an administrator directs that operation anyway.

    That is a good reason to consider taking this right away even where the backup
    right stays. The cost is nil most of the time, and granting it again for the
    duration of a restore takes a minute.

    The effect of taking it from a tool that needs it shows at once: the restore
    ends in an access refusal. That is the difference from backing up, where the
    error is sometimes silent - here it shows at the first attempt.

    What this does not break: writing files by way of ordinary permissions, system
    updates, sharing, or a restore carried out by an administrator.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - updates-and-servicing
  what_breaks:
    pl:
      - Oprogramowanie odtwarzające dane na koncie usługowym spoza grupy administratorów kończy się odmową dostępu
      - Odtwarzanie pliku razem z jego pierwotnym właścicielem i uprawnieniami przestaje być możliwe spoza tej grupy
      - Błąd jest widoczny od razu, przy pierwszej próbie odtworzenia, a nie dopiero przy audycie kopii
      - Zapis wynikający ze zwykłych uprawnień, aktualizacje systemu i odtwarzanie przez administratora działają bez zmian
    en:
      - Software restoring data under a service account outside the administrators group ends in an access refusal
      - Restoring a file together with its original owner and permissions stops being possible from outside that group
      - The error shows at once, at the first restore attempt, rather than at an audit of the backups
      - Writing by way of ordinary permissions, system updates and a restore by an administrator work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie odtwarzające dane działa na koncie usługowym spoza grupy administratorów i trwa właśnie odtwarzanie
      - Maszyna jest kontrolerem domeny, a uprawnienie mają operatorzy kopii zapasowych zgodnie ze stanem domyślnym
    en:
      - Software restoring data runs under a service account outside the administrators group and a restore is under way
      - The machine is a domain controller and backup operators hold the right in accordance with the default state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRestorePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Overwriting an executable run by a system service is enough to have the
    # attacker's code run as the system at the next start. Check whether the tool
    # restores onto this machine at all - many only send copies away.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRestorePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRestorePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/restore-files-and-directories

notes:
  pl: |
    Uprawnienie to bywa nadawane razem z uprawnieniem do kopii zapasowych, bo
    instrukcje producentów wymieniają je jednym tchem. Warto je rozdzielić:
    kopiowanie i odtwarzanie to dwie różne czynności, wykonywane w różnych
    momentach i przez różne osoby.

    Stan domyślny różni się między rolami maszyny tak samo jak przy kopiach.
    Serwer członkowski ma tu administratorów i operatorów kopii zapasowych,
    kontroler domeny dodatkowo operatorów serwera. Wynik niezgodny na maszynie
    nietkniętej jest wynikiem prawdziwym.

    Odtwarzanie z pominięciem uprawnień obejmuje także uprawnienia samego
    odtwarzanego pliku. To jest ten mechanizm, dzięki któremu kopia zapasowa
    przywraca strukturę uprawnień — i ten sam, dzięki któremu daje się ją
    przepisać.
  en: |
    This right gets granted together with the backup right, because vendors'
    instructions name them in one breath. They are worth separating: copying and
    restoring are two different actions, done at different times and by different
    people.

    The default state differs between the machine's roles just as with backups. A
    member server has administrators and backup operators here; a domain controller
    has server operators as well. A non-compliant result on an untouched machine is
    a true result.

    Restoring while bypassing permissions covers the restored file's own
    permissions too. That is the mechanism by which a backup puts a permission
    structure back - and the same one by which it can be rewritten.
