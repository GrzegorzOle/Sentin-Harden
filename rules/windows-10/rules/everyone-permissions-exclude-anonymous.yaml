id: win10-everyone-permissions-exclude-anonymous

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uprawnienia nadane wszystkim nieobejmujące połączeń bez poświadczeń
    en: Rights granted to everybody not covering connections without credentials
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że uprawnienia nadane grupie obejmującej wszystkich
    nie obejmują połączeń, które nie podały poświadczeń.

    Jest to reguła, która porządkuje znaczenie słowa użytego w uprawnieniach
    setki razy. Nadając dostęp „wszystkim", człowiek ma na myśli wszystkich
    użytkowników, a nie wszystkich w ogóle. Bez tego ustawienia system
    rozumie to dosłownie i zalicza do nich połączenie anonimowe.

    Skutek jest taki, że każde uprawnienie nadane szeroko — na udziale, na
    katalogu, na gałęzi rejestru, na obiekcie usługi — staje się
    uprawnieniem dostępnym bez uwierzytelnienia. Nie trzeba przy tym żadnego
    wpisu na żadnym wykazie wyjątków; wystarczy uprawnienie nadane wygodnie.

    Reguła jest więc zabezpieczeniem tego, co i tak zostało nadane, przed
    znaczeniem szerszym niż zamierzone. Nie odbiera nikomu dostępu i nie
    zmienia żadnego uprawnienia — zawęża tylko zbiór, do którego słowo
    „wszyscy" się odnosi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wszystkie
    uprawnienia nadane szeroko na tej maszynie, bez konta i bez hasła.
  en: |
    The setting makes rights granted to the group holding everybody not cover connections that have given no
    credentials.

    It is a rule that sets in order the meaning of a word used in rights a hundred times over. Granting access
    to "everybody", a person means every user, not everybody whatever. Without this setting the system
    understands it literally and counts the anonymous connection among them.

    The consequence is that every right granted broadly - upon a share, upon a directory, upon a registry
    branch, upon a service object - becomes a right to be had without authentication. No entry on any roll of
    exceptions is needed for that; a right granted for convenience suffices.

    The rule is therefore a safeguard for what has been granted anyway, against a meaning wider than was meant.
    It takes access from nobody and changes no right - it narrows only the set the word "everybody" points to.

    What an attacker gains while the item goes unmet: every right granted broadly upon this machine, without an
    account and without a password.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, co na tej
    maszynie faktycznie opiera się na uprawnieniu nadanym wszystkim.

    Wartość wymagana jest domyślna, więc na maszynie nietykanej zmiana
    potwierdza stan zastany. Tam, gdzie wartość zmieniono, zrobiono to
    zwykle dawno i po to, żeby coś zaczęło działać — a to „coś" trzeba
    odszukać przed wykonaniem.

    Najczęściej jest to udział albo katalog, z którego korzysta urządzenie
    niepodające poświadczeń. Po zmianie dostęp znika, bo połączenie
    anonimowe przestaje być zaliczane do wszystkich. Objaw jest
    natychmiastowy i wygląda na odebranie uprawnień, choć uprawnienia
    nikt nie ruszał.

    Drugi przypadek, rzadszy, dotyczy starszych usług sieciowych
    odczytujących z maszyny dane konfiguracyjne przez dostęp nadany szeroko.

    Rozwiązaniem właściwym jest konto dla tego, co się łączy, a nie
    przywrócenie wartości.

    Czego to nie psuje: uprawnień nadanych kontom i grupom nazwanym,
    logowania, kont domenowych, udziałów dla połączeń uwierzytelnionych,
    drukowania, usług systemowych.
  en: |
    The class is "needs review", and the review touches what on this machine truly rests upon a right granted to
    everybody.

    The value called for is the default, so on an untouched machine the change confirms the state found. Where
    the value has been changed, that was as a rule done long ago and so that something should work - and that
    something has to be sought out before carrying out.

    Most often it is a share or a directory used by a device that gives no credentials. After the change the
    access goes, the anonymous connection ceasing to be counted among everybody. The symptom is immediate and
    looks like rights having been taken away, though nobody touched any right.

    The second case, the rarer, touches older network services reading configuration data off the machine
    through access granted broadly.

    The right answer is an account for whatever joins, not the putting back of the value.

    What this does not break: rights granted to named accounts and groups, logging on, domain accounts, shares
    for authenticated connections, printing, or system services.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
  what_breaks:
    pl:
      - Urządzenie korzystające z udziału albo katalogu na uprawnieniu nadanym wszystkim traci do niego dostęp
      - Objaw wygląda na odebranie uprawnień, choć żadnego uprawnienia nikt nie zmieniał
      - Starsze usługi sieciowe odczytujące dane konfiguracyjne przez dostęp nadany szeroko przestają je odczytywać
      - Uprawnienia nadane kontom i grupom nazwanym działają dalej dokładnie tak jak dotąd
      - Logowanie, konta domenowe, udziały dla połączeń uwierzytelnionych i drukowanie pozostają bez zmian
    en:
      - A device using a share or a directory on a right granted to everybody loses its access to it
      - The symptom looks like rights having been taken away, though nobody changed any right
      - Older network services reading configuration data through access granted broadly cease reading it
      - Rights granted to named accounts and groups work on exactly as before
      - Logging on, domain accounts, shares for authenticated connections and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z zasobów tej maszyny korzysta urządzenie bez poświadczeń, opierając się na uprawnieniu nadanym wszystkim
      - Starsza usługa sieciowa odczytuje z tej maszyny dane konfiguracyjne przez dostęp nadany szeroko i nie ma zamiennika
    en:
      - A device without credentials uses this machines resources, resting on a right granted to everybody
      - An older network service reads configuration data off this machine through access granted broadly and has no substitute
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'EveryoneIncludesAnonymous'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'EveryoneIncludesAnonymous'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # No right is changed here - only the set the word "everybody" points to gets
    # narrowed. Where something joins without credentials, give it an account
    # rather than put this value back.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EveryoneIncludesAnonymous' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-let-everyone-permissions-apply-to-anonymous-users

notes:
  pl: |
    Reguła zamyka blok i jest w nim tą o najszerszym zasięgu, choć zapisana
    jest jedną wartością. Nie dotyczy żadnego konkretnego zasobu — dotyczy
    znaczenia słowa użytego przy wszystkich zasobach naraz.

    Warto, żeby aplikacja postawiła to wprost, bo od tego zależy ocena.
    Pozostałe reguły tego bloku wymieniają wyjątki po nazwie; ta jedna
    rozstrzyga o domyślnym rozumieniu uprawnień nadanych wygodnie, których
    na typowej maszynie jest znacznie więcej niż wpisów na wykazach.

    Odnotowuję objaw utrudniający rozpoznanie: po zmianie wygląda to na
    odebranie uprawnień, choć żadne uprawnienie nie zostało zmienione.
    Aplikacja, która nazwie to w opisie skutków, oszczędzi komuś przeglądu
    uprawnień, w którym niczego się nie znajdzie.
  en: |
    The rule closes the block and is the widest in reach in it, though written as a single value. It touches no
    one resource - it touches the meaning of a word used at every resource at once.

    It is well that the application put that outright, the judgement hanging upon it. The block's other rules
    name their exceptions one by one; this one settles the default understanding of rights granted for
    convenience, of which on a typical machine there are far more than there are entries on the rolls.

    I set down a symptom that hinders the recognising: after the change it looks like rights having been taken
    away, though no right was changed. An application naming that in its description of consequences will spare
    somebody a review of rights in which nothing will be found.
