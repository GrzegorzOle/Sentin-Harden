id: win2016-ntlm-session-security-server

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Minimalne zabezpieczenie sesji po stronie serwera
    en: Minimum session security on the server side
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyznacza dolną granicę zabezpieczenia sesji, na jaką maszyna
    zgodzi się, występując jako strona przyjmująca połączenie.

    Żądanie jest identyczne jak po stronie klienta: szyfrowanie sesji
    i podpis oparty na dzisiejszej funkcji skrótu. Inna jest natomiast waga
    tego punktu, bo serwer przyjmuje połączenia od wszystkich, a nie od kilku
    znanych miejsc.

    Dla napastnika to jest właśnie ta strona, która ma znaczenie. Przechwycone
    uwierzytelnienie trzeba gdzieś przekazać — i przekazuje się je do serwera,
    czyli do tej maszyny. Jeżeli maszyna godzi się na sesję bez podpisu,
    przekazanie działa. Jeżeli żąda podpisu wiążącego uwierzytelnienie
    z sesją, przekazanie się nie udaje, bo podpis nie pasuje do sesji,
    do której zostało wstawione.

    Warto to powiedzieć wprost, bo zmienia sposób czytania tego punktu: reguła
    nie chroni przede wszystkim tej maszyny przed podsłuchem. Chroni całą sieć
    przed użyciem tej maszyny jako celu przekazania.

    Wartość wymagana jest ta sama co po stronie klienta i łączy oba żądania
    zapisane jako bity w jednej liczbie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: serwer
    przyjmujący uwierzytelnienie przechwycone gdzie indziej, a więc gotowy
    punkt docelowy dla ataku przekazania.
  en: |
    The setting marks the lower bound of session security the machine will consent
    to when it acts as the side receiving a connection.

    The demand is identical to the client side's: session encryption and a signature
    resting on a present-day digest function. What differs is this item's weight,
    since a server receives connections from everybody rather than from a few known
    places.

    For an attacker this is the side that matters. A captured authentication has to
    be passed somewhere - and it is passed to a server, which is to say to this
    machine. If the machine consents to a session without a signature, the passing
    works. If it demands a signature binding the authentication to the session, the
    passing fails, since the signature does not fit the session it was inserted
    into.

    Worth saying outright, since it changes the way this item reads: the rule does
    not above all guard this machine against eavesdropping. It guards the whole
    network against this machine being used as the target of a passing.

    The required value is the same as on the client side and joins both demands set
    as bits in one number.

    What an attacker gains while the item goes unmet: a server that accepts an
    authentication captured elsewhere, and so a ready destination for a passing
    attack.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i ta różnica wobec bliźniaczej reguły
    klienckiej jest treścią, a nie formalnością.

    Powód jest prosty: serwer nie wie z góry, kto się do niego łączy. Lista
    połączeń wychodzących daje się wyliczyć w godzinę; lista wszystkiego, co
    sięga po zasoby serwera, powstaje dopiero z obserwacji i bywa dłuższa, niż
    ktokolwiek zakładał. Po zmianie każdy klient, który nie obsługuje żądanego
    zabezpieczenia, przestaje wchodzić — natychmiast i bez okresu przejściowego.

    Kto to zwykle jest. Urządzenia wielofunkcyjne odkładające skany na udział.
    Terminale magazynowe i kasowe. Sterowniki maszyn produkcyjnych. Starsze
    systemy kopii zapasowych. Wspólną cechą jest to, że ich oprogramowania nie
    da się zaktualizować, bo producent przestał je wspierać albo przestał
    istnieć.

    Dlatego kolejność jest ustalona i trzeba jej pilnować. Najpierw zapis ruchu
    starszego mechanizmu przez pełny cykl miesięczny, potem przejrzenie listy,
    potem dopiero ta zmiana — i najlepiej w oknie serwisowym, z gotową decyzją
    o wycofaniu.

    Czego to nie psuje: połączeń od klientów obsługujących żądane
    zabezpieczenie, uwierzytelniania domenowego, pracy usług lokalnych ani
    logowania do konsoli.

    Bez restartu, natychmiast odwracalne — ale skutek jest natychmiastowy
    i obejmuje wszystkich klientów naraz.
  en: |
    The class is "needs a planned rollout", and that difference from the twin client
    rule is substance, not formality.

    The reason is simple: a server does not know in advance who connects to it. A
    list of outgoing connections can be drawn up in an hour; a list of everything
    that reaches for a server's resources arises only from observation and is at
    times longer than anybody assumed. After the change every client that does not
    support the protection demanded stops getting in - at once and with no
    transition period.

    Who these usually are. Multifunction devices depositing scans on a share.
    Warehouse and till terminals. Production machine controllers. Older backup
    systems. Their common trait is that their software cannot be updated, because
    the maker has stopped supporting it or stopped existing.

    The order is therefore settled and has to be kept to. First the recording of
    older mechanism traffic through a full monthly cycle, then a reading of the
    list, and only then this change - and best in a service window, with a decision
    to undo it ready.

    What this does not break: connections from clients that support the protection
    demanded, domain authentication, the working of local services, or signing in at
    the console.

    No restart, undone immediately - but the effect is immediate and takes in every
    client at once.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Urządzenie wielofunkcyjne odkładające skany na udział tej maszyny przestaje się łączyć, natychmiast i bez ostrzeżenia
      - Terminale magazynowe i kasowe oraz sterowniki maszyn produkcyjnych tracą dostęp do zasobów serwera
      - Starszy system kopii zapasowych przestaje sięgać po dane, a objaw ujawnia się dopiero przy najbliższym oknie kopii
      - Połączenia od klientów obsługujących żądane zabezpieczenie i uwierzytelnianie domenowe pozostają bez zmian
    en:
      - A multifunction device depositing scans on this machine's share stops connecting, at once and without warning
      - Warehouse and till terminals and production machine controllers lose access to the server's resources
      - An older backup system stops reaching for data, and the symptom shows only at the next backup window
      - Connections from clients that support the protection demanded and domain authentication stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis ruchu starszego mechanizmu uwierzytelniania nie przeszedł pełnego cyklu miesięcznego i lista klientów nie istnieje
      - Do zasobów tej maszyny sięgają urządzenia, których oprogramowania nie da się zaktualizować
      - Nie ma okna serwisowego ani gotowej decyzji o wycofaniu na wypadek odcięcia klientów
    en:
      - The recording of older authentication mechanism traffic has not run a full monthly cycle and the list of clients does not exist
      - This machine's resources are reached by devices whose software cannot be updated
      - There is no service window and no ready decision to undo the change should clients be cut off
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'NTLMMinServerSec'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '537395200'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'NTLMMinServerSec'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value joins two demands set as bits: session encryption and a signature
    # resting on a present-day digest function. The signature binds the
    # authentication to this session, which is what defeats a passing attack.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NTLMMinServerSec' -Value 537395200 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-minimum-session-security-for-ntlm-ssp-based-including-secure-rpc-servers

notes:
  pl: |
    Punkt jest miejscem, w którym atak przekazania uwierzytelnienia zostaje
    zatrzymany, i tak powinien być pokazany w raporcie. Reguły po stronie
    klienta ograniczają to, co da się przechwycić; ta ogranicza to, co da się
    z przechwyconym zrobić.

    Kolejność wdrożenia trzech reguł starszego mechanizmu jest ustalona
    i wynika z ryzyka, a nie z numeracji: najpierw zapis ruchu przychodzącego,
    potem strona klienta, na końcu strona serwera. Aplikacja powinna tę
    kolejność pokazywać, bo sama lista niezgodności jej nie niesie.

    Wartość jest sumą bitów i wygląda przypadkowo. Warto pokazać obok, co
    oznacza — inaczej przy ręcznym wpisywaniu bywa przekręcana, a przekręcona
    przechodzi audyt tylko wtedy, gdy trafi dokładnie, co jest tu zaletą.
  en: |
    The item is the place where a passing attack is stopped, and it should be shown
    as such in the report. The rules on the client side limit what can be captured;
    this one limits what can be done with what was captured.

    The order of rollout of the three older-mechanism rules is settled and follows
    from risk rather than from numbering: the recording of incoming traffic first,
    then the client side, and the server side last. The application should show that
    order, since the list of non-compliances does not carry it.

    The value is a sum of bits and looks arbitrary. Worth showing beside it what it
    means - otherwise it is at times garbled when typed by hand, and a garbled value
    passes the audit only on an exact hit, which here is an advantage.
