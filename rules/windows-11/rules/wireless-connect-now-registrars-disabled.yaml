id: win11-wireless-connect-now-registrars-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connect Now
  title:
    pl: Konfigurowanie ustawień sieci bezprzewodowej przez uproszczone parowanie wyłączone
    en: Configuring wireless settings by simplified pairing switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera maszynie możliwość konfigurowania sieci
    bezprzewodowej mechanizmem uproszczonego parowania — tym, który pozwala
    przyłączyć urządzenie przyciskiem albo ośmiocyfrowym kodem zamiast
    wpisywania hasła sieci.

    Mechanizm powstał dla wygody i płaci za nią tym, czym zwykle płaci się
    za skróty przy uwierzytelnianiu. Ośmiocyfrowy kod jest sprawdzany
    połówkami, co skraca jego łamanie z lat do godzin. Parowanie przyciskiem
    otwiera zaś okno, w którym przyłączy się każde urządzenie w zasięgu,
    bez pytania, kto je trzyma.

    Rzecz w tym, co z tego wynika dla maszyny, a nie dla punktu dostępowego.
    Maszyna z włączonym mechanizmem potrafi przyjąć konfigurację sieci
    z zewnątrz — czyli dać się przestawić na sieć wskazaną przez kogoś
    innego, razem z jej hasłem i jej bramą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przyłączenia maszyny do sieci pod własną kontrolą bez dotykania systemu
    i bez żadnego konta. Cały ruch maszyny idzie odtąd przez jego bramę.
    W drugą stronę — możliwość wydobycia z maszyny hasła sieci firmowej,
    bo mechanizm służy właśnie do przekazywania tych haseł między
    urządzeniami.

    Wyłączenie nie zabiera możliwości korzystania z sieci bezprzewodowej.
    Zabiera wyłącznie drogę na skróty przy jej konfigurowaniu.
  en: |
    The setting takes from the machine the means of configuring a wireless network by the
    simplified pairing mechanism - the one letting a device be joined by a button or an
    eight-digit code instead of typing the network's password.

    The mechanism came about for convenience and pays for it with what shortcuts in
    authentication usually cost. An eight-digit code is checked in halves, which shortens
    the breaking of it from years to hours. Pairing by a button opens a window in which any
    device within range will join, with no asking who holds it.

    The thing is what follows from that for the machine rather than for the access point. A
    machine with the mechanism switched on can take a network's configuration from outside
    - that is, let itself be set over to a network named by somebody else, along with its
    password and its gateway.

    What an attacker gains while the item goes unmet: the means of joining the machine to a
    network under their own control without touching the system and with no account at all.
    All the machine's traffic goes from then on through their gateway. The other way round
    - the means of drawing the firm's network password out of the machine, since the
    mechanism serves precisely for passing those passwords between devices.

    Switching it off does not take away the means of using a wireless network. It takes
    away the shortcut in configuring it alone.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek przyłącza urządzenia do sieci tym
    sposobem — a w biurze zdarza się to przy drukarkach sieciowych
    i urządzeniach wielofunkcyjnych.

    Przyłączenie maszyny do sieci bezprzewodowej hasłem działa bez zmiany
    i to jest droga zwykła. Sieci już skonfigurowane pozostają
    skonfigurowane; zmiana nie usuwa żadnego zapisanego profilu.

    Skutek pojawia się przy urządzeniach przyłączanych przyciskiem:
    drukarkach, głośnikach, urządzeniach domowych. Przyłączenie ich
    z tej maszyny przestanie działać i trzeba będzie zrobić to hasłem albo
    przewodem.

    Na maszynie bez karty sieci bezprzewodowej zmiana jest całkowicie
    niewidoczna.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anyone joins devices to the network by this means - and
    in an office that happens with network printers and multifunction devices.

    Joining the machine to a wireless network by a password works unchanged and that is the
    ordinary road. Networks already configured stay configured; the change removes no saved
    profile.

    The effect appears with devices joined by a button: printers, speakers, household
    devices. Joining them from this machine will stop working and it will have to be done
    by a password or a cable.

    On a machine with no wireless card the change is wholly invisible.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Przyłączanie urządzeń przyciskiem albo kodem z tej maszyny przestaje działać
      - Konfigurowanie drukarki sieciowej tym sposobem wymaga hasła albo przewodu
      - Przyłączenie do sieci bezprzewodowej hasłem działa bez zmiany
      - Sieci już skonfigurowane pozostają zapisane i nie są usuwane
    en:
      - Joining devices by a button or a code from this machine stops working
      - Configuring a network printer by this means takes a password or a cable
      - Joining a wireless network by a password works unchanged
      - Networks already configured stay saved and are not removed
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenia w organizacji są przyłączane do sieci wyłącznie uproszczonym parowaniem
    en:
      - Devices in the organisation are joined to the network by simplified pairing alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableRegistrars'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
    $current = (Get-ItemProperty -Path $path -Name 'EnableRegistrars' -ErrorAction SilentlyContinue).'EnableRegistrars'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableRegistrars'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableRegistrars' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/mobilebroadband/

notes:
  pl: |
    Wartość rozstrzygająca jest jedna i sprawdzamy właśnie ją. Obok niej
    w tym samym kluczu potrafią leżeć wartości opisujące poszczególne
    rodzaje parowania — przez kabel, przez sieć bezprzewodową, przez
    urządzenie przenośne. Nie obowiązują one, dopóki mechanizm jest
    wyłączony, więc ich stan nie przesądza o zgodności i nie jest tutaj
    sprawdzany.

    Reguła tworzy parę z tą, która odbiera dostęp do kreatorów uproszczonego
    parowania. Tamta zamyka drogę przez interfejs, ta — sam mechanizm.
    Sama reguła o kreatorach nie wystarcza, bo mechanizm daje się wywołać
    poza interfejsem.

    Brak wartości nie jest stanem zgodnym, bo domyślnie mechanizm jest
    włączony.
  en: |
    There is one deciding value and it is the one we check. Beside it, in the same key,
    values describing particular kinds of pairing can lie - by cable, by wireless network,
    by portable device. They do not bind while the mechanism is switched off, so their
    state does not settle compliance and is not checked here.

    The rule forms a pair with the one taking away access to the simplified pairing
    wizards. That one closes the road through the interface, this one the mechanism itself.
    The rule about the wizards does not suffice on its own, since the mechanism can be
    called upon outside the interface.

    A missing value is not a compliant state, since by default the mechanism is switched
    on.
