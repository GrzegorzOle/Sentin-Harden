id: win2016-undock-without-logon-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyjęcie maszyny ze stacji dokującej bez zalogowania zablokowane
    en: Undocking the machine without a logon blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania wyjęcia maszyny ze stacji dokującej bez uprzedniego
    zalogowania.

    Rzecz dotyczy jednego kroku, który dzieli maszynę zablokowaną od
    maszyny wyniesionej. Przycisk odłączenia dostępny przy zablokowanym
    ekranie pozwala zabrać sprzęt tak, żeby system o tym wiedział i nie
    zgłaszał niczego — czyli tak, żeby wyniesienie wyglądało jak czynność
    normalna.

    Wartość reguły jest niewielka i warto to przyznać. Nikt, kto chce
    zabrać maszynę, nie będzie szukał przycisku; wystarczy ją odłączyć
    siłą. Punkt nie broni przed kradzieżą, tylko usuwa wygodną drogę
    i sprawia, że odłączenie zostawia ślad w postaci nieprawidłowego
    zakończenia.

    Na serwerze stacji dokujących nie ma, więc punkt jest porządkowy.
    Ustawienie warto mimo to mieć na miejscu, bo obowiązuje niezależnie od
    tego, czy sprzęt zmieni przeznaczenie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wygodną
    i nieodnotowaną drogę zabrania sprzętu ze stacji dokującej.
  en: |
    The setting forbids the machine to be taken out of a docking station without a prior logon.

    The thing concerns one step that parts a locked machine from a carried-off one. An undocking button to be
    had at a locked screen lets the gear be taken so that the system knows of it and reports nothing - which is
    to say so that the carrying off looks like an ordinary act.

    The rule's value is a small one and that is worth owning. Nobody who wishes to take the machine will look
    for a button; it is enough to detach it by force. The item does not guard against theft, only removes a
    convenient road and makes the detaching leave a trace in the form of an improper ending.

    On a server there are no docking stations, so the item is one of order. The setting is worth having in
    place all the same, holding as it does whether or not the gear changes its purpose.

    What an attacker gains while the item goes unmet: a convenient and unrecorded road for taking gear out of a
    docking station.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na maszynie, która w stacji dokującej nie stoi, zmiana nie robi nic.
    Na maszynie, która stoi, znika przycisk odłączenia przy zablokowanym
    ekranie — trzeba się zalogować i odłączyć z poziomu sesji.

    Nie zabiera to żadnej możliwości fizycznej. Sprzęt da się odłączyć tak
    jak dotąd, tylko system potraktuje to jako zdarzenie nagłe.

    Nie ma znanych regresji.

    Czego to nie psuje: pracy w stacji dokującej, urządzeń do niej
    podłączonych, odłączania po zalogowaniu, usług, aplikacji, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    On a machine that stands in no docking station the change does nothing. On one that does, the undocking
    button at a locked screen goes - one has to log in and detach from within the session.

    It takes away no physical possibility. The gear can be detached just as before, only the system will treat
    it as a sudden event.

    There are no known regressions.

    What this does not break: the working in a docking station, the devices joined to it, detaching after a
    logon, services, applications, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Przycisk odłączenia przy zablokowanym ekranie znika i trzeba się zalogować, żeby odłączyć maszynę
      - Fizyczne odłączenie sprzętu pozostaje możliwe, ale system potraktuje je jako zdarzenie nagłe
      - Praca w stacji dokującej i urządzenia do niej podłączone pozostają bez zmian
      - Na maszynie, która w stacji dokującej nie stoi, zmiana nie robi nic
    en:
      - The undocking button at a locked screen goes and one has to log in to detach the machine
      - Detaching the gear physically stays possible, but the system will treat it as a sudden event
      - The working in a docking station and the devices joined to it stay unchanged
      - On a machine that stands in no docking station the change does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest odłączana ze stacji dokującej przez osoby, które nie mają na niej konta
    en:
      - The machine is detached from its docking station by people who have no account on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'UndockWithoutLogon'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'UndockWithoutLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a machine that stands in no docking station this changes nothing. It
    # takes away no physical possibility of disconnecting - only the button in
    # the interface.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UndockWithoutLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/devices-allow-undock-without-having-to-log-on

notes:
  pl: |
    Punkt jest w bloku najsłabszy i opis powinien to mówić. Na serwerze
    jego wartość sprowadza się do tego, że ustawienie będzie na miejscu,
    gdyby sprzęt zmienił przeznaczenie.

    Warto przy tej regule unikać przesady, bo łatwo o nią. Punkt nie broni
    przed zabraniem maszyny — broni przed zabraniem jej wygodnie i bez
    śladu. Jest to różnica realna, ale niewielka, i kategoria niska
    oddaje ją właściwie.

    Reguła należy do tej samej gałęzi rejestru co dwie inne w tym bloku
    i warto o tym pamiętać przy czytaniu kopii zapasowej. Gałąź zasad
    systemowych zbiera ustawienia o bardzo różnym przeznaczeniu.

    Odnotowuję, że audyt nie sprawdza obecności klucza, bo ten na maszynie
    zawsze jest. Brakiem jest wyłącznie brak wartości, i tak właśnie
    reguła to zgłasza.
  en: |
    The item is the weakest in the block and the description ought to say so. On a server its value comes to the
    setting being in place should the gear change its purpose.

    It is worth avoiding overstatement at this rule, it being easy to fall into. The item does not guard against
    the machine being taken - it guards against its being taken conveniently and without a trace. It is a real
    difference but a small one, and the low category renders it rightly.

    The rule belongs to the same branch of the registry as two others in this block, and that is worth keeping in
    mind when reading the backup. The branch of system policies gathers settings of very different purposes.

    Worth noting that the audit does not check for the key's presence, that being always on the machine. A want
    is solely a want of the value, and so the rule reports it.
