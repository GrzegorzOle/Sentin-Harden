id: win11-account-lockout-counter-reset

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Czas do wyzerowania licznika błędnych prób
    en: Time before the failed attempt counter resets
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System zlicza błędne próby logowania w przesuwającym się oknie czasu. Ten
    punkt ustala, jak długie jest to okno — czyli ile czasu musi upłynąć bez
    pomyłki, żeby licznik wrócił do zera.

    Krótkie okno jest wygodną luką: atakujący rozkłada próby tak, by licznik
    zerował się przed osiągnięciem progu, i zgaduje w nieskończoność, nigdy nie
    blokując konta. Wydłużenie okna do wartości równej czasowi blokady odbiera
    tę możliwość — próby sumują się przez kwadrans, więc rozciąganie ich w
    czasie przestaje pomagać.
  en: |
    The system counts failed sign-in attempts in a sliding time window. This
    item sets how long that window is - how much time has to pass without a
    mistake for the counter to return to zero.

    A short window is a convenient gap: an attacker spaces attempts so the
    counter resets before the threshold is reached, and guesses indefinitely
    without ever locking the account. Extending the window to match the lockout
    duration removes that option - attempts add up over a quarter of an hour, so
    spreading them out stops helping.

disruption_description:
  pl: |
    Zmiana nie blokuje niczego sama z siebie i użytkownik nie zauważy jej
    inaczej niż pośrednio. Jedyny odczuwalny skutek to nieco większa szansa, że
    kolejne pomyłki z różnych chwil zsumują się i doprowadzą do blokady.

    Ryzyko jest na tyle małe, że punkt mieści się w klasie bez uciążliwości —
    liczy się zresztą razem z progiem i czasem blokady, a to one decydują
    o rzeczywistym wpływie na pracę.
  en: |
    The change blocks nothing by itself and a user notices it only indirectly.
    The one perceptible effect is a slightly higher chance that mistakes made at
    different moments add up and lead to a lockout.

    The risk is small enough for the item to sit in the no-disruption class - it
    is assessed together with the threshold and the lockout duration anyway, and
    those are what decide the real effect on people's work.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Błędne próby z odleglejszych chwil sumują się i mogą doprowadzić do blokady konta
    en:
      - Failed attempts made further apart add up and may lead to an account lockout
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie trwa porządkowanie zapamiętanych haseł i konta blokują się przypadkowo
    en:
      - Remembered passwords on the machine are still being cleaned up and accounts lock accidentally
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ResetLockoutCount\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^ResetLockoutCount\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'ResetLockoutCount'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ResetLockoutCount = 15',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ResetLockoutCount = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/reset-account-lockout-counter-after

notes:
  pl: |
    Wartość nie może przekraczać czasu trwania blokady — system odrzuci taką
    politykę. Dlatego oba punkty ustawia się na tę samą liczbę i wdraża w
    jednym kroku; osobno łatwo trafić na odmowę bez czytelnego powodu.
  en: |
    The value must not exceed the lockout duration - the system rejects such a
    policy. That is why both items are set to the same number and rolled out in
    one step; done separately it is easy to hit a refusal with no clear reason.
