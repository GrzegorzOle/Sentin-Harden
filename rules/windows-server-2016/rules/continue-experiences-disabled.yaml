id: win2016-continue-experiences-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Group Policy
  title:
    pl: Przenoszenie pracy między urządzeniami wyłączone
    en: The carrying of work between devices switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm pozwalający podjąć na jednym urządzeniu
    pracę zaczętą na drugim.

    Mechanizm utrzymuje w tle połączenie z usługą poza organizacją i to
    połączenie działa w obie strony. Na zewnątrz idzie opis czynności:
    co otwarto, czym, kiedy. Nie jest to treść pliku, ale jest to spis
    nazw, godzin i narzędzi, czyli materiał, z którego składa się
    rozpoznanie pracy zespołu.

    Do środka może przyjść polecenie otwarcia czegoś na tej maszynie.
    Jest to funkcja przewidziana, ale znaczy tyle, że maszyna przyjmuje
    instrukcje z kanału ustanowionego poza jej siecią.

    Rzecz, która czyni ten punkt trudnym: wszystko to dzieje się w tle
    i niczego nie widać. Połączenie zestawia się samo przy zalogowaniu,
    a jedynym śladem jest ruch wychodzący, którego nikt nie zamawiał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dwukierunkowy
    kanał w tle, wynoszący opis czynności i przyjmujący polecenia otwarcia.
  en: |
    The setting switches off the mechanism letting work begun on one device be taken up on another.

    The mechanism holds in the background a connection with a service outside the organisation, and that
    connection works both ways. Outward goes a description of activity: what was opened, by what, when. It is
    not a file's content, but it is an inventory of names, hours and tools, which is to say the stuff a survey
    of a team's work is made of.

    Inward may come an instruction to open something on this machine. It is a foreseen function, but it means
    this much: the machine takes instructions from a channel set up outside its network.

    The thing that makes this item a hard one: all of it happens in the background and nothing is to be seen.
    The connection is set up of itself at a logon, and the only trace is outbound traffic nobody ordered.

    What an attacker gains while the item goes unmet: a two-way channel in the background, carrying out a
    description of activity and taking in instructions to open things.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest jedna
    i sprawdza się szybko.

    Czy ktokolwiek na tej maszynie podejmuje pracę zaczętą gdzie indziej.
    Na serwerze nie podejmuje nikt. Na maszynie, przy której ktoś pracuje
    i przechodzi między nią a innym urządzeniem, zmiana ten przepływ
    przerywa — i będzie to zauważone.

    Rzecz warta rozdzielenia: lokalna lista ostatnio używanych plików
    zostaje nietknięta. Znika wyłącznie przenoszenie jej poza maszynę.
    Jest to rozróżnienie, które trzeba postawić wprost, bo inaczej
    zgłoszenie będzie brzmiało „zniknęła historia", a historia została.

    Zmiana zaczyna obowiązywać po ponownym zalogowaniu, nie natychmiast.
    Sprawdzanie skutku zaraz po wykonaniu prowadzi do wniosku, że reguła
    nie działa.

    Czego to nie psuje: lokalnej listy ostatnio używanych plików, otwierania
    dokumentów, pulpitu zdalnego, udziałów sieciowych, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established is one and quickly established.

    Whether anybody at all on this machine takes up work begun elsewhere. On a server nobody does. On a machine
    somebody works at, passing between it and another device, the change breaks that flow - and it will be
    noticed.

    A thing worth parting out: the local list of files lately used stays untouched. What goes is solely the
    carrying of it beyond the machine. It is a distinction to be set down outright, else the report will run "the
    history has gone", and the history has stayed.

    The change begins to hold after a fresh logon, not at once. A checking of the consequence straight after the
    carrying out leads to the conclusion that the rule does not work.

    What this does not break: the local list of files lately used, the opening of documents, the remote desktop,
    network shares, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Podjęcie na tej maszynie pracy zaczętej na innym urządzeniu przestaje być możliwe
      - Lokalna lista ostatnio używanych plików zostaje nietknięta, znika tylko przenoszenie jej poza maszynę
      - Zmiana zaczyna obowiązywać po ponownym zalogowaniu, więc sprawdzana od razu wygląda na nieskuteczną
      - Otwieranie dokumentów, pulpit zdalny i udziały sieciowe pozostają bez zmian
      - Usługi systemowe, aplikacje serwerowe i praca sieci pozostają bez zmian
    en:
      - Taking up on this machine work begun on another device ceases to be possible
      - The local list of files lately used stays untouched, only the carrying of it beyond the machine going
      - The change begins to hold after a fresh logon, so checked at once it looks ineffective
      - The opening of documents, the remote desktop and network shares stay unchanged
      - System services, server applications and the working of the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca przy tej maszynie polega na przechodzeniu między nią a innym urządzeniem w toku jednego zadania
    en:
      - The work at this machine rests on passing between it and another device in the course of one task
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This item lies in the system branch, not with the cloud content or the
      # search settings its subject would suggest.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnableCdp'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnableCdp'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The local list of recently used files is untouched - only the carrying
    # of it beyond the machine goes. Takes effect at the next sign-in.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableCdp' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Punkt jest trzeci w bloku i leży w sekcji, która z jego przedmiotem
    nie ma wiele wspólnego. Wpis siedzi w gałęzi systemowej, a nie tam,
    gdzie treści z chmury albo ustawienia wyszukiwania — warto pokazać
    sekcję jako miejsce w benchmarku, nie jako podpowiedź.

    Argument wart zachowania dotyczy dwukierunkowości. Łatwo opisać ten
    punkt jako wynoszenie historii i na tym poprzestać; kierunek powrotny
    jest ważniejszy, bo znaczy, że maszyna przyjmuje polecenia z kanału
    ustanowionego poza jej siecią.

    Rozróżnienie warte postawienia wprost: lokalna lista zostaje, znika
    przenoszenie. Bez tego zdania zgłoszenie będzie brzmiało „zniknęła
    historia", a historia została na miejscu.

    Odnotowuję, że reguła dzieli ścieżkę z punktami o powiadomieniach przy
    ekranie blokady, o wyborze sieci i o pobieraniu czcionek. Gałąź zasad
    systemowych zbiera rzeczy o bardzo różnym przeznaczeniu i przy
    czytaniu kopii zapasowej warto o tym pamiętać.
  en: |
    The item is the third in the block and lies in a section having not much in common with its subject. The entry
    sits in the system branch and not where the cloud content or the search settings are - it is well to show the
    section as a place in the benchmark and not as a hint.

    The argument worth keeping concerns the two-wayness. It is easy to describe this item as a carrying out of
    history and stop there; the return direction is the weightier, meaning as it does that the machine takes
    instructions from a channel set up outside its network.

    A distinction worth setting down outright: the local list stays, the carrying goes. Without that sentence the
    report will run "the history has gone", and the history has stayed in place.

    Worth noting that the rule shares its path with the items about notifications at the lock screen, about the
    choosing of a network and about the fetching of fonts. The branch of system policies gathers things of very
    different purposes and that is worth keeping in mind when reading the backup.
