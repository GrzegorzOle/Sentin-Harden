id: iis-request-url-length-limited

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Request Filtering and Other Restriction Modules
  title:
    pl: Długość adresu w żądaniu ograniczona
    en: The length of the address in a request limited
  level: 1
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer przyjmuje adres o długości, jaką narzuci ustawienie limitu. Bez
    rozsądnego ograniczenia przyjmie także adres o długości liczonej w dziesiątkach
    tysięcy znaków.

    Adres nadmiernie długi jest narzędziem, nie pomyłką. Służy do przepełnienia
    bufora w module przetwarzającym ścieżkę, do ukrycia właściwej treści żądania
    za tysiącem znaków wypełnienia oraz do obciążania serwera samym kosztem
    analizy. Żadne z tych zastosowań nie wymaga ani uwierzytelnienia, ani znajomości
    aplikacji.

    Limit ustawiony rozsądnie odrzuca takie żądanie na wejściu, zanim dotrze ono do
    aplikacji.
  en: |
    The server accepts an address of whatever length the limit setting allows.
    Without a sensible limit it accepts an address tens of thousands of characters
    long as well.

    An overlong address is a tool rather than a mistake. It serves to overflow a
    buffer in the module parsing the path, to hide the real substance of a request
    behind a thousand characters of padding, and to load the server with the cost
    of the parsing alone. None of those uses calls for authentication or for
    knowledge of the application.

    A sensibly set limit refuses such a request at the door, before it reaches the
    application.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo istnieją aplikacje przekazujące stan w samej
    ścieżce adresu. Ścieżka zbudowana z identyfikatorów, pełnego adresu
    docelowego albo zakodowanego filtra potrafi przekroczyć limit przy zwykłej
    pracy.

    Objawem jest odrzucenie żądania z błędem, zanim aplikacja je zobaczy. Wygląda
    to na awarię aplikacji, a odpowiada za to filtrowanie żądań — dlatego przy
    rozpoznawaniu trzeba sięgnąć do dziennika żądań nieudanych.

    Przed zmianą warto przejrzeć dziennik pod kątem najdłuższych adresów, które
    faktycznie się pojawiają. Limit dobiera się do tego, co aplikacja realnie
    wysyła, a nie do wartości przyjętej bez sprawdzenia.
  en: |
    The change calls for a review, since applications exist that carry state in
    the address path itself. A path built of identifiers, of a whole target
    address, or of an encoded filter can exceed the limit in ordinary work.

    The symptom is a request refused with an error before the application sees it.
    It looks like a fault in the application while request filtering answers for
    it - hence, when finding the cause, the failed request log has to be
    consulted.

    Before the change it is worth reviewing the log for the longest addresses that
    really occur. The limit is fitted to what the application really sends rather
    than to a value taken without checking.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
  what_breaks:
    pl:
      - Żądania z adresem dłuższym niż limit zostaną odrzucone, zanim aplikacja je zobaczy
      - Aplikacje przekazujące stan w ścieżce adresu mogą przestać działać przy dłuższych danych
      - Objaw wygląda na awarię aplikacji, choć odpowiada za niego filtrowanie żądań
      - Odrzucenie nie trafia do dzienników aplikacji, więc rozpoznanie wymaga dziennika żądań nieudanych
      - Zwykłe adresy, formularze, przesyłanie plików, uwierzytelnianie i zawartość stron pozostają bez zmian
    en:
      - Requests with an address longer than the limit are refused before the application sees them
      - Applications carrying state in the address path may stop working with longer data
      - The symptom looks like a fault in the application, though request filtering answers for it
      - The refusal does not reach the application logs, so finding the cause calls for the failed request log
      - Ordinary addresses, forms, file uploads, authentication and page contents are all unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Zasoby z aplikacją przekazującą pełny adres docelowy w ścieżce
      - Serwery pośredniczące, na których do ścieżki dopisywany jest adres źródłowy żądania
    en:
      - Resources with an application carrying a whole target address in the path
      - Intermediary servers where the source address of a request is appended to the path
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/security/requestFiltering/requestLimits' -Name 'maxUrl' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([int64]$value -le 4096) { 'WITHIN_LIMIT' }
          else { 'OVER_LIMIT ' + [int64]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering/requestLimits' -Name 'maxUrl' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.webServer/security/requestFiltering/requestLimits'
      name    = 'maxUrl'
      value   = [string]$value
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering/requestLimits' -Name 'maxUrl' -Value 4096

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value $b.value
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/security/requestfiltering/requestlimits/

notes:
  pl: |
    Limit obejmuje cały adres wraz z ciągiem zapytania. Wartość zastana powyżej
    limitu zgłaszana jest wraz z liczbą, żeby było widać, o ile dopuszczono więcej.
    Zapis idzie na poziomie serwera; wyjątek dla jednego zasobu ustawia się na jego
    poziomie.
  en: |
    The limit covers the whole address together with the query string. A value
    found above the limit is reported together with its number, so that it is
    visible how much more was allowed. The setting is written at server level; an
    exception for a single resource is set at its own level.
