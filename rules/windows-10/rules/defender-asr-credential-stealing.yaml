id: win10-defender-asr-credential-stealing

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wykradania poświadczeń z procesu logowania
    en: The taking of credentials out of the sign-in process blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje próby odczytania pamięci procesu odpowiadającego za
    logowanie — czyli tego miejsca, w którym przejściowo znajdują się
    poświadczenia zalogowanych osób.

    Punkt broni przed czynnością, która w praktyce następuje po przejęciu
    maszyny, a nie przed samym przejęciem. Napastnik, który zdobył
    uprawnienia administratora, sięga po pamięć tego procesu, żeby zebrać
    poświadczenia i przenieść się na maszyny sąsiednie.

    Różnica, którą ta reguła wprowadza, jest różnicą między jedną maszyną
    a wszystkimi. Bez niej przejęcie stanowiska daje zbiór poświadczeń;
    z nią daje jedno stanowisko. Jest to dokładnie ten moment, w którym
    zdarzenie pojedyncze zamienia się w zdarzenie obejmujące sieć.

    Odnotowuję, że reguła nie jest ustawieniem systemu, tylko mechanizmu
    ochronnego. Gdy ochroną zarządza produkt obcy, ustawienie jest zapisane,
    lecz bezczynne, i sprawdzenie mówi wtedy, że punkt nie ma zastosowania —
    zamiast zgłaszać zgodność, której nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poświadczenia
    wszystkich osób zalogowanych na tej maszynie, gotowe do użycia gdzie
    indziej.
  en: |
    The setting blocks attempts to read the memory of the process answering for the signing in - which is to say
    the place where the credentials of those logged on lie for a while.

    The item guards against an act that in practice follows the taking over of a machine rather than against the
    taking over itself. An attacker who has gained administrative rights reaches for that process's memory so as
    to gather credentials and move on to the neighbouring machines.

    The difference this rule brings is the difference between one machine and all of them. Without it the taking
    of a workplace yields a set of credentials; with it it yields one workplace. That is exactly the moment at
    which a single happening turns into one covering a network.

    I set down that the rule is not a setting of the system but of the guarding mechanism. Where another product
    is in charge of the guarding, the setting is written but idle, and the check then says the item does not
    apply here - rather than report a compliance that is not.

    What an attacker gains while the item goes unmet: the credentials of everybody logged on to this machine,
    ready for use elsewhere.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Blokada dotyczy sięgania po pamięć jednego procesu systemowego. Żadne
    oprogramowanie użytkowe tego nie robi, bo nie ma do tego powodu.

    Wyjątkiem bywają narzędzia diagnostyczne i niektóre agenty
    zabezpieczające, które czytają pamięć procesów w poszukiwaniu śladów.
    Takie narzędzie po zmianie zgłosi odmowę dostępu do tego jednego
    procesu, a nie awarię.

    Odnotowuję przypadek, w którym zmiana nie robi nic: gdy ochroną
    zarządza produkt obcy, wpis zostaje zapisany i pozostaje bezczynny.
    Sprawdzenie mówi wtedy wprost, że punkt nie ma zastosowania, zamiast
    pokazywać zgodność.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: logowania, kont domenowych, udziałów plikowych,
    drukowania, aplikacji, sieci, usług systemowych.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The block touches the reaching for one system process's memory. No working software does that, having no
    reason to.

    The exception is at times diagnostic tools and certain guarding agents which read processes' memory in
    search of traces. Such a tool will after the change report a refusal of access to that one process, not a
    fault.

    I set down the case in which the change does nothing: where another product is in charge of the guarding,
    the entry is written and stays idle. The check then says outright that the item does not apply, rather than
    show a compliance.

    There are no known regressions for everyday work.

    What this does not break: logging on, domain accounts, file shares, printing, applications, the network, or
    system services.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Narzędzia diagnostyczne czytające pamięć procesów zgłaszają odmowę dostępu do tego jednego procesu
      - Agent zabezpieczający szukający śladów w pamięci może stracić wgląd w proces logowania
      - Gdy ochroną zarządza produkt obcy, wpis zostaje zapisany i pozostaje bezczynny
      - Sprawdzenie mówi wtedy, że punkt nie ma zastosowania, zamiast pokazywać zgodność, której nie ma
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Diagnostic tools reading processes memory report a refusal of access to that one process
      - A guarding agent seeking traces in memory may lose its sight of the sign-in process
      - Where another product is in charge of the guarding, the entry is written and stays idle
      - The check then says the item does not apply, rather than show a compliance that is not
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa agent zabezpieczający wymagający wglądu w pamięć procesu logowania
    en:
      - A guarding agent calling for a sight of the sign-in process memory works upon the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła otwiera blok o ochronie poświadczeń i jest w nim najtańsza
    w stosunku do tego, co wnosi. Warto, żeby aplikacja stawiała ją wysoko
    w liście domyślnej — kategoria krytyczna przy klasie bez uciążliwości
    jest zestawieniem rzadkim.

    Argument wart postawienia wprost dotyczy zasięgu, nie samej maszyny.
    Punkt nie zapobiega przejęciu stanowiska; przerywa drogę z niego dalej.
    Aplikacja przedstawiająca go jako ochronę tej jednej maszyny sprzedaje
    go poniżej wartości.

    Odnotowuję odpowiedź o braku zastosowania. Jest to jedna z niewielu
    reguł, w których wynik „nie dotyczy" jest informacją prawdziwą
    i pożądaną, a nie ucieczką od sprawdzenia. Maszyna z ochroną obcą ma
    ten sam problem, tylko rozwiązuje go gdzie indziej — i raport powinien
    to mówić, zamiast świecić na zielono.
  en: |
    The rule opens the block about the guarding of credentials and is the cheapest in it against what it brings.
    It is well that the application set it high in the default list - a critical category beside the class "no
    disruption" is a rare pairing.

    The argument worth putting outright touches reach, not this machine alone. The item does not hinder the
    taking of a workplace; it breaks the road onward from it. An application presenting it as a guard upon this
    one machine sells it below its worth.

    I set down the answer about not applying. It is one of the few rules in which the outcome "does not apply"
    is a true and welcome piece of information and not a flight from the check. A machine with another product's
    guarding has the same problem, only settles it elsewhere - and the report ought to say so rather than shine
    green.
