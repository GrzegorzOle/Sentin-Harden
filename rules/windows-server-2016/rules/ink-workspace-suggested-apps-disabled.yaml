id: win2016-ink-workspace-suggested-apps-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Ink Workspace
  title:
    pl: Podpowiadanie aplikacji w obszarze pisma odręcznego wyłączone
    en: The suggesting of applications in the handwriting workspace switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza podpowiadanie aplikacji do zainstalowania
    w obszarze pisma odręcznego.

    Lista podpowiedzi nie jest częścią systemu. Jest treścią pobieraną
    z sieci i odświeżaną bez niczyjego udziału, a o tym, co się na niej
    znajdzie, nie decyduje organizacja. Propozycja instalacji jest
    zaproszeniem do wniesienia na maszynę czegoś, czego nikt nie
    planował — i przychodzi z miejsca, które wygląda na część systemu.

    Wartość reguły jest niewielka i warto to przyznać. Kliknięcie
    w podpowiedź i tak wymaga uprawnień do instalacji, więc punkt nie
    zamyka drogi, tylko usuwa zachętę. Na serwerze, gdzie obszaru pisma
    odręcznego nikt nie otwiera, jest to pozycja czysto porządkowa.

    Reguła nie zabiera możliwości instalowania. Zabiera namawianie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — wartość reguły leży w tym, że na maszynie nie pojawia
    się zachęta pochodząca spoza organizacji.
  en: |
    The setting switches off the suggesting of applications to install in the handwriting workspace.

    The list of suggestions is no part of the system. It is content fetched from the network and refreshed
    without anybody's taking part, and what lands on it the organisation does not decide. A proposal to install
    is an invitation to bring onto the machine something nobody planned - and it comes from a place that looks
    like part of the system.

    The rule's value is a small one and that is worth owning. A clicking on a suggestion calls for the right to
    install anyway, so the item shuts no road but removes an urging. On a server, where nobody opens the
    handwriting workspace, it is an entry purely of order.

    The rule takes away no ability to install. It takes away the coaxing.

    What an attacker gains while the item goes unmet: nothing directly - the rule's value lies in no urging
    coming from outside the organisation appearing on the machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Z obszaru pisma odręcznego znikają kafelki proponujące instalację.
    Reszta obszaru działa tak jak dotąd.

    Na serwerze nie zauważy tego nikt, bo obszaru nikt nie otwiera.

    Nie ma znanych regresji.

    Czego to nie psuje: obszaru pisma odręcznego, notatek, pióra, ekranu
    dotykowego, instalowania aplikacji inną drogą, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    From the handwriting workspace the tiles proposing an installation go. The rest of the workspace works just
    as before.

    On a server nobody will notice it, nobody opening the workspace.

    There are no known regressions.

    What this does not break: the handwriting workspace, notes, the pen, the touch screen, the installing of
    applications by another road, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Kafelki proponujące instalację aplikacji znikają z obszaru pisma odręcznego
      - Instalowanie aplikacji inną drogą pozostaje możliwe dla każdego, kto ma do tego prawo
      - Obszar pisma odręcznego, notatki, pióro i ekran dotykowy pozostają bez zmian
      - Usługi systemowe, aplikacje serwerowe i praca sieci pozostają bez zmian
    en:
      - The tiles proposing an installation of applications go from the handwriting workspace
      - Installing applications by another road stays possible for whoever has the right to it
      - The handwriting workspace, notes, the pen and the touch screen stay unchanged
      - System services, server applications and the working of the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Podpowiedzi w obszarze pisma odręcznego są na tej maszynie przyjętą drogą dostarczania narzędzi
    en:
      - The suggestions in the handwriting workspace are on this machine an accepted road for delivering tools
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The same key holds the item about the reach from above the lock screen:
      # two separate settings under one path.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
      $name = 'AllowSuggestedAppsInWindowsInkWorkspace'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    $name = 'AllowSuggestedAppsInWindowsInkWorkspace'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The rule removes the urging, not the ability. Installing stays possible
    # for whoever has the right to it; only the proposal goes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSuggestedAppsInWindowsInkWorkspace' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-windows-ink-workspace

notes:
  pl: |
    Punkt zamyka blok i jest w nim najlżejszy. Warto go pokazywać na
    końcu i nie robić z niego więcej, niż jest.

    Argument wart zachowania dotyczy pochodzenia treści. Lista jest
    pobierana z sieci, odświeżana bez niczyjego udziału, a wygląda na
    część systemu. Jest to ten sam typ rozumowania co przy treściach
    podsuwanych w menu i przy podpowiedziach wyszukiwania — nie chodzi
    o złośliwość propozycji, tylko o to, że kanał wniesienia
    oprogramowania na maszynę omija decyzję organizacji.

    Warto uniknąć przesady, bo łatwo o nią. Reguła nie zamyka drogi
    instalacji; zamyka namawianie. Kategoria niska oddaje to właściwie
    i podnoszenie jej byłoby nadużyciem.

    Odnotowuję, że reguła dzieli klucz z punktem o dostępie sprzed
    blokady. Dwie osobne pozycje pod jedną ścieżką łatwo pomylić przy
    ręcznym sprawdzaniu, a przy wycofywaniu zmian warto pamiętać, że
    kopia dotyczy jednej z nich.
  en: |
    The item shuts the block and is the lightest in it. It is worth showing at the end and making no more of it
    than it is.

    The argument worth keeping concerns the content's provenance. The list is fetched from the network,
    refreshed without anybody's taking part, and looks part of the system. It is the same type of reasoning as
    at the content pushed into the menu and at the suggestions in search - the point is not the proposals'
    malice but that a channel for bringing software onto the machine goes round the organisation's decision.

    It is worth avoiding overstatement, it being easy to fall into. The rule shuts no road to installing; it
    shuts the coaxing. The low category renders that rightly and a raising of it would be an abuse.

    Worth noting that the rule shares its key with the item about the reach from before the lock. Two separate
    entries under one path are easily confused at a checking by hand, and when undoing changes it is worth
    remembering that the backup concerns one of them.
