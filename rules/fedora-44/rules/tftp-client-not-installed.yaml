id: fedora44-tftp-client-not-installed

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 2.2.5
  section: Services > Configure Client Services
  title:
    pl: Klient TFTP nie jest zainstalowany
    en: Ensure tftp client is not installed
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    TFTP przesyła pliki bez logowania i bez szyfrowania. Klient na stacji
    pozwala łatwo pobrać lub wysłać pliki do dowolnego serwera TFTP w sieci,
    także poza kontrolą administratora.

    Punkt wymaga, żeby pakiet tftp nie był zainstalowany. Fedora Workstation
    go nie instaluje.
  en: |
    TFTP transfers files without sign-in and without encryption. A client on
    the workstation makes it easy to download files from or upload them to
    any TFTP server on the network, also outside the administrator's control.

    The item requires that the tftp package is not installed. Fedora
    Workstation does not install it.

disruption_description:
  pl: |
    Nikt tego nie zauważy, jeśli nikt nie używał polecenia tftp.
    W przeciwnym razie wgrywanie konfiguracji i oprogramowania urządzeń
    sieciowych przez tftp z tego komputera przestanie działać.
  en: |
    Nobody will notice if nobody used the tftp command. Otherwise loading
    configuration and firmware onto network devices with tftp from this
    computer stops working.

implementation_consequences:
  impact_areas:
    - file-sharing
    - drivers-and-devices
  what_breaks:
    pl:
      - Polecenie tftp nie jest dostępne, np. do wgrywania konfiguracji i oprogramowania urządzeń sieciowych
    en:
      - The tftp command is not available, for example for loading configuration and firmware onto network devices
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v rpm >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    found=""
    for p in tftp; do if rpm -q --quiet "$p"; then found="$found $p"; fi; done
    if [ -n "$found" ]; then echo "INSTALLED:$(echo $found | tr ' ' ',')"; else echo NOT_INSTALLED; fi
  expected: '^NOT_INSTALLED$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      export LC_ALL=C
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      { echo format=rpm-names-1; rpm -qa --qf '%{NAME}.%{ARCH}\n' | grep -v '^gpg-pubkey\.' | sort -u; } > "$b"
      echo "Saved the list of installed packages to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      rm=""
      for p in tftp; do if rpm -q --quiet "$p"; then rm="$rm $p"; fi; done
      if [ -z "$rm" ]; then echo "Nothing to remove"; exit 0; fi
      dnf -y -q remove --no-autoremove $rm
      echo "Removed:$rm"
    )

  rollback_command: |
    (
      set -e
      export LC_ALL=C
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=rpm-names-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      now=$(mktemp)
      rpm -qa --qf '%{NAME}.%{ARCH}\n' | sort -u > "$now"
      miss=$(tail -n +2 "$b" | comm -23 - "$now")
      rm -f "$now"
      if [ -z "$miss" ]; then echo "All packages from the backup are installed"; exit 0; fi
      dnf -y -q install $miss
      echo "Installed again:" $miss
    )

privileges: root
runnable: true

sources:
  - https://packages.fedoraproject.org/pkgs/tftp/tftp/
  - https://dnf5.readthedocs.io/en/latest/commands/remove.8.html

notes:
  pl: |
    Pakiet tftp zawiera tylko klienta. Serwera TFTP dotyczy punkt 2.1.16.

    Naprawa usuwa pakiety poleceniem dnf remove, które usuwa też pakiety od
    nich zależne i zależności zainstalowane tylko dla nich. Kopia zapisuje
    listę wszystkich zainstalowanych pakietów, a wycofanie instaluje ponownie
    te, których brakuje, więc wymaga dostępu do repozytoriów.
  en: |
    The tftp package only contains the client. The TFTP server is covered by
    item 2.1.16.

    The remediation removes the packages with dnf remove, which also removes
    packages that depend on them and dependencies installed only for them.
    The backup records the list of all installed packages, and rollback
    installs again the ones that are missing, so it needs access to the
    repositories.
