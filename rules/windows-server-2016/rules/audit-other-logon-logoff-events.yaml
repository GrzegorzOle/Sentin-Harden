id: win2016-audit-other-logon-logoff-events

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja innych zdarzeń logowania i wylogowania
    en: Audit other logon and logoff events
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zbiera zdarzenia dotyczące sesji, które nie mieszczą się
    w zwykłym logowaniu i wylogowaniu: rozłączenie i ponowne podłączenie sesji
    zdalnej, zablokowanie i odblokowanie stacji, wywołanie wygaszacza z hasłem.

    Na serwerze najważniejsza jest pierwsza z tych rzeczy. Sesja zdalna
    rozłączona nie kończy się — działa dalej, z uruchomionymi programami
    i otwartymi plikami, i czeka na powrót. Bez tej podkategorii zdarzenie
    logowania pokazuje wejście, zdarzenie wylogowania pokazuje wyjście, a to, że
    ktoś w międzyczasie wychodził i wracał trzy razy, nie zostawia śladu.

    Różnica ma znaczenie w dochodzeniu. Sesja, do której ponownie podłączono się
    z innego adresu niż ten, z którego ją założono, jest wzorcem wartym uwagi —
    a widać go wyłącznie tutaj.

    Rejestruje się powodzenia i niepowodzenia. Nieudana próba ponownego
    podłączenia do cudzej sesji jest zdarzeniem, które powstaje właśnie w tej
    podkategorii i nigdzie indziej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: korzystanie
    z porzuconej sesji zdalnej bez śladu wskazującego moment i miejsce powrotu
    do niej.
  en: |
    The subcategory gathers events about sessions that do not fit ordinary signing
    in and out: the disconnection and reconnection of a remote session, the locking
    and unlocking of a station, the calling of a screen saver with a password.

    On a server the first of these matters most. A disconnected remote session does
    not end - it goes on running, with programs started and files open, and waits
    for a return. Without this subcategory the sign-in event shows the entry, the
    sign-out event shows the exit, and the fact that somebody went out and came back
    three times in between leaves no trace.

    The difference matters in an inquiry. A session reconnected to from an address
    other than the one it was set up from is a pattern worth attention - and it is
    visible here alone.

    Successes and failures are both recorded. A failed attempt to reconnect to
    somebody else's session is an event arising in this subcategory and nowhere
    else.

    What an attacker gains while the item goes unmet: the use of an abandoned remote
    session with no trace of when and whence it was returned to.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Liczba zdarzeń idzie za liczbą rozłączeń
    i powrotów, a nie za obciążeniem maszyny.

    Objętość bywa jednak wyższa, niż sugeruje nazwa, na serwerze z rolą sesji
    zdalnych. Tam rozłączanie zamiast wylogowywania jest zwyczajem, a nie
    wyjątkiem: użytkownicy zamykają okno klienta i wracają następnego dnia.
    Każda taka para dopisuje dwa zdarzenia i przy kilkudziesięciu sesjach idzie
    to w setki dziennie.

    Nadal jest to rząd wielkości nieporównywalny z inspekcją logowania na
    serwerze plikowym, więc klasa pozostaje najniższa. Warto jednak oszacować,
    jeżeli dziennik jest ciasny.

    Czego to nie psuje: pracy w sesji zdalnej, rozłączania, powrotów, blokowania
    stacji ani wygaszacza. Zdarzenia powstają obok tych czynności i nie zmieniają
    ich przebiegu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The count of events follows the number of
    disconnections and returns, not the machine's load.

    The volume can be higher than the name suggests, though, on a server with the
    remote sessions role. There disconnecting instead of signing out is the custom
    rather than the exception: users close the client's window and come back the
    next day. Every such pair adds two events, and with some dozens of sessions this
    runs into hundreds a day.

    It is still an order of size beyond comparison with the auditing of sign-ins on a
    file server, so the class stays the lowest. It is worth estimating all the same
    if the log is tight.

    What this does not break: work in a remote session, disconnecting, returning,
    locking a station, or the screen saver. The events arise alongside those actions
    and do not alter their course.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — liczba zdarzeń idzie za liczbą rozłączeń i powrotów
      - Na serwerze z rolą sesji zdalnych rozłączanie bywa zwyczajem, więc zdarzeń przybywa setkami dziennie
      - Praca w sesji zdalnej, blokowanie stacji i wygaszacz działają bez zmian
      - Zdarzenia powstają obok tych czynności i nie zmieniają ich przebiegu
    en:
      - No regression in the working - the count of events follows the number of disconnections and returns
      - On a server with the remote sessions role disconnecting is often the custom, so events accrue by the hundred a day
      - Work in a remote session, locking a station and the screen saver work unchanged
      - The events arise alongside those actions and do not alter their course
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna prowadzi kilkadziesiąt sesji zdalnych rozłączanych zamiast zamykanych, a dziennik zabezpieczeń ma domyślny rozmiar
    en:
      - The machine runs some dozens of remote sessions disconnected rather than closed, and the security log is at its default size
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE921C-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE921C-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE921C-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE921C-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE921C-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-other-logonlogoff-events

notes:
  pl: |
    Podkategoria bywa pomijana, bo jej nazwa niczego nie obiecuje. Na serwerze
    z sesjami zdalnymi jest to jednak jedyne miejsce, w którym widać cykl
    rozłączeń i powrotów — a sesja porzucona i przejęta wygląda bez tego
    dokładnie tak samo jak sesja pracująca bez przerwy.

    Zdarzenia blokowania i odblokowywania stacji mają na serwerze mniejsze
    znaczenie niż na stanowisku roboczym, ale nie zerowe: konsola serwera bywa
    dostępna fizycznie i to jest jedyny zapis, że ktoś przy niej stanął.

    Punkt czyta się razem z regułami pulpitu zdalnego. Tam ustala się, kto może
    wejść; tutaj widać, ile razy wchodził.
  en: |
    The subcategory gets passed over because its name promises nothing. On a server
    with remote sessions, though, it is the one place where the cycle of
    disconnections and returns is visible - and without it an abandoned session that
    has been taken over looks exactly like one worked in without a break.

    Events of locking and unlocking a station matter less on a server than at a
    working station, but not nothing: a server's console is at times physically
    reachable, and this is the only record that somebody stood at it.

    The item is read together with the remote desktop rules. There it is settled who
    may come in; here one sees how many times they did.
