id: win2025-bitlocker-fixed-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysków stałych ustalony
    en: The way of recovering access to fixed drives settled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, jak odzyskuje się dostęp do zaszyfrowanych wolumenów
    z danymi: że hasło odzyskiwania istnieje, że trafia do katalogu usługi
    domenowej i że zapis do katalogu jest warunkiem uruchomienia
    szyfrowania.

    Zostawiam kategorię wysoką, tak jak przy odpowiedniku dla dysku
    systemowego, ale chcę pokazać, czym odzyskiwanie wolumenu danych różni
    się od odzyskiwania wolumenu systemowego, bo różnica jest istotna
    i działa na niekorzyść tego punktu.

    Wolumen systemowy, który się nie odblokuje, zatrzymuje maszynę i pyta
    o hasło na ekranie. Jest to sytuacja przykra, ale jednoznaczna: widać,
    co się stało, i widać, czego maszyna chce. Wolumen z danymi, który się
    nie odblokuje, nie zatrzymuje niczego. System wstaje normalnie, usługi
    startują, a potem baza nie znajduje swoich plików i zgłasza błąd
    w swoim własnym dzienniku. Objawem nie jest prośba o hasło, tylko
    aplikacja, która nie działa — i zanim ktokolwiek skojarzy jedno
    z drugim, mija czas.

    Drugi powód wagi tego punktu jest praktyczny i na serwerze wychodzi
    regularnie. Automatyczne odblokowywanie wolumenów danych opiera się na
    kluczu przechowywanym na wolumenie systemowym. Po przeinstalowaniu
    systemu — czyli po najzwyklejszej operacji odtworzeniowej — ten klucz
    przestaje istnieć i każdy wolumen danych trzeba odblokować hasłem
    odzyskiwania. Maszyna z ośmioma wolumenami wymaga wtedy ośmiu haseł,
    których nikt nie spisał, bo nigdy dotąd nie były potrzebne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — ale organizacja zostaje z zaszyfrowanymi danymi, do
    których w chwili odtwarzania może nie być drogi.
  en: |
    The item settles how access to encrypted data volumes is recovered:
    that a recovery password exists, that it goes into the directory
    service, and that the write to the directory is a precondition for
    starting encryption.

    I keep the category high, as at the equivalent for the system drive,
    but I want to show how recovering a data volume differs from recovering
    a system volume, because the difference matters and tells against this
    item.

    A system volume that does not unlock stops the machine and asks for a
    password on screen. That is unpleasant but unambiguous: you can see
    what happened and what the machine wants. A data volume that does not
    unlock stops nothing. The system comes up normally, services start, and
    then the database cannot find its files and reports an error in its own
    log. The symptom is not a request for a password but an application
    that does not work - and time passes before anybody connects the two.

    The second reason this item matters is practical and comes up regularly
    on a server. Automatic unlocking of data volumes rests on a key held on
    the system volume. After a system reinstall - that is, after the most
    ordinary recovery operation there is - that key ceases to exist and
    every data volume has to be unlocked with its recovery password. A
    machine with eight volumes then needs eight passwords nobody wrote
    down, because they had never been needed before.

    What an attacker gains while the item goes unmet: nothing directly -
    but the organisation is left with encrypted data it may have no route
    to at the moment of recovery.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" z tego samego powodu co
    przy dysku systemowym: wymaganie zapisu do katalogu jest twarde
    i zatrzyma szyfrowanie tam, gdzie katalogu nie ma albo jest osiągalny
    z przerwami. Serwer w grupie roboczej, jedyny kontroler domeny i maszyna
    w odciętym segmencie to te same trzy sytuacje, tylko teraz dotyczą
    wolumenów, które zwykle jest ich kilka.

    Dochodzi jednak skutek, którego przy dysku systemowym nie ma i który
    bywa niespodzianką. Wymuszenie zapisu do katalogu obowiązuje przy
    każdym nowym wolumenie. Na serwerze wolumeny danych powstają w trakcie
    życia maszyny — nowy udział, nowa baza, nowy nośnik z macierzy — i za
    każdym razem szyfrowanie tego wolumenu nie ruszy, dopóki łączność
    z katalogiem nie zadziała. Wolumen dodany w oknie serwisowym, kiedy
    maszyna jest odcięta od sieci produkcyjnej, po prostu nie zostanie
    zaszyfrowany, a operacja wygląda na wykonaną.

    Warto z tego zrobić punkt procedury: po dołożeniu wolumenu sprawdź, czy
    faktycznie się zaszyfrował, zamiast zakładać, że polityka to załatwiła.

    Zmiana nie wymaga przerwy i cofa się natychmiast. Punkt jest jedną
    decyzją zapisaną w kilku wartościach, więc audyt czyta je razem.
  en: |
    I keep the class "needs a planned rollout" for the same reason as at
    the system drive: the requirement to write to the directory is hard and
    will stop encryption wherever the directory is absent or reachable only
    intermittently. A server in a workgroup, a sole domain controller and a
    machine in a cut-off segment are the same three situations, except that
    now they concern volumes, of which there are usually several.

    There is, however, an effect absent at the system drive which often
    comes as a surprise. The requirement to write to the directory applies
    at every new volume. On a server, data volumes come into being during
    the machine's life - a new share, a new database, a new medium from the
    array - and each time, encryption of that volume will not start until
    connectivity to the directory works. A volume added in a service
    window, while the machine is cut off from the production network,
    simply will not be encrypted, and the operation looks as though it
    succeeded.

    This is worth turning into a step in the procedure: after adding a
    volume, check that it actually got encrypted rather than assuming the
    policy took care of it.

    The change needs no outage and is undone immediately. The item is one
    decision recorded in several values, so the audit reads them together.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Dopóki zapis hasła odzyskiwania do katalogu się nie powiedzie, szyfrowanie wolumenu nie ruszy
      - Wolumen dodany w oknie serwisowym bez łączności z katalogiem nie zostanie zaszyfrowany, a operacja wygląda na wykonaną
      - Wolumen danych, który się nie odblokuje, nie zatrzymuje maszyny, tylko zgłasza się jako błąd aplikacji
      - Po przeinstalowaniu systemu automatyczne odblokowywanie przestaje działać i każdy wolumen wymaga hasła odzyskiwania
      - Serwer w grupie roboczej, jedyny kontroler domeny i odcięty segment zatrzymują szyfrowanie tak samo jak przy dysku systemowym
    en:
      - Until the recovery password is written to the directory, encryption of the volume will not start
      - A volume added in a service window without directory connectivity will not be encrypted, and the operation looks successful
      - A data volume that does not unlock stops nothing and surfaces as an application error
      - After a system reinstall, automatic unlocking stops working and every volume needs its recovery password
      - A workgroup server, a sole domain controller and a cut-off segment stop encryption just as at the system drive
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer stoi poza domeną i nie wskazano innego osiągalnego miejsca na hasła odzyskiwania
      - Wolumeny danych są dokładane w oknach, w których maszyna nie ma łączności z kontrolerami domeny
      - Procedura dokładania wolumenu nie przewiduje sprawdzenia, czy wolumen faktycznie się zaszyfrował
    en:
      - The server sits outside the domain and no other reachable place for recovery passwords has been named
      - Data volumes are added in windows where the machine has no connectivity to the domain controllers
      - The procedure for adding a volume does not include checking that the volume was actually encrypted
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        FDVRecovery                     = 1
        FDVManageDRA                    = 0
        FDVRecoveryPassword             = 2
        FDVRecoveryKey                  = 2
        FDVHideRecoveryPage             = 1
        FDVActiveDirectoryBackup        = 1
        FDVActiveDirectoryInfoToStore   = 1
        FDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'FDVRecovery', 'FDVManageDRA', 'FDVRecoveryPassword', 'FDVRecoveryKey',
      'FDVHideRecoveryPage', 'FDVActiveDirectoryBackup',
      'FDVActiveDirectoryInfoToStore', 'FDVRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This applies at every new volume too. A volume added in a service window
    # without directory connectivity simply will not be encrypted, and the
    # operation looks successful - check afterwards rather than assuming.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      FDVRecovery                     = 1
      FDVManageDRA                    = 0
      FDVRecoveryPassword             = 2
      FDVRecoveryKey                  = 2
      FDVHideRecoveryPage             = 1
      FDVActiveDirectoryBackup        = 1
      FDVActiveDirectoryInfoToStore   = 1
      FDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Różnica wobec odzyskiwania dysku systemowego działa na niekorzyść tego
    punktu. Wolumen systemowy, który się nie odblokuje, zatrzymuje maszynę
    i pyta o hasło. Wolumen danych nie zatrzymuje niczego: system wstaje,
    usługi startują, a baza nie znajduje plików i zgłasza błąd we własnym
    dzienniku.

    Scenariusz, który na serwerze wychodzi regularnie: automatyczne
    odblokowywanie opiera się na kluczu z wolumenu systemowego, więc po
    przeinstalowaniu systemu maszyna z ośmioma wolumenami wymaga ośmiu
    haseł, których nikt nie spisał.

    Skutek, którego przy dysku systemowym nie ma: wolumen dodany w oknie
    serwisowym bez łączności z katalogiem nie zostanie zaszyfrowany,
    a operacja wygląda na wykonaną.
  en: |
    The difference from system drive recovery tells against this item. A
    system volume that does not unlock stops the machine and asks for a
    password. A data volume stops nothing: the system comes up, services
    start, and the database cannot find its files and reports an error in
    its own log.

    A scenario that comes up regularly on a server: automatic unlocking
    rests on a key held on the system volume, so after a system reinstall a
    machine with eight volumes needs eight passwords nobody wrote down.

    An effect absent at the system drive: a volume added in a service
    window without directory connectivity will not be encrypted, and the
    operation looks as though it succeeded.
