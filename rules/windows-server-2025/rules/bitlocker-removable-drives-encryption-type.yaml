id: win2025-bitlocker-removable-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Szyfrowanie całego nośnika wymiennego wymuszone
    en: Full encryption of removable media enforced
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby nośnik wymienny szyfrował się w całości, a nie
    wyłącznie w obszarze zajętym przez dane. Wartość zero oznacza, że
    wybór zostaje przy osobie zakładającej ochronę, a nie przy polityce.

    Zostawiam kategorię wysoką. Przy dysku stałym pisałem, że wolne
    miejsce nie jest puste — tu ta sama myśl jest ostrzejsza, bo nośnik
    wymienny jest używany ponownie znacznie częściej niż wolumen w
    maszynie.

    Dysk z kopiami zapasowymi nadpisuje sam siebie w kółko. Wolne miejsce
    na takim nośniku to poprzednia kopia, a właściwie kilka poprzednich.
    Szyfrowanie wyłącznie zajętego obszaru zabezpiecza kopię dzisiejszą
    i zostawia czytelne wszystko, co było przed nią. Nośnik, który
    przeszedł trzy pokolenia kopii, chroni jedno, a wydaje dwa — i raport
    nie widzi tu żadnej różnicy.

    To samo dotyczy nośnika, który wcześniej służył do czegoś innego.
    Dysk kurierski użyty pół roku temu do przeniesienia zrzutu bazy nadal
    ma ten zrzut w obszarze zgłoszonym jako wolny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dane
    z wcześniejszych użyć nośnika, czytelne mimo tego, że nośnik jest
    zaszyfrowany i tak też raportowany.
  en: |
    The item requires a removable medium to be encrypted in full rather
    than only across the area the data occupies. A value of zero means the
    choice stays with whoever sets the protection up, not with the policy.

    I keep the category high. At the fixed drive I wrote that free space is
    not empty - here the same thought is sharper, because a removable
    medium is reused far more often than a volume inside a machine.

    A backup drive overwrites itself over and over. The free space on such
    a medium is the previous backup, or rather several previous ones.
    Encrypting only the occupied area secures today's backup and leaves
    everything before it readable. A medium that has been through three
    generations of backups protects one and gives up two - and the report
    sees no difference here at all.

    The same goes for a medium that previously served another purpose. A
    courier disk used half a year ago to move a database dump still holds
    that dump in the area reported as free.

    What an attacker gains while the item goes unmet: data from the
    medium's earlier uses, readable despite the medium being encrypted and
    reported as such.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i podaję powód, bo skutek jest
    jeden, konkretny i dotyczy czasu.

    Szyfrowanie całego nośnika trwa proporcjonalnie do jego pojemności,
    a nie do ilości danych. Nośnik wielkości kilku terabajtów, na którym
    leży sto gigabajtów, i tak zostanie przetworzony w całości. Tam, gdzie
    dysk podłącza się na czas zadania i odłącza po nim — a tak wygląda
    praca z nośnikiem kopii zapasowych — trzeba na to miejsce w oknie.
    Przerwanie procesu w połowie nie niszczy danych, ale zostawia nośnik
    w stanie częściowo zaszyfrowanym i kolejne podłączenie zaczyna od
    dokończenia, nie od zadania.

    Drugi skutek to wybór odbierany człowiekowi. Osoba zakładająca ochronę
    przestaje móc wskazać szybszy wariant nawet wtedy, gdy nośnik jest
    fabrycznie nowy i nie było na nim nic. W takim przypadku pełne
    szyfrowanie jest kosztem bez zysku — i warto o tym wiedzieć, zamiast
    tłumaczyć potem, dlaczego przygotowanie dysku trwało całą noc.

    I to samo zastrzeżenie co przy dyskach stałych: ustawienie działa
    w przód. Nośniki zaszyfrowane wcześniej w trybie oszczędnym pozostaną
    takie, jakie są, a wpis w rejestrze będzie zgodny. Zamknąć tę różnicę
    da się wyłącznie przez ponowne zaszyfrowanie każdego z nich.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review" and give the reason, because the effect
    is single, specific and about time.

    Encrypting a whole medium takes time in proportion to its capacity, not
    to the amount of data. A medium of several terabytes holding a hundred
    gigabytes will still be processed in full. Where the disk is attached
    for the duration of a job and detached afterwards - and that is what
    working with a backup medium looks like - room has to be made for this
    in the window. Interrupting the process halfway destroys no data, but
    it leaves the medium partly encrypted, and the next attachment starts
    by finishing that rather than by doing the job.

    The second effect is a choice taken away from a person. Whoever sets
    the protection up can no longer pick the faster variant even when the
    medium is factory-new and has never held anything. In that case full
    encryption is a cost with no gain - and it is worth knowing that rather
    than explaining afterwards why preparing a disk took all night.

    And the same caveat as at fixed drives: the setting works forwards.
    Media encrypted earlier in the sparing mode will stay as they are and
    the registry entry will be compliant. That difference can only be
    closed by encrypting each of them afresh.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Szyfrowanie trwa proporcjonalnie do pojemności nośnika, a nie do ilości danych na nim
      - Przy dysku podłączanym na czas zadania trzeba wygospodarować na to miejsce w oknie serwisowym
      - Przerwanie procesu zostawia nośnik częściowo zaszyfrowany i kolejne podłączenie zaczyna od dokończenia
      - Nośnik fabrycznie nowy również szyfruje się w całości, czyli ponosi koszt bez zysku
      - Ustawienie działa w przód — nośniki zaszyfrowane wcześniej pozostaną takie, jakie są, a wpis będzie zgodny
    en:
      - Encryption takes time in proportion to the medium's capacity, not to the amount of data on it
      - Where a disk is attached for the duration of a job, room has to be made for this in the service window
      - Interrupting the process leaves the medium partly encrypted and the next attachment starts by finishing that
      - A factory-new medium is also encrypted in full, so it carries the cost with no gain
      - The setting works forwards - media encrypted earlier stay as they are and the entry is compliant
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki kopii zapasowych są podłączane w wąskim oknie, w którym nie mieści się przetworzenie całej pojemności
      - Procedura przewiduje przygotowywanie fabrycznie nowych nośników na poczekaniu, tuż przed użyciem
    en:
      - Backup media are attached within a narrow window that does not accommodate processing the whole capacity
      - The procedure calls for preparing factory-new media on the spot, immediately before use
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: FULL
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'RDVEncryptionType' -ErrorAction SilentlyContinue).'RDVEncryptionType'
    [pscustomobject]@{
      path        = $path
      name        = 'RDVEncryptionType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting works forwards only. Media already encrypted in the sparing
    # mode keep their free space readable and the entry still reads compliant,
    # so closing that gap means encrypting each of them afresh.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Ta sama myśl co przy dyskach stałych, tylko ostrzejsza: nośnik wymienny
    jest używany ponownie znacznie częściej niż wolumen w maszynie.

    Wolne miejsce na dysku z kopiami zapasowymi to poprzednia kopia,
    a właściwie kilka. Nośnik, który przeszedł trzy pokolenia kopii, chroni
    jedno, a wydaje dwa — i raport nie widzi tu różnicy.

    Koszt jest czasowy i proporcjonalny do pojemności, nie do ilości
    danych. Przy dysku podłączanym na czas zadania to jest realne
    ograniczenie okna.
  en: |
    The same thought as at fixed drives, only sharper: a removable medium is
    reused far more often than a volume inside a machine.

    The free space on a backup drive is the previous backup, or rather
    several. A medium that has been through three generations of backups
    protects one and gives up two - and the report sees no difference.

    The cost is in time and proportional to capacity, not to the amount of
    data. Where a disk is attached for the duration of a job, that is a real
    constraint on the window.
