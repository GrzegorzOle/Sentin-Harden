id: win2025-settings-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Sync your settings
  title:
    pl: Synchronizowanie ustawień między maszynami wyłączone
    en: Synchronising settings between machines switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza synchronizowanie ustawień użytkownika między maszynami.
    Niesie go para wartości: przełącznik oraz wpis odbierający wybór
    użytkownikowi. Wyłączenie zostawione do decyzji użytkownika audyt
    raportuje osobno, bo jest wtedy sugestią, a nie zasadą.

    Kategoria wysoka i chcę wskazać, co dokładnie ten mechanizm przenosi,
    bo nazwa „ustawienia" brzmi niewinnie. Przenosi między maszynami
    zapamiętane poświadczenia: hasła zapisane w przeglądarce, hasła do
    sieci bezprzewodowych, dane logowania do usług. To jest przenoszenie
    tajemnic, a nie wyglądu pulpitu.

    Na serwerze rzecz staje się poważniejsza przez to, kto się na nim
    loguje. Profil administratora domeny zalogowanego na serwerze niesie
    ze sobą to, co ten człowiek ma zapisane na swoich innych maszynach.
    Odwrotnie też: to, co zostanie zapamiętane na serwerze, trafi na
    pozostałe urządzenia tego konta, także te, nad którymi organizacja nie
    ma pełnej kontroli.

    Ścieżka przenoszenia prowadzi przez usługę zewnętrzną. Oznacza to, że
    poświadczenia używane do pracy na serwerze produkcyjnym istnieją
    w postaci, której organizacja nie widzi i której nie może wycofać ze
    swojego katalogu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    poświadczeń administratora tego serwera przez dowolne inne urządzenie
    powiązane z tym samym kontem — bez dotykania samego serwera.
  en: |
    The item switches off the synchronising of a user's settings between
    machines. A pair of values carries it: the switch itself and the entry
    taking the choice away from the user. Switched off but left to the user
    is reported separately by the audit, because it is then a suggestion
    rather than a policy.

    The category is high, and I want to point out what this mechanism
    actually carries, because the word "settings" sounds innocent. It
    carries remembered credentials between machines: passwords saved in the
    browser, wireless network passwords, sign-in details for services. That
    is the carrying of secrets, not of the desktop's appearance.

    On a server the matter grows more serious because of who signs in there.
    The profile of a domain administrator signed in on a server brings with
    it whatever that person has saved on their other machines. And the other
    way round: whatever gets remembered on the server will reach the other
    devices of that account, including ones the organisation does not fully
    control.

    The route of carriage runs through an outside service. That means the
    credentials used for work on a production server exist in a form the
    organisation cannot see and cannot withdraw from its own directory.

    What an attacker gains while the item goes unmet: access to this
    server's administrator credentials through any other device tied to the
    same account - without touching the server at all.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę nazwać, gdzie ta zmiana
    naprawdę zaboli, bo na serwerze produkcyjnym zwykle nie zaboli wcale.

    Zaboli tam, gdzie ludzie faktycznie pracują na maszynie: na serwerze
    terminali. Tam po zmianie każdy nowy profil zaczyna od ustawień
    domyślnych, przeglądarka nie zna zapisanych haseł, układ pracy nie
    przenosi się z komputera osobistego. Dla części osób oznacza to
    realną zmianę sposobu pracy i uprzedzenie ich jest tu na miejscu.

    Na zwykłym serwerze administrator zaloguje się tak samo, zobaczy to
    samo i nie zauważy niczego — poza tym, że hasła, które miał zapisane
    w przeglądarce na swoim laptopie, tutaj się nie pojawią. Uważam to za
    właściwy stan rzeczy i warto powiedzieć wprost dlaczego: hasła do
    pracy na serwerze nie powinny przychodzić z laptopa.

    Rzecz do sprawdzenia przed zmianą jest jedna i konkretna: czy ktoś
    w tej organizacji polega na tym mechanizmie jako drodze dostępu do
    swoich haseł. Jeżeli tak, potrzebny jest magazyn haseł, zanim ta droga
    zostanie zamknięta — inaczej ludzie zaczną zapisywać hasła gorzej,
    a to jest zmiana na niekorzyść wykonana w imię poprawy.

    Do zapamiętania przy sprawdzaniu wyniku: same dwie wartości muszą być
    zapisane, bo samo wyłączenie bez odebrania wyboru użytkownikowi jest
    sugestią, którą wolno cofnąć w ustawieniach.

    Bez przerwy w chwili wykonania, natychmiast odwracalne.
  en: |
    I keep the class "needs review", and I want to name where this change
    will really hurt, because on a production server it usually will not
    hurt at all.

    It will hurt where people actually work on the machine: on a terminal
    server. There, after the change, every new profile starts from default
    settings, the browser knows no saved passwords, and the working layout
    does not carry over from a personal computer. For some people that means
    a real change in how they work, and warning them is in order here.

    On an ordinary server an administrator will sign in the same way, see
    the same things and notice nothing - except that the passwords they had
    saved in the browser on their laptop will not appear here. I consider
    that the right state of affairs, and it is worth saying plainly why:
    passwords for work on a server should not arrive from a laptop.

    There is one specific thing to check before the change: whether anybody
    in this organisation relies on this mechanism as the route to their
    passwords. If so, a password store is needed before this route is
    closed - otherwise people will start recording passwords worse, and that
    is a change for the worse made in the name of an improvement.

    To remember when checking the result: both values have to be written,
    because switching off without taking the choice away from the user is a
    suggestion that may be undone in the settings.

    No outage at the moment of execution, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Na serwerze terminali każdy nowy profil zaczyna od ustawień domyślnych, a przeglądarka nie zna zapisanych haseł
      - Układ pracy nie przenosi się z komputera osobistego, co dla części osób jest realną zmianą sposobu pracy
      - Na zwykłym serwerze administrator nie zauważy niczego poza tym, że hasła z laptopa się tutaj nie pojawią
      - Bez magazynu haseł ludzie zaczną zapisywać hasła gorzej, czyli zmiana wyjdzie na niekorzyść
    en:
      - On a terminal server every new profile starts from default settings and the browser knows no saved passwords
      - The working layout does not carry over from a personal computer, which for some people is a real change in how they work
      - On an ordinary server an administrator notices nothing beyond the passwords from their laptop not appearing here
      - Without a password store people will start recording passwords worse, so the change comes out for the worse
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś w organizacji polega na tym mechanizmie jako drodze dostępu do swoich haseł i nie ma jeszcze magazynu haseł
      - Maszyna jest serwerem terminali, a przeniesienie układu pracy z komputera osobistego jest przyjętym sposobem pracy
    en:
      - Somebody in the organisation relies on this mechanism as the route to their passwords and no password store is in place yet
      - The machine is a terminal server and carrying the working layout over from a personal computer is the accepted way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch itself and the entry taking the
      # choice away from the user. Switched off but left to the user is reported
      # apart, because it is a suggestion rather than a policy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DisableSettingSync'
        $override = $item.'DisableSettingSyncUserOverride'
        if ($null -eq $switch -or $null -eq $override) { 'MISSING' }
        elseif ([int]$switch -ne 2) { 'NOT_BLOCKED' }
        elseif ([int]$override -ne 1) { 'USER_CAN_OVERRIDE' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path             = $path
      switch           = $item.'DisableSettingSync'
      switch_existed   = ($null -ne $item.'DisableSettingSync')
      override         = $item.'DisableSettingSyncUserOverride'
      override_existed = ($null -ne $item.'DisableSettingSyncUserOverride')
      key_existed      = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both values are needed: the switch alone, without taking the choice away
    # from the user, is a suggestion that may be undone in the settings. What
    # this mechanism carries is remembered credentials, not the look of a
    # desktop - make sure a password store exists before closing the route.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSettingSync' -Value 2 -Type DWord
    Set-ItemProperty -Path $path -Name 'DisableSettingSyncUserOverride' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableSettingSync' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableSettingSync' -ErrorAction SilentlyContinue
    }
    if ($b.override_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableSettingSyncUserOverride' -Value $b.override -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableSettingSyncUserOverride' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Nazwa „ustawienia" brzmi niewinnie, a mechanizm przenosi między
    maszynami zapamiętane poświadczenia: hasła z przeglądarki, hasła do
    sieci bezprzewodowych, dane logowania do usług. To przenoszenie
    tajemnic, nie wyglądu pulpitu.

    Na serwerze waży to przez to, kto się na nim loguje: profil
    administratora domeny niesie to, co ten człowiek ma zapisane na swoich
    innych maszynach, a to, co zostanie zapamiętane tutaj, trafi na
    pozostałe urządzenia tego konta.

    Do sprawdzenia przed zmianą: czy ktoś polega na tym mechanizmie jako
    drodze dostępu do swoich haseł. Bez magazynu haseł ludzie zaczną
    zapisywać je gorzej — zmiana wyjdzie wtedy na niekorzyść.
  en: |
    The word "settings" sounds innocent, and the mechanism carries
    remembered credentials between machines: browser passwords, wireless
    network passwords, sign-in details for services. That is the carrying of
    secrets, not of a desktop's appearance.

    On a server it weighs through who signs in there: a domain
    administrator's profile brings whatever that person has saved on their
    other machines, and whatever is remembered here reaches the other
    devices of that account.

    To check before the change: whether anybody relies on this mechanism as
    the route to their passwords. Without a password store people will start
    recording them worse - the change then comes out for the worse.
