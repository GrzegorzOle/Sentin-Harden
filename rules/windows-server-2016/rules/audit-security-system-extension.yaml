id: win2016-audit-security-system-extension

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > System
  title:
    pl: Inspekcja rozszerzeń systemu zabezpieczeń
    en: Audit security system extension
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje wczytanie składników rozszerzających podsystem
    zabezpieczeń: pakietów uwierzytelniania, pakietów powiadamiania o zmianie
    hasła i bibliotek logowania.

    Są to składniki wczytywane przez lokalny urząd zabezpieczeń do własnego
    procesu — tego samego, który przechowuje poświadczenia w trakcie pracy
    systemu. Kod, który tam trafi, działa w miejscu, przez które przechodzi
    każde uwierzytelnienie na tej maszynie.

    Pakiet powiadamiania o zmianie hasła zasługuje na osobne zdanie.
    Mechanizm istnieje po to, żeby oprogramowanie mogło sprawdzać złożoność
    haseł i wymusić własne reguły. Dostaje przy tym hasło w postaci jawnej,
    w chwili jego ustawiania. Zarejestrowanie własnego pakietu jest więc
    sposobem na przechwytywanie każdego nowego hasła w domenie — cichym,
    trwałym i wyglądającym jak element konfiguracji.

    Rejestruje się powodzenia. Zdarzeń jest bardzo mało, bo składniki te
    wczytuje się przy starcie systemu i przy zmianie konfiguracji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: umieszczenie
    własnego kodu w procesie przechowującym poświadczenia, bez śladu
    wskazującego, kiedy ten kod się tam znalazł.
  en: |
    The subcategory records the loading of components extending the security
    subsystem: authentication packages, password change notification packages and
    logon libraries.

    These are components loaded by the local security authority into its own process
    - the very one holding credentials while the system runs. Code that gets there
    works in the place through which every authentication on this machine passes.

    The password change notification package deserves a sentence of its own. The
    mechanism exists so that software may check password complexity and enforce
    rules of its own. In doing so it receives the password in the clear, at the
    moment it is being set. Registering a package of one's own is therefore a way of
    intercepting every new password in the domain - quiet, lasting, and looking like
    a piece of configuration.

    Successes are recorded. There are very few events, such components being loaded
    at the system's start and at a change of configuration.

    What an attacker gains while the item goes unmet: the placing of their own code
    in the process holding credentials, with no trace of when that code got there.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zdarzeń jest kilka przy każdym uruchomieniu
    maszyny i praktycznie żadnych między restartami.

    Jest to punkt o jednym z najlepszych stosunków zysku do kosztu w bloku
    systemowym. Lista wczytanych rozszerzeń podsystemu zabezpieczeń jest krótka,
    stała i w całości znana — każda pozycja, której nie da się przypisać do
    znanego oprogramowania, jest warta pytania, a takie pytanie zadaje się raz
    na kilka miesięcy.

    Jedyna uwaga dotyczy maszyn z oprogramowaniem do zarządzania hasłami albo
    z rozszerzeniem uwierzytelniania wieloskładnikowego. Tam pozycji na liście
    jest więcej i warto je opisać przed zmianą, żeby później nie badać
    własnego wdrożenia jak incydentu.

    Czego to nie psuje: uwierzytelniania, zmiany haseł, logowania ani pracy
    rozszerzeń.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". There are a few events at every start of the
    machine and practically none between restarts.

    This is an item with one of the best ratios of gain to cost in the system block.
    The list of loaded security subsystem extensions is short, steady and wholly
    knowable - every entry that cannot be matched to known software is worth a
    question, and such a question is asked once in some months.

    The one remark concerns machines with password management software or a
    multi-factor authentication extension. There the list holds more entries, and
    they are worth describing before the change, so as not to investigate one's own
    deployment as an incident later.

    What this does not break: authentication, password changes, signing in, or the
    work of extensions.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — zdarzeń jest kilka przy starcie maszyny i praktycznie żadnych między restartami
      - Na maszynie z rozszerzeniem uwierzytelniania wieloskładnikowego pozycji na liście jest więcej i warto je opisać przed zmianą
      - Uwierzytelnianie, zmiana haseł i logowanie działają bez zmian
      - Rozszerzenia podsystemu zabezpieczeń pracują tak samo jak przed zmianą
    en:
      - No regression in the working - there are a few events at the machine's start and practically none between restarts
      - On a machine with a multi-factor authentication extension the list holds more entries, worth describing before the change
      - Authentication, password changes and signing in work unchanged
      - Security subsystem extensions work just as before the change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — objętość jest pomijalna nawet przy ciasnym dzienniku
    en:
      - No known contraindication - the volume is negligible even with a tight log
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9211-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9211-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9211-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9211-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9211-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-security-system-extension

notes:
  pl: |
    Punkt bywa pomijany, bo jego nazwa brzmi technicznie i niegroźnie.
    Tymczasem pakiet powiadamiania o zmianie hasła jest jednym z niewielu
    mechanizmów systemu, przez które hasło przechodzi jawnie — i jedynym, który
    da się rozszerzyć własnym kodem w sposób przewidziany przez producenta.

    Na kontrolerze domeny waga jest najwyższa, bo tam przez ten mechanizm
    przechodzą hasła całej organizacji.

    Reguła zapisuje wczytanie rozszerzenia, nie jego zarejestrowanie
    w rejestrze. Te dwie rzeczy dzieli restart maszyny — i to jest powód, dla
    którego warto czytać ten punkt razem z regułami o modyfikacji rejestru.
  en: |
    The item gets passed over because its name sounds technical and harmless. Yet
    the password change notification package is one of the few of the system's
    mechanisms through which a password passes in the clear - and the only one
    extensible with code of one's own in a way the maker foresaw.

    On a domain controller the weight is highest, the whole organisation's passwords
    passing through this mechanism there.

    The rule records an extension being loaded, not its registration in the
    registry. A restart of the machine lies between those two things - and that is
    why this item is worth reading together with the rules on registry
    modification.
