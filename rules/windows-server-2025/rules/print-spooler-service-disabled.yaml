id: win2025-print-spooler-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa bufora wydruku wyłączona
    en: Print spooler service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę bufora wydruku. Usługa ta przyjmuje zadania
    wydruku, w tym zadania przychodzące z sieci, i obsługuje instalowanie
    sterowników drukarek.

    Podnoszę kategorię do krytycznej wobec oceny dla stacji roboczej
    i jest to jedno z nielicznych podniesień w tej paczce, przy którym nie
    mam wątpliwości. Powód nie leży w drukowaniu. Leży w tym, że usługa
    ta działa z najwyższymi uprawnieniami, przyjmuje zgłoszenia z sieci
    i ma w swojej naturze zadanie, którego większość usług nie ma:
    instaluje kod — sterownik drukarki — na żądanie.

    Na serwerze waga tego rośnie o rząd wielkości z powodu, o którym
    trzeba powiedzieć wprost. Usługa ta jest domyślnie uruchomiona
    również na kontrolerze domeny, a kontroler domeny to maszyna,
    na której przejęcie uprawnień systemowych jest przejęciem całej
    domeny. Jest to więc podręcznikowy przypadek tego, o czym pisałem
    w tej paczce kilka razy: usługi, z której nikt na tej maszynie nie
    korzysta, a która jest najkrótszą drogą do środka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: usługę
    o najwyższych uprawnieniach, przyjmującą zgłoszenia z sieci
    i potrafiącą na żądanie załadować dostarczony kod — na maszynie,
    na której z drukowania nikt nie korzysta.
  en: |
    The item switches off the service of the holding of printings. That service takes tasks of
    printing, those coming off the net among them, and handles the installing of the drivers of
    printers.

    I raise the category to critical against the reckoning for a workstation, and it is one of the
    few raisings in this pack whereat I have no doubt. The ground lies not in the printing. It lies
    in that the service works with the highest rights, takes callings off the net, and has in its
    nature a task most services have not - it installs code, a driver of a printer, at a bidding.

    On a server the weight of that grows by an order, of a ground that must be said outright. That
    service is by default running upon a warder of the domain as well, and a warder of the domain is
    a machine whereon the taking of the rights of the system is the taking of the whole domain. It is
    therefore the very case out of the book whereof I have written in this pack a few times - a
    service nobody upon that machine uses, and which is the shortest road inside.

    What an attacker gains while the item goes unmet - a service of the highest rights, taking
    callings off the net and able at a bidding to load code that has been handed to it - upon a
    machine whereon nobody uses the printing.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia", ale chcę rozdzielić
    dwa zupełnie różne przypadki, bo mieszanie ich jest tu źródłem złych
    decyzji.

    Przypadek pierwszy to serwer wydruku. Tam ta usługa jest rolą
    maszyny, a wyłączenie jej zatrzymuje drukowanie w całej organizacji
    naraz. Nie jest to punkt do wdrożenia — jest to punkt do zapisania
    jako wyjątek, z uzasadnieniem i z datą przeglądu, i do potraktowania
    poważnie w inny sposób: ograniczeniem, kto może instalować sterowniki
    i skąd.

    Przypadek drugi to każdy inny serwer, w tym kontroler domeny. Tam
    usługa nie pełni żadnej funkcji, a mimo to działa. Wyłączenie jej jest
    zmianą tanią i bardzo opłacalną — ale nie jest zmianą bez skutków
    i nie należy jej robić hurtem.

    Skutki, których trzeba szukać, są dwa i oba są pośrednie. Pierwszy:
    aplikacja biznesowa generująca dokumenty potrafi używać sterownika
    wydruku do zapisu pliku, nawet jeżeli nic nigdy nie trafia na papier.
    Drugi: niektóre narzędzia raportowe i mechanizmy eksportu zakładają
    obecność tej usługi i przestają działać z komunikatem, który
    o drukowaniu nie wspomina.

    Objawem jest w obu przypadkach zadanie, które przestało się udawać,
    zgłoszone przez zespół aplikacji, a nie przez tego, kto zmienił
    ustawienie.

    Zmiana cofa się natychmiast i wymaga uruchomienia usługi z powrotem.
  en: |
    I leave the class "needs a witting rolling out", but would sunder two wholly other cases, their
    mingling being here a wellspring of ill decidings.

    The first case is a server of printing. There that service is the machine's role, and its
    switching off stops the printing of the whole ordering at once. It is no item to be rolled out -
    it is an item to be written down as an exception, with a standing by it and a day of looking
    over, and to be taken in earnest another way - by the bounding of who may install drivers and
    whence.

    The second case is every other server, a warder of the domain among them. There the service fills
    no office and works for all that. Its switching off is a cheap change and a very worthwhile one -
    but it is no change without outcomes and it ought not be done in bulk.

    The outcomes to be sought are two and both are roundabout. The first - an application of business
    that makes documents can use a driver of printing for the writing of a file, though nothing ever
    comes onto paper. The second - some tools of reports and workings of the bearing out hold that
    service to be there and stop working with a word given that makes no mention of printing.

    The symptom is in both cases a task that stopped succeeding, given word of by the band of the
    application and not by the one who altered the setting.

    The change is undone at once and takes the starting of the service again.

implementation_consequences:
  impact_areas:
    - printing
    - user-interface
  what_breaks:
    pl:
      - Na serwerze wydruku zatrzymuje się drukowanie w całej organizacji naraz
      - Aplikacja generująca dokumenty potrafi używać sterownika wydruku do zapisu pliku, bez drukowania czegokolwiek
      - Niektóre narzędzia raportowe i mechanizmy eksportu przestają działać z komunikatem niewspominającym o drukowaniu
      - Objawem jest zadanie, które przestało się udawać, zgłoszone przez zespół aplikacji
      - Na kontrolerze domeny i na większości serwerów usługa nie pełni żadnej funkcji, a mimo to działa
    en:
      - Upon a server of printing the printing of the whole ordering stops at once
      - An application that makes documents can use a driver of printing for the writing of a file, printing nothing at all
      - Some tools of reports and workings of the bearing out stop working with a word given that makes no mention of printing
      - The symptom is a task that stopped succeeding, given word of by the band of the application
      - Upon a warder of the domain and upon most servers the service fills no office and works for all that
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem wydruku i ta usługa jest jej rolą
      - Aplikacja biznesowa na tym serwerze używa sterownika wydruku do zapisu dokumentów
    en:
      - The machine is a server of printing and that service is its role
      - An application of business upon that server uses a driver of printing for the writing of documents
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Spooler'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Spooler'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a print server this is the role: record an exception instead. Anywhere
    # else, including a domain controller, the service runs unused. Check first
    # for applications that write documents through a print driver.
    Stop-Service -Name 'Spooler' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Spooler' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Spooler' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-print-spooler-service

notes:
  pl: |
    Kategoria podniesiona do krytycznej i jest to jedno z nielicznych
    podniesień w tej paczce, przy którym nie mam wątpliwości. Powód nie
    leży w drukowaniu: usługa działa z najwyższymi uprawnieniami,
    przyjmuje zgłoszenia z sieci i instaluje kod — sterownik drukarki —
    na żądanie.

    Na serwerze waga rośnie o rząd wielkości, bo usługa jest domyślnie
    uruchomiona również na kontrolerze domeny, gdzie przejęcie uprawnień
    systemowych jest przejęciem całej domeny. Podręcznikowy przypadek
    usługi, z której nikt nie korzysta, a która jest najkrótszą drogą do
    środka.

    Dwa przypadki wdrożenia trzeba rozdzielić: na serwerze wydruku to
    punkt do zapisania jako wyjątek, wszędzie indziej zmiana tania
    i bardzo opłacalna — ale nie bez skutków i nie do zrobienia hurtem.
  en: |
    The category is raised to critical and it is one of the few raisings in this pack whereat I have
    no doubt. The ground lies not in the printing - the service works with the highest rights, takes
    callings off the net and installs code, a driver of a printer, at a bidding.

    On a server the weight grows by an order, the service being by default running upon a warder of
    the domain as well, where the taking of the rights of the system is the taking of the whole
    domain. The very case out of the book - a service nobody uses, and the shortest road inside.

    Two cases of the rolling out must be sundered - upon a server of printing it is an item to be
    written down as an exception, everywhere else a cheap change and a very worthwhile one, yet not
    without outcomes and not to be done in bulk.
