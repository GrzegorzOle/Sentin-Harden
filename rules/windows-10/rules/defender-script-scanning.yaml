id: win10-defender-script-scanning

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection
  title:
    pl: Skanowanie skryptów włączone
    en: Script scanning enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza sprawdzanie skryptów w chwili, w której są
    uruchamiane przez powłokę, przeglądarkę albo pakiet biurowy.

    Punkt ten trafia w drogę wejścia używaną dziś najczęściej. Napastnik,
    który nie chce zostawiać pliku wykonywalnego, zostawia skrypt —
    w załączniku, w makrze dokumentu, w skrócie, w zadaniu
    zaplanowanym. Skrypt nie wymaga instalacji, nie wymaga uprawnień
    i jest wykonywany przez narzędzie, które w systemie stoi legalnie.

    Wartość reguły bierze się z tego, że sprawdzany jest tekst skryptu
    w postaci, w jakiej powłoka go wykonuje — a nie w postaci, w jakiej
    leży na dysku. Zaciemnianie kodu, kodowanie i sklejanie z kawałków
    działa na plik, ale nie na to, co ostatecznie zostaje wykonane.

    Odnotowuję zasięg: mechanizm obejmuje skrypty uruchamiane przez
    narzędzia zgłaszające je do sprawdzenia. Narzędzie, które tego nie
    robi, wykona skrypt niesprawdzony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    kodu przez narzędzie systemowe, bez pliku wykonywalnego i bez
    instalacji czegokolwiek.
  en: |
    The setting switches on the checking of scripts at the hour they are started by the shell, the browser or the
    office suite.

    This item strikes at the road of entry most used today. An attacker who will not leave an executable file
    leaves a script - in an attachment, in a document's macro, in a shortcut, in a scheduled task. A script calls
    for no installing, calls for no rights, and is carried out by a tool that stands in the system lawfully.

    The rule's worth comes of this, that what is checked is the script's text in the shape the shell carries it
    out in - and not in the shape it lies upon the disk in. The darkening of code, its encoding and its gluing
    together from pieces work upon the file but not upon what is in the end carried out.

    I set down the reach: the mechanism takes in the scripts started by tools that give them up for checking. A
    tool that does not do so will carry a script out unchecked.

    What an attacker gains while the item goes unmet: the carrying out of code by a system tool, with no
    executable file and with nothing installed.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Sprawdzanie dotyczy chwili uruchomienia skryptu i kosztuje czas
    mierzony w milisekundach. Skrypty logowania, zadania zaplanowane
    i narzędzia administracyjne działają dalej.

    Odnotowuję jedyne miejsce, w którym bywa widoczne: skrypty własnej
    roboty korzystające z technik, które ochrona rozpoznaje jako
    zaciemnianie — kodowanie poleceń, sklejanie nazw z kawałków,
    uruchamianie tekstu z pamięci. Nie jest to zarzut wobec autora; są to
    po prostu te same techniki, których używa napastnik.

    Skutkiem bywa wtedy skrypt zatrzymany w połowie. Właściwą odpowiedzią
    jest przepisanie go wprost, a nie wyłączenie mechanizmu — zwłaszcza
    że skrypt czytelny jest łatwiejszy w utrzymaniu niezależnie od ochrony.

    Czego to nie psuje: uruchamiania skryptów jako takiego, skryptów
    logowania, zadań zaplanowanych, logowania, udziałów plikowych,
    drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The checking touches the hour a script is started and costs time measured in thousandths of a second. Logon
    scripts, scheduled tasks and administrative tools go on working.

    I set down the one place at which it shows at times: scripts of one's own making using the techniques the
    protection knows again as a darkening - the encoding of commands, the gluing of names from pieces, the
    starting of text out of memory. It is no charge against their author; they are simply the same techniques an
    attacker uses.

    The consequence is then at times a script stopped halfway. The proper answer is the writing of it out plainly
    and not the switching off of the mechanism - the more so that a readable script is the easier to keep up,
    whatever the protection.

    What this does not break: the starting of scripts as such, logon scripts, scheduled tasks, logging on, file
    shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypty własnej roboty kodujące polecenia albo sklejające nazwy z kawałków bywają rozpoznane jako zaciemnianie
      - Skutkiem jest wtedy skrypt zatrzymany w połowie, a właściwą odpowiedzią przepisanie go wprost
      - Sprawdzanie kosztuje czas mierzony w milisekundach i dotyczy wyłącznie chwili uruchomienia
      - Mechanizm obejmuje skrypty zgłaszane do sprawdzenia przez narzędzie, które je uruchamia
      - Skrypty logowania, zadania zaplanowane, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Scripts of one s own making that encode commands or glue names from pieces are at times known again as a darkening
      - The consequence is then a script stopped halfway, and the proper answer the writing of it out plainly
      - The checking costs time measured in thousandths of a second and touches the hour of starting alone
      - The mechanism takes in the scripts given up for checking by the tool that starts them
      - Logon scripts, scheduled tasks, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracują skrypty zaciemnione, których nie da się przepisać, a przerwanie ich zatrzymuje pracę
    en:
      - Darkened scripts that cannot be written out plainly work upon the machine, and the breaking of them stops the work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableScriptScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableScriptScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is a negative one, so the compliant value is a nought: the scanning
    # of scripts is not switched off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableScriptScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła domyka parę z monitorowaniem zachowania i warto pokazywać je
    razem. Obie patrzą na to, co się dzieje, a nie na to, co leży na
    dysku — tyle że ta patrzy wcześniej, bo w chwili uruchomienia.

    Argument wart postawienia wprost dotyczy tego, na co patrzy
    sprawdzenie. Nie na plik skryptu, lecz na tekst w postaci, w jakiej
    powłoka go wykonuje. Zaciemnianie działa na plik i dlatego nie pomaga:
    kod musi w końcu zostać rozwinięty, żeby mógł się wykonać, a wtedy
    zostaje sprawdzony.

    Odnotowuję granicę zasięgu, bo bywa źródłem złudzenia. Mechanizm widzi
    tyle, ile zgłosi mu narzędzie uruchamiające skrypt. Narzędzie, które
    nie zgłasza, wykona skrypt niesprawdzony — i spełnienie tego punktu
    niczego w tym nie zmienia.
  en: |
    The rule closes the pair with behaviour monitoring, and it is well to show them together. Both look at what
    is going on and not at what lies upon the disk - save that this looks earlier, at the hour of starting.

    The argument worth putting outright touches what the check looks at. Not at the script's file but at the text
    in the shape the shell carries it out in. A darkening works upon the file and for that does not help: the code
    has in the end to be unfolded so that it may run, and then it is checked.

    I set down the bound of the reach, it being at times a source of delusion. The mechanism sees as much as the
    tool starting the script gives it. A tool that gives nothing up will carry a script out unchecked - and the
    meeting of this item changes nothing in that.
