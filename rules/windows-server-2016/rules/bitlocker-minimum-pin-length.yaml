id: win2016-bitlocker-minimum-pin-length

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Minimalna długość kodu odblokowującego dysk systemowy
    en: The least length of the code unlocking the system drive
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyznacza najmniejszą dopuszczalną długość kodu startowego
    odblokowującego dysk systemowy.

    Kod startowy jest tu jedyną rzeczą stojącą między kimś, kto ma maszynę
    w rękach, a odszyfrowanym dyskiem. Cała konstrukcja opisana w punkcie
    poprzednim sprowadza się w praktyce do tego, jak trudno ten kod odgadnąć.

    Rachunek jest przy tym prosty i warto go zrobić. Kod czterocyfrowy to
    dziesięć tysięcy możliwości. Układ zabezpieczający wprowadza opóźnienie
    po kolejnych błędnych próbach, więc odgadywanie nie idzie szybko — ale
    idzie, i przy maszynie stojącej w cudzych rękach przez weekend idzie
    wystarczająco daleko.

    Siedem znaków zmienia rząd wielkości na tyle, że odgadywanie przy
    konsoli przestaje być drogą realną. Nie jest to wartość magiczna; jest
    to punkt, w którym koszt odgadywania przewyższa koszt każdej innej drogi.

    Rzecz do zapamiętania: ustawienie obowiązuje kody nadawane po jego
    wprowadzeniu. Kod krótszy, nadany wcześniej, działa dalej i nikt o nim
    nie przypomni.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przestrzeń
    kodów na tyle małą, że odgadywanie przy konsoli staje się drogą realną.
  en: |
    The setting names the least admissible length of the startup code unlocking the system drive.

    The startup code is here the one thing standing between somebody who has the machine in
    their hands and a decrypted drive. The whole construction described at the item before comes
    down in practice to how hard that code is to guess.

    The reckoning is for all that a simple one and worth making. A four-digit code is ten
    thousand possibilities. The security chip brings in a delay after further wrong attempts, so
    the guessing does not go fast - but it goes, and at a machine standing in another's hands
    over a weekend it goes far enough.

    Seven characters change the order of magnitude enough that guessing at the console ceases to
    be a real road. It is no magic value; it is the point at which the cost of guessing outweighs
    the cost of every other road.

    A thing to keep in mind: the setting holds for codes given after it is brought in. A shorter
    code, given earlier, works on and nobody will bring it to mind.

    What an attacker gains while the item goes unmet: a space of codes small enough that guessing
    at the console becomes a real road.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć samo wdrożenie jest lekkie.

    Zmiana nie dotyka kodów już nadanych i nie wymaga restartu. Maszyna
    pracuje dalej, dysk pozostaje zaszyfrowany, nikt niczego nie zauważa
    tego dnia.

    Sprawdzić trzeba dwie rzeczy. Pierwsza: czy na maszynie w ogóle używa
    się kodu startowego. Jeżeli dysk jest zaszyfrowany samym układem
    zabezpieczającym, punkt ten nie zmienia niczego i jego wdrożenie jest
    czynnością pustą — co warto wiedzieć przed, a nie po.

    Druga: czy istniejące kody są krótsze niż wymagana długość. Jeżeli tak,
    samo wdrożenie ich nie wymieni i maszyna pozostanie chroniona kodem
    krótkim mimo zgodnego ustawienia. Jest to rozbieżność między raportem
    a stanem faktycznym i wymaga osobnego kroku — wymiany kodu.

    Trzecia rzecz nie jest sprawdzeniem, tylko ostrzeżeniem. Wydłużenie kodu
    podnosi liczbę pomyłek przy konsoli, a każda pomyłka na maszynie
    z włączonym opóźnieniem układu kosztuje czas. Przy kodzie wpisywanym
    o trzeciej w nocy przez kogoś zaspanego bywa to odczuwalne.

    Czego to nie psuje: kodów już nadanych, pracy systemu, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", light though the rollout itself is.

    The change does not touch codes already given and calls for no restart. The machine works on,
    the drive stays encrypted, nobody notices anything that day.

    Two things have to be checked. The first: whether a startup code is used on the machine at
    all. Where the drive is encrypted by the security chip alone, this item changes nothing and
    its rollout is an empty act - which is worth knowing beforehand rather than after.

    The second: whether existing codes are shorter than the required length. If they are, the
    rollout by itself will not exchange them and the machine will stay guarded by a short code
    despite a compliant setting. It is a divergence between the report and the state in fact and
    calls for a step of its own - an exchange of the code.

    The third thing is no check but a warning. Lengthening the code raises the number of
    mistakes at the console, and every mistake on a machine with the chip's delay switched on
    costs time. At a code typed at three in the morning by somebody half asleep that is at times
    felt.

    What this does not break: codes already given, the system's working, services, or the
    network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Kody już nadane nie zostają wymienione, więc maszyna może pozostać chroniona krótkim kodem mimo zgodnego ustawienia
      - Na maszynie szyfrowanej samym układem zabezpieczającym wdrożenie tego punktu nie zmienia niczego
      - Dłuższy kod podnosi liczbę pomyłek przy konsoli, a każda pomyłka kosztuje czas przez opóźnienie układu
      - Praca systemu, usługi i sieć pozostają bez zmian
    en:
      - Codes already given are not exchanged, so the machine may stay guarded by a short code despite a compliant setting
      - On a machine encrypted by the security chip alone the rollout of this item changes nothing
      - A longer code raises the number of mistakes at the console, and every mistake costs time through the chip's delay
      - The system's working, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Kod startowy wpisuje osoba, która przy konsoli pracuje rzadko, a obsługa nocna nie została uprzedzona o zmianie długości
      - Dysk systemowy jest szyfrowany samym układem zabezpieczającym i kodu startowego nie ma
    en:
      - The startup code is typed by somebody who works at the console seldom, and the night attendance has not been forewarned of the change of length
      - The system drive is encrypted by the security chip alone and there is no startup code
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # A value below the required one is reported together with its length, so
      # a machine set too leniently can be told from one with no setting at all.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'MinimumPIN'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -lt 7) { 'BELOW_MINIMUM ' + [int]$value }
        else { 'AT_OR_ABOVE_MINIMUM' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AT_OR_ABOVE_MINIMUM'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'MinimumPIN'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Seven is the least length that makes guessing at the console pointless.
    # The setting takes effect for codes set after it, not for those already
    # in use.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MinimumPIN' -Value 7 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest drugim w bloku i pierwszym, który mówi o sile, a nie
    o obecności. Poprzedni rozstrzygał, czy ktoś musi być przy starcie; ten
    rozstrzyga, ile jest wart to, co ten ktoś wpisuje.

    Kategoria wysoka przy klasie wymagającej jedynie sprawdzenia stawia
    punkt blisko szybkich wygranych i tak warto go pokazywać. Koszt jest
    niemal zerowy, a przedmiotem jest jedyna rzecz stojąca między maszyną
    w cudzych rękach a odszyfrowanym dyskiem.

    Rozbieżność między ustawieniem a stanem faktycznym jest tu wyjątkowo
    myląca i warto ją zgłaszać osobno. Zgodny wpis w rejestrze znaczy
    wyłącznie, że nowe kody będą odpowiednio długie. Nie znaczy, że kod
    używany na tej maszynie taki jest. Raport pokazujący zieleń przy
    maszynie chronionej czterema cyframi jest gorszy niż brak raportu, bo
    zamyka sprawę, która pozostaje otwarta.

    Stan pośredni zgłaszany przez audyt — wartość poniżej wymaganej wraz
    z jej długością — istnieje właśnie po to, żeby dało się odróżnić maszynę
    ustawioną zbyt łagodnie od maszyny nieustawionej wcale. Pierwsza jest
    świadectwem decyzji, druga jej braku, i traktuje się je inaczej.
  en: |
    The item is the second in the block and the first that speaks of strength rather than of
    presence. The one before settled whether somebody must be there at the start; this one
    settles how much what that somebody types is worth.

    A high category with a class calling only for review puts the item near the quick wins and it
    is worth showing so. The cost is all but nil and the subject is the one thing standing
    between a machine in another's hands and a decrypted drive.

    The divergence between the setting and the state in fact is here uncommonly misleading and
    worth reporting apart. A compliant entry in the registry means solely that new codes will be
    of a fitting length. It does not mean that the code used on this machine is. A report showing
    green at a machine guarded by four digits is worse than no report, shutting as it does a
    matter that stays open.

    The middle state the audit reports - a value below the required one along with its length -
    exists precisely so that a machine set too leniently can be told from one not set at all. The
    first is witness to a decision, the second to its want, and they are treated differently.
