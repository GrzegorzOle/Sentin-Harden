id: win2016-mobile-hotspot-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia jako punktu dostępowego wyłączona
    en: The service sharing the connection as an access point disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pozwala udostępnić połączenie sieciowe tej maszyny innym
    urządzeniom przez sieć bezprzewodową, czyniąc z maszyny punkt dostępowy.

    Cel jest ten sam, co przy udostępnianiu połączenia opisanym wcześniej,
    ale droga jest nowsza i obsługiwana osobno. Warto to wiedzieć, bo
    wyłączenie tamtej usługi nie zamyka tej — są to dwa niezależne wpisy
    i dwie niezależne decyzje.

    Skutek jest za to cięższy niż tam, bo droga prowadzi przez radio.
    Maszyna, która udostępnia połączenie przewodowo, wymaga od korzystającego
    podłączenia kabla. Maszyna, która udostępnia je bezprzewodowo, wymaga
    tylko znalezienia się w zasięgu i znajomości hasła sieci.

    Powstaje przez to punkt wejścia do sieci organizacji, który nie
    przechodzi przez żadne urządzenie brzegowe, nie pojawia się w żadnym
    schemacie i nie jest przez nikogo pilnowany. Serwer staje się bramą
    radiową, choć nikt go tak nie zaprojektował.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    utworzenia na tej maszynie radiowego wejścia do sieci organizacji,
    omijającego wszystkie urządzenia brzegowe.
  en: |
    The service lets this machine's network connection be shared with other devices over a
    wireless network, making the machine an access point.

    The end is the same as at the connection sharing described earlier, but the road is a
    newer one and served apart. That is worth knowing, switching that service off not
    shutting this - they are two independent entries and two independent decisions.

    The consequence is for all that the heavier, the road leading through the air. A machine
    sharing its connection by cable calls on the one using it to plug a cable in. A machine
    sharing it wirelessly calls only for coming within range and knowing the network's
    password.

    There arises thereby a way into the organisation's network passing through no edge
    device, appearing on no diagram and watched over by nobody. The server becomes a radio
    gateway, though nobody designed it as one.

    What an attacker gains while the item goes unmet: the chance to make on this machine a
    radio way into the organisation's network, going round every edge device.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Serwer nie udostępnia połączenia jako punktu dostępowego i nie ma
    zastosowania, w którym by to robił. Usługa wymaga przy tym karty
    bezprzewodowej, której serwer zwykle nie ma — i wtedy stoi bezczynnie
    niezależnie od wpisu.

    Różnica wobec reguły o udostępnianiu połączenia jest tu ważna i warta
    powtórzenia: tamta niosła zamianę adresów używaną przez przełączniki
    wirtualne i dlatego mogła odciąć maszyny wirtualne. Ta nie niesie
    niczego poza sobą. Wyłączenie jej nie dotyka wirtualizacji ani niczego
    innego.

    Właśnie dlatego klasy są różne mimo podobieństwa nazw. Tamta wymagała
    świadomego wdrożenia, ta idzie hurtem.

    Nie ma znanych regresji.

    Czego to nie psuje: zwykłego ruchu sieciowego, wirtualizacji,
    przełączników wirtualnych, udziałów, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "no disruption".

    A server does not share its connection as an access point and there is no use in which it
    would. The service calls besides for a wireless card, which a server as a rule has not -
    and then it stands idle whatever the entry.

    The difference from the rule on connection sharing is here important and worth repeating:
    that one carried the address translation used by virtual switches and could therefore cut
    virtual machines off. This one carries nothing beyond itself. Switching it off touches
    neither virtualisation nor anything else.

    That is just why the classes differ despite the likeness of the names. That one needed a
    planned rollout, this one goes in bulk.

    There are no known regressions.

    What this does not break: ordinary network traffic, virtualisation, virtual switches,
    shares, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Serwer nie udostępnia połączenia jako punktu dostępowego, więc wyłączenie nie odbiera żadnej funkcji
      - Usługa wymaga karty bezprzewodowej, której serwer zwykle nie ma, i wtedy stoi bezczynnie niezależnie od wpisu
      - Wyłączenie nie dotyka wirtualizacji ani przełączników wirtualnych, w odróżnieniu od reguły o udostępnianiu połączenia
      - Zwykły ruch sieciowy, udziały i uwierzytelnianie pozostają bez zmian
    en:
      - A server does not share its connection as an access point, so switching it off takes away no feature
      - The service calls for a wireless card, which a server as a rule has not, and then it stands idle whatever the entry
      - Switching it off touches neither virtualisation nor virtual switches, unlike the rule on connection sharing
      - Ordinary network traffic, shares and authentication stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna świadomie pełni rolę punktu dostępowego dla urządzeń pracujących obok niej
    en:
      - The machine knowingly fills the role of an access point for devices working beside it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'icssvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the newer road to the same end as connection sharing. Shutting one
    # without the other leaves the passage open.
    Stop-Service -Name 'icssvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'icssvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'icssvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/

notes:
  pl: |
    Punkt tworzy parę z regułą o udostępnianiu połączenia sieciowego i jest
    to para, którą łatwo pomylić z powtórzeniem. Nie jest powtórzeniem.
    Wpisy są dwa, decyzje są dwie, a wyłączenie jednego nie zamyka drugiego.

    Rozejście się ocen w tej parze warto pokazać jako przykład. Nazwy są
    podobne, cel jest ten sam, a klasy uciążliwości są różne, bo różni je
    to, co jeszcze te usługi obsługują poza swoją nazwą. Tamta ciągnie za
    sobą wirtualizację, ta nie ciągnie nic. Jest to dokładnie ten rodzaj
    rozróżnienia, którego sam benchmark nie robi.

    Warto też odnotować, że droga radiowa jest w całym zestawie drugą po
    łączności bliskiego zasięgu, która omija zaporę i podział sieci.
    Kategoria niska bierze się wyłącznie z tego, że serwer rzadko ma kartę
    bezprzewodową — gdzie ją ma, waga tego punktu rośnie.
  en: |
    The item makes a pair with the rule on sharing a network connection, and it is a pair
    easily taken for a repetition. It is no repetition. There are two entries, two decisions,
    and switching one off does not shut the other.

    The parting of the assessments in that pair is worth showing as an example. The names are
    alike, the end is the same, and the disruption classes differ, what divides them being
    what else those services carry beyond their name. That one drags virtualisation behind
    it, this one drags nothing. It is exactly the kind of distinction the benchmark itself
    does not make.

    Worth noting too that the radio road is in the whole set the second, after short range
    connectivity, to go round the firewall and the network's division. The low category comes
    solely from a server rarely having a wireless card - where it has one, this item's weight
    grows.
