id: win2025-standby-states-disabled-when-sleeping

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Power Management > Sleep Settings
  title:
    pl: Sen z zawartością pamięci wyłączony na rzecz hibernacji
    en: Sleep holding memory contents turned off in favour of hibernation
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania maszynie zasypiania w stanie, w którym pamięć operacyjna
    pozostaje zasilana, i pozostawia hibernację jako jedyny sposób
    wstrzymania pracy.

    Kategoria wysoka i powód jest jeden: w tym stanie zawartość pamięci
    trwa dalej, w układzie, który nadal ma prąd. A w pamięci pracującej
    maszyny leżą klucze — klucz szyfrowania dysku, bilety
    uwierzytelniające, poświadczenia sesji. Maszyna uśpiona w ten sposób to
    maszyna zaszyfrowana, która nadal trzyma swój klucz odblokowany.

    To jest właściwa treść punktu i warto ją oddzielić od poprzedniego:
    tamten mówi, czy przy wybudzeniu trzeba podać hasło, ten mówi, czy
    w ogóle istnieje stan, w którym klucze czekają w zasilanej pamięci.
    Hasło przy wybudzeniu chroni ekran; nie chroni pamięci przed odczytaniem
    z pominięciem systemu.

    Hibernacja rozwiązuje to inaczej: zawartość pamięci trafia na dysk,
    który jest zaszyfrowany, a układy pamięci tracą zasilanie. Po starcie
    z hibernacji klucz trzeba odtworzyć na nowo, tak jak przy zimnym
    uruchomieniu.

    Na serwerze punkt bywa uznawany za bezprzedmiotowy i zwykle jest — ale
    tylko wtedy, gdy zasypianie jest faktycznie wyłączone, a nie wtedy, gdy
    się tak przypuszcza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę,
    która wygląda na wyłączoną, a trzyma klucz szyfrowania dysku w zasilanej
    pamięci.
  en: |
    The item forbids the machine to sleep in a state where working memory
    stays powered, leaving hibernation as the only way of suspending work.

    The category is high and there is one reason: in that state the contents
    of memory live on, in circuitry that still has current. And in the memory
    of a working machine lie keys - the disk encryption key, authentication
    tickets, session credentials. A machine asleep in this way is an
    encrypted machine still holding its key unlocked.

    That is the real substance of the item, and it is worth separating from
    the previous one: that one says whether a password is needed on waking,
    this one says whether a state exists at all in which keys wait in powered
    memory. A password on waking protects the screen; it does not protect
    memory from being read with the system bypassed.

    Hibernation solves it differently: the contents of memory go to the disk,
    which is encrypted, and the memory circuits lose power. Starting from
    hibernation, the key has to be reconstructed anew, as at a cold start.

    On a server the item is sometimes judged moot, and usually it is - but
    only where sleeping is genuinely switched off, not where it is presumed
    to be.

    What an attacker gains while the item goes unmet: a machine that looks
    switched off while holding the disk encryption key in powered memory.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze z wyłączonym zasypianiem
    ta zmiana nie zrobi nic. Sprawdzić trzeba trzy rzeczy i żadna z nich nie
    jest oczywista.

    Pierwsza: czy hibernacja na tej maszynie w ogóle jest włączona. Bywa
    wyłączana przy stawianiu serwera, żeby odzyskać miejsce na dysku — plik
    hibernacji zajmuje tyle, ile jest pamięci, a na serwerze z dużą pamięcią
    to są dziesiątki gigabajtów. Jeżeli hibernacja jest wyłączona, a sen
    zablokowany, maszyna nie zaśnie wcale. Zwykle to właśnie jest stan
    pożądany, ale trzeba go wybrać świadomie, a nie odkryć.

    Druga: czas. Zapis pamięci na dysk i odczyt z powrotem trwa, a przy
    dużej pamięci trwa długo. Maszyna, która dotąd wracała w sekundę,
    będzie wracać w minuty.

    Trzecia: host wirtualizacji. Uśpienie hosta to uśpienie wszystkiego, co
    na nim stoi, a hibernacja hosta z maszynami wirtualnymi w pamięci to
    operacja, której zachowanie zależy od rozwiązania wirtualizacyjnego.
    Na takiej maszynie właściwą odpowiedzią jest wyłączenie zasypiania
    w całości, a nie wybór między jednym trybem a drugim.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server with sleeping switched
    off this change will do nothing. Three things need checking and none of
    them is obvious.

    First: whether hibernation on this machine is enabled at all. It gets
    switched off when a server is built, to win back disk space - the
    hibernation file takes as much as there is memory, and on a server with
    plenty of memory that is tens of gigabytes. If hibernation is off and
    sleep is blocked, the machine will not go to sleep at all. Usually that
    is precisely the wanted state, but it should be chosen deliberately, not
    discovered.

    Second: time. Writing memory to disk and reading it back takes a while,
    and with plenty of memory it takes a long one. A machine that used to
    come back in a second will come back in minutes.

    Third: a virtualisation host. Putting a host to sleep means putting to
    sleep everything standing on it, and hibernating a host with virtual
    machines in memory is an operation whose behaviour depends on the
    virtualisation product. On such a machine the right answer is to switch
    sleeping off entirely, not to choose between one mode and another.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - boot-and-firmware
    - network-and-firewall
  what_breaks:
    pl:
      - Jeżeli hibernacja jest na tej maszynie wyłączona, a sen zablokowany, maszyna nie zaśnie wcale — wybierz ten stan świadomie
      - Plik hibernacji zajmuje tyle, ile jest pamięci, czyli na serwerze dziesiątki gigabajtów miejsca na dysku
      - Maszyna, która wracała w sekundę, będzie wracać w minuty, bo pamięć trzeba zapisać na dysk i odczytać z powrotem
      - Na hoście wirtualizacji właściwą odpowiedzią jest wyłączenie zasypiania w całości, a nie wybór między trybami
    en:
      - If hibernation is off on this machine and sleep is blocked, the machine will not sleep at all - choose that state deliberately
      - The hibernation file takes as much as there is memory, that is tens of gigabytes of disk space on a server
      - A machine that came back in a second will come back in minutes, because memory has to be written to disk and read back
      - On a virtualisation host the right answer is to switch sleeping off entirely, not to choose between modes
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest hostem wirtualizacji albo ma wyłączoną hibernację, a zasypianie nie zostało świadomie wyłączone w planie zasilania
    en:
      - The machine is a virtualisation host, or has hibernation off while sleeping has not been deliberately switched off in the power plan
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One setting in two power variants. The report gives the weaker of them,
      # because the machine is protected only as far as the worse variant
      # protects it - an uninterruptible supply can switch it over by itself.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $ac = $item.ACSettingIndex
        $dc = $item.DCSettingIndex
        if ($null -eq $ac -or $null -eq $dc) { 'MISSING' }
        elseif ([int]$ac -eq 0 -and [int]$dc -eq 0) { 'HIBERNATE_ONLY' }
        else { 'AC=' + $ac + ' DC=' + $dc }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'HIBERNATE_ONLY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      ac          = $item.ACSettingIndex
      ac_existed  = ($null -ne $item.ACSettingIndex)
      dc          = $item.DCSettingIndex
      dc_existed  = ($null -ne $item.DCSettingIndex)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # In that state the keys - disk encryption, tickets, session credentials -
    # wait in powered memory, so the machine looks switched off while holding its
    # key unlocked. Check first that hibernation is enabled here, or the machine
    # will simply stop sleeping at all.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ACSettingIndex' -Value 0 -Type DWord
    Set-ItemProperty -Path $path -Name 'DCSettingIndex' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.ac_existed) {
      Set-ItemProperty -Path $b.path -Name 'ACSettingIndex' -Value $b.ac -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ACSettingIndex' -ErrorAction SilentlyContinue
    }
    if ($b.dc_existed) {
      Set-ItemProperty -Path $b.path -Name 'DCSettingIndex' -Value $b.dc -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DCSettingIndex' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby

notes:
  pl: |
    W tym stanie zawartość pamięci trwa dalej, w układzie, który nadal ma
    prąd. W pamięci pracującej maszyny leżą klucze: klucz szyfrowania dysku,
    bilety uwierzytelniające, poświadczenia sesji. Maszyna uśpiona w ten
    sposób to maszyna zaszyfrowana, która trzyma swój klucz odblokowany.

    Oddziel to od żądania hasła przy wybudzeniu. Hasło chroni ekran; nie
    chroni pamięci przed odczytaniem z pominięciem systemu.

    Trzy rzeczy do sprawdzenia przed zastosowaniem: czy hibernacja jest tu
    włączona (bywa wyłączana dla odzyskania miejsca), ile potrwa powrót przy
    dużej pamięci, i czy maszyna nie jest hostem wirtualizacji — tam
    właściwą odpowiedzią jest wyłączenie zasypiania w całości.
  en: |
    In that state the contents of memory live on, in circuitry that still has
    current. In the memory of a working machine lie keys: the disk encryption
    key, authentication tickets, session credentials. A machine asleep this
    way is an encrypted machine holding its key unlocked.

    Separate this from demanding a password on waking. The password protects
    the screen; it does not protect memory from being read with the system
    bypassed.

    Three things to check before applying: whether hibernation is enabled
    here (it gets switched off to win back space), how long the return will
    take with plenty of memory, and whether the machine is a virtualisation
    host - there the right answer is to switch sleeping off entirely.
