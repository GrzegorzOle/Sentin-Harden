id: win2025-machine-inactivity-limit

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Blokada ekranu po okresie bezczynności
    en: Screen lock after an inactivity period
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje ekran po ustalonym czasie bez aktywności i wymaga
    okresu nie dłuższego niż piętnaście minut.

    Na serwerze scenariusz jest inny niż na stanowisku roboczym i zwykle
    pomijany, bo „przecież nikt przy serwerze nie siedzi". Właśnie o to
    chodzi: sesja otwarta na konsoli serwera nie jest przez nikogo
    pilnowana, a otwarta bywa na koncie o najwyższych uprawnieniach.
    Zostaje otwarta nie na kwadrans, tylko do następnej wizyty w serwerowni.

    Dróg do takiej sesji jest więcej, niż sugeruje obraz zamkniętej
    serwerowni: konsola maszyny wirtualnej w hipernadzorcy, karta
    zarządzania sprzętowego, przełącznik konsolowy. Każda z nich pokazuje
    ekran dokładnie w tym stanie, w jakim zostawiła go ostatnia osoba —
    i żadna nie wymaga wejścia do pomieszczenia.

    Sesja pulpitu zdalnego zachowuje się tak samo. Rozłączenie sesji nie
    jest jej zamknięciem: sesja żyje dalej po stronie serwera i czeka na
    ponowne podłączenie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową sesję
    administracyjną, bez hasła i bez śladu logowania. Wszystko, co zrobi,
    zostanie zapisane jako działanie osoby, która tę sesję otworzyła.
  en: |
    The setting locks the screen after a settled time without activity and takes a term no
    longer than fifteen minutes.

    On a server the scenario differs from that at a working station and is usually passed
    over, since "nobody sits at a server anyway". That is exactly the point: a session open
    on a server's console is watched by nobody, and is at times open on the account with the
    highest rights. It stays open not for a quarter of an hour but until the next visit to
    the server room.

    There are more roads to such a session than the image of a locked server room suggests:
    a virtual machine's console in the hypervisor, a hardware management card, a console
    switch. Each of them shows the screen in exactly the state the last person left it in -
    and none takes entry into a room.

    A remote desktop session behaves the same. Disconnecting a session is not closing it:
    the session goes on living on the server's side and waits to be connected to again.

    What an attacker gains while the item goes unmet: a ready administrative session, with
    no password and no trace of a signing in. Everything they do will be recorded as the
    doing of the person who opened that session.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na serwerze pracuje coś, co potrzebuje
    otwartej sesji interaktywnej — bo blokada ekranu sesji nie kończy, ale
    dla części programów to bez znaczenia, a dla części nie.

    Sesja zablokowana nadal działa: procesy w niej uruchomione pracują
    dalej, a zadania i usługi nie mają z blokadą nic wspólnego. Kłopot
    dotyczy wąskiej grupy programów, które muszą rysować coś na pulpicie —
    starsze aplikacje obsługiwane przez automat, narzędzia testowe,
    oprogramowanie zbierające obraz ekranu. Te zobaczą ekran blokady
    zamiast pulpitu.

    Drugi przypadek to serwery z pulpitem wystawionym jako tablica: widok
    monitoringu, panel na ścianie, podgląd produkcji. Blokada wygasza taki
    widok i jest to skutek zamierzony, ale często niepożądany. Właściwym
    rozwiązaniem jest wtedy osobne konto bez uprawnień, nie wyłączenie
    blokady na całej maszynie.

    Dla obsługi skutek jest jeden: po powrocie do konsoli trzeba wpisać
    hasło. Przy ukrytej nazwie ostatniego użytkownika — także nazwę konta.

    Zmiana nie wymaga restartu; obowiązuje od następnego logowania.
  en: |
    What needs checking is whether anything working on the server takes an open interactive
    session - since the screen lock does not end a session, but for some programs that makes
    no difference and for some it does.

    A locked session still works: the processes started in it go on running, and tasks and
    services have nothing to do with the lock. The trouble concerns a narrow group of
    programs that have to draw something on the desktop - older applications driven by a
    machine, test tools, software gathering the screen's image. Those will see the lock
    screen rather than the desktop.

    The second case is servers with a desktop put up as a board: a monitoring view, a panel
    on the wall, a production overview. The lock blanks such a view and that is an intended
    effect, though often unwanted. The right answer is then a separate account with no
    rights rather than switching the lock off on the whole machine.

    For support there is one effect: on returning to the console a password has to be typed.
    With the last user's name hidden, the account's name as well.

    The change takes no restart; it binds from the next signing in.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - legacy-applications
  what_breaks:
    pl:
      - Programy rysujące na pulpicie widzą ekran blokady zamiast pulpitu
      - Pulpit wystawiony jako tablica informacyjna wygasza się po kwadransie
      - Sesja zablokowana działa dalej — procesy, zadania i usługi pracują bez zmiany
      - Po powrocie do konsoli trzeba wpisać hasło, a przy ukrytej nazwie także nazwę konta
    en:
      - Programs drawing on the desktop see the lock screen rather than the desktop
      - A desktop put up as an information board blanks after a quarter of an hour
      - A locked session goes on working - processes, tasks and services run unchanged
      - On returning to the console a password has to be typed, and with the name hidden the account's name too
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Pulpit serwera służy za stały widok informacyjny, którego nie wolno wygaszać
      - Na serwerze pracuje aplikacja sterowana automatem wymagającym odblokowanego pulpitu
    en:
      - The server's desktop serves as a standing information view that may not be blanked
      - An application driven by a machine taking an unlocked desktop works on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'InactivityTimeoutSecs'
      $value = $null
      if (Test-Path -Path $path -ErrorAction Stop) {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
      }
      # Zero means "never lock" and is a misconfiguration, not a large timeout -
      # it must not slip through a numeric comparison as a small value.
      if ($null -eq $value -or [int]$value -eq 0) { 'NEVER' } else { [string]$value }
    } catch {
      'CHECK_ERROR'
    }
  expected: '900'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'InactivityTimeoutSecs' -ErrorAction SilentlyContinue).'InactivityTimeoutSecs'
    [pscustomobject]@{
      path        = $path
      name        = 'InactivityTimeoutSecs'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'InactivityTimeoutSecs' -Value 900 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-machine-inactivity-limit

notes:
  pl: |
    Wynik „NEVER" oznacza brak blokady i celowo nie jest liczbą. Zero
    przeszłoby porównanie „nie więcej niż dziewięćset sekund" jako wartość
    najlepsza z możliwych, opisując stan najgorszy — ekran otwarty bez
    końca.

    Blokada ekranu nie kończy sesji i nie zwalnia jej zasobów. Sesja
    rozłączona po stronie pulpitu zdalnego żyje dalej niezależnie od tego
    ustawienia; ograniczeniem czasu takich sesji zajmują się osobne punkty
    benchmarku.

    Punkt czyta się razem z ukryciem nazwy ostatniego użytkownika: blokada
    decyduje o tym, że ekran się zamyka, tamten — o tym, ile ekran zamknięty
    nadal pokazuje.
  en: |
    The result "NEVER" means no lock at all and is deliberately not a number. Zero would
    pass a "not greater than nine hundred seconds" comparison as the best possible value
    while describing the worst state - a screen open without end.

    The screen lock does not end a session and does not free its resources. A session
    disconnected on the remote desktop's side goes on living regardless of this setting;
    bounding the time of such sessions is the business of separate items of the benchmark.

    The item is read together with the hiding of the last user's name: the lock settles that
    the screen closes, that one settles how much a closed screen still shows.
