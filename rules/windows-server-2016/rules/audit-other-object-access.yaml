id: win2016-audit-other-object-access

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja innych zdarzeń dostępu do obiektów
    en: Audit other object access events
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zbiera zdarzenia dostępu, które nie mieszczą się w pozostałych:
    przede wszystkim operacje na zadaniach w harmonogramie i na obiektach
    komunikacji między procesami.

    Zadania w harmonogramie są tu rzeczą najważniejszą i to one uzasadniają
    kategorię wysoką. Utworzone zadanie jest jedną z trzech klasycznych dróg
    utrwalenia dostępu — obok nowego konta i nowej usługi — a zarazem najmniej
    rzucającą się w oczy. Zadanie uruchamiane raz na dobę o trzeciej nad ranem
    nie pojawi się w żadnym przeglądzie procesów i nie wzbudzi niczyjej uwagi.

    Zdarzenia tej podkategorii pokazują utworzenie, zmianę, włączenie
    i usunięcie zadania. Jest to więc ta sama wartość, co przy zarządzaniu
    kontami, tylko dla innego rodzaju trwałości.

    Druga część podkategorii — obiekty komunikacji między procesami — jest
    znacznie rzadsza i dotyczy przypadków, w których proces próbuje sięgnąć po
    zasób należący do innego. Zdarzeń tego rodzaju powstaje na maszynie
    niewiele.

    Rejestruje się powodzenia i niepowodzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: założenie
    zadania uruchamiającego jego program cyklicznie, bez zapisu wskazującego,
    kiedy i przez kogo zadanie powstało.
  en: |
    The subcategory gathers access events that do not fit the others: above all
    operations on scheduled tasks and on objects of communication between processes.

    Scheduled tasks are the chief matter here and they justify the high category. A
    task created is one of the three classic roads to making access last - beside a
    new account and a new service - and at the same time the least conspicuous. A
    task run once a day at three in the morning will show in no review of processes
    and will draw nobody's attention.

    Events of this subcategory show a task being created, changed, enabled and
    removed. It is therefore the same worth as with account management, only for
    another kind of persistence.

    The subcategory's second part - objects of communication between processes - is
    far rarer and concerns cases where a process tries to reach a resource belonging
    to another. Few events of that kind arise on a machine.

    Successes and failures are both recorded.

    What an attacker gains while the item goes unmet: the setting up of a task
    running their program at intervals, with no record of when the task came into
    being or through whom.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zdarzeń jest na typowym serwerze niewiele, bo
    zadania w harmonogramie tworzy się rzadko, a zmienia jeszcze rzadziej.

    Warto pamiętać o dwóch źródłach podwyższonej objętości. Pierwsze to
    oprogramowanie do kopii zapasowych i monitorowania, które tworzy i usuwa
    zadania jednorazowe przy każdym cyklu — wtedy zdarzeń przybywa tyle, ile
    cykli. Drugie to systemy wdrożeniowe, które przy każdej instalacji dopisują
    i sprzątają zadania pomocnicze.

    Oba źródła są rozpoznawalne po wzorcu: te same nazwy zadań powtarzające się
    regularnie. Jest to szum, który da się odfiltrować — ale trzeba wiedzieć,
    że jest.

    Nic przy tym nie przestaje działać. Zadania uruchamiają się tak samo,
    harmonogram działa tak samo, użytkownik niczego nie widzi.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". There are few events on a typical server, since
    scheduled tasks are created seldom and changed more seldom still.

    Two sources of raised volume are worth remembering. The first is backup and
    monitoring software creating and removing one-off tasks at every cycle - then as
    many events accrue as there are cycles. The second is deployment systems adding
    and clearing away helper tasks at every installation.

    Both sources are recognisable by the pattern: the same task names recurring
    regularly. It is noise that can be filtered out - but one has to know it is
    there.

    Nothing stops working while this goes on. Tasks run as before, the scheduler
    works as before, the user sees nothing.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — zadania uruchamiają się tak samo i harmonogram pracuje bez zmian
      - Oprogramowanie tworzące zadania jednorazowe przy każdym cyklu dopisuje zdarzeń tyle, ile cykli
      - Systemy wdrożeniowe dopisujące i sprzątające zadania pomocnicze generują powtarzalny szum
      - Szum da się odfiltrować po nazwie zadania, ale trzeba wiedzieć, że jest
    en:
      - No regression in the working - tasks run as before and the scheduler works unchanged
      - Software creating one-off tasks at every cycle adds as many events as there are cycles
      - Deployment systems adding and clearing away helper tasks generate recurring noise
      - The noise can be filtered by task name, but one has to know it is there
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — objętość jest niewielka i przewidywalna nawet przy szumie z zadań cyklicznych
    en:
      - No known contraindication - the volume is small and predictable even with noise from recurring tasks
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9227-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9227-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9227-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9227-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9227-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-other-object-access-events

notes:
  pl: |
    Nazwa podkategorii niczego nie obiecuje i to jest powód, dla którego bywa
    pomijana. Faktyczna treść — zadania w harmonogramie — należy do
    najważniejszych rzeczy, jakie da się na serwerze rejestrować.

    Punkt warto czytać w trójce: zarządzanie kontami, zarządzanie usługami
    i ta podkategoria. Są to trzy drogi utrwalenia dostępu i pokrycie
    wszystkich trzech jest warunkiem, żeby pytanie „jak on tu wraca" miało
    odpowiedź.

    Zdarzenia dotyczące obiektów komunikacji między procesami są w tej
    podkategorii dodatkiem, a nie jej treścią. Nie należy oczekiwać po nich
    wiele na typowej maszynie.
  en: |
    The subcategory's name promises nothing, and that is why it gets passed over.
    Its actual content - scheduled tasks - is among the most important things
    recordable on a server.

    The item is worth reading as one of three: account management, service
    management and this subcategory. They are three roads to making access last, and
    covering all three is the condition for the question "how does he keep getting
    back in" to have an answer.

    Events about objects of communication between processes are an addition in this
    subcategory, not its substance. Not much should be expected of them on a typical
    machine.
