id: win2016-print-rpc-listener-protocols-tcp

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Połączenia przychodzące podsystemu druku tylko przez gniazda sieciowe
    en: Incoming connections of the printing subsystem over network sockets only
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Podsystem druku przyjmuje polecenia z sieci dwiema drogami: przez
    nazwany potok i przez gniazdo sieciowe. Ustawienie zostawia wyłącznie
    tę drugą.

    Różnica nie polega na wydajności, tylko na tym, czym te drogi są dla
    reszty systemu.

    Nazwany potok jest udostępnieniem plikowym. Polecenie do bufora wydruku
    idzie wtedy tym samym kanałem co dostęp do plików i na tym samym porcie.
    Znaczy to trzy rzeczy naraz: podsystem druku jest osiągalny wszędzie,
    gdzie osiągalne jest udostępnianie plików; reguła zapory rozróżniająca
    te dwie rzeczy jest niewykonalna; a połączenie do bufora wydruku
    wygląda w dzienniku jak zwykły dostęp do plików.

    Ostatnia z tych rzeczy waży najwięcej. Seria luk w buforze wydruku
    z ostatnich lat opierała się właśnie na tym, że polecenie docierało
    kanałem, którego nikt nie kojarzył z wydrukiem.

    Gniazdo sieciowe jest drogą osobną. Widać ją, da się ją zamknąć zaporą
    i da się ją odróżnić w dzienniku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    bufora wydruku wszędzie tam, gdzie osiągalne jest udostępnianie plików,
    nieodróżnialną w dzienniku od zwykłego dostępu do plików.
  en: |
    The printing subsystem takes commands from the network by two roads: through a
    named pipe and through a network socket. The setting leaves only the second.

    The difference lies not in speed but in what those roads are to the rest of the
    system.

    A named pipe is a file share. A command to the print spooler then goes by the
    same channel as access to files and on the same port. That means three things at
    once: the printing subsystem is reachable wherever file sharing is reachable; a
    firewall rule telling the two apart cannot be made; and a connection to the
    print spooler looks in a log like ordinary access to files.

    The last of those weighs most. The run of gaps in the print spooler over recent
    years rested on just that - the command arriving by a channel nobody associated
    with printing.

    A network socket is a road of its own. It can be seen, it can be shut with a
    firewall and it can be told apart in a log.

    What an attacker gains while the item goes unmet: a road to the print spooler
    wherever file sharing is reachable, indistinguishable in a log from ordinary
    access to files.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana dotyczy tego, czym
    maszyny dobijają się do tej, a nie tego, co ona robi u siebie.

    Jeżeli ta maszyna udostępnia kolejki wydruku, każda maszyna łącząca się
    z nimi przez nazwany potok straci połączenie. Odpowiedź, czy tak się
    łączy, zależy od wersji systemu po drugiej stronie i od tego, jak
    drukarka została dodana — a to znaczy, że sprawdzenia nie da się zrobić
    zza biurka.

    Zmiana wymaga zatrzymania usługi wydruku, więc wszystkie zadania
    w kolejce zostaną przerwane. Na serwerze wydruku obsługującym wiele
    stanowisk jest to okno serwisowe, nie zmiana wykonywana w środku dnia.

    Rzecz trzecia dotyczy zapory. Po wdrożeniu połączenia do bufora wydruku
    idą osobnym portem, którego reguły zapory mogą nie dopuszczać. Wdrożenie
    bez sprawdzenia zapory zabierze wydruk wszystkim, choć sam podsystem
    działa prawidłowo.

    Czego to nie psuje: drukowania lokalnego, instalowania sterowników,
    dostępu do plików, usług niezwiązanych z wydrukiem.

    Wymaga zatrzymania usługi wydruku; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", the change concerning by what machines
    reach this one rather than what it does at its own end.

    If this machine shares print queues, every machine connecting to them through a
    named pipe will lose its connection. Whether it connects so depends on the
    system version at the other end and on how the printer was added - which means
    the check cannot be made from behind a desk.

    The change calls for the print service to be stopped, so every job in the queue
    will be broken off. On a print server serving many positions that is a
    maintenance window rather than a change made in the middle of the day.

    The third thing concerns the firewall. After the rollout connections to the
    print spooler go by a port of their own, which the firewall rules may not let
    through. A rollout without checking the firewall will take printing away from
    everybody, though the subsystem itself works properly.

    What this does not break: local printing, the installing of drivers, access to
    files, or services unrelated to printing.

    Calls for the print service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - Maszyny łączące się z udostępnioną tu kolejką przez nazwany potok tracą połączenie, a odpowiedź, które tak się łączą, wymaga sprawdzenia na miejscu
      - Zatrzymanie usługi wydruku przerywa wszystkie zadania w kolejce, więc na serwerze wydruku potrzebne jest okno serwisowe
      - Połączenia idą po wdrożeniu osobnym portem i reguły zapory mogą ich nie dopuszczać, choć sam podsystem działa prawidłowo
      - Drukowanie lokalne, instalowanie sterowników i dostęp do plików pozostają bez zmian
    en:
      - Machines connecting to a queue shared here through a named pipe lose their connection, and which of them connect so has to be checked on site
      - Stopping the print service breaks off every job in the queue, so a print server calls for a maintenance window
      - Connections go after the rollout by a port of their own and firewall rules may not let them through, though the subsystem itself works properly
      - Local printing, the installing of drivers and access to files stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna udostępnia kolejki starszym stanowiskom i nie ustalono, którą drogą się one łączą
      - Reguły zapory między tą maszyną a jej klientami dopuszczają wyłącznie port udostępniania plików
      - Nie da się wyznaczyć okna serwisowego na zatrzymanie usługi wydruku
    en:
      - The machine shares queues with older positions and it has not been established by which road they connect
      - The firewall rules between this machine and its clients let through only the file sharing port
      - No maintenance window can be set for stopping the print service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three means named pipes, five network sockets, seven both at once.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcProtocols'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'RpcProtocols'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Five means network sockets alone. Machines reaching this queue through a
    # named pipe will have to reach it another way after the change.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcProtocols' -Value 5 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-print-spooler-service

notes:
  pl: |
    Punkt jest pierwszym z czterech dotyczących dróg sieciowych podsystemu
    druku i jedynym w całym bloku o wydruku, który wymaga świadomego
    wdrożenia obok wyłączenia usługi. Powód jest ten sam w obu wypadkach:
    skutek wykracza poza tę maszynę.

    Cztery reguły o drogach sieciowych dzielą się na dwie pary według
    kierunku. Ta i następna dotyczą połączeń przychodzących — czym można
    dobić się tutaj. Dwie ostatnie dotyczą połączeń wychodzących — czym ta
    maszyna dobija się do innych.

    Wpis wymaga na tym wydaniu systemu aktualizacji z drugiej połowy
    2021 roku. Bez niej wartość zostanie zapisana i raport pokaże zgodność,
    a podsystem druku jej nie odczyta. Jest to jedyne miejsce w tym bloku,
    gdzie zgodność w raporcie może wyprzedzać zgodność w działaniu, i warto
    to powiedzieć przy wdrożeniu.
  en: |
    The item is the first of four concerning the printing subsystem's network roads
    and the only one in the whole printing block besides switching the service off
    that calls for a planned rollout. The reason is the same in both cases: the
    consequence reaches beyond this machine.

    The four rules about network roads fall into two pairs by direction. This one
    and the next concern incoming connections - by what one can reach this machine.
    The last two concern outgoing connections - by what this machine reaches others.

    On this release of the system the entry calls for an update from the second half
    of 2021. Without it the value will be written and the report will show
    compliance, and the printing subsystem will not read it. It is the one place in
    this block where compliance in the report can run ahead of compliance in
    operation, and that is worth saying at the rollout.
