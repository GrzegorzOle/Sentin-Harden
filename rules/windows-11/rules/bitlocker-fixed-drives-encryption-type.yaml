id: win11-bitlocker-fixed-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Szyfrowanie całego dysku stałego z danymi wymuszone
    en: Full encryption of the fixed data drive enforced
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, ile dysku stałego z danymi zostanie zaszyfrowane
    przy zakładaniu ochrony: cały nośnik czy wyłącznie miejsce zajęte w danej
    chwili.

    Przy dysku z danymi waga tej różnicy jest jeszcze większa niż przy dysku
    systemowym, i warto powiedzieć dlaczego. Dysk systemowy zawiera przede
    wszystkim pliki systemu; dysk z danymi zawiera to, co powstało w pracy.
    Są to dokumenty, wyciągi, bazy, pliki robocze — usuwane i tworzone
    codziennie, a więc zostawiające w obszarze wolnym ślad tym obfitszy, im
    dłużej maszyna pracuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    zawartości tego obszaru bez żadnego hasła i bez klucza. Wystarczy
    wymontować nośnik i odczytać go jak zwykły dysk. Odzyskanie z obszaru
    wolnego całych plików jest przy tym czynnością rutynową, a nie zabiegiem
    wymagającym środków specjalnych.

    Szczególnie dotkliwy jest przypadek dysku, na którym ochronę założono po
    okresie pracy bez niej. Cała wcześniejsza zawartość — w tym pliki, które
    dawno usunięto — zostaje wtedy w postaci jawnej, a raport pokazuje dysk
    jako chroniony.
  en: |
    The setting settles how much of a fixed data drive is encrypted when protection is
    set up: the whole medium, or only the space used at the moment.

    With a data disk the weight of that difference is greater still than with the
    operating system drive, and it is worth saying why. The operating system drive holds
    chiefly the system's files; a data disk holds what work has produced. These are
    documents, statements, databases, working files - deleted and made daily, and so
    leaving in the free area a trace the richer the longer the machine works.

    What an attacker gains while the item goes unmet: access to the contents of that area
    with no password and no key. It is enough to take the medium out and read it like an
    ordinary disk. Recovering whole files from a free area is, at that, routine work
    rather than a feat taking special means.

    Especially severe is the case of a disk where protection was set up after a period of
    work without it. All the earlier contents - including files long since deleted - then
    stay in the clear, while the report shows the disk as protected.

disruption_description:
  pl: |
    Sprawdzenia wymaga to samo, co przy dysku systemowym, z jedną różnicą na
    korzyść: dysk z danymi bywa mniejszy i szyfruje się krócej, ale bywa też
    znacznie większy, jeżeli służy jako składnica.

    Ustawienie nie zmienia niczego na dyskach już zaszyfrowanych. Dysk
    zaszyfrowany wcześniej w trybie oszczędnym pozostaje w tym trybie do czasu,
    aż ochrona zostanie zdjęta i założona od nowa.

    Przy dyskach dużych warto policzyć czas przed wdrożeniem. Szyfrowanie
    nośnika o pojemności kilku terabajtów, w większości pustego, potrafi zająć
    dobę i przez ten czas obciąża maszynę zapisem. Na stanowisku, na którym
    dysk z danymi jest intensywnie używany, odczuwalne bywa spowolnienie pracy.

    Proces da się wstrzymać i wznowić, więc nie musi się odbyć jednym ciągiem.
    Warto to wiedzieć, bo pozwala rozłożyć go na kilka wieczorów zamiast
    blokować cały dzień.

    Dostęp do danych w trakcie szyfrowania działa normalnie. Po zakończeniu
    praca nie zmienia się w żaden sposób.
  en: |
    The same needs checking as with the operating system drive, with one difference in
    its favour: a data disk is sometimes smaller and encrypts faster, but is sometimes
    much larger, where it serves as a store.

    The setting changes nothing on disks already encrypted. A disk encrypted earlier in
    the sparing mode stays in that mode until protection is removed and set up afresh.

    With large disks the time is worth reckoning before a rollout. Encrypting a medium of
    several terabytes, mostly empty, can take a day, and during that time it loads the
    machine with writing. At a station where the data disk is heavily used, a slowing of
    work is sometimes felt.

    The process can be held and resumed, so it need not happen in one stretch. That is
    worth knowing, since it allows the work to be spread over several evenings rather
    than blocking a whole day.

    Access to the data during encryption works normally. Once it has finished, work does
    not change in any way.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Pierwsze szyfrowanie dysku z danymi trwa dłużej i obciąża maszynę zapisem
      - Na dużym nośniku proces potrafi zająć dobę i spowolnić pracę na stanowisku
      - Dyski zaszyfrowane wcześniej w trybie oszczędnym pozostają w tym trybie
      - Dostęp do danych w trakcie szyfrowania i po jego zakończeniu działa normalnie
    en:
      - The first encryption of a data disk takes longer and loads the machine with writing
      - On a large medium the process can take a day and slow work at the station
      - Disks encrypted earlier in the sparing mode stay in that mode
      - Access to the data during encryption and after it works normally
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dysk z danymi jest nośnikiem o dużej pojemności, a okno wdrożenia jest krótkie
      - Nośnik jest u kresu trwałości i pełny zapis jest ryzykiem większym niż zysk
    en:
      - The data disk is a medium of great capacity and the rollout window is short
      - The medium is at the end of its life and writing it whole is a greater risk than the gain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: FULL
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'FDVEncryptionType' -ErrorAction SilentlyContinue).'FDVEncryptionType'
    [pscustomobject]@{
      path        = $path
      name        = 'FDVEncryptionType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Sprawdzenie rozróżnia trzy stany niezgodne, tak samo jak reguła dotycząca
    dysku systemowego: tryb oszczędny ustawiony świadomie, wybór pozostawiony
    użytkownikowi i brak ustawienia.

    Ustawienie działa wyłącznie przy zakładaniu ochrony i nie przeszyfruje
    dysku już chronionego.

    Na maszynie bez drugiego dysku reguła nie ma czego dotyczyć w praktyce,
    ale warto ją i tak wdrożyć: dysk stały bywa dokładany później, a zasada
    ustawiona wcześniej obejmie go od razu. Jest to przypadek, w którym wynik
    zgodny nie oznacza żadnej zmiany na maszynie, tylko przygotowanie na
    przyszłość.
  en: |
    The check tells three non-compliant states apart, just as the rule about the
    operating system drive does: the sparing mode set deliberately, the choice left to
    the user, and no setting at all.

    The setting works only when protection is being set up and will not re-encrypt a disk
    already protected.

    On a machine with no second disk the rule has in practice nothing to concern, but it
    is worth applying all the same: a fixed disk is sometimes added later, and a policy
    set beforehand will cover it at once. It is a case where a compliant result means no
    change on the machine at all, only readiness for the future.
