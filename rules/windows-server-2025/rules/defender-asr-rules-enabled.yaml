id: win2025-defender-asr-rules-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Reguły ograniczania powierzchni ataku włączone
    en: Attack surface reduction rules enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza cały mechanizm ograniczania powierzchni ataku. Bez
    niego poszczególne reguły z tej grupy są zapisane, ale bezczynne —
    stoją w konfiguracji i nie robią nic.

    Warto to powiedzieć na wstępie, bo zmienia sposób czytania reszty
    grupy. Kilkanaście punktów opisujących po jednej blokadzie ma sens
    dopiero wtedy, gdy ten jeden jest spełniony. Raport, w którym
    wszystkie reguły szczegółowe są zielone, a ten czerwony, opisuje
    maszynę bez żadnej z tych blokad.

    Mechanizm sam w sobie nie broni przed konkretnym atakiem. Zabiera
    natomiast napastnikowi wzorce zachowań, na których opiera się
    większość dzisiejszych włamań: dokument uruchamiający program,
    skrypt pobierający plik wykonywalny, proces sięgający po
    poświadczenia z pamięci. Są to rzeczy, których legalne
    oprogramowanie prawie nie robi, a narzędzia napastnika robią stale.

    Na serwerze rachunek wygląda inaczej niż na stanowisku i to jest
    treść portu tej reguły. Serwer uruchamia mniej rzeczy, ale każda
    uruchomiona ma większe uprawnienia i dłuższy zasięg. Ograniczenie
    wzorców zachowań działa tu lepiej właśnie dlatego, że zbiór
    zachowań prawidłowych jest węższy — a ten sam fakt sprawia, że
    trafienie w coś prawidłowego jest bardziej dotkliwe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: swobodę
    korzystania z całej rodziny wzorców zachowań, które ten mechanizm
    zamyka, niezależnie od tego, ile reguł szczegółowych zapisano
    w konfiguracji.
  en: |
    The item switches on the whole mechanism of the narrowing of the surface of attack. Without it
    the several rules of this group are written but idle - they stand in the setup and do nothing.

    It is worth saying at the outset, it altering how the rest of the group is read. A dozen and
    more items setting forth one blocking each has sense only where this one is met. A report
    wherein all the rules in detail are green and this one red sets forth a machine with none of
    those blockings.

    The mechanism of itself is no guard against any one attack. It takes from the attacker instead
    the patterns of behaviour whereupon most of today's breakings-in rest - a document that runs a
    program, a script that fetches a file to be carried out, a process that reaches for credentials
    out of memory. They are things that lawful software all but never does and the attacker's tools
    do always.

    On a server the reckoning looks otherwise than at a station and that is the substance of this
    rule's porting. A server runs fewer things, but each thing run has greater rights and a longer
    reach. The bounding of patterns of behaviour works here the better just because the gathering
    of right behaviours is narrower - and that same fact makes a striking of something right the
    sorer.

    What an attacker gains while the item goes unmet: the freedom of the whole kin of patterns of
    behaviour this mechanism shuts, however many rules in detail were written into the setup.

disruption_description:
  pl: |
    Zmiana włącza mechanizm, a nie pojedynczą blokadę, więc jej skutek
    jest sumą skutków wszystkich reguł szczegółowych zapisanych na tej
    maszynie. Zanim ją zastosujesz, przejrzyj, co tam stoi — bo dopiero
    teraz to zadziała.

    Na serwerze do sprawdzenia są trzy rzeczy i warto je nazwać.

    Pierwsza to oprogramowanie wdrażające. Systemy dystrybucji
    oprogramowania działają dokładnie tak, jak wygląda atak:
    uruchamiają skrypt, ten pobiera plik i go wykonuje. Kilka reguł
    z tej grupy trafia w ten wzorzec.

    Druga to agenty — monitorowania, kopii zapasowych, inwentaryzacji.
    Sięgają one w miejsca, w których zwykły program nie ma czego
    szukać, i przez to bywają odróżniane od narzędzi napastnika
    wyłącznie podpisem.

    Trzecia to zadania. Na serwerze rzecz zablokowana nie objawia się
    komunikatem na ekranie, bo nie ma ekranu. Objawia się zadaniem,
    które przestało kończyć się powodzeniem, i zapisem w dzienniku,
    który ktoś musi przeczytać.

    Dlatego wdrożenie ma sens tylko wtedy, gdy ktoś potem patrzy
    w dziennik mechanizmu. Bez tego różnica między maszyną
    zabezpieczoną a zepsutą pokaże się dopiero przy pierwszej awarii.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienia
    z tej grupy są zapisywane, ale bezczynne. Audyt zgłasza wtedy stan
    „nie dotyczy", a nie niespełnienie — bo pytanie w tej postaci nie
    ma tu sensu.
  en: |
    The change switches on the mechanism and not a single blocking, so its effect is the sum of the
    effects of all the rules in detail written on this machine. Before applying it, look through
    what stands there - for only now will it work.

    On a server three things are to be checked and worth naming.

    The first is the software of rolling out. Systems of the dealing out of software work just as
    an attack looks - they run a script, it fetches a file and carries it out. Several rules of
    this group strike that pattern.

    The second is agents - of watching, of backups, of taking stock. They reach into places wherein
    an ordinary program has nothing to seek, and are by that told from an attacker's tools by their
    signing alone.

    The third is tasks. On a server a thing blocked shows itself by no word on a screen, there
    being no screen. It shows itself by a task that has stopped ending in success, and by an entry
    in a log somebody must read.

    Therefore the rollout has sense only where somebody afterwards looks into the mechanism's log.
    Without that the difference between a machine guarded and a machine broken will show only at
    the first fault.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the settings of this group are
    written but idle. The audit then reports the state "does not apply" and not a failing to meet -
    the question in this shape having here no sense.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Skutek jest sumą skutków wszystkich reguł szczegółowych zapisanych na tej maszynie
      - Systemy dystrybucji oprogramowania działają wzorcem, w który część tych reguł trafia
      - Agenty monitorowania i kopii zapasowych bywają odróżniane od narzędzi napastnika wyłącznie podpisem
      - Na serwerze rzecz zablokowana objawia się zadaniem bez powodzenia, a nie komunikatem na ekranie
      - Przy produkcie ochronnym innego wytwórcy ustawienia są zapisywane, ale bezczynne
    en:
      - The effect is the sum of the effects of all the rules in detail written on this machine
      - Systems of the dealing out of software work by a pattern that some of these rules strike
      - Agents of watching and of backups are told from an attacker's tools by their signing alone
      - On a server a thing blocked shows itself by a task without success and not by a word on a screen
      - Where a guarding product of another maker rules, the settings are written but idle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przejrzano, jakie reguły szczegółowe są już zapisane na tej maszynie
      - Nikt nie będzie czytał dziennika mechanizmu po zmianie, więc trafienia zostaną niezauważone
    en:
      - It was not looked through what rules in detail are already written on this machine
      - Nobody will read the mechanism's log after the change, so strikings will go unmarked
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
      $name = 'ExploitGuard_ASR_Rules'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
    $name = 'ExploitGuard_ASR_Rules'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This switches on the whole mechanism, so every rule in detail already
    # written on the machine begins working at the same moment.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ExploitGuard_ASR_Rules' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction

notes:
  pl: |
    Punkt jest wyłącznikiem całej grupy. Raport, w którym wszystkie
    reguły szczegółowe są zielone, a ten czerwony, opisuje maszynę bez
    żadnej z tych blokad. Warto o tym pamiętać przy czytaniu raportu.

    Na serwerze mechanizm działa lepiej niż na stanowisku, bo zbiór
    zachowań prawidłowych jest węższy — i z tego samego powodu trafienie
    w coś prawidłowego jest bardziej dotkliwe.

    Przy produkcie ochronnym innego wytwórcy audyt zgłasza „nie
    dotyczy", a nie niespełnienie. Ustawienia są wtedy zapisywane, ale
    bezczynne, więc zgłaszanie ich jako braku byłoby wprowadzaniem
    w błąd.
  en: |
    The item is the switch of the whole group. A report wherein all the rules in detail are green
    and this one red sets forth a machine with none of those blockings. It is worth keeping in mind
    at the reading of a report.

    On a server the mechanism works better than at a station, the gathering of right behaviours
    being narrower - and for that same ground a striking of something right is the sorer.

    Where a guarding product of another maker is in charge, the audit reports "does not apply" and
    not a failing to meet. The settings are then written but idle, so to report them as wanting
    would be a leading astray.
