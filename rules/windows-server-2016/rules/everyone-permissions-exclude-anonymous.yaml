id: win2016-everyone-permissions-exclude-anonymous

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uprawnienia nadane wszystkim nie obejmują połączeń anonimowych
    en: Rights granted to everyone do not take in anonymous connections
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy uprawnienie nadane grupie obejmującej wszystkich
    przysługuje również połączeniu, które się nie uwierzytelniło.

    Sedno tej reguły leży w rozumieniu słowa „wszyscy". Administrator nadający
    uprawnienie tej grupie ma na myśli wszystkich pracowników — każdego, kto ma
    konto i się zalogował. Nie ma na myśli kogoś, kto konta nie ma. Ale gdy to
    ustawienie jest włączone, system czyta „wszyscy" dosłownie i wpuszcza także
    połączenie bez tożsamości.

    Skutek jest taki, że uprawnienia na całej maszynie znaczą coś innego, niż
    zakładał ten, kto je nadawał. Nie trzeba przy tym żadnego błędu w
    konfiguracji — wystarczy jeden udział, jeden katalog albo jeden klucz
    rejestru z uprawnieniem dla wszystkich, a takie miejsca są na każdej
    maszynie, bo część z nich zakłada sam system.

    Jest to reguła o cichym skutku, bo nie widać jej w żadnym oknie uprawnień.
    Okno pokazuje to samo „wszyscy" niezależnie od tego, jak system to słowo
    czyta. Różnica ujawnia się dopiero przy odpytaniu maszyny z zewnątrz.

    W roczniku 2016 wartość bywa odziedziczona po aktualizacji ze starszych
    systemów, gdzie takie rozumienie było domyślne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wszystkie
    uprawnienia nadane na tej maszynie wszystkim — bez konta, bez logowania
    i bez śladu, który dałoby się powiązać z osobą.
  en: |
    The setting decides whether a right granted to the group taking in everybody
    belongs also to a connection that has not authenticated.

    The heart of this rule lies in the reading of the word "everyone". An
    administrator granting a right to that group means every employee - everybody
    who has an account and has signed in. They do not mean somebody without an
    account. But when this setting is on, the system reads "everyone" literally and
    lets in a connection without an identity too.

    The effect is that rights across the whole machine mean something other than
    what whoever granted them assumed. No error of configuration is needed for this
    - one share, one directory or one registry key with a right for everyone
    suffices, and such places are on every machine, since the system itself creates
    some of them.

    It is a rule of quiet effect, because it shows in no permissions window. The
    window shows the same "everyone" whatever way the system reads the word. The
    difference comes to light only when the machine is queried from outside.

    In the 2016 vintage the value is at times inherited from an upgrade out of older
    systems, where that reading was the default.

    What an attacker gains while the item goes unmet: every right granted on this
    machine to everyone - with no account, no sign-in, and no trace that could be
    tied to a person.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Zmiana zawęża znaczenie uprawnienia nadanego
    wszystkim, więc wszystko, co z niego korzystało bez konta, przestaje mieć
    dostęp. Pytanie brzmi: co z niego korzystało.

    Odpowiedź zwykle sprowadza się do urządzeń. Drukarka sieciowa pobierająca
    sterownik, skaner odkładający plik, urządzenie pomiarowe czytające
    konfigurację — sprzęt, który nie loguje się, bo nie ma czym, a działa,
    bo udział albo katalog ma uprawnienie dla wszystkich.

    Objaw jest przy tym mylący i to jest najważniejsza rzecz w tej regule.
    Urządzenie nie zgłasza braku uprawnień — zgłasza brak zasobu albo milczy.
    Powiązanie tego z ustawieniem po stronie serwera bywa trudne, zwłaszcza
    gdy między zmianą a objawem minął tydzień.

    Drugi przypadek to serwery wydruku i systemy archiwizujące, które sięgają
    do udziałów bez podawania konta, bo tak je kiedyś skonfigurowano i nikt
    tego nie weryfikował.

    Sprawdzić trzeba jedno: czy do tej maszyny sięga coś, co nie podaje konta.
    Lista otwartych sesji sieciowych odpowiada na to w minutę.

    Czego to nie psuje: dostępu po uwierzytelnieniu, uprawnień grup domenowych,
    zasad grupy ani pracy usług lokalnych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". The change narrows the meaning of a right granted
    to everyone, so everything that made use of it without an account loses access.
    The question is what made use of it.

    The answer usually comes down to devices. A network printer fetching a driver, a
    scanner depositing a file, a measuring device reading a configuration -
    equipment that does not sign in, having nothing to sign in with, and that works
    because a share or directory carries a right for everyone.

    The symptom is misleading, and that is the most important thing in this rule.
    The device does not report a want of rights - it reports a want of the resource,
    or says nothing. Tying that to a setting on the server's side can be hard, the
    more so when a week has passed between the change and the symptom.

    The second case is print servers and archiving systems that reach shares without
    giving an account, because they were once configured so and nobody has verified
    it since.

    One thing has to be checked: whether anything reaches this machine without
    giving an account. The list of open network sessions answers that in a minute.

    What this does not break: access after authentication, the rights of domain
    groups, group policy, or the working of local services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Drukarka, skaner albo urządzenie pomiarowe sięgające do zasobu bez konta traci do niego dostęp
      - Objaw jest mylący — urządzenie zgłasza brak zasobu albo milczy, zamiast zgłosić brak uprawnień
      - Serwer wydruku albo system archiwizujący sięgający do udziałów bez podania konta przestaje je widzieć
      - Dostęp po uwierzytelnieniu, uprawnienia grup domenowych i praca usług lokalnych pozostają bez zmian
    en:
      - A printer, scanner or measuring device reaching a resource without an account loses access to it
      - The symptom is misleading - the device reports a want of the resource or says nothing, rather than a want of rights
      - A print server or archiving system reaching shares without giving an account stops seeing them
      - Access after authentication, the rights of domain groups and the working of local services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie sprawdzono listy otwartych sesji sieciowych i nie wiadomo, czy coś sięga do tej maszyny bez podania konta
      - Do zasobów na tej maszynie sięgają urządzenia, które nie mają czym się uwierzytelnić
    en:
      - The list of open network sessions has not been checked and it is not known whether anything reaches this machine without giving an account
      - Resources on this machine are reached by devices that have nothing to authenticate with
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'EveryoneIncludesAnonymous'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'EveryoneIncludesAnonymous'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From here on "everyone" means everybody with an account, which is what whoever
    # granted the right had in mind in the first place.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EveryoneIncludesAnonymous' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-let-everyone-permissions-apply-to-anonymous-users

notes:
  pl: |
    Reguła nie zmienia ani jednego uprawnienia na dysku, w rejestrze czy na
    udziale. Zmienia sposób, w jaki system czyta uprawnienie już nadane.
    Warto to w aplikacji powiedzieć wprost, bo pierwsze skojarzenie prowadzi do
    przeglądania uprawnień, a tam nic się nie zmieni.

    Punkt należy do bloku czterech reguł o dostępie bez uwierzytelnienia
    i osobno znaczy mniej niż razem z pozostałymi. Tamte zamykają konkretne
    drzwi; ta rozstrzyga, kim jest ktoś, kto już wszedł.

    Wynik zgodny nie jest dowodem, że na maszynie nie ma nadmiarowych
    uprawnień dla wszystkich. Dowodzi tylko, że nie przysługują one bez konta.
    Przegląd samych uprawnień to osobna praca i aplikacja nie powinna udawać,
    że ta reguła ją zastępuje.
  en: |
    The rule changes not one right on disk, in the registry or on a share. It
    changes the way the system reads a right already granted. Worth saying outright
    in the application, since the first association leads to reviewing rights, and
    nothing will have changed there.

    The item belongs to a block of four rules on access without authentication and
    apart means less than together with the others. Those shut particular doors;
    this one settles who somebody who is already inside is.

    A compliant result is no proof that there are no excessive rights for everyone
    on the machine. It proves only that they do not belong to anybody without an
    account. Reviewing the rights themselves is separate work and the application
    should not pretend this rule stands in for it.
