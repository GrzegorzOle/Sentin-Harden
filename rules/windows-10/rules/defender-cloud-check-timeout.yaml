id: win10-defender-cloud-check-timeout

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MpEngine
  title:
    pl: Wydłużony czas oczekiwania na odpowiedź usługi w chmurze
    en: Extended wait for the cloud service response
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wydłuża czas, przez który ochrona czeka na odpowiedź usługi
    producenta, zanim przepuści plik nieznany.

    Punkt ten jest dopełnieniem blokowania przy pierwszym napotkaniu
    i bez niego działa ono tylko częściowo. Domyślne oczekiwanie mieści
    odpowiedź prostą — taką, na którą usługa ma gotową ocenę. Odpowiedź
    wymagająca głębszej analizy przychodzi później i trafia w maszynę,
    która już przestała czekać.

    Skutkiem jest cicha porażka mechanizmu. Plik zostaje przepuszczony nie
    dlatego, że usługa uznała go za bezpieczny, lecz dlatego, że nie
    zdążyła odpowiedzieć. Różnicy tej nie widać ani w raporcie, ani
    w dzienniku.

    Odnotowuję, że wartość jest wyrażona w sekundach i dokłada się do
    oczekiwania domyślnego, a pięćdziesiąt jest wartością najwyższą,
    jaką ustawienie przyjmuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: plik
    przepuszczony przez wyczerpanie czasu, zanim przyjdzie odpowiedź, która
    by go zatrzymała.
  en: |
    The setting draws out the time the protection waits for the maker's service to answer before it lets an
    unknown file through.

    This item is the rounding out of blocking at first sight, and without it that works but in part. The default
    wait holds a simple answer - one for which the service has a weighing ready. An answer calling for a deeper
    looking into comes later and strikes a machine that has already stopped waiting.

    The consequence is a quiet failing of the mechanism. The file is let through not because the service held it
    safe but because it was not in time to answer. That difference shows neither in the report nor in the log.

    I set down that the value is given in seconds and is added to the default wait, fifty being the highest the
    setting takes.

    What an attacker gains while the item goes unmet: a file let through by the running out of time, before the
    answer that would stop it comes.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wydłużenie dotyczy wyłącznie plików nieznanych i pobranych. Programy
    zainstalowane, pliki podpisane i wszystko, co maszyna już widziała,
    przechodzą bez czekania.

    Odnotowuję, że wartość nie jest czasem oczekiwania, tylko czasem
    maksymalnym. Odpowiedź przychodząca po sekundzie kończy czekanie po
    sekundzie; wydłużenie ma znaczenie wyłącznie tam, gdzie odpowiedź
    i tak by nie zdążyła.

    Rzeczą, którą użytkownik może zobaczyć, jest dłuższe zatrzymanie przy
    uruchomieniu pobranego programu — ale zatrzymanie to istnieje
    niezależnie od tej reguły i opisuje je punkt o blokowaniu przy
    pierwszym napotkaniu.

    Na maszynie odciętej od sieci zewnętrznej zmiana wydłuża oczekiwanie
    do pełnego limitu przy każdym pliku nieznanym. Jest to jedyny układ,
    w którym koszt jest wymierny.

    Czego to nie psuje: uruchamiania programów zainstalowanych, otwierania
    dokumentów, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "no disruption".

    The drawing out touches unknown and downloaded files alone. Installed programs, signed files and everything
    the machine has already seen go through without a wait.

    I set down that the value is not a time of waiting but a greatest time. An answer coming after a second ends
    the waiting after a second; the drawing out matters only where the answer would not be in time anyway.

    The thing a user may see is a longer halt at the starting of a downloaded program - but that halt is there
    whatever this rule, and the item about blocking at first sight describes it.

    Upon a machine cut off from the outside network the change draws the wait out to the full bound at every
    unknown file. It is the one arrangement in which the cost is measurable.

    What this does not break: the starting of installed programs, the opening of documents, logging on, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Maszyna odcięta od sieci zewnętrznej czeka do pełnego limitu przy każdym pliku nieznanym
      - Zatrzymanie przy uruchomieniu pobranego programu trwa dłużej, ale samo zatrzymanie opisuje inny punkt
      - Wartość jest czasem maksymalnym, a nie czasem oczekiwania, więc szybka odpowiedź kończy czekanie od razu
      - Wydłużenie dotyczy wyłącznie plików nieznanych i pobranych, a nie programów zainstalowanych
      - Uruchamianie programów zainstalowanych, otwieranie dokumentów, logowanie i drukowanie pozostają bez zmian
    en:
      - A machine cut off from the outside network waits out the full bound at every unknown file
      - The halt at the starting of a downloaded program lasts longer, though another item describes the halt itself
      - The value is a greatest time and not a time of waiting, so a quick answer ends the wait at once
      - The drawing out touches unknown and downloaded files alone, not installed programs
      - The starting of installed programs, the opening of documents, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje w sieci odciętej od zewnątrz i wydłużenie daje wyłącznie dłuższe czekanie bez odpowiedzi
    en:
      - The machine works in a network cut off from outside and the drawing out gives only a longer wait with no answer
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        [string][int](Get-MpPreference -ErrorAction Stop).CloudExtendedTimeout
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '50'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    $name = 'MpBafsExtendedTimeout'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is in seconds and is added to the default wait. Fifty is the highest
    # the setting takes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MpBafsExtendedTimeout' -Value 50 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-block-at-first-sight-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest sama w sobie drobiazgiem i nabiera znaczenia wyłącznie
    przy włączonym blokowaniu przy pierwszym napotkaniu. Warto, żeby
    aplikacja pokazywała je razem, bo osobno ta wygląda na strojenie bez
    treści.

    Argument wart postawienia wprost dotyczy tego, co się dzieje po
    wyczerpaniu czasu. Plik zostaje przepuszczony i nic tego nie odnotowuje
    jako niepowodzenia. Mechanizm zachowuje się tak samo jak przy
    odpowiedzi „bezpieczny" — a to jest różnica, której użytkownik nie ma
    skąd poznać.

    Odnotowuję, że wartość wymagana jest najwyższą, jaką ustawienie
    przyjmuje. Nie ma tu więc rozmowy o ostrożniejszym wariancie: albo
    czekamy tyle, ile się da, albo godzimy się na przepuszczanie po
    czasie.
  en: |
    The rule is of itself a trifle and takes on weight only with blocking at first sight switched on. It is well
    that the application show them together, apart this looking like a tuning without substance.

    The argument worth putting outright touches what happens once the time runs out. The file is let through and
    nothing sets that down as a failing. The mechanism behaves just as it does at an answer of "safe" - and that
    is a difference the user has no way of learning.

    I set down that the value called for is the highest the setting takes. There is therefore no conversation
    here about a more cautious variant: either we wait as long as may be, or we agree to the letting through once
    the time is up.
