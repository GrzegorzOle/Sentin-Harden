    i uruchomienie stamtąd nie jest blokowane. To samo obejście ma
    napastnik, więc reguła podnosi koszt ataku i go nie zamyka.
  en: |
    The commonest misunderstanding at this item - it bears on the client of post on this machine
    and not on the post the machine serves. A server of post is by this rule not guarded, and the
    messages passing through it are by it not touched.

    The category is low, a server mostly having no client of post. The worth comes back strongly on
    a terminal server, where people read post on a machine that reaches the goods of the whole
