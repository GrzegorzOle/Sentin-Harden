id: win2025-diagnostic-data-level-limited

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Zakres wysyłanych danych diagnostycznych ograniczony
    en: Scope of diagnostic data sent limited
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza zakres danych diagnostycznych wysyłanych z maszyny do
    producenta. Dopuszczone są dwie najniższe wartości: brak wysyłania
    i zakres podstawowy.

    Kategoria średnia. Dane diagnostyczne nie są kopią plików ani treści
    z tej maszyny i nie chcę sugerować, że są. Są opisem tego, co się na
    niej dzieje: jakie oprogramowanie jest zainstalowane i w jakich
    wersjach, co się zawiesza, jakie sterowniki i urządzenia są obecne,
    jak wygląda konfiguracja sprzętu.

    Na stacji roboczej to jest głównie sprawa prywatności. Na serwerze jest
    to co innego i dlatego trzymam tu kategorię średnią, a nie niską: to
    jest opis powierzchni ataku tej maszyny, przygotowany przez nią samą
    i regularnie wysyłany. Wykaz wersji oprogramowania i sterowników to
    dokładnie ta informacja, od której zaczyna się przygotowanie włamania —
    tylko zwykle trzeba ją zdobywać, a tutaj powstaje sama.

    Nie twierdzę, że ktokolwiek przechwytuje te dane w drodze; idą
    szyfrowanym połączeniem. Twierdzę co innego i to wystarcza za
    uzasadnienie: dokładny opis stanu serwera produkcyjnego opuszcza
    organizację, a organizacja nie ma nad tym opisem kontroli ani wglądu
    w to, co dokładnie wyszło.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — ale powstaje i jest wynoszony zbiór, który komuś
    z dostępem do niego oszczędza całego etapu rozpoznania.
  en: |
    The item limits the scope of diagnostic data sent from the machine to
    the maker. The two lowest values are permitted: nothing sent, and the
    basic scope.

    The category is medium. Diagnostic data is not a copy of files or
    content from this machine, and I do not want to suggest that it is. It
    is a description of what happens on it: what software is installed and
    in what versions, what crashes, what drivers and devices are present,
    what the hardware configuration looks like.

    On a workstation this is mainly a matter of privacy. On a server it is
    something else, and that is why I keep the category medium rather than
    low: it is a description of this machine's attack surface, prepared by
    the machine itself and sent regularly. A list of software and driver
    versions is exactly the information a break-in starts from being
    prepared with - except that it usually has to be obtained, and here it
    writes itself.

    I am not claiming anybody intercepts this data in transit; it travels
    over an encrypted connection. I claim something else, and it is enough
    to stand as the reason: a precise description of a production server's
    state leaves the organisation, and the organisation has neither control
    over that description nor sight of what exactly went out.

    What an attacker gains while the item goes unmet: nothing directly - but
    a collection comes into being and is carried out which, for anybody with
    access to it, saves a whole stage of reconnaissance.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i tu sprawdzenie jest realne, bo
    od tej wartości zależą rzeczy, które z nazwy ustawienia nie wynikają.

    Rzecz pierwsza i najważniejsza: część mechanizmów zarządzania maszynami
    z poziomu chmury producenta — sprawozdania o stanie łatania, wykazy
    zainstalowanego oprogramowania, ostrzeżenia o zgodności — opiera się na
    tym samym strumieniu danych. Ograniczenie go do zera potrafi sprawić,
    że maszyna zniknie z takiego sprawozdania. Nie przestanie działać
    i nie przestanie być łatana — przestanie być widoczna. To jest gorsze
    niż awaria, bo wygląda jak porządek.

    Rzecz druga dotyczy narzędzi ochrony, które przekazują próbki
    i sygnały do chmury producenta. Tam, gdzie takie narzędzie jest
    w użyciu, jego dostawca zwykle wskazuje wymagany zakres danych. Wpisanie
    wartości niższej niż wymagana osłabia narzędzie, na którym stoi obrona
    tej maszyny, w imię ograniczenia, które ma tę maszynę chronić.

    Rzecz trzecia, już drobniejsza: po ograniczeniu zakresu zgłoszenie
    awarii do wsparcia producenta bywa trudniejsze, bo brakuje danych,
    o które wsparcie poprosi w pierwszej kolejności.

    Czego to nie psuje: aktualizacji, ról serwera, usług, pracy ludzi.
    Zmiana jest niewidoczna w codziennej eksploatacji, nie wymaga przerwy
    i cofa się natychmiast.
  en: |
    I keep the class "needs review", and here the review is real, because
    things depend on this value that do not follow from the setting's name.

    The first and most important thing: some mechanisms for managing
    machines from the maker's cloud - patching-state reports, lists of
    installed software, compliance warnings - rest on this same stream of
    data. Trimming it to zero can make the machine vanish from such a
    report. It will not stop working and will not stop being patched - it
    will stop being visible. That is worse than a failure, because it looks
    like good order.

    The second thing concerns protective tools that pass samples and signals
    to the maker's cloud. Where such a tool is in use, its supplier usually
    names the required scope of data. Writing a value lower than required
    weakens the tool this machine's defence rests on, in the name of a limit
    meant to protect that machine.

    The third thing, smaller now: after the scope is trimmed, reporting a
    failure to the maker's support is sometimes harder, because the data
    support asks for first is missing.

    What this does not break: updates, server roles, services, people's
    work. The change is invisible in daily operation, needs no outage, and
    is undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - updates-and-servicing
    - remote-management
  what_breaks:
    pl:
      - Maszyna potrafi zniknąć ze sprawozdań o stanie łatania i z wykazów oprogramowania prowadzonych w chmurze producenta
      - Nie przestaje działać ani być łatana — przestaje być widoczna, a to gorsze niż awaria, bo wygląda jak porządek
      - Narzędzie ochrony przekazujące próbki do chmury producenta bywa osłabione, jeśli wymaga szerszego zakresu danych
      - Zgłoszenie awarii do wsparcia producenta jest trudniejsze, bo brakuje danych, o które wsparcie poprosi najpierw
    en:
      - The machine can vanish from patching-state reports and software lists kept in the maker's cloud
      - It does not stop working or being patched - it stops being visible, which is worse than a failure because it looks like good order
      - A protective tool passing samples to the maker's cloud is sometimes weakened if it requires a wider scope of data
      - Reporting a failure to the maker's support is harder, because the data support asks for first is missing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stan łatania i wykaz oprogramowania tej maszyny są prowadzone w chmurze producenta i opierają się na tym strumieniu danych
      - Na maszynie pracuje narzędzie ochrony, którego dostawca wymaga szerszego zakresu wysyłanych danych
    en:
      - This machine's patching state and software list are kept in the maker's cloud and rest on this stream of data
      - A protective tool runs on the machine whose supplier requires a wider scope of data to be sent
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'AllowTelemetry'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|1)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'AllowTelemetry'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero means nothing is sent. Where the patching state of this machine is
    # tracked in the maker's cloud, or a protective tool passes samples there,
    # check the required scope first - the machine can vanish from a report
    # without stopping working, which looks like good order.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowTelemetry' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Na stacji roboczej to głównie sprawa prywatności. Na serwerze jest to
    opis powierzchni ataku tej maszyny, przygotowany przez nią samą
    i regularnie wysyłany — wykaz wersji oprogramowania i sterowników to
    dokładnie ta informacja, od której zaczyna się przygotowanie włamania.

    Nie twierdzę, że ktokolwiek przechwytuje te dane w drodze. Twierdzę,
    że dokładny opis stanu serwera produkcyjnego opuszcza organizację,
    a organizacja nie ma wglądu w to, co dokładnie wyszło.

    Do sprawdzenia przed zmianą: czy stan łatania tej maszyny nie jest
    prowadzony w chmurze producenta i czy narzędzie ochrony nie wymaga
    szerszego zakresu. Maszyna, która zniknie ze sprawozdania, nie
    przestaje być łatana — przestaje być widoczna, i to wygląda jak
    porządek.
  en: |
    On a workstation this is mainly a matter of privacy. On a server it is a
    description of this machine's attack surface, prepared by the machine
    itself and sent regularly - a list of software and driver versions is
    exactly the information a break-in starts from being prepared with.

    I am not claiming anybody intercepts this data in transit. I claim that
    a precise description of a production server's state leaves the
    organisation, and the organisation has no sight of what exactly went
    out.

    To check before the change: whether this machine's patching state is
    kept in the maker's cloud, and whether a protective tool requires a
    wider scope. A machine that vanishes from a report does not stop being
    patched - it stops being visible, and that looks like good order.
