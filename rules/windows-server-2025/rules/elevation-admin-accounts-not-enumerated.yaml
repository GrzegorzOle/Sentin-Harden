id: win2025-elevation-admin-accounts-not-enumerated

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Konta administratorów nie są wyliczane przy podnoszeniu uprawnień
    en: Administrator accounts not listed when elevating
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt sprawia, że okno proszące o podniesienie uprawnień nie pokazuje
    listy kont administratorów tej maszyny. Zamiast wyboru z listy trzeba
    podać nazwę konta.

    Kategoria wysoka i chcę uzasadnić, dlaczego tak wysoko, skoro reguła
    dotyczy tylko tego, co widać na ekranie.

    Wyliczenie kont zdejmuje z napastnika pierwszą i zwykle najbardziej
    czasochłonną część pracy. Żeby użyć hasła, trzeba wiedzieć, do czego
    je przyłożyć — a nazwy kont administracyjnych rzadko bywają oczywiste.
    Lista podana na ekranie odpowiada na to pytanie bez żadnego wysiłku
    i bez śladu w dziennikach, bo nic nie zostało wykonane.

    Na serwerze rzecz waży więcej z dwóch powodów. Po pierwsze, nazwy kont
    administracyjnych bywają tam informacją samą w sobie: mówią, kto się tą
    maszyną zajmuje, czy istnieje konto dostawcy, czy działa osobne konto
    serwisowe. Po drugie, okno proszące o podniesienie uprawnień pojawia
    się na serwerze rzadko, ale pojawia się w sesji zdalnej albo w konsoli
    poza systemem — czyli tam, gdzie ogląda je ktoś, kto właśnie dostał się
    na maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową listę
    celów, uzyskaną bez wykonywania czegokolwiek, co zostawiłoby ślad.
  en: |
    The item makes the window asking to elevate stop showing the list of
    this machine's administrator accounts. Instead of picking from a list,
    the account name has to be typed.

    The category is high, and I want to justify why so high given that the
    rule concerns only what is on the screen.

    Listing the accounts takes off the attacker's hands the first and
    usually most time-consuming part of the work. To use a password one has
    to know what to apply it to - and the names of administrative accounts
    are seldom obvious. A list on the screen answers that question with no
    effort at all and leaves no trace in any log, because nothing was
    executed.

    On a server this weighs more for two reasons. First, the names of
    administrative accounts are often information in themselves: they say
    who looks after the machine, whether a vendor account exists, whether a
    separate service account is in use. Second, the elevation window
    appears rarely on a server, but when it does it appears in a remote
    session or in an out-of-band console - that is, where it is seen by
    somebody who has just got onto the machine.

    What an attacker gains while the item goes unmet: a ready-made list of
    targets, obtained without executing anything that would leave a trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i powód jest prosty: znika lista, nie znika
    możliwość. Kto zna nazwę konta, poda ją i podniesie uprawnienia tak
    samo jak przedtem. Zmienia się jedna czynność — zamiast kliknąć, trzeba
    napisać.

    Na serwerze i ten drobiazg waży mniej niż na stacji roboczej, bo okno
    proszące o podniesienie uprawnień pojawia się tam rzadko. Praca
    administracyjna na serwerze idzie zwykle w sesji, która już jest
    podniesiona, albo poleceniem uruchomionym w kontekście z odpowiednimi
    prawami.

    Jedyny dający się nazwać skutek dotyczy osoby, która nazwy konta nie
    pamięta i dotąd wybierała je z listy. Na maszynie z jednym kontem
    administracyjnym to nie zdarza się nigdy. Na maszynie z kilkoma —
    zdarza się raz, po czym nazwa zostaje w procedurze.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption" and the reason is simple: the list goes,
    the possibility does not. Whoever knows the account name will type it
    and elevate exactly as before. One action changes - instead of
    clicking, one has to write.

    On a server even that small matter weighs less than on a workstation,
    because the elevation window appears there rarely. Administrative work
    on a server usually goes on in a session that is already elevated, or
    through a command run in a context with the right privileges.

    The one nameable effect concerns a person who does not remember the
    account name and until now picked it from a list. On a machine with a
    single administrative account that never happens. On a machine with
    several, it happens once, after which the name goes into the procedure.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Znika lista kont w oknie podnoszenia uprawnień, ale nie znika możliwość podniesienia
      - Osoba, która nazwy konta nie pamięta, musi ją poznać raz i wpisać zamiast wybierać
      - Na serwerze okno to pojawia się rzadko, bo praca administracyjna idzie w sesji już podniesionej
    en:
      - The list of accounts in the elevation window goes, but the ability to elevate does not
      - Somebody who does not remember the account name has to learn it once and type it instead of picking it
      - On a server that window appears rarely, because administrative work goes on in an already elevated session
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa procedura obsługi opierająca się na wskazaniu konta z listy i nie zapisano nigdzie nazw tych kont
    en:
      - An operating procedure resting on picking the account from a list is in use and those account names are recorded nowhere
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI'
      $name = 'EnumerateAdministrators'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI'
    $name = 'EnumerateAdministrators'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list goes, the ability to elevate does not - the account name has to
    # be typed instead of picked. Worth making sure those names are recorded
    # somewhere other than that window.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnumerateAdministrators' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/user-account-control/user-account-control-overview

notes:
  pl: |
    Wyliczenie kont zdejmuje z napastnika pierwszą i zwykle
    najbardziej czasochłonną część pracy: żeby użyć hasła, trzeba wiedzieć,
    do czego je przyłożyć. Lista na ekranie odpowiada na to bez żadnego
    wysiłku i bez śladu w dziennikach, bo nic nie zostało wykonane.

    Na serwerze nazwy kont administracyjnych są informacją samą w sobie:
    mówią, kto się tą maszyną zajmuje, czy istnieje konto dostawcy, czy
    działa osobne konto serwisowe.

    Okno pojawia się na serwerze rzadko, ale pojawia się w sesji zdalnej
    albo w konsoli poza systemem — czyli tam, gdzie ogląda je ktoś, kto
    właśnie dostał się na maszynę.
  en: |
    Listing the accounts takes off the attacker's hands the first and
    usually most time-consuming part of the work: to use a password one has
    to know what to apply it to. A list on the screen answers that with no
    effort and leaves no trace in any log, because nothing was executed.

    On a server the names of administrative accounts are information in
    themselves: they say who looks after the machine, whether a vendor
    account exists, whether a separate service account is in use.

    The window appears rarely on a server, but when it does it appears in a
    remote session or an out-of-band console - where it is seen by somebody
    who has just got onto the machine.
