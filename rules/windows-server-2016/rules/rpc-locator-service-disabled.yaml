id: win2016-rpc-locator-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa lokalizatora punktów końcowych zdalnego wywołania procedur wyłączona
    en: The locator service for remote procedure call endpoints disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa prowadziła spis nazw, pod którymi programy udostępniały swoje
    punkty końcowe do zdalnego wywoływania procedur, żeby inne programy
    mogły je odnaleźć po nazwie zamiast po adresie.

    Rzecz w tym punkcie polega na tym, że mechanizm ten nie jest już
    obsługiwany. Wywoływanie procedur zdalnych w systemie bieżącym odnajduje
    punkty końcowe zupełnie inną drogą i o tę usługę nie pyta. Usługa
    została w systemie jako pozostałość, uruchamiana ręcznie i najczęściej
    nigdy nie uruchomiona.

    Wartość punktu leży więc nie w zamknięciu drogi ataku, tylko
    w porządku. Usługa, której nikt nie używa i nikt nie rozwija, jest
    w systemie powierzchnią bez uzasadnienia — nie dlatego, że jest znana
    z podatności, ale dlatego, że nikt jej nie sprawdza i nikt nie
    poprawia.

    Kategoria niska opisuje to uczciwie. Nie ma tu zagrożenia, które dałoby
    się nazwać z imienia. Jest natomiast zasada, według której część
    systemu nieużywana powinna być wyłączona, a nie zostawiona w stanie
    gotowości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    składnik, który da się uruchomić, a którego nikt nie obserwuje, bo
    z założenia nie jest używany.
  en: |
    The service kept a register of the names under which programs offered their endpoints
    for the remote calling of procedures, so that other programs might find them by name
    rather than by address.

    The matter at this item is that the mechanism is no longer served. The remote calling
    of procedures in a current system finds endpoints by a wholly different road and does
    not ask after this service. The service stayed in the system as a remainder, set to
    start by hand and most often never started.

    The item's worth therefore lies not in shutting a road of attack but in good order. A
    service nobody uses and nobody develops is in the system a surface with no warrant -
    not because it is known for a weakness, but because nobody checks it and nobody mends
    it.

    The low category describes that honestly. There is here no threat that could be named
    outright. There is, however, a principle by which an unused part of a system should be
    switched off rather than left in readiness.

    What an attacker gains while the item goes unmet: little - a component that can be
    started and that nobody watches, being by assumption unused.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć jest to w tym bloku sprawdzenie
    najlżejsze.

    Usługa nie jest używana przez nic w systemie bieżącym. Zarządzanie
    zdalne, kolejkowanie wydruku, replikacja katalogu i wszystko inne, co
    korzysta ze zdalnego wywoływania procedur, odnajduje punkty końcowe
    inną drogą i tej usługi nie dotyka.

    Sprawdzić warto wyłącznie jedną rzecz: czy na maszynie nie stoi
    aplikacja napisana wtedy, gdy mechanizm ten był w użyciu. Chodzi
    o oprogramowanie sprzed dwóch dekad, zwykle branżowe, czasem
    przeniesione z jeszcze starszego systemu. Jest to przypadek rzadki,
    ale Server 2016 bywa właśnie tą maszyną, na której takie
    oprogramowanie dożywa.

    Objaw w takim przypadku jest jednoznaczny — aplikacja nie odnajduje
    swojego składnika serwerowego i mówi o tym wprost, zwykle nazywając
    usługę po imieniu.

    Poza tym przypadkiem skutek jest żaden. Usługa na większości maszyn
    nigdy nie startowała i wyłączenie zmienia wyłącznie wpis.

    Czego to nie psuje: zarządzania zdalnego, wydruku, replikacji katalogu,
    udziałów, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", though it is in this block the lightest review of all.

    The service is used by nothing in a current system. Remote management, print
    queueing, directory replication and everything else using the remote calling of
    procedures finds its endpoints by another road and does not touch this service.

    One thing alone is worth checking: whether an application written when that mechanism
    was in use does not stand on the machine. It is a matter of software two decades old,
    as a rule line-of-business, at times carried over from a system older still. It is a
    rare case, but Server 2016 is at times just the machine on which such software lives
    out its days.

    The symptom in such a case is unambiguous - the application does not find its server
    component and says so outright, as a rule naming the service by name.

    Beyond that case the consequence is none. On most machines the service has never
    started and switching it off alters only the entry.

    What this does not break: remote management, printing, directory replication, shares,
    or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Aplikacja sprzed dwóch dekad odnajdująca swój składnik serwerowy po nazwie przestanie go znajdować
      - Komunikat w takim przypadku nazywa usługę po imieniu, więc przyczyna jest widoczna od razu
      - Na większości maszyn usługa nigdy nie startowała i wyłączenie zmienia wyłącznie wpis
      - Zarządzanie zdalne, wydruk, replikacja katalogu i udziały pozostają bez zmian
    en:
      - An application two decades old finding its server component by name will stop finding it
      - The message in such a case names the service outright, so the cause is visible at once
      - On most machines the service has never started and switching it off alters only the entry
      - Remote management, printing, directory replication and shares stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja branżowa odnajdująca swoje punkty końcowe przez ten mechanizm i nie ma dla niej zamiennika
    en:
      - A line-of-business application finding its endpoints through this mechanism stands on the machine and has no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'RpcLocator' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Nothing in a current system uses this. The entry remains from a name
    # service that is no longer served.
    Stop-Service -Name 'RpcLocator' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RpcLocator' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'RpcLocator' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/the-rpc-name-service-database

notes:
  pl: |
    Punkt zamyka blok i jest w nim najlżejszy pod każdym względem — ryzyka,
    skutku i wysiłku. Warto go tak pokazywać, zamiast wyrównywać wagę
    wszystkich punktów bloku do najcięższego z nich.

    Zestawienie kategorii niskiej z poziomem pierwszym jest tu rzeczą
    godną odnotowania, bo dobrze pokazuje, że te dwie osie nie mają ze sobą
    nic wspólnego. Benchmark stawia punkt w profilu podstawowym, bo jest
    darmowy i nic nie kosztuje. Ocena ryzyka stawia go nisko, bo nic
    konkretnego nie zamyka. Oba osądy są prawdziwe naraz.

    Klasa wymagająca sprawdzenia zamiast klasy bez uciążliwości bierze się
    wyłącznie z aplikacji sprzed dwóch dekad. Na maszynie, na której takich
    nie ma, punkt spokojnie idzie hurtem — i warto to w interfejsie
    powiedzieć, bo formalna klasa stawia go poza trybem zbiorczym.
  en: |
    The item shuts the block and is the lightest in it in every respect - in risk, in
    consequence and in effort. It is worth showing so, rather than levelling the weight of
    all the block's items to the heaviest among them.

    The pairing of a low category with the first level is here worth noting, showing well
    as it does that the two axes have nothing in common. The benchmark puts the item in
    the basic profile, it being free and costing nothing. The risk assessment puts it low,
    it shutting nothing definite. Both judgements are true at once.

    The class needing review rather than the class no disruption comes solely from
    applications two decades old. On a machine where there are none, the item goes calmly
    in bulk - and that is worth saying in the interface, the formal class putting it
    outside bulk mode.
