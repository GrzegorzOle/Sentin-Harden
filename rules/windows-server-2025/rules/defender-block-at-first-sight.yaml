id: win2025-defender-block-at-first-sight

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Blokowanie przy pierwszym napotkaniu włączone
    en: Block at first sight enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Mechanizm wstrzymuje plik, którego nikt jeszcze nie widział, dopóki
    nie przyjdzie odpowiedź z usługi zewnętrznej. Nie chodzi więc
    o rozpoznanie czegoś złego, tylko o niewpuszczanie czegoś
    nieznanego, zanim padnie rozstrzygnięcie.

    Punkt nie działa sam. Bez włączonej ochrony dostarczanej z chmury
    nie ma komu zadać pytania i ustawienie leży bezczynne. Zielony
    wiersz przy czerwonym poprzedniku opisuje maszynę, na której to
    wstrzymywanie nie zachodzi — warto to widzieć razem, a nie osobno.

    Na serwerze wartość leży w jednym konkretnym momencie i on
    przesądza o ocenie. Plik nigdy niewidziany trafia na serwer wtedy,
    gdy ktoś go tam właśnie wniósł: przy wdrożeniu, przy serwisie, przy
    ataku. W dwóch pierwszych przypadkach czeka chwilę i idzie dalej.
    W trzecim nie idzie dalej wcale, i tylko po to ten punkt istnieje.

    Zostawiam kategorię wysoką. Mechanizm zamyka realne okno, ale opiera
    się na czymś, co można obejść nadaniem plikowi historii — a to jest
    dla napastnika kosztem, nie ścianą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: prawo
    pierwszego uruchomienia dla narzędzia, którego nikt wcześniej nie
    widział, bez żadnej zwłoki.
  en: |
    The working holds back a file nobody has yet seen until an answer comes from the outward
    service. It is therefore not about the knowing of something ill but about not letting in
    something unknown before the settling falls.

    The item works not alone. Without the guard delivered from the cloud switched on there is nobody
    to put the question to and the setting lies idle. A green line beside a red forerunner sets
    forth a machine whereon that holding back does not happen - it is worth seeing the two together
    and not apart.

    On a server the worth lies in one set moment, and it settles the reckoning. A file never seen
    comes onto a server where somebody has just brought it there - at a rolling out, at service, at
    an attack. In the first two it waits a moment and goes on. In the third it goes on not at all,
    and for that alone this item is.

    I leave the category high. The working shuts a true window, but rests upon something that can be
    gone round by giving the file a history - and that is to an attacker a cost and no wall.

    What an attacker gains while the item goes unmet - the right of a first running for a tool
    nobody has seen before, with no tarrying whatever.

disruption_description:
  pl: |
    Objaw jest tu inny niż na stacji roboczej i dlatego ustawiam ten
    punkt jako niewidoczny dla użytkownika, mimo że na stacji jest
    widoczny. Na stacji użytkownik widzi, że plik się nie uruchamia,
    i czeka. Na serwerze nikt nie czeka, bo nikt nie patrzy. Czeka
    proces, a kto pyta o wynik, dostaje go później albo nie dostaje go
    wcale.

    Rzeczą do sprawdzenia jest to, czy maszyna zapisuje pliki wcześniej
    niewidziane w sposób masowy. Serwer budujący oprogramowanie, serwer
    wydań i serwer rozprowadzający paczki robią dokładnie to: każdy
    przebieg tworzy pliki, których nie widział jeszcze nikt na świecie,
    bo powstały minutę temu. Każdy z nich zostanie wstrzymany na czas
    odpytania.

    Skutkiem nie jest awaria, tylko wydłużenie przebiegu — i to
    wydłużenie nie jest stałe, bo zależy od tego, jak szybko odpowiada
    usługa zewnętrzna. Zadanie, które trwało czterdzieści minut, potrafi
    trwać godzinę w dniu, w którym łącze jest obciążone. Jeżeli przebieg
    ma twardy termin, warto to policzyć przed zmianą.

    Drugim wartym sprawdzenia przypadkiem jest maszyna bez pewnego
    wyjścia na zewnątrz. Wstrzymanie trwa wtedy do upływu czasu
    oczekiwania, czyli najdłużej jak można — i to przy każdym nowym
    pliku.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    The symptom is here other than on a workstation, and therefore I set this item as unseen by the
    user, though on a workstation it is seen. On a workstation the user sees that the file runs not,
    and waits. On a server nobody waits, nobody looking. A process waits, and whoever asks after the
    outcome gets it later or gets it not at all.

    The thing to check is whether the machine writes files never seen before in great number. A
    server that builds software, a server of loosings and a server that spreads bundles do just
    that - every running makes files nobody in the world has seen yet, they having come to be a
    minute since. Every one of them will be held back for the time of an asking.

    The outcome is no fault but a lengthening of the running - and that lengthening is not a steady
    one, it hanging upon how swiftly the outward service answers. A task that lasted forty minutes
    can last an hour on a day the line is laden. If the running has a hard term, it is worth
    reckoning that before the change.

    The second case worth checking is a machine with no sure way out. The holding back then lasts to
    the running out of the time of waiting, that is the longest it can - and that at every new file.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Serwer budujący oprogramowanie tworzy pliki niewidziane przez nikogo i każdy zostanie wstrzymany
      - Wydłużenie przebiegu nie jest stałe, bo zależy od czasu odpowiedzi usługi zewnętrznej
      - Na maszynie bez pewnego wyjścia wstrzymanie trwa do upływu czasu oczekiwania przy każdym nowym pliku
      - Bez włączonej ochrony dostarczanej z chmury ustawienie leży bezczynne i nic nie wstrzymuje
      - Nikt nie zobaczy komunikatu, bo czeka proces, a nie człowiek przy maszynie
    en:
      - A server that builds software makes files nobody has seen and every one will be held back
      - The lengthening of a running is not steady, it hanging upon the answering time of the outward service
      - On a machine with no sure way out the holding back lasts to the running out of the waiting time at every new file
      - Without the guard delivered from the cloud switched on the setting lies idle and holds nothing back
      - Nobody will see a word given, a process waiting and no person at the machine
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer budujący albo wydający oprogramowanie ma przebieg z twardym terminem i bez zapasu czasu
      - Maszyna nie ma pewnego wyjścia na zewnątrz, więc każde wstrzymanie potrwa najdłużej jak można
    en:
      - A server that builds or looses software has a running with a hard term and no spare of time
      - The machine has no sure way out, so every holding back will last the longest it can
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableBlockAtFirstSeen) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'DisableBlockAtFirstSeen'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Idle without cloud-delivered protection: there is nobody to ask, so the
    # holding back never happens and the green line says nothing.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableBlockAtFirstSeen' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-block-at-first-sight-microsoft-defender-antivirus

notes:
  pl: |
    Punkt nie działa sam: bez ochrony dostarczanej z chmury nie ma komu
    zadać pytania. Zielony wiersz przy czerwonym poprzedniku opisuje
    maszynę, na której wstrzymywanie nie zachodzi.

    Wartość serwerowa leży w jednym momencie: plik nigdy niewidziany
    trafia na serwer przy wdrożeniu, przy serwisie albo przy ataku.
    W dwóch pierwszych przypadkach czeka chwilę i idzie dalej.

    Ustawiam punkt jako niewidoczny dla użytkownika, w odróżnieniu od
    stacji roboczej: na serwerze czeka proces, nie człowiek, więc nie
    ma komu zobaczyć, że coś czeka.
  en: |
    The item works not alone - without the guard delivered from the cloud there is nobody to put the
    question to. A green line beside a red forerunner sets forth a machine whereon the holding back
    does not happen.

    The worth on a server lies in one moment - a file never seen comes onto a server at a rolling
    out, at service or at an attack. In the first two it waits a moment and goes on.

    I set the item as unseen by the user, unlike at a workstation - on a server a process waits and
    no person, so there is nobody to see that something waits.
