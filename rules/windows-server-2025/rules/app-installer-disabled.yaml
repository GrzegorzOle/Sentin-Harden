id: win2025-app-installer-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Wbudowany instalator pakietów wyłączony
    en: The built-in package installer disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wbudowany instalator pakietów — narzędzie, którym
    jednym poleceniem pobiera się program z sieci i zakłada go na
    maszynie.

    Warto powiedzieć wprost, czego ten punkt dotyczy, bo nazwa brzmi
    niewinnie. Jest to jedyne narzędzie w systemie, które na żądanie
    sięga do sieci po oprogramowanie i kładzie je na maszynie
    produkcyjnej. Nie po aktualizację czegoś, co już stoi, tylko po
    program, którego dotąd nie było.

    Zostawiam kategorię wysoką. Napastnik, który zdobył możliwość
    wykonania polecenia na serwerze, ma tym samym gotowy sposób wniesienia
    narzędzi — nie musi ich przemycać, przesyłać ani kompilować na
    miejscu. Wystarczy mu jedno polecenie, które w dzienniku wygląda jak
    praca administratora.

    Na serwerze waży też coś, czego na stacji roboczej nie ma: wykaz
    oprogramowania. Serwer jest maszyną, o której zakłada się, że
    wiadomo, co na niej stoi. Narzędzie sięgające po dowolny program
    z zewnątrz tę wiedzę podważa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wniesienia własnych narzędzi na serwer jednym poleceniem, nie do
    odróżnienia od pracy administratora.
  en: |
    The item switches off the built-in installer of packages - the tool wherewith a program is
    fetched off the net by one command and set upon the machine.

    It is worth saying outright what this item bears on, the name sounding guileless. It is the one
    tool in the system that at a bidding reaches into the net for software and lays it upon a machine
    of production. Not for the mending of something that stands already but for a program that was
    not there before.

    I leave the category high. An attacker who has won the leave to run a command upon the server has
    therewith a ready way of bringing tools in - they need neither smuggle them, nor send them, nor
    build them on the spot. One command is enough for them, and in the day-book it looks like the
    work of an administrator.

    On a server there weighs also a thing a workstation has not - the roll of the software. A server
    is a machine whereof it is held that it is known what stands upon it. A tool reaching for any
    program from without undoes that knowing.

    What an attacker gains while the item goes unmet - a road for the bringing of their own tools onto
    the server by one command, not to be told from the work of an administrator.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia", ale planowanie znaczy
    tu coś innego niż zwykle. Nie chodzi o okno serwisowe ani o restart.
    Chodzi o to, że tego punktu nie wolno zamknąć, nie otwierając czegoś
    w zamian.

    To jest rzecz, którą chcę tu powiedzieć najmocniej. Administrator,
    który podczas awarii potrzebuje narzędzia diagnostycznego, zdobędzie
    je tak czy inaczej. Jeżeli odbierze mu się drogę uporządkowaną,
    pobierze plik z przeglądarki z pierwszej strony, jaką znajdzie —
    i zrobi to na koncie z pełnymi prawami, pod presją czasu. Wyłączenie
    instalatora bez wskazania innej drogi nie usuwa problemu, tylko
    przenosi go w gorsze miejsce.

    Planowanie polega więc na ustaleniu, skąd oprogramowanie ma na te
    maszyny przychodzić: z własnego źródła pakietów, z udziału
    z zatwierdzonymi instalatorami, przez agenta zarządzania. Dopiero
    mając tę odpowiedź warto zamykać drogę dotychczasową.

    Druga rzecz do sprawdzenia to skrypty. Zestawianie serwera bywa
    zapisane jako skrypt wołający ten instalator. Taki skrypt przestanie
    działać, ale nie dziś — dopiero przy zestawianiu kolejnej maszyny.

    Zmiana wymaga wylogowania, żeby zadziałała w otwartych sesjach.
    Cofa się natychmiast.
  en: |
    I leave the class "needs a witting rolling out", but the planning means here another thing than
    it mostly does. It is not about a window of service nor about a restart. It is that this item may
    not be shut without the opening of something in its stead.

    That is the thing I would here say the most strongly. An administrator who in the midst of a
    fault takes a tool for the finding out of it will come by it one way or another. If the ordered
    road be taken from them, they will fetch a file off a browser from the first page they find - and
    will do so upon an account with full rights, under the press of time. The switching off of the
    installer without the naming of another road does not do away with the trouble but bears it into
    a worse place.

    The planning comes therefore to the settling whence software is to come onto those machines - off
    a wellspring of packages of one's own, off a share with installers agreed to, through an agent of
    ruling. Only with that answer in hand is it worth shutting the road hitherto.

    The second thing to look to are the scripts. The setting up of a server is at times written as a
    script calling that installer. Such a script will stop working, but not today - only at the
    setting up of the next machine.

    The change takes a signing out that it may work in open sittings. It is undone at once.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Skrypt zestawiający serwer wołający ten instalator przestanie działać przy zestawianiu kolejnej maszyny
      - Administrator potrzebujący narzędzia diagnostycznego podczas awarii nie założy go tą drogą
      - Bez wskazania innej drogi pobierze plik z przeglądarki na koncie z pełnymi prawami, pod presją czasu
      - Zmiana wymaga wylogowania, żeby zadziałała w sesjach już otwartych
      - Oprogramowanie już zainstalowane działa dalej i nie jest odinstalowywane
    en:
      - A script setting a server up that calls that installer will stop working at the setting up of the next machine
      - An administrator taking a tool for the finding out of a fault will not set it up by that road
      - Without the naming of another road they will fetch a file off a browser upon an account with full rights, under the press of time
      - The change takes a signing out that it may work in sittings already open
      - Software already installed works on and is not taken off
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, skąd oprogramowanie ma na te maszyny przychodzić po zamknięciu tej drogi
      - Zestawianie serwerów jest zapisane jako skrypt wołający ten instalator i nie zostało przepisane
    en:
      - It was not settled whence software is to come onto those machines after the shutting of that road
      - The setting up of servers is written as a script calling that installer and was not written anew
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableAppInstaller'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableAppInstaller'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Do not shut this road without opening another one: an own package source,
    # a share of approved installers, or a management agent. Otherwise the
    # tool arrives from a browser instead, under full rights.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableAppInstaller' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

