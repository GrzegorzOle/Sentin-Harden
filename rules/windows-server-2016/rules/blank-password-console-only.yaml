id: win2016-blank-password-console-only

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta z pustym hasłem wyłącznie przy konsoli
    en: Accounts with a blank password at the console only
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby konto lokalne z pustym hasłem dało się użyć wyłącznie
    przy konsoli maszyny, a nie przez sieć.

    Kategoria wysoka, bo skutek braku tego ustawienia jest wprost
    proporcjonalny do liczby kont, o których nikt nie pamięta. Konto z pustym
    hasłem, osiągalne przez sieć, jest dostępem bez żadnego warunku — nie ma
    czego zgadywać, nie ma czego wykradać, wystarczy znać nazwę.

    Warto nazwać skąd takie konta się biorą, bo rzadko zakłada je człowiek
    świadomie. Zakładają je instalatory starszych aplikacji, narzędzia
    migracyjne i procedury testowe, które miały hasło ustawić później.
    Serwer 2016 jest maszyną, na której takich pozostałości bywa najwięcej,
    bo najdłużej pracuje.

    To ustawienie jest siecią bezpieczeństwa pod tymi wszystkimi przypadkami.
    Nie usuwa pustych haseł i nie udaje, że to robi — sprawia natomiast, że
    konto z pustym hasłem przestaje być drogą wejścia z zewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    maszyny przez udział plikowy, pulpit zdalny albo zdalne zarządzanie na
    dowolne konto lokalne, którego hasło jest puste — bez łamania czegokolwiek.
  en: |
    The item requires a local account with a blank password to be usable only
    at the machine's console, not over the network.

    The category is high, because the effect of this setting's absence is
    directly proportional to the number of accounts nobody remembers. An
    account with a blank password reachable over the network is access with no
    condition at all - nothing to guess, nothing to steal, only a name to know.

    It is worth naming where such accounts come from, since a person rarely
    creates one deliberately. They are created by installers of older
    applications, by migration tools and by test procedures that meant to set a
    password later. Server 2016 is the machine where such leftovers are
    commonest, because it has been running longest.

    This setting is the safety net under all those cases. It does not remove
    blank passwords and does not pretend to - what it does is stop an account
    with a blank password being a way in from outside.

    What an attacker gains while the item goes unmet: access to the machine
    through a file share, remote desktop or remote management under any local
    account whose password is blank - with nothing broken at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie jest krótkie, ale trzeba je
    zrobić: czy z tej maszyny korzysta przez sieć konto lokalne z pustym
    hasłem.

    Jeżeli tak, połączenie przestanie działać natychmiast po restarcie.
    Typowy przypadek to starsza aplikacja albo urządzenie łączące się
    z udziałem na koncie technicznym, któremu nigdy nie ustawiono hasła.
    Takie połączenie działa latami i nikt o nim nie wie, dopóki nie przestanie.

    Właściwą odpowiedzią na taki przypadek jest nadanie temu kontu hasła, a nie
    pozostawienie ustawienia wyłączonego. Konto z pustym hasłem, które musi
    działać przez sieć, jest kontem, które prędzej czy później posłuży komuś
    innemu.

    Rzecz do zapamiętania: zmiana działa dopiero po ponownym uruchomieniu
    maszyny. Kto ją zastosuje i od razu sprawdzi przez sieć, zobaczy stan
    sprzed zmiany i uzna, że reguła nie zadziałała.

    Czego to nie psuje: kont z hasłem, kont domenowych, logowania przy
    konsoli ani niczego, co podaje jakiekolwiek hasło.

    Wymaga restartu; odwrócenie również działa dopiero po restarcie.
  en: |
    The class is "needs review", and the review is short but has to be done:
    does a local account with a blank password use this machine over the
    network.

    If it does, the connection stops working straight after the restart. The
    usual case is older software or a device connecting to a share under a
    technical account that was never given a password. Such a connection works
    for years and nobody knows about it until it stops.

    The proper answer to that case is to give the account a password, not to
    leave the setting off. An account with a blank password that has to work
    over the network is an account that will sooner or later serve somebody
    else.

    Something to remember: the change takes effect only after the machine is
    restarted. Whoever applies it and checks over the network at once will see
    the state from before the change and conclude that the rule did not work.

    What this does not break: accounts with a password, domain accounts,
    signing in at the console, or anything that supplies a password at all.

    It needs a restart; undoing it also takes effect only after a restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - remote-management
    - remote-desktop
  what_breaks:
    pl:
      - Konta lokalne z pustym hasłem przestają działać przez sieć, a przy konsoli działają dalej
      - Starsze aplikacje i urządzenia łączące się z udziałem na koncie bez hasła tracą dostęp
      - Zmiana działa dopiero po restarcie, więc sprawdzona od razu wygląda na niedziałającą
      - Konta z hasłem, konta domenowe i logowanie przy konsoli działają bez zmian
    en:
      - Local accounts with a blank password stop working over the network and go on working at the console
      - Older applications and devices connecting to a share under an account with no password lose access
      - The change takes effect only after a restart, so checked at once it looks as though it did not work
      - Accounts with a password, domain accounts and signing in at the console work unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z maszyny korzysta przez sieć konto lokalne z pustym hasłem, a nadanie mu hasła nie zostało jeszcze uzgodnione
    en:
      - A local account with a blank password uses the machine over the network and giving it a password has not yet been agreed
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'LimitBlankPasswordUse'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'LimitBlankPasswordUse' -ErrorAction SilentlyContinue).'LimitBlankPasswordUse'
    [pscustomobject]@{
      path        = $path
      name        = 'LimitBlankPasswordUse'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting removes no blank password - it stops an account that has one
    # being a way in from the network. It takes effect after a restart, so a
    # check made straight away still shows the old behaviour.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitBlankPasswordUse' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-limit-local-account-use-of-blank-passwords-to-console-logon-only

notes:
  pl: |
    Wpis leży w gałęzi systemowej, a nie w gałęzi zasad — kopia zapasowa nie
    usuwa więc klucza przy cofaniu, bo klucz ten istniał na długo przed tą
    zmianą i mieszkają w nim rzeczy niezwiązane z regułą.

    Reguła nie usuwa pustych haseł i nie należy jej tak przedstawiać. Jest
    siecią bezpieczeństwa: sprawia, że konto z pustym hasłem przestaje być
    drogą z zewnątrz. Samo konto warto odnaleźć osobno.

    Na maszynie tego rocznika warto przy okazji przejrzeć listę kont
    lokalnych. Puste hasła rzadko zakłada człowiek — zostawiają je instalatory
    i procedury, które miały wrócić i nie wróciły.
  en: |
    The entry lies in the system branch rather than the policy branch - so the
    backup does not remove the key when undoing, because that key existed long
    before this change and holds things unrelated to the rule.

    The rule does not remove blank passwords and should not be presented as if
    it did. It is a safety net: it stops an account with a blank password being
    a road in from outside. The account itself is worth finding separately.

    On a machine of this vintage the list of local accounts is worth going
    through at the same time. Blank passwords are rarely left by a person -
    they are left by installers and procedures that meant to come back and did
    not.
