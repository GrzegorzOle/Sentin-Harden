id: win10-audit-credential-validation

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Account Logon
  title:
    pl: Inspekcja sprawdzania poświadczeń włączona
    en: The audit of credential checking switched on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza odnotowywanie każdego sprawdzenia poświadczeń na tej
    maszynie — zarówno udanego, jak i nieudanego.

    Punkt zamyka blok i różni się od pozostałych celem. Tamte utrudniają
    zdobycie poświadczeń; ten sprawia, że zdobycie zostawia ślad. Bez niego
    wielokrotne próby zgadywania hasła przechodzą przez maszynę bez
    zapisu, a wejście udane wygląda tak samo jak każde inne.

    Wartość bierze się z zestawienia obu wyników. Sama seria niepowodzeń
    mówi o próbie. Niepowodzenia zakończone powodzeniem mówią o próbie
    udanej — i to jest jedyny zapis, który tę różnicę pokazuje.

    Odnotowuję, że reguła dotyczy sprawdzania poświadczeń, a nie logowania.
    Są to dwie różne czynności odnotowywane osobno: sprawdzenie zachodzi
    także wtedy, gdy uwierzytelnia się usługa albo zadanie, a nie człowiek.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zgadywanie
    haseł i użycie zdobytych poświadczeń niepozostawiające zapisu do
    odczytania po fakcie.
  en: |
    The setting switches on the setting down of every checking of credentials upon this machine - the successful
    as well as the failed.

    The item closes the block and parts from the rest in its aim. Those make the gaining of credentials harder;
    this makes the gaining leave a trace. Without it repeated tries at guessing a password pass through the
    machine unwritten, and a successful entry looks the same as any other.

    Its value comes of the two outcomes set beside each other. A run of failures alone tells of an attempt.
    Failures ending in a success tell of an attempt that succeeded - and that is the only record which shows
    that difference.

    I set down that the rule touches the checking of credentials and not the logging on. They are two different
    acts, set down apart: a checking happens also where a service or a task authenticates, and not a person.

    What an attacker gains while the item goes unmet: the guessing of passwords, and the use of those gained,
    leaving no record to be read after the fact.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest dziennik,
    nie praca maszyny.

    Ustawienie niczego nie zabrania i nie zmienia warunków żadnego
    połączenia. Zmienia wyłącznie to, co jest zapisywane.

    Sprawdzić trzeba pojemność. Odnotowywanie obu wyników przy każdym
    sprawdzeniu poświadczeń daje na maszynie w domenie wpisów sporo,
    a dziennik zabezpieczeń o rozmiarze domyślnym zapełnia się wtedy
    szybciej, niż wielu się spodziewa. Wpisy najstarsze wypadają pierwsze,
    czyli tracone jest to, co najdawniejsze — a przy dochodzeniu po fakcie
    właśnie tam leży początek.

    Rozwiązaniem jest zwiększenie dziennika przed włączeniem inspekcji,
    nie po.

    Czego to nie psuje: logowania, uwierzytelniania, dostępu do zasobów,
    kont domenowych, udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "needs review", and the object of the review is the log, not the machine's working.

    The setting forbids nothing and changes the terms of no connection. It changes only what is written down.

    What has to be reviewed is room. Setting down both outcomes at every checking of credentials gives upon a
    machine in a domain a good many entries, and a security log of its default size then fills quicker than many
    look for. The oldest entries fall out first, which is to say what is lost is the earliest - and in an
    inquiry after the fact that is just where the beginning lies.

    The answer is to enlarge the log before the audit is switched on, not after.

    What this does not break: logging on, authentication, the reach to resources, domain accounts, file shares,
    printing, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Dziennik zabezpieczeń o rozmiarze domyślnym zapełnia się szybciej i wpisy najstarsze wypadają pierwsze
      - Traci się przez to początek zdarzenia, czyli dokładnie to, czego szuka się przy dochodzeniu po fakcie
      - Zwiększenie dziennika trzeba wykonać przed włączeniem inspekcji, a nie po niej
      - Ustawienie niczego nie zabrania i nie zmienia warunków żadnego połączenia
      - Logowanie, uwierzytelnianie, dostęp do zasobów, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A security log of its default size fills quicker and the oldest entries fall out first
      - What is lost thereby is the beginning of a happening, which is just what an inquiry after the fact seeks
      - The log has to be enlarged before the audit is switched on, not after
      - The setting forbids nothing and changes the terms of no connection
      - Logging on, authentication, the reach to resources, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma rozmiar domyślny, a maszyna pracuje w domenie i sprawdzeń poświadczeń jest wiele
      - Nie ma kto przejrzeć zapisu ani nie jest on zbierany poza maszynę
    en:
      - The security log is of its default size while the machine works in a domain and the checkings of credentials are many
      - There is nobody to look the record over, nor is it gathered away from the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE923F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE923F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE923F-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. A failure alone tells of an attempt; a success
    # beside it tells whether the attempt ended in an entry.
    auditpol /set /subcategory:"{0CCE923F-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE923F-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/basic-audit-account-logon-events

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną, która niczego nie chroni.
    Warto, żeby aplikacja to powiedziała, bo punkt oceniany miarą pozostałych
    wygląda na pusty: nie zamyka żadnej drogi i nie odbiera napastnikowi
    niczego w chwili zdarzenia.

    Jej wartość jest późniejsza i polega na tym, że bez niej odpowiedź na
    pytanie „czy komuś się udało" nie istnieje. Zapis nieudanych prób bez
    udanych mówi o hałasie; zestawienie obu mówi o wyniku.

    Odnotowuję warunek, bez którego reguła jest kosztem bez zysku: ktoś
    musi ten zapis czytać albo zbierać go poza maszynę. Dziennik lokalny na
    maszynie opanowanej jest pierwszą rzeczą, którą się czyści. Jest to
    argument za zbieraniem zdarzeń na zewnątrz, a nie przeciw tej regule —
    ale aplikacja powinna go postawić, zamiast obiecywać ochronę, której
    lokalny zapis sam z siebie nie daje.
  en: |
    The rule closes the block and is the only one in it that guards nothing. It is well that the application say
    so, the item weighed by the measure of the rest looking empty: it closes no road and takes nothing from an
    attacker at the moment of the happening.

    Its value comes later, and lies in this - that without it the answer to the question "did somebody succeed"
    does not exist. A record of failed tries without the successful speaks of noise; the two set together speak
    of an outcome.

    I set down the condition without which the rule is a cost without a gain: somebody has to read that record,
    or it has to be gathered away from the machine. A local log upon a machine in somebody's hands is the first
    thing emptied. That is an argument for gathering events outwardly and not against this rule - but the
    application ought to put it, rather than promise a guard a local record does not of itself give.
