id: win2016-connected-standby-password-delay-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Odroczenie żądania hasła po wybudzeniu wyłączone
    en: The putting off of the password demand after a waking switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość odroczenia żądania hasła po wybudzeniu
    maszyny.

    Punkt jest dopełnieniem reguły o haśle przy wybudzeniu i sam nie
    stoi. Tamta ustanawia zasadę; ta pilnuje, żeby zasada nie miała
    wyjątku liczonego w minutach.

    Rzecz, o którą tu chodzi, jest prosta i łatwa do przeoczenia. Maszyna
    może wymagać hasła przy wybudzeniu, a mimo to przez pewien czas go nie
    zażądać. Ochrona jest wtedy warunkowa, a warunkiem jest zegar: przez
    pierwsze minuty po uśpieniu maszyna jest otwarta, potem zamknięta.

    Widziane z zewnątrz jest to nie do odróżnienia. Maszyna wygląda
    w obu stanach tak samo, a to, czy naciśnięcie klawisza otworzy sesję,
    zależy od tego, ile czasu minęło. Osoba, która maszynę zostawiła,
    nie ma jak tego sprawdzić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno
    liczone w minutach, w którym maszyna z ustawionym wymaganiem hasła
    otwiera się bez hasła.
  en: |
    The setting takes away the possibility of putting off the demand for a password after the machine is woken.

    The item completes the rule about a password at a waking and does not stand alone. That one sets the rule;
    this one sees that the rule has no exception counted in minutes.

    The thing at stake here is a simple one and easily passed over. A machine may call for a password at a waking
    and yet for a certain time not demand it. The protection is then conditional, and the condition is a clock:
    for the first minutes after a sleep the machine is open, thereafter shut.

    Seen from outside it is not to be told apart. The machine looks the same in both states, and whether the
    pressing of a key will open the session hangs on how much time has passed. The person who left the machine has
    no way of checking.

    What an attacker gains while the item goes unmet: a window counted in minutes in which a machine with the
    password demand set opens without a password.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze skutek jest zwykle żaden.

    Rzecz do ustalenia: czy ktoś przy tej maszynie korzysta z odroczenia
    świadomie. Zdarza się to tam, gdzie obsługa odchodzi od stanowiska na
    chwilę i wraca — odroczenie jest wtedy wygodą przyjętą i zauważoną,
    a nie ustawieniem, o którym nikt nie wie.

    Jeżeli tak jest, skrócenie oznacza wpisywanie hasła częściej. Jest to
    zmiana sposobu pracy, nie awaria, i tak należy o niej mówić — opis
    mówiący „przestanie działać" zostanie odrzucony jako nieprawdziwy.

    Rzecz druga: punkt nie ma sensu bez reguły o haśle przy wybudzeniu.
    Wykonanie tego samego, bez tamtego, nie daje nic — nie ma czego
    odraczać, skoro hasła i tak się nie żąda.

    Czego to nie psuje: usypiania i wybudzania, sesji otwartych przed
    uśpieniem, usług, aplikacji, sieci, zdalnego dostępu.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on a server the consequence is as a rule none.

    The thing to be established: whether anybody at this machine uses the putting off knowingly. That happens where
    the attendance step away from the workplace for a moment and come back - the putting off is then an accepted and
    noticed convenience and not a setting nobody knows of.

    If it is so, a shortening means a password being typed oftener. It is a change in a way of working, not a fault,
    and so it ought to be spoken of - a description saying "will cease to work" will be dismissed as untrue.

    The second matter: the item makes no sense without the rule about a password at a waking. The carrying out of
    this one without that gives nothing - there is nothing to put off if a password is not demanded anyway.

    What this does not break: the sleeping and waking, sessions open before a sleep, services, applications, the
    network, or remote access.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Odroczenie znika i hasło jest wymagane od razu po wybudzeniu, a nie po upływie ustawionego czasu
      - Osoba korzystająca z odroczenia świadomie będzie wpisywać hasło częściej niż dotąd
      - Wykonanie tego punktu bez reguły o haśle przy wybudzeniu nie daje nic
      - Usypianie i wybudzanie oraz sesje otwarte przed uśpieniem pozostają bez zmian
      - Usługi systemowe, aplikacje serwerowe i zdalny dostęp pozostają bez zmian
    en:
      - The putting off goes and a password is called for straight after a waking rather than after a set time
      - A person using the putting off knowingly will type a password oftener than before
      - The carrying out of this item without the rule about a password at a waking gives nothing
      - The sleeping and waking and the sessions open before a sleep stay unchanged
      - System services, server applications and remote access stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Odroczenie jest na tej maszynie przyjętą wygodą i obsługa odchodzi od stanowiska na krótko
    en:
      - The putting off is on this machine an accepted convenience and the attendance step away from the workplace briefly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'AllowDomainDelayLock'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowDomainDelayLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Read together with the item about a password at a waking - that one sets
    # the rule, this one sees it has no exception counted in minutes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainDelayLock' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby

notes:
  pl: |
    Punkt otwiera ostatni blok zestawu i zbiera pozycje rozproszone po
    benchmarku, których nie dało się ułożyć w jedną rodzinę. Warto to
    przyznać, zamiast doszukiwać się wspólnego wątku, którego nie ma.

    Ta reguła należy do rodziny poprzedniej: razem z punktem o haśle przy
    wybudzeniu tworzy parę i tak trzeba ją pokazywać. Wykonanie jednej bez
    drugiej daje ochronę warunkową, a warunkiem jest zegar.

    Zdanie warte postawienia wprost: maszyna wygląda tak samo, niezależnie
    od tego, czy okno odroczenia trwa. Osoba, która ją zostawiła, nie ma
    jak sprawdzić, w którym stanie ją zostawiła — i to jest właściwe
    uzasadnienie tego punktu, mocniejsze niż samo istnienie okna.

    Odnotowuję, że na serwerze, który nie sypia, reguła jest porządkowa.
    Jej wartość ujawnia się na maszynach sypiających, a takie bywają wśród
    maszyn zarządzanych razem z serwerami.
  en: |
    The item opens the set's last block and gathers entries scattered about the benchmark that could not be laid into
    one family. That is worth owning rather than seeking a common thread that is not there.

    This rule belongs to the family before it: along with the item about a password at a waking it makes a pair and so
    it has to be shown. The carrying out of one without the other gives a conditional protection, and the condition is
    a clock.

    A sentence worth setting down outright: the machine looks the same whether the window of putting off is running or
    not. The person who left it has no way of checking in which state they left it - and that is this item's proper
    warrant, stronger than the window's mere existence.

    Worth noting that on a server that does not sleep the rule is one of order. Its value shows on machines that do
    sleep, and such are among the machines managed along with servers.
