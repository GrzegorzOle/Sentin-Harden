id: win2016-remote-desktop-services-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa pulpitu zdalnego wyłączona
    en: The Remote Desktop service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przyjmującą połączenia pulpitu zdalnego. Usługa ta
    nasłuchuje stale i przyjmuje próby logowania z sieci — również te,
    których nikt nie zamierzał wykonać.

    Powód, dla którego droga ta jest warta zamknięcia, nie leży w samej
    usłudze, tylko w tym, co się na niej dzieje bez przerwy. Port pulpitu
    zdalnego wystawiony gdziekolwiek jest celem prób logowania
    prowadzonych maszynowo, przez całą dobę, przez kogoś, kto o tej
    maszynie nie wie nic poza tym, że odpowiada. Wystarczy jedno hasło
    słabsze, niż się komuś wydawało.

    Rzecz druga dotyczy tego, czym jest udane logowanie tą drogą. Nie jest
    to dostęp do jednej usługi — jest to sesja pełna, z pulpitem,
    schowkiem, przenoszeniem plików i wszystkim, co zalogowany mógłby
    zrobić siedząc przy maszynie.

    Na serwerze obsługiwanym z konsoli albo przez kartę zarządzania usługa
    ta jest zbędna. Na serwerze obsługiwanym pulpitem zdalnym jest
    warunkiem pracy i punkt ten jest na nim niewykonalny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: stale
    otwarte wejście prowadzące po udanym logowaniu do pełnej sesji
    z pulpitem.
  en: |
    The item switches off the service taking in remote desktop connections. That service listens
    ceaselessly and takes in attempts at logging on from the network - including those nobody meant to
    make.

    The reason that road is worth shutting lies not in the service itself but in what goes on at it
    without pause. A remote desktop port set out anywhere is the mark of logon attempts driven by
    machine, round the clock, by somebody who knows nothing of this machine but that it answers. One
    password weaker than somebody supposed is enough.

    The second matter concerns what a successful logon by that road is. It is no access to one service -
    it is a full session, with a desktop, a clipboard, the moving of files and everything the logged-on
    could do sitting at the machine.

    On a server attended from a console or through a management card that service is needless. On a
    server attended by the remote desktop it is a condition of work, and this item is on it not
    feasible.

    What an attacker gains while the item goes unmet: a ceaselessly open entrance leading, after a
    successful logon, to a full session with a desktop.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i tak jak przy zdalnych poleceniach
    wykonanie może odciąć drogę do cofnięcia.

    Warunek pierwszy: sposób obsługi maszyny. Jeżeli serwer obsługuje się
    pulpitem zdalnym, wykonanie tego punktu odcina dostęp wszystkim, łącznie
    z tym, kto zmianę wykonuje. Cofnięcie nie pójdzie tą samą drogą, więc
    droga inna musi istnieć wcześniej.

    Warunek drugi dotyczy roli maszyny. Serwer z rolą hosta sesji istnieje
    po to, żeby ludzie na nim pracowali; wyłączenie tej usługi odbiera mu
    sens. Na takiej maszynie punkt jest niewykonalny, a nie trudny.

    Warunek trzeci dotyczy narzędzi, które z tej usługi korzystają nie po
    to, żeby pokazać pulpit. Część rozwiązań pomocy zdalnej i część
    konsol zarządzania sięga do sesji tą drogą.

    Objaw jest natychmiastowy i jednoznaczny: połączenie zostaje odrzucone.
    Jest to o tyle dobra własność, że nikt nie będzie szukał przyczyny
    tygodniami.

    Czego to nie psuje: zdalnych poleceń zarządzających, udziałów
    plikowych, logowania lokalnego, aplikacji, sieci.

    Wymaga zatrzymania usługi; cofnięcie natychmiastowe, o ile jest skąd.
  en: |
    The class is "needs a planned rollout", and just as with remote commands the carrying out may cut
    off the road to an undoing.

    The first condition: the manner in which the machine is attended. If the server is attended by the
    remote desktop, carrying this item out cuts the access for everybody, the person making the change
    included. The undoing will not go by that same road, so another road has to exist beforehand.

    The second condition concerns the machine's role. A server with the session host role exists so that
    people should work on it; switching that service off takes its sense away. On such a machine the
    item is not feasible rather than hard.

    The third condition concerns tools that use the service for something other than showing a desktop.
    Some remote-help solutions and some management consoles reach a session by that road.

    The symptom is immediate and unambiguous: the connection is refused. That is so far a good property
    that nobody will look for the cause for weeks.

    What this does not break: remote management commands, file shares, a local logon, applications, or
    the network.

    Calls for a service to be stopped; the undoing is immediate, so far as there is anywhere to do it
    from.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Serwer obsługiwany pulpitem zdalnym traci dostęp dla wszystkich, łącznie z tym, kto zmianę wykonuje
      - Serwer z rolą hosta sesji traci sens istnienia, bo ludzie nie mają na czym pracować
      - Rozwiązania pomocy zdalnej i konsole sięgające do sesji tą drogą przestają działać
      - Objaw jest natychmiastowy i jednoznaczny — połączenie zostaje odrzucone
      - Zdalne polecenia zarządzające, udziały plikowe, logowanie lokalne i aplikacje pozostają bez zmian
    en:
      - A server attended by the remote desktop loses its access for everybody, the person making the change included
      - A server with the session host role loses the sense of its existence, people having nothing to work on
      - Remote-help solutions and consoles reaching a session by that road cease to work
      - The symptom is immediate and unambiguous - the connection is refused
      - Remote management commands, file shares, a local logon and applications stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer obsługuje się pulpitem zdalnym, a nie ma konsoli ani karty zarządzania jako drogi zapasowej
      - Maszyna pełni rolę hosta sesji i ludzie na niej pracują
      - Rozwiązanie pomocy zdalnej albo konsola zarządzania sięga do sesji tą drogą
    en:
      - The server is attended by the remote desktop and there is no console or management card as a road in reserve
      - The machine holds the session host role and people work on it
      - A remote-help solution or a management console reaches a session by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'TermService' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This cuts the remote desktop for everybody, the person carrying the change
    # out included, and the undoing cannot go by the same road. Another way to
    # the machine has to exist before this runs.
    Stop-Service -Name 'TermService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'TermService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'TermService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Punkt jest bliźniakiem reguły o zdalnych poleceniach i warto je
    pokazywać razem. Obie zamykają drogę wejścia, obie mogą odciąć
    wykonującego, obie są niewykonalne tam, gdzie stanowią warunek pracy.
    Różni je to, że tutaj objaw jest natychmiastowy, a tam bywa odroczony
    o dobę.

    Ta różnica jest warta wypowiedzenia, bo wpływa na kolejność. Punkt
    o pulpicie zdalnym można wykonać i od razu wiedzieć, czy się udało.
    Punkt o zdalnych poleceniach wymaga odczekania na przebieg narzędzi.
    Wykonanie obu naraz zlewa dwa objawy o różnym czasie w jeden i utrudnia
    rozpoznanie przyczyny.

    Warto też, żeby aplikacja odróżniła dwa powody niewykonalności. Serwer
    z rolą hosta sesji nie jest przypadkiem trudnym — jest przypadkiem,
    w którym punkt przeczy przeznaczeniu maszyny. Zapisany wyjątek jest tu
    wynikiem prawidłowym i powinien wyglądać jak decyzja, a nie jak dług.

    Odnotowuję, że reguła dotyczy wyłączenia usługi, a nie ograniczenia jej.
    Tam, gdzie pulpit zdalny musi zostać, właściwą odpowiedzią są reguły
    o wymuszeniu szyfrowania, uwierzytelnieniu przed sesją i ograniczeniu
    przekierowań — i to one mają się użytkownikowi pokazać zamiast tej.
  en: |
    The item is the twin of the rule about remote commands and they are worth showing together. Both
    shut a road in, both may cut off the one carrying them out, both are not feasible where they are a
    condition of work. What parts them is that here the symptom is immediate, while there it is at times
    put off by a day.

    That difference is worth uttering, bearing as it does on the order. The item about the remote desktop
    can be carried out and known at once to have succeeded. The item about remote commands calls for a
    wait on the tools' run. Carrying both out at once runs two symptoms of different timing together and
    makes recognising the cause harder.

    It is well too that the application part two reasons for infeasibility. A server with the session
    host role is no hard case - it is a case in which the item contradicts the machine's purpose. A
    written exception is here a proper outcome and ought to look like a decision rather than a debt.

    Worth noting that the rule concerns switching the service off and not limiting it. Where the remote
    desktop has to stay, the fitting answer is the rules about enforcing encryption, authenticating
    before a session and limiting redirections - and it is those that should show themselves to the user
    in this one's stead.
