id: win2016-messaging-cloud-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Messaging
  title:
    pl: Przenoszenie wiadomości tekstowych poza maszynę wyłączone
    en: The carrying of text messages beyond the machine switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza przenoszenie wiadomości tekstowych do magazynu
    poza maszyną.

    Punkt wygląda na pozycję o prywatności, a dotyczy uwierzytelniania.
    Wiadomość tekstowa jest w wielu miejscach drugim składnikiem
    logowania: kodem przysyłanym po podaniu hasła.

    Drugi składnik ma sens dopóty, dopóki jest oddzielny. Cała jego
    wartość polega na tym, że leży poza tym, co napastnik zdobył razem
    z hasłem. Gdy wiadomości wędrują do magazynu dostępnego przez konto,
    oddzielność znika: przejęcie tego konta daje naraz hasło i rzecz,
    która miała chronić przed jego utratą.

    Nie jest to obejście mechanizmu ani błąd w jego działaniu. Jest to
    sprowadzenie dwóch składników do jednego, po cichu i bez zmiany
    czegokolwiek w samym logowaniu. Z zewnątrz wszystko wygląda tak samo.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drugi
    składnik logowania w tym samym miejscu co pierwszy, czyli dostęp do
    kont chronionych kodem z wiadomości.
  en: |
    The setting switches off the carrying of text messages into storage beyond the machine.

    The item looks an entry about privacy and concerns authentication. A text message is in many places the
    second factor of a logon: a code sent after the password is given.

    A second factor makes sense so long as it is separate. Its whole value rests on its lying outside what the
    attacker got along with the password. Where messages travel into storage reachable through an account, that
    separateness goes: the taking of that account gives at once the password and the thing that was to guard
    against its loss.

    It is no getting round of the mechanism nor a fault in its working. It is a bringing of two factors down to
    one, quietly and without a change of anything in the logon itself. From outside everything looks the same.

    What an attacker gains while the item goes unmet: the second factor of a logon in the same place as the
    first, which is to say access to the accounts guarded by a code from a message.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze skutek jest zwykle żaden.

    Rzecz do ustalenia: czy ktokolwiek czyta na tej maszynie wiadomości
    tekstowe przeniesione z telefonu. Na serwerze w szafie nie czyta nikt.
    Na maszynie, przy której ktoś pracuje i przywykł, że wiadomości ma pod
    ręką, zmiana zabiera wygodę realną — i trzeba o tym powiedzieć
    uczciwie, bo inaczej reguła zostanie cofnięta przy pierwszym
    zgłoszeniu.

    Rzecz druga dotyczy zasięgu. Zmiana zatrzymuje przenoszenie
    w przyszłości i nie usuwa niczego, co już przeniesiono. Wiadomości
    zgromadzone wcześniej zostają tam, gdzie trafiły, i trzeba je usunąć
    osobno, jeśli o to chodzi.

    Rzecz trzecia dotyczy tego, co zostaje. Telefon nadal odbiera
    wiadomości i drugi składnik logowania działa tak jak dotąd. Reguła nie
    dotyka samego mechanizmu logowania.

    Czego to nie psuje: odbierania wiadomości na telefonie, drugiego
    składnika logowania, poczty, powiadomień, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on a server the consequence is as a rule none.

    The thing to be established: whether anybody at all reads on this machine text messages carried over from a
    telephone. On a server in a cabinet nobody does. On a machine somebody works at and has grown used to having
    messages to hand, the change takes away a real convenience - and that has to be said honestly, else the rule
    will be undone at the first report.

    The second matter concerns reach. The change stops the carrying in future and removes nothing that was
    carried already. Messages gathered earlier stay where they landed and have to be removed separately, if that
    is what is wanted.

    The third matter concerns what remains. The telephone still receives messages and the second factor of a
    logon works just as before. The rule does not touch the logon mechanism itself.

    What this does not break: the receiving of messages on a telephone, the second factor of a logon, mail,
    notifications, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Wiadomości tekstowe przeniesione z telefonu przestają pojawiać się na tej maszynie
      - Osoba przywykła do czytania wiadomości przy maszynie traci wygodę i zwykle zgłasza to jako awarię
      - Wiadomości przeniesione wcześniej zostają tam, gdzie trafiły, i trzeba je usunąć osobno
      - Odbieranie wiadomości na telefonie i drugi składnik logowania działają tak jak dotąd
      - Poczta, powiadomienia, usługi systemowe i aplikacje serwerowe pozostają bez zmian
    en:
      - Text messages carried over from a telephone cease to appear on this machine
      - A person used to reading messages at the machine loses a convenience and as a rule reports it as a fault
      - Messages carried earlier stay where they landed and have to be removed separately
      - The receiving of messages on a telephone and the second factor of a logon work just as before
      - Mail, notifications, system services and server applications stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca przy tej maszynie opiera się na czytaniu wiadomości tekstowych przeniesionych z telefonu
      - Przeniesione wiadomości są przyjętą drogą odbierania kodów przez osobę bez dostępu do telefonu
    en:
      - The work at this machine rests on the reading of text messages carried over from a telephone
      - The carried messages are an accepted road for receiving codes by a person without access to the telephone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
      $name = 'AllowMessageSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    $name = 'AllowMessageSync'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change stops the carrying. Messages carried earlier stay where they
    # were carried to - the rule shuts the road and does not tidy after it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowMessageSync' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-messaging

notes:
  pl: |
    Punkt jest drugi w bloku i najbardziej mylący. Nazwa mówi
    o wiadomościach, sekcja mówi o komunikatorze, a przedmiotem jest
    drugi składnik logowania.

    Zdanie warte postawienia wprost w interfejsie brzmi tak: drugi
    składnik ma wartość dopóty, dopóki leży poza tym, co napastnik zdobył
    razem z hasłem. Bez tego zdania reguła wygląda na pozycję o wygodzie
    i zostanie odpuszczona odruchowo.

    Zestawienie ocen jest tu warte uwagi, bo koszt jest znikomy, a
    kategoria wysoka. Na serwerze zmiana nie zabiera nikomu niczego, więc
    pozycja należy do szybkich wygranych — mimo że klasa „wymaga
    sprawdzenia" trzyma ją poza trybem zbiorczym.

    Odnotowuję granicę działania reguły. Zamyka drogę i nie sprząta po
    niej: wiadomości przeniesione wcześniej zostają tam, gdzie trafiły.
    Zgodny wynik audytu nie jest więc dowodem, że danych nie ma, i warto,
    żeby raport tego nie sugerował.
  en: |
    The item is the second in the block and the most misleading. The name speaks of messages, the section speaks
    of a messenger, and the subject is the second factor of a logon.

    The sentence worth setting down outright in the interface runs thus: a second factor has value so long as it
    lies outside what the attacker got along with the password. Without that sentence the rule looks an entry
    about convenience and will be let go by reflex.

    The pairing of the assessments is here worth attention, the cost being slight and the category high. On a
    server the change takes from nobody anything, so the entry belongs among the quick wins - though the class
    "needs review" holds it outside the bulk mode.

    Worth noting the bound of the rule's working. It shuts a road and does not tidy after it: messages carried
    earlier stay where they landed. A compliant outcome of the audit is therefore no proof that the data are not
    there, and it is well that the report not suggest so.
