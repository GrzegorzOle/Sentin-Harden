id: win2025-laps-password-age

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Okres ważności hasła lokalnego administratora najwyżej trzydzieści dni
    en: Term of the local administrator password's validity at most thirty days
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt ogranicza okres ważności losowanego hasła lokalnego administratora
    do trzydziestu dni. Wartość jest liczona w dniach; krótsza też spełnia
    wymaganie.

    Zostawiam kategorię średnią, bo sam okres ważności niczego nie zamyka —
    on ogranicza, jak długo coś, co już wyciekło, jest jeszcze coś warte.
    Ale właśnie w tym miejscu warto powiedzieć, czym na serwerze jest wyciek
    tego hasła, bo to nie jest to samo co na stacji roboczej.

    Hasła lokalnego administratora serwera nie zdobywa się zwykle podsłuchem
    ani odgadywaniem. Ono wypływa przez to, że ktoś go użył i gdzieś
    zapisał: w zgłoszeniu opisującym awarię, w wiadomości do dostawcy,
    w notatce z dyżuru, w skrypcie napisanym na jeden raz i zostawionym na
    dysku. Każde z tych miejsc żyje własnym życiem i nikt ich nie sprząta.

    Okres ważności jest jedynym mechanizmem, który działa na wszystkie te
    miejsca naraz, bo nie wymaga ich znalezienia. Hasło wklejone do
    zgłoszenia w styczniu przestaje mieć wartość w lutym i nie ma znaczenia,
    że zgłoszenie dalej tam wisi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło zebrane
    z dowolnego starego zapisu, które nadal otwiera maszynę.
  en: |
    The item limits the term of validity of the randomly chosen local
    administrator password to thirty days. The value is counted in days; a
    shorter one meets the requirement too.

    I keep the category medium, because a term of validity closes nothing
    by itself - it limits how long something that has already leaked is
    still worth anything. But this is the place to say what a leak of this
    password means on a server, because it is not the same as on a
    workstation.

    A server's local administrator password is not usually obtained by
    eavesdropping or guessing. It seeps out because somebody used it and
    wrote it down somewhere: in a ticket describing a failure, in a message
    to a vendor, in a note from a shift, in a script written for one
    occasion and left on a disk. Each of those places lives a life of its
    own and nobody tidies them.

    The term of validity is the only mechanism that acts on all those
    places at once, because it does not require finding them. A password
    pasted into a ticket in January is worth nothing in February, and it
    makes no difference that the ticket is still hanging there.

    What an attacker gains while the item goes unmet: a password gathered
    from any old record that still opens the machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i powód jest prosty: nikt tego hasła nie
    pamięta, więc jego zmiana nikogo nie zaskakuje. Ono jest odczytywane
    z katalogu w chwili, w której jest potrzebne, a to działa tak samo przy
    ważności trzydziestodniowej i rocznej.

    Jeden przypadek do sprawdzenia jednak istnieje i wynika ze sposobu
    pracy z serwerami, nie z samego ustawienia. Jeżeli ktoś odczytał to
    hasło na początku dłuższych prac i zapisał je sobie na czas ich trwania
    — przy migracji, przy odtwarzaniu, przy pracach dostawcy rozłożonych na
    tygodnie — skrócenie okresu ważności może unieważnić je w środku tych
    prac. Nic się nie psuje, ale trzeba odczytać hasło ponownie. Wystarczy
    o tym wiedzieć.

    Druga uwaga, żeby nie szukać skutku tam, gdzie go nie ma: ta reguła
    działa wyłącznie wtedy, gdy mechanizm hasła lokalnego administratora
    jest włączony. Bez niego wpis istnieje i nie robi nic.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption" and the reason is simple: nobody
    remembers this password, so changing it surprises nobody. It is read
    from the directory at the moment it is needed, and that works the same
    way with a thirty-day term and with a yearly one.

    One case does exist to check, though, and it follows from how people
    work with servers rather than from the setting itself. If somebody read
    this password at the start of longer works and kept it for their
    duration - during a migration, during a restore, during vendor work
    spread over weeks - shortening the term may invalidate it in the middle
    of those works. Nothing breaks, but the password has to be read again.
    Knowing about it is enough.

    A second note, so that nobody looks for an effect where there is none:
    this rule works only where the local administrator password mechanism
    is on. Without it the entry exists and does nothing.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Nikt tego hasła nie pamięta, bo jest odczytywane z katalogu w chwili, w której jest potrzebne
      - Hasło odczytane na początku dłuższych prac może zostać unieważnione w ich trakcie i trzeba je odczytać ponownie
      - Dotyczy to migracji, odtwarzania i prac dostawcy rozłożonych na tygodnie — nic się nie psuje, ale warto o tym wiedzieć
      - Reguła działa wyłącznie wtedy, gdy mechanizm hasła lokalnego administratora jest włączony
    en:
      - Nobody remembers this password, because it is read from the directory at the moment it is needed
      - A password read at the start of longer works may be invalidated mid-way and has to be read again
      - This covers migrations, restores and vendor work spread over weeks - nothing breaks, but it is worth knowing
      - The rule works only where the local administrator password mechanism is on
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Przyjęto krótszy okres ważności uzgodniony w organizacji i wpisanie trzydziestu dni byłoby jego wydłużeniem
    en:
      - A shorter term agreed across the organisation is in force and writing thirty days would lengthen it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is counted in days.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordAgeDays'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '30'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordAgeDays' -ErrorAction SilentlyContinue).'PasswordAgeDays'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordAgeDays'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the term in force is already shorter, leave it - writing thirty
    # here would lengthen it.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Thirty is the upper bound the item takes; a shorter term meets it too.
    Set-ItemProperty -Path $path -Name 'PasswordAgeDays' -Value 30 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Hasła lokalnego administratora serwera nie zdobywa się podsłuchem —
    ono wypływa przez to, że ktoś go użył i gdzieś zapisał: w zgłoszeniu,
    w wiadomości do dostawcy, w notatce z dyżuru, w skrypcie zostawionym na
    dysku. Nikt tych miejsc nie sprząta.

    Okres ważności jest jedynym mechanizmem działającym na wszystkie te
    miejsca naraz, bo nie wymaga ich znalezienia. Hasło wklejone do
    zgłoszenia w styczniu przestaje mieć wartość w lutym.

    Jedyny przypadek do sprawdzenia wynika ze sposobu pracy, nie
    z ustawienia: hasło odczytane na początku dłuższych prac może zostać
    unieważnione w ich trakcie.
  en: |
    A server's local administrator password is not obtained by
    eavesdropping - it seeps out because somebody used it and wrote it down
    somewhere: in a ticket, in a message to a vendor, in a note from a
    shift, in a script left on a disk. Nobody tidies those places.

    The term of validity is the only mechanism that acts on all of them at
    once, because it does not require finding them. A password pasted into
    a ticket in January is worth nothing in February.

    The only case to check follows from how people work rather than from
    the setting: a password read at the start of longer works may be
    invalidated mid-way.
