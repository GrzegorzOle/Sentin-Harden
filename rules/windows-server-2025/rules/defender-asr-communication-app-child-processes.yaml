id: win2025-defender-asr-communication-app-child-processes

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania programów przez aplikację pocztową pakietu biurowego
    en: Office communication application blocked from launching programs
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania aplikacji pocztowej pakietu biurowego uruchamiania
    innych programów. Jest to trzynasty i ostatni punkt grupy
    ograniczania powierzchni ataku w tej paczce.

    Obniżam kategorię do niskiej z tego samego powodu, dla którego
    obniżyłem ją przy wszystkich punktach dotyczących dokumentów
    i poczty: serwer nie ma pakietu biurowego, a tym bardziej jego
    aplikacji pocztowej. Reguła, która nie ma czego dotyczyć, nie
    zdejmuje ryzyka, choćby wzorzec był groźny.

    A wzorzec jest groźny i warto to zapisać, bo wartość tej reguły
    wraca w pełni na serwerze terminalowym. Aplikacja pocztowa jest
    jednym z niewielu programów, do których treść przychodzi z zewnątrz
    bez żadnego udziału odbiorcy — nie trzeba niczego pobierać ani
    nigdzie wchodzić, wystarczy, że ktoś zna adres. Program uruchomiony
    z tego miejsca startuje w kontekście osoby, która właśnie czyta
    pocztę.

    Na serwerze terminalowym osoba ta czyta pocztę na maszynie mającej
    dostęp do zasobów całej organizacji, i to jest dokładnie ten układ,
    o którym pisałem przy regule o plikach wykonywalnych z poczty.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z aplikacją pocztową — uruchomienie programu z miejsca,
    do którego treść trafia bez udziału odbiorcy.
  en: |
    The rule forbids the application of post of the office bundle to run other programs. It is the
    thirteenth and last item of the group of the narrowing of the surface of attack in this pack.

    I lower the category to low of the same ground for which I lowered it at all the items bearing
    on documents and post - a server has no office bundle, and the less its application of post. A
    rule that has nothing to bear upon takes no risk away, be the pattern never so grave.

    And the pattern is grave, and it is worth writing down, the worth of this rule coming back whole
    on a terminal server. The application of post is one of the few programs whereinto matter comes
    from without with no doing of the receiver at all - nothing need be drawn down nor anywhere gone
    into, it being enough that somebody knows the address. A program run out of that place starts in
    the stead of the person who is at that moment reading post.

    On a terminal server that person reads post on a machine that reaches the goods of the whole
    body, and that is just the arrangement I wrote of at the rule about files to be carried out from
    post.

    What an attacker gains while the item goes unmet - on a machine with an application of post, the
    running of a program out of a place whereinto matter comes with no doing of the receiver.

disruption_description:
  pl: |
    Na serwerze bez aplikacji pocztowej zmiana nie robi nic. Zostaje
    mimo to poza trybem zbiorczym i powód jest inny niż przy
    poprzednich regułach tej grupy, więc wymieniam go osobno.

    Aplikacja pocztowa pakietu biurowego jest na wielu stanowiskach nie
    tylko programem do czytania poczty, ale i miejscem, z którego
    otwiera się wszystko inne: kalendarz otwiera spotkanie w programie
    do spotkań, wiadomość otwiera dokument, przypomnienie otwiera
    zgłoszenie w systemie zewnętrznym. Każde z tych otwarć jest
    „uruchomieniem programu przez aplikację pocztową".

    Część z nich jest przez mechanizm rozpoznawana i przepuszczana,
    część nie — i nie da się tego przewidzieć z opisu, bo zależy od
    tego, jak konkretny program się rejestruje. Dlatego na serwerze
    terminalowym zmiana wymaga przejścia przez zwykły dzień pracy
    kilku osób, a nie samego uruchomienia poczty i stwierdzenia, że
    działa.

    Objaw jest natychmiastowy i dotyka ludzi, więc tym razem, inaczej
    niż przy większości punktów tej paczki, ktoś go zobaczy i zgłosi.
    Jest to jedyna dobra wiadomość w tym akapicie.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    On a server with no application of post the change does nothing. It stays outside the bulk mode
    for all that, and the ground is another than at the rules before in this group, so I name it
    apart.

    The application of post of the office bundle is at many places of work not only a program for
    the reading of post but also the place wherefrom everything else is opened - the calendar opens
    a meeting in a program for meetings, a message opens a document, a reminder opens a report in an
    outward system. Every one of those openings is "the running of a program by an application of
    post".

    Some of them the working knows and lets through, some not - and it cannot be foreseen from a
    setting forth, it hanging upon how the one program writes itself down. Therefore on a terminal
    server the change takes a going through an ordinary working day of several people and no mere
    running of the post and finding that it works.

    The symptom is at once and it touches people, so this time, unlike at most items of this pack,
    somebody will see it and report it. That is the one good tiding in this paragraph.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - macros-and-documents
  what_breaks:
    pl:
      - Otwarcie spotkania, dokumentu albo zgłoszenia wprost z poczty bywa uruchomieniem programu
      - Nie da się przewidzieć z opisu, które z tych otwarć przejdą, bo zależy to od sposobu rejestracji programu
      - Na serwerze terminalowym zmiana wymaga przejścia przez zwykły dzień pracy kilku osób
      - Objaw jest natychmiastowy i dotyka ludzi, więc tym razem ktoś go zobaczy i zgłosi
      - Na serwerze bez aplikacji pocztowej zmiana nie robi zupełnie nic
    en:
      - The opening of a meeting, a document or a report straight out of the post is at times the running of a program
      - It cannot be foreseen which of those openings will go through, it hanging upon how the program writes itself down
      - On a terminal server the change takes a going through an ordinary working day of several people
      - The symptom is at once and touches people, so this time somebody will see it and report it
      - On a server with no application of post the change does nothing at all
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze terminalowym ludzie otwierają z poczty spotkania i zgłoszenia w systemach zewnętrznych
    en:
      - On a terminal server people open out of the post meetings and reports in outward systems
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '26190899-1602-49e8-8b27-eb1d0a1ce869'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '26190899-1602-49e8-8b27-eb1d0a1ce869'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '26190899-1602-49e8-8b27-eb1d0a1ce869' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Trzynasty i ostatni punkt grupy ograniczania powierzchni ataku
    w tej paczce.

    Kategoria niska, bo serwer nie ma pakietu biurowego ani jego
    aplikacji pocztowej. Wzorzec jest jednak groźny i wartość wraca
    w pełni na serwerze terminalowym: aplikacja pocztowa to jeden
    z niewielu programów, do których treść przychodzi z zewnątrz bez
    żadnego udziału odbiorcy.

    Powód pozostawienia poza trybem zbiorczym jest inny niż przy
    poprzednich regułach grupy: poczta bywa miejscem, z którego otwiera
    się wszystko inne, a które z tych otwarć przejdą, nie da się
    przewidzieć z opisu.
  en: |
    The thirteenth and last item of the group of the narrowing of the surface of attack in this
    pack.

    The category is low, a server having no office bundle nor its application of post. The pattern
    is grave for all that and the worth comes back whole on a terminal server - the application of
    post is one of the few programs whereinto matter comes from without with no doing of the
    receiver at all.

    The ground for leaving it outside the bulk mode is another than at the rules before in the group
    - the post is at times the place wherefrom everything else is opened, and which of those
    openings will go through cannot be foreseen from a setting forth.
