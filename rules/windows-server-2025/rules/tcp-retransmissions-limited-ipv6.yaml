id: win2025-tcp-retransmissions-limited-ipv6

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Liczba powtórzeń wysyłki danych ograniczona do trzech w protokole szóstej wersji
    en: The number of data send repeats limited to three in the sixth version protocol
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer z systemem Windows ma dwa niezależne stosy sieciowe i używa
    obu naraz. Nowszy protokół jest włączony domyślnie i ma pierwszeństwo
    przy nawiązywaniu połączeń wszędzie tam, gdzie jest dostępny.

    Wszystko, co powiedziano o powtarzaniu wysyłki w protokole starszym,
    dotyczy tu tak samo: niepotwierdzone dane są wysyłane ponownie,
    odstęp między próbami rośnie dwukrotnie, a połączenie przez cały
    ten czas zajmuje miejsce w tablicy i trzyma pamięć.

    Osobny wpis nie jest formalnością. Licznik prób jest liczony
    osobno dla każdego stosu, więc ustawienie go w protokole starszym
    nie zmienia nic w nowszym. Serwer utwardzony połowicznie zachowuje
    przy części ruchu zachowanie domyślne — i nie wiadomo z góry, przy
    której części, bo zależy to od tego, czym rozwiązała się nazwa.

    Na serwerze rzecz jest gorsza niż na stanowisku roboczym z powodu,
    który wraca w tej paczce przy każdym punkcie o protokole szóstej
    wersji: adresacja tej wersji bywa włączona, choć nikt jej świadomie
    nie wdrażał. Nadzór zbiera wtedy ruch jednego protokołu, reguły
    filtra opisują jeden protokół, a utwardzenie obejmuje jeden protokół.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: to samo
    co w protokole starszym, ale w stosie, który zwykle został pominięty
    przy utwardzaniu.
  en: |
    A server running Windows has two independent network stacks and uses both at once. The newer
    protocol is on by default and holds precedence at the opening of connections wherever it is to
    be had.

    All that was said of the repeating of sends in the older protocol holds here the same: data
    not borne out are sent again, the interval between tries grows twofold, and all that while the
    connection holds a place in the table and keeps memory.

    A separate entry is no formality. The counter of tries is counted apart for each stack, so
    setting it in the older protocol changes nothing in the newer. A server hardened by halves
    keeps at a part of its traffic the default behaviour - and it is not known beforehand at which
    part, that depending on what the name resolved by.

    On a server the matter is worse than at a working station for a reason returning throughout
    this pack at every item about the sixth version of the protocol: the addressing of that
    version is at times on though nobody rolled it out knowingly. The watching then gathers the
    traffic of one protocol, the filter's rules set down one protocol, and the hardening takes in
    one protocol.

    What an attacker gains while the item goes unmet: the same as in the older protocol, but in
    the stack usually passed over at the hardening.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia z tych samych powodów co
    w protokole starszym, ale rozpoznanie jest tu trudniejsze i to jest
    jedyna różnica warta opisania.

    Skutek — wcześniejsze zerwanie połączenia na łączu gubiącym pakiety
    seriami — jest identyczny. Objaw też: przerwane przesyłanie, zerwana
    sesja, zapytanie, które nie wraca, zawsze po stronie klienta.

    Trudność polega na tym, że nie wiadomo, którzy klienci łączą się
    tym protokołem. Na stanowisku roboczym można to sprawdzić raz;
    na serwerze przyjmującym połączenia z wielu miejsc trzeba popatrzeć
    na wykaz połączeń przez kilka dni i o różnych porach, bo wykaz ten
    mówi o chwili bieżącej, a nie o tym, co bywa.

    Bywa też tak, że ten sam klient łączy się raz jednym protokołem,
    raz drugim — w zależności od tego, co zwróciło rozwiązywanie nazwy
    w danym momencie. Objaw jest wtedy przerywany i wygląda na usterkę
    losową, co jest najgorszym możliwym wariantem.

    Praktyczny wniosek jest jeden: te dwa punkty wdraża się razem, w tym
    samym oknie serwisowym. Wdrożenie jednego bez drugiego daje
    zachowanie niespójne, w którym połowa ruchu zachowuje się inaczej
    niż druga, a przyczyny nie da się wskazać z żadnej strony.

    Skutek ujawnia się dopiero po ponownym uruchomieniu serwera, tak
    samo jak w protokole starszym.
  en: |
    The change takes a knowing rollout for the same reasons as in the older protocol, but the
    reconnaissance is harder here, and that is the one difference worth setting down.

    The effect - an earlier severing of a connection on a link losing packets in runs - is the
    same. So is the symptom: a broken sending, a severed session, a query that does not come back,
    always on the client's side.

    The hardness lies in its not being known which clients connect by this protocol. At a working
    station it can be checked once; on a server taking connections from many places the list of
    connections must be looked at over several days and at differing hours, that list speaking of
    the present moment and not of what happens at times.

    It happens too that the same client connects now by one protocol and now by the other -
    according to what the resolving of the name gave back at that moment. The symptom is then
    broken up and looks like a chance fault, which is the worst possible variant.

    The practical conclusion is one: these two items are rolled out together, in the same service
    window. Rolling out one without the other gives an unmatched behaviour in which half the
    traffic behaves otherwise than the rest, and the cause cannot be pointed to from either side.

    The effect shows only after a fresh start of the server, just as in the older protocol.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Klient łączący się protokołem szóstej wersji przez łącze gubiące pakiety straci połączenie szybciej niż dotąd
      - Ten sam klient bywa obsłużony raz jednym, raz drugim protokołem, więc objaw wygląda na usterkę losową
      - Wdrożenie tego punktu bez odpowiednika dla protokołu czwartej wersji daje zachowanie niespójne
      - Wykaz połączeń mówi o chwili bieżącej, więc rozpoznanie wymaga obserwacji przez kilka dni
      - Skutek ujawnia się dopiero po ponownym uruchomieniu serwera
    en:
      - A client connecting by the sixth version protocol over a link losing packets will lose their connection sooner than until now
      - The same client is at times served now by one protocol and now by the other, so the symptom looks like a chance fault
      - Rolling this item out without its counterpart for the fourth version protocol gives an unmatched behaviour
      - The list of connections speaks of the present moment, so the reconnaissance takes watching over several days
      - The effect shows only after a fresh start of the server
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Ruch protokołu szóstej wersji jest prowadzony tunelem o zmiennej jakości
      - Nie ustalono, którzy klienci tego serwera łączą się protokołem szóstej wersji
    en:
      - The sixth version protocol's traffic is carried in a tunnel of uneven quality
      - It was not settled which of this server's clients connect by the sixth version protocol
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is named as in the older stack, but lives in the key of the
      # sixth version protocol and is counted separately from it.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
      $name = 'TcpMaxDataRetransmissions'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
    $name = 'TcpMaxDataRetransmissions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters' `
      -Name 'TcpMaxDataRetransmissions' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Licznik prób jest liczony osobno dla każdego stosu, więc ustawienie
    wartości w protokole starszym nie zmienia nic w nowszym.

    Te dwa punkty wdraża się razem, w tym samym oknie serwisowym.
    Wdrożenie jednego bez drugiego daje zachowanie niespójne, którego
    przyczyny nie da się wskazać z żadnej strony.

    Rozpoznanie wymaga obserwacji wykazu połączeń przez kilka dni
    i o różnych porach — wykaz mówi o chwili bieżącej, a ten sam klient
    bywa obsłużony raz jednym, raz drugim protokołem.
  en: |
    The counter of tries is counted apart for each stack, so setting the value in the older
    protocol changes nothing in the newer.

    These two items are rolled out together, in the same service window. Rolling out one without
    the other gives an unmatched behaviour whose cause cannot be pointed to from either side.

    The reconnaissance takes watching the list of connections over several days and at differing
    hours - the list speaks of the present moment, and the same client is at times served now by
    one protocol and now by the other.
