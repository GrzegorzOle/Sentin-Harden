id: win11-laps-password-encryption-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Szyfrowanie hasła lokalnego administratora w katalogu włączone
    en: Encryption of the local administrator's password in the directory switched on
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że hasło lokalnego administratora odkładane do
    katalogu jest tam zapisywane w postaci zaszyfrowanej, a nie jawnej.

    Bez tego hasło leży w katalogu jako zwykły tekst w atrybucie obiektu
    komputera. Dostęp do niego jest ograniczony uprawnieniami i to działa,
    dopóki uprawnienia są ustawione poprawnie — ale hasło samo w sobie nie
    jest niczym osłonięte.

    Znaczenie ma to w trzech sytuacjach, które zdarzają się częściej, niż
    wynikałoby z założeń. Pierwsza: kopia zapasowa katalogu. Plik kopii
    zawiera wtedy wszystkie hasła lokalnych administratorów w organizacji
    i nie jest chroniony uprawnieniami katalogu. Druga: replikacja, w której
    atrybut wędruje przez sieć i trafia na kontrolery w lokalizacjach
    o gorszej ochronie fizycznej. Trzecia: konto o zbyt szerokich
    uprawnieniach w katalogu, czyli rzecz, którą audyt katalogu znajduje
    niemal zawsze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przy dostępie
    do kopii katalogu albo do konta o nadmiarowych uprawnieniach — wszystkie
    hasła lokalnych administratorów naraz, w postaci gotowej do użycia.
    Szyfrowanie zamienia ten jeden ruch na konieczność zdobycia jeszcze
    uprawnień podmiotu, dla którego hasła są szyfrowane.
  en: |
    The setting makes the local administrator's password laid into the directory be
    recorded there in an encrypted rather than a plain form.

    Without it the password lies in the directory as ordinary text in an attribute of the
    computer object. Access to it is limited by rights, and that works so long as the
    rights are set correctly - but the password itself is covered by nothing.

    It matters in three situations that happen more often than assumptions would suggest.
    The first: a backup of the directory. The backup file then holds every local
    administrator password in the organisation and is not guarded by the directory's
    rights. The second: replication, in which the attribute travels through the network and
    reaches controllers in places of poorer physical protection. The third: an account with
    too wide rights in the directory, that is, a thing an audit of a directory finds almost
    always.

    What an attacker gains while the item goes unmet: with access to a copy of the directory
    or to an account with excess rights - every local administrator password at once, in a
    form ready to use. Encryption turns that one move into a need to gain besides the
    rights of the principal the passwords are encrypted for.

disruption_description:
  pl: |
    Sprawdzenia wymaga poziom katalogu. Szyfrowanie wymaga katalogu
    w wydaniu nie starszym niż wskazane w dokumentacji mechanizmu; na
    katalogu starszym zapis zaszyfrowany nie przejdzie i maszyna nie odłoży
    hasła wcale.

    Jest to sytuacja gorsza niż hasło zapisane jawnie i dlatego punkt nie
    należy do klasy bez uciążliwości mimo braku widocznych skutków dla
    użytkownika. Kolejność jest tutaj rozstrzygająca: najpierw katalog,
    potem maszyny.

    Sprawdzenia wymaga też sposób odczytu hasła. Narzędzia odczytujące
    atrybut wprost, z pominięciem mechanizmu przewidzianego do tego celu,
    zobaczą po zmianie dane nieczytelne. Dotyczy to skryptów i narzędzi
    własnych częściej niż narzędzi producenta.

    Poza tymi dwoma przypadkami zmiana jest niewidoczna. Praca użytkownika
    nie zmienia się w żaden sposób.

    Zmiana nie wymaga restartu.
  en: |
    The directory's level needs checking. Encryption takes a directory of an edition no
    older than the one named in the mechanism's documentation; on an older directory the
    encrypted record will not go through and the machine will not lay the password at all.

    That is a worse situation than a password recorded plainly, and so the item does not
    belong to the class without disruption despite the absence of visible effects for the
    user. The order is deciding here: the directory first, the machines after.

    The way of reading the password needs checking too. Tools reading the attribute
    directly, past the mechanism provided for the purpose, will see illegible data after
    the change. That concerns own scripts and tools more often than the maker's tools.

    Beyond those two cases the change is invisible. The user's work does not change in any
    way.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - encryption-and-tls
    - scripting-and-automation
  what_breaks:
    pl:
      - Na katalogu starszego wydania hasło przestaje być odkładane w ogóle
      - Skrypty odczytujące atrybut wprost zobaczą dane nieczytelne
      - Narzędzia przewidziane do odczytu hasła działają bez zmiany
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - On a directory of an older edition the password stops being laid at all
      - Scripts reading the attribute directly will see illegible data
      - Tools provided for reading the password work unchanged
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Katalog jest w wydaniu nieobsługującym zapisu zaszyfrowanego
      - Hasła są odczytywane własnymi skryptami sięgającymi po atrybut wprost
    en:
      - The directory is of an edition not supporting an encrypted record
      - Passwords are read by own scripts reaching for the attribute directly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ADPasswordEncryptionEnabled'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'ADPasswordEncryptionEnabled' -ErrorAction SilentlyContinue).'ADPasswordEncryptionEnabled'
    [pscustomobject]@{
      path        = $path
      name        = 'ADPasswordEncryptionEnabled'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ADPasswordEncryptionEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-concepts-overview

notes:
  pl: |
    Ustawienie dotyczy wyłącznie hasła odkładanego do katalogu w sieci.
    Przy przechowywaniu w katalogu w chmurze hasło jest szyfrowane zawsze
    i ta wartość nie ma tam zastosowania — reguła pozostaje jednak
    nieszkodliwa, bo zapisanie jej niczego nie psuje.

    Osobne ustawienie wskazuje podmiot, dla którego hasło jest szyfrowane.
    Bez jego przemyślenia szyfrowanie zadziała, ale prawo odczytu dostanie
    grupa szersza, niż zamierzono. Nie jest to przedmiot tej reguły, ale jest
    pytaniem, które trzeba zadać przy tej samej okazji.

    Wszystkie ustawienia tego mechanizmu leżą w jednym kluczu.

    Brak wartości nie jest stanem zgodnym, bo domyślnie hasło jest odkładane
    jawnie.
  en: |
    The setting concerns the password laid into the directory in the network alone. With
    keeping in the directory in the cloud the password is always encrypted and that value
    does not apply there - the rule stays harmless all the same, since recording it spoils
    nothing.

    A separate setting names the principal the password is encrypted for. Without thinking
    it through the encryption will work, but the right to read will go to a wider group
    than was meant. That is not this rule's subject, but it is a question to be asked on the
    same occasion.

    All the settings of that mechanism lie in one key.

    A missing value is not a compliant state, since by default the password is laid
    plainly.
