id: win2016-firewall-outbound-default-allow

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Domyślne zachowanie dla połączeń wychodzących ustalone wprost
    en: The default behaviour for outbound connections settled outright
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje wprost, że połączenia wychodzące są przepuszczane,
    zamiast zostawiać tę decyzję jako nierozstrzygniętą.

    Punkt ten różni się od pozostałych w bloku, bo nie zamyka żadnej drogi.
    Zapisuje stan, który i tak obowiązuje. Jego wartość jest wyłącznie
    porządkowa i warto to powiedzieć od razu, zamiast dorabiać uzasadnienie
    zabezpieczające tam, gdzie go nie ma.

    Rzecz, o którą tu chodzi, to różnica między „ustawione na przepuszczanie"
    a „nieustawione". Zachowanie jest w obu przypadkach takie samo, ale
    znaczenie inne: pierwsze jest decyzją, drugie jej brakiem. Przy
    przeglądzie konfiguracji, przy zmianie zasad grupy albo przy sporze o to,
    czy coś zostało skonfigurowane, różnica ta przestaje być teoretyczna.

    Drugi powód jest praktyczny. Ustawienie nierozstrzygnięte może zostać
    nadpisane przez zasadę przychodzącą z zewnątrz, a ustawione wprost
    pokazuje, że ktoś się nad tym zastanawiał. Jest to zabezpieczenie przed
    przypadkiem, nie przed napastnikiem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Punkt należy do porządku konfiguracji, a nie do odpierania
    zagrożeń, i tak jest oceniony.
  en: |
    The setting writes down outright that outbound connections are let through,
    instead of leaving that decision unsettled.

    This item differs from the rest of the block in shutting no road. It writes down
    a state that holds anyway. Its value is one of tidiness alone, and that is worth
    saying at once rather than working up a security justification where there is
    none.

    What is at stake here is the difference between "set to let through" and "not
    set". The behaviour is the same in both cases, but the meaning is not: the first
    is a decision, the second the want of one. At a review of configuration, at a
    change of group policy, or in an argument over whether something was configured,
    that difference ceases to be theoretical.

    The second reason is practical. An unsettled setting can be overwritten by a
    policy arriving from outside, while one set outright shows that somebody gave it
    thought. It is a safeguard against accident rather than against an attacker.

    What an attacker gains while the item goes unmet: nothing directly. The item
    belongs to the tidiness of configuration rather than to the warding off of
    threats, and it is judged so.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to jeden z nielicznych punktów w bloku
    zapory, przy którym można to powiedzieć bez zastrzeżeń.

    Zmiana ustawia wartość, która odpowiada zachowaniu dotychczasowemu. Nic
    nie zaczyna być blokowane, nic nie przestaje działać, nikt niczego nie
    zauważy. Restartu nie ma, cofnięcie jest natychmiastowe.

    Jedyny przypadek wart odnotowania jest odwrotny do zwykłego: maszyna,
    na której ktoś świadomie ustawił blokowanie połączeń wychodzących.
    Zmiana na przepuszczanie osłabiłaby wtedy konfigurację ostrzejszą od
    wymaganej. Audyt rozpoznaje ten stan osobno i nazywa go wprost, żeby nie
    pomylić go z brakiem konfiguracji — a decyzja, czy go cofać, należy do
    operatora.

    Czego to nie psuje: niczego. Zachowanie maszyny pozostaje takie samo.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", and it is one of the few items in the firewall
    block where that can be said without reservation.

    The change sets a value answering to the behaviour hitherto. Nothing begins to
    be blocked, nothing stops working, nobody will notice a thing. There is no
    restart and undoing is immediate.

    The one case worth noting is the reverse of the usual: a machine where somebody
    deliberately set outbound connections to be blocked. Changing to letting through
    would then weaken a configuration stricter than required. The audit recognises
    that state apart and names it outright, so that it is not mistaken for a want of
    configuration - and the decision whether to undo it belongs to the operator.

    What this does not break: nothing. The machine's behaviour stays the same.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Zachowanie maszyny pozostaje takie samo, bo zmiana zapisuje stan, który i tak obowiązuje
      - Na maszynie ze świadomie ustawionym blokowaniem połączeń wychodzących zmiana osłabiłaby konfigurację ostrzejszą od wymaganej
      - Audyt nazywa ten przypadek osobno, więc nie pomyli go z brakiem konfiguracji
      - Połączenia przychodzące, reguły zapory i profile sieciowe pozostają bez zmian
    en:
      - The machine's behaviour stays the same, since the change writes down a state that holds anyway
      - On a machine with outbound connections deliberately set to be blocked, the change would weaken a configuration stricter than required
      - The audit names that case apart, so it will not be mistaken for a want of configuration
      - Inbound connections, firewall rules and network profiles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie świadomie ustawiono blokowanie połączeń wychodzących i konfiguracja ta ma zostać utrzymana
      - Zasady grupy ustalają to zachowanie inaczej i zmiana lokalna zostałaby przy najbliższym odświeżeniu nadpisana
    en:
      - Outbound connections have deliberately been set to be blocked on the machine and that configuration is to be kept
      - Group policy settles this behaviour otherwise and a local change would be overwritten at the next refresh
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three outcomes are told apart, because they mean different things - an
      # explicit letting through, a blocking somebody set deliberately, and a state
      # left unsettled. The profiles they came from are named.
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $blocking = @($profiles | Where-Object { $_.DefaultOutboundAction -eq 'Block' })
        $unset = @($profiles | Where-Object { $_.DefaultOutboundAction -eq 'NotConfigured' })
        if ($blocking.Count -gt 0) { 'BLOCKING_IN_' + ($blocking.Name -join '_') }
        elseif ($unset.Count -gt 0) { 'NOT_CONFIGURED_IN_' + ($unset.Name -join '_') }
        else { 'ALL_ALLOW' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_ALLOW'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, DefaultOutboundAction |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultOutboundAction Allow

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -DefaultOutboundAction $p.DefaultOutboundAction
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt jest przykładem reguły, której uczciwy opis musi mówić, że wartość
    jest porządkowa. Dorabianie uzasadnienia zabezpieczającego tam, gdzie go
    nie ma, psuje zaufanie do całej reszty listy — a to właśnie zaufanie jest
    tu jedynym kapitałem.

    Kategoria niska jest nadana świadomie i nie należy jej podnosić przez
    sąsiedztwo z punktami o wadze krytycznej w tym samym bloku. Zapora jako
    taka jest krytyczna; zapisanie domyślnego zachowania dla ruchu
    wychodzącego nie.

    Audyt rozróżnia trzy stany zamiast dwóch, bo blokowanie ustawione
    świadomie i brak ustawienia to nie to samo. Pierwsze jest decyzją
    ostrzejszą od wymaganej i aplikacja nie powinna popychać do jej
    cofnięcia; drugie jest tym, co ta reguła naprawia.
  en: |
    The item is an example of a rule whose honest description must say that its
    value is one of tidiness. Working up a security justification where there is
    none spoils trust in the whole rest of the list - and trust is the only capital
    here.

    The low category is given deliberately and is not to be raised by neighbourhood
    with items of critical weight in the same block. The firewall as such is
    critical; writing down the default behaviour for outbound traffic is not.

    The audit tells three states apart rather than two, since blocking set
    deliberately and a want of setting are not the same. The first is a decision
    stricter than required and the application should not push towards undoing it;
    the second is what this rule mends.
