id: win2025-find-my-device-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Find My Device
  title:
    pl: Odnajdywanie urządzenia przez konto producenta wyłączone
    en: Locating the device through the maker's account disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zapisuje w polityce odmowę odnajdywania tej maszyny przez konto
    producenta.

    Zostawiam kategorię niską, ale nie z powodu, dla którego obniżyłem
    ją przy ustalaniu położenia. Tam chodziło o to, że serwer się nie
    przemieszcza. Tu chodzi o coś innego i warto to rozdzielić, bo oba
    punkty mówią o odnajdywaniu.

    Mechanizm ten nie tylko pokazuje, gdzie urządzenie jest. Pozwala też
    wydać mu polecenie z zewnątrz — z konta, z dowolnego miejsca,
    przez stronę producenta. Na serwerze znaczyłoby to, że istnieje
    droga wpływu na maszynę, która nie prowadzi ani przez domenę, ani
    przez sieć organizacji, ani przez żaden z kanałów administracyjnych,
    o które ktoś dba. Prowadzi przez konto, którego polityka haseł nie
    obejmuje.

    Ograniczenie tej drogi jest realne i mówię o nim wprost, bo wpływa
    na ocenę: mechanizm wymaga konta producenta zalogowanego na maszynie
    i włączonego przez użytkownika. Na typowym serwerze tego nie ma,
    więc punkt pilnuje możliwości, a nie stanu. Jest to ta sama uwaga,
    którą zapisałem przy instalowaniu zleconym z innego urządzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wpływu na maszynę prowadzącą z zewnątrz organizacji, pod warunkiem
    zdobycia konta producenta, a nie konta w domenie.
  en: |
    The item writes into the rule a denying of the finding of that machine through a maker's standing.

    I leave the category low, but not for the ground whereby I lowered it at the settling of the
    whereabouts. There it was that a server moves not about. Here it is another thing and worth the
    sundering, both items speaking of finding.

    That working shows not only where the device is. It lets a bidding be given to it from without -
    off a standing, from any stead whatever, through the maker's page. Upon a server that would mean
    there is a road of sway over the machine that leads neither through the household, nor through the
    net of the stead of work, nor through any of the channels of ruling that somebody sees to. It leads
    through a standing that the rule of watchwords takes not in.

    The bound of that road is a true one and I name it outright, it telling upon the reckoning - the
    working takes a maker's standing signed in upon the machine and switched on by the user. Upon a
    wonted server that is not there, so the item wards a possibility and not a state. It is the same
    note I set down at the installing ordered from another device.

    What an attacker gains while the item goes unmet - a road of sway over the machine leading from
    outside the household, upon the winning of a maker's standing and not of a standing within it.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Nie umiem wskazać na serwerze
    nikogo, kto by tej maszyny szukał w ten sposób, ani zadania, które
    przez tę zmianę się nie wykona.

    Warto natomiast zauważyć rzecz odwrotną, tak samo jak przy
    instalowaniu zleconym z innego urządzenia. Jeżeli ten punkt wypada
    jako niespełniony i mechanizm jest faktycznie włączony, to znaczy,
    że na serwerze produkcyjnym zalogowane jest konto producenta i ktoś
    je świadomie do tego dopuścił. Sam ten fakt jest ustaleniem
    ważniejszym niż niniejsza reguła, bo droga wpływu przez takie konto
    nie kończy się na odnajdywaniu.

    Punkt nie wymaga przerwy, bo zapisywana jest wartość w polityce.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease". I can name upon a server nobody who would seek that machine in
    such a way, and no task that will go undone by that change.

    It is worth marking, though, the thing the other way about, as at the installing ordered from
    another device. If that item come out as unmet and the working be truly switched on, that means
    upon a server of work there is a maker's standing signed in and somebody wittingly let it thereto.
    That fact in itself is a settling weightier than this rule, the road of sway through such a
    standing not ending at the finding.

    The item takes no break, a worth being written into the rule.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - accounts-and-passwords
  what_breaks:
    pl:
      - Przestaje być możliwe odnalezienie tej maszyny i wydanie jej polecenia przez konto producenta
      - Na serwerze nie ma nikogo, kto by tej maszyny szukał w ten sposób
      - Mechanizm wymaga konta producenta zalogowanego na maszynie, więc punkt pilnuje możliwości, a nie stanu
      - Obecność takiego konta na serwerze produkcyjnym jest ustaleniem ważniejszym niż sama ta reguła
    en:
      - The finding of that machine and the giving of a bidding to it through a maker's standing stop being open to anybody
      - Upon a server there is nobody who would seek that machine in such a way
      - The working takes a maker's standing signed in upon the machine, so the item wards a possibility and not a state
      - The being of such a standing upon a server of work is a settling weightier than this rule itself
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest komputerem przenośnym wydanym poza siedzibę i odnajdywanie jest częścią ustalonej procedury
    en:
      - The machine is a bearable reckoner given out beyond the seat and the finding is a share of a settled ordering
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice'
      $name = 'AllowFindMyDevice'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice'
    $name = 'AllowFindMyDevice'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is not only about showing where the machine is: the mechanism lets a
    # command be given to it from outside, through an account the password
    # policy does not cover.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowFindMyDevice' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Rozdzielenie wobec punktów o ustalaniu położenia: tam chodziło o to,
    że serwer się nie przemieszcza. Tu chodzi o to, że mechanizm pozwala
    wydać maszynie polecenie z zewnątrz — przez konto, którego polityka
    haseł nie obejmuje, z pominięciem domeny i kanałów administracyjnych.

    Ograniczenie wpływające na ocenę: mechanizm wymaga konta producenta
    zalogowanego na maszynie, więc punkt pilnuje możliwości, a nie stanu.
    Ta sama uwaga, co przy instalowaniu zleconym z innego urządzenia.

    Rzecz odwrotna: jeżeli punkt wypada jako niespełniony, droga wpływu
    przez takie konto nie kończy się na odnajdywaniu.
  en: |
    The sundering from the items on the settling of whereabouts - there it was that a server moves not
    about. Here it is that the working lets a bidding be given to the machine from without - through a
    standing that the rule of watchwords takes not in, with a passing by of the household and of the
    channels of ruling.

    The bound that tells upon the reckoning - the working takes a maker's standing signed in upon the
    machine, so the item wards a possibility and not a state. The same note as at the installing
    ordered from another device.

    The thing the other way about - if the item come out as unmet, the road of sway through such a
    standing ends not at the finding.
