    odwrotna niż zwykle — najpierw rozmiar i położenie pliku dziennika
    oraz zapas na woluminie, potem włączenie zapisu.
  en: |
    I raise not the category wittingly - the writing down blocks nothing, and a warding working I tell
    of by what it is and not by how highly I hold it. The same ground as at the gathering of logs.

    The writing of turnings-away says who knocked and was sent off. The writing of bindings let through
    says who truly spoke with the machine - upon a server it is the one writing on the spot that answers
    whence came the thing that befell. The second good bears upon traffic going out that nobody planned.

    I raise the class upon a ground only of amount - a server takes in within a minute as many bindings
    as a workstation in a day. The ordering is the other way about than it mostly is - first the size
    and stead of the file of the log and the store upon the roll, then the switching on of the writing.
