id: win2025-device-metadata-retrieval-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Blokada pobierania opisów urządzeń z internetu
    en: Device descriptions not fetched from the internet
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje pobieranie z internetu opisów podłączanych urządzeń —
    nazw handlowych, ikon i danych producenta, którymi system uzupełnia
    wygląd listy urządzeń.

    Kategoria niska i chcę być tu szczery: to nie jest pobieranie
    sterowników i nie ma tu nic, co wykonywałoby się na maszynie. Opis
    urządzenia jest opisem — nazwą i obrazkiem.

    Wartość jest dwojaka i obie strony są skromne. Po pierwsze, znika
    połączenie wychodzące, które nawiązuje się w chwili podłączenia
    urządzenia — a więc w chwili dla serwera nietypowej i wartej uwagi.
    Po drugie, przestaje wychodzić informacja o tym, jaki sprzęt został do
    tej maszyny podpięty i kiedy.

    Na serwerze sprzęt podłącza się rzadko i zwykle w chwilach, o których
    warto wiedzieć: przy wymianie dysku, przy podpięciu nośnika, przy
    pracach w serwerowni. Właśnie dlatego zdarzenie „coś podłączono"
    powinno zostawać w organizacji, a nie generować przy okazji zapytanie
    na zewnątrz. Nie jest to obrona przed atakiem i nie będę tego tak
    nazywał — to porządek w tym, co serwer wysyła i kiedy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Jest to reguła porządkowa i tak ją oceniam.
  en: |
    The item blocks the fetching from the internet of descriptions of
    connected devices - trade names, icons and maker's details with which
    the system fills out the look of the device list.

    The category is low, and I want to be honest: this is not the fetching
    of drivers, and there is nothing here that runs on the machine. A device
    description is a description - a name and a picture.

    Its value is twofold, and both sides are modest. First, an outbound
    connection disappears that is opened at the moment a device is connected
    - that is, at a moment unusual for a server and worth attention. Second,
    information stops going out about what hardware was attached to this
    machine and when.

    On a server hardware is attached rarely, and usually at moments worth
    knowing about: replacing a disk, attaching a medium, work in the server
    room. That is precisely why the event "something was connected" should
    stay inside the organisation rather than generate a query outwards
    alongside. This is not a defence against an attack and I will not call
    it one - it is order in what the server sends and when.

    What an attacker gains while the item goes unmet: nothing directly. This
    is a rule of good order and I rate it as such.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i uzasadnienie mieści się w jednym zdaniu:
    urządzenia działają dalej, zmienia się tylko to, jak są podpisane.

    Rozwinę je jednak, bo różnica między „nie działa" a „wygląda inaczej"
    bywa źródłem niepotrzebnego zgłoszenia. Po zmianie urządzenie zostanie
    rozpoznane, sterownik zostanie zainstalowany, sprzęt będzie pracować
    normalnie — ale na liście urządzeń pojawi się pod nazwą ogólną zamiast
    handlowej, bez ikony producenta. Administrator, który po podłączeniu
    macierzy zobaczy pozycję opisaną ogólnie, może uznać, że coś poszło nie
    tak. Nie poszło.

    Wpisuję ten skutek jako widoczny dla człowieka właśnie dlatego, żeby
    aplikacja pokazała go przed wykonaniem, a nie żeby ktoś odkrywał go
    w trakcie prac w serwerowni.

    Osobno warto pamiętać, że reguła ta nie wpływa na pobieranie
    sterowników. Sterowniki przychodzą osobną drogą i ta zmiana ich nie
    dotyka — maszyna, która dotąd sama dobierała sterownik do nowego
    urządzenia, będzie robić to nadal.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and the justification fits in one
    sentence: devices go on working, only their labelling changes.

    I will expand it, though, because the difference between "does not work"
    and "looks different" is sometimes the source of a needless ticket.
    After the change a device will be recognised, a driver will be
    installed, the hardware will work normally - but it will appear in the
    device list under a generic name rather than a trade one, without the
    maker's icon. An administrator who attaches a disk array and sees an
    entry described generically may decide something went wrong. It did not.

    I record this effect as visible to a person precisely so that the
    application shows it before execution, rather than somebody discovering
    it in the middle of work in the server room.

    It is worth remembering separately that this rule does not affect the
    fetching of drivers. Drivers come by a different road and this change
    does not touch it - a machine that has been picking a driver for a new
    device by itself will go on doing so.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Urządzenia działają dalej — zmienia się wyłącznie to, jak są podpisane na liście urządzeń
      - Sprzęt pojawia się pod nazwą ogólną zamiast handlowej i bez ikony producenta
      - Administrator, który po podłączeniu macierzy zobaczy pozycję opisaną ogólnie, może uznać, że coś poszło nie tak
      - Pobieranie sterowników idzie osobną drogą i ta zmiana go nie dotyka
    en:
      - Devices go on working - only the way they are labelled in the device list changes
      - Hardware appears under a generic name rather than a trade one, and without the maker's icon
      - An administrator who attaches a disk array and sees a generically described entry may decide something went wrong
      - The fetching of drivers goes by a different road and this change does not touch it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Rozpoznawanie sprzętu po nazwie handlowej na liście urządzeń jest w tej organizacji częścią procedury inwentaryzacji
    en:
      - Recognising hardware by its trade name in the device list is part of the stock-taking procedure in this organisation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
      $name = 'PreventDeviceMetadataFromNetwork'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
    $name = 'PreventDeviceMetadataFromNetwork'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Descriptions only, not drivers - hardware goes on working and picking up
    # its driver the same way. What changes is the labelling in the device list:
    # generic names instead of trade ones.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PreventDeviceMetadataFromNetwork' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-metadata-retrieval-client

notes:
  pl: |
    To nie jest pobieranie sterowników i nie ma tu nic, co wykonywałoby się
    na maszynie. Opis urządzenia jest opisem — nazwą i obrazkiem.

    Wartość jest skromna i dwojaka: znika połączenie wychodzące nawiązywane
    w chwili podłączenia urządzenia, a więc w chwili dla serwera
    nietypowej, i przestaje wychodzić informacja o tym, jaki sprzęt
    podpięto i kiedy. Na serwerze sprzęt podłącza się rzadko i zwykle
    w chwilach, o których warto wiedzieć.

    Skutek widoczny dla człowieka odnotowuję po to, żeby nie odkrywał go
    w trakcie prac w serwerowni: urządzenie będzie działać, ale pod nazwą
    ogólną. To nie jest objaw usterki.
  en: |
    This is not the fetching of drivers, and there is nothing here that runs
    on the machine. A device description is a description - a name and a
    picture.

    The value is modest and twofold: an outbound connection disappears that
    is opened at the moment a device is connected, a moment unusual for a
    server, and information stops going out about what hardware was attached
    and when. On a server hardware is attached rarely, and usually at
    moments worth knowing about.

    I record the effect visible to a person so that nobody discovers it in
    the middle of work in the server room: the device will work, but under a
    generic name. That is not a symptom of a fault.
