id: win11-location-services-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Location and Sensors
  title:
    pl: Ustalanie położenia maszyny wyłączone
    en: Establishing the machine's position switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    System potrafi ustalić, gdzie maszyna fizycznie się znajduje, i udostępnia
    tę informację programom. Robi to nie przez odbiornik satelitarny, którego
    większość komputerów nie ma, lecz przez otoczenie sieciowe: widoczne
    nadajniki bezprzewodowe i adres, z którego maszyna wychodzi do sieci.

    Dla bezpieczeństwa liczy się to, że położenie jest daną o człowieku, a nie
    o maszynie. Komputer przenośny opisuje przez cały czas miejsce pobytu
    osoby, która go nosi: adres biura, adres domowy, trasę, godziny. Zebrane
    w czasie, dane te opisują rozkład dnia — a to jest materiał do
    przygotowania kontaktu, który ma wyglądać wiarygodnie.

    Drugą stroną jest liczba programów mających do tej informacji dostęp.
    Położenie jest udostępniane przez wspólny mechanizm, więc sięga po nie
    każdy program, który poprosi — w tym zainstalowany przy okazji czegoś
    innego.

    Punkt wyłącza mechanizm w całości, dla wszystkich programów naraz.
  en: |
    The system can establish where the machine physically is and makes that available
    to programs. It does so not through a satellite receiver, which most computers do
    not have, but through the network surroundings: the wireless transmitters in
    sight and the address the machine goes out to the network from.

    What matters for security is that a position is a fact about a person, not about
    a machine. A portable computer describes at all times the whereabouts of whoever
    carries it: the office address, the home address, the route, the hours. Gathered
    over time, that data describes a daily pattern - and that is material for
    preparing an approach meant to look credible.

    The other side is the number of programs with access to it. Position is made
    available through a shared mechanism, so any program that asks can reach for it -
    including one installed in passing alongside something else.

    The item switches the mechanism off entirely, for every program at once.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy któryś z używanych programów nie opiera się na
    położeniu maszyny.

    Najczęstszy przypadek to nie mapy, tylko rzeczy mniej oczywiste: pogoda na
    pulpicie, automatyczne ustawianie strefy czasowej, wyszukiwanie oddziałów
    albo punktów odbioru w aplikacji firmowej, funkcja odnajdywania zgubionego
    komputera. Ostatnia jest warta osobnej uwagi — po wdrożeniu przestaje
    działać, a jej brak zauważa się dopiero wtedy, gdy jest potrzebna.

    Automatyczna strefa czasowa jest drugim częstym skutkiem. Na maszynie
    podróżującej trzeba ją będzie ustawiać ręcznie, a niepoprawna strefa
    potrafi popsuć uwierzytelnianie oparte na czasie.

    Poza tymi przypadkami nie przestaje działać nic. Na stanowisku stacjonarnym
    zmiana jest niewidoczna.

    Nie ma restartu.
  en: |
    What needs checking is whether any program in use rests on the machine's
    position.

    The commonest case is not maps but less obvious things: weather on the desktop,
    setting the time zone automatically, finding branches or collection points in a
    company application, the feature for locating a lost computer. The last deserves
    separate attention - after the rollout it stops working, and its absence is
    noticed only when it is needed.

    The automatic time zone is the second common effect. On a travelling machine it
    will have to be set by hand, and a wrong zone can break time-based
    authentication.

    Outside those cases nothing stops working. At a stationary station the change is
    invisible.

    There is no restart.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Automatyczne ustawianie strefy czasowej przestanie działać i trzeba ją będzie ustawiać ręcznie
      - Funkcja odnajdywania zgubionego komputera przestanie zgłaszać położenie
      - Programy pokazujące pogodę, oddziały albo punkty odbioru przestaną rozpoznawać, gdzie jest maszyna
      - Na stanowisku stacjonarnym zmiana jest niewidoczna
    en:
      - Setting the time zone automatically stops working and it will have to be set by hand
      - The feature for locating a lost computer stops reporting a position
      - Programs showing weather, branches or collection points stop recognising where the machine is
      - At a stationary station the change is invisible
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Komputery przenośne są odnajdywane po zgubieniu na podstawie zgłaszanego położenia
      - Aplikacja firmowa dobiera dane na podstawie miejsca, w którym pracuje użytkownik
    en:
      - Portable computers are located after being lost from the position they report
      - A company application picks its data from where the user is working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
      $name = 'DisableLocation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    $name = 'DisableLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Ustawienie istnieje w odmianie maszynowej i użytkownika pod tą samą nazwą
    wpisu, w innych gałęziach. Reguła czyta odmianę maszynową, bo tylko ona
    obowiązuje niezależnie od tego, kto jest zalogowany.

    Punkt wyłącza mechanizm dla wszystkich programów naraz i tym różni się od
    ustawień przyznających dostęp do położenia pojedynczym aplikacjom. Te
    ostatnie stają się po wdrożeniu bezprzedmiotowe, ale benchmark wymienia je
    osobno.

    Wyłączenie nie dotyczy odbiornika satelitarnego wbudowanego w niektóre
    komputery przenośne, jeżeli program sięga po niego z pominięciem mechanizmu
    systemowego. Jest to rzadkie i dotyczy oprogramowania specjalistycznego,
    ale warto o tym wiedzieć, zanim uzna się położenie za zamknięte.
  en: |
    The setting exists in a machine and a user variant under the same entry name, in
    different keys. The rule reads the machine variant, because only that one holds
    whoever is logged on.

    The item switches the mechanism off for every program at once, and in that it
    differs from the settings granting access to position to individual applications.
    Those become moot after the rollout, but the benchmark lists them separately.

    Switching it off does not touch a satellite receiver built into some portable
    computers, if a program reaches for it while bypassing the system's mechanism.
    That is rare and concerns specialist software, but worth knowing before position
    is taken to be closed off.
