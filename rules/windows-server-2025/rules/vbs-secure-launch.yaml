id: win2025-vbs-secure-launch

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Bezpieczny start warstwy wirtualizacji włączony
    en: Secure launch of the virtualisation layer switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza bezpieczny start warstwy wirtualizacji: procesor
    przejmuje kontrolę nad rozruchem w znanym stanie i dopiero od tego
    miejsca uruchamia warstwę zabezpieczeń, zamiast ufać wszystkiemu,
    co wykonało się przed nim.

    Zostawiam kategorię wysoką i chcę nazwać, czego ten punkt dotyczy,
    bo dotyczy warstwy, której reszta tej paczki w ogóle nie obejmuje.

    Wszystkie pozostałe reguły mówią o systemie: o usługach, politykach,
    uprawnieniach, dziennikach. Ta mówi o tym, co dzieje się, zanim
    system istnieje. Między włączeniem zasilania a startem systemu
    wykonuje się oprogramowanie układowe, a w nim tryb zarządzania
    pracujący z uprawnieniami wyższymi niż jądro i niewidoczny dla
    niczego, co jądro ma do dyspozycji. Kod, który się tam usadowi,
    przeżywa przeinstalowanie systemu, bo nie leży na dysku, którego
    formatujemy.

    Na serwerze ta warstwa jest istotniejsza niż gdziekolwiek indziej,
    bo jest zarazem warstwą, w której żyje kontroler zarządzania — ta
    część maszyny, która ma własny adres w sieci, własne hasło i działa
    również wtedy, gdy serwer jest wyłączony. Rozmawiamy więc nie
    o abstrakcji, tylko o konkretnym, wystawionym na sieć elemencie
    maszyny, którego żaden mechanizm po stronie systemu nie sprawdza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    umieszczenia się poniżej systemu — w miejscu, w którym nie sięga go
    żadne narzędzie działające w systemie i skąd przetrwa jego
    przeinstalowanie.
  en: |
    The item switches on secure launch of the virtualisation layer: the processor
    takes control of the boot in a known state and only from that point starts the
    security layer, rather than trusting everything that ran before it.

    I keep the category high, and I want to name what this item covers, because it
    covers a layer the rest of this pack does not touch at all.

    Every other rule talks about the system: services, policies, privileges, logs.
    This one talks about what happens before the system exists. Between switching
    on the power and starting the system the firmware runs, and within it a
    management mode working with privileges higher than the kernel's and invisible
    to anything the kernel has available. Code that settles there survives a
    reinstall of the system, because it does not sit on the disk we format.

    On a server this layer matters more than anywhere else, because it is also the
    layer where the management controller lives - the part of the machine that has
    its own network address, its own password, and works even when the server is
    switched off. So this is not an abstraction but a concrete, network-facing
    element of the machine that no mechanism on the system side checks.

    What an attacker gains while the item goes unmet: the ability to place
    themselves below the system - in a place no tool running within the system
    reaches, and from which they survive its reinstall.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia". Skutek w normalnej
    pracy jest zerowy — ta zmiana niczego nie blokuje, nie odmawia
    żadnemu programowi ani sterownikowi i nie zmienia sposobu pracy.
    Klasa bierze się wyłącznie z tego, kiedy i jak się objawia.

    Objawia się przy rozruchu, a nieudany rozruch na serwerze jest
    najdroższym rodzajem awarii. Wymagania są sprzętowe: procesor musi
    wspierać przejęcie kontroli nad rozruchem, a oprogramowanie układowe
    musi to poprawnie obsługiwać. Sprzęt starszy albo firmware
    z zaniedbanym uaktualnieniem daje maszynę, która po zmianie nie
    wstaje — i nie robi tego w sposób, który cokolwiek tłumaczy, bo na
    tym etapie nie ma jeszcze kto niczego zapisać.

    Dlatego droga do konsoli jest tu, tak jak przy pozostałych punktach
    tej grupy, warunkiem wykonania, a nie ostrożnością. Dochodzi jednak
    rzecz, o której warto pamiętać osobno: jeżeli ta zmiana zablokuje
    rozruch, to naprawa idzie przez oprogramowanie układowe, a nie przez
    system. Środowisko naprawcze systemu może się wtedy nie uruchomić.

    Praktyczną konsekwencją jest zalecenie kolejności: uaktualnienie
    oprogramowania układowego do wersji wspieranej przez producenta
    wykonuje się przed tą zmianą, a nie po niej, kiedy będzie już
    potrzebne pilnie.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I keep the class "needs a planned rollout". The effect in normal operation is
    zero - this change blocks nothing, refuses no program or driver, and does not
    alter the way anyone works. The class comes solely from when and how it shows
    itself.

    It shows itself at boot, and a failed boot on a server is the most expensive
    kind of outage. The requirements are in hardware: the processor must support
    taking control of the boot, and the firmware must handle it correctly. Older
    hardware, or firmware whose updates were neglected, gives a machine that does
    not come up after the change - and it does so in a way that explains nothing,
    because at that stage there is nobody yet to write anything down.

    That is why the route to the console is here, as with the other items in this
    group, a condition of execution rather than a precaution. One thing is worth
    remembering separately, though: if this change blocks the boot, the repair goes
    through the firmware, not through the system. The system recovery environment
    may then fail to start at all.

    The practical consequence is a recommendation about order: updating the
    firmware to a version supported by the vendor is done before this change, not
    after it, when it will already be needed urgently.

    The change binds after a restart and is undone after another one.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Sprzęt starszy albo oprogramowanie układowe bez uaktualnienia daje maszynę, która po zmianie nie wstaje
      - Nieudany rozruch nie tłumaczy się niczym, bo na tym etapie nie ma jeszcze kto niczego zapisać
      - Naprawa idzie wtedy przez oprogramowanie układowe, a środowisko naprawcze systemu może się nie uruchomić
      - W normalnej pracy skutek jest zerowy — zmiana niczego nie blokuje i nie odmawia żadnemu programowi ani sterownikowi
    en:
      - Older hardware or firmware without an update gives a machine that does not come up after the change
      - A failed boot explains nothing, because at that stage there is nobody yet to write anything down
      - The repair then goes through the firmware, and the system recovery environment may fail to start at all
      - In normal operation the effect is zero - the change blocks nothing and refuses no program or driver
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie układowe nie zostało uaktualnione do wersji wspieranej przez producenta maszyny
      - Nie ma sprawdzonej drogi dostępu do konsoli ani do oprogramowania układowego maszyny
    en:
      - The firmware has not been updated to a version supported by the machine's vendor
      - There is no proven route to the machine's console or to its firmware
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ConfigureSystemGuardLaunch'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    $name = 'ConfigureSystemGuardLaunch'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The effect appears only after a restart, and the machine may fail to
    # start where the hardware or the firmware does not meet the demands. Bring
    # the firmware up to a supported version before this change, not after,
    # when it will be needed in a hurry.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConfigureSystemGuardLaunch' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/system-guard-secure-launch-and-smm-protection

notes:
  pl: |
    Punkt dotyczy warstwy, której reszta paczki w ogóle nie obejmuje:
    tego, co dzieje się, zanim system istnieje. Kod, który usadowi się
    w oprogramowaniu układowym, przeżywa przeinstalowanie systemu,
    bo nie leży na dysku, który formatujemy.

    Na serwerze jest to zarazem warstwa, w której żyje kontroler
    zarządzania — część maszyny z własnym adresem w sieci, własnym
    hasłem i działająca, gdy serwer jest wyłączony.

    W normalnej pracy skutek zerowy; klasa bierze się wyłącznie z tego,
    kiedy się objawia. Nieudany rozruch niczego nie tłumaczy, bo nie ma
    jeszcze kto zapisać. Uaktualnienie oprogramowania układowego robi się
    przed tą zmianą, nie po niej.
  en: |
    The item covers a layer the rest of the pack does not touch at all: what
    happens before the system exists. Code that settles in the firmware survives a
    reinstall of the system, because it does not sit on the disk we format.

    On a server it is also the layer where the management controller lives - a part
    of the machine with its own network address, its own password, working when the
    server is switched off.

    In normal operation the effect is zero; the class comes solely from when it
    shows itself. A failed boot explains nothing, because there is nobody yet to
    write it down. The firmware update is done before this change, not after it.
