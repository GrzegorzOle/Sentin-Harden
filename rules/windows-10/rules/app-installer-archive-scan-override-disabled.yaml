id: win10-app-installer-archive-scan-override-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Pomijanie badania archiwum przed instalacją zablokowane
    en: The passing over of the searching of an archive before installing blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość zainstalowania pakietu z archiwum
    z pominięciem badania jego zawartości przez ochronę.

    Instalator pakietów potrafi przyjąć archiwum leżące na dysku albo na
    nośniku i wydobyć z niego zawartość. Zanim to zrobi, przekazuje plik
    do zbadania przez ochronę — i dopiero po jej zgodzie rozpakowuje.

    Przełącznik, którego dotyczy ten punkt, pozwala ten krok pominąć.
    Powstał dla archiwów bardzo dużych, przy których badanie trwa długo,
    i dla maszyn odciętych od sieci. Cena jest taka, że zawartość trafia
    na dysk niezbadana.

    Archiwum jest przy tym postacią szczególnie wygodną dla napastnika.
    Pozwala przenieść wiele plików jako jeden, ukryć rozszerzenie
    i przejść przez kontrole patrzące na pojedynczy plik, a nie na to, co
    z niego wyjdzie.

    Odnotowuję, że punkt nie wyłącza instalowania z archiwów. Odbiera
    wyłącznie możliwość zrobienia tego bez badania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozpakowanie
    zawartości archiwum na dysk z pominięciem ochrony.
  en: |
    The setting takes away the power of laying on a package out of an archive while the searching of its content
    by the guard is passed over.

    The installer of packages can take an archive lying upon a disk or upon a carrier and draw the content out of
    it. Before it does so it hands the file to the guard to be searched - and unpacks only upon the guard's
    assent.

    The switch this item touches lets that step be passed over. It came about for archives very great, at which
    the searching lasts long, and for machines cut off from the network. The price is that the content comes upon
    the disk unsearched.

    An archive is besides a shape uncommonly handy for an attacker. It lets many files be carried as one, an
    ending be hidden, and controls looking at a single file rather than at what will come out of it be passed
    through.

    I set down that the item switches not off the laying on out of archives. It takes solely the power of doing so
    without a searching.

    What an attacker gains while the item goes unmet: the unpacking of an archive's content upon the disk with the
    guard passed over.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś instaluje z bardzo dużych archiwów albo na maszynach odciętych
    od sieci.

    Miejscem wartym uwagi jest wdrażanie z nośnika na stanowiskach bez
    łącza. Tam badanie bywa wolne albo nie ma jak sięgnąć po dane
    aktualne, i przełącznik bywa włączony jako rozwiązanie trwałe.
    Po zmianie instalacja z takiego archiwum wydłuży się albo zatrzyma.

    Miejscem drugim są pakiety bardzo duże. Badanie kilkugigabajtowego
    archiwum potrafi trwać minuty, co w skrypcie z ustalonym czasem
    oczekiwania kończy się przerwaniem.

    Odnotowuję, że w obu wypadkach odpowiedzią jest zbadanie archiwum
    wcześniej, po stronie przygotowania nośnika, a nie zniesienie zasady
    na maszynach docelowych.

    Skutek pojawia się natychmiast, bez restartu, i dotyczy wyłącznie
    instalacji z archiwum.

    Czego to nie psuje: instalowania pakietów spoza archiwów, programów
    już zainstalowanych, sklepu systemowego, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody lays on out of very great
    archives or upon machines cut off from the network.

    The place worth notice is a rollout from a carrier upon stations without a link. There the searching is at
    times slow or there is no reaching for current data, and the switch is at times turned on as a standing
    answer. After the change the laying on out of such an archive will lengthen or come to a stop.

    The second place is packages very great. The searching of an archive of some gigabytes can last minutes, which
    in a script with a settled time of waiting ends in a breaking off.

    I set down that in both cases the answer is the searching of the archive beforehand, upon the side of the
    making ready of the carrier, and no lifting of the policy upon the machines it is bound for.

    The consequence shows at once, with no restart, and touches solely the laying on out of an archive.

    What this does not break: the laying on of packages outside archives, programs already laid on, the system's
    store, logging on, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - removable-media
  what_breaks:
    pl:
      - Instalacja z nośnika na stanowisku bez łącza wydłuży się albo zatrzyma, gdy badanie nie ma jak sięgnąć po dane aktualne
      - Badanie archiwum kilkugigabajtowego trwa minuty, co w skrypcie z ustalonym czasem oczekiwania kończy się przerwaniem
      - Odpowiedzią jest zbadanie archiwum przy przygotowaniu nośnika, a nie zniesienie zasady na maszynach docelowych
      - Instalowanie pakietów spoza archiwów przebiega tak jak dotąd i nie jest punktem objęte
      - Programy już zainstalowane, sklep systemowy, logowanie, praca programów i drukowanie pozostają bez zmian
    en:
      - The laying on from a carrier upon a station without a link will lengthen or come to a stop where the searching has no reach for current data
      - The searching of an archive of some gigabytes lasts minutes, which in a script with a settled time of waiting ends in a breaking off
      - The answer is the searching of the archive at the making ready of the carrier and no lifting of the policy upon the machines it is bound for
      - The laying on of packages outside archives goes as hitherto and is not held by the item
      - Programs already laid on, the system s store, logging on, the work of programs and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrożenie idzie z nośnika na stanowiska bez łącza, na których ochrona nie ma jak sięgnąć po dane aktualne
    en:
      - The rollout goes from a carrier upon stations without a link, where the guard has no reach for current data
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableLocalArchiveMalwareScanOverride'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableLocalArchiveMalwareScanOverride'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableLocalArchiveMalwareScanOverride' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Reguła należy do tej samej rodziny co punkt o skrótach i warto, żeby
    aplikacja pokazała je obok siebie. Oba odbierają przełączniki
    pozwalające obejść sprawdzenie, oba są niewidoczne dopóki ktoś po
    przełącznik nie sięgnie, i oba żyją w skryptach dłużej niż w czyjejś
    pamięci.

    Argument wart postawienia wprost dotyczy samej postaci archiwum.
    Archiwum pozwala przenieść wiele plików jako jeden i przejść przez
    kontrolę patrzącą na plik, a nie na jego zawartość. Badanie przed
    rozpakowaniem jest jedynym miejscem, w którym widać, co z niego
    wyjdzie.

    Odnotowuję rozwiązanie po stronie przygotowania nośnika. Jeżeli
    badanie na maszynie docelowej jest za wolne albo niemożliwe, właściwym
    miejscem jest przygotowanie, a nie wyłączenie mechanizmu tam, gdzie
    plik ląduje.
  en: |
    The rule belongs to the same kin as the item about digests and it is well that the application show them side
    by side. Both take away switches letting a check be gone about, both are unseen until somebody reaches for the
    switch, and both live in scripts longer than in anybody's memory.

    The argument worth putting outright touches the shape of an archive itself. An archive lets many files be
    carried as one and a control looking at a file rather than at its content be passed through. The searching
    before unpacking is the one place where what will come out of it may be seen.

    I set down the answer upon the side of the making ready of the carrier. If the searching upon the machine it
    is bound for is too slow or not to be had, the right place is the making ready and no switching off of the
    mechanism where the file comes to rest.
