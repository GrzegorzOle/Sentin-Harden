id: win2025-diagnostic-log-collection-limited

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Zbieranie dzienników diagnostycznych ograniczone
    en: Collection of diagnostic logs limited
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza zbieranie dzienników diagnostycznych wysyłanych
    z maszyny do producenta.

    Kategoria średnia, czyli o stopień niżej niż zrzuty pamięci, i chcę
    powiedzieć, skąd ta różnica, bo z nazw obu punktów nie wynika. Zrzut
    pamięci wynosi z maszyny to, czym proces się zajmował — treść. Dziennik
    wynosi to, co maszyna sama o sobie zapisała — zdarzenia.

    Zdarzenia to mniej niż treść, ale nie jest to mało. W dziennikach
    serwera stoją nazwy kont, które się logowały, nazwy komputerów, z których
    przyszły połączenia, ścieżki do udziałów i katalogów, nazwy usług
    i zadań, adresy wewnętrzne. Zebrane razem układają się w opis tego, jak
    ta organizacja jest zbudowana od środka — a to jest ta wiedza, od której
    zaczyna się ruch boczny.

    Jest też rzecz, która na serwerze waży osobno. Dziennik bywa dowodem.
    Jeżeli ten sam materiał jest równocześnie wysyłany na zewnątrz
    mechanizmem, nad którym organizacja nie ma kontroli, to przy poważnym
    zdarzeniu trzeba będzie odpowiedzieć na pytanie, gdzie jeszcze te dane
    są i kto miał do nich dostęp. Lepiej nie mieć tego pytania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: opis
    wewnętrznej budowy organizacji, złożony z tego, co jej własne maszyny
    same o sobie napisały.
  en: |
    The item limits the collection of diagnostic logs sent from the machine
    to the maker.

    The category is medium, a step below memory dumps, and I want to say
    where that difference comes from, because it does not follow from the
    names of the two items. A memory dump carries out of the machine what a
    process was busy with - content. A log carries out what the machine
    itself wrote about itself - events.

    Events are less than content, but they are not little. A server's logs
    hold the names of the accounts that signed in, the names of the
    computers connections came from, paths to shares and directories, names
    of services and tasks, internal addresses. Gathered together they add up
    to a description of how this organisation is built on the inside - and
    that is the knowledge lateral movement starts from.

    There is also something that on a server weighs separately. A log is
    sometimes evidence. If the same material is at the same time being sent
    outwards by a mechanism the organisation does not control, then at a
    serious incident somebody will have to answer where else that data is
    and who had access to it. Better not to have that question.

    What an attacker gains while the item goes unmet: a description of the
    organisation's inner build, put together from what its own machines
    wrote about themselves.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i tym razem sprawdzenie jest
    krótkie, bo dotyczy jednej rzeczy.

    Ta reguła nie dotyka dzienników zdarzeń tej maszyny. Nie zmienia ich
    wielkości, nie skraca ich przechowywania, nie wyłącza żadnej ścieżki
    audytu ani nie wpływa na to, co zbiera narzędzie zbierające dzienniki
    w organizacji. Chcę to napisać wprost, bo nazwa punktu brzmi tak, jakby
    dotyczył dzienników w ogóle, a dotyczy wyłącznie tego, co idzie stąd do
    producenta.

    Sprawdzić trzeba to samo, co przy zrzutach: czy wsparcie producenta jest
    używane naprawdę. Tam, gdzie zgłasza się do niego awarie, pierwszy obieg
    się wydłuży, bo o materiał trzeba będzie poprosić osobno zamiast
    zastać go już wysłanym. Tam, gdzie się nie zgłasza, nie zmieni się nic.

    Jedna uwaga praktyczna, żeby nie szukać potem powodu niepowodzenia
    w złym miejscu: ta reguła i ograniczenie samego zakresu danych
    diagnostycznych działają na różnych poziomach. Wpisanie zakresu zerowego
    sprawia, że nie idzie nic i ten punkt przestaje mieć na co działać —
    ale nadal warto go zapisać, bo utrzymuje ograniczenie także wtedy, gdy
    zakres zostanie kiedyś podniesiony.

    Zmiana nie wymaga przerwy, jest niewidoczna i cofa się natychmiast.
  en: |
    I keep the class "needs review", and this time the review is short,
    because it concerns one thing.

    This rule does not touch this machine's event logs. It does not change
    their size, does not shorten how long they are kept, does not switch off
    any audit trail, and does not affect what the organisation's
    log-gathering tool collects. I want to write that plainly, because the
    item's name sounds as though it concerned logs in general, while it
    concerns only what goes from here to the maker.

    What has to be checked is the same as with dumps: whether the maker's
    support is genuinely used. Where failures are reported to it, the first
    round lengthens, because the material will have to be asked for
    separately instead of being found already sent. Where they are not,
    nothing changes.

    One practical note, so that the reason for a failure is not looked for
    in the wrong place later: this rule and the limit on the scope of
    diagnostic data itself work at different levels. Writing a scope of zero
    means nothing goes at all and this item has nothing left to act on - but
    it is still worth writing down, because it holds the limit in place
    should the scope ever be raised.

    The change needs no outage, is invisible, and is undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
  what_breaks:
    pl:
      - Dzienniki zdarzeń tej maszyny pozostają nietknięte — zmienia się wyłącznie to, co idzie stąd do producenta
      - Nie zmienia się wielkość dzienników, czas ich przechowywania ani żadna ścieżka audytu
      - Gdy awarie zgłasza się do wsparcia producenta, o materiał trzeba będzie poprosić osobno i pierwszy obieg się wydłuży
      - Przy zakresie danych diagnostycznych ustawionym na zero ten punkt nie ma na co działać, ale utrzymuje ograniczenie na przyszłość
    en:
      - This machine's event logs stay untouched - only what goes from here to the maker changes
      - Neither the size of the logs, nor how long they are kept, nor any audit trail changes
      - Where failures are reported to the maker's support, the material will have to be asked for separately and the first round lengthens
      - With the diagnostic data scope set to zero this item has nothing to act on, but it holds the limit for the future
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zgłaszanie awarii do wsparcia producenta wraz z dziennikami jest częścią rzeczywistej procedury w tej organizacji
    en:
      - Reporting failures to the maker's support together with logs is part of the actual procedure in this organisation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LimitDiagnosticLogCollection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'LimitDiagnosticLogCollection' -ErrorAction SilentlyContinue).'LimitDiagnosticLogCollection'
    [pscustomobject]@{
      path        = $path
      name        = 'LimitDiagnosticLogCollection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This touches only what goes from here to the maker. The machine's own
    # event logs, their size, their retention and every audit trail stay
    # exactly as they are.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitDiagnosticLogCollection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    O stopień niżej niż zrzuty pamięci, bo zrzut wynosi treść, a dziennik
    zdarzenia. Zdarzenia to mniej, ale nie mało: nazwy kont, nazwy
    komputerów, ścieżki do udziałów, nazwy usług i zadań, adresy
    wewnętrzne. Razem układają się w opis tego, jak organizacja jest
    zbudowana od środka.

    Rzecz ważąca na serwerze osobno: dziennik bywa dowodem. Przy poważnym
    zdarzeniu trzeba będzie odpowiedzieć, gdzie jeszcze te dane są i kto
    miał do nich dostęp. Lepiej nie mieć tego pytania.

    Nazwa myli — punkt nie dotyka dzienników zdarzeń tej maszyny ani
    niczego, co zbiera narzędzie zbierające dzienniki w organizacji.
  en: |
    A step below memory dumps, because a dump carries out content and a log
    carries out events. Events are less, but not little: account names,
    computer names, paths to shares, names of services and tasks, internal
    addresses. Together they add up to a description of how the organisation
    is built on the inside.

    Something that weighs separately on a server: a log is sometimes
    evidence. At a serious incident somebody will have to answer where else
    that data is and who had access to it. Better not to have that question.

    The name misleads - the item does not touch this machine's event logs,
    nor anything the organisation's log-gathering tool collects.
