id: fedora44-encrypt-method

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.4.1.4
  section: Access Control > User Accounts and Environment > Configure shadow password suite parameters
  title:
    pl: Algorytm skrótu haseł w login.defs jest silny
    en: Ensure strong password hashing algorithm is configured
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    ENCRYPT_METHOD w /etc/login.defs wybiera algorytm, którym chpasswd,
    newusers i pam_unix bez własnej opcji zapisują hasła w /etc/shadow.
    Stare algorytmy, na przykład MD5 albo DES, pozwalają po wycieku pliku
    szybko odgadnąć hasła.

    Punkt wymaga, żeby ENCRYPT_METHOD wynosił SHA512 albo YESCRYPT.
  en: |
    ENCRYPT_METHOD in /etc/login.defs selects the algorithm that chpasswd,
    newusers and pam_unix without its own option use to store passwords in
    /etc/shadow. Old algorithms, for example MD5 or DES, allow passwords to
    be guessed quickly after the file leaks.

    The item requires ENCRYPT_METHOD to be SHA512 or YESCRYPT.

disruption_description:
  pl: |
    Fedora domyślnie ustawia YESCRYPT, więc zwykle nic się nie zmienia.
    Jeśli ustawiono inny algorytm, naprawa ustawia YESCRYPT i nowe hasła
    dostają skrót yescrypt; istniejące hasła działają dalej.
  en: |
    Fedora uses YESCRYPT by default, so usually nothing changes. If another
    algorithm was set, the remediation sets YESCRYPT and new passwords get a
    yescrypt hash; existing passwords keep working.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Stare systemy albo narzędzia, które czytają skróty z /etc/shadow i nie znają yescrypt
    en:
      - Old systems or tools that read hashes from /etc/shadow and do not know yescrypt
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Skróty haseł kopiowane do starego systemu, który obsługuje tylko SHA512; wtedy lepiej ustawić ręcznie SHA512
    en:
      - Password hashes copied to an old system that only supports SHA512; then set SHA512 by hand instead
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v == "SHA512" || v == "YESCRYPT") }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld= '$2 ~ /^\$.+\$/ { v = $fld; if (!(1)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(defs_get ENCRYPT_METHOD); then
        v=${r#* }; s="ENCRYPT_METHOD=$v"
        [ "${r%% *}" = /etc/login.defs ] || s="$s(${r%% *})"
      else
        v=""; s="ENCRYPT_METHOD=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld= '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "YESCRYPT" ] && [ "$v" != "YESCRYPT" ]; then chage - "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=shadowdefs-1
        if [ -e /etc/login.defs ]; then echo existed=1; else echo existed=0; fi
        if [ -n "" ]; then awk -F: -v fld= '$2 ~ /^\$.+\$/ { print "user", $1, $fld }' /etc/shadow; fi
      } > "$b"
      chmod 600 "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/login.defs
      mark='# Sentin-Harden: fedora44-encrypt-method'
      line='ENCRYPT_METHOD YESCRYPT'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowdefs-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v == "SHA512" || v == "YESCRYPT") }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld= '$2 ~ /^\$.+\$/ { v = $fld; if (!(1)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(defs_get ENCRYPT_METHOD); then
        v=${r#* }; s="ENCRYPT_METHOD=$v"
        [ "${r%% *}" = /etc/login.defs ] || s="$s(${r%% *})"
      else
        v=""; s="ENCRYPT_METHOD=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld= '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "YESCRYPT" ] && [ "$v" != "YESCRYPT" ]; then chage - "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "Already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        *shadow-unreadable*) echo "Cannot read /etc/shadow; run as root" >&2; exit 1 ;;
      esac
      fix=0
      if g=$(defs_get ENCRYPT_METHOD); then
        if ! ok "${g#* }"; then
          [ "${g%% *}" = "$f" ] || { echo "ENCRYPT_METHOD is set in ${g%% *}, which overrides $f; change it there by hand" >&2; exit 1; }
          fix=1
        fi
      else
        fix=1
      fi
      users=""
      if [ -n "" ]; then
        users=$(awk -F: -v fld= '$2 ~ /^\$.+\$/ { v = $fld; if (!(1)) print $1 }' /etc/shadow)
        lock=$(awk -F: -v fld= -v nv=YESCRYPT -v today=$today '
          function lk(l, m, i) { return l ~ /^[0-9]+$/ && l + 0 > 0 && m ~ /^[0-9]+$/ && i ~ /^[0-9]+$/ && today - l > m + 0 && today - l - m > i + 0 }
          $2 ~ /^\$.+\$/ { v = $fld; if (1) next; was = lk($3, $5, $7); $fld = nv
            if (!was && lk($3, $5, $7)) { printf "%s%s", s, $1; s = "," } }' /etc/shadow)
        if [ -n "$lock" ]; then
          echo "These accounts would be locked right away because their password is too old: $lock; set them a new password first, nothing changed" >&2; exit 1
        fi
      fi
      d=$(dirname "$f")
      old=$(mktemp "$d/.sentin-harden-old.XXXXXX")
      t=$(mktemp "$d/.sentin-harden.XXXXXX")
      trap 'rm -f "$old" "$t"' EXIT
      if [ -e "$f" ]; then had=1; cat "$f" > "$old"; else had=0; fi
      undo() {
        if [ "$fix" = 1 ]; then if [ "$had" = 1 ]; then cat "$old" > "$f"; else rm -f "$f"; fi; fi
        if [ -n "" ]; then restore_users >/dev/null; fi
      }
      if [ "$fix" = 1 ]; then
        { if [ "$had" = 1 ]; then awk -v mark="$mark" -v line="$line" -v k=ENCRYPT_METHOD '
            skip { skip = 0; if ($0 == line) next }
            $0 == mark { skip = 1; next }
            !done { x = $0; sub(/#.*/, "", x); split(x, w, " "); if (w[1] == k) { print mark; print line; done = 1 } }
            { print }
            END { if (!done) { print mark; print line } }' "$f"
          else echo "$mark"; echo "$line"; fi; } > "$t"
        if [ "$had" = 1 ]; then chmod --reference="$f" "$t"; chown --reference="$f" "$t"; else chmod 644 "$t"; chown root:root "$t"; fi
        mv -f "$t" "$f"
        if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
        echo "Set $line in $f"
      fi
      for u in $users; do
        chage - YESCRYPT "$u" || { undo; echo "chage failed for $u; restored the previous state" >&2; exit 1; }
        echo "Set  YESCRYPT for $u"
      done
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) undo; echo "The item is not met after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/login.defs
      mark='# Sentin-Harden: fedora44-encrypt-method'
      line='ENCRYPT_METHOD YESCRYPT'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowdefs-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      e=$(sed -n '2s/^existed=//p' "$b")
      case "$e" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v == "SHA512" || v == "YESCRYPT") }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld= '$2 ~ /^\$.+\$/ { v = $fld; if (!(1)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(defs_get ENCRYPT_METHOD); then
        v=${r#* }; s="ENCRYPT_METHOD=$v"
        [ "${r%% *}" = /etc/login.defs ] || s="$s(${r%% *})"
      else
        v=""; s="ENCRYPT_METHOD=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld= '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "YESCRYPT" ] && [ "$v" != "YESCRYPT" ]; then chage - "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
      if [ -n "" ]; then restore_users; fi
      if [ ! -f "$f" ] || ! grep -qxF "$mark" "$f"; then echo "The line of this rule is not in $f, nothing to restore there"; exit 0; fi
      t=$(mktemp "$(dirname "$f")/.sentin-harden.XXXXXX")
      trap 'rm -f "$t"' EXIT
      # Only the marked line of this rule goes; the rest of the file stays as it is now.
      awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f" > "$t"
      if grep -A 1 -xF "$mark" "$f" | grep -qxF "$line"; then kept=0; else kept=1; fi
      if [ "$e" = 0 ] && ! grep -q '[^[:space:]]' "$t"; then
        rm -f "$f"; echo "Removed $f, which this rule created"; exit 0
      fi
      chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if [ "$kept" = 1 ]; then
        echo "Removed the comment of this rule from $f; the line under it was changed by hand and stays"
      else
        echo "Removed the ENCRYPT_METHOD line of this rule from $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/login.defs.5.html

notes:
  pl: |
    Sprawdzenie odtwarza sposób, w jaki shadow-utils i pam_unix na Fedorze
    44 czytają ustawienia: najpierw /etc/login.defs, potem pliki *.defs
    w /etc/login.defs.d w kolejności nazw, i wygrywa ostatni plik, który ma
    ten klucz. W jednym pliku wygrywa pierwszy wpis, także z niepoprawną
    wartością. Wartość stoi po nazwie oddzielona spacją albo tabulatorem;
    zapis KEY=wartość jest nieznaną nazwą. Sprawdziłem to w kontenerze.
    Wartość liczbowa musi być zapisana dziesiętnie bez zera na początku, bo
    shadow-utils czyta 010 jako 8.

    Naprawa wstawia wiersz tej reguły pod komentarzem Sentin-Harden tuż
    przed pierwszym wpisem tego klucza w /etc/login.defs, żeby wygrał.
    Gdy klucz ustawia plik w /etc/login.defs.d, naprawa niczego nie zmienia
    i trzeba poprawić ten plik ręcznie. Wycofanie usuwa tylko te dwa
    wiersze.

    chpasswd i useradd rozróżniają wielkość liter: wartość sha512 uznają za
    błędną i zapisują hasła starym algorytmem DES, a pam_unix przyjmuje ją
    jako SHA512. Dlatego sprawdzenie wymaga wielkich liter. Hasło zmienione
    przez passwd dostaje algorytm z opcji w wierszu pam_unix (punkt
    5.3.3.4.3), a ENCRYPT_METHOD tylko wtedy, gdy tej opcji nie ma.
  en: |
    The check follows how shadow-utils and pam_unix on Fedora 44 read the
    settings: first /etc/login.defs, then the *.defs files in
    /etc/login.defs.d in name order, and the last file that has the key
    wins. Within a file the first entry wins, even one with a wrong value.
    The value follows the name after a space or tab; KEY=value is an unknown
    name. This was checked in a container. A number has to be written in
    decimal without a leading zero, because shadow-utils reads 010 as 8.

    The remediation inserts the line of this rule under a Sentin-Harden
    comment right before the first entry of the key in /etc/login.defs, so
    that it wins. When a file in /etc/login.defs.d sets the key, the
    remediation changes nothing and that file has to be fixed by hand.
    Rollback removes only these two lines.

    chpasswd and useradd are case sensitive: they treat the value sha512 as
    wrong and store passwords with the old DES algorithm, while pam_unix
    takes it as SHA512. This is why the check requires capital letters. A
    password changed with passwd gets the algorithm from the option on the
    pam_unix line (item 5.3.3.4.3), and ENCRYPT_METHOD only when there is no
    such option.
