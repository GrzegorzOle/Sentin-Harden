id: win11-computer-browser-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa spisu maszyn w sieci lokalnej wyłączona
    en: The service keeping a register of machines on the local network disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa prowadzi spis maszyn widocznych w sieci lokalnej i udostępnia go
    innym. Spis ten powstaje z rozgłoszeń: maszyny ogłaszają swoją obecność,
    jedna z nich zostaje wybrana na prowadzącą spis, a reszta pyta ją
    o zawartość.

    Rzecz, która czyni z tego problem, tkwi w słowie „wybrana". Wybór odbywa
    się między maszynami, według reguły, w której wygrywa ta ogłaszająca się
    jako ważniejsza. Nie ma tu uwierzytelniania, nie ma uprawnień i nie ma
    nikogo, kto wybór potwierdza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: może ogłosić
    się prowadzącym spis i wtedy to on odpowiada na pytanie, jakie maszyny są
    w sieci i gdzie ich szukać. Odpowiedź da się ułożyć dowolnie, łącznie ze
    wskazaniem własnej maszyny jako serwera plików — a użytkownik, który
    kliknie w taki wpis, spróbuje się do niego uwierzytelnić.

    Drugi zysk jest bierny: sam spis jest gotową listą maszyn w sieci,
    z nazwami i opisami, oddawaną każdemu pytającemu bez żadnego warunku.

    Mechanizm opiera się na starszej warstwie nazw, wycofywanej z użycia,
    i nie jest potrzebny do niczego, co robi współczesny system.
  en: |
    The service keeps a register of machines visible on the local network and makes it
    available to others. That register comes from broadcasts: machines announce their
    presence, one of them is chosen to keep the register, and the rest ask it for the
    contents.

    What makes this a problem lies in the word "chosen". The choice is made between
    machines, by a rule in which the one announcing itself as the more important wins.
    There is no authentication here, no rights and nobody to confirm the choice.

    What an attacker gains while the item goes unmet: they can announce themselves as the
    keeper of the register, and then it is they who answer the question of what machines
    are on the network and where to look for them. The answer can be composed at will,
    including naming their own machine as a file server - and a user who clicks such an
    entry will try to authenticate to it.

    The second gain is passive: the register itself is a ready list of machines on the
    network, with names and descriptions, handed to any asker on no condition at all.

    The mechanism rests on an older layer of names, being withdrawn from use, and is
    needed for nothing the present-day system does.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w sieci pozostały maszyny albo urządzenia
    korzystające ze starszej warstwy nazw do odnajdywania zasobów.

    Na maszynie z aktualnym systemem zmiana nie robi nic. Odnajdywanie maszyn
    i udziałów w oknie sieci opiera się dziś na innych mechanizmach i działa
    dalej bez zmiany. Połączenie do udziału po nazwie albo po adresie działa
    tak samo jak wcześniej.

    Skutek pojawia się tam, gdzie w sieci stoją urządzenia starszego rodzaju:
    serwery plików sprzed lat, skanery sieciowe z własnym udziałem, sterowniki
    maszyn produkcyjnych. Takie urządzenia bywają odnajdywane wyłącznie tą
    drogą i po wyłączeniu usługi trzeba się do nich odwoływać po adresie
    zamiast przez listę.

    Osobno warto sprawdzić skrypty logowania mapujące dyski sieciowe. Jeżeli
    któryś odwołuje się do zasobu przez nazwę rozwiązywaną starszą warstwą,
    zakończy się błędem — przy czym objawem będzie brak dysku, a nie komunikat
    o przyczynie.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether machines or devices using the older layer of names to
    find resources remain on the network.

    On a machine with a current system the change does nothing. Finding machines and
    shares in the network window rests today on other mechanisms and carries on
    unchanged. Connecting to a share by name or by address works just as before.

    The effect appears where devices of an older kind stand on the network: file servers
    from years back, network scanners with a share of their own, controllers of
    production machinery. Such devices are sometimes found by this route alone, and once
    the service is off they have to be addressed by address rather than through a list.

    Logon scripts mapping network drives are worth checking separately. If one refers to
    a resource by a name resolved through the older layer it will end in an error - and
    the symptom will be a missing drive rather than a message about the cause.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Lista maszyn widocznych w sieci lokalnej przestaje być prowadzona i udostępniana
      - Urządzenia starszego rodzaju odnajdywane wyłącznie tą drogą znikają z listy
      - Skrypt logowania odwołujący się do zasobu przez starszą warstwę nazw nie mapuje dysku
      - Połączenie do udziału po nazwie albo po adresie działa tak samo jak wcześniej
    en:
      - The list of machines visible on the local network stops being kept and shared
      - Devices of an older kind found by this route alone vanish from the list
      - A logon script referring to a resource through the older layer of names maps no drive
      - Connecting to a share by name or by address works just as before
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - W sieci stoją urządzenia odnajdywane wyłącznie przez spis maszyn starszej warstwy
      - Skrypty logowania mapują dyski przez nazwy rozwiązywane starszą warstwą nazw
    en:
      - Devices found only through the older layer's register of machines stand on the network
      - Logon scripts map drives through names resolved by the older layer of names
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'Browser' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Browser' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Browser' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/network-browsing-overview

notes:
  pl: |
    Na maszynie z aktualnym systemem usługi zwykle nie ma — składnik został
    z systemu wycofany razem ze starszą warstwą udostępniania plików. Audyt
    zwróci wtedy wynik „nie dotyczy" i jest to wynik prawidłowy, a nie brak
    sprawdzenia.

    Punkt zachowuje sens mimo to, bo składnik bywa przywracany ręcznie
    w sieciach ze starszymi urządzeniami, a reguła wykrywa taki stan.

    Reguła uzupełnia opisane w tej paczce wyłączenie starszej warstwy nazw:
    tamto zdejmuje warstwę, na której ten spis się opiera, ta zdejmuje sam
    spis. Wdrożenie obu naraz jest sensowne — spis nie działa bez tamtej
    warstwy, ale jego zapis w rejestrze trwa niezależnie.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    On a machine with a current system the service is usually absent - the component has
    been withdrawn from the system together with the older layer of file sharing. The
    audit will then return "not applicable", and that is a proper result rather than a
    failure to check.

    The item keeps its sense all the same, since the component is sometimes put back by
    hand on networks with older devices, and the rule detects such a state.

    The rule completes this pack's disabling of the older layer of names: that takes away
    the layer this register rests on, this takes away the register itself. Applying both
    at once makes sense - the register does not work without that layer, but its registry
    entry lasts regardless.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
