id: win2016-bitlocker-enhanced-pin-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Kod startowy może zawierać znaki inne niż cyfry
    en: The startup code may hold characters other than digits
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie dopuszcza w kodzie startowym litery i znaki inne niż cyfry,
    zamiast ograniczać go do samych cyfr.

    Punkt jest uzupełnieniem poprzedniego i razem z nim wyczerpuje temat
    siły kodu. Tamten mówił, ile znaków; ten mówi, ile możliwości ma każdy
    z tych znaków.

    Różnica jest większa, niż wygląda. Kod siedmiocyfrowy to dziesięć
    milionów możliwości. Kod siedmioznakowy złożony z liter i cyfr to liczba
    większa o kilka rzędów wielkości. Wydłużenie kodu o jeden znak daje
    dziesięciokrotność; poszerzenie zestawu znaków daje więcej, i to przy tej
    samej długości.

    Dla osoby wpisującej kod przy konsoli oznacza to możliwość użycia czegoś,
    co da się zapamiętać. Siedem cyfr zapamiętuje się źle i zapisuje na
    karteczce; siedem znaków z wyrazu zapamiętuje się dobrze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przestrzeń
    kodów ograniczoną do dziesięciu znaków na pozycję, przy tej samej
    długości kodu.
  en: |
    The setting admits into the startup code letters and characters other than digits, instead of
    holding it to digits alone.

    The item completes the one before it and together with it exhausts the matter of the code's
    strength. That one said how many characters; this one says how many possibilities each of
    those characters has.

    The difference is greater than it looks. A seven-digit code is ten million possibilities. A
    seven-character code made of letters and digits is a number greater by several orders of
    magnitude. Lengthening the code by one character gives tenfold; widening the set of
    characters gives more, and that at the same length.

    For whoever types the code at the console it means being able to use something that can be
    remembered. Seven digits are remembered badly and written on a slip of paper; seven characters
    from a word are remembered well.

    What an attacker gains while the item goes unmet: a space of codes held to ten characters per
    position, at the same length of code.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy klawiatury,
    nie systemu.

    Kod startowy wpisuje się przed uruchomieniem systemu, a więc
    w środowisku oprogramowania układowego. Układ klawiatury jest tam
    amerykański i nie da się go zmienić. Znaki, które na klawiaturze
    lokalnej leżą gdzie indziej, trafią w inne miejsce niż ten, kto je
    wpisuje, się spodziewa.

    Dotyczy to zwłaszcza znaków interpunkcyjnych i wszystkiego, co wymaga
    klawisza modyfikującego. Litery i cyfry leżą tak samo w obu układach
    i z nimi kłopotu nie ma.

    Praktyczny wniosek: kod złożony z liter i cyfr jest bezpieczny w użyciu;
    kod ze znakami specjalnymi wymaga sprawdzenia na tej konkretnej maszynie,
    zanim zostanie ustawiony. Sprawdzenie polega na wpisaniu go raz i upewnieniu
    się, że maszyna wstaje.

    Drugie ostrzeżenie dotyczy klawiatury numerycznej. Na części sprzętu jest
    ona przy starcie nieaktywna, więc kod cyfrowy wpisywany dotąd blokiem
    numerycznym trzeba będzie wpisać z górnego rzędu.

    Ustawienie dotyczy kodów nadawanych po jego wprowadzeniu; istniejące
    kody działają dalej.

    Czego to nie psuje: kodów już nadanych, pracy systemu, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be reviewed concerns the keyboard rather than
    the system.

    The startup code is typed before the system starts, which is to say in the firmware's
    environment. The keyboard layout there is the American one and cannot be changed. Characters
    that on a local keyboard lie elsewhere will land somewhere other than whoever types them
    expects.

    That touches above all punctuation marks and everything calling for a modifier key. Letters
    and digits lie the same in both layouts and give no trouble.

    The practical conclusion: a code made of letters and digits is safe in use; a code with
    special characters calls for a check on this particular machine before it is set. The check
    consists in typing it once and making sure the machine comes up.

    A second warning concerns the numeric keypad. On some hardware it is idle at the start, so a
    numeric code typed until now on the keypad will have to be typed from the top row.

    The setting concerns codes given after it is brought in; existing codes work on.

    What this does not break: codes already given, the system's working, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Układ klawiatury przy starcie jest amerykański, więc znaki interpunkcyjne trafią w inne miejsce niż na klawiaturze lokalnej
      - Na części sprzętu klawiatura numeryczna jest przy starcie nieaktywna i kod trzeba wpisać z górnego rzędu
      - Kody już nadane nie zmieniają się - ustawienie dotyczy wyłącznie nadawanych po jego wprowadzeniu
      - Praca systemu, usługi i sieć pozostają bez zmian
    en:
      - The keyboard layout at the start is the American one, so punctuation marks will land somewhere other than on a local keyboard
      - On some hardware the numeric keypad is idle at the start and the code has to be typed from the top row
      - Codes already given do not change - the setting concerns only those given after it is brought in
      - The system's working, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Kod ma zawierać znaki interpunkcyjne, a nie sprawdzono ich wpisania na tej konkretnej maszynie przed ustawieniem
      - Obsługa wpisuje kod z bloku numerycznego, a nie ustalono, czy jest on przy starcie aktywny
    en:
      - The code is to hold punctuation marks and their typing has not been checked on this particular machine before setting it
      - The attendance types the code on the numeric keypad and it has not been established whether that is live at the start
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'UseEnhancedPin'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'UseEnhancedPin'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseEnhancedPin' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt zamyka trójkę o kodzie startowym: pierwszy pytał, czy kod
    w ogóle jest, drugi ile ma znaków, ten ile możliwości ma każdy znak.
    Warto pokazywać je razem, bo osobno żaden nie odpowiada na pytanie,
    które użytkownik ma w głowie — jak mocny jest ten kod.

    Ostrzeżenie o układzie klawiatury jest przy tym punkcie jedyną rzeczą,
    która realnie pomaga. Bez niego użytkownik ustawi kod ze znakiem
    specjalnym, zrestartuje maszynę i zobaczy, że kod nie działa — nie
    dlatego, że go pomylił, tylko dlatego, że znak trafił gdzie indziej.
    Jest to sytuacja, w której maszyna stoi, a przyczyna wygląda na
    niemożliwą.

    Odnotowuję też argument, który przy tym punkcie bywa pomijany.
    Poszerzenie zestawu znaków nie tylko podnosi koszt odgadywania — zdejmuje
    też powód, dla którego kody startowe bywają zapisywane na karteczkach.
    Siedem cyfr pamięta się źle. To jest zysk, którego nie widać w rachunku
    możliwości, a który bywa większy.
  en: |
    The item shuts the three about the startup code: the first asked whether there is a code at
    all, the second how many characters it has, this one how many possibilities each character
    has. They are worth showing together, apart from one another none of them answering the
    question the user has in mind - how strong that code is.

    The warning about the keyboard layout is at this item the one thing that really helps.
    Without it the user will set a code with a special character, restart the machine and see
    that the code does not work - not for having mistyped it but because the character landed
    elsewhere. It is a situation in which the machine stands still and the cause looks
    impossible.

    Worth noting too an argument at times passed over at this item. Widening the set of
    characters does not only raise the cost of guessing - it also takes away the reason startup
    codes get written on slips of paper. Seven digits are remembered badly. That is a gain not to
    be seen in the reckoning of possibilities, and at times the greater one.
