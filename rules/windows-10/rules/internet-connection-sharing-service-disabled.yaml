id: win10-internet-connection-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia sieciowego wyłączona
    en: The service serving out the joining to the network switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę pozwalającą udostępnić połączenie sieciowe
    tej maszyny innym urządzeniom, czyli zamienić ją w bramę.

    Maszyna z tą usługą uruchomioną rozdaje adresy, odpowiada na pytania
    o nazwy i przepuszcza ruch z jednej swojej sieci do drugiej. Robi
    więc to, co zwykle robi urządzenie brzegowe, tylko bez jego
    konfiguracji i bez niczyjego nadzoru.

    Zagrożenie polega na połączeniu dwóch sieci, które miały pozostać
    osobne. Stanowisko podłączone przewodem do sieci firmowej
    i bezprzewodowo do innej staje się drogą między nimi — a podział
    sieci, na którym opiera się cała reszta zabezpieczeń, przestaje
    obowiązywać.

    Drugim skutkiem jest rozdawanie adresów. Maszyna zaczyna odpowiadać
    na zapytania o konfigurację sieciową, więc urządzenia w tej samej
    sieci mogą dostać od niej ustawienia zamiast od właściwego serwera.

    Odnotowuję, że usługa ta bywa uruchamiana przez oprogramowanie
    wirtualizacyjne, które buduje na niej sieć dla maszyn wirtualnych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    między dwiema sieciami i źródło ustawień sieciowych dla sąsiadów.
  en: |
    The setting switches off the service letting this machine's joining to the network be served out to other
    devices, which is to say letting it be turned into a gate.

    A machine with that service set going hands out addresses, answers questions upon names and lets traffic
    through from one of its networks into the other. It does therefore what a thing at the edge commonly does,
    only without its setting up and without anybody's watch.

    The danger lies in the joining of two networks that were to stay apart. A station put by wire into the
    network of the firm and without wires into another becomes a road between them - and the parting of the
    network, upon which all the rest of the guarding rests, ceases to hold.

    The second upshot is the handing out of addresses. The machine begins to answer askings upon the setting up of
    the network, so devices in that same network may get their settings from it instead of from the right server.

    I set down that the service is at times set going by software of making machines by craft, which builds upon
    it a network for those machines.

    What an attacker gains while the item goes unmet: a road between two networks and a wellspring of settings of
    the network for the neighbours.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    usługa nie jest podstawą sieci dla maszyn wirtualnych.

    Miejscem pierwszym jest oprogramowanie wirtualizacyjne. Część
    rozwiązań buduje na tej usłudze sieć z podmianą adresów dla maszyn
    wirtualnych. Po zmianie maszyny wirtualne stracą dostęp do sieci,
    a objaw nie wskaże przyczyny.

    Miejscem drugim jest udostępnianie internetu innym urządzeniom
    w terenie: telefonowi, drukarce, urządzeniu pomiarowemu podłączonemu
    przewodem. Zdarza się to na stanowiskach przenośnych.

    Odnotowuję, że usługa ta jest wspólna z mechanizmem punktu
    dostępowego. Kto wdraża oba punkty, wyłącza dwa mechanizmy oparte na
    tej samej warstwie.

    Skutek jest widoczny dla użytkownika i pojawia się natychmiast.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: własnego dostępu maszyny do internetu, łączności
    sieciowej, udziałów, pulpitu zdalnego, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether the service is not the ground of a
    network for machines made by craft.

    The first place is software of making machines by craft. Some answers build upon this service a network with a
    changing out of addresses for such machines. After the change those machines will lose their reach of the
    network, and the sign will point not to the cause.

    The second place is the serving out of the internet to other devices in the field: to a telephone, a printer,
    an instrument of measuring put in by wire. That happens upon stations to be carried about.

    I set down that this service is held in common with the mechanism of the point of entry. Whoever rolls out
    both items switches off two mechanisms resting upon that same layer.

    The consequence is plain to the user and shows at once.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the machine's own reach of the internet, the joining to the network, shares, the
    desk from afar, logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Maszyny wirtualne korzystające z sieci z podmianą adresów stracą dostęp do sieci, a objaw nie wskaże przyczyny
      - Udostępnianie internetu telefonowi, drukarce albo urządzeniu pomiarowemu przestanie działać
      - Usługa jest wspólna z mechanizmem punktu dostępowego, więc oba punkty wyłączają tę samą warstwę
      - Własny dostęp maszyny do internetu pozostaje nietknięty i działa tak jak dotąd
      - Łączność sieciowa, udziały, pulpit zdalny, logowanie i drukowanie pozostają bez zmian
    en:
      - Machines made by craft using a network with a changing out of addresses will lose their reach of the network, and the sign will point not to the cause
      - The serving out of the internet to a telephone, a printer or an instrument of measuring will cease to work
      - The service is held in common with the mechanism of the point of entry, so both items switch off that same layer
      - The machine s own reach of the internet stays untouched and works as hitherto
      - The joining to the network, shares, the desk from afar, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Oprogramowanie wirtualizacyjne buduje na tej usłudze sieć dla maszyn wirtualnych
      - Stanowisko przenośne udostępnia internet urządzeniom pracującym w terenie
    en:
      - Software of making machines by craft builds upon this service a network for those machines
      - A station to be carried about serves out the internet to devices working in the field
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'SharedAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SharedAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SharedAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/network-subsystem/net-sub-interface-metric

notes:
  pl: |
    Reguła bywa czytana jako punkt o wygodzie i warto, żeby aplikacja
    przesunęła uwagę na podział sieci. Stanowisko podłączone do dwóch
    sieci naraz i udostępniające połączenie jest drogą między nimi,
    a podział sieci przestaje wtedy cokolwiek znaczyć.

    Argument wart zachowania dotyczy rozdawania adresów. Maszyna zaczyna
    odpowiadać na zapytania o konfigurację sieciową, więc sąsiednie
    urządzenia mogą dostać ustawienia od niej zamiast od właściwego
    serwera. Nie jest to skutek zamierzony, a wystarczy do wprowadzenia
    zamieszania w sieci.

    Odnotowuję zastrzeżenie wobec oprogramowania wirtualizacyjnego,
    bo objaw po zmianie jest mylący: maszyny wirtualne tracą sieć, a nic
    nie wskazuje, że przyczyną jest wyłączona usługa systemowa.
  en: |
    The rule is at times read as an item of ease, and it is well that the application shift the notice to the
    parting of the network. A station put into two networks at once and serving out its joining is a road between
    them, and the parting of the network then ceases to mean anything.

    The argument worth keeping touches the handing out of addresses. The machine begins to answer askings upon the
    setting up of the network, so neighbouring devices may get their settings from it instead of from the right
    server. It is no upshot meant, and it suffices to bring confusion into a network.

    I set down the reservation touching software of making machines by craft, the sign after the change being
    misleading: those machines lose the network, and nothing points to a switched-off service of the system as the
    cause.
