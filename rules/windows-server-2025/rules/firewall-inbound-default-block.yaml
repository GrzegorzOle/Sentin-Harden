id: win2025-firewall-inbound-default-block

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Domyślne blokowanie połączeń przychodzących we wszystkich profilach
    en: Default blocking of inbound connections in all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby zapora domyślnie odrzucała połączenia przychodzące,
    dla których żadna reguła nie mówi wprost, że mają zostać przepuszczone.

    Jest to rozstrzygnięcie o kierunku całej konfiguracji zapory, a nie
    pojedyncze ustawienie. Przy blokowaniu domyślnym przepuszczane jest
    wyłącznie to, co zostało wymienione — wszystko inne jest odrzucane,
    także to, o czym nikt nie wiedział. Przy przepuszczaniu domyślnym jest
    odwrotnie: blokowane jest to, co wymieniono, a reszta przechodzi.

    Różnica ujawnia się dopiero przy rzeczach nieprzewidzianych i na tym
    polega jej wartość. Usługa uruchomiona przez zainstalowaną rolę, port
    otwarty przez aktualizację, nasłuch dodany przez aplikację przy
    instalacji — żadne z tych zdarzeń nie prowadzi do napisania reguły
    blokującej, bo nikt o nich nie wie. Przy blokowaniu domyślnym żadne
    z nich nie staje się drogą wejścia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    wszystkiego, czego nikt nie zablokował wprost — a więc do każdej
    usługi, o której nie pomyślano. Na serwerze takich usług jest zawsze
    więcej niż na liście.

    Zapora włączona z przepuszczaniem domyślnym spełnia punkt o włączonej
    zaporze i nie chroni przed niczym. Dopiero ten punkt zamienia ją
    w mechanizm ochronny.
  en: |
    The item takes that the firewall by default refuse inbound connections no rule says
    outright are to be let through.

    It is a decision about the direction of the whole firewall configuration rather than a
    single setting. With blocking by default only what has been named is let through -
    everything else is refused, including what nobody knew of. With letting through by
    default it is the reverse: what has been named is blocked and the rest passes.

    The difference comes to light only at unforeseen things, and in that lies its worth. A
    service started by an installed role, a port opened by an update, a listener added by an
    application at its installation - none of those events leads to a blocking rule being
    written, since nobody knows of them. With blocking by default none of them becomes a
    road in.

    What an attacker gains while the item goes unmet: access to everything nobody blocked
    outright - that is, to every service nobody thought of. On a server there are always
    more such services than are on the list.

    A firewall enabled with letting through by default meets the item on the firewall being
    enabled and guards against nothing. Only this item turns it into a protective mechanism.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że zmiana odwraca domyślne zachowanie
    i odcina wszystko, co działało bez reguły — a na serwerze działa tak
    zwykle więcej, niż ktokolwiek pamięta.

    Objaw jest natychmiastowy: usługa przestaje być osiągalna z sieci,
    chociaż działa i nasłuchuje. Widziana od strony serwera wygląda
    poprawnie, widziana od strony klienta nie odpowiada. Jest to jedna
    z tych sytuacji, w których obie strony mają rację i żadna nie widzi
    przyczyny.

    Reguły dla ról systemowych powstają przy instalacji roli i zwykle są
    na miejscu. Odcięte zostaje to, co zainstalowano ręcznie: serwery baz
    danych, oprogramowanie przemysłowe, narzędzia monitoringu nasłuchujące
    na własnym porcie, usługi własne.

    Kolejność wdrożenia ma tu znaczenie i wart jest jej przestrzegać:
    najpierw odczytać wykaz portów nasłuchujących, potem napisać reguły
    dla tych, które mają pozostać osiągalne, i dopiero na końcu zmienić
    zachowanie domyślne. Odwrotna kolejność kończy się przestojem.

    Zmiana nie wymaga restartu, ale zrywa połączenia nieobjęte żadną
    regułą — w tym możliwe połączenie zarządzające.
  en: |
    A knowing rollout is needed because the change reverses the default behaviour and cuts
    off everything that worked with no rule - and on a server more usually works that way
    than anybody remembers.

    The symptom is immediate: a service stops being reachable from the network although it
    runs and listens. Seen from the server's side it looks right, seen from the client's
    side it does not answer. It is one of those situations in which both sides are right and
    neither sees the cause.

    Rules for the system's roles arise at the role's installation and are usually in place.
    What gets cut off is what was installed by hand: database servers, industrial software,
    monitoring tools listening on a port of their own, services of one's own.

    The order of the rollout matters here and is worth keeping to: first read the list of
    listening ports, then write rules for those that are to stay reachable, and only at the
    end change the default behaviour. The reverse order ends in downtime.

    The change takes no restart, but breaks connections no rule takes in - including a
    possible management connection.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
    - virtualization-and-containers
  what_breaks:
    pl:
      - Usługi bez napisanej reguły przestają być osiągalne, choć działają i nasłuchują
      - Od strony serwera usługa wygląda poprawnie, od strony klienta nie odpowiada
      - Połączenie zarządzające bez reguły zostaje zerwane razem z resztą
      - Reguły ról systemowych zwykle istnieją i te usługi działają dalej
    en:
      - Services with no rule written stop being reachable although they run and listen
      - From the server's side the service looks right, from the client's side it does not answer
      - A management connection with no rule is broken along with the rest
      - Rules for the system's roles usually exist and those services go on working
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie napisano reguł dla usług, które mają pozostać osiągalne z sieci
      - Nie odczytano wykazu portów nasłuchujących na tej maszynie
    en:
      - Rules have not been written for the services that are to stay reachable from the network
      - The list of ports listening on this machine has not been read
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $open = @($profiles | Where-Object { $_.DefaultInboundAction -ne 'Block' })
        if ($open.Count -eq 0) { 'ALL_BLOCK' } else { 'OPEN_IN_' + ($open.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_BLOCK
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, DefaultInboundAction |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultInboundAction Block

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -DefaultInboundAction $p.DefaultInboundAction
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Sprawdzenie czyta wszystkie trzy profile i wymaga blokowania w każdym.
    Wynik „OPEN_IN_…" podaje nazwy profili, w których domyślne zachowanie
    jest inne.

    Punkt dotyczy wyłącznie połączeń przychodzących. Zachowanie domyślne
    dla ruchu wychodzącego jest osobnym punktem i ma zupełnie inną wagę —
    tam blokowanie domyślne jest rozwiązaniem kosztownym i benchmark
    go nie wymaga.

    Zmiana zachowania domyślnego nie usuwa żadnej reguły. Reguły
    przepuszczające, które już istnieją, działają dalej — zmienia się
    wyłącznie to, co dzieje się z ruchem, którego żadna reguła nie opisuje.
  en: |
    The check reads all three profiles and takes blocking on each. The result "OPEN_IN_…"
    gives the names of the profiles whose default behaviour is other.

    The item concerns inbound connections alone. The default behaviour for outbound traffic
    is a separate item and carries an altogether different weight - there blocking by
    default is a costly answer and the benchmark does not take it.

    Changing the default behaviour removes no rule. Letting-through rules that already exist
    go on working - what changes is only what happens to traffic no rule describes.
