    Na kontrolerze domeny tego punktu nie wdrażaj: zatrzymanie usługi
    odbiera wszystkim maszynom w domenie dostęp do zasobów z zasadami
    grupy i skryptami logowania. Objaw pojawia się gdzie indziej niż
    zmiana, więc przyczyny szuka się najdłużej.

    Usługa nie obsługuje wyłącznie udziałów założonych przez człowieka —
    na udziałach administracyjnych opiera się zdalne zarządzanie, agent
    kopii zapasowych, wdrażanie oprogramowania i narzędzia diagnostyczne.
    Żadne z nich nie powie, że chodzi o udostępnianie plików.
  en: |
    The rule whereat it is the easiest in this whole pack to do a weighty harm in the belief that one
    is switching off a small thing.

    Upon a warder of the domain roll this item not out - the stopping of the service takes from every
    machine in the domain the reach to the holdings with the policies of their group and the scripts
    of signing in. The symptom comes forth elsewhere than the change, so its ground is sought the
    longest.

    The service handles not only the shares set up by a person - upon the shares of ruling there lean
    the ruling from afar, the agent of keepings of copies, the rolling out of software and the tools
    for the finding out of faults. None of them will say that it is about the dealing out of files.
