id: win10-null-session-fallback-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Powrót do sesji bez uwierzytelnienia zabroniony
    en: Falling back to a session without authentication forbidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania maszynie powrotu do sesji bez uwierzytelnienia
    w sytuacji, gdy uzgodnienie zabezpieczenia sesji się nie powiedzie.

    Mechanizm powstał jako wyjście awaryjne. Gdy strony nie umieją dojść do
    porozumienia co do sposobu zabezpieczenia rozmowy, zamiast zerwać
    połączenie, schodzą do sesji, w której ochrony nie ma wcale.

    Rzecz warta odnotowania: to wyjście awaryjne niweczy reguły o minimalnym
    zabezpieczeniu sesji. Maszyna może mieć ustawione wymaganie odmiany
    nowszej i klucza pełnej długości, a napastnik doprowadza do tego, że
    uzgodnienie się nie udaje — i dostaje sesję bez ochrony, bo tak
    przewiduje reguła awaryjna.

    Jest to wzorzec ogólniejszy, wart zapamiętania przy czytaniu innych
    punktów: zabezpieczenie z przewidzianym zejściem niżej jest warte tyle,
    ile warte jest to zejście.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    obejście wymagań dotyczących zabezpieczenia sesji przez doprowadzenie
    do nieudanego uzgodnienia.
  en: |
    The setting forbids the machine to fall back to a session without authentication where the agreeing upon a
    session's guard does not succeed.

    The mechanism came about as a way out in an emergency. Where the sides cannot come to an understanding about
    how the conversation is to be guarded, rather than break the connection off they go down to a session in
    which there is no guard at all.

    A thing worth noting: that way out undoes the rules about a least session guard. A machine may have the
    newer kind and a full-length key set as a requirement, and an attacker brings it about that the agreeing
    fails - and gets a session without a guard, that being what the emergency rule provides.

    It is a wider pattern, worth keeping in mind while reading other items: a safeguard with a foreseen step
    downwards is worth what that step is worth.

    What an attacker gains while the item goes unmet: a way round the requirements upon a session's guard, by
    bringing about an agreeing that fails.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślna i reguła zwykle potwierdza stan zastany.

    Zejście do sesji bez uwierzytelnienia jest dziś ścieżką martwą. Strony
    wspierane uzgadniają zabezpieczenie zawsze, więc wyjście awaryjne się
    nie uruchamia i nie ma czego zabraniać.

    Skutek mógłby wystąpić przy połączeniu z implementacją bardzo starą,
    która uzgodnienia nie przeprowadza — ale takie połączenie i tak nie
    przeszłoby przez reguły o minimalnym zabezpieczeniu sesji.

    Nie ma znanych regresji.

    Czego to nie psuje: udziałów plikowych, logowania, kont domenowych,
    uprawnień do zasobów, drukowania, aplikacji, sieci.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The value called for is the default and the rule as a rule confirms the state found.

    The going down to a session without authentication is today a dead path. Supported sides always agree upon a
    guard, so the emergency way out does not start and there is nothing to forbid.

    A consequence could come up at a connection with a very old implementation that carries out no agreeing -
    but such a connection would not pass the rules about a least session guard anyway.

    There are no known regressions.

    What this does not break: file shares, logging on, domain accounts, the rights upon resources, printing,
    applications, or the network.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Połączenie z implementacją bardzo starą, nieprzeprowadzającą uzgodnienia, nie dojdzie do skutku
      - Takie połączenie i tak nie przeszłoby przez reguły o minimalnym zabezpieczeniu sesji
      - Strony wspierane uzgadniają zabezpieczenie zawsze, więc wyjście awaryjne się nie uruchamia
      - Udziały plikowe, logowanie, konta domenowe i uprawnienia do zasobów pozostają bez zmian
      - Drukowanie, aplikacje, usługi systemowe i praca sieci pozostają bez zmian
    en:
      - A connection with a very old implementation carrying out no agreeing will not come about
      - Such a connection would not pass the rules about a least session guard anyway
      - Supported sides always agree upon a guard, so the emergency way out does not start
      - File shares, logging on, domain accounts and the rights upon resources stay unchanged
      - Printing, applications, system services and the working of the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna łączy się z implementacją nieprzeprowadzającą uzgodnienia zabezpieczenia sesji i nie ma dla niej zamiennika
    en:
      - The machine joins an implementation carrying out no agreeing upon a session's guard and there is no substitute for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'AllowNullSessionFallback'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'AllowNullSessionFallback'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The emergency way out goes. Nothing supported uses it, and while it stands
    # it is what the requirements upon a session's guard can be gone round by.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowNullSessionFallback' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-localsystem-null-session-fallback

notes:
  pl: |
    Reguła jest domknięciem pary o zabezpieczeniu sesji i warto pokazywać
    całą trójkę razem. Bez niej tamte dwie są wymaganiem z przewidzianym
    wyjątkiem, a wyjątek uruchamia strona druga.

    Argument wart zapamiętania wykracza poza tę regułę: zabezpieczenie
    z przewidzianym zejściem niżej jest warte tyle, ile warte jest to
    zejście. Wzorzec ten wraca w tej paczce kilka razy i aplikacja, która
    go nazwie, uczy czytania reguł, a nie tylko ich wykonywania.

    Odnotowuję, że reguła należy do rzadkiego zestawienia: kategoria wysoka
    przy klasie bez uciążliwości. Jest to szybka wygrana i powinna trafiać
    na górę listy domyślnej.
  en: |
    The rule closes the pair about a session's guard, and it is well to show all three together. Without it
    those two are a requirement with a foreseen exception, and the exception is started by the other side.

    The argument worth keeping goes beyond this rule: a safeguard with a foreseen step downwards is worth what
    that step is worth. The pattern comes back several times in this pack, and an application naming it teaches
    the reading of rules and not merely their carrying out.

    I set down that the rule belongs to a rare pairing: a high category beside the class "no disruption". It is
    a quick win and ought to come to the top of the default list.
