id: win2016-password-minimum-age

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Najkrótszy okres, przez jaki hasło musi obowiązywać
    en: Shortest time a password must stay in force
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby nowo ustawione hasło obowiązywało przynajmniej jeden
    dzień, zanim będzie można je zmienić ponownie.

    Sam w sobie ten punkt nie broni przed niczym i dlatego kategoria jest
    niska. Jego rola jest pomocnicza: zamyka jedyną drogę obejścia pamięci
    poprzednich haseł. Bez niego konto, które ma wrócić do starego hasła,
    zmienia je dwadzieścia pięć razy w ciągu jednej minuty, wypycha historię
    i ustawia z powrotem to, co miało być zapomniane. Zajmuje to krótką
    chwilę i nie wymaga żadnych uprawnień poza prawem do zmiany własnego
    hasła.

    To jest właściwa treść punktu i warto ją powiedzieć wprost: bez okresu
    minimalnego historia haseł jest ustawieniem pozornym. Dwa pozostałe
    punkty z tej grupy — pamięć poprzednich haseł i termin ważności —
    działają tylko wtedy, gdy ten jest spełniony.

    Na serwerze przypadek jest rzadszy niż na stanowisku, bo mniej ludzi
    zmienia tu hasła samodzielnie. Nie znika jednak całkiem: konta lokalne
    utrzymywane przez zespół i konta wykonawców zewnętrznych to dokładnie te,
    przy których wygoda bierze górę nad zasadą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost.
    Traci natomiast na skuteczności cała reszta zasad hasłowych, bo daje się
    je obejść w minutę, bez żadnego naruszenia uprawnień.
  en: |
    The item requires a newly set password to stay in force for at least one
    day before it can be changed again.

    On its own this item defends against nothing, and that is why the category
    is low. Its role is a supporting one: it closes the only way around the
    memory of previous passwords. Without it, an account that wants its old
    password back changes it twenty-five times in a minute, pushes the history
    out and sets back what was meant to be forgotten. It takes a short while
    and needs no privilege beyond the right to change one's own password.

    That is the real substance of the item, and it is worth saying plainly:
    without a minimum age, a password history is a setting in appearance only.
    The other two items in this group - the memory of previous passwords and
    the expiry term - work only when this one is met.

    On a server the case is rarer than on a workstation, because fewer people
    change passwords here themselves. It does not vanish entirely, though:
    local accounts kept by the team and the accounts of outside contractors
    are exactly the ones where convenience wins over the rule.

    What an attacker gains while the item goes unmet: nothing directly. What
    does lose its effect is the rest of the password policy, because it can be
    walked around in a minute with no privilege breached at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż w zwykłej pracy nikt tego nie
    zauważy. Powód klasy jest jeden i dotyczy procedur, nie ludzi.

    Po zastosowaniu reguły hasła nie da się zmienić dwa razy tego samego dnia.
    Uderza to w jeden konkretny zwyczaj: zakładanie konta z hasłem tymczasowym
    i proszenie właściciela, żeby ustawił własne od razu. Jeżeli konto zostało
    założone godzinę temu, druga zmiana zostanie odrzucona, a komunikat nie
    powie wprost, dlaczego.

    To samo dotyczy resetu hasła przez dział wsparcia. Administrator
    ustawiający hasło innemu kontu nie podlega temu ograniczeniu, więc reset
    działa — ale użytkownik, który chce po takim resecie natychmiast ustawić
    swoje, już nie. Warto o tym wiedzieć zanim zgłoszenie wróci jako
    niedziałające.

    Sprawdzenia wymagają też skrypty zakładające konta hurtem, jeśli
    w tej samej sesji ustawiają hasło dwukrotnie. Na serwerze tego rocznika
    takie skrypty bywają starsze niż zespół, który je dziś uruchamia.

    Czego to nie psuje: logowania, resetu hasła wykonywanego przez
    administratora, kont usługowych ani niczego, co zmienia hasło rzadziej
    niż raz dziennie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though in ordinary work nobody will notice it.
    The reason for the class is single and concerns procedures rather than
    people.

    Once the rule is applied, a password cannot be changed twice in the same
    day. That hits one particular habit: creating an account with a temporary
    password and asking its owner to set their own straight away. If the
    account was created an hour ago, the second change is refused, and the
    message will not say plainly why.

    The same holds for a password reset by the support desk. An administrator
    setting a password on somebody else's account is not subject to this limit,
    so the reset works - but the user who wants to set their own immediately
    afterwards cannot. Worth knowing before the ticket comes back as not
    working.

    Scripts that create accounts in bulk also need checking, if they set a
    password twice within the same run. On a server of this vintage such
    scripts are sometimes older than the team running them today.

    What this does not break: signing in, a password reset carried out by an
    administrator, service accounts, or anything that changes a password less
    often than once a day.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Hasła nie da się zmienić dwa razy w ciągu tego samego dnia
      - Zakładanie konta z hasłem tymczasowym i natychmiastowa zmiana przez właściciela przestaje działać
      - Skrypty ustawiające hasło dwukrotnie w jednym przebiegu kończą się błędem
      - Reset hasła wykonywany przez administratora działa bez zmian, bo nie podlega temu ograniczeniu
    en:
      - A password cannot be changed twice within the same day
      - Creating an account with a temporary password and having the owner change it at once stops working
      - Scripts that set a password twice in one run end in an error
      - A password reset carried out by an administrator works unchanged, since it is not subject to this limit
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedura zakładania kont wymaga dwóch zmian hasła w ciągu jednego dnia i nie da się jej przebudować
    en:
      - The account creation procedure requires two password changes within one day and cannot be reworked
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MinimumPasswordAge'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Without this, the password history is walked around in a minute: change
    # the password enough times to push the old one out and set it back. The
    # limit does not apply to an administrator resetting somebody else's
    # password.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordAge = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-age

notes:
  pl: |
    Punkt jest pomocniczy i tak go oceniam. Kategoria niska, bo sam niczego
    nie zamyka — bez niego jednak pamięć poprzednich haseł jest ustawieniem
    pozornym, dającym się obejść w minutę.

    Warto trzymać w pamięci kolejność wdrażania całej grupy: najpierw ten
    punkt, potem historia, na końcu termin ważności. Odwrotna kolejność daje
    okno, w którym wymuszona zmiana kończy się powrotem do starego hasła.

    Ograniczenie nie dotyczy administratora ustawiającego hasło innemu kontu.
    To jest właśnie ta różnica, przez którą reset działa, a samodzielna zmiana
    tuż po nim już nie.
  en: |
    The item is a supporting one and I rate it as such. The category is low,
    because it closes nothing by itself - yet without it the memory of previous
    passwords is a setting in appearance only, walked around in a minute.

    Worth keeping in mind the order in which the group is rolled out: this item
    first, then the history, and the expiry term last. The reverse order leaves
    a window in which a forced change ends in the old password coming back.

    The limit does not apply to an administrator setting a password on somebody
    else's account. That is exactly the difference that makes a reset work
    while a change made straight after it does not.
