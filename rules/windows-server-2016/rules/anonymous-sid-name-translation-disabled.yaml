id: win2016-anonymous-sid-name-translation-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Anonimowe tłumaczenie identyfikatorów na nazwy wyłączone
    en: Anonymous translation of identifiers into names switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania odpytywania maszyny bez uwierzytelnienia o to, jakiej
    nazwie konta odpowiada dany identyfikator zabezpieczeń.

    Mechanizm brzmi technicznie i niegroźnie, a jest jednym z najstarszych
    narzędzi rozpoznania w sieci Windows. Identyfikatory kont nie są losowe:
    składają się z części wspólnej dla całej domeny i z numeru porządkowego
    konta. Wbudowany administrator ma numer pięćset. Pierwsze konto założone
    w domenie ma tysiąc.

    Wystarczy więc znać część wspólną — a tę zdradza dowolne konto, nawet
    gościa — żeby zapytać po kolei o numery i dostać listę nazw. Nie jest to
    zgadywanie ani atak siłowy. To zwykłe odpytanie, na które maszyna
    odpowiada, bo jej o to poproszono.

    Wynikiem jest lista kont w domenie: nazwy administratorów, kont usług,
    kont technicznych. Konto o numerze pięćset jest wbudowanym administratorem
    niezależnie od tego, jak zostało przemianowane — więc zmiana jego nazwy,
    będąca osobnym punktem benchmarku, przestaje cokolwiek zasłaniać, dopóki
    to tłumaczenie działa.

    Na serwerze 2016 ustawienie bywa włączone po aktualizacji ze starszych
    systemów, gdzie było domyślne ze względu na zgodność z mechanizmami
    sprzed uwierzytelniania domenowego w dzisiejszej postaci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kompletną listę
    nazw kont w domenie, wraz ze wskazaniem, które z nich jest wbudowanym
    administratorem, uzyskaną bez jednego logowania.
  en: |
    The setting forbids asking the machine, without authentication, what account
    name a given security identifier answers to.

    The mechanism sounds technical and harmless, and is one of the oldest tools of
    reconnaissance in a Windows network. Account identifiers are not random: they
    are made of a part shared across the whole domain and of an account's sequence
    number. The built-in administrator has the number five hundred. The first
    account created in the domain has a thousand.

    It suffices, then, to know the shared part - and any account at all betrays it,
    a guest's included - to ask after the numbers in turn and get a list of names.
    This is neither guessing nor a brute-force attack. It is an ordinary query, to
    which the machine replies because it was asked.

    The result is a list of the accounts in the domain: the names of administrators,
    of service accounts, of technical accounts. The account numbered five hundred is
    the built-in administrator however it has been renamed - so renaming it, a
    separate item of the benchmark, ceases to veil anything so long as this
    translation works.

    On Server 2016 the setting is at times switched on after an upgrade from older
    systems, where it was the default for the sake of compatibility with mechanisms
    predating domain authentication in its present shape.

    What an attacker gains while the item goes unmet: a complete list of the account
    names in the domain, together with a pointer to which of them is the built-in
    administrator, obtained without a single sign-in.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Na maszynie w sieci złożonej wyłącznie
    z systemów dzisiejszych zmiana nie zmienia niczego — tłumaczenie bez
    uwierzytelnienia nie jest tam nikomu potrzebne.

    Sprawdzenia wymagają dwie rzeczy i obie są rozpoznawalne po objawach.
    Pierwsza to relacje zaufania z domenami starszego typu, w których
    mechanizm tłumaczenia bywa częścią uzgadniania dostępu między domenami.
    Jest to dziś sytuacja rzadka, ale gdy występuje, skutek jest natychmiastowy
    i widoczny w postaci nieprzyznanego dostępu.

    Druga to narzędzia, które pokazują nazwy właścicieli plików i uprawnień na
    udziałach. Po zmianie takie narzędzie potrafi pokazywać surowe
    identyfikatory zamiast nazw — nie dlatego, że dostęp zniknął, tylko dlatego,
    że nie ma jak przetłumaczyć numeru na nazwę bez konta. Jest to zmiana
    kosmetyczna, ale zgłaszana bywa jako awaria.

    Trzeci, najcichszy przypadek: aplikacje sprawdzające przynależność do grup
    po identyfikatorze i wyświetlające wynik po nazwie. Działają dalej,
    ale ich komunikaty stają się nieczytelne.

    Czego to nie psuje: uwierzytelniania, dostępu do plików, zasad grupy,
    pracy usług ani rozpoznawania nazw kont przez zalogowanego użytkownika.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". On a machine in a network made up wholly of
    present-day systems the change alters nothing - translation without
    authentication is needed by nobody there.

    Two things call for review and both are recognisable by their symptoms. The
    first is trust relationships with domains of an older kind, in which the
    translation mechanism is at times part of settling access between domains. This
    is a rare situation today, but where it occurs the effect is immediate and
    visible as access not granted.

    The second is tools that show the names of file owners and of rights on shares.
    After the change such a tool can show raw identifiers instead of names - not
    because access has gone, but because there is no way of translating a number
    into a name without an account. It is a cosmetic change, but it is at times
    reported as a fault.

    The third and quietest case: applications that check group membership by
    identifier and display the result by name. They go on working, but their
    messages become unreadable.

    What this does not break: authentication, access to files, group policy, the
    working of services, or the resolving of account names by a signed-in user.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - legacy-authentication
    - user-interface
  what_breaks:
    pl:
      - Relacja zaufania z domeną starszego typu potrafi przestać przyznawać dostęp, i objawia się to natychmiast
      - Narzędzia pokazujące właścicieli plików i uprawnienia wypisują surowe identyfikatory zamiast nazw kont
      - Komunikaty aplikacji sprawdzających przynależność do grup stają się nieczytelne, choć same aplikacje działają
      - Uwierzytelnianie, dostęp do plików, zasady grupy i praca usług pozostają bez zmian
    en:
      - A trust relationship with a domain of an older kind can stop granting access, and it shows at once
      - Tools showing file owners and rights write out raw identifiers instead of account names
      - The messages of applications checking group membership become unreadable, though the applications themselves work
      - Authentication, access to files, group policy and the working of services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna uczestniczy w relacji zaufania z domeną starszego typu, w której tłumaczenie bez konta bierze udział w uzgadnianiu dostępu
      - Nie sprawdzono, czy narzędzia raportujące uprawnienia na udziałach uwierzytelniają się przed odczytem
    en:
      - The machine takes part in a trust relationship with a domain of an older kind, where translation without an account has a part in settling access
      - It has not been checked whether the tools reporting rights on shares authenticate before reading
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LSAAnonymousNameLookup\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^LSAAnonymousNameLookup\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'LSAAnonymousNameLookup'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The account numbered five hundred is the built-in administrator however it has
    # been renamed, so this translation undoes the renaming for anybody who asks.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LSAAnonymousNameLookup = 0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('LSAAnonymousNameLookup = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-allow-anonymous-sidname-translation

notes:
  pl: |
    Punkt jest warunkiem skuteczności reguły o zmianie nazwy wbudowanego
    administratora. Tamta zasłania nazwę; ta zamyka okno, przez które da się
    ją odczytać mimo zasłonięcia. Wdrożona sama, tamta daje poczucie
    bezpieczeństwa bez jego treści.

    Ustawienie mieszka w zasadach zabezpieczeń, nie w rejestrze, więc audyt
    czyta je z eksportu tych zasad i bez uprawnień administratora zgłosi
    niemożność sprawdzenia, a nie brak zgodności.

    Brak wpisu w eksporcie jest tu traktowany jako niemożność sprawdzenia,
    a nie jako zgodność. Zachowanie domyślne różni się między rolami maszyny
    i wersjami systemu, więc wnioskowanie z ciszy byłoby zgadywaniem.
  en: |
    The item is the condition for the rule on renaming the built-in administrator to
    have any effect. That one veils the name; this one shuts the window through
    which it can be read despite the veil. Applied alone, that one gives the feeling
    of safety without its substance.

    The setting lives in the security policy rather than in the registry, so the
    audit reads it from an export of that policy and without administrator rights
    reports an inability to check rather than non-compliance.

    A missing entry in the export is treated here as an inability to check and not
    as compliance. The default behaviour differs between machine roles and system
    versions, so inferring from silence would be guesswork.
