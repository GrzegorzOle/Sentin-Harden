id: win2016-machine-account-password-changes-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zmiany hasła konta maszyny nie są wyłączone
    en: Machine account password changes not switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie żąda, żeby maszyna nie miała wyłączonej zmiany hasła swojego
    konta w domenie.

    Punkt jest warunkiem wstępnym reguły o okresie ważności tego hasła i tak
    powinien być czytany. Tamta mówi, jak często hasło ma się zmieniać. Ta
    rozstrzyga, czy zmienia się w ogóle. Przy wyłączonych zmianach tamta
    reguła opisuje harmonogram, który nigdy nie zostanie wykonany.

    Wyłączenie zmian jest ustawieniem, które ktoś kiedyś wprowadza z powodu
    konkretnego i zwykle uzasadnionego — najczęściej po to, żeby maszyny
    odtwarzane z obrazu nie traciły relacji zaufania z domeną. Powód jest
    prawdziwy, a lekarstwo gorsze od choroby: hasło konta maszyny przestaje
    wygasać i pozostaje ważne przez cały czas życia maszyny.

    Cena jest wysoka, bo hasła konta maszyny nikt nie wpisuje, więc jego
    przejęcie nie zostawia śladu w postaci nieudanych logowań. Odczytane raz —
    z pamięci, z kopii stanu maszyny wirtualnej, z obrazu dysku — działa bez
    końca. Jest to jedyne poświadczenie na maszynie o takiej trwałości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tożsamość
    maszyny w domenie ważną bezterminowo, odczytaną z dowolnej kopii stanu
    tej maszyny, choćby sprzed lat.
  en: |
    The setting demands that the machine not have the changing of its domain account
    password switched off.

    The item is a precondition for the rule on that password's validity period and
    should be read as such. That one says how often the password is to change. This
    one settles whether it changes at all. With changes switched off, that rule
    describes a schedule that will never be carried out.

    Switching changes off is a setting somebody introduces for a definite and
    usually justified reason - most often so that machines restored from an image do
    not lose their trust relationship with the domain. The reason is a true one, and
    the cure worse than the disease: the machine account password ceases to expire
    and stays valid for the machine's whole life.

    The price is high, because nobody types the machine account password, so taking
    it over leaves no trace in the shape of failed sign-ins. Read once - out of
    memory, out of a copy of a virtual machine's state, out of a disk image - it
    works without end. It is the one credential on the machine with such durability.

    What an attacker gains while the item goes unmet: the machine's identity in the
    domain valid without term, read out of any copy of that machine's state, be it
    years old.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Włączenie zmian nie robi nic natychmiast —
    maszyna zmieni hasło przy najbliższym upływie okresu ważności, sama,
    bez udziału człowieka i bez przerwy w pracy.

    Trzeba jednak zmierzyć się z powodem, dla którego zmiany bywają wyłączone,
    bo inaczej reguła zostanie wycofana przy pierwszym kłopocie. Powód jest
    taki: maszyna odtworzona z obrazu starszego niż ostatnia zmiana hasła
    wraca do sieci z hasłem nieaktualnym i traci zaufaną relację z domeną.
    Objawia się to komunikatem przy logowaniu i wymaga ponownego przyłączenia
    maszyny do domeny.

    Dotyczy to maszyn odtwarzanych ze starszych obrazów, maszyn zapasowych
    uruchamianych rzadko i środowisk testowych odtwarzanych z migawek.
    W żadnym z tych przypadków właściwym lekarstwem nie jest hasło
    niewygasające — właściwym jest odświeżenie obrazu albo ponowne
    przyłączenie po odtworzeniu.

    Na maszynie produkcyjnej pracującej bez przerw zmiana nie ma żadnego
    widocznego skutku.

    Czego to nie psuje: pracy maszyny w domenie, logowania użytkowników,
    zasad grupy ani kont usług.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Switching changes on does nothing at once - the
    machine will change the password at the next expiry of the validity period,
    itself, without a person's part in it and without a break in the working.

    The reason changes are at times switched off has to be met head on, though, or
    the rule will be undone at the first trouble. The reason is this: a machine
    restored from an image older than the last password change returns to the
    network with an out-of-date password and loses its trust relationship with the
    domain. It shows as a message at sign-in and calls for rejoining the machine to
    the domain.

    This concerns machines restored from older images, standby machines started
    seldom, and test environments restored from snapshots. In none of those cases is
    a never-expiring password the proper cure - the proper one is refreshing the
    image or rejoining after the restore.

    On a production machine working without breaks the change has no visible effect
    at all.

    What this does not break: the machine's working in the domain, users' sign-ins,
    group policy, or service accounts.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - virtualization-and-containers
  what_breaks:
    pl:
      - Maszyna odtworzona z obrazu starszego niż ostatnia zmiana hasła traci zaufaną relację z domeną i wymaga ponownego przyłączenia
      - Środowisko testowe odtwarzane z migawek zgłasza zerwaną relację zaufania częściej niż dotąd
      - Maszyna zapasowa uruchamiana raz na kwartał może wymagać ponownego przyłączenia przy starcie
      - Praca maszyny w domenie, logowanie użytkowników i zasady grupy pozostają bez zmian
    en:
      - A machine restored from an image older than the last password change loses its trust relationship and calls for rejoining
      - A test environment restored from snapshots reports a broken trust relationship more often than before
      - A standby machine started once a quarter may call for rejoining at start
      - The machine working in the domain, users signing in and group policy stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest odtwarzana z obrazów starszych niż okres ważności hasła i nie ma procedury ponownego przyłączenia do domeny
      - Maszyna jest zapasowa i bywa wyłączona na dłużej niż okres ważności hasła
    en:
      - The machine is restored from images older than the password validity period and there is no procedure for rejoining the domain
      - The machine is a standby one and is at times switched off longer than the password validity period
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The policy names the switching *off* of password changes, so a value of zero
      # is the requirement here and one means the safeguard is absent.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'DisablePasswordChange'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'DisablePasswordChange'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is the compliant value: the policy is named for switching changes off, so
    # leaving them on means leaving that switch at nought.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordChange' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-disable-machine-account-password-changes

notes:
  pl: |
    Jest to kolejna reguła, w której wartością zgodną jest zero, bo nazwa
    ustawienia opisuje wyłączenie mechanizmu, a nie jego włączenie. Warto to
    zaznaczyć przy czytaniu wyniku audytu.

    Punkt czyta się w parze z regułą o okresie ważności hasła konta maszyny
    i naprawia w tej kolejności: najpierw ta, potem tamta. Odwrotna kolejność
    daje harmonogram bez mechanizmu, który miałby go wykonać.

    Gdy wyłączenie zmian jest świadomą decyzją podjętą z powodu odtwarzania
    maszyn z obrazów, właściwym wynikiem pracy z aplikacją jest zapisanie
    wyjątku z uzasadnieniem i datą przeglądu — a nie pozostawienie punktu
    czerwonym w raporcie. Uzasadnienie powinno wskazywać, jak rozwiązano
    problem odtwarzania, bo od tego zależy, czy wyjątek ma sens.
  en: |
    This is another rule where the compliant value is nought, because the setting's
    name describes switching the mechanism off rather than on. Worth marking when
    reading the audit's result.

    The item reads in a pair with the rule on the machine account password's
    validity period and is mended in this order: this one first, then that. The
    reverse order gives a schedule with no mechanism to carry it out.

    Where switching changes off is a knowing decision taken on account of restoring
    machines from images, the proper result of working with the application is
    recording an exception with a justification and a review date - not leaving the
    item red in the report. The justification should say how the restoring problem
    was solved, since on that hangs whether the exception makes sense.
