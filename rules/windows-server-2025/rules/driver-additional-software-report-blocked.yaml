id: win2025-driver-additional-software-report-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Zgłaszanie prośby sterownika o dodatkowe oprogramowanie wyłączone
    en: Reporting a driver's request for additional software switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wysyłanie zgłoszenia w sytuacji, gdy zainstalowany
    sterownik prosi o doinstalowanie dodatkowego oprogramowania.

    Kategoria niska i bliźniacza wobec punktu o braku sterownika — oba
    wpisy leżą w tej samej gałęzi rejestru i oba wyłączają zgłoszenie,
    a nie działanie. Różnią się tym, o czym zgłoszenie mówi: tam
    o urządzeniu, którego system nie zna, tutaj o sterowniku, któremu samo
    sterowanie nie wystarcza.

    Ta druga sytuacja jest na serwerze warta osobnej uwagi i to jest jedyny
    powód, dla którego chcę o niej napisać więcej niż jedno zdanie.
    Sterownik proszący o dodatkowe oprogramowanie to zwykle sterownik
    sprzętu, który przychodzi z własnym narzędziem — kontrolera macierzy,
    karty zarządzającej, układu monitorowania. Takie narzędzia bywają
    najsłabiej utrzymywanym oprogramowaniem na całej maszynie i wiedza
    o tym, że serwer o nie prosił, jest wiedzą o tym, co na nim stoi.

    Zgłoszenie idzie do mechanizmu raportowania błędów, a więc tą samą
    drogą co pozostałe punkty w tej grupie. Wyłączenie go jest więc częścią
    tej samej decyzji: serwer nie opisuje się na zewnątrz przy okazji
    własnych zdarzeń.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Tak jak przy bliźniaczym punkcie, zapisuję to jako
    porządek.
  en: |
    The item switches off the sending of a report in the case where an
    installed driver asks for additional software to be installed.

    The category is low and twin to the item on a missing driver - both
    entries lie in the same registry branch and both switch off the report
    rather than the working. They differ in what the report says: there
    about a device the system does not know, here about a driver for which
    driving alone is not enough.

    This second situation is worth separate attention on a server, and that
    is the only reason I want to write more than one sentence about it. A
    driver asking for additional software is usually the driver of hardware
    that comes with a tool of its own - a disk array controller, a
    management card, a monitoring chip. Such tools are sometimes the least
    maintained software on the whole machine, and knowing that the server
    asked for them is knowing what stands on it.

    The report goes to the error-reporting mechanism, that is, by the same
    road as the other items in this group. Switching it off is therefore
    part of the same decision: a server does not describe itself outwards
    alongside its own events.

    What an attacker gains while the item goes unmet: nothing directly. As
    with the twin item, I record this as good order.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i chcę postawić tu jedno rozróżnienie, bo
    nazwa punktu potrafi zaniepokoić bardziej, niż powinna.

    Ta reguła nie zabrania instalowania dodatkowego oprogramowania i nie
    blokuje sterownikowi możliwości o nie poprosić. Ona wyłącza wysłanie
    zgłoszenia o tym fakcie. Sterownik pracuje tak samo, sprzęt pracuje tak
    samo, a jeżeli administrator zechce doinstalować narzędzie producenta,
    zrobi to dokładnie jak dotąd.

    Warto to rozróżnienie zapisać, bo kto przeczyta nazwę pośpiesznie,
    może szukać tutaj powodu, dla którego narzędzie do macierzy nie chce
    się zainstalować. Powodu tu nie ma.

    Czego to nie zmienia: instalacji sterowników, pracy urządzeń,
    dzienników zdarzeń tej maszyny. Zapis o tym, że sterownik czegoś
    zażądał, powstaje lokalnie tak samo jak przedtem — zmienia się
    wyłącznie to, że nie wychodzi na zewnątrz.

    Bez restartu, niewidoczne w codziennej pracy, natychmiast odwracalne,
    wolno zastosować hurtem.
  en: |
    The class is "no disruption", and I want to draw one distinction here,
    because the item's name can worry people more than it should.

    This rule does not forbid the installation of additional software and
    does not stop a driver from asking for it. It switches off the sending
    of a report about the fact. The driver works the same way, the hardware
    works the same way, and if an administrator wants to install the maker's
    tool they will do it exactly as before.

    The distinction is worth recording, because somebody reading the name in
    haste may look here for the reason a disk array tool will not install.
    The reason is not here.

    What this does not change: driver installation, the working of devices,
    this machine's event logs. The record that a driver asked for something
    is written locally exactly as before - all that changes is that it does
    not go outwards.

    No restart, invisible in daily work, undone immediately, may be applied
    in bulk.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Reguła nie zabrania instalowania dodatkowego oprogramowania ani nie blokuje sterownikowi możliwości o nie poprosić
      - Sterownik i sprzęt pracują tak samo, a doinstalowanie narzędzia producenta odbywa się dokładnie jak dotąd
      - Zapis o tym, że sterownik czegoś zażądał, powstaje lokalnie tak samo — zmienia się to, że nie wychodzi na zewnątrz
      - Kto przeczyta nazwę pośpiesznie, może szukać tutaj powodu, dla którego narzędzie do macierzy nie chce się zainstalować
    en:
      - The rule does not forbid installing additional software and does not stop a driver from asking for it
      - The driver and the hardware work the same way, and installing the maker's tool happens exactly as before
      - The record that a driver asked for something is written locally as before - what changes is that it does not go outwards
      - Somebody reading the name in haste may look here for the reason a disk array tool will not install
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja świadomie uczestniczy w zgłaszaniu takich próśb jako droga pozyskiwania wsparcia dla swojego sprzętu
    en:
      - The organisation deliberately takes part in reporting such requests as a way of obtaining support for its hardware
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
      $name = 'DisableSendRequestAdditionalSoftwareToWER'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    $name = 'DisableSendRequestAdditionalSoftwareToWER'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This switches off the report, not the installation. A driver may still ask
    # for additional software and an administrator may still install the maker's
    # tool exactly as before.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSendRequestAdditionalSoftwareToWER' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-overview

notes:
  pl: |
    Bliźniak punktu o braku sterownika: ta sama gałąź rejestru, to samo
    wyłączenie zgłoszenia, a nie działania. Różnica jest w tym, o czym
    zgłoszenie mówi.

    Sterownik proszący o dodatkowe oprogramowanie to zwykle sterownik
    sprzętu przychodzącego z własnym narzędziem — kontrolera macierzy,
    karty zarządzającej. Takie narzędzia bywają najsłabiej utrzymywanym
    oprogramowaniem na całej maszynie, a wiedza o tym, że serwer o nie
    prosił, jest wiedzą o tym, co na nim stoi.

    Rozróżnienie warte zapisania: reguła nie blokuje instalowania
    dodatkowego oprogramowania. Kto przeczyta nazwę pośpiesznie, będzie tu
    szukał powodu, dla którego narzędzie do macierzy nie chce się
    zainstalować. Powodu tu nie ma.
  en: |
    The twin of the item on a missing driver: the same registry branch, the
    same switching off of the report rather than the working. The difference
    is in what the report says.

    A driver asking for additional software is usually the driver of
    hardware that comes with a tool of its own - a disk array controller, a
    management card. Such tools are sometimes the least maintained software
    on the whole machine, and knowing that the server asked for them is
    knowing what stands on it.

    A distinction worth recording: the rule does not block the installation
    of additional software. Somebody reading the name in haste will look
    here for the reason a disk array tool will not install. The reason is
    not here.
