id: win11-machine-account-password-changes-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zmiany hasła konta maszyny nie są wyłączone
    en: Machine account password changes not switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Maszyna w domenie ma własne konto i własne hasło, którego nikt nie wpisuje
    i nikt nie zna. Tym hasłem maszyna potwierdza kontrolerowi, że jest tą samą
    maszyną co poprzednio, i na nim opiera się kanał służbowy do kontrolera.
    System zmienia je sam, cyklicznie, bez niczyjego udziału.

    Istnieje ustawienie, które tę zmianę wyłącza. Hasło zostaje wtedy takie, jakie
    było w dniu przyłączenia maszyny do domeny — i takie zostaje na lata.

    Dla napastnika znaczy to, że materiał wydobyty z maszyny raz zachowuje wartość
    bezterminowo. Hasło konta maszyny da się odczytać z jej lokalnego magazynu
    poświadczeń, mając uprawnienia administratora; pozwala ono podszyć się pod tę
    maszynę wobec domeny. Zwykle traci wartość po najbliższej zmianie i to właśnie
    ta zmiana jest tu wyłączana. Stara kopia dysku, obraz z laboratorium albo
    wycofany laptop stają się wtedy wiecznie ważnym poświadczeniem.
  en: |
    A machine in a domain has an account and a password of its own that nobody
    types and nobody knows. With this password the machine confirms to the
    controller that it is the same machine as before, and on it rests the working
    channel to the controller. The system changes it by itself, on a cycle, with
    nobody taking part.

    There is a setting that switches that change off. The password then stays as it
    was on the day the machine joined the domain - and stays that way for years.

    For an attacker this means material extracted from the machine once keeps its
    value indefinitely. The machine account password can be read from its local
    credential store given administrator rights; it allows one to impersonate that
    machine to the domain. Normally it loses value at the next change, and it is
    that change being switched off here. An old disk copy, a lab image or a
    withdrawn laptop then become a credential valid forever.

disruption_description:
  pl: |
    Nic nie przestaje działać. Cykliczna zmiana hasła konta maszyny jest
    zachowaniem domyślnym i przebiega w tle, bez udziału użytkownika i bez
    przerwy w pracy.

    Wyłącza się ją zwykle w dwóch sytuacjach: przy maszynach klonowanych
    z jednego obrazu i przy maszynach, które wracają do stanu z migawki po każdym
    uruchomieniu. W obu chodzi o to samo — żeby maszyna po powrocie do starego
    stanu nadal znała swoje hasło. Jest to problem prawdziwy, ale rozwiązywany
    dziś inaczej i nie przez unieruchomienie hasła na stałe.

    Maszyna odłączona od domeny na dłużej niż okres ważności hasła traci z nią
    zgodność i trzeba ją przyłączyć ponownie. Dotyczy to jednak laptopów
    leżących w szafie miesiącami, a nie pracy zdalnej, bo zmiana zachodzi przy
    pierwszym kontakcie z kontrolerem.

    Nie ma restartu. Zmiana obowiązuje od razu.
  en: |
    Nothing stops working. Cyclic change of the machine account password is the
    default behaviour and runs in the background, with no part played by the user
    and no break in work.

    It tends to be switched off in two situations: on machines cloned from a single
    image, and on machines that return to a snapshot state at every start. Both
    come down to the same thing - that the machine should still know its password
    after returning to an old state. The problem is real, but today it is solved
    otherwise and not by freezing the password permanently.

    A machine detached from the domain for longer than the password's validity
    falls out of step with it and has to be rejoined. That concerns laptops lying
    in a cupboard for months, though, not remote work, since the change happens at
    the first contact with a controller.

    There is no restart. The change takes effect at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - virtualization-and-containers
  what_breaks:
    pl:
      - Maszyny wracające do stanu z migawki po każdym uruchomieniu mogą stracić zgodność hasła z domeną
      - Stanowiska klonowane z jednego obrazu bez przygotowania systemowego mogą wymagać ponownego przyłączenia do domeny
    en:
      - Machines returning to a snapshot state at every start may fall out of step with the domain on the password
      - Stations cloned from a single image without system preparation may need rejoining to the domain
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest wirtualna i po każdym uruchomieniu wraca do stanu z migawki starszej niż okres ważności hasła
    en:
      - The machine is virtual and after every start returns to a snapshot older than the password's validity period
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The policy names the switching *off* of password changes, so a value of
      # zero is the requirement here and one means the safeguard is absent.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'DisablePasswordChange'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'DisablePasswordChange'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordChange' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-disable-machine-account-password-changes

notes:
  pl: |
    Reguła jest zapisana przez zaprzeczenie: zasada nazywa wyłączanie zmian,
    więc wymaganą wartością jest zero, a jedynka oznacza brak zabezpieczenia.
    Przy czytaniu raportu łatwo tu odwrócić sens.

    Punkt ten idzie w parze z punktem o okresie ważności hasła konta maszyny.
    Sama zgoda na zmiany niewiele znaczy, jeśli okres jest ustawiony bardzo
    długo — i odwrotnie, krótki okres nie działa, gdy zmiany są wyłączone.
    Oba trzeba czytać razem.
  en: |
    The rule is written by negation: the policy names the switching *off* of
    changes, so the required value is zero, and one means the safeguard is absent.
    The sense is easily inverted when reading the report.

    This item goes hand in hand with the one about the machine account password's
    validity period. Permitting changes means little if the period is set very
    long - and the other way round, a short period does nothing when changes are
    switched off. Both have to be read together.
