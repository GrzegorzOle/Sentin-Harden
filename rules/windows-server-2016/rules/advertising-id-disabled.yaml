id: win2016-advertising-id-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > User Profiles
  title:
    pl: Identyfikator śledzący w profilu wyłączony
    en: The tracking identifier in the profile switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza identyfikator przypisany do profilu użytkownika,
    udostępniany aplikacjom w celu rozpoznawania go między nimi.

    Mechanizm powstał po to, żeby różne aplikacje mogły rozpoznać, że mają
    do czynienia z tym samym profilem, nie znając jego nazwy. Z punktu
    widzenia bezpieczeństwa jest to identyfikator trwały, wspólny dla
    aplikacji i czytelny dla każdej z nich.

    Na serwerze zagrożenie jest niewielkie, bo aplikacji czytających ten
    identyfikator zwykle tam nie ma. Wartość reguły leży gdzie indziej:
    identyfikator trwały, wspólny dla wielu programów i przeżywający ich
    instalacje, jest sposobem powiązania ze sobą zdarzeń pochodzących
    z różnych źródeł. Jest to dokładnie ta czynność, którą chce się
    utrudnić.

    Punkt jest wąski i tani. Należy do tych, które robi się przy okazji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwały
    identyfikator pozwalający powiązać ze sobą zdarzenia pochodzące
    z różnych aplikacji.
  en: |
    The setting switches off the identifier bound to a user's profile and made available to applications so
    that they should recognise it between them.

    The mechanism came about so that different applications could recognise that they have to do with the
    same profile, without knowing its name. From the point of view of security it is a lasting identifier,
    shared among applications and legible to each of them.

    On a server the threat is a small one, there being as a rule no applications there that read that
    identifier. The rule's value lies elsewhere: a lasting identifier, shared among many programs and
    outliving their installations, is a way of tying together events coming from different sources. That is
    exactly the act one wishes to make harder.

    The item is narrow and cheap. It belongs among those done in passing.

    What an attacker gains while the item goes unmet: a lasting identifier letting events coming from
    different applications be tied together.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Identyfikator zostaje wyczyszczony, a aplikacje, które go czytają,
    otrzymują wartość pustą. Nic, co serwer robi, na tym nie stoi.

    Na stanowisku roboczym zmiana bywa widoczna w aplikacjach dobierających
    zawartość do profilu — przestają to robić. Na serwerze nie ma takich
    aplikacji.

    Nie ma znanych regresji.

    Czego to nie psuje: logowania, profili użytkownika, aplikacji
    serwerowych, ról, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The identifier is cleared, and the applications that read it get an empty value. Nothing a server does
    rests on that.

    At a workplace the change is at times visible in applications choosing their content to suit the profile
    - they cease to do so. On a server there are no such applications.

    There are no known regressions.

    What this does not break: logging on, users' profiles, server applications, roles, services, or the
    network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Aplikacje czytające identyfikator otrzymują wartość pustą zamiast ciągu rozpoznającego profil
      - Aplikacje dobierające zawartość do profilu przestają to robić, o ile w ogóle są na maszynie
      - Logowanie, profile użytkownika i aplikacje serwerowe pozostają bez zmian
      - Role serwera, usługi systemowe i praca sieci pozostają bez zmian
    en:
      - Applications reading the identifier get an empty value instead of a string recognising the profile
      - Applications choosing their content to suit the profile cease to do so, so far as any are on the machine at all
      - Logging on, users' profiles and server applications stay unchanged
      - Roles, services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja, która bez tego identyfikatora nie rozpozna własnej konfiguracji profilu
    en:
      - An application works on the machine that without that identifier will not recognise its own profile configuration
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
      $name = 'DisabledByGroupPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
    $name = 'DisabledByGroupPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The identifier is cleared and applications reading it get an empty value.
    # Nothing that a server does rests on it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisabledByGroupPolicy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Punkt jest w tym bloku najwęższy i opis powinien to przyznać. Na
    serwerze bez aplikacji czytających ten identyfikator wartość reguły
    sprowadza się do spójności — ustawienie ma być na miejscu, gdy maszyna
    zmieni przeznaczenie.

    Argument wart zachowania jest jeden: identyfikator trwały i wspólny
    dla wielu programów pozwala powiązać zdarzenia z różnych źródeł.
    Jest to ten sam typ rozumowania co przy spisie wersji oprogramowania
    i przy położeniu maszyny — pojedynczy fakt nic nie znaczy, zestawienie
    znaczy.

    Warto, żeby aplikacja pokazywała te trzy reguły jako rodzinę, bo
    broni ich wspólne rozumowanie, a osobno każda wygląda na drobiazg.
    Jest to jeden z niewielu przypadków, w których widok odwrotny —
    od skutku do reguł — wnosi coś, czego lista nie pokaże.
  en: |
    The item is the narrowest in this block and the description ought to own it. On a server without
    applications reading that identifier the rule's value comes to coherence - the setting is to be in place
    when the machine changes its purpose.

    One argument is worth keeping: a lasting identifier shared among many programs lets events from
    different sources be tied together. It is the same type of reasoning as at the inventory of software
    versions and at the machine's location - a single fact means nothing, a joining means much.

    It is well that the application show those three rules as a family, a shared reasoning defending them,
    while apart each looks a trifle. It is one of the few cases in which the reverse view - from consequence
    to rules - brings something a list will not show.
