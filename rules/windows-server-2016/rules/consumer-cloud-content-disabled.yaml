id: win2016-consumer-cloud-content-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Podsuwanie treści konsumenckich wyłączone
    en: The pushing of consumer content switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza podsuwanie treści konsumenckich: propozycji
    aplikacji, skrótów w menu startowym i pozycji instalowanych bez
    niczyjej decyzji.

    Rzecz nie polega na estetyce i warto to postawić od razu. Mechanizm ten
    pobiera z sieci listę pozycji do pokazania, a część z nich instaluje.
    Znaczy to, że na maszynie pojawia się oprogramowanie, którego nikt nie
    zamówił, wybrane przez usługę zewnętrzną i zmieniane w czasie bez
    żadnego zapowiedzenia.

    Skutki są dwa. Pierwszy dotyczy inwentaryzacji: spis zainstalowanego
    oprogramowania przestaje odpowiadać temu, co ktokolwiek świadomie
    wdrożył, a różnice między maszynami pojawiają się same. Drugi dotyczy
    drogi: instalacja odbywa się kanałem, który jest stale otwarty i
    sterowany spoza organizacji.

    Na serwerze mechanizm ten nie ma najmniejszego uzasadnienia. Jest to
    jeden z niewielu punktów, przy których trudno wskazać jakikolwiek
    przypadek przemawiający za pozostawieniem stanu domyślnego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: otwarty
    kanał, którym na maszynę trafia oprogramowanie wybierane poza
    organizacją.
  en: |
    The setting switches off the pushing of consumer content: suggestions of applications, shortcuts in
    the start menu and entries installed at nobody's decision.

    The matter is not one of taste and that is worth setting down at once. That mechanism fetches from the
    network a list of entries to show, and installs some of them. That means software nobody ordered
    appears on the machine, chosen by an outside service and changed over time with no announcement of
    any kind.

    There are two consequences. The first concerns the inventory: the register of installed software
    ceases to answer to what anybody knowingly rolled out, and differences between machines arise of
    themselves. The second concerns the road: the installing goes by a channel that stands open
    ceaselessly and is steered from outside the organisation.

    On a server that mechanism has not the slightest warrant. It is one of the few items at which it is
    hard to name any case at all speaking for the default state being left.

    What an attacker gains while the item goes unmet: an open channel by which software chosen outside the
    organisation reaches the machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm ten niczemu na serwerze nie służy. Jego wyłączenie nie
    zmienia zachowania żadnej aplikacji, żadnej usługi ani żadnej roli.

    Rzecz warta powiedzenia dotyczy tego, czego punkt nie robi. Nie usuwa
    niczego, co już zostało zainstalowane. Zamyka dopływ, a nie sprząta po
    nim — aplikacje, które pojawiły się wcześniej, zostają tam, gdzie są,
    i trzeba je usunąć osobno, jeśli mają zniknąć.

    Widoczna zmiana dotyczy menu startowego, w którym przestaną pojawiać
    się nowe pozycje. Na serwerze zauważy to wyłącznie ten, kto akurat
    patrzy w menu.

    Nie ma znanych regresji.

    Czego to nie psuje: aplikacji zainstalowanych, aktualizacji systemu,
    sklepu, usług, sieci, ról.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    That mechanism serves nothing on a server. Switching it off changes the behaviour of no application,
    no service and no role.

    A thing worth saying concerns what the item does not do. It removes nothing already installed. It
    shuts the inflow rather than tidying after it - the applications that appeared earlier stay where they
    are, and have to be removed separately if they are to go.

    The visible change concerns the start menu, in which new entries will cease to appear. On a server
    that will be noticed solely by whoever happens to be looking at the menu.

    There are no known regressions.

    What this does not break: installed applications, the system's updates, the store, services, the
    network, or roles.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - updates-and-servicing
  what_breaks:
    pl:
      - W menu startowym przestają pojawiać się nowe pozycje podsuwane z sieci
      - Aplikacje zainstalowane wcześniej tą drogą zostają tam, gdzie są, i trzeba je usunąć osobno
      - Sklep i instalowanie aplikacji na żądanie pozostają bez zmian
      - Aktualizacje systemu, usługi, role i sieć pozostają bez zmian
    en:
      - New entries pushed from the network cease to appear in the start menu
      - Applications installed earlier by that road stay where they are and have to be removed separately
      - The store and the installing of applications on demand stay unchanged
      - The system's updates, services, roles and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ma znanego przypadku, w którym ten punkt należałoby na serwerze odpuścić
    en:
      - There is no known case in which this item ought to be let go on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableWindowsConsumerFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableWindowsConsumerFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # What stops is the fetching and installing of applications nobody asked
    # for. Applications installed earlier stay where they are - this removes
    # nothing, it only closes the supply.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWindowsConsumerFeatures' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt otwiera blok o tym, co system podsuwa użytkownikowi i co przy tej
    okazji wynosi z jego profilu. Wszystkie reguły bloku są tanie; różnią
    się tym, ile faktycznie dają.

    Ta jest w bloku najmocniejsza i warto pokazywać ją pierwszą. Kanał
    instalujący oprogramowanie bez niczyjej decyzji jest czymś innym niż
    wyświetlanie porad — to drugie jest hałasem, to pierwsze jest drogą.

    Rozróżnienie między zamknięciem dopływu a posprzątaniem po nim jest
    drugą rzeczą wartą pokazania. Użytkownik, który wykona punkt
    i zobaczy, że aplikacje nadal są, ma prawo sądzić, że zmiana nie
    zadziałała. Jedno zdanie w opisie usuwa to nieporozumienie.

    Odnotowuję, że pole „kiedy nie stosować" jest tu prawie puste, i jest
    to informacja sama w sobie. W zestawie, w którym prawie każda reguła
    ma wyjątek, punkt bez wyjątku wyróżnia się i warto, żeby interfejs to
    pokazał zamiast wypełniać pole na siłę.
  en: |
    The item opens the block about what the system pushes at the user and what on that occasion it carries
    out of their profile. All the block's rules are cheap; they differ in how much they actually give.

    This one is the strongest in the block and worth showing first. A channel installing software at
    nobody's decision is another thing than the showing of tips - the latter is noise, the former is a
    road.

    The distinction between shutting the inflow and tidying after it is the second thing worth showing. A
    user who carries the item out and sees the applications still there has a right to hold that the
    change did not take. One sentence in the description removes that misunderstanding.

    Worth noting that the field "when not to apply" is here nearly empty, and that is word in itself. In a
    set where nearly every rule has an exception, an item without one stands out, and it is well that the
    interface show that rather than fill the field by force.
