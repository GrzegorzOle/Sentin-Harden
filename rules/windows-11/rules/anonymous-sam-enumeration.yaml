id: win11-anonymous-sam-enumeration

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Anonimowe wyliczanie kont zablokowane
    en: Anonymous enumeration of accounts blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Bez tego ograniczenia komputer odpowiada na pytanie o listę kont zadane bez
    logowania. Napastnik dostaje gotowy spis celów — wie, które konto jest
    administratorem, które istnieje naprawdę, a które zgadywał — i może przejść
    do zgadywania haseł, mając już połowę odpowiedzi.

    Po zablokowaniu ta sama rozmowa kończy się odmową. Nie utrudnia to ataku
    komuś, kto ma już poświadczenia, ale odbiera etap rozpoznania temu, kto
    dopiero się rozgląda — a to właśnie na tym etapie najłatwiej go zatrzymać
    najmniejszym kosztem.
  en: |
    Without this restriction the computer answers a request for the account list
    made without signing in. An attacker gets a ready-made list of targets -
    which account is an administrator, which really exists and which was a guess -
    and can move on to password guessing already holding half the answers.

    Once blocked, the same conversation ends in a refusal. This does not hinder
    somebody who already holds credentials, but it takes the reconnaissance stage
    away from someone still looking around - and that is the stage where stopping
    them costs the least.

disruption_description:
  pl: |
    Na stacji roboczej zmiana jest zwykle niewidoczna, bo nic sensownego nie
    odpytuje jej anonimowo o konta. Kłopot pojawia się tam, gdzie takie
    odpytywanie jest częścią czyjegoś procesu: systemy inwentaryzacyjne skanujące
    sieć bez poświadczeń i starsze narzędzia monitorujące, które zbierają listę
    kont lokalnych bez logowania.

    Klasa „wymaga sprawdzenia" bierze się stąd, że skutek nie objawia się na tej
    maszynie, tylko po stronie systemu, który ją odpytywał — i dlatego bywa
    zauważony z dużym opóźnieniem.
  en: |
    On a workstation the change is usually invisible, because nothing sensible
    queries it anonymously for accounts. Trouble appears where such querying is
    part of somebody's process: inventory systems scanning the network without
    credentials and older monitoring tools that collect the local account list
    without signing in.

    The "needs review" class comes from the effect showing up not on this machine
    but on the side of the system that was querying it - and therefore sometimes
    being noticed much later.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Systemy inwentaryzacyjne skanujące sieć bez poświadczeń przestaną zbierać z tej stacji listę kont
      - Starsze narzędzia monitorujące odpytujące listę kont anonimowo zaczną zgłaszać brak dostępu
    en:
      - Inventory systems scanning the network without credentials stop collecting the account list from this workstation
      - Older monitoring tools querying the account list anonymously start reporting access denied
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Sieć jest inwentaryzowana narzędziem, które odpytuje stacje o konta bez podawania poświadczeń
    en:
      - The network is inventoried by a tool that queries workstations for accounts without supplying credentials
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictAnonymousSAM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'RestrictAnonymousSAM'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictAnonymousSAM' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts

notes:
  pl: |
    Ten punkt dotyczy wyłącznie wyliczania kont. Szersze ograniczenie, obejmujące
    również udziały, jest osobnym punktem benchmarku i ma w tej paczce własną
    regułę — bo jest wyraźnie bardziej uciążliwe i użytkownik musi móc przyjąć
    jedno, a odrzucić drugie.

    Wcześniej obie wartości siedziały w tym punkcie razem. Było to wygodne przy
    pisaniu, ale w raporcie dawało ten sam punkt dwa razy i uniemożliwiało
    zaakceptowanie ryzyka na jednym z nich osobno.
  en: |
    This item covers enumerating accounts only. The wider restriction, taking in
    shares as well, is a separate benchmark item and has its own rule in this pack
    - because it is markedly more disruptive and the user has to be able to accept
    one while refusing the other.

    Both values used to sit in this item together. That was convenient to write,
    but in a report it produced the same point twice and made it impossible to
    accept the risk on one of them separately.
