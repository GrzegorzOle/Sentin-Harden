id: win2025-game-recording-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Game Recording and Broadcasting
  title:
    pl: Nagrywanie i transmitowanie obrazu z gier wyłączone
    en: Recording and broadcasting the picture from games switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zapisuje w polityce odmowę nagrywania i transmitowania obrazu
    przez wbudowany mechanizm przeznaczony dla gier.

    Zostawiam kategorię średnią i jest to w tej rodzinie jedyny punkt,
    przy którym tak robię. Powód jest w tym, że nazwa mówi o grach,
    a mechanizm mówi o obrazie.

    Jest to wbudowana w system zdolność nagrania tego, co dzieje się
    w oknie aplikacji, i wysłania tego dalej — dostępna bez instalowania
    czegokolwiek, bez śladu w wykazie zainstalowanego oprogramowania
    i bez zgody, o którą ktokolwiek musiałby poprosić. Na serwerze okno
    aplikacji to zwykle konsola administracyjna, okno bazy danych albo
    panel aplikacji biznesowej, a w sesji, którą można nagrać, wpisuje
    się hasła.

    Nie twierdzę, że jest to typowa droga wyniesienia danych — nie jest.
    Twierdzę, że jest to zdolność nagrywania ekranu obecna w systemie
    domyślnie, a przy takich zdolnościach sensowne jest pytanie, czemu
    miałaby zostać włączona na maszynie, na której nikt nie ogląda
    obrazu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wbudowany
    sposób nagrania zawartości sesji i wyniesienia jej jako pliku
    z obrazem, niewymagający wniesienia na maszynę żadnego narzędzia.
  en: |
    The item writes into the rule a denying of the recording and the sending abroad of the picture by
    the built-in working meant for games.

    I leave the category middling, and it is in this kin the one item whereat I do so. The ground lies
    in this, that the name speaks of games and the working speaks of the picture.

    It is a might built into the system to record what goes on within an application's window and to
    send it onward - to be had without the installing of anything, without a trace in the roll of
    installed software and without a leave that anybody would have to ask for. Upon a server an
    application's window is mostly a board of ruling, a window of a hoard of data or a panel of a
    business application, and within a session that may be recorded watchwords are typed.

    I say not that it is a wonted road for the bearing out of data - it is not. I say that it is a
    might of the recording of the screen that is in the system by default, and at such mights it is of
    sense to ask why it should be switched on upon a machine whereon nobody looks at the picture.

    What an attacker gains while the item goes unmet - a built-in way of recording what is in a session
    and bearing it out as a file with a picture, taking no tool to be borne onto the machine.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Na serwerze nie ma nikogo, kto
    nagrywa obraz tym mechanizmem, i nie ma aplikacji, która by go
    wywoływała.

    Zapisuję jedno zastrzeżenie, żeby nie odczytano tej reguły szerzej,
    niż sięga: nie dotyczy ona nagrywania obrazu w ogóle. Narzędzia do
    nagrywania pulpitu, rejestrowania sesji zdalnych i podglądu ekranu
    instalowane osobno działają po tej zmianie dokładnie tak jak
    przedtem, bo korzystają z własnych mechanizmów. Jeżeli w organizacji
    rejestruje się sesje administracyjne — a jest to praktyka dobra —
    ta zmiana tego nie przerywa i nie należy jej z tym mylić.

    Punkt nie wymaga przerwy, bo zapisywana jest wartość w polityce, a nie
    zatrzymywana usługa.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease". Upon a server there is nobody who records the picture by that
    working, and no application that would call upon it.

    I set down one saving, that this rule be not read wider than it reaches - it bears not upon the
    recording of the picture at large. Tools for the recording of the desk, for the writing down of
    far-off sessions and for the looking upon a screen, installed on their own, work after that change
    just as before, drawing as they do upon workings of their own. If within a household the sessions
    of ruling are written down - and it is a good wont - that change breaks it not off, and it is not
    to be mistaken for it.

    The item takes no break, a worth being written into the rule and no service stopped.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Przestaje działać wbudowane nagrywanie i transmitowanie obrazu z okna aplikacji
      - Na serwerze nie ma nikogo, kto nagrywa obraz tym mechanizmem, ani aplikacji, która by go wywoływała
      - Narzędzia do rejestrowania sesji instalowane osobno działają dokładnie tak jak przedtem
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
    en:
      - The built-in recording and sending abroad of the picture from an application's window stops working
      - Upon a server there is nobody who records the picture by that working, nor an application that would call upon it
      - Tools for the writing down of sessions, installed on their own, work just as before
      - Nothing here takes a break or a starting anew, a worth being written into the rule
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem do sprawdzania oprogramowania i obraz nagrywa się na niej tym mechanizmem
    en:
      - The machine is a stead for the testing of software and the picture is recorded upon it by that working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
      $name = 'AllowGameDVR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    $name = 'AllowGameDVR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The name says games, the mechanism says picture: this is a built-in
    # screen recorder. Separately installed session recording tools use their
    # own mechanisms and keep working.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowGameDVR' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-gamedvr

notes:
  pl: |
    Jedyny punkt tej rodziny z kategorią średnią. Nazwa mówi o grach,
    a mechanizm mówi o obrazie: jest to wbudowana zdolność nagrania
    zawartości okna aplikacji i wysłania jej dalej, bez instalowania
    czegokolwiek i bez śladu w wykazie oprogramowania.

    Na serwerze okno aplikacji to konsola administracyjna albo panel
    aplikacji biznesowej, a w sesji, którą można nagrać, wpisuje się
    hasła.

    Nie mylić z rejestrowaniem sesji administracyjnych: narzędzia
    instalowane osobno korzystają z własnych mechanizmów i ta zmiana ich
    nie dotyka.
  en: |
    The one item of that kin with a middling category. The name speaks of games and the working speaks
    of the picture - it is a built-in might to record what is in an application's window and send it
    onward, without the installing of anything and without a trace in the roll of software.

    Upon a server an application's window is a board of ruling or a panel of a business application,
    and within a session that may be recorded watchwords are typed.

    Not to be mistaken for the writing down of the sessions of ruling - tools installed on their own
    draw upon workings of their own and that change touches them not.
