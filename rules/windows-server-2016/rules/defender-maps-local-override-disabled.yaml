id: win2016-defender-maps-local-override-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Lokalne nadpisanie ustawień zgłaszania do usługi rozpoznawania zablokowane
    en: The local overriding of the reporting settings for the recognition service blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania ustawieniu miejscowemu nadpisywać zasadę
    dotyczącą zgłaszania do usługi rozpoznawania zagrożeń.

    Punkt nie mówi, czy zgłaszać. Mówi, kto o tym decyduje.

    Rzecz ta jest warta rozdzielenia, bo bywa mylona. Zasada ustawiona
    centralnie opisuje stan zamierzony. Ustawienie miejscowe pozwala ten
    stan zmienić na maszynie, a zmiana nie pojawia się nigdzie indziej —
    zasada nadal mówi swoje, maszyna robi swoje, a raport zgodności
    pokazuje zasadę.

    Powstaje wtedy rozbieżność najgorszego rodzaju: konfiguracja opisana
    i konfiguracja rzeczywista się rozjeżdżają, a nic tego nie zgłasza.
    Nie trzeba przy tym żadnego napastnika — wystarczy, że ktoś zmienił
    ustawienie miejscowo, w dobrej wierze, i zapomniał.

    Punkt tę drogę zamyka. Decyduje zasada, a nie ustawienie na maszynie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zmiany zachowania ochrony na maszynie bez zmiany tego, co pokazuje
    raport zgodności.
  en: |
    The setting forbids a local setting to override the policy touching the reporting to the threat recognition service.

    The item does not say whether to report. It says who decides.

    That is worth parting out, it being at times confused. A policy set centrally describes the intended state. A local
    setting lets that state be changed on the machine, and the change appears nowhere else - the policy still says its
    own, the machine does its own, and the report of compliance shows the policy.

    There arises then a divergence of the worst kind: the configuration described and the configuration in fact draw
    apart, and nothing reports it. No attacker is needed at that - it is enough that somebody changed a setting locally,
    in good faith, and forgot.

    The item shuts that road. The policy decides, not the setting on the machine.

    What an attacker gains while the item goes unmet: the chance to change the protection's behaviour on the machine
    without changing what the report of compliance shows.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest nietypowa,
    bo dotyczy nie tego punktu, tylko sąsiedniego.

    Ustalić trzeba, co mówi zasada, której ten punkt oddaje władzę. Od
    chwili wykonania decyduje ona, a ustawienie miejscowe przestaje mieć
    znaczenie. Jeżeli ktoś wyłączył zgłaszanie na tej maszynie świadomie —
    bo tak wymaga umowa albo bo maszyna stoi w sieci zamkniętej — to
    wyłączenie przestanie działać, a zgłaszanie ruszy zgodnie z zasadą.

    Jest to więc punkt, którego skutek zależy od stanu czegoś innego.
    Wykonany bez sprawdzenia potrafi włączyć ruch wychodzący, którego
    nikt nie zamawiał — i to jest jedyna droga, którą ta reguła może
    zaszkodzić.

    Rzecz druga: punkt nie zmienia sam z siebie zachowania ochrony.
    Odbiera tylko możliwość zmiany go miejscowo.

    Czego to nie psuje: ochrony przed zagrożeniami, skanowania, aktualizacji
    definicji, ról serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established is an unusual one, concerning not this item but its
    neighbour.

    It has to be settled what the policy says, to which this item hands the power. From the moment of carrying out it
    decides, and the local setting ceases to matter. If somebody switched the reporting off on this machine knowingly -
    because an agreement calls for it, or because the machine stands on a closed network - that switching off will cease
    to work, and the reporting will start in keeping with the policy.

    It is therefore an item whose consequence hangs on the state of something else. Carried out without a checking it may
    switch on outbound traffic nobody ordered - and that is the one road by which this rule may do harm.

    The second matter: the item does not of itself change the protection's behaviour. It takes away only the possibility
    of changing it locally.

    What this does not break: the protection against threats, scanning, the updating of definitions, the server's roles,
    services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - network-and-firewall
  what_breaks:
    pl:
      - Wyłączenie zgłaszania ustawione miejscowo przestaje działać i decyduje zasada ustawiona centralnie
      - Na maszynie, gdzie zgłaszanie wyłączono świadomie, po zmianie może ruszyć ruch wychodzący, którego nikt nie zamawia
      - Skutek tego punktu zależy od stanu zasady, której oddaje władzę, więc trzeba ją sprawdzić przed wykonaniem
      - Sam punkt nie zmienia zachowania ochrony, odbiera tylko możliwość zmiany go miejscowo
      - Ochrona przed zagrożeniami, skanowanie, aktualizacje definicji i role serwera pozostają bez zmian
    en:
      - A switching off of the reporting set locally ceases to work and the policy set centrally decides
      - On a machine where the reporting was switched off knowingly, after the change outbound traffic nobody orders may start
      - This item's consequence hangs on the state of the policy to which it hands the power, so that has to be checked beforehand
      - The item itself does not change the protection's behaviour, it takes away only the possibility of changing it locally
      - The protection against threats, scanning, the updating of definitions and the server roles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zgłaszanie wyłączono na tej maszynie świadomie i nie ustalono, co mówi zasada ustawiona centralnie
      - Maszyna stoi w sieci zamkniętej i ruch wychodzący jest na niej niepożądany niezależnie od treści
    en:
      - The reporting was switched off on this machine knowingly and it has not been settled what the policy set centrally says
      - The machine stands on a closed network and outbound traffic on it is unwanted whatever its content
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero here means the local setting may not override the policy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LocalSettingOverrideSpynetReporting'
        if ($null -eq $value) { 'MISSING' } else { ([string]$value).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'LocalSettingOverrideSpynetReporting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle what the policy says before this is laid on: from here the policy
    # decides, and a deliberate local switching off stops having any effect.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LocalSettingOverrideSpynetReporting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Punkt zamyka blok i zamyka zestaw reguł dla tego wydania. Jest przy
    tym jedynym w bloku, którego skutek zależy od stanu czegoś innego —
    i warto, żeby aplikacja to pokazała, bo podsumowanie skutków przed
    wykonaniem tego nie wyliczy.

    Rozróżnienie warte postawienia wprost: punkt nie mówi, czy zgłaszać,
    tylko kto o tym decyduje. Bez tego zdania zostanie odczytany jako
    pozycja o wysyłaniu danych i odpuszczony albo wykonany z niewłaściwego
    powodu.

    Argument wart zachowania dotyczy rozbieżności między konfiguracją
    opisaną a rzeczywistą. Jest to ten sam typ szkody co przy innych
    regułach o nadpisywaniu zasad: nic się nie psuje, nic nie zgłasza
    błędu, a raport przestaje opisywać maszynę. Dla narzędzia, którego
    treścią jest raport, jest to szkoda najpoważniejsza z możliwych.

    Odnotowuję, że wykonanie tego punktu bez sprawdzenia sąsiedniego
    potrafi włączyć ruch wychodzący. Jest to jedyna droga, którą ta reguła
    może zaszkodzić, i warto ją zapowiedzieć wprost.
  en: |
    The item shuts the block and shuts the set of rules for this release. It is at that the only one in the block whose
    consequence hangs on the state of something else - and it is well that the application show it, the summary of
    consequences before a carrying out not being able to reckon it.

    A distinction worth setting down outright: the item does not say whether to report, only who decides. Without that
    sentence it will be read as an entry about the sending of data and let go, or carried out for the wrong reason.

    The argument worth keeping concerns the divergence between the configuration described and the one in fact. It is the
    same kind of harm as at the other rules about the overriding of policies: nothing breaks, nothing reports an error,
    and the report ceases to describe the machine. For a tool whose whole substance is a report that is the gravest harm
    there can be.

    Worth noting that the carrying out of this item without a checking of its neighbour may switch on outbound traffic. It
    is the one road by which this rule may do harm, and worth announcing outright.
