id: win10-autoplay-non-volume-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Autoodtwarzanie dla urządzeń niebędących nośnikami wyłączone
    en: The playing of itself for devices that are no carriers switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza autoodtwarzanie dla urządzeń, które nie zgłaszają
    się jako nośnik z systemem plików.

    Są to aparaty, telefony, kamery i urządzenia pomiarowe podłączane
    przewodem. System nie widzi na nich napędu z literą — widzi urządzenie
    zgłaszające własną zawartość przez osobny protokół. Mimo to potrafi
    otworzyć dla nich okno wyboru czynności, tak jak dla nośnika.

    Zagrożenie polega na tym, że urządzenie samo mówi systemowi, czym
    jest. Sprzęt podłączany przewodem może podać się za aparat, choć nim
    nie jest, i wywołać obsługę przeznaczoną dla aparatu. Nie ma tu
    nośnika, który dałoby się zbadać wcześniej.

    Punkt jest uzupełnieniem wyłączenia autoodtwarzania dla napędów.
    Tamto obejmuje wszystko, co ma literę; to obejmuje resztę. Wdrożenie
    samego tamtego zostawia tę drogę otwartą i właśnie dlatego oba punkty
    istnieją osobno.

    Odnotowuję, że urządzenia pozostają dostępne. Zmienia się wyłącznie
    to, że system nie proponuje sam czynności po ich podłączeniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obsługę
    uruchamianą przez urządzenie podające się za aparat albo telefon.
  en: |
    The setting switches off the playing of itself for devices that give themselves out as no carrier with a
    system of files.

    Such are cameras, telephones, picture-takers and instruments of measuring put in by a wire. The system sees
    upon them no drive with a letter - it sees a device giving out its own content through a way of its own. For
    all that it can open for them the window of choosing a doing, as it does for a carrier.

    The danger lies in this, that the device itself tells the system what it is. A thing put in by a wire may give
    itself out for a camera while being none, and call forth the serving meant for a camera. There is here no
    carrier that might be searched beforehand.

    The item fills out the switching off of the playing of itself for drives. That one takes in everything with a
    letter; this one takes in the rest. The rolling out of that one alone leaves this road open, and for that very
    cause both items stand apart.

    I set down that the devices stay within reach. What changes is solely that the system puts forward no doing of
    itself once they are put in.

    What an attacker gains while the item goes unmet: a serving set going by a device giving itself out for a
    camera or a telephone.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie odbiera dostępu do urządzeń. Aparat podłączony przewodem
    widać w oknie plików tak jak dotąd, a program do przenoszenia zdjęć
    uruchamia się normalnie.

    Odnotowuję jedyne miejsce warte uwagi: osoby przyzwyczajone do tego,
    że po podłączeniu aparatu program sam się otwiera. Po zmianie trzeba
    go uruchomić pierwszym. Jest to zmiana odruchu, a nie możliwości.

    Miejscem drugim są urządzenia pomiarowe z własnym oprogramowaniem
    zgrywającym dane po podłączeniu. Warto sprawdzić, czy uruchamia się
    ono samo z tego mechanizmu, czy z usługi działającej stale — to
    drugie jest częstsze i punktu nie dotyczy.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: dostępu do aparatów i telefonów, przenoszenia
    zdjęć, ładowania urządzeń, pracy programów, logowania, drukowania.
  en: |
    The class is "no disruption".

    The change takes not the reach of devices. A camera put in by a wire is seen in the window of files as
    hitherto, and the program for the carrying over of pictures is set going in the ordinary manner.

    I set down the one place worth notice: people used to the program opening of itself once a camera is put in.
    After the change it will have to be set going first. It is a change of reflex and no change of what may be
    done.

    The second place is instruments of measuring with software of their own that draws off data once they are put
    in. It is worth looking at whether that is set going by this mechanism or by a service standing always - the
    latter is the commoner and the item touches it not.

    The consequence shows at once, with no restart.

    What this does not break: the reach of cameras and telephones, the carrying over of pictures, the charging of
    devices, the work of programs, logging on, or printing.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
  what_breaks:
    pl:
      - Program do przenoszenia zdjęć przestanie otwierać się sam po podłączeniu aparatu i trzeba go uruchomić pierwszym
      - Jest to zmiana odruchu, a nie możliwości, bo aparat widać w oknie plików tak jak dotąd
      - Urządzenie pomiarowe zgrywające dane po podłączeniu wymaga sprawdzenia, czy korzysta z tego mechanizmu, czy z usługi stałej
      - Usługa działająca stale jest częstsza i punktu nie dotyczy
      - Dostęp do aparatów i telefonów, ładowanie urządzeń, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - The program for the carrying over of pictures will cease to open of itself once a camera is put in and will have to be set going first
      - It is a change of reflex and no change of what may be done, the camera being seen in the window of files as hitherto
      - An instrument of measuring that draws off data once put in calls for a look at whether it uses this mechanism or a standing service
      - A service standing always is the commoner and the item touches it not
      - The reach of cameras and telephones, the charging of devices, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenie pomiarowe zgrywa dane wyłącznie przez okno czynności otwierane po podłączeniu
    en:
      - An instrument of measuring draws off data solely through the window of doings opened once it is put in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'NoAutoplayfornonVolume'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    $name = 'NoAutoplayfornonVolume'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutoplayfornonVolume' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-autoplay

notes:
  pl: |
    Reguła jest uzupełnieniem punktu o autoodtwarzaniu dla napędów
    i warto, żeby aplikacja postawiła to wprost. Tamto obejmuje wszystko,
    co ma literę napędu; ten punkt obejmuje resztę. Wdrożenie samego
    tamtego zostawia drogę otwartą i dlatego oba istnieją osobno.

    Argument wart postawienia wprost dotyczy tego, skąd system wie, czym
    jest podłączone urządzenie. Wie stąd, że urządzenie samo mu to mówi.
    Nie ma tu nośnika, który dałoby się zbadać, ani systemu plików, który
    dałoby się przejrzeć — jest wyłącznie deklaracja sprzętu.

    Odnotowuję, że koszt sprowadza się do zmiany odruchu. Warto to
    powiedzieć, bo zgłoszenia po wdrożeniu brzmią zwykle „aparat przestał
    działać", a chodzi o to, że program trzeba uruchomić jako pierwszy.
  en: |
    The rule fills out the item about the playing of itself for drives, and it is well that the application put
    that outright. That one takes in everything with a letter of a drive; this item takes in the rest. The rolling
    out of that one alone leaves the road open, and therefore both stand apart.

    The argument worth putting outright touches whence the system knows what the put-in device is. It knows it
    because the device tells it so. There is here no carrier that might be searched, nor a system of files that
    might be looked over - there is only the thing's own declaring.

    I set down that the cost comes to a change of reflex. It is worth saying, reports after the rollout commonly
    running "the camera has stopped working", while the matter is that the program has to be set going first.
