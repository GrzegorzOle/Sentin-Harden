id: win10-machine-account-password-age-limited

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Okres ważności hasła konta maszyny ograniczony do 30 dni
    en: Machine account password validity limited to 30 days
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Skoro hasło konta maszyny zmienia się samo, pozostaje pytanie jak często.
    Domyślny okres jest dłuższy niż miesiąc, a każdy dodatkowy dzień to dzień,
    w którym hasło wyjęte z maszyny wciąż działa.

    Trzydzieści dni zawęża to okno bez żadnego kosztu po stronie pracy: zmiana
    przebiega w tle, użytkownik jej nie widzi, a kontroler domeny przyjmuje nowe
    hasło od ręki.

    Zdejmowane ryzyko to trwałość podszycia się pod maszynę. Napastnik, który
    wydobył hasło konta maszyny z pamięci albo z dysku, traci je wraz z najbliższą
    zmianą, zamiast utrzymywać tożsamość maszyny miesiącami.
  en: |
    Since the machine account password changes by itself, the question left is how
    often. The default term runs longer than a month, and every extra day is a day
    on which a password lifted from the machine still works.

    Thirty days narrows that window at no cost to the work - the change happens in
    the background, the user never sees it, and the domain controller takes the
    new password at once.

    The risk taken away is the persistence of posing as the machine. An attacker
    who pulled the machine account password out of memory or off the disk loses it
    with the next change, instead of holding the machine s identity for months.

disruption_description:
  pl: |
    Na maszynie pracującej w sieci zmiana jest niewidoczna. Nie wymaga przerwy,
    ponownego uruchomienia ani żadnego działania użytkownika.

    Uwagi wymagają maszyny bywające długo poza siecią. Jeśli okres ważności minie,
    a maszyna nie będzie miała kontaktu z kontrolerem domeny, zmiana odbędzie się
    przy najbliższym połączeniu — to jest zachowanie prawidłowe, ale krótszy okres
    oznacza, że taka sytuacja zdarza się częściej.
  en: |
    On a machine working in the network the change is invisible. It calls for no
    interruption, no restart and no action by the user.

    Machines that spend long stretches off the network do need attention. Where
    the term runs out while the machine has no contact with a domain controller,
    the change happens at the next connection - correct behaviour, but a shorter
    term means that situation arises more often.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Maszyny długo pozostające poza siecią będą zmieniać hasło zaraz po powrocie, co zwiększa ruch do kontrolera domeny przy logowaniu
      - Odtworzenie maszyny z migawki starszej niż okres ważności kończy się utratą zaufania do domeny częściej niż przy okresie domyślnym
      - Narzędzia utrzymujące własny obraz kont maszyn w katalogu będą widziały zmiany częściej i muszą to znieść
      - Logowanie użytkowników, praca na maszynie, zasady grupy i usługi działają bez zmian
    en:
      - Machines long off the network change the password right after returning, which raises traffic to the domain controller at sign-in
      - Restoring a machine from a snapshot older than the term ends in lost domain trust more often than with the default term
      - Tools keeping their own picture of machine accounts in the directory see changes more often and have to take it
      - User sign-in, work on the machine, group policy and services are all unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny odtwarzane z migawek, gdzie krótszy okres zwiększa ryzyko rozejścia się hasła z katalogiem
      - Stanowiska używane sezonowo, przez większość roku wyłączone, gdzie hasło i tak wygasa między jednym a drugim użyciem
    en:
      - Machines restored from snapshots, where a shorter term raises the risk of the password drifting from the directory
      - Stations used seasonally and switched off most of the year, where the password expires between one use and the next anyway
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'MaximumPasswordAge'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '30'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'MaximumPasswordAge'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaximumPasswordAge' -Value 30 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-maximum-machine-account-password-age

notes:
  pl: |
    Punkt ma znaczenie wyłącznie przy włączonych zmianach hasła konta maszyny —
    przy wyłączonych okres jest liczbą bez skutku. Obie reguły ocenia się razem.
  en: |
    The item matters only where machine account password changes are on; with them
    off the term is a number with no effect. The two rules are judged together.
