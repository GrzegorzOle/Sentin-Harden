id: win10-undock-device-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odłączanie maszyny ze stacji dokującej tylko dla administratorów
    en: The taking of the machine off a station of docking for administrators only
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo odłączania maszyny ze stacji dokującej dla
    administratorów lokalnych.

    Odłączenie przez system jest operacją uporządkowaną: maszyna kończy
    pracę z urządzeniami stacji, zamyka otwarte na nich pliki i dopiero
    wtedy zwalnia zatrzask. Prawo to rozstrzyga, kto może tę operację
    uruchomić z poziomu systemu.

    Zagrożenie jest niewielkie i warto to powiedzieć wprost. Punkt ten
    utrudnia zabranie maszyny przenośnej bez wiedzy obsługi, ale nie
    uniemożliwia tego — stacje dokujące mają zwolnienie mechaniczne,
    a maszynę da się po prostu wyłączyć i odłączyć.

    Wartością jest ślad. Odłączenie przez system zostawia zapis
    w dzienniku; odłączenie mechaniczne zostawia maszynę, która przestała
    odpowiadać. Druga postać jest zauważalna, choć nie od razu.

    Odnotowuję, że na maszynie stacjonarnej, która nigdy nie stała
    w stacji dokującej, punkt nie ma zastosowania praktycznego.

    Sprawdzenie przyjmuje wykaz węższy niż wymagany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uporządkowanego zabrania maszyny ze stacji, bez zwracania uwagi.
  en: |
    The setting reserves the right of taking a machine off a station of docking to the local administrators.

    The taking off through the system is an ordered doing: the machine ends its work with the station's apparatus,
    shuts the files open upon them and only then lets the catch go. That right settles who may start that doing
    from within the system.

    The danger is small and that is worth saying outright. This item makes the carrying away of a machine without
    its keepers' knowing the harder, but does not make it not to be done - stations of docking have a letting go
    by hand, and a machine may simply be switched off and unplugged.

    The worth lies in the trace. A taking off through the system leaves a record in the journal; a taking off by
    hand leaves a machine that has ceased to answer. The second shape is to be marked, though not at once.

    I set down that upon a machine that stands still and has never stood in a station of docking the item bears no
    weight in practice.

    The check takes a list narrower than the one called for.

    What an attacker gains while the item goes unmet: the ordered carrying away of a machine from its station,
    without drawing notice.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy ktoś
    odłącza maszynę ze stacji w ramach normalnej pracy.

    Miejscem oczywistym jest maszyna przenośna używana naprzemiennie przy
    biurku i poza nim. Osoba z niej korzystająca po zmianie nie zobaczy
    w menu pozycji odłączenia i będzie musiała maszynę wyłączyć albo
    wysunąć ją mechanicznie — a wtedy pliki otwarte na dyskach stacji
    zostaną zamknięte nieuporządkowanie.

    Skutek jest widoczny dla użytkownika: pozycja znika z menu bez
    wyjaśnienia. Nie pojawia się komunikat o braku prawa, tylko sama opcja
    przestaje być dostępna, co utrudnia domyślenie się przyczyny.

    Sprawdzenie polega na ustaleniu, czy maszyna w ogóle bywa dokowana.
    Na stanowisku stacjonarnym punkt nic nie kosztuje.

    Skutek pojawia się natychmiast, bez restartu i bez wylogowania.

    Czego to nie psuje: pracy z urządzeniami stacji, logowania, dostępu do
    plików, drukowania, zasilania maszyny.
  en: |
    The class is "needs review", and the object of the review is whether anybody takes the machine off its station
    in the ordinary course of work.

    The plain place is a machine to be carried, used by turns at a desk and away from it. Whoever uses it will
    after the change not see in the menu the entry for the taking off and will have to switch the machine off or
    draw it out by hand - and then the files open upon the station's disks will be shut unordered.

    The consequence is plain to the user: the entry vanishes from the menu without a setting out. No message about
    a right that is wanting shows, only the choice itself ceases to stand open, which makes the guessing of the
    cause harder.

    The review comes down to a settling of whether the machine is docked at all. Upon a station that stands still
    the item costs nothing.

    The consequence shows at once, with no restart and no signing out.

    What this does not break: work with the station's apparatus, logging on, the way to files, printing, or the
    machine's power.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Osoba korzystająca z maszyny przenośnej nie zobaczy w menu pozycji odłączenia ze stacji
      - Pliki otwarte na dyskach stacji zostaną zamknięte nieuporządkowanie przy wysunięciu mechanicznym
      - Nie pojawia się komunikat o braku prawa, tylko sama opcja znika, co utrudnia domyślenie się przyczyny
      - Na stanowisku stacjonarnym, które nigdy nie stało w stacji dokującej, punkt nic nie kosztuje
      - Praca z urządzeniami stacji, logowanie, dostęp do plików, drukowanie i zasilanie maszyny pozostają bez zmian
    en:
      - Whoever uses a machine to be carried will not see in the menu the entry for the taking off from the station
      - Files open upon the station s disks will be shut unordered at a drawing out by hand
      - No message about a right that is wanting shows, only the choice itself vanishes, which makes the guessing of the cause harder
      - Upon a station that stands still and has never stood in a station of docking the item costs nothing
      - Work with the station s apparatus, logging on, the way to files, printing and the machine s power stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest przenośna i osoba z niej korzystająca odłącza ją ze stacji w ramach normalnej pracy
    en:
      - The machine is one to be carried and whoever uses it takes it off its station in the ordinary course of work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeUndockPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeUndockPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeUndockPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeUndockPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeUndockPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/remove-computer-from-docking-station

notes:
  pl: |
    Reguła jest wraz z punktem o zamykaniu systemu najniżej oceniona
    w całym bloku przywilejów. Warto, żeby aplikacja powiedziała wprost,
    że nie zamyka ona drogi ataku, tylko odbiera drodze fizycznej
    wygodę — bo obietnica większa byłaby tu nieuczciwa.

    Argument wart zachowania dotyczy śladu. Odłączenie przez system
    wygląda na czynność zwykłą i przechodzi bez echa. Wyłączenie maszyny
    albo mechaniczne jej wysunięcie zostawia maszynę, która nagle
    przestała odpowiadać — i to jest zauważalne, choć nie natychmiast.
    Cała wartość punktu leży w tej różnicy.

    Odnotowuję objaw po stronie użytkownika, bo jest tu nietypowy.
    W większości punktów tej rodziny system odmawia z komunikatem;
    tutaj pozycja po prostu znika z menu. Osoba, która jej szuka, nie
    dowie się, dlaczego jej nie ma, więc aplikacja powinna to wymienić.
  en: |
    The rule is, together with the item about the shutting down of the system, the lowest graded of the whole
    block of privileges. It is well that the application say outright that it shuts no road of attack but takes
    the ease from the bodily road - a greater promise would here be dishonest.

    The argument worth keeping touches the trace. A taking off through the system looks an ordinary doing and
    passes without echo. The switching off of the machine or the drawing of it out by hand leaves a machine that
    has of a sudden ceased to answer - and that is to be marked, though not at once. The whole worth of the item
    lies in that difference.

    I set down the mark of it upon the user's side, that being here out of the common. In most items of this
    family the system refuses with a message; here the entry simply vanishes from the menu. Whoever looks for it
    will not learn why it is gone, so the application ought to name that.
