id: win11-defender-asr-credential-stealing

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wykradania poświadczeń z procesu logowania
    en: Credential theft from the sign-in process blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Proces obsługujący logowanie trzyma w pamięci materiał, którym maszyna
    potwierdza tożsamość zalogowanych osób. Odczytanie tej pamięci daje
    poświadczenia wszystkich kont, które logowały się od ostatniego restartu —
    bez łamania hasła i bez pytania kogokolwiek.

    To jest najczęściej wykonywany krok pomiędzy zdobyciem jednej maszyny
    a zdobyciem kolejnych, bo zdobyte w ten sposób poświadczenia działają
    wszędzie tam, gdzie działałaby osoba, do której należą. Reguła blokuje
    odczyt tej pamięci przez procesy, które nie mają powodu jej czytać,
    i zamyka tym samym najkrótszą drogę do rozszerzenia dostępu.
  en: |
    The process handling sign-in keeps in memory the material with which the
    machine confirms the identity of those signed in. Reading that memory yields
    the credentials of every account that has signed in since the last restart -
    without breaking a password and without asking anybody.

    This is the most commonly performed step between taking one machine and taking
    the next, because credentials obtained this way work everywhere the person
    they belong to would work. The rule blocks reading that memory by processes
    with no reason to read it, and so closes the shortest route to widening
    access.

disruption_description:
  pl: |
    Nic. Żadne oprogramowanie używane w normalnej pracy nie czyta pamięci procesu
    logowania — składniki systemu, które muszą się z nim porozumiewać, robią to
    przewidzianymi do tego drogami, a nie przez odczyt pamięci.

    Wyjątkiem bywają narzędzia diagnostyczne zrzucające pamięć procesów przy
    analizie awarii oraz część starszego oprogramowania zabezpieczającego.
    Pierwsze uruchamia się doraźnie i można je uruchomić po czasowym wyłączeniu
    reguły; drugie zgłasza się z własnymi wykluczeniami. Na stacji roboczej to
    zmiana niewidoczna.
  en: |
    Nothing. No software used in normal work reads the sign-in process's memory -
    the system components that must communicate with it do so by routes provided
    for the purpose, not by reading memory.

    The exceptions are diagnostic tools that dump process memory when analysing a
    crash, and some older security software. The first is run occasionally and can
    be run after temporarily disabling the rule; the second comes with its own
    exclusions. On a workstation this is an invisible change.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Narzędzia diagnostyczne zrzucające pamięć procesu logowania przestaną to robić
      - Starsze oprogramowanie zabezpieczające czytające tę pamięć może wymagać wykluczenia
    en:
      - Diagnostic tools dumping the sign-in process's memory stop doing so
      - Older security software reading that memory may need an exclusion
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie trwa analiza awarii wymagająca zrzutu pamięci procesu logowania
    en:
      - The machine is undergoing crash analysis requiring a memory dump of the sign-in process
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Wartość jest napisem, nie liczbą — tak zapisuje te reguły polityka grupy
    i tak trzeba je zapisać, żeby Defender je odczytał. Sprawdziłem typ wartości
    na maszynie testowej; przełącznik nadrzędny jest liczbą, a same reguły
    napisami, i ta niespójność jest w ustawieniu, nie w regule.

    Reguła działa tylko przy włączonym przełączniku nadrzędnym. Zapis bez niego
    jest deklaracją bez skutku, więc oba punkty czyta się razem — i dlatego
    raport nie powinien pokazywać tego punktu jako spełnionego w oderwaniu od
    tamtego.

    Z całej grupy reguł ograniczania powierzchni ataku ta ma najlepszy stosunek
    zysku do kosztu: blokuje krok wykonywany niemal w każdym ataku na sieć
    i nie przeszkadza w niczym, co ktokolwiek robi na co dzień.
  en: |
    The value is a string rather than a number - that is how group policy writes
    these rules and how they must be written for Defender to read them. I checked
    the value type on a test machine; the master switch is a number while the
    rules themselves are strings, and that inconsistency is in the setting, not in
    the rule.

    The rule works only with the master switch enabled. Written without it, it is
    a declaration without effect, so the two items are read together - and the
    report should therefore not show this one as satisfied in isolation from that
    one.

    Of the whole attack surface reduction group this rule has the best ratio of
    gain to cost: it blocks a step performed in almost every attack on a network
    and gets in the way of nothing anybody does day to day.
