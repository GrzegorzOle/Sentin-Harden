id: win2025-create-global-objects-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie obiektów globalnych ograniczone do kont usługowych
    en: Creating global objects restricted to service accounts
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala utworzyć obiekt jądra w przestrzeni globalnej —
    widocznej dla wszystkich sesji na maszynie, a nie tylko dla tej,
    w której obiekt powstał.

    Podział na przestrzeń globalną i przestrzenie sesji jest granicą
    między użytkownikami. Obiekt utworzony w sesji własnej jest
    widoczny tylko dla niej; obiekt globalny widzą wszyscy i wszyscy
    mogą go użyć. Prawo to jest więc pozwoleniem na sięgnięcie poza
    własną sesję.

    Zagrożenie polega na wyprzedzeniu. Usługi odwołują się do obiektów
    globalnych po nazwie i przyjmują ten, który zastaną. Kto utworzy
    obiekt o nazwie oczekiwanej przed usługą, ten zostaje w tej roli —
    a usługa albo nie wstanie, albo będzie komunikować się z czymś
    obcym, nie wiedząc o tym.

    Na serwerze wachlarz jest szerszy niż na stanowisku roboczym
    z powodu wielu sesji. Serwer terminali uruchamia dziesiątki sesji
    użytkowników, a każda z nich z tym prawem mogłaby sięgnąć do
    przestrzeni wspólnej — czyli do obszaru, w którym pracują usługi
    całej maszyny.

    Punkt zawęża wykaz do kont usług wbudowanych, administratorów
    i usług sieciowych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    z własnej sesji do przestrzeni wspólnej maszyny, przez zajęcie
    nazwy oczekiwanej przez usługę.
  en: |
    The right allows a kernel object to be made in the global space - seen by every session on
    the machine rather than only by the one the object arose in.

    The parting into a global space and sessions' spaces is a bound between users. An object
    made in one's own session is seen only by it; a global object is seen by all and may be
    used by all. The right is thus a leave to reach beyond one's own session.

    The danger lies in getting ahead. Services refer to global objects by name and take the one
    they find. Whoever makes an object of the awaited name before the service does stays in
    that part - and the service will either not come up or will talk to something foreign
    without knowing it.

    On a server the spread is wider than at a working station by reason of the many sessions. A
    terminal server starts dozens of users' sessions, and each of them with this right could
    reach into the shared space - that is, into the field the whole machine's services work in.

    The item narrows the list to the accounts of built-in services, administrators and network
    services.

    What an attacker gains while the item goes unmet: a road from their own session into the
    machine's shared space, by taking a name a service awaits.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze pracuje aplikacja
    tworząca obiekty globalne z konta spoza wykazu, bo po zawężeniu
    przestanie móc to robić.

    Wykaz zgodny obejmuje konta usług wbudowanych, administratorów
    i usługi sieciowe. Usługi systemowe działają po zmianie bez różnicy.

    Przypadkiem do sprawdzenia jest oprogramowanie starsze, zwłaszcza
    bazy danych i systemy przetwarzania wsadowego. Aplikacje takie
    tworzą obiekty globalne do koordynacji między własnymi procesami
    i robią to od lat, często z konta utworzonego przy instalacji.

    Objaw bywa gwałtowny: aplikacja nie wstaje i zgłasza błąd tworzenia
    obiektu. Bywa też częściowy, jeżeli aplikacja umie sobie poradzić
    bez koordynacji globalnej — wtedy działa, ale gorzej, i nie mówi
    dlaczego.

    Na serwerze terminali przypadek jest szczególny: aplikacja
    uruchamiana w sesjach użytkowników i tworząca obiekt globalny do
    komunikacji między sesjami przestanie działać dla wszystkich naraz.

    Rozwiązaniem nie jest dodanie konta do administratorów. Właściwym
    krokiem jest wyjątek obejmujący to konkretne konto.
  en: |
    What needs checking is whether an application that makes global objects from an account
    outside the list works on this server, since after the narrowing it will no longer be able
    to.

    The compliant list takes in the accounts of built-in services, administrators and network
    services. System services work after the change with no difference.

    The case to be checked is older software, databases and batch processing systems above all.
    Such applications make global objects for coordination among their own processes and have
    done so for years, often from an account made at the installation.

    The symptom is at times abrupt: the application does not come up and reports an error
    making an object. It is at times partial too, where the application can manage without
    global coordination - then it works, but worse, and does not say why.

    On a terminal server the case is particular: an application started in users' sessions and
    making a global object for talk between sessions will stop working for everyone at once.

    The answer is not adding the account to the administrators. The right step is an exception
    taking in that particular account.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - remote-desktop
    - virtualization-and-containers
  what_breaks:
    pl:
      - Aplikacja starsza tworząca obiekty globalne z konta własnego nie wstanie
      - Objaw bywa częściowy — aplikacja działa gorzej i nie mówi dlaczego
      - Na serwerze terminali aplikacja komunikująca się między sesjami przestanie działać dla wszystkich
      - Usługi na kontach wbudowanych zachowują prawo i działają bez zmiany
    en:
      - An older application making global objects from an account of its own will not come up
      - The symptom is at times partial - the application works worse and does not say why
      - On a terminal server an application talking between sessions will stop working for everyone
      - Services under built-in accounts keep the right and work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje baza danych albo system wsadowy tworzący obiekty globalne z konta własnego
      - Aplikacja na serwerze terminali komunikuje się między sesjami przez obiekt globalny
    en:
      - A database or a batch system making global objects from an account of its own works on the server
      - An application on a terminal server talks between sessions through a global object
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreateGlobalPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20,S-1-5-32-544,S-1-5-6|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreateGlobalPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreateGlobalPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeCreateGlobalPrivilege = *S-1-5-32-544,*S-1-5-6,*S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateGlobalPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-global-objects

notes:
  pl: |
    Punkt dotyczy przestrzeni nazw jądra, a nie zasobów sieciowych.
    „Globalny" znaczy tu widoczny dla wszystkich sesji na tej maszynie.

    Prawo jest bliskie tworzeniu trwałych obiektów współdzielonych, ale
    dotyczy innej własności. Tamto przesądza, czy obiekt przetrwa proces;
    to — czy jest widoczny poza własną sesją.

    Na serwerze terminali punkt waży najwięcej, bo sesji jest wiele
    i każda z tym prawem mogłaby sięgnąć do przestrzeni wspólnej.
  en: |
    The item bears on the kernel's namespace rather than on network resources. "Global" here
    means seen by every session on this machine.

    The right is close to the making of permanent shared objects but bears on another property.
    That one settles whether an object outlives its process; this one, whether it is seen
    beyond one's own session.

    On a terminal server the item weighs most, since the sessions are many and each with this
    right could reach into the shared space.
