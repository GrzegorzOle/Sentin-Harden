id: win2025-domain-secure-channel-strong-key-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera wymaga silnego klucza sesji
    en: The secure channel to the controller requires a strong session key
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby klucz uzgadniany dla kanału bezpiecznego
    był kluczem mocnym, bez możliwości zejścia do wariantu słabszego.

    Trzy pozostałe punkty tej grupy mówią, czy ruch ma być chroniony.
    Ten mówi, czym ma być chroniony — i jest to pytanie osobne,
    ponieważ ochrona zbudowana na kluczu krótkim jest ochroną tylko
    z nazwy.

    Schemat ataku jest tu znajomy i powtarza się w wielu miejscach
    tego benchmarku: napastnik nie łamie zabezpieczenia, tylko
    doprowadza do tego, żeby uzgodniono zabezpieczenie słabsze. Strona
    podszywająca się pod stronę starą proponuje klucz krótki,
    a maszyna bez tego wymagania na to przystaje. Dalej wystarczy już
    tylko moc obliczeniowa, a klucza krótkiego nie broni dziś nic.

    Skutkiem złamania klucza jest odczyt i zmiana ruchu kanału —
    czyli dokładnie to, przed czym bronią trzy pozostałe punkty.
    Dlatego ten punkt jest ich warunkiem, a nie dodatkiem do nich.

    Na serwerze waga jest większa niż na stanowisku roboczym, bo kanał
    prowadzony jest stale, a na kontrolerze domeny prowadzony jest
    również wobec innych kontrolerów i domen zaufanych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wymuszenia klucza słabego, a przez to obejścia ochrony,
    którą trzy pozostałe punkty tej grupy zapewniają tylko z pozoru.
  en: |
    The setting requires that the key agreed for the secure channel be a strong one, with no way
    down to a weaker variant.

    The other three items of this group say whether traffic is to be guarded. This one says what
    it is to be guarded with - and that is a question apart, since a guard built on a short key
    is a guard in name alone.

    The pattern of the attack is here a familiar one and repeats in many places of this
    benchmark: the attacker does not break the safeguard but brings it about that a weaker
    safeguard is agreed. A side giving itself out for an old one proposes a short key, and a
    machine without this requirement assents. Thereafter computing power alone is wanted, and
    nothing today defends a short key.

    The effect of a broken key is the reading and changing of the channel's traffic - that is,
    just what the other three items guard against. Hence this item is their condition rather
    than an addition to them.

    On a server the weight is greater than at a working station, the channel being kept steadily,
    and on a domain controller kept towards other controllers and trusted domains as well.

    What an attacker gains while the item goes unmet: the means of forcing a weak key, and
    thereby of getting round a guard the other three items of this group give only in seeming.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w tej domenie pozostały kontrolery albo
    domeny zaufane niepotrafiące uzgodnić klucza mocnego.

    W praktyce takich nie ma. Wymaganie to spełniają wszystkie systemy
    z ostatnich wielu lat, a nowsze wersje egzekwują je niezależnie od
    ustawienia. Na serwerze pracującym w domenie zbudowanej ze
    współczesnych systemów naprawa nie zmienia więc niczego.

    Sprawdzenie jest wymagane z powodu skutku, a nie z powodu
    prawdopodobieństwa. Ten punkt — w odróżnieniu od podpisywania
    i szyfrowania „gdy druga strona to potrafi" — zrywa połączenie
    z drugą stroną, która wymagania nie spełnia. Jest to zachowanie
    zamierzone i na tym polega jego wartość, ale znaczy też, że
    pomyłka w rozpoznaniu środowiska kosztuje.

    Przypadkiem brzegowym jest relacja zaufania z domeną starszą,
    utrzymywana po to, żeby jakaś aplikacja nadal działała, oraz
    urządzenie niebędące systemem Windows, które dołączono do domeny
    własną implementacją protokołu.

    Objaw byłby wtedy gwałtowny: maszyna traci kanał bezpieczny,
    logowanie kontami domenowymi przestaje działać, a w dzienniku
    pojawiają się wpisy o niepowodzeniu nawiązania kanału.

    Zmiana wchodzi w życie przy następnym nawiązywaniu kanału i nie
    wymaga restartu.
  en: |
    What needs checking is whether any controllers or trusted domains unable to agree a strong
    key are left in this domain.

    In practice there are none. Every system of the last many years meets the requirement, and
    newer versions enforce it whatever this setting says. On a server working in a domain built
    of present-day systems the mending thus changes nothing.

    The check is asked for by reason of the effect rather than of the likelihood. This item -
    unlike the signing and encryption "where the other side can" - breaks the connection with a
    side that does not meet the requirement. That behaviour is meant and therein lies its worth,
    but it also means that a mistake in reading the surroundings costs.

    The edge case is a trust relation with an older domain, kept up so that some application may
    go on working, and a device that is no Windows system, joined to the domain by an
    implementation of the protocol of its own.

    The symptom would then be abrupt: the machine loses the secure channel, logging in with
    domain accounts stops working, and entries about a failure to set up the channel appear in
    the log.

    The change comes into force at the next setting up of the channel and takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Druga strona niepotrafiąca uzgodnić klucza mocnego zostanie odrzucona, a połączenie zerwane
      - Urządzenie spoza rodziny Windows z własną implementacją protokołu może stracić członkostwo w domenie
      - Po zerwaniu kanału logowanie kontami domenowymi na tej maszynie przestaje działać
      - W domenie zbudowanej ze współczesnych systemów zmiana nie robi nic, bo wymaganie jest już spełnione
    en:
      - A side unable to agree a strong key will be turned away and the connection broken
      - A device outside the Windows family with an implementation of the protocol of its own may lose its domain membership
      - After the channel breaks, logging in with domain accounts on this machine stops working
      - In a domain built of present-day systems the change does nothing, the requirement being met already
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W domenie utrzymywana jest relacja zaufania z domeną starszą ze względu na aplikację
      - Do domeny dołączono urządzenie spoza rodziny Windows z własną implementacją protokołu
    en:
      - A trust relation with an older domain is kept up in the domain for an application's sake
      - A device outside the Windows family with an implementation of the protocol of its own was joined to the domain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'RequireStrongKey'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'RequireStrongKey'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireStrongKey' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-require-strong-windows-2000-or-later-session-key

notes:
  pl: |
    Punkt jest warunkiem trzech pozostałych z grupy kanału
    bezpiecznego, a nie dodatkiem do nich. Ochrona zbudowana na kluczu
    słabym jest ochroną tylko z nazwy.

    W odróżnieniu od podpisywania i szyfrowania „gdy druga strona to
    potrafi" ten punkt zrywa połączenie z drugą stroną niespełniającą
    wymagania. Na tym polega jego wartość i stąd bierze się wymóg
    sprawdzenia.

    Nowsze wersje systemu egzekwują to wymaganie niezależnie od
    ustawienia.
  en: |
    The item is the condition of the other three of the secure channel group rather than an
    addition to them. A guard built on a weak key is a guard in name alone.

    Unlike the signing and encryption "where the other side can", this item breaks the
    connection with a side that does not meet the requirement. Therein lies its worth, and
    thence the call for a check.

    Newer versions of the system enforce this requirement whatever the setting says.
