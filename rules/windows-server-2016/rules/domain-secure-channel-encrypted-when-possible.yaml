id: win2016-domain-secure-channel-encrypted-when-possible

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera szyfrowany, gdy druga strona to potrafi
    en: The secure channel to the controller encrypted where the other side can
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie żąda szyfrowania ruchu w kanale do kontrolera domeny wszędzie
    tam, gdzie druga strona szyfrowanie obsługuje.

    Jest to bliźniacza reguła wobec podpisywania i różni się od niej tym,
    przed czym broni. Podpis chroni przed podmianą; szyfrowanie przed
    odczytaniem. Napastnik, który potrafi jedynie słuchać, nie zmieni niczego —
    ale usłyszy to, co tym kanałem idzie.

    Treść tego kanału jest warta słuchania. Idą nim nazwy kont logujących się
    do maszyny, ich przynależność do grup, wynik uwierzytelnienia, dane konta
    maszyny. Dla napastnika prowadzącego rozpoznanie jest to lepsze źródło niż
    skanowanie: nie wymaga zadawania pytań, więc nie wzbudza podejrzeń,
    a odpowiedzi przychodzą same, w miarę jak ludzie się logują.

    Szczególnie warto zwrócić uwagę na jedną rzecz. Bierne słuchanie nie
    zostawia śladu w żadnym dzienniku. Reguła jest więc obroną przed atakiem,
    którego wykrycie po fakcie jest praktycznie niemożliwe — a to podnosi
    wartość samego zabezpieczenia, bo nie ma tu drugiej linii w postaci
    wykrywania.

    Punkt jest warunkowy, tak jak podpisywanie, i ma to samo ograniczenie:
    druga strona może zgłosić, że nie potrafi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    biernego odczytania nazw kont, ich grup i wyników uwierzytelnienia,
    bez zadawania jednego pytania i bez śladu w dzienniku.
  en: |
    The setting demands the encryption of traffic in the channel to the domain
    controller wherever the other side supports encryption.

    It is a twin rule to signing and differs from it in what it defends against. A
    signature guards against substitution; encryption against reading. An attacker
    able only to listen will alter nothing - but will hear what travels that
    channel.

    That channel's content is worth hearing. Along it go the names of accounts
    signing in to the machine, their group membership, the outcome of
    authentication, the machine account's data. For an attacker carrying on
    reconnaissance it is a better source than scanning: it calls for no questions,
    so it rouses no suspicion, and the answers come of themselves as people sign in.

    One thing deserves particular notice. Passive listening leaves no trace in any
    log. The rule is therefore a defence against an attack whose detection after the
    fact is practically impossible - and that raises the worth of the safeguard
    itself, since there is no second line here in the shape of detection.

    The item is conditional, as signing is, and has the same limit: the other side
    may declare that it cannot.

    What an attacker gains while the item goes unmet: the means of passively reading
    account names, their groups and the outcomes of authentication, without asking a
    single question and without a trace in the log.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Tak jak przy podpisywaniu, ustawienie działa
    warunkowo — tam, gdzie druga strona nie obsługuje szyfrowania, ruch idzie
    jak dotąd, więc żadne połączenie nie zostaje zerwane.

    Koszt obliczeniowy jest wyższy niż przy podpisywaniu, bo szyfrowanie
    dotyczy całej treści, a nie skrótu z niej. W praktyce nadal jest
    nieodczuwalny: kanał kontroli domeny przenosi niewielkie komunikaty
    i niewiele ich jest w porównaniu z jakimkolwiek innym ruchem na serwerze.

    Jedna rzecz warta odnotowania dotyczy diagnostyki. Zaszyfrowany kanał
    przestaje być czytelny w podglądzie ruchu sieciowego — a bywa, że właśnie
    tak diagnozuje się problemy z uwierzytelnianiem domenowym. Nie jest to
    regresja, tylko utrata wygodnego narzędzia, i warto o tym wiedzieć przed
    następną taką diagnozą, a nie w jej trakcie.

    Czego to nie psuje: uwierzytelniania domenowego, zasad grupy, pracy usług,
    udostępniania plików ani logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". As with signing, the setting works conditionally -
    where the other side does not support encryption the traffic goes as before, so
    no connection is severed.

    The computational cost is higher than with signing, since encryption covers the
    whole content and not a digest of it. In practice it remains imperceptible: the
    domain control channel carries small messages and few of them beside any other
    traffic on a server.

    One thing worth noting concerns diagnosis. An encrypted channel ceases to be
    readable in a view of the network traffic - and that is at times exactly how
    problems with domain authentication are diagnosed. It is no regression, only the
    loss of a convenient tool, and it is worth knowing before the next such
    diagnosis rather than during it.

    What this does not break: domain authentication, group policy, the working of
    services, file sharing, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Brak regresji w działaniu — tam, gdzie druga strona nie obsługuje szyfrowania, ruch idzie jak dotąd
      - Kanał przestaje być czytelny w podglądzie ruchu sieciowego, którym bywa diagnozowane uwierzytelnianie domenowe
      - Koszt obliczeniowy jest wyższy niż przy podpisywaniu, ale przy wielkości tych komunikatów pozostaje nieodczuwalny
      - Uwierzytelnianie domenowe, zasady grupy i udostępnianie plików pozostają bez zmian
    en:
      - No regression in the working - where the other side does not support encryption, the traffic goes as before
      - The channel ceases to be readable in a network traffic view, by which domain authentication is at times diagnosed
      - The computational cost is higher than with signing, but at the size of these messages it stays imperceptible
      - Domain authentication, group policy and file sharing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — ustawienie działa warunkowo i nie odbiera możliwości rozmowy stronie, która szyfrowania nie obsługuje
    en:
      - No known contraindication - the setting works conditionally and takes no means of talking from a side that does not support encryption
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'SealSecureChannel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'SealSecureChannel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Encryption answers for secrecy, not inviolability. Passive listening leaves no
    # trace in any log, so there is no second line here in the shape of detection.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SealSecureChannel' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-encrypt-secure-channel-data-when-possible

notes:
  pl: |
    Trzy reguły o kanale do kontrolera domeny opisują jedno połączenie
    z trzech stron i tylko razem coś znaczą. Bezwarunkowe żądanie rozstrzyga,
    czy wolno zejść niżej; podpisywanie broni przed podmianą; szyfrowanie
    przed odczytem. Aplikacja powinna je pokazywać jako grupę.

    Ta reguła jest jedyną z trzech, która broni przed atakiem niewykrywalnym
    po fakcie. Bierne słuchanie nie zostawia śladu w dzienniku, więc nie ma tu
    drugiej linii obrony. Warto to podnieść w raporcie, bo przy kategorii
    średniej punkt łatwo odłożyć na później.

    Brak wartości w rejestrze zgłaszany jest jako niespełnienie, bo zachowanie
    domyślne ma tu zostać zapisane wprost.
  en: |
    The three rules on the channel to the domain controller describe one connection
    from three sides and mean something only together. The unconditional demand
    settles whether a drop is allowed; signing guards against substitution;
    encryption against reading. The application should show them as a group.

    This rule is the only one of the three that defends against an attack
    undetectable after the fact. Passive listening leaves no trace in a log, so
    there is no second line of defence here. Worth raising in the report, since at
    the medium category the item is easily put off.

    A missing value in the registry is reported as non-compliance, since the default
    behaviour is to be written outright here.
