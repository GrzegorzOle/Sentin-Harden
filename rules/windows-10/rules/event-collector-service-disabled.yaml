id: win10-event-collector-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zbierania dzienników z innych maszyn wyłączona
    en: The service gathering records from other machines switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przyjmującą zapisy dzienników przesyłane
    z innych maszyn i gromadzącą je w jednym miejscu.

    Rola tej usługi jest odwrotna niż zwykle. Maszyna nie wysyła swoich
    dzienników — przyjmuje cudze. Stanowisko robocze zwykle nie ma po
    temu powodu, bo rolę zbierającego pełni wyznaczona maszyna
    w infrastrukturze.

    Zagrożenie pierwsze to skupienie. Maszyna przyjmująca dzienniki
    z wielu źródeł gromadzi opis całej infrastruktury: nazwy maszyn,
    konta, godziny logowań, uruchamiane programy. Przejęcie jej daje
    napastnikowi obraz, którego inaczej musiałby szukać po kolei.

    Zagrożenie drugie to nasłuch. Usługa ta otwiera port i przyjmuje
    połączenia, więc jest drogą wejścia — na stanowisku, które o tej
    roli nikt nie prosił.

    Zagrożenie trzecie to zaufanie do treści. Zapisy przychodzą z innych
    maszyn, a maszyna przyjmująca traktuje je jako materiał dowodowy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: otwarty
    port nasłuchu i miejsce gromadzenia opisu innych maszyn.
  en: |
    The setting switches off the service taking in records of happenings sent from other machines and gathering
    them in one place.

    The part of that service is the other way about than is usual. The machine sends not its own records - it
    takes in those of others. A station of work commonly has no ground for it, the part of the gatherer being held
    by an appointed machine in the infrastructure.

    The first danger is the drawing together. A machine taking in records from many springs gathers a setting out
    of the whole infrastructure: the names of machines, the reckonings, the hours of logging on, the programs set
    going. Its taking over gives an attacker a sight they would otherwise have to seek out one piece at a time.

    The second danger is the listening. That service opens a door and takes in joinings, so it is a road in - upon
    a station nobody asked to hold that part.

    The third danger is the trusting of the content. The records come from other machines, and the machine taking
    them in holds them to be matter of proof.

    What an attacker gains while the item goes unmet: an open door of listening and a place gathering a setting
    out of other machines.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie sprowadza się do pytania,
    czy ta maszyna nie pełni przypadkiem roli zbierającego.

    Miejscem pierwszym są wdrożenia, w których dzienniki z kilku maszyn
    schodzą się na jednym stanowisku, bo tak było najszybciej. Bywa to
    maszyna administratora, a nie serwer. Po zmianie zapisy z czasu po
    wyłączeniu nigdzie nie trafią i nie da się ich odzyskać.

    Miejscem drugim są subskrypcje ustawione dawno i zapomniane. Działają
    w tle i nikt o nich nie wie do chwili, gdy audyt poprosi o dzienniki
    z maszyn, których już nikt nie czyta.

    Odnotowuję, że wyłączenie usługi nie rusza dzienników tej maszyny.
    Własne zdarzenia są zapisywane dalej, bo odpowiada za nie inny
    mechanizm.

    Przed wdrożeniem warto sprawdzić, czy istnieją subskrypcje. Jeżeli
    nie ma żadnej, punkt jest bezkosztowy.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: własnych dzienników maszyny, sieci, logowania,
    drukowania, pracy programów.
  en: |
    The class is "needs review", and the review comes to the question whether this machine does not by chance hold
    the part of the gatherer.

    The first place is rollouts in which records from several machines come together upon one station, that having
    been the swiftest way. It is at times a keeper's machine and no server. After the change the records from the
    time after the switching off will go nowhere and are not to be won back.

    The second place is standing orders set long ago and forgotten. They work behind the scene and nobody knows of
    them until the hour an audit asks for records from machines nobody reads any more.

    I set down that the switching off of the service touches not this machine's own records. Its own happenings
    are written on, another mechanism answering for them.

    Before the rollout it is worth looking at whether there are standing orders. If there is none, the item is
    without cost.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the machine's own records, the network, logging on, printing, or the work of
    programs.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Dzienniki z innych maszyn schodzące się na tym stanowisku przestaną być przyjmowane
      - Zapisy z czasu po wyłączeniu nigdzie nie trafią i nie da się ich odzyskać
      - Subskrypcje ustawione dawno i zapomniane przestaną działać, a ujawni się to dopiero przy audycie
      - Własne dzienniki maszyny są zapisywane dalej, bo odpowiada za nie inny mechanizm
      - Sieć, logowanie, drukowanie i praca programów pozostają bez zmian
    en:
      - Records from other machines coming together upon this station will cease to be taken in
      - The records from the time after the switching off will go nowhere and are not to be won back
      - Standing orders set long ago and forgotten will cease to work, which will come to light only at an audit
      - The machine s own records are written on, another mechanism answering for them
      - The network, logging on, printing and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę zbierającego dzienniki z innych stanowisk, choćby doraźnie
    en:
      - The machine holds the part of the gatherer of records from other stations, if only for the while
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service ends the gathering of happenings from other machines;
    # those from the time after the change will go nowhere.
    Stop-Service -Name 'Wecsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Wecsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Wecsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wec/windows-event-collector

notes:
  pl: |
    Reguła bywa mylona z punktem o dziennikach maszyny i warto, żeby
    aplikacja rozdzieliła to jednym zdaniem. Usługa ta przyjmuje cudze
    zapisy, a nie wysyła własnych — wyłączenie jej nie rusza dzienników
    tego stanowiska.

    Argument wart postawienia dotyczy skupienia. Maszyna zbierająca
    gromadzi opis całej infrastruktury: nazwy maszyn, konta, godziny
    logowań i uruchamiane programy. Na stanowisku roboczym jest to zbiór
    niepilnowany, a wart tyle samo co na serwerze.

    Odnotowuję sprawdzenie warte wykonania przed wdrożeniem: czy istnieją
    subskrypcje. Zapomniana subskrypcja jest częstsza, niż się wydaje,
    a jej zniknięcie ujawnia się dopiero przy audycie.
  en: |
    The rule is at times taken for the item about a machine's records, and it is well that the application part
    them in one sentence. That service takes in the records of others and sends not its own - its switching off
    touches not this station's records.

    The argument worth putting touches the drawing together. A gathering machine holds a setting out of the whole
    infrastructure: the names of machines, the reckonings, the hours of logging on and the programs set going.
    Upon a station of work it is a gathering nobody watches over, and worth as much as upon a server.

    I set down the looking worth doing before the rollout: whether there are standing orders. A forgotten standing
    order is commoner than it seems, and its going comes to light only at an audit.
