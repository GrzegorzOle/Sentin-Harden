id: win2025-bitlocker-removable-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do nośników wymiennych ustalony
    en: The way of recovering access to removable media settled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala jedną drogę odzyskiwania dostępu do zaszyfrowanego nośnika
    wymiennego: hasło odzyskiwania zapisane w katalogu, bez agenta
    odzyskiwania danych i bez możliwości pominięcia tego zapisu. Osiem
    wartości opisuje jedno postanowienie, więc audyt czyta je razem
    i nazywa tę, która odstaje.

    Zostawiam kategorię średnią i chcę nazwać rzecz, która odróżnia ten
    punkt od jego odpowiednika dla dysków stałych, bo jest to różnica
    zasadnicza, a nie odcień.

    Informacja odzyskiwania trafia do katalogu tej organizacji. Nośnik
    wychodzi na zewnątrz. Te dwa zdania razem znaczą, że ten punkt nie
    zabezpiecza przyszłego czytelnika nośnika — zabezpiecza organizację,
    która nośnik wydała. Gdy dysk wróci po roku od podmiotu, który już nie
    istnieje, albo zostanie znaleziony w szufladzie bez opisu, to właśnie
    ten zapis jest jedyną drogą do jego zawartości. Nie ma tu drugiej
    kopii u kogoś innego, bo nikt inny jej nie robił.

    Odwrotnie niż przy dyskach stałych — nośnik wymienny nie odblokowuje
    się sam z klucza na wolumenie systemowym. On odblokowuje się hasłem
    albo kluczem, które ktoś musi mieć. Dlatego decyzja o tym, gdzie ta
    informacja leży, jest tutaj decyzją o dostępie do danych, a nie
    formalnością.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — ale organizacja traci dostęp do własnych nośników
    i odpowiedzią na to bywa zaprzestanie ich szyfrowania.
  en: |
    The item settles one route for recovering access to an encrypted
    removable medium: a recovery password stored in the directory, with no
    data recovery agent and with no way of skipping that storage. Eight
    values describe one decision, so the audit reads them together and
    names whichever stands out.

    I keep the category medium, and I want to name the thing that sets this
    item apart from its counterpart for fixed drives, because it is a
    fundamental difference rather than a shade.

    The recovery information goes into this organisation's directory. The
    medium goes outside. Those two sentences together mean that this item
    does not protect the medium's future reader - it protects the
    organisation that released the medium. When a disk comes back a year
    later from a party that no longer exists, or is found in a drawer with
    no label, that stored entry is the only route to its contents. There is
    no second copy held by somebody else, because nobody else made one.

    The reverse of the fixed drives - a removable medium does not unlock
    itself from a key on the system volume. It unlocks with a password or a
    key that somebody has to hold. That is why the decision about where
    this information lies is a decision about access to the data here, not
    a formality.

    What an attacker gains while the item goes unmet: nothing directly -
    but the organisation loses access to its own media, and the answer to
    that is often to stop encrypting them.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę pokazać, gdzie ten
    punkt zawodzi cicho, bo to jest jego najgorsza właściwość.

    Wymóg zapisania informacji w katalogu przed zaszyfrowaniem znaczy, że
    bez łączności z katalogiem nośnik po prostu się nie zaszyfruje. Na
    stacji roboczej to widać od razu, bo ktoś stoi przy ekranie. Na
    serwerze w wydzielonym segmencie, w strefie zdemilitaryzowanej albo na
    maszynie odciętej na czas prac ten sam warunek oznacza, że zadanie
    przygotowujące nośnik kończy się niepowodzeniem w środku nocy. Operator,
    który zobaczy to trzeci raz, przestanie szyfrować — i to jest realne
    ryzyko tej reguły, większe niż jakakolwiek niedogodność.

    Drugi skutek dotyczy wydawania nośników na zewnątrz. Zakaz agenta
    odzyskiwania danych zamyka wariant, w którym jedna para kluczy otwiera
    wszystko, co organizacja zaszyfrowała. To jest właściwa decyzja, ale
    tam, gdzie taki agent był w użyciu, procedura wydania nośnika przestaje
    działać z dnia na dzień i trzeba mieć gotową inną.

    Trzeci skutek jest drobny i warto o nim wiedzieć: strona z
    podpowiedziami odzyskiwania zostaje ukryta. Człowiek, który stanie przed
    zablokowanym nośnikiem, nie zobaczy wskazówki, gdzie szukać pomocy.
    Musi ją znać wcześniej.

    Zmiana nie wymaga przerwy i cofa się natychmiast, ale nośniki
    zaszyfrowane pod starymi ustawieniami zachowują to, co miały.
  en: |
    I keep the class "needs a planned rollout", and I want to show where
    this item fails quietly, because that is its worst property.

    Requiring the information to be stored in the directory before
    encryption means that without connectivity to the directory the medium
    simply will not encrypt. On a workstation that is visible at once,
    because somebody is standing at the screen. On a server in a segregated
    segment, in a demilitarised zone or on a machine cut off for the
    duration of works, the same condition means the job preparing the
    medium fails in the middle of the night. An operator who sees that a
    third time will stop encrypting - and that is this rule's real risk,
    greater than any inconvenience.

    The second effect concerns releasing media outside. Banning the data
    recovery agent closes the variant in which one key pair opens
    everything the organisation has encrypted. That is the right decision,
    but where such an agent was in use the procedure for releasing a medium
    stops working overnight and another one has to be ready.

    The third effect is small and worth knowing: the page with recovery
    hints is hidden. A person faced with a locked medium will not see a
    pointer to where help can be found. They have to know it beforehand.

    The change needs no outage and is undone immediately, but media
    encrypted under the old settings keep what they had.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Bez łączności z katalogiem nośnik w ogóle się nie zaszyfruje, a zadanie przygotowujące go kończy się niepowodzeniem
      - Na serwerze w wydzielonym segmencie albo odciętym na czas prac dzieje się to w środku nocy i nikt tego nie widzi
      - Operator, który zobaczy to kilka razy, przestanie szyfrować nośniki — to większe ryzyko niż sama niedogodność
      - Zakaz agenta odzyskiwania danych unieważnia procedurę wydania nośnika opartą na jednej parze kluczy
      - Strona z podpowiedziami odzyskiwania zostaje ukryta, więc człowiek przy zablokowanym nośniku nie zobaczy wskazówki
    en:
      - Without connectivity to the directory the medium will not encrypt at all and the job preparing it fails
      - On a server in a segregated segment or cut off for works this happens in the middle of the night unseen
      - An operator who sees it a few times will stop encrypting media - a greater risk than the inconvenience itself
      - Banning the data recovery agent invalidates any release procedure resting on one key pair
      - The page with recovery hints is hidden, so a person at a locked medium will see no pointer to help
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna przygotowuje nośniki bez stałej łączności z katalogiem, w wydzielonym segmencie albo w strefie zdemilitaryzowanej
      - Procedura wydania nośnika na zewnątrz opiera się na agencie odzyskiwania danych i nie ma zamiennika
      - Nie ustalono, kto i skąd odczyta hasło odzyskiwania, gdy nośnik wróci po latach
    en:
      - The machine prepares media without steady connectivity to the directory, in a segregated segment or a demilitarised zone
      - The procedure for releasing media outside rests on a data recovery agent and there is no replacement
      - It has not been settled who reads the recovery password, and from where, when a medium comes back years later
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        RDVRecovery                     = 1
        RDVManageDRA                    = 0
        RDVRecoveryPassword             = 2
        RDVRecoveryKey                  = 2
        RDVHideRecoveryPage             = 1
        RDVActiveDirectoryBackup        = 1
        RDVActiveDirectoryInfoToStore   = 1
        RDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'RDVRecovery', 'RDVManageDRA', 'RDVRecoveryPassword', 'RDVRecoveryKey',
      'RDVHideRecoveryPage', 'RDVActiveDirectoryBackup',
      'RDVActiveDirectoryInfoToStore', 'RDVRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # After this a medium will not encrypt at all without connectivity to the
    # directory. On a machine in a segregated segment that shows up as a
    # preparation job failing at night, and the usual answer to a job that
    # fails at night is to stop encrypting - check connectivity first.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      RDVRecovery                     = 1
      RDVManageDRA                    = 0
      RDVRecoveryPassword             = 2
      RDVRecoveryKey                  = 2
      RDVHideRecoveryPage             = 1
      RDVActiveDirectoryBackup        = 1
      RDVActiveDirectoryInfoToStore   = 1
      RDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Różnica zasadnicza wobec odpowiednika dla dysków stałych: informacja
    odzyskiwania trafia do katalogu tej organizacji, a nośnik wychodzi na
    zewnątrz. Ten punkt nie zabezpiecza przyszłego czytelnika nośnika —
    zabezpiecza organizację, która nośnik wydała.

    Nośnik wymienny nie odblokowuje się sam z klucza na wolumenie
    systemowym; odblokowuje się hasłem albo kluczem, które ktoś musi mieć.

    Najgorsza właściwość tej reguły jest cicha: bez łączności z katalogiem
    nośnik się nie zaszyfruje, zadanie pada w nocy, a operator po kilku
    razach przestaje szyfrować.
  en: |
    The fundamental difference from the counterpart for fixed drives: the
    recovery information goes into this organisation's directory, and the
    medium goes outside. This item does not protect the medium's future
    reader - it protects the organisation that released it.

    A removable medium does not unlock itself from a key on the system
    volume; it unlocks with a password or a key somebody has to hold.

    This rule's worst property is a quiet one: without connectivity to the
    directory the medium will not encrypt, the job fails at night, and
    after a few times the operator stops encrypting.
