id: win2016-smart-multi-homed-name-resolution-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozsyłanie zapytań o nazwę wszystkimi kartami wyłączone
    en: Sending name queries out on every adapter switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe maszynie zadawać pytanie o nazwę wyłącznie tam, gdzie
    należy, zamiast wysyłać je jednocześnie wszystkimi kartami sieciowymi
    i przyjmować odpowiedź, która wróci pierwsza.

    Zachowanie domyślne pomyślano jako przyspieszenie. Maszyna z kilkoma
    kartami nie zgaduje, która z nich prowadzi do właściwego serwera nazw —
    pyta wszystkimi naraz i bierze to, co przyjdzie najszybciej.

    Skutek jest taki, że o wyniku rozstrzyga szybkość, a nie zaufanie.
    Segment mniej zaufany zwykle odpowiada prędzej niż serwer nazw stojący
    za tunelem albo za łączem do centrali, więc to właśnie jego odpowiedź
    wygrywa.

    Dla napastnika jest to droga wejścia tam, gdzie z pozoru go nie ma.
    Maszyna podłączona do dwóch sieci — zarządzającej i użytkowej, albo
    wewnętrznej i gościnnej — zaczyna przyjmować odpowiedzi ze strony mniej
    pilnowanej i kierować tam ruch przeznaczony dla drugiej.

    Osobno warte odnotowania jest to, że pytanie wysłane wszystkimi kartami
    ujawnia nazwy zasobów wewnętrznych w sieci, w której nie powinny się
    pojawić. Napastnik nasłuchujący w segmencie gościnnym dowiaduje się
    z tych pytań, jak nazywają się serwery po drugiej stronie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odpowiedzenia na pytanie z sieci mniej pilnowanej i przejęcia ruchu
    kierowanego do sieci pilnowanej, a przy okazji spis nazw wewnętrznych.
  en: |
    The setting has the machine ask its name question only where it belongs, instead
    of sending it out on every network card at once and taking the answer that comes
    back first.

    The default behaviour was thought up as a quickening. A machine with several
    cards does not guess which of them leads to the right name server - it asks on
    all at once and takes what arrives soonest.

    The upshot is that the result is settled by speed rather than by trust. A less
    trusted segment as a rule answers sooner than a name server standing behind a
    tunnel or behind the link to head office, so it is that segment's answer which
    wins.

    For an attacker this is a road in where to all appearances there is none. A
    machine attached to two networks - a management one and a working one, or an
    internal one and a guest one - begins taking answers from the less watched side
    and directing there the traffic meant for the other.

    Worth noting apart is that a question sent out on every card discloses the names
    of internal resources on a network where they ought never to appear. An attacker
    listening in the guest segment learns from those questions what the servers on
    the other side are called.

    What an attacker gains while the item goes unmet: the means of answering a
    question from the less watched network and taking over traffic directed at the
    watched one, and, in passing, a list of internal names.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo skutek zależy wprost od tego, jak
    maszyna jest podłączona do sieci.

    Na serwerze z jedną kartą zmiana nie robi nic i punkt jest czystym
    porządkiem. Im więcej kart, tym więcej do sprawdzenia — a serwery mają
    ich zwykle więcej, niż widać na pierwszy rzut oka. Liczą się także karty
    wirtualne, karty klastrowe, karty przypisane do przełącznika maszyn
    wirtualnych i karty tuneli.

    Rzecz, którą trzeba ocenić, brzmi: czy któraś z tych kart ma własny
    serwer nazw, z którego maszyna faktycznie korzysta. Po zmianie zapytanie
    przestaje trafiać do wszystkich naraz i część nazw zacznie rozwiązywać
    się wyłącznie przez serwer właściwy dla danej karty.

    Objaw jest nierówny i przez to mylący: część nazw działa, część nie,
    a to które — bywa zależne od kolejności kart. Zgłoszenie brzmi wtedy
    „czasem się łączy, czasem nie", co jest jednym z trudniejszych opisów do
    zdiagnozowania.

    Najczęstszy przypadek rzeczywistego kłopotu to maszyna z tunelem do
    innej sieci, gdzie nazwy po drugiej stronie rozwiązywały się dotąd
    przypadkiem, bo odpowiedź stamtąd zdążyła wrócić.

    Czego to nie psuje: rozwiązywania nazw przez serwer właściwy dla karty,
    łączności po adresie, nazw z pliku lokalnego, maszyn z jedną kartą.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", since the effect follows directly from
    how the machine is attached to the network.

    On a server with one card the change does nothing and the item is pure tidiness.
    The more cards, the more to check - and servers as a rule have more of them than
    meets the eye. Virtual cards count too, and cluster cards, cards bound to a
    virtual machine switch, and tunnel cards.

    The thing to judge reads: does any of those cards have a name server of its own
    that the machine really uses. After the change the query stops reaching all at
    once, and some names will begin resolving through the server proper to their
    card alone.

    The symptom is uneven and misleading for that reason: some names work, some do
    not, and which is which can depend on the order of the cards. The report then
    reads "sometimes it connects, sometimes it does not", which is among the harder
    descriptions to diagnose.

    The commonest case of real trouble is a machine with a tunnel to another
    network, where names on the far side resolved until now by chance, because the
    answer from there happened to come back in time.

    What this does not break: name resolution by the server proper to a card,
    connectivity by address, names from the local file, or machines with one card.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
  what_breaks:
    pl:
      - Nazwy z drugiej strony tunelu, rozwiązywane dotąd przypadkiem, przestają się rozwiązywać, jeśli karta tunelu nie ma własnego serwera nazw
      - Na maszynie z kartami wirtualnymi i klastrowymi część nazw zaczyna rozwiązywać się nierówno, a zgłoszenie brzmi — czasem się łączy, czasem nie
      - Zasoby dostępne dotąd dzięki odpowiedzi z dowolnej karty wymagają teraz poprawnej konfiguracji serwera nazw na karcie właściwej
      - Maszyny z jedną kartą, łączność po adresie i nazwy z pliku lokalnego pozostają bez zmian
    en:
      - Names from the far side of a tunnel, resolved until now by chance, cease to resolve if the tunnel card has no name server of its own
      - On a machine with virtual and cluster cards some names begin resolving unevenly, and the report reads sometimes it connects, sometimes it does not
      - Resources reachable until now thanks to an answer from any card now call for a proper name server configuration on the card that belongs
      - Machines with one card, connectivity by address and names from the local file stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna ma kilka kart, a nie ustalono, przez którą z nich rozwiązują się dziś poszczególne nazwy
      - Nazwy po drugiej stronie tunelu rozwiązują się bez skonfigurowanego serwera nazw dla karty tunelu
    en:
      - The machine has several cards and it has not been established through which of them the several names resolve today
      - Names on the far side of a tunnel resolve with no name server configured for the tunnel card
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'DisableSmartNameResolution'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'DisableSmartNameResolution'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSmartNameResolution' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Punkt bywa pomijany, bo wygląda na sprawę wydajności, a nie
    zabezpieczeń. Jest odwrotnie: rozstrzyganie o tożsamości zasobu na
    podstawie tego, kto odpowiedział szybciej, jest tym samym wzorcem, który
    czyni groźnym rozgłoszenie w segmencie — tyle że przeniesionym na
    granicę między sieciami.

    Wyciek nazw wewnętrznych warto pokazać osobno, bo nie jest oczywisty.
    Zapytanie wysłane wszystkimi kartami niesie nazwę zasobu do sieci, do
    której ta nazwa nigdy nie powinna trafić. Jest to strata sama w sobie,
    niezależna od tego, czy ktokolwiek na to pytanie odpowie.

    Reguła jest naturalnym uzupełnieniem punktów o rozgłoszeniu w segmencie
    i o starszym mechanizmie sieciowym. Tamte mówią, czy wolno pytać
    rozgłoszeniem; ta mówi, którędy wolno pytać w ogóle.
  en: |
    The item is at times passed over, since it looks like a matter of performance
    rather than of security. It is the other way about: settling a resource's
    identity by who answered faster is the same pattern that makes calling out in a
    segment dangerous - only carried over to the border between networks.

    The leaking of internal names is worth showing apart, since it is not obvious. A
    query sent out on every card carries a resource's name to a network that name
    should never reach. That is a loss in itself, whether anybody answers the
    question or not.

    The rule is the natural completion of the items on calling out in a segment and
    on the older net mechanism. Those say whether one may ask by calling out; this
    one says by which road one may ask at all.
