id: win2016-bitlocker-encryption-method-strength

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Metoda i siła szyfrowania dysków ustalona wprost
    en: The drive encryption method and strength settled explicitly
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala wprost, jakim sposobem i jak długim kluczem szyfrowane są
    poszczególne klasy dysków, zamiast zostawiać ten wybór domyślnym
    ustawieniom systemu.

    Sam wybór jest mniej ważny niż to, że został zapisany. Domyślne
    ustawienie zmienia się między wydaniami systemu, a wolumin zaszyfrowany
    zostaje przy sposobie wybranym w chwili szyfrowania — na lata. Maszyna
    stawiana dziś i maszyna stawiana rok temu potrafią więc szyfrować
    inaczej, choć nikt niczego nie ustawiał.

    Merytorycznie chodzi o dwie rzeczy. Pierwsza to sposób wiązania
    szyfrowania z położeniem danych na dysku: nowszy tryb blokowy wiąże je
    mocniej, więc podmiana fragmentu zaszyfrowanego woluminu staje się
    trudniejsza. Druga to długość klucza.

    Rozstrzygnięcie nie jest jednak jednakowe dla wszystkich dysków.
    Nośniki wymienne dostają tryb klasyczny właśnie dlatego, że tryb nowszy
    nie jest czytany przez systemy starsze od tego wydania — a nośnik ma
    jeździć. Jest to jedyny punkt w całym zestawie, w którym świadomie
    wybiera się rozwiązanie słabsze, i warto o tym powiedzieć wprost.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: woluminy
    zaszyfrowane sposobem, którego nikt nie wybrał i którego siły nikt nie
    zna.
  en: |
    The item settles explicitly by what means and with how long a key each class of drive is
    encrypted, instead of leaving that choice to the system's default settings.

    The choice itself matters less than its having been written down. The default setting changes
    between releases of the system, and an encrypted volume stays with the means chosen at the
    moment of encryption - for years. A machine set up today and one set up a year ago can therefore
    encrypt otherwise, for all that nobody set anything.

    In substance two things are at stake. The first is the manner of binding the encryption to the
    data's place on the drive: the newer block mode binds them harder, so exchanging a fragment of an
    encrypted volume becomes harder. The second is the key's length.

    The settlement is, though, not the same for all drives. Removable media get the classic mode
    precisely because the newer one is not read by systems older than this release - and a medium is
    for travelling. It is the one item in the whole set where a weaker solution is knowingly chosen,
    and that is worth saying outright.

    What an attacker gains while the item goes unmet: volumes encrypted by a means nobody chose and
    whose strength nobody knows.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na maszynie świeżo stawianej zmiana
    nie robi nic widocznego.

    Rzecz najważniejsza brzmi: ustawienie dotyczy wyłącznie woluminów
    szyfrowanych po jego wprowadzeniu. Wolumin zaszyfrowany wcześniej
    zostaje przy swoim sposobie i nic go nie przeniesie — przeniesienie
    wymaga odszyfrowania i zaszyfrowania na nowo, czyli dwóch przejść przez
    całą powierzchnię.

    Skutek odczuwalny dotyczy nośników wymiennych i pojawia się tylko wtedy,
    gdy komuś przyjdzie do głowy ujednolicić wszystkie trzy klasy. Nośnik
    zaszyfrowany trybem blokowym nie zostanie odczytany na maszynie
    starszej niż to wydanie systemu, a objaw będzie taki sam jak przy
    nośniku uszkodzonym.

    Drugi skutek dotyczy dłuższego klucza. Różnica w obciążeniu procesora
    jest na sprzęcie z przyspieszeniem sprzętowym nieodczuwalna; na sprzęcie
    bez niego bywa widoczna przy ciągłym zapisie dużych ilości danych. Warto
    to sprawdzić na maszynie, której zadaniem jest przepisywanie strumieni,
    a nie zakładać z góry.

    Czego to nie psuje: woluminów zaszyfrowanych wcześniej, dostępu do
    danych, pracy usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on a machine freshly being set up the change does nothing
    that shows.

    The weightiest matter runs: the setting concerns solely volumes encrypted after it is brought in.
    A volume encrypted earlier stays with its own means and nothing will carry it over - the carrying
    over calls for it to be decrypted and encrypted anew, which is to say two passes through the
    whole surface.

    The felt consequence concerns removable media and appears only where it occurs to somebody to make
    all three classes uniform. A medium encrypted in the block mode will not be read on a machine
    older than this release of the system, and the symptom will be the same as at a damaged medium.

    The second consequence concerns the longer key. The difference in the processor's load is on
    hardware with acceleration not felt; on hardware without it, it is at times seen at a continuous
    writing of large quantities of data. That is worth checking on a machine whose task is to copy
    streams through, rather than assumed beforehand.

    What this does not break: volumes encrypted earlier, access to data, the working of services, or
    the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Woluminy zaszyfrowane przed zmianą zostają przy swoim sposobie, a przeniesienie wymaga dwóch przejść przez całą powierzchnię
      - Nośnik wymienny zaszyfrowany trybem blokowym nie zostanie odczytany na maszynie starszej niż to wydanie systemu
      - Objaw przy takim nośniku wygląda tak samo jak przy nośniku uszkodzonym, więc przyczyna bywa szukana nie tam
      - Dłuższy klucz bywa odczuwalny na sprzęcie bez przyspieszenia sprzętowego przy ciągłym zapisie dużych ilości danych
      - Dostęp do danych, praca usług i sieć pozostają bez zmian
    en:
      - Volumes encrypted before the change stay with their own means, and carrying them over calls for two passes through the whole surface
      - A removable medium encrypted in the block mode will not be read on a machine older than this release of the system
      - The symptom at such a medium looks the same as at a damaged one, so the cause is at times looked for elsewhere
      - The longer key is at times felt on hardware without acceleration at a continuous writing of large quantities of data
      - Access to data, the working of services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ktoś zamierza ujednolicić wszystkie trzy klasy dysków i ustawić nośnikom wymiennym tryb blokowy
      - Maszyna przepisuje strumienie danych na sprzęcie bez przyspieszenia sprzętowego, a wpływu dłuższego klucza nie zmierzono
    en:
      - Somebody means to make all three classes of drive uniform and set the block mode for removable media
      - The machine copies streams of data through on hardware without acceleration and the longer key's effect has not been measured
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. The system drive
      # and fixed drives take the block mode with a long key; removable media
      # take the classic mode, because the block mode is not read by older
      # systems. Whichever value differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        EncryptionMethodWithXtsOs  = 7
        EncryptionMethodWithXtsFdv = 7
        EncryptionMethodWithXtsRdv = 4
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      os          = $item.'EncryptionMethodWithXtsOs'
      os_existed  = ($null -ne $item.'EncryptionMethodWithXtsOs')
      fdv         = $item.'EncryptionMethodWithXtsFdv'
      fdv_existed = ($null -ne $item.'EncryptionMethodWithXtsFdv')
      rdv         = $item.'EncryptionMethodWithXtsRdv'
      rdv_existed = ($null -ne $item.'EncryptionMethodWithXtsRdv')
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Removable media get the classic mode on purpose: the block mode is not
    # read by systems older than this release, and a medium is for travelling.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsOs' -Value 7 -Type DWord
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsFdv' -Value 7 -Type DWord
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsRdv' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $pairs = @(
      @{ name = 'EncryptionMethodWithXtsOs';  value = $b.os;  existed = $b.os_existed },
      @{ name = 'EncryptionMethodWithXtsFdv'; value = $b.fdv; existed = $b.fdv_existed },
      @{ name = 'EncryptionMethodWithXtsRdv'; value = $b.rdv; existed = $b.rdv_existed }
    )
    foreach ($pair in $pairs) {
      if ($pair.existed) {
        Set-ItemProperty -Path $b.path -Name $pair.name -Value $pair.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $pair.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt otwiera ostatnią część zestawu o szyfrowaniu dysków, dotyczącą nie
    tego, co i kiedy się szyfruje, tylko czym.

    Wartość tej reguły leży w zapisaniu decyzji, nie w jej treści, i warto,
    żeby opis to przyznawał. Sposób domyślny bywa dobry; kłopot polega na
    tym, że jest domyślny — zmienia się bez udziału nikogo, a woluminy
    zaszyfrowane nim zostają takie na lata. Punkt jest więc przede wszystkim
    o powtarzalności.

    Nośniki wymienne są w tej regule wyjątkiem i to jest jedyne miejsce
    w całym zestawie, w którym wybiera się wariant słabszy świadomie. Dobrze
    jest, żeby aplikacja to nazwała, bo stan zgodny wygląda wtedy na
    niedokończony: dwie klasy dysków mają wartość wyższą, trzecia niższą.
    Kto tego nie wie, poprawi zgodność na niezgodność w dobrej wierze.

    Odnotowuję wreszcie, że jest to trzecia reguła w tym zestawie
    zbudowana na kilku wartościach czytanych razem, i trzeci raz powód jest
    ten sam: maszyna ustawiona w połowie nie może zgłaszać się jako
    ustawiona.
  en: |
    The item opens the last part of the set about drive encryption, concerning not what is encrypted
    and when, but by what.

    This rule's value lies in the decision's being written down and not in its contents, and it is
    well that the description own it. The default means is at times a good one; the trouble is that it
    is default - it changes with nobody taking part, and volumes encrypted by it stay so for years.
    The item is therefore above all about repeatability.

    Removable media are in this rule an exception, and that is the one place in the whole set where a
    weaker variant is chosen knowingly. It is well that the application name it, the compliant state
    then looking unfinished: two classes of drive have the higher value, the third the lower. Whoever
    does not know that will turn compliance into non-compliance in good faith.

    Worth noting finally that it is the third rule in this set built on several values read together,
    and for the third time the reason is the same: a machine set halfway must not report itself as
    set.
