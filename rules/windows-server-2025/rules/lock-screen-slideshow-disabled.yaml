id: win2025-lock-screen-slideshow-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Personalization
  title:
    pl: Pokaz slajdów na ekranie blokady wyłączony
    en: Lock screen slideshow disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza pokaz slajdów wyświetlany na ekranie blokady.

    Kategoria średnia i chcę od razu powiedzieć, dlaczego nie niska, bo
    nazwa mówi o tapetach i prowadzi na manowce. Rzecz nie w obrazkach,
    tylko w tym, skąd one się biorą i co system robi, żeby je pokazać.

    Pokaz slajdów czyta pliki z katalogu wskazanego przez użytkownika
    i wyświetla je, gdy nikt nie jest zalogowany. To jest mechanizm, który
    przy zablokowanym ekranie otwiera pliki z dysku i przetwarza ich
    zawartość — obrazy, czyli format o złożonej budowie, przetwarzany przez
    składnik systemu. Robi to cyklicznie i bez udziału człowieka.

    Druga strona jest prostsza i równie realna: zawartość wskazanego
    katalogu staje się widoczna dla każdego, kto patrzy na ekran blokady.
    Jeżeli katalog kiedykolwiek posłuży do czegoś innego niż tapety —
    a katalogi na serwerach mają taką skłonność — ekran blokady zacznie
    pokazywać zrzuty ekranu, skany dokumentów albo zdjęcia z inspekcji.

    Na serwerze dokłada się kontekst konsoli maszyny wirtualnej, widocznej
    z panelu wirtualizacji dla szerszego grona niż sam serwer.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: mechanizm
    otwierający pliki przy zablokowanym ekranie oraz podgląd zawartości
    wskazanego katalogu bez podania hasła.
  en: |
    The item switches off the slideshow shown on the lock screen.

    The category is medium, and I want to say at once why not low, because
    the name speaks of wallpapers and leads astray. The matter is not the
    pictures but where they come from and what the system does in order to
    show them.

    The slideshow reads files from a directory the user pointed it at and
    displays them while nobody is signed in. It is a mechanism that, with the
    screen locked, opens files from the disk and processes their contents -
    images, that is, a format of intricate construction processed by a system
    component. It does so on a cycle and without a person taking part.

    The other side is simpler and just as real: the contents of the chosen
    directory become visible to anybody looking at the lock screen. If the
    directory is ever used for something other than wallpapers - and
    directories on servers have that tendency - the lock screen will start
    showing screenshots, scans of documents or photographs from an
    inspection.

    On a server the context of the virtual machine's console is added, seen
    from the virtualisation panel by a wider circle than the server itself.

    What an attacker gains while the item goes unmet: a mechanism opening
    files while the screen is locked, and a view of the chosen directory's
    contents with no password given.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tutaj nie mam nawet zastrzeżenia do
    postawienia — na serwerze nikt nie ogląda pokazu slajdów, bo nikt nie
    patrzy na ekran blokady serwera dla przyjemności.

    Skutek jest jeden: ekran blokady pokaże stałe tło zamiast zmieniających
    się obrazów. Reszta ekranu blokady zostaje bez zmian — zegar, data,
    komunikaty systemowe, możliwość zalogowania.

    Czego to nie psuje: tapety pulpitu, personalizacji po zalogowaniu,
    wygaszacza ekranu ani blokowania ekranu jako takiego. Punkt dotyczy
    wyłącznie pokazu slajdów na ekranie blokady, a nie samego ekranu
    blokady.

    Rzecz do zapamiętania: ten punkt i blokada aparatu na ekranie blokady
    leżą pod jedną ścieżką rejestru, pod różnymi nazwami wartości,
    a powiadomienia na ekranie blokady leżą zupełnie gdzie indziej. Trzy
    punkty o tym samym ekranie, dwie różne gałęzie — znajoma ścieżka nie
    znaczy, że grupa jest zamknięta.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and here I have not even a caveat to state
    - nobody watches a slideshow on a server, because nobody looks at a
    server's lock screen for pleasure.

    There is one effect: the lock screen will show a fixed background instead
    of changing images. The rest of the lock screen stays unchanged - the
    clock, the date, system messages, the ability to sign in.

    What this does not break: the desktop wallpaper, personalisation after
    signing in, the screen saver, or locking the screen as such. The item
    concerns the slideshow on the lock screen alone, not the lock screen
    itself.

    Something to remember: this item and the block on the camera at the lock
    screen lie under one registry path, under different value names, while
    lock screen notifications lie somewhere else entirely. Three items about
    the same screen, two different branches - a familiar path does not mean
    the group is closed.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Ekran blokady pokaże stałe tło zamiast zmieniających się obrazów
      - Zegar, data, komunikaty systemowe i możliwość zalogowania zostają bez zmian
      - Tapeta pulpitu, personalizacja po zalogowaniu, wygaszacz ekranu i blokowanie ekranu nie są tym objęte
      - Punkt leży pod tą samą ścieżką co blokada aparatu na ekranie blokady, a powiadomienia na tym ekranie leżą w innej gałęzi
    en:
      - The lock screen shows a fixed background instead of changing images
      - The clock, the date, system messages and the ability to sign in stay unchanged
      - The desktop wallpaper, personalisation after signing in, the screen saver and locking the screen are not covered
      - The item lies under the same path as the block on the lock screen camera, while notifications on that screen lie in another branch
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym pokaz slajdów na ekranie blokady jest częścią przyjętego wyglądu stanowiska pracy
    en:
      - The machine is a terminal server where the lock screen slideshow is part of the accepted look of the workplace
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      $name = 'NoLockScreenSlideshow'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    $name = 'NoLockScreenSlideshow'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The matter is not the pictures: with the screen locked, the mechanism opens
    # files from a chosen directory and processes their contents, on a cycle and
    # unattended - while that directory's contents become visible to anybody
    # looking at the screen. The lock screen itself is untouched.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLockScreenSlideshow' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-abovelock

notes:
  pl: |
    Nazwa mówi o tapetach i prowadzi na manowce. Rzecz nie w obrazkach, tylko
    w tym, że przy zablokowanym ekranie system otwiera pliki z dysku
    i przetwarza ich zawartość — obrazy, czyli format o złożonej budowie —
    cyklicznie i bez udziału człowieka.

    Druga strona jest prostsza: zawartość wskazanego katalogu staje się
    widoczna dla każdego, kto patrzy na ekran blokady. Jeżeli katalog
    kiedykolwiek posłuży do czegoś innego niż tapety, ekran zacznie
    pokazywać zrzuty ekranu albo skany dokumentów.

    Kontekst serwerowy: konsola maszyny wirtualnej jest widoczna z panelu
    wirtualizacji dla szerszego grona niż sam serwer.
  en: |
    The name speaks of wallpapers and leads astray. The matter is not the
    pictures but that, with the screen locked, the system opens files from
    the disk and processes their contents - images, a format of intricate
    construction - on a cycle and without a person taking part.

    The other side is simpler: the contents of the chosen directory become
    visible to anybody looking at the lock screen. If the directory is ever
    used for something other than wallpapers, the screen will start showing
    screenshots or scans of documents.

    The server context: a virtual machine's console is seen from the
    virtualisation panel by a wider circle than the server itself.
