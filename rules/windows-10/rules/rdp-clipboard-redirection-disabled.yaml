id: win10-rdp-clipboard-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie schowka w sesji pulpitu zdalnego wyłączone
    en: The turning of the holding place into the session of the desk from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania wspólnego schowka między maszyną zdalną
    a maszyną, z której użytkownik się łączy.

    Schowek bywa uznawany za drobiazg, a jest drugą po dyskach drogą
    przenoszenia treści między dwiema maszynami. Przenosi nie tylko
    tekst: idą tamtędy także pliki, obrazy i fragmenty dokumentów.

    Zagrożenie pierwsze to wynoszenie treści. Zaznaczenie i skopiowanie
    wystarczy, żeby zawartość dokumentu z maszyny zdalnej znalazła się
    na maszynie klienta. Jest to droga, której żaden mechanizm nadzoru
    plików nie obejmuje, bo nie powstaje tu plik.

    Zagrożenie drugie to hasła. Ludzie kopiują hasła ze schowka i do
    schowka, a wspólny schowek przenosi je między maszynami bez niczyjej
    świadomości.

    Zagrożenie trzecie to odczyt przez programy. Zawartość schowka jest
    dostępna dla programów działających po obu stronach, więc trafia
    także tam, gdzie nikt jej nie kierował.

    Odnotowuję, że reguła stanowi parę z punktem o przekierowaniu dysków.
    Wdrożenie jednego bez drugiego zostawia drogę otwartą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przepływ
    treści między maszynami, niewidoczny dla nadzoru plików.
  en: |
    The setting forbids a holding place shared between the far machine and the machine the user joins themselves
    from.

    The holding place is at times held a small matter, and it is, after the disks, the second road for the
    carrying of content between two machines. It carries not text alone: there go also files, pictures and pieces
    of papers.

    The first danger is the carrying out of content. A marking and a copying suffice for the content of a paper
    upon the far machine to find itself upon the client's. It is a road no mechanism watching over files takes in,
    no file arising here.

    The second danger is passwords. People copy passwords out of the holding place and into it, and a shared
    holding place carries them between machines with nobody aware.

    The third danger is the reading by programs. What stands in the holding place is to be had by the programs
    working upon both sides, so it reaches also where nobody sent it.

    I set down that the rule makes a pair with the item about the turning of disks. The rolling out of one without
    the other leaves the road open.

    What an attacker gains while the item goes unmet: a flow of content between machines, unseen by the watch over
    files.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a skutek jest odczuwany natychmiast
    i przez każdego.

    Miejscem pierwszym jest codzienna praca. Kopiowanie adresu,
    fragmentu tekstu albo polecenia między maszyną własną a sesją zdalną
    to czynność wykonywana dziesiątki razy dziennie. Po zmianie przestanie
    działać i będzie to pierwsze, co użytkownicy zgłoszą.

    Miejscem drugim są osoby zarządzające, które wklejają do sesji
    polecenia przygotowane wcześniej. Po zmianie będą przepisywać je
    ręcznie, co sprzyja pomyłkom przy poleceniach długich.

    Miejscem trzecim są narzędzia wsparcia przekazujące klucze licencyjne
    i ciągi konfiguracyjne przez schowek.

    Odnotowuję, że jest to punkt najczęściej odrzucany z całej rodziny
    przekierowań, i przyczyną nie jest ryzyko, tylko codzienna wygoda.
    Warto pokazać oba ustawienia schowka — jedno- i dwukierunkowe — jeśli
    wdrożenie pełne jest nie do przyjęcia.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: schowka wewnątrz sesji, schowka na maszynie
    klienta, pracy programów, logowania, drukowania.
  en: |
    The class is "needs review", and the upshot is felt at once and by everyone.

    The first place is the day's work. The copying of an address, a piece of text or an order between one's own
    machine and the session from afar is a doing worked dozens of times a day. After the change it will cease to
    work and it will be the first thing the users report.

    The second place is those who order machines and paste into the session orders made ready beforehand. After
    the change they will write them out by hand, which breeds mistakes at long orders.

    The third place is tools of help handing over keys of licence and strings of setting through the holding
    place.

    I set down that this is the item oftenest cast aside of the whole kindred of turnings, and the cause is not
    the danger but the ease of the day. It is worth showing both settings of the holding place - the one way and
    the two ways - if the full rollout be not to be borne.

    The consequence shows at once, with no restart.

    What this does not break: the holding place within the session, the holding place upon the client's machine,
    the work of programs, logging on, or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - user-interface
  what_breaks:
    pl:
      - Kopiowanie tekstu i adresów między maszyną własną a sesją zdalną przestanie działać
      - Będzie to pierwsza rzecz zgłoszona przez użytkowników, bo dotyczy czynności wykonywanej stale
      - Osoby zarządzające będą przepisywać polecenia ręcznie, co sprzyja pomyłkom przy poleceniach długich
      - Narzędzia wsparcia przekazujące klucze licencyjne przez schowek stracą tę drogę
      - Schowek wewnątrz sesji, schowek na maszynie klienta, praca programów i logowanie pozostają bez zmian
    en:
      - The copying of text and addresses between one s own machine and the session from afar will cease to work
      - It will be the first thing reported by the users, touching as it does a doing worked without end
      - Those who order machines will write orders out by hand, which breeds mistakes at long orders
      - Tools of help handing over keys of licence through the holding place will lose that road
      - The holding place within the session, the holding place upon the client s machine, the work of programs and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca w sesji zdalnej opiera się na wklejaniu poleceń albo ciągów konfiguracyjnych przygotowanych poza nią
    en:
      - Work in the session from afar rests upon the pasting of orders or strings of setting made ready beyond it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'fDisableClip'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableClip'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableClip' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła jest najczęściej odrzucaną z całej rodziny i warto, żeby
    aplikacja przyznała to wprost. Przyczyną nie jest ocena ryzyka, tylko
    codzienna wygoda — kopiowanie między maszynami wykonuje się dziesiątki
    razy dziennie.

    Argument wart postawienia dotyczy tego, że schowek nie tworzy pliku.
    Treść przechodzi między maszynami, a żaden mechanizm nadzoru plików
    tej drogi nie obejmuje, bo nie ma czego obejmować.

    Odnotowuję hasła. Ludzie kopiują je ze schowka i do schowka,
    a wspólny schowek przenosi je między maszynami bez niczyjej
    świadomości — to jest argument mocniejszy niż wynoszenie dokumentów.
  en: |
    The rule is the one oftenest cast aside of the whole kindred, and it is well that the application own it
    outright. The cause is not the grading of the danger but the ease of the day - the copying between machines is
    worked dozens of times a day.

    The argument worth putting touches this, that the holding place makes no file. The content passes between
    machines, and no mechanism watching over files takes in that road, there being nothing to take in.

    I set down passwords. People copy them out of the holding place and into it, and a shared holding place
    carries them between machines with nobody aware - and that is an argument stronger than the carrying out of
    papers.
