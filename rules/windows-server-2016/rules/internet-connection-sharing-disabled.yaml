id: win2016-internet-connection-sharing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Udostępnianie połączenia sieciowego wyłączone
    en: Sharing of a network connection switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa możliwość udostępnienia połączenia sieciowego maszyny
    innym urządzeniom.

    Funkcja ta zamienia maszynę w bramę. Włączona, uruchamia na niej
    przydzielanie adresów, przekierowywanie ruchu i pośredniczenie
    w rozwiązywaniu nazw — czyli komplet usług, który normalnie świadczy
    urządzenie sieciowe, skonfigurowane i pilnowane przez kogoś, kto o tym
    wie.

    Skutki są dwa i oba niepożądane. Pierwszy: przez maszynę zaczyna
    przechodzić ruch urządzeń, których w tej sieci nikt nie przewidział,
    z pominięciem punktu, w którym ruch jest kontrolowany. Drugi, mniej
    oczywisty i częstszy: uruchomione przydzielanie adresów zaczyna
    odpowiadać na pytania w segmencie i rozdawać adresy maszynom, które
    o to nie prosiły tę maszynę. Skutkiem jest awaria łączności w całym
    segmencie, trudna do powiązania z przyczyną.

    Na serwerze funkcja ta nie ma żadnego zastosowania prawowitego.
    Udostępnianie dostępu to rola routera albo bramy zdalnego dostępu,
    konfigurowana osobno i świadomie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wprowadzenia do sieci ruchu z urządzeń spoza niej przez maszynę stojącą
    wewnątrz, z pominięciem kontroli na styku sieci.
  en: |
    The setting removes the means of sharing the machine's network connection with
    other devices.

    The function turns the machine into a gateway. Switched on, it starts up on it
    the giving out of addresses, the forwarding of traffic and an intermediary role
    in resolving names - which is to say the full set of services a network device
    normally provides, configured and watched over by somebody who knows about it.

    There are two consequences and both are unwanted. First: traffic from devices
    nobody foresaw on this network begins passing through the machine, going by the
    point at which traffic is controlled. Second, less obvious and commoner: the
    started-up giving out of addresses begins answering questions in the segment and
    handing addresses to machines that asked nothing of this one. The upshot is a
    breakdown of connectivity across the whole segment, hard to tie to its cause.

    On a server the function has no rightful use whatever. Sharing access is the
    role of a router or of a remote access gateway, configured apart and
    deliberately.

    What an attacker gains while the item goes unmet: the means of bringing traffic
    from devices outside the network into it through a machine standing inside,
    going by the controls at the network's edge.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Na serwerze funkcja ta jest nieużywana,
    a zasada usuwa wyłącznie możliwość jej włączenia.

    Rzecz warta powiedzenia, bo bywa źródłem nieporozumienia: zasada nie
    dotyczy ani roli routera, ani bramy zdalnego dostępu, ani przełącznika
    maszyn wirtualnych, ani zespołów kart. Są to osobne mechanizmy,
    konfigurowane osobno, i żaden z nich nie przestanie działać.

    Jedyny przypadek, w którym zmiana byłaby odczuwalna, to maszyna, na
    której udostępnianie jest dziś włączone i przez którą faktycznie
    przechodzi czyjś ruch. Jest to na serwerze sytuacja wyjątkowa i sama
    w sobie warta uwagi — częściej oznacza pomyłkę niż zamierzenie.

    Warto wiedzieć, że wyłączenie funkcji na maszynie, która już ją
    uruchomiła, przerywa łączność urządzeń z niej korzystających. Audyt
    i symulacja powinny to pokazać przed wykonaniem, nawet jeśli klasa jest
    łagodna.

    Czego to nie psuje: roli routera, bramy zdalnego dostępu, przełącznika
    maszyn wirtualnych, zespołów kart, łączności maszyny.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". On a server the function is unused, and the policy
    removes only the means of switching it on.

    A thing worth saying, since it is at times a source of misunderstanding: the
    policy concerns neither the router role, nor the remote access gateway, nor the
    virtual machine switch, nor teams of cards. Those are separate mechanisms,
    configured apart, and none of them will stop working.

    The one case in which the change would be felt is a machine where sharing is
    switched on today and through which somebody's traffic really passes. On a
    server that is an exceptional situation and worth attention in itself - more
    often it means a mistake than an intention.

    Worth knowing that switching the function off on a machine that has already
    started it breaks the connectivity of the devices using it. The audit and the
    simulation should show that before execution, even though the class is mild.

    What this does not break: the router role, the remote access gateway, the
    virtual machine switch, teams of cards, or the machine's own connectivity.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Na maszynie z włączonym udostępnianiem urządzenia korzystające z niej tracą łączność w chwili wyłączenia funkcji
      - Nie da się już udostępnić połączenia doraźnie, więc obejście problemu z dostępem tą drogą przestaje być możliwe
      - Rola routera, brama zdalnego dostępu, przełącznik maszyn wirtualnych i zespoły kart pozostają bez zmian, bo to osobne mechanizmy
      - Łączność samej maszyny pozostaje bez zmian
    en:
      - On a machine with sharing switched on, the devices using it lose connectivity the moment the function is switched off
      - A connection can no longer be shared as a makeshift, so a way round an access problem by that road ceases to be possible
      - The router role, the remote access gateway, the virtual machine switch and teams of cards stay unchanged, being separate mechanisms
      - The machine's own connectivity stays unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Udostępnianie połączenia jest na tej maszynie włączone i faktycznie przechodzi przez nią czyjś ruch
      - Maszyna pełni rolę bramy dla urządzeń, dla których nie przewidziano innego rozwiązania
    en:
      - Connection sharing is switched on on this machine and somebody's traffic really passes through it
      - The machine fills the role of a gateway for devices no other solution has been planned for
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_ShowSharedAccessUI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_ShowSharedAccessUI'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_ShowSharedAccessUI' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/ras/ras-gateway-overview

notes:
  pl: |
    Punkt idzie w parze z regułą o mostku sieciowym i obie opisują to samo
    zjawisko z dwóch stron: maszynę, która staje się przejściem między
    sieciami, choć nikt jej tak nie zaprojektował. Mostek znosi rozdział
    sieci; udostępnianie wprowadza do sieci urządzenia z zewnątrz. Aplikacja
    powinna pokazywać je razem.

    Skutek uboczny w postaci rozdawania adresów w segmencie jest wart
    osobnej wzmianki, bo jest częstszy od skutku zabezpieczającego i bardziej
    dotkliwy na co dzień. Awaria łączności w całym segmencie, wywołana jedną
    włączoną funkcją na jednej maszynie, jest klasycznym przypadkiem
    trudnym do zdiagnozowania.

    Ocena wysoka, mimo klasy „bez uciążliwości". Zestawienie to jest
    dokładnie tym, czego szuka macierz decyzyjna: zysk realny, koszt żaden,
    punkt do wykonania hurtem i od razu.
  en: |
    The item goes in a pair with the rule on the network bridge, and both describe
    the same phenomenon from two sides: a machine becoming a passage between
    networks though nobody designed it so. A bridge lifts the separation of
    networks; sharing brings devices from outside into the network. The application
    should show them together.

    The side effect of handing out addresses in the segment deserves a mention of
    its own, since it is commoner than the security consequence and more painful day
    to day. A breakdown of connectivity across a whole segment, brought on by one
    function switched on on one machine, is a classic case hard to diagnose.

    The judgement is high despite the class "no disruption". That pairing is exactly
    what the decision matrix looks for: a real gain, no cost, an item to be done in
    bulk and at once.
