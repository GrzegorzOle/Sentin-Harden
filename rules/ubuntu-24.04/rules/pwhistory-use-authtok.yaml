id: ubuntu2404-pwhistory-use-authtok

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.3.3.3.3
  section: Access Control > Pluggable Authentication Modules > Configure pluggable module arguments > Configure pam_pwhistory module
  title:
    pl: Moduł pam_pwhistory używa hasła sprawdzonego wcześniej w stosie
    en: Ensure pam_pwhistory includes use_authtok
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Z opcją use_authtok pam_pwhistory sprawdza hasło, które użytkownik podał
    już modułowi pam_pwquality, i nie pyta o nie drugi raz. Bez niej moduły
    w stosie password mogą pracować na różnych hasłach, więc historia może
    sprawdzać inne hasło niż to, które zostanie zapisane.

    Punkt wymaga, żeby wiersz password z pam_pwhistory
    w /etc/pam.d/common-password miał argument use_authtok.
  en: |
    With the use_authtok option pam_pwhistory checks the password the user
    already gave to pam_pwquality and does not ask for it again. Without it
    the modules in the password stack may work on different passwords, so
    the history may check another password than the one that is saved.

    The item requires the password line with pam_pwhistory in
    /etc/pam.d/common-password to have the use_authtok argument.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta pliki PAM.
  en: |
    Nobody will notice: the check only reads the PAM files.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    pam_has() {
      [ -r "$1" ] || return 1
      awk -v t="$2" -v m="$3" -v a="$4" '
        /^[ \t]*#/ || NF == 0 { next }
        { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
        $1 == t && p[n] == m && (a == "" || index(" " $0 " ", " " a " ")) { f = 1 }
        END { exit !f }' "$1"
    }
    evaluate() {
      local miss="" s f ty mo ar
      for s in common-password:password:pam_pwhistory.so:use_authtok; do
        f=${s%%:*}; s=${s#*:}; ty=${s%%:*}; s=${s#*:}; mo=${s%%:*}; ar=${s#*:}
        pam_has "/etc/pam.d/$f" "$ty" "$mo" "$ar" || miss="$miss,$f:$ty:$mo${ar:+:$ar}"
      done
      if [ -z "$miss" ]; then echo "OK:pam_pwhistory"; else echo "NOT_OK:missing=${miss#,}"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man8/pam_pwhistory.8.html

notes:
  pl: |
    Profil sentin-harden-pwhistory z reguły 5.3.2.4 daje wiersz
    z use_authtok, gdy przed pam_pwhistory działa pam_pwquality (punkt
    5.3.2.3). Bez pam_pwquality pam_pwhistory jest pierwszym modułem
    w stosie, sam pyta o nowe hasło i pam-auth-update wstawia jego wiersz
    bez use_authtok, a wynik jest NOT_OK. Wynik NOT_OK oznacza więc zwykle,
    że pam_pwhistory albo pam_pwquality nie jest włączony, albo własny
    profil pam-auth-update bez tej opcji. Reguła tylko sprawdza stan.
  en: |
    The sentin-harden-pwhistory profile from rule 5.3.2.4 gives a line with
    use_authtok when pam_pwquality runs before pam_pwhistory (item 5.3.2.3).
    Without pam_pwquality, pam_pwhistory is the first module in the stack,
    asks for the new password itself and pam-auth-update writes its line
    without use_authtok, so the result is NOT_OK. The NOT_OK result
    therefore usually means that pam_pwhistory or pam_pwquality is not
    enabled, or a custom pam-auth-update profile without this option. The
    rule only checks the state.
