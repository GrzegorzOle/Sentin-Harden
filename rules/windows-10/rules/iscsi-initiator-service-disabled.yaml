id: win10-iscsi-initiator-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa dołączania dysków blokowych przez sieć wyłączona
    en: The service attaching disks of blocks over the network switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę dołączającą do maszyny dyski udostępniane
    przez sieć tak, jakby były dyskami miejscowymi.

    Różnica wobec zwykłego udostępniania plików jest zasadnicza. Tam
    maszyna prosi o plik i dostaje plik. Tutaj maszyna dostaje surowy
    dysk i sama zakłada na nim system plików, sama nim zarządza i sama
    odpowiada za jego spójność.

    Zagrożenie pierwsze polega na tym, że dołączony dysk staje się
    dyskiem maszyny ze wszystkimi tego skutkami. Trafia na niego plik
    uruchamialny, trafiają na niego dane, a mechanizmy chroniące nośniki
    zewnętrzne zwykle go nie obejmują, bo widzą dysk miejscowy.

    Zagrożenie drugie dotyczy uwierzytelniania. Połączenie bywa zestawiane
    bez wzajemnego potwierdzenia stron, więc maszyna dołącza to, co
    odpowie pod danym adresem.

    Zagrożenie trzecie to kierunek odwrotny: usługa ta otwiera również
    drogę dołączenia dysku z tej maszyny gdzie indziej, jeżeli ktoś ma
    odpowiednie poświadczenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    podstawienia maszynie dysku traktowanego jak miejscowy.
  en: |
    The setting switches off the service attaching to the machine disks given out over the network as though they
    were disks upon the spot.

    The difference against the common giving out of files runs to the root. There the machine asks for a file and
    gets a file. Here the machine gets a raw disk and lays a keeping of files upon it itself, orders it itself and
    answers itself for its soundness.

    The first danger is that an attached disk becomes a disk of the machine with all that follows. A file that may
    be set going comes upon it, data come upon it, and the mechanisms guarding outward media commonly take it not
    in, seeing a disk upon the spot.

    The second danger touches the warranting. The joining is at times set up with no warranting of both sides one
    to the other, so the machine attaches whatever answers at the given address.

    The third danger is the road the other way: that service opens also a way for a disk of this machine to be
    attached elsewhere, if somebody holds the fitting warrants.

    What an attacker gains while the item goes unmet: a road for the setting before the machine of a disk held to
    be one upon the spot.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie ma odpowiedzieć na jedno
    pytanie: czy któryś dysk widoczny na tej maszynie jest dołączony tą
    drogą.

    Miejscem pierwszym są stanowiska korzystające z macierzy dyskowej.
    Zatrzymanie usługi odłącza dysk natychmiast, a programy zapisujące
    na nim w tej chwili zgłoszą błąd. Na dysku z bazą danych oznacza to
    przerwanie pracy i możliwe uszkodzenie zbioru.

    Miejscem drugim są kopie zapasowe kierowane na dysk dołączony przez
    sieć. Te wykonają się po zmianie, ale nie będą miały gdzie zapisać.

    Miejscem trzecim są maszyny uruchamiane z dysku dołączonego przez
    sieć. Tam zmiana jest wykluczona i trzeba to rozpoznać przed
    wdrożeniem, a nie po.

    Odnotowuję, że sprawdzenie jest szybkie: wystarczy spojrzeć, jakie
    dyski są dołączone. Punkt jest bezkosztowy wszędzie tam, gdzie nie ma
    żadnego.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: udostępniania plików, sieci, dysków miejscowych,
    drukowania, logowania.
  en: |
    The class is "needs review", and the review is to answer one question: whether any disk to be seen upon this
    machine is attached by that road.

    The first place is stations using a gathering of disks. The stopping of the service detaches the disk at once,
    and programs writing upon it at that hour will give out a fault. Upon a disk holding a store of data that
    means the breaking of work and a possible marring of the gathering.

    The second place is safe copies sent onto a disk attached over the network. Those will be made after the
    change but will have nowhere to write.

    The third place is machines set going from a disk attached over the network. There the change is shut out and
    that must be known before the rollout and not after.

    I set down that the looking is swift: it suffices to see what disks are attached. The item is without cost
    wherever there is none.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the giving out of files, the network, disks upon the spot, printing, or logging on.

implementation_consequences:
  impact_areas:
    - file-sharing
    - drivers-and-devices
    - network-and-firewall
  what_breaks:
    pl:
      - Dysk z macierzy dołączony przez sieć zostanie odłączony natychmiast, a programy zapisujące na nim zgłoszą błąd
      - Na dysku z bazą danych oznacza to przerwanie pracy i możliwe uszkodzenie zbioru
      - Kopie zapasowe kierowane na taki dysk wykonają się, ale nie będą miały gdzie zapisać
      - Na maszynie uruchamianej z dysku dołączonego przez sieć zmiana jest wykluczona
      - Udostępnianie plików, sieć, dyski miejscowe, drukowanie i logowanie pozostają bez zmian
    en:
      - A disk of a gathering attached over the network will be detached at once, and programs writing upon it will give out a fault
      - Upon a disk holding a store of data that means the breaking of work and a possible marring of the gathering
      - Safe copies sent onto such a disk will be made but will have nowhere to write
      - Upon a machine set going from a disk attached over the network the change is shut out
      - The giving out of files, the network, disks upon the spot, printing and logging on stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna korzysta z dysku dołączonego przez sieć, w szczególności pod bazę danych albo kopie zapasowe
      - Maszyna uruchamia się z dysku dołączonego przez sieć
    en:
      - The machine uses a disk attached over the network, above all under a store of data or safe copies
      - The machine is set going from a disk attached over the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service detaches the disks attached over the network; programs
    # writing to them at this hour will give out a fault.
    Stop-Service -Name 'MSiSCSI' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'MSiSCSI' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'MSiSCSI' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/iscsi/iscsi-target-server

notes:
  pl: |
    Reguła wymaga jednego spojrzenia przed wdrożeniem i warto, żeby
    aplikacja o nie poprosiła wprost: jakie dyski są dołączone przez
    sieć. Odpowiedź „żaden" czyni punkt bezkosztowym, odpowiedź inna
    zmienia go w decyzję o oknie serwisowym.

    Argument wart postawienia dotyczy różnicy wobec udostępniania plików.
    Maszyna dostaje tu surowy dysk i traktuje go jak miejscowy, więc
    mechanizmy chroniące nośniki zewnętrzne zwykle go nie obejmują.

    Odnotowuję kierunek odwrotny, o którym łatwo zapomnieć: usługa ta
    otwiera także drogę dołączenia dysku z tej maszyny gdzie indziej.
    Punkt zamyka oba kierunki naraz.
  en: |
    The rule calls for one look before the rollout, and it is well that the application ask for it outright: what
    disks are attached over the network. The answer "none" makes the item without cost; another answer turns it
    into a decision about a window of service.

    The argument worth putting touches the difference against the giving out of files. The machine here gets a raw
    disk and holds it to be one upon the spot, so the mechanisms guarding outward media commonly take it not in.

    I set down the road the other way, easily forgotten: that service opens also a way for a disk of this machine
    to be attached elsewhere. The item shuts both roads at once.
