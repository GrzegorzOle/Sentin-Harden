id: fedora44-hfsplus-not-available

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.1.1.4
  section: Initial Setup > Filesystem > Configure Filesystem Kernel Modules
  title:
    pl: Moduł jądra hfsplus niedostępny
    en: Ensure hfsplus kernel module is not available
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    HFS+ (Mac OS Extended) to system plików Maków od 1998 roku do nadejścia
    APFS w 2017. Nadal spotyka się go na dyskach zewnętrznych sformatowanych
    na Macu, starszych dyskach kopii Time Machine i odtwarzaczach iPod.
    Sterownik jądra ma podobną historię jak hfs: długo bez opiekuna, z błędami
    znajdowanymi przez automatyczne testy.

    Każdy sterownik systemu plików to kod jądra, który czyta strukturę zapisaną
    na nośniku. Jeśli nośnik przygotował napastnik, to on decyduje, co ten kod
    dostaje na wejście, a błąd w obsłudze uszkodzonej struktury wykonuje się
    z pełnymi uprawnieniami jądra. Jądro ładuje sterownik samo, gdy ktoś poprosi
    o zamontowanie danego typu, więc nikt nie musi świadomie tego sterownika
    uruchamiać.

    Na Fedorze moduł jest dostępny w pakiecie kernel-modules-extra, a pulpit
    potrafi sam montować podłączone nośniki dla zalogowanego użytkownika. Do
    uruchomienia sterownika może więc wystarczyć podłączenie przygotowanego
    dysku, stąd kategoria średnia.

    Punkt zamyka tę drogę: moduł hfsplus nie ładuje się ani na żądanie jądra,
    ani wywołany wprost.
  en: |
    HFS+ (Mac OS Extended) was the Mac file system from 1998 until APFS arrived
    in 2017. It still turns up on external drives formatted on a Mac, older Time
    Machine backup disks and iPod players. The kernel driver has a history
    similar to hfs: long without a maintainer, with bugs found by automated
    testing.

    Every file system driver is kernel code that reads a structure stored on a
    medium. If an attacker prepared the medium, the attacker decides what that
    code gets as input, and a bug in handling a damaged structure runs with full
    kernel privileges. The kernel loads the driver by itself when something asks
    to mount that type, so nobody has to start the driver on purpose.

    On Fedora the module ships in the kernel-modules-extra package, and the
    desktop can mount attached media for the signed-in user by itself. Plugging
    in a prepared disk may therefore be enough to run the driver, hence the
    medium category.

    The item closes that path: the hfsplus module does not load, neither on the
    kernel's request nor when called directly.

disruption_description:
  pl: |
    Skutek dotyczy wymiany danych z Makami. Dysk zewnętrzny sformatowany na
    Macu jako Mac OS Extended przestaje się otwierać, podobnie starszy dysk
    Time Machine. Dyski APFS nie są dotknięte, bo jądro i tak ich nie obsługuje.

    Warto wiedzieć, że sterownik jądra montuje dyski HFS+ z dziennikiem,
    a tak Mac formatuje je domyślnie, tylko do odczytu. Jeśli ktoś korzysta
    z takich dysków na Fedorze, to zwykle właśnie po to, żeby coś z nich
    skopiować, i to przestanie być możliwe.

    Przed wdrożeniem trzeba też sprawdzić, czy żaden wpis w /etc/fstab nie
    używa typu hfsplus. Starsze instalacje Fedory na komputerach Mac z procesorem
    Intel zakładały tak partycję /boot/efi.

    Zmiana nie wymaga restartu ani wylogowania.
  en: |
    The consequence concerns exchanging data with Macs. An external drive
    formatted on a Mac as Mac OS Extended stops opening, and so does an older
    Time Machine disk. APFS disks are not affected, because the kernel does not
    handle them anyway.

    Note that the kernel driver mounts journaled HFS+ disks, which is how a Mac
    formats them by default, as read-only. If anyone uses such disks on Fedora,
    it is usually to copy something off them, and that will no longer be
    possible.

    Before rollout, also check that no /etc/fstab entry uses the hfsplus type.
    Older Fedora installations on Intel-based Macs set up the /boot/efi
    partition that way.

    The change needs no restart and no sign-out.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Dysk zewnętrzny sformatowany na Macu jako Mac OS Extended nie montuje się, więc nie da się z niego skopiować plików
      - Starszy dysk kopii Time Machine w formacie HFS+ przestaje być czytelny na tej maszynie
      - iPod sformatowany na Macu nie montuje się jako pamięć masowa
    en:
      - An external drive formatted on a Mac as Mac OS Extended does not mount, so files cannot be copied off it
      - An older Time Machine backup disk in HFS+ format can no longer be read on this machine
      - An iPod formatted on a Mac does not mount as a storage device
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Użytkownik regularnie wymienia dane z Makami na dyskach zewnętrznych sformatowanych jako Mac OS Extended
      - Wpis w /etc/fstab, np. dla /boot/efi na Macu z procesorem Intel, używa typu hfsplus; blokada zatrzyma start systemu
    en:
      - The user regularly exchanges data with Macs on external drives formatted as Mac OS Extended
      - An /etc/fstab entry, such as /boot/efi on an Intel-based Mac, uses the hfsplus type; the block will stop the system from booting
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    m=hfsplus
    mods=/usr/lib/modules
    if [ ! -d "$mods" ] || [ ! -r /proc/modules ] || ! command -v modprobe >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if grep -q "^$m " /proc/modules; then echo LOADED; exit 0; fi
    for list in "$mods"/*/modules.builtin; do
      [ -e "$list" ] || continue
      [ -r "$list" ] || { echo CHECK_ERROR; exit 0; }
      if grep -Eq "/$m\.ko$" "$list"; then echo BUILTIN; exit 0; fi
    done
    if ! found=$(find "$mods" -name "$m.ko*" -print -quit 2>/dev/null); then
      echo CHECK_ERROR; exit 0
    fi
    if [ -z "$found" ]; then echo NOT_PRESENT; exit 0; fi
    if ! config=$(modprobe --showconfig 2>/dev/null); then echo CHECK_ERROR; exit 0; fi
    blocked=no; listed=no
    if printf '%s\n' "$config" | grep -Eq "^install $m (/usr)?/bin/(false|true)$"; then blocked=yes; fi
    if printf '%s\n' "$config" | grep -qx "blacklist $m"; then listed=yes; fi
    case "$blocked$listed" in
      yesyes) echo BLOCKED ;;
      yesno)  echo NOT_BLACKLISTED ;;
      noyes)  echo LOADABLE_ON_REQUEST ;;
      *)      echo AVAILABLE ;;
    esac
  expected: '^(BLOCKED|NOT_PRESENT)$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      m=hfsplus
      f=/etc/modprobe.d/sentin-harden-hfsplus.conf
      mkdir -p "$(dirname '{{backup_file}}')"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        if grep -q "^$m " /proc/modules; then echo loaded=1; else echo loaded=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > '{{backup_file}}'
      echo "Saved previous state to {{backup_file}}"
    )

  change_command: |
    (
      set -e
      m=hfsplus
      f=/etc/modprobe.d/sentin-harden-hfsplus.conf
      printf '%s\n' \
        '# Sentin-Harden: fedora44-hfsplus-not-available' \
        "install $m /bin/false" \
        "blacklist $m" > "$f"
      chmod 0644 "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if grep -q "^$m " /proc/modules; then
        if ! modprobe -r "$m"; then
          echo "Module $m is in use and stays loaded until the file system using it is unmounted" >&2
        fi
      fi
      echo "Wrote $f"
    )

  rollback_command: |
    (
      set -e
      m=hfsplus
      f=/etc/modprobe.d/sentin-harden-hfsplus.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      loaded=$(sed -n 's/^loaded=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      if [ "$loaded" = 1 ] && ! grep -q "^$m " /proc/modules; then modprobe "$m"; fi
      echo "Restored previous state of $f"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/modprobe.d.5.html
  - https://docs.kernel.org/filesystems/hfsplus.html

notes:
  pl: |
    Sprawdzenie czyta wynikową konfigurację modprobe, a nie jeden wybrany
    plik. Blokada zapisana wcześniej gdzie indziej, np. w
    /etc/modprobe.d/hfsplus.conf, także spełnia punkt, a naprawa jej nie
    dubluje, bo przy spełnionym punkcie nie jest uruchamiana.

    Potrzebne są obie linie. Wpis blacklist powstrzymuje tylko ładowanie po
    aliasie, czyli wtedy, gdy jądro samo prosi o sterownik przy montowaniu;
    modprobe wywołane z nazwą modułu go omija. Linia install zastępuje
    ładowanie uruchomieniem /bin/false, więc każda taka próba kończy się
    błędem. Obu mechanizmów nie zatrzymuje insmod z pełną ścieżką do pliku,
    ale to wymaga roota i świadomego działania.

    Punkt jest spełniony także wtedy, gdy żadne zainstalowane jądro nie
    zawiera modułu. Moduł załadowany w chwili sprawdzenia daje wynik
    niespełniony nawet przy obecnej blokadzie; naprawa próbuje go wyładować,
    a jeśli jest w użyciu, zostaje w pamięci do odmontowania systemu plików
    albo do restartu. Jeśli punkt pozostaje niespełniony po naprawie
    i restarcie, sterownik jest wkompilowany w jądro: plikiem konfiguracji
    nie da się go zablokować i zostaje zapisanie wyjątku.
  en: |
    The check reads the effective modprobe configuration rather than one
    chosen file. A block written earlier somewhere else, for example in
    /etc/modprobe.d/hfsplus.conf, also meets the item, and the remediation does
    not duplicate it, because it is not run when the item is met.

    Both lines are needed. The blacklist entry only stops loading by alias,
    that is, when the kernel itself asks for the driver while mounting; running
    modprobe with the module name bypasses it. The install line replaces loading
    with running /bin/false, so every such attempt fails. Neither mechanism
    stops insmod with the full path to the file, but that needs root and a
    deliberate action.

    The item is also met when no installed kernel contains the module. A
    module that is loaded at the time of the check gives a non-compliant result
    even when the block is in place; the remediation tries to unload it, and if
    it is in use it stays in memory until the file system is unmounted or the
    machine restarts. If the item is still non-compliant after the remediation
    and a restart, the driver is compiled into the kernel: a configuration file
    cannot block it, and the remaining option is to record an exception.
