id: win11-update-pause-feature-removed

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Wstrzymywanie aktualizacji przez użytkownika niedostępne
    en: Pausing of updates by the user made unavailable
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z widoku aktualizacji możliwość wstrzymania ich przez
    użytkownika na kilka tygodni.

    Mechanizm powstał z myślą o odroczeniu restartu w złym momencie
    i w takiej roli jest sensowny. W praktyce bywa używany inaczej:
    wstrzymanie jest przedłużane raz za razem, a maszyna zostaje na starej
    wersji na długo — bo aktualizacja zawsze przychodzi w złym momencie.

    Skutek jest taki, że wersja systemu na maszynie przestaje zależeć od
    decyzji administratora, a zaczyna od wygody pojedynczej osoby. Raport
    zgodności pokazuje wtedy stan, który nikogo nie niepokoi, bo aktualizacje
    nie są wyłączone — są tylko odłożone.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czas.
    Poprawka opisująca błąd jest publiczna od dnia wydania, a sposób jego
    wykorzystania powstaje zwykle w ciągu dni. Maszyna wstrzymana na kilka
    tygodni stoi w oknie, w którym błąd jest znany wszystkim, a nienaprawiony
    tylko u niej.

    Zabranie tej możliwości nie zmienia harmonogramu aktualizacji ani nie
    przyspiesza restartów. Odbiera wyłącznie prawo do odkładania ich
    w nieskończoność.
  en: |
    The setting removes from the update view the means of pausing them for some weeks at
    the user's hand.

    The mechanism was made with the deferral of a restart at a bad moment in mind, and in
    that role makes sense. In practice it is sometimes used otherwise: the pause is
    prolonged time after time and the machine stays on the old version for long - since an
    update always comes at a bad moment.

    The effect is that the system's version on the machine stops depending on the
    administrator's decision and starts depending on a single person's convenience. The
    compliance report then shows a state that alarms nobody, since updates are not switched
    off - they are merely put off.

    What an attacker gains while the item goes unmet: time. The fix describing a fault is
    public from the day it is issued, and the means of using it usually comes about within
    days. A machine paused for some weeks stands in the window in which the fault is known
    to everyone and unmended at its place alone.

    Taking that means away changes neither the update schedule nor the pace of restarts. It
    takes away the right to put them off without end alone.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ludzie w organizacji korzystają ze wstrzymania
    świadomie — na przykład na stanowiskach, gdzie restart w środku pracy
    kosztuje realnie.

    Skutek jest widoczny od razu: w widoku aktualizacji znika przycisk
    wstrzymania. Użytkownik, który go używał, zgłosi to jako brak opcji,
    a nie jako zmianę zasady.

    Wstrzymanie już trwające nie jest tą zmianą przerywane. Kończy się
    w swoim terminie i nie daje się przedłużyć.

    Zmiana nie odbiera możliwości odłożenia samego restartu ani nie wymusza
    ponownego uruchomienia w trakcie pracy — te rzeczy są sterowane osobnymi
    ustawieniami. Warto o tym powiedzieć użytkownikom, bo obawa dotyczy
    zwykle restartu, a nie wstrzymania.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether people in the organisation use the pause knowingly - for
    instance at stations where a restart in the middle of work costs something real.

    The effect is visible at once: the pause button vanishes from the update view. A user
    who used it will report it as a missing option rather than as a changed policy.

    A pause already running is not cut short by this change. It ends at its own term and
    cannot be prolonged.

    The change takes away neither the means of putting off the restart itself nor forces a
    reboot during work - those things are steered by separate settings. It is worth telling
    users so, since the fear usually concerns the restart rather than the pause.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Przycisk wstrzymania aktualizacji znika z widoku aktualizacji
      - Wstrzymanie już trwające kończy się w swoim terminie i nie daje się przedłużyć
      - Odłożenie samego restartu pozostaje możliwe i działa bez zmiany
      - Harmonogram pobierania i instalowania aktualizacji nie zmienia się
    en:
      - The pause button vanishes from the update view
      - A pause already running ends at its own term and cannot be prolonged
      - Putting off the restart itself stays possible and works unchanged
      - The schedule of fetching and installing updates does not change
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko obsługuje proces, w którym niezapowiedziana aktualizacja przerywa pracę o realnym koszcie
    en:
      - The station serves a process in which an unannounced update breaks off work at a real cost
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name carries a "Set" prefix that the policy name does not.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'SetDisablePauseUXAccess'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $current = (Get-ItemProperty -Path $path -Name 'SetDisablePauseUXAccess' -ErrorAction SilentlyContinue).'SetDisablePauseUXAccess'
    [pscustomobject]@{
      path        = $path
      name        = 'SetDisablePauseUXAccess'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SetDisablePauseUXAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Nazwa wartości nosi przedrostek, którego nie ma w nazwie zasady, i jest
    to częsta przyczyna nieodnalezienia jej przy sprawdzaniu ręcznym.

    Reguła dotyczy wyłącznie wstrzymania całych aktualizacji. Osobne
    ustawienia sterują tym, kiedy wolno restartować maszynę i jak długo
    można ten restart odkładać — one pozostają nietknięte.

    Wartość leży w kluczu wspólnym z pozostałymi regułami o aktualizacjach,
    więc wycofanie jednej nie rusza harmonogramu ani odroczeń.

    Brak wartości nie jest stanem zgodnym, bo domyślnie wstrzymanie jest
    dostępne dla każdego użytkownika maszyny.
  en: |
    The value's name bears a prefix absent from the policy's name, and that is a common
    reason for failing to find it when checking by hand.

    The rule concerns the pausing of whole updates alone. Separate settings steer when the
    machine may be restarted and how long that restart may be put off - those are left
    untouched.

    The value lies in a key shared with the remaining update rules, so rolling one back
    disturbs neither the schedule nor the deferrals.

    A missing value is not a compliant state, since by default the pause is available to
    every user of the machine.
