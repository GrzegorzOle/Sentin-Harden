id: win11-messaging-cloud-sync-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Messaging
  title:
    pl: Przenoszenie wiadomości tekstowych poza maszynę wyłączone
    en: Carrying text messages beyond the machine disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy wiadomości tekstowe obsługiwane na tej maszynie
    mają być przenoszone na zewnątrz i udostępniane pozostałym urządzeniom
    powiązanym z tym samym kontem.

    Treść wiadomości tekstowych zasługuje na osobne potraktowanie i warto
    powiedzieć dlaczego. Wiadomość tekstowa jest dziś przede wszystkim
    nośnikiem kodów jednorazowych. Bank, poczta, usługa płatnicza, dostęp do
    systemu firmowego — wszystkie przysyłają nimi drugi składnik logowania.

    Skutek jest taki, że zbiór wiadomości tekstowych jest w praktyce zbiorem
    kluczy do wszystkiego, co potwierdza się kodem. Kod jest krótkotrwały, ale
    napastnik, który czyta wiadomości na bieżąco, nie musi czekać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    wiadomości z tej maszyny z każdego innego urządzenia powiązanego z tym
    samym kontem. Przejęcie konta przestaje więc dotyczyć konta — obejmuje
    drugi składnik logowania do usług, które z tym kontem nie mają nic
    wspólnego.

    Jest to punkt, w którym drugi składnik uwierzytelnienia przestaje być
    drugim składnikiem, bo trafia tam, gdzie pierwszy. Stąd kategoria wysoka
    mimo funkcji wyglądającej na wygodową.
  en: |
    The setting settles whether text messages handled on this machine are to be carried
    outward and made available to the other devices tied to the same account.

    The content of text messages deserves separate treatment, and it is worth saying why.
    A text message is today above all a carrier of one-time codes. A bank, a post office,
    a payment service, access to a company system - all send by them the second element of
    a logon.

    The effect is that a store of text messages is in practice a store of keys to
    everything confirmed by a code. A code is short-lived, but an attacker reading the
    messages as they come need not wait.

    What an attacker gains while the item goes unmet: access to the messages from this
    machine from every other device tied to the same account. Taking over an account
    therefore stops concerning the account - it takes in the second element of logon to
    services that have nothing to do with that account.

    It is the point at which a second element of authentication stops being a second
    element, since it goes where the first one is. Hence the high category despite a
    function that looks like a convenience.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek na maszynie czyta i wysyła wiadomości
    tekstowe z poziomu komputera — a na stanowisku roboczym jest to rzadkie.

    Funkcja dotyczy maszyn powiązanych z telefonem albo wyposażonych w moduł
    sieci komórkowej. Na komputerze stacjonarnym bez takiego powiązania zmiana
    nie ma czego dotknąć.

    Tam, gdzie powiązanie istnieje, po zmianie wiadomości przestaną pojawiać
    się na pozostałych urządzeniach i przestaną być tam dostępne wstecz.
    Wiadomość wysłana z komputera nie pojawi się w historii na telefonie
    i odwrotnie.

    Odczuje to osoba, która odbiera kody jednorazowe na telefonie, a wpisuje
    je na komputerze i czyta je tam bez sięgania po telefon. Jest to
    zastosowanie realne i wygodne — i warto wprost powiedzieć, że reguła
    właśnie je odbiera, bo wygoda i ryzyko biorą się tu z tej samej cechy.

    Wysyłanie i odbieranie wiadomości na samym urządzeniu działa dalej bez
    zmiany. Wiadomości przeniesione wcześniej pozostają tam, gdzie trafiły;
    reguła ich nie usuwa.
  en: |
    What needs checking is whether anybody on the machine reads and sends text messages
    from the computer - and at a workstation that is rare.

    The function concerns machines tied to a phone or fitted with a mobile network module.
    On a desktop computer with no such tie the change has nothing to touch.

    Where the tie exists, after the change the messages will stop appearing on the other
    devices and will stop being available there for the past. A message sent from the
    computer will not appear in the history on the phone, and the other way round.

    It will be felt by whoever receives one-time codes on a phone but types them on a
    computer and reads them there without reaching for the phone. It is a real and
    convenient use - and it is worth saying outright that the rule takes exactly that
    away, since the convenience and the risk come here from the same trait.

    Sending and receiving messages on the device itself works on unchanged. Messages
    carried earlier stay where they went; the rule does not remove them.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Wiadomości tekstowe przestają pojawiać się na pozostałych urządzeniach użytkownika
      - Odczytanie kodu jednorazowego na komputerze zamiast na telefonie przestaje być możliwe
      - Historia wiadomości przestaje być wspólna dla urządzeń
      - Wysyłanie i odbieranie wiadomości na samym urządzeniu działa dalej
    en:
      - Text messages stop appearing on the user's other devices
      - Reading a one-time code on the computer instead of the phone stops being possible
      - The message history stops being shared between devices
      - Sending and receiving messages on the device itself works on
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca opiera się na czytaniu wiadomości tekstowych z poziomu komputera
      - Maszyna jest wyposażona w moduł sieci komórkowej i służy jako jedyne urządzenie do wiadomości
    en:
      - The work rests on reading text messages from the computer
      - The machine is fitted with a mobile network module and serves as the only device for messages
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowMessageSync'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    $current = (Get-ItemProperty -Path $path -Name 'AllowMessageSync' -ErrorAction SilentlyContinue).'AllowMessageSync'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowMessageSync'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowMessageSync' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-messaging

notes:
  pl: |
    Reguła należy do tej samej rodziny co ta, która dotyczy przenoszenia
    schowka na inne urządzenia. Obie opisują materiał opuszczający maszynę bez
    świadomej decyzji użytkownika i obie warto czytać razem — osobno każda
    wygląda na ustawienie wygody.

    Wiadomości przeniesione przed wdrożeniem zasady pozostają na urządzeniach,
    na które trafiły. Reguła zatrzymuje przenoszenie, nie cofa go, i nie ma
    sposobu, żeby z poziomu maszyny sprawdzić, co zostało przeniesione
    wcześniej.

    Brak wartości nie jest stanem zgodnym, bo domyślnie przenoszenie bywa
    dozwolone.
  en: |
    The rule belongs to the same family as the one about carrying the clipboard to other
    devices. Both describe material leaving the machine with no conscious decision by the
    user, and both are worth reading together - apart, each looks like a setting of
    convenience.

    Messages carried before the policy was applied stay on the devices they went to. The
    rule stops the carrying, does not undo it, and there is no way from the machine to
    check what was carried earlier.

    A missing value is not a compliant state, since by default the carrying is sometimes
    allowed.
