id: win10-peer-networking-grouping-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa grupowania maszyn w sieci równorzędnej wyłączona
    en: The service grouping machines in a network of peers switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę tworzącą grupy maszyn w sieci równorzędnej
    i utrzymującą łączność między ich uczestnikami.

    Grupa taka jest zbiorem maszyn, które uznały się nawzajem za
    uczestników wspólnego przedsięwzięcia i wymieniają dane bez serwera
    pośredniczącego. Usługa pilnuje, kto do grupy należy, przekazuje
    zaproszenia i utrzymuje połączenia między członkami.

    Zagrożenie polega na tym, że powstaje sieć wewnątrz sieci. Maszyny
    utrzymują ze sobą połączenia opisane wyłącznie przez członkostwo
    w grupie, a nie przez reguły sieciowe. Ruch idzie tam, dokąd
    prowadzi grupa, niezależnie od tego, jak podzielono sieć.

    Drugim skutkiem jest przyjmowanie zaproszeń. Maszyna należąca do
    grupy przyjmuje od jej członków dane bez dodatkowego sprawdzenia,
    bo członkostwo jest tu podstawą zaufania.

    Odnotowuję, że najbardziej znane zastosowanie tego mechanizmu, czyli
    grupa domowa, zostało wycofane. Pozostały nieliczne narzędzia
    współpracy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: połączenia
    między maszynami opisane członkostwem w grupie, a nie regułami sieci.
  en: |
    The setting switches off the service making groups of machines in a network of peers and keeping up the
    joining among those taking part.

    Such a group is a gathering of machines that have owned one another for takers of part in a common
    undertaking, and that trade data without a server between. The service watches who belongs to the group, hands
    on biddings and keeps up the joinings among the members.

    The danger lies in this, that a network arises within the network. Machines keep up joinings with one another
    set out solely by membership in a group and not by rules of the network. Traffic goes where the group leads,
    however the network may have been parted.

    The second upshot is the taking of biddings. A machine belonging to a group takes data from its members
    without a further check, membership being here the ground of trust.

    I set down that the best known use of that mechanism, the home group, has been drawn back. There are left some
    few tools of working together.

    What an attacker gains while the item goes unmet: joinings among machines set out by membership in a group and
    not by the network's rules.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś korzysta z narzędzia współpracy opartego na grupach.

    Miejscem wartym uwagi są starsze narzędzia do wspólnej pracy nad
    dokumentem i do prowadzenia spotkań bez serwera. Po zmianie nie
    utworzą grupy ani do niej nie dołączą.

    Miejscem drugim są zestawy do udostępniania plików w małej sieci
    budowane wokół grupy domowej. Sama grupa domowa została wycofana,
    ale zdarzają się rozwiązania własne, które z tego mechanizmu dalej
    korzystają.

    Odnotowuję, że usługa ta zależy od dwóch pozostałych usług sieci
    równorzędnej. Wyłączenie jej bez tamtych zostawia mechanizm
    niesprawny połowicznie, więc lepiej rozpatrywać trójkę razem.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: udostępniania plików zwykłą drogą, dostępu do
    udziałów, przeglądania stron, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody uses a tool of working together
    that rests upon groups.

    The place worth notice is older tools for common work upon a paper and for the holding of meetings without a
    server. After the change they will neither make a group nor join one.

    The second place is sets for the sharing of files in a small network built about the home group. The home
    group itself has been drawn back, but there are met with answers of one's own that use that mechanism still.

    I set down that this service hangs upon the two remaining services of the network of peers. The switching off
    of it without those leaves the mechanism halt by halves, so the three are better weighed together.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the sharing of files by the ordinary road, the reach of shares, the looking over of
    pages, logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Starsze narzędzia do wspólnej pracy nad dokumentem i do spotkań bez serwera nie utworzą grupy ani do niej nie dołączą
      - Własne rozwiązania do udostępniania plików budowane wokół grupy domowej przestaną działać
      - Usługa zależy od dwóch pozostałych usług sieci równorzędnej, więc lepiej rozpatrywać trójkę razem
      - Sama grupa domowa została wycofana z systemu i nie jest tu przedmiotem straty
      - Udostępnianie plików zwykłą drogą, dostęp do udziałów, przeglądanie stron, logowanie i drukowanie pozostają bez zmian
    en:
      - Older tools for common work upon a paper and for meetings without a server will neither make a group nor join one
      - Answers of one s own for the sharing of files built about the home group will cease to work
      - The service hangs upon the two remaining services of the network of peers, so the three are better weighed together
      - The home group itself has been drawn back from the system and is here nothing to be lost
      - The sharing of files by the ordinary road, the reach of shares, the looking over of pages, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Zespół pracuje nad dokumentami przez narzędzie tworzące grupę bez serwera pośredniczącego
    en:
      - A team works upon papers through a tool making a group without a server between
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'p2psvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2psvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'p2psvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-to-peer

notes:
  pl: |
    Reguła jest najbardziej widoczną częścią trójki usług sieci
    równorzędnej, bo to ona tworzy sam byt, którym grupa jest. Warto,
    żeby aplikacja pokazała to jako całość, a nie jako trzy niezależne
    punkty.

    Argument wart postawienia wprost dotyczy tego, czym grupa jest dla
    podziału sieci. Połączenia między członkami są opisane członkostwem,
    a nie regułami, więc podział sieci zbudowany na regułach po prostu
    tego nie obejmuje. Powstaje sieć wewnątrz sieci.

    Odnotowuję, że najgłośniejsze zastosowanie — grupa domowa — zostało
    wycofane z systemu. Koszt punktu jest przez to niższy, niż sugeruje
    nazwa usługi, i warto to powiedzieć wprost.
  en: |
    The rule is the plainest part of the three services of the network of peers, it being the one that makes the
    very thing a group is. It is well that the application show that as a whole and not as three items standing
    apart.

    The argument worth putting outright touches what a group is for the parting of a network. The joinings among
    members are set out by membership and not by rules, so a parting of the network built upon rules simply does
    not take it in. A network arises within the network.

    I set down that the loudest use of it - the home group - has been drawn back from the system. The item's cost
    is thereby lower than the service's name hints at, and it is well to say so outright.
