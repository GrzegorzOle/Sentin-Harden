id: win10-ldap-client-signing

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podpisywanie zapytań klienta katalogowego wymagane
    en: The signing of directory-client queries required
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna żąda podpisania zapytań kierowanych do
    katalogu domeny, zamiast wysyłać je bez ochrony.

    Katalog jest miejscem, w którym leży obraz domeny: konta, grupy,
    komputery, przynależności. Maszyna sięga tam stale — przy logowaniu,
    przy pobieraniu zasad, przy rozwiązywaniu nazw kont. Odpowiedź
    z katalogu bywa podstawą decyzji o uprawnieniach.

    Bez podpisu odpowiedź tę można po drodze zmienić. Napastnik w środku tej
    rozmowy nie musi się nigdzie logować — wystarczy, że maszyna uwierzy
    w odpowiedź spreparowaną, na przykład o przynależności konta do grupy.

    Wartość reguły jest z tego powodu inna niż przy szyfrowaniu. Nie chodzi
    o to, żeby zapytań nie dało się odczytać, tylko o to, żeby odpowiedzi
    nie dało się podmienić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podmienienia odpowiedzi katalogu, na których maszyna opiera decyzje
    o kontach i uprawnieniach.
  en: |
    The setting makes the machine ask for the signing of queries put to the domain's directory, instead of
    sending them without a guard.

    The directory is where the domain's likeness lies: accounts, groups, computers, memberships. The machine
    reaches there constantly - at logging on, at the fetching of policies, at the resolving of accounts' names.
    An answer from the directory is at times the ground of a decision about rights.

    Without a signature that answer can be changed on the way. An attacker in the middle of the conversation
    need log in nowhere - it is enough that the machine believe a made-up answer, about an account's membership
    of a group, say.

    The rule's value is for that reason other than at encryption. What is at issue is not that the queries
    should be unreadable but that the answers should not be exchangeable.

    What an attacker gains while the item goes unmet: the means of exchanging the directory's answers, upon
    which the machine grounds its decisions about accounts and rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, co jeszcze na
    tej maszynie z katalogiem rozmawia.

    Składniki systemu i oprogramowanie zarządzające podpisywanie obsługują
    od dawna. Kłopot dotyczy aplikacji branżowych z własną biblioteką
    katalogową — te bywają zbudowane na połączeniu bez ochrony i po zmianie
    zgłoszą błąd łączności z katalogiem albo brak wyników zapytania.

    Objaw bywa cichy i to jest tu rzecz najważniejsza. Aplikacja nie zawsze
    mówi o odmowie; czasem po prostu wyświetla listę pustą, bo zapytanie
    wróciło bez danych. Użytkownik odczyta to jako brak uprawnień albo brak
    rekordów, a nie jako awarię.

    Odnotowuję, że sprawdzenie przyjmuje dwie wartości: uzgadnianie podpisu
    oraz jego żądanie. Obie spełniają punkt, więc maszyna ustawiona
    surowiej nie jest przedstawiana jako niezgodna.

    Czego to nie psuje: logowania, pobierania zasad domenowych, kont
    domenowych, udziałów plikowych, drukowania, aplikacji niekorzystających
    z katalogu.
  en: |
    The class is "needs review", and the review touches what else upon this machine speaks with the directory.

    System components and management software have long served signing. The trouble touches trade applications
    with a directory library of their own - those are at times built upon a connection without a guard, and
    after the change will report an error in reaching the directory, or no results to a query.

    The symptom is at times a quiet one, and that is here the weightiest thing. The application does not always
    speak of a refusal; sometimes it simply shows an empty list, the query having come back without data. The
    user will read that as a want of rights or a want of records, not as a fault.

    I set down that the check takes two values: the negotiating of a signature and the demanding of it. Both
    meet the item, so a machine set the stricter way is not shown as failing.

    What this does not break: logging on, the fetching of domain policies, domain accounts, file shares,
    printing, or applications that do not use the directory.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Aplikacje branżowe z własną biblioteką katalogową zgłaszają błąd łączności albo brak wyników zapytania
      - Objaw bywa cichy, bo aplikacja pokazuje listę pustą zamiast komunikatu o odmowie
      - Użytkownik odczyta pustą listę jako brak uprawnień albo brak rekordów, a nie jako awarię
      - Składniki systemu i oprogramowanie zarządzające obsługują podpisywanie i zmiany nie zauważą
      - Logowanie, pobieranie zasad domenowych, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Trade applications with a directory library of their own report an error in reaching it, or no results to a query
      - The symptom is at times a quiet one, the application showing an empty list instead of a message about a refusal
      - The user will read an empty list as a want of rights or of records, not as a fault
      - System components and management software serve signing and will not notice the change
      - Logging on, the fetching of domain policies, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja łącząca się z katalogiem połączeniem bez ochrony i nie ma dla niej poprawki
      - Nie ustalono, które aplikacje na tej maszynie sięgają do katalogu domeny
    en:
      - An application joining the directory by a connection without a guard works upon this machine and has no fix
      - It has not been established which applications upon this machine reach the domain's directory
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One means negotiate signing, two means demand it. Both meet the item, so
      # the comparison takes either rather than fixing one, a machine already set
      # to the stricter of the two being no less compliant.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
      $name = 'LDAPClientIntegrity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[12]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
    $name = 'LDAPClientIntegrity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An application built upon a connection without a guard may answer with an
    # empty list rather than an error. Watch for a quiet symptom, not only for a
    # message.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LDAPClientIntegrity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-ldap-client-signing-requirements

notes:
  pl: |
    Reguła różni się od sąsiednich tym, czego broni. Pozostałe chronią
    poświadczenia; ta chroni odpowiedź, na której maszyna opiera decyzję
    o uprawnieniach. Warto, żeby opis postawił to wprost, bo inaczej punkt
    wygląda na jeszcze jedno podpisywanie.

    Odnotowuję objaw cichy, bo jest tu droższy niż awaria głośna. Lista
    pusta zamiast komunikatu o odmowie prowadzi do wniosku o braku danych,
    a nie o zerwanej łączności — i nikt nie szuka przyczyny tam, gdzie ona
    leży.

    Odnotowuję też, że sprawdzenie przyjmuje dwie wartości, bo obie punkt
    spełniają. Ustalenie jednej wartości oczekiwanej dawałoby raport,
    w którym maszyna ustawiona surowiej wygląda na niezgodną — a to jest
    błąd, który kosztuje zaufanie do narzędzia.
  en: |
    The rule parts from its neighbours in what it guards. The rest guard credentials; this guards the answer
    upon which the machine grounds a decision about rights. It is well that the description put that outright,
    or else the item looks one more signing.

    I set down the quiet symptom, that costing here more than a loud fault. An empty list instead of a message
    about a refusal leads to a conclusion about a want of data and not about a broken link - and nobody seeks
    the cause where it lies.

    I set down, too, that the check takes two values, both meeting the item. Fixing one value as the looked-for
    one would give a report in which a machine set the stricter way looks failing - and that is a mistake which
    costs a tool its trust.
