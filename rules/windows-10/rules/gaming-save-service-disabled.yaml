id: win10-gaming-save-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zapisu stanu rozgrywki poza maszyną wyłączona
    en: The service writing the state of play off the machine switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę wysyłającą zapisany stan rozgrywki poza
    maszynę, żeby dało się ją podjąć gdzie indziej.

    Jest to usługa wysyłająca dane na zewnątrz w tle, bez udziału
    użytkownika, i to jedyne, co ma tu znaczenie. Sama treść jest
    nieistotna, mechanizm nie jest.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Nie zamyka
    drogi wejścia, nie broni przed atakiem i na stanowisku roboczym
    zwykle nie ma czego wysyłać.

    Znaczenie ma to, że usługa utrzymuje kanał wychodzący do sieci
    producenta i działa w tle niezależnie od tego, czy ktokolwiek
    kiedykolwiek w cokolwiek zagrał. Wartość punktu polega na porządku
    w zestawie uruchamianych usług.

    Odnotowuję zależność: usługa ta wymaga potwierdzonej tożsamości,
    więc wyłączenie uwierzytelniania platformy zatrzymuje ją w praktyce
    i tak. Wdraża się je razem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    — kanał wychodzący działający w tle i jedną usługę więcej.
  en: |
    The setting switches off the service sending the written state of play off the machine, so that it may be
    taken up elsewhere.

    It is a service sending data abroad behind the scene, with no part taken by the user, and that alone has
    weight here. The content itself is of no moment; the mechanism is.

    The grading is low and the item is to be put forward as such. It shuts no road in, guards against no assault,
    and upon a station of work there is commonly nothing to send.

    What has weight is that the service keeps a channel going out to the maker's network and works behind the
    scene whether anybody has ever played at anything or not. The item's worth lies in good order among the set of
    services that are set going.

    I set down the hanging together: that service calls for a warranted name, so the switching off of the
    platform's warranting stops it in practice all the same. They are rolled out together.

    What an attacker gains while the item goes unmet: little - a channel going out working behind the scene and
    one service more.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć sprawdzenie jest tu najkrótsze
    w rodzinie.

    Miejscem wartym uwagi są stanowiska służące także do rozrywki, na
    których stan rozgrywki ma być dostępny na innym urządzeniu. Po
    zmianie zapis pozostanie na tej maszynie i nigdzie się nie pojawi.

    Odnotowuję, że zapis miejscowy działa dalej. Traci się wyłącznie
    przenoszenie go poza maszynę, a nie samą możliwość zapisania.

    Zastrzegam, że na stanowisku bez podłączonego konta platformy usługa
    nie ma czego wysyłać i zmiana nie robi nic widocznego — poza
    zamknięciem kanału wychodzącego działającego w tle.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: zapisu miejscowego, sieci, poczty, drukowania,
    logowania, pracy programów.
  en: |
    The class is "needs review", though the review is here the shortest of the kindred.

    The place worth notice is stations serving also for pastime, upon which the state of play is to be had at
    another device. After the change the writing will stay upon this machine and will show nowhere else.

    I set down that the writing upon the spot works on. What is lost is the carrying of it off the machine alone
    and not the power of writing it.

    I set down that upon a station with no reckoning of the platform joined on the service has nothing to send and
    the change does nothing to be seen - beyond the shutting of a channel going out that works behind the scene.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the writing upon the spot, the network, the post, printing, logging on, or the work
    of programs.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Stan rozgrywki przestanie pojawiać się na innym urządzeniu i pozostanie na tej maszynie
      - Zapis miejscowy działa dalej, więc traci się przenoszenie, a nie samą możliwość zapisania
      - Na stanowisku bez podłączonego konta platformy zmiana nie robi nic widocznego
      - Usługa i tak wymaga potwierdzonej tożsamości, więc wyłączenie uwierzytelniania platformy zatrzymuje ją w praktyce
      - Sieć, poczta, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - The state of play will cease to show at another device and will stay upon this machine
      - The writing upon the spot works on, so the carrying is lost and not the power of writing
      - Upon a station with no reckoning of the platform joined on the change does nothing to be seen
      - The service calls anyway for a warranted name, so the switching off of the platform s warranting stops it in practice
      - The network, the post, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko służy także do rozrywki, a stan rozgrywki ma być dostępny na innym urządzeniu
    en:
      - The station serves also for pastime, and the state of play is to be had at another device
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblGameSave'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblGameSave'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XblGameSave' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XblGameSave' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XblGameSave' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła jest najtańsza w rodzinie i warto, żeby aplikacja powiedziała
    to wprost zamiast szukać w niej wagi, której nie ma. Ocena jest
    niska, bo droga wejścia tu nie powstaje.

    Argument wart zachowania dotyczy mechanizmu, nie treści. Usługa
    wysyła dane na zewnątrz w tle, bez udziału użytkownika, i utrzymuje
    kanał do sieci producenta niezależnie od tego, czy ktokolwiek
    w cokolwiek zagrał.

    Odnotowuję zależność od uwierzytelniania platformy. Wyłączenie tamtej
    usługi zatrzymuje tę w praktyce, więc oba punkty wdraża się razem
    i aplikacja powinna pokazać je obok siebie.
  en: |
    The rule is the cheapest of the kindred, and it is well that the application say so outright rather than seek
    in it a weight it has not. The grading is low, no road in arising here.

    The argument worth keeping touches the mechanism and not the content. The service sends data abroad behind the
    scene, with no part taken by the user, and keeps a channel to the maker's network whether anybody has played
    at anything or not.

    I set down the hanging upon the platform's warranting. The switching off of that service stops this one in
    practice, so both items are rolled out together and the application ought to show them side by side.
