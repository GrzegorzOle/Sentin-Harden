id: win2016-bitlocker-smart-card-fixed-drives

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Karta wymagana do odblokowania dysków stałych
    en: A card required to unlock fixed drives
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga karty z certyfikatem do odblokowania zaszyfrowanego
    dysku stałego z danymi.

    Odblokowanie dysku jest w istocie pytaniem, komu oddać klucz. Wszystkie
    pozostałe odpowiedzi w tym bloku — hasło, klucz na nośniku, automatyczne
    odblokowanie przy starcie — opierają się na czymś, co leży na maszynie
    albo obok niej. Karta jest jedyną odpowiedzią, która wymaga rzeczy
    noszonej przy sobie.

    Praktyczna różnica ujawnia się w scenariuszu, przed którym całe to
    szyfrowanie ma bronić. Maszyna zabrana razem z szafą, razem z nośnikiem
    odblokowującym, razem z zapisanym gdzieś hasłem otwiera się w nowym
    miejscu. Maszyna wymagająca karty nie otwiera się, bo karta pojechała
    w kieszeni kogoś, kto został.

    Punkt niesie dwie wartości, bo dopuszczenie karty i wymaganie karty to
    dwie różne decyzje. Pierwsza bez drugiej zostawia wybór temu, kto
    szyfruje, a wybór taki wypada zwykle na wygodę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    dysków stałych przy pomocy rzeczy, które zabiera się razem z maszyną.
  en: |
    The setting requires a card holding a certificate for the unlocking of an encrypted fixed data
    drive.

    Unlocking a drive is in substance a question of whom to give the key to. All the other answers
    in this block - a password, a key on a medium, automatic unlocking at the start - rest on
    something lying on the machine or beside it. The card is the one answer calling for a thing
    carried about one's person.

    The practical difference shows in the very scenario all this encryption is to guard against. A
    machine taken along with its cabinet, along with the unlocking medium, along with a password
    written down somewhere, opens at its new place. A machine requiring a card does not open, the
    card having travelled in the pocket of somebody who stayed.

    The item carries two values, admitting a card and requiring a card being two different
    decisions. The first without the second leaves the choice to whoever encrypts, and such a
    choice falls as a rule to convenience.

    What an attacker gains while the item goes unmet: access to fixed drives by means of things
    that are taken along with the machine.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powód jest jeden i rozstrzygający
    na serwerze: karta i praca bez obsługi wykluczają się.

    Dysk stały z danymi na serwerze odblokowuje się zwykle sam, przy starcie
    maszyny, bo usługi muszą zobaczyć swoje pliki bez udziału człowieka.
    Wymaganie karty tę drogę zamyka. Maszyna wstanie, system ruszy, sieć
    zadziała — a udział sieciowy będzie pusty, baza nie znajdzie plików
    i usługa zgłosi błąd, którego przyczyna leży poza nią.

    Objaw jest szczególnie mylący dlatego, że maszyna wygląda na zdrową.
    Nie ma awarii, nie ma błędu przy starcie, dyski są widoczne w systemie.
    Brakuje tylko tego, żeby ktoś włożył kartę.

    Wdrożenie wymaga więc odpowiedzi na pytanie, kto i kiedy tę kartę
    wkłada. Na maszynie restartującej się w nocy po aktualizacjach
    odpowiedzi nie ma i punkt należy zapisać jako wyjątek.

    Drugi warunek dotyczy sprzętu i infrastruktury. Musi być czytnik, muszą
    być sterowniki, musi być wystawiony certyfikat i musi być droga wydania
    karty zastępczej, gdy ta zginie. Każdy z tych elementów potrafi być
    wąskim gardłem osobno.

    Wdrożenie nie dotyczy woluminów już zaszyfrowanych — ich sposób
    odblokowania zostaje. Wymóg działa dla tego, co szyfrowane później.

    Czego to nie psuje: pracy systemu, sieci, dostępu do dysku systemowego,
    woluminów zaszyfrowanych przed zmianą.

    Nie wymaga restartu, ale skutek ujawnia się właśnie po restarcie.
  en: |
    The class is "needs a planned rollout", and the reason is a single one and decisive on a
    server: a card and unattended working rule one another out.

    A fixed data drive on a server is as a rule unlocked by itself, at the machine's start,
    services having to see their files without a person taking part. Requiring a card shuts that
    road. The machine will come up, the system will move, the network will work - and the network
    share will be empty, the database will not find its files and the service will report an error
    whose cause lies outside it.

    The symptom is misleading above all because the machine looks healthy. There is no fault, no
    error at the start, the drives are seen in the system. What wants is only somebody putting a
    card in.

    The rollout therefore calls for an answer to the question who puts that card in and when. On a
    machine that restarts at night after updates there is no answer and the item should be recorded
    as an exception.

    The second condition concerns hardware and infrastructure. There must be a reader, there must
    be drivers, a certificate must be issued and there must be a road to issuing a replacement card
    when one is lost. Each of those elements can be a narrow place on its own.

    The rollout does not concern volumes already encrypted - their manner of unlocking stays. The
    requirement works for what is encrypted later.

    What this does not break: the system's working, the network, access to the system drive, or
    volumes encrypted before the change.

    Calls for no restart, but the consequence shows itself just after a restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - drivers-and-devices
  what_breaks:
    pl:
      - Dysk z danymi przestaje odblokowywać się sam przy starcie, więc usługi nie widzą swoich plików na maszynie, która wstała normalnie
      - Udział sieciowy bywa pusty, a baza nie znajduje plików - przyczyna leży poza usługą, która zgłasza błąd
      - Maszyna restartująca się w nocy po aktualizacjach nie ma komu podać karty
      - Brak czytnika, sterowników albo drogi wydania karty zastępczej zatrzymuje wdrożenie osobno
      - Praca systemu, sieć i woluminy zaszyfrowane przed zmianą pozostają bez zmian
    en:
      - The data drive ceases to unlock itself at the start, so services do not see their files on a machine that came up normally
      - A network share is at times empty and a database does not find its files - the cause lies outside the service that reports the error
      - A machine restarting at night after updates has nobody to give it a card
      - A want of a reader, of drivers or of a road to a replacement card stops the rollout on its own
      - The system's working, the network and volumes encrypted before the change stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna udostępnia dane bez przerwy i wolumin z danymi musi odblokowywać się sam przy starcie
      - Nie ma czytnika kart, sterowników do niego albo drogi wydania karty zastępczej po jej zgubieniu
      - Maszyna restartuje się samodzielnie po aktualizacjach i nikt nie czuwa przy niej w nocy
    en:
      - The machine serves data without a break and the data volume has to unlock itself at the start
      - There is no card reader, no drivers for it or no road to a replacement card once one is lost
      - The machine restarts by itself after updates and nobody keeps watch by it at night
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes
      # it required - admitted without required leaves the choice open and is
      # reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'FDVAllowUserCert'
        $enforce = $item.'FDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'FDVAllowUserCert'
      allow_existed   = ($null -ne $item.'FDVAllowUserCert')
      enforce         = $item.'FDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'FDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This and automatic unlocking at machine start exclude each other. On a
    # server serving data without a break the right answer is often a recorded
    # exception instead of this change; the bad rollout shows up as a service
    # that cannot see its files on a machine that came up normally.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'FDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -ErrorAction SilentlyContinue
    }
    if ($b.enforce_existed) {
      Set-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -Value $b.enforce -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest piąty w bloku i drugi — po zakazie zapisu — którego wdrożenie
    potrafi zatrzymać usługę. Różnica między nimi jest warta pokazania:
    zakaz zapisu zatrzymuje ją od razu i głośno, ten punkt dopiero po
    najbliższym restarcie i po cichu.

    Cisza jest tu treścią ostrzeżenia. Maszyna, która wstała, ma sieć i nie
    zgłasza awarii, a mimo to nie udostępnia danych, jest przypadkiem
    trudnym do rozpoznania właśnie dlatego, że nic nie wygląda na zepsute.
    Aplikacja powinna nazwać ten objaw wprost, bo powiązanie go z tą regułą
    po fakcie zajmuje godziny.

    Zapisany wyjątek jest przy tym punkcie na serwerze wynikiem częstszym
    niż wdrożenie — podobnie jak przy dodatkowym uwierzytelnieniu dysku
    systemowego. Warto pokazać te dwie reguły jako parę, bo pytanie jest
    w obu to samo: czy przy tej maszynie ktoś jest.

    Stan pośredni zgłaszany przez audyt — karta dopuszczona, ale
    niewymagana — odpowiada sytuacji, w której ktoś zaczął wdrożenie i go
    nie dokończył. Jest to stan gorszy niż brak ustawienia, bo wygląda na
    zrobiony.
  en: |
    The item is the fifth in the block and the second - after the ban on writing - whose rollout
    can stop a service. The difference between them is worth showing: the ban on writing stops it
    at once and loudly, this item only after the next restart and quietly.

    The quiet is here the substance of the warning. A machine that came up, has a network and
    reports no fault, and all the same does not serve data, is a case hard to recognise precisely
    because nothing looks broken. The application should name that symptom outright, tying it to
    this rule after the fact taking hours.

    A recorded exception is at this item on a server a commoner outcome than a rollout - as at the
    additional authentication of the system drive. The two rules are worth showing as a pair, the
    question being in both the same: is somebody at this machine.

    The middle state the audit reports - a card admitted but not required - answers a situation in
    which somebody began the rollout and did not finish it. It is a worse state than a want of a
    setting, looking as it does like a done thing.
