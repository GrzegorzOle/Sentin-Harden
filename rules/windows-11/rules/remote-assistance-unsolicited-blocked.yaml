id: win11-remote-assistance-unsolicited-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Assistance
  title:
    pl: Pomoc zdalna oferowana bez prośby użytkownika zablokowana
    en: Remote assistance offered without the user asking blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Pomoc zdalna ma dwa tryby i różnią się one tym, kto zaczyna. W trybie
    proszonym użytkownik wysyła zaproszenie i dopiero wtedy ktoś może się
    podłączyć. W trybie oferowanym połączenie zaczyna osoba z zewnątrz,
    a użytkownik dostaje pytanie, czy się zgadza.

    Punkt dotyczy tego drugiego trybu i zamyka go w całości.

    Różnica dla bezpieczeństwa leży w tym, na czym opiera się ochrona.
    W trybie proszonym wejście wymaga zaproszenia — przedmiotu, który trzeba
    zdobyć. W trybie oferowanym wymaga wyłącznie tego, żeby użytkownik kliknął
    „tak" w oknie, które pojawiło się samo, wygląda jak systemowe i mówi
    o pomocy technicznej. Jest to zabezpieczenie oparte na czujności człowieka
    w najgorszym możliwym momencie: kiedy coś nie działa, a ktoś właśnie
    proponuje, że to naprawi.

    Napastnik, który zdobył konto w domenie i trafił na listę pomocników, nie
    potrzebuje już żadnej podatności. Dzwoni, przedstawia się jako wsparcie,
    wysyła ofertę połączenia i czeka na kliknięcie. Droga wygląda zwyczajnie,
    bo zwyczajna jest.

    Tryb proszony zostaje nietknięty i dalej działa.
  en: |
    Remote assistance has two modes and they differ in who begins. In the solicited
    mode the user sends an invitation and only then can somebody connect. In the
    offered mode the connection is begun by a person outside, and the user gets a
    question asking whether they agree.

    The item concerns the second mode and closes it entirely.

    The difference for security lies in what the protection rests on. In the
    solicited mode getting in requires an invitation - an object that has to be
    obtained. In the offered mode it requires only that the user click "yes" in a
    window that appeared by itself, looks like a system one and speaks of technical
    support. It is a safeguard resting on a person's alertness at the worst possible
    moment: when something is not working and somebody is just offering to fix it.

    An attacker who has gained a domain account and made it onto the helpers' list
    needs no vulnerability at all. They telephone, introduce themselves as support,
    send an offer to connect and wait for the click. The route looks ordinary,
    because ordinary is what it is.

    The solicited mode stays untouched and carries on working.

disruption_description:
  pl: |
    Nic nie przestaje działać tam, gdzie pomoc zdalna nie była używana w trybie
    oferowanym — a nie jest to tryb domyślny i trzeba go było kiedyś włączyć
    zasadą.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego, użytkownik nie zauważy niczego.

    Odczuwalny jest wyłącznie tam, gdzie dział wsparcia podłącza się do
    stanowisk z własnej inicjatywy. Taki sposób pracy przestanie być możliwy
    i trzeba go zastąpić: albo zaproszeniem wysyłanym przez użytkownika, albo
    osobnym narzędziem do zdalnego dostępu. Objawem po stronie wspierającego
    jest błąd przy próbie zaoferowania pomocy, a nie brak reakcji użytkownika,
    więc przyczyna jest widoczna od razu.

    Pomoc zdalna na zaproszenie działa bez zmian — jest to osobne ustawienie
    i osobny punkt benchmarku.

    Nie ma restartu.
  en: |
    Nothing stops working where remote assistance was not used in the offered mode -
    and that is not the default mode; it had to be switched on by policy at some
    point.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and the user notices nothing.

    It is felt only where the support desk connects to stations on its own
    initiative. That way of working stops being possible and has to be replaced:
    either by an invitation sent by the user, or by a separate remote access tool.
    The symptom on the helper's side is an error when trying to offer assistance,
    rather than no response from the user, so the cause is visible at once.

    Remote assistance by invitation works unchanged - it is a separate setting and a
    separate item of the benchmark.

    There is no restart.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Dział wsparcia przestanie móc zaoferować połączenie do stanowiska z własnej inicjatywy
      - Lista pomocników zdefiniowana zasadą przestanie mieć zastosowanie do połączeń oferowanych
      - Pomoc zdalna na zaproszenie wysłane przez użytkownika działa dalej bez zmian
    en:
      - The support desk loses the ability to offer a connection to a station on its own initiative
      - A helpers' list defined by policy stops applying to offered connections
      - Remote assistance by an invitation sent by the user carries on unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dział wsparcia podłącza się do stanowisk z własnej inicjatywy i nie ma zamiennika
    en:
      - The support desk connects to stations on its own initiative and has no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fAllowUnsolicited'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fAllowUnsolicited'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fAllowUnsolicited' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/remote-desktop-services-overview

notes:
  pl: |
    Reguła czyta gałąź zasad, a reguła bliźniacza dotycząca pomocy na
    zaproszenie czyta gałąź stanu bieżącego. Nie jest to niekonsekwencja:
    ustawienie trybu oferowanego istnieje wyłącznie jako zasada i poza nią nie
    ma odpowiednika, który dałoby się odczytać.

    Wycofanie nie usuwa gałęzi. Jest ona wspólna z ustawieniami pulpitu
    zdalnego i jej usunięcie cofnęłoby kilkanaście niezwiązanych wpisów.

    Punkt nie wyłącza samej usługi pomocy zdalnej ani nie zmienia listy
    pomocników. Zamyka jeden z dwóch sposobów rozpoczęcia sesji — ten, w którym
    inicjatywa jest po stronie łączącego się.
  en: |
    The rule reads the policies key, while its twin concerning assistance by
    invitation reads the current state's key. That is no inconsistency: the offered
    mode's setting exists only as a policy and has no counterpart outside it that
    could be read.

    Rollback does not remove the key. It is shared with the remote desktop settings
    and removing it would undo a dozen unrelated entries.

    The item does not switch the remote assistance service off and does not change
    the helpers' list. It closes one of two ways of beginning a session - the one
    where the initiative lies with whoever is connecting.
