id: win2025-powershell-script-block-logging

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows PowerShell
  title:
    pl: Rejestrowanie bloków skryptu PowerShell włączone
    en: PowerShell script block logging enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza zapisywanie w dzienniku treści bloków skryptu
    wykonywanych przez interpreter poleceń.

    Zostawiam kategorię średnią, konsekwentnie do dwóch poprzednich
    punktów o rejestrowaniu, ale chcę powiedzieć, czym ten zapis różni
    się od zapisu wiersza polecenia, bo różnica jest istotna i akurat
    tutaj działa na korzyść.

    Wiersz polecenia pokazuje, co komuś kazano wykonać. Blok skryptu
    pokazuje, co faktycznie zostało wykonane — a to bywa czymś innym.
    Interpreter zapisuje treść bloku w postaci, w jakiej sam ją widzi,
    czyli po rozwinięciu zmiennych i po odwróceniu zabiegów, którymi
    treść ukryto. Znaczy to, że polecenie przekazane jako ciąg
    zakodowany, który w wierszu polecenia wygląda na bezsensowny napis,
    w tym dzienniku pojawia się jako czytelny skrypt.

    Na serwerze ma to wagę większą niż gdzie indziej z prostego powodu:
    serwer jest maszyną, na której skrypty uruchamiają się same,
    z harmonogramu i z narzędzi zarządzania, bez nikogo przy klawiaturze.
    Jest to środowisko, w którym jeden skrypt więcej nie zwraca niczyjej
    uwagi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wykonywania poleceń w postaci, której nie widać w żadnym zapisie —
    bo zakodowany ciąg w wierszu polecenia niczego nie zdradza, a bez
    tego punktu nie powstaje nic poza nim.
  en: |
    The item switches on the writing down in the log of what is in the blocks of script run by the
    reader of biddings.

    I leave the category middling, in keeping with the two items upon writing before it, but would say
    wherein that writing is unlike the writing of the line of bidding, the unlikeness being weighty and
    here of all places telling in its favour.

    The line of bidding shows what somebody was bidden to do. The block of script shows what was truly
    done - and that is at times another thing. The reader writes down what is in the block in the shape
    wherein it sees it itself, that is, after the unfolding of the shifting worths and after the
    turning back of the crafts whereby the substance was hidden. That means a bidding given over as a
    written-over string, which in the line of bidding looks like a senseless scrawl, comes forth in
    that log as a readable script.

    Upon a server this weighs more than elsewhere for a plain ground - a server is a machine whereon
    scripts run of themselves, off a timetable and out of the tools of ruling, with nobody at the keys.
    It is a setting wherein one script more draws nobody's heed.

    What an attacker gains while the item goes unmet - the might of running biddings in a shape that is
    seen in no writing at all, a written-over string in the line of bidding betraying nothing and
    nothing beyond it rising without that item.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i nie podnoszę jej, choć przy
    sąsiednich punktach tej grupy podniosłem. Powód rozdzielenia jest
    konkretny.

    Zapis bloków skryptu idzie do dziennika operacyjnego interpretera,
    czyli do miejsca, które ma własny, z góry ustalony rozmiar
    i nadpisuje się samo. Nie rośnie więc w nieskończoność i nie zajmuje
    dysku ponad to, co mu wyznaczono. Najgorsze, co może się stać, to
    że na maszynie z dużą automatyzacją dziennik ten zacznie się
    zawijać w godzinach — czyli wróci pytanie o okres, które opisałem
    przy rozmiarach dzienników.

    Sprawdzić trzeba dwie rzeczy. Po pierwsze, ile skryptów ta maszyna
    wykonuje w ciągu doby, bo to rozstrzyga, czy wynik będzie użyteczny.
    Po drugie — i jest to ta sama uwaga co przy wierszu polecenia —
    czy w uruchamianych tu skryptach nie ma wpisanych haseł i kluczy,
    bo one także trafią do dziennika, i to w postaci czytelnej.
    W skryptach starszych i pisanych na własne potrzeby bywa to regułą,
    a nie wyjątkiem.

    Wydajność nie jest tu argumentem i nie chcę, żeby ktoś odpuścił ten
    punkt z tego powodu. Koszt zapisu bloku jest znikomy wobec kosztu
    wykonania samego skryptu.

    Zmiana nie wymaga przerwy. Cofa się natychmiast, ale nowe sesje
    interpretera muszą powstać po zmianie, żeby ją odczuły.
  en: |
    I leave the class "needs a looking into" and raise it not, though at the items beside it in this
    band I did. The ground of the sundering is a set one.

    The writing of blocks of script goes into the working log of the reader, that is, into a stead that
    has a size of its own, set beforehand, and writes itself over of itself. It grows therefore not
    without end and takes no disk beyond what was meted to it. The worst that may befall is that upon a
    machine with much doing-by-itself that log will begin to wrap about within hours - that is, there
    comes back the question of the span whereof I wrote at the sizes of logs.

    Two things must be looked into. First, how many scripts that machine runs within a day, that
    settling whether the outcome will be of use. Second - and it is the same note as at the line of
    bidding - whether in the scripts run here there be no watchwords and keys written in, for those too
    will come into the log, and in a readable shape. In scripts that are older and written for one's own
    needs that is at times the rule and no outtake.

    Speed is here no ground and I would not have anybody let that item be for it. The cost of the
    writing of a block is as nothing against the cost of the running of the script itself.

    The change takes no break. It is undone at once, but new sessions of the reader must rise after the
    change to feel it.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - Hasła i klucze wpisane w uruchamianych skryptach trafiają do dziennika w postaci czytelnej
      - Na maszynie z dużą automatyzacją dziennik operacyjny interpretera zaczyna zawijać się w godzinach
      - Dziennik ma własny, z góry ustalony rozmiar, więc nie rośnie w nieskończoność i nie zajmuje dysku ponad wyznaczone
      - Sesje interpretera istniejące przed zmianą nie odczuwają jej, dopiero nowe zaczynają zapisywać
    en:
      - Watchwords and keys written into the scripts run here come into the log in a readable shape
      - Upon a machine with much doing-by-itself the working log of the reader begins to wrap about within hours
      - The log has a size of its own, set beforehand, so it grows not without end and takes no disk beyond what was meted
      - Sessions of the reader living before the change feel it not; only new ones begin to write
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W skryptach uruchamianych na tej maszynie wpisane są hasła lub klucze i nie zaplanowano ich usunięcia
    en:
      - In the scripts run upon that machine there are watchwords or keys written in and no doing away with them was planned
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
      $name = 'EnableScriptBlockLogging'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
    $name = 'EnableScriptBlockLogging'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This records what was actually run, after variables are expanded and
    # hiding is undone. Check first whether scripts on this machine carry
    # passwords or keys - those will be recorded in readable form too.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableScriptBlockLogging' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_logging_windows

notes:
  pl: |
    Wiersz polecenia pokazuje, co komuś kazano wykonać. Blok skryptu
    pokazuje, co faktycznie zostało wykonane — po rozwinięciu zmiennych
    i po odwróceniu zabiegów, którymi treść ukryto. Zakodowany ciąg,
    który w wierszu polecenia wygląda na bezsensowny napis, pojawia się
    tu jako czytelny skrypt.

    Na serwerze waży to więcej, bo skrypty uruchamiają się same,
    z harmonogramu i z narzędzi zarządzania — jeden skrypt więcej nie
    zwraca niczyjej uwagi.

    Klasy nie podnoszę, w odróżnieniu od sąsiednich punktów: zapis idzie
    do dziennika o z góry ustalonym rozmiarze, więc nie rośnie
    w nieskończoność. Wydajność nie jest argumentem — koszt zapisu bloku
    jest znikomy wobec kosztu wykonania skryptu.
  en: |
    The line of bidding shows what somebody was bidden to do. The block of script shows what was truly
    done - after the unfolding of shifting worths and the turning back of the crafts whereby the
    substance was hidden. A written-over string that in the line of bidding looks like a senseless
    scrawl comes forth here as a readable script.

    Upon a server this weighs more, scripts running of themselves off a timetable and out of the tools
    of ruling - one script more draws nobody's heed.

    I raise not the class, unlike at the items beside it - the writing goes into a log of a size set
    beforehand, so it grows not without end. Speed is no ground - the cost of the writing of a block is
    as nothing against the cost of the running of the script.
