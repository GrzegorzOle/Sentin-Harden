id: win2016-safe-dll-search-mode

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Bezpieczna kolejność wyszukiwania bibliotek włączona
    en: The safe order of searching for libraries switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zmienia kolejność, w jakiej system szuka bibliotek
    potrzebnych uruchamianemu programowi.

    Program rzadko zawiera wszystko, czego potrzebuje. Brakujące części
    dobiera z bibliotek, a te wskazuje zwykle samą nazwą, bez ścieżki.
    System musi wtedy nazwę tę odszukać i robi to, przeglądając katalogi
    w ustalonej kolejności.

    Cała rzecz sprowadza się do miejsca, w którym w tej kolejności stoi
    katalog bieżący. Przy kolejności niebezpiecznej stoi wysoko — przed
    katalogami systemowymi. Znaczy to, że plik o właściwej nazwie
    podłożony w katalogu, z którego program został uruchomiony, zostanie
    wzięty zamiast biblioteki systemowej.

    Droga jest wygodna, bo nie wymaga żadnych uprawnień poza zapisem do
    jednego katalogu. Katalogiem takim bywa katalog pobrań, katalog
    tymczasowy albo udział sieciowy, z którego ktoś uruchamia narzędzie.
    Kod wykonuje się wtedy z uprawnieniami tego programu, a jeżeli program
    działa jako usługa — z uprawnieniami usługi.

    Kolejność bezpieczna przesuwa katalog bieżący za katalogi systemowe.
    Podłożony plik zostaje wtedy znaleziony dopiero wtedy, gdy biblioteki
    o tej nazwie nie ma w systemie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    własnego kodu w cudzym programie przy użyciu samego zapisu pliku do
    katalogu, z którego ten program jest uruchamiany.
  en: |
    The setting changes the order in which the system looks for libraries a started
    program needs.

    A program seldom holds everything it needs. The missing parts it takes from
    libraries, and it names those as a rule by name alone, without a path. The system
    then has to find that name, and does so by going through folders in a set order.

    The whole matter comes down to the place the current folder holds in that order.
    In the unsafe order it stands high - before the system folders. That means a file
    of the right name laid in the folder the program was started from will be taken
    instead of the system library.

    The road is convenient, calling for no rights beyond writing to one folder. Such
    a folder is at times a downloads folder, a temporary folder, or a network share
    somebody runs a tool from. The code then runs with that program's rights, and
    where the program works as a service - with the service's rights.

    The safe order moves the current folder behind the system folders. A laid file is
    then found only where no library of that name is in the system.

    What an attacker gains while the item goes unmet: the running of their own code
    inside somebody else's program, using nothing but the writing of a file into the
    folder that program is started from.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na maszynie pracuje
    oprogramowanie, które na starej kolejności polega.

    Wartość wymagana jest wartością domyślną od wielu wydań systemu, więc
    na przeważającej części maszyn wdrożenie niczego nie zmienia. Rzecz
    dotyczy maszyn, na których wpis został kiedyś przestawiony — a robi się
    to prawie zawsze z jednego powodu: żeby zadziałała stara aplikacja.

    Aplikacje takie istnieją i są rozpoznawalne. Zwykle trzymają swoje
    biblioteki obok pliku wykonywalnego i polegają na tym, że zostaną one
    znalezione przed systemowymi, bo noszą tę samą nazwę co biblioteka
    systemowa. Po wdrożeniu wzięta zostanie systemowa i aplikacja albo
    przestanie działać, albo zacznie działać inaczej.

    To drugie jest gorsze i warto o tym uprzedzić. Aplikacja, która
    zamiast swojej biblioteki dostała systemową o tej samej nazwie, potrafi
    uruchomić się i pracować z błędami trudnymi do powiązania ze zmianą.

    Zmiana wymaga restartu, bo kolejność ustalana jest przy starcie
    systemu. Do czasu restartu raport pokaże zgodność, a system będzie
    pracował po staremu.

    Czego to nie psuje: pracy z plikami, sieci, logowania, usług
    systemowych.
  en: |
    The class is "needs review", and what has to be checked is whether software
    relying on the old order works on the machine.

    The required value has been the default for many releases of the system, so on
    the greater part of machines the rollout changes nothing. The matter concerns
    machines where the entry was once moved - and that is done almost always for one
    reason: to make an old application work.

    Such applications exist and are recognisable. As a rule they keep their libraries
    beside the executable file and rely on those being found before the system ones,
    bearing as they do the same name as a system library. After the rollout the
    system one will be taken and the application will either stop working or begin to
    work differently.

    The latter is the worse, and it is worth forewarning. An application that got a
    system library of the same name instead of its own can start and work with errors
    hard to tie to the change.

    The change calls for a restart, the order being settled as the system starts.
    Until the restart the report will show compliance and the system will work in the
    old way.

    What this does not break: work with files, the network, signing in, or system
    services.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Stara aplikacja trzymająca własne biblioteki obok pliku wykonywalnego może przestać działać, bo wzięta zostanie biblioteka systemowa o tej samej nazwie
      - Gorszy wariant jest taki, że aplikacja uruchomi się i będzie pracowała z błędami trudnymi do powiązania ze zmianą
      - Do czasu restartu raport pokaże zgodność, a system będzie pracował po staremu
      - Praca z plikami, sieć, logowanie i usługi systemowe pozostają bez zmian
    en:
      - An old application keeping its own libraries beside the executable file may stop working, a system library of the same name being taken
      - The worse variant is that the application starts and works with errors hard to tie to the change
      - Until the restart the report will show compliance and the system will work in the old way
      - Work with files, the network, signing in and system services stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Wpis został kiedyś przestawiony po to, żeby zadziałała aplikacja, której nie da się zastąpić ani zaktualizować
      - Nie da się wyznaczyć okna na restart maszyny, a bez restartu zmiana i tak nie zacznie obowiązywać
    en:
      - The entry was once moved to make an application work that cannot be replaced or updated
      - No window can be set for restarting the machine, and without a restart the change will not begin to hold anyway
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
      $name = 'SafeDllSearchMode'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    $name = 'SafeDllSearchMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SafeDllSearchMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/dlls/dynamic-link-library-search-order

notes:
  pl: |
    Punkt jest w tym bloku pokrewny regule o utwardzonych ścieżkach, choć
    leży w zupełnie innym miejscu zasad. Obie dotyczą tego samego pytania:
    skąd bierze się kod, który maszyna wykonuje. Tamta pilnuje kodu
    przychodzącego z sieci, ta kodu leżącego obok pliku uruchamianego.

    Warto zaznaczyć, czego punkt nie robi. Nie broni przed podłożeniem
    biblioteki w katalogu systemowym — tam decyduje o tym zapis do
    katalogu, a nie kolejność wyszukiwania. Nie broni też przed programem,
    który wskazuje bibliotekę pełną ścieżką i wskazuje ją źle.

    Rozbieżność między raportem a stanem faktycznym do czasu restartu
    występuje w tym zestawie kilkakrotnie i warto ją pokazywać jednolicie.
    Zgodność zapisana nie jest zgodnością działającą, dopóki maszyna nie
    wystartuje ponownie.
  en: |
    The item is in this block akin to the rule about hardened paths, though it lies
    in a wholly different place in the policies. Both concern the same question:
    where the code the machine runs comes from. That one sees to code arriving from
    the network, this one to code lying beside the started file.

    Worth marking what the item does not do. It does not guard against a library laid
    in a system folder - there what settles the matter is the right to write to the
    folder, not the search order. Nor does it guard against a program that names a
    library by a full path and names it wrongly.

    The discrepancy between the report and the actual state until a restart occurs
    several times in this set and is worth showing uniformly. Compliance written down
    is not compliance working, until the machine has started again.
