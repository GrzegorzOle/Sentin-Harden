id: win2016-geolocation-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa ustalania położenia wyłączona
    en: The service determining the machine's whereabouts disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa ustala, gdzie maszyna się znajduje, i udostępnia tę informację
    aplikacjom, które o nią pytają.

    Położenie ustala się bez odbiornika satelitarnego, którego serwer nie
    ma. Wystarczą dane pośrednie: adres, z którego maszyna wychodzi do
    sieci, oraz — na sprzęcie, który to potrafi — nazwy widocznych sieci
    bezprzewodowych. Zestawienie ich z bazą prowadzoną poza organizacją
    daje położenie z dokładnością, która na serwerze nie jest nikomu
    potrzebna, a bywa zaskakująco dobra.

    Rzecz, która czyni ten punkt wartym uwagi mimo niskiej kategorii,
    dotyczy kierunku przepływu. Ustalenie położenia wymaga wysłania danych
    na zewnątrz i otrzymania odpowiedzi. Serwer, który pyta o swoje
    położenie, mówi o sobie komuś, kto nie jest stroną żadnej umowy.

    Zastosowania serwerowego dla tej informacji nie ma. Nic na serwerze nie
    pyta, gdzie serwer stoi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio — natomiast maszyna sama z siebie wysyła na zewnątrz dane
    pozwalające ustalić, gdzie stoi.
  en: |
    The service establishes where the machine is and gives that knowledge to applications
    that ask for it.

    The whereabouts are established without a satellite receiver, which a server has not.
    Indirect data suffice: the address from which the machine goes out to the network and -
    on hardware able to do so - the names of the wireless networks in sight. Setting those
    against a base kept outside the organisation yields a position of an accuracy nobody
    needs on a server and which is at times surprisingly good.

    What makes this item worth attention despite the low category concerns the direction of
    flow. Establishing whereabouts calls for data to be sent outward and an answer
    received. A server that asks after its own whereabouts speaks of itself to somebody who
    is party to no agreement.

    There is no server use for that knowledge. Nothing on a server asks where the server
    stands.

    What an attacker gains while the item goes unmet: little directly - the machine,
    however, sends outward of its own accord the data by which its standing place may be
    established.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Nic na serwerze o położenie nie pyta. Aplikacje serwerowe nie mają do
    tej informacji zastosowania, a strefa czasowa i ustawienia regionalne
    biorą się skądinąd i wyłączenie usługi ich nie dotyka. Jest to warte
    powiedzenia, bo bywa mylone.

    Usługa jest przy tym często wyłączona już zasadą grupy albo
    ustawieniami prywatności, a mimo to uruchamiana. Wyłączenie jej na
    poziomie usługi domyka sprawę niezależnie od tego, jak zasada jest
    skonfigurowana.

    Nie ma znanych regresji.

    Czego to nie psuje: strefy czasowej, ustawień regionalnych, synchronizacji
    czasu, usług, sieci, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "no disruption".

    Nothing on a server asks after whereabouts. Server applications have no use for that
    knowledge, and the time zone and regional settings come from elsewhere and are not
    touched by switching the service off. That is worth saying, being at times confused.

    The service is besides often already switched off by a group policy or by the privacy
    settings, and started for all that. Switching it off at the service level shuts the
    matter whatever the policy's configuration.

    There are no known regressions.

    What this does not break: the time zone, regional settings, time synchronisation,
    services, the network, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Nic na serwerze o położenie nie pyta, więc wyłączenie nie odbiera żadnej funkcji
      - Strefa czasowa i ustawienia regionalne biorą się skądinąd i pozostają bez zmian, choć bywa to mylone
      - Synchronizacja czasu działa dalej i nie ma z tą usługą nic wspólnego
      - Usługi, sieć i uwierzytelnianie pozostają bez zmian
    en:
      - Nothing on a server asks after whereabouts, so switching it off takes away no feature
      - The time zone and regional settings come from elsewhere and stay unchanged, though that is at times confused
      - Time synchronisation works on and has nothing to do with this service
      - Services, the network and authentication stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja branżowa wymagająca znajomości położenia urządzenia
    en:
      - A line-of-business application calling for the device's whereabouts to be known works on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'lfsvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Nothing on a server asks where it is. The service answers a question that
    # is not put here.
    Stop-Service -Name 'lfsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lfsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'lfsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-windows-11-endpoints

notes:
  pl: |
    Punkt należy do tej części bloku, w której wartość leży nie w zamknięciu
    drogi, tylko w powstrzymaniu maszyny od mówienia o sobie na zewnątrz.
    Warto to nazwać, bo uzasadnienie brzmi inaczej niż przy regułach
    o powierzchni ataku i czytelnik ma prawo go nie rozpoznać.

    Pomylenie tej usługi ze strefą czasową zdarza się dość często, żeby
    wymienić je w opisie wprost. Administrator, który obawia się, że serwer
    przestanie znać godzinę, odpuści punkt z powodu, który nie istnieje —
    a punkt jest darmowy i idzie hurtem.

    Warto też odnotować rozdźwięk między zasadą a usługą. Ustawienie
    w zasadzie grupy zabrania korzystać z położenia, ale nie zatrzymuje
    usługi. Wyłączenie usługi zatrzymuje ją niezależnie od zasady. Są to
    dwa różne stany i raport powinien je rozróżniać, zamiast sklejać
    w jedno „wyłączone".
  en: |
    The item belongs to that part of the block where the worth lies not in shutting a road
    but in keeping the machine from speaking of itself outward. That is worth naming, the
    warrant sounding otherwise than at rules about the surface of attack, and the reader has
    every right not to recognise it.

    Confusing this service with the time zone happens often enough to name it in the
    description outright. An administrator who fears the server will stop knowing the hour
    will let the item go for a reason that does not exist - and the item is free and goes in
    bulk.

    Worth noting too the discord between the policy and the service. A group policy setting
    forbids whereabouts to be used but does not stop the service. Switching the service off
    stops it whatever the policy. They are two different states and the report should tell
    them apart rather than gluing them into one "switched off".
