id: win2025-uac-secure-desktop

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Potwierdzenie uprawnień na osobnym, chronionym pulpicie
    en: Confirmation of rights on a separate, protected desktop
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga dwóch rzeczy naraz: żeby podniesienie uprawnień w ogóle
    wymagało potwierdzenia oraz żeby to potwierdzenie pojawiało się na
    osobnym pulpicie, do którego zwykłe programy nie mają dostępu.

    Oba warunki są potrzebne i żaden bez drugiego nie wystarcza. Samo
    pytanie, zadane na zwykłym pulpicie, może zostać obsłużone przez
    program: okno da się przykryć, przycisk kliknąć, a treść podmienić tak,
    żeby użytkownik potwierdził co innego, niż myśli. Osobny pulpit odcina
    tę możliwość, bo w chwili pytania żaden inny program nic na ekranie nie
    robi.

    Wariant, w którym uprawnienia podnoszą się bez pytania, jest tu
    traktowany jako niespełnienie punktu niezależnie od ustawienia pulpitu —
    potwierdzenie, którego nie ma, nie potrzebuje ochrony.

    Na serwerze scenariusz wygląda inaczej niż na stanowisku roboczym.
    Potwierdzeń jest mało, bo mało kto siedzi przy konsoli — ale każde
    z nich dotyczy czynności administracyjnej na maszynie, na której
    wszystko jest administracyjne. Podstawione potwierdzenie nie prowadzi
    tu do zainstalowania niechcianego programu, tylko do zmiany
    konfiguracji serwera.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    doprowadzenia do podniesienia uprawnień ręką osoby, która przy tej
    konsoli pracuje, bez jej wiedzy o tym, co właśnie zatwierdziła.
  en: |
    The item takes two things at once: that a raising of rights take a confirmation at all,
    and that the confirmation appear on a separate desktop to which ordinary programs have
    no access.

    Both conditions are needed and neither is enough without the other. The question alone,
    asked on an ordinary desktop, can be handled by a program: the window can be covered,
    the button clicked, and the contents swapped so that the user confirms something other
    than they think. A separate desktop cuts that possibility off, since at the moment of
    the question no other program is doing anything on the screen.

    The variant in which rights are raised without asking is here held a non-meeting of the
    item whatever the desktop setting - a confirmation that is not there needs no
    protection.

    On a server the scenario looks other than at a working station. Confirmations are few,
    since few sit at the console - but each of them concerns an administrative doing on a
    machine on which everything is administrative. A planted confirmation leads here not to
    an unwanted program being installed but to a change of the server's configuration.

    What an attacker gains while the item goes unmet: the means of bringing about a raising
    of rights by the hand of the person working at that console, without their knowing what
    they have just approved.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy do serwera sięga się narzędziem zdalnym,
    które osobnego pulpitu nie pokaże.

    Ograniczenie jest z natury tego mechanizmu: osobny pulpit jest osobny
    także dla oprogramowania przechwytującego obraz ekranu. Narzędzia
    pomocy zdalnej i część rozwiązań do zdalnej obsługi pokazują wtedy
    ekran czarny albo zamrożony — pytanie jest zadane, ale operator go nie
    widzi. Praca przez taki kanał zatrzymuje się na czymś, co po drugiej
    stronie wygląda na zawieszenie.

    Pulpit zdalny obsługuje ten mechanizm poprawnie i po jego stronie nie
    zmienia się nic.

    Skutek drugi dotyczy pracy bez udziału człowieka. Potwierdzenia nie ma
    kto kliknąć, więc czynność wymagająca podniesienia uprawnień
    w sesji nieinteraktywnej po prostu się nie uda. Ustawienia nie należy
    z tego powodu zmieniać — właściwą drogą jest uruchamianie takich
    czynności na koncie, które ma uprawnienia od początku.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether the server is reached by a remote tool that will not show
    a separate desktop.

    The limit follows from the mechanism's nature: a separate desktop is separate for
    software capturing the screen's image as well. Remote help tools and some remote support
    solutions then show a black or frozen screen - the question is asked but the operator
    does not see it. Work through such a channel halts at something that on the other side
    looks like a hang.

    The remote desktop serves this mechanism properly and on its side nothing changes.

    The second effect concerns work without a person's part. There is nobody to click the
    confirmation, so a doing taking a raising of rights in a non-interactive session will
    simply not succeed. The setting ought not to be changed on that account - the right road
    is to run such doings on an account that has the rights from the start.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-management
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia pomocy zdalnej przechwytujące ekran pokazują czarny obraz zamiast pytania
      - Operator po drugiej stronie widzi coś, co wygląda na zawieszenie sesji
      - Czynności wymagające podniesienia uprawnień w sesji bez człowieka nie udają się
      - Pulpit zdalny obsługuje mechanizm poprawnie i działa bez zmiany
    en:
      - Remote help tools capturing the screen show a black image rather than the question
      - The operator on the other side sees something that looks like a hung session
      - Doings taking a raising of rights in a session with no person do not succeed
      - The remote desktop serves the mechanism properly and works unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer jest obsługiwany narzędziem pomocy zdalnej nieumiejącym pokazać osobnego pulpitu
    en:
      - The server is worked through a remote help tool unable to show a separate desktop
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $secure = $item.PromptOnSecureDesktop
      $behaviour = $item.ConsentPromptBehaviorAdmin
      if ($null -eq $secure -or $null -eq $behaviour) { 'MISSING' }
      elseif ([int]$secure -eq 1 -and [int]$behaviour -ne 0) { 'PROMPT_ON_SECURE_DESKTOP' }
      else { 'SECURE=' + $secure + ' BEHAVIOUR=' + $behaviour }
    } catch {
      'CHECK_ERROR'
    }
  expected: PROMPT_ON_SECURE_DESKTOP
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path             = $path
      secure           = $item.PromptOnSecureDesktop
      behaviour        = $item.ConsentPromptBehaviorAdmin
      secure_existed   = ($null -ne $item.PromptOnSecureDesktop)
      behaviour_existed = ($null -ne $item.ConsentPromptBehaviorAdmin)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PromptOnSecureDesktop' -Value 1 -Type DWord
    # Two asks for agreement without taking a password. Where the console is
    # reached by more than one person, asking for the password is the stronger
    # choice and meets the item as well.
    Set-ItemProperty -Path $path -Name 'ConsentPromptBehaviorAdmin' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.secure_existed) {
      Set-ItemProperty -Path $b.path -Name 'PromptOnSecureDesktop' -Value $b.secure -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'PromptOnSecureDesktop' -ErrorAction SilentlyContinue
    }
    if ($b.behaviour_existed) {
      Set-ItemProperty -Path $b.path -Name 'ConsentPromptBehaviorAdmin' -Value $b.behaviour -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ConsentPromptBehaviorAdmin' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-switch-to-the-secure-desktop-when-prompting-for-elevation

notes:
  pl: |
    Sprawdzenie czyta dwie wartości naraz i zwraca wynik złożony, bo
    ochrona wynika z ich zestawienia, nie z żadnej z osobna. Wynik
    „SECURE=… BEHAVIOUR=…" podaje obie wartości wprost, żeby dało się
    zobaczyć, która z nich nie pasuje.

    Wartość zerowa zachowania oznacza podnoszenie uprawnień bez pytania
    i jest uznana za niespełnienie niezależnie od ustawienia pulpitu.
    Potwierdzenia, którego nie ma, nie da się chronić.

    Naprawa zapisuje zgodę bez pytania o hasło. Wariant z hasłem jest
    ostrzejszy i punkt spełnia tak samo — na serwerze, do którego konsoli
    sięga więcej niż jedna osoba, jest wyborem lepszym i warto go wpisać
    ręcznie przez tryb „Kopiuj".

    Punkt ma sens wyłącznie przy włączonej kontroli uprawnień. Przy
    wyłączonej opisuje mechanizm, którego nie ma.
  en: |
    The check reads two values at once and returns a composite result, since the protection
    follows from setting them side by side rather than from either apart. The result
    "SECURE=… BEHAVIOUR=…" gives both values outright, so that it can be seen which of them
    does not fit.

    A zero behaviour value means rights being raised without asking and is held a
    non-meeting whatever the desktop setting. A confirmation that is not there cannot be
    guarded.

    The remedy writes agreement without asking for a password. The variant with a password
    is sharper and meets the item just as well - on a server whose console is reached by
    more than one person it is the better choice and is worth typing in by hand through the
    "Copy" mode.

    The item makes sense only with the control of rights switched on. With it off it
    describes a mechanism that is not there.
