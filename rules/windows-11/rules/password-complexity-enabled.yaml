id: win11-password-complexity-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Wymagania złożoności hasła włączone
    en: Password complexity requirements enabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Złożoność robi mniej, niż się jej przypisuje, ale robi dwie rzeczy, których
    nie robi sama długość. Blokuje hasło zawierające nazwę konta — czyli
    dokładnie to, czego atakujący próbuje najpierw i co przy kilkuset kontach
    trafia się zawsze. I wymusza użycie więcej niż jednej grupy znaków, co
    wyklucza hasła złożone wyłącznie z małych liter, łamane najszybciej ze
    wszystkich.

    Traktuj ten punkt jako dolną granicę, nie jako zabezpieczenie. Realny koszt
    złamania buduje długość; złożoność odcina jedynie najgorsze przypadki,
    których żadna inna reguła nie wyłapie.
  en: |
    Complexity does less than it is credited with, but it does two things length
    alone does not. It rejects a password containing the account name - exactly
    what an attacker tries first and what, across a few hundred accounts, always
    turns up. And it forces more than one character group, which rules out
    passwords made solely of lowercase letters, the fastest of all to crack.

    Treat this item as a floor, not as a safeguard. The real cost of cracking is
    built by length; complexity merely cuts off the worst cases, which no other
    rule catches.

disruption_description:
  pl: |
    Tak jak minimalna długość, ustawienie nie rusza haseł już ustawionych —
    zadziała przy najbliższej zmianie. Skutek odczuje więc każdy użytkownik,
    ale nie tego samego dnia, co utrudnia powiązanie zgłoszenia ze zmianą.

    Druga rzecz to konta oprogramowania. Hasła generowane przez skrypt albo
    wpisane w konfiguracji instalatora potrafią nie spełniać wymagań — wtedy
    utworzenie konta albo zmiana jego hasła kończy się błędem, którego treść
    rzadko wskazuje na politykę haseł.
  en: |
    Like the minimum length, the setting does not touch passwords already in
    place - it applies at the next change. Every user therefore feels it, but
    not on the same day, which makes it harder to connect a support call with
    the change.

    The second thing is software accounts. Passwords generated by a script or
    written into an installer's configuration may fail the requirements - then
    creating the account or changing its password ends with an error whose
    wording rarely points at the password policy.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Użytkownicy nie ustawią hasła zawierającego nazwę konta ani złożonego z samych liter
      - Skrypty tworzące konta z hasłem wygenerowanym prostym wzorem zaczną kończyć się błędem
      - Instalatory ustawiające własne konto usługi mogą nie przejść zmiany hasła
    en:
      - Users cannot set a password containing the account name or made of letters alone
      - Scripts creating accounts with a simply generated password start failing
      - Installers setting up their own service account may fail at the password change
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa automatyzacja tworząca konta z hasłami o ustalonym, prostym wzorze
      - Stacja jest zarządzana polityką domeny, która nadpisze ustawienie lokalne przy odświeżeniu
    en:
      - The machine runs automation creating accounts with passwords of a fixed, simple pattern
      - The workstation is managed by a domain policy that overwrites the local setting at the next refresh
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordComplexity\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^PasswordComplexity\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'PasswordComplexity'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordComplexity = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordComplexity = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/password-must-meet-complexity-requirements

notes:
  pl: |
    Punkt ma sens wyłącznie razem z minimalną długością hasła i tylko w tej
    kolejności ważności: długość najpierw, złożoność jako uzupełnienie. Sama
    złożoność przy krótkim minimum daje hasła trudne do zapamiętania i łatwe
    do złamania — najgorsze z możliwych połączenie.
  en: |
    The item makes sense only alongside the minimum password length, and only
    in that order of importance: length first, complexity as a supplement.
    Complexity alone with a short minimum produces passwords that are hard to
    remember and easy to crack - the worst possible combination.
