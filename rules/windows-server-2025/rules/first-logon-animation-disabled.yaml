id: win2025-first-logon-animation-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Animacja przy pierwszym logowaniu wyłączona
    en: The animation at the first sign-in switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza animację powitalną pokazywaną przy pierwszym zalogowaniu
    na nowo utworzonym profilu.

    Kategoria niska i nie zamierzam jej podnosić, bo sama animacja nie jest
    drogą wejścia i byłoby nieuczciwe udawać inaczej. Mówię wprost: to jest
    reguła porządkowa.

    Ma jednak treść i warto ją nazwać, zamiast zbywać punkt jako kosmetykę.
    Animacja opóźnia pierwsze zalogowanie o kilkadziesiąt sekund, w czasie
    których ekran pokazuje komunikaty powitalne i nie przyjmuje poleceń.
    Na serwerze pierwsze zalogowanie zdarza się w dwóch momentach:
    przy wdrożeniu i wtedy, gdy ktoś loguje się kontem, którym dotąd na tej
    maszynie nie pracował. Ten drugi moment bywa awarią, a wtedy
    kilkadziesiąt sekund czekania na ekran to realny koszt.

    Wartość jest więc eksploatacyjna, nie obronna. Przy automatycznym
    wdrażaniu maszyn dochodzi druga: skrypt logujący się na nowo utworzonym
    koncie nie musi czekać na koniec animacji, co usuwa klasę zawieszeń,
    których przyczyna wygląda na cokolwiek innego niż animacja.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic. Nie
    dorabiam tej regule wagi — jej miejsce jest na dole listy i tam ma się
    znaleźć przy sortowaniu.
  en: |
    The item switches off the welcome animation shown at the first sign-in on
    a newly created profile.

    The category is low and I do not mean to raise it, because the animation
    itself is not a way in and it would be dishonest to pretend otherwise. I
    say it plainly: this is a rule about order.

    It does have substance, though, and that is worth naming rather than
    dismissing the item as cosmetic. The animation delays a first sign-in by
    tens of seconds, during which the screen shows welcome messages and takes
    no commands. On a server a first sign-in happens at two moments: at
    deployment, and when somebody signs in with an account they have not
    worked with on this machine before. That second moment is sometimes an
    outage, and then tens of seconds of waiting for a screen is a real cost.

    The value is therefore operational, not defensive. With automated machine
    deployment a second one follows: a script signing in on a newly created
    account does not have to wait for the animation to end, which removes a
    class of hangs whose cause looks like anything but an animation.

    What an attacker gains while the item goes unmet: nothing. I am not
    manufacturing weight for this rule - its place is at the bottom of the
    list and that is where it should land when sorted.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i uzasadnienie jest najkrótsze w całej paczce:
    znika ekran powitalny przy pierwszym logowaniu, a na jego miejsce wchodzi
    zwykły pulpit.

    Skutek widzi wyłącznie ten, kto loguje się na tej maszynie po raz
    pierwszy, i widzi go raz w życiu tego profilu. Na serwerze oznacza to
    w praktyce jedną osobę i jedną chwilę.

    Czego to nie psuje: tworzenia profilu, zasad grupy stosowanych przy
    logowaniu, skryptów logowania ani niczego, co dzieje się w tle podczas
    pierwszego uruchomienia sesji. Profil powstaje tak samo — po prostu bez
    ekranu, który o tym opowiada.

    Rzecz do zapamiętania przy ręcznym sprawdzaniu: wpis nie leży w gałęzi
    zasadowej, tylko w gałęzi systemowej poza nią, a sama wartość jest
    twierdząca — wyłączenie zapisuje się zerem, nie jedynką. Przy czytaniu
    rejestru bez ściągi łatwo wziąć zero za brak ustawienia.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and the justification is the shortest in
    the whole pack: the welcome screen at a first sign-in goes and an
    ordinary desktop takes its place.

    The effect is seen only by whoever signs in on this machine for the first
    time, and they see it once in that profile's life. On a server that means
    one person and one moment in practice.

    What this does not break: creating the profile, group policy applied at
    sign-in, sign-in scripts, or anything happening in the background while a
    session first starts. The profile is created just the same - simply
    without a screen narrating it.

    Something to remember when checking by hand: the entry does not lie in
    the policy branch but in a system branch outside it, and the value itself
    is affirmative - switching off is written as a zero, not a one. Reading
    the registry without a crib, a zero is easily taken for the setting being
    absent.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Znika ekran powitalny przy pierwszym logowaniu na nowo utworzonym profilu
      - Skutek widzi wyłącznie osoba logująca się na tej maszynie po raz pierwszy i widzi go raz w życiu profilu
      - Tworzenie profilu, zasady grupy stosowane przy logowaniu i skrypty logowania działają bez zmian
      - Wyłączenie zapisuje się zerem, nie jedynką, a wpis leży poza gałęzią zasadową — łatwo wziąć zero za brak ustawienia
    en:
      - The welcome screen at a first sign-in on a newly created profile goes
      - Only the person signing in on this machine for the first time sees the effect, once in that profile's life
      - Creating the profile, group policy applied at sign-in and sign-in scripts work unchanged
      - Switching off is written as a zero, not a one, and the entry lies outside the policy branch - a zero is easily taken for an absent setting
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym ekran powitalny jest częścią przyjętego wprowadzenia nowych użytkowników
    en:
      - The machine is a terminal server where the welcome screen is part of the accepted introduction for new users
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This key sits outside the Policies\Microsoft branch, and the value is
      # affirmative: switching off is a zero, not a one.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableFirstLogonAnimation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableFirstLogonAnimation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A rule about order, stated as such. Its value is operational: a first
    # sign-in on a server sometimes happens during an outage, and tens of seconds
    # of a screen that takes no commands is a real cost. The value is
    # affirmative, so switching off means writing a zero.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFirstLogonAnimation' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/

notes:
  pl: |
    Reguła porządkowa i mówię to wprost, zamiast dorabiać jej wagi. Jej
    miejsce jest na dole listy i tam ma się znaleźć przy sortowaniu.

    Treść jest eksploatacyjna: animacja opóźnia pierwsze zalogowanie
    o kilkadziesiąt sekund, w czasie których ekran nie przyjmuje poleceń.
    Na serwerze pierwsze zalogowanie zdarza się przy wdrożeniu albo wtedy,
    gdy ktoś loguje się kontem, którym dotąd tu nie pracował — a ten drugi
    moment bywa awarią.

    Przy automatycznym wdrażaniu dochodzi druga wartość: skrypt logujący się
    na nowym koncie nie czeka na koniec animacji, co usuwa klasę zawieszeń
    o myląco wyglądającej przyczynie.
  en: |
    A rule about order, and I say so plainly instead of manufacturing weight
    for it. Its place is at the bottom of the list and that is where it
    should land when sorted.

    The substance is operational: the animation delays a first sign-in by
    tens of seconds during which the screen takes no commands. On a server a
    first sign-in happens at deployment or when somebody signs in with an
    account they have not worked with here - and that second moment is
    sometimes an outage.

    With automated deployment a second value follows: a script signing in on
    a new account does not wait for the animation to end, which removes a
    class of hangs with a misleading-looking cause.
