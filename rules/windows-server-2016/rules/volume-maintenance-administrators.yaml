id: win2016-volume-maintenance-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Wykonywanie zadań konserwacji woluminów tylko dla administratorów
    en: Performing volume maintenance tasks restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do wykonywania zadań konserwacji woluminów do
    grupy administratorów lokalnych.

    Uprawnienie daje dostęp do woluminu na poziomie urządzenia, a nie plików.
    Znaczy to, że posiadacz czyta i zapisuje sektory dysku wprost, z pominięciem
    systemu plików — a więc z pominięciem wszystkich uprawnień, które ten
    system plików utrzymuje. Uprawnienia są cechą plików; ten dostęp plików nie
    widzi.

    Skutek jest dwojaki i oba są poważne. Odczyt pozwala wydobyć zawartość
    dowolnego pliku na woluminie, łącznie z tymi, których uprawnienia odmawiają
    dostępu, a także zawartość plików usuniętych, dopóki sektory nie zostaną
    nadpisane. Zapis pozwala zmienić strukturę systemu plików w sposób, którego
    żadne narzędzie na poziomie plików nie zarejestruje.

    Kategoria wysoka. Do przejęcia maszyny potrzebny jest jeszcze jeden krok,
    ale dostęp do wszystkich jej danych jest tu bezpośredni, a ślad —
    w porównaniu z dostępem plikowym — praktycznie żaden.

    Na serwerze 2016 rzecz waży najwięcej na maszynach pełniących rolę
    udziału plikowego, gdzie uprawnienia katalogów są jedynym, co dzieli dane
    działów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt całej
    zawartości woluminu z pominięciem uprawnień plikowych i bez śladu, jaki
    zostawia dostęp przez system plików.
  en: |
    The item limits the right to perform volume maintenance tasks to the local
    administrators group.

    The right gives access to a volume at the level of the device, not of files.
    That means its holder reads and writes disk sectors outright, passing by the
    file system - and so by all the permissions that file system keeps. Permissions
    are a property of files; this access does not see files.

    The effect is twofold and both halves are serious. Reading allows the content of
    any file on the volume to be drawn out, including those whose permissions refuse
    access, and the content of deleted files too, until the sectors are overwritten.
    Writing allows the file system's structure to be changed in a way no tool at the
    level of files will record.

    The category is high. Taking the machine needs one step more, but access to all
    its data is direct here, and the trace - set beside file access - practically
    none.

    On Server 2016 the matter weighs most on machines serving as a file share, where
    directory permissions are the only thing keeping departments' data apart.

    What an attacker gains while the item goes unmet: a read of the volume's whole
    content, passing by file permissions and without the trace that access through
    the file system leaves.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo uprawnienie to bywa nadawane celowo i wtedy
    jego odebranie ma widoczne skutki.

    Najczęstszy przypadek to serwer bazy danych. Natychmiastowa inicjalizacja
    plików danych — mechanizm skracający tworzenie i rozszerzanie plików bazy
    z minut do sekund — opiera się właśnie na tym uprawnieniu, nadanym kontu
    usługi bazy. Po odebraniu baza działa dalej, ale rozszerzanie plików zaczyna
    blokować pracę na czas zerowania miejsca. Objaw to nagłe zatrzymania przy
    rosnącym obciążeniu, przypisywane zwykle dyskom.

    Drugi przypadek to oprogramowanie do kopii zapasowych i klonowania
    woluminów, działające na poziomie bloków. Takie narzędzia potrzebują tego
    uprawnienia z natury swojej pracy i zwykle mają je nadane kontu usługi.

    Sprawdzenie sprowadza się do przejrzenia listy pod kątem kont usług bazy
    danych i kopii zapasowych. Jeżeli takie konto tam jest, zmiany nie należy
    robić bez uzgodnienia.

    Czego to nie psuje: zwykłego dostępu do plików, udostępniania, defragmentacji
    uruchamianej przez administratora ani sprawdzania dysku.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because this right is sometimes granted on purpose,
    and then taking it away has visible effects.

    The commonest case is a database server. The instant initialisation of data
    files - a mechanism shortening the creation and growth of database files from
    minutes to seconds - rests on precisely this right, granted to the database
    service account. Once taken away, the database goes on running, but the growth
    of files begins to hold work up while the space is zeroed. The symptom is sudden
    stalls under rising load, usually ascribed to the disks.

    The second case is backup and volume cloning software working at the level of
    blocks. Such tools need this right by the nature of their work and usually have
    it granted to a service account.

    The check comes down to looking over the list for database and backup service
    accounts. If such an account is there, the change should not be made without
    agreement.

    What this does not break: ordinary access to files, sharing, defragmentation
    started by an administrator, or disk checking.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - drivers-and-devices
    - virtualization-and-containers
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Serwer bazy danych traci natychmiastową inicjalizację plików, więc rozszerzanie plików bazy zaczyna wstrzymywać pracę na czas zerowania miejsca
      - Nagłe zatrzymania bazy przy rosnącym obciążeniu bywają przypisywane dyskom, a nie tej zmianie
      - Oprogramowanie do kopii zapasowych działające na poziomie bloków przestaje odczytywać wolumin wprost
      - Zwykły dostęp do plików, udostępnianie i sprawdzanie dysku działają bez zmian
    en:
      - A database server loses instant file initialisation, so the growth of database files begins to hold work up while the space is zeroed
      - Sudden stalls of the database under rising load get ascribed to the disks rather than to this change
      - Backup software working at the level of blocks stops reading the volume outright
      - Ordinary access to files, sharing and disk checking work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa serwer bazy danych korzystający z natychmiastowej inicjalizacji plików na koncie usługi spoza grupy administratorów
      - Kopie zapasowe albo klonowanie woluminów wykonuje narzędzie działające na poziomie bloków na własnym koncie usługi
    en:
      - A database server using instant file initialisation runs on the machine under a service account outside the administrators group
      - Backups or volume cloning are done by a tool working at the level of blocks under a service account of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeManageVolumePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeManageVolumePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeManageVolumePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sector-level access does not see files, and so does not see their permissions.
    # Check first for database and backup service accounts on the list.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeManageVolumePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeManageVolumePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/perform-volume-maintenance-tasks

notes:
  pl: |
    Punkt jest najlepszym w tej grupie przykładem tego, po co istnieje druga oś
    oceny. Zysk jest realny i wysoki, koszt bywa realny i mierzalny w czasie
    odpowiedzi bazy. Decyzję trzeba podjąć, a nie zastosować hurtem.

    Jeżeli konto usługi bazy danych zostaje na liście, jest to prawidłowy wynik
    pracy z aplikacją — pod warunkiem, że zostanie zapisany jako świadomie
    przyjęte ryzyko wraz z uzasadnieniem, a nie zostawiony jako punkt
    niespełniony.

    Dostęp na poziomie sektorów omija nie tylko uprawnienia, ale i audyt dostępu
    do obiektów. Tam, gdzie audyt plikowy jest włączony i uważany za
    wystarczający, ten punkt jest dziurą w tym założeniu.
  en: |
    The item is the best example in this group of what the second axis of assessment
    is for. The gain is real and high; the cost is at times real and measurable in
    the database's response time. A decision has to be taken, not applied in bulk.

    If the database service account stays on the list, that is a proper outcome of
    working with the application - provided it is recorded as a deliberately
    accepted risk together with its grounds, and not left as an unmet item.

    Access at the level of sectors goes round not only permissions but also the
    auditing of access to objects. Where file auditing is on and held to be enough,
    this item is a hole in that assumption.
