id: fedora44-passwd-groups-exist

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 7.2.3
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Grupy główne kont z /etc/passwd istnieją w /etc/group
    en: Ensure all groups in /etc/passwd exist in /etc/group
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Konto z GID grupy, której nie ma w /etc/group, tworzy pliki należące do
    nieistniejącej grupy. Gdy ktoś później utworzy grupę o tym GID, jej
    członkowie dostaną dostęp do tych plików.

    Punkt wymaga, żeby GID grupy głównej każdego konta z /etc/passwd był
    zdefiniowany w /etc/group.
  en: |
    An account with the GID of a group missing from /etc/group creates
    files owned by a group that does not exist. When someone later creates
    a group with that GID, its members get access to these files.

    The item requires the primary group GID of every account in /etc/passwd
    to be defined in /etc/group.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/passwd i /etc/group.
  en: |
    Nobody will notice: the check only reads /etc/passwd and /etc/group.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/passwd ] && [ -r /etc/group ] || { echo "NOT_OK:no-/etc/passwd-or-/etc/group"; exit 0; }
    o=$(awk -F: 'FNR == NR { g[$3] = 1; next } !($4 in g) { printf "%s%s=%s", s, $1, $4; s = "," }' /etc/group /etc/passwd)
    if [ -n "$o" ]; then echo "NOT_OK:$o"; else echo "OK:all-groups-exist"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/passwd.5.html
  - https://man7.org/linux/man-pages/man5/group.5.html
  - https://man7.org/linux/man-pages/man8/pwck.8.html
  - https://man7.org/linux/man-pages/man8/grpck.8.html

notes:
  pl: |
    Wynik NOT_OK podaje pary konto=GID. Poprawia się je ręcznie: tworzy
    brakującą grupę poleceniem groupadd -g albo przypisuje konto do
    istniejącej grupy poleceniem usermod -g. Test porównuje tylko pliki
    lokalne, bez kont z LDAP czy SSSD, i działa bez roota. Reguła tylko
    sprawdza stan.
  en: |
    The NOT_OK result gives account=GID pairs. They are fixed by hand: by
    creating the missing group with groupadd -g or by moving the account to
    an existing group with usermod -g. The test compares only the local
    files, without LDAP or SSSD accounts, and works without root. The rule
    only checks the state.
