id: win2025-smb1-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Obsługa protokołu SMB w wersji 1 wyłączona
    en: SMB version 1 support disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z systemu obsługę pierwszej wersji protokołu
    udostępniania plików — całego składnika, a nie pojedynczego
    przełącznika.

    Protokół ten powstał w czasach, w których sieć lokalna była
    uznawana za zaufaną. Nie podpisuje ruchu w sposób dający się
    zweryfikować, nie chroni przed wpięciem się w połączenie i przenosi
    poświadczenia w postaci, którą łamie się poza siecią. Jest to
    projekt sprzed trzech dziesięcioleci, oceniany miarą tamtych
    zagrożeń.

    Jego znaczenie wykracza jednak poza słabość samego protokołu i to
    jest właściwy powód kategorii krytycznej. Wady w jego implementacji
    były drogą, którą przechodziły największe wybuchy szkodliwego
    oprogramowania ostatnich lat — te, które rozchodziły się po sieci
    same, bez otwierania czegokolwiek przez człowieka. Maszyna
    z włączoną pierwszą wersją protokołu jest w takiej sytuacji nie
    tylko ofiarą, ale i kolejnym nadajnikiem.

    Na serwerze rzecz waży najwięcej, bo serwer jest widoczny dla
    wszystkich i dostępny stale. Stanowisko robocze bywa wyłączone;
    serwer plików stoi włączony i czeka na połączenia z definicji swojej
    roli. To on jest maszyną, od której zaczyna się rozejście się
    infekcji po sieci lokalnej.

    Punkt ten obejmuje cały składnik: i stronę klienta, i stronę
    serwera. Dwa punkty siostrzane wyłączają każdą z tych stron
    z osobna, dla maszyn, na których składnika usunąć się nie da.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: protokół
    podatny na wpięcie się w połączenie i na wady wykorzystywane zdalnie
    bez udziału użytkownika, wystawiony przez maszynę dostępną stale.
  en: |
    The setting takes from the system the support of the first version of the file sharing
    protocol - the whole component and not a single switch.

    That protocol came of a time when a local network was held to be trusted. It does not sign
    its traffic in a way that can be proved, does not shield against a cutting into a connection,
    and carries credentials in a form broken outside the network. It is a design three decades
    old, judged by the measure of that time's threats.

    Its weight, though, reaches past the protocol's own weakness, and that is the true reason for
    the critical category. Flaws in its making were the road the greatest outbreaks of harmful
    software of recent years passed by - those that spread about a network of themselves, with
    nothing opened by any person. A machine with the first version switched on is in such a case
    not only a victim but another transmitter.

    On a server the matter weighs most, a server being seen by everyone and reachable at all
    times. A working station is at times switched off; a file server stands switched on and waits
    for connections by the very definition of its part. It is the machine an infection's spread
    about a local network begins from.

    This item takes in the whole component: both the client's side and the server's. Two sister
    items switch off each of those sides apart, for machines where the component cannot be
    removed.

    What an attacker gains while the item goes unmet: a protocol open to a cutting into a
    connection and to flaws used from afar with no user's part, held out by a machine reachable
    at all times.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy części systemów, wymaga
    ponownego uruchomienia maszyny i rozpoznania przeprowadzonego
    wcześniej.

    Podniosłem klasę względem paczki stanowiska roboczego, bo na
    serwerze odcinani są klienci, a nie ten serwer. Stanowisko, które
    straci dostęp do starego udziału, zgłosi to samo. Serwer plików,
    który przestanie obsługiwać starych klientów, odcina ludzi
    i urządzenia, o których istnieniu nikt na tym serwerze nie wie.

    Rozpoznanie jest tu czynnością główną, a nie formalnością. Przed
    zmianą trzeba sprawdzić, czy do udziałów tego serwera nie łączy się
    dziś nic pierwszą wersją protokołu. System potrafi to policzyć sam
    — wykaz połączeń pokazuje wersję protokołu każdej sesji, ale mówi
    o chwili obecnej, więc rozpoznanie prowadzi się przez kilka dni,
    a nie przez minutę.

    Kto typowo zostaje odcięty: urządzenia wielofunkcyjne skanujące do
    udziału, sterowniki maszyn i urządzenia pomiarowe, systemy
    wbudowane w urządzenia medyczne i przemysłowe, stacje z systemami
    wycofanymi z obsługi oraz starsze macierze dyskowe. Zwykle nie są to
    komputery, które ktoś zaktualizuje — są to urządzenia, które trzeba
    wymienić albo wydzielić.

    Objaw po stronie odciętego bywa niejasny: zamiast komunikatu
    o nieobsługiwanym protokole pojawia się odmowa dostępu albo
    zgłoszenie, że zasób nie istnieje. Dlatego rozpoznanie przed zmianą
    jest tańsze niż diagnoza po niej.

    Zmiana wymaga ponownego uruchomienia maszyny, bo usuwany jest
    składnik systemu. Wycofanie polega na ponownym dodaniu składnika
    i także wymaga restartu.
  en: |
    The change surely changes how some systems work, takes a fresh start of the machine and a
    reconnaissance made beforehand.

    I raised the class against the working station's pack, on a server it being the clients that
    are cut off and not the server. A station that loses the way to an old share reports it
    itself. A file server that stops serving old clients cuts off people and devices nobody on
    that server knows of.

    The reconnaissance is here the main deed and no formality. Before the change it must be
    checked whether anything connects to this server's shares today by the first version of the
    protocol. The system can count that of itself - the list of connections shows each session's
    version of the protocol, but it speaks of the present moment, so the reconnaissance is led
    over some days and not over a minute.

    Who is typically cut off: many-purpose devices scanning to a share, machine controllers and
    measuring devices, systems built into medical and industrial apparatus, stations with systems
    withdrawn from support, and older storage arrays. They are usually not computers somebody
    will update - they are devices that must be replaced or set apart.

    The symptom on the cut-off side is at times unclear: instead of a message of an unsupported
    protocol there comes a refusal of access or a report that the resource is not there. Hence a
    reconnaissance before the change is cheaper than a diagnosis after it.

    The change takes a fresh start of the machine, a component of the system being removed. The
    undoing is the adding of the component anew and takes a restart as well.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
    - legacy-authentication
  what_breaks:
    pl:
      - Urządzenia wielofunkcyjne skanujące do udziału tego serwera przestaną zapisywać pliki
      - Stacje z systemami wycofanymi z obsługi stracą dostęp do udziałów tej maszyny
      - Sterowniki maszyn i urządzenia pomiarowe korzystające ze starego protokołu zostaną odcięte
      - Objawem po stronie odciętego bywa odmowa dostępu, a nie komunikat o nieobsługiwanym protokole
    en:
      - Many-purpose devices scanning to this server's share will stop writing files
      - Stations with systems withdrawn from support will lose the way to this machine's shares
      - Machine controllers and measuring devices using the old protocol will be cut off
      - The symptom on the cut-off side is at times a refusal of access rather than a message of an unsupported protocol
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przeprowadzono kilkudniowego rozpoznania połączeń do udziałów tego serwera pod kątem wersji protokołu
      - Do udziałów łączą się urządzenia, których nie da się zaktualizować, a nie przygotowano dla nich zasobu wydzielonego
    en:
      - No reconnaissance of some days was made of the connections to this server's shares as to the protocol's version
      - Devices that cannot be updated connect to the shares and no set-apart resource was made ready for them
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    # Get-WindowsOptionalFeature requires elevation. Without try/catch a denied
    # call returns $null, which would look exactly like "feature not present"
    # and report a false PASS.
    try {
      $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction Stop
      if ($null -eq $f) { 'ABSENT' } else { $f.State }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(Disabled|ABSENT)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue
    [pscustomobject]@{
      feature = 'SMB1Protocol'
      state   = if ($null -eq $f) { 'ABSENT' } else { $f.State.ToString() }
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.state -eq 'Enabled') {
      Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Punkt obejmuje cały składnik — i stronę klienta, i stronę serwera.
    Dwa punkty siostrzane wyłączają każdą ze stron z osobna, dla maszyn,
    na których składnika usunąć się nie da.

    Kategorię podniosłem względem paczki stanowiska roboczego do
    krytycznej, a klasę uciążliwości do wymagającej świadomego
    wdrożenia. Powód jest w obu przypadkach ten sam: serwer jest stroną
    biorącą połączenia, stale dostępną, i to on odcina innych, a nie
    siebie.

    Rozpoznanie prowadź przez kilka dni, nie przez minutę. Wykaz
    połączeń pokazuje wersję protokołu każdej sesji, ale mówi wyłącznie
    o chwili obecnej.
  en: |
    The item takes in the whole component - both the client's side and the server's. Two sister
    items switch off each side apart, for machines where the component cannot be removed.

    I raised the category against the working station's pack to critical, and the class of
    disruption to one taking a knowing rollout. The reason is in both cases the same: a server is
    the taking side of connections, reachable at all times, and it cuts off others rather than
    itself.

    Lead the reconnaissance over some days, not over a minute. The list of connections shows each
    session's version of the protocol but speaks of the present moment alone.
