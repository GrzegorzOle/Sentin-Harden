id: win11-wdigest-credentials

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie haseł w pamięci przez WDigest wyłączone
    en: WDigest credential caching disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Starszy dostawca uwierzytelniania WDigest przechowuje w pamięci hasło
    zalogowanego użytkownika w postaci umożliwiającej jego odtworzenie.
    Napastnik z uprawnieniami administratora odczytuje wtedy nie skrót, lecz
    hasło w czytelnej postaci — gotowe do użycia w dowolnym systemie, także tam,
    gdzie pracownik użył tego samego hasła prywatnie.

    Po wyłączeniu tego zachowania system przestaje trzymać hasło w pamięci
    w odwracalnej formie. Napastnikowi zostają wyłącznie skróty, których nie da
    się użyć wszędzie tam, gdzie wymagane jest hasło wpisywane.
  en: |
    The legacy WDigest authentication provider keeps the signed-in user's
    password in memory in a form that can be recovered. An attacker with
    administrator rights then reads not a hash but the password in clear form,
    ready to use on any system, including places where the employee reused the
    same password privately.

    With this behaviour disabled the system stops holding the password in
    memory in a reversible form. Only hashes remain, and those cannot be used
    wherever a typed password is required.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowisko wymaga uwierzytelniania WDigest wobec bardzo starej aplikacji webowej
    en:
      - The environment still requires WDigest authentication against a very old web application
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      $name = 'UseLogonCredential'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|MISSING)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    $name = 'UseLogonCredential'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseLogonCredential' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/kerberos/credentials-protection-and-management

notes:
  pl: |
    Brak wartości w rejestrze jest na Windows 11 stanem poprawnym — domyślnie
    hasło nie jest przechowywane. Jawne ustawienie zera zabezpiecza przed
    sytuacją, w której inne oprogramowanie włączy tę funkcję z powrotem.
  en: |
    A missing registry value is the correct state on Windows 11 - by default the
    password is not cached. Setting the value explicitly to zero guards against
    other software turning the feature back on.
