id: win10-remote-shutdown-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Wymuszanie zamknięcia z systemu zdalnego zastrzeżone dla administratorów
    en: The forcing of a shutdown from a system afar reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo wymuszania zamknięcia maszyny z systemu
    zdalnego dla administratorów lokalnych.

    Prawo to pozwala wyłączyć albo zrestartować maszynę przez sieć, bez
    obecności przy niej i bez zalogowania się na pulpit. Służy do zdalnej
    obsługi aktualizacji i do porządkowania maszyn po godzinach pracy.

    Zagrożenie dotyczy dostępności, ale nie tylko. Wymuszone zamknięcie
    przerywa pracę bez zapisania niczego, co daje utratę danych
    otwartych w programach. Powtarzane sprawia, że maszyna staje się
    bezużyteczna, a użytkownik traci zaufanie do niej i do tego, kto ją
    utrzymuje.

    Drugim zastosowaniem, mniej oczywistym, jest wymuszenie restartu
    w wybranym momencie. Napastnik, który podłożył kod uruchamiany przy
    starcie, potrzebuje restartu, żeby go uruchomić — i nie chce czekać,
    aż użytkownik zrestartuje maszynę sam.

    Odnotowuję, że punkt nie dotyczy zamykania maszyny przez osobę przy
    niej siedzącą. To osobne prawo i osobna zasada.

    Sprawdzenie przyjmuje wykaz węższy niż wymagany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: restart
    maszyny w wybranym przez siebie momencie, wykonany przez sieć.
  en: |
    The setting reserves the right of forcing a machine's shutdown from a system afar to the local administrators.

    That right lets a machine be switched off or restarted over the network, without a being present at it and
    without a signing in to a desktop. It serves for the handling of the servicing from afar and for the tidying
    of machines after the hours of work.

    The danger touches availability, and not that alone. A forced shutdown breaks off work without the writing
    down of anything, which gives a loss of the data open in programs. Repeated, it brings it about that the
    machine turns useless, and the user loses trust in it and in whoever keeps it.

    The second use, the less plain, is the forcing of a restart at a chosen hour. An attacker who has laid down
    code that runs at the start needs a restart to run it - and does not wish to wait until the user restarts the
    machine of themselves.

    I set down that the item does not touch the shutting down of a machine by the person sitting at it. That is a
    right apart and a policy apart.

    The check takes a list narrower than the one called for.

    What an attacker gains while the item goes unmet: a restart of the machine at an hour of their own choosing,
    carried out over the network.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz zawiera samych administratorów i na maszynie
    utrzymywanej normalnie zmiana jest zapisem stanu.

    Odnotowuję jedyne miejsce warte spojrzenia: konto usługowe systemu
    zarządzania aktualizacjami, który restartuje maszyny po wgraniu
    poprawek. Część takich systemów działa przez agenta pracującego
    lokalnie i wtedy prawo to nie jest im potrzebne; część wymusza
    restart przez sieć i wtedy jest.

    Po zmianie restart z takiego systemu przestanie się udawać, a maszyna
    zostanie z poprawkami wgranymi, ale nieukończonymi — stan, który
    raport aktualizacji pokaże jako oczekiwanie na restart.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: zamykania maszyny przez osobę przy niej siedzącą,
    logowania, pracy z plikami, dostępu do zasobów sieciowych, drukowania.
  en: |
    The class is "no disruption".

    The default list holds the administrators alone, and upon a machine kept in the ordinary way the change is a
    setting down of a state.

    I set down the one place worth a look: the service account of a system ruling the servicing, which restarts
    machines after patches are laid on. Some such systems work through an agent standing upon the machine and then
    have no need of this right; some force the restart over the network and then have.

    After the change a restart from such a system will cease to come through, and the machine will stay with
    patches laid on but unfinished - a state the report of the servicing will show as a waiting for a restart.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the shutting down of the machine by the person sitting at it, logging on, work with
    files, the way to resources upon the network, or printing.

implementation_consequences:
  impact_areas:
    - remote-management
    - updates-and-servicing
  what_breaks:
    pl:
      - System zarządzania aktualizacjami wymuszający restart przez sieć przestanie go wykonywać
      - Maszyna zostanie z poprawkami wgranymi, ale nieukończonymi, i raport pokaże ją jako oczekującą na restart
      - Systemy działające przez agenta lokalnego tego prawa nie potrzebują i pracują dalej
      - Domyślny wykaz zawiera samych administratorów, więc na większości maszyn zmiana jest zapisem stanu
      - Zamykanie maszyny przez osobę przy niej siedzącą, logowanie, praca z plikami i drukowanie pozostają bez zmian
    en:
      - A system ruling the servicing that forces a restart over the network will cease to carry it out
      - The machine will stay with patches laid on but unfinished, and the report will show it as waiting for a restart
      - Systems working through an agent upon the machine have no need of this right and work on
      - The default list holds the administrators alone, so upon most machines the change is a setting down of a state
      - The shutting down of the machine by the person sitting at it, logging on, work with files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny restartuje po aktualizacjach system zarządzania działający przez sieć, na własnym koncie usługowym
    en:
      - The machines are restarted after the servicing by a ruling system working over the network, upon a service account of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRemoteShutdownPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRemoteShutdownPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRemoteShutdownPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRemoteShutdownPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRemoteShutdownPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/force-shutdown-from-a-remote-system

notes:
  pl: |
    Reguła jest parą do punktu o zamykaniu systemu przy maszynie i warto,
    żeby aplikacja pokazała je razem oraz wyjaśniła, dlaczego ta jest
    oceniona wyżej. Zamknięcie przy maszynie wymaga obecności przy niej;
    zdalne wykonuje się z dowolnego miejsca w sieci.

    Argument wart postawienia wprost dotyczy restartu jako narzędzia,
    a nie szkody. Napastnik, który podłożył kod uruchamiany przy starcie,
    potrzebuje restartu, żeby swoją pracę dokończyć. Wymuszenie restartu
    przez sieć daje mu wybór momentu — najlepiej takiego, w którym nikt
    nie patrzy.

    Odnotowuję, że koszt wdrożenia zależy od tego, jak zorganizowane są
    aktualizacje. System działający przez agenta lokalnego tego prawa nie
    potrzebuje; system wymuszający restart przez sieć potrzebuje.
    Aplikacja powinna wymienić tę różnicę, bo rozstrzyga ona, czy punkt
    kosztuje cokolwiek.
  en: |
    The rule is the pair of the item about the shutting down of the system at the machine, and it is well that the
    application show them together and set out why this one is graded the higher. The shutting down at the machine
    calls for a being present at it; the one from afar is done from any place upon the network.

    The argument worth putting outright touches the restart as a tool and not as a harm. An attacker who has laid
    down code that runs at the start needs a restart to finish their work. The forcing of a restart over the
    network gives them the choosing of the hour - best one at which nobody looks.

    I set down that the cost of the rollout hangs upon how the servicing is set up. A system working through an
    agent upon the machine has no need of this right; a system forcing the restart over the network has. The
    application ought to name that difference, it settling whether the item costs anything at all.
