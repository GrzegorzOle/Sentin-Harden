id: win2025-smb1-server-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Serwer SMB w wersji pierwszej wyłączony
    en: The first-version SMB server switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza stronę serwerową pierwszej wersji protokołu
    udostępniania plików, czyli przestaje przyjmować połączenia
    prowadzone tym protokołem.

    Jest to ta strona, która ma znaczenie na serwerze. Strona kliencka
    rozstrzyga o tym, dokąd ta maszyna sama sięga; strona serwerowa
    rozstrzyga o tym, kto może sięgnąć do niej — i to ona jest
    powierzchnią widoczną z sieci.

    Powierzchnia ta jest dostępna bez uwierzytelnienia w części
    wymiany: zanim jeszcze padnie nazwa konta, obie strony uzgadniają
    wersję protokołu i przekazują sobie dane. Wady wykorzystywane
    w największych wybuchach szkodliwego oprogramowania ostatnich lat
    leżały właśnie tam, przed uwierzytelnieniem. Maszyna nie musiała
    więc mieć słabego hasła ani nieostrożnego użytkownika — wystarczyło,
    że była osiągalna.

    Serwer jest osiągalny z definicji swojej roli. Nie ma go kto
    wyłączyć na noc i nie ma powodu go chować, bo po to stoi, żeby się
    z nim łączyć.

    Punkt ten jest potrzebny osobno, obok usunięcia całego składnika,
    z powodu maszyn, na których składnika usunąć się nie da albo nie
    wolno — bo wymaga tego oprogramowanie dostawcy. Wyłączenie samej
    strony serwerowej zdejmuje wtedy tę część ryzyka, która płynie
    z sieci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    powierzchnię sieciową dostępną przed uwierzytelnieniem na maszynie
    działającej stale, historycznie wykorzystywaną do rozchodzenia się
    infekcji bez udziału człowieka.
  en: |
    The setting switches off the server's side of the first version of the file sharing protocol
    - that is, it stops taking connections led by that protocol.

    It is that side which bears weight on a server. The client's side settles where this machine
    itself reaches; the server's side settles who may reach it - and it is the surface seen from
    the network.

    That surface is reachable without authentication in part of the exchange: before an account's
    name is ever spoken, both sides settle the protocol's version and hand data to one another.
    The flaws used in the greatest outbreaks of harmful software of recent years lay just there,
    before authentication. A machine needed therefore neither a weak password nor a careless user
    - it was enough that it could be reached.

    A server can be reached by the very definition of its part. There is nobody to switch it off
    for the night and no reason to hide it, it standing there to be connected with.

    This item is wanted apart, beside the removal of the whole component, by reason of machines
    where the component cannot be removed or may not be - a maker's software asking for it. The
    switching off of the server's side alone then takes away that part of the risk which comes
    from the network.

    What an attacker gains while the item goes unmet: a network surface reachable before
    authentication on a machine working at all times, used in history for the spreading of
    infection with no person's part.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy części klientów i wymaga
    rozpoznania przeprowadzonego wcześniej oraz okna serwisowego.

    Jest to punkt, przy którym odcina się innych, a nie siebie, i to
    przesądza o klasie. Serwer po zmianie pracuje bez różnicy; dla
    urządzenia, które łączyło się z nim starym protokołem, znika udział.

    Rozpoznanie jest czynnością główną. System potrafi pokazać wersję
    protokołu każdej otwartej sesji, ale wykaz ten mówi o chwili
    obecnej. Urządzenie łączące się raz na dobę albo raz w tygodniu nie
    pojawi się w nim przy jednorazowym spojrzeniu — stąd rozpoznanie
    prowadzone przez kilka dni.

    Odcięci są zwykle ci sami, co przy usunięciu całego składnika:
    urządzenia wielofunkcyjne, sterowniki maszyn, systemy wbudowane
    i stacje z systemami wycofanymi z obsługi. Różnica polega na tym, że
    ten punkt daje się zastosować także tam, gdzie składnika usunąć nie
    wolno.

    Objaw bywa mylący. Klient nie zawsze zgłasza nieobsługiwaną wersję
    protokołu — częściej pokazuje odmowę dostępu albo brak zasobu,
    a urządzenie wbudowane potrafi zgłosić wyłącznie „błąd zapisu".

    Zmiana nie dotyczy połączeń tego serwera do innych maszyn. Tamtą
    stronę opisuje punkt o sterowniku klienta.

    Wartość wchodzi w życie po ponownym uruchomieniu maszyny.
    Wycofanie przywraca wpis natychmiast, ale działa również dopiero po
    restarcie.
  en: |
    The change surely changes how some clients work and takes a reconnaissance made beforehand
    and a service window.

    It is an item where others are cut off and not oneself, and that settles the class. The
    server after the change works with no difference; for a device that connected to it by the
    old protocol the share is gone.

    The reconnaissance is the main deed. The system can show each open session's version of the
    protocol, but that list speaks of the present moment. A device connecting once a day or once
    a week will not show in it at a single glance - thence a reconnaissance led over some days.

    Those cut off are usually the same as at the removal of the whole component: many-purpose
    devices, machine controllers, built-in systems and stations with systems withdrawn from
    support. The difference is that this item can be used also where the component may not be
    removed.

    The symptom misleads at times. A client does not always report an unsupported version of the
    protocol - oftener it shows a refusal of access or a want of the resource, and a built-in
    system can report nothing but "a fault in writing".

    The change does not bear on this server's connections to other machines. That side is set
    down by the item on the client driver.

    The value comes into force after a fresh start of the machine. The undoing restores the entry
    at once but works, likewise, only after a restart.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
    - legacy-authentication
  what_breaks:
    pl:
      - Urządzenia łączące się z udziałami tego serwera starym protokołem stracą do nich dostęp
      - Klient bywa zgłaszać odmowę dostępu albo brak zasobu zamiast nieobsługiwanej wersji protokołu
      - Połączenia tego serwera do innych maszyn pozostają bez zmiany
      - Wartość wchodzi w życie dopiero po ponownym uruchomieniu maszyny
    en:
      - Devices connecting to this server's shares by the old protocol will lose the way to them
      - A client at times reports a refusal of access or a want of the resource rather than an unsupported version
      - This server's connections to other machines stay unchanged
      - The value comes into force only after a fresh start of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przeprowadzono kilkudniowego rozpoznania wersji protokołu w sesjach do udziałów tego serwera
      - Z udziałów korzystają urządzenia, których nie da się zaktualizować, a nie przygotowano dla nich zasobu wydzielonego
    en:
      - No reconnaissance of some days was made of the protocol's version in the sessions to this server's shares
      - Devices that cannot be updated use the shares and no set-apart resource was made ready for them
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # Zero switches the server side of the first protocol version off. An
      # absent value means the default, and the default leaves that side on, so
      # it is reported as a missing setting rather than as a good state.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'SMB1'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'SMB1'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SMB1' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Brak wartości znaczy tu stan domyślny, a domyślnie strona serwerowa
    pozostaje włączona. Sprawdzenie zgłasza więc brak wpisu jako
    ustawienie nieobecne, a nie jako stan dobry.

    Punkt jest potrzebny osobno, obok usunięcia całego składnika,
    z powodu maszyn, na których składnika usunąć nie wolno. Zdejmuje
    wtedy tę część ryzyka, która płynie z sieci.

    Strona serwerowa jest powierzchnią widoczną z sieci i dostępną
    przed uwierzytelnieniem. To ona, a nie strona kliencka, przesądza
    o kategorii krytycznej na serwerze.
  en: |
    A want of the value means here the default state, and by default the server's side stays
    switched on. The check therefore reports a missing entry as a setting not there rather than
    as a good state.

    The item is wanted apart, beside the removal of the whole component, by reason of machines
    where the component may not be removed. It then takes away that part of the risk which comes
    from the network.

    The server's side is the surface seen from the network and reachable before authentication.
    It is that, and not the client's side, that settles the critical category on a server.
