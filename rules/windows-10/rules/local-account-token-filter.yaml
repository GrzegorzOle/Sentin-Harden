id: win10-local-account-token-filter

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Ograniczenie uprawnień kont lokalnych przy połączeniu z sieci
    en: The bounding of local accounts rights at a connection from the network
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zachowuje wbudowane ograniczenie, przez które konto lokalne
    łączące się z sieci dostaje uprawnienia zwykłe, nawet jeśli należy do
    administratorów.

    Ograniczenie to jest podstawą, na której stoi cała obrona przed
    rozejściem się napastnika po sieci. Hasło konta lokalnego bywa na wielu
    maszynach takie samo — z obrazu instalacyjnego, z procedury wdrożeniowej,
    z wygody. Gdy ograniczenie działa, zdobycie takiego hasła daje dostęp
    zdalny bez uprawnień i tym samym niewiele.

    Wyłączenie ograniczenia zmienia to zupełnie. Każde konto lokalne
    w grupie administratorów daje wtedy pełne prawa zdalnie, na każdej
    maszynie, na której to samo hasło działa. Napastnik, który zdobędzie
    jedno hasło z jednej maszyny, przechodzi wtedy przez cały ich zbiór
    bez zatrzymania — i robi to drogą przewidzianą, więc niczego nie łamie.

    Rzecz szczególna dotyczy sposobu zapisu. Ograniczenie jest domyślne,
    a wyłącza je dopiero jawny wpis w rejestrze. Znaczy to, że brak wartości
    jest tu stanem prawidłowym, a naprawa polega na usunięciu wpisu,
    nie na jego zapisaniu. Sprawdzenie odczytuje to wprost i zwraca
    „FILTERED" także wtedy, gdy wartości nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne prawa
    zdalne na każdej maszynie, na której działa zdobyte hasło konta
    lokalnego.
  en: |
    The setting keeps the built-in bound by which a local account joining from the network gets ordinary rights,
    even where it belongs to the administrators.

    That bound is the footing on which the whole defence against an attacker spreading across a network rests. A
    local account's password is at times alike on many machines - from an installation image, from a rollout
    procedure, from convenience. Where the bound works, the winning of such a password gives remote access
    without rights and thereby little.

    Switching the bound off changes that wholly. Every local account in the group of administrators then gives
    full rights remotely, on every machine the same password works on. An attacker who wins one password from
    one machine passes then through the whole set of them without halt - and does so by a foreseen road, so they
    break nothing.

    A particular matter touches the way it is written. The bound is the default, and only an outright entry in
    the registry switches it off. That means a missing value is here the right state, and the remedy lies in
    taking the entry away rather than in writing it. The check reads that outright and returns "FILTERED" also
    where the value is absent.

    What an attacker gains while the item goes unmet: full remote rights on every machine the won local
    account's password works on.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, po co ktoś ten
    wpis założył. Domyślnie go nie ma, więc jeśli jest, to ktoś go dodał
    świadomie.

    Powód bywa jeden i konkretny: narzędzie do zarządzania łączące się do
    maszyny kontem lokalnym i wymagające pełnych uprawnień. Dotyczy to
    skryptów wdrożeniowych, narzędzi do kopii zapasowych i oprogramowania
    monitorującego na maszynach spoza domeny. Po usunięciu wpisu takie
    narzędzie zacznie dostawać odmowę dostępu przy czynnościach
    wymagających uprawnień, choć samo połączenie będzie się udawać.

    Objaw ten jest mylący i wart odnotowania: logowanie przechodzi, a operacja
    nie. Szukanie przyczyny idzie wtedy zwykle w stronę uprawnień do zasobu,
    a nie w stronę tego ustawienia.

    Rozwiązaniem jest konto domenowe albo konto zarządzane z hasłem różnym
    na każdej maszynie. Obie drogi wymagają przygotowania, ale żadna nie
    wymaga przywracania wpisu.

    Czego to nie psuje: logowania przy maszynie, kont domenowych, udziałów
    plikowych czytanych bez uprawnień, usług systemowych, sieci, aplikacji.
  en: |
    The class is "needs review", and the review touches why somebody laid that entry down. By default it is
    absent, so if it is there, somebody added it knowingly.

    There is as a rule one concrete reason: a management tool joining to the machine by a local account and
    calling for full rights. That touches rollout scripts, backup tools and monitoring software on machines
    outside the domain. Once the entry is taken away, such a tool will begin getting access denied at acts
    calling for rights, though the joining itself will succeed.

    That symptom misleads and is worth noting: the logon passes, the operation does not. The looking for a cause
    goes then as a rule toward the rights upon a resource rather than toward this setting.

    The answer is a domain account, or a managed account with a password differing on every machine. Both roads
    call for preparation, and neither calls for the entry to be put back.

    What this does not break: logging on at the machine, domain accounts, file shares read without rights,
    system services, the network, or applications.

implementation_consequences:
  impact_areas:
    - remote-management
    - accounts-and-passwords
    - scripting-and-automation
    - file-sharing
  what_breaks:
    pl:
      - Narzędzie do zarządzania łączące się kontem lokalnym dostaje odmowę przy czynnościach wymagających uprawnień
      - Objaw myli, bo samo połączenie się udaje, a nie udaje się dopiero operacja wykonywana po nim
      - Skrypty wdrożeniowe i oprogramowanie kopii zapasowych na maszynach spoza domeny wymagają przejścia na konto domenowe
      - Naprawa polega na usunięciu wpisu, nie na jego zapisaniu, więc na maszynie nietykanej nie ma czego zmieniać
      - Logowanie przy maszynie, konta domenowe, udziały plikowe oraz usługi systemowe i sieć pozostają bez zmian
    en:
      - A management tool joining by a local account gets a refusal at acts calling for rights
      - The symptom misleads, the joining itself succeeding while the operation done after it does not
      - Rollout scripts and backup software on machines outside the domain call for a move to a domain account
      - The remedy lies in taking the entry away rather than writing it, so on an untouched machine there is nothing to change
      - Logging on at the machine, domain accounts, file shares and system services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyną zarządza narzędzie łączące się kontem lokalnym i nie ma jeszcze konta domenowego, którym dałoby się je zastąpić
      - Maszyna stoi poza domeną, a jedyna droga obsługi zdalnej opiera się na koncie lokalnym z pełnymi uprawnieniami
    en:
      - The machine is managed by a tool joining by a local account and there is as yet no domain account to stand in its place
      - The machine stands outside the domain and the only road of remote handling rests on a local account with full rights
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'LocalAccountTokenFilterPolicy'
      $value = $null
      if (Test-Path -Path $path -ErrorAction Stop) {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
      }
      # Here the missing value is the secure state: filtering is the system
      # default and only an explicit 1 switches it off.
      if ($null -eq $value -or [int]$value -eq 0) { 'FILTERED' } else { 'NOT_FILTERED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FILTERED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'LocalAccountTokenFilterPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The remedy is a removal, not a writing. Filtering is the system default and
    # only this entry switches it off, so taking the entry away restores it.
    Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'LocalAccountTokenFilterPolicy' -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      "The entry did not exist before the change - nothing to restore."
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/windows-security/user-account-control-and-remote-restriction

notes:
  pl: |
    Reguła jest kategorii krytycznej i jest jedną z nielicznych, w których
    zgodność oznacza nieobecność wpisu, a nie jego wartość. Warto, żeby
    aplikacja mówiła to wprost w opisie, bo użytkownik przyzwyczajony do
    tego, że utwardzenie polega na zapisywaniu, uzna brak wpisu za
    niedopatrzenie.

    Argument wart postawienia na pierwszym miejscu dotyczy skali. Ta jedna
    wartość rozstrzyga o tym, czy zdobycie hasła jednego konta lokalnego
    daje jedną maszynę, czy wszystkie o tym samym haśle. Jest to różnica
    między incydentem a utratą całej sieci i dlatego kategoria nie może być
    niższa.

    Odnotowuję objaw przy niezgodności odwrotnej — po naprawie. Połączenie
    się udaje, operacja nie. Aplikacja, która to wymieni, oszczędzi komuś
    szukania w uprawnieniach do zasobu, gdzie przyczyny nie ma.
  en: |
    The rule is of a critical category and is one of the few in which compliance means an entry's absence rather
    than its value. It is well that the application say so outright in the description, a user used to hardening
    meaning a writing taking the entry's absence for an oversight.

    The argument worth putting first touches scale. This one value settles whether the winning of one local
    account's password gives one machine or every machine sharing that password. It is the difference between an
    incident and the loss of a whole network, and for that the category can be no lower.

    I set down the symptom at the reverse mismatch - after the remedy. The joining succeeds, the operation does
    not. An application naming that will spare somebody a search among the rights upon a resource, where the
    cause is not.
