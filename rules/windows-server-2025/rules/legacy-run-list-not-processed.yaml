id: win2025-legacy-run-list-not-processed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Starsza lista programów uruchamianych przy logowaniu pomijana
    en: The older list of programs started at logon passed over
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt nakazuje pomijać maszynową listę programów uruchamianych przy
    logowaniu — tę, którą system czyta niezależnie od tego, kto się loguje.

    Kategoria wysoka i chcę nazwać, dlaczego akurat ta lista jest warta
    osobnego punktu. To jest jedno z najstarszych i najczęściej używanych
    miejsc, w których napastnik zostawia po sobie ślad mający przetrwać
    restart. Wpis nie jest usługą, nie jest zadaniem, nie pojawia się na
    liście zadań zaplanowanych — jest wierszem w rejestrze, który system
    wykonuje sam, przy każdym logowaniu.

    Na serwerze waży dodatkowo to, z czyimi uprawnieniami ten wiersz się
    wykona. Lista maszynowa dotyczy wszystkich logujących się kont, a na
    serwerze kontem logującym się jest zwykle administrator. Wpis
    umieszczony tam przez konto o mniejszych prawach czeka więc na moment,
    w którym uruchomi go ktoś, kto ma prawa większe.

    Punkt nie usuwa wpisów. Nakazuje ich nie wykonywać — co jest różnicą
    istotną przy diagnozowaniu, bo po zastosowaniu reguły wpis nadal tam
    jest i nadal widać go w rejestrze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce
    trwałego zaczepienia, wykonywane przy każdym logowaniu, z uprawnieniami
    osoby logującej się, a nie tej, która wpis zostawiła.
  en: |
    The item orders the machine-wide list of programs started at logon to be
    passed over - the one the system reads regardless of who signs in.

    The category is high, and I want to name why this particular list
    deserves an item of its own. It is one of the oldest and most used places
    where an attacker leaves behind something meant to survive a restart. The
    entry is not a service, not a task, does not appear in any list of
    scheduled work - it is a line in the registry which the system carries out
    by itself, at every sign-in.

    On a server it weighs additionally whose rights that line runs with. The
    machine-wide list concerns every account that signs in, and on a server
    the account signing in is usually an administrator. An entry placed there
    by an account with fewer rights therefore waits for the moment when
    somebody with greater ones starts it.

    The item does not remove entries. It orders them not to be carried out -
    a difference that matters when diagnosing, because after the rule is
    applied the entry is still there and still visible in the registry.

    What an attacker gains while the item goes unmet: a place of lasting
    foothold, carried out at every sign-in, with the rights of the person
    signing in rather than of the one who left the entry.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie jest tu realne, bo ta lista bywa
    używana zgodnie z przeznaczeniem.

    Trafia na nią to, co ma wystartować razem z sesją: agenty starszych
    systemów kopii zapasowych, narzędzia monitorujące sprzed epoki usług,
    programy licencyjne, czasem skrypt dopisany ręcznie przy stawianiu
    maszyny. Po zastosowaniu reguły takie rzeczy przestaną się uruchamiać,
    a ponieważ nic ich nie zgłasza, objaw pojawi się jako brak działania,
    nie jako błąd.

    Dlatego kolejność jest tutaj odwrotna niż zwykle: najpierw przeczytaj,
    co na tej liście stoi, potem zastosuj. Pustej listy nie ma po co
    sprawdzać, a lista z trzema wpisami to trzy pytania do zadania.

    Czego to nie psuje: usług, zadań zaplanowanych, skryptów logowania
    z zasad grupy, autostartu z katalogu użytkownika ani niczego, co jest
    uruchamiane przez menedżera usług. To wszystko są inne drogi.

    Rzecz do zapamiętania: ten wpis i kilka innych reguł leżą pod tą samą
    ścieżką rejestru, ale dotyczą różnych rzeczy. Znajoma ścieżka nie znaczy,
    że grupa jest zamknięta.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is a real one here, because
    this list is sometimes used as intended.

    What lands on it is whatever should start along with the session: agents
    of older backup systems, monitoring tools from before the age of
    services, licensing programs, sometimes a script added by hand when the
    machine was built. After the rule is applied such things stop starting,
    and since nothing announces them, the symptom appears as an absence of
    work rather than as an error.

    The order is therefore the reverse of usual here: first read what stands
    on that list, then apply. An empty list is not worth checking, and a list
    with three entries is three questions to ask.

    What this does not break: services, scheduled tasks, logon scripts from
    group policy, autostart from the user's folder, or anything started by
    the service manager. Those are all different roads.

    Something to remember: this entry and several other rules lie under the
    same registry path but concern different things. A familiar path does not
    mean the group is closed.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - remote-management
  what_breaks:
    pl:
      - Programy wpisane na maszynową listę startową przestaną się uruchamiać przy logowaniu
      - Objaw pojawi się jako brak działania, a nie jako błąd, bo nic tych wpisów nie zgłasza
      - Przeczytaj zawartość tej listy przed zastosowaniem, nie po — trzy wpisy to trzy pytania do zadania
      - Usługi, zadania zaplanowane, skrypty logowania z zasad grupy i autostart użytkownika działają bez zmian
    en:
      - Programs written on the machine-wide startup list stop being started at sign-in
      - The symptom appears as an absence of work rather than as an error, because nothing announces those entries
      - Read what stands on that list before applying, not after - three entries are three questions to ask
      - Services, scheduled tasks, logon scripts from group policy and the user's autostart work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynowej liście startowej stoi agent, narzędzie monitorujące albo skrypt potrzebny do pracy tego serwera
    en:
      - The machine-wide startup list holds an agent, a monitoring tool or a script this server needs in order to work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'DisableLocalMachineRun'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'DisableLocalMachineRun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The machine-wide startup list is carried out at every sign-in, with the
    # rights of whoever signs in - on a server, usually an administrator. The
    # change makes the list be passed over; it does not remove the entries, so
    # they stay visible in the registry. Read the list before applying.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalMachineRun' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/setupapi/run-and-runonce-registry-keys

notes:
  pl: |
    Jedno z najstarszych miejsc trwałego zaczepienia: wpis nie jest usługą
    ani zadaniem, tylko wierszem w rejestrze, który system wykonuje sam przy
    każdym logowaniu.

    Na serwerze waży to, z czyimi uprawnieniami się wykona. Lista maszynowa
    dotyczy wszystkich kont, a logującym się kontem jest zwykle
    administrator — wpis zostawiony przez konto o mniejszych prawach czeka
    na kogoś, kto ma większe.

    Punkt nie usuwa wpisów, tylko nakazuje ich nie wykonywać. Przy
    diagnozowaniu to różnica istotna: wpis nadal tam jest i nadal go widać.
  en: |
    One of the oldest places of lasting foothold: the entry is not a service
    or a task but a line in the registry which the system carries out by
    itself at every sign-in.

    On a server what weighs is whose rights it runs with. The machine-wide
    list concerns every account, and the account signing in is usually an
    administrator - an entry left by an account with fewer rights waits for
    somebody with greater ones.

    The item does not remove entries, only orders them not to be carried out.
    When diagnosing that difference matters: the entry is still there and
    still visible.
