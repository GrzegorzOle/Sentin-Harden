id: win2025-password-reveal-button-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Przycisk pokazujący wpisywane hasło ukryty
    en: The button revealing a typed password hidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt usuwa z okien podawania poświadczeń przycisk, który pokazuje
    wpisywane hasło jawnym tekstem.

    Kategoria średnia i chcę uzasadnić, dlaczego nie niska, bo to wygląda na
    drobiazg. Hasło pokazane na ekranie przestaje być chronione przez
    cokolwiek technicznego. Nie chroni go wtedy szyfrowanie, nie chroni
    polityka, nie chroni długość — chroni je wyłącznie to, kto w danej
    chwili patrzy na ekran i czy nie jest on akurat nagrywany.

    Na serwerze waży to bardziej niż na stanowisku i to jest rzecz warta
    nazwania. Hasło wpisywane w okno poświadczeń na serwerze to zwykle hasło
    konta o wysokich uprawnieniach — konta usługi, konta administratora
    domeny, poświadczeń do udziału. Te hasła są długie i wpisywane rzadko,
    czyli dokładnie takie, przy których pokusa naciśnięcia tego przycisku
    jest największa.

    Kontekst serwerowy dokłada rzecz drugą, poważniejszą. Praca na serwerze
    odbywa się przez sesję zdalną albo przez konsolę maszyny wirtualnej —
    czyli przez ekran, który bywa udostępniany, współdzielony przy
    rozwiązywaniu problemu i nagrywany przez systemy rejestrujące sesje
    uprzywilejowane. Hasło pokazane jawnie w takiej sesji zostaje na
    nagraniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: szansę na to,
    że hasło uprzywilejowane zostanie w czyimś polu widzenia albo
    w nagraniu sesji.
  en: |
    The item removes from credential windows the button that shows the
    password being typed in plain text.

    The category is medium, and I want to justify why not low, because it
    looks like a trifle. A password shown on screen stops being protected by
    anything technical. Encryption does not protect it then, policy does not,
    length does not - the only thing protecting it is who happens to be
    looking at the screen and whether the screen is being recorded.

    On a server this weighs more than on a workstation, and that is worth
    naming. A password typed into a credential window on a server is usually
    the password of a highly privileged account - a service account, a domain
    administrator, credentials for a share. Those passwords are long and
    typed rarely, which is exactly when the temptation to press this button
    is greatest.

    The server context adds a second, graver thing. Work on a server happens
    through a remote session or a virtual machine's console - that is,
    through a screen that gets shared, shown to somebody while a problem is
    being solved, and recorded by systems that log privileged sessions. A
    password shown in plain text in such a session stays on the recording.

    What an attacker gains while the item goes unmet: a chance that a
    privileged password ends up in somebody's field of view or in a session
    recording.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", ale zaznaczam tę zmianę jako odczuwalną,
    bo jest widoczna w oknie, które ludzie znają.

    Przycisk znika. Kto hasła wpisuje długie, a nie używa menedżera haseł,
    straci jedyny sposób sprawdzenia, czy się nie pomylił — i pomyłka
    skończy się drugim podejściem zamiast poprawką. To jest cały skutek
    i jest on rzeczywisty, chociaż drobny.

    Warto natomiast zauważyć, że właściwym rozwiązaniem tej niedogodności
    jest wklejanie hasła z menedżera, a nie oglądanie go na ekranie. Punkt
    nie blokuje wklejania w żaden sposób.

    Czego to nie psuje: logowania, podawania poświadczeń, zapamiętywania
    haseł przez system, uwierzytelniania w jakiejkolwiek formie. Nie zmienia
    też nic w oknach aplikacji, które rysują własne pole hasła — a takich
    jest sporo. Ten punkt dotyczy okna systemowego i tylko jego, co warto
    zapisać, żeby nikt nie uznał zmiany za nieskuteczną, widząc taki
    przycisk gdzie indziej.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", but I mark this change as felt, because it
    is visible in a window people know.

    The button disappears. Anybody who types long passwords and does not use
    a password manager loses the only way of checking they have not mistyped
    - and a mistake will end in a second attempt rather than a correction.
    That is the whole effect and it is real, though small.

    It is worth noticing, though, that the right answer to that inconvenience
    is pasting the password from a manager rather than looking at it on
    screen. The item does not block pasting in any way.

    What this does not break: signing in, giving credentials, the system
    remembering passwords, authentication in any form. It also changes
    nothing in the windows of applications that draw their own password field
    - and there are plenty of those. This item concerns the system window and
    only it, which is worth recording so nobody judges the change ineffective
    on seeing such a button elsewhere.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Przycisk pokazujący wpisywane hasło znika z okien systemowych podawania poświadczeń
      - Kto wpisuje długie hasła bez menedżera, traci sposób sprawdzenia pomyłki — poprawka zmienia się w drugie podejście
      - Wklejanie hasła z menedżera nie jest w żaden sposób blokowane i jest właściwym rozwiązaniem tej niedogodności
      - Aplikacje rysujące własne pole hasła zachowują swój przycisk — punkt dotyczy okna systemowego i tylko jego
    en:
      - The button revealing a typed password disappears from the system credential windows
      - Anybody typing long passwords without a manager loses the way of spotting a mistype - a correction becomes a second attempt
      - Pasting a password from a manager is not blocked in any way and is the right answer to that inconvenience
      - Applications that draw their own password field keep their button - this item concerns the system window and only it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym ludzie wpisują długie hasła bez menedżera haseł i podnosi to liczbę blokad kont
    en:
      - The machine is a terminal server where people type long passwords without a password manager and this raises the number of locked accounts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
      $name = 'DisablePasswordReveal'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    $name = 'DisablePasswordReveal'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Work on a server happens through a remote session or a virtual console -
    # a screen that gets shared and recorded by privileged session logging - and
    # the password typed there is usually a privileged one. Pasting from a
    # password manager stays available.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordReveal' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-credentialsui

notes:
  pl: |
    Hasło pokazane na ekranie przestaje być chronione przez cokolwiek
    technicznego — nie chroni go szyfrowanie ani polityka, tylko to, kto
    w danej chwili patrzy na ekran.

    Na serwerze hasło wpisywane w okno poświadczeń to zwykle hasło konta
    o wysokich uprawnieniach: konta usługi, administratora domeny,
    poświadczeń do udziału. Długie i wpisywane rzadko, czyli dokładnie
    takie, przy których pokusa naciśnięcia przycisku jest największa.

    Kontekst serwerowy: praca odbywa się przez sesję zdalną albo konsolę
    maszyny wirtualnej — ekran, który bywa współdzielony przy rozwiązywaniu
    problemu i nagrywany przez systemy rejestrujące sesje uprzywilejowane.
  en: |
    A password shown on screen stops being protected by anything technical -
    not by encryption and not by policy, only by who happens to be looking at
    the screen.

    On a server the password typed into a credential window is usually that
    of a highly privileged account: a service account, a domain
    administrator, credentials for a share. Long and typed rarely, which is
    exactly when the temptation to press the button is greatest.

    The server context: work happens through a remote session or a virtual
    machine's console - a screen that gets shared while a problem is being
    solved and recorded by systems that log privileged sessions.
