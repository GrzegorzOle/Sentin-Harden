id: win11-block-microsoft-accounts

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Logowanie kontem Microsoft zablokowane
    en: Signing in with a Microsoft account blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Konto Microsoft wiąże logowanie do firmowej maszyny z kontem prywatnym,
    którego organizacja nie kontroluje: nie ustala dla niego polityki haseł, nie
    wyłączy go przy odejściu pracownika i nie dowie się, że hasło wyciekło.
    Odzyskanie takiego konta odbywa się poza organizacją, przez procedurę
    dostawcy usługi.

    Zablokowanie tej drogi sprawia, że dostęp do maszyny opiera się wyłącznie na
    kontach, które organizacja potrafi wyłączyć i rozliczyć. Przy okazji
    rozłącza synchronizację ustawień i zawartości z chmurą prywatną, co bywa
    osobnym powodem tej zmiany.
  en: |
    A Microsoft account ties sign-in on a company machine to a private account
    the organisation does not control: it sets no password policy for it, cannot
    disable it when an employee leaves, and will not learn that its password has
    leaked. Recovering such an account happens outside the organisation, through
    the provider's procedure.

    Blocking that route makes access to the machine rest only on accounts the
    organisation can disable and account for. It also disconnects the
    synchronisation of settings and content with a private cloud, which is
    sometimes a separate reason for the change.

disruption_description:
  pl: |
    To zmiana o najwyższym potencjale zablokowania człowieka na jego własnej
    maszynie. Jeśli ktokolwiek loguje się tu kontem Microsoft, po tej zmianie
    i ponownym uruchomieniu nie wejdzie — a naprawa wymaga zalogowania, czyli
    dokładnie tego, czego zabraknie.

    Poza tym skutki są rozległe, choć mniej dramatyczne: rozłącza się
    synchronizacja ustawień między urządzeniami, sklep może zażądać ponownego
    logowania, a prywatna przestrzeń dyskowa w chmurze przestanie się łączyć.
    Wdrożenie ma sens dopiero po założeniu kont lokalnych albo domenowych
    i przeniesieniu na nie pracy.
  en: |
    This is the change with the highest potential for locking a person out of
    their own machine. If anyone signs in here with a Microsoft account, after
    this change and a restart they will not get in - and the repair requires a
    sign-in, which is exactly what will be missing.

    Beyond that the consequences are broad if less dramatic: settings
    synchronisation between devices is disconnected, the store may ask for a
    fresh sign-in, and private cloud storage stops connecting. The rollout makes
    sense only after local or domain accounts exist and work has been moved onto
    them.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - updates-and-servicing
  what_breaks:
    pl:
      - Osoby logujące się kontem Microsoft nie zalogują się po ponownym uruchomieniu maszyny
      - Synchronizacja ustawień i haseł między urządzeniami użytkownika przestanie działać
      - Prywatna przestrzeń dyskowa w chmurze i sklep mogą zażądać ponownego logowania bez możliwości jego wykonania
    en:
      - People signing in with a Microsoft account cannot sign in after the machine restarts
      - Synchronisation of settings and passwords between the user's devices stops working
      - Private cloud storage and the store may ask for a fresh sign-in with no way to complete it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktokolwiek loguje się na tej maszynie kontem Microsoft i nie ma konta zastępczego
      - Stanowisko jest komputerem prywatnym pracownika, na którym konto Microsoft jest kontem właściciela
    en:
      - Anyone signs in on this machine with a Microsoft account and has no replacement account
      - The station is an employee's private computer where the Microsoft account belongs to the owner
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'NoConnectedUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'NoConnectedUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    $connected = @(Get-LocalUser | Where-Object {
      $_.Enabled -and $_.PrincipalSource -eq 'MicrosoftAccount'
    })
    [pscustomobject]@{
      path              = $path
      name              = $name
      value             = $current
      existed           = ($null -ne $current)
      connected_accounts = @($connected | ForEach-Object { $_.Name })
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}. Enabled Microsoft accounts found: $($connected.Count)"

  change_command: |
    $connected = @(Get-LocalUser -ErrorAction Stop | Where-Object {
      $_.Enabled -and $_.PrincipalSource -eq 'MicrosoftAccount'
    })
    if ($connected.Count -gt 0) {
      throw "Enabled Microsoft accounts on this machine: $($connected.Name -join ', '). Blocking sign-in would lock them out - refusing."
    }
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'NoConnectedUser' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-block-microsoft-accounts

notes:
  pl: |
    Polecenie zmiany sprawdza najpierw, czy na maszynie istnieje włączone konto
    powiązane z kontem Microsoft, i odmawia wykonania, jeśli tak. To drugi po
    wyłączeniu konta wbudowanego punkt, który potrafi zatrzymać sam siebie —
    z tego samego powodu: skutkiem błędu byłby brak możliwości zalogowania,
    a wycofanie wymaga zalogowania.

    Kopia zapasowa zapisuje nazwy znalezionych kont, więc po fakcie wiadomo,
    czego zmiana dotyczyła.
  en: |
    The change command first checks whether an enabled account linked to a
    Microsoft account exists on the machine and refuses to run if so. This is
    the second item after disabling the built-in account that can stop itself -
    for the same reason: the result of a mistake would be an inability to sign
    in, and the rollback requires a sign-in.

    The backup records the names of the accounts found, so it is clear
    afterwards what the change concerned.
