id: win10-domain-secure-channel-signed-or-sealed

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera zawsze podpisany lub zaszyfrowany
    en: The secure channel to the controller always signed or encrypted
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby ruch w kanale, którym maszyna rozmawia
    z kontrolerem domeny o swoim koncie, zawsze był podpisany albo
    zaszyfrowany — i żeby maszyna odmówiła rozmowy, gdy ochrony ustalić
    się nie da.

    Kanał ten jest osobną rzeczą od logowania użytkownika. Maszyna
    przyłączona do domeny ma własne konto i własne hasło, którym stale
    potwierdza kontrolerowi, kim jest. Tym samym kanałem idą zapytania
    o konta, o zasady i o zmiany hasła maszyny.

    Bez ochrony ruch ten można odczytać i zmienić po drodze. Napastnik
    w środku tej rozmowy dostaje wgląd w dane o kontach i możliwość
    ingerencji w to, co maszyna o nich słyszy — a przy sprzyjających
    okolicznościach także w hasło konta maszyny.

    Rzecz warta odnotowania: dwa ustawienia sąsiednie mówią o podpisywaniu
    i szyfrowaniu, gdy druga strona to potrafi. To ustawienie mówi
    „zawsze" i dopiero ono decyduje, bo tamte pozwalają rozmowę bez ochrony
    kontynuować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wgląd
    w rozmowę maszyny z kontrolerem o kontach i zasadach oraz możliwość jej
    zmiany po drodze.
  en: |
    The setting calls for the traffic in the channel by which the machine speaks with a domain controller about
    its own account always to be signed or encrypted - and for the machine to refuse the conversation where no
    guard can be settled upon.

    That channel is a thing apart from a user's logging on. A machine joined to a domain has an account and a
    password of its own, by which it keeps confirming to the controller who it is. By that same channel go
    queries about accounts, about policies and about changes to the machine's password.

    Without a guard that traffic can be read and changed on the way. An attacker in the middle of the
    conversation gets a sight of data about accounts and the means of meddling with what the machine hears of
    them - and, where circumstances favour it, with the machine account's password as well.

    A thing worth noting: two neighbouring settings speak of signing and of encrypting where the other side can.
    This setting says "always", and only it settles the matter, those others letting a conversation without a
    guard go on.

    What an attacker gains while the item goes unmet: a sight of the machine's conversation with the controller
    about accounts and policies, and the means of changing it on the way.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na maszynie w domenie współczesnej
    zmiana jest niewidoczna.

    Wszystkie kontrolery wspierane od lat wymagają tej ochrony same z siebie
    i rozmawiają nią zawsze. Sprawdzić trzeba, czy w domenie nie pozostał
    kontroler bardzo stary albo maszyna z implementacją obcą, udającą
    kontroler na potrzeby oprogramowania branżowego.

    Jeśli taki układ istnieje, maszyna po zmianie przestanie się z nim
    porozumiewać. Skutek jest wtedy poważny i widoczny: logowanie kontami
    domenowymi na tej maszynie przestanie dochodzić do skutku, a zasady
    przestaną się pobierać.

    Poza domeną ustawienie nie robi nic, bo kanału takiego nie ma wcale.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: logowania kontami lokalnymi, udziałów plikowych,
    drukowania, aplikacji, sieci, usług systemowych.
  en: |
    The class is "needs review", though on a machine in a present-day domain the change is unseen.

    Every supported controller has for years called for that guard of itself and speaks by it always. What has
    to be reviewed is whether there remains in the domain a very old controller, or a machine with a foreign
    implementation standing in for a controller on behalf of trade software.

    Where such an arrangement is, the machine will after the change cease coming to an understanding with it.
    The consequence is then grave and plain to see: logging on by domain accounts upon this machine will cease
    coming about, and policies will cease being fetched.

    Outside a domain the setting does nothing, there being no such channel at all.

    The change takes hold at once and undoes itself at once.

    What this does not break: logging on by local accounts, file shares, printing, applications, the network, or
    system services.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - network-and-firewall
    - encryption-and-tls
  what_breaks:
    pl:
      - Kontroler bardzo stary albo maszyna udająca kontroler przestaje porozumiewać się z tą maszyną
      - Logowanie kontami domenowymi przestaje dochodzić do skutku, gdy taki kontroler jest jedynym osiągalnym
      - Zasady domenowe przestają się pobierać, bo idą tym samym kanałem
      - Poza domeną ustawienie nie robi nic, bo kanału takiego nie ma wcale
      - Logowanie kontami lokalnymi, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A very old controller, or a machine standing in for one, ceases coming to an understanding with this machine
      - Logging on by domain accounts ceases coming about where such a controller is the only one to be reached
      - Domain policies cease being fetched, going as they do by that same channel
      - Outside a domain the setting does nothing, there being no such channel at all
      - Logging on by local accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W domenie pozostaje kontroler nieobsługujący podpisywania ani szyfrowania tego kanału
      - Rolę kontrolera pełni implementacja obca, wniesiona na potrzeby oprogramowania branżowego
    en:
      - There remains in the domain a controller serving neither the signing nor the encrypting of that channel
      - The controller's part is taken by a foreign implementation brought in on behalf of trade software
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'RequireSignOrSeal'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'RequireSignOrSeal'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the domain still holds a controller unable to guard this channel, the
    # machine will cease speaking with it and domain logons will stop. Establish
    # that first.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSignOrSeal' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-encrypt-or-sign-secure-channel-data-always

notes:
  pl: |
    Reguła otwiera rodzinę czterech o kanale do kontrolera i jest w niej tą
    rozstrzygającą. Dwie następne mówią „gdy druga strona to potrafi",
    a więc dopuszczają rozmowę bez ochrony; ta jedna mówi „zawsze".

    Warto, żeby aplikacja pokazała tę czwórkę razem i powiedziała wprost,
    która z nich decyduje. Bez tego użytkownik zobaczy cztery pozycje
    wyglądające na warianty tej samej rzeczy i nie odróżni wymagania od
    zezwolenia.

    Odnotowuję rozróżnienie łatwe do przeoczenia: kanał ten nie ma nic
    wspólnego z logowaniem użytkownika. Dotyczy konta samej maszyny, jej
    hasła i tego, co maszyna słyszy od kontrolera o kontach i zasadach.
    Opis powinien to powiedzieć na początku, bo inaczej reguła bywa czytana
    jako jeszcze jedno ustawienie o hasłach ludzi.
  en: |
    The rule opens a family of four about the channel to the controller and is the deciding one in it. The two
    that follow say "where the other side can", and so allow a conversation without a guard; this one says
    "always".

    It is well that the application show the four together and say outright which of them settles the matter.
    Without that the user will see four entries looking like variants of one thing and will not part a
    requirement from a leave.

    I set down a parting easily missed: that channel has nothing to do with a user's logging on. It touches the
    machine's own account, its password, and what the machine hears from the controller about accounts and
    policies. The description ought to say so at the outset, or else the rule gets read as one more setting
    about people's passwords.
