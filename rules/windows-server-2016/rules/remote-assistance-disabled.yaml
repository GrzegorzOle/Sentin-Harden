id: win2016-remote-assistance-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Assistance
  title:
    pl: Pomoc zdalna wyłączona
    en: Remote Assistance disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm pomocy zdalnej, czyli drogę, którą ktoś
    z zewnątrz ogląda i przejmuje pulpit maszyny na zaproszenie osoby przy
    niej siedzącej.

    Mechanizm różni się od pulpitu zdalnego jedną rzeczą, która przesądza
    o wadze tego punktu: dostęp nie opiera się na koncie i haśle, tylko na
    zaproszeniu. Zaproszenie jest plikiem albo ciągiem znaków przekazywanym
    dowolnym kanałem — pocztą, komunikatorem, przez telefon. Kto je ma, ten
    wchodzi.

    Powierzchnia ataku jest przez to innego rodzaju niż przy logowaniu.
    Zaproszenie da się przechwycić w drodze, bo idzie kanałem zwykle
    nieszyfrowanym i nierozliczanym. Da się też o nie poprosić: telefon
    z prośbą o pomoc w imieniu działu technicznego kończy się tym, że osoba
    przy maszynie sama wystawia zaproszenie i sama je podaje. Nie ma tu
    hasła do złamania, więc nie ma też niczego, co by takiej rozmowie
    przeszkodziło.

    Na serwerze mechanizm ten jest ponadto bezużyteczny w sposób, który
    warto nazwać. Pomoc zdalna wymaga kogoś siedzącego przy maszynie
    i wystawiającego zaproszenie, a przy serwerze nikt nie siedzi. Zostaje
    więc włączona droga bez zastosowania — koszt bez korzyści.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    pulpitu maszyny opartą na zaproszeniu, a nie na koncie — możliwą do
    przechwycenia w drodze albo wyproszenia rozmową.
  en: |
    The setting switches off the remote assistance mechanism, which is to say the
    road by which somebody outside watches and takes over a machine's desktop at the
    invitation of the person sitting at it.

    The mechanism differs from the remote desktop in one thing that settles this
    item's weight: the access rests not on an account and a password but on an
    invitation. The invitation is a file or a string of characters passed by any
    channel at all - mail, a messenger, over the telephone. Whoever has it gets in.

    The surface of attack is thereby of a different kind than at sign-in. The
    invitation can be caught in transit, since it goes by a channel as a rule
    unencrypted and unaccounted for. It can also be asked for: a telephone call
    asking for help on behalf of the technical department ends with the person at
    the machine issuing an invitation themselves and giving it away themselves.
    There is no password to break here, so there is nothing to get in such a
    conversation's way either.

    On a server the mechanism is besides useless in a way worth naming. Remote
    assistance calls for somebody sitting at the machine and issuing an invitation,
    and nobody sits at a server. What is left switched on is a road with no use - a
    cost without a benefit.

    What an attacker gains while the item goes unmet: a road to the machine's
    desktop resting on an invitation rather than an account - one that can be caught
    in transit or talked out of somebody.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze zmiana jest w ogromnej
    większości przypadków bez żadnego skutku.

    Sprawdzić trzeba, czy ktokolwiek używa pomocy zdalnej do tej maszyny.
    Na serwerze zwykle nie używa nikt, bo mechanizm wymaga osoby przy
    maszynie, a przy serwerze takiej osoby nie ma. Wyjątki dotyczą maszyn
    pełniących rolę mieszaną — serwerów aplikacyjnych, przy których ktoś
    pracuje z konsoli, oraz stanowisk zarządzania zbudowanych na systemie
    serwerowym.

    Osobno stoją działy wsparcia korzystające z pomocy zdalnej jako
    podstawowego narzędzia. Tam zmiana jest odczuwalna i wymaga wskazania
    zastępstwa — zwykle jest nim pulpit zdalny z właściwym uwierzytelnieniem
    albo narzędzie wsparcia z własnym mechanizmem dostępu. Obie drogi są
    lepsze, bo opierają się na koncie, a nie na zaproszeniu.

    Objaw jest jednoznaczny: prośba o pomoc nie tworzy zaproszenia, a strona
    pomagająca nie może się połączyć.

    Czego to nie psuje: pulpitu zdalnego, zarządzania przez powłokę zdalną,
    konsoli lokalnej, narzędzi wsparcia mających własny mechanizm dostępu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though on a server the change is in the vast
    majority of cases of no effect at all.

    What has to be checked is whether anybody uses remote assistance to this
    machine. On a server as a rule nobody does, since the mechanism calls for a
    person at the machine and at a server there is no such person. The exceptions
    concern machines of mixed role - application servers somebody works at from the
    console, and management workstations built on a server system.

    Support departments using remote assistance as their chief tool stand apart.
    There the change is felt and calls for a substitute to be named - as a rule the
    remote desktop with proper authentication, or a support tool with an access
    mechanism of its own. Both roads are better, since they rest on an account
    rather than an invitation.

    The symptom is unambiguous: a request for help creates no invitation, and the
    helping side cannot connect.

    What this does not break: the remote desktop, management through a remote shell,
    the local console, or support tools having an access mechanism of their own.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Prośba o pomoc zdalną nie tworzy zaproszenia i strona pomagająca nie może połączyć się z pulpitem tej maszyny
      - Dział wsparcia korzystający z pomocy zdalnej jako podstawowego narzędzia musi przejść na pulpit zdalny z właściwym uwierzytelnieniem
      - Serwery aplikacyjne, przy których ktoś pracuje z konsoli, tracą drogę szybkiego pokazania ekranu osobie pomagającej
      - Pulpit zdalny, zarządzanie przez powłokę zdalną i narzędzia wsparcia z własnym mechanizmem dostępu pozostają bez zmian
    en:
      - A request for remote assistance creates no invitation and the helping side cannot connect to this machine's desktop
      - A support department using remote assistance as its chief tool must move to the remote desktop with proper authentication
      - Application servers somebody works at from the console lose the road of quickly showing their screen to a helper
      - The remote desktop, management through a remote shell and support tools with an access mechanism of their own stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wsparcie dla tej maszyny opiera się na pomocy zdalnej i nie wskazano narzędzia zastępczego opartego na koncie
      - Maszyna pełni rolę mieszaną i osoby pracujące przy niej z konsoli korzystają z pomocy zdalnej przy zgłoszeniach
    en:
      - Support for this machine rests on remote assistance and no substitute tool resting on an account has been named
      - The machine is of mixed role and the people working at it from the console use remote assistance when raising tickets
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $name = 'fAllowToGetHelp'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
    $name = 'fAllowToGetHelp'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fAllowToGetHelp' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt jest jednym z niewielu, przy których uzasadnienie na serwerze jest
    mocniejsze niż na stanowisku. Na stanowisku pomoc zdalna bywa realnie
    używana i odpuszczenie punktu bywa decyzją poprawną. Na serwerze
    mechanizm nie ma zastosowania, bo nie ma przy nim człowieka, który
    wystawiłby zaproszenie — a droga zostaje otwarta.

    Różnica między dostępem opartym na koncie a opartym na zaproszeniu
    powinna być widoczna w interfejsie, bo to ona wyjaśnia kategorię ryzyka.
    Bez niej punkt wygląda na wyłączanie funkcji pomocniczej, a nie na
    zamknięcie drogi omijającej logowanie.

    Reguła ma drugą połowę: osobny punkt blokuje pomoc zdalną oferowaną bez
    zaproszenia, czyli wariant, w którym to pomagający inicjuje połączenie.
    Ten punkt zamyka drogę proszoną, tamten nieproszoną, i obie warto wdrażać
    razem.
  en: |
    The item is one of the few where the case on a server is stronger than on a
    workstation. On a workstation remote assistance is at times really used and
    letting the item go is at times the right decision. On a server the mechanism
    has no use, since there is no person at it to issue an invitation - and the road
    stays open.

    The difference between access resting on an account and access resting on an
    invitation should be visible in the interface, since it is what explains the
    risk category. Without it the item looks like the switching off of a helper
    feature rather than the shutting of a road going round sign-in.

    The rule has a second half: a separate item blocks remote assistance offered
    without an invitation, which is to say the variant in which it is the helper who
    starts the connection. This item shuts the asked-for road, that one the
    unasked-for, and both are worth rolling out together.
