id: win2016-ssdp-discovery-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa wykrywania urządzeń w sieci lokalnej wyłączona
    en: The local network device discovery service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę odnajdującą w sieci lokalnej urządzenia,
    które same się ogłaszają.

    Mechanizm ten pochodzi z sieci domowej i taki ma charakter. Urządzenia
    rozgłaszają w segmencie sieci, czym są i co potrafią; maszyna słucha
    tych ogłoszeń i buduje z nich listę dostępnych drukarek, odtwarzaczy,
    bram i udostępnień.

    Słuchanie to jest jednak czynnością dwustronną. Usługa przyjmuje
    ogłoszenia od wszystkiego, co je wyśle, i przetwarza ich treść — a treść
    tę w całości układa nadawca. Kod przetwarzający dane z nieuwierzytelnionego
    źródła w segmencie sieci jest dokładnie tym, czego na serwerze być nie
    powinno.

    Dochodzi do tego druga rzecz: ogłoszenia niosą adresy, pod które maszyna
    sięgnie po dalszy opis. Przyjęcie ogłoszenia jest więc również
    przyjęciem polecenia, dokąd się połączyć.

    Na serwerze usługa ta nie ma żadnego zastosowania. Serwer nie szuka
    odtwarzaczy multimedialnych ani bram domowych, a drukarki dostaje
    z zasad grupy albo od administratora.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kod
    przetwarzający jego dane na serwerze, wywoływany samym rozgłoszeniem
    w segmencie sieci, bez uwierzytelnienia i bez niczyjej zgody.
  en: |
    The setting switches off the service finding on the local network devices that
    announce themselves.

    That mechanism comes from the home network and is of that character. Devices
    broadcast into a network segment what they are and what they can do; the machine
    listens to those announcements and builds from them a list of available printers,
    media players, gateways and shares.

    That listening is a two-sided act all the same. The service takes in announcements
    from everything that sends them and works on their contents - and those contents
    are composed wholly by the sender. Code working on data from an unauthenticated
    source in a network segment is exactly what should not be on a server.

    A second thing follows: the announcements carry addresses the machine will reach
    for a further description. Taking in an announcement is therefore also taking in a
    command about where to connect.

    On a server the service has no use at all. A server looks for no media players and
    no home gateways, and gets its printers from group policy or from an
    administrator.

    What an attacker gains while the item goes unmet: code working on their data on a
    server, called by a broadcast into a network segment alone, without authentication
    and without anybody's consent.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Usługa na serwerze nie jest do niczego używana. Nie zależy od niej
    żaden mechanizm systemowy, żadna rola serwerowa ani żadne
    uwierzytelnianie. Na części wydań serwerowych jest domyślnie
    zatrzymana, a na części nie instalowana w ogóle.

    Sprawdzić warto jedną rzecz i jest ona wąska: czy ktoś dodaje na tej
    maszynie drukarki, odnajdując je w sieci. Po wdrożeniu odnajdywanie
    przestanie działać, a drukarkę trzeba będzie wskazać adresem. Na
    serwerze zdarza się to rzadko, a drukarki i tak zwykle przychodzą
    z zasad grupy.

    Wyłączenie usługi wymaga jej zatrzymania, co trwa chwilę i niczego
    w tym czasie nie przerywa, bo nic z niej nie korzysta.

    Czego to nie psuje: drukowania na drukarkach już dodanych, sieci,
    dostępu do plików, logowania, usług serwerowych.
  en: |
    The class is "no disruption".

    The service is used for nothing on a server. No system mechanism depends on it, no
    server role and no authentication. On some server releases it is stopped by
    default, and on some not installed at all.

    One thing is worth checking and it is narrow: whether anybody adds printers on this
    machine by finding them on the network. After the rollout the finding will stop
    working and a printer will have to be named by address. On a server that happens
    rarely, and printers as a rule come from group policy anyway.

    Switching the service off calls for it to be stopped, which takes a moment and
    breaks off nothing in that time, nothing making use of it.

    What this does not break: printing on printers already added, the network, access
    to files, signing in, or server roles.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - printing
  what_breaks:
    pl:
      - Odnajdywanie drukarek i innych urządzeń ogłaszających się w sieci lokalnej przestanie działać na tej maszynie
      - Drukarkę trzeba będzie wskazać adresem zamiast wybierać z listy znalezionych
      - Drukowanie na drukarkach już dodanych pozostaje bez zmian
      - Sieć, dostęp do plików, logowanie i role serwerowe pozostają bez zmian
    en:
      - The finding of printers and other devices announcing themselves on the local network will stop working on this machine
      - A printer will have to be named by address instead of being picked from a list of found ones
      - Printing on printers already added stays unchanged
      - The network, access to files, signing in and server roles stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie dodaje się drukarki przez odnajdywanie ich w sieci lokalnej i nie ma innej drogi ich wskazania
    en:
      - Printers are added on the machine by finding them on the local network and there is no other road of naming them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'SSDPSRV' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Discovery of network devices from this machine stops - printers, media
    # players and gateways announcing themselves this way will not be found.
    Stop-Service -Name 'SSDPSRV' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SSDPSRV' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'SSDPSRV' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Punkt tworzy parę z regułą o udostępnianiu maszyny jako urządzenia
    sieciowego. Obie dotyczą tego samego rodzinnego mechanizmu i obie są
    w klasie bez uciążliwości, ale kierunek mają przeciwny: ta dotyczy
    słuchania, tamta ogłaszania się.

    Warto je wdrażać razem i pokazywać razem. Wyłączenie jednej przy
    zostawionej drugiej zostawia połowę mechanizmu czynną, a nie ma
    powodu, dla którego serwer miałby potrzebować którejkolwiek połowy.

    Audyt zwraca „nie dotyczy", gdy usługi nie ma w systemie. Na serwerze
    jest to sytuacja częsta i lepiej ją nazwać, niż zgłaszać jako
    niezgodność.
  en: |
    The item makes a pair with the rule about sharing the machine as a network device.
    Both concern the same family mechanism and both are of the class no disruption,
    but their direction is opposite: this one concerns listening, that one announcing
    oneself.

    They are worth rolling out together and showing together. Switching one off with
    the other left running leaves half the mechanism active, and there is no reason a
    server should need either half.

    The audit returns "not applicable" where the service is not in the system. On a
    server that is a frequent case and better named than reported as a
    non-compliance.
