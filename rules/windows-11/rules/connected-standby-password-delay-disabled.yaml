id: win11-connected-standby-password-delay-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Odroczenie żądania hasła po wybudzeniu z uśpienia wyłączone
    en: Delay of the password demand after waking from sleep switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera użytkownikowi możliwość wskazania, po jakim czasie od
    wybudzenia maszyna ma zażądać hasła — i przesądza, że żądanie pojawia się
    od razu.

    Mechanizm jest wygodny i właśnie dlatego bywa włączany. Maszyna uśpiona
    ze zamkniętą pokrywą budzi się często: w torbie, przy przenoszeniu
    między salami, przy podłączeniu ładowarki. Odroczenie sprawia, że krótkie
    wybudzenie nie kończy się ekranem logowania.

    Cena jest taka, że przez ten czas — u części użytkowników ustawiony na
    kilkanaście minut — maszyna stoi odblokowana dla każdego, kto podniesie
    pokrywę. Sesja jest otwarta, dokumenty otwarte, poczta zalogowana,
    zapisane hasła osiągalne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno, w którym
    dostęp fizyczny do maszyny wystarcza do pracy na cudzym koncie, bez
    znajomości hasła. Jest to sytuacja zwykła w podróży, w hotelu, w biurze
    współdzielonym i na spotkaniu — czyli dokładnie tam, gdzie maszyna
    przenośna bywa zostawiona bez opieki.

    Dodatkowo ustawienie jest z natury niezależne od tego, co postanowił
    administrator, bo dotąd wybierał je użytkownik. Zabranie tego wyboru
    czyni czas do zablokowania wielkością przewidywalną.
  en: |
    The setting takes from the user the means of naming how long after waking the machine
    is to demand a password - and settles that the demand appears at once.

    The mechanism is convenient and for that very reason is sometimes switched on. A
    machine asleep with the lid closed wakes often: in a bag, while being carried between
    rooms, on a charger being plugged in. The delay means a short waking does not end at a
    sign-in screen.

    The price is that for that time - with some users set to a good many minutes - the
    machine stands unlocked for anyone who lifts the lid. The session is open, documents
    are open, mail is signed in, saved passwords are within reach.

    What an attacker gains while the item goes unmet: a window in which physical access to
    the machine suffices for working on somebody else's account, with no knowledge of the
    password. It is an ordinary situation while travelling, in a hotel, in a shared office
    and at a meeting - that is, exactly where a portable machine is sometimes left
    unattended.

    Besides that the setting is by its nature independent of what the administrator decided,
    since until now the user chose it. Taking that choice away makes the time to locking a
    foreseeable quantity.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ludzie w organizacji korzystają z maszyn
    przenośnych usypianych i wybudzanych wiele razy dziennie — bo tam
    odroczenie bywa ustawione świadomie i jego zabranie jest odczuwalne.

    Skutek jest natychmiastowy i widoczny: po każdym wybudzeniu pojawia się
    ekran logowania. Dla osoby, która w ciągu dnia otwiera i zamyka pokrywę
    kilkanaście razy, oznacza to kilkanaście logowań więcej.

    Na stanowisku stacjonarnym zmiana jest niewidoczna, bo mechanizm dotyczy
    urządzeń obsługujących uśpienie z zachowaniem łączności.

    Odczucie bywa gorsze, niż wynika z opisu, i warto to powiedzieć wprost:
    to nie jest zmiana obojętna dla codziennej pracy. Jest to jednak dokładnie
    ten rodzaj niewygody, który wymienia się na dostępność sesji dla osoby
    postronnej — i dlatego decyzję trzeba podjąć świadomie, a nie
    przy okazji.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether people in the organisation use portable machines put to
    sleep and woken many times a day - since there the delay is sometimes set knowingly and
    its removal is felt.

    The effect is immediate and visible: after every waking a sign-in screen appears. For
    someone who opens and closes the lid a good many times in a day, that means a good many
    more sign-ins.

    At a stationary station the change is invisible, since the mechanism concerns devices
    supporting sleep with connectivity kept.

    The feeling is sometimes worse than the description suggests, and it is worth saying so
    outright: this is not a change indifferent to daily work. It is, however, exactly the
    kind of inconvenience traded for a session's availability to a bystander - and so the
    decision has to be taken knowingly rather than in passing.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Po każdym wybudzeniu maszyny pojawia się ekran logowania bez zwłoki
      - Użytkownik traci możliwość ustawienia własnego opóźnienia w ustawieniach systemu
      - Praca na maszynie przenośnej otwieranej wiele razy dziennie staje się mniej wygodna
      - Na stanowisku stacjonarnym zmiana jest niewidoczna
    en:
      - After every waking of the machine a sign-in screen appears with no delay
      - The user loses the means of setting their own delay in the system settings
      - Work on a portable machine opened many times a day becomes less convenient
      - At a stationary station the change is invisible
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje w pomieszczeniu o kontrolowanym dostępie, a wybudzenia są bardzo częste
    en:
      - The machine works in a room with controlled access and wakings are very frequent
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDomainDelayLock'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $current = (Get-ItemProperty -Path $path -Name 'AllowDomainDelayLock' -ErrorAction SilentlyContinue).'AllowDomainDelayLock'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowDomainDelayLock'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainDelayLock' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby

notes:
  pl: |
    Nazwa wartości mówi o zezwoleniu, a nie o zakazie, więc stanem zgodnym
    jest zero. Jedynka zostawiałaby wybór użytkownikowi, czyli utrzymywała
    stan sprzed zmiany.

    Reguła dotyczy urządzeń obsługujących uśpienie z zachowaniem łączności.
    Na maszynie bez tej obsługi ustawienie nie ma nic do zrobienia, ale warto
    je zapisać — sprzęt bywa wymieniany, a zasada zostaje.

    Punkt bywa mylony z osobnym ustawieniem żądającym hasła po wybudzeniu
    z planu zasilania. Tamto rozstrzyga, czy hasło jest wymagane w ogóle; to
    rozstrzyga, po jakim czasie, i kto o tym decyduje. Obydwa są potrzebne.

    Klucz jest wspólny z innymi ustawieniami systemowymi — wycofanie usuwa
    wyłącznie tę wartość.
  en: |
    The value's name speaks of an allowance rather than a ban, and so the compliant state
    is zero. A one would leave the choice with the user, that is, keep the state from
    before the change.

    The rule concerns devices supporting sleep with connectivity kept. On a machine without
    that support the setting has nothing to do, but it is worth recording - hardware is
    sometimes replaced and the policy remains.

    The item is sometimes confused with a separate setting demanding a password on waking
    from a power plan. That one settles whether a password is demanded at all; this one
    settles after how long, and who decides it. Both are needed.

    The key is shared with other system settings - a rollback removes that value alone.
