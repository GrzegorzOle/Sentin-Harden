id: win2025-lm-hash-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie skrótu LAN Manager wyłączone
    en: LAN Manager hash storage disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy przy każdej zmianie hasła system zapisuje
    obok skrótu współczesnego również skrót w postaci starej.

    Postać stara ma wadę, której nie da się naprawić. Hasło jest w niej
    zamieniane na wielkie litery, dzielone na dwie połowy po siedem
    znaków, a każda połowa przeliczana osobno. Znaczy to, że hasło
    czternastoznakowe broni się tak, jak dwa hasła siedmioznakowe bez
    rozróżniania wielkości liter — czyli nie broni się wcale. Odtworzenie
    takiego hasła jest dziś kwestią minut, a nie wysiłku.

    Rzecz w tym, że skrót ten zapisywany jest zawsze, niezależnie od
    tego, czy cokolwiek go używa. Maszyna, która od lat uwierzytelnia
    wyłącznie mechanizmami nowszymi, może mimo to trzymać w bazie kont
    postać starą każdego hasła — i wtedy siła hasła jest pozorna, bo
    obok niego leży jego wersja słaba.

    Na serwerze rzecz waży nieporównanie więcej niż na stanowisku
    roboczym i z tego powodu oceniłem ten punkt wyżej niż w tamtej
    paczce. Na stanowisku roboczym w grze są hasła kont lokalnych.
    Na kontrolerze domeny w grze jest baza kont całej domeny — czyli
    hasła wszystkich ludzi i wszystkich kont usługowych naraz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: postać
    słabą każdego hasła zapisanego po włączeniu tego zachowania,
    a na kontrolerze domeny — postać słabą haseł całej domeny.
  en: |
    The setting settles whether, at every change of password, the system writes beside the
    present-day hash also a hash in the old form.

    The old form bears a flaw that cannot be mended. A password is in it turned to capitals,
    parted into two halves of seven marks, and each half reckoned apart. That means a password
    of fourteen marks defends itself as two passwords of seven without regard to letter case -
    that is, does not defend itself at all. The recovering of such a password is today a matter
    of minutes rather than of effort.

    The thing is that the hash is written always, whether anything uses it or not. A machine that
    has for years authenticated by newer mechanisms alone may nonetheless hold the old form of
    every password in its account base - and then a password's strength is only seeming, its
    weak version lying beside it.

    On a server the matter weighs beyond compare more than at a working station, and for that
    reason I rated this item higher than in that pack. At a working station the local accounts'
    passwords are in play. On a domain controller the whole domain's account base is in play -
    that is, the passwords of all the people and all the service accounts at once.

    What an attacker gains while the item goes unmet: the weak form of every password written
    after this behaviour was turned on, and on a domain controller the weak form of the whole
    domain's passwords.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z tym serwerem łączy się cokolwiek
    uwierzytelniającego się mechanizmem sprzed dwóch pokoleń systemu.

    W stanie domyślnym przechowywanie jest wyłączone na wszystkich
    współczesnych wersjach systemu, więc na większości serwerów naprawa
    nie zmienia niczego. Niezgodność bierze się z włączenia
    wprowadzonego kiedyś pod urządzenie, którego nie dało się wymienić.

    Przypadkiem do sprawdzenia są urządzenia sieciowe z oprogramowaniem
    wbudowanym: sterowniki maszyn, rejestratory, terminale przemysłowe
    i starsze urządzenia wielofunkcyjne. Część z nich uwierzytelnia się
    wyłącznie mechanizmem starym i po zmianie przestanie się łączyć.

    Objaw ujawnia się z opóźnieniem i to jest tutaj rzecz najważniejsza.
    Zmiana nie usuwa skrótów już zapisanych ani nie unieważnia haseł
    istniejących. Działa dopiero przy następnej zmianie hasła — czyli
    połączenia, o które się martwisz, będą działać jeszcze długo po
    naprawie, a przestaną wtedy, gdy nikt już nie będzie pamiętał
    o zmianie.

    Z tego wynika wskazówka praktyczna: sprawdzenia dokonuj przed
    zmianą, a nie po niej, bo brak objawu bezpośrednio po naprawie
    niczego nie dowodzi.

    Zmiana nie wymaga przerwy. Wyczyszczenie skrótów już zapisanych
    wymaga zmiany haseł wszystkich kont.
  en: |
    What needs checking is whether anything authenticating by a mechanism two generations of the
    system old connects to this server.

    In the default state the storing is off in every present-day version of the system, so on
    most servers the mending changes nothing. Non-compliance comes of a switching on brought in
    once for a device that could not be replaced.

    The cases to be checked are network devices with built-in software: machine controllers,
    recorders, industrial terminals and older multi-purpose devices. Some of them authenticate
    by the old mechanism alone and will stop connecting after the change.

    The symptom shows late, and that is here the weightiest matter. The change does not clear
    hashes already written and does not void standing passwords. It works only at the next
    change of a password - that is, the connections you worry about will work long after the
    mending and will stop when nobody remembers the change any more.

    Thence a practical pointer: make the check before the change rather than after, a want of
    symptom straight after the mending proving nothing.

    The change takes no break. The clearing of hashes already written takes a change of every
    account's password.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Urządzenia z oprogramowaniem wbudowanym uwierzytelniające się mechanizmem starym przestaną się łączyć
      - Objaw ujawnia się dopiero przy następnej zmianie hasła, więc bywa odroczony o miesiące
      - Zmiana nie usuwa skrótów już zapisanych ani nie unieważnia haseł istniejących
      - Wyczyszczenie postaci starej wymaga zmiany haseł wszystkich kont, nie samej naprawy
    en:
      - Devices with built-in software authenticating by the old mechanism will stop connecting
      - The symptom shows only at the next change of password, so it is at times months late
      - The change does not clear hashes already written and does not void standing passwords
      - Clearing the old form takes a change of every account's password, not the mending alone
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z serwerem łączą się urządzenia przemysłowe albo wielofunkcyjne uwierzytelniające się wyłącznie mechanizmem starym
      - Nie ustalono, czy w sieci pozostały urządzenia niepotrafiące uwierzytelnić się inaczej
    en:
      - Industrial or multi-purpose devices authenticating by the old mechanism alone connect to the server
      - It has not been settled whether devices unable to authenticate otherwise are left in the network
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'NoLMHash'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'NoLMHash'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'NoLMHash' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-do-not-store-lan-manager-hash-value-on-next-password-change

notes:
  pl: |
    Punkt podniosłem względem paczki stanowiska roboczego z ryzyka
    wysokiego na krytyczne. Powodem jest zasięg: na kontrolerze domeny
    w grze jest baza kont całej domeny, a nie jednej maszyny.

    Cofnięcie oznaczyłem jako trudne, i to w obie strony. Skróty
    zapisane przed naprawą nie znikną, dopóki hasła się nie zmienią —
    a skróty niezapisane po naprawie nie pojawią się z powrotem bez
    ponownej zmiany hasła.

    Z tego bierze się wskazówka praktyczna: sprawdzaj przed zmianą.
    Brak objawu bezpośrednio po naprawie niczego nie dowodzi, bo objaw
    pojawia się dopiero przy następnej zmianie hasła.
  en: |
    I raised the item from high risk to critical against the working station's pack. The reason
    is reach: on a domain controller the whole domain's account base is in play, not one
    machine's.

    I marked the undoing difficult, and so it is both ways. Hashes written before the mending
    will not go until the passwords change - and hashes not written after the mending will not
    come back without a further change of password.

    Thence the practical pointer: check before the change. A want of symptom straight after the
    mending proves nothing, the symptom coming only at the next change of password.
