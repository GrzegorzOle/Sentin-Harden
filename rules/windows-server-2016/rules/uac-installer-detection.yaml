id: win2016-uac-installer-detection

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Rozpoznawanie instalatorów i pytanie o uprawnienia
    en: Recognising installers and asking for rights
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza rozpoznawanie programów wyglądających na instalatory
    i zadawanie przy nich pytania o podniesienie uprawnień.

    Mechanizm jest prosty i warto powiedzieć wprost, na czym stoi. System
    patrzy na nazwę pliku, na jego opis i na to, co program robi na starcie,
    i na tej podstawie zgaduje, że ma do czynienia z instalatorem. Zgadywanie
    nie jest tu wadą, tylko jedynym dostępnym sposobem: starsze instalatory
    nie mówią systemowi, jakich uprawnień potrzebują, bo powstały, zanim
    istniał sposób, żeby to powiedzieć.

    Bez tego rozpoznawania taki instalator uruchamia się z uprawnieniami
    zwykłymi, część pracy wykonuje, a na pierwszej czynności wymagającej
    uprawnień kończy się błędem albo, co gorsza, kończy się bez błędu
    i zostawia instalację w połowie. Z rozpoznawaniem pytanie pada na
    początku, przed pierwszą zmianą w systemie.

    Na serwerze 2016 rzecz dotyczy głównie oprogramowania branżowego
    z czasów wdrożenia maszyny, bo to właśnie ono nie niesie informacji
    o wymaganych uprawnieniach.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    przeprowadzoną częściowo, bez pytania i bez śladu, w stanie trudnym do
    odróżnienia od poprawnego.
  en: |
    The item switches on the recognition of programs that look like installers
    and the raising of a question about elevation for them.

    The mechanism is simple and it is worth saying plainly what it rests on. The
    system looks at a file's name, at its description and at what the program
    does on startup, and on that basis guesses that it is dealing with an
    installer. The guessing is not a flaw here but the only available way: older
    installers do not tell the system what rights they need, because they were
    made before there was a way to say it.

    Without that recognition such an installer starts with ordinary rights, does
    part of its work, and at the first action needing rights ends in an error or,
    worse, ends without one and leaves the installation half done. With
    recognition the question comes at the start, before the first change to the
    system.

    On Server 2016 the matter concerns mainly line-of-business software from the
    time the machine was deployed, because that is precisely what carries no
    information about the rights it needs.

    What an attacker gains while the item goes unmet: an installation carried out
    partially, without a question and without a trace, in a state hard to tell
    from a correct one.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy instalacji wykonywanych
    bez obsługi.

    Po zmianie instalator rozpoznany jako instalator wywoła pytanie o zgodę.
    Człowiek przy konsoli odpowie. Skrypt wdrożeniowy uruchomiony przez
    harmonogram albo przez narzędzie zarządzające nie odpowie i zatrzyma się —
    a na serwerze to jest właśnie ten sposób, w jaki instaluje się większość
    rzeczy.

    Rozwiązanie polega na tym, żeby procedura wdrożeniowa podnosiła
    uprawnienia jawnie, zamiast liczyć na to, że dostanie je po drodze.
    Warto to poprawić przed zmianą, nie po pierwszym nieudanym wdrożeniu.

    Zdarza się też rozpoznanie fałszywe: program niebędący instalatorem,
    ale mający w nazwie słowo sugerujące instalację, zaczyna wywoływać
    pytanie. Jest to uciążliwe, ale nieszkodliwe, i bywa sygnałem, że nazwa
    narzędzia wymaga porządku.

    Czego to nie psuje: instalatorów niosących informację o wymaganych
    uprawnieniach — te zachowują się tak samo jak przedtem.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about installations carried
    out unattended.

    After the change an installer recognised as one will raise a question about
    consent. A person at the console will answer. A deployment script started by
    the scheduler or by a management tool will not, and will stop - and on a
    server that is precisely how most things get installed.

    The answer is for the deployment procedure to elevate explicitly rather than
    count on being given rights along the way. That is worth fixing before the
    change, not after the first failed rollout.

    False recognition happens too: a program that is not an installer but has a
    word suggesting installation in its name starts raising the question. That is
    a nuisance rather than a harm, and is sometimes a sign that the tool's name
    needs tidying.

    What this does not break: installers that do carry information about the
    rights they need - those behave exactly as before.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Instalacje uruchamiane przez harmonogram albo narzędzie zarządzające zatrzymują się na pytaniu o zgodę
      - Starsze instalatory branżowe zaczynają pytać o uprawnienia na starcie zamiast kończyć się błędem w połowie
      - Program o nazwie sugerującej instalację bywa rozpoznany fałszywie i również wywołuje pytanie
      - Instalatory niosące informację o wymaganych uprawnieniach zachowują się bez zmian
    en:
      - Installations started by the scheduler or a management tool stop at the question about consent
      - Older line-of-business installers start asking for rights at the outset instead of failing halfway
      - A program whose name suggests installation may be recognised falsely and raise the question too
      - Installers that carry information about the rights they need behave unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Oprogramowanie wdraża się na tej maszynie automatycznie, a procedura wdrożeniowa nie podnosi uprawnień jawnie
    en:
      - Software is deployed to this machine automatically and the deployment procedure does not elevate explicitly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableInstallerDetection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableInstallerDetection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Older installers do not say what rights they need, so the system guesses
    # from the name and the behaviour. Review the unattended deployments first -
    # a question asked there stops the procedure.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableInstallerDetection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-detect-application-installations-and-prompt-for-elevation

notes:
  pl: |
    Rozpoznawanie opiera się na przesłankach, a nie na deklaracji programu.
    Oznacza to, że bywa mylne w obie strony: instalator niewyglądający na
    instalator nie wywoła pytania, a narzędzie o mylącej nazwie wywoła je
    niepotrzebnie.

    Punkt jest bez znaczenia tam, gdzie oprogramowanie wdraża się wyłącznie
    narzędziem zarządzającym działającym na koncie systemowym — takie
    instalacje nie przechodzą przez ten mechanizm. Reguła i tak zostaje
    ustawiona, bo maszyna bywa obsługiwana ręcznie częściej, niż zakłada
    procedura.

    Wartość leży w kluczu wspólnym dla całej grupy kontroli uprawnień.
    Przy cofaniu usuwana jest wyłącznie ta jedna wartość.
  en: |
    Recognition rests on circumstantial signs rather than on a declaration by the
    program. That means it errs both ways: an installer that does not look like
    one raises no question, and a tool with a misleading name raises one
    needlessly.

    The item is of no consequence where software is deployed solely by a
    management tool running under the system account - such installations do not
    pass through this mechanism. The rule is set anyway, because a machine gets
    handled by hand more often than the procedure assumes.

    The value lies in a key shared by the whole rights-control group. Undoing
    removes this one value alone.
