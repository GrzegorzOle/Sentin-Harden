id: win2025-ntlm-session-security-client

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Minimalne zabezpieczenie sesji po stronie klienta
    en: Minimum session security on the client's side
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, jak mocno ma być chroniona sesja, którą ta maszyna
    nawiązuje starszym mechanizmem uwierzytelniania, i wymaga zarazem
    szyfrowania oraz podpisu opartego na współczesnej funkcji skrótu.

    Punkt odpowiada na inne pytanie niż poziom uwierzytelniania. Tamten
    mówi, którego mechanizmu wolno używać. Ten mówi, czego wymagać od
    mechanizmu, którego się używa — bo ten sam mechanizm da się zestawić
    w wariancie chroniącym sesję i w wariancie, który nie chroni jej
    w ogóle.

    Bez tego wymagania sesja bywa zestawiana bez szyfrowania i bez podpisu.
    Napastnik ustawiony po drodze odczytuje wtedy treść i może ją zmieniać,
    korzystając z uwierzytelnienia, które przeprowadził ktoś inny. Sama
    zgoda na słabszy wariant wystarcza: druga strona, jeśli jest pod
    kontrolą napastnika, po prostu poprosi o wariant najsłabszy, a ta
    maszyna się zgodzi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    obniżenia ochrony sesji przez samo poproszenie o to. Jest to jedna
    z tych sytuacji, w których zabezpieczenie istnieje, ale jest
    negocjowalne — a negocjuje je strona przeciwna.
  en: |
    The setting settles how strongly a session this machine sets up by the older
    authentication mechanism is to be guarded, and takes both encryption and a signature
    resting on a present-day digest function.

    The item answers a different question than the authentication level. That one says which
    mechanism may be used. This one says what to take from the mechanism being used - since
    that same mechanism can be set up in a variant guarding the session and in one that does
    not guard it at all.

    Without that demand a session is at times set up with no encryption and no signature. An
    attacker placed on the way then reads the contents and can change them, making use of an
    authentication somebody else carried out. The mere agreement to a weaker variant is
    enough: the other party, if under the attacker's control, will simply ask for the
    weakest variant, and this machine will agree.

    What an attacker gains while the item goes unmet: the means of lowering a session's
    protection by asking for it. It is one of those situations in which a safeguard exists
    but is negotiable - and it is negotiated by the opposing side.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, dokąd ten serwer sięga starszym mechanizmem
    uwierzytelniania — bo punkt dotyczy wyłącznie połączeń wychodzących.

    Zakres skutków jest przez to wąski. Psuje się połączenie tej maszyny do
    strony, która mocniejszego wariantu nie potrafi zestawić, a nie
    połączenia innych maszyn do tej.

    Stroną taką bywają starsze urządzenia udostępniające zasoby oraz
    implementacje protokołu plikowego spoza rodziny Windows w wersjach
    sprzed lat. Objawem jest odmowa przy nawiązywaniu połączenia, zwykle
    opisywana po stronie klienta jako błąd logowania.

    Wymagania są dwa i warto je rozróżniać przy rozpoznawaniu kłopotu:
    szyfrowanie sesji oraz podpis oparty na współczesnej funkcji skrótu.
    Starsza strona bywa w stanie spełnić jedno, ale nie drugie — i wtedy
    połączenia też nie będzie.

    Zmiana nie wymaga restartu, ale sesje już zestawione trwają
    do rozłączenia.
  en: |
    What needs checking is where this server reaches by the older authentication
    mechanism - since the item concerns outgoing connections alone.

    The reach of the effects is by that narrow. What breaks is this machine's connection to
    a party unable to set up the stronger variant, not other machines' connections to this
    one.

    Such a party is at times older devices sharing resources and implementations of the file
    protocol outside the Windows family in versions from years ago. The symptom is a refusal
    at the setting up of a connection, usually described on the client's side as a sign-in
    error.

    There are two demands and it is worth telling them apart when recognising trouble:
    encryption of the session and a signature resting on a present-day digest function. An
    older party is at times able to meet one but not the other - and then there will be no
    connection either.

    The change takes no restart, but sessions already set up last until they are
    disconnected.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - encryption-and-tls
  what_breaks:
    pl:
      - Połączenia do stron nieumiejących zestawić mocniejszego wariantu kończą się odmową
      - Odmowa jest po stronie klienta opisywana jako błąd logowania
      - Starsza strona bywa w stanie spełnić jedno wymaganie, ale nie oba naraz
      - Połączenia przychodzące do tej maszyny nie są tym punktem objęte
    en:
      - Connections to parties unable to set up the stronger variant end in a refusal
      - The refusal is described on the client's side as a sign-in error
      - An older party is at times able to meet one demand but not both at once
      - Connections coming into this machine are not taken in by this item
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer łączy się z urządzeniem nieumiejącym zestawić sesji szyfrowanej i podpisanej
    en:
      - The server connects to a device unable to set up an encrypted and signed session
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'NTLMMinClientSec'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '537395200'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $current = (Get-ItemProperty -Path $path -Name 'NTLMMinClientSec' -ErrorAction SilentlyContinue).'NTLMMinClientSec'
    [pscustomobject]@{
      path        = $path
      name        = 'NTLMMinClientSec'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # The value joins two demands set as bits: session encryption and a
    # signature resting on a present-day digest function.
    Set-ItemProperty -Path $path -Name 'NTLMMinClientSec' -Value 537395200 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-minimum-session-security-for-ntlm-ssp-based-including-secure-rpc-clients

notes:
  pl: |
    Wartość jest sumą bitów, nie liczbą porządkową, więc wynik zbliżony
    liczbowo nie oznacza konfiguracji zbliżonej. Porównanie jest dokładne
    właśnie dlatego, że sąsiednie wartości opisują zestawy wymagań
    zupełnie inne.

    Punkt ma bliźniaka po stronie serwerowej, w tym samym kluczu. Ten
    dotyczy sesji, które ta maszyna nawiązuje; tamten — sesji, które
    przyjmuje. Oba są potrzebne.

    Punkt czyta się razem z poziomem uwierzytelniania menedżera sieci.
    Tamten decyduje, czy starszego mechanizmu wolno użyć; ten — czego od
    niego wymagać, gdy już zostanie użyty. Spełnienie tylko jednego
    zostawia drogę otwartą.
  en: |
    The value is a sum of bits rather than an ordinal number, so a numerically near result
    does not mean a near configuration. The comparison is exact exactly because neighbouring
    values describe altogether different sets of demands.

    The item has a twin on the server's side, in the same key. This one concerns the
    sessions this machine sets up; that one the sessions it takes. Both are needed.

    The item is read together with the network manager authentication level. That one
    settles whether the older mechanism may be used; this one what to take from it once it
    is. Meeting only one leaves the road open.
