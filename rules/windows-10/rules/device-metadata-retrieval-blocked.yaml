id: win10-device-metadata-retrieval-blocked

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Blokada pobierania opisów urządzeń z internetu
    en: The drawing of descriptions of devices from the internet blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje pobierania z internetu opisów podłączanych
    urządzeń: nazw handlowych, ikon i zdjęć pokazywanych w oknie urządzeń.

    Mechanizm ten nie pobiera sterowników. Pobiera warstwę opisową, dzięki
    której drukarka pokazuje się pod nazwą modelu i ze zdjęciem zamiast
    pod oznaczeniem technicznym.

    Zastrzeżenie dotyczy nie treści, lecz samego zapytania. Żeby opis
    pobrać, maszyna musi powiedzieć, co do niej podłączono. Powstaje więc
    strumień informacji o sprzęcie maszyny, wysyłany przy każdym nowym
    urządzeniu i niezależny od tego, czy użytkownik opisu potrzebuje.

    Punkt jest oceniony nisko i tak trzeba go przedstawiać. Nie zamyka
    żadnej drogi wejścia i nie broni przed niczym konkretnym. Jest
    porządkiem: ogranicza to, co maszyna opowiada o sobie sama.

    Odnotowuję, że urządzenia działają bez zmian. Zmienia się wyłącznie
    to, jak są nazwane i pokazane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost
    — maszyna zgłasza na zewnątrz, jaki sprzęt do niej podłączono.
  en: |
    The setting forbids the drawing from the internet of descriptions of devices put in: names of trade, marks and
    pictures shown in the window of devices.

    That mechanism draws no drivers. It draws a layer of description, by which a printer shows itself under the
    name of its make and with a picture instead of under a marking of craft.

    The reservation touches not the content but the asking itself. To draw a description the machine must say what
    has been put into it. There arises therefore a stream of word about the machine's things, sent at every new
    device and not hanging upon whether the user needs the description.

    The item is graded low and is to be put forward as such. It shuts no road in and guards against nothing in
    particular. It is good order: it bounds what the machine tells of itself.

    I set down that the devices work unchanged. What changes is solely how they are named and shown.

    What an attacker gains while the item goes unmet: nothing outright - the machine gives out abroad what things
    have been put into it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana dotyczy wyłącznie warstwy opisowej. Drukarka drukuje, aparat
    przenosi zdjęcia, urządzenie pomiarowe zgrywa dane — zmienia się
    wyłącznie nazwa i ikona w oknie urządzeń.

    Odnotowuję, że skutek jest widoczny dla użytkownika i bywa zgłaszany.
    Urządzenie pokazane pod oznaczeniem technicznym zamiast pod nazwą
    modelu wygląda na zainstalowane niepoprawnie, choć działa bez
    zastrzeżeń.

    Miejscem wartym uwagi są stanowiska z wieloma podobnymi urządzeniami,
    gdzie nazwa handlowa służy do ich rozróżniania. Tam warto nadać nazwy
    ręcznie po wdrożeniu.

    Skutek pojawia się natychmiast, bez restartu. Opisy pobrane wcześniej
    zostają.

    Czego to nie psuje: działania urządzeń, instalowania sterowników,
    drukowania, przenoszenia zdjęć, logowania, pracy programów.
  en: |
    The class is "no disruption".

    The change touches solely the layer of description. The printer prints, the camera carries over pictures, the
    instrument of measuring draws off data - what changes is only the name and the mark in the window of devices.

    I set down that the consequence is plain to the user and is at times reported. A device shown under a marking
    of craft instead of the name of its make looks laid on amiss, though it works without fault.

    The place worth notice is stations with many like devices, where the name of trade serves to tell them apart.
    There it is well to give out names by hand after the rollout.

    The consequence shows at once, with no restart. Descriptions drawn earlier stay.

    What this does not break: the working of devices, the laying on of drivers, printing, the carrying over of
    pictures, logging on, or the work of programs.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Urządzenie pokaże się pod oznaczeniem technicznym zamiast pod nazwą modelu, bez ikony i zdjęcia
      - Wygląda to na instalację niepoprawną i bywa zgłaszane jako usterka, choć urządzenie działa bez zastrzeżeń
      - Na stanowisku z wieloma podobnymi urządzeniami warto nadać nazwy ręcznie po wdrożeniu
      - Opisy pobrane wcześniej zostają i nie są kasowane przy zmianie
      - Działanie urządzeń, instalowanie sterowników, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - A device will show under a marking of craft instead of the name of its make, with no mark and no picture
      - That looks like a laying on amiss and is at times reported as a fault, though the device works without fault
      - Upon a station with many like devices it is well to give out names by hand after the rollout
      - Descriptions drawn earlier stay and are not deleted at the change
      - The working of devices, the laying on of drivers, printing, logging on and the work of programs stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko obsługuje wiele podobnych urządzeń rozróżnianych wyłącznie po nazwie handlowej z opisu
    en:
      - The station serves many like devices told apart solely by the name of trade out of the description
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PreventDeviceMetadataFromNetwork'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
    $name = 'PreventDeviceMetadataFromNetwork'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PreventDeviceMetadataFromNetwork' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-metadata-retrieval-client

notes:
  pl: |
    Reguła jest z tych, przy których warto być wprost ostrożnym w opisie
    korzyści. Nie zamyka drogi wejścia i nie broni przed niczym
    konkretnym. Wartością jest wyłącznie ograniczenie tego, co maszyna
    sama o sobie wysyła.

    Argument wart zachowania dotyczy zapytania, a nie odpowiedzi. Treść
    pobierana jest niegroźna — to nazwa i zdjęcie. Znaczenie ma to, że
    żeby ją pobrać, maszyna musi zgłosić, co do niej podłączono, i robi
    to przy każdym nowym urządzeniu.

    Odnotowuję, że skutek jest widoczny i bywa zgłaszany jako usterka.
    Warto, żeby aplikacja to wymieniła razem z rozwiązaniem: nazwy da się
    nadać ręcznie, a urządzenie działa niezależnie od tego, jak jest
    podpisane.
  en: |
    The rule is of those where it is well to be plainly careful in the setting out of the gain. It shuts no road
    in and guards against nothing in particular. The worth lies solely in the bounding of what the machine sends
    of itself.

    The argument worth keeping touches the asking and not the answer. The content drawn is harmless - a name and a
    picture. What has weight is that to draw it the machine must give out what has been put into it, and does so
    at every new device.

    I set down that the consequence is to be seen and is at times reported as a fault. It is well that the
    application name it together with the answer: names may be given out by hand, and a device works whatever it
    be labelled.
