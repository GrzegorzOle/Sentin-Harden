id: win10-bitlocker-minimum-pin-length

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Minimalna długość kodu odblokowującego dysk systemowy
    en: The least length of the code unlocking the system drive
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa najmniejszą dopuszczalną długość kodu wpisywanego
    przy starcie zaszyfrowanej maszyny.

    Kod ten różni się od hasła jedną cechą rozstrzygającą: jest sprawdzany
    przed uruchomieniem systemu, czyli poza wszystkim, co system potrafi.
    Nie działa tu blokada konta po nieudanych próbach, nie działa
    opóźnienie między próbami i nie ma dziennika, w którym cokolwiek
    zostanie odnotowane.

    Obroną jest wyłącznie liczba możliwych kombinacji. Kod czterocyfrowy
    daje dziesięć tysięcy możliwości — liczbę, którą maszyna wyposażona
    w automat do wpisywania wyczerpuje w czasie, jaki złodziej ma
    spokojnie. Każda kolejna cyfra mnoży ten czas przez dziesięć.

    Odnotowuję, że moduł sprzętowy ma własne opóźnienie po serii nieudanych
    prób i nie jest to więc gołe zgadywanie. Nie zmienia to jednak
    rozumowania: dłuższy kod jest tu jedyną obroną, którą da się ustawić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przestrzeń
    kodów na tyle małą, że da się ją przejść bez wiedzy o właścicielu.
  en: |
    The setting names the least allowed length of the code typed at the start of an enciphered machine.

    That code differs from a password by one settling mark: it is checked before the system starts, which is to
    say outside everything the system can do. No locking of an account after failed tries works here, no delay
    between tries works, and there is no log in which anything will be set down.

    The guarding is the number of possible orderings alone. A code of four digits gives ten thousand
    possibilities - a number a machine fitted with an automaton for the typing runs through in a time a thief has
    at ease. Every further digit multiplies that time by ten.

    I set down that the hardware module has a delay of its own after a run of failed tries, so it is no bare
    guessing. That does not change the reasoning: a longer code is here the one guarding that may be set.

    What an attacker gains while the item goes unmet: a field of codes small enough to be walked through without
    any knowledge of the owner.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są ludzie, którzy
    ten kod będą wpisywać.

    Kod siedmioznakowy wpisywany przy każdym starcie jest zauważalnym
    obciążeniem. Skutkiem przewidywalnym jest zapisanie go na kartce
    przyklejonej do obudowy, co znosi całą wartość punktu — i jest to
    skutek częstszy, niż się przyjmuje.

    Odnotowuję drugi skutek, mniej oczywisty: kod dłuższy jest częściej
    zapominany, a zapomniany kod oznacza wezwanie obsługi i klucz
    odzyskiwania. Punkt ten podnosi więc obciążenie obsługi, i to
    proporcjonalnie do liczby maszyn.

    Odpowiedzią nie jest skrócenie kodu, tylko włączenie kodu
    rozszerzonego, dopuszczającego litery. Hasło siedmioznakowe zbudowane
    ze słów jest łatwiejsze do zapamiętania niż siedem cyfr, a przestrzeń
    możliwości ma większą.

    Wartości wyższe niż wymagana są przyjmowane i sprawdzenie ich nie
    podważa. Maszyna ustawiona ostrzej nie jest niezgodna.

    Czego to nie psuje: pracy po zalogowaniu, dostępu do plików,
    wydajności, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is the people who will type that code.

    A code of seven marks typed at every start is a noticeable burden. The foreseeable consequence is the writing
    of it upon a slip stuck to the case, which undoes the item's whole worth - and it is a commoner consequence
    than is held.

    I set down a second consequence, the less plain: a longer code is the oftener forgotten, and a forgotten code
    means a calling of the support and a key of recovery. This item therefore raises the support's burden, and in
    proportion to the number of machines.

    The answer is not a shortening of the code but the switching on of the widened code, which admits letters. A
    password of seven marks built of words is easier to call to mind than seven digits, and has the greater field
    of possibilities.

    Values higher than the one called for are taken in and the check does not gainsay them. A machine set the
    stricter is not out of compliance.

    What this does not break: work once signed in, the way to files, speed, file shares, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Kod siedmioznakowy wpisywany przy każdym starcie bywa zapisywany na kartce przyklejonej do obudowy
      - Kod dłuższy jest częściej zapominany, a zapomniany oznacza wezwanie obsługi i wydanie klucza odzyskiwania
      - Obciążenie obsługi rośnie proporcjonalnie do liczby maszyn objętych zmianą
      - Wartości wyższe niż wymagana są przyjmowane i sprawdzenie ich nie podważa
      - Praca po zalogowaniu, dostęp do plików, wydajność, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A code of seven marks typed at every start is at times written upon a slip stuck to the case
      - A longer code is the oftener forgotten, and a forgotten one means a calling of the support and the handing out of a key of recovery
      - The support s burden grows in proportion to the number of machines the change takes in
      - Values higher than the one called for are taken in and the check does not gainsay them
      - Work once signed in, the way to files, speed, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ma obsługi zdolnej wydawać klucze odzyskiwania, a zapomniany kod odciąłby użytkownika od maszyny
    en:
      - There is no support able to hand out keys of recovery, and a forgotten code would cut the user off from the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # A value below the required one is reported together with its length, so a
      # machine set too leniently can be told from one with no setting at all.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'MinimumPIN'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -lt 7) { 'BELOW_MINIMUM ' + [int]$value }
        else { 'AT_OR_ABOVE_MINIMUM' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AT_OR_ABOVE_MINIMUM'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'MinimumPIN'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A length above the one required is accepted too - the check reports it as
    # meeting the item, a machine set more strictly not being one out of compliance.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MinimumPIN' -Value 7 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła ma sens wyłącznie przy wymaganym dodatkowym uwierzytelnieniu
    i warto, żeby aplikacja pokazywała je razem. Bez tamtego punktu nikt
    żadnego kodu nie wpisuje, a ta reguła opisuje długość czegoś, czego
    nie ma.

    Argument wart postawienia wprost dotyczy tego, czego tu brakuje.
    Wszystkie mechanizmy, na których opiera się ochrona haseł w systemie —
    blokada konta, opóźnienie między próbami, zapis nieudanych logowań —
    działają w systemie. Ten kod jest sprawdzany wcześniej, więc żaden
    z nich nie obowiązuje. Zostaje sama długość.

    Odnotowuję skutek uboczny, bo bywa przemilczany. Wymaganie długiego
    kodu bez umożliwienia liter prowadzi wprost do kartki na obudowie.
    Aplikacja, która o tym nie powie, wdroży punkt, który w raporcie
    wygląda na spełniony, a w rzeczywistości nie broni niczego.
  en: |
    The rule makes sense only with the additional authentication called for, and it is well that the application
    show them together. Without that item nobody types any code, and this rule sets out the length of something
    that is not there.

    The argument worth putting outright touches what is wanting here. Every mechanism the guarding of passwords in
    the system rests upon - the locking of an account, a delay between tries, the writing down of failed signings
    in - works within the system. This code is checked earlier, so none of them holds. The length alone remains.

    I set down a side consequence, it being at times passed over in silence. A calling for a long code without the
    admitting of letters leads straight to the slip upon the case. An application that does not say so will roll
    out an item that looks met in the report and in truth guards nothing.
