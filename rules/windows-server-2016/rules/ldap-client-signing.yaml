id: win2016-ldap-client-signing

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wymagania podpisywania klienta katalogu
    en: Directory client signing requirements
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy maszyna odpytująca katalog domeny żąda
    podpisania tej rozmowy, czy godzi się na rozmowę bez podpisu.

    Katalog jest miejscem, z którego maszyna dowiaduje się wszystkiego,
    co przesądza o uprawnieniach: kto należy do jakiej grupy, jakie zasady
    obowiązują, gdzie szukać kontrolera. Odpowiedzi z katalogu są w praktyce
    poleceniami, których maszyna słucha bez zastrzeżeń.

    Rozmowa bez podpisu oznacza, że odpowiedź da się w drodze podmienić.
    Napastnik pośrodku nie musi przy tym niczego łamać ani niczego się
    dowiadywać — wystarczy, że zmieni to, co wraca. Dopisanie grupy do wyniku
    zapytania o przynależność jest zmianą jednego pola, a skutkiem są
    uprawnienia, których nikt nie nadawał.

    Podpis zamyka tę drogę. Nie ukrywa treści rozmowy — to osobna sprawa
    i osobny mechanizm — ale sprawia, że podmiana zostanie rozpoznana.

    Punkt dotyczy strony klienta, czyli tej maszyny jako pytającego. Jest to
    istotne, bo serwer katalogu może żądać podpisu niezależnie i te dwa
    ustawienia bywają mylone.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podmiany odpowiedzi z katalogu w drodze, a przez to wpływ na przynależność
    do grup i na obowiązujące zasady, bez dotykania kontrolera domeny.
  en: |
    The setting decides whether the machine querying the domain directory demands
    that the conversation be signed, or consents to one without a signature.

    The directory is where the machine learns everything that settles privileges:
    who belongs to which group, what policy holds, where to look for a controller.
    The directory's answers are in practice instructions the machine follows without
    reservation.

    An unsigned conversation means the answer can be substituted in transit. The
    attacker in the middle need break nothing and learn nothing - it suffices that
    they alter what comes back. Adding a group to the result of a membership query
    is the change of one field, and its consequence is privileges nobody granted.

    A signature shuts that road. It hides no content of the conversation - that is a
    separate matter and a separate mechanism - but it makes substitution
    recognisable.

    The item concerns the client's side, that is this machine as the asker. That
    matters, because the directory server may demand a signature independently, and
    the two settings are at times confused.

    What an attacker gains while the item goes unmet: the means of substituting the
    directory's answers in transit, and thereby a hand in group membership and in
    the policy that holds, without touching the domain controller.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy wyłącznie wyższego
    z dwóch dopuszczalnych wariantów.

    Reguła wpisuje wariant uzgadniany: klient prosi o podpis i podpisuje, gdy
    druga strona potrafi, a gdy nie potrafi — rozmawia dalej bez podpisu.
    Ten wariant nie psuje niczego. Wszystko, co działało, działa dalej,
    a rozmowy z kontrolerami domeny są od wielu wydań podpisywane bez
    dodatkowych warunków.

    Wariant żądający jest inny i to on wymaga uwagi. Przy nim rozmowa bez
    podpisu zostaje przerwana, więc oprogramowanie odpytujące katalog własną
    biblioteką — a nie mechanizmem systemowym — potrafi stracić połączenie.
    Dotyczy to zwłaszcza aplikacji branżowych korzystających z katalogu do
    wyszukiwania użytkowników oraz starszych narzędzi do synchronizacji danych
    kadrowych.

    Objaw bywa mylący: aplikacja zgłasza brak wyników wyszukiwania albo puste
    listy użytkowników, a nie błąd połączenia. Powiązanie tego z ustawieniem
    po stronie systemu bywa trudne.

    Czego to nie psuje w wariancie uzgadnianym: odpytywania katalogu,
    logowania, zasad grupy ani pracy aplikacji korzystających z katalogu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns only the higher of the two
    allowed variants.

    The rule writes the negotiated variant: the client asks for a signature and
    signs where the other side can, and where it cannot - talks on without one. That
    variant breaks nothing. Everything that worked goes on working, and
    conversations with domain controllers have been signed for many releases without
    further conditions.

    The demanding variant is another matter and it is the one that calls for
    attention. Under it an unsigned conversation is broken off, so software querying
    the directory with a library of its own - rather than with the system's
    mechanism - can lose its connection. This concerns in particular trade
    applications using the directory to look up users, and older tools for
    synchronising personnel data.

    The symptom is at times misleading: the application reports no search results or
    empty lists of users, and not a connection error. Tying that to a setting on the
    system's side can be hard.

    What this does not break in the negotiated variant: querying the directory,
    signing in, group policy, or the working of applications that use the directory.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - W wariancie żądającym aplikacja odpytująca katalog własną biblioteką traci połączenie z kontrolerem
      - Objaw bywa mylący — aplikacja zgłasza puste listy użytkowników zamiast błędu połączenia
      - Starsze narzędzia do synchronizacji danych kadrowych potrafią przestać pobierać zmiany
      - W wariancie uzgadnianym odpytywanie katalogu, logowanie i zasady grupy pozostają bez zmian
    en:
      - In the demanding variant an application querying the directory with a library of its own loses its connection to the controller
      - The symptom is at times misleading - the application reports empty lists of users rather than a connection error
      - Older tools for synchronising personnel data can stop fetching changes
      - In the negotiated variant querying the directory, signing in and group policy stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Przy wariancie żądającym nie sprawdzono, czy aplikacje odpytujące katalog własną biblioteką obsługują podpisywanie
      - Na maszynie pracują starsze narzędzia synchronizujące dane z katalogu, o których nic nie wiadomo
    en:
      - Under the demanding variant it has not been checked whether applications querying the directory with their own library support signing
      - Older tools synchronising data from the directory run on the machine and nothing is known about them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One means the signing is negotiated, two that it is demanded. Both meet the
      # item, so the check keeps them apart from a state that agrees to an unsigned
      # conversation.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
      $name = 'LDAPClientIntegrity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[12]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
    $name = 'LDAPClientIntegrity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One stands for negotiating the signing: the client asks for it and, where the
    # other side cannot, speaks on without it. The higher value demands it outright
    # and can break the conversation, so it is left to a knowing decision rather
    # than set here.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LDAPClientIntegrity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-ldap-client-signing-requirements

notes:
  pl: |
    Audyt przyjmuje wariant uzgadniany i żądający. Oba spełniają punkt, więc
    aplikacja nie powinna zmuszać do wyższego — ale powinna pokazywać, który
    jest ustawiony, bo tylko wyższy faktycznie zamyka drogę podmiany.

    Reguła wpisuje wariant niższy świadomie. Wyższy potrafi przerwać rozmowę
    i jego wdrożenie wymaga wiedzy o aplikacjach na tej maszynie, której
    skaner nie ma. Podniesienie go jest decyzją użytkownika i powinno być
    opisane jako następny krok, a nie wykonane za niego.

    Punkt dotyczy klienta, nie serwera katalogu. Żądanie podpisu po stronie
    kontrolera domeny jest osobnym ustawieniem, osobną regułą i osobną decyzją —
    warto to rozróżnić w raporcie, bo nazwy obu brzmią podobnie.
  en: |
    The audit accepts the negotiated and the demanding variant. Both meet the item,
    so the application should not compel the higher one - but it should show which
    is set, since only the higher actually shuts the road to substitution.

    The rule writes the lower variant knowingly. The higher can break off a
    conversation and applying it calls for knowledge of the applications on this
    machine that a scanner does not have. Raising it is the user's decision and
    should be described as the next step rather than done for them.

    The item concerns the client, not the directory server. Demanding a signature on
    the domain controller's side is a separate setting, a separate rule and a
    separate decision - worth telling apart in the report, since the names of the
    two sound alike.
