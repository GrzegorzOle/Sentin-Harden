id: win11-credentials-delegation-non-exportable

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Credentials Delegation
  title:
    pl: Delegowanie poświadczeń w postaci uniemożliwiającej ich wyniesienie
    en: Credentials delegated in a form that cannot be carried away
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Przy zwykłym połączeniu pulpitu zdalnego poświadczenia łączącego się
    użytkownika lądują w pamięci maszyny docelowej. Jeśli ta maszyna jest już
    zajęta, poświadczenia są do wzięcia — i to właśnie dlatego przejęcie jednego
    serwera pozwala sięgnąć po konta wszystkich, którzy się na niego logowali.

    Ustawienie pozwala prowadzić połączenie inaczej: maszyna docelowa nie
    dostaje poświadczeń, lecz odsyła każde żądanie uwierzytelnienia z powrotem
    do stacji, z której połączenie wyszło. Skutek jest taki, że na serwerze nie
    ma czego ukraść — nie dlatego, że coś jest lepiej schowane, tylko dlatego,
    że tego tam nie ma.
  en: |
    In an ordinary remote desktop connection the connecting user's credentials
    end up in the target machine's memory. If that machine is already taken, the
    credentials are there for the taking - and that is precisely why seizing one
    server opens the way to the accounts of everybody who signed in to it.

    The setting allows the connection to be run differently: the target machine
    receives no credentials, but sends every authentication request back to the
    station the connection came from. The effect is that there is nothing to steal
    on the server - not because something is better hidden, but because it is not
    there.

disruption_description:
  pl: |
    Nic. Ustawienie nie zmienia sposobu łączenia się ani niczego nie wyłącza —
    zezwala tej maszynie występować w roli maszyny docelowej dla połączeń
    prowadzonych w ten sposób. Połączenia zwykłe działają jak wcześniej.

    Warto rozumieć, czego ten punkt nie robi, bo nazwa sugeruje więcej, niż
    ustawienie daje. Nie wymusza bezpieczniejszego trybu na nikim, nie wyłącza
    trybu zwykłego i nie chroni tej maszyny przed niczym. Zdejmuje wyłącznie
    przeszkodę po stronie docelowej, żeby ktoś, kto chce się połączyć
    bezpieczniej, mógł to zrobić.

    Wartość pojawia się więc dopiero wtedy, gdy ktoś rzeczywiście zacznie się
    tak łączyć — i to jest właściwa treść tego punktu, nie zysk sam w sobie.
  en: |
    Nothing. The setting changes no way of connecting and turns nothing off - it
    permits this machine to act as the target for connections run in that way.
    Ordinary connections work as before.

    It is worth understanding what the item does not do, because its name suggests
    more than the setting gives. It forces the safer mode on nobody, does not
    disable the ordinary mode and protects this machine from nothing. It merely
    removes an obstacle on the target side, so that somebody wishing to connect
    more safely can.

    The value therefore appears only once somebody actually starts connecting that
    way - and that, rather than the gain in itself, is what this item is really
    about.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Nic w dotychczasowym sposobie łączenia się z tą maszyną ani z niej
    en:
      - Nothing in the existing way of connecting to this machine or from it
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zasady dostępu wymagają, żeby maszyna docelowa otrzymywała poświadczenia łączącego się użytkownika
    en:
      - Access rules require the target machine to receive the connecting user's credentials
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
      $name = 'AllowProtectedCreds'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    $name = 'AllowProtectedCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowProtectedCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/remote-credential-guard

notes:
  pl: |
    To jeden z nielicznych punktów w tej paczce, w których zysk nie pojawia się
    w chwili wdrożenia, tylko w chwili, gdy ktoś z tej możliwości skorzysta.
    Opis skutków mówi o tym wprost, bo inaczej punkt wyglądałby na darmowe
    zabezpieczenie, a jest raczej przygotowaniem gruntu.

    Tryb ten wymaga, żeby obie strony należały do tej samej domeny i żeby
    maszyna docelowa go dopuszczała. Ten punkt odpowiada wyłącznie za drugi
    warunek.
  en: |
    This is one of the few items in this pack where the gain appears not at
    application but at the moment somebody makes use of the option. The
    consequences say so outright, because otherwise the item would look like free
    protection, while it is rather groundwork.

    The mode requires both sides to belong to the same domain and the target
    machine to permit it. This item answers for the second condition only.
