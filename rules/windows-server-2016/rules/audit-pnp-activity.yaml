id: win2016-audit-pnp-activity

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Detailed Tracking
  title:
    pl: Inspekcja podłączania urządzeń
    en: Audit device connection activity
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje rozpoznanie przez system nowego urządzenia
    podłączonego do maszyny.

    Na serwerze jest to zdarzenie, które w normalnej pracy nie powinno
    występować. Sprzęt w szafie nie zmienia się codziennie, a jeżeli się
    zmienia, to w ramach prac zaplanowanych i odnotowanych. Każde zdarzenie
    z tej podkategorii jest więc sygnałem, że ktoś stał przy maszynie fizycznie
    — albo że platforma wirtualizacji podłączyła coś do gościa.

    Wartość jest w tej rzadkości. Podkategoria nie wymaga korelacji, filtrowania
    ani znajomości kontekstu: jedno zdarzenie na serwerze, który od pół roku
    stoi nietknięty, jest samo w sobie pytaniem.

    Drugi scenariusz jest mniej oczywisty. Urządzenie podszywające się pod
    klawiaturę — wyglądające jak pamięć przenośna, a rozpoznawane jako urządzenie
    wejścia — jest znanym narzędziem ataku fizycznego. Zdarzenie rozpoznania
    takiego urządzenia jest jedynym miejscem, gdzie widać, czym ono naprawdę
    było dla systemu.

    Rejestruje się powodzenia, bo to rozpoznanie urządzenia jest zdarzeniem
    niosącym treść.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podłączenie
    urządzenia do maszyny bez zapisu wskazującego, kiedy i co system rozpoznał.
  en: |
    The subcategory records the system's recognition of a new device attached to the
    machine.

    On a server this is an event that ought not to occur in the ordinary course of
    work. The hardware in a rack does not change daily, and if it does, it is as
    part of planned and recorded work. Every event of this subcategory is therefore
    a sign that somebody stood physically at the machine - or that the
    virtualisation platform attached something to the guest.

    The worth lies in that rarity. The subcategory calls for no correlation, no
    filtering and no knowledge of context: one event on a server that has stood
    untouched for half a year is itself a question.

    The second scenario is less obvious. A device passing itself off as a keyboard -
    looking like portable memory but recognised as an input device - is a known tool
    of physical attack. The event of such a device being recognised is the one place
    where what it really was to the system is visible.

    Successes are recorded, since the recognition of a device is the event carrying
    substance.

    What an attacker gains while the item goes unmet: the attaching of a device to
    the machine with no record of when, or of what the system recognised.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Na serwerze fizycznym zdarzeń jest kilka przy
    starcie maszyny i żadnych później.

    Jeden przypadek podnosi objętość i warto go znać: maszyna wirtualna,
    w której platforma podłącza i odłącza urządzenia — obrazy nośników,
    przekierowane napędy w sesji zdalnej, urządzenia przekazywane z hosta.
    Tam zdarzenia powstają regularnie i część z nich jest szumem.

    Na serwerze z rolą sesji zdalnych zjawisko to jest wyraźne, bo klient
    przekierowuje do sesji własne napędy i drukarki, a każde przekierowanie
    jest rozpoznaniem urządzenia. Warto to oszacować przed zmianą, jeżeli sesji
    jest wiele.

    Nic przy tym nie przestaje działać. Urządzenia są rozpoznawane tak samo,
    sterowniki wczytują się tak samo, przekierowanie w sesji zdalnej działa
    tak samo.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". On a physical server there are a few events at the
    machine's start and none later.

    One case raises the volume and is worth knowing: a virtual machine where the
    platform attaches and detaches devices - media images, drives redirected in a
    remote session, devices passed through from the host. There events arise
    regularly and some of them are noise.

    On a server with the remote sessions role the phenomenon is marked, since a
    client redirects its own drives and printers into the session, and every
    redirection is the recognition of a device. This is worth estimating before the
    change if the sessions are many.

    Nothing stops working while this goes on. Devices are recognised as before,
    drivers load as before, redirection in a remote session works as before.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Brak regresji w działaniu — na serwerze fizycznym zdarzeń jest kilka przy starcie i żadnych później
      - Na serwerze z rolą sesji zdalnych każde przekierowanie napędu albo drukarki klienta jest rozpoznaniem urządzenia
      - W maszynie wirtualnej platforma podłącza i odłącza urządzenia regularnie, co daje przewidywalny szum
      - Rozpoznawanie urządzeń, wczytywanie sterowników i przekierowanie w sesji zdalnej działają bez zmian
    en:
      - No regression in the working - on a physical server there are a few events at the start and none later
      - On a server with the remote sessions role every redirection of a client's drive or printer is a device recognition
      - In a virtual machine the platform attaches and detaches devices regularly, which gives predictable noise
      - The recognition of devices, the loading of drivers and redirection in a remote session work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna prowadzi wiele sesji zdalnych z przekierowaniem napędów i drukarek, a objętości zdarzeń nie oszacowano
    en:
      - The machine runs many remote sessions with drives and printers redirected, and the volume of events has not been estimated
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9248-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9248-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9248-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9248-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9248-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-pnp-activity

notes:
  pl: |
    Punkt czyta się razem z regułą o inspekcji nośników wymiennych. Ta zapisuje
    rozpoznanie urządzenia, tamta sięgnięcie po pliki na nim. Razem opisują
    pełną historię: co podłączono i co z tego odczytano.

    Na serwerze fizycznym wartość punktu jest wyższa niż w maszynie wirtualnej,
    bo zdarzeń jest mniej, a każde znaczy więcej. W maszynie wirtualnej warto
    przyjąć, że część zdarzeń pochodzi od platformy.

    Podkategoria nie blokuje niczego. Ograniczenia podłączania urządzeń są
    osobnymi regułami — ta wyłącznie rejestruje.
  en: |
    The item is read together with the rule on auditing removable media. This one
    records a device being recognised, that one a reach for the files on it.
    Together they give the full story: what was attached and what was read from it.

    On a physical server the item's worth is higher than in a virtual machine, there
    being fewer events and each meaning more. In a virtual machine it is worth
    taking it that some events come from the platform.

    The subcategory blocks nothing. Limits on the attaching of devices are separate
    rules - this one only records.
