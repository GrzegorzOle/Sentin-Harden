id: win2025-deny-network-logon-guests

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa dostępu z sieci dla grupy Goście
    en: Deny access from the network for the Guests group
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Grupa Goście istnieje w każdym systemie Windows i obejmuje konto
    gościa oraz wszystko, co system zaliczy do dostępu bez
    uwierzytelnienia. Punkt każe odmówić tej grupie dostępu do maszyny
    z sieci.

    Sens tego zapisu bierze się z rozdziału między odmową a brakiem
    zgody. Konto gościa bywa wyłączone i wtedy problemu nie ma — ale
    wyłączenie jest stanem, który da się cofnąć jednym poleceniem
    i który bywa cofany przez instalatory oraz przy odtwarzaniu maszyny
    z obrazu. Odmowa jest zapisem trwałym i obowiązuje niezależnie od
    tego, czy konto jest włączone.

    Odmowa ma przy tym pierwszeństwo nad każdą zgodą. Jeżeli ktoś
    kiedyś nada grupie Goście uprawnienia do udziału — celowo albo przez
    pomyłkę w dziedziczeniu — ten wpis i tak zamknie drogę.

    Na serwerze waży to więcej niż na stanowisku roboczym, bo serwer jest
    stroną przyjmującą połączenia z definicji. Udziały sieciowe,
    zarządzanie zdalne i dostęp do rejestru przez sieć to wszystko drogi,
    które ten punkt zamyka dla grupy, która nie powinna nimi wchodzić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wejścia na serwer bez poświadczeń w chwili, w której konto gościa
    zostanie włączone przez kogokolwiek i z jakiegokolwiek powodu.
  en: |
    The Guests group exists in every Windows system and takes in the guest account and
    whatever the system reckons to access without authentication. The item bids that group be
    denied access to the machine from the network.

    The sense of that record comes of the parting between a denial and a want of consent. The
    guest account is at times switched off and then there is no trouble - but switching off is
    a state that can be undone with one command and that is at times undone by installers and
    at the restoring of a machine from an image. A denial is a lasting record and holds whether
    the account is switched on or not.

    A denial at that takes precedence over every consent. Should somebody one day grant the
    Guests group rights to a share - on purpose or through a slip in inheritance - this entry
    will shut the road all the same.

    On a server that weighs more than at a working station, since a server is the side taking
    connections by definition. Network shares, remote management and access to the registry
    over the network are all roads this item shuts for a group that ought not to come in by
    them.

    What an attacker gains while the item goes unmet: a road onto the server without
    credentials at the moment the guest account is switched on by anyone and for any reason.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie przestaje działać i nikt niczego nie zauważy. Grupa Goście
    nie jest używana do niczego, co działa na serwerze — konta usługowe,
    konta administratorów i konta domenowe do niej nie należą.

    Naprawa dopisuje grupę do wykazu odmowy i zachowuje wpisy już
    obecne. Jest to zabezpieczenie celowe: prawo to zapisuje się
    w całości, więc naprawa bez przeniesienia wpisów dotychczasowych
    przywróciłaby komuś dostęp po cichu.

    Jedyny przypadek, w którym zmiana jest odczuwalna, to serwer,
    na którym udział sieciowy udostępniono celowo bez uwierzytelnienia
    — na przykład katalog z instalatorami albo ze sterownikami do
    drukarek. Taki udział przestanie być dostępny dla połączeń
    anonimowych.

    Właściwą odpowiedzią nie jest odpuszczenie punktu, tylko nadanie
    dostępu kontu, które w sieci istnieje. Dostęp anonimowy do udziału
    na serwerze jest osobnym problemem i ten punkt tylko go ujawnia.
  en: |
    The change has no known side effects and takes no break.

    Nothing stops working and nobody notices anything. The Guests group is used for nothing
    that works on a server - service accounts, administrators' accounts and domain accounts do
    not belong to it.

    The mending adds the group to the list of denial and keeps the entries present already.
    That is a deliberate safeguard: this right is recorded whole, so a mending without the
    carrying over of the entries so far would quietly give somebody access back.

    The one case in which the change is felt is a server on which a network share was
    deliberately given out without authentication - a directory with installers or with
    printer drivers, say. Such a share will stop being reachable for anonymous connections.

    The right answer is not letting the item go but granting access to an account that exists
    on the network. Anonymous access to a share on a server is a trouble of its own and this
    item merely brings it to light.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Udział udostępniony celowo bez uwierzytelnienia przestanie być dostępny anonimowo
      - Konta usługowe, administratorów i domenowe nie należą do tej grupy i nie odczuwają zmiany
      - Naprawa zachowuje wpisy już obecne w wykazie odmowy
      - Odmowa obowiązuje niezależnie od tego, czy konto gościa jest włączone
    en:
      - A share deliberately given out without authentication will stop being reachable anonymously
      - Service, administrator and domain accounts do not belong to this group and feel no change
      - The mending keeps the entries present already in the list of denial
      - The denial holds whether the guest account is switched on or not
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze udostępniono udział bez uwierzytelnienia i korzystają z niego urządzenia bez kont
    en:
      - A share without authentication was given out on the server and devices without accounts use it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: S-1-5-32-546
  comparison: contains

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyNetworkLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    if (-not ($members -contains '*S-1-5-32-546')) { $members += '*S-1-5-32-546' }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyNetworkLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyNetworkLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-access-to-this-computer-from-the-network

notes:
  pl: |
    Sprawdzenie pyta o obecność grupy w wykazie, a nie o zgodność wykazu
    z wzorcem. Odmowa dla innych kont jest zapisem sensownym i punkt jej
    nie kwestionuje.

    Naprawa zachowuje wpisy dotychczasowe i dopisuje grupę do nich.
    Prawo zapisuje się w całości, więc pominięcie tego kroku przywracałoby
    komuś dostęp po cichu.

    Grupa wskazywana jest identyfikatorem, bo nazwa grupy wbudowanej
    jest tłumaczona razem z systemem.
  en: |
    The check asks after the group's presence in the list rather than after the list's
    agreement with a pattern. A denial for other accounts is a sensible record and the item
    does not question it.

    The mending keeps the entries so far and adds the group to them. The right is recorded
    whole, so passing that step over would quietly give somebody access back.

    The group is pointed to by identifier, since a built-in group's name is translated along
    with the system.
