id: win2025-defender-maps-local-override-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Lokalne nadpisanie ustawień zgłaszania do usługi rozpoznawania zablokowane
    en: Local overriding of the reporting settings for the recognition service blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że ustawienie zgłaszania do usługi rozpoznawania
    pochodzi wyłącznie z zasady i nie daje się zmienić na maszynie.
    Zero oznacza tu, że nadpisanie lokalne jest zabronione.

    Jest to punkt o tym, gdzie leży prawda, a nie o tym, co jest
    ustawione. Bez niego zasada może mówić jedno, maszyna robić drugie,
    a raport pokazywać to pierwsze. Takie rozejście się nie zgłasza
    samo i nie kończy się samo — trwa, dopóki ktoś nie zajrzy na
    konkretną maszynę.

    Na serwerze ma to wagę praktyczną, bo serwery żyją długo i przechodzą
    przez wiele rąk. Ustawienie zmienione lokalnie w trakcie jakiegoś
    dochodzenia, dwa lata temu, przez osobę, która chciała chwilowo
    odciąć ruch wychodzący, zostaje tam na zawsze. Nie ma wylogowania
    ani ponownej instalacji, które by je zdjęły.

    Zostawiam kategorię średnią. Punkt sam nie zatrzymuje ataku — pilnuje
    tego, żeby zatrzymywał go mechanizm opisany w zasadzie, a nie stan
    zastany na maszynie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wyciszenia zgłaszania na jednej maszynie bez śladu
    w zasadzie, która nadal wygląda na spełnioną.
  en: |
    The item makes it so that the setting of reporting to the service of knowing comes of the policy
    alone and cannot be altered on the machine. A nought stands here for the local overriding being
    forbidden.

    It is an item about where the truth lies and not about what is set. Without it the policy may
    say one thing, the machine do another, and the report show the first. Such a parting reports
    itself not and ends not of itself - it lasts until somebody looks at the one machine.

    On a server it has a workaday weight, servers living long and passing through many hands. A
    setting altered locally in the course of some seeking, two years back, by a person who meant to
    cut the outgoing traffic for a while, stays there for good. There is no signing off nor setting
    up anew that would take it away.

    I leave the category middling. The item stops no attack of itself - it sees to it that the
    working set forth in the policy stops it, and not the state found upon the machine.

    What an attacker gains while the item goes unmet - the means of hushing the reporting on one
    machine with no trace in the policy, which still looks to be met.

disruption_description:
  pl: |
    Zmiana sama z siebie niczego nie włącza ani nie wyłącza. Przesuwa
    jedynie rozstrzygnięcie z maszyny do zasady — i właśnie dlatego
    trzeba wiedzieć, co zasada mówi, zanim się ją zastosuje.

    Rzeczą do sprawdzenia jest jeden konkretny układ i wraca w nim
    wszystko, co napisałem przy ochronie dostarczanej z chmury. Jeżeli
    serwer stoi w segmencie bez wyjścia na zewnątrz, ktoś mógł
    zgłaszanie wyłączyć lokalnie — świadomie, żeby maszyna przestała
    dobijać się do usługi, której i tak nie osiągnie. Ta zmiana
    unieważnia taką decyzję i przywraca próby, o których dotąd nikt nie
    myślał.

    Skutek nie jest groźny, ale bywa zauważony: w dzienniku zapory
    pojawiają się odrzucone połączenia wychodzące, a na maszynie krótkie
    oczekiwania przy nieznanych plikach. Ktoś zgłosi to jako nowy ruch
    niewiadomego pochodzenia — i będzie miał rację, bo jest nowy.

    Ustal więc najpierw, co mówi zasada, i dopiero potem zabroń
    lokalnego nadpisywania. Kolejność odwrotna zadziała, ale zostawi
    ślad w dzienniku zapory, którego nikt nie będzie umiał wyjaśnić.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    The change of itself switches nothing on nor off. It only shifts the settling from the machine
    to the policy - and therefore what the policy says must be known before it is laid on.

    The thing to check is one set arrangement, and all I wrote at the guard delivered from the cloud
    comes back within it. If the server stands in a reach with no way out, somebody may have
    switched the reporting off locally - wittingly, that the machine might stop knocking at a
    service it will not reach anyway. This change makes such a deciding void and brings back tries
    nobody had thought of hitherto.

    The outcome is not grave but is at times marked - in the day-book of the wall of fire cast-off
    outgoing bindings appear, and on the machine short waitings at unknown files. Somebody will
    report it as new traffic of unknown coming, and they will be right, it being new.

    Settle therefore first what the policy says, and only then forbid the local overriding. The
    other order will work, but will leave in the day-book of the wall of fire a trace nobody will be
    able to set forth.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - network-and-firewall
  what_breaks:
    pl:
      - Świadome lokalne wyłączenie zgłaszania w segmencie bez wyjścia zostaje unieważnione
      - W dzienniku zapory pojawiają się odrzucone połączenia wychodzące, których dotąd nie było
      - Ktoś zgłosi to jako nowy ruch niewiadomego pochodzenia i będzie miał rację, bo jest nowy
      - Zmiana sama z siebie niczego nie włącza ani nie wyłącza, tylko przesuwa rozstrzygnięcie do zasady
      - Na maszynie pojawiają się krótkie oczekiwania przy plikach nieznanych mechanizmowi
    en:
      - A witting local switching off of the reporting in a reach with no way out is made void
      - In the day-book of the wall of fire cast-off outgoing bindings appear that were not there before
      - Somebody will report it as new traffic of unknown coming and will be right, it being new
      - The change of itself switches nothing on nor off, it only shifts the settling to the policy
      - On the machine short waitings appear at files the working knows not
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, co w tej sprawie mówi zasada obowiązująca na tej maszynie
      - Zgłaszanie wyłączono lokalnie świadomie, bo maszyna nie ma wyjścia na zewnątrz
    en:
      - It was not settled what the policy binding on that machine says in this matter
      - The reporting was switched off locally and wittingly, the machine having no way out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero here means the local setting may not override the policy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LocalSettingOverrideSpynetReporting'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'LocalSettingOverrideSpynetReporting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle what the policy says before this is laid on: from here the policy
    # decides, and a deliberate local switch-off stops having any effect.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LocalSettingOverrideSpynetReporting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Punkt o tym, gdzie leży prawda, a nie o tym, co jest ustawione. Bez
    niego zasada mówi jedno, maszyna robi drugie, a raport pokazuje to
    pierwsze — i trwa to, dopóki ktoś nie zajrzy na konkretną maszynę.

    Waga serwerowa: serwery żyją długo i przechodzą przez wiele rąk.
    Ustawienie zmienione lokalnie dwa lata temu podczas jakiegoś
    dochodzenia zostaje tam na zawsze — nie ma wylogowania ani
    ponownej instalacji, które by je zdjęły.

    Układ do sprawdzenia wraca za regułą o ochronie z chmury: w segmencie
    bez wyjścia ktoś mógł wyłączyć zgłaszanie świadomie, a ta zmiana
    przywróci próby i zostawi ślad w dzienniku zapory.
  en: |
    An item about where the truth lies and not about what is set. Without it the policy says one
    thing, the machine does another, and the report shows the first - and that lasts until somebody
    looks at the one machine.

    The weight on a server - servers live long and pass through many hands. A setting altered
    locally two years back in the course of some seeking stays there for good; there is no signing
    off nor setting up anew that would take it away.

    The arrangement to check comes back from the rule about the guard from the cloud - in a reach
    with no way out somebody may have switched the reporting off wittingly, and this change will
    bring the tries back and leave a trace in the day-book of the wall of fire.
