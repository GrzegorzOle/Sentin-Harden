id: win2025-always-install-elevated

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Instalacja pakietów z podniesionymi uprawnieniami wyłączona
    en: Always install with elevated privileges disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt wyłącza ustawienie, które każe instalatorowi pakietów wykonywać
    instalację z uprawnieniami systemu niezależnie od tego, kto ją
    uruchomił. Ustawienie działa dopiero wtedy, gdy jest włączone w obu
    gałęziach — maszyny i użytkownika — więc audyt czyta obie.

    Kategoria krytyczna i tym razem bez żadnego złagodzenia, bo to nie jest
    utwardzenie, tylko usunięcie gotowej drogi do przejęcia maszyny.

    Rzecz działa tak: każdy, kto ma na maszynie konto, przygotowuje pakiet
    instalacyjny z dowolną zawartością i go uruchamia. Instalator wykona go
    z pełnymi uprawnieniami. Nie trzeba do tego żadnej luki, żadnego błędu
    w oprogramowaniu ani żadnego sekretu — wystarczy konto i plik. Droga
    jest udokumentowana, powtarzalna i nie wymaga niczego poza tym, co
    system oferuje sam.

    Na serwerze waży to więcej niż gdziekolwiek indziej, bo konta bez praw
    administratora są tam zwykle kontami usług, dostawców i obsługi
    zdalnej — czyli dokładnie tymi, które nadają się do wykorzystania
    z zewnątrz. Konto usługi służące do jednego zadania staje się w tym
    układzie kontem administratora na żądanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przejęcie
    całej maszyny z poziomu dowolnego konta na niej, bez żadnej luki
    i bez żadnego dodatkowego warunku.
  en: |
    The item switches off the setting that tells the package installer to
    perform installations with the system's privileges regardless of who
    started them. The setting only takes effect when it is on in both hives
    - machine and user - so the audit reads both.

    The category is critical, this time with no softening, because this is
    not hardening but the removal of a ready-made route to taking over the
    machine.

    It works like this: anybody with an account on the machine prepares an
    installation package with any content at all and runs it. The installer
    will execute it with full privileges. No flaw is needed, no bug in any
    software and no secret - an account and a file are enough. The route is
    documented, repeatable and demands nothing beyond what the system
    offers by itself.

    On a server this weighs more than anywhere else, because accounts
    without administrative rights there are usually service, vendor and
    remote-operation accounts - precisely the ones suited to being used
    from outside. A service account meant for one task becomes, in this
    arrangement, an administrator account on demand.

    What an attacker gains while the item goes unmet: takeover of the whole
    machine from any account on it, with no flaw and no additional
    condition.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tu ma ona swoje zwykłe znaczenie: nikt tego
    nie zauważy, bo instalacja z uprawnieniami administratora nadal działa
    dla administratorów. Zmienia się tylko to, że przestaje działać dla
    wszystkich pozostałych.

    Dający się nazwać przypadek jest jeden i warto go sprawdzić przed
    zmianą, chociaż na serwerze występuje rzadko: rozwiązanie do
    dystrybucji oprogramowania, które celowo opiera się na tym ustawieniu,
    żeby instalować pakiety w kontekście zalogowanej osoby. Takie
    rozwiązania istnieją, ale każde współczesne robi to inaczej — przez
    własną usługę działającą z odpowiednimi uprawnieniami, a nie przez
    podnoszenie uprawnień wszystkim. Jeżeli maszyna ma coś, co tego
    naprawdę wymaga, jest to samo w sobie znalezisko.

    Warto też wiedzieć, że reguła naprawia wyłącznie gałąź maszyny.
    Wpis w gałęzi użytkownika może zostać i nie będzie sam w sobie szkodził,
    bo podniesienie następuje tylko wtedy, gdy oba są włączone. Audyt czyta
    oba właśnie dlatego, żeby nie raportować zgodności na podstawie połowy
    stanu.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption", and here it carries its ordinary meaning:
    nobody will notice, because installing with administrative privileges
    still works for administrators. All that changes is that it stops
    working for everybody else.

    There is one nameable case worth checking before the change, though it
    is rare on a server: a software distribution solution that deliberately
    rests on this setting in order to install packages in the context of
    the signed-in person. Such solutions exist, but every modern one does
    it differently - through its own service running with the right
    privileges rather than by elevating everybody. If the machine has
    something that genuinely requires this, that is a finding in itself.

    It is also worth knowing that the rule repairs the machine hive only.
    An entry in the user hive may remain and will do no harm by itself,
    because elevation happens only when both are on. The audit reads both
    precisely so as not to report compliance from half the state.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalacja pakietów z uprawnieniami administratora nadal działa dla administratorów, przestaje dla pozostałych
      - Rozwiązanie do dystrybucji oprogramowania opierające się na tym ustawieniu przestanie instalować pakiety
      - Takie rozwiązanie jest samo w sobie znaleziskiem, bo współczesne robią to przez własną usługę
      - Reguła naprawia wyłącznie gałąź maszyny — wpis w gałęzi użytkownika może zostać i sam w sobie nie szkodzi
    en:
      - Installing packages with administrative privileges still works for administrators and stops for everybody else
      - A software distribution solution resting on this setting will stop installing packages
      - Such a solution is a finding in itself, because modern ones do this through their own service
      - The rule repairs the machine hive only - an entry in the user hive may remain and does no harm by itself
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa rozwiązanie do dystrybucji oprogramowania, które celowo opiera się na tym ustawieniu i nie ma zamiennika
    en:
      - The machine runs a software distribution solution that deliberately rests on this setting and has no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    # Elevation happens only when BOTH hives are set, so both must be read.
    function Get-Flag($path) {
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { return $null }
      (Get-ItemProperty -Path $path -ErrorAction Stop).AlwaysInstallElevated
    }
    try {
      $m = Get-Flag 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $u = Get-Flag 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      if (($m -eq 1) -and ($u -eq 1)) { 'ENABLED' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: ^DISABLED$
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'AlwaysInstallElevated'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the machine hive is written here. Elevation needs both hives, so
    # clearing this one is enough to close the route; an entry left in the user
    # hive does no harm on its own.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AlwaysInstallElevated' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/alwaysinstallelevated

notes:
  pl: |
    To nie jest utwardzenie, tylko usunięcie gotowej drogi do przejęcia
    maszyny. Wystarczy konto i plik — żadnej luki, żadnego błędu, żadnego
    sekretu.

    Na serwerze konta bez praw administratora to zwykle konta usług,
    dostawców i obsługi zdalnej, czyli dokładnie te, które nadają się do
    wykorzystania z zewnątrz. Konto usługi do jednego zadania staje się
    w tym układzie kontem administratora na żądanie.

    Podniesienie następuje tylko wtedy, gdy ustawienie jest włączone w obu
    gałęziach, dlatego audyt czyta obie, a naprawa wystarcza w gałęzi
    maszyny.
  en: |
    This is not hardening but the removal of a ready-made route to taking
    over the machine. An account and a file are enough - no flaw, no bug,
    no secret.

    On a server, accounts without administrative rights are usually
    service, vendor and remote-operation accounts, precisely the ones
    suited to being used from outside. A service account meant for one task
    becomes, in this arrangement, an administrator account on demand.

    Elevation happens only when the setting is on in both hives, which is
    why the audit reads both and why repairing the machine hive suffices.
