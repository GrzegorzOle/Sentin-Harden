id: iis-server-header-removed

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Nagłówek z nazwą serwera usuwany z odpowiedzi
    en: The header naming the server removed from the response
  level: 1
  profile: application

platform:
  system: iis

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer podpisuje każdą odpowiedź własną nazwą i numerem wersji. Jest to
    ostatni z trzech nagłówków rozpoznawczych, obok tego o technologii i tego
    o wersji środowiska wykonawczego.

    Wartość tej informacji dla atakującego jest taka sama jak poprzednio: numer
    wersji zestawia się z listą ogłoszonych luk bez jednego żądania próbnego.
    Różnica polega na tym, że ten nagłówek wysyła sam serwer, nie aplikacja, więc
    nie znika razem z tamtymi i trzeba go zdjąć osobno — o czym łatwo zapomnieć
    i zostać z dwoma zamkniętymi drzwiami oraz jednymi otwartymi.

    Usunięcie nagłówka niczego nie utwardza. Domyka natomiast komplet.
  en: |
    The server signs every response with its own name and version number. It is
    the last of the three reconnaissance headers, beside the one naming the
    technology and the one naming the runtime version.

    The worth of this information to an attacker is the same as before - a version
    number is matched against a list of announced flaws without a single probing
    request. The difference is that this header is sent by the server itself
    rather than by the application, so it does not go away with the other two and
    has to be taken off apart - which is easy to forget, leaving two doors shut and
    one open.

    Removing the header hardens nothing. It does complete the set.

disruption_description:
  pl: |
    Dla odwiedzających zmiana jest niewidoczna. Koszt jest ten sam co przy
    pozostałych dwóch nagłówkach: zapis w konfiguracji odświeża pule aplikacji,
    więc żądania w locie zostaną przerwane, a sesje trzymane w pamięci procesu
    przepadną. Trzy zasady o nagłówkach warto wdrażać w jednym oknie.

    Osobno trzeba sprawdzić serwery pośredniczące i systemy równoważenia
    obciążenia. Część z nich rozpoznaje serwer po tej nazwie i wpisuje ją do
    własnych reguł kierowania ruchem albo do sprawdzania dostępności. Po zmianie
    taki test zacznie zgłaszać awarię, choć serwer działa poprawnie.

    Zdarza się też, że narzędzia diagnostyczne w organizacji zbierają tę nazwę do
    inwentaryzacji. Zaczną raportować serwer jako nierozpoznany.
  en: |
    For visitors the change is invisible. The cost is the same as with the other
    two headers - writing to the configuration recycles the application pools, so
    requests in flight are broken and sessions held in the process memory are lost.
    The three header rules are worth rolling out in one window.

    Apart from that, intermediary servers and load balancing systems have to be
    checked. Some of them recognise the server by this name and write it into
    rules of their own for steering traffic or for checking availability. After the
    change such a test begins to report a fault, though the server works properly.

    It also happens that diagnostic tools in the organisation gather this name for
    an inventory. They begin reporting the server as unrecognised.

implementation_consequences:
  impact_areas:
    - web-server-services
  what_breaks:
    pl:
      - Serwery pośredniczące rozpoznające serwer po tej nazwie zaczną zgłaszać awarię mimo poprawnej pracy
      - Odświeżenie pul aplikacji przerwie żądania w locie i skasuje sesje trzymane w pamięci procesu
      - Inwentaryzacje zbierające nazwę serwera zaczną raportować go jako nierozpoznanego
      - Dla odwiedzającego zmiana jest niewidoczna, bo nagłówek nie bierze udziału w obsłudze żądania
      - Nagłówki o technologii i o wersji środowiska to osobne ustawienia i trzeba je zdjąć niezależnie
    en:
      - Intermediary servers recognising the server by this name begin reporting a fault though it works properly
      - The pool recycle breaks requests in flight and clears sessions held in the process memory
      - Inventories gathering the server name begin reporting it as unrecognised
      - For a visitor the change is invisible, since the header takes no part in serving a request
      - The headers naming the technology and the runtime version are separate settings and have to be taken off on their own
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowiska, w których serwer pośredniczący kieruje ruchem na podstawie nazwy serwera z odpowiedzi
      - Serwery produkcyjne w godzinach pracy, dopóki nie ma okna na odświeżenie pul aplikacji
    en:
      - Environments where an intermediary server steers traffic by the server name in the response
      - Production servers during working hours, until there is a window for the pool recycle
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/security/requestFiltering' -Name 'removeServerHeader' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([string]$value -eq 'True') { 'TRUE' }
          elseif ([string]$value -eq 'False') { 'FALSE' }
          else { [string]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'TRUE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering' -Name 'removeServerHeader' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.webServer/security/requestFiltering'
      name    = 'removeServerHeader'
      value   = [string]$value
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering' -Name 'removeServerHeader' -Value $true

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value $b.value
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/security/requestfiltering/

notes:
  pl: |
    Ustawienie jest dostępne od dziesiątej wersji serwera; na starszych wydaniach
    nagłówek zdejmowano regułą przepisywania odpowiedzi. Zasada zamyka komplet
    trzech nagłówków rozpoznawczych i ocenia się ją razem z pozostałymi dwoma.
  en: |
    The setting is available from the tenth version of the server; on older
    releases the header was taken off with a response rewriting rule. The rule
    closes the set of three reconnaissance headers and is judged together with the
    other two.
