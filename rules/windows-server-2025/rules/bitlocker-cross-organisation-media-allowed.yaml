id: win2025-bitlocker-cross-organisation-media-allowed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na nośnikach zaszyfrowanych w innej organizacji dopuszczony
    en: Writing to media encrypted in another organisation admitted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt pozostawia otwartą możliwość zapisu na nośniku, który zaszyfrowano
    poza tą organizacją. Wartość zero oznacza „nie zabraniaj", więc
    oczekiwaniem jest tu brak ograniczenia, a nie jego wprowadzenie.

    To jedyna reguła w całej paczce BitLockera, która idzie w drugą stronę:
    nie dokłada zabezpieczenia, tylko każe nie dokładać go w miejscu, gdzie
    nie przynosi pożytku. Warto powiedzieć, dlaczego.

    Zakaz zapisu na nośniku z innej organizacji nie zamyka żadnej drogi
    wejścia. Nośnik obcy i tak daje się odczytać, a odczyt jest tym
    kierunkiem, w którym coś niepożądanego wchodzi do maszyny. Zamknięty
    zostaje wyłącznie zapis, czyli kierunek, w którym dane wychodzą — a ten
    ogranicza się skuteczniej regułą o zakazie zapisu na nośnikach
    niezaszyfrowanych, bo tamta obejmuje wszystko, a nie tylko nośniki
    opisane cudzą organizacją.

    Kategoria niska i chcę być tu uczciwy: wartość tego punktu polega na
    porządku i spójności, nie na odpieraniu zagrożenia. Trzymam go
    w paczce, bo brak wpisu znaczy tyle samo co wpis zerowy tylko dopóty,
    dopóki nikt niczego nie ustawił — a na serwerze, który przeszedł kilka
    polityk, „nikt niczego nie ustawił" jest założeniem, nie faktem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic. To jest
    reguła porządkowa i mówię to wprost, zamiast dorabiać jej wagę.
  en: |
    The item leaves open the possibility of writing to a medium encrypted
    outside this organisation. A value of zero means "do not forbid", so
    what is expected here is the absence of a restriction rather than its
    introduction.

    This is the only rule in the whole BitLocker pack that goes the other
    way: it adds no protection but calls for none to be added where it
    brings no benefit. It is worth saying why.

    Banning writes to a medium from another organisation closes no way in.
    A foreign medium can be read regardless, and reading is the direction
    in which something unwanted enters the machine. What gets closed is
    writing alone, the direction in which data leaves - and that is limited
    more effectively by the rule banning writes to unencrypted media,
    because that one covers everything rather than only media labelled with
    somebody else's organisation.

    The category is low and I want to be honest here: this item's value
    lies in order and consistency, not in repelling a threat. I keep it in
    the pack because a missing entry means the same as a zero entry only
    for as long as nobody has set anything - and on a server that has been
    through several policies, "nobody has set anything" is an assumption,
    not a fact.

    What an attacker gains while the item goes unmet: nothing. This is a
    housekeeping rule and I say so plainly rather than inventing weight for
    it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tutaj jest to stwierdzenie ścisłe, a nie
    ostrożne. Reguła nie wprowadza ograniczenia — ona pilnuje, żeby
    ograniczenia nie było. Stan po zmianie jest identyczny ze stanem
    maszyny, na której nikt nigdy tej polityki nie dotknął.

    Jedyny przypadek, w którym coś się zmienia, to maszyna, na której
    zakaz był wcześniej włączony. Wtedy zapis na nośnikach opisanych cudzą
    organizacją zaczyna działać — czyli przybywa możliwości, a nie ubywa.
    To jest kierunek, którego nikt nie zgłosi jako awarii.

    Warto jednak zauważyć konsekwencję, którą łatwo przeoczyć: jeżeli ktoś
    wcześniej włączył ten zakaz świadomie, traktując go jako element
    kontroli wynoszenia danych, ta reguła cofnie tamtą decyzję. Właściwym
    zamiennikiem jest zakaz zapisu na nośnikach niezaszyfrowanych z tej
    samej paczki, ale trzeba go mieć wdrożonego, a nie zaplanowanego.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption", and here that is a precise statement
    rather than a cautious one. The rule introduces no restriction - it
    makes sure none is present. The state after the change is identical to
    that of a machine where nobody has ever touched this policy.

    The only case in which anything changes is a machine where the ban was
    previously on. Writing to media labelled with somebody else's
    organisation then starts working - that is, a possibility is gained
    rather than lost. This is not a direction anybody reports as a failure.

    It is worth noticing a consequence that is easy to miss, though: if
    somebody turned that ban on deliberately, treating it as part of
    controlling what data leaves, this rule undoes that decision. The right
    replacement is the ban on writing to unencrypted media from the same
    pack, but it has to be in place rather than planned.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
  what_breaks:
    pl:
      - Nic nie przestaje działać — reguła pilnuje braku ograniczenia, a nie wprowadza nowe
      - Na maszynie, gdzie zakaz był włączony, zapis na nośnikach cudzej organizacji zaczyna działać
      - Jeżeli ktoś włączył ten zakaz świadomie jako element kontroli wynoszenia danych, ta reguła cofnie tamtą decyzję
    en:
      - Nothing stops working - the rule ensures the absence of a restriction rather than adding one
      - On a machine where the ban was on, writing to another organisation's media starts working
      - If somebody turned that ban on deliberately as part of controlling data leaving, this rule undoes that decision
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zakaz zapisu na nośnikach cudzej organizacji jest u tej organizacji świadomym elementem kontroli wynoszenia danych
      - Nie wdrożono jeszcze zakazu zapisu na nośnikach niezaszyfrowanych, który jest tu właściwym zamiennikiem
    en:
      - The ban on writing to another organisation's media is a deliberate part of this organisation's control over data leaving
      - The ban on writing to unencrypted media, which is the right replacement here, is not yet in place
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'RDVDenyCrossOrg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVDenyCrossOrg'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This writes the absence of a restriction, so it adds nothing. Where the
    # ban was on deliberately as part of controlling what leaves the machine,
    # have the ban on writing to unencrypted media in place first.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyCrossOrg' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Jedyna reguła w paczce BitLockera idąca w drugą stronę: nie dokłada
    zabezpieczenia, tylko każe nie dokładać go tam, gdzie nie przynosi
    pożytku.

    Zakaz zapisu na nośniku z innej organizacji nie zamyka drogi wejścia —
    odczyt i tak działa, a to odczyt jest kierunkiem, w którym coś wchodzi
    do maszyny. Wynoszenie danych ogranicza skuteczniej zakaz zapisu na
    nośnikach niezaszyfrowanych, bo obejmuje wszystko.

    Wartość tego punktu polega na porządku, nie na odpieraniu zagrożenia,
    i mówię to wprost zamiast dorabiać mu wagę.
  en: |
    The only rule in the BitLocker pack that goes the other way: it adds no
    protection but calls for none to be added where it brings no benefit.

    Banning writes to a medium from another organisation closes no way in -
    reading works regardless, and reading is the direction in which
    something enters the machine. Data leaving is limited more effectively
    by the ban on writing to unencrypted media, because that covers
    everything.

    This item's value lies in order, not in repelling a threat, and I say
    so plainly rather than inventing weight for it.
