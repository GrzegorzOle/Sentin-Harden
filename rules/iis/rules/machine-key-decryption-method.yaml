id: iis-machine-key-decryption-method

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Dane odsyłane do przeglądarki szyfrowane wskazanym algorytmem
    en: Data sent back to the browser is encrypted with a named algorithm

platform:
  system: iis

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Część danych, które aplikacja odsyła do przeglądarki, jest nie tylko
    pieczętowana, ale i zaszyfrowana — bo ich treść nie powinna być czytelna
    dla nikogo poza serwerem. Dotyczy to przede wszystkim ciasteczka
    uwierzytelniającego, w którym siedzi tożsamość zalogowanego użytkownika,
    oraz tych fragmentów stanu strony, które aplikacja wprost oznaczyła jako
    poufne. To ustawienie rozstrzyga, jakim algorytmem są one szyfrowane.

    Co to odbiera atakującemu: możliwość odczytania i przerobienia tej
    zawartości. Domyślne ustawienie nie nazywa algorytmu, tylko każe wybrać go
    automatycznie — wybór zależy wtedy od długości klucza i od wersji
    środowiska, a nie od decyzji administratora. W praktyce znaczy to, że na
    części serwerów zostanie użyty szyfr z rodziny, której już się nie uznaje
    za wystarczającą, a nikt się o tym nie dowie, bo konfiguracja wygląda
    wszędzie tak samo.

    Po zmianie algorytm jest nazwany wprost i jednakowy wszędzie. Znika
    zależność od tego, co środowisko uzna w danej chwili za rozsądne, a wraz
    z nią możliwość, że najsłabsze ogniwo pojawi się na jednej maszynie
    niezauważone.
  en: |
    Some of the data an application sends back to the browser is not only sealed
    but encrypted, because its contents should not be readable by anybody but the
    server. That covers above all the authentication cookie holding the identity
    of the signed-in user, and those parts of a page's state the application has
    explicitly marked as confidential. This setting decides which algorithm
    encrypts them.

    What it takes away from an attacker - the ability to read and rework those
    contents. The default setting does not name an algorithm; it asks for one to
    be picked automatically, and the pick then depends on the key length and the
    version of the runtime rather than on an administrator's decision. In
    practice that means a cipher from a family no longer regarded as sufficient
    will be used on some of the servers, and nobody finds out, because the
    configuration looks the same everywhere.

    After the change the algorithm is named outright and is the same everywhere.
    The dependency on what the runtime deems reasonable at a given moment goes
    away, and with it the chance of the weakest link turning up unnoticed on one
    machine.

disruption_description:
  pl: |
    Skutek jest ten sam, co przy zmianie algorytmu pieczęci, i z tego samego
    powodu: wszystko, co zaszyfrowano poprzednim algorytmem, przestaje dać się
    odczytać w chwili zapisu. Ciasteczko uwierzytelniające wystawione minutę
    wcześniej jest po zmianie nieczytelne, więc każdy zalogowany użytkownik
    zostaje wylogowany.

    Osobno warto wiedzieć, co zobaczy użytkownik: nie prośbę o ponowne
    zalogowanie, tylko przekierowanie na stronę logowania albo błąd — zależnie
    od tego, jak aplikacja reaguje na ciasteczko, którego nie umie rozszyfrować.
    Część aplikacji loguje przy tym wyjątek deszyfrowania, co w dzienniku
    wygląda jak próba ataku i bywa tak raportowane przez monitoring.

    Ten sam problem co poprzednio dotyczy aplikacji rozłożonej na kilka
    serwerów: algorytm musi być zmieniony na wszystkich w jednym oknie, inaczej
    użytkownicy będą wylogowywani przy każdym przeskoku między maszynami.

    Obie reguły dotyczące tego wpisu — szyfrowanie i pieczęć — wdrażaj razem,
    w jednym oknie serwisowym. Rozdzielenie ich oznacza dwa wylogowania
    wszystkich zamiast jednego.
  en: |
    The effect is the same as with a change of sealing algorithm, and for the
    same reason - everything encrypted with the previous algorithm stops being
    readable at the moment of the write. An authentication cookie issued a minute
    earlier is unreadable after the change, so every signed-in user is signed
    out.

    It is worth knowing separately what the user sees - not a request to sign in
    again, but a redirect to the sign-in page or an error, depending on how the
    application reacts to a cookie it cannot decrypt. Some applications log a
    decryption exception while at it, which in a log looks like an attempt at an
    attack and is sometimes reported as one by monitoring.

    The same problem as before applies to an application spread over several
    servers - the algorithm has to be changed on all of them in one window, or
    users will be signed out at every hop between machines.

    Roll out both rules touching this entry - the encryption and the seal -
    together, in one service window. Separating them means signing everybody out
    twice instead of once.

implementation_consequences:
  impact_areas:
    - web-server-services
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Wszystkie ciasteczka uwierzytelniające przestają dać się odczytać, więc zalogowani użytkownicy są wylogowywani w chwili zapisu
      - Użytkownik trafia na stronę logowania albo na błąd, zależnie od tego, jak aplikacja reaguje na ciasteczko nie do rozszyfrowania
      - W dziennikach aplikacji pojawiają się wyjątki deszyfrowania, które monitoring może zgłosić jako próbę ataku
      - Aplikacja stojąca na kilku serwerach wylogowuje użytkowników przy przejściu na serwer ze starym ustawieniem
      - Dane trwale zaszyfrowane tym mechanizmem poza sesją — jeśli aplikacja tak z niego korzysta — stają się nieczytelne bezpowrotnie
    en:
      - Every authentication cookie stops being readable, so signed-in users are signed out at the moment of the write
      - The user lands on the sign-in page or on an error, depending on how the application reacts to a cookie it cannot decrypt
      - Decryption exceptions appear in the application logs, which monitoring may report as an attempted attack
      - An application standing on several servers signs users out on moving to a server with the old setting
      - Data encrypted durably by this mechanism outside a session - where an application uses it that way - becomes unreadable for good
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Aplikacje przechowujące trwale dane zaszyfrowane tym mechanizmem, dopóki nie zostaną one przeszyfrowane
      - Aplikacje rozłożone na kilka serwerów, dopóki zmiana nie obejmie wszystkich w jednym oknie
      - Aplikacje przypisane do zgodności ze starszą wersją środowiska uruchomieniowego
    en:
      - Applications durably storing data encrypted by this mechanism, until those data have been re-encrypted
      - Applications spread over several servers, until the change covers all of them in one window
      - Applications pinned to compatibility with an older version of the runtime
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
            -Filter 'system.web/machineKey' -Name 'decryption' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          else {
            # Anything other than the named modern cipher is reported as it
            # stands. That includes the default, which names no algorithm at all
            # and leaves the choice to the runtime - the very thing this item is
            # about, so it must not be hidden behind a bare verdict.
            [string]$value
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AES'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # As with the sealing algorithm, this lives in the framework root
    # configuration, which the server's own backup mechanism does not cover.
    # Both variants of the file are copied, because a 32-bit application pool
    # reads a different one than a 64-bit pool does.
    $files = @()
    foreach ($base in @('Framework', 'Framework64')) {
      $source = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\web.config')
      if (Test-Path $source) {
        $copy = '{{backup_file}}' + '.' + $base + '.web.config'
        Copy-Item -Path $source -Destination $copy -Force
        $files += [pscustomobject]@{ source = $source; copy = $copy }
      }
    }
    if ($files.Count -eq 0) {
      throw 'The framework root configuration was not found, so nothing was secured and nothing may be changed.'
    }
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/machineKey' -Name 'decryption' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'framework-root'
      filter  = 'system.web/machineKey'
      name    = 'decryption'
      value   = [string]$value
      existed = ($null -ne $value)
      files   = $files
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and copied the framework root configuration"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/machineKey' -Name 'decryption' -Value 'AES'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($f in $b.files) {
      if (-not (Test-Path $f.copy)) {
        throw 'A copy recorded in the backup file is missing, so nothing was restored.'
      }
    }
    foreach ($f in $b.files) {
      Copy-Item -Path $f.copy -Destination $f.source -Force
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.machinekeysection.decryption
  - https://learn.microsoft.com/aspnet/whitepapers/aspnet4/breaking-changes

notes:
  pl: |
    Domyślną wartością jest wpis nakazujący wybrać algorytm automatycznie.
    Sprawdzenie zgłasza go dosłownie, a nie jako zwykłą niezgodność, bo sedno
    tego punktu polega właśnie na tym, że pod jedną nazwą kryje się różny
    wynik na różnych maszynach.

    Reguła dotyczy wyłącznie nazwy algorytmu. Sam klucz to osobna sprawa —
    przy pojedynczym serwerze generuje się automatycznie, przy aplikacji
    rozłożonej na kilka maszyn musi być ustawiony jawnie i jednakowo.

    Ta reguła i reguła dotycząca algorytmu pieczęci zmieniają ten sam wpis
    konfiguracyjny. Wdrażaj je w jednym oknie serwisowym — każda z osobna
    wylogowuje wszystkich użytkowników.
  en: |
    The default value is an entry telling the runtime to pick an algorithm
    automatically. The check reports it literally rather than as a plain
    non-compliance, because the heart of this item is exactly that one name hides
    a different outcome on different machines.

    The rule concerns the name of the algorithm alone. The key itself is a
    separate matter - on a single server it is generated automatically, for an
    application spread over several machines it has to be set explicitly and
    identically.

    This rule and the rule about the sealing algorithm change the same
    configuration entry. Roll them out in one service window - each on its own
    signs every user out.
