id: fedora44-ftp-client-not-installed

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 2.2.1
  section: Services > Configure Client Services
  title:
    pl: Klient FTP nie jest zainstalowany
    en: Ensure ftp client is not installed
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    FTP przesyła login, hasło i pliki otwartym tekstem, więc każdy, kto
    podsłuchuje sieć, może je przechwycić. Do przesyłania plików lepiej
    używać SFTP lub SCP, które działają przez SSH.

    Punkt wymaga, żeby klient FTP nie był zainstalowany. Fedora Workstation
    go nie instaluje.
  en: |
    FTP sends the login, the password and the files in clear text, so anyone
    sniffing the network can capture them. SFTP or SCP, which run over SSH,
    are better for transferring files.

    The item requires that the FTP client is not installed. Fedora
    Workstation does not install it.

disruption_description:
  pl: |
    Nikt tego nie zauważy, jeśli nikt nie używał polecenia ftp. W przeciwnym
    razie ręczne połączenia i skrypty korzystające z ftp przestaną działać.
  en: |
    Nobody will notice if nobody used the ftp command. Otherwise manual
    connections and scripts that use ftp stop working.

implementation_consequences:
  impact_areas:
    - file-sharing
    - scripting-and-automation
  what_breaks:
    pl:
      - Polecenia ftp i tnftp nie są dostępne; skrypty, które z nich korzystają, kończą się błędem
    en:
      - The ftp and tnftp commands are not available; scripts that use them fail
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v rpm >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    found=""
    for p in ftp tnftp; do if rpm -q --quiet "$p"; then found="$found $p"; fi; done
    if [ -n "$found" ]; then echo "INSTALLED:$(echo $found | tr ' ' ',')"; else echo NOT_INSTALLED; fi
  expected: '^NOT_INSTALLED$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      export LC_ALL=C
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      { echo format=rpm-names-1; rpm -qa --qf '%{NAME}.%{ARCH}\n' | grep -v '^gpg-pubkey\.' | sort -u; } > "$b"
      echo "Saved the list of installed packages to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      rm=""
      for p in ftp tnftp; do if rpm -q --quiet "$p"; then rm="$rm $p"; fi; done
      if [ -z "$rm" ]; then echo "Nothing to remove"; exit 0; fi
      dnf -y -q remove $rm
      echo "Removed:$rm"
    )

  rollback_command: |
    (
      set -e
      export LC_ALL=C
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=rpm-names-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      now=$(mktemp)
      rpm -qa --qf '%{NAME}.%{ARCH}\n' | sort -u > "$now"
      miss=$(tail -n +2 "$b" | comm -23 - "$now")
      rm -f "$now"
      if [ -z "$miss" ]; then echo "All packages from the backup are installed"; exit 0; fi
      dnf -y -q install $miss
      echo "Installed again:" $miss
    )

privileges: root
runnable: true

sources:
  - https://packages.fedoraproject.org/pkgs/ftp/ftp/
  - https://dnf5.readthedocs.io/en/latest/commands/remove.8.html

notes:
  pl: |
    Sprawdzam klasyczne klienty FTP z repozytoriów Fedory: ftp i tnftp.
    Klient lftp obsługuje też SFTP i FTPS, więc reguła go nie usuwa.
    Menedżery plików, np. Pliki GNOME, łączą się z FTP przez GVfs i działają
    dalej. Razem z ftp dnf usunie python3-ftputil, jeśli jest zainstalowany.

    Naprawa usuwa pakiety poleceniem dnf remove, które usuwa też pakiety od
    nich zależne i zależności zainstalowane tylko dla nich. Kopia zapisuje
    listę wszystkich zainstalowanych pakietów, a wycofanie instaluje ponownie
    te, których brakuje, więc wymaga dostępu do repozytoriów.
  en: |
    I check the classic FTP clients from the Fedora repositories: ftp and
    tnftp. The lftp client also supports SFTP and FTPS, so the rule does not
    remove it. File managers, such as GNOME Files, connect to FTP through
    GVfs and keep working. Together with ftp, dnf removes python3-ftputil if
    it is installed.

    The remediation removes the packages with dnf remove, which also removes
    packages that depend on them and dependencies installed only for them.
    The backup records the list of all installed packages, and rollback
    installs again the ones that are missing, so it needs access to the
    repositories.
