id: win11-laps-password-complexity

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Złożoność losowanego hasła lokalnego administratora pełna
    en: Full complexity of the randomly chosen local administrator password
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, z jakiego zbioru znaków system losuje hasło
    lokalnego administratora, i wymaga zbioru pełnego: wielkie litery, małe
    litery, cyfry i znaki specjalne.

    Sens punktu jest arytmetyczny i warto go pokazać liczbami, bo przy
    hasłach losowanych maszynowo intuicja zawodzi. Każdy znak dokłada do
    hasła tyle, ile wynosi rozmiar zbioru, z którego pochodzi. Zbiór
    ograniczony do małych liter daje dwadzieścia sześć możliwości na znak;
    zbiór pełny — blisko dziewięćdziesiąt. Przy haśle kilkunastoznakowym
    różnica między jednym a drugim liczy się w rzędach wielkości.

    Hasło losowane maszynowo nie musi być wygodne do zapamiętania ani do
    wpisania, bo nikt go nie zapamiętuje i nikt nie wpisuje z pamięci. Nie
    ma więc powodu, dla którego zbiór znaków miałby być mniejszy niż
    największy dostępny. Ograniczenie zbioru to czysta strata, za którą nic
    nie dostajemy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: krótszy czas
    łamania hasła przejętego w postaci skrótu. Nie jest to droga
    najszybsza, ale jest drogą, która nie wymaga kontaktu z siecią
    i nie zostawia śladu.
  en: |
    The setting settles from what set of characters the system chooses the local
    administrator's password at random, and takes the full set: capital letters, small
    letters, numerals and special characters.

    The item's sense is arithmetical and worth showing in numbers, since with
    machine-chosen passwords intuition fails. Every character adds to the password as much
    as the size of the set it comes from. A set limited to small letters gives twenty-six
    possibilities per character; the full set close to ninety. With a password of a dozen
    or so characters the difference between the one and the other counts in orders of
    magnitude.

    A machine-chosen password need be convenient neither to remember nor to type, since
    nobody remembers it and nobody types it from memory. There is thus no reason for the
    set of characters to be smaller than the largest available. Limiting the set is a pure
    loss for which we get nothing.

    What an attacker gains while the item goes unmet: a shorter time for breaking a
    password taken in the form of a digest. It is not the swiftest road, but it is a road
    taking no contact with the network and leaving no trace.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji i nie zmienia sposobu pracy.

    Hasło jest losowane przez maszynę i odczytywane z katalogu, więc
    poszerzenie zbioru znaków nie obciąża nikogo. Nowy zbiór obowiązuje od
    następnego losowania; hasła bieżące nie są tą zmianą unieważniane.

    Jedyny przypadek wart sprawdzenia to narzędzia, które hasło z katalogu
    odczytują i podstawiają dalej — na przykład skrypty logujące się
    automatycznie. Znaki specjalne bywają w takich miejscach obsługiwane
    nieprawidłowo, zwłaszcza tam, gdzie hasło trafia do wiersza poleceń
    bez cudzysłowu.

    Jest to jednak wada tych narzędzi, a nie tej zmiany, i naprawia się ją
    po ich stronie.

    Zmiana nie wymaga restartu i cofa się natychmiast.
  en: |
    The change takes away no function and alters no way of working.

    The password is chosen at random by the machine and read from the directory, so
    widening the set of characters burdens nobody. The new set binds from the next
    choosing; the current passwords are not voided by this change.

    The one case worth checking is tools that read the password from the directory and pass
    it further - for instance scripts signing in automatically. Special characters are
    sometimes handled wrongly in such places, above all where the password reaches a
    command line without quotes.

    That is, however, a fault of those tools rather than of this change, and is mended on
    their side.

    The change takes no restart and reverses at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypty podstawiające hasło bez cudzysłowu mogą przestać się logować
      - Nowy zbiór znaków obowiązuje dopiero od następnego losowania
      - Hasła bieżące nie są tą zmianą unieważniane
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - Scripts passing the password on without quotes may stop signing in
      - The new set of characters binds only from the next choosing
      - The current passwords are not voided by this change
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Hasło jest podstawiane automatycznie przez narzędzie nieobsługujące znaków specjalnych
    en:
      - The password is passed on automatically by a tool not handling special characters
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Four names the full set of characters; lower numbers narrow it.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordComplexity'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordComplexity' -ErrorAction SilentlyContinue).'PasswordComplexity'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordComplexity'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordComplexity' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Wartość jest numerem wariantu, a nie liczbą klas znaków, choć akurat tu
    obie liczby są takie same i łatwo je pomylić. Warianty wyższe od czwórki
    opisują hasła składane ze słów, nie z pojedynczych znaków — to osobny
    mechanizm i osobna decyzja.

    Reguła nie ma nic wspólnego z zasadą złożoności haseł użytkowników, choć
    obie mówią o złożoności. Tamta dotyczy haseł wymyślanych przez ludzi
    i ustawiana jest w zasadach konta; ta dotyczy hasła losowanego przez
    maszynę.

    Wszystkie ustawienia tego mechanizmu leżą w jednym kluczu.

    Brak wartości nie jest stanem zgodnym, bo domyślny zbiór znaków bywa
    węższy.
  en: |
    The value is the number of a variant rather than a count of character classes, though
    here the two numbers happen to be the same and are easily confused. Variants above four
    describe passwords put together from words rather than from single characters - that is
    a separate mechanism and a separate decision.

    The rule has nothing in common with the complexity policy for users' passwords, though
    both speak of complexity. That one concerns passwords thought up by people and is set
    in the account policies; this one concerns a password chosen at random by the machine.

    All the settings of that mechanism lie in one key.

    A missing value is not a compliant state, since the default set of characters is
    sometimes narrower.
