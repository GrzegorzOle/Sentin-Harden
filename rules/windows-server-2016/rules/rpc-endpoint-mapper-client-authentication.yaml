id: win2016-rpc-endpoint-mapper-client-authentication

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Procedure Call
  title:
    pl: Uwierzytelnianie klienta wobec mapera punktów końcowych wymagane
    en: Client authentication towards the endpoint mapper required
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe tej maszynie uwierzytelniać się wtedy, gdy pyta cudzą
    maszynę, pod którym portem znajdzie potrzebną usługę.

    Zdalne wywołanie procedury nie zna z góry portu. Zna nazwę interfejsu
    i pyta o port osobną usługę — maper punktów końcowych, nasłuchujący
    zawsze pod tym samym, znanym numerem. Dopiero z otrzymaną odpowiedzią
    łączy się tam, gdzie mu wskazano.

    Pytanie to jest domyślnie zadawane bez uwierzytelnienia, bo poprzedza
    całą resztę rozmowy. Odpowiedź natomiast rozstrzyga, dokąd maszyna się
    połączy.

    Stąd wartość tego punktu. Kto odpowie na pytanie o port, ten kieruje
    połączeniem — a do połączenia dołączane są poświadczenia, bo dalsza
    część rozmowy już ich wymaga. Odpowiedź od maszyny podstawionej
    kieruje więc uwierzytelnienie tam, gdzie chce podstawiający.

    Punkt jest drugą stroną poprzedniego. Tamten mówi, kogo ta maszyna
    wysłucha. Ten mówi, komu ta maszyna zaufa, pytając o drogę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    pokierowania połączeniem tej maszyny przez odpowiedź na pytanie o port,
    a wraz z połączeniem — jej poświadczeń.
  en: |
    The setting has this machine authenticate itself when it asks another machine at
    which port it will find a needed service.

    A remote procedure call does not know the port beforehand. It knows the
    interface's name and asks a separate service about the port - the endpoint mapper,
    always listening at the same known number. Only with the answer in hand does it
    connect where it was pointed.

    That question is by default asked without authentication, coming as it does before
    all the rest of the conversation. The answer, on the other hand, settles where the
    machine will connect.

    Hence this item's worth. Whoever answers the question about a port steers the
    connection - and credentials are attached to the connection, the further part of
    the conversation calling for them already. An answer from a machine standing in
    therefore steers the authentication where the one standing in wants.

    The item is the other side of the previous one. That one says whom this machine
    will hear out. This one says whom this machine will trust when asking the way.

    What an attacker gains while the item goes unmet: the chance to steer this
    machine's connection by answering the question about a port, and with the
    connection - its credentials.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rzecz do ustalenia dotyczy
    maszyn, do których ta się łączy.

    Skutek jest odwrotny niż przy punkcie poprzednim. Tamten ograniczał to,
    co maszyna przyjmuje; ten ogranicza to, dokąd maszyna się dodzwoni.
    Po wdrożeniu pytanie o port przestanie być zadawane anonimowo, a maszyna
    po drugiej stronie musi to uwierzytelnienie przyjąć.

    Przyjmują je systemy tej rodziny od wielu wydań. Nie przyjmują dwie
    grupy. Pierwsza to urządzenia i systemy obce z własną implementacją
    tego mechanizmu — macierze plikowe, urządzenia wielofunkcyjne, starsze
    oprogramowanie serwerowe innych producentów. Druga to maszyny, wobec
    których ta nie ma jak się uwierzytelnić, bo są poza domeną albo poza
    zaufaniem.

    Objaw jest natychmiastowy i dotyczy tylko tego, co wychodzi: połączenia
    do takich maszyn przestaną się nawiązywać, a błąd wskaże niemożność
    odnalezienia punktu końcowego. Nic na tej maszynie nie przestaje
    działać samo z siebie.

    Zmiana wymaga restartu. Do czasu restartu raport pokaże zgodność,
    a system będzie pracował po staremu.

    Czego to nie psuje: usług tej maszyny, logowania, dostępu do jej plików,
    połączeń przychodzących.
  en: |
    The class is "needs a planned rollout", and what has to be established concerns
    the machines this one connects to.

    The consequence is the reverse of the previous item's. That one limited what the
    machine takes in; this one limits where the machine can get through to. After the
    rollout the question about a port will stop being asked anonymously, and the
    machine at the other end has to accept that authentication.

    Systems of this family have accepted it for many releases. Two groups do not. The
    first is outside devices and systems with their own implementation of the
    mechanism - file arrays, multifunction devices, older server software from other
    makers. The second is machines towards which this one has no way of
    authenticating, being outside the domain or outside trust.

    The symptom is immediate and touches only what goes out: connections to such
    machines will stop being made, and the error will point at an endpoint that could
    not be found. Nothing on this machine stops working of itself.

    The change calls for a restart. Until the restart the report will show compliance
    and the system will work in the old way.

    What this does not break: this machine's services, signing in, access to its
    files, or incoming connections.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
    - printing
  what_breaks:
    pl:
      - Połączenia do urządzeń i systemów obcych z własną implementacją tego mechanizmu przestaną się nawiązywać
      - Dotyczy to macierzy plikowych, urządzeń wielofunkcyjnych i starszego oprogramowania serwerowego innych producentów
      - Błąd wskaże niemożność odnalezienia punktu końcowego, co prowadzi do przyczyny wolniej, niż mogłoby się wydawać
      - Usługi tej maszyny, logowanie i połączenia przychodzące pozostają bez zmian
    en:
      - Connections to outside devices and systems with their own implementation of the mechanism will stop being made
      - That touches file arrays, multifunction devices and older server software from other makers
      - The error will point at an endpoint that could not be found, which leads to the cause more slowly than it might seem
      - This machine's services, signing in and incoming connections stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna łączy się z urządzeniami albo systemami obcymi, których implementacja tego mechanizmu nie przyjmuje uwierzytelnienia
      - Maszyna sięga do hostów poza domeną albo poza zaufaniem i nie ma jak się wobec nich uwierzytelnić
      - Nie da się wyznaczyć okna na restart maszyny
    en:
      - The machine connects to outside devices or systems whose implementation of the mechanism does not accept authentication
      - The machine reaches hosts outside the domain or outside trust and has no way of authenticating towards them
      - No window can be set for restarting the machine
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The key spells the last element as Rpc, not RPC as in the printing rules.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableAuthEpResolution'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    $name = 'EnableAuthEpResolution'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableAuthEpResolution' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/rpc-security

notes:
  pl: |
    Punkt tworzy parę z poprzednim i para ta jest wyjątkowo czytelna:
    jeden dotyczy ruchu wchodzącego, drugi wychodzącego, oba zaś tego samego
    mechanizmu. Wdrożenie jednego bez drugiego zostawia jeden kierunek
    otwarty, tak samo jak w bloku o wydruku.

    Kategoria średnia jest tu niższa niż przy punkcie poprzednim, i to
    świadomie. Pokierowanie połączeniem wychodzącym wymaga od napastnika
    obecności na drodze tego połączenia. Przyjęcie wywołania
    nieuwierzytelnionego nie wymaga od niego niczego poza osiągalnością.

    Obie reguły wymagają restartu i warto je wdrażać razem, w jednym oknie.
    Rozbicie ich na dwa okna podwaja koszt eksploatacyjny i nie daje nic
    w zamian.
  en: |
    The item makes a pair with the previous one, and that pair is uncommonly legible:
    one concerns incoming traffic, the other outgoing, and both the same mechanism.
    Rolling out one without the other leaves one direction open, just as in the block
    about printing.

    The medium category is lower here than at the previous item, and deliberately so.
    Steering an outgoing connection calls for the attacker to be on that connection's
    road. Taking in an unauthenticated call calls for nothing from them beyond being
    reachable.

    Both rules call for a restart and are worth rolling out together, in one window.
    Splitting them into two windows doubles the operating cost and gives nothing in
    return.
