id: win2025-internet-connection-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia sieciowego wyłączona
    en: The network connection sharing service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę udostępniania połączenia sieciowego. Usługa ta
    pozwala maszynie przepuszczać ruch z jednej swojej karty sieciowej na
    drugą, tłumacząc przy tym adresy i rozdając je po drodze.

    Podnoszę kategorię do wysokiej wobec oceny dla stacji roboczej
    i powód jest jeden, ale zmienia całą wagę punktu: stacja robocza ma
    zwykle jedną sieć, a serwer bardzo często dwie.

    Serwer stojący jedną nogą w sieci wystawionej, a drugą w wewnętrznej
    stoi tak dlatego, że ktoś świadomie rozdzielił te dwie sieci i
    postanowił, że się nie spotykają. Usługa opisana tym punktem jest
    dokładnie tym, co pozwala im się spotkać — i robi to bez zmiany
    reguł zapory, bez wpisu w routingu, którego ktoś by szukał, i bez
    niczego, co wyglądałoby na zmianę topologii. Wygląda na ustawienie
    karty sieciowej.

    Przejście z segmentu wystawionego do wewnętrznego jest tym, czego
    napastnik na takiej maszynie szuka. Rzecz, która mu je daje, nie może
    być oceniana tak samo jak na maszynie mającej jedną sieć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowy
    sposób przepuszczenia ruchu między sieciami, które miały się nie
    spotykać, wyglądający na ustawienie karty, a nie na zmianę topologii.
  en: |
    The item switches off the service of the dealing out of a binding of the net. That service lets
    the machine let traffic through from the one of its cards of the net onto the other, turning the
    whereabouts about as it goes and dealing them out along the way.

    I raise the category to high against the reckoning for a workstation, and the ground is one but
    it alters the whole weight of the item - a workstation has mostly one net and a server very often
    two.

    A server standing with the one foot in a net set forth and with the other in the inner net stands
    so because somebody wittingly sundered those two nets and set it that they should not meet. The
    service set forth by this item is just that which lets them meet - and it does so without an
    altering of the rules of the wall of fire, without an entry in the routing that anybody would seek
    and without anything that would look like an altering of the shape of the net. It looks like a
    setting of a card of the net.

    A going over from the set-forth reach into the inner one is what an attacker upon such a machine
    seeks. A thing that gives it to them may not be reckoned as upon a machine that has one net.

    What an attacker gains while the item goes unmet - a ready way of letting traffic through between
    nets that were to meet not, looking like a setting of a card and not like an altering of the shape
    of the net.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia i powód nie ma nic wspólnego
    z udostępnianiem połączenia. Jest nim rzecz, o której przy nazwie tej
    usługi nikt nie myśli.

    Na maszynie z rolą hipernadzorcy usługa ta obsługuje tłumaczenie
    adresów i rozdawanie ich dla przełącznika domyślnego, do którego
    podpięte bywają maszyny wirtualne. To samo dotyczy sieci
    kontenerowych korzystających z tłumaczenia adresów. Zatrzymanie
    usługi odbiera tym maszynom sieć.

    Objaw pojawia się nie na tym serwerze, tylko wewnątrz maszyn, które
    na nim stoją. Gospodarz działa bez zarzutu, jego własne połączenia są
    w porządku, a niedziałanie zgłasza ktoś zajmujący się zupełnie inną
    aplikacją, na zupełnie innym poziomie. Droga od objawu do przyczyny
    prowadzi przez granicę między dwoma zespołami i właśnie dlatego bywa
    długa.

    Sprawdzenie jest krótkie i konkretne: jeżeli maszyna pełni rolę
    hipernadzorcy albo uruchamia kontenery, ustal, czy cokolwiek na niej
    korzysta z przełącznika domyślnego albo z sieci z tłumaczeniem
    adresów. Jeżeli nie — zmiana jest czysta.

    Zmiana cofa się natychmiast, ale przywrócenie sieci maszynom
    wirtualnym po ponownym uruchomieniu usługi bywa czynnością osobną.
  en: |
    I raise the class to a witting rolling out, and the ground has nothing in common with the dealing
    out of a binding. It is a thing nobody thinks upon at that service's name.

    Upon a machine bearing the role of an overseer of machines that service works the turning about of
    whereabouts and their dealing out for the switch that is there by default, whereto machines made
    by reckoning are at times bound. The same holds of nets of holders that draw upon the turning
    about of whereabouts. The stopping of the service takes the net from those machines.

    The symptom comes forth not upon that server but within the machines that stand upon it. The host
    works without fault, its own bindings are in order, and word of the not-working is given by
    somebody busy with a wholly other application, upon a wholly other layer. The road from the
    symptom to the ground leads over the bound between two bands, and for that very reason it is at
    times long.

    The checking is short and set - if the machine bears the role of an overseer of machines or runs
    holders, settle whether anything upon it draws upon the switch that is there by default or upon a
    net with a turning about of whereabouts. If not - the change is clean.

    The change is undone at once, but the bringing back of the net to the machines made by reckoning
    after the service is started again is at times a doing of its own.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Maszyny wirtualne podpięte do przełącznika domyślnego tracą sieć
      - Sieci kontenerowe korzystające z tłumaczenia adresów przestają działać
      - Objaw pojawia się wewnątrz maszyn stojących na serwerze, a nie na samym serwerze
      - Gospodarz działa bez zarzutu, więc szukanie przyczyny zaczyna się od złej maszyny
      - Przywrócenie sieci maszynom wirtualnym po cofnięciu zmiany bywa czynnością osobną
    en:
      - The machines made by reckoning bound to the switch that is there by default lose the net
      - Nets of holders that draw upon the turning about of whereabouts stop working
      - The symptom comes forth within the machines standing upon the server and not upon the server itself
      - The host works without fault, so the seeking of the ground begins at the wrong machine
      - The bringing back of the net to the machines made by reckoning after the undoing is at times a doing of its own
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę hipernadzorcy i cokolwiek na niej korzysta z przełącznika domyślnego
      - Maszyna uruchamia kontenery w sieci z tłumaczeniem adresów
    en:
      - The machine bears the role of an overseer of machines and anything upon it draws upon the switch that is there by default
      - The machine runs holders in a net with a turning about of whereabouts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a hypervisor host this service carries address translation for the
    # default switch, and the same for container networks. The guests lose
    # their network; the host stays healthy, which is where the search starts.
    Stop-Service -Name 'SharedAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SharedAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SharedAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/network-subsystem/net-sub-interface-metric

notes:
  pl: |
    Powód podniesienia kategorii: stacja robocza ma zwykle jedną sieć,
    a serwer bardzo często dwie. Serwer stojący jedną nogą w sieci
    wystawionej, a drugą w wewnętrznej stoi tak dlatego, że ktoś
    świadomie rozdzielił te sieci. Ta usługa pozwala im się spotkać bez
    zmiany reguł zapory i bez wpisu w routingu, którego ktoś by szukał.

    Powód podniesienia klasy nie ma nic wspólnego z udostępnianiem
    połączenia: na maszynie z rolą hipernadzorcy ta usługa obsługuje
    tłumaczenie adresów dla przełącznika domyślnego i dla sieci
    kontenerowych.

    Objaw pojawia się wewnątrz maszyn wirtualnych, a nie na gospodarzu —
    droga od objawu do przyczyny prowadzi przez granicę między zespołami.
  en: |
    The ground of the raising of the category - a workstation has mostly one net and a server very
    often two. A server standing with the one foot in a net set forth and with the other in the inner
    net stands so because somebody wittingly sundered those nets. That service lets them meet without
    an altering of the rules of the wall of fire and without an entry in the routing that anybody
    would seek.

    The ground of the raising of the class has nothing in common with the dealing out of a binding -
    upon a machine bearing the role of an overseer of machines that service works the turning about of
    whereabouts for the switch that is there by default and for nets of holders.

    The symptom comes forth within the machines made by reckoning and not upon the host - the road
    from the symptom to the ground leads over the bound between bands.
