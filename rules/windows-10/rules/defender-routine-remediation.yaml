id: win10-defender-routine-remediation

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Samoczynne usuwanie wykrytych zagrożeń włączone
    en: Automatic removal of detected threats switched on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala ochronie zadziałać samodzielnie w chwili wykrycia,
    zamiast poprzestać na zapisaniu zdarzenia.

    Bez niego ochrona zachowuje się jak czujnik: widzi, opisuje i czeka.
    Plik pozostaje tam, gdzie był, i pozostaje uruchamialny. Różnica
    sprowadza się do tego, czy między wykryciem a usunięciem stoi człowiek.

    Ma to znaczenie, bo wykrycie następuje o porach, o których nikogo nie
    ma. Zdarzenie zapisane w nocy zostaje przeczytane rano, a program,
    którego dotyczy, pracował przez całą noc. Przy oprogramowaniu
    szyfrującym pliki ten odstęp rozstrzyga o wszystkim.

    Odnotowuję, czym jest „usunięcie" w tym mechanizmie. Plik trafia do
    kwarantanny, a nie jest kasowany. Da się go stamtąd przywrócić, więc
    pomyłka ochrony nie jest stratą nieodwracalną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czas
    działania od wykrycia do chwili, w której ktoś przeczyta zgłoszenie
    i zdecyduje.
  en: |
    The setting lets the protection act of itself at the hour of a finding, rather than rest at the writing down
    of the happening.

    Without it the protection behaves like a sensor: it sees, describes and waits. The file stays where it was
    and stays startable. The difference comes down to whether a person stands between the finding and the
    removal.

    That matters, findings coming at hours at which nobody is there. A happening written down in the night is
    read in the morning, and the program it touches worked the whole night through. With software that enciphers
    files that span settles everything.

    I set down what "removal" is in this mechanism. The file goes into quarantine and is not struck out. It may be
    brought back from there, so a mistake of the protection is no unrecallable loss.

    What an attacker gains while the item goes unmet: the time of working from the finding to the hour somebody
    reads the report and decides.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczą odczuwalną jest plik, który
    znika.

    Ochrona działająca samodzielnie przenosi do kwarantanny również to, co
    rozpoznała fałszywie. Skutkiem jest program, który przestaje się
    uruchamiać, albo skrypt, który znika w połowie pracy. Użytkownik widzi
    komunikat i zgłasza się po pomoc.

    Dotyczy to przede wszystkim oprogramowania narzędziowego własnej
    roboty, skryptów administracyjnych i starszych programów bez podpisu.
    Są to dokładnie te rzeczy, które ochrona rozpoznaje najsłabiej,
    a które w pracy bywają potrzebne codziennie.

    Odnotowuję, że strata nie jest nieodwracalna. Plik leży w kwarantannie
    i da się go przywrócić wraz ze wskazaniem, że ma być pomijany.
    Rozmowa dotyczy więc czasu obsługi, a nie utraty danych.

    Sprawdzić trzeba, czy na maszynie pracują narzędzia bez podpisu
    i czy jest kto obsłuży zgłoszenie. Na stanowisku bez obsługi ochrona
    działająca samodzielnie jest lepsza niż zgłoszenie, którego nikt nie
    przeczyta.

    Czego to nie psuje: wykrywania zagrożeń, skanowania, logowania,
    udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the thing that is felt is a file that vanishes.

    A protection acting of itself carries into quarantine what it has known falsely as well. The consequence is a
    program that ceases to start, or a script that vanishes halfway through its work. The user sees a message and
    comes for help.

    That touches above all tool software of one's own making, administrative scripts and older programs without a
    signature. Those are just the things the protection knows the worst, and that at work are at times needed
    daily.

    I set down that the loss is not unrecallable. The file lies in quarantine and may be brought back together
    with a naming of it as to be passed over. The conversation touches therefore the time of the support and not
    the loss of data.

    What has to be reviewed is whether tools without a signature work upon the machine and whether there is
    anybody to handle the report. Upon a station without support, a protection acting of itself is better than a
    report nobody will read.

    What this does not break: the finding of threats, the scan, logging on, file shares, or printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - Oprogramowanie narzędziowe własnej roboty i skrypty administracyjne trafiają do kwarantanny przy fałszywym trafieniu
      - Program przestaje się uruchamiać albo skrypt znika w połowie pracy, a użytkownik zgłasza się po pomoc
      - Starsze programy bez podpisu są rozpoznawane najsłabiej i najczęściej padają ofiarą pomyłki
      - Plik trafia do kwarantanny, a nie jest kasowany, więc da się go przywrócić wraz ze wskazaniem do pomijania
      - Wykrywanie zagrożeń, skanowanie, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Tool software of one s own making and administrative scripts go into quarantine at a false hit
      - A program ceases to start or a script vanishes halfway through its work, and the user comes for help
      - Older programs without a signature are known the worst and most often fall to the mistake
      - The file goes into quarantine and is not struck out, so it may be brought back together with a naming of it as to be passed over
      - The finding of threats, the scan, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje oprogramowanie bez podpisu, którego zatrzymanie przerywa proces produkcyjny
    en:
      - Software without a signature whose stopping breaks a production process works upon the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name describes a switching off: zero means the protection acts on
      # its own, one means it only reports.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableRoutinelyTakingAction'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableRoutinelyTakingAction'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A zero lets the protection act. The entry is a negative one and reads the
    # other way round than the item's title does.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRoutinelyTakingAction' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-remediation-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest w tym bloku parą dla punktu o listach wyłączeń i warto je
    pokazywać razem. Tamta rozstrzyga, gdzie ochrona patrzy; ta — czy
    z tego, co zobaczy, cokolwiek wyniknie.

    Argument rozstrzygający dotyczy pory. Wykrycie nie czeka na godziny
    pracy, a zgłoszenie owszem. Bez tego ustawienia maszyna, na której
    coś wykryto o drugiej w nocy, działa z tym czymś do rana — i nie jest
    to sytuacja wyjątkowa, tylko typowa.

    Odnotowuję, że mówimy o kwarantannie, nie o kasowaniu, bo bez tego
    rozmowa wygląda na wybór między bezpieczeństwem a utratą danych.
    Plik da się przywrócić, więc wybór dotyczy czasu obsługi — i właśnie
    dlatego na stanowisku bez obsługi rozstrzyga się na korzyść
    działania samodzielnego.
  en: |
    The rule is in this block the mate of the item about the lists of leavings out, and it is well to show them
    together. That one settles where the protection looks; this - whether anything follows from what it sees.

    The settling argument touches the hour. A finding does not wait for working hours; a report does. Without
    this setting a machine upon which something was found at two in the morning works with that something until
    dawn - and that is no uncommon case but the usual one.

    I set down that we speak of quarantine and not of a striking out, without which the conversation looks like a
    choice between safety and the loss of data. The file may be brought back, so the choice touches the time of
    the support - and for just that reason upon a station without support it is settled in favour of acting of
    itself.
