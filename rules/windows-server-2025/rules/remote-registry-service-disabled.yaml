id: win2025-remote-registry-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego dostępu do rejestru wyłączona
    en: The remote registry access service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę pozwalającą odczytywać i zmieniać rejestr tej
    maszyny z innej maszyny w sieci.

    Zostawiam kategorię wysoką i chcę wskazać, na czym w tym przypadku
    polega wartość, bo usługa ta bywa lekceważona jako narzędzie
    pomocnicze. Rejestr jest miejscem, w którym zapisane jest, jak ta
    maszyna działa: co uruchamia przy starcie, jakie ma reguły, jakie
    usługi, gdzie ma swoje dane. Zdalny dostęp do rejestru daje więc
    dwie rzeczy naraz i obie są dla napastnika cenne.

    Pierwsza to rozpoznanie bez wchodzenia. Można odczytać, co na tej
    maszynie stoi i jak jest ustawiona, nie zakładając na niej sesji i nie
    uruchamiając niczego — czyli nie zostawiając śladu tam, gdzie się go
    szuka.

    Druga to zapis. Rejestr jest miejscem, w którym zapisuje się, co ma
    się uruchomić przy następnym starcie. Trwała obecność na maszynie
    bywa niczym więcej niż jedną wartością w odpowiednim kluczu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odczytania ustawień tej maszyny i zapisania w niej czegoś trwałego,
    bez zakładania na niej sesji.
  en: |
    The item switches off the service letting the registry of that machine be read and altered off
    another machine in the net.

    I leave the category high and would name wherein in this case the worth lies, that service being
    at times made light of as a tool of help. The registry is the stead wherein it is written how
    that machine works - what it runs at the starting, what rules it has, what services, where it has
    its data. A far-off reach to the registry gives therefore two things at once and both are to an
    attacker worth having.

    The first is a spying out without a coming in. It may be read what stands upon that machine and
    how it is set, without the setting up of a sitting upon it and without the running of anything -
    that is, without the leaving of a trace where a trace is sought.

    The second is a writing. The registry is the stead wherein it is written what is to run at the
    next starting. A lasting being upon a machine is at times no more than one worth in the right
    key.

    What an attacker gains while the item goes unmet - the leave to read the settings of that machine
    and to write something lasting into it, without the setting up of a sitting upon it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" — czyli niżej niż przy trzech
    poprzednich usługach — i chcę uzasadnić tę różnicę, bo nie wynika ona
    z tego, że ta zmiana jest niegroźna.

    Wynika z tego, że ta usługa nigdy nie jest rolą serwera. Nikt nie
    stawia maszyny po to, żeby udostępniała swój rejestr. Nie ma tu więc
    przypadku, w którym reguła jest poleceniem wyłączenia tego, po co
    serwer kupiono — a to właśnie ten przypadek podnosił klasę przy
    pulpicie zdalnym, zarządzaniu poleceniami i udostępnianiu plików.

    Sprawdzenie jest jednak potrzebne i dotyczy jednej konkretnej grupy
    narzędzi. Systemy monitorowania i inwentaryzacji bez zainstalowanego
    agenta odczytują stan maszyn właśnie tą drogą — wersje
    oprogramowania, ustawienia, stan usług. Starsze konsole zarządzania
    produktami ochronnymi robią to samo.

    Objaw jest tu szczególny i dlatego ta reguła zostaje poza trybem
    zbiorczym. Monitorowanie, które straciło dostęp, nie zgłasza awarii
    maszyny — przestaje po prostu o niej mówić. Cisza na tablicy wygląda
    identycznie jak zdrowie, i to jest najgorszy możliwy sposób, w jaki
    może się ujawnić skutek zmiany bezpieczeństwa.

    Zmiana cofa się natychmiast i wymaga uruchomienia usługi z powrotem.
  en: |
    I leave the class "needs a checking" - that is lower than at the three services before - and
    would stand by that difference, it following not from this change's being harmless.

    It follows from that this service is never a server's role. Nobody sets a machine up that it may
    deal its registry out. There is here therefore no case wherein the rule is a bidding to switch
    off that for which the server was bought - and it was just that case which raised the class at
    the far-off board, at the ruling by commands and at the dealing out of files.

    A checking is needed for all that, and it bears on one set band of tools. Systems of watching and
    of the taking of stock that have no agent installed read the state of machines by that very road
    - the makes of software, the settings, the state of services. Older boards of the ruling of
    products of guarding do the same.

    The symptom is here an odd one and therefore this rule stays out of the bulk mode. A watching
    that has lost its reach gives no word of a fault of the machine - it simply stops speaking of it.
    A silence upon the board looks the same as health, and that is the worst way there could be for
    the outcome of a change of safekeeping to come to light.

    The change is undone at once and takes the starting of the service again.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - System monitorowania bez zainstalowanego agenta przestaje odczytywać stan tej maszyny
      - Inwentaryzacja oprogramowania i ustawień prowadzona tą drogą przestaje działać
      - Starsze konsole zarządzania produktami ochronnymi tracą dostęp do tej maszyny
      - Monitorowanie nie zgłasza awarii, tylko przestaje o maszynie mówić, a cisza wygląda jak zdrowie
      - Usługa nigdy nie jest rolą serwera, więc nie ma tu przypadku wyłączania tego, po co maszynę postawiono
    en:
      - A system of watching with no agent installed stops reading the state of that machine
      - The taking of stock of software and settings led by that road stops working
      - Older boards of the ruling of products of guarding lose their reach to that machine
      - The watching gives no word of a fault, it simply stops speaking of the machine, and a silence looks like health
      - The service is never a server's role, so there is here no case of switching off that for which the machine was set up
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Monitorowanie albo inwentaryzacja odczytuje stan tej maszyny zdalnie z rejestru, bez zainstalowanego agenta
    en:
      - A watching or a taking of stock reads the state of that machine from afar out of the registry, with no agent installed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Agentless monitoring and inventory read machine state through this
    # service. If they lose it they report no failure - the machine just stops
    # appearing, and silence on a dashboard looks like health.
    Stop-Service -Name 'RemoteRegistry' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteRegistry' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RemoteRegistry' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/sysinfo/registry-functions

notes:
  pl: |
    Klasa niższa niż przy trzech poprzednich usługach i różnica nie
    wynika z tego, że zmiana jest niegroźna. Wynika z tego, że ta usługa
    nigdy nie jest rolą serwera — nikt nie stawia maszyny po to, żeby
    udostępniała swój rejestr.

    Wartość punktu jest dwojaka: rozpoznanie bez zakładania sesji, czyli
    bez śladu tam, gdzie się go szuka, oraz zapis — bo trwała obecność na
    maszynie bywa niczym więcej niż jedną wartością w odpowiednim kluczu.

    Powód pozostawienia poza trybem zbiorczym: monitorowanie, które
    straciło dostęp, nie zgłasza awarii, tylko przestaje o maszynie
    mówić. Cisza na tablicy wygląda identycznie jak zdrowie.
  en: |
    The class is lower than at the three services before, and the difference follows not from this
    change's being harmless. It follows from that this service is never a server's role - nobody sets
    a machine up that it may deal its registry out.

    The worth of the item is twofold - a spying out without the setting up of a sitting, that is
    without a trace where a trace is sought, and a writing, a lasting being upon a machine being at
    times no more than one worth in the right key.

    The ground for its staying out of the bulk mode - a watching that has lost its reach gives no
    word of a fault, it simply stops speaking of the machine. A silence upon the board looks the same
    as health.
