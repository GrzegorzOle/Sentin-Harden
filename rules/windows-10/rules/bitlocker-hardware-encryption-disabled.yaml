id: win10-bitlocker-hardware-encryption-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Szyfrowanie realizowane przez dysk niedopuszczone
    en: Encryption performed by the drive itself inadmissible
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie nie dopuszcza powierzania szyfrowania samemu dyskowi
    i każe wykonywać je systemowi.

    Część dysków deklaruje własne szyfrowanie sprzętowe i system, widząc
    taką deklarację, oddaje im tę pracę. Wygląda to na wybór rozsądny:
    szyfrowanie idzie szybciej i nie obciąża procesora.

    Problem polega na tym, że deklaracja jest jedyną rzeczą, którą system
    sprawdza. Jak dysk faktycznie szyfruje, czy w ogóle szyfruje i gdzie
    trzyma klucz, pozostaje wewnętrzną sprawą urządzenia. Znane są dyski,
    które klucz przechowywały w sposób pozwalający go odczytać, oraz takie,
    które deklarowały szyfrowanie, a zapisywały dane wprost.

    System, który szyfruje sam, nie zależy od niczyjej deklaracji.
    Implementacja jest jedna, znana i taka sama na każdym urządzeniu —
    a słabość dysku przestaje być słabością danych.

    Odnotowuję, że punkt obejmuje trzy wartości, po jednej na klasę
    nośnika. Pozostawienie którejkolwiek otwartej znaczy, że tam nadal
    decyduje deklaracja urządzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dysk
    deklarujący szyfrowanie, którego jakości nikt nie sprawdził.
  en: |
    The setting leaves no room for the enciphering to be given over to the drive itself and has the system do it.

    Some drives declare an enciphering of their own, done in the gear, and the system, seeing such a declaration,
    gives that work over to them. It looks a sensible choice: the enciphering goes the quicker and does not weigh
    upon the processor.

    The trouble is that the declaration is the one thing the system checks. How the drive truly enciphers, whether
    it enciphers at all and where it keeps the key, remains the device's own affair. Drives are known that kept
    the key in a manner allowing it to be read, and others that declared enciphering while writing the data
    plainly.

    A system that enciphers of itself hangs upon nobody's declaration. There is one implementation, known and the
    same upon every device - and the drive's weakness ceases to be the data's weakness.

    I set down that the item takes in three values, one per class of drive. To leave any one of them open means
    that there the device's declaration still decides.

    What an attacker gains while the item goes unmet: a drive declaring enciphering whose worth nobody has
    checked.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie dotyka ani tego, czy dysk jest szyfrowany, ani tego, jak się
    go odblokowuje. Zmienia wyłącznie to, kto wykonuje pracę: procesor
    maszyny zamiast układu w dysku.

    Skutkiem mierzalnym jest niewielkie obciążenie procesora przy operacjach
    dyskowych. Na maszynach obsługujących przyspieszenie szyfrowania
    w instrukcjach procesora — czyli na wszystkim, co wyprodukowano
    w ostatniej dekadzie — różnica jest nieodczuwalna w pracy.

    Odnotowuję, że zasada dotyczy szyfrowania zakładanego po jej
    wprowadzeniu. Dysk zaszyfrowany wcześniej własnym mechanizmem
    pozostaje taki i wymaga ponownego zaszyfrowania, jeżeli ma przejść pod
    kontrolę systemu. Punkt pokaże się przy tym jako spełniony.

    Jest to jedyny przypadek, w którym ta reguła wymaga działania poza
    wpisem — i warto go w raporcie nazwać, bo sam wpis go nie załatwia.

    Czego to nie psuje: odblokowywania dysków, wydajności odczuwalnej
    w pracy, dostępu do plików, logowania, drukowania.
  en: |
    The class is "no disruption".

    The change touches neither whether a drive is enciphered nor how it is unlocked. It changes only who does the
    work: the machine's processor instead of a circuit in the drive.

    The measurable consequence is a small weight upon the processor at doings on the disk. Upon machines that
    handle the hastening of enciphering in the processor's own instructions - which is to say upon everything made
    in the last ten years - the difference is not felt in work.

    I set down that the policy touches enciphering laid on after it was brought in. A drive enciphered earlier by
    its own mechanism stays so and calls for an enciphering again if it is to pass under the system's hand. The
    item will show as met the while.

    It is the one case in which this rule calls for a doing beyond the entry - and it is worth naming in the
    report, the entry alone not settling it.

    What this does not break: the unlocking of drives, speed as felt in work, the way to files, logging on, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - drivers-and-devices
  what_breaks:
    pl:
      - Szyfrowanie obciąża procesor maszyny zamiast układu w dysku, co przy nowszym sprzęcie jest nieodczuwalne
      - Dysk zaszyfrowany wcześniej własnym mechanizmem pozostaje taki i wymaga ponownego zaszyfrowania
      - Punkt pokaże się wtedy jako spełniony, choć dysk nadal szyfruje się sam
      - Jest to jedyny przypadek w tej regule wymagający działania poza zapisaniem wartości
      - Odblokowywanie dysków, dostęp do plików, logowanie i drukowanie pozostają bez zmian
    en:
      - The enciphering weighs upon the machine s processor instead of a circuit in the drive, which upon newer gear is not felt
      - A drive enciphered earlier by its own mechanism stays so and calls for an enciphering again
      - The item will then show as met, though the drive still enciphers of itself
      - It is the one case in this rule calling for a doing beyond the writing of a value
      - The unlocking of drives, the way to files, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna nie obsługuje przyspieszenia szyfrowania w instrukcjach procesora, a obciążenie byłoby odczuwalne
    en:
      - The machine does not handle the hastening of enciphering in the processor s own instructions and the weight would be felt
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. All three have to be
      # at zero, and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $names = @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $names) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne 0) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'ALL_DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # All three classes of drive go in together. One of them left open means the
    # drive s own enciphering is still taken where the drive claims to offer it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    foreach ($name in @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')) {
      Set-ItemProperty -Path $path -Name $name -Value 0 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w całej rodzinie jedyną bez uciążliwości i warto, żeby
    aplikacja postawiła ją wysoko. Kosztuje trzy wpisy, nie zmienia niczego
    w pracy ludzi, a usuwa zależność od jakości, której nikt nie ma jak
    zweryfikować.

    Argument wart postawienia wprost dotyczy tego, co tu jest sprawdzane.
    System pyta dysk, czy potrafi szyfrować, i przyjmuje odpowiedź.
    Nie sprawdza, jak to robi, ani gdzie trzyma klucz — a to są jedyne dwie
    rzeczy, które mają znaczenie. Zaufanie oparte na deklaracji producenta
    nie jest zaufaniem, tylko założeniem.

    Odnotowuję różnicę między raportem a stanem, bo powtarza się w całej
    tej rodzinie. Wpis obowiązuje szyfrowanie zakładane później; dysk
    zaszyfrowany własnym układem wcześniej pozostaje taki. Punkt zielony
    mówi wtedy o zasadzie, a nie o nośniku.
  en: |
    The rule is the only one of the whole family without disruption, and it is well that the application set it
    high. It costs three entries, changes nothing in people's work, and takes away a hanging upon a quality nobody
    has any way to prove.

    The argument worth putting outright touches what is checked here. The system asks the drive whether it can
    encipher and takes the answer. It does not check how it does so, nor where it keeps the key - and those are
    the only two things that count. A trust resting upon a maker's declaration is no trust but an assumption.

    I set down the difference between the report and the state, it repeating throughout this family. The entry
    holds for enciphering laid on later; a drive enciphered by its own circuit earlier stays so. A green item
    speaks then of the policy and not of the drive.
