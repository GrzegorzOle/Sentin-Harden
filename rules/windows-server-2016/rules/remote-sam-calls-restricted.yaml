id: win2016-remote-sam-calls-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zdalne odpytywanie bazy kont ograniczone do administratorów
    en: Remote querying of the accounts database limited to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza zdalne odpytywanie bazy kont do administratorów
    lokalnych, zamiast pozwalać na nie każdemu uwierzytelnionemu.

    Różnica wobec punktów o wyliczaniu anonimowym jest istotna i warto ją
    postawić wprost. Tamte zamykały pytania zadawane bez logowania. Ten
    zamyka pytania zadawane przez kogokolwiek, kto się zalogował — również
    przez konto najsłabsze, jakie w organizacji istnieje.

    Kategoria wysoka, bo właśnie to jest zwykle drugi krok ataku. Napastnik
    ma już jedno przejęte konto, zwykle mało znaczące, i chce wiedzieć, kogo
    warto przejąć następnie. Baza kont odpowiada mu na to pytanie: kto należy
    do grup administracyjnych, kto jest kontem usługowym, kto ma uprawnienia
    szersze, niż wynika z nazwy.

    Na serwerze 2016 warto zwrócić uwagę na samo istnienie tego ustawienia.
    To jest wydanie, w którym je wprowadzono — na maszynach starszych nie ma
    go wcale, a na tej trzeba je ustawić świadomie, bo domyślnie pozostaje
    puste.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: mapę
    uprawnień w organizacji, uzyskaną z dowolnego przejętego konta, bez
    podnoszenia uprawnień i bez śladu wyglądającego na atak.
  en: |
    The item limits remote querying of the accounts database to local
    administrators, instead of allowing it to anybody authenticated.

    The difference from the items about anonymous enumeration matters and is
    worth stating plainly. Those closed questions asked without signing in. This
    one closes questions asked by anybody who has signed in - including by the
    weakest account the organisation has.

    The category is high, because this is usually the second step of an attack.
    The attacker already holds one account, typically an unimportant one, and
    wants to know who is worth taking next. The accounts database answers that
    question: who belongs to administrative groups, who is a service account,
    who holds rights broader than their name suggests.

    On Server 2016 the very existence of this setting is worth noting. This is
    the release in which it was introduced - on older machines there is none at
    all, and on this one it has to be set deliberately, because by default it
    stays empty.

    What an attacker gains while the item goes unmet: a map of privilege across
    the organisation, obtained from any account they have taken, with no
    elevation and no trace that looks like an attack.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy narzędzi, które pytają
    o konta z konta niebędącego administratorem.

    Typowe przypadki to systemy inwentaryzacyjne, oprogramowanie zarządzające
    stacjami, narzędzia zgodności oraz skrypty raportujące członkostwo
    w grupach. Wszystkie one działają często na koncie usługowym celowo
    pozbawionym uprawnień administracyjnych — i to jest właśnie ten przypadek,
    w którym ustawienie zaboli.

    Rozwiązanie nie polega na cofnięciu zmiany. Opis uprawnień, który ta
    reguła zapisuje, można rozszerzyć o wskazane konto, zostawiając
    ograniczenie w mocy. Warto o tym wiedzieć przed pierwszym zgłoszeniem, bo
    odruchem bywa wyłączenie całości.

    Na serwerze 2016 warto sprawdzić również to, czy coś w instalacji nie
    zakłada starego zachowania. Maszyny starsze od tej nie mają tego
    ustawienia i tamtejsze narzędzia pisano, gdy odpowiedź przychodziła
    zawsze.

    Czego to nie psuje: logowania, pracy domeny, zarządzania z konta
    administratora, uwierzytelniania ani udostępniania plików.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about tools that ask about
    accounts from an account that is not an administrator.

    The usual cases are inventory systems, workstation management software,
    compliance tools and scripts reporting group membership. All of those often
    run under a service account deliberately kept without administrative rights
    - and that is exactly the case where this setting will hurt.

    The answer is not to undo the change. The permission description this rule
    writes can be widened by a named account while leaving the restriction in
    force. That is worth knowing before the first ticket, because the reflex is
    to switch the whole thing off.

    On Server 2016 it is also worth checking whether anything in the
    installation assumes the old behaviour. Machines older than this one do not
    have the setting at all, and tools from there were written when an answer
    always came.

    What this does not break: signing in, the domain's work, management from an
    administrator account, authentication, or file sharing.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - logging-and-audit
  what_breaks:
    pl:
      - Narzędzia inwentaryzacyjne i zgodności pytające o konta z konta bez uprawnień administracyjnych przestają dostawać odpowiedź
      - Skrypty raportujące członkostwo w grupach zdalnie kończą się pustym wynikiem albo odmową
      - Wyjątek dopisuje się do opisu uprawnień, zamiast wyłączać ograniczenie
      - Logowanie, praca domeny i zarządzanie z konta administratora działają bez zmian
    en:
      - Inventory and compliance tools asking about accounts from an account without administrative rights stop receiving an answer
      - Scripts reporting group membership remotely end in an empty result or a refusal
      - An exception is added to the permission description rather than by switching the restriction off
      - Signing in, the domain's work and management from an administrator account work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszynę odpytuje narzędzie działające na koncie bez uprawnień administracyjnych, a konta tego nie dopisano jeszcze do opisu uprawnień
    en:
      - A tool running under an account without administrative rights queries the machine and that account has not yet been added to the permission description
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is a security descriptor in text form, not a number. It is
      # compared after stripping spaces and case, because the same permission can
      # be written in more than one way.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictRemoteSAM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value -or [string]$value -eq '') { 'MISSING' }
        else {
          $normalised = ([string]$value -replace '\s', '').ToUpperInvariant()
          if ($normalised -eq 'O:BAG:BAD:(A;;RC;;;BA)') { 'ADMINS_ONLY' }
          else { 'OTHER ' + $value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ADMINS_ONLY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'RestrictRemoteSAM' -ErrorAction SilentlyContinue).'RestrictRemoteSAM'
    [pscustomobject]@{
      path        = $path
      name        = 'RestrictRemoteSAM'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Read access for the local administrators group and for nobody else. A
    # further account, where one has to ask, is added as another entry in this
    # description rather than by undoing the setting.
    Set-ItemProperty -Path $path -Name 'RestrictRemoteSAM' -Value 'O:BAG:BAD:(A;;RC;;;BA)' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-restrict-clients-allowed-to-make-remote-sam-calls

notes:
  pl: |
    Wartość nie jest liczbą, tylko opisem uprawnień zapisanym tekstem. Audyt
    porównuje go po usunięciu odstępów i sprowadzeniu do jednej wielkości
    liter, bo to samo uprawnienie daje się zapisać na kilka sposobów.

    Wynik inny niż oczekiwany jest zgłaszany razem z treścią wartości, a nie
    jako samo „niezgodne". Przy opisie uprawnień to rozróżnienie ma znaczenie:
    lista rozszerzona o jedno konto jest czym innym niż lista otwarta.

    To ustawienie pojawiło się dopiero w tym wydaniu systemu. Na maszynach
    starszych nie ma go wcale i nie należy szukać tam jego odpowiednika.
  en: |
    The value is not a number but a permission description written as text. The
    audit compares it after stripping spaces and folding case, because the same
    permission can be written in more than one way.

    A result other than the expected one is reported together with the value's
    content rather than as a bare "not compliant". With a permission description
    that distinction matters: a list widened by one account is a different thing
    from an open list.

    This setting first appeared in this release of the system. Older machines do
    not have it at all and no counterpart should be looked for there.
