id: win2016-credential-guard-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Izolacja poświadczeń oparta na wirtualizacji włączona
    en: Virtualisation-based isolation of credentials switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przenosi przechowywanie poświadczeń poza zwykły system
    operacyjny — do osobnego, izolowanego środowiska utrzymywanego przez
    warstwę wirtualizacji.

    Jest to rozwiązanie innego rodzaju niż dwie poprzednie warstwy. Tamte
    ograniczały dostęp do pamięci procesu przechowującego poświadczenia.
    Ta zabiera poświadczenia z tego procesu i umieszcza je tam, dokąd
    system operacyjny nie sięga w ogóle — bo nie ma po temu środków, a nie
    dlatego, że mu zabroniono.

    Różnica jest zasadnicza i warto ją nazwać wprost. Ograniczenie dostępu
    da się obejść, zdobywając uprawnienia wyższe od tych, na których
    ograniczenie się opiera; sterownik jądra wystarczy. Izolacji nie da się
    obejść w ten sposób, bo pełne uprawnienia w systemie nie dają wglądu
    w obszar, którym zarządza warstwa niżej.

    Skutek praktyczny jest taki, że przejęcie maszyny przestaje oznaczać
    przejęcie poświadczeń kont na niej zalogowanych. Napastnik może używać
    sesji zalogowanego konta, dopóki siedzi na tej maszynie — ale nie
    wynosi z niej materiału działającego na maszynach pozostałych. Ruch
    boczny traci swoje główne paliwo.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: materiał
    uwierzytelniający zalogowanych kont, nadający się do użycia na innych
    maszynach po przejęciu tej jednej.
  en: |
    The setting moves the keeping of credentials outside the ordinary operating
    system - into a separate, isolated environment maintained by the virtualisation
    layer.

    This is an answer of a different kind from the two preceding layers. Those
    limited access to the memory of the process keeping credentials. This one takes
    the credentials out of that process and places them where the operating system
    does not reach at all - because it has no means to, not because it was
    forbidden.

    The difference is fundamental and worth naming outright. A limit on access can
    be got round by gaining privileges higher than those the limit rests on; a
    kernel driver is enough. Isolation cannot be got round that way, since full
    privileges in the system give no view into an area managed by the layer below.

    The practical upshot is that taking a machine over ceases to mean taking over
    the credentials of the accounts signed in on it. An attacker can use a signed-in
    account's session for as long as they sit on that machine - but they carry off
    from it no material that works on the rest. Lateral movement loses its chief
    fuel.

    What an attacker gains while the item goes unmet: the authentication material of
    signed-in accounts, fit for use on other machines once this one has been taken
    over.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to na tym wydaniu systemu
    jeden z najcięższych punktów w całym zestawie.

    Wymagania są sprzętowe i trzeba je sprawdzić przed jakąkolwiek zmianą:
    rozszerzenia wirtualizacji w procesorze, rozruch oparty na
    oprogramowaniu układowym nowego typu, bezpieczny rozruch. Maszyna
    starsza może tych warunków nie spełniać, a wtedy wpisy zostaną zapisane
    i nic się nie stanie — punkt pozostanie niespełniony mimo wykonanej
    zmiany.

    Dwa ograniczenia są na tym wydaniu twarde i przesądzają o tym, czy punkt
    ma sens. Pierwsze: kontroler domeny. Izolacji poświadczeń nie stosuje
    się na kontrolerach, bo to one wydają poświadczenia i muszą mieć do nich
    dostęp. Drugie: maszyna będąca gospodarzem maszyn wirtualnych. Warstwa
    wirtualizacji zostaje zajęta przez izolację, co uderza wprost w tę rolę.

    Trzecia rzecz dotyczy uwierzytelniania. Izolacja odbiera mechanizmom
    starszym możliwość pobrania poświadczenia z pamięci, więc to, co
    działało przez przekazanie zapisanego hasła, przestanie działać.
    Dotyczy to zwłaszcza połączeń do zasobów wymagających starszego
    protokołu i oprogramowania jednokrotnego logowania.

    Czego to nie psuje: logowania kontem domenowym, uwierzytelniania
    biletowego, pulpitu zdalnego z właściwym uwierzytelnieniem.

    Wymaga restartu systemu.
  en: |
    The class is "needs a planned rollout", and on this release of the system it is
    one of the heaviest items in the whole set.

    The requirements are of hardware and have to be checked before any change at
    all: virtualisation extensions in the processor, a boot resting on firmware of
    the newer kind, secure boot. An older machine may not meet those conditions, and
    then the entries will be written and nothing will happen - the item will stay
    unmet despite the change having been made.

    Two limits are hard on this release and settle whether the item makes sense at
    all. The first: a domain controller. Credential isolation is not used on
    controllers, since it is they that issue credentials and must have access to
    them. The second: a machine acting as a host for virtual machines. The
    virtualisation layer is taken up by the isolation, which runs straight against
    that role.

    The third thing concerns authentication. The isolation deprives older mechanisms
    of the means of fetching a credential from memory, so whatever worked by passing
    a stored password on will stop working. This concerns above all connections to
    resources calling for an older protocol, and single sign-on software.

    What this does not break: signing in with a domain account, ticket
    authentication, or the remote desktop with proper authentication.

    Calls for the system to be restarted.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - boot-and-firmware
    - virtualization-and-containers
    - legacy-authentication
  what_breaks:
    pl:
      - Maszyna będąca gospodarzem maszyn wirtualnych traci warstwę wirtualizacji zajętą przez izolację, co uderza wprost w tę rolę
      - Na kontrolerze domeny izolacji nie stosuje się w ogóle, bo to on wydaje poświadczenia i musi mieć do nich dostęp
      - Połączenia do zasobów wymagających starszego protokołu oraz oprogramowanie jednokrotnego logowania przestają pobierać poświadczenie z pamięci
      - Maszyna niespełniająca wymagań sprzętowych przyjmie wpisy i nic się nie stanie - punkt pozostanie niespełniony mimo wykonanej zmiany
    en:
      - A machine acting as a host for virtual machines loses the virtualisation layer to the isolation, which runs straight against that role
      - On a domain controller the isolation is not used at all, since it is the controller that issues credentials and must have access to them
      - Connections to resources calling for an older protocol, and single sign-on software, stop fetching credentials from memory
      - A machine not meeting the hardware requirements will take the entries and nothing will happen - the item will stay unmet despite the change
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest kontrolerem domeny albo gospodarzem maszyn wirtualnych
      - Nie potwierdzono wymagań sprzętowych — rozszerzeń wirtualizacji w procesorze, rozruchu z oprogramowania układowego nowego typu i bezpiecznego rozruchu
      - Na maszynie działa oprogramowanie jednokrotnego logowania albo połączenia wymagające starszego protokołu uwierzytelniania
    en:
      - The machine is a domain controller or a host for virtual machines
      - The hardware requirements have not been confirmed - virtualisation extensions in the processor, a boot from firmware of the newer kind, and secure boot
      - Single sign-on software, or connections calling for an older authentication protocol, run on the machine
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $dg = Get-CimInstance -ClassName Win32_DeviceGuard `
        -Namespace 'root\Microsoft\Windows\DeviceGuard' -ErrorAction Stop
      if ($null -eq $dg) { 'CHECK_ERROR' }
      elseif ($dg.SecurityServicesRunning -contains 1) { 'RUNNING' }
      else { 'NOT_RUNNING' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'RUNNING'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $lsa = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $dg  = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    [pscustomobject]@{
      lsa_cfg_flags  = (Get-ItemProperty -Path $lsa -Name 'LsaCfgFlags' -ErrorAction SilentlyContinue).LsaCfgFlags
      vbs_enabled    = (Get-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -ErrorAction SilentlyContinue).EnableVirtualizationBasedSecurity
      platform_flags = (Get-ItemProperty -Path $dg -Name 'RequirePlatformSecurityFeatures' -ErrorAction SilentlyContinue).RequirePlatformSecurityFeatures
      dg_key_existed = (Test-Path -Path $dg)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a host of virtual machines try this on a twin machine first: it runs
    # straight against that role and a restart is needed either way.
    $dg = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $dg)) { New-Item -Path $dg -Force | Out-Null }
    Set-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord
    Set-ItemProperty -Path $dg -Name 'RequirePlatformSecurityFeatures' -Value 1 -Type DWord
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'LsaCfgFlags' -Value 1 -Type DWord

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/credential-guard/

notes:
  pl: |
    Punkt nie ma przycisku „Uruchom" i nie jest to przeoczenie. Włączenie
    z blokadą w oprogramowaniu układowym zostawia stan, z którego nie da się
    wrócić poleceniem: przywrócenie wartości w rejestrze nie wyłączy
    funkcji, bo decyzja zostaje zapisana poza systemem. Zgodnie z zasadą
    projektu reguła bez wiarygodnego wycofania nadaje się wyłącznie do
    skopiowania i wykonania świadomie, z dostępem do maszyny.

    Kopia zapasowa jest mimo to dołączona i zapisuje stan obu kluczy przed
    zmianą — żeby było wiadomo, od czego się zaczęło, nawet jeśli powrót
    wymaga pracy przy maszynie.

    Audyt nie czyta rejestru, tylko pyta system, co faktycznie działa.
    Jest to różnica istotna właśnie tutaj: wpisy można zapisać na maszynie,
    która wymagań sprzętowych nie spełnia, i rejestr będzie wyglądał na
    zgodny, mimo że izolacja nie została uruchomiona. Reguła zwraca stan
    uruchomienia, nie stan zamiaru.

    Na tym wydaniu systemu punkt jest realny, ale wąski: maszyna musi nie
    być ani kontrolerem domeny, ani gospodarzem maszyn wirtualnych,
    i musi mieć odpowiedni sprzęt. Tam gdzie te warunki zachodzą, jest to
    najmocniejsze pojedyncze zabezpieczenie poświadczeń, jakie system
    oferuje.
  en: |
    The item has no button "Run" and that is no oversight. Switching it on with a
    lock in the firmware leaves a state there is no returning from by a command:
    setting the registry value back will not switch the feature off, since the
    decision is written outside the system. By the project's rule, a rule with no
    trustworthy way back is fit only to be copied and carried out deliberately, with
    access to the machine.

    A backup is set alongside all the same, recording the state of both keys before
    the change - so that it is known where things began, even if the return calls
    for work at the machine.

    The audit does not read the registry but asks the system what is actually
    running. That difference matters exactly here: the entries can be written on a
    machine not meeting the hardware requirements, and the registry will look
    compliant though the isolation was never started. The rule returns the state of
    running, not the state of intent.

    On this release of the system the item is real but narrow: the machine must be
    neither a domain controller nor a host for virtual machines, and must have the
    right hardware. Where those conditions hold, it is the strongest single
    safeguard of credentials the system offers.
