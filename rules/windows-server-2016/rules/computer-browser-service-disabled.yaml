id: win2016-computer-browser-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa prowadząca spis maszyn w sieci lokalnej wyłączona
    en: The service keeping a register of machines on the local network disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa prowadzi spis maszyn widocznych w sieci lokalnej — ten sam, który
    pokazuje się w oknie otoczenia sieciowego.

    Sposób, w jaki spis powstaje, jest tutaj całą treścią punktu. Maszyny
    rozgłaszają swoją obecność w segmencie, a jedna z nich zostaje wybrana
    na prowadzącą spis. Wybór odbywa się między samymi maszynami, według
    reguły, w której wygrywa ta o wyższej wersji systemu i dłuższym czasie
    pracy. Nikt tego wyboru nie zatwierdza.

    Znaczy to, że dowolna maszyna w segmencie może wygrać ten wybór — także
    taka, którą napastnik właśnie do segmentu wstawił. Prowadząca spis
    decyduje, co widzą wszystkie pozostałe, a więc może pokazać maszyny,
    których nie ma, i ukryć te, które są. Jest to wpływ na obraz sieci
    u wszystkich naraz, uzyskany bez żadnego uprawnienia.

    Rzecz druga jest równie ważna: mechanizm ten należy do starego
    protokołu udostępniania plików i podtrzymuje jego obecność w sieci.
    Wygaszanie tego protokołu bez wygaszenia spisu zostawia połowę drogi
    otwartą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wygrania wyboru na prowadzącego spis i podstawienia wszystkim maszynom
    w segmencie obrazu sieci, który sam ułożył.
  en: |
    The service keeps a register of the machines visible on the local network - the same
    one shown in the network neighbourhood window.

    The way the register comes about is here the item's whole substance. Machines
    broadcast their presence in the segment, and one of them is chosen to keep the
    register. The choice is made among the machines themselves, by a rule in which the
    one with the higher system version and the longer running time wins. Nobody approves
    that choice.

    That means any machine in the segment may win that choice - including one an
    attacker has just put into the segment. The one keeping the register decides what
    all the rest see, and so may show machines that are not there and hide those that
    are. It is a sway over the picture of the network at all of them at once, got with
    no permission whatever.

    The second matter is as important: that mechanism belongs to the old file sharing
    protocol and keeps its presence on the network alive. Putting that protocol out
    without putting the register out leaves half the road open.

    What an attacker gains while the item goes unmet: the chance to win the choice of
    register keeper and to supply every machine in the segment with a picture of the
    network they laid out themselves.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a skutek jest tu widoczny dla użytkownika
    i to odróżnia ten punkt od pozostałych w bloku.

    Okno otoczenia sieciowego przestaje pokazywać maszyny. Pozostaje puste
    albo pokazuje znacznie mniej niż dotąd, zależnie od tego, co robią
    sąsiednie maszyny w segmencie. Jest to zmiana, którą widać od razu i o
    którą ludzie pytają.

    Rzecz, którą trzeba powiedzieć wyraźnie, brzmi: dostęp do udziałów
    działa dalej. Ścieżka wpisana wprost, dysk zmapowany, skrót na pulpicie,
    skrypt logowania — wszystko to idzie inną drogą i nie zależy od spisu.
    Znika przeglądanie, nie dostęp. Bez tego zdania użytkownik przeczyta
    pustą listę jako utratę dostępu do plików.

    Sprawdzić warto dwie rzeczy. Pierwsza to sposób pracy ludzi — czy ktoś
    dociera do zasobów przez przeglądanie otoczenia, zamiast przez zapisaną
    ścieżkę. Druga to starsze aplikacje i urządzenia, zwłaszcza
    wielofunkcyjne, które wyszukują serwer plików przeglądając segment,
    bo nie umieją inaczej.

    Czego to nie psuje: dostępu do udziałów po nazwie i po ścieżce,
    zmapowanych dysków, skryptów logowania, pulpitu zdalnego,
    uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and the consequence is here visible to the user, and
    that sets this item apart from the rest in the block.

    The network neighbourhood window stops showing machines. It stays empty or shows far
    less than before, according to what the neighbouring machines in the segment do. It
    is a change seen at once and asked about.

    The thing that has to be said clearly runs: access to shares works on. A path typed
    outright, a mapped drive, a shortcut on the desktop, a logon script - all of that
    goes by another road and does not depend on the register. What vanishes is the
    browsing, not the access. Without that sentence a user will read an empty list as a
    loss of access to files.

    Two things are worth checking. The first is how people work - whether anybody
    reaches resources by browsing the neighbourhood rather than by a saved path. The
    second is older applications and devices, multifunction ones above all, which seek
    the file server out by browsing the segment, not knowing how otherwise.

    What this does not break: access to shares by name and by path, mapped drives, logon
    scripts, the remote desktop, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Okno otoczenia sieciowego przestaje pokazywać maszyny - lista zostaje pusta albo znacznie krótsza
      - Dostęp do udziałów po nazwie i po ścieżce działa dalej, bo znika przeglądanie, a nie dostęp
      - Starsze urządzenia wielofunkcyjne wyszukujące serwer plików przez przeglądanie segmentu przestaną go znajdować
      - Zmapowane dyski, skróty, skrypty logowania i pulpit zdalny pozostają bez zmian
    en:
      - The network neighbourhood window stops showing machines - the list stays empty or far shorter
      - Access to shares by name and by path works on, since what vanishes is the browsing, not the access
      - Older multifunction devices seeking the file server out by browsing the segment will stop finding it
      - Mapped drives, shortcuts, logon scripts and the remote desktop stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Ludzie w tej organizacji docierają do zasobów przez przeglądanie otoczenia sieciowego i nie mają zapisanych ścieżek
      - W sieci pracują urządzenia wielofunkcyjne wyszukujące serwer plików wyłącznie przez przeglądanie segmentu
    en:
      - People in this organisation reach resources by browsing the network neighbourhood and have no saved paths
      - Multifunction devices seeking the file server out solely by browsing the segment work on the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'Browser' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The network neighbourhood list goes empty. Access to shares by name and by
    # path works on unchanged - only the browsing of the list stops.
    Stop-Service -Name 'Browser' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Browser' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'Browser' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/network-browsing-overview

notes:
  pl: |
    Punkt odstaje od reszty bloku dwiema rzeczami i obie warto pokazać.
    Jest jedyny na poziomie pierwszym, a nie drugim, i jedyny, którego
    skutek użytkownik zobaczy tego samego dnia.

    Widoczność skutku jest tu ważniejsza niż jego waga. Nic się nie psuje,
    ale coś znika z ekranu — a to jest rodzaj zmiany, który generuje
    zgłoszenia nawet wtedy, gdy nikomu niczego nie odebrał. Opis dla
    użytkownika powinien zaczynać się od zdania o dostępie, który działa
    dalej, a nie od zdania o liście, która przestaje się wypełniać.

    Powiązanie ze starym protokołem udostępniania plików warto pokazać
    jako wspólny wątek. Kto wygasza ten protokół, powinien wygasić także
    spis — inaczej zostawia mechanizm, który nadal rozgłasza i nadal
    prowadzi wybór o tym, komu wszyscy uwierzą.
  en: |
    The item stands apart from the rest of the block in two things, and both are worth
    showing. It is the only one at the first level rather than the second, and the only
    one whose consequence the user will see the same day.

    The visibility of the consequence matters more here than its weight. Nothing breaks,
    but something vanishes from the screen - and that is the kind of change which
    generates reports even where it took nothing from anybody. The description for the
    user should begin with the sentence about access working on, not with the sentence
    about a list that stops filling.

    The tie to the old file sharing protocol is worth showing as a common thread.
    Whoever puts that protocol out should put the register out as well - otherwise they
    leave a mechanism that still broadcasts and still holds a choice about whom everyone
    will believe.
