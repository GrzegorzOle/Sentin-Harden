id: win2025-profile-system-performance-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Profilowanie wydajności systemu ograniczone
    en: Profiling system performance restricted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala zbierać dane o wydajności całego systemu — czyli
    obserwować, co i kiedy dzieje się w jądrze oraz we wszystkich
    procesach naraz.

    Brzmi to niewinnie, bo pomiar wydajności niczego nie zmienia. Rzecz
    w tym, że dane te są zaskakująco wymowne. Wykaz wywołań jądra
    w czasie, obciążenie procesora w podziale na procesy i częstość
    operacji dyskowych pozwalają odtworzyć, co maszyna robiła, nawet
    jeżeli nie widać treści.

    Praktyczne zastosowanie jest dwojakie. Rozpoznanie: napastnik po
    obciążeniu i porach pracy odczytuje, które usługi są na serwerze
    ważne, kiedy wykonują się kopie zapasowe i kiedy maszyna jest
    najsłabiej pilnowana. Drugie zastosowanie jest subtelniejsze —
    pomiary czasu wykonania operacji kryptograficznych bywają drogą do
    wnioskowania o przetwarzanych danych.

    Na serwerze rozpoznanie jest wartościowsze niż na stanowisku
    roboczym, bo serwer ma rytm regularny i przewidywalny. Jeden dzień
    obserwacji wystarczy, żeby ustalić harmonogram całego tygodnia.

    Punkt zawęża wykaz do administratorów, dopuszczając obecność konta
    usługi diagnostycznej systemu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    rozpoznanie rytmu pracy serwera i jego usług krytycznych, bez
    sięgania po żadne dane i bez pozostawiania śladu.
  en: |
    The right allows data about the whole system's performance to be gathered - that is, what
    happens in the kernel and in every process at once, and when, to be watched.

    That sounds harmless, since a measuring of performance changes nothing. The thing is that
    those data are surprisingly telling. A list of kernel calls over time, the processor's load
    broken down by process and the frequency of disk operations allow what the machine was
    doing to be pieced back, even where no content shows.

    The practical use is twofold. Reconnaissance: from load and hours of work an attacker reads
    which services matter on the server, when backups are made and when the machine is least
    watched. The second use is subtler - measurings of how long cryptographic operations take
    are at times a road to reasoning about the data being handled.

    On a server reconnaissance is worth more than at a working station, since a server has a
    regular and foreseeable rhythm. One day of watching is enough to settle a whole week's
    schedule.

    The item narrows the list to administrators, allowing the presence of the system's
    diagnostic service account.

    What an attacker gains while the item goes unmet: reconnaissance of the server's rhythm of
    work and of its critical services, without reaching for any data and without leaving a
    trace.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym prawo mają administratorzy i konto usługi
    diagnostycznej systemu, więc na większości serwerów naprawa nie
    zmienia niczego.

    Zbieranie danych o wydajności przez system działa dalej. Liczniki
    wydajności, wykresy w narzędziach systemowych i dane widoczne
    w monitorze zasobów pozostają bez zmiany — nie zależą od tego prawa.

    Prawo dotyczy profilowania całego systemu, a nie odczytu liczników.
    Jest to rozróżnienie istotne i najczęściej mylone: agent monitorujący
    odczytujący liczniki wydajności nie potrzebuje tego prawa i po
    zmianie działa dalej.

    Skutek dotyczy narzędzi, które faktycznie profilują jądro —
    narzędzi analizy wydajności producenta i profilerów używanych przy
    dostrajaniu aplikacji. Pracują one zwykle na koncie administratora
    i są uruchamiane doraźnie, więc na serwerze skutek bywa zerowy.

    Objaw, gdyby wystąpił, jest natychmiastowy: narzędzie odmawia
    rozpoczęcia sesji zbierania danych.
  en: |
    The change has no known side effects and takes no break.

    In the default state administrators and the system's diagnostic service account hold the
    right, so on most servers the mending changes nothing.

    The system's gathering of performance data goes on working. Performance counters, the
    charts in the system's tools and the data seen in the resource monitor stay unchanged -
    they do not hang on this right.

    The right bears on profiling the whole system rather than on reading counters. That is a
    weighty distinction and the most often mistaken one: a monitoring agent reading performance
    counters does not take this right and works on after the change.

    The effect concerns tools that in fact profile the kernel - a maker's performance analysis
    tools and the profilers used at the tuning of applications. Those usually work under an
    administrator's account and are started as the need arises, so on a server the effect is at
    times nil.

    The symptom, should it arise, is immediate: the tool refuses to begin a session of
    gathering.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzie profilujące jądro na koncie spoza wykazu odmówi rozpoczęcia sesji
      - Agent monitorujący odczytujący liczniki wydajności nie potrzebuje tego prawa i działa dalej
      - Liczniki wydajności i monitor zasobów pozostają bez zmiany
      - W stanie domyślnym wykaz obejmuje dokładnie to, czego wymaga punkt
    en:
      - A tool profiling the kernel under an account outside the list will refuse to begin a session
      - A monitoring agent reading performance counters does not take this right and works on
      - Performance counters and the resource monitor stay unchanged
      - In the default state the list takes in exactly what the item asks for
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie analizy wydajności pracuje stale na koncie spoza grupy administratorów
    en:
      - A performance analysis tool works steadily under an account outside the administrators' group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420)?|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemProfilePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The diagnostic service account stays in the list where it is already
    # there, since removing it stops the system's own performance gathering.
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $diag = 'S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420'
    $value = '*S-1-5-32-544'
    if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') {
      if ($Matches[1] -match [regex]::Escape($diag)) { $value = '*S-1-5-32-544,*' + $diag }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemProfilePrivilege = ' + $value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemProfilePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/profile-system-performance

notes:
  pl: |
    Najczęstszym nieporozumieniem przy tym punkcie jest mylenie
    profilowania z odczytem liczników wydajności. Agent monitorujący
    odczytujący liczniki nie potrzebuje tego prawa i po zmianie działa
    dalej.

    Sprawdzenie dopuszcza obecność konta usługi diagnostycznej systemu
    obok administratorów. Naprawa zachowuje je, jeżeli już tam jest —
    usunięcie zatrzymałoby zbieranie danych prowadzone przez sam system.

    Punkt czyta się razem z profilowaniem pojedynczego procesu.
    Tamten zawęża obserwację procesów cudzych, ten — obserwację jądra
    i całej maszyny.
  en: |
    The commonest misunderstanding at this item is mistaking profiling for the reading of
    performance counters. A monitoring agent reading counters does not take this right and
    works on after the change.

    The check allows the system's diagnostic service account beside the administrators. The
    mending keeps it where it is there already - removing it would halt the gathering of data
    the system itself leads.

    The item is read together with the profiling of a single process. That one narrows the
    watching of others' processes; this one, the watching of the kernel and the whole machine.
