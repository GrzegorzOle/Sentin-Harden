id: win11-peer-networking-grouping-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa grupowania maszyn w sieci równorzędnej wyłączona
    en: The grouping service for peer networking disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa tworzy i utrzymuje grupy maszyn łączących się ze sobą bezpośrednio,
    bez serwera. Zarządza przystępowaniem do grupy, rozsyła między jej
    członkami informacje o obecności i utrzymuje połączenia, po których
    programy wymieniają dane.

    Jest to warstwa stojąca wyżej niż samo rozwiązywanie nazw i właśnie
    dlatego zasługuje na osobną regułę. Rozwiązywanie nazw pozwala znaleźć
    maszynę. Grupowanie pozwala utworzyć trwałą strukturę, do której maszyny
    należą, i przez którą przepływają dane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, najlepiej widać
    po tym, czego taka grupa nie wymaga. Nie wymaga serwera, więc nie ma
    miejsca, w którym administrator widzi jej istnienie. Nie wymaga kont
    domenowych, bo członkostwo opiera się na tożsamościach zakładanych na
    maszynach. Nie wymaga zgody nikogo poza uczestnikami. Grupa taka jest więc
    kanałem wymiany danych, który powstaje w sieci organizacji bez śladu
    w żadnym miejscu, w którym ktokolwiek go szuka.

    Drugi zysk to sama usługa: utrzymuje połączenia przychodzące i przetwarza
    dane od innych maszyn, więc jest powierzchnią istniejącą niezależnie od
    tego, czy ktokolwiek świadomie z mechanizmu korzysta.
  en: |
    The service creates and keeps up groups of machines joining one another directly,
    with no server. It manages joining a group, passes word of members' presence between
    them and keeps up the connections over which programs exchange data.

    This is a layer standing above the resolving of names, and that is exactly why it
    deserves a rule of its own. Resolving names allows a machine to be found. Grouping
    allows a lasting structure to be made, one machines belong to and through which data
    flow.

    What an attacker gains while the item goes unmet shows best in what such a group does
    not require. It requires no server, so there is no place where an administrator sees
    that it exists. It requires no domain accounts, since membership rests on identities
    set up on the machines. It requires nobody's consent but the participants'. Such a
    group is therefore a channel for exchanging data that comes into being on an
    organisation's network with no trace in any place where anybody looks for one.

    The second gain is the service itself: it keeps up incoming connections and handles
    data from other machines, so it is surface existing whether or not anybody knowingly
    uses the mechanism.

disruption_description:
  pl: |
    Sprawdzenia wymaga to samo, co przy rozwiązywaniu nazw w sieci równorzędnej,
    bo obie usługi obsługują te same zastosowania.

    Po wyłączeniu usługi przestaje działać pomoc zdalna zestawiana krótkim
    hasłem zamiast pliku zaproszenia oraz starsze narzędzia współpracy oparte
    na grupach maszyn. Grupa domowa, mechanizm udostępniania plików między
    maszynami w sieci domowej, została z systemu usunięta i nie jest już
    powodem do ostrożności.

    Osobno warto sprawdzić programy branżowe wymieniające dane bezpośrednio
    między stanowiskami — na przykład rozwiązania rejestrujące pracę wielu
    osób bez serwera pośredniczącego. Jest to przypadek rzadki, ale gdy
    zachodzi, skutek jest natychmiastowy i dotyczy całej grupy stanowisk
    naraz, a nie jednego.

    Udostępnianie plików przez udziały sieciowe nie korzysta z tego mechanizmu
    i działa dalej bez zmiany. Ta różnica bywa źródłem nieporozumień przy
    ocenie skutków.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is the same as with resolving names in peer networking, since
    both services serve the same uses.

    Once the service is off, remote help set up with a short password instead of an
    invitation file stops working, as do older collaboration tools resting on groups of
    machines. The home group, a mechanism for sharing files between machines on a home
    network, has been taken out of the system and is no longer cause for care.

    Line-of-business programs exchanging data straight between stations are worth
    checking separately - for instance solutions recording several people's work with no
    server in between. That case is rare, but where it holds the effect is immediate and
    concerns a whole group of stations at once rather than one.

    Sharing files through network shares does not use this mechanism and carries on
    unchanged. That difference is sometimes a source of misunderstanding when effects are
    weighed.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Pomoc zdalna zestawiana krótkim hasłem zamiast pliku zaproszenia przestaje działać
      - Starsze narzędzia współpracy oparte na grupach maszyn nie utworzą ani nie odnajdą grupy
      - Program branżowy wymieniający dane bezpośrednio między stanowiskami traci łączność z grupą
      - Udostępnianie plików przez udziały sieciowe działa dalej bez żadnej zmiany
    en:
      - Remote help set up with a short password instead of an invitation file stops working
      - Older collaboration tools resting on groups of machines will neither make nor find a group
      - A line-of-business program exchanging data straight between stations loses touch with its group
      - Sharing files through network shares carries on with no change at all
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Program branżowy wymienia dane bezpośrednio między stanowiskami bez serwera
      - Pomoc zdalna prowadzona jest wariantem z krótkim hasłem zamiast pliku zaproszenia
    en:
      - A line-of-business program exchanges data straight between stations with no server
      - Remote help is given in the variant with a short password instead of an invitation file
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'p2psvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2psvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'p2psvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-to-peer

notes:
  pl: |
    Reguła należy do czwórki opisującej łączność równorzędną i jej wynik należy
    czytać razem z pozostałymi trzema. Usługa zależy od rozwiązywania nazw
    i od zarządzania tożsamościami, więc wyłączenie tamtych czyni ją
    bezużyteczną — ale nie wyłączoną. Zapis w rejestrze pozostaje i mechanizm
    wraca razem z tamtymi.

    Na maszynie bez zainstalowanego składnika łączności równorzędnej usługi
    nie ma i audyt zwróci wynik „nie dotyczy".

    Wyłączenie usługi nie ma wpływu na udziały sieciowe, na rozwiązywanie nazw
    przez serwer nazw ani na programy komunikujące się przez serwer
    pośredniczący, czyli na zdecydowaną większość pracy biurowej.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The rule belongs to a quartet describing peer connectivity and its result should be
    read together with the other three. The service depends on the resolving of names and
    on the managing of identities, so disabling those makes it useless - but not
    disabled. The registry entry stays and the mechanism comes back together with them.

    On a machine with no peer connectivity component installed the service is absent and
    the audit returns "not applicable".

    Disabling the service bears on neither network shares, nor resolving names through a
    name server, nor programs communicating through a server in between - that is, on the
    great majority of office work.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
