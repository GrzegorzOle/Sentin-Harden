id: ubuntu2404-rsyslog-installed

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.1.3.1
  section: Logging and Auditing > System Logging > Configure rsyslog
  title:
    pl: rsyslog jest zainstalowany
    en: Ensure rsyslog is installed
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    rsyslog zapisuje komunikaty systemu w zwykłych plikach tekstowych
    w /var/log i umie wysyłać je na serwer dzienników. Gdy wybranym systemem
    dzienników jest rsyslog, pakiet musi być zainstalowany.

    Punkt wymaga pakietu rsyslog na komputerach, które go używają.
  en: |
    rsyslog writes system messages to plain text files in /var/log and can
    send them to a log server. When rsyslog is the chosen logging system,
    the package has to be installed.

    The item requires the rsyslog package on computers that use it.

disruption_description:
  pl: |
    Nikt tego nie zauważy: reguła tylko sprawdza, czy pakiet jest
    zainstalowany.
  en: |
    Nobody will notice: the rule only checks whether the package is
    installed.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v dpkg-query >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    v=$(dpkg-query -W -f='${db:Status-Status} ${Version}' rsyslog 2>/dev/null) || true
    case "$v" in
      "installed "*) echo "INSTALLED:rsyslog ${v#installed }" ;;
      *) echo NOT_APPLICABLE ;;
    esac
  expected: '^INSTALLED:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://www.rsyslog.com/doc/

notes:
  pl: |
    Wynik INSTALLED podaje wersję pakietu z dpkg. Brak pakietu oznacza, że
    dzienniki prowadzi sam journald, więc wynik to NOT_APPLICABLE
    i obowiązują punkty 6.1.2. Ubuntu Server instaluje rsyslog domyślnie.
    Kto chce go przywrócić, instaluje go ręcznie (apt install rsyslog);
    wybór systemu dzienników należy do administratora, więc reguła niczego
    nie instaluje.
  en: |
    The INSTALLED result gives the package version from dpkg. A missing
    package means that journald alone keeps the logs, so the result is
    NOT_APPLICABLE and items 6.1.2 apply. Ubuntu Server installs rsyslog by
    default. Whoever wants it back installs it by hand (apt install
    rsyslog); the choice of the logging system belongs to the administrator,
    so the rule installs nothing.
