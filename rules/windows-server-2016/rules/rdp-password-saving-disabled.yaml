id: win2016-rdp-password-saving-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Connection Client
  title:
    pl: Zapisywanie haseł w kliencie pulpitu zdalnego zablokowane
    en: Saving passwords in the remote desktop client blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi pulpitu zdalnego zapamiętywania haseł do
    maszyn, z którymi się łączy.

    Punkt dotyczy strony wychodzącej, nie przychodzącej — i dlatego łatwo go
    na serwerze przeoczyć. Cała reszta ustawień pulpitu zdalnego opisuje
    serwer jako miejsce, do którego ktoś się łączy. Ten opisuje go jako
    miejsce, z którego ktoś łączy się dalej.

    Rzecz ma na serwerze wagę większą niż na stanowisku i warto powiedzieć
    dlaczego. Z serwera łączą się zwykle osoby zarządzające, a łączą się do
    innych serwerów. Poświadczenia, które tu zapiszą, są poświadczeniami
    o szerokich uprawnieniach, a maszyna, na której zostaną, jest celem
    znacznie atrakcyjniejszym niż pojedyncze stanowisko.

    Skutkiem jest gotowa mapa ruchu bocznego. Kto przejmie tę maszynę, nie
    musi szukać kolejnych celów ani zdobywać do nich haseł — znajduje
    zapisane połączenia i wchodzi dalej tym, co zostawili poprzednicy.
    Właśnie ta różnica — między przejęciem jednej maszyny a przejęciem
    drogi do pozostałych — decyduje o kategorii ryzyka tego punktu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapisane
    poświadczenia do innych maszyn, czyli gotową drogę dalej z tej, którą
    już przejął.
  en: |
    The setting forbids the remote desktop client to remember passwords to the
    machines it connects to.

    The item concerns the outgoing side rather than the incoming one - and is for
    that reason easily missed on a server. All the rest of the remote desktop
    settings describe the server as a place somebody connects to. This one describes
    it as a place somebody connects onward from.

    The matter weighs more on a server than on a workstation, and it is worth saying
    why. Those connecting from a server are as a rule the people managing it, and
    they connect to other servers. The credentials they store here are credentials
    with wide privileges, and the machine they stay on is a far more attractive
    target than a single workstation.

    The upshot is a ready map for lateral movement. Whoever takes this machine over
    need not look for further targets or obtain passwords to them - they find the
    stored connections and walk on with what their predecessors left. That very
    difference - between taking over one machine and taking over the road to the
    rest - settles this item's risk category.

    What an attacker gains while the item goes unmet: stored credentials to other
    machines, which is to say a ready road onward from the one they have already
    taken.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć dla większości maszyn zmiana przejdzie
    niezauważona.

    Sprawdzić trzeba jedno: czy z tej maszyny cokolwiek łączy się dalej
    pulpitem zdalnym bez udziału człowieka. Zwykle nie łączy się nic, bo
    serwer jest celem, a nie źródłem sesji. Tam gdzie łączy się — konsole
    skoku, stanowiska zarządzania obsługiwane zdalnie, narzędzia
    przełączające się między maszynami — zapisane poświadczenie bywa
    warunkiem działania.

    Rzecz, którą trzeba wiedzieć przed zmianą: ustawienie zabrania zapisu
    nowych poświadczeń, ale nie usuwa tych, które już leżą w magazynie
    profilu. Te trzeba skasować osobno, inaczej reguła daje zgodność
    w raporcie i nie daje skutku na maszynie. Jest to jeden z niewielu
    punktów, w których samo spełnienie zasady nie wystarcza.

    Dla ludzi skutek jest drobny i przewidywalny: hasło do maszyny docelowej
    trzeba wpisać przy każdym łączeniu.

    Czego to nie psuje: połączeń przychodzących do tej maszyny, sesji już
    otwartych, logowania do konsoli, poświadczeń przekazywanych mechanizmem
    domenowym bez zapisu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though for most machines the change will pass
    unnoticed.

    One thing has to be checked: whether anything connects onward from this machine
    by remote desktop without a person's part in it. As a rule nothing does, since a
    server is the target of sessions rather than their source. Where something does
    - jump consoles, management workstations worked remotely, tools switching
    between machines - a stored credential is at times the condition of its working.

    A thing to know before the change: the setting forbids the storing of new
    credentials but does not remove those already lying in the profile's store.
    Those have to be deleted apart, or else the rule gives compliance in the report
    and no effect on the machine. It is one of the few items where satisfying the
    principle is not by itself enough.

    For people the effect is small and foreseeable: the password to the target
    machine has to be typed at each connecting.

    What this does not break: connections coming in to this machine, sessions
    already open, signing in at the console, credentials passed by the domain
    mechanism without being stored.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia przełączające się między maszynami pulpitem zdalnym z zapisanym poświadczeniem przestają się łączyć
      - Konsola skoku obsługiwana zdalnie wymaga wpisania hasła do maszyny docelowej przy każdym połączeniu
      - Poświadczenia zapisane wcześniej zostają w magazynie profilu i wymagają osobnego usunięcia, bo sama reguła ich nie kasuje
      - Połączenia przychodzące do tej maszyny, sesje już otwarte i logowanie do konsoli pozostają bez zmian
    en:
      - Tools switching between machines by remote desktop with a stored credential stop connecting
      - A jump console worked remotely calls for the password to the target machine to be typed at every connection
      - Credentials stored earlier stay in the profile's store and call for a separate removal, since the rule itself does not delete them
      - Connections coming in to this machine, sessions already open and signing in at the console stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tej maszyny zestawiane są sesje zdalne bez udziału człowieka, a zapisane poświadczenie jest warunkiem ich działania
      - Maszyna pełni rolę konsoli skoku, a zapisane poświadczenia nie zostały przejrzane ani przeniesione do innego mechanizmu
    en:
      - Remote sessions are set up from this machine without a person's part in it and a stored credential is the condition of their working
      - The machine serves as a jump console and the stored credentials have not been reviewed or moved to another mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'DisablePasswordSaving'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'DisablePasswordSaving'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting forbids the storing of new credentials. Those already lying in the
    # profile's store stay there and are removed apart.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordSaving' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Punkt jest na serwerze wart więcej niż na stanowisku i raport powinien to
    odzwierciedlać. Zapisane poświadczenie na pojedynczym komputerze otwiera
    drogę do jednej maszyny; zapisane na serwerze zarządzającym otwiera drogę
    do wszystkiego, czym ten serwer zarządza.

    Ustawienie jest połową rozwiązania, a nie całym. Drugą połową jest
    przejrzenie i wyczyszczenie magazynu poświadczeń profili, bo reguła
    działa wyłącznie w przód. Aplikacja powinna to mówić przy tym punkcie
    wprost, inaczej zgodność w raporcie będzie znaczyła mniej, niż czytelnik
    sądzi.

    Reguła sąsiaduje z punktem o pytaniu o hasło i razem z nim zamyka obie
    strony tego samego zwyczaju: ta zabrania zapisu u siebie, tamta nie
    przyjmuje zapisu zrobionego gdzie indziej.
  en: |
    The item is worth more on a server than on a workstation, and the report should
    reflect that. A credential stored on a single computer opens the road to one
    machine; one stored on a management server opens the road to everything that
    server manages.

    The setting is half the answer rather than the whole. The other half is
    reviewing and clearing the profiles' credential store, since the rule works
    forward alone. The application should say so outright at this item, or else
    compliance in the report will mean less than the reader supposes.

    The rule neighbours the item on prompting for a password and together with it
    closes both sides of the same habit: this one forbids storing at home, that one
    does not accept a store made elsewhere.
