id: win2025-appx-development-mode-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Tryb programisty dla pakietów aplikacji wyłączony
    en: Developer mode for application packages switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza tryb, w którym pakiet aplikacji można uruchomić bez
    licencji programisty — czyli bez tego, co normalnie stwierdza, skąd
    ten pakiet pochodzi i kto za niego odpowiada.

    Zostawiam kategorię wysoką, bo tryb programisty nie jest jednym
    ustawieniem, tylko zdjęciem całej warstwy sprawdzania. Pakiet
    nabywa prawa uruchomienia się bez przejścia przez bramkę, która ma
    ustalić jego pochodzenie. To, co wcześniej wymagało podpisu i
    zaufania, wymaga teraz jedynie skopiowania katalogu na dysk.

    Na serwerze punkt ten ma ciężar, który warto nazwać wprost. Tryb
    programisty jest stanem przejściowym z założenia — włącza się go,
    żeby coś sprawdzić, i miało być wyłączone tego samego dnia. Serwer
    jest jednak maszyną, która chodzi miesiącami i przechodzi przez wiele
    rąk. Stan przejściowy włączony dwa lata temu przy jakimś badaniu
    zostaje na zawsze, bo nic go nie przypomina i nic po nim nie boli.

    Na maszynie produkcyjnej nie ma powodu, dla którego ten tryb miałby
    być włączony. Jeżeli jest, to znaczy, że ktoś kiedyś czegoś próbował
    i nie posprzątał — a wynik audytu jest tu wartościowy właśnie dlatego,
    że wskazuje tę jedną maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchomienia własnego pakietu na serwerze przez samo położenie plików
    na dysku, bez podpisu i bez zaufania.
  en: |
    The item switches off the mode wherein a package of an application may be run without a leave of
    a maker of programs - that is, without that which by rights settles whence that package comes and
    who answers for it.

    I leave the category high, the mode of the maker of programs being no one setting but the taking
    away of a whole layer of looking into. A package wins the right of running without the passing of
    a gate meant to settle its wellspring. What took before a sign and a trusting now takes the
    copying of a folder onto a disk alone.

    On a server this item has a weight worth naming outright. The mode of the maker of programs is by
    its making a state that passes - it is switched on to look into something and was to be switched
    off the same day. A server, though, is a machine that goes for months and passes through many
    hands. A passing state switched on two years since at some looking into stays for good, nothing
    calling it to mind and nothing after it biting.

    Upon a machine of production there is no ground for that mode to be switched on. If it is, it
    means somebody once tried something and did not clear up - and the outcome of the audit is here
    worth having for just that, it pointing at that one machine.

    What an attacker gains while the item goes unmet - the leave to run a package of their own upon
    the server by the mere laying of files onto a disk, with no sign and no trusting.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i nie obniżam jej, choć na
    zwykłym serwerze produkcyjnym zmiana nie ma czego dotknąć. Powodem
    jest jeden przypadek, którego nie chcę przemilczeć.

    Serwer bywa maszyną budującą. Agent ciągłej integracji, na którym
    powstają i są sprawdzane pakiety aplikacji, potrzebuje tego trybu do
    pracy — i to nie jako pozostałości po czyimś badaniu, tylko jako
    warunku wykonywania swojego zadania. Na takiej maszynie zmiana
    zatrzyma budowanie, a objaw będzie zwykły dla serwera: zadanie, które
    przestało się udawać, zgłoszone przez zespół czekający na wydanie.

    Poza tym jednym przypadkiem trudno wskazać instalację serwerową,
    w której ten tryb jest potrzebny. Na maszynie, która wyłącznie
    świadczy usługę, wyłączenie go jest zamknięciem drzwi, którymi nikt
    nie chodzi.

    Sprawdzenie jest więc krótkie i sprowadza się do pytania, czy ta
    maszyna cokolwiek buduje albo czy służy komuś do prób. Jeżeli nie —
    zmiana jest bez skutku.

    Zmiana cofa się natychmiast i nie wymaga restartu. Pakiety już
    zainstalowane działają dalej — warunek dotyczy instalowania nowych.
  en: |
    I leave the class "needs a checking" and lower it not, though upon an ordinary server of
    production the change has nothing to touch. The ground is one case I would not pass over in
    silence.

    A server is at times a machine that builds. An agent of unbroken joining, whereon packages of
    applications come to be and are looked into, takes that mode for its work - and that not as a
    leaving of somebody's looking into but as a bond of the doing of its task. Upon such a machine
    the change will stop the building, and the symptom will be the usual one for a server - a task
    that stopped succeeding, given word of by the band waiting upon a giving out.

    Beyond that one case it is hard to name a setting up of a server wherein that mode is taken.
    Upon a machine that only renders a service, its switching off is the shutting of a door nobody
    goes through.

    The checking is therefore short and comes to the question whether that machine builds anything at
    all or serves somebody for tryings. If not - the change is without outcome.

    The change is undone at once and takes no restart. Packages already installed work on - the bond
    bears on the installing of new ones.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Agent ciągłej integracji budujący i sprawdzający pakiety aplikacji przestanie wykonywać swoje zadanie
      - Objawem jest zadanie, które przestało się udawać, zgłoszone przez zespół czekający na wydanie
      - Na maszynie, która wyłącznie świadczy usługę, jest to zamknięcie drzwi, którymi nikt nie chodzi
      - Pakiety już zainstalowane działają dalej, warunek dotyczy instalowania nowych
      - Tryb włączony przed laty przy jakimś badaniu bywa jedynym powodem, dla którego audyt świeci czerwono
    en:
      - An agent of unbroken joining that builds and looks into packages of applications will stop doing its task
      - The symptom is a task that stopped succeeding, given word of by the band waiting upon a giving out
      - Upon a machine that only renders a service it is the shutting of a door nobody goes through
      - Packages already installed work on, the bond bearing on the installing of new ones
      - A mode switched on years since at some looking into is at times the only ground the audit shines red
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest agentem budującym i sprawdzającym pakiety aplikacji
      - Serwer służy komuś do prób z pakietami przed wydaniem ich na maszyny produkcyjne
    en:
      - The machine is an agent that builds and looks into packages of applications
      - The server serves somebody for tryings with packages before their giving out onto machines of production
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDevelopmentWithoutDevLicense'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowDevelopmentWithoutDevLicense'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a build agent this mode is a working condition, not a leftover: check
    # what the machine builds before switching it off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDevelopmentWithoutDevLicense' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/get-started/enable-your-device-for-development

notes:
  pl: |
    Tryb programisty nie jest jednym ustawieniem, tylko zdjęciem całej
    warstwy sprawdzania: to, co wcześniej wymagało podpisu i zaufania,
    wymaga teraz skopiowania katalogu na dysk.

    Na serwerze ciężar bierze się z trwałości stanu przejściowego. Tryb
    włącza się, żeby coś sprawdzić, i miał być wyłączony tego samego
    dnia — a serwer chodzi miesiącami i przechodzi przez wiele rąk.

    Jedyny przypadek, w którym tryb jest potrzebny i nie jest
    pozostałością: maszyna budująca pakiety aplikacji. Poza nim wynik
    czerwony znaczy, że ktoś kiedyś czegoś próbował i nie posprzątał.
  en: |
    The mode of the maker of programs is no one setting but the taking away of a whole layer of
    looking into - what took before a sign and a trusting now takes the copying of a folder onto a
    disk.

    On a server the weight comes of the lastingness of a state that was to pass. The mode is switched
    on to look into something and was to be switched off the same day - and a server goes for months
    and passes through many hands.

    The one case wherein the mode is taken and is no leaving - a machine that builds packages of
    applications. Beyond it a red outcome means somebody once tried something and did not clear up.
