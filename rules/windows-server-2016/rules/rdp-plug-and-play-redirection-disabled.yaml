id: win2016-rdp-plug-and-play-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie urządzeń rozpoznawanych samoczynnie w sesji zdalnej wyłączone
    en: Redirection of automatically recognised devices in remote sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie do sesji zdalnej urządzeń, które system
    rozpoznaje samoczynnie po wpięciu. Serwer przestaje widzieć aparaty,
    odtwarzacze, czytniki i inny sprzęt wpinany po stronie stanowiska.

    Waga tego punktu leży nie w samych urządzeniach, tylko w tym, co
    podłączenie urządzenia pociąga za sobą. Rozpoznanie sprzętu oznacza
    wybranie i załadowanie sterownika, a sterownik jest kodem działającym
    wewnątrz systemu z uprawnieniami wyższymi niż jakikolwiek program
    użytkownika. Przekierowanie pozwala zatem maszynie niekontrolowanej
    zdecydować, jaki kod uprzywilejowany zostanie uruchomiony na serwerze.

    Napastnik, który ma dostęp do sesji zdalnej, może to wykorzystać
    dwojako. Może przedstawić urządzenie dobrane tak, by serwer sięgnął po
    sterownik znany ze słabości. Może też przedstawić urządzenie udające coś
    zupełnie innego niż to, czym jest — sprzęt zgłaszający się jako
    klawiatura wpisuje polecenia szybciej, niż zdąży je ktokolwiek
    zauważyć, i nie wygląda przy tym na nośnik danych.

    Do tego dochodzi droga prostsza: część urządzeń rozpoznawanych
    samoczynnie to po prostu pamięci masowe, więc kanał przenoszenia plików
    otwiera się przy okazji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wpływ na to,
    jaki sterownik zostanie załadowany na serwerze, oraz dodatkowy kanał
    przenoszenia danych przez urządzenie wpięte po stronie klienta.
  en: |
    The setting cuts off the attaching to a remote session of devices the system
    recognises by itself once plugged in. The server ceases to see cameras, players,
    readers and other hardware plugged in on the workstation's side.

    This item's weight lies not in the devices themselves but in what attaching a
    device draws after it. Recognising hardware means picking and loading a driver,
    and a driver is code running inside the system with privileges higher than any
    user program's. The redirection therefore lets an uncontrolled machine settle
    what privileged code will be started on the server.

    An attacker with access to a remote session can turn that to account two ways.
    They can present a device chosen so that the server reaches for a driver known
    for its weaknesses. They can also present a device pretending to be something
    quite other than what it is - hardware announcing itself as a keyboard types
    commands faster than anybody can notice them, and does not look like a data
    carrier while doing so.

    To this is added a simpler road: some automatically recognised devices are
    simply mass storage, so a channel for carrying files opens along the way.

    What an attacker gains while the item goes unmet: a say in what driver will be
    loaded on the server, and one more channel for carrying data through a device
    plugged in on the client's side.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie jest krótkie, bo użycia tego
    przekierowania są rzadkie i zwykle wyliczalne.

    Typowe przypadki, które po zmianie przestaną działać: wgrywanie zdjęć
    z aparatu podłączonego u siebie do programu działającego na serwerze,
    obsługa czytnika kart albo skanera dokumentów wpiętego po stronie
    stanowiska, praca z rejestratorem przenoszącym dane przez pamięć
    wewnętrzną. Wspólną cechą jest to, że sprzęt jest u osoby pracującej,
    a program na serwerze.

    Ważne rozróżnienie, bo nazwa punktu bywa czytana za szeroko. Reguła nie
    dotyczy urządzeń wpiętych bezpośrednio do serwera ani przekierowania
    dysków, które idzie osobnym ustawieniem. Dotyczy wyłącznie sprzętu
    wpinanego u łączącego się i rozpoznawanego samoczynnie.

    Osobno stoją czytniki kart inteligentnych, używane do logowania. Te idą
    własnym mechanizmem i to przekierowanie ich nie odcina — warto o tym
    powiedzieć, bo obawa przed utratą logowania kartą jest pierwszym
    pytaniem, jakie przy tym punkcie pada.

    Objaw jest natychmiastowy i widoczny: urządzenie po prostu nie pojawia
    się w sesji.

    Czego to nie psuje: logowania kartą inteligentną, drukowania, samej
    sesji zdalnej, urządzeń podłączonych bezpośrednio do serwera.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the checking is short, since uses of this
    redirection are rare and as a rule can be enumerated.

    Typical cases that will stop working after the change: loading photographs from
    a camera attached at home into a program running on the server, driving a card
    reader or a document scanner plugged in on the workstation's side, working with
    a recorder that carries data through its internal memory. Their common trait is
    that the hardware is with the person working and the program is on the server.

    An important distinction, since the item's name is at times read too widely. The
    rule does not concern devices plugged directly into the server, nor drive
    redirection, which goes by a separate setting. It concerns hardware plugged in
    at whoever connects and recognised automatically, and nothing else.

    Smart card readers used for signing in stand apart. Those go by a mechanism of
    their own and this redirection does not cut them off - worth saying, since the
    fear of losing card sign-in is the first question raised at this item.

    The symptom is immediate and visible: the device simply does not appear in the
    session.

    What this does not break: signing in with a smart card, printing, the remote
    session itself, or devices attached directly to the server.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Wgrywanie zdjęć z aparatu podłączonego po stronie stanowiska do programu działającego na serwerze przestaje być możliwe
      - Czytnik kart albo skaner dokumentów wpięty u osoby pracującej przestaje pojawiać się w sesji
      - Rejestrator przenoszący dane przez pamięć wewnętrzną nie zostaje rozpoznany w sesji zdalnej
      - Logowanie kartą inteligentną idzie własnym mechanizmem i pozostaje bez zmian, podobnie jak drukowanie
    en:
      - Loading photographs from a camera attached on the workstation's side into a program running on the server becomes impossible
      - A card reader or a document scanner plugged in at the person working stops appearing in the session
      - A recorder carrying data through its internal memory is not recognised in the remote session
      - Signing in with a smart card goes by its own mechanism and stays unchanged, as does printing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Praca na tej maszynie polega na przyjmowaniu danych z urządzeń wpinanych po stronie osoby łączącej się i nie ma innej drogi ich przekazania
      - Skanery dokumentów albo czytniki obsługiwane z sesji zdalnej są wpinane u operatorów, a nie przy serwerze
    en:
      - Work on this machine consists in taking data from devices plugged in at the person connecting and there is no other road for passing them over
      - Document scanners or readers driven from a remote session are plugged in at the operators rather than at the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisablePNPRedir'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisablePNPRedir'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisablePNPRedir' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Punkt jest cięższy, niż wygląda, i warto tę różnicę pokazać. Pozostałe
    przekierowania otwierają kanał przenoszenia treści; to otwiera drogę do
    załadowania sterownika, czyli kodu uprzywilejowanego, o którym decyduje
    maszyna niekontrolowana. Stąd kategoria średnia, a nie niska, mimo że
    użytkowników tego przekierowania jest mniej niż schowka czy dysków.

    Zastrzeżenie o czytnikach kart inteligentnych powinno być widoczne
    w interfejsie, a nie schowane w opisie. Jest to jedyna obawa, jaką ten
    punkt budzi u osób zarządzających, i jest to obawa nieuzasadniona —
    odpowiedź podana od razu oszczędza rozmowę.

    W grupie przekierowań reguła zajmuje miejsce trzecie co do wagi, po
    dyskach i schowku, a przed portami. Kolejność wdrożenia warto zachować
    właśnie taką, bo koszt rośnie w drugą stronę: porty nie kosztują nic,
    dyski i schowek kosztują najwięcej.
  en: |
    The item is heavier than it looks, and that difference is worth showing. The
    other redirections open a channel for carrying content; this one opens a road to
    the loading of a driver, which is to say privileged code settled by an
    uncontrolled machine. Hence the medium category rather than low, even though the
    users of this redirection are fewer than those of the clipboard or the drives.

    The reservation about smart card readers should be visible in the interface
    rather than hidden in the description. It is the only fear this item raises in
    those managing a machine, and it is a fear without grounds - the answer given at
    once saves a conversation.

    In the redirection group the rule takes third place by weight, after the drives
    and the clipboard and before the ports. The order of rollout is worth keeping
    just so, since the cost rises the other way: the ports cost nothing, the drives
    and the clipboard cost most.
