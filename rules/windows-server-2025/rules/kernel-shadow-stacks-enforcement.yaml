id: win2025-kernel-shadow-stacks-enforcement

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Sprzętowa ochrona stosu w trybie jądra wymuszona
    en: Hardware protection of the kernel-mode stack enforced
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymusza sprzętową ochronę adresów powrotu w trybie jądra.
    Procesor trzyma drugą, niedostępną dla kodu kopię adresów powrotu
    i przy każdym powrocie porównuje ją z tym, co leży na zwykłym stosie.
    Niezgodność kończy wykonanie.

    Zostawiam kategorię wysoką i chcę pokazać, jak ten punkt układa się
    z sąsiednim punktem o integralności kodu jądra, bo dopiero razem
    zamykają jedną drogę. Integralność kodu mówi, jaki kod wolno wykonać.
    Ten punkt mówi, że kodu, który wolno wykonać, nie da się skłonić do
    skoku w miejsce, którego nikt nie przewidział. Bez tego drugiego
    napastnik nie musi wnosić własnego kodu — wystarczy, że poskłada
    fragmenty kodu już obecnego i podpisanego.

    Na serwerze waży to o tyle, o ile w jądrze serwera pracuje więcej
    cudzego kodu: sterowniki kontrolerów dyskowych, filtry systemu
    plików, agenty kopii zapasowych i monitorowania. Każdy z nich jest
    materiałem, z którego da się poskładać taki skok — i żaden nie
    przestaje nim być przez to, że jest podpisany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: całą
    rodzinę technik, w których nie wnosi się do jądra nic nowego, tylko
    używa tego, co już w nim jest.
  en: |
    The item enforces hardware protection of return addresses in kernel
    mode. The processor keeps a second copy of the return addresses,
    inaccessible to code, and on every return compares it with what lies
    on the ordinary stack. A mismatch ends execution.

    I keep the category high, and I want to show how this item fits with
    the neighbouring one on kernel code integrity, because only together
    do they close a single route. Code integrity says what code may be
    executed. This item says that code which may be executed cannot be
    induced to jump somewhere nobody intended. Without the second one an
    attacker need bring no code of their own - it is enough to assemble
    fragments of code already present and already signed.

    On a server this weighs as much as there is more third-party code in
    the kernel: disk controller drivers, filesystem filters, backup and
    monitoring agents. Each of them is material from which such a jump can
    be assembled - and none of them stops being that material by virtue of
    being signed.

    What an attacker gains while the item goes unmet: a whole family of
    techniques in which nothing new is brought into the kernel and only
    what is already there gets used.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać pułapkę,
    która jest w tym punkcie charakterystyczna, bo nie występuje przy
    sąsiednich.

    Ustawienie ma dwa tryby. Jeden wymusza, drugi wyłącznie obserwuje
    i notuje naruszenia. Tryb obserwacji jest kuszący, bo nie grozi
    niczym — i właśnie dlatego bywa stanem docelowym, chociaż miał być
    etapem. Punkt jest spełniony tylko w trybie wymuszającym; maszyna
    w trybie obserwacji wygląda na zaopiekowaną i nie jest chroniona.
    Warto przejść tę drogę do końca, a nie zatrzymać się na kroku,
    w którym dziennik zapełnia się ostrzeżeniami, których nikt nie czyta.

    Skutek wykonawczy jest taki sam jak przy integralności kodu jądra
    i z tego samego źródła: sterownik, który łamie założenie, nie zostanie
    załadowany albo zostanie zatrzymany. Różnica polega na tym, że tu
    łamie je kod poprawnie podpisany, ale napisany niedbale — a takiego
    kodu w jądrze serwera bywa sporo i pochodzi zwykle od dostawców
    sprzętu i oprogramowania do kopii zapasowych.

    Wymaganie sprzętowe jest realne: procesor musi tę ochronę obsługiwać.
    Na starszych serwerach ustawienie nie zadziała, a maszyna zgłosi to
    dopiero po restarcie.

    Dlatego kolejność jest taka sama jak przy sąsiednim punkcie: najpierw
    kilka dni w trybie obserwacji, z przeczytaniem tego, co się nazbierało,
    potem wymuszenie. Różnica wobec tamtego punktu jest jedna, ale ważna:
    tu tryb obserwacji jest częścią tego samego ustawienia, więc łatwo
    uznać, że praca została wykonana.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I keep the class "needs a planned rollout" and want to name the trap
    specific to this item, because it does not occur at the neighbouring
    ones.

    The setting has two modes. One enforces, the other only observes and
    records violations. Observation mode is tempting because it threatens
    nothing - and that is exactly why it ends up being the final state
    although it was meant to be a stage. The item is satisfied only in
    enforcing mode; a machine in observation mode looks attended to and is
    not protected. It is worth walking this road to the end rather than
    stopping at the step where the log fills with warnings nobody reads.

    The operational effect is the same as at kernel code integrity and
    comes from the same source: a driver that breaks the assumption will
    not be loaded, or will be stopped. The difference is that here the
    assumption is broken by code that is correctly signed but carelessly
    written - and there is a fair amount of such code in a server kernel,
    usually from hardware vendors and backup software suppliers.

    The hardware requirement is real: the processor must support this
    protection. On older servers the setting will not take effect, and the
    machine will report that only after a restart.

    So the order is the same as at the neighbouring item: first a few days
    in observation mode, with somebody actually reading what accumulated,
    then enforcement. There is one difference from that item, and it
    matters: here observation mode is part of the same setting, so it is
    easy to conclude the work has been done.

    The change binds after a restart and is undone after another one.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - boot-and-firmware
    - virtualization-and-containers
  what_breaks:
    pl:
      - Sterownik łamiący założenie o adresach powrotu nie zostanie załadowany albo zostanie zatrzymany
      - Dotyczy to kodu poprawnie podpisanego, ale napisanego niedbale, a takiego w jądrze serwera bywa sporo
      - Na starszych procesorach ustawienie nie zadziała, a maszyna zgłosi to dopiero po restarcie
      - Tryb obserwacji nie spełnia punktu, choć w dzienniku wygląda na wdrożenie w toku
    en:
      - A driver that breaks the return-address assumption will not be loaded or will be stopped
      - This applies to code that is correctly signed but carelessly written, and there is a fair amount of that in a server kernel
      - On older processors the setting will not take effect, and the machine reports that only after a restart
      - Observation mode does not satisfy the item, though in the log it looks like a rollout in progress
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przepracowano wcześniej okresu w trybie obserwacji ani nie przeczytano tego, co się w nim nazbierało
      - Procesor tej maszyny nie obsługuje sprzętowej ochrony adresów powrotu
      - Nie ma sprawdzonej drogi do konsoli maszyny na wypadek, gdyby po restarcie nie wstała
    en:
      - No period in observation mode was worked through beforehand, nor was what accumulated in it read
      - This machine's processor does not support hardware protection of return addresses
      - There is no proven route to the machine console in case it does not come up after the restart
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # One is the enforcing mode; two only watches and notes breaches.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ConfigureKernelShadowStacksLaunch'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    $name = 'ConfigureKernelShadowStacksLaunch'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Value two only observes and records. It satisfies nothing and is easy to
    # mistake for a finished rollout, so run the observation period first and
    # then come back here for value one.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConfigureKernelShadowStacksLaunch' -Value 1 -Type DWord
    # The setting binds after a restart of the machine.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    # The former state returns after a restart of the machine.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/

notes:
  pl: |
    Układa się z punktem o integralności kodu jądra: tamten mówi, jaki kod
    wolno wykonać, ten — że kodu, który wolno wykonać, nie da się skłonić
    do skoku w miejsce, którego nikt nie przewidział. Bez tego drugiego
    napastnik nie musi wnosić własnego kodu.

    Pułapka charakterystyczna dla tego punktu: ustawienie ma tryb
    obserwacji, który nie grozi niczym i dlatego bywa stanem docelowym,
    chociaż miał być etapem. Maszyna w tym trybie wygląda na zaopiekowaną
    i nie jest chroniona.

    Wymaganie sprzętowe jest realne, a na starszych procesorach ustawienie
    nie zadziała i maszyna zgłosi to dopiero po restarcie.
  en: |
    It fits with the item on kernel code integrity: that one says what code
    may be executed, this one says that code which may be executed cannot
    be induced to jump somewhere nobody intended. Without the second one an
    attacker need bring no code of their own.

    The trap specific to this item: the setting has an observation mode
    that threatens nothing and therefore ends up being the final state
    although it was meant to be a stage. A machine in that mode looks
    attended to and is not protected.

    The hardware requirement is real, and on older processors the setting
    will not take effect - the machine reports that only after a restart.
