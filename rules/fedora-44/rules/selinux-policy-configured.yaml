id: fedora44-selinux-policy-configured

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.3.1.3
  section: Initial Setup > Mandatory Access Control > Configure SELinux
  title:
    pl: Polityka SELinux jest skonfigurowana
    en: Ensure SELinux policy is configured
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Polityka SELinux to zbiór reguł opisujących, co wolno każdemu procesowi.
    Fedora dostarcza politykę targeted, która ogranicza usługi sieciowe
    i systemowe, a programy zwykłych użytkowników zostawia bez ograniczeń, oraz
    politykę mls dla środowisk z klasyfikacją informacji. Inne wartości,
    np. minimum, ograniczają tylko wybrane procesy.

    Punkt sprawdza, że /etc/selinux/config wskazuje politykę targeted albo mls,
    że jest ona zainstalowana i że to ona jest załadowana. Na Fedorze
    Workstation to ustawienie domyślne.
  en: |
    The SELinux policy is the set of rules describing what each process may do.
    Fedora ships the targeted policy, which confines network and system services
    and leaves ordinary users' programs unconfined, and the mls policy for
    environments with information classification. Other values, such as
    minimum, confine only selected processes.

    The item checks that /etc/selinux/config names the targeted or mls policy,
    that it is installed and that it is the one loaded. On Fedora Workstation
    this is the default.

disruption_description:
  pl: |
    Klasa wymaga przeglądu. Na domyślnej instalacji nic nie trzeba zmieniać.
    Jeśli ustawiona była inna polityka, zmiana na targeted wymaga ponownego
    etykietowania plików przy następnym starcie i obejmuje ograniczeniami
    usługi, które wcześniej działały swobodnie; ich naruszenia trzeba
    przejrzeć po restarcie.

    Zmiana działa dopiero po restarcie.
  en: |
    The class needs review. On a default installation nothing has to change.
    If another policy was set, changing to targeted needs file relabelling at
    the next start and confines services that ran freely before; their
    violations have to be reviewed after the restart.

    The change takes effect only after a restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
  what_breaks:
    pl:
      - Usługa, którą poprzednia polityka zostawiała bez ograniczeń, po restarcie dostaje odmowy dostępu do plików lub portów spoza swojego profilu
    en:
      - A service the previous policy left unconfined gets access denials to files or ports outside its profile after the restart
  interruption: system-restart
  user_visible: false
  reversibility: after-restart

audit:
  shell: bash
  test_command: |
    c=/etc/selinux/config
    if [ ! -r "$c" ]; then echo CHECK_ERROR; exit 0; fi
    t=$(sed -n 's/^[[:space:]]*SELINUXTYPE=[[:space:]]*//p' "$c" | tail -n 1 | tr -d '"'"'"'"')
    case "$t" in targeted|mls) ;; *) echo "NOT_CONFIGURED:${t:-none}"; exit 0 ;; esac
    if [ ! -d "/etc/selinux/$t/policy" ]; then echo "NOT_INSTALLED:$t"; exit 0; fi
    if command -v sestatus >/dev/null 2>&1 && sestatus 2>/dev/null | grep -q '^SELinux status:[[:space:]]*enabled'; then
      l=$(sestatus | sed -n 's/^Loaded policy name:[[:space:]]*//p')
      if [ "$l" != "$t" ]; then echo "RESTART_PENDING:$l"; exit 0; fi
    fi
    echo CONFIGURED
  expected: '^CONFIGURED$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      c=/etc/selinux/config
      b='{{backup_file}}'
      [ -r "$c" ] || { echo "$c not found" >&2; exit 1; }
      mkdir -p "$(dirname "$b")"
      n=$(grep -cE '^[[:space:]]*SELINUXTYPE=' "$c" || true)
      line=$(grep -E '^[[:space:]]*SELINUXTYPE=' "$c" | tail -n 1 || true)
      rl=0; [ -e /.autorelabel ] && rl=1
      {
        echo "count=$n"
        echo "relabel=$rl"
        echo "mode=$(getenforce 2>/dev/null || echo Unknown)"
        echo "line=$line"
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /etc/selinux/targeted/policy ] || { echo "The targeted policy is not installed; install selinux-policy-targeted first" >&2; exit 1; }
      c=/etc/selinux/config
      n=$(grep -cE '^[[:space:]]*SELINUXTYPE=' "$c" || true)
      if [ "$n" -gt 1 ]; then echo "$c sets SELINUXTYPE more than once; fix it by hand" >&2; exit 1; fi
      if [ "$n" -eq 1 ]; then
        sed -i -E 's/^[[:space:]]*SELINUXTYPE=.*/SELINUXTYPE=targeted/' "$c"
      else
        printf 'SELINUXTYPE=targeted\n' >> "$c"
      fi
      if command -v restorecon >/dev/null 2>&1; then restorecon "$c" 2>/dev/null || true; fi
      if [ "$(sed -n 's/^line=//p' "$b" | sed 's/.*=//; s/[" ]//g')" != targeted ] && [ ! -e /.autorelabel ]; then
        touch /.autorelabel
        echo "The policy type changed: the file system will be relabelled at the next start"
      fi
      echo "Set SELINUXTYPE=targeted in $c; restart to apply"
    )

  rollback_command: |
    (
      set -e
      c=/etc/selinux/config
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      n=$(sed -n 's/^count=//p' "$b")
      rl=$(sed -n 's/^relabel=//p' "$b")
      case "$n:$rl" in [01]:[01]) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      line=$(sed -n 's/^line=//p' "$b")
      if [ "$n" = 0 ]; then
        sed -i -E '/^[[:space:]]*SELINUXTYPE=/d' "$c"
      else
        esc=$(printf '%s' "$line" | sed 's/[\/&]/\\&/g')
        sed -i -E "s/^[[:space:]]*SELINUXTYPE=.*/$esc/" "$c"
      fi
      if [ "$rl" = 0 ]; then rm -f /.autorelabel; fi
      echo "Restored SELINUXTYPE in $c; restart to apply"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/selinux_config.5.html
  - https://docs.fedoraproject.org/en-US/quick-docs/selinux-getting-started/

notes:
  pl: |
    Wynik RESTART_PENDING oznacza, że plik wskazuje właściwą politykę, ale
    załadowana jest inna, bo system nie został jeszcze uruchomiony ponownie.
    Naprawa ustawia politykę targeted; na stacji, która ma działać z polityką
    mls, trzeba ją ustawić ręcznie.
  en: |
    The RESTART_PENDING result means that the file names the right policy but
    another is loaded because the system has not been restarted yet. The
    remediation sets the targeted policy; on a workstation meant to run the mls
    policy it has to be set by hand.
