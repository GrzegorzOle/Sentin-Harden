id: win2016-automatic-updates-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update
  title:
    pl: Automatyczne pobieranie i instalowanie aktualizacji włączone
    en: The automatic fetching and installing of updates switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pilnuje, żeby maszyna sama pobierała i instalowała
    aktualizacje, zamiast czekać, aż ktoś się nimi zajmie.

    Punkt ten jest inny niż wszystkie pozostałe w zestawie i warto to
    powiedzieć od razu. Reguły hardeningu zwykle coś zamykają albo czegoś
    zabraniają. Ta jedna każe systemowi samemu się zmieniać — i jest to
    jedyna reguła, której wykonanie prowadzi do restartu maszyny w chwili,
    której nikt wprost nie wskazał.

    Powód, dla którego mimo to stoi wysoko, jest prosty. Wszystkie
    pozostałe reguły bronią przed drogami znanymi i opisanymi. Aktualizacje
    bronią przed drogami, o których nikt jeszcze nie wie w chwili wdrożenia
    — i to one zamykają luki wykorzystywane w praktyce najczęściej.

    Maszyna nieaktualizowana traci na wartości tego, co na niej ustawiono.
    Można ją utwardzić co do punktu i zostawić w niej lukę, którą zamyka
    poprawka wydana w zeszłym miesiącu.

    Zastrzeżenie o uczciwości: reguła nie mówi, skąd maszyna bierze
    aktualizacje. Serwer pobierający je z usługi wewnętrznej i serwer
    pobierający je wprost z sieci publicznej spełniają ten punkt tak samo,
    a różnią się znacznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    luk opisanych publicznie, dla których poprawka istnieje i leży
    niezainstalowana.
  en: |
    The setting sees to it that the machine fetches and installs updates by itself,
    instead of waiting for somebody to see to them.

    This item is unlike every other in the set, and that is worth saying at once.
    Hardening rules as a rule shut something or forbid something. This one has the
    system change itself - and it is the only rule whose execution leads to the
    machine restarting at a moment nobody pointed to outright.

    The reason it stands high all the same is a simple one. Every other rule guards
    against roads known and described. Updates guard against roads nobody yet knows
    of at the time of the rollout - and it is they that shut the gaps most often
    used in practice.

    An unupdated machine loses the worth of everything set upon it. It can be
    hardened to the letter and left with a gap that a fix released last month shuts.

    A reservation about honesty: the rule does not say where the machine takes
    updates from. A server fetching them from an internal service and a server
    fetching them straight from the public network meet this item alike, and differ
    greatly.

    What an attacker gains while the item goes unmet: access to gaps described
    publicly, for which a fix exists and lies uninstalled.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rozstrzyga restart.

    Aktualizacja zainstalowana kończy się restartem i na serwerze restart
    nie jest drobiazgiem. Usługi przestają odpowiadać, sesje się zrywają,
    zadania w toku giną. Jeżeli maszyna należy do zespołu, w którym
    kolejność uruchamiania ma znaczenie — baza przed aplikacją, kontroler
    przed resztą — restart niezaplanowany potrafi zostawić po sobie
    środowisko, które trzeba podnosić ręcznie.

    Rzecz druga to same poprawki. Poprawka jest zmianą i czasem zmienia
    zachowanie, na którym coś stało. Sterownik podmieniony przy okazji,
    zmiana domyślnego szyfru, nowa wersja składnika — każda z tych rzeczy
    zdarzała się i będzie się zdarzać.

    Nie jest to jednak argument za nieaktualizowaniem, tylko za
    zaplanowaniem. Dlatego punkt nie należy do trybu zbiorowego i dlatego
    w poleceniu naprawczym stoi warunek ustalenia dwóch rzeczy przed
    wykonaniem: skąd maszyna bierze aktualizacje i kiedy wolno jej się
    restartować.

    Rzecz trzecia dotyczy maszyn odciętych od sieci publicznej. Tam
    włączenie punktu bez wskazania źródła wewnętrznego daje maszynę
    próbującą pobierać aktualizacje w nieskończoność — i dziennik pełen
    błędów, które niczego nie znaczą.

    Czego to nie psuje: usług między restartami, logowania, sieci,
    konfiguracji.
  en: |
    The class is "needs a planned rollout", and the restart settles it.

    An installed update ends in a restart, and on a server a restart is no trifle.
    Services stop answering, sessions break, tasks in flight are lost. If the
    machine belongs to a set where the order of starting matters - the database
    before the application, the controller before the rest - an unplanned restart
    can leave behind surroundings that have to be brought up by hand.

    The second thing is the fixes themselves. A fix is a change and at times changes
    behaviour something rested on. A driver replaced along the way, a change of
    default cipher, a new version of a component - each of those things has happened
    and will happen again.

    That is no argument against updating, though, but for planning. So the item is
    outside the bulk mode, and so the remedial command carries the condition of
    settling two things before execution: where the machine takes updates from, and
    when it may restart.

    The third thing concerns machines cut off from the public network. There,
    switching the item on without naming an internal source gives a machine trying
    to fetch updates without end - and a log full of errors meaning nothing.

    What this does not break: services between restarts, signing in, the network, or
    the configuration.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Maszyna restartuje się po zainstalowaniu aktualizacji, a usługi, sesje i zadania w toku tego restartu nie przeżywają
      - W zespole maszyn, w którym kolejność uruchamiania ma znaczenie, restart niezaplanowany zostawia środowisko do podniesienia ręcznie
      - Poprawka bywa zmianą zachowania - podmieniony sterownik, inny domyślny szyfr, nowa wersja składnika
      - Maszyna odcięta od sieci publicznej bez wskazanego źródła wewnętrznego zapełnia dziennik błędami pobierania
    en:
      - The machine restarts once an update is installed, and services, sessions and tasks in flight do not survive that restart
      - In a set of machines where the order of starting matters, an unplanned restart leaves surroundings to be brought up by hand
      - A fix is at times a change of behaviour - a replaced driver, another default cipher, a new version of a component
      - A machine cut off from the public network with no internal source named fills its log with errors of fetching
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ustalono, skąd maszyna ma brać aktualizacje, a nie ma ona dostępu do sieci publicznej
      - Maszyna należy do zespołu o wymaganej kolejności uruchamiania i okna restartu nie wyznaczono
      - Na maszynie pracuje oprogramowanie dopuszczone wyłącznie w zamrożonej wersji systemu
    en:
      - It has not been settled where the machine is to take updates from, and it has no access to the public network
      - The machine belongs to a set with a required order of starting and no restart window has been set
      - Software admitted only on a frozen version of the system works on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'NoAutoUpdate'
      $value = $null
      if (Test-Path -Path $path -ErrorAction Stop) {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
      }
      # No policy at all means the system default applies, which is automatic
      # updates. Only an explicit 1 switches them off.
      if ($null -eq $value -or [int]$value -eq 0) { 'AUTOMATIC' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AUTOMATIC'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'NoAutoUpdate'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle first where the machine takes updates from and when it may restart.
    # Switching this on without answering both questions moves the restart to a
    # moment nobody chose.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutoUpdate' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Punkt otwiera blok o aktualizacjach i jest w nim najważniejszy, a przy
    tym najtrudniejszy do przedstawienia uczciwie. Wartość jest bezsporna,
    koszt również — i właśnie dlatego macierz kładzie go tam, gdzie opis
    skutków musi być najlepszy w całej aplikacji.

    Audyt traktuje brak wpisu jako spełnienie i jest to decyzja świadoma.
    Domyślnym zachowaniem systemu bez zasady są aktualizacje automatyczne,
    więc brak wpisu znaczy tu „włączone", a nie „nieustawione". Zgłaszanie
    tego jako niezgodności byłoby błędem, bo prowadziłoby do naprawiania
    stanu już prawidłowego.

    Reguła nie mówi nic o źródle aktualizacji i warto, żeby aplikacja
    mówiła o tym wprost. Zgodność tego punktu na maszynie pobierającej
    poprawki wprost z sieci publicznej jest zgodnością techniczną, która
    w wielu środowiskach byłaby naruszeniem zupełnie innej zasady.

    Trzy reguły następne opisują, jak dokładnie ten mechanizm ma działać:
    bez pytania, codziennie i bez wstrzymywania restartu przez zalogowanego.
    Same w sobie nie znaczą nic, dopóki ten punkt nie jest spełniony.
  en: |
    The item opens the block about updates and is the most important in it, and at
    the same time the hardest to present honestly. The value is beyond dispute and
    so is the cost - and just for that reason the matrix puts it where the
    description of consequences must be the best in the whole application.

    The audit treats an absent entry as compliance, and that is a deliberate
    decision. The system's default behaviour with no policy is automatic updates, so
    an absent entry means "switched on" here rather than "unset". Reporting it as a
    non-compliance would be a mistake, leading to the fixing of a state already
    proper.

    The rule says nothing about the source of updates, and the application had
    better say so outright. Compliance with this item on a machine fetching fixes
    straight from the public network is a technical compliance that in many
    surroundings would breach an altogether different rule.

    The next three rules describe how exactly this mechanism is to work: without
    asking, every day, and without a signed-in user holding the restart back. On
    their own they mean nothing until this item is met.
