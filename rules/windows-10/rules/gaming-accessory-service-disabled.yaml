id: win10-gaming-accessory-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi urządzeń sterujących do gier wyłączona
    en: The service backing the steering gear of games switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę obsługującą urządzenia sterujące do gier
    przyłączane do maszyny.

    Zastrzeżenie dotyczy nie gier, tylko tego, czym takie urządzenie jest
    z punktu widzenia systemu. Jest to urządzenie wejściowe zgłaszające
    się przy przyłączeniu i obsługiwane przez sterownik działający
    z wysokimi uprawnieniami.

    Zagrożenie pierwsze to sterownik. Warstwa obsługi urządzeń
    sterujących jest sprawdzana rzadziej niż obsługa myszy i klawiatury,
    bo rzadziej się jej używa, a działa równie głęboko w systemie.

    Zagrożenie drugie to przyłączanie bez pytania. Urządzenie zgłasza
    się samo, a system obsługuje je bez decyzji użytkownika, tak samo
    jak każde inne urządzenie wejściowe.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Nie jest to
    znana droga wejścia, a wartość polega na zdjęciu jednej
    niesprawdzanej warstwy obsługi urządzeń.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: warstwę
    obsługi urządzeń wejściowych rzadziej sprawdzaną niż pozostałe.
  en: |
    The setting switches off the service backing the steering gear of games attached to the machine.

    The reservation touches no games but what such a thing is in the system's sight. It is a thing of entry that
    reports itself at its attaching and is backed by a driver working with high rights.

    The first danger is the driver. The layer backing steering gear is looked over more seldom than the backing of
    mouse and keyboard, it being more seldom used, and it works as deep in the system.

    The second danger is the attaching without asking. The thing reports itself, and the system backs it with no
    decision of the user's, just as it does any other thing of entry.

    The grading is low and the item is to be put forward as such. It is no known road in, and the worth lies in
    the taking away of one unlooked-over layer backing things.

    What an attacker gains while the item goes unmet: a layer backing things of entry looked over more seldom than
    the rest.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie sprowadza się do pytania,
    czy do tej maszyny przyłącza się takie urządzenie.

    Miejscem pierwszym są stanowiska służące także do rozrywki. Po
    zmianie urządzenie sterujące przestanie być rozpoznawane, a skutek
    widać natychmiast po przyłączeniu.

    Miejscem drugim są zastosowania poza grami. Urządzenia sterujące
    bywają używane do obsługi programów do modelowania, do sterowania
    kamerą i jako sprzęt dostępności dla osób, którym trudno korzystać
    z myszy. To ostatnie zastosowanie jest tu najważniejsze i trzeba
    sprawdzić je przed wdrożeniem.

    Odnotowuję, że mysz i klawiatura działają dalej. Usługa ta obsługuje
    wyłącznie urządzenia sterujące do gier.

    Skutek jest widoczny dla użytkownika natychmiast po przyłączeniu.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: myszy i klawiatury, sieci, drukowania, logowania,
    pracy programów.
  en: |
    The class is "needs review", and the review comes to the question whether such a thing is attached to this
    machine.

    The first place is stations serving also for pastime. After the change the steering gear will cease to be
    known, and the upshot is seen at once upon its attaching.

    The second place is uses beyond games. Steering gear is at times used for the working of programs of shaping,
    for the steering of a seeing glass, and as gear of reach for people to whom a mouse comes hard. That last use
    is here the weightiest and must be looked at before the rollout.

    I set down that mouse and keyboard work on. That service backs the steering gear of games alone.

    The consequence is plain to the user at once upon the attaching.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: mouse and keyboard, the network, printing, logging on, or the work of programs.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Urządzenie sterujące przestanie być rozpoznawane, a skutek widać natychmiast po przyłączeniu
      - Sprzęt dostępności oparty na urządzeniu sterującym przestanie działać i to trzeba sprawdzić przed wdrożeniem
      - Programy do modelowania i sterowanie kamerą przez takie urządzenie stracą obsługę
      - Mysz i klawiatura działają dalej, bo usługa obsługuje wyłącznie urządzenia sterujące do gier
      - Sieć, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - The steering gear will cease to be known, and the upshot is seen at once upon its attaching
      - Gear of reach resting upon steering gear will cease to work, and that must be looked at before the rollout
      - Programs of shaping and the steering of a seeing glass by such a thing will lose their backing
      - Mouse and keyboard work on, the service backing the steering gear of games alone
      - The network, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Osoba pracująca przy tej maszynie korzysta z urządzenia sterującego jako sprzętu dostępności
      - Program do modelowania albo sterowania kamerą obsługiwany jest urządzeniem sterującym
    en:
      - Whoever works at this machine uses steering gear as gear of reach
      - A program of shaping or of the steering of a seeing glass is worked with steering gear
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxGipSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxGipSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XboxGipSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XboxGipSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XboxGipSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/hid/

notes:
  pl: |
    Reguła bywa odrzucana zdaniem „na tej maszynie nikt nie gra" i warto,
    żeby aplikacja uprzedziła to jednym zdaniem. Urządzenia sterujące
    bywają używane poza grami, a najważniejsze z tych zastosowań to
    sprzęt dostępności dla osób, którym trudno korzystać z myszy.

    Argument wart zachowania dotyczy sterownika. Warstwa obsługi urządzeń
    sterujących działa równie głęboko co obsługa myszy, a jest sprawdzana
    rzadziej, bo rzadziej się jej używa.

    Odnotowuję niską ocenę uczciwie. Nie jest to znana droga wejścia,
    a wartość punktu polega na zdjęciu jednej niesprawdzanej warstwy.
  en: |
    The rule is at times cast aside with the words "nobody plays upon this machine", and it is well that the
    application forestall it in one sentence. Steering gear is at times used beyond games, and the weightiest of
    those uses is gear of reach for people to whom a mouse comes hard.

    The argument worth keeping touches the driver. The layer backing steering gear works as deep as the backing of
    a mouse, and is looked over more seldom, it being more seldom used.

    I set down the low grading honestly. It is no known road in, and the item's worth lies in the taking away of
    one unlooked-over layer.
