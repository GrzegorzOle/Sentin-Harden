id: win11-feature-updates-deferred

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Aktualizacje funkcji opóźnione o co najmniej 180 dni
    en: Feature updates put off by at least 180 days
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Aktualizacja funkcji to nie poprawka, tylko nowe wydanie systemu: inne
    sterowniki, inne mechanizmy zabezpieczeń, przebudowane ustawienia. Punkt
    każe zaczekać z nią pół roku od chwili, gdy staje się ogólnie dostępna.

    Nie jest to punkt o odpieraniu ataku, tylko o utrzymaniu maszyny w stanie,
    w którym audyt cokolwiek znaczy. Świeże wydanie przynosi własne błędy,
    a przez pierwsze miesiące łata się je w tempie, którego żaden proces
    testowania nie nadąża sprawdzić. Pół roku wystarcza, żeby wydanie się
    ustabilizowało, a narzędzia zabezpieczające i oprogramowanie firmowe zdążyły
    je obsłużyć.

    Dla utwardzania ma to skutek bezpośredni: nowe wydanie potrafi przywrócić
    ustawienia do wartości domyślnych albo przenieść je pod inne wpisy, i robi to
    w sposób, którego nie widać, dopóki nie uruchomi się audytu ponownie.
    Opóźnienie daje czas na przygotowanie się do tego zamiast reagowania po fakcie.

    Punkt nie dotyczy poprawek bezpieczeństwa. Te idą własnym torem i punkt
    bliźniaczy pilnuje, żeby ich nie opóźniać wcale.
  en: |
    A feature update is not a fix but a new release of the system: different drivers,
    different protective mechanisms, rebuilt settings. The item says to wait half a
    year with it from the moment it becomes generally available.

    This is not an item about repelling an attack but about keeping the machine in a
    state where an audit means something. A fresh release brings faults of its own,
    and through the first months they are patched at a pace no testing process can
    keep up with. Half a year is enough for a release to settle, and for security
    tools and company software to catch up with it.

    For hardening it has a direct effect: a new release can restore settings to their
    defaults or move them under different entries, and it does so in a way that is
    not visible until the audit is run again. The delay gives time to prepare for
    that instead of reacting after the fact.

    The item does not concern security fixes. Those run on their own track, and a
    twin item sees to it that they are not put off at all.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna nie ma czekać na nowe wydanie z innego
    powodu niż ostrożność.

    Nic nie przestaje działać od razu. Skutek jest odroczony i polega na tym, że
    maszyna zostaje na obecnym wydaniu do pół roku dłużej, niż zostałaby sama.
    Poprawki bezpieczeństwa przychodzą w tym czasie bez zmian.

    Kłopot pojawia się tam, gdzie na nowe wydanie czeka się celowo: bo zawiera
    obsługę nowego sprzętu, bo wymaga go oprogramowanie, albo bo obecne wydanie
    zbliża się do końca wsparcia. Ostatni przypadek jest najważniejszy —
    opóźnienie o 180 dni na wydaniu, któremu zostało mniej, zostawia maszynę bez
    poprawek. Trzeba wtedy patrzeć na kalendarz wsparcia, a nie na samą zasadę.

    Użytkownik nie zobaczy nic poza tym, że oferta uaktualnienia do nowej wersji
    nie pojawia się w ustawieniach.

    Nie ma restartu.
  en: |
    What needs checking is whether the machine is not meant to wait for a new release
    for a reason other than caution.

    Nothing stops working at once. The effect is deferred and consists in the machine
    staying on its current release up to half a year longer than it would by itself.
    Security fixes arrive in that time unchanged.

    Trouble appears where a new release is awaited on purpose: because it brings
    support for new hardware, because software requires it, or because the current
    release is nearing the end of its support. The last case matters most - a
    180-day delay on a release with less than that left leaves the machine without
    fixes. Then it is the support calendar to look at, not the policy alone.

    The user sees nothing beyond the offer to upgrade to a new version not appearing
    in the settings.

    There is no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Maszyna nie dostanie nowego wydania systemu przez pół roku od jego udostępnienia
      - Sprzęt wymagający obsługi wprowadzonej w nowym wydaniu pozostanie nieobsługiwany do czasu opóźnienia
      - Na wydaniu zbliżającym się do końca wsparcia opóźnienie może zostawić maszynę bez poprawek
    en:
      - The machine will not receive a new release of the system for half a year after it appears
      - Hardware needing support introduced in the new release stays unsupported for the length of the delay
      - On a release nearing the end of its support, the delay can leave the machine without fixes
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Obecnemu wydaniu zostało mniej wsparcia niż wynosi opóźnienie
      - Na nowe wydanie czeka się celowo, bo wymaga go sprzęt albo oprogramowanie
    en:
      - The current release has less support left than the length of the delay
      - The new release is awaited on purpose, because hardware or software requires it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch and the number of days. The
      # switch set without a long enough delay is reported apart, because it is
      # the number that settles the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      $minimum = 180
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DeferFeatureUpdates'
        $days = $item.'DeferFeatureUpdatesPeriodInDays'
        if ($null -eq $switch -or $null -eq $days) { 'MISSING' }
        elseif ([int]$switch -ne 1) { 'NOT_SET' }
        elseif ([int]$days -lt $minimum) { 'BELOW_MINIMUM ' + [int]$days }
        else { 'AT_OR_ABOVE_MINIMUM' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AT_OR_ABOVE_MINIMUM
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path           = $path
      switch         = $item.'DeferFeatureUpdates'
      switch_existed = ($null -ne $item.'DeferFeatureUpdates')
      days           = $item.'DeferFeatureUpdatesPeriodInDays'
      days_existed   = ($null -ne $item.'DeferFeatureUpdatesPeriodInDays')
      key_existed    = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdates' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdatesPeriodInDays' -Value 180 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -ErrorAction SilentlyContinue
    }
    if ($b.days_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -Value $b.days -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Liczba dni ma zakres 0–365 i punkt wymaga co najmniej 180, więc reguła
    porównuje przez „nie mniej niż", a nie przez równość. Wartość wyższa jest
    spełnieniem, nie odstępstwem.

    Wycofanie nie usuwa gałęzi, nawet jeśli reguła ją założyła. Gałąź jest
    wspólna z pozostałymi ustawieniami aktualizacji i jej usunięcie cofnęłoby
    także je.

    Reguła czyta przełącznik i liczbę dni razem, bo przełącznik bez liczby daje
    opóźnienie zerowe — czyli stan, w którym ustawienie jest włączone, a nic nie
    robi. Rozdzielenie ich pokazywałoby taką maszynę jako spełniającą połowę
    punktu, podczas gdy nie spełnia go wcale.
  en: |
    The number of days ranges 0-365 and the item calls for at least 180, so the rule
    compares by "not less than" rather than by equality. A higher value is compliance,
    not a deviation.

    Rollback does not remove the key, even if the rule created it. The key is shared
    with the remaining update settings and removing it would undo those as well.

    The rule reads the switch and the number of days together, because the switch
    without the number gives a delay of zero - a state in which the setting is on and
    does nothing. Splitting them would show such a machine as meeting half the item,
    when it does not meet it at all.
