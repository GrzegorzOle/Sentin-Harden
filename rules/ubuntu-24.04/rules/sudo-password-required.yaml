id: ubuntu2404-sudo-password-required

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.2.4
  section: Access Control > Configure privilege escalation
  title:
    pl: Użytkownicy muszą podać hasło przy podnoszeniu uprawnień
    en: Ensure users must provide password for privilege escalation
  level: 2
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Wpis NOPASSWD w konfiguracji sudo pozwala wykonywać polecenia jako root
    bez podania hasła. Każdy, kto przejmie sesję takiego konta, np. przez
    złośliwy skrypt albo pozostawiony odblokowany komputer, dostaje od razu
    pełne uprawnienia.

    Punkt wymaga, żeby żaden wpis w konfiguracji sudo nie miał znacznika
    NOPASSWD.
  en: |
    A NOPASSWD entry in the sudo configuration lets commands run as root
    without a password. Anyone who takes over such an account's session, for
    example through a malicious script or an unlocked computer left alone,
    gets full rights at once.

    The item requires no entry in the sudo configuration to have the
    NOPASSWD tag.

disruption_description:
  pl: |
    Konta i skrypty, które dziś używają sudo bez hasła, np. automatyzacja,
    kopie zapasowe lub narzędzia wdrożeniowe, przestaną działać bez
    interakcji. Trzeba je przenieść na inny mechanizm, np. usługę systemd
    działającą jako root.
  en: |
    Accounts and scripts that use sudo without a password today, for example
    automation, backups or deployment tools, stop working without
    interaction. They have to be moved to another mechanism, for example a
    systemd service running as root.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Skrypty i narzędzia wywołujące sudo bez hasła, np. Ansible, kopie zapasowe lub zadania cron zwykłych kont
    en:
      - Scripts and tools that call sudo without a password, for example Ansible, backups or cron jobs of regular accounts
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na komputerze działa automatyzacja, która wymaga sudo bez hasła i nie ma zamiennika
    en:
      - The computer runs automation that needs sudo without a password and has no replacement
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v sudo >/dev/null 2>&1; then echo NOT_APPLICABLE; exit 0; fi
    sudo_flat() {
      local so
      command -v cvtsudoers >/dev/null 2>&1 || return 1
      so=$(cvtsudoers -f sudoers /etc/sudoers 2>/dev/null) || return 1
      printf '%s\n' "$so" | awk '{ if (sub(/\\$/, "")) { buf = buf $0; next } print buf $0; buf = "" }'
    }
    # One "binding<TAB>parameter" line per Defaults parameter, in sudoers order;
    # binding is empty for global Defaults, else e.g. ":alice" or "@host".
    sudo_defs() {
      local sf
      sf=$(sudo_flat) || return 1
      printf '%s\n' "$sf" | awk '
        /^Defaults/ {
          match($0, /^Defaults([:@>!][^ \t]*)?/)
          bind = substr($0, 9, RLENGTH - 8); rest = substr($0, RLENGTH + 1)
          p = ""; q = 0
          for (i = 1; i <= length(rest); i++) {
            c = substr(rest, i, 1)
            if (c == "\"") q = !q
            if (c == "," && !q) { emit(bind, p); p = ""; continue }
            p = p c
          }
          emit(bind, p)
        }
        function emit(b, s) { gsub(/^[ \t]+|[ \t]+$/, "", s); gsub(/[ \t]*=[ \t]*/, "=", s); if (s != "") print b "\t" s }'
    }
    flat=$(sudo_flat) || { echo CHECK_ERROR; exit 0; }
    # User specifications with the NOPASSWD tag; aliases and Defaults are skipped.
    n=$(printf '%s\n' "$flat" | awk '$1 !~ /^(Defaults|Cmnd_Alias|User_Alias|Host_Alias|Runas_Alias)/ && /NOPASSWD[ \t]*:/ { print $1 }' | sort -u | paste -sd, -)
    if [ -n "$n" ]; then echo "NOT_OK:nopasswd=$n"; else echo "OK:no-nopasswd"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://www.sudo.ws/docs/man/sudoers.man/
  - https://www.sudo.ws/docs/man/cvtsudoers.man/

notes:
  pl: |
    Sprawdzenie czyta konfigurację sudo poleceniem cvtsudoers, które
    wypisuje /etc/sudoers razem z dołączanymi plikami w tej samej
    kolejności, w jakiej czyta je sudo, i pomija te same pliki, np. pliki
    z kropką w nazwie w /etc/sudoers.d. Brak sudo daje wynik NOT_APPLICABLE.

    W wyniku NOT_OK są użytkownicy i grupy z wpisów ze znacznikiem
    NOPASSWD. Obrazy chmurowe Ubuntu dodają plik
    /etc/sudoers.d/90-cloud-init-users z takim wpisem dla domyślnego konta,
    np. ubuntu, więc na takich serwerach wynik zwykle jest NOT_OK. Reguła
    tylko sprawdza stan, bo takie wpisy zwykle są potrzebne jakiemuś
    narzędziu i trzeba je zastąpić świadomie. Wpis usuwa się albo zmienia na
    wersję z hasłem poleceniem visudo, np. visudo -f
    /etc/sudoers.d/nazwa-pliku; konto bez hasła musi je wcześniej otrzymać.
  en: |
    The check reads the sudo configuration with cvtsudoers, which prints
    /etc/sudoers together with its included files in the order sudo reads
    them and skips the same files, such as files with a dot in the name in
    /etc/sudoers.d. No sudo gives the NOT_APPLICABLE result.

    The NOT_OK result lists the users and groups of entries with the
    NOPASSWD tag. Ubuntu cloud images add the
    /etc/sudoers.d/90-cloud-init-users file with such an entry for the
    default account, for example ubuntu, so on such servers the result is
    usually NOT_OK. The rule only checks the state, because such entries are
    usually needed by some tool and have to be replaced on purpose. The
    entry is removed or changed to a version with a password with visudo,
    for example visudo -f /etc/sudoers.d/file-name; an account without a
    password has to get one first.
