id: win2016-hypervisor-code-integrity-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Wymuszanie integralności kodu przez hipernadzorcę włączone
    en: Code integrity enforced by the hypervisor enabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przenosi sprawdzanie podpisów kodu jądra do środowiska
    oddzielonego przez hipernadzorcę, poza zasięg samego jądra.

    Sprawdzanie podpisów istniało wcześniej, ale wykonywało je jądro —
    a więc ta sama część systemu, którą napastnik przejmuje. Kod, który
    znalazł się w jądrze, mógł sprawdzanie wyłączyć albo nauczyć je
    przyjmować własne podpisy. Zabezpieczenie broniło się samo sobą.

    Przeniesienie tej czynności poza jądro zmienia układ. Decyzja o tym, czy
    dany sterownik wolno uruchomić, zapada w miejscu, do którego jądro nie
    sięga. Napastnik, który przejął jądro, nie może już dołożyć własnego
    sterownika — może działać w jądrze, ale nie może się w nim utrwalić
    drogą, z której korzystano dotąd.

    Jest to najmocniejsze pojedyncze zabezpieczenie w tym bloku i zarazem
    najbardziej kosztowne w zgodności, bo odrzuca każdy sterownik, który nie
    spełnia zaostrzonych wymagań podpisu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    dołożenia własnego sterownika do jądra i utrwalenia się w nim tak, że
    przeżyje restart i nie będzie widoczny z poziomu systemu.
  en: |
    The setting moves the checking of kernel code signatures into an environment set apart by
    the hypervisor, beyond the kernel's own reach.

    The checking of signatures existed before, but the kernel did it - which is to say the very
    part of the system an attacker takes over. Code that found its way into the kernel could
    switch the checking off or teach it to take its own signatures. The safeguard guarded itself
    by itself.

    Moving that act outside the kernel changes the arrangement. The decision whether a given
    driver may be run is taken at a place the kernel does not reach. An attacker who has taken
    the kernel over can no longer add a driver of their own - they may act in the kernel but
    cannot settle themselves in it by the road used until now.

    It is the strongest single safeguard in this block and at the same time the costliest in
    compatibility, turning away as it does every driver that does not meet the tightened
    requirements of signature.

    What an attacker gains while the item goes unmet: the chance to add a driver of their own to
    the kernel and to settle themselves in it so that they survive a restart and stay unseen
    from within the system.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zgodność sterowników jest tu
    rzeczywistym problemem, a nie formalnością.

    Wymagania podpisu są ostrzejsze niż te, które system stawia zwykle.
    Sterownik podpisany i dotąd działający bez zastrzeżeń może zostać
    odrzucony, jeżeli został zbudowany w sposób niezgodny z tymi
    wymaganiami — a dotyczy to zwłaszcza sterowników starszych, budowanych
    zanim wymagania powstały.

    Trzy rodziny sterowników warto wymienić z nazwy. Pierwsza to sterowniki
    wydruku, zwłaszcza dostarczane przez wytwórców urządzeń
    wielofunkcyjnych. Druga to sterowniki kart i urządzeń specjalistycznych
    w zastosowaniach przemysłowych i pomiarowych. Trzecia to sterowniki
    narzędzi dostępowych, monitorujących i szyfrujących, które celowo
    sięgają głęboko.

    Objaw jest jednoznaczny: urządzenie przestaje działać po restarcie,
    a w dzienniku pojawia się wpis o zablokowaniu sterownika. Powiązanie
    z tą regułą jest więc osiągalne, w odróżnieniu od większości punktów
    tego bloku.

    Sprawdzenie przed wykonaniem powinno objąć wykaz sterowników spoza
    zestawu systemowego. Producent systemu udostępnia narzędzie do
    sprawdzania zgodności i warto z niego skorzystać przed zmianą, a nie po.

    Warstwa oparta na wirtualizacji musi być włączona wcześniej. Bez niej
    ten punkt nie robi nic, niezależnie od wpisu.

    Czego to nie psuje: aplikacji, usług sieciowych, udziałów,
    uwierzytelniania, sterowników spełniających wymagania.

    Wymaga restartu; cofnięcie działa po kolejnym restarcie.
  en: |
    The class is "needs a planned rollout", driver compatibility being here a real trouble rather
    than a formality.

    The requirements of signature are stricter than those the system sets as a rule. A driver
    signed and working until now without reproach may be turned away if it was built in a way at
    odds with those requirements - and that touches above all older drivers, built before the
    requirements came about.

    Three families of drivers are worth naming outright. The first is printing drivers, those
    supplied by the makers of multifunction devices above all. The second is the drivers of
    cards and specialist devices in industrial and measuring uses. The third is the drivers of
    access, monitoring and encryption tools, which reach deep on purpose.

    The symptom is unambiguous: the device stops working after a restart and an entry about a
    driver being blocked appears in the log. The tie to this rule is therefore within reach,
    unlike at most items of this block.

    The review before execution should take in a register of drivers from outside the system's
    own set. The system's maker makes available a tool for checking compatibility and it is
    worth using before the change rather than after.

    The layer resting on virtualisation has to be switched on beforehand. Without it this item
    does nothing, whatever the entry.

    What this does not break: applications, network services, shares, authentication, or drivers
    that meet the requirements.

    Calls for a restart; the undoing works after a further restart.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - virtualization-and-containers
    - printing
  what_breaks:
    pl:
      - Sterowniki wydruku wytwórców urządzeń wielofunkcyjnych bywają odrzucane, a urządzenie przestaje działać po restarcie
      - Sterowniki kart i urządzeń specjalistycznych w zastosowaniach przemysłowych i pomiarowych mogą podzielić ich los
      - Narzędzia dostępowe, monitorujące i szyfrujące sięgające głęboko w jądro przestają się ładować
      - Aplikacje, usługi sieciowe, udziały i sterowniki spełniające wymagania pozostają bez zmian
    en:
      - Printing drivers from the makers of multifunction devices are at times turned away, and the device stops working after a restart
      - The drivers of cards and specialist devices in industrial and measuring uses may share their fate
      - Access, monitoring and encryption tools reaching deep into the kernel stop loading
      - Applications, network services, shares and drivers that meet the requirements stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracują sterowniki starsze niż zaostrzone wymagania podpisu i nie sprawdzono ich zgodności
      - Maszyna obsługuje wydruk sterownikami wytwórcy urządzenia, dla których nie ma wersji zgodnej
      - Warstwa oparta na wirtualizacji nie jest jeszcze włączona
    en:
      - Drivers older than the tightened requirements of signature work on the machine and their compatibility has not been checked
      - The machine serves printing with a device maker's drivers for which there is no compatible version
      - The layer resting on virtualisation is not switched on yet
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
      $name = 'Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
    $name = 'Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Enabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Punkt domyka trójkę i jest w niej jedynym, który sam coś robi. Dwa
    poprzednie budują i warunkują warstwę; ten z niej korzysta.

    Warto to odzwierciedlić w kolejności pokazywania. Użytkownik, który
    zobaczy trzy niezależne niezgodności, wykona je w przypadkowej
    kolejności i część z nich nie zrobi nic. Użytkownik, który zobaczy
    jedną decyzję o trzech krokach, wykona je we właściwej kolejności
    i sprawdzi wynik raz.

    Trzy rodziny sterowników warte wymienienia z nazwy to jedyna rzecz,
    która przy tym punkcie realnie pomaga. Ostrzeżenie ogólne o zgodności
    sterowników nie mówi nikomu nic; wskazanie, że chodzi o wydruk, sprzęt
    pomiarowy i narzędzia sięgające głęboko, pozwala w kilka minut
    rozstrzygnąć, czy ta maszyna jest zagrożona.

    Odnotowuję też, że jest to jedyny punkt bloku, w którym objaw wskazuje
    przyczynę wprost. Wpis w dzienniku o zablokowanym sterowniku jest
    rzadkością na tle całego tego zestawu i warto tę rzadkość docenić.
  en: |
    The item shuts the three and is the only one in it that does something itself. The two before
    it build and condition the layer; this one uses it.

    That is worth reflecting in the order of showing. A user who sees three independent
    non-compliances will carry them out in a chance order and some of them will do nothing. A
    user who sees one decision in three steps will carry them out in the right order and check
    the outcome once.

    The three families of drivers worth naming outright are the one thing that really helps at
    this item. A general warning about driver compatibility tells nobody anything; pointing out
    that the matter is printing, measuring hardware and tools reaching deep lets it be settled in
    a few minutes whether this machine is at risk.

    Worth noting too that it is the one item in the block where the symptom points at the cause
    outright. An entry in the log about a blocked driver is a rarity against the whole of this
    set, and that rarity is worth valuing.
