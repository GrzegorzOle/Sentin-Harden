id: win2025-application-telemetry-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Wysyłanie danych o uruchamianych programach wyłączone
    en: Sending data about started programs switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza mechanizm zbierający i wysyłający informacje o programach
    uruchamianych na tej maszynie. Wartość zerowa oznacza wyłączenie —
    odwrotnie niż podpowiada nazwa wpisu.

    Kategoria niska i chcę powiedzieć, dlaczego niska, skoro poprzednie
    reguły w tym wątku oceniam wyżej. Zakres tych danych jest wąski:
    to informacja o tym, co się uruchamia, a nie o tym, co robi. Na dodatek
    przy ograniczonym zakresie danych diagnostycznych ten strumień i tak
    w większości nie wychodzi.

    Wartość jest więc uzupełniająca i na tym poprzestaję, zamiast dorabiać
    jej wagę. Wykaz uruchamianych programów na serwerze produkcyjnym jest
    jednak wykazem szczególnym — serwery uruchamiają niewiele i zawsze to
    samo, więc taka lista jest prawie dokładnym opisem roli maszyny.
    Wystarczy zobaczyć, co się na niej uruchamia, żeby wiedzieć, czym jest,
    jakiego oprogramowania używa i którym jego wersjom warto się przyjrzeć.

    To samo w sobie nie wystarcza do ataku i dlatego nie stawiam kategorii
    wyżej. Jest to jednak jeden z tych drobiazgów, które razem z innymi
    układają się w obraz, a osobno wyglądają na nic.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: jeden
    element opisu roli maszyny więcej, w zbiorze poza kontrolą
    organizacji.
  en: |
    The item switches off the mechanism that gathers and sends information
    about programs started on this machine. A value of zero means switched
    off - the reverse of what the entry's name suggests.

    The category is low, and I want to say why it is low, given that I rate
    the earlier rules in this vein higher. The scope of this data is narrow:
    it is information about what gets started, not about what it does. On
    top of that, with the diagnostic data scope trimmed, this stream mostly
    does not go out anyway.

    So its value is supplementary, and I leave it at that rather than invent
    a weight for it. A list of programs started on a production server is,
    however, a list of a particular kind - servers start few things and
    always the same things, so such a list is very nearly an exact
    description of the machine's role. Seeing what starts on it is enough to
    know what it is, what software it uses, and which of that software's
    versions are worth a look.

    That alone is not enough for an attack, and that is why I do not put the
    category higher. It is, though, one of those small things that together
    with others add up to a picture and separately look like nothing.

    What an attacker gains while the item goes unmet: one more element of
    the machine's role description, in a collection outside the
    organisation's control.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i uzasadnienie jest tu naprawdę krótkie.

    Ten mechanizm nie uczestniczy w uruchamianiu programów. On je
    obserwuje. Wyłączenie obserwacji nie zmienia niczego w tym, co i jak się
    uruchamia — programy startują tak samo, z tymi samymi uprawnieniami
    i z tym samym skutkiem.

    Osobno trzeba rozróżnić dwie rzeczy o podobnych nazwach, bo to jedyne
    miejsce, w którym da się tu pomylić. Mechanizm zgodności aplikacji,
    który pozwala starszym programom działać na nowszym systemie, jest
    czymś innym i ta reguła go nie wyłącza. Starsze oprogramowanie
    pracujące dziś na tym serwerze będzie pracować tak samo po zmianie.

    Jedyna strata, jaką potrafię wskazać, jest hipotetyczna i dotyczy
    planowania: organizacja badająca, czy starsze aplikacje zniosą zmianę
    wersji systemu, traci jedno ze źródeł danych do takiej analizy. Na
    serwerze produkcyjnym nie jest to źródło, z którego ktokolwiek
    faktycznie korzysta.

    Bez restartu, bez wylogowania, niewidoczne w codziennej pracy,
    natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and the justification here really is
    short.

    This mechanism takes no part in starting programs. It watches them.
    Switching off the watching changes nothing in what starts or how -
    programs start the same way, with the same privileges and the same
    result.

    Two things with similar names have to be told apart separately, because
    this is the only place here where they can be confused. The application
    compatibility mechanism, which lets older programs run on a newer
    system, is a different thing and this rule does not switch it off. Older
    software running on this server today will run the same way after the
    change.

    The only loss I can point to is hypothetical and concerns planning: an
    organisation studying whether its older applications will survive a
    change of system version loses one of the sources of data for such an
    analysis. On a production server this is not a source anybody actually
    uses.

    No restart, no sign-out, invisible in daily work, undone immediately,
    may be applied in bulk.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Nic nie przestaje działać — mechanizm nie uczestniczy w uruchamianiu programów, tylko je obserwuje
      - Mechanizm zgodności pozwalający starszym programom działać na nowszym systemie jest czymś innym i pozostaje włączony
      - Organizacja badająca, czy starsze aplikacje zniosą zmianę wersji systemu, traci jedno ze źródeł danych do takiej analizy
      - Na serwerze produkcyjnym nie jest to źródło, z którego ktokolwiek faktycznie korzysta
    en:
      - Nothing stops working - the mechanism takes no part in starting programs, it watches them
      - The compatibility mechanism that lets older programs run on a newer system is a different thing and stays on
      - An organisation studying whether older applications will survive a change of system version loses one source of data for that analysis
      - On a production server this is not a source anybody actually uses
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja opiera badanie zgodności starszych aplikacji z nową wersją systemu właśnie na tych danych
    en:
      - The organisation rests its study of older applications' compatibility with a new system version on exactly this data
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is the reverse of the setting's name in the editor: zero means
      # the sending is switched off.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'AITEnable'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'AITEnable'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This switches off the watching of started programs, not the compatibility
    # mechanism that lets older software run on a newer system - those are
    # different things and the latter stays on.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AITEnable' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Wartość uzupełniająca i poprzestaję na tym, zamiast dorabiać jej wagę.
    Zakres jest wąski: informacja o tym, co się uruchamia, a nie o tym, co
    robi.

    Wykaz uruchamianych programów na serwerze produkcyjnym jest jednak
    szczególny — serwery uruchamiają niewiele i zawsze to samo, więc taka
    lista jest prawie dokładnym opisem roli maszyny. Sama w sobie nie
    wystarcza do ataku, dlatego kategoria pozostaje niska.

    Do rozróżnienia: mechanizm zgodności pozwalający starszym programom
    działać na nowszym systemie to co innego i ta reguła go nie wyłącza.
  en: |
    A supplementary value, and I leave it at that rather than invent a
    weight for it. The scope is narrow: information about what starts, not
    about what it does.

    A list of programs started on a production server is nevertheless a list
    of a particular kind - servers start few things and always the same
    ones, so such a list is very nearly an exact description of the
    machine's role. It is not enough for an attack on its own, which is why
    the category stays low.

    To be told apart: the compatibility mechanism that lets older programs
    run on a newer system is a different thing and this rule does not switch
    it off.
