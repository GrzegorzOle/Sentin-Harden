id: win2025-sandbox-audio-input-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Dostęp do mikrofonu z piaskownicy wyłączony
    en: Access to the microphone from the sandbox disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera piaskownicy dostęp do wejścia dźwięku gospodarza.

    Kategoria średnia i chcę postawić sprawę tak, jak ona wygląda, a nie
    tak, jak brzmi. Nazwa mówi o mikrofonie i na serwerze wygląda przez to
    na punkt bezprzedmiotowy. Przedmiot jest jednak inny: to dostęp
    programu, któremu nie ufamy, do fizycznego urządzenia gospodarza.

    Urządzenie wejściowe znaczy dwie rzeczy naraz. Po pierwsze, sterownik —
    kolejny kawałek kodu gospodarza, z którym podejrzany program może
    rozmawiać, z pominięciem granicy, dla której piaskownicę w ogóle
    uruchomiono. Po drugie, treść: jeżeli wejście dźwięku istnieje, to
    nagrywa pomieszczenie, w którym stoi maszyna.

    Na serwerze wejście dźwięku zwykle nie istnieje i mówię to wprost,
    zamiast udawać zagrożenie. Ale nie jest to nigdy pewne — maszyna
    wirtualna dostaje urządzenia od gospodarza, a w sesji zdalnej mikrofon
    bywa przekierowany ze stanowiska osoby, która się połączyła. Wtedy
    „mikrofon serwera" to mikrofon w pokoju administratora.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozmowę
    z kolejnym sterownikiem gospodarza, a przy istniejącym wejściu dźwięku —
    nagranie pomieszczenia, w którym ktoś właśnie pracuje przy tej maszynie.
  en: |
    The item takes the sandbox's access to the host's audio input away.

    The category is medium, and I want to put the matter as it is rather than
    as it sounds. The name speaks of a microphone and on a server therefore
    looks like a moot item. The subject, however, is another: access by a
    program we do not trust to a physical device of the host.

    An input device means two things at once. First, a driver - one more
    piece of the host's code a suspect program can talk to, bypassing the
    boundary for which the sandbox was started at all. Second, content: if an
    audio input exists, it records the room the machine stands in.

    On a server an audio input usually does not exist, and I say so plainly
    rather than feign a threat. But it is never certain - a virtual machine
    receives devices from its host, and in a remote session a microphone is
    sometimes redirected from the workstation of whoever connected. Then "the
    server's microphone" is a microphone in an administrator's room.

    What an attacker gains while the item goes unmet: a conversation with one
    more of the host's drivers and, where an audio input exists, a recording
    of the room somebody is working in at that machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze zwykle nie ma tu nic do
    stracenia, a piaskownica bywa w ogóle niezainstalowana — to funkcja
    opcjonalna.

    Skutek: program uruchomiony w piaskownicy nie usłyszy niczego
    z mikrofonu. Jeżeli ktoś sprawdza w piaskownicy program, który
    z mikrofonu korzysta — komunikator, narzędzie do nagrywania, program
    rozpoznający mowę — sprawdzenie przestaje mieć sens. To jest jedyny
    przypadek, w którym ta reguła przeszkadza, ale przeszkadza wtedy
    całkowicie.

    Czego to nie psuje: dźwięku w systemie gospodarza, mikrofonu
    w sesjach zdalnych, przekierowania dźwięku w tych sesjach ani żadnego
    sterownika. Nie odbiera też piaskownicy dźwięku wychodzącego — punkt
    dotyczy wejścia, nie odtwarzania.

    Rzecz do zapamiętania: to jeden z sześciu punktów o piaskownicy leżących
    pod jedną ścieżką rejestru, pod różnymi nazwami wartości. Wejście
    dźwięku i wejście obrazu to dwie osobne wartości i zrobienie jednego nie
    zamyka drugiego.

    Zmiana obowiązuje od następnego uruchomienia piaskownicy. Bez przerwy,
    natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server there is usually
    nothing to lose here, and the sandbox is often not installed at all - it
    is an optional feature.

    The effect: a program run in the sandbox will hear nothing from a
    microphone. If somebody checks in the sandbox a program that uses a
    microphone - a messenger, a recording tool, speech recognition - the
    check stops making sense. That is the only case in which this rule gets
    in the way, but there it gets in the way entirely.

    What this does not break: sound in the host system, a microphone in
    remote sessions, audio redirection in those sessions, or any driver. Nor
    does it take outgoing sound from the sandbox - the item concerns input,
    not playback.

    Something to remember: this is one of six sandbox items lying under one
    registry path, under different value names. Audio input and video input
    are two separate values, and doing one does not close the other.

    The change holds from the next start of the sandbox. No outage, undone
    immediately.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Program uruchomiony w piaskownicy nie usłyszy niczego z mikrofonu
      - Sprawdzanie w piaskownicy komunikatora, narzędzia nagrywającego albo programu rozpoznającego mowę przestaje mieć sens
      - Dźwięk w systemie gospodarza, mikrofon w sesjach zdalnych i przekierowanie dźwięku w tych sesjach działają bez zmian
      - Wejście dźwięku i wejście obrazu to dwie osobne wartości — zrobienie jednego nie zamyka drugiego
    en:
      - A program run in the sandbox will hear nothing from a microphone
      - Checking a messenger, a recording tool or speech recognition in the sandbox stops making sense
      - Sound in the host system, a microphone in remote sessions and audio redirection in those sessions work unchanged
      - Audio input and video input are two separate values - doing one does not close the other
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica na tej maszynie służy do sprawdzania programów korzystających z mikrofonu
    en:
      - The sandbox on this machine is used to check programs that use a microphone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      $name = 'AllowAudioInput'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $name = 'AllowAudioInput'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The subject is access by untrusted code to a physical device of the host:
    # one more driver to talk to, and, where an input exists, a recording of the
    # room. A server usually has none - but a virtual machine takes devices from
    # its host and a remote session can redirect one from the person connecting.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAudioInput' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Nazwa mówi o mikrofonie i na serwerze wygląda przez to na punkt
    bezprzedmiotowy. Przedmiotem jest dostęp programu, któremu nie ufamy, do
    fizycznego urządzenia gospodarza.

    Urządzenie wejściowe znaczy dwie rzeczy naraz: sterownik, czyli kolejny
    kawałek kodu gospodarza do rozmowy z pominięciem granicy piaskownicy,
    oraz treść — jeżeli wejście dźwięku istnieje, nagrywa pomieszczenie.

    Na serwerze wejścia zwykle nie ma i mówię to wprost. Ale pewne to nie
    jest: maszyna wirtualna dostaje urządzenia od gospodarza, a w sesji
    zdalnej mikrofon bywa przekierowany ze stanowiska osoby, która się
    połączyła.
  en: |
    The name speaks of a microphone and on a server therefore looks like a
    moot item. The subject is access by a program we do not trust to a
    physical device of the host.

    An input device means two things at once: a driver, that is one more
    piece of the host's code to talk to while bypassing the sandbox's
    boundary, and content - if an audio input exists, it records the room.

    On a server there usually is no input and I say so plainly. But it is not
    certain: a virtual machine receives devices from its host, and in a
    remote session a microphone is sometimes redirected from the workstation
    of whoever connected.
