id: win10-lock-pages-in-memory-none

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Blokowanie stron w pamięci nieprzyznane nikomu
    en: The locking of pages in memory granted to nobody
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera wszystkim prawo do blokowania stron w pamięci.

    System przenosi nieużywane fragmenty pamięci na dysk, żeby zwolnić
    miejsce dla tego, co jest potrzebne w tej chwili. Prawo to pozwala
    programowi wyłączyć się z tego mechanizmu i zatrzymać swoją pamięć na
    stałe w układzie pamięci fizycznej.

    Zastosowanie użytkowe istnieje i dotyczy dużych baz danych, które
    zarządzają własnym buforem lepiej niż system. Poza tym jednym
    przypadkiem prawo to nie jest nikomu potrzebne.

    Zagrożenie nie polega tu na przejęciu uprawnień, tylko na odebraniu
    maszynie pamięci. Konto z tym prawem może zablokować dowolnie dużo
    pamięci fizycznej, a system nie ma sposobu, żeby ją odzyskać —
    nie może przenieść jej na dysk, bo właśnie tego mu zabroniono.
    Skutkiem jest maszyna, która przestaje odpowiadać.

    Odnotowuję, że jest to jedyny punkt w tym bloku dotyczący dostępności,
    a nie poufności ani integralności. Ocena średnia wynika właśnie z tego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    zatrzymanie maszyny bez żadnego dostępu do jej danych.
  en: |
    The setting takes from everybody the right of locking pages in memory.

    The system carries unused pieces of memory over to the disk, to free room for what is needed at the hour. That
    right lets a program take itself out of that mechanism and hold its memory for good in the arrangement of
    physical memory.

    A use for it exists and touches great bases that rule their own store better than the system does. Beyond that
    one case the right is needed by nobody.

    The danger rests here not upon a taking of rights but upon the taking of memory from the machine. An account
    with this right may lock as much physical memory as it likes, and the system has no way of winning it back -
    it cannot carry it over to the disk, that being just what it was forbidden. The upshot is a machine that
    ceases to answer.

    I set down that it is the one item of this block touching availability and neither secrecy nor soundness. The
    middling grading follows from just that.

    What an attacker gains while the item goes unmet: a way of halting the machine with no way into its data at
    all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wykaz jest pusty na stanowisku roboczym i praktycznie na każdej
    maszynie, na której nie stoi duża baza danych.

    Odnotowuję jedyny przypadek wart sprawdzenia: serwer bazodanowy
    skonfigurowany do zarządzania własnym buforem. Konto usługowe takiej
    bazy bywa w tym wykazie celowo i odebranie prawa zmieni sposób jej
    pracy — baza wystartuje, ale straci przewidywalność czasu odpowiedzi.

    Sprawdzenie polega na przeczytaniu wykazu przed zmianą. Wpis oznacza,
    że ktoś świadomie to prawo nadał.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: pracy programów użytkowych, logowania, dostępu do
    plików, wydajności, drukowania.
  en: |
    The class is "no disruption".

    The list stands empty upon a working station and practically upon every machine where no great base of data
    stands.

    I set down the one case worth reviewing: a server of bases set to rule its own store. The service account of
    such a base is at times in this list on purpose, and the taking away of the right will change how it works -
    the base will start, but will lose the steadiness of its time of answering.

    The review comes down to a reading of the list before the change. An entry means somebody granted this right
    knowingly.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the work of programs of use, logging on, the way to files, speed, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - virtualization-and-containers
  what_breaks:
    pl:
      - Serwer bazodanowy zarządzający własnym buforem straci przewidywalność czasu odpowiedzi
      - Baza wystartuje i będzie pracować, ale jej pamięć zacznie podlegać przenoszeniu na dysk
      - Wpis w tym wykazie oznacza, że ktoś świadomie to prawo nadał, i warto ustalić po co
      - Na stanowisku roboczym wykaz jest pusty, więc zmiana jest tam zapisem stanu
      - Praca programów użytkowych, logowanie, dostęp do plików, wydajność i drukowanie pozostają bez zmian
    en:
      - A server of bases ruling its own store will lose the steadiness of its time of answering
      - The base will start and will work, but its memory will begin to be carried over to the disk
      - An entry in this list means somebody granted the right knowingly, and to what end is worth settling
      - Upon a working station the list stands empty, so there the change is a setting down of a state
      - The work of programs of use, logging on, the way to files, speed and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi serwer bazodanowy skonfigurowany do zarządzania własnym buforem w pamięci
    en:
      - Upon the machine stands a server of bases set to rule its own store in memory
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeLockMemoryPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeLockMemoryPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeLockMemoryPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right goes to nobody at all, so the line is written empty. An empty line
    # is the setting; leaving the line out would keep whatever stood there before.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeLockMemoryPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeLockMemoryPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/lock-pages-in-memory

notes:
  pl: |
    Reguła jest w tym bloku jedyną, która nie dotyczy dostępu do danych,
    i warto, żeby aplikacja to powiedziała wprost. Pozostałe punkty bronią
    poufności albo integralności; ten broni tego, żeby maszyna dalej
    działała.

    Argument wart zachowania dotyczy tego, dlaczego ocena jest średnia,
    a nie wyższa. Skutek jest poważny — maszyna przestaje odpowiadać — ale
    napastnik nie zyskuje przy tym dostępu do niczego. Jest to wyłączenie
    maszyny wykonane w sposób okrężny, a taki sam skutek daje znacznie
    prostsze odcięcie zasilania.

    Odnotowuję zastosowanie użytkowe, bo jest tu realne i warto je
    wymienić. Duża baza danych, która zarządza własnym buforem, ma powód,
    żeby to prawo mieć. Punkt ten nie jest więc regułą, którą można
    wdrożyć bez patrzenia — mimo że na stanowisku roboczym nic nie
    kosztuje.
  en: |
    The rule is the only one of this block that does not touch a way to data, and it is well that the application
    say so outright. The other items guard secrecy or soundness; this guards the machine's going on at all.

    The argument worth keeping touches why the grading is middling and no higher. The upshot is grave - the
    machine ceases to answer - but the attacker wins no way into anything by it. It is a switching off of the
    machine done by a roundabout road, and a far simpler cutting of the power gives the same.

    I set down the use it has, that being here a real one and worth naming. A great base of data that rules its
    own store has a ground for holding this right. This item is therefore no rule to be rolled out without
    looking - though upon a working station it costs nothing.
