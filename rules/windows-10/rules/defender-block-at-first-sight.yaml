id: win10-defender-block-at-first-sight

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Blokowanie przy pierwszym napotkaniu włączone
    en: Block at first sight enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe wstrzymać plik nieznany do chwili, w której przyjdzie
    odpowiedź z usług producenta.

    Jest to dopełnienie reguły o ochronie dostarczanej z chmury i bez niej
    nie działa. Tamta pozwala zapytać; ta rozstrzyga, co się dzieje,
    zanim odpowiedź przyjdzie. Różnica sprowadza się do jednego: czy plik
    czeka, czy się uruchamia.

    Bez tego ustawienia zapytanie ma wartość jedynie historyczną. Plik
    zostaje uruchomiony, odpowiedź przychodzi po sekundzie, a ochrona
    zatrzymuje go — jeśli zdąży. Przy oprogramowaniu szyfrującym pliki
    sekunda jest odstępem wystarczającym.

    Odnotowuję, że wstrzymanie obejmuje wyłącznie pliki nieznane
    i pobrane. Plik znany, plik podpisany i plik już wcześniej
    uruchamiany przechodzą bez czekania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sekundy
    swobodnego działania między uruchomieniem nowego pliku a nadejściem
    odpowiedzi o nim.
  en: |
    The setting bids an unknown file be held until the hour an answer comes from the maker's services.

    It is the rounding out of the rule about cloud-delivered protection and without it does not work. That one
    allows the asking; this settles what happens before the answer comes. The difference comes down to one thing:
    whether the file waits or runs.

    Without this setting the asking is of a worth merely historical. The file is started, the answer comes after
    a second, and the protection holds it back - if it is in time. With software that enciphers files a second is
    span enough.

    I set down that the holding takes in unknown and downloaded files alone. A known file, a signed file and a
    file started before go through without a wait.

    What an attacker gains while the item goes unmet: seconds of free working between the starting of a new file
    and the coming of an answer about it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczą zauważalną jest czekanie.

    Użytkownik, który pobrał program i uruchomił go od razu, zobaczy
    zatrzymanie trwające do kilku sekund. Nie jest to awaria i nie wymaga
    niczego poza poczekaniem, ale jest to zachowanie nowe i nieopisane
    żadnym komunikatem, więc bywa brane za zawieszenie.

    Sprawdzić trzeba dwie sytuacje. Pierwsza to praca bez łączności:
    maszyna odcięta nie dostanie odpowiedzi i będzie czekać do upływu
    limitu czasu, po czym plik uruchomi. Skutkiem jest opóźnienie stałe
    przy każdym pliku nieznanym.

    Druga to stanowiska pracujące z oprogramowaniem własnej roboty, które
    z natury rzeczy jest zawsze nieznane. Każda nowa wersja programu
    budowanego na miejscu przechodzi przez to czekanie.

    Odnotowuję, że wstrzymywane są wyłącznie pliki nieznane i pobrane —
    codzienna praca z zainstalowanymi programami nie zmienia się wcale.

    Czego to nie psuje: uruchamiania programów zainstalowanych, otwierania
    dokumentów, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the thing that shows is the waiting.

    A user who has downloaded a program and started it at once will see a halt lasting up to some few seconds. It
    is no fault and calls for nothing beyond a wait, but it is a new behaviour described by no message, and so it
    is at times taken for a hanging.

    Two cases have to be reviewed. The first is work without a link: a cut-off machine will get no answer and
    will wait out the time bound, after which it starts the file. The consequence is a steady delay at every
    unknown file.

    The second is workstations working with software of their own making, which by the nature of the thing is
    always unknown. Every new build of a program made in place goes through that waiting.

    I set down that only unknown and downloaded files are held - daily work with installed programs does not
    change at all.

    What this does not break: the starting of installed programs, the opening of documents, logging on, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Pobrany program uruchomiony od razu zatrzymuje się na kilka sekund bez żadnego komunikatu
      - Maszyna odcięta od sieci czeka do upływu limitu czasu przy każdym pliku nieznanym
      - Każda nowa wersja programu budowanego na miejscu przechodzi przez to czekanie, bo jest zawsze nieznana
      - Wstrzymywane są wyłącznie pliki nieznane i pobrane, a plik podpisany albo już uruchamiany przechodzi bez czekania
      - Uruchamianie programów zainstalowanych, logowanie, konta domenowe, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A downloaded program started at once halts for some few seconds with no message at all
      - A machine cut off from the network waits out the time bound at every unknown file
      - Every new build of a program made in place goes through that waiting, being always unknown
      - Only unknown and downloaded files are held, a signed file or one started before going through without a wait
      - The starting of installed programs, logging on, domain accounts, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ochrona dostarczana z chmury jest na tej maszynie wyłączona i nie ma skąd przyjść odpowiedzi
      - Maszyna służy do budowania oprogramowania, a każda nowa wersja jest plikiem nieznanym
    en:
      - Cloud-delivered protection is switched off upon this machine and there is nowhere for an answer to come from
      - The machine serves for the building of software and every new build is an unknown file
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableBlockAtFirstSeen) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'DisableBlockAtFirstSeen'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is a negative one, so the compliant value is a nought: blocking at
    # first sight is not switched off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableBlockAtFirstSeen' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-block-at-first-sight-microsoft-defender-antivirus

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną odczuwalną w codziennej pracy.
    Warto, żeby aplikacja pokazywała ją razem z regułą o ochronie
    dostarczanej z chmury, bo bez tamtej jest bezprzedmiotowa — a przy
    tamtej odpuszczonej pozostaje wyłącznie kosztem.

    Argument wart postawienia wprost dotyczy tego, co się dzieje bez tego
    ustawienia. Zapytanie zostaje wysłane, odpowiedź przychodzi, plik już
    działa. Ochrona zatrzyma go wtedy, jeśli zdąży — i właśnie to słowo
    odróżnia obie reguły. Jedna pyta, druga czeka na odpowiedź.

    Odnotowuję zachowanie, którego użytkownik nie rozpozna sam:
    zatrzymanie nie jest opisane żadnym komunikatem. Program pobrany
    i uruchomiony po prostu przez chwilę nie robi nic. Aplikacja opisująca
    ten punkt powinna to powiedzieć, bo jest to jedyna zmiana z całego
    bloku, o którą ktoś zapyta obsługę.
  en: |
    The rule closes the block and is the only one in it felt in daily work. It is well that the application show
    it together with the rule about cloud-delivered protection, without that one it being beside the point - and
    with that one let go it staying a cost alone.

    The argument worth putting outright touches what happens without this setting. The asking is sent, the answer
    comes, the file already runs. The protection will then hold it back if it is in time - and it is just that
    word which parts the two rules. One asks; the other waits for the answer.

    I set down a behaviour a user will not know again of themselves: the halt is described by no message. A
    program downloaded and started simply does nothing for a moment. An application setting this item out ought
    to say so, it being the one change in the whole block somebody will ask the support about.
