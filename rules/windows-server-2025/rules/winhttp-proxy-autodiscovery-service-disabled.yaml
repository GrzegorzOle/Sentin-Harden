id: win2025-winhttp-proxy-autodiscovery-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa automatycznego wyszukiwania pośrednika sieciowego wyłączona
    en: The service automatically searching for a network proxy disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę, która sama szuka w sieci pośrednika dla ruchu
    wychodzącego i przyjmuje wskazanie, przez kogo ten ruch ma iść.

    Zostawiam kategorię wysoką. Pośrednik jest maszyną, przez którą
    przechodzi ruch — czyli maszyną, która ten ruch widzi, a przy
    połączeniach dających się rozszyć także nim dysponuje. Usługa opisana
    tym punktem rozstrzyga, kto nim będzie, pytając o to sieć. Odpowiada
    ten, kto zdąży.

    Na serwerze waży to więcej niż na stacji roboczej, bo waży co innego.
    Ruch wychodzący ze stacji roboczej to w dużej części człowiek
    otwierający strony. Ruch wychodzący z serwera to pobieranie
    aktualizacji, zgłaszanie się agentów do swoich systemów, sprawdzanie
    list unieważnionych certyfikatów, aktywacja licencji. Są to rzeczy,
    które dzieją się same, bez niczyjego udziału i bez niczyjego
    spojrzenia — a każda z nich jest połączeniem, w którym maszyna
    ufa temu, co dostaje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wskazania serwerowi siebie jako drogi na zewnątrz, dla ruchu, którego
    nikt nie ogląda.
  en: |
    The item switches off the service that of itself seeks in the net a go-between for the traffic
    going out and takes a pointing as to through whom that traffic is to go.

    I leave the category high. A go-between is a machine the traffic goes through - that is, a machine
    that sees that traffic, and at bindings that may be unpicked also has it at its will. The service
    set forth by this item settles who that will be by asking the net. The one who is quickest
    answers.

    Upon a server that weighs more than upon a workstation, it weighing something else. The traffic
    going out of a workstation is in great part a person opening pages. The traffic going out of a
    server is the drawing of makings anew, the reporting of agents to their systems, the looking to
    lists of tokens undone, the making good of a leave to use. Those are things that befall of
    themselves, with nobody's share in them and under nobody's eye - and each of them is a binding
    wherein the machine trusts what it is given.

    What an attacker gains while the item goes unmet - the leave to name themselves to the server as
    the road outwards, for traffic nobody looks upon.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i jest to jeden
    z niewielu punktów, przy których skutek zmiany bywa szerszy niż
    skutek jej niezastosowania.

    Jeżeli droga tego serwera na zewnątrz prowadzi przez pośrednika
    znajdowanego właśnie w ten sposób — a w sieciach, w których
    pośrednika nie wpisuje się ręcznie, prowadzi zawsze — to wyłączenie
    usługi zatrzymuje cały ruch wychodzący, nie jedną drogę do niego.

    Objaw jest najgorszym możliwym połączeniem cech, o których piszę
    w całej tej paczce: odroczony, cichy i pojawiający się w innym
    miejscu. Serwer nie zgłosi, że nie ma jak wyjść. Przestaną natomiast
    przychodzić aktualizacje, agent przestanie się zgłaszać, sprawdzanie
    ważności certyfikatów zacznie kończyć się niepowodzeniem, a licencja
    w swoim czasie wygaśnie. Każda z tych rzeczy ujawni się osobno,
    tygodniami później i pod własnym, mylącym opisem. Serwer, który
    przestał pobierać aktualizacje, jest serwerem niezałatanym — i nikt
    tego nie zauważy, dopóki nie zapyta wprost.

    Sprawdzenie musi więc poprzedzić zmianę i jest jednoznaczne: ustal,
    czy pośrednik jest wpisany w konfiguracji, czy znajdowany. Jeżeli
    wpisany — zmiana jest czysta. Jeżeli znajdowany — wpisz go najpierw
    na stałe, potem wyłącz usługę, i w tej kolejności.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a witting rolling out", and it is one of the few items whereat the
    outcome of the change is at times broader than the outcome of its not being laid on.

    If the road of that server outwards lead through a go-between found in just that way - and in nets
    wherein a go-between is not written in by hand it always does - then the switching off of the
    service stops all the traffic going out, and not one road to it.

    The symptom is the worst there could be of the marks whereof I write throughout this pack - put
    off, still, and coming forth in another stead. The server will not give word that it has no way
    out. There will stop coming, though, the makings anew, the agent will stop reporting, the looking
    to the standing of tokens will begin ending in failure, and the leave to use will in its time run
    out. Each of those things will come to light apart, weeks later and under a telling of its own
    that misleads. A server that stopped drawing makings anew is an unmended server - and nobody will
    mark it until they ask outright.

    The checking must therefore go before the change, and it is of one meaning - settle whether the
    go-between be written into the settings or found. If written in - the change is clean. If found -
    write it in for good first, then switch the service off, and in that order.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
    - legacy-applications
  what_breaks:
    pl:
      - Tam, gdzie pośrednik jest znajdowany, a nie wpisany, zatrzymuje się cały ruch wychodzący
      - Przestają przychodzić aktualizacje, a serwer niezałatany nie zgłasza tego nikomu
      - Agent przestaje zgłaszać się do swojego systemu i znika z widoku po cichu
      - Sprawdzanie ważności certyfikatów zaczyna kończyć się niepowodzeniem
      - Licencja w swoim czasie wygasa, a każda z tych rzeczy ujawnia się osobno i pod mylącym opisem
    en:
      - Where the go-between is found and not written in, all the traffic going out stops
      - The makings anew stop coming, and an unmended server gives word of it to nobody
      - The agent stops reporting to its system and goes out of sight in stillness
      - The looking to the standing of tokens begins ending in failure
      - The leave to use runs out in its time, and each of those things comes to light apart and under a telling that misleads
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Droga serwera na zewnątrz prowadzi przez pośrednika znajdowanego, a nie wpisanego w konfiguracji
      - Nie ustalono, czy pośrednik jest wpisany, czy znajdowany
    en:
      - The road of the server outwards leads through a go-between that is found and not written into the settings
      - It was not settled whether the go-between be written in or found
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the way out of the network leads through an automatically found
    # proxy, this stops all outgoing traffic - not one route to it. Write the
    # proxy into the configuration first, then disable the service.
    Stop-Service -Name 'WinHttpAutoProxySvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinHttpAutoProxySvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WinHttpAutoProxySvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winhttp/winhttp-autoproxy-api

notes:
  pl: |
    Na serwerze waży to więcej niż na stacji roboczej, bo waży co innego.
    Ruch wychodzący ze stacji to w dużej części człowiek otwierający
    strony. Ruch wychodzący z serwera to aktualizacje, zgłaszanie się
    agentów, sprawdzanie unieważnionych certyfikatów i aktywacja
    licencji — rzeczy, które dzieją się same i bez niczyjego spojrzenia.

    Jeden z niewielu punktów, przy których skutek zmiany bywa szerszy niż
    skutek jej niezastosowania: tam, gdzie pośrednik jest znajdowany,
    wyłączenie usługi zatrzymuje cały ruch wychodzący, nie jedną drogę
    do niego.

    Kolejność jest obowiązkowa: najpierw wpisz pośrednika na stałe,
    potem wyłącz usługę.
  en: |
    Upon a server that weighs more than upon a workstation, it weighing something else. The traffic
    going out of a workstation is in great part a person opening pages. The traffic going out of a
    server is the makings anew, the reporting of agents, the looking to tokens undone and the making
    good of a leave to use - things that befall of themselves and under nobody's eye.

    One of the few items whereat the outcome of the change is at times broader than the outcome of its
    not being laid on - where the go-between is found, the switching off of the service stops all the
    traffic going out and not one road to it.

    The order is bounden - write the go-between in for good first, then switch the service off.
