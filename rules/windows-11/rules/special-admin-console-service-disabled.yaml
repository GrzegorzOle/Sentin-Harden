id: win11-special-admin-console-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konsoli ratunkowej dostępnej poza systemem wyłączona
    en: The emergency console service reachable outside the system disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia konsolę ratunkową osiągalną przez łącze szeregowe
    — także wtedy, gdy system nie odpowiada normalną drogą. Z konsoli tej da
    się wypisać procesy, zakończyć je, przestawić adresy sieciowe i uruchomić
    maszynę ponownie.

    Mechanizm powstał dla serwerów stojących w miejscach, do których nie da
    się szybko dojechać, i tam ma sens. Jego założenie brzmi: skoro system
    przestał odpowiadać, musi istnieć droga obok niego. Droga obok systemu
    oznacza jednak również drogę obok wszystkiego, co system robi w sprawie
    bezpieczeństwa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    poleceń na maszynie przez kanał, który nie podlega zaporze, nie jest
    widoczny dla narzędzi obserwujących ruch sieciowy i nie zostawia śladu
    w dziennikach logowania w takiej postaci, jakiej się tam szuka.
    Uwierzytelnianie na tej drodze opiera się na dostępie do łącza
    szeregowego — fizycznego albo wystawionego przez kontroler zarządzania
    sprzętem.

    Ostatnie zastrzeżenie jest tu najważniejsze. Łącze szeregowe bywa
    wystawione przez sieć, przez kontroler zarządzania serwerem — i wtedy
    „dostęp fizyczny" przestaje być przeszkodą.
  en: |
    The service offers an emergency console reachable over a serial link - including when
    the system does not answer by the normal route. From that console processes can be
    listed and ended, network addresses changed and the machine restarted.

    The mechanism was made for servers standing where they cannot be reached quickly, and
    there it makes sense. Its assumption runs: since the system has stopped answering,
    there must be a route alongside it. A route alongside the system, though, also means
    a route alongside everything the system does about security.

    What an attacker gains while the item goes unmet: access to commands on the machine
    through a channel not subject to the firewall, invisible to tools watching network
    traffic and leaving no trace in the sign-in logs in the form looked for there.
    Authentication on this route rests on access to the serial link - physical, or put
    out by a hardware management controller.

    That last reservation matters most here. A serial link is sometimes put out over the
    network by a server management controller - and then "physical access" stops being an
    obstacle.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna jest obsługiwana przez łącze szeregowe
    w razie awarii — a na stacji roboczej nie jest.

    Na stanowisku składnik ten nie jest instalowany i audyt zwróci wynik
    „nie dotyczy". Wynik inny niż ten zasługuje na uwagę przy przeglądzie:
    oznacza, że maszyna została wyposażona w drogę zarządzania obok systemu,
    a to na stanowisku jest stanem nietypowym.

    Tam, gdzie mechanizm jest w użyciu — czyli na maszynach obsługiwanych
    zdalnie przez kontroler zarządzania sprzętem — wyłączenie usługi odbiera
    drogę ratunkową na wypadek, gdy system przestanie odpowiadać. Trzeba to
    postawić uczciwie: utrata tej drogi oznacza, że przy awarii konieczny
    będzie dostęp na miejscu albo wymuszone ponowne uruchomienie bez
    możliwości sprawdzenia, co się dzieje.

    Zwykłe zarządzanie maszyną — konsola lokalna, pulpit zdalny, zarządzanie
    poleceniami — nie ma z tą usługą nic wspólnego i działa dalej.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether the machine is served over a serial link in case of
    failure - and at a workstation it is not.

    At a station this component is not installed and the audit will return "not
    applicable". A result other than that deserves attention in a review: it means the
    machine has been given a way of being managed alongside the system, and at a station
    that is an unusual state.

    Where the mechanism is in use - that is, on machines served remotely by a hardware
    management controller - disabling the service takes away the emergency route for when
    the system stops answering. That has to be put honestly: losing that route means that
    at a failure either access in person or a forced restart will be needed, with no
    chance of checking what is going on.

    Ordinary management of the machine - the local console, Remote Desktop, management by
    commands - has nothing to do with this service and carries on working.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - remote-management
    - boot-and-firmware
    - logging-and-audit
  what_breaks:
    pl:
      - Konsola ratunkowa przez łącze szeregowe przestaje być dostępna
      - Przy awarii systemu nie da się wypisać ani zakończyć procesów tą drogą
      - Ponowne uruchomienie maszyny poleceniem z konsoli ratunkowej przestaje być możliwe
      - Konsola lokalna, pulpit zdalny i zarządzanie poleceniami działają dalej bez zmiany
    en:
      - The emergency console over the serial link stops being available
      - At a system failure processes can be neither listed nor ended by this route
      - Restarting the machine by a command from the emergency console stops being possible
      - The local console, Remote Desktop and management by commands carry on unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana zdalnie przez kontroler zarządzania sprzętem
      - Konsola ratunkowa jest częścią przyjętej procedury postępowania przy awarii
    en:
      - The machine is served remotely by a hardware management controller
      - The emergency console is part of the accepted procedure for handling failures
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'sacsvr' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'sacsvr' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'sacsvr' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/sac

notes:
  pl: |
    Na stacji roboczej składnik zwykle nie istnieje i audyt zwróci wynik
    „nie dotyczy". Punkt zachowuje jednak sens, bo maszyny wirtualne
    i komputery wyposażone w kontroler zarządzania bywają skonfigurowane
    inaczej, a reguła wykrywa taki stan.

    Wyłączenie usługi nie wyłącza samego łącza szeregowego ani przekierowania
    konsoli rozruchowej. Te ustawia się w oprogramowaniu układowym
    i w konfiguracji rozruchu — to osobna sprawa i osobna decyzja, której ta
    reguła nie obejmuje.

    Punkt nie dotyczy wiersza poleceń odzyskiwania dostępnego przy rozruchu.
    Tamten jest mechanizmem innym, uruchamianym z konsoli lokalnej,
    i podlega innym zabezpieczeniom.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    At a workstation the component usually does not exist and the audit will return "not
    applicable". The item keeps its sense all the same, since virtual machines and
    computers fitted with a management controller are sometimes configured otherwise, and
    the rule detects such a state.

    Disabling the service disables neither the serial link itself nor the redirection of
    the boot console. Those are set in the firmware and in the boot configuration - a
    separate matter and a separate decision, which this rule does not cover.

    The item does not concern the recovery command line available at boot. That is
    another mechanism, started from the local console, and subject to other safeguards.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
