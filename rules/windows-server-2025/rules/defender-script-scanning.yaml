id: win2025-defender-script-scanning

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection
  title:
    pl: Skanowanie skryptów włączone
    en: Script scanning enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza oglądanie skryptów przed ich wykonaniem. Skrypt różni
    się od programu tym, że nie musi nigdzie leżeć: może przyjść
    w pamięci, zostać złożony na miejscu i zniknąć po wykonaniu.
    Mechanizm sprawdzający pliki nie ma wtedy czego sprawdzić.

    Na serwerze punkt ten trafia w coś, co jest codziennym narzędziem
    pracy tej maszyny, a nie wyjątkiem. Stacja robocza uruchamia skrypty
    rzadko i przy okazji. Serwer uruchamia je bez przerwy: zadania
    harmonogramu, wdrożenia, kopie zapasowe, przeglądy stanu,
    zarządzanie zdalne. Skrypt jest tu podstawowym sposobem, w jaki
    cokolwiek się dzieje.

    Ma to konsekwencję, która działa w obie strony i o niej jest ten
    punkt. Napastnik, który dostał się na serwer, nie musi wnosić
    programu — wystarczy mu droga, którą i tak wszyscy tu chodzą. A że
    wszyscy nią chodzą, to jego przejście niczym się nie wyróżnia.

    Zostawiam kategorię wysoką, tak jak przy stacji roboczej, bo sama
    droga jest ta sama. Zmienia się nie waga zagrożenia, tylko liczba
    razy dziennie, kiedy się nią ktoś porusza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wykonania kodu, który nigdzie nie zostaje zapisany, na maszynie,
    gdzie wykonywanie skryptów jest zwykłym tłem.
  en: |
    The item switches on the looking at scripts before their carrying out. A script differs from a
    program in that it need lie nowhere - it can come in memory, be set together on the spot and
    vanish once carried out. A working that looks at files has then nothing to look at.

    On a server this item strikes what is that machine's everyday tool of work and no rare case. A
    workstation runs scripts seldom and by the way. A server runs them without a break - tasks of
    the set hours, rollings out, keepings of copies, lookings over of state, the ruling from afar. A
    script is here the ground way whereby anything at all comes to pass.

    That has an outcome working both ways, and this item is about it. An attacker who has come onto
    a server need bring in no program - a road everyone here walks anyway is enough for them. And
    since everyone walks it, their passing stands out in nothing.

    I leave the category high, as at the workstation, the road itself being the same. What alters is
    not the weight of the threat but the number of times in a day somebody moves along it.

    What an attacker gains while the item goes unmet - the means of carrying out code that is
    nowhere written down, on a machine whereon the running of scripts is the ordinary background.

disruption_description:
  pl: |
    Podnoszę klasę do „wymaga sprawdzenia", choć dla stacji roboczej ta
    reguła idzie hurtem. Powód jest tu jeden i jest arytmetyczny.

    Oglądanie skryptu przed wykonaniem kosztuje niewiele i przy
    pojedynczym uruchomieniu jest niemierzalne. Serwer uruchamia skrypty
    setki razy dziennie, a bywa, że setki razy w minucie — pętla
    przetwarzająca listę maszyn albo listę plików uruchamia mały skrypt
    dla każdej pozycji. Niewiele razy tysiąc przestaje być niewiele.

    Dlatego rzeczą do sprawdzenia nie jest to, czy coś przestanie
    działać, tylko czy któreś z cyklicznych zadań nie zacznie trwać
    zauważalnie dłużej. Zadanie, które kończyło się przed godziną szóstą
    rano i zaczyna kończyć się o siódmej, nie zgłasza się samo — zgłasza
    się dopiero jako brak danych w raporcie, który ktoś otwiera o ósmej.

    Blokowania jako takiego nie spodziewam się przy prawidłowym
    utrzymaniu. Jeżeli mechanizm zatrzyma skrypt własny, to jest to
    informacja warta obejrzenia, a nie powód do wyłączenia mechanizmu.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    I raise the class to "needs checking", though for a workstation this rule goes in bulk. The
    ground is here one and it is of arithmetic.

    The looking at a script before its carrying out costs little and at a single running is not to
    be measured. A server runs scripts hundreds of times in a day, and at whiles hundreds of times
    in a minute - a ring working through a list of machines or a list of files runs a small script
    for every entry. Little times a thousand stops being little.

    Therefore the thing to check is not whether anything will stop working but whether some one of
    the tasks of the set hours will not begin to last markably longer. A task that used to end
    before six in the morning and begins to end at seven reports itself not - it reports itself only
    as a want of data in a report somebody opens at eight.

    A blocking as such I look not for where the upkeep is right. If the working stops a script of
    one's own, that is a tiding worth looking at and no ground for switching the working off.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
  what_breaks:
    pl:
      - Zadania cykliczne uruchamiające skrypt dla każdej pozycji listy mogą zacząć trwać zauważalnie dłużej
      - Wydłużone zadanie nie zgłasza się samo, tylko jako brak danych w raporcie otwieranym rano
      - Zatrzymanie skryptu własnego jest informacją wartą obejrzenia, a nie powodem do wyłączenia mechanizmu
      - Przy pojedynczym uruchomieniu koszt jest niemierzalny i ujawnia się dopiero przy skali serwera
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy
    en:
      - Tasks of the set hours running a script for every entry of a list can begin to last markably longer
      - A lengthened task reports itself not, only as a want of data in a report opened in the morning
      - The stopping of a script of one's own is a tiding worth looking at and no ground for switching the working off
      - At a single running the cost is not to be measured and shows itself only at a server's scale
      - Where a guarding product of another maker rules, the audit reports the state does not apply
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zadanie cykliczne kończy się na granicy okna czasowego i nie ma zapasu na wydłużenie przebiegu
    en:
      - A task of the set hours ends at the edge of its window of time and has no spare for a lengthened running
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableScriptScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableScriptScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableScriptScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Skrypt nie musi nigdzie leżeć: może przyjść w pamięci, zostać
    złożony na miejscu i zniknąć po wykonaniu. Mechanizm sprawdzający
    pliki nie ma wtedy czego sprawdzić.

    Na serwerze skrypt jest podstawowym sposobem, w jaki cokolwiek się
    dzieje — i dlatego przejście napastnika tą drogą niczym się nie
    wyróżnia. Waga zagrożenia jest ta sama co na stacji, zmienia się
    liczba przejść dziennie.

    Klasa podniesiona z powodu arytmetycznego, nie z powodu blokowania:
    niewiele razy tysiąc przestaje być niewiele.
  en: |
    A script need lie nowhere - it can come in memory, be set together on the spot and vanish once
    carried out. A working that looks at files has then nothing to look at.

    On a server a script is the ground way whereby anything comes to pass - and therefore an
    attacker's passing by that road stands out in nothing. The weight of the threat is the same as
    at the workstation, what alters is the number of passings in a day.

    The class is raised of a ground of arithmetic and not of blocking - little times a thousand
    stops being little.
