id: fedora44-var-tmp-separate-partition

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.1.2.5.1
  section: Initial Setup > Filesystem > Configure Filesystem Partitions > Configure /var/tmp
  title:
    pl: Katalog /var/tmp jest osobną partycją
    en: Ensure separate partition exists for /var/tmp
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    /var/tmp to drugi katalog tymczasowy, otwarty do zapisu dla wszystkich,
    którego zawartość w odróżnieniu od /tmp przetrwa restart. Programy trzymają
    tam duże pliki robocze, np. obrazy budowane przez narzędzia instalacyjne.
    Bez osobnego montowania jego zapełnienie odbiera miejsce reszcie systemu,
    a opcji nodev, nosuid i noexec nie ma gdzie ustawić.

    Na domyślnej instalacji Fedory /var/tmp nie jest osobnym punktem
    montowania. Punkt należy do poziomu 2, bo zmiana wymaga przeniesienia danych.
  en: |
    /var/tmp is the second temporary directory, open for writing to everybody,
    whose contents, unlike /tmp, survive a restart. Programs keep large working
    files there, such as images built by installation tools. Without a separate
    mount, filling it takes space from the rest of the system, and the nodev,
    nosuid and noexec options have nowhere to go.

    On a default Fedora installation /var/tmp is not a separate mount point. The
    item belongs to level 2 because the change needs data to be moved.

disruption_description:
  pl: |
    Zmiana wymaga planowanego wdrożenia, bo przenosi dane systemu na nowe
    miejsce i wymaga pracy przy zatrzymanym systemie. Program nie wykonuje jej
    sam; opis mówi, co trzeba zaplanować.

    Nowy wolumin musi pomieścić największe pliki robocze, jakie powstają na
    stacji, a jego zawartość trzeba przenieść z zachowaniem uprawnień katalogu
    (1777 z bitem sticky) i etykiet SELinux.
  en: |
    The change needs a planned rollout because it moves system data to a new
    place and needs work while the system is stopped. The program does not
    perform it; the description says what has to be planned.

    The new volume has to hold the largest working files the workstation
    produces, and its contents have to be moved keeping the directory's
    permissions (1777 with the sticky bit) and SELinux labels.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Przeniesienie /var/tmp wymaga przerwy w pracy i uruchomienia stacji z nośnika ratunkowego na czas kopiowania danych
      - Zbyt mały nowy wolumin dla /var/tmp przerywa budowanie obrazów i dużych pakietów, które trzymają tam pliki robocze
    en:
      - Moving /var/tmp needs a break in work and starting the workstation from rescue media while the data is copied
      - A new volume for /var/tmp that is too small interrupts building images and large packages that keep working files there
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Dysk nie ma wolnego miejsca na osobny wolumin, a zmiana układu partycji nie była zaplanowana
    en:
      - The disk has no free space for a separate volume and no change to the partition layout has been planned
  reversibility: difficult

audit:
  shell: bash
  test_command: |
    t=/var/tmp
    if [ ! -r /proc/self/mountinfo ] || ! command -v findmnt >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if findmnt -kn --mountpoint "$t" >/dev/null 2>&1; then echo SEPARATE; else echo NOT_SEPARATE; fi
  expected: '^SEPARATE$'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/fstab.5.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.mount.html
  - https://www.freedesktop.org/software/systemd/man/latest/file-hierarchy.html

notes:
  pl: |
    Sprawdzenie uznaje punkt za spełniony, gdy /var/tmp jest osobnym punktem
    montowania, bez względu na to, czy jest to partycja, wolumin logiczny czy
    podwolumin btrfs.

    Punkt nie ma naprawy uruchamianej z programu. Wydzielenie katalogu wymaga
    przeniesienia jego zawartości na nowe miejsce, gdy nic z niej nie korzysta,
    czyli w trybie ratunkowym albo przy instalacji, i nie da się go bezpiecznie
    cofnąć jednym poleceniem.

    Na Fedorze z domyślnym btrfs najprostszą drogą jest osobny podwolumin
    zamontowany w /var/tmp wpisem w /etc/fstab. Daje on osobny punkt montowania
    i własne opcje, ale dzieli miejsce z resztą systemu, więc przed zapełnieniem
    dysku chroni dopiero przy włączonych limitach (quota) btrfs. Pełną ochronę
    daje osobna partycja lub wolumin logiczny.
  en: |
    The check considers the item met when /var/tmp is a separate mount point, whether
    it is a partition, a logical volume or a btrfs subvolume.

    The item has no remediation that the program runs. Separating the directory
    means moving its contents to the new place while nothing uses them, that is,
    in rescue mode or during installation, and it cannot be safely undone with
    one command.

    On Fedora with the default btrfs the simplest way is a separate subvolume
    mounted at /var/tmp by an entry in /etc/fstab. It gives a separate mount point and
    its own options, but shares space with the rest of the system, so it protects
    against a full disk only with btrfs quotas enabled. Full protection comes from
    a separate partition or logical volume.
