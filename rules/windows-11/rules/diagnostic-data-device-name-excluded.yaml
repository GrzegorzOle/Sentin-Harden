id: win11-diagnostic-data-device-name-excluded

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Nazwa komputera pomijana w danych diagnostycznych
    en: Computer name left out of diagnostic data
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Do danych diagnostycznych można dołączyć nazwę komputera. Bez niej maszyna
    występuje po stronie producenta pod identyfikatorem, który nie mówi nic
    o organizacji; z nią — pod nazwą, którą nadał jej administrator.

    Nazwy komputerów w organizacjach rzadko bywają przypadkowe. Zwykle niosą
    dział, lokalizację, rolę maszyny albo nazwisko użytkownika, bo po to
    powstały. Wysyłanie ich na zewnątrz oznacza wyprowadzanie fragmentu mapy
    organizacji przy okazji czynności technicznej, która z mapą nie ma nic
    wspólnego.

    Punkt nie broni przed atakiem, tylko zmniejsza to, co organizacja o sobie
    mówi na zewnątrz — i stąd kategoria niska.
  en: |
    The computer's name can be attached to the diagnostic data. Without it the
    machine appears on the vendor's side under an identifier saying nothing about
    the organisation; with it, under the name its administrator gave it.

    Computer names in organisations are rarely arbitrary. They usually carry a
    department, a location, the machine's role or a user's surname, because that
    is what they were made for. Sending them outside means letting out a fragment
    of the organisation's map during a technical operation that has nothing to do
    with maps.

    The item defends against no attack; it reduces what the organisation says
    about itself outwards - hence the low category.

disruption_description:
  pl: |
    Skutek jest wąski i dotyczy wyłącznie osób czytających raporty po stronie
    producenta.

    W zestawieniach maszyna przestaje występować pod swoją nazwą i pojawia się
    pod identyfikatorem. Dopóki komputerów jest kilka, nic to nie zmienia. Przy
    kilkuset staje się kłopotliwe: zgłoszenie „ta maszyna ma problem ze
    sterownikiem" trzeba najpierw przełożyć z identyfikatora na konkretne
    biurko, a to wymaga osobnego zestawienia, którego zwykle nikt nie prowadzi.

    Praktyczna kolejność jest taka, że ten punkt wdraża się razem
    z ograniczeniem zakresu danych diagnostycznych albo wcale. Sam z siebie ma
    znaczenie tylko tam, gdzie dane diagnostyczne nadal wychodzą.

    Dla osoby pracującej na maszynie nie zmienia się nic. Nazwa komputera
    w sieci lokalnej, w domenie i w udziałach pozostaje ta sama.
  en: |
    The effect is narrow and concerns only those reading reports on the vendor's
    side.

    In the summaries the machine stops appearing under its name and shows up
    under an identifier. As long as there are a handful of computers this changes
    nothing. At several hundred it becomes awkward: a report of "this machine has
    a driver problem" first has to be translated from an identifier to a
    particular desk, and that needs a separate list which usually nobody keeps.

    The practical order is that this item is applied together with limiting the
    scope of diagnostic data, or not at all. On its own it matters only where
    diagnostic data still leaves the machine.

    For the person working on the machine nothing changes. The computer's name on
    the local network, in the domain and on shares stays the same.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - remote-management
  what_breaks:
    pl:
      - Maszyna przestanie występować pod swoją nazwą w zestawieniach po stronie producenta
      - Powiązanie zgłoszenia z konkretnym stanowiskiem będzie wymagało osobnego zestawienia identyfikatorów
    en:
      - The machine stops appearing under its name in the vendor's summaries
      - Tying a report to a particular station requires a separate list of identifiers
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zestawienia po stronie producenta służą do bieżącego rozpoznawania maszyn po nazwie
    en:
      - The vendor's summaries are used to identify machines by name day to day
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'AllowDeviceNameInTelemetry'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'AllowDeviceNameInTelemetry'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDeviceNameInTelemetry' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Punkt jest w benchmarku na drugim poziomie i zgadza się to z naszą oceną:
    zysk jest porządkowy, a koszt spada wyłącznie na obsługę. Wart wdrożenia
    tam, gdzie nazwy komputerów niosą dział albo nazwisko; do świadomego
    odpuszczenia tam, gdzie są przypadkowe.
  en: |
    The benchmark places this item at the second level and that matches our
    assessment: the gain is one of tidiness and the cost falls entirely on
    support. Worth applying where computer names carry a department or a surname;
    a candidate for a deliberate pass where they are arbitrary.
