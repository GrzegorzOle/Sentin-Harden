id: win10-firewall-log-path-per-profile

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Osobny plik dziennika zapory dla każdego profilu sieci
    en: A file of record of its own for each profile of the network
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie kieruje zapis każdego profilu zapory do osobnego pliku
    w katalogu dzienników zapory.

    Domyślnie wszystkie trzy profile piszą do jednego pliku. Zapis jest
    wtedy kompletny, ale pozbawiony jednej informacji: nie wiadomo,
    w której sieci maszyna była, gdy dane zdarzenie nastąpiło.

    Informacja ta bywa rozstrzygająca. Odrzucony pakiet w sieci biurowej
    znaczy co innego niż ten sam pakiet w sieci hotelowej. Połączenie
    wychodzące nawiązane w sieci domowej opowiada inną historię niż to
    samo połączenie w sieci klienta.

    Drugim skutkiem, mniej oczywistym, jest tempo obracania się pliku.
    Przy jednym pliku ruch z sieci głośnej wypycha zapisy z sieci cichej,
    więc historia najciekawsza znika najszybciej. Przy plikach osobnych
    każdy profil ma własny zapas i własne tempo.

    Odnotowuję, że sprawdzenie wymienia profile pisujące gdzie indziej.
    Ścieżki porównywane są bez rozróżniania wielkości liter.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapis,
    z którego nie wynika, w której sieci maszyna wtedy była.
  en: |
    The setting sends the record of each firewall profile to a file of its own in the directory of the firewall's
    records.

    By default all three profiles write into one file. The record is then whole but wanting in one thing: there is
    no knowing in which network the machine stood when a given happening came to pass.

    That word is at times what settles the matter. A cast-aside packet in the network of an office means other
    than the same packet in that of a hotel. An outbound joining made in a home network tells another tale than
    the same joining in a customer's.

    The second upshot, the less plain, is the pace at which the file turns about. At one file the traffic of a
    loud network pushes out the records of a quiet one, so the most telling history vanishes the soonest. At files
    apart each profile has room of its own and a pace of its own.

    I set down that the check names the profiles writing elsewhere. The roads are set beside each other without
    the size of letters being told apart.

    What an attacker gains while the item goes unmet: a record from which it does not follow in which network the
    machine then stood.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana dotyczy wyłącznie miejsca zapisu. Zapora zaczyna pisać do
    nowych plików, a plik dotychczasowy zostaje na dysku nietknięty.

    Odnotowuję jedyne miejsce warte uwagi: system zbierający dzienniki,
    któremu wskazano ścieżkę pliku zapory wprost. Po zmianie będzie
    czytał plik, do którego nikt już nie pisze, i ucichnie bez zgłoszenia
    błędu. Trzeba wskazać mu trzy nowe ścieżki zamiast jednej.

    Jest to zastrzeżenie dotyczące narzędzia po stronie obsługi, a nie
    maszyny — ale bez niego punkt zamiast poprawić zapis, po prostu go
    przerywa.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: przepuszczania ruchu, reguł zapory, zapisów już
    istniejących, pracy programów, drukowania.
  en: |
    The class is "no disruption".

    The change touches solely the place of the writing. The firewall begins to write into new files, and the
    standing file stays upon the disk untouched.

    I set down the one place worth notice: a system gathering journals that was given the road to the firewall's
    file outright. After the change it will read a file nobody writes into any more, and will fall silent without
    reporting a fault. Three new roads have to be given it instead of one.

    It is a reservation touching a tool upon the keepers' side and not the machine - but without it the item, far
    from bettering the record, simply breaks it off.

    The consequence shows at once, with no restart.

    What this does not break: the letting through of traffic, the firewall's rules, records already standing, the
    work of programs, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - System zbierający dzienniki ze wskazaną ścieżką pliku zapory zacznie czytać plik, do którego nikt już nie pisze
      - Ucichnie przy tym bez zgłoszenia błędu, więc brak danych bywa zauważony późno
      - Trzeba wskazać mu trzy nowe ścieżki zamiast jednej, inaczej zmiana przerywa zapis zamiast go poprawiać
      - Plik dotychczasowy zostaje na dysku nietknięty i da się go odczytać po zmianie
      - Przepuszczanie ruchu, reguły zapory, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - A system gathering journals given the road to the firewall s file will begin to read a file nobody writes into any more
      - It will fall silent at that without reporting a fault, so the want of data is at times marked late
      - Three new roads have to be given it instead of one, else the change breaks the record off rather than bettering it
      - The standing file stays upon the disk untouched and may be read after the change
      - The letting through of traffic, the firewall s rules, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - System zbierający dzienniki czyta jedną wskazaną ścieżkę i nie da się wskazać mu trzech
    en:
      - The system gathering journals reads one road given it and three cannot be given it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Each profile is looked for writing into a file of its own under the
      # system's directory of firewall records. The comparison passes over the case
      # of letters, the road not being case sensitive, and names the profiles that
      # differ.
      $expected = @{
        Domain  = "$env:SystemRoot\System32\logfiles\firewall\domainfw.log"
        Private = "$env:SystemRoot\System32\logfiles\firewall\privatefw.log"
        Public  = "$env:SystemRoot\System32\logfiles\firewall\publicfw.log"
      }
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $wrong = @()
        foreach ($p in $profiles) {
          $want = $expected[[string]$p.Name]
          if ($null -eq $want) { continue }
          $have = [string]$p.LogFileName
          if ($have.Trim().ToUpperInvariant() -ne $want.ToUpperInvariant()) { $wrong += [string]$p.Name }
        }
        if ($wrong.Count -eq 0) { 'ALL_SEPARATE' } else { 'OTHER_IN_' + ($wrong -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_SEPARATE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -ErrorAction Stop |
      Select-Object Name, LogFileName |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain -LogFileName "$env:SystemRoot\System32\logfiles\firewall\domainfw.log"
    Set-NetFirewallProfile -Profile Private -LogFileName "$env:SystemRoot\System32\logfiles\firewall\privatefw.log"
    Set-NetFirewallProfile -Profile Public -LogFileName "$env:SystemRoot\System32\logfiles\firewall\publicfw.log"

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogFileName $p.LogFileName
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest oceniona nisko, bo sama z siebie niczego nie zapisuje
    więcej. Warto, żeby aplikacja powiedziała, że jej wartość polega na
    rozdzieleniu tego, co i tak jest zapisywane — a rozdzielenie dokłada
    informację o sieci, której w jednym pliku po prostu nie ma.

    Argument wart zachowania dotyczy tempa. Przy jednym pliku ruch
    z sieci głośnej wypycha zapisy z sieci cichej. Maszyna spędzająca
    większość czasu w sieci biurowej i godzinę w hotelowej straci
    z dziennika właśnie tę godzinę — czyli tę, o którą najczęściej się
    pyta.

    Odnotowuję zastrzeżenie wobec systemu zbierającego dzienniki, bo jest
    tu praktycznie najważniejsze. Punkt wdrożony bez poprawienia ścieżek
    po tamtej stronie nie poprawia zapisu, tylko go przerywa — a przerwa
    nie zgłasza się sama.
  en: |
    The rule is graded low, writing of itself nothing more. It is well that the application say that its worth
    lies in the parting of what is written in any case - and that the parting adds word about the network which in
    one file simply is not there.

    The argument worth keeping touches the pace. At one file the traffic of a loud network pushes out the records
    of a quiet one. A machine spending most of its time in the network of an office and an hour in that of a hotel
    will lose from the record just that hour - which is to say the one most often asked about.

    I set down the reservation touching the system that gathers journals, that being here the weightiest in
    practice. The item rolled out without the roads being put right upon that side betters not the record but
    breaks it off - and a break does not report itself.
