id: ubuntu2404-single-logging-system

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.1.1.4
  section: Logging and Auditing > System Logging > Configure systemd-journald service
  title:
    pl: Używany jest jeden system dzienników
    en: Ensure only one logging system is in use
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Dwa systemy zapisujące te same komunikaty do różnych miejsc utrudniają
    przegląd dzienników i ustawienia ochrony: łatwo zabezpieczyć jeden,
    a zapomnieć o drugim.

    Punkt wymaga ustalenia, czy dzienniki prowadzi rsyslog, czy tylko
    journald, i stosowania dalej zaleceń tylko dla tego systemu.
  en: |
    Two systems writing the same messages to different places make it
    harder to review the logs and to set up their protection: it is easy to
    protect one and forget the other.

    The item requires deciding whether rsyslog or only journald keeps the
    logs and then applying only the recommendations for that system.

disruption_description:
  pl: |
    Nikt tego nie zauważy: reguła tylko sprawdza, które usługi działają.
  en: |
    Nobody will notice: the rule only checks which services run.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
    s=""
    for u in rsyslog syslog-ng; do
      if in_use "$u"; then s="$s${s:++}$u"; fi
    done
    case "$s" in
      *+*) echo "NOT_OK:$s" ;;
      ?*) echo "OK:$s" ;;
      *) if systemctl is-active --quiet systemd-journald.service; then echo "OK:journald"; else echo "NOT_OK:no-logging-service"; fi ;;
    esac
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/systemd-journald.service.html
  - https://www.rsyslog.com/doc/

notes:
  pl: |
    Wynik OK:rsyslog oznacza, że dotyczą go punkty 6.1.3, a OK:journald, że
    punkty 6.1.2. journald działa zawsze, bo na Ubuntu rsyslog dostaje od
    niego komunikaty przez gniazdo sysloga, więc liczy się to, czy używany
    jest też rsyslog. Usługę uznaję za używaną, gdy jest włączona albo
    działa; tak samo rozstrzygają reguły z punktów 6.1.2 i 6.1.3. Wynik
    NOT_OK pojawia się, gdy używane są jednocześnie rsyslog i syslog-ng albo
    nie działa żadna usługa dzienników. Ubuntu Server ma domyślnie włączony
    rsyslog. Wybór systemu należy do administratora, więc reguła tylko
    sprawdza stan.
  en: |
    The OK:rsyslog result means that items 6.1.3 apply, and OK:journald that
    items 6.1.2 apply. journald always runs, because on Ubuntu rsyslog gets
    the messages from it through the syslog socket, so what counts is
    whether rsyslog is used too. A service counts as used when it is enabled
    or running; the rules of items 6.1.2 and 6.1.3 decide the same way. The
    NOT_OK result appears when rsyslog and syslog-ng are used at the same
    time or no logging service runs. Ubuntu Server has rsyslog enabled by
    default. The choice of the system belongs to the administrator, so the
    rule only checks the state.
