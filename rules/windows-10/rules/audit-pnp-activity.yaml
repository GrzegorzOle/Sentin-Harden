id: win10-audit-pnp-activity

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Detailed Tracking
  title:
    pl: Inspekcja podłączania urządzeń
    en: The audit of the joining of devices
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje podłączenie do maszyny urządzenia rozpoznanego przez
    system wraz z jego identyfikatorem.

    Zapis mówi o rzeczy, której żaden inny zapis w tej paczce nie widzi:
    o świecie fizycznym. Wszystkie pozostałe reguły opisują zdarzenia
    w systemie albo w sieci; ta opisuje moment, w którym ktoś stanął przy
    maszynie i coś do niej włożył.

    Wartość jest dwojaka. Pierwsza dotyczy danych wychodzących: nośnik
    podłączony poza godzinami pracy albo nośnik nieznany na maszynie
    z dostępem do danych wrażliwych jest pytaniem, na które warto znać
    odpowiedź. Druga dotyczy urządzeń udających co innego, niż są —
    klawiatury wysyłającej ciąg naciśnięć zamiast czekać na człowieka. Takie
    urządzenie zostawia w tym zapisie wpis o podłączeniu klawiatury,
    i jest to jedyny ślad, jaki po sobie zostawia.

    Odnotowuję, że zapis obejmuje wszystkie urządzenia, nie tylko nośniki.
    Stacja dokująca, przejściówka sieciowa i drukarka dają tu wpisy na
    równi z pamięcią przenośną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: fizyczny
    dostęp do maszyny i podłączenie urządzenia dowolnego rodzaju
    niezostawiające śladu.
  en: |
    The setting writes down the joining to the machine of a device the system has made out, together with that
    device's identifier.

    The record speaks of a thing no other record in this pack sees: the bodily world. Every other rule describes
    events within the system or upon the network; this describes the moment in which somebody stood at the
    machine and put something into it.

    The worth is twofold. The first touches data going out: a medium joined outside working hours, or an unknown
    medium upon a machine with reach to tender data, is a question worth knowing the answer to. The second
    touches devices that feign to be other than they are - a keyboard sending a string of presses instead of
    waiting upon a person. Such a device leaves in this record an entry about a keyboard's joining, and that is
    the one trace it leaves behind.

    I set down that the record takes in every device and not media alone. A docking station, a network adapter
    and a printer give entries here on a footing with a portable memory.

    What an attacker gains while the item goes unmet: bodily access to the machine, and the joining of a device
    of any kind, leaving no trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie blokuje żadnego urządzenia i nie zmienia sposobu ich
    rozpoznawania. Zapisuje wyłącznie fakt podłączenia.

    Liczba wpisów jest umiarkowana na stanowisku stacjonarnym. Na komputerze
    przenośnym rośnie, bo stacja dokująca, przejściówki i urządzenia
    łączone bezprzewodowo dają wpis przy każdym podłączeniu — a więc
    kilkanaście razy dziennie.

    Odnotowuję, że urządzenia wewnętrzne również bywają rozpoznawane
    ponownie po wybudzeniu maszyny. Wpisy te są powtarzalne i dotyczą tych
    samych identyfikatorów.

    Zapisywany jest wyłącznie wynik udany. Urządzenie, którego system nie
    przyjął, nie jest przedmiotem tego zapisu, a prób takich bywa wiele.

    Czego to nie psuje: podłączania urządzeń, nośników wymiennych,
    sterowników, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting blocks no device and changes not the manner of their being made out. It writes down the fact of
    a joining alone.

    The number of entries is middling upon a standing workstation. Upon a portable computer it grows, a docking
    station, adapters and devices joined without wires giving an entry at every joining - a dozen times a day or
    more.

    I set down that inner devices too are at times made out afresh after the machine wakes. Those entries repeat
    and touch the same identifiers.

    Only the successful outcome is written. A device the system did not take up is not what this record is for,
    and such attempts are at times many.

    What this does not break: the joining of devices, removable media, drivers, logging on, file shares, or
    printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - removable-media
    - drivers-and-devices
  what_breaks:
    pl:
      - Na komputerze przenośnym wpisów jest kilkanaście dziennie, bo stacja dokująca i przejściówki dają wpis przy każdym podłączeniu
      - Urządzenia wewnętrzne bywają rozpoznawane ponownie po wybudzeniu maszyny i dają wpisy powtarzalne
      - Zapisywany jest wyłącznie wynik udany, a urządzenie nieprzyjęte przez system nie jest przedmiotem tego zapisu
      - Ustawienie nie blokuje żadnego urządzenia i nie zmienia sposobu ich rozpoznawania
      - Nośniki wymienne, sterowniki, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Upon a portable computer the entries run to a dozen a day or more, a docking station and adapters giving one at every joining
      - Inner devices too are at times made out afresh after the machine wakes, giving repeating entries
      - Only the successful outcome is written, a device the system did not take up not being what this record is for
      - The setting blocks no device and changes not the manner of their being made out
      - Removable media, drivers, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest przenośna i codziennie wraca do stacji dokującej, przez co zapis będzie w większości powtórzeniem
    en:
      - The machine is portable and comes back daily to a docking station, whereby the record will be mostly a repeating
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9248-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9248-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9248-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. A device that the system did not take
    # up is not what this record is for, and such attempts are loud.
    auditpol /set /subcategory:"{0CCE9248-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9248-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-pnp-activity

notes:
  pl: |
    Reguła jest w całej paczce jedyną, która widzi świat poza systemem.
    Warto, żeby aplikacja to nazwała, bo punkt oceniany razem z resztą
    inspekcji wygląda na poboczny, a odpowiada na pytanie, którego żadne
    inne ustawienie nie stawia.

    Argument wart postawienia wprost dotyczy urządzeń udających co innego,
    niż są. Wpis o podłączeniu klawiatury jest jedynym śladem, jaki takie
    urządzenie zostawia — wszystko, co robi potem, wygląda w systemie jak
    praca człowieka siedzącego przy maszynie.

    Odnotowuję nierówność między stanowiskiem stacjonarnym a przenośnym,
    bo przesądza o użyteczności. Na maszynie wracającej codziennie do stacji
    dokującej zapis jest w większości powtórzeniem i wymaga odsiania.
    Aplikacja korzystająca z inwentaryzacji z etapu audytu może to
    powiedzieć wcześniej.
  en: |
    The rule is in the whole pack the only one that sees the world outside the system. It is well that the
    application name that, the item weighed together with the rest of the audit looking by the way, while it
    answers a question no other setting puts.

    The argument worth putting outright touches devices that feign to be other than they are. An entry about a
    keyboard's joining is the one trace such a device leaves - everything it does after looks in the system like
    the work of a person sitting at the machine.

    I set down the unevenness between a standing workstation and a portable one, it settling the usefulness.
    Upon a machine coming back daily to a docking station the record is mostly a repeating and wants sifting. An
    application drawing upon the taking of stock from the audit stage can say so beforehand.
