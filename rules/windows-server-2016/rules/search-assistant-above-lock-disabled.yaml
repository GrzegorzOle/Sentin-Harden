id: win2016-search-assistant-above-lock-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Asystent wyszukiwania przy zablokowanym ekranie wyłączony
    en: The search assistant at a locked screen switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza możliwość korzystania z asystenta wyszukiwania przy
    zablokowanym ekranie.

    Waga tego punktu bierze się z jednej właściwości, którą łatwo
    przeoczyć: ekran blokady jest granicą uwierzytelnienia. Wszystko, co
    działa przed jej przekroczeniem, działa dla kogokolwiek, kto stoi przy
    maszynie — również dla kogoś, kto nie zna żadnego hasła.

    Asystent wyszukiwania przy ekranie blokady przyjmuje polecenia
    i odpowiada. Odpowiedź buduje na podstawie tego, co o maszynie
    i o zalogowanym wie, a wie sporo: nazwy plików, nazwy urządzeń, treść
    kalendarza. Powstaje przez to ścieżka, którą można z maszyny wydobyć
    informacje, nie mając do niej dostępu.

    Rzecz druga dotyczy tego, że kanał ten jest z natury rzeczy słabo
    obserwowany. Zdarzenia przy ekranie blokady nie wyglądają w dzienniku
    jak logowania, bo nimi nie są.

    Punkt jest jedynym w tym bloku, który dotyczy granicy uwierzytelnienia
    wprost, i z tego bierze się jego kategoria.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    zadawania maszynie pytań i otrzymywania odpowiedzi bez przekroczenia
    granicy uwierzytelnienia.
  en: |
    The setting switches off the use of the search assistant at a locked screen.

    This item's weight comes from one property easy to overlook: the lock screen is the boundary of
    authentication. Everything working before its crossing works for whoever stands at the machine -
    including somebody who knows no password.

    The search assistant at the lock screen takes in commands and answers. It builds its answer on what
    it knows about the machine and the logged-on, and it knows a good deal: names of files, names of
    devices, the contents of a calendar. There arises through that a path by which word can be drawn out
    of the machine without access to it.

    The second matter is that the channel is by the nature of the thing poorly watched. Events at the
    lock screen do not look in the log like logons, not being such.

    The item is the only one in this block that concerns the boundary of authentication outright, and
    from that its category comes.

    What an attacker gains while the item goes unmet: a way of putting questions to the machine and
    getting answers without crossing the boundary of authentication.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Punkt dotyczy wyłącznie tego, co da się zrobić przed zalogowaniem.
    Asystent wyszukiwania po zalogowaniu działa dokładnie tak jak dotąd,
    więc nikt, kto się loguje, niczego nie traci.

    Na serwerze nie ma nawet tego wąskiego przypadku, bo przy ekranie
    blokady serwera nikt niczego nie wyszukuje. Zmiana jest tam widoczna
    wyłącznie w spisie ustawień.

    Nie ma znanych regresji.

    Czego to nie psuje: wyszukiwania po zalogowaniu, indeksowania, menu
    startowego, pracy aplikacji, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The item concerns solely what can be done before logging in. The search assistant after a logon works
    exactly as before, so nobody who logs in loses anything.

    On a server there is not even that narrow case, nobody searching for anything at a server's lock
    screen. The change shows there solely in the register of settings.

    There are no known regressions.

    What this does not break: searching after a logon, indexing, the start menu, the working of
    applications, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Asystent wyszukiwania przestaje odpowiadać przy zablokowanym ekranie, czyli przed zalogowaniem
      - Wyszukiwanie po zalogowaniu działa dokładnie tak jak dotąd i nikt, kto się loguje, niczego nie traci
      - Na serwerze zmiana jest widoczna wyłącznie w spisie ustawień
      - Indeksowanie, menu startowe, praca aplikacji, usługi i sieć pozostają bez zmian
    en:
      - The search assistant ceases to answer at a locked screen, which is to say before a logon
      - Searching after a logon works exactly as before and nobody who logs in loses anything
      - On a server the change shows solely in the register of settings
      - Indexing, the start menu, the working of applications, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym ktoś świadomie korzysta z asystenta przed zalogowaniem i uznano to za dopuszczalne
    en:
      - The machine is a workplace where somebody knowingly uses the assistant before a logon and it has been held admissible
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowCortanaAboveLock'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowCortanaAboveLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This concerns what can be done at a locked machine without logging in.
    # Nobody who logs in loses anything by it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCortanaAboveLock' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt otwiera blok o tym, co maszyna robi przed zalogowaniem, i jest
    w nim najważniejszy. Warto go pokazywać jako pierwszy mimo że
    w benchmarku leży w innej sekcji niż reguły o ekranie blokady — układ
    według sekcji rozbija tu rzecz, która stanowi całość.

    Argument, który spina cały blok, brzmi: ekran blokady jest granicą
    uwierzytelnienia, a wszystko, co działa przed nią, działa dla
    kogokolwiek. Postawienie tego zdania raz, na początku, oszczędza
    powtarzania go w każdej z sześciu reguł.

    Kategoria wysoka przy zerowym koszcie wdrożenia jest rzadkim
    zestawieniem i warto, żeby aplikacja takie pozycje wysuwała na
    początek listy. Jest to dokładnie ten wiersz macierzy, w którym zysk
    jest realny, a koszt żaden.

    Odnotowuję, że na serwerze wartość tego punktu jest mniejsza niż na
    stanowisku roboczym, bo przy ekranie blokady serwera zwykle nikt nie
    stoi. Warto to przyznać zamiast naciągać uzasadnienie — reguła i tak
    nic nie kosztuje.
  en: |
    The item opens the block about what the machine does before a logon and is the weightiest in it. It
    is worth showing first though in the benchmark it lies in another section than the rules about the
    lock screen - an arrangement by section breaks here a thing that makes a whole.

    The argument binding the whole block runs: the lock screen is the boundary of authentication, and
    everything working before it works for whoever. Setting that sentence down once, at the beginning,
    spares its repeating in each of the six rules.

    A high category at nil cost of rolling out is a rare pairing, and it is well that the application put
    such entries at the list's head. It is exactly that row of the matrix in which the gain is real and
    the cost none.

    Worth noting that on a server this item's value is less than at a workplace, nobody as a rule standing
    at a server's lock screen. That is worth owning rather than straining the warrant - the rule costs
    nothing anyway.
