id: win2016-bitlocker-removable-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Odczyt chronionego nośnika wymiennego w starszych wersjach systemu wyłączony
    en: Reading a protected removable medium on earlier system versions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza dokładanie do zaszyfrowanego nośnika wymiennego
    obszaru pozwalającego odczytać go w starszych wersjach systemu.

    Mechanizm jest ten sam co przy dyskach stałych, ale tutaj był
    pomyślany naprawdę. Nośnik wymienny ma jeździć — i mechanizm ten
    istnieje po to, żeby jeździł do maszyn, które szyfrowania nie znają.

    Cena jest jednak niezmieniona. Obszar dokładany do nośnika zapisany
    jest starszym formatem i nie jest chroniony; odczyt tą drogą opiera się
    na haśle, a więc na sposobie, który pozostałe reguły tego zestawu
    właśnie zamykają.

    Rzecz, która przesądza, brzmi tak: obecność tego obszaru czyni
    zaszyfrowany nośnik przedmiotem, który da się otworzyć w dowolnej
    maszynie po podaniu hasła. Sens szyfrowania nośnika przenośnego sprowadza
    się wtedy do siły tego hasła — a hasło do nośnika bywa zapisane blisko
    niego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    otwarcia znalezionego nośnika w dowolnej maszynie, bez uprawnień do
    niczego, wyłącznie hasłem.
  en: |
    The setting switches off the adding to an encrypted removable medium of an area letting it be
    read on earlier system versions.

    The mechanism is the same as at the fixed drives, but here it was truly meant. A removable
    medium is to travel - and that mechanism exists so that it travels to machines that know
    nothing of encryption.

    The price, though, is unchanged. The area added to the medium is written in an older format and
    is not guarded; reading by that road rests on a password, which is to say on the very means the
    other rules of this set are shutting.

    The thing that decides runs thus: the presence of that area makes an encrypted medium an object
    openable in any machine once a password is given. The sense of encrypting a carried medium then
    comes down to that password's strength - and a password to a medium is at times written down
    near it.

    What an attacker gains while the item goes unmet: the chance to open a found medium in any
    machine, with rights to nothing, by a password alone.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie jest tu realne, w odróżnieniu
    od odpowiednika przy dyskach stałych.

    Nośniki wymienne jeżdżą — to jest ich przeznaczenie. Pytanie brzmi,
    dokąd. Jeżeli wyłącznie między maszynami z systemem bieżącym, zmiana
    nie zmienia niczego. Jeżeli do maszyn starszych, do urządzeń obcych albo
    do ludzi spoza organizacji, zabiera drogę odczytu, z której się
    korzysta.

    Objaw jest jednoznaczny i natychmiastowy: nośnik włożony do takiej
    maszyny nie pokaże niczego. Nie ma programu odczytującego, nie ma pytania
    o hasło, jest urządzenie zgłaszane jako nieznane.

    Warto zauważyć, że reguła nie odbiera możliwości przekazania danych.
    Odbiera jedną konkretną drogę — tę, w której nośnik sam niesie ze sobą
    sposób otwarcia. Przekazanie plików inną drogą pozostaje możliwe
    i zwykle jest lepsze, bo zostawia ślad.

    Zmiana dotyczy nośników szyfrowanych po jej wprowadzeniu. Nośnik, który
    dostał ten obszar wcześniej, nosi go dalej i nadal otwiera się starszą
    drogą — w tym u kogoś, kto go znajdzie.

    Czego to nie psuje: odczytu na maszynach z systemem bieżącym, zapisu,
    pracy systemu, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review is here a real one, unlike at the counterpart among
    the fixed drives.

    Removable media travel - that is what they are for. The question is where to. If solely between
    machines with a current system, the change changes nothing. If to older machines, to foreign
    devices or to people outside the organisation, it takes away a road of reading that is in use.

    The symptom is unambiguous and immediate: a medium put into such a machine will show nothing.
    There is no reading program, no question about a password, there is a device reported as
    unknown.

    Worth noticing that the rule does not take away the possibility of handing data over. It takes
    away one particular road - the one in which the medium itself carries the means of opening.
    Handing files over by another road stays possible and is as a rule better, leaving a trace.

    The change concerns media encrypted after it is brought in. A medium that got that area earlier
    carries it on and still opens by the older road - including for whoever finds it.

    What this does not break: reading on machines with a current system, writing, the system's
    working, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nośnik włożony do maszyny ze starszym systemem nie pokaże niczego i zgłosi się jako urządzenie nieznane
      - Przekazywanie danych na nośniku ludziom spoza organizacji przestaje działać tą drogą
      - Nośnik, który dostał ten obszar przed zmianą, nosi go dalej i nadal otwiera się starszą drogą
      - Odczyt na maszynach z systemem bieżącym, zapis i praca systemu pozostają bez zmian
    en:
      - A medium put into a machine with an older system will show nothing and will report itself as an unknown device
      - Handing data over on a medium to people outside the organisation ceases to work by this road
      - A medium that got that area before the change carries it on and still opens by the older road
      - Reading on machines with a current system, writing and the system's working stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki służą do przekazywania danych ludziom spoza organizacji i nie ma dla tego innej ustalonej drogi
      - Nośniki wożone są do urządzeń nieznających bieżącego szyfrowania, a odczyt tam jest wymagany
    en:
      - The media serve to hand data over to people outside the organisation and there is no other settled road for that
      - The media are carried to devices knowing nothing of the current encryption and reading there is required
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the
      # word <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '<none>'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVDiscoveryVolumeType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest trzeci w bloku i to przy nim najlepiej widać, czym ten blok
    różni się od poprzedniego. Przy dysku stałym ta sama reguła była
    formalnością, bo dysk stały nigdzie nie jeździ. Tutaj dotyka rzeczy,
    która jest przeznaczeniem nośnika.

    Dlatego właśnie przy tym punkcie zapisane odpuszczenie bywa wynikiem
    sensownym — pod warunkiem, że towarzyszy mu odpowiedź na pytanie, jak
    te dane mają być przekazywane zamiast tego. Odpuszczenie bez tej
    odpowiedzi jest odłożeniem sprawy, nie decyzją.

    Warto pokazywać ten punkt razem z regułą o odblokowywaniu hasłem. Obie
    dotyczą tej samej słabości widzianej z dwóch stron: jedna zamyka hasło
    jako sposób odblokowania, druga zamyka drogę, która hasło przywraca
    tylnymi drzwiami. Wdrożenie jednej bez drugiej zostawia całość otwartą.

    Odnotowuję, że wartość jest tu tekstem zapisującym słowo „brak", tak
    samo jak przy dyskach stałych, i tak samo trzeba odróżnić brak wpisu od
    wpisu mówiącego o braku.
  en: |
    The item is the third in the block and it is at this one that it is best seen how this block
    differs from the one before. At the fixed drive the same rule was a formality, a fixed drive
    travelling nowhere. Here it touches the very thing a medium is for.

    For that reason a recorded letting go is at this item at times a sensible outcome - on condition
    that an answer goes with it to the question how those data are to be handed over instead. A
    letting go without that answer is a putting off of the matter, not a decision.

    The item is worth showing together with the rule about unlocking by a password. Both concern the
    same weakness seen from two sides: one shuts the password as a way of unlocking, the other shuts
    the road that brings the password back by a rear door. Rolling one out without the other leaves
    the whole open.

    Worth noting that the value is here text writing the word "none", as at the fixed drives, and
    that a want of an entry has as there to be told from an entry speaking of a want.
