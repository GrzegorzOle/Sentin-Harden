id: win2025-automatic-restart-sign-on-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Logon Options
  title:
    pl: Automatyczne logowanie po restarcie wywołanym aktualizacją wyłączone
    en: Automatic sign-in after an update-driven restart turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza mechanizm, który po restarcie wywołanym aktualizacją sam
    loguje ostatnio zalogowanego użytkownika i odtwarza jego sesję, bez
    podania hasła.

    Kategoria wysoka i chcę powiedzieć dokładnie, na czym polega problem,
    bo mechanizm wygląda na uprzejmość systemu wobec człowieka. Żeby
    zalogować kogoś bez hasła, system musi przed restartem zapisać materiał
    pozwalający tę sesję odtworzyć, przechować go przez restart i użyć po
    starcie. Poświadczenia sesji zostają więc zapisane na dysku maszyny
    i przetrwają moment, w którym maszyna jest wyłączona.

    To jest właściwa treść punktu. Ochrona sesji opiera się na tym, że po
    wyłączeniu maszyny klucze znikają z pamięci; tutaj są utrwalane
    z rozmysłem, po to, by przeżyć ponowne uruchomienie.

    Na serwerze dochodzi skutek drugi, i to on decyduje o kategorii.
    Sesja, która wraca sama, to sesja administratora — bo na serwerze to
    zwykle administrator jest ostatnim zalogowanym. Maszyna po restarcie
    sama doprowadza się do stanu, w którym istnieje aktywna, odblokowana
    sesja uprzywilejowana, przy której nikt nie stoi. Do tego wystarczy
    dostęp do konsoli, wirtualnej albo fizycznej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    administratora czekającą przy konsoli po restarcie, bez potrzeby znania
    hasła — oraz materiał poświadczający zapisany na dysku.
  en: |
    The item turns off the mechanism which, after a restart driven by an
    update, signs the last signed-in user in by itself and restores their
    session without a password being given.

    The category is high, and I want to say precisely where the problem lies,
    because the mechanism looks like the system doing a person a courtesy. To
    sign somebody in with no password, the system has to write, before the
    restart, material allowing that session to be restored, keep it across
    the restart and use it after start-up. Session credentials are therefore
    written to the machine's disk and survive the moment the machine is off.

    That is the real substance of the item. Protection of a session rests on
    the keys vanishing from memory once the machine is off; here they are
    deliberately made to persist, precisely so as to survive a restart.

    On a server a second effect follows, and it is what settles the category.
    The session that comes back by itself is an administrator's session -
    because on a server it is usually an administrator who was last signed
    in. After a restart the machine brings itself into a state where an
    active, unlocked privileged session exists with nobody standing at it.
    Access to the console, virtual or physical, is all that is needed.

    What an attacker gains while the item goes unmet: an administrator's
    session waiting at the console after a restart, with no need to know the
    password - and credential material written to the disk.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzić trzeba jedną rzecz, za to
    istotną: co na tej maszynie ma ruszyć po restarcie i czy potrafi ruszyć
    bez zalogowanej sesji.

    Po zmianie serwer po restarcie zatrzyma się na ekranie logowania.
    Usługi systemowe wstają normalnie — to jest ich cała istota i one nie
    potrzebują niczyjej sesji. Problem dotyczy rzeczy, które ktoś kiedyś
    uruchomił w sesji użytkownika, licząc, że wrócą same: zadania
    uruchamiane przy zalogowaniu, programy w autostarcie profilu, narzędzia
    obsługowe trzymane w sesji administratora. Takie rzeczy nie wrócą do
    czasu, aż ktoś się zaloguje.

    Mówię o tym wprost, bo to jest typowy dług konfiguracyjny: coś działa na
    serwerze w sesji, chociaż powinno być usługą. Ten punkt ten dług
    ujawnia. Właściwą odpowiedzią jest przeniesienie takiej pracy do usługi
    albo do zadania uruchamianego niezależnie od logowania, a nie
    pozostawienie mechanizmu, który odtwarza sesję administratora bez hasła.

    Skutek drugi jest wygodowy: ktoś, kto dotąd restartował serwer zdalnie
    i wracał do gotowego pulpitu, będzie musiał zalogować się ponownie.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and one thing needs checking, but an
    important one: what on this machine is meant to start after a restart,
    and whether it can start without a signed-in session.

    After the change the server will stop at the sign-in screen after a
    restart. System services come up normally - that is their whole point and
    they need nobody's session. The problem concerns things somebody once
    started inside a user's session, counting on them coming back by
    themselves: tasks run at sign-in, programs in a profile's start-up,
    management tools kept inside an administrator's session. Such things will
    not come back until somebody signs in.

    I say this plainly, because it is a typical configuration debt:
    something runs on a server inside a session although it ought to be a
    service. This item brings that debt into the open. The right answer is to
    move such work into a service, or into a task run independently of
    signing in, rather than to leave in place a mechanism that restores an
    administrator's session without a password.

    The second effect is one of convenience: whoever used to restart the
    server remotely and come back to a ready desktop will have to sign in
    again.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
    - updates-and-servicing
  what_breaks:
    pl:
      - Serwer po restarcie zatrzyma się na ekranie logowania zamiast odtworzyć sesję ostatnio zalogowanej osoby
      - Zadania uruchamiane przy zalogowaniu, programy w autostarcie profilu i narzędzia trzymane w sesji nie wrócą, aż ktoś się zaloguje
      - Usługi systemowe wstają normalnie — nie potrzebują niczyjej sesji i ten punkt ich nie dotyczy
      - Kto restartował serwer zdalnie i wracał do gotowego pulpitu, będzie musiał zalogować się ponownie
    en:
      - After a restart the server stops at the sign-in screen instead of restoring the last person's session
      - Tasks run at sign-in, programs in a profile's start-up and tools kept inside a session will not come back until somebody signs in
      - System services come up normally - they need nobody's session and this item does not touch them
      - Whoever restarted the server remotely and came back to a ready desktop will have to sign in again
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa praca uruchamiana w sesji użytkownika, której nie da się na razie przenieść do usługi ani do zadania niezależnego od logowania
    en:
      - Work on the machine runs inside a user session and cannot yet be moved into a service or a task independent of signing in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'DisableAutomaticRestartSignOn'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'DisableAutomaticRestartSignOn'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Signing somebody in with no password means credential material is written
    # to disk to survive the restart, and on a server the session that comes back
    # is an administrator's - unlocked, with nobody standing at it. Check first
    # what is meant to start after a restart from inside a user session.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableAutomaticRestartSignOn' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/winlogon-automatic-restart-sign-on-arso

notes:
  pl: |
    Mechanizm wygląda na uprzejmość systemu, a polega na utrwaleniu
    poświadczeń: żeby zalogować kogoś bez hasła, system zapisuje przed
    restartem materiał pozwalający odtworzyć sesję i przechowuje go przez
    restart. Ochrona sesji opiera się na tym, że po wyłączeniu maszyny
    klucze znikają z pamięci — tutaj są utrwalane z rozmysłem.

    Na serwerze sesja, która wraca sama, to sesja administratora. Maszyna po
    restarcie sama doprowadza się do stanu z aktywną, odblokowaną sesją
    uprzywilejowaną, przy której nikt nie stoi.

    Reguła ujawnia typowy dług konfiguracyjny: pracę uruchamianą w sesji
    zamiast w usłudze. Właściwą odpowiedzią jest przeniesienie jej do
    usługi, a nie pozostawienie mechanizmu odtwarzającego sesję bez hasła.
  en: |
    The mechanism looks like a courtesy of the system, yet it rests on
    persisting credentials: to sign somebody in without a password, the
    system writes material before the restart that lets the session be
    restored and keeps it across the restart. Protection of a session rests
    on the keys vanishing from memory once the machine is off - here they are
    deliberately made to persist.

    On a server, the session that comes back by itself is an administrator's.
    After a restart the machine brings itself into a state with an active,
    unlocked privileged session and nobody standing at it.

    The rule brings a typical configuration debt into the open: work run
    inside a session instead of inside a service. The right answer is to move
    it into a service, not to leave a mechanism that restores a session
    without a password.
