id: win11-synchronize-directory-data-none

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Synchronizowanie danych usługi katalogowej nieprzyznane nikomu
    en: Synchronising directory service data granted to no one
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Uprawnienie pozwala odczytać całą zawartość usługi katalogowej z pominięciem
    uprawnień ustawionych na poszczególnych obiektach. Powstało dla mechanizmów
    replikujących katalog między systemami, które muszą widzieć wszystko, bo
    inaczej kopia byłaby niepełna.

    „Wszystko" obejmuje również atrybuty przechowujące materiał uwierzytelniający
    kont. Konto z tym uprawnieniem na kontrolerze domeny nie musi więc niczego
    łamać ani nigdzie się włamywać — odczytuje poświadczenia wszystkich kont
    naraz, korzystając z funkcji przewidzianej w projekcie. To jedna z najwyżej
    ocenianych zdolności w całym systemie i na stacji roboczej nie ma prawa
    znaleźć się na żadnej liście.
  en: |
    The right allows the entire contents of the directory service to be read,
    bypassing the permissions set on individual objects. It exists for the
    mechanisms that replicate a directory between systems, which must see
    everything or the copy would be incomplete.

    "Everything" includes the attributes holding accounts' authentication
    material. An account with this right on a domain controller therefore needs to
    break nothing and break into nowhere - it reads every account's credentials at
    once, using a function provided by design. This is one of the most highly
    rated capabilities in the whole system, and on a workstation it has no
    business appearing on any list.

disruption_description:
  pl: |
    Nic. Uprawnienie działa wyłącznie tam, gdzie jest usługa katalogowa, czyli na
    kontrolerze domeny. Na stacji roboczej nie ma czego synchronizować i lista
    jest pusta z definicji.

    Punkt sprowadza się do sprawdzenia, czy ktoś tej listy nie wypełnił. Na tej
    maszynie wpis niczego nie otwiera, ale jest sygnałem, że maszyna była
    konfigurowana z myślą o innej roli albo że ktoś kopiował ustawienia
    z kontrolera domeny bez przeglądania, co kopiuje.
  en: |
    Nothing. The right works only where a directory service exists, that is, on a
    domain controller. On a workstation there is nothing to synchronise and the
    list is empty by definition.

    The item comes down to checking that nobody has filled that list. On this
    machine an entry opens nothing, but it signals that the machine was configured
    with another role in mind, or that somebody copied settings from a domain
    controller without reviewing what they were copying.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Na stacji roboczej nie przestaje działać nic, bo uprawnienie nie ma tu zastosowania
      - Konta dopisane do listy ręcznie stracą to uprawnienie po zmianie
    en:
      - On a workstation nothing stops working, because the right has no application here
      - Accounts added to the list by hand lose the right after the change
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę kontrolera domeny albo jest do tej roli przygotowywana
    en:
      - The machine acts as a domain controller or is being prepared for that role
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSyncAgentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSyncAgentPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSyncAgentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/synchronize-directory-service-data

notes:
  pl: |
    Kategoria krytyczna przy zerowej uciążliwości na maszynie, na której
    uprawnienie nic nie robi, wymaga wyjaśnienia. Ocena opisuje wagę zdolności,
    a nie wagę znaleziska na tej konkretnej maszynie — i taka ma być, bo ta sama
    reguła trafi do paczki serwerowej, gdzie maszyna może zostać kontrolerem
    domeny.

    Wraz z uprawnieniem do włączania delegowania tworzy to parę punktów, które
    na stacji roboczej są wyłącznie sprawdzeniem. Oba przechodzą bez działania,
    oba dają sygnał, gdy nie przechodzą, i oba wymagają w paczce serwerowej
    własnej oceny zamiast przeniesienia.
  en: |
    A critical category paired with zero disruption on a machine where the right
    does nothing needs explaining. The assessment describes the weight of the
    capability, not the weight of the finding on this particular machine - and so
    it should, because the same rule will go into a server pack, where a machine
    may become a domain controller.

    Together with the right to enable delegation this forms a pair of items that
    on a workstation are checks and nothing more. Both pass without action, both
    give a signal when they do not, and both need their own assessment in a server
    pack rather than being carried over.
