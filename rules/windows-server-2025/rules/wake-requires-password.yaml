id: win2025-wake-requires-password

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Power Management > Sleep Settings
  title:
    pl: Wybudzenie ze snu wymaga podania hasła
    en: Waking from sleep requires a password
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga podania hasła przy wybudzeniu maszyny ze snu.

    Kategoria wysoka, bo bez tego ustawienia uśpienie przestaje być
    zamknięciem sesji, a staje się jej wstrzymaniem. Maszyna wybudzona przez
    naciśnięcie klawisza wraca prosto do pulpitu, ze wszystkim, co było
    otwarte, i z wszystkimi uprawnieniami osoby, która ją zostawiła.

    Na serwerze rzecz wymaga postawienia inaczej niż na stanowisku i chcę to
    nazwać wprost. Serwery zwykle nie zasypiają, więc łatwo uznać punkt za
    bezprzedmiotowy. Problem w tym, że „zwykle" nie jest stanem
    sprawdzonym: maszyna postawiona z obrazu stanowiskowego, serwer w małej
    firmie stojący pod biurkiem albo host wirtualizacji z domyślnym planem
    zasilania potrafią zasypiać, a nikt tego nie zauważa dopóty, dopóki
    wszystko działa. Reguła ma sens dokładnie dlatego, że nie opiera się na
    założeniu, tylko na ustawieniu.

    Sesja, do której wraca się bez hasła, to na serwerze sesja
    administratora. Warunkiem jest dostęp do klawiatury — fizycznej albo
    konsoli maszyny wirtualnej, dostępnej z panelu wirtualizacji dla
    szerszego grona niż sam serwer.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową,
    odblokowaną sesję administratora, otwieraną naciśnięciem klawisza.
  en: |
    The item requires a password when the machine is woken from sleep.

    The category is high, because without this setting going to sleep stops
    being the closing of a session and becomes its suspension. A machine
    woken by a keypress comes straight back to the desktop, with everything
    that was open and with all the privileges of whoever left it.

    On a server the matter has to be put differently than on a workstation,
    and I want to name that plainly. Servers usually do not sleep, so it is
    easy to judge the item moot. The trouble is that "usually" is not a
    verified state: a machine built from a workstation image, a server under
    a desk in a small firm, or a virtualisation host on a default power plan
    can all go to sleep, and nobody notices for as long as everything works.
    The rule makes sense precisely because it rests on a setting rather than
    on an assumption.

    The session one returns to without a password is, on a server, an
    administrator's. What it takes is access to a keyboard - physical, or
    the virtual machine's console, available from the virtualisation panel to
    a wider circle than the server itself.

    What an attacker gains while the item goes unmet: a ready, unlocked
    administrator's session, opened with a keypress.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie widzę tu niczego do
    stracenia, bo maszyna, która nie zasypia, nigdy tego ustawienia nie
    użyje.

    Skutek, gdyby zasypiała: po wybudzeniu pojawi się ekran logowania
    zamiast pulpitu. To jest jedyna różnica i jest to różnica pożądana.
    Praca zostaje — otwarte programy, otwarte pliki, otwarte sesje zdalne
    są dokładnie tam, gdzie były. Uśpienie nie jest wylogowaniem i ten punkt
    tego nie zmienia.

    Czego to nie psuje: pracy zdalnej. Sesja zdalna nie przechodzi przez
    ekran wybudzenia maszyny, więc ludzie łączący się z tym serwerem nie
    zobaczą żadnej zmiany. Nie zmienia też niczego w zadaniach
    uruchamianych w tle ani w usługach.

    Uwaga techniczna, którą trzeba znać przy ręcznym sprawdzaniu: to jedno
    ustawienie zapisane w dwóch wariantach zasilania — z sieci i z baterii.
    Sprawozdanie podaje słabszy z nich, bo maszyna jest chroniona tylko tak,
    jak chroni ją wariant gorszy. Na serwerze wariant bateryjny wygląda na
    bezprzedmiotowy, ale istnieje i bywa ustawiony inaczej, a zasilacz
    awaryjny potrafi przełączyć maszynę właśnie na niego.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption" and on a server I see nothing to lose here,
    because a machine that does not sleep will never use this setting.

    The effect, were it to sleep: after waking, a sign-in screen appears
    instead of the desktop. That is the only difference and it is a wanted
    one. The work stays - open programs, open files, open remote sessions are
    exactly where they were. Sleeping is not signing out and this item does
    not change that.

    What this does not break: remote work. A remote session does not pass
    through the machine's wake screen, so people connecting to this server
    will see no change at all. Nor does it change anything in background
    tasks or in services.

    A technical point to know when checking by hand: this is one setting
    written in two power variants - on mains and on battery. The report gives
    the weaker of them, because the machine is protected only as far as the
    worse variant protects it. On a server the battery variant looks moot,
    but it exists and is sometimes set differently, and an uninterruptible
    power supply can switch the machine over to exactly that one.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Po wybudzeniu maszyny ze snu pojawi się ekran logowania zamiast pulpitu
      - Praca zostaje — otwarte programy, pliki i sesje zdalne są tam, gdzie były, bo uśpienie nie jest wylogowaniem
      - Sesja zdalna nie przechodzi przez ekran wybudzenia, więc łączący się z tym serwerem nie zobaczą żadnej zmiany
      - To jedno ustawienie w dwóch wariantach zasilania, a zasilacz awaryjny potrafi przełączyć maszynę na wariant bateryjny
    en:
      - After the machine wakes from sleep, a sign-in screen appears instead of the desktop
      - The work stays - open programs, files and remote sessions are where they were, because sleeping is not signing out
      - A remote session does not pass through the wake screen, so people connecting to this server see no change
      - This is one setting in two power variants, and an uninterruptible power supply can switch the machine to the battery one
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna stoi w pomieszczeniu zamkniętym i jest wybudzana w ramach procedury, w której podanie hasła nie jest możliwe
    en:
      - The machine stands in a locked room and is woken as part of a procedure where giving a password is not possible
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One setting in two power variants. The report gives the weaker of them,
      # because the machine is protected only as far as the worse variant
      # protects it - an uninterruptible supply can switch it over by itself.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $ac = $item.ACSettingIndex
        $dc = $item.DCSettingIndex
        if ($null -eq $ac -or $null -eq $dc) { 'MISSING' }
        elseif ([int]$ac -eq 1 -and [int]$dc -eq 1) { 'REQUIRED' }
        else { 'AC=' + $ac + ' DC=' + $dc }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      ac          = $item.ACSettingIndex
      ac_existed  = ($null -ne $item.ACSettingIndex)
      dc          = $item.DCSettingIndex
      dc_existed  = ($null -ne $item.DCSettingIndex)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Without this, sleeping stops being the closing of a session and becomes
    # its suspension: a keypress brings back the desktop of whoever left it,
    # which on a server is an administrator. Both power variants are written,
    # because the machine is only as protected as the worse of them.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ACSettingIndex' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DCSettingIndex' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.ac_existed) {
      Set-ItemProperty -Path $b.path -Name 'ACSettingIndex' -Value $b.ac -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ACSettingIndex' -ErrorAction SilentlyContinue
    }
    if ($b.dc_existed) {
      Set-ItemProperty -Path $b.path -Name 'DCSettingIndex' -Value $b.dc -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DCSettingIndex' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/customize/power-settings/sleep-settings

notes:
  pl: |
    Bez tego ustawienia uśpienie przestaje być zamknięciem sesji, a staje się
    jej wstrzymaniem: maszyna wraca prosto do pulpitu, z wszystkimi
    uprawnieniami osoby, która ją zostawiła.

    Zastrzeżenie serwerowe: łatwo uznać punkt za bezprzedmiotowy, bo serwery
    zwykle nie zasypiają. „Zwykle" nie jest jednak stanem sprawdzonym —
    maszyna postawiona z obrazu stanowiskowego albo host z domyślnym planem
    zasilania potrafi zasypiać i nikt tego nie zauważa. Reguła opiera się na
    ustawieniu, nie na założeniu.

    Jedno ustawienie zapisane w dwóch wariantach zasilania. Sprawozdanie
    podaje słabszy z nich. Wariant bateryjny na serwerze wygląda na
    bezprzedmiotowy, ale zasilacz awaryjny potrafi przełączyć maszynę
    właśnie na niego.
  en: |
    Without this setting, sleeping stops being the closing of a session and
    becomes its suspension: the machine comes straight back to the desktop,
    with all the privileges of whoever left it.

    A server caveat: it is easy to judge the item moot, because servers
    usually do not sleep. But "usually" is not a verified state - a machine
    built from a workstation image or a host on a default power plan can
    sleep and nobody notices. The rule rests on a setting, not an assumption.

    One setting written in two power variants. The report gives the weaker of
    them. On a server the battery variant looks moot, but an uninterruptible
    power supply can switch the machine over to exactly that one.
