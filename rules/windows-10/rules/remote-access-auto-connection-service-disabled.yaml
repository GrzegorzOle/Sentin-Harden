id: win10-remote-access-auto-connection-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Samoczynne zestawianie połączenia zdalnego wyłączone
    en: The setting up of a joining from afar of itself switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę zestawiającą połączenie zdalne samoczynnie,
    gdy program próbuje sięgnąć po zasób niedostępny w sieci bieżącej.

    Mechanizm ten miał ułatwiać pracę: program pyta o adres, adres jest
    nieosiągalny, system sam nawiązuje połączenie zdalne i próbuje
    ponownie. Użytkownik niczego nie robi, a połączenie po prostu jest.

    Zagrożenie leży w tym, kto tę czynność wywołuje. Wystarczy program
    sięgający po adres, którego w bieżącej sieci nie ma — a takim
    programem może być cokolwiek, łącznie z rzeczą uruchomioną bez wiedzy
    użytkownika. Decyzja o nawiązaniu połączenia zdalnego zapada bez
    człowieka.

    Skutkiem ubocznym jest to, że maszyna bywa podłączana do sieci,
    w której użytkownik nie zamierzał być. Połączenie powstaje, żyje
    i przepuszcza ruch, a jedynym śladem jest ikona, na którą nikt nie
    patrzy.

    Odnotowuję, że mechanizm ten pochodzi z czasów połączeń wdzwanianych
    i dziś bywa wykorzystywany przez klienty sieci wirtualnych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nawiązanie
    połączenia zdalnego wywołane zwykłym odwołaniem do adresu.
  en: |
    The setting switches off the service that sets up a joining from afar of itself, when a program tries to reach
    for a thing not to be had in the standing network.

    That mechanism was to make work easier: the program asks after an address, the address is out of reach, the
    system makes a joining from afar itself and tries again. The user does nothing, and the joining simply is.

    The danger lies in who calls that doing forth. A program reaching for an address not in the standing network
    suffices - and such a program may be anything at all, a thing set going without the user's knowledge among
    them. The decision to make a joining from afar is taken with no person in it.

    The upshot beside is that the machine is at times joined to a network the user meant not to be in. The joining
    comes to be, lives and lets traffic through, and the one trace is a mark nobody looks at.

    I set down that the mechanism comes out of the days of joinings made by dialling and is today at times used by
    clients of networks made by craft.

    What an attacker gains while the item goes unmet: the making of a joining from afar called forth by an
    ordinary reaching after an address.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś korzysta z połączenia zestawianego na żądanie.

    Miejscem wartym uwagi są klienty sieci wirtualnych ustawione tak,
    żeby zestawiać tunel przy próbie sięgnięcia po zasób firmowy. Jest
    to wygodne dla osób pracujących poza biurem i po zmianie tunel
    trzeba będzie zestawiać ręcznie.

    Miejscem drugim są starsze rozwiązania z połączeniem wdzwanianym,
    spotykane w urządzeniach przemysłowych i w zapasowych drogach
    łączności. Zdarzają się rzadko, ale wtedy są jedyną drogą.

    Odnotowuję, że na stanowisku bez połączeń zdalnych zmiana nie robi
    nic. Usługa jest uruchamiana na żądanie i bez takiego połączenia nie
    ma czego zestawiać.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: ręcznego zestawiania połączeń zdalnych, zwykłej
    łączności sieciowej, dostępu do internetu, udziałów, logowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody uses a joining set up upon
    demand.

    The place worth notice is clients of networks made by craft set so as to raise a tunnel at a reaching after a
    thing of the firm. That is handy for people working outside the office, and after the change the tunnel will
    have to be set up by hand.

    The second place is older answers with a joining made by dialling, met with in things of industry and in roads
    of joining kept in reserve. They are seldom, but where they are they are the one road.

    I set down that upon a station without joinings from afar the change does nothing. The service is set going
    upon demand and without such a joining there is nothing to set up.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the setting up of joinings from afar by hand, the ordinary joining to the network,
    the reach of the internet, of shares, or logging on.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Klient sieci wirtualnej zestawiający tunel przy próbie sięgnięcia po zasób firmowy przestanie robić to sam
      - Osoby pracujące poza biurem będą musiały zestawiać tunel ręcznie przed sięgnięciem po zasób
      - Starsze rozwiązania z połączeniem wdzwanianym w urządzeniach przemysłowych stracą drogę zapasową
      - Na stanowisku bez połączeń zdalnych zmiana nie robi nic, bo nie ma czego zestawiać
      - Ręczne zestawianie połączeń zdalnych, łączność sieciowa, dostęp do internetu, udziały i logowanie pozostają bez zmian
    en:
      - A client of a network made by craft that raises a tunnel at a reaching after a thing of the firm will cease to do so itself
      - People working outside the office will have to set the tunnel up by hand before reaching after a thing
      - Older answers with a joining made by dialling in things of industry will lose a road kept in reserve
      - Upon a station without joinings from afar the change does nothing, there being nothing to set up
      - The setting up of joinings from afar by hand, the joining to the network, the reach of the internet, of shares and logging on stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Praca poza biurem opiera się na tunelu zestawianym samoczynnie przy sięgnięciu po zasób firmowy
      - Urządzenie przemysłowe korzysta z połączenia wdzwanianego jako drogi zapasowej
    en:
      - Work outside the office rests upon a tunnel raised of itself at a reaching after a thing of the firm
      - A thing of industry uses a joining made by dialling as a road kept in reserve
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RasAuto' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RasAuto' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RasAuto' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/ras/manage-remote-access

notes:
  pl: |
    Reguła dotyczy mechanizmu, o którym mało kto pamięta, i warto, żeby
    aplikacja postawiła jego istotę w jednym zdaniu: decyzja o nawiązaniu
    połączenia zdalnego zapada bez człowieka, a wywołać ją może dowolny
    program sięgający po nieosiągalny adres.

    Argument wart zachowania dotyczy tego, że połączenie takie żyje.
    Powstaje, przepuszcza ruch i trwa, a jedynym śladem jest ikona,
    na którą nikt nie patrzy. Maszyna bywa więc podłączona do sieci,
    w której użytkownik nie zamierzał być.

    Odnotowuję zastrzeżenie wobec klientów sieci wirtualnych, bo to
    dzisiaj najczęstsze zastosowanie tego mechanizmu. Punkt nie odbiera
    tunelu — odbiera jego zestawianie bez decyzji, więc warto opisać go
    jako zmianę odruchu, nie utratę dostępu.
  en: |
    The rule touches a mechanism few remember, and it is well that the application put its heart in one sentence:
    the decision to make a joining from afar is taken with no person in it, and any program at all reaching after
    an address out of reach may call it forth.

    The argument worth keeping touches the joining's living on. It comes to be, lets traffic through and lasts,
    and the one trace is a mark nobody looks at. The machine is therefore at times joined to a network the user
    meant not to be in.

    I set down the reservation touching clients of networks made by craft, that being today the commonest use of
    this mechanism. The item takes not the tunnel - it takes the raising of it without a decision, so it is well
    set out as a change of reflex and no loss of reach.
