    Objawem jest zatrzymanie czegoś, czego nikt nie zatrzymywał — a to
    jest najgorszy rodzaj objawu, bo szukanie przyczyny zaczyna się od
    złej usługi.
  en: |
    The difference from the service of publishing - that one takes askings off the net and carries
    out the code of applications, this one takes nothing from without. An attacker wins upon it no
    way in, so the category is the lower.

    The class is raised of one ground, but an enough one - that service stops not alone. It is the
    one rule in this group whose outcome goes beyond the service named in the item.

    The symptom is the stopping of a thing nobody stopped - and that is the worst kind of symptom,
    the seeking of the ground beginning at the wrong service.
