id: ubuntu2404-journald-active

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.1.1.1
  section: Logging and Auditing > System Logging > Configure systemd-journald service
  title:
    pl: Usługa journald jest włączona i działa
    en: Ensure journald service is enabled and active
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    systemd-journald zbiera komunikaty jądra, usług i programów. Bez niego
    nie ma dziennika systemowego, a rsyslog na Ubuntu też dostaje komunikaty
    od journald.

    Punkt wymaga, żeby usługa systemd-journald była w stanie static (jest
    uruchamiana przez system, bez włączania) i działała.
  en: |
    systemd-journald collects the messages of the kernel, services and
    programs. Without it there is no system log, and on Ubuntu rsyslog also
    gets the messages from journald.

    The item requires the systemd-journald service to be in the static state
    (the system starts it, without enabling) and to be running.

disruption_description:
  pl: |
    Nikt tego nie zauważy: reguła tylko sprawdza stan usługi.
  en: |
    Nobody will notice: the rule only checks the state of the service.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    e=$(systemctl is-enabled systemd-journald.service 2>/dev/null)
    a=$(systemctl is-active systemd-journald.service 2>/dev/null)
    if [ "$e" = static ] && [ "$a" = active ]; then echo "OK:$e/$a"; else echo "NOT_OK:${e:-unknown}/${a:-unknown}"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/systemd-journald.service.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html

notes:
  pl: |
    Wynik podaje stan z systemctl is-enabled i is-active. Stan inny niż
    static oznacza zwykle zamaskowaną usługę; poprawia się ją ręcznie
    poleceniami systemctl unmask systemd-journald.service i systemctl start
    systemd-journald.service. Reguła tylko sprawdza stan.
  en: |
    The result gives the state from systemctl is-enabled and is-active. A
    state other than static usually means a masked service; it is fixed by
    hand with systemctl unmask systemd-journald.service and systemctl start
    systemd-journald.service. The rule only checks the state.
