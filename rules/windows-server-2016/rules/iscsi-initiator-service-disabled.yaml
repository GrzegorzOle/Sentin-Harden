id: win2016-iscsi-initiator-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa dołączania dysków blokowych przez sieć wyłączona
    en: The service attaching block disks over the network disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę dołączającą do maszyny dyski udostępnione przez
    sieć. Dysk dołączony tą drogą widoczny jest w systemie jak dysk
    lokalny, mimo że leży gdzie indziej.

    Zagrożenie leży w tym, czym taki dysk jest dla systemu. Nie jest
    udziałem plikowym, do którego sięga się przez warstwę sieciową — jest
    urządzeniem blokowym, obsługiwanym przez sterownik pracujący nisko,
    z którego można uruchomić system, na którym da się trzymać plik
    stronicowania i który system traktuje z takim samym zaufaniem jak dysk
    przykręcony do obudowy.

    Znaczy to, że skierowanie tej usługi do celu podstawionego jest drogą
    podania maszynie treści przez warstwę, w której nikt treści nie
    sprawdza. Usługa ta w dodatku sama nawiązuje połączenia na zewnątrz,
    więc obecność jej na maszynie, która żadnych dysków sieciowych nie
    używa, jest zbędnym składnikiem o nisko położonych uprawnieniach.

    Na serwerze korzystającym z magazynu blokowego punkt jest niewykonalny
    i jest to sytuacja częsta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działający
    składnik potrafiący dołączyć do maszyny urządzenie blokowe z sieci,
    obsługiwane sterownikiem o niskich uprawnieniach.
  en: |
    The item switches off the service attaching to the machine disks shared over the network. A disk
    attached by that road is visible in the system like a local one, though it lies elsewhere.

    The threat lies in what such a disk is to the system. It is no file share reached through the network
    layer - it is a block device, served by a driver working low down, from which the system can be
    started, on which a paging file can be kept, and which the system treats with the same trust as a
    disk screwed into the case.

    That means directing that service at a substituted target is a road for handing the machine content
    through a layer in which nobody checks content. The service besides makes connections outward
    itself, so its presence on a machine using no network disks is a needless component of low-lying
    rights.

    On a server using block storage the item is not feasible, and that is a common case.

    What an attacker gains while the item goes unmet: a working component able to attach to the machine
    a block device from the network, served by a driver of low rights.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rzecz do sprawdzenia widać
    w spisie dysków.

    Warunek pierwszy: dyski dołączone tą drogą. Jeżeli jakikolwiek wolumin
    na tej maszynie leży na magazynie sieciowym, po restarcie zniknie.
    Aplikacje korzystające z niego zobaczą brak ścieżki, a nie brak
    uprawnień, więc objaw jest czytelny — ale dopiero po restarcie, bo
    dołączone połączenie trwa do niego.

    Warunek drugi jest poważniejszy. Jeżeli na takim dysku leży cokolwiek
    potrzebnego wcześnie — baza, log transakcyjny, plik stronicowania,
    zasób klastra — maszyna może nie wstać albo wstać w stanie
    niepełnym. Sprawdzenie spisu dysków przed wykonaniem jest tu częścią
    zmiany, a nie ostrożnością dodatkową.

    Warunek trzeci dotyczy klastrów. Magazyn współdzielony dołączany tą
    drogą jest częstym rozwiązaniem, a wyłączenie usługi na jednym węźle
    wyklucza go z klastra.

    Czego to nie psuje: dysków lokalnych, udziałów plikowych sieciowych,
    sieci, aplikacji nieopartych o magazyn blokowy.

    Wymaga zatrzymania usługi; skutek pełny po restarcie; cofnięcie
    natychmiastowe.
  en: |
    The class is "needs a planned rollout", and the thing to be established shows in the list of disks.

    The first condition: disks attached by that road. If any volume on this machine lies on network
    storage, it will vanish after a restart. Applications using it will see a want of path rather than a
    want of permission, so the symptom is legible - but only after a restart, the attached connection
    holding until then.

    The second condition is the graver. If anything needed early lies on such a disk - a database, a
    transaction log, a paging file, a cluster resource - the machine may fail to come up or come up in an
    incomplete state. Checking the list of disks before the carrying out is here part of the change
    rather than a further caution.

    The third condition concerns clusters. Shared storage attached by that road is a common arrangement,
    and switching the service off on one node shuts it out of the cluster.

    What this does not break: local disks, network file shares, the network, or applications not resting
    on block storage.

    Calls for a service to be stopped; the consequence is full after a restart; the undoing is immediate.

implementation_consequences:
  impact_areas:
    - file-sharing
    - drivers-and-devices
    - network-and-firewall
  what_breaks:
    pl:
      - Wolumin leżący na magazynie sieciowym znika po restarcie, a aplikacje zobaczą brak ścieżki, nie brak uprawnień
      - Maszyna może nie wstać, gdy na takim dysku leży baza, log transakcyjny, plik stronicowania albo zasób klastra
      - Węzeł klastra korzystający z magazynu współdzielonego dołączanego tą drogą zostaje z niego wykluczony
      - Objaw pojawia się dopiero po restarcie, bo dołączone połączenie trwa do niego
      - Dyski lokalne, udziały plikowe sieciowe i aplikacje nieoparte o magazyn blokowy pozostają bez zmian
    en:
      - A volume lying on network storage vanishes after a restart, and applications will see a want of path rather than a want of permission
      - The machine may fail to come up where a database, a transaction log, a paging file or a cluster resource lies on such a disk
      - A cluster node using shared storage attached by that road is shut out of the cluster
      - The symptom appears only after a restart, the attached connection holding until then
      - Local disks, network file shares and applications not resting on block storage stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Jakikolwiek wolumin na tej maszynie leży na magazynie dołączanym przez sieć
      - Maszyna jest węzłem klastra korzystającego z magazynu współdzielonego dołączanego tą drogą
      - Nie sprawdzono spisu dysków, więc nie wiadomo, co po restarcie zniknie
    en:
      - Any volume on this machine lies on storage attached over the network
      - The machine is a node of a cluster using shared storage attached by that road
      - The list of disks has not been checked, so it is not known what will vanish after a restart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'MSiSCSI' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where a disk is attached this way, it disappears after a restart and the
    # machine may not come up if anything starting early rests on it. Check the
    # disk list before this runs, not after.
    Stop-Service -Name 'MSiSCSI' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'MSiSCSI' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'MSiSCSI' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/iscsi/iscsi-target-server

notes:
  pl: |
    Punkt zamyka blok i różni się od pozostałych tym, że jego skutek jest
    odroczony do restartu. Cztery poprzednie reguły objawiają się od razu
    albo wcale; ta objawia się przy następnym starcie, czyli w momencie,
    w którym nikt zmiany już nie pamięta.

    Warto, żeby aplikacja to powiedziała, bo zmienia sposób sprawdzenia
    wdrożenia. Wykonanie i obejrzenie maszyny nie dowodzi niczego —
    dołączone połączenia trwają do restartu i wszystko wygląda dobrze.
    Dowodem jest dopiero start.

    Druga rzecz warta pokazania to różnica między dyskiem sieciowym a
    udziałem. Są to dwie zupełnie inne warstwy i obawa, że punkt odetnie
    maszynie dostęp do folderów sieciowych, jest bezpodstawna. Rozróżnienie
    to wraca w tym bloku po raz drugi, po punkcie o usłudze serwera
    udostępniania plików, i w obu miejscach jest przyczyną niepotrzebnego
    odpuszczania.

    Kategoria średnia jest postawiona zgodnie z kryterium: żeby ta droga
    coś dała, napastnik musi już móc wpłynąć na to, dokąd usługa się łączy.
    Jest to warunek dodatkowy, a więc nie kategoria krytyczna — ale gdy
    zostanie spełniony, dotyczy warstwy blokowej, a więc miejsca, w którym
    system niczego nie sprawdza.
  en: |
    The item shuts the block and differs from the rest in that its consequence is put off to a restart.
    The four rules before it show at once or not at all; this one shows at the next start, which is to say
    at a moment when nobody remembers the change any longer.

    It is well that the application say so, changing as it does the manner of checking the rollout.
    Carrying out and looking the machine over proves nothing - the attached connections hold until a
    restart and everything looks well. The proof is the start and nothing before it.

    The second thing worth showing is the difference between a network disk and a share. They are two
    altogether different layers, and the fear that the item will cut the machine's access to network
    folders is groundless. That distinction comes back in this block a second time, after the item about
    the file sharing server service, and in both places it is a cause of needless letting go.

    The medium category is set in keeping with the criterion: for that road to give anything, an attacker
    must already be able to bear on where the service connects. That is a further condition, and so not a
    critical category - but once met, it concerns the block layer, which is to say a place where the
    system checks nothing.
