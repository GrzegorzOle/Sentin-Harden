id: win2016-point-and-print-warning-on-update

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers > Point and Print Restrictions
  title:
    pl: Ostrzeżenie przy aktualizacji sterownika drukarki sieciowej zachowane
    en: The warning at the updating of a network printer driver kept
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zachowuje ostrzeżenie w chwili, gdy maszyna ma zaktualizować
    sterownik drukarki pobrany z serwera wydruku.

    Reguła jest bliźniacza wobec poprzedniej i różni się jedną rzeczą:
    chwilą. Tamta pyta przy pierwszej instalacji, ta przy podmianie
    sterownika już zainstalowanego.

    Rozdzielenie ich ma sens praktyczny, bo scenariusz aktualizacji jest
    dla napastnika wygodniejszy. Połączenie z serwerem wydruku istnieje,
    drukarka jest już dodana, użytkownik niczego nie inicjuje — a mimo to
    kod przychodzi i zostaje uruchomiony. Wystarczy, że po stronie serwera
    pojawi się sterownik nowszy.

    Jest to droga cichsza od instalacji pierwszej, bo nie wymaga od nikogo
    żadnego działania. Dlatego ostrzeżenie przy aktualizacji bywa
    wyłączane pierwsze — jako najbardziej uciążliwe — i dlatego trzeba
    sprawdzać je osobno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podmianę
    kodu pracującego w przestrzeni jądra na maszynach, które już się
    z serwerem wydruku łączą, bez żadnego działania po ich stronie.
  en: |
    The setting keeps the warning at the moment the machine is to update a printer
    driver fetched from a print server.

    The rule is a twin of the previous one and differs in one thing: the moment.
    That one asks at the first installing, this one at the replacing of a driver
    already installed.

    Parting them has a practical sense, the updating case being the more convenient
    to an attacker. The connection to the print server exists, the printer is added
    already, the user sets nothing going - and the code comes all the same and is
    run. It is enough that a newer driver appears on the server's side.

    That road is quieter than a first installing, calling for no act from anybody.
    So the warning at updating is at times switched off first - as the most
    irksome - and so it has to be checked apart.

    What an attacker gains while the item goes unmet: the replacing of code working
    in the kernel's space on machines already connecting to a print server, with no
    act at all on their side.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest węższa niż
    przy regule poprzedniej i dotyczy utrzymania.

    Skutkiem jest to, że podmiana sterownika po stronie serwera wydruku
    przestaje rozchodzić się cicho. Każda maszyna, która miałaby go
    zaktualizować, zapyta — a jeżeli nie ma kto odpowiedzieć, zostanie przy
    wersji starej.

    Na serwerze bez sesji interaktywnych znaczy to, że sterowniki
    przestaną się aktualizować w ogóle. Nie jest to awaria natychmiastowa
    i właśnie w tym rzecz: drukowanie działa dalej, a wersja sterownika
    stoi w miejscu, czasem latami.

    Skutek ten jest wart osobnej uwagi, bo przeczy intuicji. Punkt
    utwardzający powoduje tu zatrzymanie aktualizacji — a więc może
    utrzymać przy życiu sterownik z luką. Odpowiedzią jest rozsyłanie
    sterowników narzędziem wdrożeniowym, nie oczekiwanie, że przyjdą same.

    Rzecz druga dotyczy serwerów terminali, gdzie użytkownicy zobaczą
    prośbę o podniesienie uprawnień przy każdej zmianie sterownika po
    stronie serwera wydruku.

    Czego to nie psuje: drukowania na drukarkach już zainstalowanych,
    kolejek udostępnianych, usług, logowania.

    Wymaga zatrzymania usługi wydruku; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check is narrower than at the
    previous rule and concerns upkeep.

    The consequence is that the replacing of a driver on the print server's side
    stops spreading quietly. Every machine that would update it will ask - and if
    there is nobody to answer, it will stay on the old version.

    On a server with no interactive sessions that means drivers will stop updating
    at all. It is no immediate breakdown, and therein lies the matter: printing goes
    on working while the driver's version stands still, at times for years.

    That consequence deserves attention of its own, running against intuition. A
    hardening item here brings updating to a halt - and so may keep a driver with a
    gap in it alive. The answer is to send drivers out with a deployment tool rather
    than to expect them to come of themselves.

    The second thing concerns terminal servers, where users will see a request to
    raise rights at every change of driver on the print server's side.

    What this does not break: printing on printers already installed, shared queues,
    services, or signing in.

    Calls for the print service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
    - updates-and-servicing
  what_breaks:
    pl:
      - Podmiana sterownika po stronie serwera wydruku przestaje rozchodzić się sama, a maszyna bez nikogo przy ekranie zostaje przy wersji starej
      - Sterowniki na maszynie bez sesji interaktywnych przestają się aktualizować w ogóle, a drukowanie działa dalej, więc objaw jest cichy
      - Użytkownicy serwera terminali zobaczą prośbę o podniesienie uprawnień przy każdej zmianie sterownika po stronie serwera wydruku
      - Drukowanie na drukarkach już zainstalowanych i kolejki udostępniane pozostają bez zmian
    en:
      - The replacing of a driver on the print server's side stops spreading of itself, and a machine with nobody at the screen stays on the old version
      - Drivers on a machine with no interactive sessions stop updating at all while printing goes on working, so the symptom is a quiet one
      - Users of a terminal server will see a request to raise rights at every change of driver on the print server's side
      - Printing on printers already installed and shared queues stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Sterowniki drukarek na tej maszynie aktualizują się wyłącznie z serwera wydruku i nie ma narzędzia rozsyłającego je inaczej
      - Maszyna jest serwerem terminali, a zmiany sterowników po stronie serwera wydruku są częste
    en:
      - Printer drivers on this machine update only from the print server and there is no tool sending them out otherwise
      - The machine is a terminal server and changes of driver on the print server's side are frequent
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
      $name = 'UpdatePromptSettings'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    $name = 'UpdatePromptSettings'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UpdatePromptSettings' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/point-and-print-default-behavior-change

notes:
  pl: |
    Punkt jest jedynym w całym zestawie, przy którym utwardzenie potrafi
    zatrzymać napływ poprawek — i warto to powiedzieć wprost, zamiast
    zostawiać do odkrycia. Sterownik, który się nie aktualizuje, zostaje
    z tym, co w nim jest, a dotyczy to kodu pracującego w przestrzeni jądra.

    Nie unieważnia to reguły. Oznacza, że jej wdrożeniu musi towarzyszyć
    inna droga dostarczania sterowników, a aplikacja powinna o tym
    przypominać przy podglądzie skutków.

    Cztery reguły o mechanizmie pobierania sterowników z serwera układają
    się w warstwy: kto może instalować, czy pyta przy instalacji, czy pyta
    przy aktualizacji. Pierwsza jest najmocniejsza, dwie pozostałe bronią
    wtedy, gdy pierwsza z jakiegoś powodu nie zadziała. Warto pokazywać je
    razem, bo osobno każda wygląda na wystarczającą.
  en: |
    The item is the only one in the whole set where hardening can bring the inflow
    of fixes to a halt - and that is worth saying outright rather than leaving to be
    found out. A driver that does not update stays with what is in it, and that
    concerns code working in the kernel's space.

    That does not undo the rule. It means its rollout has to be accompanied by
    another road of delivering drivers, and the application should recall that at
    the preview of consequences.

    The four rules about the mechanism of fetching drivers from a server fall into
    layers: who may install, whether it asks at installing, whether it asks at
    updating. The first is the strongest, and the other two guard where the first
    for some reason does not take effect. They are worth showing together, since
    apart each looks sufficient.
