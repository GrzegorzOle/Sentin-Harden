id: win2016-network-connectivity-active-probes-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Aktywne sprawdzanie dostępu do sieci wyłączone
    en: Active testing of network access switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza okresowe zapytania wysyłane przez system do
    wyznaczonego adresu w sieci publicznej w celu ustalenia, czy maszyna
    ma dostęp do internetu.

    Mechanizm ten odpowiada na pytanie, które system zadaje sobie sam:
    czy połączenie sieciowe prowadzi dalej niż do najbliższego urządzenia.
    Odpowiedź uzyskuje, wysyłając zapytanie pod stały adres i sprawdzając,
    czy wróciła spodziewana treść.

    Sprawa ma dwie strony i warto obie nazwać.

    Strona pierwsza to ujawnianie. Zapytanie wychodzi cyklicznie, niesie
    rozpoznawalny wzorzec i mówi obserwującemu ruch, że maszyna ta jest
    systemem tej rodziny, działa i ma połączenie. Jest to niewiele, ale
    jest to za darmo.

    Strona druga jest ważniejsza. Odpowiedź na to zapytanie rozstrzyga
    o tym, w jakim trybie pracuje część mechanizmów systemu. Kto potrafi
    tę odpowiedź podstawić, ten wpływa na stan, który system uważa za
    ustalony samodzielnie — a robi to bez dostępu do maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: cykliczne
    potwierdzenie, że maszyna istnieje i pracuje, oraz wpływ na to, za jaki
    uzna własny stan połączenia.
  en: |
    The setting switches off the periodic queries the system sends to an appointed
    address on the public network to establish whether the machine has access to the
    internet.

    That mechanism answers a question the system asks itself: whether the network
    connection leads further than the nearest device. It gets the answer by sending a
    query to a fixed address and checking whether the expected contents came back.

    The matter has two sides and both are worth naming.

    The first side is disclosure. The query goes out cyclically, carries a
    recognisable pattern, and tells whoever watches the traffic that this machine is a
    system of this family, is working and has a connection. It is little, but it comes
    for free.

    The second side matters more. The answer to that query settles the mode some of
    the system's mechanisms work in. Whoever can substitute that answer bears on a
    state the system takes to be established by itself - and does so without access to
    the machine.

    What an attacker gains while the item goes unmet: a cyclical confirmation that the
    machine exists and is working, and a bearing on what it takes its own connection
    state to be.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, co na tej maszynie
    pyta system o stan połączenia.

    Skutkiem bezpośrednim jest to, że system przestaje wiedzieć, czy ma
    dostęp do internetu, i zaczyna zgłaszać stan nieokreślony. Widać to
    w ikonie połączenia sieciowego, która pokazuje ograniczoną łączność,
    choć łączność jest pełna.

    Objaw ten jest kosmetyczny, ale ma dwa następstwa, które kosmetyczne
    nie są.

    Pierwsze dotyczy oprogramowania pytającego system o stan połączenia
    zamiast sprawdzać samodzielnie. Część programów aktualizujących się
    przez sieć, część klientów synchronizacji i część narzędzi nadzoru
    czeka wtedy na stan, który nie nadejdzie, i nie robi nic. Jest to
    najtrudniejszy skutek tej reguły, bo program milczy zamiast zgłaszać
    błąd.

    Drugie dotyczy zgłoszeń od użytkowników. Ikona ostrzegająca
    o ograniczonej łączności na maszynie z pełną łącznością generuje
    zgłoszenia i mylne rozpoznania. Warto uprzedzić obsługę, zanim
    zacznie szukać usterki sieci.

    Czego to nie psuje: samej łączności sieciowej, dostępu do plików,
    logowania, usług, ruchu wychodzącego.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is what on this machine
    asks the system about the connection's state.

    The direct consequence is that the system stops knowing whether it has access to
    the internet and begins reporting an undetermined state. It shows in the network
    connection icon, which displays limited connectivity though connectivity is full.

    That symptom is cosmetic, but it has two consequences that are not.

    The first concerns software asking the system about the connection's state instead
    of checking for itself. Some programs updating over the network, some
    synchronisation clients and some monitoring tools then wait for a state that will
    not come and do nothing. It is this rule's hardest consequence, the program
    keeping silent instead of reporting an error.

    The second concerns reports from users. An icon warning of limited connectivity on
    a machine with full connectivity brings reports and mistaken diagnoses. It is
    worth forewarning the support desk before it starts looking for a network fault.

    What this does not break: network connectivity itself, access to files, signing
    in, services, or outgoing traffic.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Ikona połączenia sieciowego pokaże ograniczoną łączność, choć łączność jest pełna, co generuje zgłoszenia i mylne rozpoznania
      - Oprogramowanie pytające system o stan połączenia zamiast sprawdzać samodzielnie może czekać w nieskończoność i milczeć zamiast zgłosić błąd
      - Dotyczy to części programów aktualizujących się przez sieć, klientów synchronizacji i narzędzi nadzoru
      - Sama łączność sieciowa, dostęp do plików i ruch wychodzący pozostają bez zmian
    en:
      - The network connection icon will show limited connectivity though connectivity is full, which brings reports and mistaken diagnoses
      - Software asking the system about the connection state instead of checking for itself may wait endlessly and keep silent instead of reporting an error
      - That touches some programs updating over the network, synchronisation clients and monitoring tools
      - Network connectivity itself, access to files and outgoing traffic stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje oprogramowanie, które czeka na zgłoszony przez system stan połączenia, zanim cokolwiek zrobi
      - Obsługa stanowisk nie została uprzedzona i ostrzegawcza ikona wygeneruje zgłoszenia usterki sieci
    en:
      - Software waiting for a connection state reported by the system before doing anything works on the machine
      - The support desk has not been forewarned and the warning icon will bring reports of a network fault
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
      $name = 'NoActiveProbe'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    $name = 'NoActiveProbe'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoActiveProbe' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Punkt jest jedynym w bloku dotyczącym ruchu, który maszyna wysyła sama
    z siebie, bez niczyjego polecenia. Warto to postawić wprost, bo reszta
    bloku dotyczy przyjmowania i odpowiadania.

    Ocena ryzyka jest tu trudniejsza niż zwykle i wypada ją uzasadnić.
    Samo ujawnienie istnienia maszyny jest drobiazgiem. Wpływ na stan,
    który system uważa za ustalony samodzielnie, drobiazgiem nie jest —
    stąd kategoria średnia, a nie niska.

    Poziom drugi jest tu na miejscu. Punkt płaci za utwardzenie objawem
    widocznym w interfejsie i zgłoszeniami od użytkowników. Na serwerze
    bez sesji interaktywnych cena ta jest bliska zeru; na maszynie, na
    której ktoś pracuje, jest realna.
  en: |
    The item is the only one in the block concerning traffic the machine sends of
    itself, at nobody's command. That is worth putting outright, the rest of the block
    concerning taking in and answering.

    Judging the risk is harder here than usual and warrants a justification. The mere
    disclosure that the machine exists is a trifle. A bearing on a state the system
    takes to be established by itself is no trifle - hence the medium category rather
    than low.

    Level two is in place here. The item pays for its hardening with a symptom visible
    in the interface and with reports from users. On a server with no interactive
    sessions that price is close to nothing; on a machine somebody works at, it is
    real.
