id: win10-defender-asr-email-executable-content

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania plików wykonywalnych z poczty
    en: Executable content from email blocked from running
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania uruchamiania plików wykonywalnych i skryptów
    pochodzących z wiadomości pocztowej.

    Poczta jest drogą wejścia, w której wszystko poza ostatnim krokiem
    jest legalne. Wiadomość dochodzi, załącznik zostaje zapisany,
    użytkownik go otwiera — i dopiero ta ostatnia czynność jest tą, którą
    napastnik potrzebował. Nic wcześniej nie wymagało obejścia żadnego
    zabezpieczenia.

    Reguła obejmuje pliki wykonywalne i skrypty przyniesione z poczty,
    w tym te wyjęte z archiwów. Nie dotyczy dokumentów ani arkuszy — te
    otwierają się normalnie, a ich makra opisują osobne punkty.

    Odnotowuję zasięg: obejmuje pocztę odbieraną programem pocztowym
    i pocztę z usług przeglądarkowych, o ile plik przyszedł tą samą
    drogą. Nie obejmuje pliku pobranego z serwisu udostępniania plików,
    nawet jeśli odnośnik do niego przyszedł mailem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    własnego programu ręką odbiorcy, bez obchodzenia czegokolwiek.
  en: |
    The rule forbids the starting of executable files and scripts come from a message of post.

    The post is a road of entry in which everything but the last step is lawful. The message arrives, the
    attachment is saved, the user opens it - and only that last act is the one the attacker needed. Nothing before
    it called for the going round of any guard.

    The rule takes in executable files and scripts brought from the post, those taken out of archives among them.
    It does not touch documents nor sheets - those open as they always did, and items apart set out their macros.

    I set down the reach: it takes in the post taken in by a mail program and the post of browser services, so
    long as the file came by that same road. It does not take in a file downloaded from a service for the sharing
    of files, even where the link to it came by mail.

    What an attacker gains while the item goes unmet: the starting of their own program by the receiver's hand,
    without the going round of anything.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    pocztą przychodzi coś, co ma być uruchamiane.

    Zdarza się to w obiegu wewnętrznym. Narzędzie instalacyjne przysłane
    przez obsługę, skrypt konfiguracyjny od dostawcy, poprawka do
    programu przysłana mailem — wszystkie przestaną się uruchamiać.

    Skutek widzi użytkownik od razu: plik otwiera się i natychmiast
    zostaje zatrzymany komunikatem ochrony. Jest to komunikat czytelny,
    więc zgłoszenie zwykle trafia we właściwą przyczynę.

    Odpowiedzią jest zmiana obiegu, a nie wyjątek. Plik, który ma być
    uruchamiany, powinien przychodzić z udziału albo z repozytorium
    wewnętrznego — i jest to zmiana warta wykonania niezależnie od tej
    reguły, bo poczta nie jest kanałem dystrybucji oprogramowania.

    Odnotowuję, że dokumenty i arkusze nie są objęte. Użytkownik, który
    usłyszy „nie można uruchamiać załączników", zrozumie to szerzej niż
    reguła sięga.

    Czego to nie psuje: odbierania poczty, otwierania dokumentów
    i arkuszy, zapisywania załączników, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anything meant to be started comes by
    post.

    It happens in the inner round. An installing tool sent by the support, a setting-up script from a supplier, a
    patch to a program sent by mail - all will cease to start.

    The user sees the consequence at once: the file opens and is straight away stopped by a message from the
    protection. It is a readable message, so the report as a rule strikes the right cause.

    The answer is a change of the round and not an exception. A file meant to be started ought to come from a
    share or from an inner repository - and that is a change worth making whatever this rule, the post being no
    channel for the handing out of software.

    I set down that documents and sheets are not taken in. A user who hears "attachments cannot be started" will
    take it wider than the rule reaches.

    What this does not break: the taking in of post, the opening of documents and sheets, the saving of
    attachments, logging on, or printing.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzie instalacyjne przysłane przez obsługę przestaje się uruchamiać z załącznika
      - Skrypt konfiguracyjny od dostawcy i poprawka przysłana mailem zatrzymują się tak samo
      - Dokumenty i arkusze nie są objęte i otwierają się normalnie, a ich makra opisują osobne punkty
      - Odpowiedzią jest przeniesienie dystrybucji na udział albo repozytorium wewnętrzne, a nie wyjątek
      - Odbieranie poczty, zapisywanie załączników, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - An installing tool sent by the support ceases to start from an attachment
      - A setting-up script from a supplier and a patch sent by mail halt the same way
      - Documents and sheets are not taken in and open as they always did, items apart setting out their macros
      - The answer is the moving of the handing out to a share or an inner repository, and not an exception
      - The taking in of post, the saving of attachments, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obieg wewnętrzny opiera się na rozsyłaniu narzędzi pocztą i nie ma przygotowanego udziału ani repozytorium
    en:
      - The inner round rests upon the sending out of tools by post and there is no share nor repository made ready
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła otwiera blok i jest w nim pierwszą z trzech opisujących
    drogę pocztową. Warto, żeby aplikacja pokazywała je razem, bo
    zamykają tę samą drogę w trzech różnych miejscach.

    Argument wart postawienia wprost dotyczy tego, czego tu brakuje.
    W całej drodze pocztowej nie ma ani jednego obejścia zabezpieczenia.
    Wiadomość dochodzi prawidłowo, załącznik zapisuje się prawidłowo,
    użytkownik klika prawidłowo. Nie ma czego wykryć, dopóki plik się
    nie uruchomi — i dlatego zamknięcie ostatniego kroku jest tu warte
    więcej niż sprawdzanie wcześniejszych.

    Odnotowuję, że właściwą odpowiedzią na zgłoszenie nie jest wyjątek,
    tylko zmiana obiegu. Poczta nie jest kanałem dystrybucji
    oprogramowania i reguła jedynie to unaocznia.
  en: |
    The rule opens the block and is the first in it of three setting out the road by post. It is well that the
    application show them together, they closing that same road at three different places.

    The argument worth putting outright touches what is wanting here. In the whole road by post there is not one
    going round of a guard. The message arrives rightly, the attachment saves rightly, the user clicks rightly.
    There is nothing to find until the file starts - and for that the closing of the last step is here worth more
    than the checking of the earlier ones.

    I set down that the proper answer to a report is not an exception but a change of the round. The post is no
    channel for the handing out of software, and the rule merely brings that to light.
