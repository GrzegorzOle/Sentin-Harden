description:
  pl: |
    Ustawienie zabrania tej maszynie posługiwania się uwierzytelnianiem
    podstawowym, gdy sama łączy się z inną maszyną w celu wykonania na
    niej poleceń.

    Jest to kierunek odwrotny do punktu o usłudze. Tam maszyna przyjmuje
    połączenia. Tutaj maszyna je nawiązuje, a znaczenie ma to, że przy
    tym sposobie wysyła hasło w treści żądania.

    Zagrożenie pierwsze to wyciek własnych poświadczeń. Hasło konta
    administracyjnego wysłane tą drogą może zostać odczytane po drodze,
    a jest to zwykle konto o szerokich uprawnieniach.

    Zagrożenie drugie to serwer podstawiony. Klient gotowy wysłać hasło
    wprost wyśle je także temu, kto tylko udaje właściwą maszynę, bo
    sposób ten nie przewiduje potwierdzania tożsamości drugiej strony.

    Odnotowuję, że jest to punkt chroniący maszynę przed jej własnym
    działaniem, a nie przed połączeniem z zewnątrz. Takie punkty bywają
    pomijane, bo nie kojarzą się z wystawieniem na atak, a tutaj stawką
    jest hasło administratora.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    wysłane przez tę maszynę wprost, także maszynie podstawionej.
  en: |
    The setting forbids this machine to use plain warranting when it joins itself to another machine to work
    orders upon it.

    It is the road the other way about from the item about the service. There the machine takes in joinings. Here
    the machine makes them, and what has weight is that in that manner it sends the password in the body of the
    asking.

    The first danger is the leaking of one's own warrants. The password of a keeper's reckoning sent by that road
    may be read along the way, and it is commonly a reckoning of broad rights.

    The second danger is a server set in the place of another. A client ready to send the password outright will
    send it also to whoever merely feigns to be the right machine, that manner looking for no warranting of the
    other side's name.

    I set down that it is an item guarding the machine against its own doing and not against a joining from
    without. Such items are at times passed over, bringing no setting out to assault to mind, and here the stake
    is a keeper's password.

    What an attacker gains while the item goes unmet: a password sent outright by this machine, to a machine set
    in another's place as well.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są skrypty
    uruchamiane z tej maszyny.

    Miejscem pierwszym są skrypty utrzymaniowe łączące się z maszynami
    spoza domeny — urządzeniami, serwerami w innej sieci, sprzętem
    dostawcy. Tam sposób podstawowy bywa jedynym, który skonfigurowano.

    Miejscem drugim są narzędzia uruchamiane ręcznie przez osobę
    zarządzającą. Po zmianie zgłoszą odmowę uwierzytelnienia, a komunikat
    wskaże stronę zdalną, choć przyczyna leży tutaj — i to jest objaw
    mylący.

    Odnotowuję, że punkt nie rusza połączeń przychodzących. Maszyna
    przyjmuje je dalej na dotychczasowych zasadach; do tego służy
    osobny punkt.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: połączeń przychodzących, uwierzytelniania
    domenowego, pracy programów, sieci, logowania.
  en: |
    The class is "needs review", and the object of the review is scripts set going from this machine.

    The first place is scripts of upkeep joining themselves to machines beyond the domain - things, servers in
    another network, gear of a seller. There the plain manner is at times the only one that was set up.

    The second place is tools set going by hand by whoever orders the machines. After the change they will give
    out a refusal of warranting, and the message will point to the far side though the cause lies here - and that
    is a misleading sign.

    I set down that the item touches not joinings coming in. The machine takes them in on the terms it did; an
    item apart serves for that.

    The consequence shows at once, with no restart.

    What this does not break: joinings coming in, warranting by the domain, the work of programs, the network, or
    logging on.

