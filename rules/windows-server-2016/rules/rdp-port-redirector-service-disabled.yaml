id: win2016-rdp-port-redirector-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa przekierowania portów dla sesji zdalnych wyłączona
    en: The port redirector service for remote sessions disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę, która w sesji zdalnej podłącza do serwera
    sprzęt i zasoby maszyny łączącej się. To ona wykonuje pracę, o której
    mówią wszystkie reguły przekierowań.

    Różnica względem tamtych jest taka, że tamte zamykają po jednej drodze,
    a ta zamyka mechanizm. Reguła o dyskach odcina dyski, reguła o portach
    odcina porty — każda z osobna i każda wpisem, który da się cofnąć
    pojedynczą zmianą. Wyłączenie usługi zdejmuje całą warstwę naraz,
    łącznie z tym, o co żadna reguła osobno nie pyta.

    Wartość leży w tym, co zostaje usunięte z maszyny. Usługa ładuje
    sterowniki dla sprzętu przedstawionego przez stronę łączącą się, więc
    jest tą częścią systemu, w której kod uprzywilejowany powstaje na
    żądanie maszyny niekontrolowanej. Wyłączenie jej nie ogranicza tego
    mechanizmu, tylko go usuwa — i to jest różnica jakościowa, nie ilościowa.

    Punkt należy do poziomu drugiego nie bez powodu. Jest to zamknięcie
    kompletne, właściwe maszynom, które sesji roboczych nie obsługują, a nie
    serwerom terminali.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działającą
    warstwę ładującą sterowniki na żądanie strony łączącej się, wraz ze
    wszystkimi drogami przekierowania, których poszczególne reguły nie
    wymieniają z nazwy.
  en: |
    The setting switches off the service that, in a remote session, attaches to the
    server the hardware and resources of the connecting machine. It is this service
    that does the work all the redirection rules speak of.

    The difference from those is that they shut one road each, and this one shuts
    the mechanism. The rule on drives cuts off drives, the rule on ports cuts off
    ports - each apart, and each by an entry a single change can undo. Switching the
    service off takes the whole layer away at once, including what no rule apart
    asks about.

    The value lies in what gets removed from the machine. The service loads drivers
    for hardware presented by the connecting side, so it is the part of the system
    in which privileged code comes into being at the demand of an uncontrolled
    machine. Switching it off does not limit that mechanism but removes it - and
    that is a difference of kind rather than of degree.

    The item belongs to the second level not without reason. This is a complete
    shutting, fit for machines that serve no working sessions, and not for terminal
    servers.

    What an attacker gains while the item goes unmet: a working layer that loads
    drivers at the demand of the connecting side, along with every road of
    redirection the separate rules do not name.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jeden z punktów, przy
    których pytanie „na jakiej to maszynie" rozstrzyga wszystko.

    Na serwerze obsługującym sesje robocze zmiana odbiera drukarki i dyski
    wszystkim naraz. Rzecz w tym, że robi to po cichu: sesja otwiera się
    normalnie, logowanie działa, pulpit wygląda tak samo — po prostu nie ma
    w niej drukarki. Zgłoszenie przychodzi więc jako problem z drukowaniem,
    a nie jako skutek zmiany na serwerze, i bywa szukane tygodniami
    w niewłaściwym miejscu.

    Na maszynie, do której ktoś łączy się wyłącznie w celach zarządzania,
    zmiana nie ma skutku odczuwalnego. I to jest jej właściwe miejsce.

    Sprawdzić trzeba zatem jedno: czy ktokolwiek pracuje na tej maszynie
    w sesji zdalnej w sposób wymagający swojego sprzętu. Jeżeli tak — punkt
    jest nie dla tej maszyny i lepiej go odpuścić świadomie, wdrażając
    zamiast niego poszczególne reguły przekierowań. Jeżeli nie — zmiana jest
    czysta i zdejmuje całą warstwę.

    Objaw przy wdrożeniu na złej maszynie jest cichy i mylący, co jest tu
    najgorszą cechą.

    Czego to nie psuje: samej sesji zdalnej, logowania, obrazu ekranu,
    drukarek podłączonych bezpośrednio do serwera, drukarek sieciowych
    dostępnych z sesji.

    Wymaga zatrzymania usługi; zmiana obowiązuje od następnej sesji.
  en: |
    The class is "needs a planned rollout", and it is one of those items where the
    question "on what kind of machine" settles everything.

    On a server serving working sessions the change takes printers and drives away
    from everybody at once. The thing is that it does so quietly: the session opens
    as usual, signing in works, the desktop looks the same - there simply is no
    printer in it. The report therefore arrives as a printing problem rather than as
    the upshot of a change on the server, and is at times looked for in the wrong
    place for weeks.

    On a machine somebody connects to for management alone, the change has no effect
    anybody will feel. And that is its proper place.

    One thing therefore has to be checked: whether anybody works on this machine in
    a remote session in a way calling for their own hardware. If so, the item is not
    for this machine and is better let go deliberately, the separate redirection
    rules being rolled out in its stead. If not, the change is clean and takes the
    whole layer away.

    The symptom, where it is rolled out on the wrong machine, is quiet and
    misleading, and that is the worst trait here.

    What this does not break: the remote session itself, signing in, the screen
    picture, printers attached directly to the server, or network printers reachable
    from a session.

    Calls for the service to be stopped; the change holds from the next session on.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Drukarki stanowiska przestają pojawiać się w sesji zdalnej, a sesja otwiera się normalnie, więc zgłoszenie przychodzi jako problem z drukowaniem
      - Dyski i sprzęt maszyny łączącej się przestają być widoczne w sesji, niezależnie od ustawień poszczególnych przekierowań
      - Przywrócenie wymaga ponownego włączenia usługi, a nie samej zmiany wpisu, więc cofnięcie jest cięższe niż przy regułach przekierowań
      - Sama sesja zdalna, logowanie, drukarki podłączone bezpośrednio do serwera i drukarki sieciowe pozostają bez zmian
    en:
      - The workstation's printers stop appearing in the remote session, and the session opens as usual, so the report arrives as a printing problem
      - The drives and hardware of the connecting machine cease to be visible in the session, whatever the separate redirection settings say
      - Restoring calls for the service to be switched back on rather than for the entry alone to be changed, so undoing is heavier than at the redirection rules
      - The remote session itself, signing in, printers attached directly to the server and network printers stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna obsługuje sesje robocze, w których ludzie korzystają z własnych drukarek albo własnego sprzętu
      - Poszczególne reguły przekierowań nie zostały wdrożone i wyłączenie usługi miałoby je zastąpić bez przeglądu użycia
    en:
      - The machine serves working sessions in which people use their own printers or their own hardware
      - The separate redirection rules have not been rolled out and switching the service off would stand in for them with no review of use
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
    $name = 'Start'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a machine that serves working sessions this takes printers and drives away
    # from everyone at once. The session still opens normally, so the report arrives
    # as a printer problem, not as a server change.
    Stop-Service -Name 'UmRdpService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'UmRdpService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'UmRdpService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Punkt jest zamknięciem kompletnym i dlatego należy do poziomu drugiego.
    Aplikacja powinna pokazywać go razem z grupą przekierowań i mówić
    wprost, że wybór jest rozłączny: albo reguły pojedyncze, dobrane do
    sposobu pracy, albo wyłączenie całej warstwy na maszynie, która sesji
    roboczych nie obsługuje.

    Cicha postać objawu jest tu ważniejsza niż sam objaw. Reguła nie
    zgłasza się niczym — sesja działa, więc winą obarcza się drukarkę,
    sterownik albo stanowisko. Uwaga o tym powinna być widoczna przy punkcie,
    bo oszczędza tygodnie szukania.

    Cofnięcie jest cięższe niż przy pozostałych regułach pulpitu zdalnego:
    wymaga nie tylko przywrócenia wpisu, ale i ponownego uruchomienia usługi
    oraz nowej sesji. Dlatego przy tym punkcie symulacja przed wykonaniem
    waży więcej niż gdzie indziej.
  en: |
    The item is a complete shutting and for that reason belongs to the second level.
    The application should show it together with the redirection group and say
    outright that the choice is exclusive: either the separate rules, chosen to fit
    the way of working, or the switching off of the whole layer on a machine that
    serves no working sessions.

    The quiet form of the symptom matters more here than the symptom itself. The
    rule announces itself by nothing - the session works, so the blame falls on the
    printer, the driver or the workstation. A remark about that should be visible at
    the item, since it saves weeks of looking.

    Undoing is heavier than at the other remote desktop rules: it calls not only for
    the entry to be restored but for the service to be started again and for a fresh
    session. At this item, therefore, the simulation before execution weighs more
    than elsewhere.
