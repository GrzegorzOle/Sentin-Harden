id: win10-firewall-logging-dropped-packets

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Rejestrowanie odrzuconych pakietów we wszystkich profilach
    en: The recording of cast-aside packets in all profiles
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza zapisywanie do pliku dziennika zapory pakietów,
    które zostały odrzucone.

    Odrzucony pakiet jest śladem próby połączenia, która się nie udała.
    Na maszynie w spokojnej sieci takich prób jest niewiele i są nudne.
    Na maszynie, na którą ktoś patrzy, ich charakter się zmienia: pojawia
    się seria prób pod kolejne porty z jednego adresu, albo powtarzane
    próby pod jeden port z wielu adresów.

    Jest to materiał, którego nie da się odtworzyć później. Zapora
    odrzucająca pakiet bez zapisu nie zostawia niczego — a to właśnie ten
    zapis mówi, że ktoś sprawdzał maszynę na dwa tygodnie przed tym, co
    się wydarzyło.

    Wartość jest wykrywcza, nie ochronna, i warto to powiedzieć wprost.
    Punkt niczego nie blokuje: pakiety są odrzucane tak samo przed zmianą
    i po niej. Zmienia się wyłącznie to, czy ktoś się o tym dowie.

    Odnotowuję, że dziennik zapory jest plikiem tekstowym leżącym poza
    dziennikami zdarzeń i wymaga osobnego zbierania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozpoznanie
    maszyny przez odpytywanie portów, niezostawiające żadnego śladu.
  en: |
    The setting turns on the writing into the firewall's file of record of the packets that were cast aside.

    A cast-aside packet is the trace of an attempt at joining that did not come through. Upon a machine in a quiet
    network such attempts are few and dull. Upon a machine somebody is looking at, their nature changes: there
    shows a run of attempts upon port after port from one address, or attempts repeated upon one port from many
    addresses.

    It is matter that cannot be made anew later. A firewall casting a packet aside without a record leaves nothing
    - and it is that very record which says that somebody was looking the machine over a fortnight before what
    came to pass.

    The worth is one of finding out and no guarding, and that is worth saying outright. The item blocks nothing:
    the packets are cast aside the same before the change and after. What changes is solely whether anybody will
    learn of it.

    I set down that the firewall's record is a file of text lying apart from the journals of events and calls for
    a gathering of its own.

    What an attacker gains while the item goes unmet: a looking over of the machine by the asking of its ports,
    leaving no trace at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana dokłada zapisy do pliku dziennika zapory i nie zmienia niczego
    w przepuszczaniu ruchu. Plik ma ustalony rozmiar i nadpisuje się sam,
    więc nie rośnie bez granicy.

    Odnotowuję jedyne miejsce warte uwagi: maszyna w sieci, w której
    odrzucanych pakietów jest bardzo dużo — na przykład przy głośnym
    ruchu rozgłoszeniowym. Plik dziennika będzie się wtedy obracał szybko
    i historia skróci się do godzin. Jest to argument za większym
    rozmiarem pliku, a nie za rezygnacją z zapisu.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: przepuszczania ruchu, reguł zapory, połączeń
    wychodzących, pracy programów, drukowania.
  en: |
    The class is "no disruption".

    The change adds records to the firewall's file and changes nothing in the letting through of traffic. The file
    has a settled size and writes over itself, so it does not grow without bound.

    I set down the one place worth notice: a machine in a network where cast-aside packets are very many - at
    loud traffic broadcast abroad, say. The file of record will then turn about quickly and the history will
    shorten to hours. It is an argument for a greater size of file and not for a giving up of the record.

    The consequence shows at once, with no restart.

    What this does not break: the letting through of traffic, the firewall's rules, outbound joinings, the work of
    programs, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Plik dziennika zapory zacznie przyrastać, a w sieci z głośnym ruchem rozgłoszeniowym będzie obracał się szybko
      - Historia skróci się wtedy do godzin, co jest argumentem za większym rozmiarem pliku, a nie za rezygnacją z zapisu
      - Plik ma ustalony rozmiar i nadpisuje się sam, więc nie rośnie bez granicy
      - Zapis dziennika zapory leży poza dziennikami zdarzeń i wymaga osobnego zbierania
      - Przepuszczanie ruchu, reguły zapory, połączenia wychodzące, praca programów i drukowanie pozostają bez zmian
    en:
      - The firewall s file of record will begin to grow, and in a network with loud traffic broadcast abroad will turn about quickly
      - The history will then shorten to hours, which is an argument for a greater size of file and not for a giving up of the record
      - The file has a settled size and writes over itself, so it does not grow without bound
      - The firewall s record lies apart from the journals of events and calls for a gathering of its own
      - The letting through of traffic, the firewall s rules, outbound joinings, the work of programs and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna stoi w sieci z bardzo głośnym ruchem rozgłoszeniowym, a rozmiaru pliku dziennika nie da się zwiększyć
    en:
      - The machine stands in a network with very loud traffic broadcast abroad and the size of the file of record cannot be raised
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # The three profiles are weighed together. Naming the ones that fall out
        # matters, a machine set in two of three being a different case from one
        # set in none.
        $wrong = @($profiles | Where-Object { $_.LogBlocked -ne 'True' })
        if ($wrong.Count -eq 0) { 'ALL_LOGGED' } else { 'SILENT_IN_' + ($wrong.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_LOGGED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogBlocked |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogBlocked True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogBlocked $p.LogBlocked
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła ma sens wyłącznie razem z punktami o ścieżce i rozmiarze pliku
    dziennika zapory. Warto, żeby aplikacja pokazała je razem: włączenie
    zapisu przy pliku zbyt małym daje historię liczoną w godzinach, czyli
    w praktyce nie daje nic.

    Argument wart postawienia wprost dotyczy tego, że materiału tego nie
    da się odtworzyć. Odrzucony pakiet niezapisany znika bez śladu i nie
    istnieje żadne miejsce, w którym można go później znaleźć. Jest to
    różnica wobec większości zdarzeń w systemie, które zostawiają ślad
    w kilku miejscach naraz.

    Odnotowuję, że dziennik zapory jest plikiem tekstowym poza dziennikami
    zdarzeń. Punkt ten nie zadziała sam z siebie w systemie zbierającym
    dzienniki — trzeba ten plik do niego dołożyć osobno, a aplikacja
    powinna o tym powiedzieć zamiast sugerować, że zapis wystarczy.
  en: |
    The rule has sense only together with the items about the road to and the size of the firewall's file of
    record. It is well that the application show them together: the turning on of the record at a file too small
    gives a history reckoned in hours, which is to say gives in practice nothing.

    The argument worth putting outright touches this, that such matter cannot be made anew. A cast-aside packet
    unrecorded vanishes without a trace and there stands no place where it may later be found. That is a
    difference from most happenings in the system, which leave a trace in several places at once.

    I set down that the firewall's record is a file of text apart from the journals of events. This item will not
    work of itself in a system that gathers journals - that file has to be added to it separately, and the
    application ought to say so rather than hint that the record suffices.
