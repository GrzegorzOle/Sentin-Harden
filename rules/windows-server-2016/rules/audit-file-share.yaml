id: win2016-audit-file-share

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja dostępu do udziałów plikowych
    en: Audit file share access
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje każde nawiązanie połączenia z udziałem sieciowym na
    tej maszynie — kto, skąd i do którego udziału.

    Na serwerze plików jest to podkategoria o najwyższej wartości praktycznej
    w całym bloku obiektów. Nie wymaga konfigurowania inspekcji na pojedynczych
    katalogach, co jest pracochłonne i łatwe do pominięcia, a mimo to
    odpowiada na pytanie, kto sięgnął po zasób.

    Wartość wykracza poza serwer plików. Udziały administracyjne — te, które
    istnieją na każdej maszynie z systemem Windows i dają dostęp do całych
    woluminów — są standardową drogą ruchu bocznego w sieci. Połączenie z takim
    udziałem z konta, które nie ma powodu tam zaglądać, jest jednym
    z najczytelniejszych sygnałów włamania, jakie da się uzyskać bez narzędzia
    korelującego.

    Rejestrowanie niepowodzeń ma osobną wartość: seria odmów dostępu do
    kolejnych udziałów jest wzorcem rozpoznania, a nie pomyłki użytkownika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poruszanie się
    po udziałach tej maszyny, łącznie z administracyjnymi, bez zostawiania
    zapisu o tym, że tam był.
  en: |
    The subcategory records every connection made to a network share on this machine
    - who, from where and to which share.

    On a file server this is the subcategory of the highest practical worth in the
    whole object block. It calls for no auditing to be configured on individual
    directories, which is laborious and easily passed over, and yet it answers the
    question who reached for a resource.

    Its worth reaches beyond a file server. The administrative shares - those
    existing on every Windows machine and giving access to whole volumes - are a
    standard road of lateral movement across a network. A connection to such a share
    from an account with no business looking there is one of the most legible signs
    of a break-in obtainable without a correlating tool.

    Recording failures has a worth of its own: a run of access refusals across one
    share after another is a pattern of reconnaissance, not of a user's mistake.

    What an attacker gains while the item goes unmet: movement across this machine's
    shares, the administrative ones included, without leaving a record of having been
    there.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" ze względu na objętość, i to ona jest tu
    głównym tematem.

    Zdarzenie powstaje przy nawiązaniu połączenia z udziałem, a nie przy
    otwarciu pliku. Brzmi to skromnie, ale połączenia bywają nawiązywane
    i zrywane znacznie częściej, niż sugeruje praca człowieka: program otwiera
    plik, zamyka, otwiera następny, a każda przerwa dłuższa niż kilkadziesiąt
    sekund kończy się nowym połączeniem.

    Na serwerze plików obsługującym kilkadziesiąt stanowisk oznacza to tysiące
    zdarzeń dziennie. Na serwerze, z którego katalog jest montowany przez
    aplikację, może to oznaczać wielokrotnie więcej, bo ruch idzie w tempie
    maszynowym.

    Trzeba więc oszacować dwie rzeczy przed zmianą: rozmiar dziennika
    zabezpieczeń i przepustowość do zbieracza. Punkt ma wysoką wartość, ale
    jest też jednym z dwóch najdroższych w całym bloku.

    Nic przy tym nie przestaje działać, żaden użytkownik niczego nie zauważy
    i wydajność udostępniania nie zmienia się w sposób mierzalny.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review" on account of volume, and volume is the main theme
    here.

    The event arises when a connection to a share is made, not when a file is
    opened. That sounds modest, but connections are made and broken far more often
    than a person's work suggests: a program opens a file, closes it, opens the
    next, and any pause longer than some tens of seconds ends in a fresh connection.

    On a file server serving some dozens of stations that means thousands of events
    a day. On a server whose directory is mounted by an application it can mean many
    times more, the traffic running at machine pace.

    Two things therefore need estimating before the change: the security log's size
    and the throughput to the collector. The item is of high worth, but it is also
    one of the two dearest in the whole block.

    Nothing stops working while this goes on, no user notices anything, and the
    performance of sharing does not alter measurably.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — rośnie wyłącznie objętość dziennika zabezpieczeń
      - Na serwerze plików obsługującym kilkadziesiąt stanowisk przybywa tysiące zdarzeń dziennie
      - Udział montowany przez aplikację generuje ruch w tempie maszynowym i zdarzeń bywa wielokrotnie więcej
      - Wydajność udostępniania nie zmienia się w sposób mierzalny
    en:
      - No regression in the working - only the security log's volume grows
      - On a file server serving some dozens of stations thousands of events accrue a day
      - A share mounted by an application generates traffic at machine pace and events accrue many times faster
      - The performance of sharing does not alter measurably
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma domyślny rozmiar, a maszyna udostępnia katalogi wielu stanowiskom
      - Udział na tej maszynie jest montowany przez aplikację i objętości ruchu nie oszacowano
    en:
      - The security log is at its default size and the machine shares directories with many stations
      - A share on this machine is mounted by an application and the volume of traffic has not been estimated
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9224-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9224-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9224-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9224-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9224-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-file-share

notes:
  pl: |
    Punkt jest przykładem sedna macierzy: zysk realny i wysoki, koszt realny
    i mierzalny. Decyzja należy do użytkownika, a aplikacja ma dostarczyć obu
    liczb, a nie tylko zalecenia.

    Nie należy go mylić z inspekcją szczegółowego dostępu do udziału. Ten
    zapisuje nawiązanie połączenia; tamten — sięgnięcie po konkretny plik.
    Różnica w objętości między nimi jest o rząd wielkości.

    Na maszynie, która nie udostępnia niczego poza udziałami administracyjnymi,
    koszt spada do zera, a wartość zostaje. To jest przypadek, w którym warto
    punkt wdrożyć bez wahania.
  en: |
    The item is an example of the matrix's heart: a real and high gain, a real and
    measurable cost. The decision belongs to the user, and the application is to
    supply both figures rather than a recommendation alone.

    It should not be confused with the auditing of detailed share access. This one
    records a connection being made; that one a reach for a particular file. The
    difference in volume between them is an order of size.

    On a machine sharing nothing beyond the administrative shares the cost falls to
    nil and the worth remains. That is a case where the item goes in without
    hesitation.
