id: win2025-rpc-endpoint-mapper-client-authentication

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Procedure Call
  title:
    pl: Uwierzytelnianie klienta wobec mapera punktów końcowych wymagane
    en: Client authentication towards the endpoint mapper required
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe klientowi zdalnych wywołań procedur uwierzytelnić
    się już w chwili pytania o to, pod jakim numerem portu działa
    poszukiwana usługa.

    Maper punktów końcowych jest książką telefoniczną tego mechanizmu.
    Usługa, która startuje, zgłasza się do niego i dostaje port; klient,
    który chce z niej skorzystać, pyta mapera, dokąd ma się zwrócić.
    Pytanie to poprzedza całą właściwą rozmowę.

    Punkt dotyczy właśnie tej chwili przed rozmową. Bez niego zapytanie
    do książki telefonicznej idzie bez podpisu, więc odpowiedź można
    podmienić po drodze albo odpowiedzieć zamiast właściwego mapera —
    i skierować klienta tam, gdzie się chce.

    Jest to punkt dotyczący strony klienckiej, czyli tego, co ten serwer
    robi, gdy sam sięga do innych maszyn. Na serwerze zarządzającym albo
    na maszynie obchodzącej skryptami całą serwerownię takich zapytań
    jest wiele i idą do wielu miejsc.

    Kategorię trzymam średnią i podaję powód. Skierowanie klienta pod
    niewłaściwy adres samo w sobie nie daje napastnikowi wykonania ani
    danych — daje mu miejsce, w którym stanie w środku właściwej
    rozmowy. To, co z tego wyniknie, zależy od tego, jak zabezpieczona
    jest rozmowa właściwa. Punkt utrudnia atak i nie blokuje go, i tak
    właśnie go oceniam.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podmiany odpowiedzi na pytanie o adres usługi i wejścia
    w środek połączeń wychodzących z tego serwera.
  en: |
    The setting bids the client of remote procedure calls authenticate itself already at the moment
    of asking under which number of port the sought service runs.

    The endpoint mapper is that mechanism's book of telephones. A service that starts announces
    itself to it and gets a port; a client that means to use it asks the mapper where to turn. That
    asking comes before the whole true speaking.

    The item bears on just that moment before the speaking. Without it the asking of the book of
    telephones goes unsigned, so the answer may be swapped along the way, or given in the true
    mapper's stead - and the client sent where one wills.

    It is an item bearing on the client's side, that is on what this server does when it reaches
    for other machines itself. On a managing server, or on a machine going round the whole server
    room by scripts, such askings are many and go to many places.

    I keep the category middling and give the reason. The sending of a client to a wrong address
    gives the attacker of itself neither a carrying out nor data - it gives them a place to stand
    in the middle of the true speaking. What comes of that hangs upon how the true speaking is
    guarded. The item makes an attack harder and does not block it, and so I reckon it.

    What an attacker gains while the item goes unmet: the means of swapping the answer to the
    asking after a service's address and of stepping into the middle of the connections going out
    of this server.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia i restartu maszyny — ustawienie
    wiąże dopiero po nim, a cofnięcie również. Na serwerze jest to
    zdarzenie planowane.

    Sprawdzenia wymaga to, do czego ten serwer sięga zdalnymi
    wywołaniami. Po zmianie połączenie powiedzie się tylko wtedy, gdy
    maper po drugiej stronie umie przyjąć uwierzytelnione zapytanie.

    Przypadek pierwszy to implementacje spoza świata Windows. Serwery
    plików i drukarek zbudowane na wolnym oprogramowaniu, macierze,
    urządzenia wbudowane — część z nich odpowiada wyłącznie na zapytania
    bez uwierzytelnienia i po zmianie przestanie być osiągalna z tej
    maszyny.

    Przypadek drugi to maszyny spoza domeny albo w domenie, z którą nie
    ma zaufania. Uwierzytelnienie wymaga wspólnej podstawy, a tam, gdzie
    jej nie ma, zapytanie nie przejdzie.

    Przypadek trzeci to sprzęt starszy: drukarki sieciowe, kontrolery,
    urządzenia, których oprogramowania wewnętrznego nikt już nie wydaje.

    Objaw jest trudny do powiązania ze zmianą i to jest główny koszt
    tego punktu. Połączenie nie kończy się odmową uwierzytelnienia —
    kończy się komunikatem o niedostępności punktu końcowego albo
    o braku odpowiedzi serwera. Ponieważ zmiana zadziałała dopiero po
    restarcie, między przyczyną a objawem leży ponowne uruchomienie
    maszyny, po którym podejrzewa się wszystko oprócz ustawienia.

    Dlatego wdrożenie ma sens tylko z listą rzeczy do sprawdzenia po
    restarcie i w oknie, w którym ktoś patrzy.

    Punkt czyta się razem z ograniczeniem klientów nieuwierzytelnionych.
    Tamten mówi, kogo ta maszyna obsłuży; ten — komu sama zaufa,
    pytając o drogę. Wdrażane razem, w jednym oknie, kosztują jeden
    restart zamiast dwóch.
  en: |
    The change takes a knowing rollout and a restart of the machine - the setting binds only after
    it, and its undoing likewise. On a server it is a planned happening.

    What needs checking is what this server reaches for by remote calls. After the change a
    connection will succeed only where the mapper on the other side can take an authenticated
    asking.

    The first case is carryings out from outside the world of Windows. Servers of files and
    printers built upon free software, arrays of disks, built-in devices - some of them answer
    askings without authentication alone, and after the change will stop being reachable from this
    machine.

    The second case is machines outside the domain, or in a domain with which there is no trust.
    Authentication takes a common ground, and where there is none the asking will not pass.

    The third case is older gear: network printers, controllers, devices whose inner software
    nobody ships any more.

    The symptom is hard to tie to the change and that is this item's chief cost. The connection
    does not end in a refusal of authentication - it ends in a message about an unreachable end
    point or about the server not answering. The change having taken effect only after the restart,
    between the cause and the symptom lies a starting of the machine anew, after which everything
    is suspected but the setting.

    Therefore the rollout has sense only with a list of things to check after the restart, and in a
    window where somebody is watching.

    The item is read together with the bounding of unauthenticated clients. That one says whom this
    machine will serve; this one - whom it will itself trust when asking the way. Rolled out
    together, in one window, they cost one restart instead of two.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
    - printing
  what_breaks:
    pl:
      - Sięganie do serwera plików albo drukarek spoza świata Windows przestanie działać z tej maszyny
      - Połączenie do maszyny spoza domeny albo z domeny bez zaufania nie zostanie nawiązane
      - Starszy sprzęt sieciowy bez aktualizacji oprogramowania wewnętrznego przestanie odpowiadać
      - Komunikat mówi o niedostępności punktu końcowego, a nie o odmowie uwierzytelnienia
      - Między przyczyną a objawem leży restart maszyny, więc podejrzewa się wszystko oprócz ustawienia
    en:
      - The reaching for a server of files or printers from outside the world of Windows will stop working from this machine
      - A connection to a machine outside the domain or from a domain with no trust will not be opened
      - Older network gear without shipped inner software will stop answering
      - The message speaks of an unreachable end point and not of a refusal of authentication
      - Between the cause and the symptom lies a restart of the machine, so everything is suspected but the setting
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer sięga do usług spoza świata Windows, których maper nie przyjmuje uwierzytelnionych zapytań
      - Nie ma okna serwisowego na restart i sprawdzenie skutków po nim
    en:
      - The server reaches for services from outside the world of Windows whose mapper takes no authenticated askings
      - There is no window of service for a restart and for the checking of the effects after it
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The key spells the last element as Rpc, not RPC as in the printing rules.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableAuthEpResolution'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    $current = (Get-ItemProperty -Path $path -Name 'EnableAuthEpResolution' -ErrorAction SilentlyContinue).'EnableAuthEpResolution'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableAuthEpResolution'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableAuthEpResolution' -Value 1 -Type DWord
    # The setting binds after a restart of the machine.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    # The former state returns after a restart of the machine.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/rpc-security

notes:
  pl: |
    Maper punktów końcowych jest książką telefoniczną mechanizmu
    zdalnych wywołań. Punkt dotyczy chwili przed właściwą rozmową:
    zapytania o to, pod jakim portem działa usługa.

    Kategoria średnia jest tu oceną, nie ostrożnością. Skierowanie
    klienta pod niewłaściwy adres nie daje samo w sobie ani wykonania,
    ani danych — daje miejsce, w którym można stanąć w środku właściwej
    rozmowy.

    Punkt dotyczy strony klienckiej: tego, co ten serwer robi, sięgając
    do innych maszyn.

    Wdrażaj razem z ograniczeniem klientów nieuwierzytelnionych — oba
    wiążą po restarcie, więc razem kosztują jeden restart zamiast dwóch.
  en: |
    The endpoint mapper is the book of telephones of the mechanism of remote calls. The item bears
    on the moment before the true speaking: the asking under which port a service runs.

    The middling category is here a reckoning and not caution. The sending of a client to a wrong
    address gives of itself neither a carrying out nor data - it gives a place to stand in the
    middle of the true speaking.

    The item bears on the client's side: on what this server does when reaching for other machines.

    Roll it out together with the bounding of unauthenticated clients - both bind after a restart,
    so together they cost one restart instead of two.
