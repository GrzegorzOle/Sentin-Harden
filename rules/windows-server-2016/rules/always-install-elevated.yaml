id: win2016-always-install-elevated

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Instalacja pakietów z podniesionymi uprawnieniami wyłączona
    en: Installation of packages with raised rights disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza ustawienie, po którym instalator pakietów uruchamia
    każdy pakiet z pełnymi uprawnieniami systemowymi, niezależnie od tego,
    kto go uruchomił.

    Trudno o ustawienie, które dawałoby tak wiele za tak mało. Po jego
    włączeniu dowolny użytkownik — w tym użytkownik bez żadnych uprawnień
    administracyjnych — uruchamia pakiet instalacyjny, a ten działa
    z uprawnieniami wyższymi niż konto administratora. Pakiet można
    przygotować samodzielnie, a to, co wykona, nie jest niczym ograniczone.

    Kategoria krytyczna i nie jest to ocena ostrożnościowa. To jest
    jednoetapowa droga od konta zwykłego do pełnej władzy nad maszyną,
    wykonalna bez żadnej luki i bez żadnego narzędzia poza tym, co system
    dostarcza sam.

    Powód, dla którego ustawienie to w ogóle bywa włączane, jest zwykle
    uzasadniony w zamiarze: chodzi o to, żeby użytkownik mógł zainstalować
    zatwierdzony program bez wołania administratora. Zamiar jest dobry,
    środek nie.

    Na serwerze 2016 rzecz warto sprawdzić mimo pozornej niemożliwości.
    Ustawienie to wędruje przez zasady grupy i trafia na serwery razem
    z zasadą pisaną kiedyś dla stanowisk.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne
    uprawnienia systemowe z konta dowolnego użytkownika, po uruchomieniu
    pakietu, który sam przygotował.
  en: |
    The item switches off a setting under which the package installer runs every
    package with full system rights, regardless of who started it.

    It is hard to find a setting that gives so much for so little. Once it is on,
    any user - including one with no administrative rights at all - starts an
    installation package, and it runs with rights higher than an administrator's
    account. The package can be prepared by that same person, and what it does is
    bounded by nothing.

    The critical category here is not a cautious call. This is a one-step road
    from an ordinary account to full power over the machine, workable with no
    flaw and no tool beyond what the system supplies itself.

    The reason the setting gets switched on at all is usually sound in intent: to
    let a user install an approved program without calling an administrator. The
    intent is good, the means is not.

    On Server 2016 it is worth checking despite looking impossible. The setting
    travels through group policy and reaches servers together with a policy
    written once for workstations.

    What an attacker gains while the item goes unmet: full system rights from any
    user's account, on running a package they prepared themselves.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" w przytłaczającej większości przypadków,
    bo ustawienie to jest domyślnie wyłączone i maszyna, na której go nie
    włączono, nie zauważy zmiany w ogóle.

    Tam, gdzie ustawienie jest włączone, zmiana będzie widoczna: użytkownicy
    bez uprawnień administracyjnych przestaną móc instalować pakiety.
    Wtedy jednak wracamy do pytania, po co je włączono — a odpowiedź
    „żeby użytkownik mógł instalować programy" jest właśnie tym, co ta
    reguła zamyka celowo.

    Zamiennik istnieje i jest znacznie węższy: wdrażanie wskazanych
    programów przez zasady grupy albo przez narzędzie zarządzające, które
    instaluje na koncie systemowym. Tam prawo do instalacji dotyczy
    konkretnych pakietów, a nie dowolnych.

    Czego to nie psuje: instalacji wykonywanych przez administratora,
    wdrożeń przez narzędzie zarządzające, aktualizacji systemu ani
    pakietów już zainstalowanych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption" in the overwhelming majority of cases, because
    the setting is off by default and a machine where it was never switched on
    will not notice the change at all.

    Where it is on, the change will show: users without administrative rights
    will no longer be able to install packages. But then we return to the
    question of why it was switched on - and the answer "so that a user can
    install programs" is precisely what this rule closes on purpose.

    A replacement exists and is far narrower: deploying named programs through
    group policy or through a management tool that installs under the system
    account. There the right to install concerns particular packages rather than
    any package.

    What this does not break: installations carried out by an administrator,
    deployments through a management tool, system updates, or packages already
    installed.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Użytkownik bez uprawnień administracyjnych przestaje móc instalować pakiety samodzielnie
      - Procedura licząca na to, że pakiet uruchomi się z pełnymi uprawnieniami bez podnoszenia ich, zatrzymuje się
      - Na maszynie z domyślnym ustawieniem zmiana nie ma żadnego widocznego skutku
      - Instalacje przez administratora, wdrożenia narzędziem zarządzającym i aktualizacje systemu działają bez zmian
    en:
      - A user without administrative rights can no longer install packages themselves
      - A procedure counting on a package running with full rights without elevating stops
      - On a machine with the default setting the change has no visible effect at all
      - Installations by an administrator, deployments through a management tool and system updates work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrażanie oprogramowania na tej maszynie opiera się wyłącznie na tym ustawieniu i nie przygotowano zamiennika
    en:
      - Software deployment on this machine rests solely on this setting and no replacement has been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    # Elevation happens only when BOTH hives are set, so both must be read.
    function Get-Flag($path) {
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { return $null }
      (Get-ItemProperty -Path $path -ErrorAction Stop).AlwaysInstallElevated
    }
    try {
      $m = Get-Flag 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $u = Get-Flag 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      if (($m -eq 1) -and ($u -eq 1)) { 'ENABLED' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^DISABLED$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'AlwaysInstallElevated'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the machine hive is written here. Elevation needs both hives, so
    # clearing this one is enough to close the route; an entry left in the user
    # hive does no harm on its own.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AlwaysInstallElevated' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/alwaysinstallelevated

notes:
  pl: |
    Podnoszenie uprawnień wymaga obu gałęzi naraz — maszynowej i użytkownika.
    Audyt czyta obie i zgłasza niezgodność tylko wtedy, gdy obie są ustawione,
    bo pojedynczy wpis sam z siebie nic nie robi.

    Naprawa zapisuje wyłącznie gałąź maszynową i to wystarcza do zamknięcia
    drogi. Gałąź użytkownika czytana jest w kontekście konta, na którym
    działa audyt, więc wynik dla innego zalogowanego konta może się różnić —
    warto o tym pamiętać przy raporcie z maszyny wieloużytkownikowej.

    Ustawienie bywa dziedziczone z zasad grupy. Zmiana wykonana lokalnie
    zostanie wtedy nadpisana przy następnym odświeżeniu zasad i to zasadę
    trzeba poprawić, a nie maszynę.
  en: |
    Elevation needs both hives at once - the machine's and the user's. The audit
    reads both and reports non-compliance only where both are set, because a
    single entry does nothing on its own.

    The remedy writes the machine hive alone and that is enough to close the
    road. The user hive is read in the context of the account the audit runs
    under, so the result for another signed-in account may differ - worth
    remembering in a report from a multi-user machine.

    The setting is sometimes inherited from group policy. A change made locally
    will then be overwritten at the next policy refresh, and it is the policy
    that has to be fixed rather than the machine.
