id: win10-pause-updates-access-removed

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Wstrzymywanie aktualizacji niedostępne dla użytkownika
    en: Pausing updates unavailable to the user
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Okno aktualizacji daje użytkownikowi przycisk wstrzymania. Wstrzymanie
    wygląda na chwilowe, ale liczy się w tygodniach i bywa przedłużane, bo powód
    jest zawsze ten sam: teraz nie w porę.

    Skutkiem jest maszyna bez poprawek, która w raporcie zgodności wygląda
    poprawnie — aktualizacje są włączone, tylko wstrzymane. Różnicę widać dopiero
    wtedy, gdy ktoś sprawdzi datę ostatniej zainstalowanej poprawki.

    Odebranie tego przycisku przenosi decyzję o rytmie poprawek tam, gdzie widać
    całość stanowisk, a nie jedno.
  en: |
    The update window gives the user a pause button. Pausing looks momentary but
    counts in weeks and tends to be extended, since the reason is always the same -
    not now.

    The consequence is a machine without fixes that looks proper in a compliance
    report - updates are switched on, merely paused. The difference shows only when
    somebody checks the date of the last fix installed.

    Taking that button away moves the decision about the rhythm of fixes to where
    the whole set of stations is visible rather than a single one.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo jest widoczna i dotyka poczucia kontroli nad
    własną maszyną. Przycisk znika z okna aktualizacji i zostaje komunikat o
    zarządzaniu przez organizację.

    Koszt jest realny tam, gdzie ponowne uruchomienie w złym momencie przerywa
    pracę: prezentacja, długie przeliczanie, nagranie. Wstrzymanie bywało właśnie
    na to używane. Przed wdrożeniem warto ustawić godziny aktywności, żeby odebrać
    przycisk i jednocześnie nie przerywać ludziom pracy.

    Wstrzymanie już włączone pozostaje w mocy do końca swojego okresu. Zasada
    odbiera możliwość ustawienia nowego, nie kończy trwającego.
  en: |
    The change calls for a review, since it is visible and touches the sense of
    control over one s own machine. The button vanishes from the update window,
    leaving a message about the organisation managing it.

    The cost is real where a restart at the wrong moment breaks the work - a
    presentation, a long calculation, a recording. Pausing used to be used for
    exactly that. Before the rollout it is worth setting active hours, so as to
    take the button away without breaking people s work.

    A pause already in force holds until its period ends. The rule takes away the
    ability to set a new one rather than ending one under way.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Przycisk wstrzymania aktualizacji zniknie z okna aktualizacji i zostanie zastąpiony komunikatem o zarządzaniu przez organizację
      - Użytkownik nie odsunie ponownego uruchomienia przed prezentacją ani przed długim przeliczaniem
      - Zgłoszenia o przerwanej pracy pojawią się tam, gdzie nie ustawiono godzin aktywności
      - Wstrzymanie już trwające pozostanie w mocy do końca swojego okresu
      - Rytm poprawek, wydania funkcji, aktualizacje aplikacji i praca użytkownika poza chwilą restartu pozostają bez zmian
    en:
      - The pause button vanishes from the update window and is replaced by a message about the organisation managing it
      - The user cannot push a restart back before a presentation or a long calculation
      - Reports of broken work appear wherever active hours have not been set
      - A pause already under way holds until its period ends
      - The rhythm of fixes, feature releases, application updates and user work outside the moment of a restart are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska prowadzące długie obliczenia albo nagrania, na których nie ustawiono godzin aktywności
      - Maszyny w terenie, łączące się z siecią organizacji rzadko i w nieprzewidywalnych porach
      - Środowiska, w których każdy zestaw poprawek przechodzi wcześniej przez maszynę kontrolną i wstrzymanie jest częścią tej procedury
    en:
      - Stations running long calculations or recordings, where active hours have not been set
      - Machines in the field, joining the organisation s network rarely and at unpredictable times
      - Environments where every set of fixes passes through a control machine first and pausing is part of that procedure
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'SetDisablePauseUXAccess'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $name = 'SetDisablePauseUXAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SetDisablePauseUXAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Zasada odbiera możliwość ustawienia nowego wstrzymania, a nie kończy tego,
    które już trwa. Wdrożenie warto poprzedzić ustawieniem godzin aktywności —
    inaczej koszt spada wprost na użytkownika w postaci restartu w złym momencie.
  en: |
    The rule takes away the ability to set a new pause rather than ending one
    already under way. The rollout is worth preceding with active hours being set -
    otherwise the cost falls straight on the user in the form of a restart at the
    wrong moment.
