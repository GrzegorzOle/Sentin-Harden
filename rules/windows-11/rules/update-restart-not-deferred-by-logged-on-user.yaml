id: win11-update-restart-not-deferred-by-logged-on-user

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Zalogowany użytkownik nie wstrzymuje restartu po aktualizacji
    en: A signed-in user does not hold back the post-update restart
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Część poprawek zaczyna działać dopiero po ponownym uruchomieniu — zwłaszcza
    te dotyczące jądra i sterowników, czyli akurat te, które łatają najpoważniejsze
    podatności. Do czasu restartu poprawka jest zainstalowana, ale nie chroni.

    Istnieje ustawienie, które każe systemowi odłożyć taki restart, gdy ktoś jest
    zalogowany, i poprzestać na przypomnieniu. Brzmi to jak uprzejmość wobec
    użytkownika i nią jest — tyle że jej ceną jest maszyna, która ma poprawkę
    i jej nie stosuje. Na stanowisku, z którego nikt się nie wylogowuje, taki stan
    potrafi trwać tygodniami.

    Najgorsze jest to, jak wygląda z zewnątrz. Poprawka figuruje jako
    zainstalowana, więc każde zestawienie stanu aktualizacji pokaże maszynę jako
    załataną. Różnicy między „zainstalowane" a „działa" nie widać nigdzie poza
    samą maszyną.
  en: |
    Some fixes only start working after a restart - especially those touching the
    kernel and drivers, which are exactly the ones patching the gravest
    weaknesses. Until the restart the fix is installed but does not protect.

    There is a setting that tells the system to put such a restart off while
    somebody is signed in, and settle for a reminder. It sounds like a courtesy
    to the user and it is one - except that its price is a machine that has the
    fix and does not apply it. On a station nobody signs out of, that state can
    last for weeks.

    The worst of it is how this looks from outside. The fix is recorded as
    installed, so every update-status summary will show the machine as patched.
    The difference between "installed" and "working" is visible nowhere but on
    the machine itself.

disruption_description:
  pl: |
    To jest punkt, który na pewno zmieni ludziom sposób pracy, i dlatego nie idzie
    hurtem ani bez uprzedzenia.

    Maszyna zostanie ponownie uruchomiona mimo zalogowanego użytkownika. System
    uprzedza i daje czas, ale ostatecznie restart następuje niezależnie od tego,
    co jest otwarte. Niezapisany dokument w programie, który nie odtwarza sesji,
    przepada. Długo liczący proces zostaje przerwany. Połączenie zdalne z inną
    maszyną urywa się.

    Boli to najmocniej tam, gdzie ludzie pracują poza godzinami — a więc
    dokładnie wtedy, gdy instalacja jest zaplanowana. Nocna zmiana, osoba
    w innej strefie czasowej i stanowisko zostawione z pracą na noc to trzy
    najczęstsze przypadki.

    Osobno trzeba wyłączyć maszyny, które nie są stanowiskami: komputery
    sterujące urządzeniami, stanowiska pomiarowe i wszystko, gdzie zalogowana
    sesja jest procesem, a nie człowiekiem.

    Wdrożenie wymaga uprzedzenia użytkowników i wskazania godziny instalacji —
    samo ustawienie bez tego kończy się zgłoszeniami o utraconej pracy.
  en: |
    This item will certainly change how people work, and so it does not go in bulk
    or without warning.

    The machine will be restarted despite a signed-in user. The system warns and
    allows time, but in the end the restart happens regardless of what is open. An
    unsaved document in a program that does not restore its session is lost. A
    long-running computation is cut short. A remote connection to another machine
    drops.

    It hurts most where people work outside hours - that is, exactly when the
    installation is scheduled. A night shift, somebody in another time zone and a
    station left working overnight are the three commonest cases.

    Machines that are not workstations have to be excluded separately: computers
    driving equipment, measurement stations, and anything where the signed-in
    session is a process rather than a person.

    Applying this requires warning users and naming the installation hour - the
    setting on its own, without that, ends in reports of lost work.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
    - remote-desktop
  what_breaks:
    pl:
      - Maszyna zostanie ponownie uruchomiona mimo zalogowanego użytkownika i otwartej pracy
      - Niezapisane dokumenty w programach bez odtwarzania sesji przepadną
      - Długo liczące procesy i otwarte połączenia zdalne zostaną przerwane
      - Stanowiska sterujące urządzeniami przerwą pracę urządzenia
    en:
      - The machine restarts despite a signed-in user and open work
      - Unsaved documents in programs without session restore are lost
      - Long-running computations and open remote connections are cut short
      - Stations driving equipment interrupt that equipment's work
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na stanowisku pracuje się poza godzinami, w których zaplanowano instalację
      - Zalogowana sesja jest procesem obsługującym urządzenie, a nie pracą człowieka
      - Nie da się uprzedzić użytkowników o godzinie ponownego uruchomienia
    en:
      - The station is worked at outside the hours the installation is scheduled for
      - The signed-in session is a process serving a device rather than a person's work
      - Users cannot be warned about the hour of the restart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'NoAutoRebootWithLoggedOnUsers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'NoAutoRebootWithLoggedOnUsers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutoRebootWithLoggedOnUsers' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-restart

notes:
  pl: |
    Wartość zerowa jest tu wymaganiem, bo ustawienie nazywa odkładanie restartu,
    a nie jego wykonywanie. Wyłączenie odkładania jest utwardzeniem i przy
    czytaniu raportu łatwo to odwrócić.

    Reguła ma klasę wymagającą świadomego wdrożenia mimo tego, że samo cofnięcie
    wartości jest natychmiastowe. Odwracalne jest ustawienie, a nie utracona
    praca użytkownika — a to drugie jest tym, co ten punkt naprawdę kosztuje.
    Jest to jedyna reguła w paczce, w której przerwa wynika nie z wdrożenia
    zmiany, lecz z tego, co ta zmiana dopuszcza później.
  en: |
    A value of zero is the requirement here, because the setting names the
    deferring of a restart rather than its performance. Turning the deferral off
    is the hardening, and that is easy to invert when reading the report.

    The rule carries the class requiring a planned rollout even though reverting
    the value itself is immediate. What is reversible is the setting, not the
    user's lost work - and the latter is what this item really costs. It is the
    only rule in the pack where the interruption arises not from applying the
    change but from what the change permits later.
