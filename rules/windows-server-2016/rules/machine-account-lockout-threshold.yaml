id: win2016-machine-account-lockout-threshold

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Próg nieudanych logowań kończący się wejściem w tryb odzyskiwania ustawiony
    en: A failed sign-in threshold ending in the recovery mode set
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zatrzymuje maszynę po ustalonej liczbie nieudanych prób
    zalogowania i wprowadza ją w tryb odzyskiwania szyfrowania dysku.

    Jest to reguła o innym charakterze niż blokada konta. Blokada konta
    zamyka jedno konto i nie rusza maszyny. To ustawienie zatrzymuje maszynę
    jako całość — po przekroczeniu progu system nie startuje dalej, dopóki
    ktoś nie poda klucza odzyskiwania.

    Broni przed atakiem prowadzonym przy klawiaturze, na maszynie, do której
    napastnik ma fizyczny dostęp. Zgadywanie haseł przy konsoli nie ma
    naturalnego ograniczenia: nie ma pośrednika, który by je liczył, nie ma
    sieci, w której dałoby się je zauważyć. Ten próg jest takim ogranicznikiem.

    Warunek jest jednak twardy i trzeba go powiedzieć wprost: ustawienie działa
    wyłącznie tam, gdzie dysk jest zaszyfrowany i gdzie uwierzytelnienie
    odbywa się przed startem systemu. Bez tego nie ma czego zatrzymywać ani
    czym odblokowywać, a wartość w rejestrze jest wpisem bez skutku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nieograniczoną
    liczbę prób przy konsoli maszyny, do której doszedł fizycznie.
  en: |
    The setting halts the machine after a set number of failed sign-in attempts and
    puts it into the disk encryption recovery mode.

    This is a rule of a different character from account lockout. Account lockout
    shuts one account and does not touch the machine. This setting halts the machine
    as a whole - past the threshold the system does not start further until somebody
    supplies the recovery key.

    It defends against an attack carried on at the keyboard, on a machine the
    attacker has physical access to. Guessing passwords at the console has no
    natural limit: there is no intermediary to count them, no network in which they
    might be noticed. This threshold is such a limiter.

    The condition is a hard one, though, and must be said outright: the setting
    works only where the disk is encrypted and where authentication takes place
    before the system starts. Without that there is nothing to halt and nothing to
    unlock with, and the value in the registry is an entry without effect.

    What an attacker gains while the item goes unmet: an unlimited number of
    attempts at the console of a machine they have reached physically.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedna z niewielu reguł
    w tym zestawie, która potrafi maszynę zatrzymać. Trzeba to powiedzieć na
    początku, a nie w przypisie.

    Wejście w tryb odzyskiwania nie jest blokadą, którą zdejmuje się zdalnie.
    Maszyna zatrzymuje się przed startem systemu, więc nie ma na niej sieci,
    nie ma zdalnego pulpitu i nie ma niczego, czym dałoby się ją obsłużyć
    inaczej niż stojąc przy niej z kluczem odzyskiwania. Na serwerze
    w oddziale albo w zdalnej serwerowni oznacza to przestój liczony w
    godzinach.

    Prowadzi to do dwóch rzeczy, które trzeba mieć przed wdrożeniem,
    a nie po nim. Pierwsza: klucz odzyskiwania musi być zapisany w miejscu
    dostępnym dla tego, kto ma do maszyny dojechać — w katalogu albo
    w systemie przechowywania haseł. Druga: musi istnieć procedura dojścia do
    tej maszyny, bo klucz w katalogu nie pomoże, jeśli nikt nie może otworzyć
    szafy.

    Osobno trzeba spojrzeć na konsolę hipernadzorcy. Wiele przypadków „kilku
    nieudanych prób" bierze się z pozostawionego otwartego okna konsoli,
    w którym ktoś przypadkiem wpisuje znaki. Próg dotyczy tych prób tak samo
    jak prób ataku.

    Czego to nie psuje: pracy usług, sesji zdalnych, logowania sieciowego ani
    kont domenowych — dopóki próg nie zostanie przekroczony.

    Wejście w tryb odzyskiwania wymaga obecności przy maszynie i klucza.
  en: |
    The class is "needs a planned rollout", and it is one of the few rules in this
    set that can halt the machine. That has to be said at the start, not in a
    footnote.

    Entering the recovery mode is not a lock that is lifted from afar. The machine
    halts before the system starts, so there is no network on it, no remote desktop,
    and nothing by which it might be handled other than standing at it with the
    recovery key. On a server in a branch or in a distant server room that means a
    stoppage reckoned in hours.

    This leads to two things that must be in place before the rollout rather than
    after it. First: the recovery key has to be kept somewhere reachable by whoever
    is to travel to the machine - in the directory or in a password store. Second: a
    procedure for reaching that machine has to exist, since a key in the directory
    will not help if nobody can open the cabinet.

    The hypervisor's console has to be looked at separately. Many a case of "a few
    failed attempts" comes from a console window left open in which somebody types
    characters by accident. The threshold covers those attempts just as it covers
    attempts at attack.

    What this does not break: the working of services, remote sessions, network
    sign-in, or domain accounts - so long as the threshold is not passed.

    Coming out of the recovery mode calls for presence at the machine and the key.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Po przekroczeniu progu maszyna zatrzymuje się przed startem systemu i nie da się jej obsłużyć zdalnie
      - Wyjście z trybu odzyskiwania wymaga obecności przy maszynie i klucza odzyskiwania
      - Znaki wpisane przypadkiem w pozostawione okno konsoli hipernadzorcy liczą się do progu tak samo jak próby ataku
      - Praca usług, sesje zdalne i logowanie sieciowe pozostają bez zmian, dopóki próg nie zostanie przekroczony
    en:
      - Past the threshold the machine halts before the system starts and cannot be handled from afar
      - Coming out of the recovery mode calls for presence at the machine and the recovery key
      - Characters typed by accident into a hypervisor console window left open count towards the threshold like attempts at attack
      - The working of services, remote sessions and network sign-in stay unchanged so long as the threshold is not passed
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dysk nie jest zaszyfrowany albo uwierzytelnienie nie odbywa się przed startem systemu — ustawienie nie ma wtedy skutku
      - Klucz odzyskiwania nie jest zapisany w miejscu dostępnym dla osoby, która ma do maszyny dojechać
      - Maszyna stoi w lokalizacji bez procedury fizycznego dostępu w rozsądnym czasie
    en:
      - The disk is not encrypted or authentication does not take place before the system starts - the setting then has no effect
      - The recovery key is not kept somewhere reachable by the person who is to travel to the machine
      - The machine stands in a location with no procedure for physical access within a reasonable time
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero switches the threshold off altogether. It must not pass an upper bound
      # comparison as if it were the smallest allowed number of attempts.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'MaxDevicePasswordFailedAttempts'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      elseif ([int]$value -eq 0) { 'NEVER' }
      else { [string][int]$value }
    } catch {
      'CHECK_ERROR'
    }
  expected: '10'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'MaxDevicePasswordFailedAttempts'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Ten is the upper bound the item allows and it is set knowingly: on a server
    # every lowering brings a halt from a mistyped password nearer, and the way out
    # of that halt takes a person with the recovery key.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxDevicePasswordFailedAttempts' -Value 10 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-machine-account-lockout-threshold

notes:
  pl: |
    Audyt zgłasza zero jako osobny stan, a nie jako liczbę. Zero wyłącza próg
    całkowicie i przy porównaniu „nie więcej niż" przeszłoby jako wartość
    najostrzejsza z możliwych — czyli wyłączone zabezpieczenie zostałoby
    zaraportowane jako wzorowa zgodność.

    Reguła nie sprawdza, czy dysk jest zaszyfrowany, a bez tego ustawienie nie
    robi nic. Wynik zgodny nie jest więc dowodem, że maszyna jest przed czymś
    chroniona — jest dowodem, że wartość jest ustawiona. Aplikacja powinna
    pokazywać ten punkt razem z regułami o szyfrowaniu dysku i nie liczyć go
    jako wygranej w oderwaniu od nich.

    Wartością wpisywaną jest dziesięć, czyli górna granica. Obniżanie jej na
    serwerze kupuje niewiele, a każde obniżenie przybliża zatrzymanie maszyny
    z powodu pomyłki przy wpisywaniu.
  en: |
    The audit reports zero as a state apart, not as a number. Zero switches the
    threshold off altogether and under a "not greater than" comparison would pass as
    the strictest value possible - which is to say a switched-off safeguard would be
    reported as exemplary compliance.

    The rule does not check whether the disk is encrypted, and without that the
    setting does nothing. A compliant result is therefore no proof that the machine
    is guarded against anything - it is proof that a value is set. The application
    should show this item together with the disk encryption rules and not count it
    as a win apart from them.

    The value written is ten, the upper bound. Lowering it on a server buys little,
    and every lowering brings nearer a halt of the machine caused by a slip in
    typing.
