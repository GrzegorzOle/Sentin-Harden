id: win2025-anonymous-sam-enumeration

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Anonimowe wyliczanie kont zablokowane
    en: Anonymous enumeration of accounts blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje odczytania listy kont tej maszyny przez połączenie,
    które nie podało żadnych poświadczeń.

    Mechanizm, o który tu chodzi, pochodzi z czasów, gdy komputery w sieci
    lokalnej musiały móc zapytać się nawzajem o listę użytkowników, żeby
    móc nadać uprawnienia do zasobów. Zapytanie takie nie wymaga zalogowania
    — nawiązuje się je jako połączenie puste i odpowiedź dostaje każdy,
    kto potrafi je wysłać.

    Na serwerze odpowiedź ta jest cenniejsza niż na stanowisku roboczym.
    Lista kont serwera to lista kont usługowych, kont administracyjnych
    i kont utworzonych przez zainstalowane aplikacje — a nazwy tych kont
    mówią wprost, co na maszynie działa. Napastnik dostaje w jednym
    zapytaniu spis celów oraz rozpoznanie, czego szukać dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwy kont,
    czyli pierwszą połowę każdej pary potrzebnej do logowania, i to bez
    żadnego uwierzytelnienia. Zgadywanie haseł zaczyna się wtedy od listy
    prawdziwych nazw, a nie od zgadywania, kto na tej maszynie istnieje.

    Punkt nie zamyka drogi wejścia, tylko drogę rozpoznania — i to właśnie
    rozpoznanie decyduje, ile atak kosztuje.
  en: |
    The setting bans the reading of this machine's list of accounts by a connection that has
    given no credentials.

    The mechanism at issue here comes from days when computers on a local network had to be
    able to ask one another for a list of users in order to grant rights to resources. Such
    a query takes no signing in - it is set up as an empty connection and the answer goes to
    anyone able to send it.

    On a server that answer is worth more than at a working station. A server's list of
    accounts is a list of service accounts, administrative accounts and accounts made by the
    installed applications - and those accounts' names say outright what runs on the
    machine. An attacker gets in one query a list of targets along with the reconnaissance
    of what to look for next.

    What an attacker gains while the item goes unmet: the accounts' names, that is the first
    half of every pair needed for signing in, and that with no authentication at all.
    Password guessing then begins from a list of true names rather than from guessing who
    exists on this machine.

    The item closes no road in, only the road of reconnaissance - and it is reconnaissance
    that settles what an attack costs.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z anonimowego wyliczania kont korzysta coś,
    co na tym serwerze albo wokół niego pracuje.

    W sieci utrzymywanej współcześnie nie korzysta z niego nic i wdrożenie
    przechodzi niezauważone. Korzystają z niego natomiast konfiguracje
    zaszłe: relacje zaufania między domenami zestawione dawno temu,
    starsze narzędzia inwentaryzacyjne odpytujące maszyny bez poświadczeń,
    a także oprogramowanie nadające uprawnienia przez wskazanie konta
    z listy pobranej zdalnie.

    Objawem jest pusta lista tam, gdzie wcześniej była pełna — narzędzie
    nie zgłosi błędu, tylko pokaże, że kont nie ma. Jest to objaw gorszy od
    błędu, bo wygląda na stan faktyczny i bywa interpretowany jako awaria
    maszyny zdalnej.

    Dostęp uwierzytelniony nie zmienia się w niczym. Wszystko, co łączy
    się z podanym kontem, działa dalej tak samo.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anything working on or around this server uses the
    anonymous enumeration of accounts.

    On a network kept up to date nothing uses it and the rollout passes unnoticed. What does
    use it are legacy configurations: trust relations between domains set up long ago, older
    inventory tools querying machines with no credentials, and software granting rights by
    pointing at an account from a list fetched remotely.

    The symptom is an empty list where a full one was before - the tool will report no error
    but will show that there are no accounts. That is a worse symptom than an error, since
    it looks like the state of fact and is at times read as a fault of the remote machine.

    Authenticated access does not change in any way. Everything connecting with an account
    given goes on working the same.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Narzędzia inwentaryzacyjne odpytujące maszynę bez poświadczeń widzą pustą listę kont
      - Pusta lista nie jest zgłaszana jako błąd i bywa brana za stan faktyczny
      - Starsze relacje zaufania między domenami mogą przestać się zestawiać
      - Dostęp z podanymi poświadczeniami działa bez zmiany
    en:
      - Inventory tools querying the machine with no credentials see an empty list of accounts
      - An empty list is not reported as an error and is at times taken for the state of fact
      - Older trust relations between domains may stop being set up
      - Access with credentials given works unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie inwentaryzacyjne pobiera listę kont tej maszyny bez poświadczeń
      - Serwer uczestniczy w relacji zaufania zestawionej na połączeniu anonimowym
    en:
      - An inventory tool fetches this machine's list of accounts with no credentials
      - The server takes part in a trust relation set up on an anonymous connection
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictAnonymousSAM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'RestrictAnonymousSAM' -ErrorAction SilentlyContinue).'RestrictAnonymousSAM'
    [pscustomobject]@{
      path        = $path
      name        = 'RestrictAnonymousSAM'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictAnonymousSAM' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts

notes:
  pl: |
    Ustawienie dotyczy wyliczania kont. Wyliczanie udziałów opisuje wartość
    sąsiednia w tym samym kluczu i jest ono osobnym punktem benchmarku —
    spełnienie tego punktu nie zamyka tamtej drogi.

    Punkt bywa uznawany za spełniony domyślnie, bo w nowszych systemach tak
    bywa. Audyt mimo to wymaga zapisu, bo stan domyślny jest cechą wersji
    systemu, a nie decyzją administratora.

    Na kontrolerze domeny znaczenie punktu jest inne niż na serwerze
    członkowskim: kontroler przechowuje konta całej domeny, więc odpowiedź
    na anonimowe zapytanie jest tam nieporównanie obszerniejsza. Jest to
    argument za wdrożeniem, nie przeciw — ale też powód, dla którego
    zaszłości w rodzaju starych relacji zaufania spotyka się właśnie tam.
  en: |
    The setting concerns the enumeration of accounts. The enumeration of shares is described
    by a neighbouring value in the same key and is a separate item of the benchmark - meeting
    this item does not close that road.

    The item is at times held met by default, since in newer systems it sometimes is. The
    audit all the same takes a record, since a default state is a trait of the system's
    version rather than an administrator's decision.

    On a domain controller the item's meaning differs from that on a member server: a
    controller keeps the accounts of the whole domain, so the answer to an anonymous query
    is beyond comparison fuller there. That is an argument for the rollout rather than
    against - but also the reason legacies such as old trust relations are met exactly
    there.
