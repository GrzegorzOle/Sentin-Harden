# Słowniki kontrolowane.
#
# Reguły używają WYŁĄCZNIE wartości stąd. Dowolny tekst w tych polach oznacza,
# że po polu nie da się filtrować ani sortować, a raporty przestają być
# porównywalne między systemami.
#
# Wartości są bez polskich znaków i bez spacji — służą maszynie. Etykiety dla
# użytkownika żyją w warstwie interfejsu, nie tutaj.

# Kategoria ryzyka: ile realnie daje wdrożenie punktu, czyli co zyskuje
# atakujący, gdy punkt pozostaje niespełniony.
# Ocena własna. NIE wyprowadzać jej z poziomu L1/L2 benchmarku.
kategoria_ryzyka:
  - krytyczne   # otwarta droga do przejęcia systemu lub poświadczeń, nadużywana w praktyce
  - wysokie     # istotne utrudnienie eskalacji, ruchu bocznego lub utrzymania dostępu
  - srednie     # utwardzenie zawężające pole manewru albo zwiększające wykrywalność
  - niskie      # porządek i spójność konfiguracji

# Czy zmianę wolno zastosować zbiorczo, bez decyzji o każdym punkcie osobno.
uciazliwosc:
  - bez-uciazliwosci            # nikt nie zauważy; JEDYNA klasa dopuszczona do trybu zbiorczego
  - wymaga-sprawdzenia          # uderza w dające się wskazać scenariusze
  - wymaga-swiadomego-wdrozenia # zmienia sposób pracy, okno serwisowe, uprzedzenie użytkowników

# Pusta lista skutków nie może znaczyć "bezpieczne" — to są trzy różne rzeczy.
# Reguła nieoceniona nie może mieć uciazliwosc: bez-uciazliwosci.
stan_oceny:
  - oceniono-brak-wplywu
  - oceniono-wplyw-opisany
  - nieocenione

# Czy wdrożenie wymaga przerwy w pracy.
przerwa:
  - brak
  - wylogowanie
  - restart-uslugi
  - restart-systemu

odwracalnosc:
  - natychmiastowa
  - po-restarcie
  - trudna

uprawnienia:
  - uzytkownik
  - administrator
  - root

powloka:
  - powershell
  - bash

# Wynik pojedynczego sprawdzenia.
# Niemożność sprawdzenia to ERROR albo NOT_APPLICABLE — nigdy FAIL.
wynik_audytu:
  - PASS
  - FAIL
  - ERROR
  - NOT_APPLICABLE

# Status punktu w raporcie. Trzeci stan odróżnia świadomą decyzję od zaniedbania.
status_punktu:
  - spelnione
  - niespelnione
  - ryzyko-zaakceptowane
