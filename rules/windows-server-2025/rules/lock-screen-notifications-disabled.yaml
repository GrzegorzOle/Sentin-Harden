id: win2025-lock-screen-notifications-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Powiadomienia aplikacji na ekranie blokady wyłączone
    en: Application notifications on the lock screen disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wyświetlanie powiadomień aplikacji na ekranie blokady.

    Kategoria średnia, a rzecz sprowadza się do jednego zdania: ekran
    blokady jest widoczny dla kogoś, kto nie podał hasła. Wszystko, co się
    na nim pojawia, jest z definicji dostępne bez uwierzytelnienia — więc
    pytanie nie brzmi „czy ktoś to zobaczy", tylko „co tam trafia".

    Na serwerze trafia tam treść węższa niż na stanowisku, ale nie mniej
    czytelna. Powiadomienie narzędzia obsługowego podaje nazwę zadania
    i jego wynik. Powiadomienie o kopii zapasowej podaje, co i dokąd
    skopiowano. Powiadomienie o certyfikacie podaje nazwę usługi
    i termin. To nie jest treść dokumentu, ale jest to opis tego, co na tej
    maszynie się dzieje i czym ona jest — czytelny dla kogoś, kto po prostu
    stoi przy konsoli.

    Osobno warto nazwać kontekst serwerowy: konsola maszyny wirtualnej jest
    dostępna każdemu, kto ma dostęp do panelu wirtualizacji, a ten dostęp
    bywa szerszy niż dostęp do samego serwera. Ekran blokady serwera jest
    więc widoczny w miejscach, o których przy stanowisku roboczym nie
    trzeba było myśleć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: strumień
    informacji o pracy serwera, czytany bez podania jakiegokolwiek hasła.
  en: |
    The item switches off the display of application notifications on the
    lock screen.

    The category is medium, and the matter comes down to one sentence: the
    lock screen is visible to somebody who has given no password. Everything
    appearing on it is by definition available without authentication - so
    the question is not whether somebody will see it, but what lands there.

    On a server what lands there is narrower than on a workstation, but no
    less legible. A management tool's notification gives a task's name and
    its result. A backup notification gives what was copied and where. A
    certificate notification gives a service's name and a date. That is not
    the content of a document, but it is a description of what happens on
    this machine and what it is - legible to somebody merely standing at the
    console.

    The server context is worth naming separately: a virtual machine's
    console is available to anybody with access to the virtualisation panel,
    and that access is sometimes wider than access to the server itself. A
    server's lock screen is therefore visible in places one did not have to
    think about with a workstation.

    What an attacker gains while the item goes unmet: a stream of information
    about the server's work, read without any password being given.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i uzasadnienie jest tu nietypowe, bo strata
    nie dotyczy pracy, tylko sposobu, w jaki ktoś się o czymś dowiaduje.

    Zdarza się, że administrator używa ekranu blokady jako tablicy: zostawia
    zalogowaną konsolę serwera na drugim ekranie i kątem oka widzi, czy coś
    się nie dzieje. Po zmianie ten sposób pracy przestaje działać —
    powiadomienia będą, ale dopiero po zalogowaniu. Jeżeli ktoś tak pracuje,
    trzeba mu dać zamiennik, a nie odebrać źródło informacji. Zamiennikiem
    jest monitorowanie, nie ekran blokady, i to jest właściwe miejsce na tę
    rozmowę.

    Czego to nie psuje: samych powiadomień. Aplikacje działają, powiadomienia
    powstają, są widoczne po zalogowaniu i trafiają do dziennika, jeśli
    aplikacja tak robi. Nie znika informacja, tylko miejsce, w którym
    wyświetla się ją osobie niezalogowanej.

    Rzecz do zapamiętania: wpis leży w gałęzi systemowej, razem z zupełnie
    niepokrewnymi ustawieniami, a nie w gałęzi personalizacji, gdzie leżą
    pozostałe punkty o ekranie blokady. Przy ręcznym przeglądzie łatwo go
    szukać nie tam, gdzie jest.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the justification here is unusual,
    because the loss concerns not work but the way somebody comes to know
    something.

    It happens that an administrator uses the lock screen as a board: they
    leave the server's console on a second screen and see out of the corner
    of an eye whether anything is going on. After the change that way of
    working stops - the notifications will exist, but only after signing in.
    If somebody works like that, they should be given a replacement rather
    than have their source of information taken away. The replacement is
    monitoring, not a lock screen, and that is the right place for the
    conversation.

    What this does not break: the notifications themselves. Applications
    work, notifications arise, they are visible after signing in and they go
    into the log if the application does that. No information disappears -
    only the place where it is shown to somebody not signed in.

    Something to remember: the entry lies in the system branch, among wholly
    unrelated settings, and not in the personalisation branch where the other
    lock screen items live. In a manual review it is easy to look for it
    where it is not.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Kto używa ekranu blokady serwera jako tablicy z bieżącym stanem, przestanie widzieć powiadomienia bez zalogowania
      - Aplikacje działają, powiadomienia powstają i są widoczne po zalogowaniu — znika miejsce, nie informacja
      - Zamiennikiem dla takiego sposobu pracy jest monitorowanie, nie ekran blokady
      - Wpis leży w gałęzi systemowej, a nie w gałęzi personalizacji z pozostałymi punktami o ekranie blokady
    en:
      - Anybody using the server's lock screen as a board showing the current state stops seeing notifications without signing in
      - Applications work, notifications arise and are visible after signing in - the place goes, not the information
      - The replacement for that way of working is monitoring, not a lock screen
      - The entry lies in the system branch, not in the personalisation branch with the other lock screen items
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zespół obsługi opiera bieżący nadzór nad maszyną na powiadomieniach widocznych na ekranie blokady i nie ma jeszcze monitorowania
    en:
      - The operations team relies on notifications visible on the lock screen for day-to-day oversight and has no monitoring yet
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This entry lies in the system branch, not with the other lock screen
      # items in the personalisation branch.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'DisableLockScreenAppNotifications'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'DisableLockScreenAppNotifications'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The lock screen is visible to somebody who gave no password, and on a
    # virtual machine its console reaches everybody with access to the
    # virtualisation panel. Notifications still arise and are visible after
    # signing in - the place goes, not the information.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLockScreenAppNotifications' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-abovelock

notes:
  pl: |
    Ekran blokady jest widoczny dla kogoś, kto nie podał hasła. Wszystko, co
    się na nim pojawia, jest z definicji dostępne bez uwierzytelnienia —
    pytanie nie brzmi „czy ktoś to zobaczy", tylko „co tam trafia".

    Na serwerze trafiają tam nazwy zadań i ich wyniki, informacje o kopiach
    zapasowych, nazwy usług i terminy certyfikatów. To opis tego, czym ta
    maszyna jest i co się na niej dzieje.

    Kontekst serwerowy: konsola maszyny wirtualnej jest dostępna każdemu,
    kto ma dostęp do panelu wirtualizacji, a ten dostęp bywa szerszy niż
    dostęp do samego serwera.
  en: |
    The lock screen is visible to somebody who has given no password.
    Everything appearing on it is by definition available without
    authentication - the question is not whether somebody will see it, but
    what lands there.

    On a server what lands there are task names and their results, backup
    information, service names and certificate dates. That is a description
    of what this machine is and what happens on it.

    The server context: a virtual machine's console is available to anybody
    with access to the virtualisation panel, and that access is sometimes
    wider than access to the server itself.
