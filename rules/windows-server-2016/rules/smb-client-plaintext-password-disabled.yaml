id: win2016-smb-client-plaintext-password-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wysyłanie hasła otwartym tekstem do obcych serwerów plików zabronione
    en: Sending a password in clear text to outside file servers forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania części klienckiej udostępniania plików wysyłać
    hasło w postaci nieszyfrowanej do serwerów spoza rodziny systemu.

    Mechanizm ten pochodzi z czasów, gdy udostępnianie plików obsługiwały
    także urządzenia i systemy obce, a nie wszystkie z nich potrafiły
    uwierzytelnić się mechanizmem wyzwanie-odpowiedź. Przewidziano więc
    ustępstwo: gdy druga strona zgłosi, że nie umie inaczej, klient wyśle
    hasło otwartym tekstem.

    Rzecz w tym, kto decyduje o skorzystaniu z ustępstwa. Decyduje strona
    odpowiadająca. Wystarczy, że serwer po drugiej stronie — albo maszyna,
    która się pod niego podstawiła — oświadczy, że mocniejszego mechanizmu
    nie obsługuje, a klient sam obniży wymagania.

    Uzyskane w ten sposób hasło nie jest skrótem wymagającym łamania.
    Jest hasłem, i to zwykle hasłem konta, które ma dostęp do zasobów
    plikowych organizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło konta
    w postaci jawnej, uzyskane przez zwykłe oświadczenie, że nie obsługuje
    się nic mocniejszego.
  en: |
    The setting forbids the client side of file sharing to send a password
    unencrypted to servers outside the system's family.

    That mechanism comes from the days when file sharing was served also by outside
    devices and systems, and not all of them could authenticate by a
    challenge-response mechanism. So a concession was foreseen: where the other side
    reports it cannot do otherwise, the client sends the password in clear text.

    The matter is who decides to make use of the concession. The answering side
    decides. It is enough for the server at the other end - or a machine that has
    stood in for it - to declare it does not support a stronger mechanism, and the
    client will lower its demands itself.

    A password had that way is no hash calling to be broken. It is the password, and
    as a rule the password of an account with access to the organisation's file
    resources.

    What an attacker gains while the item goes unmet: an account's password in the
    open, had by a simple declaration that nothing stronger is supported.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest wartością domyślną systemu i była nią na długo
    przed tym wydaniem. Wysyłanie hasła otwartym tekstem trzeba włączyć
    rozmyślnie i nikt tego nie robi przypadkiem.

    Urządzenia, dla których to ustępstwo powstało, praktycznie zniknęły.
    Współczesne macierze plikowe, urządzenia wielofunkcyjne i implementacje
    udostępniania plików na innych systemach obsługują mechanizmy
    uwierzytelniania wprowadzone dwadzieścia lat temu.

    Jeżeli na maszynie stoi coś, co naprawdę wymaga hasła otwartym tekstem,
    problemem nie jest ta reguła, tylko to urządzenie. Hasło wysyłane
    w postaci jawnej jest hasłem ujawnionym każdemu, kto ma dostęp do
    segmentu sieci, niezależnie od ustawień tej maszyny.

    Bez restartu, bez wylogowania, bez zatrzymania usługi. Użytkownik
    niczego nie zobaczy.

    Czego to nie psuje: dostępu do udziałów plikowych, logowania,
    drukowania, usług.
  en: |
    The class is "no disruption".

    The required value is the system's default and was so long before this release.
    Sending a password in clear text has to be switched on deliberately and nobody
    does it by accident.

    The devices the concession was made for have practically vanished. Present-day
    file arrays, multifunction devices and implementations of file sharing on other
    systems support authentication mechanisms brought in twenty years ago.

    If something truly calling for a clear-text password stands on the machine, the
    trouble is not this rule but that device. A password sent in the open is a
    password disclosed to everybody with access to the network segment, whatever
    this machine's settings.

    No restart, no sign-out, no stopping of a service. The user will see nothing.

    What this does not break: access to file shares, signing in, printing, or
    services.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - drivers-and-devices
  what_breaks:
    pl:
      - Urządzenie, które naprawdę wymaga hasła otwartym tekstem, przestanie przyjmować połączenia plikowe z tej maszyny
      - Przypadek taki jest dziś rzadkością i wskazuje na urządzenie do wymiany, a nie na regułę do odpuszczenia
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
      - Dostęp do udziałów plikowych, logowanie i drukowanie pozostają bez zmian
    en:
      - A device truly calling for a clear-text password will stop taking file connections from this machine
      - Such a case is a rarity today and points to a device for replacing rather than to a rule for letting go
      - No restart, no sign-out, no stopping of a service
      - Access to file shares, signing in and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna łączy się z urządzeniem, które nie obsługuje żadnego mechanizmu uwierzytelniania poza hasłem otwartym tekstem, i nie da się go teraz wymienić
    en:
      - The machine connects to a device supporting no authentication mechanism beyond a clear-text password and it cannot be replaced now
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $name = 'EnablePlainTextPassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    $name = 'EnablePlainTextPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnablePlainTextPassword' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-client-send-unencrypted-password-to-third-party-smb-servers

notes:
  pl: |
    Punkt jest w tym bloku jedynym z klasy „bez uciążliwości" obok reguły
    o odświeżaniu zasad w tle i nadaje się do trybu zbiorczego.

    Warto zwrócić uwagę na nazwę wpisu. Nosi on nazwę opisującą włączenie
    ustępstwa, więc wartością wymaganą jest zero. Jest to kolejny punkt
    w zestawie, w którym zero oznacza stan pożądany.

    Wskazanie „obce serwery" w tytule pochodzi z zalecenia i bywa mylące.
    Ustępstwo dotyczy każdego serwera, który zgłosi, że mocniejszego
    mechanizmu nie obsługuje — a zgłosić to może każdy, w tym maszyna
    podstawiona. Ograniczenie do serwerów obcych jest deklaracją
    zamierzenia, nie warunkiem sprawdzanym przez maszynę.
  en: |
    The item is in this block the only one of the class "no disruption" beside the
    rule about refreshing policy in the background, and is fit for bulk mode.

    Worth noting the entry's name. It bears a name describing the switching on of
    the concession, so the required value is zero. It is another item in the set
    where zero means the wanted state.

    The naming of "outside servers" in the title comes from the recommendation and is
    at times misleading. The concession touches any server that reports it does not
    support a stronger mechanism - and anybody can report that, a machine standing in
    among them. Limiting it to outside servers is a statement of intent, not a
    condition the machine checks.
