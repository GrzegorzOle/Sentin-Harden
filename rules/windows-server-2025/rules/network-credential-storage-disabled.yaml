id: win2025-network-credential-storage-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie poświadczeń do uwierzytelniania sieciowego wyłączone
    en: Storage of credentials for network authentication disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zapisywania na tej maszynie poświadczeń
    służących do uwierzytelniania sieciowego — czyli tego, co system
    trzyma pod nazwą zapamiętanych haseł do zasobów.

    Poświadczenie zapisane leży na dysku w postaci zaszyfrowanej,
    ale szyfrowanie to jest powiązane z kontem, które je zapisało.
    Znaczy to, że kto uzyskał kontrolę nad tym kontem, ten odczyta
    poświadczenie bez łamania czegokolwiek — system odszyfruje je dla
    niego, bo z jego punktu widzenia jest to właściciel.

    Wartość tych zapisów dla napastnika polega na tym, że wskazują
    dalej. Poświadczenie zapisane nie służy tej maszynie, tylko innej:
    udziałowi na serwerze plików, urządzeniu, usłudze. Zbiór zapisanych
    poświadczeń jest więc mapą tego, dokąd stąd prowadzi droga, wraz
    z kluczami.

    Na serwerze zapisy te bywają cenniejsze niż na stanowisku roboczym,
    bo należą do kont o szerszych uprawnieniach. Poświadczenie
    zapamiętane przez administratora przy podłączaniu udziału albo
    przez konto usługowe przy konfiguracji zadania jest kluczem
    administracyjnym leżącym na dysku.

    Punkt należy do poziomu drugiego, więc jest utwardzeniem, a nie
    wymaganiem podstawowym — i słusznie, bo koszt jest tu realny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykaz
    zasobów osiągalnych z tej maszyny wraz z poświadczeniami do nich,
    możliwymi do odczytania po przejęciu konta, które je zapisało.
  en: |
    The setting forbids the writing on this machine of credentials serving network
    authentication - that is, what the system keeps under the name of remembered passwords to
    resources.

    A credential written down lies on the disk in an encrypted form, but that encryption is tied
    to the account that wrote it. That means whoever won sway over that account will read the
    credential without breaking anything - the system will unriddle it for them, they being from
    its point of view the owner.

    The worth of those records to an attacker lies in their pointing onwards. A credential
    written down does not serve this machine but another: a share on a file server, a device, a
    service. The gathering of written credentials is thus a map of where the road leads from
    here, together with the keys.

    On a server those records are at times worth more than at a working station, belonging to
    accounts of wider rights. A credential remembered by an administrator at the attaching of a
    share, or by a service account at the setting up of a job, is an administrative key lying on
    a disk.

    The item belongs to the second level, so it is a hardening rather than a base requirement -
    and rightly, the cost being real here.

    What an attacker gains while the item goes unmet: a list of the resources reachable from
    this machine together with the credentials to them, readable once the account that wrote
    them is taken.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, co na tym serwerze korzysta dziś
    z poświadczeń zapamiętanych, bo po zmianie nie będzie mogło ich
    zapisać ani odczytać.

    Skutek jest tu realny i dlatego punkt należy do poziomu drugiego.
    Nie jest to utwardzenie niewidoczne.

    Przypadkiem pierwszym są dyski podłączane przy logowaniu do
    zasobów spoza domeny. Poświadczenie do takiego zasobu zapamiętuje
    się raz i nie wraca do niego — po zmianie system zapyta o nie przy
    każdym połączeniu, a w sesji nieinteraktywnej po prostu odmówi.

    Przypadkiem drugim są zadania harmonogramu i skrypty sięgające do
    zasobów zdalnych. Jeżeli opierają się na poświadczeniu
    zapamiętanym, przestaną działać — i zrobią to cicho, bo zadanie
    zgłosi niepowodzenie do własnego dziennika, a nie użytkownikowi.

    Przypadkiem trzecim jest kopia zapasowa zapisująca na udziale
    sieciowym z poświadczeniem zapisanym przy konfiguracji.

    Właściwym rozwiązaniem jest przekazywanie poświadczeń w sposób
    przeznaczony do zadań nienadzorowanych — kontem usługowym
    zarządzanym przez domenę albo skarbcem poświadczeń — a nie powrót
    do zapisywania ich na maszynie.

    Zmiana nie usuwa poświadczeń już zapisanych. Przestają one być
    odczytywane, ale pozostają na dysku do czasu ich usunięcia, więc
    po naprawie warto je przejrzeć i skasować.

    Zmiana nie wymaga przerwy i dotyczy prób zapisu oraz odczytu
    podejmowanych po niej.
  en: |
    What needs checking is what on this server uses remembered credentials today, since after
    the change it will be able neither to write nor to read them.

    The effect is real here, and hence the item belongs to the second level. It is no unseen
    hardening.

    The first case is drives attached at sign-in to resources outside the domain. A credential
    to such a resource is remembered once and never returned to - after the change the system
    will ask for it at every connection, and in a session with nobody present will simply
    refuse.

    The second case is the scheduler's jobs and scripts reaching for remote resources. Where
    they rest on a remembered credential, they will stop working - and will do so quietly, the
    job reporting its failure to a log of its own rather than to a person.

    The third case is a backup writing to a network share with a credential written at its
    setting up.

    The right answer is the passing of credentials in the way meant for unwatched tasks - a
    service account managed by the domain, or a credential vault - rather than a return to
    writing them on the machine.

    The change does not clear credentials already written. They stop being read but stay on the
    disk until they are removed, so it is worth looking them over and clearing them after the
    mending.

    The change takes no break and bears on tries at writing and reading made after it.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - scripting-and-automation
    - remote-management
  what_breaks:
    pl:
      - Dyski podłączane przy logowaniu do zasobów spoza domeny zaczną żądać poświadczeń przy każdym połączeniu
      - Zadania harmonogramu opierające się na poświadczeniu zapamiętanym przestaną działać, i to cicho
      - Kopia zapasowa zapisująca na udziale sieciowym może przestać się wykonywać
      - Poświadczenia już zapisane pozostają na dysku i warto je po naprawie przejrzeć oraz skasować
    en:
      - Drives attached at sign-in to resources outside the domain will begin demanding credentials at every connection
      - The scheduler's jobs resting on a remembered credential will stop working, and quietly
      - A backup writing to a network share may stop being made
      - Credentials already written stay on the disk and are worth looking over and clearing after the mending
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zadania harmonogramu na tym serwerze sięgają do zasobów zdalnych poświadczeniem zapamiętanym
      - Kopia zapasowa zapisuje na udziale sieciowym z poświadczeniem zapisanym przy konfiguracji
      - Nie przygotowano drogi zastępczej, czyli konta usługowego zarządzanego przez domenę albo skarbca poświadczeń
    en:
      - The scheduler's jobs on this server reach for remote resources by a remembered credential
      - A backup writes to a network share with a credential written at its setting up
      - No spare road was prepared - a service account managed by the domain, or a credential vault
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'DisableDomainCreds'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'DisableDomainCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'DisableDomainCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-storage-of-passwords-and-credentials-for-network-authentication

notes:
  pl: |
    Punkt należy do poziomu drugiego, bo koszt jest tu realny.
    Nie jest to utwardzenie niewidoczne i nie wchodzi do trybu
    zbiorczego.

    Zbiór zapisanych poświadczeń jest mapą tego, dokąd z tej maszyny
    prowadzi droga, wraz z kluczami. Na serwerze mapa ta bywa
    cenniejsza niż na stanowisku roboczym, bo należy do kont
    o szerszych uprawnieniach.

    Naprawa nie usuwa poświadczeń już zapisanych. Przestają być
    odczytywane, ale pozostają na dysku — przejrzyj je i skasuj po
    zmianie.
  en: |
    The item belongs to the second level, the cost being real here. It is no unseen hardening
    and does not enter the bulk mode.

    The gathering of written credentials is a map of where the road leads from this machine,
    together with the keys. On a server that map is at times worth more than at a working
    station, belonging to accounts of wider rights.

    The mending does not clear credentials already written. They stop being read but stay on the
    disk - look them over and clear them after the change.
