id: iis-triple-des-cipher-disabled

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Transport Encryption
  title:
    pl: Szyfr potrójny DES wyłączony
    en: The triple DES cipher switched off

  level: 2
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Potrójny DES powstał jako sposób na przedłużenie życia szyfru, którego
    klucz okazał się za krótki: ten sam algorytm wykonywany jest trzykrotnie,
    co daje klucz efektywnie dłuższy. Rozwiązanie działało przez lata
    i nie zostało złamane w sensie, w jakim złamano pojedynczy DES.

    Problem leży gdzie indziej i wynika z rozmiaru bloku, a nie klucza. Szyfr
    przetwarza dane porcjami po osiem bajtów, a przy takiej porcji powtórzenia
    zaczynają się pojawiać po ilości danych, którą dzisiejsze połączenie
    osiąga w rozsądnym czasie. Z powtórzeń da się wyciągnąć fragmenty treści —
    i to właśnie te fragmenty, które powtarzają się w każdym żądaniu,
    czyli ciasteczko sesji.

    Co to odbiera atakującemu: długie połączenie jako materiał do analizy.
    Atak wymaga utrzymania sesji i wygenerowania dużego ruchu, więc nie jest
    tani — ale jest wykonalny, a szyfr nie ma już żadnej przewagi nad
    następcą, który tego ograniczenia nie ma.
  en: |
    Triple DES came about as a way of extending the life of a cipher whose key had
    turned out too short - the same algorithm is performed three times over, giving
    an effectively longer key. The arrangement worked for years and has not been
    broken in the sense in which single DES was broken.

    The problem lies elsewhere and follows from the block size rather than the key.
    The cipher processes data in portions of eight bytes, and with a portion that
    size repetitions start appearing after an amount of data a connection today
    reaches in reasonable time. Fragments of the contents can be drawn out of those
    repetitions - and precisely those fragments that repeat in every request,
    which is to say the session cookie.

    What it takes away from an attacker - a long connection as material for
    analysis. The attack calls for holding a session open and generating a lot of
    traffic, so it is not cheap - but it is feasible, and the cipher no longer has
    any advantage over its successor, which does not carry the limitation.

disruption_description:
  pl: |
    Ta zmiana wymaga sprawdzenia, w odróżnieniu od pozostałych szyfrów z tej
    grupy. Potrójny DES jest wycofywany, ale nie zniknął — bywa jedynym
    szyfrem wspólnym przy rozmowie ze starszymi systemami Windows i ze
    sprzętem sieciowym, który dostał ostatnią aktualizację oprogramowania
    dawno temu.

    Najczęstszy przypadek to Windows Server 2008 R2 i wcześniejsze po drugiej
    stronie połączenia, a także klienci uruchamiani na starszych wersjach
    środowiska uruchomieniowego, w których wybór szyfru zależy od systemu.
    Jeśli ta maszyna wymienia dane z takim systemem — integracja, przesyłanie
    plików, uwierzytelnianie między serwerami — sprawdź to przed zmianą.

    Objawem będzie nieudane zestawienie połączenia, widoczne po stronie
    klienta jako błąd połączenia, a po stronie serwera niewidoczne w ogóle.
    Przy integracji między serwerami znaczy to zadanie, które przestaje się
    wykonywać po cichu.

    Zapis obowiązuje od ponownego uruchomienia maszyny.
  en: |
    This change calls for a look, unlike the other ciphers in this group. Triple
    DES is being retired but has not gone - it is sometimes the only cipher shared
    when talking to older Windows systems and to network equipment that last
    received a software update long ago.

    The commonest case is Windows Server 2008 R2 and earlier on the other side of
    the connection, and clients running on older versions of the runtime, where the
    choice of cipher rests with the system. If this machine exchanges data with
    such a system - an integration, file transfer, authentication between servers -
    check before making the change.

    The symptom will be a connection that fails to establish, visible on the client
    side as a connection error and on the server side not at all. With an
    integration between servers that means a job which quietly stops running.

    The write applies from the machine's next restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - legacy-applications
    - web-server-services
  what_breaks:
    pl:
      - Zmiana zaczyna obowiązywać dopiero po ponownym uruchomieniu maszyny, więc do tego czasu stan zgłaszany i rzeczywisty się różnią
      - Starsze systemy Windows po drugiej stronie połączenia mogą stracić jedyny wspólny szyfr i przestać się łączyć
      - Integracja między serwerami przestaje działać po cichu, bo po stronie serwera nieudane zestawienie połączenia nie zostawia śladu
      - Sprzęt sieciowy z dawno nieaktualizowanym oprogramowaniem przestaje nawiązywać połączenie szyfrowane
      - Zmiana obejmuje całą maszynę, nie tylko serwer sieciowy, więc dotyczy też połączeń wychodzących
    en:
      - The change takes effect only after the machine is restarted, so until then the reported state and the real one differ
      - Older Windows systems on the other side of the connection may lose the only shared cipher and stop connecting
      - An integration between servers quietly stops working, because on the server side a failed connection leaves no trace
      - Network equipment with long-outdated software stops establishing encrypted connections
      - The change covers the whole machine and not the web server alone, so it reaches outgoing connections too
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny wymieniające dane z systemami Windows Server 2008 R2 i starszymi
      - Serwery obsługujące sprzęt sieciowy, którego oprogramowanie nie było aktualizowane od lat
      - Integracje, w których druga strona wybiera szyfr, a jej możliwości nie są znane
    en:
      - Machines exchanging data with Windows Server 2008 R2 systems and older
      - Servers serving network equipment whose software has not been updated for years
      - Integrations where the other side picks the cipher and its capabilities are not known
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        # The key name holds a slash, which the registry provider in PowerShell
        # reads as a path separator. The .NET interface treats only the
        # backslash that way, so it is used here.
        $root = 'SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\'
        $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
        $wrong = @()
        foreach ($name in @('Triple DES 168')) {
          $key = $base.OpenSubKey($root + $name)
          if ($null -eq $key) { $wrong += ($name + ':not-set'); continue }
          $value = $key.GetValue('Enabled', $null)
          $key.Close()
          if ($null -eq $value) { $wrong += ($name + ':not-set') }
          elseif ([int]$value -ne 0) { $wrong += ($name + ':other') }
        }
        $base.Close()
        if ($wrong.Count -eq 0) { 'AS_REQUIRED' }
        else { 'OTHER ' + ($wrong -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $root = 'SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\'
    $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
    $saved = @()
    foreach ($name in @('Triple DES 168')) {
      $key = $base.OpenSubKey($root + $name)
      $value = $null
      $existed = ($null -ne $key)
      if ($existed) {
        $value = $key.GetValue('Enabled', $null)
        $key.Close()
      }
      $saved += [pscustomobject]@{
        name          = $name
        key_existed   = $existed
        value         = $value
        value_existed = ($null -ne $value)
      }
    }
    $base.Close()
    [pscustomobject]@{
      cipher  = 'Triple DES 168'
      path    = $root
      entries = $saved
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $root = 'SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\'
    $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
    foreach ($name in @('Triple DES 168')) {
      $key = $base.CreateSubKey($root + $name)
      if ($null -eq $key) { throw ('The cipher key could not be created: ' + $name) }
      $key.SetValue('Enabled', 0, [Microsoft.Win32.RegistryValueKind]::DWord)
      $key.Close()
    }
    $base.Close()

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
    foreach ($e in $b.entries) {
      if (-not $e.key_existed) {
        $base.DeleteSubKeyTree($b.path + $e.name, $false)
        continue
      }
      $key = $base.CreateSubKey($b.path + $e.name)
      if ($e.value_existed) {
        $key.SetValue('Enabled', [int]$e.value, [Microsoft.Win32.RegistryValueKind]::DWord)
      } else {
        $key.DeleteValue('Enabled', $false)
      }
      $key.Close()
    }
    $base.Close()

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/tls/tls-registry-settings
  - https://learn.microsoft.com/windows/win32/secauthn/cipher-suites-in-schannel

notes:
  pl: |
    Ocena ryzyka jest tu niższa niż przy pojedynczym DES i to nie jest
    przeoczenie. Pojedynczy DES da się złamać kluczem, czyli bez żadnego
    warunku wstępnego; potrójny wymaga długiego połączenia i dużego ruchu, co
    zawęża sytuacje, w których atak jest wykonalny.

    Jednocześnie uciążliwość jest tu wyższa niż przy pozostałych szyfrach
    z tej grupy, bo ten jeszcze bywa w użyciu. Przy takim zestawieniu — zysk
    umiarkowany, koszt realny — decyzja o odpuszczeniu punktu na maszynie
    obsługującej stare systemy jest wyborem dopuszczalnym, o ile zostanie
    zapisana z uzasadnieniem.

    Brak klucza w rejestrze liczy się jako stan nieustawiony, nie jako
    spełnienie.
  en: |
    The risk assessment here is lower than for single DES, and that is not an
    oversight. Single DES can be broken by the key, which is to say with no
    precondition at all; the triple variant calls for a long connection and a lot
    of traffic, which narrows the situations in which the attack is feasible.

    At the same time the disruption here is higher than for the other ciphers in
    this group, because this one is still sometimes in use. With that pairing -
    moderate gain, real cost - deciding to let the item go on a machine serving old
    systems is a permissible choice, provided it is recorded with a reason.

    An absent key counts as unset rather than as met.
