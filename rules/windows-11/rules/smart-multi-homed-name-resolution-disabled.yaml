id: win11-smart-multi-homed-name-resolution-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozsyłanie zapytań o nazwę wszystkimi kartami wyłączone
    en: Sending name queries out on every adapter switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Maszyna z więcej niż jedną kartą sieciową — a taką jest każdy komputer
    przenośny z przewodem i łącznością bezprzewodową, każda maszyna
    z tunelem i każda z kartą wirtualną — może wysyłać zapytanie o nazwę
    wszystkimi kartami naraz i przyjąć pierwszą odpowiedź, która wróci.

    Tu leży problem. „Pierwsza odpowiedź" nie znaczy „właściwa". Maszyna
    podłączona do sieci firmowej i jednocześnie do obcej wysyła zapytanie
    o nazwę serwera wewnętrznego także tam, gdzie nie powinno go być — i jeżeli
    ktoś po tamtej stronie odpowie szybciej niż serwer firmowy, maszyna
    połączy się z nim.

    Sieć, w której napastnik ma przewagę czasową, nie jest przypadkiem rzadkim:
    to sieć hotelowa, konferencyjna, lotniskowa, a także dowolna sieć, do której
    ktoś podłączył własne urządzenie. Odpowiedź przychodzi stamtąd szybciej,
    bo droga jest krótsza.

    Skutkiem jest połączenie z serwerem napastnika, podjęte przez maszynę
    samodzielnie i poprzedzone przesłaniem poświadczeń, jeśli protokół tego
    wymaga. Nie ma tu ani podatności, ani działania użytkownika.

    Punkt każe pytać po kolei, po jednej karcie, zamiast rozsyłać zapytanie
    wszystkimi naraz.
  en: |
    A machine with more than one network adapter - and that is every portable
    computer with a cable and a wireless link, every machine with a tunnel and every
    one with a virtual adapter - can send a name query out on all adapters at once
    and take the first answer that comes back.

    Here is the trouble. "The first answer" does not mean "the right one". A machine
    attached to the company network and to a foreign one at the same time sends the
    query for an internal server's name out where it has no business being too - and
    if somebody on that side answers faster than the company server, the machine
    connects to them.

    A network where an attacker has the advantage in timing is no rare case: a hotel
    network, a conference one, an airport one, and any network somebody has plugged
    their own device into. The answer arrives from there faster, because the way is
    shorter.

    The upshot is a connection to the attacker's server, made by the machine on its
    own and preceded by credentials being sent if the protocol calls for them. There
    is neither a vulnerability here nor an action by the user.

    The item says to ask in turn, one adapter at a time, instead of sending the query
    out on all of them at once.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy rozwiązywanie nazw na maszynach z tunelem
    działa po zmianie tak, jak trzeba.

    Zapytania idą po wdrożeniu po kolei, a nie równolegle, więc rozwiązanie
    nazwy bywa wolniejsze o ułamek sekundy. Na stanowisku biurowym jest to
    niezauważalne. Odczuwalne staje się tam, gdzie jedna z kart odpowiada
    z opóźnieniem albo nie odpowiada wcale — wtedy maszyna czeka na jej
    odpowiedź, zanim spyta następną.

    Najczęstszy kłopot dotyczy maszyn z tunelem do sieci firmowej. Kolejność
    pytania zaczyna mieć znaczenie, a przy źle ustawionych przyrostkach nazw
    zasób wewnętrzny bywa rozwiązywany przez serwer zewnętrzny albo odwrotnie.
    Objawem jest zasób widoczny przed zestawieniem tunelu i niewidoczny po nim.

    Nie przestaje działać nic, co było poprawnie skonfigurowane. Punkt ujawnia
    natomiast konfiguracje, które działały przez przypadek — dzięki temu, że
    odpowiadała którakolwiek karta.

    Nie ma restartu.
  en: |
    What needs checking is whether name resolution on machines with a tunnel works
    the way it should after the change.

    After the rollout queries go one after another rather than in parallel, so
    resolving a name can be slower by a fraction of a second. At an office station
    that is unnoticeable. It becomes felt where one of the adapters answers late or
    does not answer at all - then the machine waits for its answer before asking the
    next.

    The commonest trouble concerns machines with a tunnel into the company network.
    The order of asking starts to matter, and with badly set name suffixes an
    internal resource is sometimes resolved by an external server, or the other way
    round. The symptom is a resource visible before the tunnel is established and
    invisible afterwards.

    Nothing that was configured correctly stops working. What the item does expose
    are configurations that worked by accident - thanks to whichever adapter happened
    to answer.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Rozwiązywanie nazw bywa wolniejsze, bo zapytania idą po kolei zamiast równolegle
      - Na maszynie z tunelem zasób wewnętrzny może przestać być widoczny, jeśli przyrostki nazw są ustawione niedbale
      - Konfiguracje działające dotąd przez przypadek, na odpowiedzi dowolnej karty, przestaną działać
    en:
      - Resolving names can be slower, as queries go one after another rather than in parallel
      - On a machine with a tunnel an internal resource may stop being visible if the name suffixes are set carelessly
      - Configurations that worked by accident so far, on whichever adapter answered, stop working
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Rozwiązywanie nazw na maszynach z tunelem opiera się na tym, że odpowiada dowolna karta
      - Jedna z kart w maszynie odpowiada z dużym opóźnieniem i wydłużyłaby każde zapytanie
    en:
      - Name resolution on machines with a tunnel rests on whichever adapter answers
      - One of the machine's adapters answers with a long delay and would lengthen every query
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'DisableSmartNameResolution'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'DisableSmartNameResolution'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSmartNameResolution' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Punkt tworzy rodzinę z regułami wyłączającymi rozgłoszeniowe rozwiązywanie
    nazw i rozwiązywanie przez starszy mechanizm nazw. Wszystkie trzy zamykają
    ten sam rodzaj drogi: pytanie zadane tam, gdzie odpowiedzieć może
    ktokolwiek. Wdrożenie części z nich zostawia pozostałe otwarte, a napastnik
    potrzebuje jednej.

    Nazwa wpisu opisuje wyłączenie, więc wartością wymaganą jest jedynka.

    Reguła nie sprawdza liczby kart sieciowych w maszynie ani tego, czy
    którakolwiek jest podłączona do sieci obcej. Punkt dotyczy ustawienia,
    a maszyna z jedną kartą dziś jutro bywa maszyną z tunelem.
  en: |
    The item forms a family with the rules switching off broadcast name resolution
    and resolution through the older name mechanism. All three close the same kind of
    route: a question asked where anyone at all may answer. Applying some of them
    leaves the others open, and an attacker needs one.

    The entry's name describes switching off, so the required value is a one.

    The rule does not check how many network adapters the machine has, nor whether
    any of them is attached to a foreign network. The item concerns the setting, and
    a machine with one adapter today is a machine with a tunnel tomorrow.
