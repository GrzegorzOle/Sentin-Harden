id: win2016-remote-registry-exact-paths

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista gałęzi rejestru dostępnych zdalnie ograniczona do trzech pozycji
    en: The list of registry keys reachable remotely limited to three entries
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wylicza gałęzie rejestru, które wolno odczytać zdalnie bez
    osobnego uprawnienia — i wyłącznie te gałęzie, bez tego, co pod nimi
    leży.

    Rozróżnienie „sama gałąź" kontra „gałąź wraz z zawartością" jest tu
    treścią, a nie szczegółem technicznym. Pozycja z tej listy udostępnia
    jeden węzeł: jego wartości, ale nie podgałęzie. Druga lista, opisana
    osobną regułą, udostępnia całe poddrzewa. Pierwsza jest więc narzędziem
    precyzyjnym, druga hurtowym, i właśnie dlatego ta pierwsza może
    pozostać krótka.

    Trzy pozycje, do których lista ma się sprowadzać, niosą informacje
    potrzebne narzędziom pytającym maszynę o to, czym jest: wersję systemu
    i typ instalacji. Są to dane, które maszyna i tak ujawnia w inny sposób,
    więc ich udostępnienie niczego nie oddaje.

    Wszystko ponad tę listę oddaje. Każda dopisana gałąź to fragment
    konfiguracji czytelny z sieci bez logowania — a wpisy dopisuje się
    zwykle doraźnie, żeby jakieś narzędzie zadziałało, i nigdy nie usuwa po
    tym, jak przestało być potrzebne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    tych fragmentów konfiguracji, które ktoś kiedyś dopisał do listy
    i o których dawno zapomniał.
  en: |
    The setting enumerates the registry keys that may be read remotely without a
    separate privilege - and those keys alone, without what lies beneath them.

    The distinction between "the key itself" and "the key together with its
    contents" is here the substance rather than a technical detail. An entry on this
    list offers up one node: its values but not its subkeys. The second list,
    described by a separate rule, offers up whole subtrees. The first is therefore a
    precise instrument and the second a wholesale one, and that is exactly why the
    first may stay short.

    The three entries the list is to come down to carry the information tools need
    when asking a machine what it is: the system's version and the kind of
    installation. These are data the machine reveals in other ways anyway, so
    offering them up gives nothing away.

    Everything beyond that list does give something away. Every key added is a
    fragment of configuration readable from the network without signing in - and
    entries are as a rule added on the spur of the moment, to make some tool work,
    and never removed once they have ceased to be needed.

    What an attacker gains while the item goes unmet: the reading of those fragments
    of configuration somebody once added to the list and has long since forgotten
    about.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie polega tu na przeczytaniu
    listy, którą maszyna ma dziś, a nie na wyobrażaniu sobie skutków.

    Reguła nie dopisuje ani nie odejmuje pozycji — ona ustala listę na
    dokładnie trzy. Jeżeli ktoś kiedyś coś dopisał, zmiana to usunie, i to
    jest jedyny scenariusz, w którym cokolwiek przestanie działać. Dlatego
    audyt podaje zawartość listy zastanej, zamiast zgłaszać samą
    niezgodność: bez wykazu pozycji decyzja nie jest możliwa.

    Co bywa dopisane. Gałęzie oprogramowania wymagającego zdalnego odczytu
    licencji albo wersji. Ścieżki dopisane przy wdrożeniu narzędzia nadzoru,
    które później wymieniono na inne. Pozycje odziedziczone z szablonu
    konfiguracji sprzed lat, przenoszone z maszyny na maszynę bez
    zastanowienia.

    Objaw w razie usunięcia potrzebnej pozycji jest jednoznaczny: narzędzie
    zgłasza brak dostępu do konkretnej ścieżki, więc przywrócenie jest
    proste, a przyczyna widoczna.

    Czego to nie psuje: odczytu rejestru lokalnie, dostępu kont
    uprzywilejowanych, drugiej listy opisanej osobną regułą.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the checking here consists in reading the list
    the machine has today, not in imagining consequences.

    The rule neither adds nor subtracts entries - it fixes the list at exactly
    three. If somebody once added something, the change will remove it, and that is
    the only scenario in which anything stops working. The audit therefore gives the
    contents of the list it found rather than reporting a bare non-compliance:
    without the entries listed no decision is possible.

    What tends to be added. Keys of software calling for its licence or version to
    be read remotely. Paths added when a monitoring tool was rolled out that was
    later replaced by another. Entries inherited from a configuration template of
    years ago, carried from machine to machine unthinkingly.

    The symptom, where a needed entry is removed, is unambiguous: the tool reports
    no access to a particular path, so restoring it is simple and the cause is
    visible.

    What this does not break: reading the registry locally, the access of privileged
    accounts, or the second list described by a separate rule.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzie odczytujące zdalnie licencję albo wersję oprogramowania z gałęzi dopisanej do listy zgłasza brak dostępu do konkretnej ścieżki
      - Pozycje odziedziczone z szablonu konfiguracji sprzed lat zostają usunięte razem z tymi, które nadal są potrzebne
      - Narzędzie nadzoru wdrożone z własnym wpisem na liście traci odczyt swojej gałęzi
      - Odczyt rejestru lokalnie, dostęp kont uprzywilejowanych i druga lista gałęzi pozostają bez zmian
    en:
      - A tool reading a program's licence or version remotely from a key added to the list reports no access to that particular path
      - Entries inherited from a configuration template of years ago are removed along with those still needed
      - A monitoring tool rolled out with an entry of its own on the list loses the reading of its key
      - Reading the registry locally, the access of privileged accounts and the second list of keys stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przeczytano listy, którą maszyna ma dziś, więc nie wiadomo, co zostanie usunięte
      - Na liście są pozycje dopisane pod konkretne narzędzie, którego nie da się przestawić na inny sposób odczytu
    en:
      - The list the machine has today has not been read, so it is not known what will be removed
      - The list holds entries added for a particular tool that cannot be moved to another way of reading
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The list is compared as a set, without regard to order or letter case,
      # because neither carries meaning here. A list that differs is reported
      # together with its contents rather than as a bare failure.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedExactPaths'
      $name = 'Machine'
      $expected = @(
        'System\CurrentControlSet\Control\ProductOptions',
        'System\CurrentControlSet\Control\Server Applications',
        'SOFTWARE\Microsoft\Windows NT\CurrentVersion'
      )
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = @($item.$name | Where-Object { $null -ne $_ -and $_ -ne '' })
        $left = ($value | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        $right = ($expected | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        if ($left -eq $right) { 'EXACT_MATCH' }
        elseif ($value.Count -eq 0) { 'EMPTY' }
        else { 'OTHER ' + ($value -join ',') }
      }
    } catch {
      # Reading this key calls for administrative rights. The system's own
      # message goes to the error stream, so the report can tell a missing
      # privilege from a real fault instead of showing a bare error.
      [Console]::Error.WriteLine($_.Exception.Message)
      'CHECK_ERROR'
    }
  expected: 'EXACT_MATCH'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedExactPaths'
    $name = 'Machine'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedExactPaths'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $value = @(
      'System\CurrentControlSet\Control\ProductOptions',
      'System\CurrentControlSet\Control\Server Applications',
      'SOFTWARE\Microsoft\Windows NT\CurrentVersion'
    )
    Set-ItemProperty -Path $path -Name 'Machine' -Value $value -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type MultiString
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-remotely-accessible-registry-paths

notes:
  pl: |
    Audyt porównuje listę jako zbiór — bez względu na kolejność i wielkość
    liter — bo ani jedno, ani drugie nie niesie tu znaczenia. Lista
    w innej kolejności jest tą samą listą i zgłaszanie jej jako
    niezgodności byłoby szumem.

    Zawartość listy zastanej reguła podaje wprost, razem z pozycjami.
    Jest to jedyny sposób, żeby decyzja o wdrożeniu była możliwa: samo
    „niezgodne" nie mówi, czy usunięta zostanie pozycja potrzebna, czy
    pozostałość po narzędziu sprzed pięciu lat.

    Punkt jest podporządkowany regule wyłączającej usługę zdalnego dostępu
    do rejestru. Gdzie usługa jest wyłączona, lista nie ma znaczenia
    praktycznego — ale warto ją i tak uporządkować, bo usługa bywa włączana
    z powrotem przy wdrożeniu narzędzia, a wtedy stara lista wraca do gry
    razem z nią.
  en: |
    The audit compares the list as a set - without regard to order or letter case -
    since neither carries meaning here. A list in another order is the same list, and
    reporting it as a non-compliance would be noise.

    The rule gives the contents of the list it found outright, entry by entry. It is
    the only way a rollout decision can be made: a bare "non-compliant" does not say
    whether what will be removed is a needed entry or a leftover from a tool of five
    years ago.

    The item is subordinate to the rule switching off the remote registry access
    service. Where the service is off, the list does not matter in practice - but it
    is worth putting in order anyway, since the service is at times switched back on
    when a tool is rolled out, and the old list then comes back into play with it.
