id: win2025-rpc-unauthenticated-clients-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Procedure Call
  title:
    pl: Nieuwierzytelnieni klienci zdalnych wywołań ograniczeni
    en: Unauthenticated remote procedure call clients restricted
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe serwerowi odrzucać zdalne wywołania procedur
    pochodzące od klientów, którzy się nie uwierzytelnili.

    Mechanizm zdalnych wywołań procedur jest tym, czym system rozmawia
    sam ze sobą przez sieć. Przez niego idzie zarządzanie usługami,
    odpytywanie o stan, zarządzanie zadaniami, druk, obsługa dzienników
    i kilkadziesiąt innych rzeczy, których nikt nie wymienia, bo działają.
    Jest to największa pojedyncza powierzchnia, jaką maszyna Windows
    wystawia do sieci.

    Dopóki wywołania nieuwierzytelnione są przyjmowane, część tej
    powierzchni odpowiada każdemu, kto do niej sięgnie. Nie chodzi przy
    tym wyłącznie o wykonanie czegoś — chodzi przede wszystkim o to,
    że maszyna odpowiada na pytania. Wyliczenie tego, co na niej
    działa, jest pierwszym krokiem rozpoznania i właśnie tę drogę punkt
    zwęża.

    Na serwerze waży to więcej niż na stanowisku roboczym z dwóch
    powodów, które warto rozdzielić. Pierwszy: serwer wystawia więcej
    usług, bo po to stoi. Drugi, ważniejszy: serwer odpowiada
    maszynom, a nie ludziom, więc nikt nie zauważy, że odpowiedział
    komuś niewłaściwemu. Na stanowisku nietypowy ruch bywa widoczny
    w pracy. Tutaj nie ma komu go zobaczyć.

    Trzeba powiedzieć uczciwie, czego ten punkt nie robi. Nie zamyka
    powierzchni zdalnych wywołań, tylko odsiewa z niej wywołania bez
    uwierzytelnienia. Napastnik z ważnym poświadczeniem przechodzi
    dalej i punkt nie jest przed nim obroną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odpytania serwera i sięgnięcia do części jego mechanizmów
    bez podawania jakiegokolwiek poświadczenia.
  en: |
    The setting bids the server throw out remote calls of procedures coming from clients who have
    not authenticated themselves.

    The mechanism of remote procedure calls is what the system speaks with itself by across the
    network. By it go the managing of services, the asking after state, the managing of jobs,
    printing, the serving of logs and a few dozen other things nobody names, they working. It is
    the greatest single surface a Windows machine puts out to the network.

    While unauthenticated calls are taken, a part of that surface answers anyone who reaches for
    it. It is withal not only about the carrying out of something - it is above all about the
    machine answering questions. The listing of what runs upon it is the first step of
    reconnaissance, and it is just that road the item narrows.

    On a server that weighs more than at a working station for two reasons worth parting. The
    first: a server puts out more services, that being what it stands for. The second, the
    weightier: a server answers machines and not people, so nobody will mark that it answered the
    wrong one. At a station out-of-the-way traffic is at times seen in the work. Here there is
    nobody to see it.

    It must be said honestly what this item does not do. It does not shut the surface of remote
    calls, it only sifts out of it the calls without authentication. An attacker with a good
    credential passes on, and the item is no guard against them.

    What an attacker gains while the item goes unmet: the means of asking the server and of
    reaching for a part of its mechanisms without giving any credential at all.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia, okna serwisowego i restartu
    maszyny — ustawienie wiąże dopiero po nim. Na serwerze oznacza to
    zdarzenie planowane, a nie czynność do zrobienia po drodze.

    Sprawdzenia wymaga to, co rozmawia z tą maszyną bez uwierzytelnienia.
    Przypadków jest kilka i wszystkie dają się nazwać.

    Pierwszy to klienci spoza domeny sięgający do udziałów i drukarek.
    Komputer w grupie roboczej, maszyna gościa, stanowisko dostawcy —
    wszystko, co nie ma w domenie tożsamości, łączy się częściej
    nieuwierzytelnione, niż się zakłada.

    Drugi to urządzenia sieciowe i sprzęt wbudowany: drukarki sieciowe
    odpytujące serwer, skanery odkładające pliki, sterowniki
    przemysłowe, urządzenia pomiarowe. Ich implementacja zdalnych
    wywołań bywa uboga i uwierzytelnienia nie zna.

    Trzeci to starsze narzędzia monitorowania i inwentaryzacji,
    zbierające stan maszyn bez podawania poświadczenia.

    Objaw po zmianie jest natychmiastowy, ale trudny do powiązania
    z przyczyną, i to jest największy kłopot tego punktu. Narzędzie nie
    zgłasza odmowy uwierzytelnienia — zgłasza, że serwer jest
    nieosiągalny albo że usługa nie odpowiada. Wygląda to na awarię
    sieci albo usługi, a nie na skutek zmiany ustawienia sprzed
    restartu.

    Dlatego zmianę wdraża się w oknie, w którym ktoś patrzy, i z listą
    rzeczy do sprawdzenia po restarcie: druk, udziały, monitorowanie,
    kopie zapasowe, urządzenia sieciowe odpytujące ten serwer.

    Cofnięcie ustawienia też wiąże dopiero po restarcie, więc pomyłka
    kosztuje drugie okno serwisowe, a nie minutę. To jest powód, dla
    którego ten punkt nie idzie hurtem nawet wtedy, gdy wygląda
    niewinnie w raporcie.
  en: |
    The change takes a knowing rollout, a window of service and a restart of the machine - the
    setting binds only after it. On a server that means a planned happening and not an act to be
    done along the way.

    What needs checking is what speaks with this machine without authentication. The cases are
    several and all can be named.

    The first is clients outside the domain reaching for shares and printers. A computer in a
    working group, a guest's machine, a vendor's station - everything with no name in the domain
    connects unauthenticated oftener than is supposed.

    The second is devices of the network and built-in gear: network printers asking the server,
    scanners laying files down, industrial drivers, devices of measuring. Their carrying out of
    remote calls is at times poor and knows no authentication.

    The third is older tools of watching and of taking stock, gathering the state of machines
    without giving a credential.

    The symptom after the change is at once but hard to tie to its cause, and that is this item's
    greatest trouble. The tool reports no refusal of authentication - it reports that the server is
    unreachable or that the service does not answer. It looks like a fault of the network or of a
    service and not like the effect of a setting made before the restart.

    Therefore the change is rolled out in a window where somebody is watching, and with a list of
    things to check after the restart: printing, shares, watching, backups, devices of the network
    asking this server.

    The undoing of the setting likewise binds only after a restart, so a mistake costs a second
    window of service and not a minute. That is why this item does not go in bulk even where it
    looks harmless in the report.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Klient spoza domeny sięgający do udziałów albo drukarek przestanie być obsługiwany
      - Drukarka sieciowa, skaner albo sterownik przemysłowy odpytujący serwer przestanie dostawać odpowiedź
      - Starsze narzędzie monitorowania zbierające stan bez poświadczenia przestanie zbierać dane
      - Objaw wygląda na awarię sieci albo usługi, a nie na skutek zmiany sprzed restartu
      - Cofnięcie ustawienia też wiąże dopiero po restarcie, więc pomyłka kosztuje drugie okno serwisowe
    en:
      - A client outside the domain reaching for shares or printers will stop being served
      - A network printer, a scanner or an industrial driver asking the server will stop getting an answer
      - An older tool of watching gathering state without a credential will stop gathering readings
      - The symptom looks like a fault of the network or of a service and not like the effect of a change made before the restart
      - The undoing of the setting likewise binds only after a restart, so a mistake costs a second window of service
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Do serwera sięgają klienci spoza domeny albo urządzenia nieznające uwierzytelnienia
      - Nie ma okna serwisowego, w którym da się zrestartować maszynę i sprawdzić skutki
    en:
      - Clients outside the domain or devices knowing no authentication reach for the server
      - There is no window of service wherein the machine can be restarted and the effects checked
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The key spells the last element as Rpc, not RPC as in the printing rules.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
      $name = 'RestrictRemoteClients'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    $name = 'RestrictRemoteClients'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictRemoteClients' -Value 1 -Type DWord
    # The setting binds after a restart of the machine.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    # The former state returns after a restart of the machine.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/rpc-security

notes:
  pl: |
    Mechanizm zdalnych wywołań procedur jest największą pojedynczą
    powierzchnią, jaką maszyna Windows wystawia do sieci. Punkt nie
    zamyka tej powierzchni — odsiewa z niej wywołania bez
    uwierzytelnienia. Napastnik z ważnym poświadczeniem przechodzi dalej.

    Na serwerze waży to więcej z dwóch powodów: wystawia więcej usług
    i odpowiada maszynom, a nie ludziom, więc nikt nie zauważy, że
    odpowiedział komuś niewłaściwemu.

    Największy kłopot tego punktu to objaw: narzędzie zgłasza, że serwer
    jest nieosiągalny, a nie że odmówiono uwierzytelnienia. Wygląda to
    na awarię sieci.

    Ustawienie wiąże po restarcie i cofa się po restarcie, więc pomyłka
    kosztuje drugie okno serwisowe.
  en: |
    The mechanism of remote procedure calls is the greatest single surface a Windows machine puts
    out to the network. The item does not shut that surface - it sifts out of it the calls without
    authentication. An attacker with a good credential passes on.

    On a server it weighs more for two reasons: it puts out more services, and it answers machines
    and not people, so nobody will mark that it answered the wrong one.

    This item's greatest trouble is the symptom: the tool reports that the server is unreachable
    and not that authentication was refused. It looks like a fault of the network.

    The setting binds after a restart and is undone after a restart, so a mistake costs a second
    window of service.
