id: win2025-gaming-networking-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa łączności sieciowej platformy gier wyłączona
    en: The network connectivity service of the gaming platform disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę odpowiadającą za łączność sieciową platformy
    gier. Usługa ta zestawia i utrzymuje połączenia z usługami platformy
    oraz z innymi jej uczestnikami.

    Obniżam kategorię do niskiej, bo gier na serwerze nie ma, ale samo
    to zdanie nie jest jeszcze uzasadnieniem — i nie chcę, żeby tak
    zostało. Warto odłożyć nazwę na bok i spojrzeć, co ten składnik
    robi.

    Robi to, że utrzymuje łączność między maszyną a odległymi usługami
    mimo przeszkód po drodze — translacji adresów, ograniczeń zapory,
    braku adresu widocznego z zewnątrz. Jest to zadanie z rodziny tych,
    które polegają na znajdowaniu drogi tam, gdzie drogi wprost nie ma.
    Na stacji roboczej jest to wygoda kupiona świadomie. Na serwerze,
    gdzie ruch wychodzący ma być wyliczony i uzasadniony, składnik
    umiejący obchodzić ograniczenia nie ma po co działać — nawet jeżeli
    nigdy nie zrobi z tej umiejętności użytku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    wprost; działa kod z uprawnieniami systemu, po którym nikt się niczego
    nie spodziewa, bo nikt nie pamięta, że jest.
  en: |
    The item switches off the service that answers for the net-binding of the gaming board. That
    service sets up and keeps bindings to the workings of the board and to others taking part in it.

    I lower the category to low, there being no games upon a server, but that sentence alone is not yet
    a standing - and I would not have it stay so. It is worth setting the name aside and looking at
    what that piece does.

    It does this, that it keeps a binding between the machine and far-off workings for all the lets
    along the road - the turning of addresses, the bounds of the wall of fire, the want of an address
    seen from without. It is a task of the kin of those that lie in the finding of a road where there
    is no road outright. Upon a workstation that is an ease bought wittingly. Upon a server, where the
    traffic going out is to be reckoned up and stood by, a piece that can go about bounds has no cause
    to work - even if it never make use of that skill.

    What an attacker gains while the item goes unmet - little outright; there works code with the
    leaves of the system whereof nobody looks for anything, because nobody remembers it is there.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Nie umiem wskazać na serwerze
    nikogo, kto z platformy gier korzysta, i żadnego zadania, które przez
    tę zmianę się nie wykona.

    Chcę natomiast zapisać uwagę o porządku pracy, bo ten punkt nie jest
    sam. Składników platformy gier jest w systemie kilka — łączność,
    tożsamość, zapis stanu, obsługa urządzeń sterujących — i każdy ma
    w benchmarku osobny punkt. Na serwerze wszystkie zapadają tą samą
    decyzją i nie ma powodu rozważać ich po kolei; to jest dokładnie ten
    rodzaj pracy, do którego tryb zbiorczy został pomyślany.

    Jeżeli te punkty wypadają jako niespełnione, warto przy okazji
    zapytać, skąd się na tej maszynie wzięły. Na serwerze zainstalowanym
    z obrazu serwerowego zwykle nie ma ich wcale; ich obecność mówi coś
    o pochodzeniu systemu, a nie o grach.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease". I can name upon a server nobody who draws upon the gaming board
    and no task that will go undone by that change.

    I would set down a note upon the ordering of the work for all that, this item not being alone. Of
    the pieces of the gaming board there are several in the system - the binding, the who-one-is, the
    writing down of the standing, the dealing with the steering gear - and each has an item of its own
    in the benchmark. Upon a server they all fall by one and the same deciding and there is no ground
    to weigh them one after another; that is just the kind of work the bulk mode was thought up for.

    If those items come out as unmet, it is worth asking by the way whence they came onto that machine.
    Upon a server installed off a likeness of a server there are mostly none of them at all; their
    being there says something of the springhead of the system and nothing of games.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Przestaje działać łączność z usługami platformy gier i z innymi jej uczestnikami
      - Na serwerze nie ma nikogo, kto z platformy gier korzysta, ani zadania, które przez to się nie wykona
      - Znika składnik utrzymujący łączność mimo translacji adresów i ograniczeń zapory
      - Obecność tych punktów jako niespełnionych mówi o pochodzeniu systemu, a nie o grach
    en:
      - The binding to the workings of the gaming board and to others taking part in it stops working
      - Upon a server there is nobody who draws upon the gaming board and no task that will go undone by it
      - The piece that keeps a binding for all the turning of addresses and the bounds of the wall of fire goes away
      - The being of those items as unmet says something of the springhead of the system and nothing of games
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna celowo bierze udział w platformie gier, na przykład jako stanowisko do jej sprawdzania
    en:
      - The machine takes part in the gaming board on purpose, as a stead for the testing of it for a byspel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Set the name aside: what goes away is a component whose job is keeping a
    # connection alive through address translation and firewall restrictions.
    # The other services of this family fall by the same decision.
    Stop-Service -Name 'XboxNetApiSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XboxNetApiSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XboxNetApiSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    „Gier na serwerze nie ma" nie jest jeszcze uzasadnieniem. Warto
    odłożyć nazwę na bok: składnik utrzymuje łączność mimo przeszkód po
    drodze — translacji adresów, ograniczeń zapory, braku adresu
    widocznego z zewnątrz. Na serwerze, gdzie ruch wychodzący ma być
    wyliczony, składnik umiejący obchodzić ograniczenia nie ma po co
    działać.

    Składników platformy gier jest kilka i każdy ma osobny punkt. Na
    serwerze wszystkie zapadają tą samą decyzją — to jest ten rodzaj
    pracy, do którego tryb zbiorczy został pomyślany.

    Ich obecność mówi o pochodzeniu systemu, a nie o grach.
  en: |
    "There are no games upon a server" is not yet a standing. It is worth setting the name aside - the
    piece keeps a binding for all the lets along the road - the turning of addresses, the bounds of the
    wall of fire, the want of an address seen from without. Upon a server, where the traffic going out
    is to be reckoned up, a piece that can go about bounds has no cause to work.

    Of the pieces of the gaming board there are several and each has an item of its own. Upon a server
    they all fall by one and the same deciding - that is the kind of work the bulk mode was thought up
    for.

    Their being there says something of the springhead of the system and nothing of games.
