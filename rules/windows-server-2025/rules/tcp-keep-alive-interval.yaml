id: win2025-tcp-keep-alive-interval

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Odstęp między pakietami podtrzymującymi połączenie skrócony
    en: The interval between connection keep-alive packets shortened
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Połączenie sieciowe, przez które nic nie płynie, wygląda tak samo
    jak połączenie żywe. Żeby je odróżnić, system co jakiś czas wysyła
    pakiet podtrzymujący i czeka na odpowiedź. Brak odpowiedzi kończy
    połączenie.

    Odstęp domyślny wynosi dwie godziny. Tyle właśnie czasu maszyna
    trzyma połączenie, o którym druga strona dawno zapomniała — razem
    z przypisanymi mu zasobami i razem z jego miejscem w tablicy
    połączeń.

    Kategorię ryzyka podniosłem względem paczki stanowiska roboczego,
    bo serwer jest stroną przyjmującą. Stanowisko robocze utrzymuje
    kilkanaście połączeń wychodzących; serwer utrzymuje ich tysiące
    i nie wybiera, kto je nawiązuje. Miejsce w tablicy połączeń jest
    więc na serwerze zasobem wspólnym, a nie prywatnym kłopotem jednej
    maszyny.

    Napastnik nie musi wobec tego niczego łamać. Wystarczy, że nawiąże
    wiele połączeń i zamilknie. Każde z nich kosztuje go jeden pakiet,
    a serwer trzyma je przez dwie godziny. Przy dostatecznej liczbie
    takich połączeń usługa przestaje przyjmować nowe, a to jest widziane
    z zewnątrz jako awaria, nie jako atak.

    Skrócenie odstępu nie zamyka tej drogi, tylko ją zwęża: martwe
    wpisy znikają po pięciu minutach zamiast po dwóch godzinach,
    więc żeby utrzymać ten sam stan, napastnik musi płacić
    dwudziestokrotnie częściej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tanią
    metodę zajmowania miejsca w tablicy połączeń serwera na dwie godziny
    za jeden pakiet.
  en: |
    A network connection through which nothing flows looks just like a living one. To tell them
    apart the system sends now and then a keep-alive packet and waits for an answer. A want of an
    answer ends the connection.

    The default interval runs to two hours. That is just how long the machine holds a connection
    the other side has long forgotten - together with the means set aside for it and together with
    its place in the table of connections.

    I raised the category of risk against the working station's pack, a server being the taking
    side. A working station keeps a dozen or so outgoing connections; a server keeps thousands of
    them and does not choose who opens them. A place in the table of connections is therefore on a
    server a common means and not one machine's private trouble.

    An attacker need therefore break nothing. It is enough that they open many connections and
    fall silent. Each costs them one packet, and the server holds them for two hours. With enough
    such connections the service stops taking new ones, and that is seen from outside as a
    breakdown and not as an attack.

    Shortening the interval does not shut that road but narrows it: dead entries go after five
    minutes instead of after two hours, so to hold the same state the attacker must pay twenty
    times as often.

    What an attacker gains while the item goes unmet: a cheap way of taking a place in the
    server's table of connections for two hours at the cost of one packet.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia i na serwerze bardziej niż na
    stanowisku roboczym, bo skutek dotyczy połączeń cudzych, a nie
    własnych.

    Pierwszy skutek jest ilościowy. Serwer utrzymujący tysiące połączeń
    zacznie wysyłać pakiety podtrzymujące dwadzieścia cztery razy
    częściej niż dotąd. Na łączu lokalnym to nic; na łączu rozliczanym
    za przesłane dane albo na wolnym łączu do oddziału to jest różnica,
    którą widać w rachunku.

    Drugi jest poważniejszy i dotyczy sesji, które mają prawo milczeć.
    Konsola bazy danych otwarta i zostawiona, długie zadanie, sesja
    administracyjna przez tunel, klient aplikacji branżowej czekający
    na wynik — wszystko to bywa cicho dłużej niż pięć minut, zupełnie
    zgodnie z przeznaczeniem.

    Połączenie takie zostanie zerwane, jeżeli pośrednik po drodze nie
    przepuści pakietu podtrzymującego albo jeżeli druga strona na niego
    nie odpowie. Objaw jest po stronie klienta i wygląda jak zerwanie
    sieci, więc rzadko wiąże się go z tą zmianą — zwłaszcza że pojawia
    się dopiero po ponownym uruchomieniu serwera, a więc być może
    tygodnie później.

    Trzeci to sama wartość. Pięć minut jest granicą górną, nie zaleceniem,
    a dobranie jej rozsądnie wymaga wiedzy o tym, jak długo milczą
    połączenia tej konkretnej usługi. Bez tej wiedzy zmiana jest
    zgadywaniem.

    Aplikacje pisane porządnie mają własne podtrzymywanie na poziomie
    protokołu aplikacyjnego i ta zmiana ich nie dotyczy. Zaboli to
    aplikacje, które na podtrzymywaniu systemowym polegały, nie wiedząc
    o tym.
  en: |
    The change takes a knowing rollout, and on a server more than at a working station, the effect
    bearing on others' connections and not one's own.

    The first effect is of quantity. A server keeping thousands of connections will begin sending
    keep-alive packets twenty-four times oftener than until now. On a local link that is nothing;
    on a link charged for data sent or on a slow link to a branch it is a difference to be seen in
    the bill.

    The second is graver and bears on sessions entitled to be silent. A database console opened
    and left, a long job, an administrative session through a tunnel, a client of trade software
    waiting for a result - all these are at times quiet longer than five minutes, wholly as
    intended.

    Such a connection will be broken where a go-between along the way does not pass the keep-alive
    packet or where the other side does not answer it. The symptom is on the client's side and
    looks like a break of the network, so it is seldom tied to this change - the more so as it
    shows only after a fresh start of the server, and so perhaps weeks later.

    The third is the value itself. Five minutes is an upper bound and not a counsel, and choosing
    it sensibly takes knowing how long the connections of this very service keep silent. Without
    that knowledge the change is a guess.

    Applications written properly have a keeping alive of their own at the level of their own
    protocol and this change does not touch them. It will hurt applications that rested on the
    system's keeping alive without knowing it.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Sesja milcząca dłużej niż pięć minut może zostać zerwana, jeśli pośrednik nie przepuści pakietu podtrzymującego
      - Konsola bazy danych, długie zadanie i sesja administracyjna przez tunel to typowe ofiary
      - Serwer zacznie wysyłać pakiety podtrzymujące dwadzieścia cztery razy częściej niż dotąd
      - Objaw jest po stronie klienta i wygląda jak zerwanie sieci, a nie jak skutek zmiany
      - Skutek ujawnia się dopiero po ponownym uruchomieniu serwera
    en:
      - A session silent longer than five minutes may be broken where a go-between does not pass the keep-alive packet
      - A database console, a long job and an administrative session through a tunnel are the usual victims
      - The server will begin sending keep-alive packets twenty-four times oftener than until now
      - The symptom is on the client's side and looks like a break of the network rather than an effect of the change
      - The effect shows only after a fresh start of the server
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer obsługuje klientów przez łącze rozliczane za każdy przesłany pakiet
      - Nie ustalono, jak długo milczą zgodnie z przeznaczeniem połączenia usług tego serwera
    en:
      - The server serves clients over a link charged for every packet sent
      - It was not settled how long the connections of this server's services keep silent as intended
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value is given in milliseconds; five minutes is three hundred
      # thousand and anything lower is compliant as well.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'KeepAliveTime'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '300000'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'KeepAliveTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Three hundred thousand milliseconds is five minutes. It is the upper
    # bound the item allows, not a counsel - a lower value is compliant too.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' `
      -Name 'KeepAliveTime' -Value 300000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Kategorię ryzyka podniosłem względem paczki stanowiska roboczego,
    bo serwer jest stroną przyjmującą i miejsce w jego tablicy połączeń
    jest zasobem wspólnym.

    Skutek zmiany dotyczy na serwerze połączeń cudzych, nie własnych.
    Sesje, które mają prawo milczeć dłużej niż pięć minut, istnieją
    i trzeba je wskazać przed zmianą.

    Pięć minut jest granicą górną, nie zaleceniem.
  en: |
    I raised the category of risk against the working station's pack, a server being the taking
    side and a place in its table of connections a common means.

    The effect of the change bears on a server upon others' connections, not one's own. Sessions
    entitled to be silent longer than five minutes exist and must be named before the change.

    Five minutes is an upper bound and not a counsel.
