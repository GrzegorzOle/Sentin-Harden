id: win2016-ipv6-source-routing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Trasowanie źródłowe w nowszym protokole sieciowym wyłączone
    en: Source routing in the newer network protocol switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe odrzucać pakiety, które same niosą w sobie trasę,
    jaką mają przebyć.

    Zwykły pakiet niesie adres celu, a o drodze rozstrzygają urządzenia po
    drodze. Trasowanie źródłowe odwraca tę zasadę: nadawca wpisuje do
    pakietu listę węzłów, przez które ma on przejść, a urządzenia mają tę
    listę uszanować.

    Pomyślane to było do diagnostyki sieci i do tego służyło. Skutek uboczny
    jest jednak poważny: nadawca, który sam wybiera trasę, może wybrać
    trasę omijającą to, co go sprawdza, albo prowadzącą przez miejsce, do
    którego pakiet nie miał dotrzeć.

    Dwa zastosowania są tu klasyczne. Pierwsze to obejście podziału sieci:
    pakiet trafia do segmentu, z którym nadawca nie ma połączenia wprost,
    bo trasę poprowadzono przez maszynę mającą nogi w obu. Drugie to
    zapewnienie sobie odpowiedzi: pakiet z podrobionym adresem nadawcy
    wraca tam, gdzie chce napastnik, bo droga powrotna została wpisana
    w pakiet.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    sięgnięcia do segmentów sieci, do których nie ma drogi wprost, oraz
    otrzymania odpowiedzi na pakiety wysłane z cudzego adresu.
  en: |
    The setting has packets carrying in themselves the route they are to take dropped.

    An ordinary packet carries the address of its goal, and the devices along the way
    settle the road. Source routing reverses that rule: the sender writes into the
    packet a list of nodes it is to pass through, and the devices are to honour that
    list.

    It was thought up for diagnosing networks and served for that. The side effect is
    grave all the same: a sender choosing the route themselves can choose a route
    going round whatever checks them, or leading through a place the packet was not to
    reach.

    Two uses are classic here. The first is going round a network's division: the
    packet reaches a segment the sender has no direct connection with, the route
    having been led through a machine with legs in both. The second is securing an
    answer: a packet with a forged sender address comes back where the attacker wants,
    the way back having been written into the packet.

    What an attacker gains while the item goes unmet: the chance to reach segments of
    the network they have no direct road to, and to receive answers to packets sent
    from somebody else's address.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć w praktyce jest to jeden z łagodniejszych
    punktów sieciowych.

    Trasowanie źródłowe nie jest używane w normalnej pracy. Nie korzysta
    z niego żadne współczesne oprogramowanie, żaden protokół udostępniania
    ani zarządzania, i większość urządzeń sieciowych odrzuca takie pakiety
    sama z siebie, zanim dotrą do maszyny.

    Sprawdzić warto dwie rzeczy. Pierwsza to narzędzia diagnostyczne
    używane w tej organizacji — część z nich potrafi wykorzystywać ten
    mechanizm do prześledzenia drogi pakietu przez konkretne węzły. Po
    wdrożeniu taki tryb przestanie działać na tej maszynie, choć
    podstawowe narzędzia śledzenia trasy działają dalej, bo z niego nie
    korzystają.

    Druga to sieci laboratoryjne i testowe, w których trasowanie źródłowe
    bywa wykorzystywane rozmyślnie do wymuszenia drogi przez konkretny
    element.

    Zmiana wymaga restartu. Do czasu restartu raport pokaże zgodność,
    a system będzie pracował po staremu.

    Czego to nie psuje: zwykłego ruchu sieciowego, dostępu do plików,
    logowania, usług, podstawowych narzędzi diagnostycznych.
  en: |
    The class is "needs review", though in practice it is one of the gentler network
    items.

    Source routing is not used in normal work. No present-day software makes use of
    it, no protocol of sharing or management, and most network devices drop such
    packets of themselves before they reach the machine.

    Two things are worth checking. The first is the diagnostic tools used in this
    organisation - some of them can use the mechanism to trace a packet's road through
    particular nodes. After the rollout such a mode will stop working on this machine,
    though the basic route-tracing tools work on, not using it.

    The second is laboratory and test networks where source routing is at times used
    deliberately to force a road through a particular element.

    The change calls for a restart. Until the restart the report will show compliance
    and the system will work in the old way.

    What this does not break: ordinary network traffic, access to files, signing in,
    services, or the basic diagnostic tools.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Narzędzia diagnostyczne wykorzystujące trasowanie źródłowe do prześledzenia drogi przez konkretne węzły przestaną działać na tej maszynie
      - Podstawowe narzędzia śledzenia trasy działają dalej, bo z tego mechanizmu nie korzystają
      - W sieciach laboratoryjnych wymuszenie drogi przez konkretny element przestanie być możliwe
      - Do czasu restartu raport pokaże zgodność, a system będzie pracował po staremu
    en:
      - Diagnostic tools using source routing to trace a road through particular nodes will stop working on this machine
      - The basic route-tracing tools work on, not using the mechanism
      - In laboratory networks, forcing a road through a particular element will stop being possible
      - Until the restart the report will show compliance and the system will work in the old way
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna należy do sieci laboratoryjnej, w której trasowanie źródłowe jest używane rozmyślnie
      - Nie da się wyznaczyć okna na restart maszyny, a bez restartu zmiana i tak nie zacznie obowiązywać
    en:
      - The machine belongs to a laboratory network where source routing is used deliberately
      - No window can be set for restarting the machine, and without a restart the change will not begin to hold anyway
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
      $name = 'DisableIPSourceRouting'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
    $name = 'DisableIPSourceRouting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two means every packet carrying its own route is dropped. One leaves
    # part of them through and is not what this item asks for.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableIPSourceRouting' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Punkt dotyczy nowszego z dwóch protokołów sieciowych i warto powiedzieć,
    dlaczego jest wymieniany osobno. Starszy protokół ma własny wpis o tej
    samej nazwie, w innej gałęzi, i wdrożenie jednego nie zamyka drugiego.
    Maszyna z wyłączonym trasowaniem źródłowym w jednym protokole i włączonym
    w drugim jest maszyną, na której ta droga stoi otworem.

    Wartość dwa, a nie jeden, jest tu istotna. Jedynka zostawia część takich
    pakietów przepuszczonych, dwójka odrzuca wszystkie. Nazwa ustawienia nie
    mówi, że stopnie są trzy, więc warto to nazwać w podglądzie.

    Kategoria średnia jest szczera. Ochrona ta jest w dużej mierze
    powielona przez urządzenia sieciowe, a punkt domyka ją na maszynie —
    na wypadek ruchu, który do urządzenia nie trafił, bo powstał w tym samym
    segmencie.
  en: |
    The item concerns the newer of the two network protocols, and it is worth saying
    why it is named apart. The older protocol has an entry of its own by the same
    name, in another branch, and rolling out one does not shut the other. A machine
    with source routing switched off in one protocol and on in the other is a machine
    where that road stands open.

    The value two rather than one matters here. One leaves part of such packets
    through; two drops them all. The setting's name does not say there are three
    degrees, so that is worth naming in the preview.

    The medium category is honest. That protection is in good measure doubled by
    network devices, and the item shuts it on the machine - against traffic that never
    reached a device, having arisen in the same segment.
