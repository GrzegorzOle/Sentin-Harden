id: win2025-location-services-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Location and Sensors
  title:
    pl: Ustalanie położenia maszyny wyłączone
    en: Establishing the machine's position switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zapisuje w polityce odmowę ustalania położenia maszyny.
    Programy pytające o położenie nie dostają odpowiedzi, niezależnie od
    tego, jakie czujniki maszyna ma i jaka usługa jest na niej
    uruchomiona.

    Obniżam kategorię do niskiej z tego samego powodu, który wyłożyłem
    przy usłudze ustalania położenia: serwer nie przemieszcza się nigdzie,
    a jego miejsce jest wypisane na naklejce i w umowie z ośrodkiem
    przetwarzania.

    Pisząc ten punkt osobno, chcę nazwać, czym różni się od tamtego, bo
    dwie reguły o tej samej nazwie wyglądają na powtórzenie i kusi, żeby
    jedną z nich pominąć. Tamta wyłącza mechanizm — zatrzymuje usługę,
    która położenie ustala. Ta zapisuje decyzję — odmawia dostępu do
    położenia niezależnie od tego, czy mechanizm działa.

    Różnica jest praktyczna, nie teoretyczna. Typ uruchomienia usługi jest
    ustawieniem, które instalator producenta albo dodanie roli potrafi
    przestawić z powrotem, i zrobi to bez pytania. Wpis polityki mówi,
    co miało być, i taką zmianę przeżywa. Dlatego te dwa punkty stosuje
    się razem, a nie zamiennie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    potwierdzenie położenia maszyny, która stoi tam, gdzie stała.
  en: |
    The item writes into the rule a denying of the settling of the machine's whereabouts. Programs
    that ask after the whereabouts are given no answer, whatever the feelers the machine may have and
    whatever service be running upon it.

    I lower the category to low for the same ground I set out at the service that settles the
    whereabouts - a server moves nowhere, and its stead is written upon a sticker and in the writ with
    the house of working.

    Writing this item on its own, I would name wherein it is unlike that one, two rules of the same
    name looking like a saying twice and tempting one to pass over the one of them. That one switches
    off the working - it stops the service that settles the whereabouts. This one writes down the
    deciding - it denies the reach to the whereabouts whether or not the working run.

    The unlikeness is of practice and not of theory. The kind of the starting of a service is a setting
    that a maker's installer or the adding of a role can set back, and will do so without asking. The
    entry of the rule says what was meant and outlives such an altering. Therefore those two items are
    laid on together and not the one in the stead of the other.

    What an attacker gains while the item goes unmet - little; a making sure of the whereabouts of a
    machine standing where it stood.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Na serwerze nie ma aplikacji,
    która o położenie pyta, i nie ma człowieka, któremu odpowiedź byłaby
    do czegoś potrzebna.

    Punkt ten ma jedną własność odróżniającą go od sąsiednich w tej
    grupie i warto ją odnotować, bo wpływa na porządek pracy: nie wymaga
    żadnej przerwy. Nie zatrzymuje się tu usługi, tylko zapisuje wartość
    w polityce. Nic nie przestaje działać w trakcie, nic nie trzeba
    uruchamiać ponownie.

    Zastrzeżenie na wypadek maszyny nietypowej: jeżeli na serwerze stoi
    aplikacja korzystająca z położenia — zdarza się to w rozwiązaniach
    przemysłowych i w maszynach brzegowych z modemem — to ta zmiana
    odetnie ją od danych, a objawem będzie odmowa w aplikacji, nie
    zatrzymana usługa. Sprawdzenie polega na wskazaniu takiej aplikacji,
    a nie na przejrzeniu listy usług.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease". Upon a server there is no application that asks after the
    whereabouts, and no person to whom the answer would be needed for anything.

    This item has one mark setting it apart from those beside it in this band, and it is worth noting,
    it telling upon the ordering of the work - it takes no break at all. No service is stopped here;
    a worth is written into the rule. Nothing stops working in the meanwhile, nothing must be started
    anew.

    A saving for the case of an unwonted machine - if upon a server there stand an application drawing
    upon the whereabouts, which befalls in the workings of industry and in machines at the edge with a
    speaking-box, that change will cut it off from the data, and the showing will be a denying within
    the application and not a stopped service. The checking lies in the naming of such an application
    and not in the looking over of the list of services.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Programy pytające o położenie nie dostają odpowiedzi, niezależnie od czujników i uruchomionych usług
      - Aplikacja przemysłowa albo brzegowa korzystająca z położenia zostaje odcięta od danych
      - Objawem jest odmowa wewnątrz aplikacji, a nie zatrzymana usługa, więc szuka się w innym miejscu
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
    en:
      - Programs that ask after the whereabouts are given no answer, whatever the feelers and the running services
      - An application of industry or of the edge drawing upon the whereabouts is cut off from the data
      - The showing is a denying within the application and not a stopped service, so one seeks in another stead
      - Nothing here takes a break or a starting anew, a worth being written into the rule
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja przemysłowa albo brzegowa, która korzysta z ustalonego położenia
    en:
      - Upon the machine there stands an application of industry or of the edge that draws upon the settled whereabouts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
      $name = 'DisableLocation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    $name = 'DisableLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This records the decision. The companion item stops the service that
    # does the work; a vendor installer or an added role can put a startup
    # type back, but it will not undo this entry.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

