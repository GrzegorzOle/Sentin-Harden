id: win2025-picture-password-domain-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie obrazem dla kont domenowych wyłączone
    en: Picture sign-in for domain accounts switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania kontom domenowym logowania się obrazem — gestami
    rysowanymi na wybranym zdjęciu zamiast hasła.

    Kategoria średnia i chcę nazwać, na czym polega tu osłabienie, bo
    mechanizm bywa broniony argumentem, że gestów jest nieskończenie wiele.
    Jest ich wiele, ale nie rozkładają się równomiernie: ludzie rysują po
    twarzach, po rogach, po wyraźnych krawędziach, i robią to
    w przewidywalnej kolejności. Odgadywanie takiego wzoru jest zadaniem
    znacznie mniejszym, niż sugeruje liczba możliwości, a materiał do
    odgadnięcia — czyli samo zdjęcie — bywa dostępny.

    Druga rzecz jest ważniejsza i dotyczy obserwacji. Hasło wpisywane na
    klawiaturze trzeba podejrzeć znak po znaku. Gest narysowany na ekranie
    jest widoczny w całości, z odległości, i zapamiętuje się go jak drogę
    na mapie. Kamera skierowana na konsolę serwera wystarczy.

    Trzecia rzecz jest już swoista dla domeny: konto domenowe nie ogranicza
    się do tej maszyny. Słabszy sposób potwierdzania tożsamości ustawiony
    na jednym stanowisku dotyczy poświadczeń używanych wszędzie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    uwierzytelniania konta domenowego, który da się podejrzeć z drugiego
    końca pomieszczenia i odgadnąć z mniejszym wysiłkiem niż hasło.
  en: |
    The item forbids domain accounts to sign in with a picture - gestures
    drawn on a chosen photograph instead of a password.

    The category is medium, and I want to name where the weakening lies,
    because the mechanism is sometimes defended with the argument that there
    are countless gestures. There are many, but they are not spread evenly:
    people draw across faces, across corners, along clear edges, and they do
    it in a predictable order. Guessing such a pattern is a far smaller task
    than the number of possibilities suggests, and the material for guessing
    - the photograph itself - is sometimes available.

    The second thing matters more and concerns observation. A password typed
    on a keyboard has to be watched character by character. A gesture drawn
    on a screen is visible whole, from a distance, and is remembered like a
    route on a map. A camera pointed at a server's console is enough.

    The third thing is peculiar to the domain: a domain account is not
    confined to this machine. A weaker way of proving identity set on one
    workstation concerns credentials used everywhere.

    What an attacker gains while the item goes unmet: a way of authenticating
    a domain account that can be watched from across a room and guessed with
    less effort than a password.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze ten sposób logowania
    praktycznie nie występuje — wymaga ekranu dotykowego albo cierpliwości
    do rysowania myszą, a serwerowa konsola nie zachęca ani do jednego, ani
    do drugiego.

    Sprawdzić trzeba, czy ktoś z tej domeny takiego logowania nie używa na
    swoim stanowisku, bo zasada obejmuje konta domenowe wszędzie tam, gdzie
    ją się zastosuje. Osoba, która tak się loguje, po zmianie zobaczy tylko
    pole hasła. Hasło nadal ma — logowanie obrazem nie zastępuje hasła, tylko
    je uzupełnia — ale kto hasła nie wpisywał od miesięcy, może go nie
    pamiętać. To jest realny przypadek i warto uprzedzić, zamiast czekać na
    zgłoszenie.

    Czego to nie psuje: samego hasła, kodu dostępu, uwierzytelniania
    domenowego ani logowania kont lokalnych. Punkt dotyczy wyłącznie kont
    domenowych i wyłącznie tego jednego sposobu.

    Rzecz do zapamiętania: wpis leży w gałęzi systemowej, razem z czterema
    innymi regułami o zupełnie różnym przedmiocie. Znajoma ścieżka nie
    znaczy, że grupa jest zamknięta.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server this way of signing in
    practically does not occur - it wants a touch screen or the patience to
    draw with a mouse, and a server console invites neither.

    What needs checking is whether somebody in this domain uses such a
    sign-in at their own workstation, because the policy covers domain
    accounts wherever it is applied. A person who signs in that way will,
    after the change, see only the password field. They still have a password
    - picture sign-in does not replace a password but supplements it - yet
    somebody who has not typed it for months may not remember it. That is a
    real case and it is worth warning people rather than waiting for the
    report.

    What this does not break: the password itself, a passcode, domain
    authentication, or signing in with local accounts. The item concerns
    domain accounts only, and only this one method.

    Something to remember: the entry lies in the system branch, together with
    four other rules of an entirely different subject. A familiar path does
    not mean the group is closed.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Kto loguje się kontem domenowym przez rysowanie gestów na zdjęciu, zobaczy tylko pole hasła
      - Hasło nadal istnieje, bo logowanie obrazem je uzupełnia, a nie zastępuje — ale kto go nie wpisywał od miesięcy, może go nie pamiętać
      - Kod dostępu, uwierzytelnianie domenowe i logowanie kont lokalnych działają bez zmian
      - Wpis leży w gałęzi systemowej razem z czterema innymi regułami o zupełnie różnym przedmiocie
    en:
      - Anybody signing in to a domain account by drawing gestures on a photograph will see only the password field
      - The password still exists, because picture sign-in supplements rather than replaces it - but somebody who has not typed it for months may not remember it
      - A passcode, domain authentication and signing in with local accounts work unchanged
      - The entry lies in the system branch together with four other rules of an entirely different subject
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W domenie działają stanowiska z ekranem dotykowym, na których logowanie obrazem jest przyjętym i świadomie wybranym sposobem pracy
    en:
      - The domain has touch-screen workstations where picture sign-in is an accepted and deliberately chosen way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'BlockDomainPicturePassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'BlockDomainPicturePassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A gesture is visible whole, from a distance, and is remembered like a route
    # on a map, while a typed password has to be watched character by character.
    # A domain account is not confined to this machine, so a weaker method set
    # here concerns credentials used everywhere.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockDomainPicturePassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/

notes:
  pl: |
    Mechanizm bywa broniony argumentem, że gestów jest nieskończenie wiele.
    Jest ich wiele, ale nie rozkładają się równomiernie: ludzie rysują po
    twarzach, po rogach i po wyraźnych krawędziach, w przewidywalnej
    kolejności — a materiał do odgadnięcia, czyli samo zdjęcie, bywa
    dostępny.

    Ważniejsza jest obserwacja. Hasło z klawiatury trzeba podejrzeć znak po
    znaku; gest jest widoczny w całości, z odległości, i zapamiętuje się go
    jak drogę na mapie. Kamera skierowana na konsolę wystarczy.

    Rzecz swoista dla domeny: konto domenowe nie ogranicza się do tej
    maszyny, więc słabszy sposób potwierdzania tożsamości dotyczy
    poświadczeń używanych wszędzie.
  en: |
    The mechanism is sometimes defended with the argument that there are
    countless gestures. There are many, but they are not spread evenly:
    people draw across faces, across corners and along clear edges, in a
    predictable order - and the material for guessing, the photograph itself,
    is sometimes available.

    Observation matters more. A password on a keyboard has to be watched
    character by character; a gesture is visible whole, from a distance, and
    is remembered like a route on a map. A camera pointed at the console is
    enough.

    A thing peculiar to the domain: a domain account is not confined to this
    machine, so a weaker way of proving identity concerns credentials used
    everywhere.
