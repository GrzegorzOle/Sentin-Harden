id: win10-impersonate-client-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Personifikacja klienta ograniczona do administratorów i kont usługowych
    en: The impersonation of a client restricted to administrators and service accounts
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo personifikacji klienta do administratorów,
    dwóch kont usługowych i klasy procesów usługowych.

    Personifikacja jest mechanizmem, bez którego usługi sieciowe nie
    mogłyby działać. Usługa przyjmująca żądanie od użytkownika przybiera
    na czas jego obsługi tożsamość tego użytkownika, żeby system sprawdził
    uprawnienia właściwej osoby, a nie samej usługi.

    Prawo to bywa jednak najczęstszym celem ataków na maszynę z wnętrza
    konta usługowego. Rodzina technik znana od lat polega na tym, żeby
    skłonić proces uprzywilejowany do połączenia się z procesem
    napastnika — a wtedy napastnik personifikuje nie użytkownika, lecz
    konto systemowe.

    Skutkiem jest przejście z konta usługowego o niewielkich
    uprawnieniach wprost do konta systemowego. Jest to droga stosowana
    w praktyce po każdym przejęciu usługi sieciowej i warto ograniczyć
    zbiór kont, którym w ogóle jest dostępna.

    Odnotowuję, że klasa procesów usługowych pozostaje w wykazie. Bez niej
    usługi sieciowe przestałyby obsługiwać żądania w imieniu użytkowników.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    z przejętej usługi wprost do uprawnień systemowych.
  en: |
    The setting bounds the right of impersonating a client to the administrators, to two service accounts and to
    the class of service processes.

    Impersonation is a mechanism without which services upon a network could not work. A service taking a request
    from a user puts on, for the time of the serving, that user's name, that the system may check the rights of
    the right person and not of the service itself.

    That right is however the commonest mark of attacks upon a machine from within a service account. A family of
    techniques known for years rests upon bringing a privileged process to join itself to the attacker's process -
    and then the attacker impersonates not a user but the system's own account.

    The upshot is a passage from a service account of small rights straight to the system's account. It is a road
    used in practice after every taking of a service upon a network, and it is worth bounding the set of accounts
    it is open to at all.

    I set down that the class of service processes stays in the list. Without it services upon a network would
    cease to serve requests in users' names.

    What an attacker gains while the item goes unmet: a road from a taken service straight to the system's rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest
    oprogramowanie serwerowe na maszynie.

    Miejscem najczęstszym są serwery aplikacyjne i bazodanowe uruchamiane
    pod kontem innym niż wbudowane. Program taki potrzebuje personifikacji
    do obsługi żądań w imieniu użytkowników i jego konto bywa dopisywane
    do wykazu przy instalacji. Odebranie prawa zatrzyma obsługę żądań.

    Objaw jest charakterystyczny: usługa startuje poprawnie, ale odmawia
    obsługi każdego żądania wymagającego sprawdzenia uprawnień
    użytkownika. Komunikat mówi zwykle o odmowie dostępu, a nie
    o brakującym prawie.

    Sprawdzenie polega na przeczytaniu wykazu przed zmianą. Wpis spoza
    zbioru wymaganego oznacza, że jakaś usługa tego prawa używa.

    Odnotowuję, że domyślny wykaz na maszynie roboczej odpowiada już
    wymaganiu. Zmiana jest wtedy zapisem stanu.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: pracy lokalnej, logowania, dostępu do plików,
    udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is the server software upon the machine.

    The commonest places are servers of applications and of bases run under an account other than a built-in one.
    Such a program needs impersonation to serve requests in users' names, and its account is at times added to the
    list at its installing. The taking away of the right will hold the serving of requests.

    The mark of it is telling: the service starts rightly but refuses the serving of every request that calls for
    a user's rights to be checked. The message commonly speaks of a refusal of access and not of a right that is
    wanting.

    The review comes down to a reading of the list before the change. An entry outside the called-for set means
    some service uses this right.

    I set down that the default list upon a working machine already answers the requirement. The change is then a
    setting down of a state.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: work upon the machine itself, logging on, the way to files, file shares, or
    printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - web-server-services
  what_breaks:
    pl:
      - Serwer aplikacyjny albo bazodanowy pod kontem innym niż wbudowane odmówi obsługi żądań użytkowników
      - Usługa wystartuje poprawnie, ale odmówi każdego żądania wymagającego sprawdzenia uprawnień użytkownika
      - Komunikat mówi zwykle o odmowie dostępu, a nie o brakującym prawie, więc rozpoznanie bywa trudne
      - Domyślny wykaz na maszynie roboczej odpowiada już wymaganiu, więc zmiana jest tam zapisem stanu
      - Praca lokalna, logowanie, dostęp do plików, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A server of applications or of bases under an account other than a built-in one will refuse to serve users requests
      - The service will start rightly but refuse every request that calls for a user s rights to be checked
      - The message commonly speaks of a refusal of access and not of a right that is wanting, so the telling is at times hard
      - The default list upon a working machine already answers the requirement, so there the change is a setting down of a state
      - Work upon the machine itself, logging on, the way to files, file shares and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi serwer aplikacyjny pod własnym kontem usługowym, wymagający personifikacji do obsługi żądań
    en:
      - Upon the machine stands a server of applications under a service account of its own, needing impersonation to serve requests
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeImpersonatePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20,S-1-5-32-544,S-1-5-6|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeImpersonatePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeImpersonatePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators, to the two service accounts and to
    # the class of service processes. That is the set a working system takes.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeImpersonatePrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-20,*S-1-5-6',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeImpersonatePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/impersonate-a-client-after-authentication

notes:
  pl: |
    Reguła jest w tym bloku najbardziej związana z konkretną rodziną
    technik ataku i warto, żeby aplikacja to powiedziała. Pozostałe punkty
    zamykają możliwości; ten zamyka drogę, którą napastnicy chodzą
    regularnie i pod nazwą, którą łatwo odszukać.

    Argument wart postawienia wprost dotyczy tego, kogo się personifikuje.
    Mechanizm powstał po to, żeby usługa mogła przybrać tożsamość swojego
    klienta. Atak polega na tym, żeby klientem usługi napastnika stał się
    proces systemowy — a wtedy ta sama, przewidziana droga prowadzi
    w górę zamiast w bok.

    Odnotowuję, że zbiór pozostawiony w wykazie nie jest wyborem
    ostrożnościowym, tylko koniecznym. Usunięcie klasy procesów usługowych
    zatrzyma obsługę żądań w imieniu użytkowników na całej maszynie,
    więc wykaz węższy nie jest tu utwardzeniem, tylko awarią.
  en: |
    The rule is of this block the most bound to a particular family of techniques of attack, and it is well that
    the application say so. The other items shut chances; this shuts a road attackers walk regularly and under a
    name easily looked up.

    The argument worth putting outright touches whom one impersonates. The mechanism came about that a service
    might put on its client's name. The attack rests upon making a system process the client of the attacker's
    service - and then that same foreseen road leads upward instead of sideways.

    I set down that the set left in the list is no choice of caution but a needful one. The taking out of the
    class of service processes will hold the serving of requests in users' names upon the whole machine, so a
    narrower list is here no hardening but a failure.
