id: win2025-remote-registry-exact-paths

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista gałęzi rejestru dostępnych zdalnie ograniczona do trzech pozycji
    en: The list of registry keys reachable remotely limited to three entries
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Wykaz wylicza gałęzie rejestru, do których wolno sięgnąć zdalnie
    bez uwierzytelnienia — i wyłącznie te gałęzie, bez ich zawartości.

    Rejestr jest opisem maszyny. Zainstalowane oprogramowanie, wersje
    składników, konfiguracja usług i nazwy kont — wszystko to daje się
    z niego odczytać. Wykaz otwarty szeroko jest więc wykazem tego, co
    napastnik może dowiedzieć się o serwerze, zanim spróbuje na nim
    czegokolwiek.

    Punkt zawęża wykaz do trzech pozycji. Dwie z nich mówią o rodzaju
    i roli systemu, trzecia o jego wersji. Są to dane, które maszyna
    i tak ujawnia przy zwykłej rozmowie sieciowej, więc ich obecność
    niczego nie zmienia — a wszystko poza nimi zmienia.

    Na serwerze rzecz waży więcej niż na stanowisku roboczym z powodu
    wartości rozpoznania. Kto czyta rejestr serwera, ten ustala wersje
    zainstalowanych usług, a więc i to, które z nich mają znane
    słabości. Rozpoznanie takie jest tanie, ciche i nie wymaga żadnego
    konta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: opis
    zainstalowanego oprogramowania i konfiguracji serwera odczytany
    zdalnie, bez podania konta i bez śladu w dzienniku logowań.
  en: |
    The list counts up the registry keys that may be reached remotely without authentication -
    and those keys alone, without their contents.

    The registry is a description of the machine. Installed software, the versions of parts, the
    setting up of services and accounts' names - all of that can be read from it. A list opened
    wide is thus a list of what an attacker may learn about the server before ever trying
    anything on it.

    The item narrows the list to three entries. Two of them speak of the system's kind and part,
    the third of its version. Those are data the machine gives away in ordinary network talk
    anyway, so their standing there changes nothing - while everything beyond them changes
    something.

    On a server the matter weighs more than at a working station by reason of what the
    reconnaissance is worth. Whoever reads a server's registry settles the versions of the
    installed services, and thereby which of them bear known weaknesses. Such reconnaissance is
    cheap, quiet and takes no account at all.

    What an attacker gains while the item goes unmet: a description of the server's installed
    software and setting up, read remotely, with no account named and no trace in the sign-in
    log.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy coś odczytuje rejestr tego serwera
    zdalnie i którą gałąź czyta.

    W stanie domyślnym wykaz zawiera dokładnie te trzy pozycje, więc na
    części serwerów naprawa nie zmienia niczego. Niezgodność bierze się
    zwykle z pozycji dopisanej kiedyś pod konkretne narzędzie.

    Przypadkiem do sprawdzenia jest inwentaryzacja oprogramowania.
    Narzędzia zbierające wykaz zainstalowanych programów odczytują go
    wprost z rejestru i robią to zdalnie, bo tak jest najprościej.
    Po zawężeniu przestaną go otrzymywać.

    Drugim przypadkiem jest oprogramowanie zarządzające producenta
    sprzętu, sięgające po dane o konfiguracji maszyny.

    Objaw jest natychmiastowy, ale zwykle niegroźny: narzędzie
    zgłasza brak dostępu do gałęzi i pomija maszynę w zestawieniu.
    Rzadko oznacza to przerwę w pracy czegokolwiek — częściej dziurę
    w raporcie, którą zauważa się przy następnym przeglądzie.

    Właściwym rozwiązaniem nie jest rozszerzenie wykazu, tylko
    odczytywanie rejestru na koncie uwierzytelnionym. Wykaz ten dotyczy
    wyłącznie dostępu bez podania konta; narzędzie pracujące na koncie
    z uprawnieniami czyta rejestr niezależnie od niego.

    Zmiana nie wymaga przerwy i wchodzi w życie natychmiast.
  en: |
    What needs checking is whether anything reads this server's registry remotely and which key
    it reads.

    In the default state the list holds exactly those three entries, so on some servers the
    mending changes nothing. Non-compliance usually comes of an entry written in once for a
    particular tool's sake.

    The case to be checked is the taking of software inventory. Tools gathering the list of
    installed programs read it straight from the registry and do so remotely, that being
    simplest. After the narrowing they will stop getting it.

    A second case is a hardware maker's management software, reaching for data about the
    machine's setting up.

    The symptom is immediate but usually harmless: the tool reports a want of access to the key
    and passes the machine over in its summary. It seldom means a break in anything's working -
    more often a hole in a report, marked at the next review.

    The right answer is not a widening of the list but a reading of the registry under an
    authenticated account. This list bears only on access with no account named; a tool working
    under an account with rights reads the registry whatever it says.

    The change takes no break and comes into force at once.

implementation_consequences:
  impact_areas:
    - remote-management
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzie inwentaryzujące oprogramowanie zdalnie przestanie odczytywać wykaz z rejestru
      - Oprogramowanie zarządzające producenta sprzętu może pominąć maszynę w zestawieniu
      - Objaw to zwykle dziura w raporcie, a nie przerwa w pracy czegokolwiek
      - Narzędzie pracujące na koncie uwierzytelnionym czyta rejestr niezależnie od tego wykazu
    en:
      - A tool taking software inventory remotely will stop reading the list from the registry
      - A hardware maker's management software may pass the machine over in its summary
      - The symptom is usually a hole in a report rather than a break in anything's working
      - A tool working under an authenticated account reads the registry whatever this list says
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Inwentaryzacja oprogramowania odczytuje rejestr tego serwera zdalnie bez podania konta
      - Nie ustalono, które gałęzie rejestru dopisano do wykazu i pod jakie narzędzie
    en:
      - The taking of software inventory reads this server's registry remotely with no account named
      - It has not been settled which keys were written into the list and for which tool's sake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The list is compared as a set, without regard to order or letter case,
      # because neither carries meaning here. A list that differs is reported
      # together with its contents rather than as a bare failure.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedExactPaths'
      $name = 'Machine'
      $expected = @(
        'System\CurrentControlSet\Control\ProductOptions',
        'System\CurrentControlSet\Control\Server Applications',
        'SOFTWARE\Microsoft\Windows NT\CurrentVersion'
      )
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = @($item.$name | Where-Object { $null -ne $_ -and $_ -ne '' })
        $left = ($value | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        $right = ($expected | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        if ($left -eq $right) { 'EXACT_MATCH' }
        elseif ($value.Count -eq 0) { 'EMPTY' }
        else { 'OTHER ' + ($value -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: EXACT_MATCH
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedExactPaths'
    $name = 'Machine'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = @($current)
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedExactPaths'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $value = @(
      'System\CurrentControlSet\Control\ProductOptions',
      'System\CurrentControlSet\Control\Server Applications',
      'SOFTWARE\Microsoft\Windows NT\CurrentVersion'
    )
    Set-ItemProperty -Path $path -Name 'Machine' -Value $value -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value @($b.value) -Type MultiString
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-remotely-accessible-registry-paths

notes:
  pl: |
    Wykaz dotyczy wyłącznie dostępu bez podania konta. Narzędzie
    pracujące na koncie z uprawnieniami czyta rejestr niezależnie od
    niego — i to jest właściwe rozwiązanie, gdy zawężenie coś zepsuje.

    Sprawdzenie porównuje wykaz jako zbiór, bez względu na kolejność
    i wielkość liter, bo żadna z tych rzeczy nie niesie tu znaczenia.
    Wykaz odmienny raportowany jest razem z zawartością, żeby dało się
    zobaczyć, co dopisano.

    Punkt czyta się razem z wykazem gałęzi dostępnych wraz z
    zawartością. Tamten otwiera gałąź i wszystko poniżej; ten samą
    gałąź.
  en: |
    The list bears only on access with no account named. A tool working under an account with
    rights reads the registry whatever it says - and that is the right answer where the
    narrowing spoils something.

    The check compares the list as a set, without regard to order or letter case, neither
    carrying meaning here. A list that differs is reported together with its contents, so that
    what was written in may be seen.

    The item is read together with the list of keys reachable along with their contents. That
    one opens a key and all beneath it; this one the key alone.
