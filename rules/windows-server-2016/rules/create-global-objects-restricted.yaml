id: win2016-create-global-objects-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie obiektów globalnych ograniczone do kont usługowych
    en: Creating global objects restricted to service accounts
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do tworzenia obiektów globalnych do
    administratorów, usług i kont systemowych.

    Obiekt globalny to taki, który widzą wszystkie sesje na maszynie, a nie
    tylko ta, która go utworzyła. Na serwerze z rolą sesji zdalnych każdy
    zalogowany pracuje we własnej, odizolowanej przestrzeni nazw — i ta izolacja
    jest tym, co sprawia, że sesje nie wchodzą sobie w drogę.

    Uprawnienie to pozwala tę izolację przebić. Proces w sesji użytkownika może
    utworzyć obiekt widoczny we wszystkich sesjach naraz, w tym w sesji usług
    systemowych. Jeżeli inny program spodziewa się obiektu o danej nazwie,
    a napastnik utworzy go pierwszy, to program sięgnie po obiekt podstawiony.

    Kategoria wysoka, bo to jest mechanizm przejścia między sesjami, a na
    serwerze wielosesyjnym oznacza przejście między użytkownikami — również
    do sesji, w której pracuje administrator.

    Na serwerze 2016 rzecz waży najbardziej tam, gdzie działa rola sesji
    zdalnych albo serwer aplikacyjny udostępniający program wielu osobom naraz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę z własnej
    sesji do cudzej, w tym do sesji usług systemowych, przez obiekt podstawiony
    pod nazwę, której oczekuje inny program.
  en: |
    The item limits the right to create global objects to administrators, services
    and system accounts.

    A global object is one that every session on the machine sees, not only the one
    that created it. On a server with the remote sessions role each signed-in
    person works in their own, isolated namespace - and that isolation is what
    keeps sessions out of one another's way.

    This right allows that isolation to be pierced. A process in a user's session
    can create an object visible in every session at once, including the services'
    session. If another program expects an object of a given name and the attacker
    creates it first, the program will reach for the substituted object.

    The category is high, because this is a mechanism of passage between sessions,
    and on a multi-session server that means passage between users - including into
    the session an administrator works in.

    On Server 2016 this weighs most where the remote sessions role runs, or an
    application server presenting a program to many people at once.

    What an attacker gains while the item goes unmet: a road from their own session
    into somebody else's, including the services' session, through an object
    substituted under a name another program expects.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo starsze oprogramowanie bywa napisane tak, że
    tworzy obiekty globalne z sesji użytkownika.

    Typowy przypadek to aplikacja branżowa z czasów, gdy serwer obsługiwał
    jednego użytkownika naraz, więc rozróżnienie obiektów lokalnych i globalnych
    nie miało znaczenia. Program taki tworzy obiekt globalny, bo tak go napisano,
    a nie dlatego, że tego potrzebuje.

    Objaw odebrania uprawnienia jest natychmiastowy, ale bywa nieczytelny:
    program zgłasza błąd dostępu albo po prostu nie wstaje, a komunikat nie
    mówi nic o obiektach. Diagnoza bez wiedzy o tej zmianie bywa długa.

    Sprawdzenie sprowadza się do pytania, czy na maszynie działa starsza
    aplikacja uruchamiana w sesji użytkownika. Jeżeli tak, warto zmianę
    przetestować na jednej sesji przed wdrożeniem dla wszystkich.

    Czego to nie psuje: usług systemowych, aplikacji działających na kontach
    usługowych ani pracy w ramach pojedynczej sesji.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because older software is sometimes written to
    create global objects from a user's session.

    The typical case is a line-of-business application from a time when a server
    served one user at a time, so the distinction between local and global objects
    did not matter. Such a program creates a global object because that is how it
    was written, not because it needs one.

    The symptom of taking the right away is immediate but sometimes illegible: the
    program reports an access error or simply does not start, and the message says
    nothing about objects. Diagnosis without knowledge of this change can take a
    while.

    The check comes down to asking whether an older application started in a user's
    session runs on the machine. If so, the change is worth testing on one session
    before rolling it out to everybody.

    What this does not break: the system's services, applications running under
    service accounts, or work within a single session.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - remote-desktop
    - virtualization-and-containers
  what_breaks:
    pl:
      - Starsza aplikacja branżowa uruchamiana w sesji użytkownika przestaje wstawać albo zgłasza błąd dostępu
      - Komunikat o błędzie nie wspomina o obiektach, więc diagnoza bez wiedzy o tej zmianie bywa długa
      - Na maszynie z rolą sesji zdalnych skutek dotyczy każdej sesji użytkownika z osobna
      - Usługi systemowe i aplikacje na kontach usługowych działają bez zmian
    en:
      - An older line-of-business application started in a user's session stops starting or reports an access error
      - The error message does not mention objects, so diagnosis without knowledge of this change can take a while
      - On a machine with the remote sessions role the effect touches every user session separately
      - The system's services and applications under service accounts work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa starsza aplikacja uruchamiana w sesji użytkownika i nie sprawdzono, czy tworzy obiekty globalne
    en:
      - An older application started in a user's session runs on the machine and it has not been checked whether it creates global objects
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreateGlobalPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20,S-1-5-32-544,S-1-5-6|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreateGlobalPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreateGlobalPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a multi-session server this is the passage between users' sessions. Test
    # older applications on one session first - the error they report says nothing
    # about objects.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeCreateGlobalPrivilege = *S-1-5-32-544,*S-1-5-6,*S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateGlobalPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-global-objects

notes:
  pl: |
    Oczekiwana lista obejmuje administratorów lokalnych, usługę, usługę
    sieciową i konto usługi. Nie jest to lista pusta i nie powinna nią być:
    usługi systemowe tworzą obiekty globalne z natury swojej pracy.

    Punkt ma pełne znaczenie dopiero na maszynie wielosesyjnej. Na serwerze
    obsługiwanym wyłącznie przez administratorów zmiana jest porządkowa —
    i właśnie dlatego kosztuje tam zero.

    Rozróżnienie obiektów lokalnych i globalnych jest niewidoczne dla
    użytkownika i dla większości narzędzi diagnostycznych. To jest powód, dla
    którego objaw tej zmiany bywa mylnie przypisywany czemuś innemu.
  en: |
    The expected list covers the local administrators, the service, the network
    service and the service account. It is not an empty list and should not be one:
    the system's services create global objects by the nature of their work.

    The item carries its full weight only on a multi-session machine. On a server
    served by administrators alone the change is housekeeping - and that is exactly
    why it costs nothing there.

    The distinction between local and global objects is invisible to a user and to
    most diagnostic tools. That is why this change's symptom gets wrongly ascribed
    to something else.
