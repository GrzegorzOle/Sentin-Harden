id: ubuntu2404-pam-modules-version

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.3.1.2
  section: Access Control > Pluggable Authentication Modules > Configure PAM software packages
  title:
    pl: Pakiet libpam-modules jest zainstalowany
    en: Ensure libpam-modules is installed
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Pakiet libpam-modules zawiera moduły PAM, na których opierają się dalsze
    punkty tego rozdziału, m.in. pam_unix, pam_faillock i pam_pwhistory.
    Starsze wersje nie mają części opcji tych modułów, np. odczytu ustawień
    pam_pwhistory z pliku /etc/security/pwhistory.conf.

    Punkt wymaga pakietu libpam-modules w wersji 1.5.3-5 lub nowszej.
  en: |
    The libpam-modules package contains the PAM modules that later items of
    this chapter rely on, among them pam_unix, pam_faillock and
    pam_pwhistory. Older versions lack some options of these modules, for
    example reading the pam_pwhistory settings from
    /etc/security/pwhistory.conf.

    The item requires the libpam-modules package in version 1.5.3-5 or
    later.

disruption_description:
  pl: |
    Nikt tego nie zauważy: pakiet należy do podstawowego systemu i każde
    wydanie Ubuntu 24.04 ma go w wersji 1.5.3-5 lub nowszej.
  en: |
    Nobody will notice: the package is part of the base system and every
    Ubuntu 24.04 release has it in version 1.5.3-5 or later.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Brak znanych skutków; reguła tylko sprawdza wersję pakietu
    en:
      - No known effects; the rule only checks the package version
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v dpkg-query >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    v=$(dpkg-query -W -f='${db:Status-Status} ${Version}' libpam-modules 2>/dev/null) || v=""
    case "$v" in
      "installed "*) v=${v#installed } ;;
      *) echo "NOT_OK:libpam-modules=not-installed"; exit 0 ;;
    esac
    if dpkg --compare-versions "$v" ge 1.5.3-5; then echo "OK:libpam-modules=$v"; else echo "NOT_OK:libpam-modules=$v,need=1.5.3-5"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://manpages.ubuntu.com/manpages/noble/man1/dpkg-query.1.html
  - https://manpages.ubuntu.com/manpages/noble/man1/dpkg.1.html
  - https://manpages.ubuntu.com/manpages/noble/man8/apt-get.8.html

notes:
  pl: |
    Sprawdzenie pyta dpkg-query o wersję pakietu libpam-modules i porównuje
    ją poleceniem dpkg --compare-versions, więc wersje Ubuntu, np.
    1.5.3-5ubuntu5, są zgodne. Reguła tylko sprawdza stan: bez tego pakietu
    nie działa żadne logowanie, więc jego instalacja i usuwanie nie nadają
    się do naprawy i wycofania. Pakiet aktualizuje się razem z resztą
    systemu, np. apt-get upgrade albo unattended-upgrades.
  en: |
    The check asks dpkg-query for the version of the libpam-modules package
    and compares it with dpkg --compare-versions, so Ubuntu versions such as
    1.5.3-5ubuntu5 are compliant. The rule only checks the state: no login
    works without this package, so installing and removing it is not fit
    for a remediation and rollback. The package is updated together with the
    rest of the system, for example with apt-get upgrade or
    unattended-upgrades.
