id: win10-trusted-credential-manager-access-none

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dostęp do menedżera poświadczeń jako obiekt zaufany nieprzyznany nikomu
    en: Access to the credential manager as a trusted caller granted to nobody
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że żadne konto ani grupa nie ma uprawnienia
    pozwalającego czytać magazyn zapisanych poświadczeń z pominięciem
    zwykłych ograniczeń.

    Magazyn poświadczeń przechowuje to, co ludzie kazali zapamiętać: hasła
    do udziałów, do aplikacji, do stron. Zwykle dostęp do niego ma wyłącznie
    właściciel, i to wyłącznie w swojej sesji. Uprawnienie, o którym mówi ta
    reguła, jest obejściem tej zasady, przewidzianym dla oprogramowania
    zaufanego.

    Rzecz istotna dla oceny: w systemie nie ma dziś składnika, który by tego
    uprawnienia potrzebował. Uprawnienie przyznane komukolwiek jest więc
    albo pozostałością po oprogramowaniu wycofanym, albo śladem po kimś, kto
    przyznał je świadomie i nie po to, żeby coś naprawić.

    Konto posiadające to uprawnienie odczytuje magazyn w całości, bez
    logowania się na cudze konto i bez znajomości żadnego hasła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wszystkie
    zapamiętane hasła wszystkich użytkowników tej maszyny, odczytane wprost
    z magazynu.
  en: |
    The setting makes it so that no account and no group holds the right to read the store of saved credentials
    past the ordinary bounds.

    The credential store keeps what people have bidden be remembered: passwords to shares, to applications, to
    sites. As a rule only the owner reaches it, and only within their own session. The right this rule speaks of
    is a way round that, foreseen for trusted software.

    A thing that matters to the judgement: there is in the system today no component that would need that right.
    A right granted to anybody is therefore either a leaving from software withdrawn, or a trace of somebody who
    granted it knowingly and not in order to mend something.

    An account holding that right reads the store whole, without logging in to somebody else's account and
    without knowing any password.

    What an attacker gains while the item goes unmet: every remembered password of every user of this machine,
    read straight out of the store.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Uprawnienie jest domyślnie nieprzyznane nikomu i reguła zwykle
    potwierdza stan zastany.

    Skutek mógłby wystąpić wyłącznie tam, gdzie przyznano je świadomie.
    Oprogramowania wymagającego tego uprawnienia na maszynie wspieranej
    w praktyce nie ma, więc wpis znaleziony przy audycie wart jest pytania,
    skąd się wziął, zanim zostanie usunięty.

    Odnotowuję przerwę: uprawnienia tego rodzaju wchodzą przy następnym
    zalogowaniu konta, którego dotyczą. Konto zalogowane w chwili zmiany
    zachowuje je do wylogowania.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: dostępu do własnych zapamiętanych haseł, logowania,
    kont domenowych, udziałów plikowych, drukowania, aplikacji.
  en: |
    The class is "no disruption".

    The right is by default granted to nobody and the rule as a rule confirms the state found.

    A consequence could come up only where it had been granted knowingly. Software calling for that right upon a
    supported machine there is in practice none, so an entry found at an audit is worth a question as to where
    it came from, before it is taken away.

    I set down the break: rights of this kind take hold at the next logging on of the account they touch. An
    account logged on at the moment of the change keeps them until it logs off.

    There are no known regressions for everyday work.

    What this does not break: the reach to one's own remembered passwords, logging on, domain accounts, file
    shares, printing, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Oprogramowanie, któremu przyznano to uprawnienie świadomie, traci wgląd w magazyn poświadczeń
      - Wpis znaleziony przy audycie wart jest pytania, skąd się wziął, zanim zostanie usunięty
      - Konto zalogowane w chwili zmiany zachowuje uprawnienie aż do wylogowania
      - Dostęp użytkownika do własnych zapamiętanych haseł nie zmienia się wcale
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Software to which that right was knowingly granted loses its sight of the credential store
      - An entry found at an audit is worth a question as to where it came from, before it is taken away
      - An account logged on at the moment of the change keeps the right until it logs off
      - A user s reach to their own remembered passwords does not change at all
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa oprogramowanie, któremu to uprawnienie przyznano świadomie i którego nie da się jeszcze zastąpić
    en:
      - Software to which that right was knowingly granted works upon the machine and cannot yet be replaced
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTrustedCredManAccessPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is emptied, not narrowed. Nothing supported asks for it, and an
    # account holding it reads the store of saved credentials whole.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTrustedCredManAccessPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTrustedCredManAccessPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/access-credential-manager-as-a-trusted-caller

notes:
  pl: |
    Reguła jest w tym bloku drugą o kategorii krytycznej przy klasie bez
    uciążliwości i podobnie jak pierwsza należy do szybkich wygranych.

    Odnotowuję rzecz, która odróżnia ją od większości reguł tej paczki:
    niezgodność nie jest tu stanem domyślnym, tylko śladem decyzji. System
    nikomu tego uprawnienia nie przyznaje, więc wpis znaleziony przy audycie
    zawsze ktoś wpisał. Warto, żeby aplikacja postawiła to pytanie, zamiast
    proponować samo usunięcie — odpowiedź bywa ciekawsza niż naprawa.

    Argument wart zachowania dotyczy zakresu. Uprawnienie to nie daje
    dostępu do jednego hasła ani do jednego konta, tylko do magazynu
    w całości. Jest to różnica między pojedynczym poświadczeniem
    a wszystkim, co na tej maszynie kazano zapamiętać.
  en: |
    The rule is the second in this block of a critical category beside the class "no disruption" and, like the
    first, belongs among the quick wins.

    I set down a thing that parts it from most rules in this pack: the mismatch here is not a default state but
    the trace of a decision. The system grants that right to nobody, so an entry found at an audit was always
    written by somebody. It is well that the application put that question rather than offer the taking away
    alone - the answer is at times more interesting than the mending.

    The argument worth keeping touches reach. That right gives no access to one password nor to one account, but
    to the store whole. It is the difference between a single credential and everything this machine has been
    bidden remember.
