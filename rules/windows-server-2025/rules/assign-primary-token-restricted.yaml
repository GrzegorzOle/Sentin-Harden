id: win2025-assign-primary-token-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zastępowanie tokenu procesu ograniczone do kont usługowych
    en: Replacing a process token restricted to service accounts
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala uruchomić nowy proces i wskazać mu tożsamość inną niż
    własna — czyli utworzyć proces działający jako ktoś inny.

    Jest to trzecie z praw dotyczących tożsamości i warto je odróżnić
    od pozostałych dwóch. Tworzenie tokenu pozwala zbudować przepustkę
    od zera; podszywanie się pozwala przyjąć tożsamość klienta na czas
    obsługi jego żądania. To prawo pozwala nadać taką tożsamość nowemu
    procesowi — czyli utrwalić ją, zamiast używać przez chwilę.

    Różnica ta ma znaczenie praktyczne. Proces uruchomiony z cudzą
    tożsamością działa dalej po zakończeniu połączenia, które jej
    dostarczyło, i pracuje tak długo, jak sobie życzy. Podszycie się
    trwa chwilę; nadany token trwa do zamknięcia procesu.

    Na serwerze mechanizm ten jest używany zgodnie z przeznaczeniem.
    Usługi uruchamiające zadania w imieniu użytkowników — harmonogramy
    aplikacyjne, serwery zadań wsadowych, usługi pośredniczące —
    opierają się na nim z konieczności.

    Punkt zawęża wykaz do dwóch kont usług wbudowanych, które
    mechanizmu faktycznie potrzebują.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość uruchomienia procesu trwałego z tożsamością cudzą,
    zdobytą przy jednym krótkim połączeniu.
  en: |
    The right allows a new process to be started and an identity other than one's own to be
    named for it - that is, a process to be made that acts as somebody else.

    It is the third of the rights bearing on identity and is worth telling from the other two.
    The making of a token lets a pass be built from nothing; impersonation lets a client's
    identity be taken on for the time of serving their request. This right lets such an
    identity be set on a new process - that is, fixed, rather than used for a moment.

    That difference weighs in practice. A process started with another's identity goes on
    working after the connection that brought it has ended, and works as long as it pleases.
    An impersonation lasts a moment; a token set lasts until the process closes.

    On a server the mechanism is used as meant. Services that start tasks in users' names -
    application schedulers, batch job servers, go-between services - rest on it of necessity.

    The item narrows the list to the two built-in service accounts that in fact take the
    mechanism.

    What an attacker gains while the item goes unmet: the means of starting a lasting process
    with another's identity, won at one short connection.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze pracuje usługa
    uruchamiająca procesy w imieniu użytkowników, bo po zawężeniu
    przestanie móc to robić.

    Wykaz zgodny obejmuje dwa konta usług wbudowanych, na których
    pracuje większość usług systemowych. Usługi te działają po zmianie
    bez różnicy.

    Skutek dotyczy usług uruchomionych na kontach utworzonych celowo.
    Na serwerze bywają to serwery zadań wsadowych, usługi pośredniczące
    między aplikacją a bazą danych oraz harmonogramy aplikacyjne
    uruchamiające zadania w imieniu osoby, która je zleciła.

    Objaw jest natychmiastowy: usługa działa, ale próba uruchomienia
    procesu z cudzą tożsamością kończy się błędem. Zwykle widać to
    w dzienniku aplikacji jako niepowodzenie uruchomienia zadania,
    a nie jako problem z uprawnieniami — i dlatego diagnoza bywa
    kierowana w złą stronę.

    Rozwiązaniem nie jest dodanie konta usługi do administratorów.
    Właściwym krokiem jest wyjątek obejmujący to konkretne konto,
    zapisany jako świadoma decyzja.

    Zmiana nie dotyka procesów już uruchomionych. Skutek pojawia się
    przy następnym uruchomieniu procesu, więc na serwerze pracującym
    ciągle bywa opóźniony.
  en: |
    What needs checking is whether a service that starts processes in users' names works on
    this server, since after the narrowing it will no longer be able to.

    The compliant list takes in the two built-in service accounts most system services work
    under. Those services work after the change with no difference.

    The effect concerns services started under accounts made on purpose. On a server those are
    at times batch job servers, go-between services between an application and a database, and
    application schedulers that start tasks in the name of the person who ordered them.

    The symptom is immediate: the service works, but a try at starting a process with another's
    identity ends in an error. It usually shows in the application's log as a failure to start
    a task rather than as a trouble with rights - and hence the diagnosis is at times pointed
    the wrong way.

    The answer is not adding the service's account to the administrators. The right step is an
    exception taking in that particular account, recorded as a knowing decision.

    The change does not touch processes already started. The effect appears at the next start
    of a process, so on a server working unbroken it is at times late.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - accounts-and-passwords
  what_breaks:
    pl:
      - Usługa uruchamiająca zadania w imieniu użytkowników przestanie móc to robić
      - W dzienniku aplikacji widać niepowodzenie uruchomienia zadania, a nie problem z uprawnieniami
      - Usługi na kontach wbudowanych zachowują prawo i działają bez zmiany
      - Procesy już uruchomione działają dalej, więc skutek bywa opóźniony
    en:
      - A service starting tasks in users' names will no longer be able to
      - The application's log shows a failure to start a task rather than a trouble with rights
      - Services under built-in accounts keep the right and work unchanged
      - Processes already started go on working, so the effect is at times late
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje harmonogram aplikacyjny uruchamiający zadania w imieniu użytkowników z konta własnego
      - Nie ustalono, na jakich kontach pracują usługi uruchamiające procesy na tym serwerze
    en:
      - An application scheduler starting tasks in users' names from an account of its own works on the server
      - It has not been settled what accounts the services starting processes on this server work under
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeAssignPrimaryTokenPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeAssignPrimaryTokenPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeAssignPrimaryTokenPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeAssignPrimaryTokenPrivilege = *S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeAssignPrimaryTokenPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/replace-a-process-level-token

notes:
  pl: |
    Wykaz zgodny obejmuje wyłącznie konto usługi lokalnej i konto usługi
    sieciowej. Administratorzy w nim nie występują i nie jest to
    przeoczenie — prawo to nie jest potrzebne do administrowania
    maszyną.

    Jest to trzecie z praw dotyczących tożsamości. Tworzenie tokenu
    buduje przepustkę od zera, podszywanie się przyjmuje ją na chwilę,
    a to prawo nadaje ją nowemu procesowi na stałe.

    Zmiana nie dotyka procesów już uruchomionych, więc na serwerze
    pracującym ciągle skutek pojawia się dopiero przy następnym
    uruchomieniu.
  en: |
    The compliant list takes in the local service account and the network service account
    alone. Administrators do not stand in it, and that is no oversight - this right is not
    taken for administering the machine.

    It is the third of the rights bearing on identity. The making of a token builds a pass from
    nothing, impersonation takes one on for a moment, and this right sets one on a new process
    for good.

    The change does not touch processes already started, so on a server working unbroken the
    effect appears only at the next start.
