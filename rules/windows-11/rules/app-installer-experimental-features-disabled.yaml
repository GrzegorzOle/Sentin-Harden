id: win11-app-installer-experimental-features-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Funkcje eksperymentalne instalatora pakietów wyłączone
    en: Experimental features of the package installer disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Instalator pakietów niesie przełącznik odsłaniający funkcje jeszcze
    niewydane. Są to rzeczy w trakcie budowy: nowe sposoby wskazywania źródeł,
    nowe formaty opisu, nowe tryby instalacji.

    Zastrzeżenie dotyczące takich funkcji nie jest formalnością. Funkcja
    eksperymentalna nie przeszła tego samego przeglądu co wydana — bywa, że
    właśnie dlatego jest jeszcze eksperymentalna. Jej zachowanie w przypadkach
    brzegowych nie jest ustalone, a ustawienia, które ją ograniczają, mogą jej
    nie obejmować, bo powstały wcześniej.

    To ostatnie jest sednem. Reszta ustawień tej rodziny opisuje zachowanie
    instalatora wydane i udokumentowane: skąd wolno pobierać, co sprawdzać,
    czego nie wolno pominąć. Funkcja eksperymentalna nie ma obowiązku się w tym
    mieścić i w praktyce bywa drogą obejścia — nie dlatego, że ktoś tak
    zaplanował, tylko dlatego, że ograniczenia pisano dla czegoś innego.

    Wyłączenie przełącznika sprawia, że instalator zachowuje się tak, jak
    opisano, i tylko tak.
  en: |
    The package installer carries a switch revealing features not yet released. These
    are things under construction: new ways of naming sources, new description formats,
    new modes of installing.

    The caveat about such features is no formality. An experimental feature has not
    passed the same review as a released one - sometimes that is exactly why it is still
    experimental. Its behaviour in edge cases is not settled, and settings limiting it
    may not cover it, having been written earlier.

    That last part is the heart of it. The rest of this family's settings describe the
    installer's released and documented behaviour: where fetching is allowed from, what
    to check, what may not be passed over. An experimental feature is under no
    obligation to fit within that, and in practice it is sometimes a way round - not
    because anybody planned it so, but because the limits were written for something
    else.

    Switching the switch off makes the installer behave as described, and only so.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek na tej maszynie świadomie włączył
    funkcje eksperymentalne instalatora.

    W przeważającej większości przypadków nikt tego nie zrobił i zmiana nie robi
    nic. Przełącznik jest domyślnie wyłączony, a jego włączenie wymaga
    świadomego działania — nie zdarza się przypadkiem.

    Tam, gdzie został włączony, zrobił to najczęściej programista lub
    administrator, który potrzebował konkretnej funkcji przed jej wydaniem.
    Po wdrożeniu ta funkcja zniknie, a polecenie albo skrypt z niej korzystający
    zgłosi nieznany przełącznik. Objaw jest czytelny i łatwy do powiązania
    z przyczyną.

    Wdrożenie warto poprzedzić pytaniem do takich osób, nie dlatego że koszt
    jest wysoki, tylko dlatego, że odebranie komuś narzędzia bez uprzedzenia
    psuje zaufanie do całego przedsięwzięcia. Rozwiązaniem bywa wyjątek dla
    jednej maszyny, zapisany z uzasadnieniem i datą przeglądu.

    Nie ma restartu.
  en: |
    What needs checking is whether anybody on this machine deliberately switched the
    installer's experimental features on.

    In the great majority of cases nobody has and the change does nothing. The switch is
    off by default, and switching it on takes a deliberate act - it does not happen by
    accident.

    Where it has been switched on, it was most often by a developer or administrator who
    needed a particular feature before its release. After the rollout that feature will
    disappear, and the command or script using it will report an unknown switch. The
    symptom is plain and easy to tie to its cause.

    The rollout is worth preceding with a question to such people, not because the cost
    is high but because taking somebody's tool away without warning spoils trust in the
    whole undertaking. The answer is sometimes an exception for one machine, written
    down with a reason and a review date.

    There is no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Polecenie korzystające z funkcji eksperymentalnej zgłosi nieznany przełącznik
      - Skrypt oparty na niewydanej jeszcze możliwości instalatora kończy się błędem
      - Ustawienia funkcji eksperymentalnych znikają z okna ustawień instalatora
      - Na maszynie, na której nikt ich nie włączył, nie zmienia się nic
    en:
      - A command using an experimental feature reports an unknown switch
      - A script resting on a capability of the installer not yet released ends in an error
      - Settings for experimental features disappear from the installer's settings window
      - On a machine where nobody switched them on, nothing changes at all
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko służy do sprawdzania niewydanych jeszcze możliwości instalatora
      - Skrypt wdrożeniowy opiera się na funkcji, która nie ma jeszcze wydanego odpowiednika
    en:
      - The workstation is used for trying capabilities of the installer not yet released
      - A rollout script rests on a feature that has no released counterpart yet
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableExperimentalFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableExperimentalFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableExperimentalFeatures' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Zestaw funkcji eksperymentalnych zmienia się z każdą wersją instalatora.
    Nie da się więc wskazać raz na zawsze, co ten punkt wyłącza — i właśnie to
    jest jego uzasadnieniem: zasada obejmuje także funkcje, które pojawią się
    później, zanim ktokolwiek zdąży je ocenić.

    Punkt jest dobrym kandydatem do wyjątku dla pojedynczych stanowisk.
    Programista sprawdzający niewydane możliwości ma powód, którego nie da się
    zastąpić, a zakres skutków ogranicza się do jego maszyny.

    Gałąź zasad jest wspólna dla wszystkich ustawień tego instalatora, więc
    wycofanie usuwa wyłącznie sam wpis.
  en: |
    The set of experimental features changes with every version of the installer. So
    there is no naming once and for all what this item switches off - and that is
    precisely its justification: the policy covers features that will appear later, too,
    before anybody has had a chance to weigh them.

    The item is a good candidate for an exception on single workstations. A developer
    trying capabilities not yet released has a reason that cannot be replaced, and the
    reach of the effects is limited to their machine.

    The policy key is shared by every setting of this installer, so rollback removes the
    entry alone.
