id: win10-peer-name-publication-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Publikowanie nazwy maszyny w sieci równorzędnej wyłączone
    en: The putting out of the machine s name in a network of peers switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę ogłaszającą nazwę maszyny w sieci
    równorzędnej, czyli dopisującą ją do zbioru nazw krążących między
    uczestnikami.

    Usługa ta działa w jedną stronę. Nie służy do odnajdywania innych
    maszyn — służy do tego, żeby ta maszyna dała się odnaleźć. Wpis
    powstaje sam, po uruchomieniu systemu, i jest odnawiany bez udziału
    użytkownika.

    Zagrożenie jest odpowiednio węższe niż przy pozostałych usługach tej
    rodziny i dlatego punkt jest oceniony nisko. Maszyna nie przyjmuje
    tą drogą niczego. Ogłasza wyłącznie własną obecność.

    Znaczenie ma jednak to, komu ją ogłasza. Zbiór nazw nie jest
    ograniczony do sieci lokalnej i nie przechodzi przez żaden serwer,
    więc obecność maszyny staje się faktem znanym poza jej siecią,
    bez niczyjej decyzji.

    Odnotowuję, że publikowanie ma sens wyłącznie wtedy, gdy ktoś tej
    maszyny szuka tą drogą. Na stanowisku, na którym nie działa narzędzie
    sieci równorzędnej, wpis powstaje i nikomu nie służy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wiedzę
    o istnieniu maszyny poza jej siecią, bez żadnego zapytania do serwera.
  en: |
    The setting switches off the service putting out the machine's name in a network of peers, which is to say
    adding it to the gathering of names that goes about among those taking part.

    That service works one way. It serves not for the finding of other machines - it serves so that this machine
    may be found. The entry comes about of itself once the system is set going, and is made new without the user's
    part in it.

    The danger is narrower in kind than at the other services of this kin, and for that cause the item is graded
    low. The machine takes nothing in by that road. It puts out no more than its own being there.

    What has weight however is to whom it puts it out. The gathering of names is not bounded to the local network
    and goes through no server, so the machine's being there becomes a thing known outside its network, with
    nobody's decision.

    I set down that a putting out has sense only where somebody seeks this machine by that road. Upon a station
    where no tool of the network of peers works, the entry comes about and serves nobody.

    What an attacker gains while the item goes unmet: knowledge of the machine's being there outside its network,
    with no asking of any server.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś odnajduje tę maszynę tą drogą.

    Miejscem wartym uwagi są narzędzia zdalnej pomocy, w których osoba
    wspierająca łączy się z maszyną po nazwie, bez serwera pośredniczącego.
    Po zmianie maszyna przestanie być widoczna i połączenie trzeba będzie
    zestawić inaczej.

    Odnotowuję, że punkt dotyczy wyłącznie ogłaszania. Maszyna dalej może
    odnajdywać inne, jeżeli pozostałe usługi sieci równorzędnej działają.
    Utrata jest jednostronna.

    Zastrzegam, że na stanowisku bez narzędzi sieci równorzędnej zmiana
    nie robi nic poza usunięciem wpisu, z którego nikt nie korzystał.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: odnajdywania innych maszyn, dostępu do udziałów,
    pulpitu zdalnego, logowania, drukowania, pracy programów.
  en: |
    The class is "needs review", and the object of the review is whether anybody finds this machine by that road.

    The place worth notice is tools of help from afar, in which whoever gives the help joins themselves to the
    machine by name, without a server between. After the change the machine will cease to be seen and the joining
    will have to be set up otherwise.

    I set down that the item touches solely the putting out. The machine may still find others, if the remaining
    services of the network of peers work. The loss is one-sided.

    I set down that upon a station without tools of the network of peers the change does nothing beyond the taking
    away of an entry nobody used.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the finding of other machines, the reach of shares, the desk from afar, logging on,
    printing, or the work of programs.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia zdalnej pomocy łączące się z maszyną po nazwie bez serwera przestaną ją widzieć
      - Połączenie trzeba będzie zestawić inaczej, zwykle po adresie albo przez serwer pośredniczący
      - Punkt dotyczy wyłącznie ogłaszania, więc maszyna dalej może odnajdywać inne, jeżeli pozostałe usługi działają
      - Na stanowisku bez narzędzi sieci równorzędnej zmiana usuwa wpis, z którego nikt nie korzystał
      - Dostęp do udziałów, pulpit zdalny, logowanie, drukowanie i praca programów pozostają bez zmian
    en:
      - Tools of help from afar that join themselves to the machine by name without a server will cease to see it
      - The joining will have to be set up otherwise, commonly by address or through a server between
      - The item touches solely the putting out, so the machine may still find others if the remaining services work
      - Upon a station without tools of the network of peers the change takes away an entry nobody used
      - The reach of shares, the desk from afar, logging on, printing and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Obsługa łączy się z maszyną przez narzędzie zdalnej pomocy odnajdujące ją po nazwie sieci równorzędnej
    en:
      - The keepers join themselves to the machine through a tool of help from afar that finds it by a name of the network of peers
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'PNRPAutoReg' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPAutoReg' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PNRPAutoReg' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

notes:
  pl: |
    Reguła jest najłagodniejsza w trójce usług sieci równorzędnej i tak ją
    trzeba przedstawiać. Maszyna niczego tą drogą nie przyjmuje —
    wyłącznie ogłasza własną obecność. Stąd ocena niska.

    Argument wart zachowania dotyczy zasięgu tego ogłoszenia. Zbiór nazw
    nie kończy się na sieci lokalnej i nie przechodzi przez serwer, więc
    obecność maszyny staje się faktem znanym poza jej siecią, bez żadnej
    decyzji po stronie organizacji.

    Odnotowuję, że punkt ma sens praktyczny głównie tam, gdzie nikt tą
    drogą tej maszyny nie szuka. Wtedy wpis powstaje, odnawia się i nie
    służy nikomu poza tym, kto akurat słucha.
  en: |
    The rule is the mildest of the three services of the network of peers and is to be put forward as such. The
    machine takes nothing in by that road - it does no more than put out its own being there. Hence the low
    grading.

    The argument worth keeping touches the reach of that putting out. The gathering of names ends not at the local
    network and goes through no server, so the machine's being there becomes a thing known outside its network,
    with no decision upon the body's side.

    I set down that the item has its practical sense chiefly where nobody seeks this machine by that road. There
    the entry comes about, is made new, and serves nobody but whoever happens to be listening.
