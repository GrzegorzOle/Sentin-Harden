id: win11-diagnostic-data-device-name-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Wysyłanie nazwy maszyny w danych diagnostycznych wyłączone
    en: Sending of the machine name in diagnostic data disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy dane diagnostyczne wysyłane z maszyny mają
    zawierać jej nazwę.

    Punkt wygląda drobno i warto powiedzieć, dlaczego drobny nie jest. Dane
    diagnostyczne opisują, co na maszynie działa, co się zawiesza, jaki ma
    sprzęt i jakie wersje oprogramowania. Bez nazwy jest to opis maszyny
    anonimowej w zbiorze innych. Z nazwą staje się opisem konkretnej maszyny
    w konkretnej organizacji.

    Nazwy nadawane maszynom rzadko są przypadkowe. Zwykle niosą dział, rolę,
    lokalizację albo nazwisko użytkownika — bo po to je nadano, żeby dało się
    je rozpoznać. To, co ułatwia pracę własnemu działowi, w zbiorze wysłanym
    na zewnątrz staje się opisem struktury organizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: powiązanie
    opisu technicznego maszyny z jej miejscem w organizacji. Pozwala to
    wybrać cel — nie maszynę przypadkową, lecz tę, która po nazwie wygląda na
    stanowisko księgowości, serwerownię albo komputer zarządu.

    Sama nazwa nie daje wejścia. Daje wiedzę, którą maszynę atakować i czego
    się po niej spodziewać — a to jest pierwszy krok, nie ostatni.
  en: |
    The setting settles whether the diagnostic data sent from the machine are to hold its
    name.

    The item looks small, and it is worth saying why it is not. Diagnostic data describe
    what runs on the machine, what hangs, what hardware it has and what versions of
    software. Without a name that is a description of an anonymous machine among others.
    With a name it becomes a description of a particular machine in a particular
    organisation.

    Names given to machines are seldom random. They usually carry a department, a role, a
    location or a user's surname - since that is why they were given, so that they could
    be recognised. What eases the work of one's own department becomes, in a set sent
    outward, a description of the organisation's structure.

    What an attacker gains while the item goes unmet: a tying of the machine's technical
    description to its place in the organisation. That allows a target to be chosen - not
    a chance machine but the one that by its name looks like an accounting station, a
    server room or a board member's computer.

    The name alone gives no way in. It gives the knowledge of which machine to attack and
    what to expect of it - and that is the first step, not the last.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy jakiekolwiek narzędzie po stronie organizacji
    rozpoznaje maszyny właśnie po tej nazwie w danych diagnostycznych.

    Na stanowisku, z którego dane diagnostyczne po prostu wychodzą i nikt ich
    po stronie organizacji nie ogląda, zmiana jest niewidoczna. Jest to
    przypadek najczęstszy.

    Skutek pojawia się tam, gdzie organizacja korzysta z zestawień
    budowanych na danych diagnostycznych — raportów o zgodności aktualizacji,
    przeglądów stanu urządzeń, list maszyn z problemami. Po zmianie maszyna
    będzie w nich widoczna jako pozycja bez nazwy i trzeba będzie
    rozpoznawać ją po identyfikatorze zamiast po nazwie.

    Nie jest to utrata danych, tylko utrata wygody w ich czytaniu. Warto to
    jednak wiedzieć przed wdrożeniem, bo osoba korzystająca z takiego
    zestawienia zgłosi to jako awarię.

    Zmiana nie wymaga restartu. Praca użytkownika nie zmienia się w żaden
    sposób.
  en: |
    What needs checking is whether any tool on the organisation's side recognises machines
    by that very name in the diagnostic data.

    At a station from which the diagnostic data simply go out and nobody on the
    organisation's side looks at them, the change is invisible. That is the commonest
    case.

    The effect appears where the organisation uses lists built on diagnostic data - update
    compliance reports, reviews of device state, lists of machines with problems. After
    the change the machine will show in them as an entry without a name and will have to
    be recognised by an identifier instead of by a name.

    It is not a loss of data but a loss of convenience in reading them. It is worth
    knowing before a rollout, though, since whoever uses such a list will report it as a
    failure.

    The change takes no restart. The user's work does not change in any way.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - Maszyna jest widoczna w zestawieniach organizacji jako pozycja bez nazwy
      - Rozpoznanie maszyny w raporcie wymaga identyfikatora zamiast nazwy
      - Dane diagnostyczne wychodzą dalej w tym samym zakresie, bez nazwy
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - The machine shows in the organisation's lists as an entry without a name
      - Recognising the machine in a report takes an identifier instead of a name
      - The diagnostic data go on going out in the same range, without the name
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja rozpoznaje maszyny w zestawieniach zbudowanych na danych diagnostycznych po nazwie
    en:
      - The organisation recognises machines by name in lists built on diagnostic data
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value carries an older name than the policy does.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDeviceNameInTelemetry'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'AllowDeviceNameInTelemetry' -ErrorAction SilentlyContinue).'AllowDeviceNameInTelemetry'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowDeviceNameInTelemetry'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDeviceNameInTelemetry' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Nazwa wartości w rejestrze pochodzi z wcześniejszego nazewnictwa i nie
    odpowiada nazwie zasady w edytorze. Przy ręcznym sprawdzaniu trzeba
    szukać pod starą nazwą.

    Punkt dotyczy wyłącznie nazwy maszyny. Zakres samych danych
    diagnostycznych rozstrzyga osobna reguła w tej paczce i te dwie warto
    czytać razem: ograniczenie zakresu bez usunięcia nazwy zmniejsza ilość
    danych, ale zostawia ich przypisanie do konkretnej maszyny.

    Brak wartości nie jest stanem zgodnym, bo domyślnie nazwa bywa wysyłana.
  en: |
    The value's name in the registry comes from an earlier naming and does not match the
    policy's name in the editor. When checking by hand one has to look under the old name.

    The item concerns the machine's name alone. The range of the diagnostic data
    themselves is settled by a separate rule in this pack, and the two are worth reading
    together: limiting the range without removing the name lessens the amount of data but
    leaves their attachment to a particular machine.

    A missing value is not a compliant state, since by default the name is sometimes sent.
