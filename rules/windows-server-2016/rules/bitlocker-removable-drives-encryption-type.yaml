id: win2016-bitlocker-removable-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Szyfrowanie całego nośnika wymiennego wymuszone
    en: Full encryption of removable media enforced
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza szyfrowanie całej powierzchni nośnika wymiennego,
    a nie wyłącznie obszaru obecnie zajętego.

    Rozumowanie jest tu takie samo jak przy dyskach stałych, ale skutek
    większy, bo nośniki wymienne prawie nigdy nie są nowe. Pamięć
    przenośna przechodzi przez wiele rąk i wiele zastosowań, zanim ktoś
    pomyśli o jej zaszyfrowaniu.

    Kasowanie pliku zwalnia miejsce, a nie wymazuje treści. Nośnik
    zaszyfrowany wyłącznie na obszarze zajętym nosi więc dalej wszystko,
    co z niego skasowano — czytelnie, bez potrzeby łamania czegokolwiek.

    Historia takiego nośnika bywa przy tym dłuższa, niż ktokolwiek pamięta.
    Kopia bazy zgrana na chwilę, zrzut konfiguracji, zdjęcia z zeszłego
    roku, dokument przeniesiony między maszynami. Właściciel pamięta plik,
    który tam jest; nośnik pamięta wszystkie, które były.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czytelny
    dostęp do całej historii nośnika, którego właściciel uważa go za
    zaszyfrowany.
  en: |
    The setting enforces the encryption of a removable medium's whole surface and not solely of the
    area now taken up.

    The reasoning is here the same as at the fixed drives, but the consequence greater, removable
    media almost never being new. A carried memory passes through many hands and many uses before
    anybody thinks of encrypting it.

    Deleting a file frees the room rather than wiping the contents. A medium encrypted solely over
    the taken-up area therefore carries on everything deleted from it - readably, with no need to
    break anything.

    The history of such a medium is besides at times longer than anybody remembers. A copy of a
    base put there for a moment, a dump of a configuration, last year's photographs, a document
    carried between machines. The owner remembers the file that is there; the medium remembers all
    those that were.

    What an attacker gains while the item goes unmet: readable access to the whole history of a
    medium whose owner holds it to be encrypted.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy cierpliwości
    ludzi, nie zgodności sprzętu.

    Szyfrowanie całej powierzchni nośnika trwa proporcjonalnie do jego
    pojemności, a nie do ilości danych. Pamięć przenośna o pojemności
    dwustu gigabajtów, na której leży jeden plik, będzie się szyfrować
    tyle samo, co pełna.

    Skutek jest ludzki, nie techniczny. Osoba, która chciała skopiować
    plik i wyjść, dostaje proces trwający kilkadziesiąt minut. Jeżeli nikt
    jej nie uprzedził, wyciągnie nośnik w połowie — a nośnik wyciągnięty
    w trakcie pierwszego szyfrowania zostaje w stanie, z którego trzeba go
    wyprowadzać.

    Wniosek praktyczny jest taki, że tę zmianę trzeba zapowiedzieć, a nie
    tylko wprowadzić. Jest to jedna z niewielu reguł w całym zestawie,
    w której powodzenie zależy od tego, czy ludzie wiedzą, co się dzieje.

    Zmiana nie dotyczy nośników już zaszyfrowanych. Pamięć zaszyfrowana
    wcześniej w trybie obszaru zajętego pozostaje w tym trybie; przejście
    wymaga odszyfrowania i zaszyfrowania na nowo.

    Czego to nie psuje: odczytu nośników, zapisu na nich, pracy systemu,
    sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be reviewed concerns people's patience rather
    than the compatibility of hardware.

    Encrypting a medium's whole surface takes time in proportion to its capacity and not to the
    quantity of data. A carried memory of two hundred gigabytes with one file on it will take as
    long to encrypt as a full one.

    The consequence is human, not technical. Somebody who wanted to copy a file and leave gets a
    process lasting tens of minutes. If nobody forewarned them, they will pull the medium out
    halfway - and a medium pulled out during a first encryption stays in a state it has to be led
    out of.

    The practical conclusion is that this change has to be announced and not merely brought in. It
    is one of the few rules in the whole set whose success hangs on whether people know what is
    going on.

    The change does not concern media already encrypted. A memory encrypted earlier in the
    taken-up-area mode stays in that mode; the passage calls for it to be decrypted and encrypted
    anew.

    What this does not break: the reading of media, writing to them, the system's working, or the
    network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Szyfrowanie trwa proporcjonalnie do pojemności nośnika, a nie do ilości danych, więc pusta pamięć szyfruje się tak długo jak pełna
      - Osoba nieuprzedzona o zmianie wyciąga nośnik w trakcie pierwszego szyfrowania i zostawia go w stanie wymagającym naprawy
      - Nośniki zaszyfrowane wcześniej w trybie obszaru zajętego pozostają w tym trybie i nie przeszyfrują się same
      - Odczyt nośników, zapis na nich i praca systemu pozostają bez zmian
    en:
      - The encryption takes time in proportion to the medium's capacity and not to the quantity of data, so an empty memory takes as long as a full one
      - Somebody not forewarned of the change pulls the medium out during a first encryption and leaves it in a state calling for repair
      - Media encrypted earlier in the taken-up-area mode stay in that mode and will not re-encrypt themselves
      - The reading of media, writing to them and the system's working stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki o dużej pojemności szyfruje się w pośpiechu przy stanowisku, a nikogo nie uprzedzono o czasie trwania
      - Nie ma sposobu przekazania obsłudze, że pierwszego szyfrowania nie wolno przerywać wyciągnięciem nośnika
    en:
      - Media of large capacity are encrypted in haste at a workplace and nobody has been forewarned how long it takes
      - There is no way of telling the attendance that a first encryption must not be broken off by pulling the medium out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FULL'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVEncryptionType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One enforces full encryption, two leaves it at the used space alone, zero
    # hands the choice to whoever encrypts the medium.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest drugi w bloku i różni się od swojego odpowiednika przy
    dyskach stałych jedną rzeczą, którą warto pokazać: tam uciążliwością
    było obciążenie maszyny, tu jest nią czas człowieka stojącego
    i czekającego.

    Jest to rozróżnienie, którego benchmark nie robi, a które przesądza
    o powodzeniu wdrożenia. Obciążenie podsystemu dyskowego planuje się na
    okno serwisowe. Cierpliwości człowieka zaplanować się nie da — można go
    tylko uprzedzić.

    Odnotowuję, że jest to jedna z niewielu reguł w całym zestawie, przy
    której właściwym działaniem towarzyszącym jest powiadomienie ludzi,
    a nie czynność techniczna. Aplikacja powinna to umieć powiedzieć,
    zamiast poprzestawać na opisie skutku.

    Argument o historii nośnika jest przy tym mocniejszy niż przy dyskach
    stałych i warto go tam postawić wprost. Dysk stały w serwerze ma zwykle
    jedno przeznaczenie przez całe życie. Pamięć przenośna ma ich dziesiątki
    i żadne z nich nie zostawia po sobie wpisu, który ktoś by przeczytał.
  en: |
    The item is the second in the block and differs from its counterpart at the fixed drives in one
    thing worth showing: there the disruption was a load on the machine, here it is the time of a
    person standing and waiting.

    It is a distinction the benchmark does not make and which decides the rollout's success. A load
    on the disk subsystem is planned into a service window. A person's patience cannot be planned -
    they can only be forewarned.

    Worth noting that it is one of the few rules in the whole set where the right attending act is
    a telling of people rather than a technical one. The application should be able to say that
    rather than stop at a description of the consequence.

    The argument about the medium's history is besides stronger here than at the fixed drives and
    is worth putting outright. A fixed drive in a server has as a rule one purpose its whole life.
    A carried memory has tens of them and none of them leaves behind an entry anybody would read.
