id: win10-defender-scan-email

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan
  title:
    pl: Skanowanie zawartości skrzynek pocztowych
    en: Mailbox contents scanned
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zaglądać do plików skrzynek pocztowych trzymanych na
    dysku i sprawdzać załączniki, zanim ktokolwiek je otworzy.

    Skrzynka pocztowa jest pojedynczym plikiem, w którym leżą setki
    załączników. Bez zaglądania do środka ochrona widzi jeden plik
    o rozmiarze kilku gigabajtów, zmieniający się co minutę, i nie wie
    o jego zawartości nic.

    Wartość reguły bierze się z czasu. Załącznik leży w skrzynce od chwili
    odebrania wiadomości, a zostaje sprawdzony dopiero wtedy, gdy
    użytkownik zapisze go na dysk. Odstęp bywa liczony w tygodniach,
    a w tym czasie sygnatury zdążają się pojawić.

    Odnotowuję, na czym polega zysk: znalezienie załącznika złośliwego
    w skrzynce jest znalezieniem go przed otwarciem, a nie po. Jest to
    jedyne miejsce w całej paczce, w którym ochrona sięga wstecz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: załącznik
    czekający w skrzynce, niewidoczny dla ochrony aż do chwili, w której
    użytkownik go otworzy.
  en: |
    The setting bids the files of mailboxes kept upon the disk be looked into, and the attachments checked before
    anybody opens them.

    A mailbox is a single file in which hundreds of attachments lie. Without a looking inside, the protection
    sees one file of some gigabytes' size, changing every minute, and knows nothing of its contents.

    The rule's worth comes of time. An attachment lies in the mailbox from the hour the message was taken in, and
    is checked only once the user saves it to the disk. The span is at times counted in weeks, and in that time
    the signatures come up.

    I set down what the gain rests in: the finding of a malicious attachment in a mailbox is a finding of it
    before the opening, not after. It is the one place in the whole pack at which the protection reaches
    backwards.

    What an attacker gains while the item goes unmet: an attachment waiting in a mailbox, unseen by the
    protection until the hour the user opens it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Skanowanie obejmuje pliki skrzynek przy skanowaniu pełnym i przy
    zmianie ich zawartości. Program pocztowy pracuje dalej i nie zauważa
    niczego.

    Odnotowuję miejsce, w którym bywa widoczne: skrzynka o rozmiarze
    kilkunastu gigabajtów wydłuża skanowanie pełne. Nie jest to
    zatrzymanie pracy, bo skanowanie pełne i tak idzie w tle, ale czas
    jego trwania rośnie zauważalnie.

    Druga rzecz warta odnotowania dotyczy poczty trzymanej w usłudze,
    a nie na dysku. Tam nie ma czego skanować i reguła nie robi nic —
    sprawdzenie zwróci stan zgodny, ale zysku nie będzie. Nie jest to
    błąd, tylko sytuacja, w której punkt nie ma zastosowania praktycznego.

    Czego to nie psuje: odbierania i wysyłania poczty, otwierania
    załączników, pracy programu pocztowego, logowania, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The scanning takes in the mailbox files at a full scan and at a change of their contents. The mail program
    goes on working and notices nothing.

    I set down the place at which it shows at times: a mailbox of a dozen gigabytes' size draws a full scan out.
    It is no stopping of work, a full scan going on in the background anyway, but the time it takes grows
    noticeably.

    A second thing worth setting down touches post kept in a service and not upon the disk. There is nothing there
    to scan and the rule does nothing - the check will give back a compliant state, but there will be no gain. It
    is no fault but a case in which the item has no practical use.

    What this does not break: the taking in and the sending of post, the opening of attachments, the mail
    program's working, logging on, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - email-and-attachments
  what_breaks:
    pl:
      - Skrzynka o rozmiarze kilkunastu gigabajtów wydłuża skanowanie pełne w sposób zauważalny
      - Poczta trzymana w usłudze, a nie na dysku, nie daje się skanować i punkt nie ma wtedy zastosowania praktycznego
      - Sprawdzenie zwraca wtedy stan zgodny, choć zysku nie ma, więc raport sam tego nie rozstrzygnie
      - Skanowanie obejmuje pliki skrzynek przy skanowaniu pełnym i przy zmianie ich zawartości
      - Odbieranie poczty, otwieranie załączników, praca programu pocztowego, logowanie i drukowanie pozostają bez zmian
    en:
      - A mailbox of a dozen gigabytes size draws a full scan out noticeably
      - Post kept in a service and not upon the disk cannot be scanned and the item has then no practical use
      - The check gives back a compliant state though there is no gain, so the report will not settle that of itself
      - The scanning takes in the mailbox files at a full scan and at a change of their contents
      - The taking in of post, the opening of attachments, the mail program s working, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Poczta na tej maszynie jest trzymana wyłącznie w usłudze i na dysku nie ma czego skanować
    en:
      - The post upon this machine is kept in a service alone and there is nothing upon the disk to scan
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableEmailScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableEmailScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is a negative one, so the compliant value is a nought: the scanning
    # of mailboxes is not switched off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEmailScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest w tym bloku jedyną sięgającą wstecz. Pozostałe sprawdzają
    plik w chwili, w której się pojawia; ta sprawdza to, co przyszło
    wcześniej i czeka.

    Argument wart zachowania dotyczy odstępu czasu. Załącznik odebrany
    w poniedziałek bywa otwierany w piątek, a sygnatura opisująca go
    pojawia się we wtorek. Bez skanowania skrzynek ten odstęp jest
    zmarnowany — ochrona wie już, czym jest ten plik, ale nie ma jak na
    niego spojrzeć.

    Odnotowuję sytuację, w której punkt jest formalnością: poczta
    trzymana wyłącznie w usłudze. Sprawdzenie pokaże zgodność, bo wartość
    jest ustawiona, ale skanować nie będzie czego. Aplikacja korzystająca
    z inwentaryzacji może to rozstrzygnąć, patrząc na to, czy
    na maszynie w ogóle stoi program pocztowy trzymający dane lokalnie.
  en: |
    The rule is in this block the only one reaching backwards. The rest check a file at the hour it comes up;
    this checks what came earlier and waits.

    The argument worth keeping touches the span of time. An attachment taken in upon a Monday is at times opened
    upon a Friday, and the signature describing it comes up upon the Tuesday. Without the scanning of mailboxes
    that span is wasted - the protection already knows what the file is, but has no way of looking at it.

    I set down the case in which the item is a formality: post kept in a service alone. The check will show
    compliance, the value being set, but there will be nothing to scan. An application drawing upon the taking of
    stock can settle that by looking at whether a mail program keeping its data locally stands upon the machine
    at all.
