id: win2016-search-encrypted-items-indexing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Indeksowanie zaszyfrowanych plików wyłączone
    en: The indexing of encrypted files switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania indeksowania plików zaszyfrowanych.

    Punkt opisuje jedną z tych sytuacji, w których zabezpieczenie zostaje
    obejście nie przez atak, lecz przez pożyteczną funkcję działającą obok.

    Indeks wyszukiwania nie jest spisem nazw. Żeby wyszukiwanie po treści
    działało, indeks musi przechowywać fragmenty tej treści. Baza indeksu
    nie jest przy tym szyfrowana — leży na dysku zwyczajnie, bo ma być
    szybka.

    Zestawienie obu faktów daje wynik nieoczywisty i dlatego wart
    opisania: plik jest zaszyfrowany, a fragmenty jego treści leżą obok
    w postaci, do której klucz nie jest potrzebny. Ochrona pozostaje
    nienaruszona, tylko przestaje mieć znaczenie, bo droga prowadzi
    dookoła.

    Punkt zamyka tę drogę. Nie dotyka samego szyfrowania ani plików;
    zabrania jedynie odkładania ich treści w miejscu nieobjętym ochroną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: fragmenty
    treści zaszyfrowanych plików czytelne bez klucza, w jednej bazie
    i w jednym miejscu.
  en: |
    The setting forbids encrypted files to be indexed.

    The item describes one of those cases in which a safeguard is got round not by an attack but by a useful
    function working beside it.

    A search index is no inventory of names. For a search by content to work, the index must keep fragments of
    that content. The index database is at that not encrypted - it lies on the disk plainly, being meant to be
    quick.

    The joining of both facts gives an outcome that is not obvious and for that reason worth describing: the file
    is encrypted, and fragments of its content lie beside it in a shape for which no key is needed. The protection
    stays unbroken, only it ceases to matter, the road leading round it.

    The item shuts that road. It touches neither the encryption itself nor the files; it forbids only the laying
    down of their content in a place outside the protection.

    What an attacker gains while the item goes unmet: fragments of the content of encrypted files legible without
    a key, in one database and in one place.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wyszukiwanie po treści przestaje obejmować pliki zaszyfrowane. Same
    pliki, ich nazwy i dostęp do nich pozostają bez zmian, a wyszukiwanie
    po pozostałych plikach działa tak jak dotąd.

    Na serwerze wyszukiwania po treści zwykle nie używa nikt, a plików
    zaszyfrowanych własnym mechanizmem systemu bywa niewiele.

    Rzecz warta odnotowania: samo ustawienie nie czyści indeksu
    istniejącego. Fragmenty zebrane wcześniej zostają w bazie i jeśli to
    ma znaczenie, indeks trzeba przebudować osobno.

    Nie ma znanych regresji.

    Czego to nie psuje: szyfrowania plików, dostępu do nich, wyszukiwania
    po nazwie, wyszukiwania w plikach niezaszyfrowanych, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    A search by content ceases to take in encrypted files. The files themselves, their names and the access to them
    stay unchanged, and the search over the remaining files works just as before.

    On a server as a rule nobody uses a search by content, and of files encrypted by the system's own mechanism
    there are at times few.

    Worth noting: the setting alone does not clear the index that exists. Fragments gathered earlier stay in the
    database, and if that matters the index has to be rebuilt separately.

    There are no known regressions.

    What this does not break: the encryption of files, the access to them, a search by name, a search in unencrypted
    files, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - user-interface
  what_breaks:
    pl:
      - Wyszukiwanie po treści przestaje obejmować pliki zaszyfrowane i nie znajdzie ich po zawartości
      - Fragmenty zebrane w indeksie wcześniej zostają w bazie, więc indeks trzeba przebudować osobno
      - Szyfrowanie plików, dostęp do nich i wyszukiwanie po nazwie pozostają bez zmian
      - Wyszukiwanie w plikach niezaszyfrowanych, usługi systemowe i aplikacje pozostają bez zmian
    en:
      - A search by content ceases to take in encrypted files and will not find them by what is inside
      - Fragments gathered into the index earlier stay in the database, so the index has to be rebuilt separately
      - The encryption of files, the access to them and a search by name stay unchanged
      - A search in unencrypted files, system services and applications stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca na tej maszynie opiera się na wyszukiwaniu po treści w katalogu plików zaszyfrowanych
    en:
      - The work on this machine rests on a search by content in a folder of encrypted files
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowIndexingEncryptedStoresOrItems'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowIndexingEncryptedStoresOrItems'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The existing index is not purged by the setting alone - rebuild the
    # index if what was gathered earlier matters.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowIndexingEncryptedStoresOrItems' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Punkt jest piąty w bloku i najciekawszy, bo opisuje obejście
    zabezpieczenia przez funkcję działającą obok, a nie przez atak.

    Zdanie warte postawienia wprost: plik jest zaszyfrowany, a fragmenty
    jego treści leżą obok w postaci, do której klucz nie jest potrzebny.
    Jest to rozumowanie, które warto pokazać, bo powtarza się w innych
    miejscach systemu — wszędzie tam, gdzie ochronie towarzyszy szybka
    kopia robocza.

    Rzecz druga warta wyróżnienia dotyczy granicy działania reguły. Zmiana
    zamyka dopływ i nie czyści bazy. Zgodny wynik audytu nie znaczy więc,
    że w indeksie nic nie ma, i raport nie powinien tego sugerować.
    Przebudowa indeksu jest osobną czynnością i należy do decyzji
    użytkownika.

    Odnotowuję, że reguła dzieli ścieżkę z punktami o asystencie
    wyszukiwania i o korzystaniu z położenia. Trzy osobne ustawienia pod
    jedną ścieżką łatwo pomylić przy ręcznym sprawdzaniu.
  en: |
    The item is the fifth in the block and the most interesting, describing as it does a getting round of a
    safeguard by a function working beside it rather than by an attack.

    A sentence worth setting down outright: the file is encrypted, and fragments of its content lie beside it in a
    shape for which no key is needed. It is a reasoning worth showing, repeating itself as it does elsewhere in the
    system - everywhere a protection is attended by a quick working copy.

    The second thing worth setting apart concerns the bound of the rule's working. The change shuts the inflow and
    does not clear the database. A compliant outcome of the audit does not therefore mean there is nothing in the
    index, and the report ought not suggest so. The rebuilding of the index is a separate act and belongs to the
    user's decision.

    Worth noting that the rule shares its path with the items about the search assistant and about the use of a
    position. Three separate settings under one path are easily confused at a checking by hand.
