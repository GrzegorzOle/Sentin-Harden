id: win2016-shell-protocol-protected-mode

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Tryb chroniony protokołu powłoki włączony
    en: Protected mode for the shell protocol left on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zachowuje ograniczenia nałożone na wewnętrzny sposób
    adresowania, którym powłoka systemu wskazuje miejsca i obiekty.

    Powłoka nie posługuje się wyłącznie ścieżkami do plików. Ma własny
    sposób zapisu adresu, który potrafi wskazać także rzeczy nieleżące
    w systemie plików: panel sterowania, kosz, urządzenie, folder
    wirtualny. Adres taki bywa wpisany w skrót, w dokument, w stronę
    otwieraną lokalnie albo w wiadomość.

    W trybie chronionym powłoka wykonuje na takim adresie tylko to, co
    zostało uznane za bezpieczne. Bez niego wskazanie może doprowadzić do
    uruchomienia rzeczy, których wskazujący nie powinien móc uruchomić —
    bo adresowanie to sięga miejsc, do których zwykła ścieżka nie sięga.

    Droga jest wygodna, bo adres bywa krótki, wygląda niegroźnie i daje się
    umieścić w treści, którą ktoś tylko ogląda. Wywołanie nie wymaga
    uruchomienia programu ani potwierdzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    wewnętrznych możliwości powłoki przez sam adres umieszczony w dokumencie
    albo skrócie, bez uruchamiania czegokolwiek.
  en: |
    The setting keeps the limits laid on the inner way of addressing by which the
    system shell names places and objects.

    The shell does not use paths to files alone. It has its own way of writing an
    address, able to name also things not lying in the file system: the control
    panel, the recycle bin, a device, a virtual folder. Such an address is at times
    written into a shortcut, a document, a page opened locally or a message.

    In protected mode the shell carries out on such an address only what has been
    judged safe. Without it the naming may lead to the starting of things the namer
    should not be able to start - that addressing reaching places an ordinary path
    does not reach.

    The road is convenient, the address being at times short, looking harmless and
    being placeable in contents somebody merely looks at. The call needs no program
    started and no confirmation.

    What an attacker gains while the item goes unmet: access to the shell's inner
    abilities by an address alone put in a document or a shortcut, without starting
    anything at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Tryb chroniony jest zachowaniem domyślnym od ponad dwudziestu lat.
    Wpis, o którym mowa, służy wyłącznie do przywrócenia zachowania
    sprzed jego wprowadzenia, więc wdrożenie zapisuje stan, który i tak
    obowiązuje.

    Wyłącza się go rozmyślnie i praktycznie wyłącznie po to, żeby zadziałała
    aplikacja napisana przed jego wprowadzeniem. Aplikacje takie, jeżeli
    jeszcze gdzieś pracują, mają zwykle znacznie poważniejsze kłopoty
    z współczesnym wydaniem systemu niż ten jeden.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi.
    Użytkownik niczego nie zobaczy.

    Czego to nie psuje: pracy z plikami, sieci, logowania, usług,
    skrótów i skojarzeń plików. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    Protected mode has been the default behaviour for over twenty years. The entry in
    question serves only to restore the behaviour from before it was brought in, so
    the rollout writes down a state that holds anyway.

    It is switched off deliberately and practically only to make an application
    written before its introduction work. Such applications, if they still work
    anywhere, as a rule have far graver troubles with a present-day release of the
    system than this one.

    No restart, sign-out or stopping of a service goes with it. The user will see
    nothing.

    What this does not break: work with files, the network, signing in, services,
    shortcuts or file associations. There are no known regressions.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Aplikacja napisana przed wprowadzeniem trybu chronionego może przestać działać, ale takie aplikacje mają zwykle poważniejsze kłopoty z tym wydaniem systemu
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
      - Skróty, skojarzenia plików i zwykła praca z plikami pozostają bez zmian
      - Użytkownik nie zobaczy żadnej zmiany w codziennej pracy
    en:
      - An application written before protected mode was brought in may stop working, but such applications as a rule have graver troubles with this release
      - No restart, no sign-out, no stopping of a service
      - Shortcuts, file associations and ordinary work with files stay unchanged
      - The user will see no change in their daily work
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wpis przestawiono po to, żeby zadziałała aplikacja sprzed wprowadzenia trybu chronionego, i nie da się jej na razie zastąpić
    en:
      - The entry was moved to make an application from before protected mode was brought in work, and it cannot be replaced for the time being
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The protected mode is written with a zero; a one restores the older,
      # weaker behaviour. Intuition gets the direction wrong here.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'PreXPSP2ShellProtocolBehavior'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'PreXPSP2ShellProtocolBehavior'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The protected mode is written with a zero - a one restores the older,
    # weaker behaviour. Intuition gets the direction wrong here.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PreXPSP2ShellProtocolBehavior' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/shell/shell-and-managed-code

notes:
  pl: |
    Punkt odstaje od trzech poprzednich, bo nie dotyczy pamięci, tylko
    sposobu adresowania. Wspólne jest to, co się dzieje przy wykorzystaniu:
    treść, którą użytkownik tylko ogląda, doprowadza do wykonania czegoś,
    czego nie zamawiał.

    Kategoria wysoka przy klasie bez uciążliwości czyni z niego kandydata
    do trybu zbiorczego pierwszej kolejności. Jest to dokładnie to pole
    macierzy, o które chodzi w szybkich wygranych: zysk realny, koszt żaden.

    Wartość wymagana jest zerem, a nazwa wpisu odwołuje się do zachowania
    sprzed poprawki sprzed dwóch dekad. Bez wyjaśnienia wygląda to na
    literówkę w regule i warto tego wyjaśnienia nie pomijać.
  en: |
    The item stands apart from the three before it, concerning not memory but a way
    of addressing. What is common is what happens when it is used: contents the user
    merely looks at bring about the carrying out of something they did not ask for.

    A high category with the class no disruption makes it a first-order candidate for
    bulk mode. It is exactly that field of the matrix that quick wins are about: a
    real gain at no cost.

    The required value is zero, and the entry's name refers to behaviour from before
    a fix two decades old. Without an explanation that looks like a slip in the rule,
    and the explanation is worth not passing over.
