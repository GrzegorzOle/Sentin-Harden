id: iis-ftp-requires-ssl

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: FTP Requests
  title:
    pl: Przesyłanie plików wymaga połączenia szyfrowanego
    en: File transfer requires an encrypted connection

  level: 1
  profile: application

platform:
  system: iis

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Protokół przesyłania plików powstał, zanim szyfrowanie ruchu stało się
    normą, i w swojej pierwotnej postaci nie szyfruje niczego. Nazwa
    użytkownika i hasło idą przez sieć tak, jak je wpisano — czytelnym tekstem,
    w jednym poleceniu, na początku sesji. Przesyłane pliki tak samo.

    Co to odbiera atakującemu: poświadczenia zbierane biernie. Nie trzeba
    niczego łamać ani zgadywać — wystarczy widzieć ruch. W sieci przewodowej
    znaczy to dostęp do jednego przełącznika po drodze, w bezprzewodowej
    jeszcze mniej. Zdobyte w ten sposób konto bywa przy tym kontem domenowym,
    bo serwer często uwierzytelnia użytkowników tak samo jak reszta systemów —
    czyli przechwycone hasło otwiera znacznie więcej niż katalog z plikami.

    Po zmianie zarówno logowanie, jak i sama zawartość plików jadą kanałem
    szyfrowanym. To rozróżnienie jest ważne, bo protokół pozwala zabezpieczyć
    same poświadczenia i zostawić pliki jawnym tekstem — i taka połowiczna
    konfiguracja zdarza się w praktyce najczęściej.
  en: |
    The file transfer protocol came about before encrypting traffic became the
    norm, and in its original form encrypts nothing. The user name and password go
    across the network as they were typed - in readable text, in a single command,
    at the start of the session. The files transferred likewise.

    What it takes away from an attacker - credentials gathered passively. Nothing
    has to be broken or guessed at; it is enough to see the traffic. On a wired
    network that means access to one switch along the way, on a wireless one even
    less. The account obtained this way is often a domain account, since the server
    frequently authenticates users the same way as the rest of the systems - which
    is to say an intercepted password opens far more than a directory of files.

    After the change both the sign-in and the contents of the files themselves
    travel over an encrypted channel. That distinction matters, because the
    protocol allows the credentials alone to be secured and the files left in plain
    text - and in practice that half-measure is the commonest arrangement of all.

disruption_description:
  pl: |
    Ta zmiana odcina klientów, którzy nie umieją szyfrować, i trzeba założyć,
    że tacy są — bo serwer bez wymogu szyfrowania zwykle stoi właśnie po to,
    żeby ich obsłużyć.

    Grupy, które trzeba sprawdzić przed zmianą: urządzenia przemysłowe
    i biurowe wysyłające pliki na serwer, na przykład skanery i drukarki
    wielofunkcyjne; skrypty przesyłające dane między systemami, często
    napisane lata temu i uruchamiane z harmonogramu; partnerzy zewnętrzni
    korzystający z własnych narzędzi. Każda z tych grup zgłosi się dopiero po
    tym, jak przestanie działać — skrypt uruchamiany raz na dobę odezwie się
    nazajutrz, a wymiana z partnerem czasem dopiero po tygodniu.

    Objaw jest przy tym mylący: klient nie dostaje informacji, że wymagane jest
    szyfrowanie, tylko odmowę logowania. Prowadzi to wprost do podejrzenia, że
    zmieniono mu hasło, i do zgłoszeń o zablokowanym koncie.

    Potrzebny jest też certyfikat. Bez wskazania certyfikatu serwera usługa nie
    zestawi połączenia szyfrowanego, więc wymuszenie go bez certyfikatu
    zamyka usługę dla wszystkich — łącznie z klientami, którzy szyfrować umieją.
  en: |
    This change cuts off clients that cannot encrypt, and it has to be assumed
    there are some - because a server without the requirement usually stands there
    precisely to serve them.

    The groups to check before the change - industrial and office equipment sending
    files to the server, scanners and multifunction printers for instance; scripts
    moving data between systems, often written years ago and run from a schedule;
    outside partners using tools of their own. Each of those groups reports in only
    after it has stopped working - a script run once a day speaks up the next
    morning, and an exchange with a partner sometimes only after a week.

    The symptom is misleading while at it - the client is not told that encryption
    is required, only refused a sign-in. That leads straight to a suspicion that
    the password was changed, and to reports of a locked account.

    A certificate is needed too. Without a server certificate named, the service
    will not establish an encrypted connection, so requiring one without a
    certificate closes the service to everybody - including clients that can
    encrypt.

implementation_consequences:
  impact_areas:
    - file-sharing
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Klienci bez obsługi szyfrowania przestają się logować i dostają odmowę logowania zamiast informacji o wymaganym szyfrowaniu
      - Skanery i drukarki wielofunkcyjne wysyłające pliki na serwer przestają je wysyłać
      - Skrypty przesyłające dane z harmonogramu przestają działać i odezwą się dopiero przy następnym uruchomieniu
      - Wymuszenie szyfrowania bez wskazanego certyfikatu serwera zamyka usługę dla wszystkich
      - Zgłoszenia trafiają najpierw do obsługi kont, bo objaw wygląda na zablokowane konto
    en:
      - Clients without encryption support stop signing in and get a sign-in refusal rather than word that encryption is required
      - Scanners and multifunction printers sending files to the server stop sending them
      - Scripts moving data on a schedule stop working and speak up only at their next run
      - Requiring encryption without a server certificate named closes the service to everybody
      - Reports go first to whoever handles accounts, because the symptom looks like a locked account
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwery obsługujące urządzenia bez obsługi szyfrowania, dopóki nie zostaną wymienione albo przeniesione na inną drogę
      - Maszyny bez certyfikatu serwera, dopóki taki nie zostanie wystawiony i wskazany
      - Wymiana plików z partnerem zewnętrznym, dopóki nie zostanie z nim uzgodniona
    en:
      - Servers serving equipment without encryption support, until it has been replaced or moved to another road
      - Machines with no server certificate, until one has been issued and named
      - File exchange with an outside partner, until it has been agreed with them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This overlay is judged by the file transfer service, not by the web
      # server. A machine may well serve pages without serving files, and then
      # the question does not apply at all.
      if (-not (Get-Service -Name FTPSVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $filter = 'system.applicationHost/sites/siteDefaults/ftpServer/security/ssl'
          $wrong = @()
          # Both channels are judged. The protocol allows the credentials to be
          # secured and the files left in plain text, and that half-measure is
          # the commonest arrangement of all - reporting one number would hide
          # exactly which half is open.
          foreach ($name in @('controlChannelPolicy', 'dataChannelPolicy')) {
            $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
              -Filter $filter -Name $name -ErrorAction Stop
            $value = $raw
            if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
            if ($null -eq $value) { $wrong += ($name + ':not-set') }
            elseif ([string]$value -ne 'SslRequire') { $wrong += ($name + ':' + [string]$value) }
          }
          if ($wrong.Count -eq 0) { 'AS_REQUIRED' }
          else { 'OPEN ' + ($wrong -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $stamp = 'sentin-ftp-ssl-' + (Get-Date -Format 'yyyyMMddHHmmss')
    Backup-WebConfiguration -Name $stamp | Out-Null
    $filter = 'system.applicationHost/sites/siteDefaults/ftpServer/security/ssl'
    $state = @{}
    foreach ($name in @('controlChannelPolicy', 'dataChannelPolicy', 'serverCertHash', 'serverCertStoreName')) {
      $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $filter -Name $name -ErrorAction SilentlyContinue
      $value = $raw
      if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
      $state[$name] = [string]$value
    }
    [pscustomobject]@{
      scope  = 'apphost'
      filter = $filter
      state  = $state
      backup = $stamp
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and took a server configuration backup named $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $filter = 'system.applicationHost/sites/siteDefaults/ftpServer/security/ssl'
    # Requiring encryption with no certificate named closes the service to
    # everybody, including the clients that can encrypt. The refusal comes
    # first, so that the failure is a readable message rather than a service
    # nobody can reach.
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter $filter -Name 'serverCertHash' -ErrorAction SilentlyContinue
    $hash = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $hash = $raw.Value }
    if ([string]::IsNullOrWhiteSpace([string]$hash)) {
      throw 'No server certificate is named for the file transfer service, so requiring encryption would close it to everybody. Name a certificate first, then apply this item again.'
    }
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter $filter -Name 'controlChannelPolicy' -Value 'SslRequire'
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter $filter -Name 'dataChannelPolicy' -Value 'SslRequire'

  rollback_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($name in @('controlChannelPolicy', 'dataChannelPolicy')) {
      $value = $b.state.$name
      if (-not [string]::IsNullOrWhiteSpace([string]$value)) {
        Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
          -Filter $b.filter -Name $name -Value ([string]$value)
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/sites/sitedefaults/ftpserver/security/ssl
  - https://learn.microsoft.com/iis/publish/using-the-ftp-service/configuring-ftp-with-ssl-in-iis-7

notes:
  pl: |
    Sprawdzenie ocenia dwa kanały osobno — ten, którym idą polecenia
    i poświadczenia, oraz ten, którym idą pliki. Zabezpieczenie samych
    poświadczeń jest konfiguracją spotykaną najczęściej i wygląda w interfejsie
    na zrobione, a zawartość plików jedzie wtedy jawnym tekstem.

    Naprawa odmawia działania, dopóki nie wskazano certyfikatu serwera.
    Wymuszenie szyfrowania bez certyfikatu nie zabezpiecza usługi, tylko ją
    unieruchamia, a objaw wygląda identycznie jak awaria.

    Zapis obejmuje ustawienia domyślne serwisów, czyli dotyczy każdego serwisu
    przesyłania plików na tej maszynie. Serwis z własnym ustawieniem nadpisuje
    tę wartość u siebie i wymaga osobnej poprawki.

    Punkt nie rozstrzyga, jaką wersję protokołu szyfrującego usługa
    zaproponuje — tym rządzą reguły o protokołach i szyfrach, wspólne dla całej
    maszyny.
  en: |
    The check judges two channels separately - the one carrying the commands and
    credentials, and the one carrying the files. Securing the credentials alone is
    the commonest arrangement of all and looks done in the interface, while the
    contents of the files travel in plain text.

    The fix refuses to act until a server certificate has been named. Requiring
    encryption without a certificate does not secure the service, it disables it,
    and the symptom looks identical to a failure.

    The write covers the site defaults, which is to say every file transfer site on
    this machine. A site with a setting of its own overrides that value there and
    calls for a separate correction.

    The item does not settle which version of the encrypting protocol the service
    proposes - that is governed by the rules about protocols and ciphers, common to
    the whole machine.
