id: win2025-rdp-temp-folders-deleted-on-exit

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary Folders
  title:
    pl: Foldery tymczasowe sesji zdalnej usuwane po jej zakończeniu
    en: A remote session's temporary folders removed once it ends
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe usunąć folder tymczasowy sesji zdalnej w chwili jej
    zakończenia, zamiast zostawiać jego zawartość na dysku.

    Punkt dotyczy resztek. Plik tymczasowy powstaje po to, żeby istnieć
    przez chwilę, i właśnie dlatego nikt go nie pilnuje: nie trafia do
    kopii zapasowej, nie podlega zasadom przechowywania dokumentów,
    nie widnieje w żadnym spisie. Zostaje natomiast na dysku, jeżeli
    nikt go nie usunie.

    Na serwerze zbiera się tego przez lata. Serwer terminali pracujący
    piąty rok ma w folderach tymczasowych osad złożony z załączników
    otwieranych z poczty, dokumentów w trakcie edycji, wyciągów z bazy
    robionych przez narzędzia raportujące i plików rozpakowywanych
    z archiwów. Nikt tego zbioru nie zamawiał i nikt o nim nie wie,
    a jest to zbiór o zawartości dokładnie takiej, jakiej szuka
    napastnik po wejściu na maszynę.

    Wart nazwania jest ten drugi moment. Punkt nie broni przed wejściem
    — broni przed tym, co napastnik znajdzie, gdy już wejdzie.
    Wartością jest to, że przeszukanie maszyny nie daje mu materiału
    z ostatnich pięciu lat pracy całego zespołu.

    Jest też skutek uboczny wart odnotowania: osad ten zajmuje miejsce
    na dysku systemowym i bywa przyczyną awarii serwera, która wygląda
    na zupełnie niezwiązaną z bezpieczeństwem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    do osadu plików roboczych z całego okresu pracy serwera, pozostawionego
    poza wszelkimi zasadami przechowywania.
  en: |
    The setting bids the remote session's temporary folder be removed at the moment of its ending,
    instead of leaving its contents on the drive.

    The item bears on leavings. A temporary file arises so as to be for a moment, and just for that
    reason nobody watches it: it does not go into a backup, it falls under no rules for the keeping
    of documents, it stands in no roll. It stays, though, on the drive, if nobody removes it.

    On a server this gathers over years. A terminal server working its fifth year has in its
    temporary folders a sediment made of attachments opened from the post, documents under editing,
    drawings out of a database made by reporting tools and files unpacked out of archives. Nobody
    ordered that body of data and nobody knows of it, and it is a body whose contents are exactly
    what an attacker looks for after getting onto the machine.

    That second moment is worth naming. The item does not guard against the getting in - it guards
    against what the attacker finds once in. The worth is that a searching of the machine does not
    give them matter out of the last five years of the whole team's work.

    There is a side effect worth noting too: that sediment takes room on the system drive and is at
    times the cause of a breakdown of the server which looks wholly unbound to security.

    What an attacker gains while the item goes unmet: a hold of a sediment of working files out of
    the server's whole time of work, left outside all rules of keeping.

disruption_description:
  pl: |
    Podnoszę ten punkt do klasy wymagającej sprawdzenia, wyżej niż
    w paczce stanowiska roboczego, i robię to z powodu, który na
    serwerze jest realny, a na stanowisku prawie nie występuje.

    Na stanowisku roboczym oprogramowanie jest znane, bo jest go
    niewiele. Na serwerze terminali pracuje kilkanaście aplikacji
    dziedzinowych, z których część ma po kilkanaście lat i nikt nie wie
    dokładnie, co robią z folderem tymczasowym.

    Przypadek pierwszy to aplikacja odkładająca do folderu tymczasowego
    coś, co ma przetrwać sesję: wynik długiego raportu odbierany
    następnego dnia, plik wymiany danych czekający na przetworzenie
    nocne, półprodukt wydruku. Po zmianie zniknie razem z sesją.

    Przypadek drugi dotyczy diagnostyki. Zdarza się, że ślad po awarii —
    zrzut, dziennik narzędzia, plik z błędami importu — powstaje właśnie
    w folderze tymczasowym. Po zmianie ginie w momencie wylogowania,
    czyli dokładnie wtedy, gdy człowiek idzie zgłosić awarię. Warto
    zawczasu wskazać ludziom inne miejsce na takie pliki.

    Objaw w obu przypadkach jest ten sam i mało czytelny: plik, który
    „był wczoraj", nie istnieje, a aplikacja nie zgłasza żadnego błędu,
    bo nie wie, że coś usunięto.

    Poza tymi przypadkami zmiana jest niewidoczna i jest to sytuacja
    typowa. Na serwerze, do którego łączą się wyłącznie administratorzy,
    nikt jej nie zauważy.

    Punkt czyta się razem z wydzieleniem osobnych folderów tymczasowych
    dla sesji. Ten mówi, żeby po sesji nie zostawało; tamten, żeby
    sesje się nie mieszały. Osobno każdy zostawia połowę problemu.

    Zmiana wchodzi w życie od następnego zakończenia sesji i cofa się
    natychmiast. Usunięte pliki nie wracają — jest to jedyna część tej
    zmiany, której cofnięcie ustawienia nie odwraca.
  en: |
    I raise this item to the class taking a check, higher than in the working station's pack, and
    do so for a reason that on a server is real and at a station hardly occurs.

    At a working station the software is known, there being little of it. On a terminal server a
    dozen or more trade applications work, some of them a dozen or more years old, and nobody knows
    exactly what they do with the temporary folder.

    The first case is an application laying into the temporary folder something meant to outlive
    the session: the outcome of a long report fetched the next day, a file of data exchange waiting
    for a night's working, a half-made printing. After the change it will vanish along with the
    session.

    The second case bears on diagnosis. It happens that a trace after a breakdown - a dump, a
    tool's log, a file with faults of an import - arises in just the temporary folder. After the
    change it perishes at the moment of signing off, that is exactly when the person goes to report
    the breakdown. It is worth pointing people beforehand to another place for such files.

    The symptom in both cases is the same and little readable: a file that "was there yesterday" is
    not there, and the application reports no fault, not knowing that anything was removed.

    Outside those cases the change is unseen, and that is the usual state. On a server that
    administrators alone connect to, nobody will notice it.

    The item is read together with the setting apart of separate temporary folders for sessions.
    This one says that nothing is to stay after a session; that one, that sessions are not to
    mingle. Apart, each leaves half the trouble.

    The change comes into force from the next ending of a session and is undone at once. Removed
    files do not come back - it is the one part of this change which the undoing of the setting
    does not reverse.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - legacy-applications
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Wynik raportu odkładany do folderu tymczasowego i odbierany następnego dnia zniknie razem z sesją
      - Plik wymiany danych czekający na przetworzenie nocne przestanie doczekiwać do rana
      - Ślad po awarii powstały w folderze tymczasowym ginie w momencie wylogowania
      - Aplikacja nie zgłasza błędu, bo nie wie, że coś usunięto, więc objaw jest mało czytelny
      - Usunięte pliki nie wracają po cofnięciu ustawienia
    en:
      - The outcome of a report laid into the temporary folder and fetched the next day will vanish along with the session
      - A file of data exchange waiting for a night's working will stop lasting until morning
      - A trace after a breakdown arisen in the temporary folder perishes at the moment of signing off
      - The application reports no fault, not knowing anything was removed, so the symptom is little readable
      - Removed files do not come back once the setting is undone
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja na tym serwerze odkłada do folderu tymczasowego pliki, które mają przetrwać sesję
      - Ludziom nie wskazano innego miejsca na ślady po awariach i pliki diagnostyczne
    en:
      - An application on this server lays into the temporary folder files meant to outlive the session
      - People have not been pointed to another place for traces after breakdowns and files of diagnosis
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'DeleteTempDirsOnExit'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'DeleteTempDirsOnExit'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting bears on sessions ending from now on. The sediment already
    # lying on the drive is removed apart, after a looking through of it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeleteTempDirsOnExit' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt nie broni przed wejściem — broni przed tym, co napastnik
    znajdzie, gdy już wejdzie. Serwer terminali pracujący piąty rok ma
    w folderach tymczasowych osad, którego nikt nie zamawiał i o którym
    nikt nie wie.

    Ustawienie dotyczy sesji kończonych od teraz. Osad już leżący na
    dysku usuwa się osobno, po przejrzeniu go.

    Usunięte pliki nie wracają — jest to jedyna część tej zmiany, której
    cofnięcie ustawienia nie odwraca.

    Czytaj razem z wydzieleniem osobnych folderów tymczasowych dla sesji.
  en: |
    The item does not guard against the getting in - it guards against what the attacker finds once
    in. A terminal server working its fifth year has in its temporary folders a sediment nobody
    ordered and nobody knows of.

    The setting bears on sessions ending from now on. The sediment already lying on the drive is
    removed apart, after a looking through of it.

    Removed files do not come back - it is the one part of this change which the undoing of the
    setting does not reverse.

    Read together with the setting apart of separate temporary folders for sessions.
