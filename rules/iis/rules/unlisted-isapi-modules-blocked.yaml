id: iis-unlisted-isapi-modules-blocked

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Request Filtering and Other Restriction Modules
  title:
    pl: Moduły rozszerzeń spoza listy niedopuszczane do uruchomienia
    en: Extension modules outside the list not admitted to run
  level: 1
  profile: application

platform:
  system: iis

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Rozszerzenia serwera to biblioteki uruchamiane w jego procesie i obsługujące
    żądania samodzielnie. Działają z uprawnieniami serwera i mają dostęp do
    wszystkiego, do czego on ma.

    Bez listy dopuszczonych rozszerzeń serwer uruchomi każdą taką bibliotekę,
    która znajdzie się w katalogu zawartości. Wgranie jednego pliku — przez
    formularz przesyłania, przez pomyłkę w uprawnieniach, przez inną lukę — daje
    wtedy wykonanie kodu w procesie serwera. To jest krok od dostępu do pliku do
    przejęcia maszyny, i tym krokiem jest brak tej listy.

    Lista dopuszczonych rozszerzeń sprawia, że uruchamia się wyłącznie to, co ktoś
    świadomie wskazał.
  en: |
    Server extensions are libraries run inside its process and serving requests by
    themselves. They work with the server s privileges and reach everything it
    reaches.

    Without a list of permitted extensions the server runs every such library it
    finds in the content folder. Placing one file there - through an upload form,
    through a mistake in permissions, through another flaw - then gives code
    execution inside the server process. That is the step from access to a file to
    the machine being taken over, and the missing list is that step.

    A list of permitted extensions means only what somebody deliberately named is
    run.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo starsze aplikacje bywają zbudowane właśnie na
    takich rozszerzeniach. Rozwiązania sprzed lat, moduły raportowe i sterowniki
    drukowania przez sieć potrafią z nich korzystać.

    Objawem jest odmowa uruchomienia modułu i błąd serwera przy żądaniu, które
    dotąd działało. Ponieważ moduł obsługuje zwykle jedną ścieżkę, reszta zasobu
    działa dalej i rozpoznanie bywa długie.

    Przed zmianą trzeba przejrzeć listę zarejestrowanych rozszerzeń i ustalić,
    które są faktycznie używane. Każde używane musi zostać dopuszczone z nazwy,
    zanim reszta zostanie zamknięta.
  en: |
    The change calls for a review, since older applications are sometimes built on
    exactly such extensions. Arrangements from years back, report modules and
    drivers for printing over the network can make use of them.

    The symptom is a module refused permission to run and a server error on a
    request that worked before. Since a module usually serves one path, the rest
    of the resource carries on and finding the cause tends to take long.

    Before the change the list of registered extensions has to be reviewed and it
    has to be established which are really in use. Every one in use has to be
    admitted by name before the rest is shut out.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Moduły rozszerzeń niewypisane z nazwy przestaną być uruchamiane i zwrócą błąd serwera
      - Starsze aplikacje zbudowane na takich modułach przestaną obsługiwać swoje ścieżki
      - Moduł obsługuje zwykle jedną ścieżkę, więc reszta zasobu działa dalej i rozpoznanie bywa długie
      - Drukowanie przez sieć i moduły raportowe oparte na rozszerzeniach mogą przestać działać
      - Strony, skrypty obsługiwane wbudowanymi modułami, uwierzytelnianie i uprawnienia pozostają bez zmian
    en:
      - Extension modules not named on the list stop being run and return a server error
      - Older applications built on such modules stop serving their paths
      - A module usually serves one path, so the rest of the resource carries on and finding the cause takes long
      - Printing over the network and report modules resting on extensions may stop working
      - Pages, scripts served by built-in modules, authentication and permissions are all unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwery ze starszą aplikacją zbudowaną na module rozszerzenia, dopóki moduł nie zostanie dopuszczony z nazwy
      - Środowiska, w których nie przejrzano listy zarejestrowanych rozszerzeń
    en:
      - Servers with an older application built on an extension module, until that module has been admitted by name
      - Environments where the list of registered extensions has not been reviewed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/security/isapiCgiRestriction' -Name 'notListedIsapisAllowed' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([string]$value -eq 'True') { 'TRUE' }
          elseif ([string]$value -eq 'False') { 'FALSE' }
          else { [string]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FALSE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/isapiCgiRestriction' -Name 'notListedIsapisAllowed' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.webServer/security/isapiCgiRestriction'
      name    = 'notListedIsapisAllowed'
      value   = [string]$value
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/isapiCgiRestriction' -Name 'notListedIsapisAllowed' -Value $false

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value $b.value
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/security/isapicgirestriction/

notes:
  pl: |
    Zasada dotyczy modułów rozszerzeń i nie obejmuje programów uruchamianych przez
    osobny mechanizm bramkowy — ten ma własne ustawienie i ocenia się go osobno.
    Zapis idzie na poziomie serwera i obowiązuje wszystkie witryny.
  en: |
    The rule covers extension modules and not programs run through the separate
    gateway mechanism - that has a setting of its own and is judged apart. The
    setting is written at server level and holds for every site.
