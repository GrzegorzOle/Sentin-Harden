id: win10-delivery-optimization-no-internet-peers

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Delivery Optimization
  title:
    pl: Pobieranie aktualizacji od obcych maszyn w internecie wyłączone
    en: The drawing of the servicing from strange machines upon the internet switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza mechanizm przyspieszania pobrań tak, żeby maszyna
    nie pobierała fragmentów aktualizacji od maszyn spoza sieci lokalnej.

    Mechanizm ten rozdziela pobieranie: zamiast ściągać całą aktualizację
    od producenta, maszyna bierze jej fragmenty od innych maszyn, które
    już je mają. Oszczędza to łącze i przyspiesza wdrożenie w dużej
    sieci.

    Tryb szeroki obejmuje jednak także maszyny obce w internecie. Maszyna
    nawiązuje wtedy połączenia przychodzące i wychodzące z urządzeniami,
    o których nic nie wiadomo, i sama staje się dla nich źródłem.

    Zagrożenie nie polega na podmianie treści — fragmenty są sprawdzane
    i podłożenie własnych nie przejdzie. Polega na czymś innym: maszyna
    ogłasza w internecie swoją obecność i to, jakie aktualizacje posiada,
    czyli pośrednio jaką ma wersję systemu i czego jej brakuje.

    Odnotowuję, że sprawdzenie przyjmuje także tryby ostrzejsze,
    z pobieraniem wyłącznie od producenta włącznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wgląd
    w stan aktualizacji maszyny i połączenia z nią z sieci publicznej.
  en: |
    The setting bounds the mechanism that hastens downloads so that the machine draws no pieces of the servicing
    from machines outside the local network.

    That mechanism parts the drawing: instead of pulling the whole of an update from the maker, the machine takes
    its pieces from other machines that already have them. It spares the link and hastens a rollout in a great
    network.

    The wide mode holds however strange machines upon the internet too. The machine then makes inbound and
    outbound joinings with devices of which nothing is known, and becomes itself a source for them.

    The danger rests not upon a changing out of content - the pieces are weighed and the laying in of one's own
    will not come through. It rests upon another thing: the machine puts out upon the internet word of its being
    there and of which updates it holds, which is to say indirectly which version of the system it has and what
    it wants.

    I set down that the check takes the stricter modes too, the drawing from the maker alone included.

    What an attacker gains while the item goes unmet: a sight of the machine's state of servicing and joinings to
    it from a public network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, jak
    maszyna pobiera aktualizacje i jakie ma łącze.

    Miejscem wartym uwagi jest oddział z cienkim łączem i wieloma
    maszynami. Tryb szeroki potrafił tam odciążyć łącze znacząco, a po
    zmianie każda maszyna pobierze aktualizację osobno. Przy dużej
    aktualizacji różnica jest odczuwalna.

    Odnotowuję, że tryb wymagany pozostawia pobieranie od maszyn w sieci
    lokalnej. Oszczędność w obrębie jednej sieci zostaje zachowana —
    znika wyłącznie wymiana z maszynami obcymi.

    Miejscem drugim jest maszyna pracująca głównie poza siecią firmową.
    Tam tryb lokalny nie daje nic, bo nie ma z kim się dzielić, i pobranie
    idzie wprost od producenta.

    Skutek pojawia się natychmiast, bez restartu. Pobrania w toku
    dokończą się normalnie.

    Czego to nie psuje: pobierania aktualizacji, ich instalowania, pracy
    programów, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is how the machine draws its servicing and what link
    it has.

    The place worth notice is a branch with a thin link and many machines. The wide mode could there ease the link
    markedly, and after the change every machine will draw the update on its own. At a great update the difference
    is to be felt.

    I set down that the called-for mode leaves the drawing from machines in the local network. The sparing within
    one network is kept - only the trading with strange machines goes.

    The second place is a machine working chiefly outside the network of the firm. There the local mode gives
    nothing, there being nobody to share with, and the drawing goes straight from the maker.

    The consequence shows at once, with no restart. Drawings at work will finish in the ordinary manner.

    What this does not break: the drawing of the servicing, the laying of it on, the work of programs, logging on,
    or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - W oddziale z cienkim łączem każda maszyna pobierze aktualizację osobno, co przy dużej aktualizacji jest odczuwalne
      - Tryb wymagany pozostawia pobieranie od maszyn w sieci lokalnej, więc oszczędność w obrębie jednej sieci zostaje
      - Na maszynie pracującej poza siecią firmową tryb lokalny nie daje nic i pobranie idzie wprost od producenta
      - Pobrania w toku dokończą się normalnie, a skutek dotyczy pobrań następnych
      - Pobieranie aktualizacji, ich instalowanie, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - In a branch with a thin link every machine will draw the update on its own, which at a great update is to be felt
      - The called-for mode leaves the drawing from machines in the local network, so the sparing within one network stays
      - Upon a machine working outside the network of the firm the local mode gives nothing and the drawing goes straight from the maker
      - Drawings at work will finish in the ordinary manner, and the consequence touches those that follow
      - The drawing of the servicing, the laying of it on, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oddział ma cienkie łącze i wiele maszyn, a tryb szeroki jest tam jedynym sposobem na zniesienie ruchu aktualizacji
    en:
      - A branch has a thin link and many machines, and the wide mode is there the one way of bearing the traffic of the servicing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DODownloadMode'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|1|2|99|100)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    $name = 'DODownloadMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The mode is set to the one bounded to the local network. The check takes the
    # stricter modes too, a machine downloading from the maker alone meeting the
    # item as well.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DODownloadMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/do/waas-delivery-optimization-reference

notes:
  pl: |
    Reguła bywa czytana jako punkt o wydajności, a jest o rozgłaszaniu
    stanu maszyny. Warto, żeby aplikacja to rozróżniła, bo od tego zależy
    ocena kosztu: oszczędność łącza w sieci lokalnej zostaje zachowana,
    znika wyłącznie wymiana z maszynami obcymi.

    Argument wart postawienia wprost dotyczy tego, co maszyna o sobie
    mówi. Nie chodzi o podmianę treści, bo fragmenty są sprawdzane.
    Chodzi o to, że maszyna ogłasza, jakie aktualizacje posiada — a to
    pozwala wnioskować, jakiej poprawki jeszcze nie ma.

    Odnotowuję, że sprawdzenie przyjmuje tryby ostrzejsze, w tym
    pobieranie wyłącznie od producenta. Maszyna, która nie dzieli się
    z nikim, spełnia ten punkt tak samo jak maszyna ograniczona do sieci
    lokalnej.
  en: |
    The rule is at times read as an item of speed, and is one of the putting out of word about the machine's
    state. It is well that the application part that, the grading of the cost hanging upon it: the sparing of the
    link within a local network is kept, and only the trading with strange machines goes.

    The argument worth putting outright touches what the machine says of itself. What is at stake is no changing
    out of content, the pieces being weighed. It is that the machine puts out word of which updates it holds - and
    from that may be drawn which patch it still wants.

    I set down that the check takes the stricter modes, the drawing from the maker alone among them. A machine
    that shares with nobody meets this item just as one bounded to the local network does.
