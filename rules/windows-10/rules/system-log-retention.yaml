id: win10-system-log-retention

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > System
  title:
    pl: Zachowanie dziennika systemowego po zapełnieniu
    en: The behaviour of the journal of the system once it fills up
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że dziennik systemowy po zapełnieniu nadpisuje
    wpisy najstarsze, zamiast przestać przyjmować nowe.

    Skutek zatrzymania zapisu jest tu poważniejszy niż przy dzienniku
    aplikacji, bo poważniejsza jest zawartość. Dziennik systemowy
    odnotowuje zatrzymanie usług, załadowanie sterowników i zmiany
    konfiguracji sieci — czyli zdarzenia, które przy ataku pojawiają się
    jako pierwsze.

    Dziennik zatrzymany przestaje je zapisywać, a maszyna nie daje
    o tym żadnego sygnału. Zapis po prostu się kończy, a osoba
    sprawdzająca go później widzi ostatnie wpisy sprzed tygodni i musi
    najpierw ustalić, dlaczego ich nie ma nowszych.

    Odnotowuję, że pierwszym objawem takiego stanu bywa cisza w systemie
    zbierającym dzienniki. Maszyna przestaje przysyłać zdarzenia i znika
    z wykresów — a to bywa odczytane jako problem z siecią albo z agentem,
    a nie jako dziennik, który przestał przyjmować wpisy.

    Punkt wymaga nadpisywania, więc historia jest ograniczona rozmiarem,
    ale zapis nie ustaje nigdy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania zapisu zdarzeń systemowych przez zapełnienie dziennika.
  en: |
    The setting brings it about that the journal of the system, once full, writes over the oldest entries instead
    of ceasing to take new ones.

    The upshot of a halting of the record is here graver than at the journal of applications, the content being
    graver. The journal of the system sets down the halting of services, the loading of drivers and changes to the
    setting of the network - which is to say the happenings that show first at an attack.

    A halted journal ceases to write them, and the machine gives no sign of it. The record simply ends, and
    whoever looks at it later sees last entries from weeks ago and has first to settle why there are no newer.

    I set down that the first mark of such a state is at times a silence in the system that gathers journals. The
    machine ceases to send happenings and vanishes from the charts - and that is at times read as a trouble with
    the network or with the agent and not as a journal that has ceased to take entries.

    The item calls for the writing over, so the history is bounded by the size, but the record never stops.

    What an attacker gains while the item goes unmet: the halting of the record of the system's happenings by a
    filling of the journal.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie zwiększa pliku dziennika ani nie kasuje wpisów już
    zapisanych. Rozstrzyga wyłącznie zachowanie po dojściu do granicy
    rozmiaru.

    Odnotowuję jedyne miejsce warte uwagi: maszyny, na których wybrano
    archiwizowanie pełnych dzienników, żeby zachować historię dłuższą
    niż mieści bieżący plik. Po zmianie archiwa przestaną powstawać.
    Rozwiązaniem właściwym jest wtedy przesyłanie zdarzeń do systemu
    zbierającego dzienniki, a nie gromadzenie archiwów na maszynie.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, wpisów
    już zapisanych, startu maszyny, drukowania.
  en: |
    The class is "no disruption".

    The change makes the journal's file no greater and deletes no entries already written. It settles solely the
    behaviour once the bound of the size is come to.

    I set down the one place worth notice: machines upon which the laying up of full journals was chosen, so as to
    keep a history longer than the standing file holds. After the change the stores will cease to come about. The
    right answer is then the sending of happenings to a system that gathers journals and no heaping up of stores
    upon the machine.

    The consequence shows at once, with no restart.

    What this does not break: the writing of happenings, the reading of the journal, the entries already written,
    the machine's start, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie archiwizującej pełne dzienniki archiwa systemowe przestaną powstawać
      - Historia sięgnie tylko tak daleko, jak pozwala rozmiar bieżącego pliku dziennika
      - Rozwiązaniem właściwym jest wtedy przesyłanie zdarzeń do systemu zbierającego dzienniki
      - Zmiana nie kasuje wpisów już zapisanych i nie zmienia rozmiaru pliku dziennika
      - Zapisywanie zdarzeń, odczyt dziennika, start maszyny, logowanie i drukowanie pozostają bez zmian
    en:
      - Upon a machine laying up full journals the stores of the system will cease to come about
      - The history will reach only as far back as the size of the standing file of the journal allows
      - The right answer is then the sending of happenings to a system that gathers journals
      - The change deletes no entries already written and changes not the size of the journal s file
      - The writing of happenings, the reading of the journal, the machine s start, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie obowiązuje wymóg zewnętrzny nakazujący archiwizowanie pełnych dzienników systemowych
    en:
      - Upon the machine holds an outward requirement bidding that full journals of the system be laid up
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'Retention'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the service of the journal
    # reads this entry as a string and a number written here is passed over.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Reguła jest z trzech punktów o zachowaniu dziennika tą, przy której
    zatrzymanie zapisu kosztuje najwięcej. Warto, żeby aplikacja to
    powiedziała, bo trzy jednakowo brzmiące punkty zachęcają do
    potraktowania ich jako jednej decyzji, a ich waga nie jest równa.

    Argument wart zachowania dotyczy objawu. Dziennik, który przestał
    przyjmować wpisy, nie zgłasza tego. Po stronie systemu zbierającego
    dzienniki wygląda to jak maszyna, która zamilkła — a pierwsza myśl
    idzie wtedy w stronę sieci albo agenta. Warto tę pomyłkę wymienić
    wprost, bo kosztuje ona zwykle kilka godzin szukania.

    Odnotowuję rozwiązanie właściwe dla potrzeby dłuższej historii.
    Archiwizowanie na maszynie jest sposobem najgorszym: archiwa leżą tam,
    gdzie napastnik już jest, i znikają razem z maszyną. Przesyłanie
    zdarzeń poza maszynę rozwiązuje ten sam problem lepiej.
  en: |
    The rule is of the three items about a journal's behaviour the one at which a halting of the record costs
    most. It is well that the application say so, three items of a like sound inviting them to be taken for a
    single decision, while their weight is not equal.

    The argument worth keeping touches the mark of it. A journal that has ceased to take entries does not report
    it. Upon the side of the system that gathers journals it looks like a machine gone silent - and the first
    thought goes then toward the network or the agent. That mistake is worth naming outright, costing as it
    commonly does some hours of searching.

    I set down the right answer for the need of a longer history. A laying up upon the machine is the worst of
    ways: the stores lie where the attacker already is, and vanish together with the machine. The sending of
    happenings off the machine settles the same need the better.
