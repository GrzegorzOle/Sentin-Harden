id: windows-11
name:
  pl: Windows 11
  en: Windows 11
family: windows
shell: powershell
profile: workstation

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  # Document version this pack is based on. Changing it means reviewing every
  # rule and re-examining every stored risk acceptance.
  version: TBD

detection:
  command: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 1 = workstation. Windows 11 is build 22000 and above.
  match: '^Microsoft Windows 11 .*\|(2[2-9][0-9]{3}|[3-9][0-9]{4})\|1$'

notes:
  pl: |
    Wydania Windows 11 różnią się między sobą (22H2, 23H2, 24H2) — część kluczy
    rejestru jest nieobecna w starszych. Gdy sprawdzany element nie istnieje
    w danym wydaniu, wynikiem jest NOT_APPLICABLE, nie FAIL.
  en: |
    Windows 11 releases differ from each other (22H2, 23H2, 24H2) and some
    registry keys are absent in the older ones. When the checked element does
    not exist in a given release, the result is NOT_APPLICABLE, not FAIL.
