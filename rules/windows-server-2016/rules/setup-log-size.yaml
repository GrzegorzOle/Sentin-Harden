id: win2016-setup-log-size

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Setup
  title:
    pl: Maksymalny rozmiar dziennika instalacji
    en: Maximum size of the setup log
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę pojemności dziennika instalacji.

    Dziennik ten zbiera zdarzenia z instalacji systemu, dodawania i usuwania
    ról oraz składników, a także z instalowania aktualizacji. Na serwerze jest
    to zapis najrzadziej przyrastający i najdłużej sięgający wstecz — często
    aż do dnia, w którym maszynę postawiono.

    Wartość dla bezpieczeństwa jest pośrednia, ale specyficzna. Dodanie roli
    serwera jest zmianą o dużym skutku: rola sieciowa otwiera porty, rola
    sesji zdalnych zmienia sposób dostępu, rola wirtualizacji wprowadza
    sterowniki w jądrze. Zapis o tym, kiedy rola się na maszynie pojawiła,
    znajduje się właśnie tutaj.

    Drugim zastosowaniem jest zestawienie z aktualizacjami. Pytanie „czy ta
    maszyna miała wtedy tę poprawkę" bywa rozstrzygające przy ocenie, czy dana
    luka była w danym momencie otwarta — a odpowiedź leży w tym dzienniku.

    Kategoria niska: punkt nie zdejmuje ryzyka i sam z siebie niczego nie
    wykrywa. Jest dokumentacją historii maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: utratę zapisu
    o tym, kiedy na maszynie pojawiła się rola albo składnik, przez który
    wszedł.
  en: |
    The item sets a lower bound on the setup log's capacity.

    That log gathers events from the system's installation, from the adding and
    removing of roles and components, and from the installing of updates. On a
    server it is the record that grows most slowly and reaches furthest back - often
    as far as the day the machine was stood up.

    Its worth for security is indirect but particular. Adding a server role is a
    change of large effect: a network role opens ports, the remote sessions role
    alters the way access is had, the virtualisation role brings drivers into the
    kernel. The record of when a role appeared on the machine is exactly here.

    The second use is the pairing with updates. The question "did this machine have
    that fix then" is at times decisive in judging whether a given hole was open at
    a given moment - and the answer lies in this log.

    The category is low: the item lifts no risk and detects nothing by itself. It is
    the documentation of the machine's history.

    What an attacker gains while the item goes unmet: the loss of the record of when
    the role or component they came in through appeared on the machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Dziennik instalacji przyrasta wolniej niż
    którykolwiek z pozostałych i na typowym serwerze wymagana pojemność
    wystarcza na całe życie maszyny.

    Wyjątkiem są maszyny, na których aktualizacje instalują się co tydzień
    i generują komplet zdarzeń za każdym razem. Tam zasięg skraca się do
    miesięcy — nadal dużo więcej niż w pozostałych dziennikach.

    Nic przy tym nie przestaje działać. Instalacja ról, składników i
    aktualizacji przebiega tak samo.

    Czego to nie psuje: instalowania ról i aktualizacji, odczytu dziennika ani
    przekazywania zdarzeń poza maszynę.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The setup log grows more slowly than any of the
    others, and on a typical server the required capacity suffices for the machine's
    whole life.

    The exception is machines where updates install weekly and generate a full set
    of events each time. There the reach shortens to months - still far more than in
    the other logs.

    Nothing stops working while this goes on. The installing of roles, components
    and updates proceeds as before.

    What this does not break: the installing of roles and updates, the reading of
    the log, or the forwarding of events off the machine.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — zwiększenie pojemności jest zajęciem miejsca na dysku i niczym poza tym
      - Na maszynie z cotygodniowymi aktualizacjami zasięg dziennika skraca się do miesięcy zamiast lat
      - Instalacja ról, składników i aktualizacji przebiega tak samo jak przed zmianą
      - Odczyt dziennika i przekazywanie zdarzeń poza maszynę pozostają nietknięte
    en:
      - No regression in the working - enlarging the capacity is the taking of disk room and nothing besides
      - On a machine with weekly updates the log's reach shortens to months rather than years
      - The installing of roles, components and updates proceeds just as before the change
      - The reading of the log and the forwarding of events off the machine stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — wymagana pojemność jest niewielka, a dziennik przyrasta najwolniej ze wszystkich
    en:
      - No known contraindication - the required capacity is small and the log grows the most slowly of all
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog Setup -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This log reaches furthest back of the four and answers when a role appeared
    # and which fixes were in place at a given moment.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/eventlog/event-logging

notes:
  pl: |
    Jest to najlżejszy z czterech punktów o pojemności dzienników i tak
    powinien być pokazany. Jego wartość jest dokumentacyjna: mówi, jak maszyna
    doszła do stanu, w którym jest.

    W dochodzeniu bywa użyteczny w jednym konkretnym pytaniu — kiedy dana rola
    albo dany składnik znalazł się na maszynie. Odpowiedź na nie potrafi
    przesądzić, czy droga wejścia w ogóle wtedy istniała.

    Porównanie jest typu „nie mniej niż", więc większy dziennik jest zgodny.
  en: |
    This is the lightest of the four items on log capacity and should be shown as
    such. Its worth is documentary: it says how the machine came to the state it is
    in.

    In an inquiry it is useful for one particular question - when a given role or
    component found its way onto the machine. The answer can settle whether the road
    in existed at all at the time.

    The comparison is of the "not less than" kind, so a larger log is compliant.
