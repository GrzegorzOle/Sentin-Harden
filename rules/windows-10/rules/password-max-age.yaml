id: win10-password-max-age

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Najdłuższy dopuszczalny wiek hasła
    en: The greatest age a password may reach
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, po ilu dniach hasło konta lokalnego wygasa i wymaga
    zmiany.

    Wygasanie haseł jest dziś rozumiane inaczej niż dawniej i warto powiedzieć
    to wprost, zamiast powtarzać uzasadnienie sprzed lat. Zmiana hasła co
    trzydzieści czy sześćdziesiąt dni okazała się szkodliwa: ludzie zaczynali
    budować hasła z członu stałego i licznika, przez co hasło kolejne dawało
    się przewidzieć ze znajomości poprzedniego.

    Wygasanie zachowuje jednak sens przy okresie długim. Jego zadaniem nie
    jest wyprzedzenie łamania hasła, tylko ograniczenie czasu, przez który
    hasło już wyniesione — z wycieku, ze starej kopii, z maszyny sprzedanej
    albo z notatki — daje się użyć. Rok jest okresem, po którym takie hasło
    przestaje być drogą wejścia, a ludzie wciąż wymyślają hasło nowe, zamiast
    dopisywać do starego cyfrę.

    Szczególnej uwagi wymaga wartość mówiąca, że hasło nie wygasa nigdy.
    Zapisana jest liczbą ujemną, więc porównanie „nie więcej niż" przyjęłoby
    ją jako najmniejszą z możliwych. Sprawdzenie rozpoznaje ten przypadek
    osobno i zwraca „NEVER".

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło wyniesione
    kiedykolwiek w przeszłości pozostaje ważne bez ograniczenia w czasie.
  en: |
    The setting says after how many days a local account's password expires and calls for a change.

    The expiry of passwords is understood today otherwise than it once was, and it is well to say so outright
    rather than repeat a reasoning of years ago. Changing a password every thirty or sixty days proved harmful:
    people began building passwords out of a fixed part and a counter, whereby the next password could be
    foretold from a knowledge of the former.

    Expiry keeps its sense, though, at a long span. Its task is not to outrun the breaking of a password but to
    limit the time through which a password already carried off - from a leak, from an old backup, from a
    machine sold on or from a note - can be used. A year is a span after which such a password ceases to be a
    road in, while people still think up a new password rather than add a digit to the old.

    Particular heed is called for by the value saying a password never expires. It is written as a negative
    number, so a "not greater than" comparison would take it for the smallest to be had. The check recognises
    that case apart and returns "NEVER".

    What an attacker gains while the item goes unmet: a password carried off at any time in the past stays good
    with no limit in time.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód jest ten sam co przy regule
    o długości hasła — skutek przychodzi z opóźnieniem i bez uprzedzenia
    wygląda na awarię.

    Ustawienie wygasania tam, gdzie go nie było, znaczy, że za rok wszystkie
    konta lokalne zażądają zmiany hasła naraz. Warto to wiedzieć wcześniej,
    bo dzień ten wypadnie wtedy, gdy nikt się go nie spodziewa.

    Rzecz ważniejsza dotyczy kont, przy których nie ma człowieka. Konto
    usługi, konto do zadania w harmonogramie, konto do połączenia między
    maszynami — każde z nich po wygaśnięciu hasła przestaje działać,
    a komunikat mówi o odmowie dostępu, nie o wygaśnięciu. Konta takie
    powinny mieć hasło nieograniczone czasowo ustawione na koncie,
    nie na maszynie, i trzeba to sprawdzić przed wykonaniem.

    Trzeci przypadek to maszyny używane rzadko. Maszyna włączana raz na
    kilka miesięcy zażąda zmiany hasła przy pierwszym logowaniu, a bywa to
    logowanie pilne.

    Czego to nie psuje: haseł bieżących, kont domenowych, logowania kodem
    lub odciskiem palca, usług, sieci, aplikacji.
  en: |
    The class is "needs a planned rollout", and the reason is the same as at the rule about length - the
    consequence comes with a delay and without forewarning looks like a fault.

    Setting an expiry where there was none means that in a year every local account will call for a change of
    password at once. It is well to know that beforehand, that day falling when nobody looks for it.

    A weightier matter touches accounts with no person behind them. A service account, an account for a task in
    the scheduler, an account for a connection between machines - each of them ceases working once its password
    expires, and the message speaks of access denied, not of expiry. Such accounts ought to hold a password
    unbounded in time, set on the account and not on the machine, and that has to be reviewed before carrying
    out.

    The third case is machines used seldom. A machine switched on once in some months will call for a change of
    password at the first logon, and that is at times an urgent logon.

    What this does not break: passwords in force, domain accounts, logging on by a code or a fingerprint,
    services, the network, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Konto usługi lub konto do zadania w harmonogramie przestaje działać po wygaśnięciu hasła, a komunikat mówi o odmowie dostępu
      - Wszystkie konta lokalne zażądają zmiany hasła mniej więcej w tym samym czasie, bo odliczanie rusza razem
      - Maszyna włączana raz na kilka miesięcy żąda zmiany hasła przy pierwszym logowaniu, nierzadko pilnym
      - Hasła bieżące pozostają ważne do końca swojego okresu i nie zostają unieważnione przez samą zmianę ustawienia
      - Konta domenowe, logowanie kodem lub odciskiem palca oraz praca sieci i aplikacji pozostają bez zmian
    en:
      - A service account or an account for a scheduled task ceases working once its password expires, the message speaking of access denied
      - Every local account will call for a change of password at about the same time, the counting starting together
      - A machine switched on once in some months calls for a change of password at the first logon, often an urgent one
      - Passwords in force stay good to the end of their span and are not voided by the change of setting itself
      - Domain accounts, logging on by a code or fingerprint and the work of the network and applications stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracują konta usług i zadań bez człowieka, którym nie ustawiono hasła nieograniczonego czasowo
      - Maszyna bywa uruchamiana rzadko i pierwsze logowanie po przerwie musi się udać bez zmiany hasła
    en:
      - Accounts for services and tasks with no person behind them work on the machine and have no password unbounded in time
      - The machine gets started seldom and the first logon after a break has to succeed without a change of password
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') {
          # -1 means "never expires". It must not pass an upper-bound comparison
          # as if it were the smallest possible number of days.
          if ([int]$Matches[1] -lt 1) { 'NEVER' } else { $Matches[1] }
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '365'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'MaximumPasswordAge'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Passwords in force keep their span - the counting starts now, so the accounts
    # will call for a change at about the same time. Check beforehand that service
    # accounts hold a password unbounded in time on the account itself.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MaximumPasswordAge = 365',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MaximumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/maximum-password-age

notes:
  pl: |
    Reguła jest w tym bloku najbardziej narażona na powtórzenie uzasadnienia
    przestarzałego i opis świadomie tego unika. Wygasanie krótkie jest dziś
    uznawane za szkodliwe, wygasanie długie — za sensowne, i różnica ta
    wynika z zachowania ludzi, nie z techniki.

    Warto, żeby aplikacja pokazała ją razem z regułą o historii haseł.
    Bez historii ta reguła daje się spełnić przez ustawienie hasła
    poprzedniego, więc raport pokazujący jedną bez drugiej pokazuje obraz
    niepełny.

    Odnotowuję rozpoznanie wartości „nigdy". Zapisana jest liczbą ujemną,
    więc porównanie górnej granicy przyjęłoby ją jako wynik najlepszy.
    Sprawdzenie zwraca wtedy „NEVER", żeby raport nie pokazał zgodności tam,
    gdzie hasło nie wygasa w ogóle. Jest to pułapka tego samego rodzaju co
    w regule o ostrzeżeniu przy instalacji ze skryptu.
  en: |
    The rule is in this block the most open to a repeating of an outdated reasoning, and the description avoids
    that knowingly. A short expiry is today held harmful, a long one sensible, and the difference follows from
    how people behave rather than from technique.

    It is well that the application show it together with the rule about a history of passwords. Without a
    history this rule can be met by setting the former password, so a report showing one without the other shows
    an incomplete picture.

    Worth noting the recognising of the value "never". It is written as a negative number, so a comparison of an
    upper bound would take it for the best result. The check returns "NEVER" then, that the report should not
    show compliance where the password does not expire at all. It is a trap of the same kind as in the rule
    about the warning at an installation from a script.
