id: win2016-network-bridge-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Tworzenie mostka sieciowego zabronione
    en: The making of a network bridge forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania łączenia dwóch kart sieciowych maszyny w jedną
    wspólną sieć.

    Mostek robi rzecz prostą i nieodwracalną w skutkach: sprawia, że dwie
    sieci stają się jedną. Ruch z jednej strony trafia na drugą bez
    pośrednictwa routera, bez reguł i bez zapory — bo zapora działa na
    warstwie wyższej niż ta, w której mostek pracuje.

    Znaczy to, że jedna zmiana w interfejsie maszyny potrafi znieść cały
    podział sieci, który zbudowano po to, żeby sieci się nie stykały.
    Segment zarządzający i użytkowy, sieć wewnętrzna i gościnna, strefa
    wystawiona i wewnętrzna — rozdział każdej z tych par przestaje istnieć
    w chwili, gdy ktoś na maszynie stojącej w obu utworzy mostek.

    Maszyna, która to zrobi, nie musi być przejęta ani nawet podejrzana.
    Wystarczy administrator rozwiązujący problem z łącznością albo ktoś
    próbujący „udostępnić sieć" drugiej karcie. Skutek jest taki sam.

    Warto zauważyć, że na serwerze mostek nie ma zastosowania prawowitego.
    Wirtualizacja korzysta z przełącznika wirtualnego, a nie z mostka;
    routing ma własny mechanizm. Zakaz nie odbiera tu więc żadnej
    przewidzianej funkcji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zniesienia rozdziału dwóch sieci jedną operacją na maszynie stojącej
    w obu, z pominięciem zapory i wszystkich reguł ruchu.
  en: |
    The setting forbids two of the machine's network cards to be joined into one
    common network.

    A bridge does a simple thing whose consequences cannot be undone: it makes two
    networks into one. Traffic from one side reaches the other with no router
    between, no rules and no firewall - since the firewall works at a layer above
    the one the bridge works in.

    That means one change in the machine's interface can lift the whole division of
    a network built precisely so that the networks might not touch. A management
    segment and a working one, an internal network and a guest one, an exposed zone
    and an internal one - the separation of each of those pairs ceases to exist the
    moment somebody on a machine standing in both makes a bridge.

    The machine that does it need be neither taken over nor even suspect. An
    administrator solving a connectivity problem is enough, or somebody trying to
    "share the network" with a second card. The upshot is the same.

    Worth noting that on a server a bridge has no rightful use. Virtualisation uses
    a virtual switch rather than a bridge; routing has a mechanism of its own. The
    ban therefore takes away no foreseen function here.

    What an attacker gains while the item goes unmet: the means of lifting the
    separation of two networks with one operation on a machine standing in both,
    passing by the firewall and all traffic rules.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze zmiana jest niemal zawsze
    bez skutku.

    Powód jest taki, że mostka na serwerze zwykle nie ma. Rola routera ma
    własny mechanizm, wirtualizacja własny przełącznik, a łączenie kart
    w zespół to osobna funkcja, której ta reguła nie dotyczy. Zakaz trafia
    więc w coś, czego nikt nie używa.

    Sprawdzić trzeba jedną rzecz: czy mostek na tej maszynie już istnieje.
    Zasada zabrania tworzenia nowych, ale maszyna z mostkiem utworzonym
    wcześniej wymaga świadomej decyzji, co z nim zrobić — i to jest właściwe
    miejsce na tę decyzję, a nie skutek uboczny wdrożenia reguły.

    Warto też odróżnić mostek od zespołu kart. Zespół łączy kilka kart
    w jedną, żeby zwiększyć przepustowość albo dać nadmiarowość, i pozostaje
    w tej samej sieci. Mostek łączy różne sieci. Nazwy bywają mylone,
    a pomyłka prowadzi do niepotrzebnego odpuszczenia punktu.

    Czego to nie psuje: zespołów kart sieciowych, przełącznika maszyn
    wirtualnych, routingu, mostków utworzonych wcześniej, łączności.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though on a server the change is nearly always of
    no effect.

    The reason is that on a server there is as a rule no bridge. The router role has
    a mechanism of its own, virtualisation a switch of its own, and joining cards
    into a team is a separate function this rule does not concern. The ban therefore
    falls on something nobody uses.

    One thing has to be checked: whether a bridge already exists on this machine.
    The policy forbids new ones to be made, but a machine with a bridge made earlier
    calls for a deliberate decision on what to do with it - and that is the proper
    place for that decision, rather than a side effect of the rule's rollout.

    A bridge is also worth telling from a team of cards. A team joins several cards
    into one so as to raise throughput or give redundancy, and stays on the same
    network. A bridge joins different networks. The names are at times confused, and
    the confusion leads to the item being needlessly let go.

    What this does not break: teams of network cards, the virtual machine switch,
    routing, bridges made earlier, or connectivity.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
  what_breaks:
    pl:
      - Nie da się utworzyć nowego mostka sieciowego, więc doraźne obejście problemu z łącznością tą drogą przestaje być możliwe
      - Mostek utworzony wcześniej działa dalej i wymaga osobnej, świadomej decyzji, co z nim zrobić
      - Zespoły kart sieciowych, przełącznik maszyn wirtualnych i routing pozostają bez zmian, bo to inne mechanizmy
      - Dla użytkowników maszyny zmiana jest całkowicie niewidoczna
    en:
      - A new network bridge cannot be made, so a makeshift way round a connectivity problem by that road ceases to be possible
      - A bridge made earlier keeps working and calls for a separate, deliberate decision on what to do with it
      - Teams of network cards, the virtual machine switch and routing stay unchanged, being other mechanisms
      - For the users of the machine the change is wholly invisible
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie istnieje mostek sieciowy wykorzystywany celowo i nie podjęto decyzji, czym go zastąpić
      - Maszyna pełni rolę wymagającą łączenia segmentów, a zamiast routingu skonfigurowano na niej mostek
    en:
      - A network bridge used deliberately exists on the machine and no decision has been taken on what to put in its place
      - The machine fills a role calling for segments to be joined, and a bridge has been configured on it instead of routing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_AllowNetBridge_NLA'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_AllowNetBridge_NLA'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_AllowNetBridge_NLA' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/network-subsystem/net-sub-interface-metric

notes:
  pl: |
    Reguła jest tania i mocna, i to zestawienie jest tu rzadkie. Nie odbiera
    na serwerze żadnej przewidzianej funkcji, a zamyka operację zdolną
    w jednej chwili znieść rozdział sieci budowany latami.

    Ograniczenie, które trzeba powiedzieć wprost: zasada zabrania tworzenia
    mostka, a nie usuwa istniejącego. Maszyna z mostkiem sprzed wdrożenia
    pozostaje w stanie, który reguła miała wykluczyć, mimo że audyt pokaże
    zgodność. Aplikacja powinna to odnotować przy punkcie, bo inaczej zieleń
    w raporcie znaczy mniej, niż czytelnik przypuszcza.

    Punkt stoi blisko reguły o udostępnianiu połączenia i obie warto
    rozpatrywać razem: opisują dwie drogi, którymi maszyna staje się
    przejściem między sieciami, choć nikt jej tak nie zaprojektował.
  en: |
    The rule is cheap and strong, and that pairing is rare here. On a server it
    takes away no foreseen function, while it shuts an operation able in one moment
    to lift a separation of networks built over years.

    A limit that must be said outright: the policy forbids a bridge to be made, and
    does not remove an existing one. A machine with a bridge predating the rollout
    stays in the state the rule was to rule out, though the audit will show
    compliance. The application should note that at the item, since otherwise green
    in the report means less than the reader supposes.

    The item stands close to the rule on connection sharing, and the two are worth
    weighing together: they describe two roads by which a machine becomes a passage
    between networks, though nobody designed it so.
