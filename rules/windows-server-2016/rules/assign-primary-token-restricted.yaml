id: win2016-assign-primary-token-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zastępowanie tokenu procesu ograniczone do kont usługowych
    en: Replacing a process token restricted to service accounts
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do zastępowania tokenu procesu do konta usługi
    lokalnej i konta usługi sieciowej.

    Uprawnienie pozwala uruchomić nowy proces z tożsamością inną niż własna.
    Jest potrzebne tam, gdzie usługa uruchamia pracę w imieniu kogoś innego —
    klasycznie robi to harmonogram zadań, uruchamiając zadanie na koncie, które
    je zdefiniowało.

    Groźne staje się wtedy, gdy ma je konto, które żadnych zadań cudzym imieniem
    nie uruchamia. Wtedy pozwala wziąć token zdobyty jakkolwiek — na przykład
    przez podszycie się pod klienta — i uczynić z niego tożsamość całego nowego
    procesu. Podszycie dotyczy jednego wątku i kończy się z nim; zastąpienie
    tokenu daje proces, który działa dalej.

    Kategoria wysoka, bo to jest drugi krok pary. Sam w sobie wymaga tokenu,
    który trzeba skądś wziąć, ale razem z uprawnieniem do podszywania się
    tworzy kompletną drogę z konta usługowego na konto systemowe.

    Na serwerze 2016 rzecz dotyczy głównie starszego oprogramowania
    uruchamiającego procesy potomne na innych kontach: systemów kolejkowania
    zadań, serwerów wydruku i narzędzi wdrożeniowych z tamtych lat.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwały proces
    o cudzej tożsamości, a nie tylko chwilowy dostęp w jednym wątku.
  en: |
    The item limits the right to replace a process token to the local service and
    network service accounts.

    The right allows a new process to be started with an identity other than one's
    own. It is needed where a service starts work on somebody else's behalf -
    classically the task scheduler does so, running a task under the account that
    defined it.

    It becomes dangerous where it is held by an account that starts no tasks in
    anybody else's name. It then allows a token obtained by any means - by
    impersonating a client, for instance - to be made the identity of a whole new
    process. Impersonation covers one thread and ends with it; replacing a token
    yields a process that carries on.

    The category is high, because this is the second step of a pair. On its own it
    needs a token that has to come from somewhere, but together with the right to
    impersonate it forms a complete road from a service account to the system
    account.

    On Server 2016 the matter concerns mainly older software starting child
    processes under other accounts: job queueing systems, print servers and
    deployment tools from those years.

    What an attacker gains while the item goes unmet: a lasting process under
    somebody else's identity, rather than momentary access in a single thread.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo lista bywa rozszerzona o konta usługowe
    oprogramowania, które uruchamia procesy w cudzym imieniu.

    Typowe przypadki to systemy kolejkowania zadań, serwery zadań wsadowych,
    starsze narzędzia wdrożeniowe i oprogramowanie uruchamiające raporty na
    koncie zlecającego. Wszystkie one działają poprawnie, a uprawnienie mają
    dlatego, że go naprawdę potrzebują.

    Objaw odebrania go jest natychmiastowy i jednoznaczny: proces potomny nie
    zostaje uruchomiony, a zadanie kończy się błędem. To ułatwia diagnozę,
    ale też oznacza, że zmiana zastosowana bez sprawdzenia zatrzyma pracę od
    razu, a nie po tygodniu.

    Warto sprawdzić osobno zadania harmonogramu ustawione na uruchamianie
    z innego konta niż to, które je uruchamia. Na serwerze z czasów wdrożenia
    bywa ich sporo i nikt ich od lat nie przeglądał.

    Czego to nie psuje: uruchamiania procesów na własnym koncie, usług
    systemowych, logowania ani zadań harmonogramu działających na koncie
    systemowym.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because the list is sometimes widened by service
    accounts of software that starts processes in somebody else's name.

    The usual cases are job queueing systems, batch job servers, older deployment
    tools and software running reports under the requester's account. All of those
    work correctly, and hold the right because they genuinely need it.

    The symptom of taking it away is immediate and unambiguous: the child process
    is not started and the job ends in an error. That eases diagnosis, but it also
    means a change applied without checking stops work at once rather than in a
    week.

    Scheduled tasks set to run under an account other than the one starting them
    are worth checking separately. On a server from the time of deployment there
    are often a good many, and nobody has looked at them for years.

    What this does not break: starting processes under one's own account, the
    system's services, signing in, or scheduled tasks running under the system
    account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - accounts-and-passwords
  what_breaks:
    pl:
      - System kolejkowania zadań uruchamiający procesy w cudzym imieniu przestaje je uruchamiać
      - Zadanie harmonogramu ustawione na uruchomienie z innego konta niż zlecające kończy się błędem
      - Starsze narzędzia wdrożeniowe i serwery zadań wsadowych z własnym kontem usługowym tracą to uprawnienie
      - Uruchamianie procesów na własnym koncie i zadania działające na koncie systemowym działają bez zmian
    en:
      - A job queueing system starting processes in somebody else's name stops starting them
      - A scheduled task set to run under an account other than the requesting one ends in an error
      - Older deployment tools and batch job servers with their own service account lose this right
      - Starting processes under one's own account and tasks running under the system account work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa oprogramowanie uruchamiające procesy potomne na cudzych kontach i nie przejrzano, które konta tego wymagają
    en:
      - Software starting child processes under other accounts runs on the machine and it has not been reviewed which accounts need it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeAssignPrimaryTokenPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeAssignPrimaryTokenPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeAssignPrimaryTokenPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list keeps the local service and network service accounts. Together with
    # the right to impersonate a client this one forms a complete road from a
    # service account to the system account, so the pair is worth reading together.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeAssignPrimaryTokenPrivilege = *S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeAssignPrimaryTokenPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/replace-a-process-level-token

notes:
  pl: |
    Oczekiwana lista nie obejmuje administratorów, w odróżnieniu od większości
    reguł tej grupy. Konto administratora nie potrzebuje tego uprawnienia,
    bo drogę do uruchomienia procesu na cudzym koncie ma i tak.

    Tę regułę warto czytać razem z regułą o podszywaniu się pod klienta.
    Osobno każda z nich wymaga dodatkowego warunku; razem tworzą drogę,
    która żadnego warunku nie wymaga.

    Zadania harmonogramu uruchamiane na koncie systemowym nie korzystają
    z tego uprawnienia i zmiana ich nie dotyczy.
  en: |
    The expected list does not cover the administrators, unlike most rules in this
    group. An administrator's account does not need this right, because it has a
    route to starting a process under another account anyway.

    This rule is worth reading together with the one on impersonating a client. On
    its own each needs a further condition; together they form a road that needs
    none.

    Scheduled tasks running under the system account do not use this right and the
    change does not touch them.
