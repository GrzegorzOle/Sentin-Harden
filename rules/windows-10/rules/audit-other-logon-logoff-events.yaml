id: win10-audit-other-logon-logoff-events

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja pozostałych zdarzeń logowania i wylogowania
    en: The audit of the remaining events of logging on and off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje te czynności wejścia i wyjścia z sesji, które nie są
    zwykłym zalogowaniem ani zwykłym wylogowaniem: odblokowanie stacji,
    przyłączenie i odłączenie sesji zdalnej, przełączenie użytkownika,
    wybudzenie maszyny.

    Nazwa podkategorii sugeruje resztki, a zbiór jest w praktyce
    najciekawszy z całego bloku. Powód jest prosty: zwykłe zalogowanie
    zdarza się raz dziennie, a czynności z tej listy zdarzają się
    kilkanaście razy i to właśnie one opisują, co się z maszyną działo
    między jednym logowaniem a drugim.

    Odłączenie sesji zdalnej jest tu wpisem najważniejszym. Sesja odłączona
    nie kończy się — trwa dalej, z uruchomionymi programami, i czeka na
    przyłączenie. Bez tej podkategorii wygląda w dzienniku dokładnie tak
    samo jak sesja czynna, a zdarzenie przyłączenia się do cudzej sesji
    odłączonej nie zostawia śladu w żadnym innym zapisie.

    Odblokowania stacji dopisują do tego drugą warstwę: mówią, kiedy przy
    maszynie ktoś faktycznie był, w odróżnieniu od tego, kiedy była
    zalogowana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przyłączanie
    się do sesji odłączonych i przełączanie użytkownika niezostawiające
    zapisu odróżniającego to od zwykłej pracy.
  en: |
    The setting writes down those acts of entering and leaving a session which are neither an ordinary logging
    on nor an ordinary logging off: the unlocking of a station, the joining and the parting of a remote session,
    the switching of a user, the waking of a machine.

    The subcategory's name suggests leavings, while the set is in practice the most interesting in the whole
    block. The reason is a plain one: an ordinary logging on happens once a day, while the acts upon that list
    happen a dozen times or more, and it is they that describe what went on with the machine between one logging
    on and the next.

    The parting of a remote session is here the weightiest entry. A parted session does not end - it lasts on,
    with its programs running, and waits to be joined. Without this subcategory it looks in the log exactly like
    a live session, and the event of joining somebody else's parted session leaves its trace in no other record.

    The unlockings of a station lay a second layer upon that: they say when somebody was in fact at the machine,
    as against when it was logged on.

    What an attacker gains while the item goes unmet: the joining of parted sessions and the switching of users,
    leaving no record to part that from ordinary work.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie niczego nie zabrania. Sesje zdalne, przełączanie użytkownika
    i odblokowywanie stacji działają dalej dokładnie tak jak dotąd.

    Liczba wpisów jest w bloku druga po inspekcji logowania i na maszynie
    z pulpitem zdalnym bywa wyższa niż się spodziewano — każde przyłączenie
    i odłączenie sesji daje wpis, a połączenie zrywane siecią odłącza się
    i przyłącza samo.

    Zapisywane są oba wyniki, bo połowa nieudana jest tu treścią, a nie
    dodatkiem: odrzucone próby odblokowania stacji to najżywszy fragment
    tego zapisu.

    Odnotowuję zależność wspólną dla bloku: podkategoria jest
    uzupełnieniem, więc przy wyłączonej inspekcji logowania opisuje
    czynności w sesjach, o których początku nic nie wiadomo.

    Czego to nie psuje: sesji zdalnych, przełączania użytkownika,
    odblokowywania stacji, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "no disruption".

    The setting forbids nothing. Remote sessions, the switching of users and the unlocking of a station work on
    exactly as before.

    The number of entries stands in this block second after the audit of logging on, and upon a machine with a
    remote desktop is at times higher than was looked for - every joining and parting of a session gives an
    entry, and a connection broken by the network parts and joins of itself.

    Both outcomes are written, the failed half being here the substance and not an addition: the refused
    attempts at unlocking a station are the liveliest part of that record.

    I set down a tie common to the block: the subcategory is a filling out, so with the audit of logging on
    switched off it describes acts within sessions of whose beginning nothing is known.

    What this does not break: remote sessions, the switching of users, the unlocking of a station, logging on,
    file shares, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - remote-desktop
  what_breaks:
    pl:
      - Na maszynie z pulpitem zdalnym wpisów bywa więcej, niż się spodziewano, bo połączenie zrywane siecią odłącza się i przyłącza samo
      - Zapisywane są oba wyniki, bo odrzucone próby odblokowania stacji to najżywszy fragment tego zapisu
      - Przy wyłączonej inspekcji logowania podkategoria opisuje czynności w sesjach, o których początku nic nie wiadomo
      - Ustawienie niczego nie zabrania i sesje zdalne działają dalej dokładnie tak jak dotąd
      - Przełączanie użytkownika, odblokowywanie stacji, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Upon a machine with a remote desktop the entries are at times more than was looked for, a connection broken by the network parting and joining of itself
      - Both outcomes are written, the refused attempts at unlocking a station being the liveliest part of that record
      - With the audit of logging on switched off the subcategory describes acts within sessions of whose beginning nothing is known
      - The setting forbids nothing and remote sessions work on exactly as before
      - The switching of users, the unlocking of a station, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma rozmiar domyślny, a maszyna obsługuje sesje zdalne rwane siecią
    en:
      - The security log is of its default size while the machine serves remote sessions broken by the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE921C-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE921C-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE921C-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. The failed half holds the refused attempts at
    # unlocking a station, which are the liveliest part of this subcategory.
    auditpol /set /subcategory:"{0CCE921C-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE921C-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-other-logonlogoff-events

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną, której nazwa mówi mniej niż
    treść. Warto, żeby aplikacja wymieniła czynności objęte podkategorią
    zamiast powtarzać słowo „pozostałe" — użytkownik czytający samą nazwę
    odłoży ją na koniec, a przy badaniu zdarzenia sięgnie po nią pierwszą.

    Argument wart postawienia wprost dotyczy sesji odłączonych. Jest to
    jedyne miejsce w całej paczce, w którym zapisywane jest przyłączenie się
    do sesji cudzej — czynność, która w dzienniku bez tej podkategorii
    wygląda jak zwykła praca zalogowanego użytkownika.

    Odnotowuję zakres ścisły tej reguły. Wymagam obu wyników i nie uznaję za
    zgodną maszyny zapisującej tylko powodzenia, bo połowa nieudana zawiera
    tu odrzucone odblokowania stacji — czyli dokładnie te wpisy, po które
    sięga się najczęściej.
  en: |
    The rule closes the block and is the only one in it whose name says less than its substance. It is well that
    the application set out the acts the subcategory takes in rather than repeat the word "remaining" - a user
    reading the name alone will put it off to the end, and at the looking into a happening will reach for it
    first.

    The argument worth putting outright touches parted sessions. It is the one place in the whole pack where the
    joining of somebody else's session is written down - an act which in a log without this subcategory looks
    like the ordinary work of a logged-on user.

    I set down this rule's strict reach. I call for both outcomes and do not hold as compliant a machine writing
    successes alone, the failed half here holding the refused unlockings of a station - which is to say just
    those entries reached for oftenest.
