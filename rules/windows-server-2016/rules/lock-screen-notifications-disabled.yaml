id: win2016-lock-screen-notifications-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Powiadomienia aplikacji przy zablokowanym ekranie wyłączone
    en: Application notifications at a locked screen switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wyświetlanie powiadomień aplikacji przy zablokowanym
    ekranie.

    Powiadomienie jest krótką treścią pochodzącą z aplikacji: początkiem
    wiadomości, nazwą nadawcy, tematem, przypomnieniem z kalendarza.
    Wyświetlone przy zablokowanym ekranie jest czytelne dla każdego, kto
    stoi przy maszynie.

    Powstaje przez to kanał wynoszący treść poza granicę uwierzytelnienia
    w sposób ciągły i bez niczyjego udziału. Nie trzeba niczego uruchamiać
    ani o nic pytać — wystarczy patrzeć na ekran. Jest to ta sama granica
    co przy trzech punktach poprzednich, tylko przekraczana samoczynnie,
    a nie na żądanie.

    Rzecz warta odnotowania: przedmiotem nie jest sama aplikacja, tylko
    miejsce wyświetlenia. Ta sama treść pokazana po zalogowaniu jest
    zwykłym powiadomieniem i nikomu nie przeszkadza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: ciągły
    podgląd fragmentów treści aplikacji bez przekroczenia granicy
    uwierzytelnienia i bez wykonania jakiejkolwiek czynności.
  en: |
    The setting switches off the showing of application notifications at a locked screen.

    A notification is a short content coming from an application: the beginning of a message, the
    sender's name, a subject, a reminder from a calendar. Shown at a locked screen it is legible to
    anybody standing at the machine.

    There arises through that a channel carrying content beyond the boundary of authentication
    ceaselessly and without anybody's taking part. Nothing has to be started and nothing asked - it is
    enough to look at the screen. It is the same boundary as at the three items before, only crossed of
    itself rather than on demand.

    A thing worth noting: the subject is not the application but the place of showing. That same content
    shown after a logon is an ordinary notification and gets in nobody's way.

    What an attacker gains while the item goes unmet: a ceaseless view of fragments of applications'
    content without the boundary of authentication being crossed and without any act being carried out.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", i jest to jedyna reguła w tym bloku, przy
    której trzeba o coś zapytać.

    Rzecz do ustalenia brzmi: czy ktoś obserwuje tę maszynę po
    powiadomieniach na zablokowanym ekranie. Zdarza się to częściej, niż
    wynikałoby z przeznaczenia serwera. Konsola stojąca w serwerowni bywa
    oglądana z daleka właśnie po to, żeby zobaczyć, czy coś się zapaliło,
    a narzędzia monitorujące bywają ustawione tak, żeby na tym ekranie
    pisać.

    Jeżeli tak jest, wykonanie punktu odbiera ten sposób obserwacji.
    Powiadomienia nie znikają — pojawią się po zalogowaniu — ale
    obserwacja bez logowania przestaje działać.

    Objaw jest przy tym nieoczywisty. Nikt nie zgłosi awarii; ekran po
    prostu przestanie się zmieniać, a zdarzenie, które kiedyś było widać
    z korytarza, zostanie zauważone później albo wcale.

    Czego to nie psuje: powiadomień po zalogowaniu, aplikacji, które je
    wysyłają, dzienników, alarmów przekazywanych pocztą albo do systemu
    monitorującego, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and it is the only rule in this block at which something has to be asked.

    The thing to be established runs: does anybody watch this machine by the notifications on a locked
    screen. That happens oftener than a server's purpose would suggest. A console standing in a machine
    room is at times looked at from a distance for just that - to see whether anything has lit up - and
    monitoring tools are at times set to write upon that screen.

    If that is so, carrying the item out takes that manner of watching away. The notifications do not
    vanish - they will appear after a logon - but the watching without a logon ceases to work.

    The symptom is besides not an obvious one. Nobody will report a fault; the screen will simply cease to
    change, and an event once visible from the corridor will be noticed later or not at all.

    What this does not break: notifications after a logon, the applications that send them, the logs,
    alerts passed by mail or to a monitoring system, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Obserwowanie maszyny po powiadomieniach na zablokowanym ekranie przestaje być możliwe
      - Nikt nie zgłosi awarii — ekran po prostu przestanie się zmieniać, a zdarzenie zostanie zauważone później albo wcale
      - Powiadomienia pojawiają się dalej po zalogowaniu i aplikacje, które je wysyłają, działają bez zmian
      - Alarmy przekazywane pocztą albo do systemu monitorującego pozostają bez zmian
      - Dzienniki, usługi i sieć pozostają bez zmian
    en:
      - Watching the machine by the notifications on a locked screen ceases to be possible
      - Nobody will report a fault - the screen will simply cease to change, and an event will be noticed later or not at all
      - Notifications go on appearing after a logon and the applications sending them work unchanged
      - Alerts passed by mail or to a monitoring system stay unchanged
      - The logs, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konsola tej maszyny jest obserwowana po powiadomieniach na zablokowanym ekranie i nie ma innego kanału alarmowego
      - Narzędzie monitorujące zostało ustawione tak, żeby pisać na ekranie blokady
    en:
      - This machine's console is watched by the notifications on a locked screen and there is no other channel for alerts
      - A monitoring tool has been set to write upon the lock screen
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'DisableLockScreenAppNotifications'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'DisableLockScreenAppNotifications'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Establish first whether anybody watches this machine for alerts shown on a
    # locked screen. Where a console stands in a machine room and is looked at
    # from a distance, that way of watching stops.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLockScreenAppNotifications' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-abovelock

notes:
  pl: |
    Punkt jest w tym bloku jedynym, który cokolwiek kosztuje, i warto go
    z tego powodu oddzielić od pozostałych w widoku. Pięć reguł bloku można
    zastosować hurtem; ta wymaga jednego pytania.

    Pytanie jest przy tym nietypowe, bo nie dotyczy oprogramowania ani
    roli maszyny, tylko przyzwyczajenia obsługi. Inwentaryzacja tego nie
    wykryje — nie ma czego wykryć. Aplikacja może jedynie pytanie zadać
    i przyjąć odpowiedź.

    Warto zauważyć, że objaw jest tu milczący. Odebranie kanału obserwacji
    nie powoduje zgłoszenia; powoduje, że kolejne zdarzenie zostanie
    zauważone później. Jest to ta sama własność co przy usłudze zbierania
    dzienników z innych maszyn i warto oba miejsca oznaczać tak samo:
    skutkiem jest brak informacji, a nie brak działania.

    Argument spinający cały blok kończy się na tym punkcie. Cztery reguły
    dotyczyły przekraczania granicy uwierzytelnienia na żądanie; ta dotyczy
    przekraczania jej samoczynnie, bez niczyjego udziału — i to czyni ją
    najtrudniejszą do zauważenia.
  en: |
    The item is in this block the only one that costs anything, and for that reason is worth setting apart
    from the rest in the view. Five of the block's rules can be applied in bulk; this one calls for one
    question.

    The question is besides an unusual one, concerning neither software nor the machine's role but a
    habit of the attendance. An inventory will not find it - there is nothing to find. The application can
    only put the question and take the answer.

    Worth noticing that the symptom is here a silent one. The taking away of a channel of watching causes
    no report; it causes the next event to be noticed later. It is the same property as at the service
    gathering logs from other machines, and both places are worth marking the same way: the consequence is
    a want of word, not a want of working.

    The argument binding the whole block ends at this item. Four rules concerned the crossing of the
    boundary of authentication on demand; this one concerns its crossing of itself, without anybody's
    taking part - and that makes it the hardest to notice.
