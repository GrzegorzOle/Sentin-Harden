id: win11-software-secure-attention-sequence-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Logon Options
  title:
    pl: Wywoływanie bezpiecznej sekwencji uwagi przez programy zablokowane
    en: The raising of the secure attention sequence by programs blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Trzy klawisze naciskane razem przed zalogowaniem są w systemie Windows
    czymś więcej niż skrótem. Są jedyną kombinacją, której żaden program nie
    może przechwycić: obsługuje ją sterownik klawiatury i jądro, a nie okno
    stojące na wierzchu. Stąd bierze się jej sens — po naciśnięciu tych klawiszy
    ekran, który się pojawi, na pewno należy do systemu, a nie do programu
    udającego system.

    Ta pewność opiera się na jednym założeniu: sekwencję potrafi wywołać
    wyłącznie człowiek przy klawiaturze. Jeżeli potrafi ją wywołać także
    program, założenie znika. Ekran logowania przestaje być dowodem na to, że
    użytkownik sam o niego poprosił — może pojawić się dlatego, że poprosił
    o niego program, w chwili przez ten program wybranej i po jego własnym
    oknie. Użytkownik, który ma odróżnić prośbę o hasło prawdziwą od podrobionej,
    traci jedyne kryterium, jakim dysponował.

    Domyślnie sekwencję potrafią wywołać narzędzia ułatwień dostępu pracujące na
    bezpiecznym pulpicie. Ustawienie pozwala dopuścić do tego także usługi —
    i to jest rozszerzenie, którego punkt zabrania.

    Punkt zamyka wywoływanie sekwencji przez oprogramowanie w całości. Zostaje
    klawiatura i tylko klawiatura.
  en: |
    The three keys pressed together before signing in are more than a shortcut in
    Windows. They are the one combination no program can intercept: it is handled by
    the keyboard driver and the kernel, not by whatever window is on top. That is
    where its point comes from - once those keys are pressed, the screen that appears
    certainly belongs to the system and not to a program impersonating it.

    That certainty rests on one assumption: only a human at the keyboard can raise the
    sequence. If a program can raise it too, the assumption is gone. The sign-in screen
    stops being proof that the user asked for it themselves - it may appear because a
    program asked for it, at a moment of that program's choosing and following the
    program's own window. A user meant to tell a genuine request for a password from a
    forged one loses the only criterion they had.

    By default the sequence can be raised by accessibility tools working on the secure
    desktop. The setting allows services to be admitted to it as well - and that is
    the widening the item forbids.

    The item closes the raising of the sequence by software entirely. The keyboard
    remains, and the keyboard alone.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś korzysta z maszyny bez fizycznej klawiatury
    albo z narzędziem, które podaje te klawisze za użytkownika.

    Pierwsze w kolejności są tablety i stanowiska dotykowe. Klawiatura ekranowa
    na bezpiecznym pulpicie potrafi podać tę sekwencję i po wdrożeniu przestanie.
    Na maszynie wymagającej sekwencji przed logowaniem oznacza to, że bez
    fizycznej klawiatury nie da się zalogować w ogóle — jest to najpoważniejszy
    z możliwych skutków tego punktu i jedyny powód, dla którego warto go
    sprawdzić przed, a nie po.

    Drugie to narzędzia ułatwień dostępu używane przez osoby, które nie
    posługują się zwykłą klawiaturą. Trzecie — narzędzia zdalnego dostępu
    z przyciskiem podającym tę sekwencję. Klient pulpitu zdalnego z systemu
    Windows podaje ją własną drogą i działa dalej; narzędzia spoza systemu
    potrafią robić to przez mechanizm, który punkt zamyka.

    Na zwykłym stanowisku z klawiaturą zmiana przechodzi niezauważona. Nic nie
    zmienia się w samym logowaniu ani w zachowaniu ekranu blokady.

    Nie ma restartu.
  en: |
    What needs checking is whether anyone uses the machine without a physical keyboard
    or with a tool that supplies these keys on the user's behalf.

    First in line are tablets and touch stations. The on-screen keyboard on the secure
    desktop can supply this sequence and will stop after the rollout. On a machine
    demanding the sequence before sign-in that means signing in is impossible without
    a physical keyboard at all - the gravest effect this item can have and the one
    reason it is worth checking beforehand rather than after.

    Second are accessibility tools used by people who do not work with an ordinary
    keyboard. Third - remote access tools with a button supplying this sequence. The
    remote desktop client from Windows supplies it by a route of its own and carries
    on; tools from outside the system may do it through the mechanism the item closes.

    At an ordinary station with a keyboard the change passes unnoticed. Nothing
    changes in signing in itself or in the lock screen's behaviour.

    There is no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Klawiatura ekranowa przestanie podawać tę sekwencję na tablecie bez fizycznej klawiatury
      - Na maszynie wymagającej sekwencji przed logowaniem tablet bez klawiatury nie pozwoli się zalogować
      - Narzędzia ułatwień dostępu podające tę sekwencję za użytkownika przestaną działać
      - Narzędzia zdalnego dostępu spoza systemu mogą stracić przycisk podający tę sekwencję
    en:
      - The on-screen keyboard stops supplying this sequence on a tablet with no physical keyboard
      - On a machine demanding the sequence before sign-in a keyboardless tablet cannot sign in
      - Accessibility tools supplying this sequence on the user's behalf stop working
      - Remote access tools from outside the system may lose the button supplying this sequence
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje się dotykiem, bez fizycznej klawiatury
      - Użytkownik korzysta z narzędzia ułatwień dostępu zastępującego klawiaturę
    en:
      - The machine is worked by touch, with no physical keyboard
      - A user works with an accessibility tool standing in for the keyboard
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero admits no software at all, and
      # the further positions admit services, accessibility tools, or both.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'SoftwareSASGeneration'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'SoftwareSASGeneration'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SoftwareSASGeneration' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/secauthn/winlogon-and-gina

notes:
  pl: |
    Reguła wymaga jawnego zera, a brak wpisu traktuje jako niezgodność. Jest to
    wybór świadomy i wspólny dla całej paczki: brak wpisu znaczy, że niczego nie
    wymuszono, a ustawienie domyślne dopuszcza narzędzia ułatwień dostępu na
    bezpiecznym pulpicie. Zero jest więc ustawieniem twardszym od domyślnego,
    a nie jego zapisem.

    Punkt nie zmienia tego, czy sekwencja jest przed logowaniem wymagana —
    o tym rozstrzyga osobne ustawienie zabezpieczeń. Tutaj chodzi wyłącznie
    o to, kto poza człowiekiem przy klawiaturze może ją wywołać.

    Wycofanie nie usuwa gałęzi — jest wspólna z kilkudziesięcioma innymi
    ustawieniami zasad.
  en: |
    The rule requires an explicit zero and counts a missing entry as a deviation. It
    is a deliberate choice shared across the pack: a missing entry means nothing is
    enforced, and the default setting admits accessibility tools on the secure
    desktop. Zero is therefore a harder setting than the default rather than a record
    of it.

    The item does not change whether the sequence is required before signing in - a
    separate security setting settles that. Here it is only about who besides the
    human at the keyboard may raise it.

    Rollback does not remove the key - it is shared with several dozen other policy
    settings.
