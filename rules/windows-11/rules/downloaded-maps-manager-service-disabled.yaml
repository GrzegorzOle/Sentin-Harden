id: win11-downloaded-maps-manager-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania pobranymi mapami wyłączona
    en: The service managing downloaded maps disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pobiera i utrzymuje dane map przechowywane na maszynie do pracy bez
    połączenia z siecią: sprawdza aktualizacje, ściąga nowe wersje obszarów
    i udostępnia je programom mapowym.

    Jest to punkt o wadze niskiej i nie ma powodu udawać inaczej. Usługa nie
    przyjmuje połączeń z sieci, nie wystawia portu i nie uwierzytelnia nikogo.
    Nie da się o niej powiedzieć, że zamyka drogę wejścia, bo żadnej nie
    otwiera.

    Wartość punktu jest dwojaka i leży poza bezpieczeństwem w ścisłym
    znaczeniu. Po pierwsze, usługa sięga do sieci samoczynnie i przesyła dane
    bez udziału człowieka, a więc jest jednym z wielu kanałów wychodzących
    z maszyny; każdy zamknięty kanał tego rodzaju upraszcza obraz ruchu
    sieciowego, co ma znaczenie tam, gdzie ruch jest obserwowany. Po drugie,
    dane map bywają obszerne i pobierają się w tle w chwilach, w których nikt
    tego nie oczekuje — na łączu mierzonym albo w sieci komórkowej.

    Punkt należy do tych, które robi się dlatego, że maszyna nie ma powodu
    utrzymywać składnika, z którego nikt nie korzysta.
  en: |
    The service downloads and maintains map data kept on the machine for work without a
    network connection: it checks for updates, fetches new versions of areas and makes
    them available to map programs.

    This is an item of low weight and there is no reason to pretend otherwise. The
    service takes no connections from the network, puts out no port and authenticates
    nobody. It cannot be said to close a way in, because it opens none.

    The item's worth is twofold and lies outside security in the strict sense. First, the
    service reaches out to the network of its own accord and sends data with no person
    involved, so it is one of many channels going out of the machine; every closed
    channel of this kind simplifies the picture of network traffic, which matters where
    that traffic is watched. Second, map data are sometimes bulky and download in the
    background at moments nobody expects - on a metered link or over a mobile network.

    The item belongs among those made because the machine has no reason to keep a
    component nobody uses.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek korzysta z map bez połączenia
    z siecią.

    Na stanowisku biurowym zmiana zwykle nie robi nic zauważalnego. Programy
    mapowe działające przez sieć działają dalej — one pobierają dane na bieżąco
    i nie korzystają z tej usługi.

    Skutek dotyczy pracy bez połączenia. Mapy pobrane wcześniej zostają na
    maszynie i dają się otworzyć, ale przestają się aktualizować. Pobranie
    nowego obszaru nie będzie możliwe. Po dłuższym czasie oznacza to mapy
    nieaktualne, co przy pracy terenowej bywa gorsze niż brak map, bo błąd
    nie jest widoczny.

    Sprawdzić warto stanowiska pracujące poza siedzibą i tam, gdzie łącze bywa
    niedostępne. W pozostałych przypadkach jest to zmiana bez kosztu.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anybody uses maps without a network connection.

    At an office station the change usually does nothing noticeable. Map programs working
    over the network carry on working - they fetch data as they go and do not use this
    service.

    The effect concerns work without a connection. Maps downloaded earlier stay on the
    machine and can be opened, but stop being updated. Downloading a new area will not be
    possible. After a longer time that means out-of-date maps, which in field work is
    sometimes worse than no maps, because the error is not visible.

    Stations working away from the premises and places where the link is sometimes
    unavailable are worth checking. In the remaining cases this is a change at no cost.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - user-interface
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Mapy przechowywane na maszynie przestają się aktualizować
      - Pobranie nowego obszaru map do pracy bez sieci przestaje być możliwe
      - Mapy pobrane wcześniej dają się dalej otworzyć w stanie z dnia pobrania
      - Programy mapowe działające przez sieć działają dalej bez zmiany
    en:
      - Maps kept on the machine stop being updated
      - Downloading a new map area for work without a network stops being possible
      - Maps downloaded earlier can still be opened as they were on the day of download
      - Map programs working over the network carry on working unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Praca terenowa opiera się na mapach dostępnych bez połączenia z siecią
      - Maszyna jest wykorzystywana w miejscach bez zasięgu, gdzie mapy muszą być aktualne
    en:
      - Field work rests on maps available without a network connection
      - The machine is used in places with no coverage, where maps have to be up to date
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MapsBroker'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MapsBroker'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'MapsBroker' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'MapsBroker' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'MapsBroker' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-windows-11-endpoints

notes:
  pl: |
    Wyłączenie usługi nie usuwa map pobranych wcześniej. Zajmują one miejsce
    na dysku dalej i jeżeli celem było odzyskanie miejsca, trzeba je usunąć
    osobno.

    Reguła jest przykładem punktu o niskiej kategorii ryzyka, który mimo to
    warto wdrożyć razem z innymi — nie dlatego, że coś zamyka, tylko dlatego,
    że zdejmuje z maszyny jeden z samoczynnych kanałów wychodzących. Świadome
    odpuszczenie go jest tu wynikiem prawidłowym i aplikacja ma to ułatwić,
    a nie utrudniać.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa uruchamiana wyzwalaczem bywa zatrzymana i mimo to
    niezgodna.
  en: |
    Disabling the service does not remove maps downloaded earlier. They go on taking up
    disk space, and if the aim was to recover space they have to be removed separately.

    The rule is an example of an item in a low risk category that is worth applying
    together with others all the same - not because it closes anything, but because it
    takes one of the automatic outgoing channels off the machine. Deliberately accepting
    it is a proper outcome here, and the application should make that easier rather than
    harder.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment. A service started by a trigger is sometimes stopped and deviating
    all the same.
