id: win10-deny-local-logon-guests

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa logowania lokalnego dla grupy Goście
    en: Denial of local sign-in for the Guests group
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odmawia grupie Goście logowania przy samej maszynie.

    Logowanie lokalne jest drogą, która wymaga obecności fizycznej —
    i właśnie dlatego bywa lekceważone. Skoro ktoś stoi przy maszynie,
    uznaje się, że ma do niej prawo. Założenie to nie obowiązuje
    w recepcji, w sali szkoleniowej, w warsztacie ani w każdym innym
    miejscu, gdzie sprzęt jest dostępny dla postronnych.

    Konto gościa było pomyślane właśnie do takiego użycia: wejście bez
    hasła, sesja bez śladu, dostęp do tego, co jest udostępnione wszystkim.
    Dzisiaj żadna z tych cech nie jest zaletą.

    Odmowa logowania lokalnego domyka grupę odmów od strony fizycznej.
    Odmowa sieciowa zamyka wejście z drugiego końca sieci; ta zamyka
    wejście z klawiatury.

    Odnotowuję, że zmiana nie dotyczy sesji już otwartej. Odmowa działa
    przy następnej próbie zalogowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję na
    maszynie, do której zdołał podejść, bez żadnego hasła.
  en: |
    The setting denies the Guests group a signing in at the machine itself.

    A signing in locally is a road that calls for a bodily presence - and for that very reason it is at times
    made light of. Where somebody stands at a machine it is held that they have a right to it. That assumption
    does not hold at a reception desk, in a room of training, in a workshop nor in any other place where the gear
    is within a stranger's reach.

    The guest account was thought out for just such a use: an entry without a password, a session without a trace,
    a way to whatever is given out to all. Today none of those marks is a merit.

    The denial of a signing in locally closes the group of denials upon the bodily side. The denial from the
    network shuts the entry from the other end of a network; this shuts the entry from the keyboard.

    I set down that the change does not touch a session already open. The denial works at the next try at signing
    in.

    What an attacker gains while the item goes unmet: a session upon a machine they have managed to walk up to,
    with no password at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Grupa Goście jest pusta na maszynie utrzymywanej normalnie, a konto
    gościa wyłączone, więc odmowa dotyczy zbioru bez członków.

    Odnotowuję jedyny przypadek wart uwagi: stanowisko celowo otwarte dla
    postronnych, gdzie konto gościa jest sposobem na udostępnienie
    przeglądarki albo katalogu bez zakładania kont. Bywa tak w salach
    szkoleniowych i na stanowiskach informacyjnych, i tam ta zmiana odcina
    dostęp.

    Sprawdzenie polega na przejrzeniu członków grupy Goście przed zmianą.

    Skutek pojawia się przy następnej próbie zalogowania, bez restartu.
    Sesja otwarta trwa do wylogowania.

    Czego to nie psuje: logowania kontami zwykłymi, dostępu do udziałów,
    pracy z plikami, drukowania, zdalnego dostępu.
  en: |
    The class is "no disruption".

    The Guests group stands empty upon a machine kept in the ordinary way, and the guest account switched off, so
    the denial touches a set with no members.

    I set down the one case worth marking: a station opened to strangers on purpose, where the guest account is
    the way of giving out a browser or a folder without accounts being made. It happens so in rooms of training
    and at desks of information, and there this change cuts the way off.

    The review comes down to a looking through of the Guests group's members before the change.

    The consequence shows at the next try at signing in, with no restart. A session open lasts until the signing
    out.

    What this does not break: signing in with ordinary accounts, the way to shares, work with files, printing, or
    the way in from afar.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Stanowisko otwarte dla postronnych przez konto gościa przestanie przyjmować logowanie
      - Bywa tak w salach szkoleniowych i na stanowiskach informacyjnych bez zakładanych kont
      - Grupa Goście jest zwykle pusta, więc na większości maszyn zmiana jest zapisem stanu
      - Skutek pojawia się przy następnej próbie zalogowania, a sesja otwarta trwa do wylogowania
      - Logowanie kontami zwykłymi, dostęp do udziałów, praca z plikami i drukowanie pozostają bez zmian
    en:
      - A station opened to strangers through the guest account will cease to take a signing in
      - It happens so in rooms of training and at desks of information with no accounts made
      - The Guests group stands commonly empty, so upon most machines the change is a setting down of a state
      - The consequence shows at the next try at signing in, and a session open lasts until the signing out
      - Signing in with ordinary accounts, the way to shares, work with files and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko jest celowo otwarte dla postronnych i konto gościa jest jedynym sposobem wpuszczenia ich
    en:
      - The station is opened to strangers on purpose and the guest account is the only way of letting them in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'S-1-5-32-546'
  comparison: contains

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyInteractiveLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    foreach ($sid in @('*S-1-5-32-546')) {
      if (-not ($members -contains $sid)) { $members += $sid }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyInteractiveLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-log-on-locally

notes:
  pl: |
    Reguła jest odpowiednikiem odmowy sieciowej dla drogi fizycznej
    i warto, żeby aplikacja pokazała je razem. Obie dotyczą tej samej
    grupy, a różnią się wyłącznie kierunkiem, z którego przychodzi próba.

    Argument wart zachowania dotyczy tego, że obecność fizyczna nie jest
    uprawnieniem. Wygodnie jest przyjąć, że kto stoi przy maszynie, ten ma
    do niej prawo — i na stanowisku w zamkniętym pokoju jest to prawda.
    Na recepcji, w warsztacie i w sali szkoleniowej nie jest, a to właśnie
    tam konto gościa bywa włączone.

    Odnotowuję, że ocena jest tu niższa niż przy odmowie sieciowej, i jest
    to celowe. Droga fizyczna wymaga wejścia do budynku, więc kosztuje
    napastnika nieporównanie więcej niż połączenie z drugiego końca
    sieci. Punkt ten dokłada warstwę, nie zamyka głównej drogi.
  en: |
    The rule is the counterpart of the denial from the network for the bodily road, and it is well that the
    application show them together. Both touch the same group, and they differ only in the quarter the try comes
    from.

    The argument worth keeping touches this, that a bodily presence is no right. It is handy to take it that
    whoever stands at a machine has a right to it - and at a station in a shut room that is true. At a reception
    desk, in a workshop and in a room of training it is not, and it is just there that a guest account is at times
    switched on.

    I set down that the grading is here lower than at the denial from the network, and it is meant so. The bodily
    road calls for an entry into the building, so it costs an attacker beyond compare more than a reaching from
    the other end of a network. This item lays on a layer; it does not shut the chief road.
