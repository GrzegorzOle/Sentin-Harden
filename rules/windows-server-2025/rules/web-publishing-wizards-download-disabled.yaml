id: win2025-web-publishing-wizards-download-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Blokada pobierania listy usług zewnętrznych przez kreatory publikowania
    en: Wizards blocked from downloading the list of outside services
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania kreatorom publikowania w sieci i zamawiania odbitek
    pobierania listy usług zewnętrznych, którą wyświetlają użytkownikowi do
    wyboru.

    Kategoria niska i chcę przy niej zostać, bo mechanizm sam w sobie nie
    jest drogą wejścia: pobiera się wykaz nazw i adresów, a nie kod.
    Reguła jest tu porządkowa, nie obronna, i mówię to wprost zamiast
    dorabiać jej wagi.

    Wartość jest jedna, za to konkretna. Kreatory pobierają tę listę
    w chwili otwarcia, czyli zanim ktokolwiek cokolwiek wybierze, i robią
    to z zasobu zewnętrznego. Na serwerze oznacza to połączenie wychodzące,
    którego nikt nie zamawiał i którego nikt nie spodziewa się zobaczyć
    w zestawieniu ruchu. Mniej takich połączeń to krótsza lista rzeczy,
    które przy przeglądzie trzeba wytłumaczyć.

    Osobno warto nazwać, czego ten punkt dotyczy w praktyce na serwerze:
    niczego. Te kreatory są elementem powłoki stanowiska roboczego
    i w codziennej pracy serwera nie występują. Reguła zamyka drogę, która
    stoi otworem, choć nikt nią nie chodzi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Pozostaje natomiast jeszcze jedno dozwolone połączenie
    wychodzące, w którego tle łatwiej ukryć własne.
  en: |
    The item forbids the wizards for publishing to the web and for ordering
    prints to fetch the list of outside services they show the user to choose
    from.

    The category is low and I mean to stay with it, because the mechanism in
    itself is not a way in: what is fetched is a list of names and addresses,
    not code. The rule here is a matter of order rather than defence, and I
    say so plainly instead of manufacturing weight for it.

    There is one value, and it is definite. The wizards fetch this list at
    the moment they open, that is, before anybody chooses anything, and they
    fetch it from an outside resource. On a server that means an outbound
    connection nobody ordered and nobody expects to see in a traffic listing.
    Fewer such connections make a shorter list of things to explain at a
    review.

    It is worth naming separately what this item touches in practice on a
    server: nothing. These wizards are part of the workstation shell and do
    not occur in a server's daily work. The rule closes a road that stands
    open although nobody walks it.

    What an attacker gains while the item goes unmet: nothing directly. What
    remains, though, is one more permitted outbound connection, in the
    background of which it is easier to hide one's own.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to jeden z tych przypadków, w których
    nie mam do postawienia nawet zastrzeżenia, bo na serwerze nie ma czego
    stracić.

    Skutek, gdyby ktoś tych kreatorów użył, jest taki: lista usług do wyboru
    będzie pusta, zamiast pobrać się z sieci. Sam kreator otwiera się
    i działa. Nie znika żadne polecenie z menu i nic nie zgłasza błędu.

    Czego to nie psuje: publikowania plików w jakikolwiek inny sposób,
    przesyłania plików, udziałów sieciowych, drukowania ani zamawiania
    czegokolwiek przez przeglądarkę. Punkt dotyczy wyłącznie listy
    pobieranej przez dwa kreatory powłoki.

    Rzecz do zapamiętania przy czytaniu sprawozdania: mimo że punkt należy
    do sekcji o komunikacji internetowej, jego wpis nie leży w gałęzi
    zasadowej z pozostałymi z tej grupy, tylko w gałęzi powłoki. Przy
    ręcznym sprawdzaniu łatwo go szukać nie tam, gdzie jest.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption" and this is one of those cases where I do
    not even have a caveat to state, because on a server there is nothing to
    lose.

    The effect, were anybody to use these wizards, is this: the list of
    services to choose from will be empty instead of being fetched from the
    network. The wizard itself opens and works. No command disappears from a
    menu and nothing reports an error.

    What this does not break: publishing files in any other way, transferring
    files, network shares, printing, or ordering anything through a browser.
    The item concerns only the list fetched by two shell wizards.

    Something to remember when reading the report: although the item belongs
    to the section on internet communication, its entry does not lie in the
    policy branch with the others in that group but in the shell branch. When
    checking by hand it is easy to look for it where it is not.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - printing
  what_breaks:
    pl:
      - Lista usług zewnętrznych w kreatorze publikowania i zamawiania odbitek będzie pusta zamiast pobrać się z sieci
      - Sam kreator otwiera się i działa, nic nie znika z menu i nic nie zgłasza błędu
      - Publikowanie plików innymi drogami, przesyłanie plików, udziały sieciowe i drukowanie działają bez zmian
      - Wpis leży w gałęzi powłoki, nie w gałęzi zasadowej z pozostałymi punktami o komunikacji internetowej
    en:
      - The list of outside services in the publishing and print-ordering wizard will be empty instead of fetched from the network
      - The wizard itself opens and works, nothing disappears from a menu and nothing reports an error
      - Publishing files by other routes, transferring files, network shares and printing work unchanged
      - The entry lies in the shell branch, not the policy branch holding the other internet communication items
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym ludzie korzystają z kreatorów publikowania w sieci albo zamawiania odbitek
    en:
      - The machine is a terminal server where people use the wizards for publishing to the web or ordering prints
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry lies in the shell branch, not with the other items from the
      # internet communication section.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'NoWebServices'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoWebServices'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A matter of order rather than defence: what is fetched is a list of names
    # and addresses, not code. The value is one fewer outbound connection nobody
    # ordered. The wizards still open - their list is simply empty.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoWebServices' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/jj592685(v=ws.11)

notes:
  pl: |
    Reguła jest porządkowa, nie obronna, i mówię to wprost zamiast dorabiać
    jej wagi: pobiera się wykaz nazw i adresów, a nie kod.

    Wartość jest jedna, za to konkretna — kreatory pobierają tę listę
    w chwili otwarcia, z zasobu zewnętrznego. Na serwerze to połączenie
    wychodzące, którego nikt nie zamawiał. Mniej takich połączeń to krótsza
    lista rzeczy, które przy przeglądzie trzeba wytłumaczyć.

    Punkt należy do sekcji o komunikacji internetowej, ale jego wpis leży
    w gałęzi powłoki, nie w gałęzi zasadowej z pozostałymi z tej grupy.
  en: |
    The rule is a matter of order rather than defence, and I say so plainly
    instead of manufacturing weight for it: what is fetched is a list of
    names and addresses, not code.

    There is one value and it is definite - the wizards fetch this list at
    the moment they open, from an outside resource. On a server that is an
    outbound connection nobody ordered. Fewer such connections make a shorter
    list of things to explain at a review.

    The item belongs to the section on internet communication, but its entry
    lies in the shell branch, not the policy branch with the others in that
    group.
