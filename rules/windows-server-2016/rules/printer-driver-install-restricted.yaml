id: win2016-printer-driver-install-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Instalowanie sterowników drukarek zastrzeżone dla administratorów
    en: The installing of printer drivers reserved for administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania użytkownikom bez uprawnień administratora
    instalować sterowniki drukarek na tej maszynie.

    Sterownik drukarki nie jest zwykłym plikiem. Znaczna jego część
    pracuje w przestrzeni, w której działa jądro systemu, więc wykonanie
    kodu ze sterownika jest wykonaniem kodu z uprawnieniami wyższymi niż
    jakiekolwiek konto.

    Droga jest przez to wyjątkowo krótka. Nie trzeba łamać hasła ani
    wykorzystywać usterki: wystarczy skłonić maszynę do zainstalowania
    sterownika, który się na taką okazję przygotowało. Instalacja jest
    czynnością przewidzianą i niczego nie łamie.

    Dlatego sterowniki drukarek zajmują w zestawieniach dróg podniesienia
    uprawnień miejsce osobne i wracają w nich co kilka lat. Mechanizm jest
    z założenia otwarty, bo drukarki miały dawać się dodawać bez
    administratora — i właśnie to założenie jest tu problemem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    własnego kodu z uprawnieniami jądra, przy użyciu czynności, która nie
    wygląda na atak i nie wymaga żadnej usterki.
  en: |
    The setting forbids users without administrator rights to install printer
    drivers on this machine.

    A printer driver is no ordinary file. A good part of it works in the space where
    the system's kernel runs, so running code from a driver is running code with
    rights higher than any account's.

    The road is thereby uncommonly short. No password has to be broken and no fault
    used: it is enough to induce the machine to install a driver prepared for the
    occasion. The installing is a foreseen act and breaks nothing.

    That is why printer drivers hold a place of their own in the tallies of roads to
    raised rights, and return to them every few years. The mechanism is open by
    design, printers having been meant to be addable without an administrator - and
    it is that very assumption that is the trouble here.

    What an attacker gains while the item goes unmet: the running of their own code
    with the kernel's rights, using an act that does not look like an attack and
    calls for no fault at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy ktokolwiek na tej
    maszynie dodaje drukarki samodzielnie.

    Na serwerze zwykle nie dodaje i wdrożenie nie zmienia nic. Wyjątkiem
    są dwie sytuacje i obie są konkretne.

    Pierwsza to serwer terminali, na którym ludzie pracują w sesjach
    zdalnych i dodają sobie drukarki, do których mają dostęp u siebie.
    Po wdrożeniu przestaną móc to zrobić, a komunikat powie o braku
    uprawnień, co prowadzi wprost do przyczyny.

    Druga to przekierowanie drukarek z sesji zdalnej. Drukarka przypięta
    do stanowiska użytkownika bywa instalowana na serwerze przy
    nawiązywaniu sesji, a przy wdrożonym punkcie instalacja ta nie dojdzie
    do skutku, jeżeli sterownika jeszcze na serwerze nie ma. Objaw brzmi
    „drukarka nie przenosi się do sesji" i bywa przypisywany klientowi,
    a nie serwerowi.

    Odpowiedzią na oba przypadki jest wgranie potrzebnych sterowników
    wcześniej, przez administratora, a nie odpuszczenie punktu.

    Czego to nie psuje: drukowania na drukarkach już zainstalowanych,
    kolejek udostępnianych, usług, logowania.

    Wymaga zatrzymania usługi wydruku; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anybody on
    this machine adds printers themselves.

    On a server as a rule nobody does and the rollout changes nothing. There are two
    exceptions and both are particular.

    The first is a terminal server where people work in remote sessions and add for
    themselves printers they have access to at their own end. After the rollout they
    will stop being able to, and the message will speak of rights wanting, which
    leads straight to the cause.

    The second is the redirecting of printers from a remote session. A printer
    attached to a user's position is at times installed on the server as the session
    is established, and with the item rolled out that installing will not come about
    if the driver is not on the server already. The symptom reads "the printer does
    not carry over into the session" and is at times laid at the client's door
    rather than the server's.

    The answer to both cases is to load the needed drivers beforehand, by an
    administrator, rather than to let the item go.

    What this does not break: printing on printers already installed, shared queues,
    services, or signing in.

    Calls for the print service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Użytkownicy sesji zdalnych przestają móc dodać sobie drukarkę, a komunikat mówi o braku uprawnień
      - Drukarka przekierowana ze stanowiska nie przeniesie się do sesji, jeżeli sterownika nie ma jeszcze na serwerze
      - Objaw przy przekierowaniu bywa przypisywany klientowi, a nie serwerowi, więc rozpoznanie zaczyna się po niewłaściwej stronie
      - Drukowanie na drukarkach już zainstalowanych i kolejki udostępniane pozostają bez zmian
    en:
      - Users of remote sessions stop being able to add a printer for themselves, and the message speaks of rights wanting
      - A printer redirected from a position will not carry over into the session if the driver is not on the server already
      - The symptom at redirecting is at times laid at the client's door rather than the server's, so the search begins on the wrong side
      - Printing on printers already installed and shared queues stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, a użytkownicy dodają sobie drukarki sami i nie wgrano sterowników wcześniej
      - Przekierowanie drukarek z sesji zdalnej jest tu potrzebne, a zestaw sterowników na serwerze nie został przygotowany
    en:
      - The machine is a terminal server where users add printers themselves and no drivers have been loaded beforehand
      - The redirecting of printers from remote sessions is needed here and no set of drivers has been prepared on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers'
      $name = 'AddPrinterDrivers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers'
    $name = 'AddPrinterDrivers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AddPrinterDrivers' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/devices-prevent-users-from-installing-printer-drivers

notes:
  pl: |
    Punkt jest pierwszym z pięciu, które ograniczają usługę wydruku
    zamiast ją usuwać. Warto zaznaczyć, że dotyczy instalacji lokalnej —
    tego, co użytkownik zalogowany na tej maszynie może zrobić. Trzy
    następne reguły dotyczą instalacji przez sieć i są to różne drogi do
    tego samego skutku.

    Rozróżnienie to bywa mylone, bo obie reguły mają w tytule te same
    słowa. Ta pilnuje, kto może dodać sterownik tutaj. Tamta pilnuje, co
    maszyna przyjmie od serwera wydruku. Wdrożenie jednej bez drugiej
    zostawia drogę otwartą.

    Kategoria krytyczna bierze się z miejsca, w którym sterownik pracuje.
    Nie ma tu stopniowania: kod w przestrzeni jądra jest końcem drogi
    i niczego powyżej już nie trzeba.
  en: |
    The item is the first of five limiting the print service instead of removing it.
    Worth marking that it concerns local installing - what a user signed in on this
    machine may do. The next three rules concern installing over the network, and
    those are different roads to the same end.

    That distinction is at times confused, both rules bearing the same words in
    their titles. This one sees to who may add a driver here. That one sees to what
    the machine will accept from a print server. Rolling out one without the other
    leaves a road open.

    The critical category comes from the place where a driver works. There is no
    gradation here: code in the kernel's space is the road's end and nothing above
    it is needed any more.
