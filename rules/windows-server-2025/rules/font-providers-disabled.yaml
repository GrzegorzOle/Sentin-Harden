id: win2025-font-providers-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Fonts
  title:
    pl: Pobieranie czcionek z sieci wyłączone
    en: Fetching fonts from the network switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania systemowi pobierania brakujących czcionek z zasobu
    zewnętrznego, gdy dokument albo program żąda kroju, którego na maszynie
    nie ma.

    Kategoria średnia i powód jest ten sam, co przy sterownikach, choć
    nazwa brzmi znacznie niewinniej. Czcionka nie jest obrazkiem. To plik
    o złożonej budowie, zawierający instrukcje wykonywane przy składaniu
    tekstu, a przetwarza go składnik systemu pracujący blisko jądra.
    Historia błędów w przetwarzaniu czcionek jest długa i konsekwentnie
    prowadzi do wykonania kodu z wysokimi uprawnieniami.

    To jest właściwa treść tego punktu. Mechanizm sprawia, że plik o takiej
    budowie trafia na serwer i zostaje przetworzony na skutek otwarcia
    dokumentu — czyli czynności, której nikt nie uzna za instalowanie
    czegokolwiek. Nie potrzeba do tego ani zgody, ani kliknięcia, ani
    świadomości, że coś zostało pobrane.

    Na serwerze waży to o tyle, że brakujących krojów żąda się tam rzadko,
    a więc mechanizm, który w zamian utrzymuje otwartą drogę, płaci za
    siebie wyjątkowo słabo.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    podania serwerowi pliku przetwarzanego uprzywilejowanym składnikiem
    systemu, uruchamiany samym otwarciem dokumentu.
  en: |
    The item forbids the system to fetch missing fonts from an outside
    resource when a document or a program asks for a typeface the machine
    does not have.

    The category is medium, and the reason is the same as with drivers, even
    though the name sounds far more innocent. A font is not a picture. It is
    a file of intricate construction, holding instructions carried out while
    text is being laid out, and it is processed by a system component working
    close to the kernel. The history of faults in font processing is long and
    leads consistently to code running with high privileges.

    That is the real substance of the item. The mechanism means a file of
    that construction reaches the server and is processed as a result of
    opening a document - an action nobody would count as installing
    anything. It needs no consent, no click, and no awareness that anything
    was fetched.

    On a server this weighs because missing typefaces are rarely asked for
    there, so a mechanism that keeps a road open in exchange pays for itself
    exceptionally poorly.

    What an attacker gains while the item goes unmet: a way of handing the
    server a file processed by a privileged system component, set off by the
    mere opening of a document.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze bez ról stanowiskowych
    ta zmiana nie zrobi nic i po prostu odbierze drogę, którą nikt nie
    chodził.

    Sprawdzenia wymaga to, co na tej maszynie składa tekst. Dokument
    żądający kroju, którego na serwerze nie ma, zostanie złożony krojem
    zastępczym. Tekst będzie czytelny, ale układ może się rozjechać:
    inne szerokości znaków oznaczają inne łamanie wierszy, przesunięte
    tabele i zmienioną liczbę stron. Przy generowaniu dokumentów do druku
    albo sprawozdań o ustalonym układzie to jest różnica widoczna
    i niepożądana. Dotyczy to również wydruków, dlatego wymieniam drukowanie
    wśród obszarów wpływu.

    Nie dotyczy natomiast czcionek już zainstalowanych ani wgranych do
    systemu ręcznie — te działają bez zmian i to jest właściwe rozwiązanie
    dla maszyny, na której układ dokumentu ma znaczenie. Krój instaluje się
    raz, świadomie, i przestaje być zależnością zewnętrzną.

    Rzecz do zapamiętania: wpis leży w tej samej gałęzi rejestru co
    wyłączenie przenoszenia pracy między urządzeniami, pod inną nazwą
    wartości. Znajoma ścieżka nie znaczy, że drugi punkt jest zrobiony.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server without workstation
    roles this change will do nothing and will simply take away a road nobody
    walked.

    What needs the review is whatever lays out text on this machine. A
    document asking for a typeface the server does not have will be set in a
    substitute. The text will be legible, but the layout may shift: different
    character widths mean different line breaks, displaced tables and a
    changed number of pages. Where documents are generated for print, or
    reports with a fixed layout, that is a visible and unwanted difference.
    It concerns printouts too, which is why I list printing among the impact
    areas.

    It does not concern fonts already installed or loaded into the system by
    hand - those work unchanged, and that is the right answer for a machine
    where a document's layout matters. A typeface is installed once,
    deliberately, and stops being an outside dependency.

    Something to remember: the entry lies in the same registry branch as
    turning off continuing work across devices, under a different value name.
    A familiar path does not mean the other item is done.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - user-interface
    - printing
  what_breaks:
    pl:
      - Dokument żądający kroju, którego na serwerze nie ma, zostanie złożony krojem zastępczym
      - Tekst będzie czytelny, ale układ może się rozjechać — inne łamanie wierszy, przesunięte tabele, zmieniona liczba stron
      - Przy generowaniu dokumentów do druku i sprawozdań o ustalonym układzie ta różnica jest widoczna, także na wydruku
      - Czcionki zainstalowane albo wgrane ręcznie działają bez zmian i to jest właściwe rozwiązanie dla takiej maszyny
    en:
      - A document asking for a typeface the server does not have will be set in a substitute
      - The text stays legible, but the layout may shift - different line breaks, displaced tables, a changed number of pages
      - Where documents are generated for print, or reports with a fixed layout, the difference is visible, on paper too
      - Fonts installed or loaded by hand work unchanged, and that is the right answer for such a machine
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna składa dokumenty albo sprawozdania o ustalonym układzie i korzysta z krojów, których nie ma zainstalowanych lokalnie
    en:
      - The machine lays out documents or reports with a fixed layout and uses typefaces not installed locally
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The same registry branch as turning off continuing work across devices,
      # under a different value name.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnableFontProviders'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnableFontProviders'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A font is not a picture: it holds instructions carried out while text is
    # laid out, processed by a component working close to the kernel. Without
    # this, such a file reaches the server through the mere opening of a
    # document. Fonts installed by hand are untouched.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFontProviders' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-grouppolicy

notes:
  pl: |
    Nazwa brzmi niewinnie, a czcionka nie jest obrazkiem: to plik o złożonej
    budowie, zawierający instrukcje wykonywane przy składaniu tekstu,
    przetwarzany przez składnik pracujący blisko jądra. Historia błędów
    w przetwarzaniu czcionek konsekwentnie prowadzi do wykonania kodu
    z wysokimi uprawnieniami.

    Mechanizm sprawia, że taki plik trafia na serwer i zostaje przetworzony
    na skutek otwarcia dokumentu — bez zgody, bez kliknięcia i bez
    świadomości, że cokolwiek pobrano.

    Właściwe rozwiązanie dla maszyny, na której układ dokumentu ma
    znaczenie: zainstalować krój raz, świadomie, żeby przestał być
    zależnością zewnętrzną.
  en: |
    The name sounds innocent, yet a font is not a picture: it is a file of
    intricate construction holding instructions carried out while text is
    laid out, processed by a component working close to the kernel. The
    history of faults in font processing leads consistently to code running
    with high privileges.

    The mechanism means such a file reaches the server and is processed as a
    result of opening a document - with no consent, no click and no awareness
    that anything was fetched.

    The right answer for a machine where a document's layout matters: install
    the typeface once, deliberately, so it stops being an outside dependency.
