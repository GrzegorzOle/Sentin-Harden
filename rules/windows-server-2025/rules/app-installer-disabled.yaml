    Wyłączenie bez wskazania innej drogi nie usuwa problemu, tylko
    przenosi go w gorsze miejsce.
  en: |
    The one tool in the system that at a bidding reaches into the net for software and lays it upon a
    machine of production - not for the mending of something that stands already but for a program
    that was not there before.

    The planning means here another thing than it mostly does - no window of service but the naming
    of a road in its stead. An administrator in the midst of a fault will come by the tool one way or
    another - and if the ordered road be taken from them, they will fetch a file off a browser upon
    an account with full rights.

    The switching off without the naming of another road does not do away with the trouble but bears
