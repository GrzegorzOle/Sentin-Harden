id: win2025-quality-updates-not-deferred

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Poprawki jakości instalowane bez opóźnienia
    en: Quality updates installed without delay
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt wymaga, żeby poprawki jakości — czyli te, w których przychodzą
    poprawki bezpieczeństwa — szły bez opóźnienia. Dwie wartości: sam
    przełącznik i liczba dni. Punkt jest spełniony tylko wtedy, gdy
    przełącznik jest ustawiony, a liczba wynosi zero.

    Kategoria wysoka i chcę zwrócić uwagę na ten warunek, bo wygląda na
    formalność, a nie jest nią. Wymagane jest zapisane wprost zero, a nie
    brak wpisu. Różnica polega na tym, że zero jest decyzją, którą ktoś
    podjął i którą widać, a brak wpisu jest miejscem, w które da się
    wstawić opóźnienie bez niczyjej wiedzy. Zasada wpisana w to miejsce
    zamyka je: żeby wprowadzić zwłokę, trzeba tę wartość nadpisać, czyli
    zrobić coś, co zostawia ślad.

    Na serwerze punkt ten jest jednym z nielicznych miejsc, w których
    odpowiedź serwerowa i stacyjna są identyczne. Poprawka bezpieczeństwa
    nie staje się mniej pilna dlatego, że maszyna udostępnia usługę. Staje
    się pilniejsza, bo usługa jest osiągalna, gdy nikt nie pracuje.

    Chcę też nazwać różnicę wobec bliźniaczego punktu o aktualizacjach
    funkcji, bo razem tworzą one całą myśl tej grupy: poprawka ma iść
    natychmiast, a zmiana wersji systemu ma poczekać pół roku. Chcę
    naprawy, nie chcę innego systemu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno równe
    wpisanej zwłoce, w którym luka jest już opisana publicznie, a maszyna
    czeka z jej zamknięciem.
  en: |
    The item requires quality updates - the ones security fixes arrive in -
    to go without delay. Two values: the switch itself and a number of
    days. The item is met only when the switch is set and the number is
    zero.

    The category is high, and I want to draw attention to that condition,
    because it looks like a formality and is not one. An explicitly written
    zero is required, not the absence of an entry. The difference is that a
    zero is a decision somebody took and which can be seen, while a missing
    entry is a place into which a delay can be slipped with nobody knowing.
    A policy written into that place closes it: introducing a delay means
    overwriting this value, that is, doing something that leaves a trace.

    On a server this item is one of the few places where the server answer
    and the workstation answer are identical. A security fix does not
    become less urgent because the machine serves something. It becomes
    more urgent, because the service is reachable when nobody is working.

    I also want to name the difference from the twin item on feature
    updates, because together they form the whole thought of this group: a
    fix is to go at once, and a change of system version is to wait half a
    year. I want the repair, I do not want a different system.

    What an attacker gains while the item goes unmet: a window equal to the
    delay written here, in which the flaw is already publicly described and
    the machine is waiting before closing it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i chcę uzasadnić ją precyzyjnie, bo przy
    słowie „aktualizacja" odruch podpowiada ostrożność.

    Ta reguła niczego nie instaluje i nie powoduje restartu. Ona zapisuje
    zwłokę równą zeru, czyli stan, w którym maszyna i tak jest, dopóki
    ktoś nie wpisał liczby większej. Na maszynie bez zwłoki nic się nie
    zmienia — zmienia się tylko to, że zwłoka jest teraz zapisana wprost.

    Jedyna maszyna, na której zmiana będzie odczuwalna, to taka, na której
    zwłoka faktycznie obowiązywała. Tam poprawki, które dotąd czekały,
    zaczną się instalować, a to już jest zdarzenie zauważalne — z tym że
    powodem jest nadrobienie zaległości, nie sama reguła. Warto o tym
    wiedzieć i zrobić to wtedy, gdy ktoś patrzy, zamiast dowiedzieć się
    z dziennika następnego dnia.

    Kiedy ta reguła nie jest właściwa: gdy zwłoka została wprowadzona
    świadomie, po incydencie z wadliwą poprawką, i obowiązuje jako
    tymczasowa zasada z terminem. To jest prawidłowe użycie tego
    mechanizmu, a nie zaniedbanie — ale jako stan tymczasowy, z datą,
    a nie jako ustawienie, o którym się zapomniało.

    Bez restartu w chwili wykonania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption", and I want to justify it precisely,
    because the word "update" prompts an instinct for caution.

    This rule installs nothing and causes no restart. It writes down a
    delay equal to zero, that is, the state the machine is in anyway until
    somebody enters a larger number. On a machine with no delay nothing
    changes - all that changes is that the delay is now written down
    explicitly.

    The only machine where the change will be felt is one where a delay was
    actually in force. There the fixes that have been waiting will start
    installing, and that is a noticeable event - except that the cause is
    catching up on arrears rather than the rule itself. It is worth knowing
    this and doing it while somebody is watching, rather than learning
    about it from a log the next day.

    When this rule is not the right one: where the delay was introduced
    deliberately after an incident with a faulty fix and holds as a
    temporary policy with an end date. That is a correct use of this
    mechanism rather than neglect - but as a temporary state, with a date,
    not as a setting somebody has forgotten about.

    No restart at the moment of execution, undone immediately, and it may
    be applied in bulk.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Na maszynie bez zwłoki nic się nie zmienia — zwłoka jest jedynie zapisana wprost zamiast wynikać z braku wpisu
      - Na maszynie ze zwłoką poprawki, które dotąd czekały, zaczną się instalować, czyli nadrobią zaległość
      - Powodem tego zdarzenia jest nadrobienie zaległości, nie sama reguła, ale warto zrobić to wtedy, gdy ktoś patrzy
      - Reguła niczego nie instaluje w chwili wykonania i sama z siebie nie powoduje restartu
    en:
      - On a machine with no delay nothing changes - the delay is merely written down instead of following from a missing entry
      - On a machine with a delay the fixes that were waiting will start installing, catching up on arrears
      - The cause of that event is the catching up rather than the rule, but it is worth doing while somebody is watching
      - The rule installs nothing at the moment of execution and by itself causes no restart
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zwłoka została wprowadzona świadomie po incydencie z wadliwą poprawką i obowiązuje jako zasada tymczasowa z terminem
    en:
      - The delay was introduced deliberately after an incident with a faulty fix and holds as a temporary policy with an end date
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch and the number of days. The item
      # is met only when the switch is set and the number is zero - the setting
      # written down and the delay none.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DeferQualityUpdates'
        $days = $item.'DeferQualityUpdatesPeriodInDays'
        if ($null -eq $switch -or $null -eq $days) { 'MISSING' }
        elseif ([int]$switch -ne 1) { 'NOT_SET' }
        elseif ([int]$days -ne 0) { 'OTHER ' + [int]$days }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path           = $path
      switch         = $item.'DeferQualityUpdates'
      switch_existed = ($null -ne $item.'DeferQualityUpdates')
      days           = $item.'DeferQualityUpdatesPeriodInDays'
      days_existed   = ($null -ne $item.'DeferQualityUpdatesPeriodInDays')
      key_existed    = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An explicit zero, not a missing entry: a zero is a decision that can be
    # seen, a missing entry is a place a delay can be slipped into. On a machine
    # that did have a delay, the waiting fixes will now install.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeferQualityUpdates' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DeferQualityUpdatesPeriodInDays' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferQualityUpdates' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferQualityUpdates' -ErrorAction SilentlyContinue
    }
    if ($b.days_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferQualityUpdatesPeriodInDays' -Value $b.days -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferQualityUpdatesPeriodInDays' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

