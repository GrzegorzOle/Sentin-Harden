id: win2025-password-max-age

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Okres ważności hasła ograniczony i różny od nieskończoności
    en: Term of a password's validity limited and other than endless
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, po ilu dniach hasło traci ważność, i wymaga okresu
    skończonego, nie dłuższego niż rok.

    Sens punktu na serwerze jest inny niż na stanowisku roboczym i warto to
    rozdzielić. Na stanowisku wygasanie haseł bywa dziś uznawane za środek
    o wątpliwej wartości, bo człowiek zmuszony do częstej zmiany tworzy
    hasła coraz słabsze. Na serwerze hasła należą w większości do kont,
    przy których nikt niczego nie wymyśla: kont usługowych, kont narzędzi
    i kont zapasowych założonych kiedyś „na wszelki wypadek".

    Te konta nie mają właściciela, który zauważyłby, że ich hasło wyciekło.
    Jedynym mechanizmem, który kiedykolwiek to hasło unieważni, jest termin
    ważności. Ustawiony na nieskończoność — a taki jest tu przypadek
    najczęstszy — nie unieważni go nigdy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    bezterminowy. Hasło konta usługowego zdobyte dziś działa za trzy lata,
    a przez ten czas nic w systemie nie wskaże, że powinno przestać.

    Rok jest progiem górnym, nie zaleceniem. Jego rolą jest odciąć wariant
    „nigdy", a nie ustalić rytm zmian.
  en: |
    The setting settles after how many days a password loses its validity, and takes a
    finite term no longer than a year.

    The item's sense on a server differs from that at a working station and is worth
    telling apart. At a station password expiry is nowadays sometimes held a measure of
    doubtful value, since a person forced to change often makes ever weaker passwords. On a
    server the passwords belong for the most part to accounts at which nobody thinks
    anything up: service accounts, tools' accounts and spare accounts set up once "just in
    case".

    Those accounts have no owner who would notice that their password had leaked. The one
    mechanism that will ever void that password is the term of validity. Set to endless -
    and that is the commonest case here - it will never void it.

    What an attacker gains while the item goes unmet: access without term. A service
    account's password taken today works in three years, and in that time nothing in the
    system will show that it ought to stop.

    A year is an upper bound rather than a recommendation. Its part is to cut off the
    "never" variant rather than to fix a rhythm of changes.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to dlatego, że na serwerze wygasające hasło
    zatrzymuje usługę, a nie prosi o zmianę.

    Rzecz jest w tym, że konto usługowe nie zobaczy monitu. Hasło wygasa,
    usługa przy następnym uruchomieniu nie zaloguje się i zatrzyma się bez
    wyjaśnienia widocznego z zewnątrz. Objaw pojawia się przy restarcie
    maszyny albo usługi, a więc często wiele dni po samym wygaśnięciu — i to
    jest najtrudniejsza część tej zmiany.

    Przed wdrożeniem trzeba wiedzieć, które konta są kontami usługowymi
    i gdzie ich hasła są zapisane. Hasło konta usługowego zwykle żyje
    w kilku miejscach naraz: w definicji usługi, w zadaniu harmonogramu,
    w pliku konfiguracyjnym aplikacji. Zmiana w jednym miejscu, a pominięcie
    pozostałych, kończy się blokadą konta.

    Właściwą drogą dla kont usługowych jest przejście na konta zarządzane,
    w których hasło zmienia system. Tam, gdzie to niemożliwe, potrzebna jest
    procedura zmiany hasła wraz ze spisem miejsc do zaktualizowania.

    Zmiana nie wymaga restartu, ale skutek ujawnia się przy restarcie usług.
  en: |
    A knowing rollout is needed because on a server an expiring password stops a service
    rather than asking for a change.

    The thing is that a service account will see no prompt. The password expires, the
    service fails to sign in at its next start and stops with no explanation visible from
    outside. The symptom appears at a restart of the machine or the service, and so often
    many days after the expiry itself - and that is the hardest part of this change.

    Before the rollout one has to know which accounts are service accounts and where their
    passwords are recorded. A service account's password usually lives in several places at
    once: in the service's definition, in a scheduler task, in an application's
    configuration file. A change in one place with the rest passed over ends in the account
    being locked.

    The right road for service accounts is a move to managed accounts, in which the system
    changes the password. Where that is impossible, a procedure for changing the password
    is needed, along with a list of the places to update.

    The change takes no restart, but the effect shows itself at a restart of services.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
  what_breaks:
    pl:
      - Usługa pracująca na koncie z wygasłym hasłem nie uruchomi się po restarcie
      - Zadania harmonogramu na takim koncie przestają się wykonywać
      - Objaw pojawia się przy restarcie, a więc długo po samym wygaśnięciu
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
    en:
      - A service working on an account with an expired password will not start after a restart
      - Scheduler tasks on such an account stop running
      - The symptom appears at a restart, and so long after the expiry itself
      - On a domain controller the change takes in every account in the domain at once
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracują konta usługowe bez spisanych miejsc, w których żyją ich hasła
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - Service accounts work on the server with no list of the places their passwords live in
      - The server is a domain controller and a change of the domain's policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') {
          # -1 means "never expires". It must not pass an upper-bound comparison
          # as if it were the smallest possible number of days.
          if ([int]$Matches[1] -lt 1) { 'NEVER' } else { $Matches[1] }
        } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '365'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MaximumPasswordAge'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    # The upper bound the item takes. A shorter term meets it as well and is
    # the right value wherever the service accounts are ready for it.
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MaximumPasswordAge = 365',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MaximumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/maximum-password-age

notes:
  pl: |
    Wynik „NEVER" oznacza hasło bez terminu ważności i celowo nie jest
    liczbą. Gdyby audyt zwracał tu minus jeden, porównanie „nie więcej niż"
    uznałoby najgorszy możliwy stan za spełniony.

    Punkt tworzy trójkę z minimalnym okresem ważności i historią haseł.
    Sam ustala, kiedy hasło traci ważność; historia pilnuje, żeby nowe nie
    było starym; minimalny okres nie pozwala przejść przez całą historię
    w jedno popołudnie. Każdy z nich osobno daje się obejść.

    Na serwerze najwięcej uwagi wymaga nie sama wartość, tylko spis kont
    usługowych. Reguła jest tania do zapisania i droga do wdrożenia, i to
    jest właśnie powód, dla którego należy do klasy wymagającej świadomego
    wdrożenia.
  en: |
    The result "NEVER" means a password with no term of validity and is deliberately not a
    number. Were the audit to return minus one here, a "not greater than" comparison would
    hold the worst possible state met.

    The item forms a trio with the minimum term of validity and the password history. It
    fixes when a password loses validity; the history sees that the new one is not the old;
    the minimum term does not let the whole history be walked through in one afternoon.
    Each of them apart can be got round.

    On a server it is not the value itself that takes the most attention but the list of
    service accounts. The rule is cheap to record and dear to roll out, and that is exactly
    why it belongs to the class taking a knowing rollout.
