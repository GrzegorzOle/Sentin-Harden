id: win11-sandbox-audio-input-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Dostęp do mikrofonu z piaskownicy wyłączony
    en: Access to the microphone from the sandbox disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy program uruchomiony w piaskownicy ma dostęp do
    mikrofonu maszyny.

    Sens punktu bierze się z tego, po co piaskownica istnieje. Uruchamia się
    w niej to, czemu się nie ufa: plik z nieznanego źródła, instalator
    pobrany z sieci, dokument z załącznika. Całe założenie polega na tym, że
    cokolwiek się tam zdarzy, zostanie tam. Każde przejście między
    piaskownicą a maszyną jest wyłomem w tym założeniu — i dlatego każde
    trzeba rozważyć z osobna.

    Mikrofon jest przejściem szczególnym, bo prowadzi nie do maszyny, tylko
    do pomieszczenia, w którym ona stoi. Program nie musi niczego z maszyny
    odczytać ani niczego na niej zmienić, żeby usłyszeć rozmowę prowadzoną
    obok.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podsłuch
    uruchomiony w środowisku, które z definicji ma prawo zachowywać się
    podejrzanie. Działanie podejrzane w piaskownicy nie budzi niczyjej uwagi,
    bo po to ją uruchomiono.

    Dochodzi do tego, że dostęp do mikrofonu nie zostawia w piaskownicy śladu,
    który przetrwa jej zamknięcie. Po zakończeniu sesji nie ma czego badać.
  en: |
    The setting settles whether a program started in the sandbox has access to the
    machine's microphone.

    The item's sense comes from what the sandbox is for. In it is run what is not trusted:
    a file from an unknown source, an installer fetched from the network, a document from
    an attachment. The whole premise is that whatever happens there stays there. Every
    passage between the sandbox and the machine is a breach in that premise - and so every
    one has to be weighed apart.

    The microphone is a particular passage, because it leads not to the machine but to the
    room the machine stands in. A program need read nothing from the machine and change
    nothing on it to hear a conversation held alongside.

    What an attacker gains while the item goes unmet: eavesdropping started in an
    environment that by definition has leave to behave suspiciously. Suspicious behaviour
    in a sandbox draws nobody's attention, since that is what it was started for.

    To this is added that access to the microphone leaves in the sandbox no trace that
    outlives its closing. Once the session has ended there is nothing to examine.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek uruchamia w piaskownicy programy
    korzystające z dźwięku — a jest to zastosowanie rzadkie.

    Piaskownica służy przede wszystkim do sprawdzenia, co robi nieznany plik,
    i do tego mikrofon nie jest potrzebny. Zastosowania, w których bywa:
    testowanie komunikatora albo programu do spotkań przed wdrożeniem,
    sprawdzenie sterownika urządzenia dźwiękowego.

    Po zmianie program w piaskownicy zobaczy system bez urządzenia
    nagrywającego. Nie zgłosi braku uprawnień, tylko brak sprzętu — i to bywa
    mylące przy testowaniu, bo wygląda jak wada programu.

    Odtwarzanie dźwięku w piaskownicy jest osobną rzeczą i ta reguła go nie
    dotyczy.

    Poza piaskownicą nic się nie zmienia. Mikrofon na samej maszynie działa
    tak jak wcześniej i reguła nie dotyczy dostępu do niego dla zwykłych
    aplikacji.
  en: |
    What needs checking is whether anybody runs programs in the sandbox that use sound -
    and it is a rare use.

    The sandbox serves above all to see what an unknown file does, and a microphone is not
    needed for that. Uses in which it does figure: testing a messenger or a meetings
    program before a rollout, checking a sound device's driver.

    After the change a program in the sandbox will see a system with no recording device.
    It will report not a want of rights but a want of hardware - and that sometimes
    misleads in testing, since it looks like a fault in the program.

    Playing sound in the sandbox is a separate matter and this rule does not concern it.

    Outside the sandbox nothing changes. The microphone on the machine itself works as
    before and the rule does not concern access to it for ordinary applications.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Program w piaskownicy nie widzi urządzenia nagrywającego i zgłasza brak sprzętu
      - Testowanie komunikatora albo programu do spotkań w piaskownicy przestaje być pełne
      - Mikrofon na samej maszynie działa tak jak wcześniej
    en:
      - A program in the sandbox does not see a recording device and reports a want of hardware
      - Testing a messenger or a meetings program in the sandbox stops being complete
      - The microphone on the machine itself works as before
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica służy do testowania programów korzystających z dźwięku przed wdrożeniem
    en:
      - The sandbox serves to test programs using sound before a rollout
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowAudioInput'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $current = (Get-ItemProperty -Path $path -Name 'AllowAudioInput' -ErrorAction SilentlyContinue).'AllowAudioInput'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowAudioInput'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAudioInput' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Reguła należy do zestawu opisującego przejścia między piaskownicą
    a maszyną. Warto czytać je razem, bo każde z osobna wygląda na drobiazg,
    a razem rozstrzygają, czy piaskownica jest odgrodzona, czy tylko wygląda
    na odgrodzoną.

    Ustawienie działa wyłącznie na piaskownicę. Na maszynie, na której
    piaskownica nie jest włączona jako składnik, reguła nie ma czego dotyczyć,
    ale warto ją i tak wdrożyć — jeżeli składnik zostanie kiedyś włączony,
    zasada obejmie go od razu.

    Brak wartości nie jest stanem zgodnym, bo domyślnie dostęp bywa dozwolony.
  en: |
    The rule belongs to the set describing the passages between the sandbox and the
    machine. They are worth reading together, since each apart looks like a trifle, while
    together they settle whether the sandbox is fenced off or only looks fenced off.

    The setting works on the sandbox alone. On a machine where the sandbox is not switched
    on as a component the rule has nothing to concern, but it is worth applying all the
    same - if the component is ever switched on, the policy will cover it at once.

    A missing value is not a compliant state, since by default access is sometimes
    allowed.
