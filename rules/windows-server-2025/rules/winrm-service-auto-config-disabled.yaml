id: win2025-winrm-service-auto-config-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service
  title:
    pl: Automatyczne wystawienie usługi zdalnego zarządzania wyłączone
    en: Automatic exposure of the remote management service turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zasadzie grupy samoczynnego tworzenia
    nasłuchiwania usługi zarządzania zdalnego i otwierania dla niego
    przejścia w zaporze.

    Obniżam tu kategorię względem paczki stanowiska roboczego i uważam,
    że uczciwiej jest to zrobić niż przenieść ocenę bez zmiany. Powód
    leży w tym, co ten punkt naprawdę wyłącza.

    Nie wyłącza on zarządzania zdalnego. Nasłuchiwanie utworzone ręcznie
    — poleceniem konfigurującym usługę albo przez konsolę zarządzania
    serwerem — działa dalej, bo powstało poza tym mechanizmem.
    Ustawienie zamyka wyłącznie drogę, w której maszyna wystawia się
    sama, bo tak wynikło z zasady rozdanej na całą domenę.

    Na stanowisku roboczym jest to różnica ogromna: tam wystawienie
    usługi zarządzania to zwykle rzecz, której nikt świadomie nie
    chciał. Na serwerze zarządzanie zdalne jest czymś, o czym ktoś
    zdecydował, a nasłuchiwanie stoi tam celowo. Wartość punktu
    zmniejsza się dokładnie o tę różnicę.

    Co natomiast zostaje i dlaczego punkt ma sens także na serwerze:
    mechanizm samoczynny tworzy nasłuchiwanie według wzorca adresów
    zapisanego w zasadzie, a wzorzec ten bywa szeroki — bo tak jest
    najprościej. Serwer z kilkoma kartami sieciowymi, z których jedna
    patrzy na sieć mniej zaufaną, wystawia wtedy zarządzanie także tam,
    i nikt tej decyzji nie podejmował świadomie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość sięgnięcia do zarządzania serwerem z sieci, w której
    nikt tego nasłuchiwania nie planował.
  en: |
    The setting forbids a rule of the group to make of itself a listening of the remote management
    service and to open a way for it through the firewall.

    I lower the category here against the working station's pack and hold it honester to do so
    than to carry the reckoning over unchanged. The reason lies in what this item truly switches
    off.

    It does not switch off remote management. A listening made by hand - by the order that sets the
    service up, or through the console for the managing of a server - works on, having arisen
    outside this mechanism. The setting shuts the road alone wherein the machine puts itself out
    because a rule dealt to the whole domain so worked out.

    At a working station that is a vast difference: there the putting out of the management service
    is usually a thing nobody knowingly wanted. On a server remote management is something somebody
    decided upon, and the listening stands there on purpose. The item's worth lessens by exactly
    that difference.

    What is left, though, and why the item has sense on a server too: the mechanism working of
    itself makes a listening after a pattern of addresses written in the rule, and that pattern is
    at times wide - it being the simplest so. A server with several cards of the network, one of
    which looks upon a less trusted net, puts management out there as well, and nobody made that
    decision knowingly.

    What an attacker gains while the item goes unmet: the means of reaching for the managing of the
    server out of a net wherein nobody planned that listening.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno i odpowiedź rozstrzyga o wszystkim: czy
    nasłuchiwanie na tym serwerze powstało ręcznie, czy z zasady.

    Jeżeli ręcznie — a tak jest na serwerze konfigurowanym pojedynczo —
    zmiana nie robi nic. Nasłuchiwanie zostaje, zarządzanie działa
    dalej, w raporcie przybywa punkt spełniony.

    Jeżeli z zasady — a tak bywa w dużych środowiskach, gdzie
    zarządzanie zdalne rozdaje się na całą domenę jednym ustawieniem —
    zmiana odbiera zarządzanie nad maszyną. Nie natychmiast i nie
    widocznie: nasłuchiwanie już istniejące pracuje do restartu usługi
    albo maszyny, a znika przy następnym zastosowaniu zasady. Objaw
    pojawia się więc godziny albo dni po zmianie, co czyni go trudnym
    do powiązania z przyczyną.

    Jest to jedyna reguła w tej grupie, której skutek bywa opóźniony,
    i dlatego zapisuję to osobno.

    Rzecz do zrobienia przed zmianą jest prosta: sprawdzić, czy
    nasłuchiwanie na tej maszynie istnieje i skąd się wzięło, a jeżeli
    z zasady — utworzyć je ręcznie, z wzorcem adresów zawężonym do
    sieci zarządzania, zanim mechanizm samoczynny zostanie zamknięty.
    Wtedy punkt daje się wdrożyć bez straty i przy okazji zawęża
    wystawienie, czyli robi dokładnie to, o co w nim chodzi.

    Droga zapasowa do maszyny ma być znana przed zmianą, tak jak przy
    każdym ustawieniu dotyczącym zdalnego dostępu do serwera.

    Zmiana cofa się natychmiast, ale nasłuchiwanie usunięte przez
    zasadę wraca dopiero przy jej następnym zastosowaniu.
  en: |
    One thing needs checking and the answer settles everything: whether the listening on this
    server arose by hand or out of a rule.

    If by hand - and so it is on a server set up singly - the change does nothing. The listening
    stays, management works on, the report gains an item met.

    If out of a rule - and so it is at times in large settings, where remote management is dealt to
    the whole domain by one setting - the change takes away the managing of the machine. Not at
    once and not plainly: the listening already there works until a restart of the service or of
    the machine, and vanishes at the rule's next applying. The symptom shows therefore hours or
    days after the change, which makes it hard to tie to its cause.

    It is the one rule in this group whose effect is at times delayed, and so I write it down
    apart.

    The thing to do before the change is simple: check whether a listening on this machine is there
    and whence it came, and if out of a rule - make it by hand, with the pattern of addresses
    narrowed to the net of management, before the mechanism working of itself is shut. Then the
    item can be rolled out at no loss and narrows the exposure besides, which is exactly what it is
    about.

    The spare road to the machine is to be known before the change, as with every setting bearing
    on remote access to a server.

    The change is undone at once, but a listening removed by a rule comes back only at that rule's
    next applying.

implementation_consequences:
  impact_areas:
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Nasłuchiwanie utworzone przez zasadę zniknie przy jej następnym zastosowaniu, a nie od razu
      - Objaw pojawia się godziny albo dni po zmianie, co utrudnia powiązanie go z przyczyną
      - Nasłuchiwanie utworzone ręcznie działa dalej i ta zmiana go nie dotyczy
      - Przejście w zaporze otwarte przez ten mechanizm zostanie zamknięte razem z nasłuchiwaniem
      - Zarządzanie zdalne na maszynie konfigurowanej pojedynczo pozostaje bez zmian
    en:
      - A listening made by a rule will vanish at that rule's next applying and not at once
      - The symptom shows hours or days after the change, which makes it hard to tie to its cause
      - A listening made by hand works on and this change does not bear upon it
      - The way through the firewall opened by this mechanism will be shut along with the listening
      - Remote management on a machine set up singly stays unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nasłuchiwanie zarządzania na tym serwerze pochodzi z zasady rozdanej na całą domenę
      - Nie utworzono wcześniej nasłuchiwania ręcznie i nie ma drogi zapasowej do maszyny
    en:
      - The listening of management on this server comes out of a rule dealt to the whole domain
      - No listening was made by hand beforehand and there is no spare road to the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'AllowAutoConfig'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowAutoConfig'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A listening made by hand is untouched. One made by a rule vanishes at that
    # rule's next applying, so the effect of this change may be delayed.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAutoConfig' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

notes:
  pl: |
    Kategorię obniżyłem względem paczki stanowiska roboczego i uważam,
    że tak jest uczciwiej. Punkt nie wyłącza zarządzania zdalnego —
    nasłuchiwanie utworzone ręcznie działa dalej. Zamyka wyłącznie drogę,
    w której maszyna wystawia się sama, bo tak wynikło z zasady.

    Na serwerze zarządzanie zdalne jest czymś, o czym ktoś zdecydował,
    więc wartość punktu jest mniejsza niż na stanowisku. To, co zostaje,
    to szeroki wzorzec adresów: serwer z kilkoma kartami wystawia
    zarządzanie także na tej, która patrzy na sieć mniej zaufaną.

    Jedyna reguła w tej grupie o skutku opóźnionym: nasłuchiwanie
    z zasady znika dopiero przy jej następnym zastosowaniu, więc objaw
    pojawia się godziny albo dni po zmianie.
  en: |
    I lowered the category against the working station's pack and hold it honester so. The item
    does not switch off remote management - a listening made by hand works on. It shuts the road
    alone wherein the machine puts itself out because a rule so worked out.

    On a server remote management is something somebody decided upon, so the item's worth is less
    than at a station. What is left is the wide pattern of addresses: a server with several cards
    puts management out on the one looking upon a less trusted net as well.

    The one rule in this group with a delayed effect: a listening out of a rule vanishes only at
    that rule's next applying, so the symptom shows hours or days after the change.
