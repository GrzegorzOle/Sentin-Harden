id: win10-bitlocker-removable-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do nośników wymiennych ustalony
    en: The way of recovering access to removable media settled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, w jaki sposób odzyskuje się dostęp do
    zaszyfrowanego nośnika wymiennego i gdzie trafia klucz.

    Przy nośnikach wymiennych ma to wymiar, którego nie ma przy dyskach
    stałych. Pamięć przenośna jest szyfrowana przez użytkownika, doraźnie,
    zwykle w pośpiechu — a klucz powstaje wtedy w tym samym pośpiechu.
    Zostawiony samemu sobie, użytkownik zapisze go tam, gdzie akurat
    wygodnie: w pliku na pulpicie, w notatniku telefonu albo nigdzie.

    Wymuszenie zapisu do katalogu domenowego odbiera tę decyzję właśnie
    w chwili, w której nikt nie ma czasu jej podjąć dobrze. Klucz trafia
    tam, gdzie obsługa go znajdzie, niezależnie od tego, kto i po co
    szyfrował nośnik.

    Odnotowuję, że punkt jest jedną decyzją zapisaną w ośmiu wartościach,
    a sprawdzenie czyta je razem i wymienia te, które odstają. Nośnik
    ustawiony w połowie wygląda z zewnątrz tak samo jak ustawiony
    w całości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: klucze do
    nośników wymiennych rozsiane po plikach użytkowników.
  en: |
    The setting settles in what manner the way into an enciphered removable medium is recovered and where the key
    goes.

    With removable media that bears a weight fixed drives do not carry. A travelling memory is enciphered by the
    user, as need arises, commonly in haste - and the key comes about then in that same haste. Left to themselves,
    a user will write it wherever is handy at the hour: in a file upon the desktop, in a note upon a telephone, or
    nowhere at all.

    The enforcing of the writing into the domain directory takes that decision away just at the hour nobody has
    time to take it well. The key goes where the support will find it, whoever enciphered the medium and for
    whatever end.

    I set down that the item is one decision written in eight values, and the check reads them together and names
    those that differ. A medium set halfway looks from outside just like one set whole.

    What an attacker gains while the item goes unmet: the keys to removable media scattered about users' files.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo wymaga katalogu domenowego
    i procedury po stronie obsługi — tak samo jak odpowiedniki dla dysków
    stałego i systemowego.

    Skutek szczególny dla nośników wymiennych jest taki, że szyfrowanie
    przestanie się udawać na maszynie bez łączności z katalogiem. Pamięć
    przenośna bywa szyfrowana w drodze, na maszynie poza siecią firmowa,
    i tam zapis klucza się nie powiedzie — a wtedy nie powiedzie się całe
    szyfrowanie.

    Jest to zachowanie zamierzone, ale w praktyce oznacza, że nośnika nie da
    się przygotować w pociągu. Warto powiedzieć to ludziom wprost, bo
    inaczej będą to odkrywać po kolei, każdy osobno i zawsze w złym
    momencie.

    Odnotowuję, że nośniki zaszyfrowane wcześniej zachowują dotychczasowe
    klucze. Zmiana obowiązuje przy zakładaniu ochrony, nie wstecz — więc
    raport zielony nie znaczy, że wszystkie klucze są w katalogu.

    Czego to nie psuje: odczytu i zapisu na nośnikach już zaszyfrowanych,
    pracy na dyskach stałych, logowania, drukowania.
  en: |
    The class is "needs a planned rollout", calling as it does for a domain directory and a procedure upon the
    support's side - as with its counterparts for the fixed and the system drive.

    The consequence particular to removable media is that enciphering will cease to come through upon a machine
    without a way to the directory. A travelling memory is at times enciphered upon the road, upon a machine
    outside the body's network, and there the writing of the key will not come through - and then the whole
    enciphering will not.

    It is meant behaviour, but in practice it means a medium cannot be made ready upon a train. It is worth saying
    to people outright, for otherwise they will find it out one by one, each apart and always at a bad hour.

    I set down that media enciphered earlier keep the keys they had. The change holds at the laying on of the
    guarding and not backwards - so a green report does not mean every key is in the directory.

    What this does not break: reading from and writing to media already enciphered, work upon fixed drives,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Szyfrowanie nośnika nie powiedzie się na maszynie bez łączności z katalogiem domenowym
      - Pamięci nie da się przez to przygotować w drodze, poza siecią organizacji
      - Nośniki zaszyfrowane wcześniej zachowują dotychczasowe klucze, bo zasada nie działa wstecz
      - Raport zielony przy tym punkcie nie znaczy, że wszystkie klucze są w katalogu
      - Odczyt i zapis na nośnikach już zaszyfrowanych, praca na dyskach stałych i drukowanie pozostają bez zmian
    en:
      - The enciphering of a medium will not come through upon a machine without a way to the domain directory
      - A memory cannot by that be made ready upon the road, outside the body s network
      - Media enciphered earlier keep the keys they had, the policy not working backwards
      - A green report at this item does not mean every key is in the directory
      - Reading from and writing to media already enciphered, work upon fixed drives and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny nie należą do domeny i nie ma katalogu, w którym klucze mogłyby zostać zapisane
      - Nośniki są szyfrowane na maszynach poza siecią organizacji, gdzie zapis klucza się nie powiedzie
    en:
      - The machines do not belong to a domain and there is no directory in which the keys could be written
      - The media are enciphered upon machines outside the body s network, where the writing of a key will not come through
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are read
      # at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        RDVRecovery                     = 1
        RDVManageDRA                    = 0
        RDVRecoveryPassword             = 2
        RDVRecoveryKey                  = 2
        RDVHideRecoveryPage             = 1
        RDVActiveDirectoryBackup        = 1
        RDVActiveDirectoryInfoToStore   = 1
        RDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'RDVRecovery', 'RDVManageDRA', 'RDVRecoveryPassword', 'RDVRecoveryKey',
      'RDVHideRecoveryPage', 'RDVActiveDirectoryBackup',
      'RDVActiveDirectoryInfoToStore', 'RDVRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One decision written in several values, so they go in together. Setting a
    # part of them describes a way of recovery that is settled only halfway.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      RDVRecovery                     = 1
      RDVManageDRA                    = 0
      RDVRecoveryPassword             = 2
      RDVRecoveryKey                  = 2
      RDVHideRecoveryPage             = 1
      RDVActiveDirectoryBackup        = 1
      RDVActiveDirectoryInfoToStore   = 1
      RDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła zamyka trójkę punktów o odzyskiwaniu dostępu — dla dysku
    systemowego, dysków stałych i nośników wymiennych. Warto, żeby
    aplikacja pokazała je razem, bo wdraża się je jednym przygotowaniem
    katalogu i jedną procedurą.

    Argument wart zachowania dotyczy tego, czym różni się tutaj sytuacja
    wyjściowa. Dysk systemowy szyfruje administrator, świadomie i raz.
    Nośnik wymienny szyfruje użytkownik, doraźnie i wielokrotnie — czyli
    klucz powstaje w warunkach, w których nikt nie zastanawia się, gdzie
    go zapisać. To właśnie dlatego wymuszenie ma tu największą wartość.

    Odnotowuję skutek poza siecią, bo jest specyficzny dla tej klasy
    nośników. Wymóg zapisu klucza do katalogu wiąże szyfrowanie
    z łącznością, a nośniki wymienne najczęściej przygotowuje się właśnie
    wtedy, gdy łączności nie ma.
  en: |
    The rule closes the three items about the recovering of access - for the system drive, for fixed drives and
    for removable media. It is well that the application show them together, they being rolled out by one making
    ready of a directory and one procedure.

    The argument worth keeping touches how the starting case differs here. A system drive is enciphered by an
    administrator, knowingly and once. A removable medium is enciphered by a user, as need arises and many times
    over - which is to say the key comes about in conditions in which nobody stops to think where to write it. It
    is just for that reason that the enforcing is worth most here.

    I set down the consequence outside the network, it being particular to this class of media. The calling for a
    key to be written into the directory binds enciphering to a way through, and removable media are most often
    made ready just when there is none.
