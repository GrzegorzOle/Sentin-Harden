id: win10-anonymous-sam-enumeration

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyliczanie kont przez połączenie bez poświadczeń zablokowane
    en: The listing of accounts by a connection without credentials blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje możliwość odczytania listy kont maszyny przez
    połączenie, które nie podało żadnych poświadczeń.

    Chodzi o zapytanie zadawane po sieci, na które maszyna bez tego
    ustawienia odpowiada wykazem nazw kont lokalnych — wszystkich, razem
    z tymi wyłączonymi i tymi, o których nikt już nie pamięta.

    Wartość reguły bierze się z tego, czym jest ten wykaz dla kogoś, kto
    dopiero zaczyna. Zgadywanie haseł bez znajomości nazw kont jest
    bezużyteczne, bo próby trafiają w nic. Lista kont zamienia je
    w czynność celową: wiadomo, do czego się dobierać, które konta są
    administracyjne i które wyglądają na zapomniane, a więc na takie
    z hasłem starym.

    Jest to więc punkt o rozpoznaniu, nie o dostępie. Sam z siebie nie
    otwiera niczego i dlatego kategoria nie jest wyższa. Zdejmuje natomiast
    pierwszy krok, bez którego pozostałe są kosztowne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełny wykaz
    nazw kont na maszynie, bez konta i bez hasła, jako punkt wyjścia do
    zgadywania.
  en: |
    The setting blocks the reading of the machine's list of accounts by a connection that has given no
    credentials at all.

    What is at issue is a query put over the network, to which a machine without this setting answers with a
    roll of its local accounts' names - all of them, those switched off among them, and those nobody remembers
    any longer.

    The rule's value comes of what that roll is to somebody only beginning. Guessing passwords without knowing
    the accounts' names is useless, the tries lighting on nothing. A list of accounts turns them into a purposed
    act: it is known what to go at, which accounts are administrative and which look forgotten, and so hold an
    old password.

    It is therefore an item about reconnaissance, not about access. Of itself it opens nothing, and for that the
    category is no higher. It does take away the first step, without which the rest come dear.

    What an attacker gains while the item goes unmet: a full roll of the accounts' names on the machine, without
    an account and without a password, as a starting point for guessing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy maszyn stojących poza
    domeną.

    W domenie zapytania o konta idą do kontrolera, nie do stanowiska,
    i zmiana nie zmienia niczego widocznego.

    Poza domeną bywa inaczej. Narzędzia do inwentaryzacji, skanery
    zgodności i starsze oprogramowanie do zarządzania czytają listę kont
    właśnie tą drogą. Po zmianie dostaną odpowiedź pustą albo odmowę,
    a raport, który generują, pokaże maszynę bez kont — co bywa odczytane
    jako awaria narzędzia, a nie jako skutek utwardzenia.

    Drugi przypadek dotyczy relacji zaufania i starszych mechanizmów
    uwierzytelniania między maszynami spoza domeny. Te potrafią wymagać
    odczytu listy kont przy nawiązywaniu połączenia.

    Na stanowisku w domenie zmiana nie robi nic.

    Czego to nie psuje: logowania, udziałów plikowych dla kont
    uwierzytelnionych, kont domenowych, drukowania, usług systemowych,
    aplikacji.
  en: |
    The class is "needs review", and the review touches machines standing outside a domain.

    In a domain queries about accounts go to the controller, not to the workplace, and the change alters nothing
    that is seen.

    Outside a domain it is at times otherwise. Inventory tools, compliance scanners and older management
    software read the list of accounts by just that road. After the change they will get an empty answer or a
    refusal, and the report they raise will show a machine without accounts - which gets read at times as a
    fault in the tool rather than as the outcome of a hardening.

    The second case touches trust relationships and older mechanisms of authentication between machines outside
    a domain. Those may call for the list of accounts to be read while a connection is being set up.

    At a workplace in a domain the change does nothing.

    What this does not break: logging on, file shares for authenticated accounts, domain accounts, printing,
    system services, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Narzędzie do inwentaryzacji czytające listę kont po sieci dostaje odpowiedź pustą albo odmowę
      - Raport z takiego narzędzia pokazuje maszynę bez kont, co bywa odczytane jako awaria narzędzia
      - Starsze mechanizmy uwierzytelniania między maszynami spoza domeny mogą stracić krok potrzebny do nawiązania połączenia
      - Na stanowisku w domenie zapytania o konta idą do kontrolera i zmiana nie robi nic
      - Logowanie, udziały plikowe dla kont uwierzytelnionych, konta domenowe i drukowanie pozostają bez zmian
    en:
      - An inventory tool reading the list of accounts over the network gets an empty answer or a refusal
      - A report from such a tool shows a machine without accounts, which gets read at times as a fault in the tool
      - Older mechanisms of authentication between machines outside a domain may lose a step needed to set up a connection
      - At a workplace in a domain queries about accounts go to the controller and the change does nothing
      - Logging on, file shares for authenticated accounts, domain accounts and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna stoi poza domeną, a narzędzie do inwentaryzacji czyta z niej listę kont bez podawania poświadczeń
      - Połączenie z maszyną sąsiednią opiera się na starszym mechanizmie wymagającym odczytu listy kont
    en:
      - The machine stands outside a domain and an inventory tool reads its list of accounts without giving credentials
      - The connection to a neighbouring machine rests on an older mechanism calling for the list of accounts to be read
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictAnonymousSAM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'RestrictAnonymousSAM'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Reconnaissance goes, access does not change. Where an inventory tool reads
    # accounts from this machine without credentials, its report will show the
    # machine as having none - give it an account first.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictAnonymousSAM' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts

notes:
  pl: |
    Reguła otwiera blok o dostępie bez poświadczeń i jest w nim tą
    o najwęższym zakresie — dotyczy wyłącznie kont. Reguła następna obejmuje
    konta i udziały naraz, więc warto, żeby aplikacja pokazywała je razem
    i mówiła, że druga zawiera pierwszą.

    Kategoria średnia jest tu oceną świadomą. Punkt nie otwiera żadnego
    zasobu; zdejmuje rozpoznanie. Jest to wkład realny, ale pośredni,
    i opis powinien to przyznać zamiast nadawać regule wagi, której nie ma.

    Odnotowuję, że nazwa wpisu w rejestrze mówi o ograniczeniu, a wartością
    wymaganą jest jedynka. Jest to jeden z nielicznych przypadków w tej
    paczce, gdzie odczyt intuicyjny prowadzi w stronę właściwą.
  en: |
    The rule opens the block about access without credentials and is the narrowest in it - it touches accounts
    alone. The next rule covers accounts and shares at once, so it is well that the application show them
    together and say that the second holds the first.

    The medium category is here a knowing judgement. The item opens no resource; it takes away reconnaissance.
    That is a real contribution, but an indirect one, and the description ought to own it rather than give the
    rule a weight it has not.

    Worth noting that the registry entry's name speaks of a restriction while the value called for is one. It is
    one of the few cases in this pack where an intuitive reading leads the right way.
