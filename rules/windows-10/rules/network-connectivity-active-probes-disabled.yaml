id: win10-network-connectivity-active-probes-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Aktywne sprawdzanie dostępu do sieci wyłączone
    en: Active testing of network access switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    System sam sprawdza, czy sieć prowadzi na zewnątrz: wysyła zapytanie pod
    znany adres i po odpowiedzi rozstrzyga, czy pokazać ikonę połączenia i czy
    otworzyć stronę logowania do sieci gościnnej.

    Zapytanie idzie pod stały, powszechnie znany adres, a maszyna wierzy
    odpowiedzi. Strona sterująca tym adresem albo ruchem w drodze do niego może
    więc rozstrzygnąć za maszynę, czy sieć jest sprawna — i otworzyć stronę
    logowania, której nikt nie zamawiał, przed jakimkolwiek zalogowaniem
    użytkownika.

    Wyłączenie aktywnego sprawdzania odbiera obcej sieci możliwość odpowiadania
    maszynie na pytania, których ta nie musi zadawać.
  en: |
    The system tests for itself whether the network leads outwards - it sends a
    query to a known address and from the answer settles whether to show the
    connection icon and whether to open the sign-in page of a guest network.

    The query goes to a fixed, widely known address, and the machine believes the
    answer. A party controlling that address, or the traffic on the way to it, can
    therefore settle for the machine whether the network works - and open a
    sign-in page nobody asked for, before the user has signed in at all.

    Switching active testing off takes away a foreign network s means of answering
    questions the machine need not ask.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo psuje coś widocznego: ikona połączenia
    przestaje odróżniać sieć z dostępem na zewnątrz od sieci bez niego. Dla
    użytkownika wygląda to jak brak internetu przy działającym internecie.

    Drugim skutkiem jest brak samoczynnego otwierania strony logowania w sieci
    hotelowej czy kawiarnianej. Połączenie da się zestawić ręcznie, otwierając
    dowolną stronę, ale trzeba o tym wiedzieć — inaczej wygląda to na sieć,
    która nie działa.

    Część aplikacji pyta system o stan połączenia zamiast sprawdzać samodzielnie.
    Takie programy po zmianie mogą uznać maszynę za odłączoną i przejść w tryb
    pracy bez sieci.
  en: |
    The change calls for a review, because it breaks something visible - the
    connection icon stops telling a network with a way out from one without. To
    the user that looks like no internet while the internet works.

    The second consequence is that the sign-in page of a hotel or café network no
    longer opens by itself. The connection can be made by hand, by opening any
    page, but that has to be known - otherwise it looks like a network that does
    not work.

    Some applications ask the system about the state of the connection instead of
    testing for themselves. After the change such programs may take the machine
    for disconnected and switch to working without a network.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Ikona połączenia przestanie odróżniać sieć z dostępem na zewnątrz od sieci bez niego
      - Strona logowania w sieci hotelowej albo kawiarnianej nie otworzy się sama i trzeba ją wywołać ręcznie
      - Aplikacje pytające system o stan połączenia mogą uznać maszynę za odłączoną i przejść w tryb pracy bez sieci
      - Zgłoszenia o braku internetu wzrosną, choć internet będzie działał
      - Samo połączenie z siecią, dostęp do stron, poczta, dyski sieciowe i drukowanie pozostają bez zmian
    en:
      - The connection icon stops telling a network with a way out from one without
      - The sign-in page of a hotel or café network does not open by itself and has to be raised by hand
      - Applications asking the system about the state of the connection may take the machine for disconnected and work without a network
      - Tickets about there being no internet rise, though the internet works
      - The network connection itself, access to pages, mail, network drives and printing are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska przenośne łączące się z sieciami wymagającymi logowania przez stronę otwieraną samoczynnie
      - Środowiska z aplikacjami pytającymi system o stan połączenia zamiast sprawdzać go samodzielnie
      - Maszyny, na których obsługa rozpoznaje problemy sieciowe po ikonie połączenia
    en:
      - Portable stations joining networks that call for signing in through a page opened by itself
      - Environments with applications asking the system about the state of the connection instead of testing for themselves
      - Machines where staff recognise network trouble by the connection icon
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'NoActiveProbe'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    $name = 'NoActiveProbe'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoActiveProbe' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Zasada dotyczy sprawdzania aktywnego, czyli wysyłania zapytania. System nadal
    rozpoznaje obecność sieci z innych przesłanek, więc maszyna nie zachowuje się
    jak odłączona — zmienia się to, na czym opiera swój osąd o dostępie na
    zewnątrz.
  en: |
    The rule covers active testing, that is the sending of a query. The system
    still recognises the presence of a network from other signs, so the machine
    does not behave as though disconnected - what changes is what its judgement
    about a way out rests on.
