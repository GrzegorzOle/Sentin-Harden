id: win2025-logon-mpr-notifications-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Przekazywanie zdarzeń logowania dostawcom sieciowym wyłączone
    en: Passing of logon events to network providers disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza przekazywanie zdarzeń logowania zarejestrowanym dostawcom
    sieciowym.

    Kategoria wysoka i chcę dokładnie nazwać, co tu jest przekazywane, bo
    nazwa mówi o powiadomieniu i brzmi niegroźnie. Dostawca sieciowy to
    składnik wpięty w proces logowania, który przy logowaniu dostaje nazwę
    konta i hasło w postaci, z której da się je użyć. Tak ten mechanizm
    został pomyślany: po to, żeby dostawca mógł zalogować użytkownika
    w swojej sieci tym samym hasłem.

    To jest właściwa treść punktu. Nie chodzi o to, że ktoś jest
    powiadamiany o logowaniu. Chodzi o to, że w chwili logowania hasło
    trafia do kodu spoza systemu operacyjnego, wykonywanego w procesie
    logowania, czyli z wysokimi uprawnieniami. Dostawca sieciowy
    zarejestrowany przez napastnika to nie podsłuch ruchu — to odbiór hasła
    z pierwszej ręki, przy każdym logowaniu, w postaci gotowej do użycia.

    Na serwerze hasła podawane przy logowaniu należą do kont
    uprzywilejowanych, co decyduje o kategorii.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: udokumentowany
    sposób odbierania haseł wszystkich logujących się osób, wymagający
    jedynie zarejestrowania własnego dostawcy.
  en: |
    The item switches off the passing of logon events to registered network
    providers.

    The category is high, and I want to name precisely what is passed,
    because the name speaks of a notification and sounds harmless. A network
    provider is a component hooked into the logon process which, at sign-in,
    receives the account name and the password in a form from which it can be
    used. That is how the mechanism was conceived: so that the provider could
    sign the user in to its own network with the same password.

    That is the real substance of the item. The point is not that somebody is
    notified of a sign-in. The point is that at the moment of signing in the
    password reaches code from outside the operating system, running inside
    the logon process, that is, with high privileges. A network provider
    registered by an attacker is not traffic interception - it is receiving
    the password at first hand, at every sign-in, in a form ready for use.

    On a server the passwords given at sign-in belong to privileged accounts,
    and that settles the category.

    What an attacker gains while the item goes unmet: a documented way of
    receiving the passwords of everybody who signs in, needing nothing but
    the registration of a provider of their own.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i to jest sprawdzenie, którego nie wolno
    pominąć, bo mechanizm bywa używany i wtedy jego wyłączenie boli.

    Sprawdzić trzeba, czy na tej maszynie jest zarejestrowany dostawca
    sieciowy spoza systemu. Klasycznie robią tak klienci sieci innych
    producentów i rozwiązania jednokrotnego logowania: korzystają z tego,
    że przy logowaniu do systemu dostają hasło i logują użytkownika
    równolegle u siebie. Po zmianie takie logowanie przestaje następować
    automatycznie — użytkownik będzie musiał podać poświadczenia osobno,
    tam, gdzie dotąd wchodziły same.

    Nie zawsze widać to od razu, i to jest tu najbardziej podstępne. Zasób
    sieciowy, który mapował się sam, przestaje się mapować. Program, który
    otwierał się bez pytania, zaczyna pytać. Ludzie zgłoszą to jako awarię
    zupełnie niezwiązaną z logowaniem, bo objaw pojawia się później niż
    przyczyna.

    Czego to nie psuje: logowania do systemu, uwierzytelniania domenowego,
    udziałów sieciowych otwieranych na poświadczeniach domenowych ani
    jednokrotnego logowania opartego na mechanizmach domeny. Punkt dotyczy
    wyłącznie dostawców wpiętych w proces logowania.

    Bez przerwy, natychmiast odwracalne — ale skutek ujawnia się przy
    kolejnym logowaniu, nie od razu.
  en: |
    The class is "needs review", and this is a review not to be skipped,
    because the mechanism does get used and switching it off then hurts.

    What needs checking is whether a network provider from outside the system
    is registered on this machine. Classically this is done by third-party
    network clients and by single sign-on products: they make use of
    receiving the password at sign-in and sign the user in on their own side
    at the same time. After the change such a sign-in stops happening
    automatically - the user will have to give credentials separately, where
    they used to go in by themselves.

    It is not always visible at once, and that is the most insidious part. A
    network resource that used to map itself stops mapping. A program that
    opened without asking starts asking. People will report it as a fault
    entirely unconnected with signing in, because the symptom appears later
    than the cause.

    What this does not break: signing in to the system, domain
    authentication, network shares opened on domain credentials, or single
    sign-on resting on the domain's own mechanisms. The item concerns only
    providers hooked into the logon process.

    No outage, undone immediately - but the effect shows at the next sign-in,
    not straight away.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Klienci sieci innych producentów i rozwiązania jednokrotnego logowania przestaną logować użytkownika równolegle u siebie
      - Zasób, który mapował się sam, przestaje się mapować, a program, który otwierał się bez pytania, zaczyna pytać
      - Objaw pojawia się później niż przyczyna, więc ludzie zgłoszą to jako awarię niezwiązaną z logowaniem
      - Logowanie do systemu, uwierzytelnianie domenowe i udziały na poświadczeniach domenowych działają bez zmian
    en:
      - Third-party network clients and single sign-on products stop signing the user in on their own side at the same time
      - A resource that mapped itself stops mapping, and a program that opened without asking starts asking
      - The symptom appears later than the cause, so people will report it as a fault unconnected with signing in
      - Signing in to the system, domain authentication and shares on domain credentials work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie jest zarejestrowany dostawca sieciowy spoza systemu, na którym opiera się jednokrotne logowanie do zasobów innego producenta
    en:
      - A network provider from outside the system is registered on the machine and single sign-on to a third-party resource rests on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The registry value carries a shorter name than the policy does.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableMPR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableMPR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A network provider is a component hooked into the logon process which, at
    # sign-in, receives the account name and the password in a usable form. One
    # registered by an attacker is not interception - it is the password at first
    # hand, at every sign-in. Check for third-party providers first.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMPR' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/secauthn/network-provider-api

notes:
  pl: |
    Nazwa mówi o powiadomieniu i brzmi niegroźnie. Dostawca sieciowy to
    składnik wpięty w proces logowania, który przy logowaniu dostaje nazwę
    konta i hasło w postaci, z której da się je użyć — tak ten mechanizm
    został pomyślany.

    Dostawca zarejestrowany przez napastnika to nie podsłuch ruchu, tylko
    odbiór hasła z pierwszej ręki, przy każdym logowaniu, w postaci gotowej
    do użycia. Kod spoza systemu operacyjnego wykonywany w procesie
    logowania, czyli z wysokimi uprawnieniami.

    Skutek wyłączenia bywa podstępny: objaw pojawia się później niż
    przyczyna, więc zgłoszenie brzmi jak awaria niezwiązana z logowaniem.
  en: |
    The name speaks of a notification and sounds harmless. A network provider
    is a component hooked into the logon process which, at sign-in, receives
    the account name and the password in a form from which it can be used -
    that is how the mechanism was conceived.

    A provider registered by an attacker is not traffic interception but the
    password at first hand, at every sign-in, in a form ready for use. Code
    from outside the operating system running inside the logon process, that
    is, with high privileges.

    The effect of switching it off is sometimes insidious: the symptom
    appears later than the cause, so the report sounds like a fault
    unconnected with signing in.
