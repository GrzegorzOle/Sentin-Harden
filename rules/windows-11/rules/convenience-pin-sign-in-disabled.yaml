id: win11-convenience-pin-sign-in-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie kodem zastępującym hasło domenowe wyłączone
    en: Sign-in with a code standing in for the domain password turned off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Do konta domenowego można ustawić krótki kod cyfrowy i logować się nim
    zamiast hasłem. Kod jest przechowywany na maszynie, a system po jego podaniu
    odtwarza z niego dostęp do konta.

    Rzecz w tym, że kod zastępuje hasło, nie uzupełnia go. Wszystkie wymagania
    nałożone na hasło domenowe — długość, złożoność, okres ważności, blokada po
    nieudanych próbach — dotyczą hasła, a nie kodu. Konto chronione hasłem
    z wymuszoną złożonością zaczyna więc być dostępne po czterech cyfrach,
    których odgadnięcie jest zadaniem zupełnie innej klasy.

    Kod jest związany z jedną maszyną i to jest jego zaletą: wyniesiony nie
    otwiera niczego zdalnie. Nie zmienia to jednak sytuacji kogoś, kto tę
    maszynę ma w rękach — a od niego właśnie chroni hasło domenowe.
  en: |
    A short numeric code can be set for a domain account and used to sign in
    instead of the password. The code is kept on the machine, and once given, the
    system rebuilds access to the account from it.

    The thing is that the code replaces the password rather than supplementing it.
    Every requirement placed on the domain password - length, complexity, lifetime,
    lockout after failed attempts - applies to the password, not to the code. An
    account protected by a password with enforced complexity thus becomes
    reachable after four digits, guessing which is a task of an entirely different
    class.

    The code is tied to one machine and that is its merit: carried off, it opens
    nothing remotely. That does not change the position of somebody holding that
    machine, though - and it is from them that the domain password protects.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś na tej maszynie już się tak loguje, bo dla
    niego zmiana jest odczuwalna od razu.

    Po wdrożeniu nie da się ustawić nowego kodu, a istniejący przestaje działać.
    Użytkownik wraca do wpisywania pełnego hasła domenowego przy każdym
    logowaniu i przy każdym wybudzeniu. Na haśle długim i złożonym, wpisywanym
    kilkanaście razy dziennie, jest to realna uciążliwość i typowa reakcja
    polega na skracaniu hasła przy najbliższej zmianie — czego ten punkt
    oczywiście nie zakłada, a co bywa jego faktycznym skutkiem.

    Osobno trzeba sprawdzić logowanie biometryczne. Na części stanowisk palec
    albo twarz odblokowują właśnie ten kod, więc razem z nim przestają działać
    i użytkownik traci obie wygodne drogi naraz. Nie na każdym stanowisku tak
    jest i warto to zobaczyć, zanim się zastosuje.
  en: |
    What needs checking is whether anybody on this machine already signs in this
    way, because for them the change is felt at once.

    After the change no new code can be set and an existing one stops working. The
    user returns to typing the full domain password at every sign-in and every
    wake. With a long, complex password typed a dozen times a day this is a real
    burden, and the typical response is to shorten the password at the next change
    - which the item of course does not intend, and which is sometimes its actual
    effect.

    Biometric sign-in has to be checked separately. On some stations a finger or a
    face unlocks exactly this code, so they stop working along with it and the
    user loses both convenient routes at once. It is not so on every station and
    it is worth seeing before applying.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Istniejący kod przestanie działać i nie da się ustawić nowego
      - Użytkownik wróci do wpisywania pełnego hasła domenowego przy logowaniu i wybudzeniu
      - Tam, gdzie palec albo twarz odblokowują ten kod, logowanie biometryczne również przestanie działać
    en:
      - An existing code stops working and no new one can be set
      - The user returns to typing the full domain password at sign-in and on waking
      - Where a finger or a face unlocks that code, biometric sign-in stops working too
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na stanowisku logowanie biometryczne opiera się na tym kodzie i jest potrzebne
      - Hasło domenowe jest na tyle długie, że jego wielokrotne wpisywanie w ciągu dnia jest nierealne
    en:
      - Biometric sign-in on the station rests on this code and is needed
      - The domain password is long enough that typing it many times a day is unrealistic
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'AllowDomainPINLogon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowDomainPINLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainPINLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Punkt dotyczy kodu zastępującego hasło domenowe, a nie każdego logowania
    kodem. Rozwiązanie oparte na kluczu związanym ze sprzętem, w którym kod
    odblokowuje klucz zamiast zastępować hasło, jest czymś innym i tej regule
    nie podlega — mimo że dla użytkownika wygląda identycznie.

    Rozróżnienie jest istotne, bo wdrożenie tego punktu na stanowisku
    korzystającym z tego drugiego rozwiązania nic nie da, a opis uciążliwości
    będzie wtedy straszył czymś, co nie nastąpi. Reguła nie umie tych dwóch
    przypadków odróżnić sama — sprawdzenie należy do osoby czytającej raport
    i dlatego punkt jest w klasie wymagającej sprawdzenia, a nie hurtowej.
  en: |
    The item concerns a code standing in for the domain password, not every
    sign-in with a code. A solution built on a key tied to the hardware, where the
    code unlocks the key instead of replacing the password, is a different thing
    and falls outside this rule - even though it looks identical to the user.

    The distinction matters, because applying this item on a station using the
    second kind achieves nothing, while the disruption description will then
    frighten with something that will not happen. The rule cannot tell the two
    cases apart itself - the checking belongs to the person reading the report,
    which is why the item sits in the class needing review rather than in the bulk
    one.
