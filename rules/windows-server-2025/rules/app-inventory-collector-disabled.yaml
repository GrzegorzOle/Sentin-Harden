id: win2025-app-inventory-collector-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Zbieranie spisu zainstalowanego oprogramowania wyłączone
    en: Collecting an inventory of installed software switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza składnik zbierający spis zainstalowanego oprogramowania
    i przekazujący go poza maszynę.

    Kategoria średnia i chcę nazwać, czym taki spis jest z punktu widzenia
    kogoś, kto się do maszyny przymierza. To nie jest lista programów. To
    jest lista wersji — a lista wersji zestawiona z publicznym wykazem
    podatności daje gotową odpowiedź na pytanie, którędy wejść. Rozpoznanie,
    które normalnie wymaga skanowania i zostawia ślad, dostaje się tu bez
    żadnego wysiłku.

    To jest właściwa treść punktu. Wartość spisu nie leży w żadnej
    pojedynczej pozycji, tylko w kompletności: wiadomo nie tylko, co jest,
    ale też czego nie ma i co jest nieaktualne.

    Na serwerze waży to więcej niż na stanowisku, bo spis z serwera opisuje
    role, usługi i oprogramowanie warstwy pośredniej — czyli to, co
    faktycznie obsługuje ruch i dane organizacji.

    Warto powiedzieć uczciwie, czym ten punkt nie jest. Nie zabiera nikomu
    możliwości sprawdzenia, co na maszynie stoi — administrator dalej to
    widzi, a narzędzia inwentaryzacyjne organizacji dalej to zbierają.
    Zamyka jeden konkretny kanał, prowadzący na zewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowe
    rozpoznanie tej maszyny — wersje oprogramowania, bez skanowania i bez
    śladu.
  en: |
    The item switches off the component that collects an inventory of
    installed software and passes it beyond the machine.

    The category is medium, and I want to name what such an inventory is from
    the point of view of somebody sizing the machine up. It is not a list of
    programs. It is a list of versions - and a list of versions set against a
    public register of vulnerabilities gives a ready answer to the question
    of where to get in. Reconnaissance that normally requires scanning and
    leaves a trace is had here for no effort at all.

    That is the real substance of the item. The inventory's value lies in no
    single entry but in its completeness: one knows not only what is there,
    but also what is not and what is out of date.

    On a server it weighs more than on a workstation, because an inventory
    from a server describes roles, services and middleware - that is, what
    actually handles the organisation's traffic and data.

    It is worth saying honestly what this item is not. It takes from nobody
    the ability to check what stands on the machine - an administrator still
    sees it, and the organisation's own inventory tools still collect it. It
    closes one particular channel, the one leading outwards.

    What an attacker gains while the item goes unmet: ready reconnaissance of
    this machine - software versions, with no scanning and no trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Składnik pracuje w tle, nie ma interfejsu
    i nic w codziennej pracy nie zależy od tego, czy działa.

    Skutek jedyny i wart nazwania: przestaje działać mechanizm zgodności
    aplikacji w tej części, która opiera się na zebranym spisie. W praktyce
    dotyczy to podpowiedzi przy uruchamianiu bardzo starych programów —
    rzeczy, których na serwerze się nie uruchamia.

    Czego to nie psuje: instalowania i odinstalowywania programów, listy
    zainstalowanego oprogramowania w ustawieniach, narzędzi
    inwentaryzacyjnych organizacji, aktualizacji ani ról serwera.
    Administrator dalej widzi, co na maszynie stoi.

    Warto to rozróżnienie zapisać, bo nazwa punktu sugeruje więcej, niż
    reguła robi: zamykany jest kanał na zewnątrz, a nie możliwość
    sprawdzenia stanu maszyny u siebie.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption". The component works in the background, has
    no interface, and nothing in daily work depends on whether it runs.

    The only effect worth naming: the application compatibility mechanism
    stops working in the part that rests on the collected inventory. In
    practice that concerns suggestions when very old programs are started -
    things one does not start on a server.

    What this does not break: installing and uninstalling programs, the list
    of installed software in settings, the organisation's own inventory
    tools, updates, or server roles. An administrator still sees what stands
    on the machine.

    That distinction is worth writing down, because the item's name suggests
    more than the rule does: what is closed is a channel leading outwards,
    not the ability to check the machine's state at home.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Mechanizm zgodności aplikacji przestanie działać w tej części, która opiera się na zebranym spisie
      - W praktyce dotyczy to podpowiedzi przy uruchamianiu bardzo starych programów, czego na serwerze się nie robi
      - Administrator dalej widzi, co na maszynie stoi — zamykany jest kanał na zewnątrz, nie wgląd u siebie
      - Instalowanie programów, lista zainstalowanego oprogramowania, narzędzia inwentaryzacyjne organizacji i aktualizacje działają bez zmian
    en:
      - The application compatibility mechanism stops working in the part that rests on the collected inventory
      - In practice that concerns suggestions when very old programs are started, which is not done on a server
      - An administrator still sees what stands on the machine - what is closed is a channel outwards, not the view at home
      - Installing programs, the list of installed software, the organisation's inventory tools and updates work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zgodność bardzo starych programów na tej maszynie opiera się na podpowiedziach budowanych z zebranego spisu
    en:
      - The compatibility of very old programs on this machine rests on suggestions built from the collected inventory
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'DisableInventory'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'DisableInventory'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The inventory is not a list of programs but a list of versions, and a list
    # of versions set against a public register of vulnerabilities answers the
    # question of where to get in - with no scanning and no trace. What is closed
    # is the channel outwards, not an administrator's view of the machine.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableInventory' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/planning/compatibility-administrator-users-guide

notes:
  pl: |
    To nie lista programów, tylko lista wersji — a lista wersji zestawiona
    z publicznym wykazem podatności daje gotową odpowiedź na pytanie,
    którędy wejść.

    Wartość spisu leży w kompletności: wiadomo nie tylko, co jest, ale też
    czego nie ma i co jest nieaktualne. Rozpoznanie, które normalnie wymaga
    skanowania i zostawia ślad, dostaje się bez wysiłku.

    Uczciwie o granicy: punkt nie zabiera możliwości sprawdzenia, co na
    maszynie stoi. Administrator dalej to widzi, narzędzia organizacji dalej
    zbierają. Zamykany jest jeden kanał, prowadzący na zewnątrz.
  en: |
    Not a list of programs but a list of versions - and a list of versions
    set against a public register of vulnerabilities answers the question of
    where to get in.

    The inventory's value lies in its completeness: one knows not only what
    is there but what is not and what is out of date. Reconnaissance that
    normally needs scanning and leaves a trace is had for no effort.

    Honestly about the boundary: the item does not take away the ability to
    check what stands on the machine. An administrator still sees it, the
    organisation's tools still collect it. One channel is closed, the one
    leading outwards.
