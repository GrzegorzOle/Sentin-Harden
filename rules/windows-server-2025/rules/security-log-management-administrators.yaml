id: win2025-security-log-management-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zarządzanie dziennikiem zabezpieczeń tylko dla administratorów
    en: Managing the security log restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo daje dwie rzeczy naraz: możliwość odczytania i wyczyszczenia
    dziennika zabezpieczeń oraz możliwość ustawienia inspekcji na
    poszczególnych plikach i gałęziach rejestru.

    Druga połowa jest mniej znana, a to ona bywa groźniejsza. Konto
    z tym prawem może wyłączyć inspekcję na wskazanym katalogu — na
    przykład na tym, w którym zamierza pracować — i od tej chwili
    działać w miejscu, które nie zostawia śladu. Jest to sposób
    cichszy niż wyczyszczenie dziennika, bo nie zostawia dziury: zapis
    jest ciągły, brakuje w nim tylko tego, co miało się w nim znaleźć.

    Wyczyszczenie dziennika jest za to głośne. Samo czyszczenie
    zostawia zdarzenie, którego nie da się usunąć, więc pusty dziennik
    z jednym wpisem mówi wprost, co się stało i kiedy.

    Na serwerze waga jest większa niż na stanowisku roboczym, bo na
    serwerze dziennik zabezpieczeń bywa jedynym źródłem wiedzy
    o zdarzeniach. Maszyna stoi zdalnie, nikt jej nie obserwuje,
    a wszystko, co o niej wiadomo, pochodzi z tego, co sama zapisała.

    Punkt nie każe prawa usunąć, tylko zawęzić do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyłączenia inspekcji dokładnie tam, gdzie zamierza działać, i to
    bez pozostawienia luki w ciągłości zapisu.
  en: |
    The right gives two things at once: the means of reading and clearing the security log, and
    the means of setting auditing on particular files and registry branches.

    The second half is less known, and it is at times the graver. An account with this right
    may switch auditing off on a named directory - on the one it means to work in, say - and
    from that moment act in a place that leaves no trace. It is a quieter way than clearing the
    log, since it leaves no hole: the record is unbroken, and only what was to have been in it
    is missing.

    Clearing the log is loud by contrast. The clearing itself leaves an event that cannot be
    removed, so an empty log with one entry says outright what happened and when.

    On a server the weight is greater than at a working station, since on a server the security
    log is at times the only source of knowledge about events. The machine stands remote,
    nobody watches it, and all that is known of it comes from what it recorded itself.

    The item does not bid the right be removed but narrowed to administrators.

    What an attacker gains while the item goes unmet: the means of switching auditing off
    exactly where they mean to act, and that without leaving a gap in the record's continuity.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z dziennika zabezpieczeń czyta na tym
    serwerze coś poza administratorem, bo po zawężeniu przestanie mieć
    do niego dostęp.

    Nic nie przestaje działać przy pracy normalnej. Zapis do dziennika
    przebiega bez zmiany, bo pisanie nie zależy od tego prawa —
    zależy od niego czytanie, czyszczenie i ustawianie inspekcji.

    Na serwerze przypadek do sprawdzenia jest konkretny. Agent zbierający
    zdarzenia i wysyłający je do systemu centralnego musi dziennik
    odczytać. Jeżeli pracuje na koncie spoza grupy administratorów —
    a bywa tak celowo — po zmianie przestanie dostawać zdarzenia
    z dziennika zabezpieczeń.

    Objaw jest cichy i przez to kłopotliwy: agent działa dalej, wysyła
    zdarzenia z pozostałych dzienników i nie zgłasza błędu, a w systemie
    centralnym po prostu znika jeden strumień. Zauważa się to zwykle
    wtedy, gdy ktoś szuka konkretnego zdarzenia i go nie znajduje.

    Warto sprawdzić przed zmianą, na jakim koncie pracuje agent.
    Rozwiązaniem nie musi być odpuszczenie punktu — zdarzenia można
    przesyłać mechanizmem przekazywania dzienników, który tego prawa nie
    wymaga.
  en: |
    What needs checking is whether anything but an administrator reads the security log on this
    server, since after the narrowing it will lose access to it.

    Nothing stops working at normal work. Writing to the log runs unchanged, since writing does
    not hang on this right - reading, clearing and the setting of auditing do.

    On a server the case to be checked is concrete. An agent gathering events and sending them
    to a central system must read the log. Where it works under an account outside the
    administrators' group - and it does so at times on purpose - after the change it will stop
    getting events from the security log.

    The symptom is quiet and thereby troublesome: the agent goes on working, sends events from
    the other logs and reports no error, while in the central system one stream simply
    vanishes. It is usually noticed when somebody looks for a particular event and does not
    find it.

    It is worth checking before the change what account the agent works under. The answer need
    not be letting the item go - events can be sent by the log forwarding mechanism, which does
    not take this right.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - diagnostics-and-reporting
    - remote-management
  what_breaks:
    pl:
      - Agent zbierający zdarzenia na koncie spoza grupy administratorów przestanie czytać dziennik zabezpieczeń
      - Objaw jest cichy — agent działa dalej i nie zgłasza błędu, a strumień zdarzeń znika
      - Zapis do dziennika przebiega bez zmiany, bo pisanie nie zależy od tego prawa
      - Ustawianie inspekcji na plikach i gałęziach rejestru zostaje przy administratorach
    en:
      - An event-gathering agent under an account outside the administrators' group will stop reading the security log
      - The symptom is quiet - the agent goes on working and reports no error while the stream of events vanishes
      - Writing to the log runs unchanged, since writing does not hang on this right
      - The setting of auditing on files and registry branches stays with administrators
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Agent zbierający zdarzenia czyta dziennik zabezpieczeń z konta spoza grupy administratorów
      - Nie ustalono, co poza administratorem czyta dziennik zabezpieczeń tego serwera
    en:
      - An event-gathering agent reads the security log from an account outside the administrators' group
      - It has not been settled what besides an administrator reads this server's security log
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSecurityPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSecurityPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSecurityPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSecurityPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSecurityPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/manage-auditing-and-security-log

notes:
  pl: |
    Prawo nie obejmuje pisania do dziennika. Zapis prowadzi system
    z innego tytułu, a osobne prawo do generowania wpisów jest odrębnym
    punktem tej paczki.

    Druga połowa prawa — ustawianie inspekcji na plikach i gałęziach
    rejestru — jest mniej znana i groźniejsza niż czyszczenie dziennika.
    Wyłączenie inspekcji nie zostawia luki w zapisie, więc jest cichsze
    niż wyczyszczenie.

    Mechanizm przekazywania dzienników pozwala zbierać zdarzenia bez
    nadawania tego prawa i jest właściwą odpowiedzią na potrzebę agenta.
  en: |
    The right does not take in writing to the log. The record is led by the system on another
    title, and the separate right of generating entries is an item of its own in this pack.

    The right's second half - the setting of auditing on files and registry branches - is less
    known and graver than the clearing of the log. Switching auditing off leaves no gap in the
    record, so it is quieter than a clearing.

    The log forwarding mechanism allows events to be gathered without this right being granted
    and is the right answer to an agent's need.
