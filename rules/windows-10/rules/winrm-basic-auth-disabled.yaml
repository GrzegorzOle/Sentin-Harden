id: win10-winrm-basic-auth-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management
  title:
    pl: Uwierzytelnianie podstawowe usługi zarządzania zdalnego wyłączone
    en: The plain warranting of the service of ordering from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zdalnego zarządzania przyjmowania
    uwierzytelniania podstawowego, czyli nazwy konta i hasła podanych
    wprost w żądaniu.

    Zastrzeżenie dotyczy samej postaci poświadczeń. Przy tym sposobie
    hasło jest przesyłane w treści żądania, przekodowane, ale nie
    zaszyfrowane. Przekodowanie odwraca się jednym poleceniem i nie jest
    żadną ochroną.

    Zagrożenie pierwsze to podsłuch. Jeżeli połączenie nie jest
    szyfrowane warstwą niżej, hasło jest czytelne dla każdego po drodze.

    Zagrożenie drugie to zgadywanie. Przy pozostałych sposobach
    uwierzytelniania napastnik musi pokonać mechanizm odpowiedzi na
    wyzwanie; tutaj wystarczy podać hasło, więc próby można powtarzać
    maszynowo.

    Zagrożenie trzecie to konta miejscowe. Uwierzytelnianie podstawowe
    otwiera drogę kontom, które nie przechodzą przez żaden mechanizm
    domenowy, więc omija zasady haseł i wykrywanie prób.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    w treści żądania i cel, w którym da się je zgadywać maszynowo.
  en: |
    The setting forbids the service of ordering from afar to take in plain warranting - the name of a reckoning
    and a password given outright in the asking.

    The reservation touches the very shape of the warrants. In that manner the password is sent in the body of the
    asking, turned into other signs but not enciphered. The turning is undone by one order and is no guard at all.

    The first danger is the listening in. If the joining be not enciphered a layer below, the password is readable
    by whoever stands along the road.

    The second danger is the guessing. In the other manners of warranting an attacker must overcome a mechanism of
    answering a challenge; here it suffices to give the password, so the tries may be made over and over by a
    machine.

    The third danger is reckonings upon the spot. Plain warranting opens a road to reckonings that pass through no
    mechanism of the domain, so it passes by the rules of passwords and the marking of tries.

    What an attacker gains while the item goes unmet: a password in the body of the asking, and a mark at which it
    may be guessed by a machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są narzędzia
    łączące się z tą maszyną.

    Miejscem pierwszym są narzędzia spoza systemu Windows: skrypty
    w innych językach, narzędzia nadzoru i rozwiązania wdrożeniowe
    korzystające z tego sposobu, bo jest najprostszy do zapisania.
    Po zmianie przestaną się uwierzytelniać.

    Miejscem drugim są połączenia do maszyn spoza domeny, gdzie
    uwierzytelnianie oparte na katalogu nie działa i ktoś sięgnął po
    sposób podstawowy jako obejście.

    Odnotowuję, że pozostałe sposoby uwierzytelniania działają dalej,
    w tym ten oparty na katalogu domenowym i ten oparty na certyfikacie.
    Właściwym rozwiązaniem przy narzędziu spoza systemu jest przejście na
    certyfikat, a nie odpuszczenie punktu.

    Zmiana zaczyna obowiązywać po ponownym uruchomieniu usługi.

    Czego to nie psuje: uwierzytelniania domenowego, uwierzytelniania
    certyfikatem, pracy programów, sieci, logowania przy maszynie.
  en: |
    The class is "needs review", and the object of the review is the tools joining themselves to this machine.

    The first place is tools from beyond the Windows system: scripts in other tongues, tools of watching and
    answers of rollout that use that manner, it being the simplest to set down. After the change they will cease
    to warrant themselves.

    The second place is joinings to machines beyond the domain, where warranting resting upon the catalogue works
    not and somebody reached for the plain manner as a way round.

    I set down that the other manners of warranting work on, that resting upon the domain's catalogue among them
    and that resting upon a certificate. The right answer at a tool from beyond the system is the passing to a
    certificate and not the letting go of the item.

    The change comes into force after the service is set going anew.

    What this does not break: warranting by the domain, warranting by a certificate, the work of programs, the
    network, or logging on at the machine.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - legacy-authentication
  what_breaks:
    pl:
      - Narzędzia spoza systemu Windows korzystające z tego sposobu przestaną się uwierzytelniać
      - Połączenia do maszyn spoza domeny, w których sposób podstawowy był obejściem, przestaną działać
      - Właściwym rozwiązaniem jest przejście na uwierzytelnianie certyfikatem, a nie odpuszczenie punktu
      - Uwierzytelnianie domenowe i uwierzytelnianie certyfikatem działają dalej
      - Praca programów, sieć, drukowanie i logowanie przy maszynie pozostają bez zmian
    en:
      - Tools from beyond the Windows system using that manner will cease to warrant themselves
      - Joinings to machines beyond the domain, where the plain manner was a way round, will cease to work
      - The right answer is the passing to warranting by a certificate and not the letting go of the item
      - Warranting by the domain and warranting by a certificate work on
      - The work of programs, the network, printing and logging on at the machine stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie nadzoru albo wdrożeniowe spoza systemu Windows łączy się z tą maszyną tym sposobem i nie ma innego
    en:
      - A tool of watching or of rollout from beyond the Windows system joins itself to this machine by that manner and has no other
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowBasic'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowBasic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBasic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Reguła bywa odpuszczana ze względu na narzędzia spoza systemu Windows
    i warto, żeby aplikacja od razu wskazała właściwą alternatywę.
    Uwierzytelnianie certyfikatem działa dla takich narzędzi i nie ma
    wady, o którą tu chodzi.

    Argument wart postawienia dotyczy przekodowania. Hasło w żądaniu jest
    przekodowane, nie zaszyfrowane, a przekodowanie odwraca się jednym
    poleceniem. Warto to napisać wprost, bo zapis wygląda na zaszyfrowany
    i bywa za taki brany.

    Odnotowuję konta miejscowe. Sposób podstawowy otwiera drogę kontom
    omijającym mechanizmy domenowe, więc omija zarówno zasady haseł, jak
    i wykrywanie powtarzanych prób.
  en: |
    The rule is at times let go for the sake of tools from beyond the Windows system, and it is well that the
    application point at once to the right way instead. Warranting by a certificate works for such tools and has
    not the flaw here at stake.

    The argument worth putting touches the turning into other signs. The password in the asking is turned and not
    enciphered, and the turning is undone by one order. It is worth writing outright, the writing looking
    enciphered and being at times taken for such.

    I set down reckonings upon the spot. The plain manner opens a road to reckonings passing by the mechanisms of
    the domain, so it passes by both the rules of passwords and the marking of tries made over and over.
