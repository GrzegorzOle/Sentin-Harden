id: win2025-audit-file-share

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja dostępu do udziałów sieciowych
    en: Audit access to network shares
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje odwołania do udziałów sieciowych tej maszyny —
    kto połączył się z udziałem i czy mu na to pozwolono.

    Na serwerze jest to punkt innej wagi niż na stanowisku roboczym
    i różnica nie wynika z mechanizmu, tylko z tego, co na tych maszynach
    leży. Udział na serwerze to zwykle zbiór danych całej organizacji,
    a nie jeden katalog wymiany. Wykaz odwołań do niego jest więc
    wykazem dostępu do tych danych.

    Osobno warto wymienić udziały administracyjne. Są na każdym serwerze,
    są ukryte i dają dostęp do całych dysków — a ich wykorzystanie jest
    jedną z najczęstszych dróg poruszania się między maszynami
    w sieci. Ta podkategoria jest miejscem, w którym takie odwołanie
    zostawia ślad.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    kopiowania danych z udziałów i wchodzenia na kolejne maszyny przez
    udziały administracyjne, nie zostawiając w zapisie niczego poza
    zdarzeniem logowania sieciowego — które samo w sobie nie mówi,
    do czego sięgnięto.

    Rejestrowanie odmów jest tu równie ważne jak rejestrowanie dostępu
    udanego. Seria odmów z jednego źródła do wielu udziałów jest obrazem
    rozpoznania, a nie pomyłki.
  en: |
    The subcategory records calls on this machine's network shares - who connected to a
    share and whether they were let.

    On a server this is an item of another weight than at a working station, and the
    difference arises not from the mechanism but from what lies on those machines. A share
    on a server is usually a whole organisation's body of data rather than one exchange
    folder. The list of calls on it is thus a list of access to that data.

    Administrative shares are worth naming apart. They are on every server, they are hidden
    and they give access to whole disks - and their use is one of the commonest roads of
    moving between machines on a network. This subcategory is the place at which such a call
    leaves a trace.

    What an attacker gains while the item goes unmet: the means of copying data off shares
    and of coming onto further machines through administrative shares while leaving in the
    record nothing beyond a network sign-in event - which of itself does not say what was
    reached for.

    Recording of refusals matters here as much as recording of successful access. A run of
    refusals from one source across many shares is the picture of reconnaissance rather than
    of a mistake.

disruption_description:
  pl: |
    Sprawdzenia wymaga objętość, bo na serwerze plikowym jest to jedna
    z najobfitszych podkategorii w całym zestawie.

    Nic nie przestaje działać i nikt niczego nie zauważy. Praca
    z udziałami wygląda tak samo — zmienia się wyłącznie to, że odwołania
    są zapisywane.

    Rząd wielkości zależy wprost od tego, do czego ten serwer służy.
    Serwer aplikacyjny z jednym udziałem dopisze zdarzeń niewiele.
    Serwer plikowy obsługujący kilkadziesiąt stanowisk zapisuje zdarzenie
    przy każdym połączeniu z udziałem, a połączenia te nawiązują się
    i zrywają w tle bez udziału człowieka — także wtedy, gdy nikt świadomie
    niczego nie otwiera.

    Dlatego punkt wdraża się razem z powiększeniem dziennika zabezpieczeń
    i po policzeniu, ile danych trafia do systemu zbierającego. Na
    serwerze plikowym to właśnie ta podkategoria zwykle przesądza o całym
    rachunku.

    Zmiana nie wymaga restartu i działa natychmiast.
  en: |
    What needs checking is the volume, since on a file server this is one of the most
    abundant subcategories in the whole set.

    Nothing stops working and nobody notices anything. Working with shares looks just the
    same - what changes is only that the calls are recorded.

    The order of size hangs directly on what the server is for. An application server with
    one share will add few events. A file server serving a few dozen stations records an
    event at every connection to a share, and those connections are made and broken in the
    background with no person's part in it - including when nobody knowingly opens anything.

    Hence the item is rolled out together with the enlarging of the security log and after
    counting how much data goes to the gathering system. On a file server it is exactly this
    subcategory that usually settles the whole bill.

    The change takes no restart and works at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - file-sharing
  what_breaks:
    pl:
      - Brak regresji w działaniu — praca z udziałami wygląda tak samo
      - Na serwerze plikowym zdarzeń przybywa bardzo szybko
      - Połączenia z udziałami nawiązują się w tle, także gdy nikt niczego nie otwiera
      - To zwykle ta podkategoria przesądza o objętości danych w systemie zbierającym
    en:
      - No regression in the working - work with shares looks just the same
      - On a file server events accrue very fast
      - Connections to shares are made in the background, including when nobody opens anything
      - It is usually this subcategory that settles the volume of data in the gathering system
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma domyślny rozmiar i nie ma go jak powiększyć
      - Zdarzenia z tej maszyny są rozliczane objętościowo w systemie zbierającym
    en:
      - The security log is at its default size and there is no way of enlarging it
      - Events from this machine are billed by volume in the gathering system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9224-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9224-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9224-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9224-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9224-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-file-share

notes:
  pl: |
    Punkt dotyczy połączenia z udziałem, a nie dostępu do pojedynczego
    pliku. Wpis mówi, że ktoś sięgnął do udziału — nie mówi, który plik
    otworzył. Zapis szczegółowy jest osobną podkategorią i ma zupełnie
    inną objętość.

    Udziały administracyjne obejmuje ta sama podkategoria. Są ukryte,
    ale nie są wyłączone z zapisu, i to właśnie odwołania do nich są
    w tym wykazie najbardziej warte obejrzenia.

    Punkt czyta się razem z rozmiarem dziennika zabezpieczeń. Na serwerze
    plikowym jest to jedna z dwóch podkategorii — obok inspekcji
    logowania — które ten dziennik zapełniają najszybciej.
  en: |
    The item concerns a connection to a share rather than access to a single file. The entry
    says somebody reached for the share - it does not say which file they opened. The
    detailed record is a separate subcategory and has an altogether different volume.

    Administrative shares are taken in by this same subcategory. They are hidden but are not
    left out of the record, and it is exactly the calls on them that are the most worth
    looking at in this list.

    The item is read together with the security log's size. On a file server it is one of
    two subcategories - beside the auditing of sign-ins - that fill that log the fastest.
