id: win2025-rss-enclosure-download-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > RSS Feeds
  title:
    pl: Pobieranie załączników z kanałów informacyjnych wyłączone
    en: Downloading enclosures from news feeds switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza automatyczne pobieranie plików dołączonych do wpisów
    w kanałach informacyjnych.

    Kategoria średnia, wyższa niż przy pozostałych punktach tego bloku,
    i powód jest jeden: tutaj na dysk trafia plik. Nie lista, nie nazwa,
    nie opis — plik dołączony do wpisu, pobierany bez pytania, na podstawie
    tego, co napisano po drugiej stronie kanału.

    Chcę nazwać, dlaczego to waży mimo pozornej archaiczności mechanizmu.
    Kanał informacyjny jest subskrypcją: raz dodany, pobiera się dalej sam,
    a treść po drugiej stronie zmienia się bez udziału i bez wiedzy tej
    maszyny. Kto kontroluje źródło kanału — albo kto je w danej chwili
    podmieni — decyduje, co zostanie tu pobrane i zapisane. Sama obecność
    pliku na dysku to jeszcze nie wykonanie, ale to jest pierwszy z dwóch
    kroków, a drugi bywa krótki.

    Na serwerze jest jeszcze jedna rzecz warta powiedzenia: składnica
    kanałów jest wspólna dla systemu i bywa czytana przez oprogramowanie,
    które o kanałach nie wie nic poza tym, że to pliki w katalogu
    użytkownika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: mechanizm,
    który sam, cyklicznie i bez udziału człowieka zapisuje na serwerze
    pliki pochodzące z zewnątrz.
  en: |
    The item switches off the automatic downloading of files attached to
    entries in news feeds.

    The category is medium, higher than for the other items of this block,
    and there is one reason: here a file lands on the disk. Not a list, not a
    name, not a description - a file attached to an entry, fetched without
    asking, on the strength of what was written on the other side of the
    feed.

    I want to name why this weighs despite the mechanism looking archaic. A
    news feed is a subscription: once added, it keeps fetching by itself, and
    the content on the other side changes without this machine taking part or
    knowing. Whoever controls the feed's source - or whoever substitutes it
    at a given moment - decides what gets fetched and written here. A file
    merely being on the disk is not yet execution, but it is the first of two
    steps, and the second is sometimes short.

    On a server there is one more thing worth saying: the feed store is
    shared by the system and is sometimes read by software that knows nothing
    about feeds beyond their being files in a user's directory.

    What an attacker gains while the item goes unmet: a mechanism that, by
    itself, on a cycle and without a person taking part, writes files coming
    from outside onto the server.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i uzasadnienie jest tu prostsze niż zwykle:
    na serwerze nikt nie czyta kanałów informacyjnych, a mechanizm jest
    pozostałością po epoce, w której czytnik był częścią przeglądarki
    wbudowanej w system.

    Skutek, gdyby ktoś kanałów używał, jest wąski. Wpisy przychodzą dalej,
    kanał się odświeża, treść widać. Nie pobiera się wyłącznie plik
    dołączony do wpisu — a odsyłacz do niego zostaje, więc kto chce ten
    plik mieć, może go pobrać ręcznie. Różnica polega na tym, że robi to
    wtedy świadomie.

    Czego to nie psuje: żadnej usługi sieciowej, żadnej roli, przeglądania
    stron, pobierania plików w jakikolwiek inny sposób ani zaplanowanych
    zadań pobierających dane.

    Rzecz do zapamiętania: wpis leży w gałęzi po przeglądarce wbudowanej
    w system, mimo że sama przeglądarka od dawna nie jest w niej elementem
    czynnym. Kto szuka go wśród ustawień sieciowych, nie znajdzie go.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption" and the justification here is simpler than
    usual: nobody reads news feeds on a server, and the mechanism is a
    leftover from the era when the reader was part of the browser built into
    the system.

    The effect, were anybody using feeds, is narrow. Entries keep arriving,
    the feed refreshes, the content is visible. The only thing not fetched is
    the file attached to an entry - and the link to it stays, so whoever
    wants that file can fetch it by hand. The difference is that they then do
    it deliberately.

    What this does not break: any network service, any role, browsing pages,
    downloading files in any other way, or scheduled tasks that fetch data.

    Something to remember: the entry lies in the branch left by the browser
    built into the system, even though that browser has long ceased to be an
    active part of it. Anybody looking for it among the network settings will
    not find it.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Plik dołączony do wpisu w kanale informacyjnym przestaje pobierać się sam
      - Wpisy przychodzą dalej, kanał się odświeża, a odsyłacz do pliku zostaje, więc da się go pobrać ręcznie
      - Żadna usługa sieciowa, rola, przeglądanie stron ani zaplanowane zadania pobierające dane nie są tym objęte
      - Wpis leży w gałęzi po przeglądarce wbudowanej w system, nie wśród ustawień sieciowych
    en:
      - A file attached to an entry in a news feed stops being fetched by itself
      - Entries keep arriving, the feed refreshes, and the link to the file stays, so it can be fetched by hand
      - No network service, role, page browsing or scheduled data-fetching task is covered by this
      - The entry lies in the branch left by the browser built into the system, not among the network settings
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa proces oparty na automatycznym pobieraniu plików dołączonych do wpisów w kanale informacyjnym
    en:
      - A process on the machine relies on automatically fetching files attached to entries in a news feed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds'
      $name = 'DisableEnclosureDownload'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds'
    $name = 'DisableEnclosureDownload'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Here a file lands on the disk, fetched without asking on the strength of
    # what was written on the other side of the feed - and a feed is a
    # subscription that keeps fetching by itself. The entries and the link to
    # the file stay; only the automatic fetch goes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEnclosureDownload' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-inetres

notes:
  pl: |
    Wyżej niż pozostałe punkty tego bloku z jednego powodu: tutaj na dysk
    trafia plik. Nie lista, nie nazwa, nie opis — plik pobierany bez
    pytania, na podstawie tego, co napisano po drugiej stronie kanału.

    Kanał jest subskrypcją: raz dodany, pobiera się dalej sam, a treść po
    drugiej stronie zmienia się bez udziału tej maszyny. Kto kontroluje
    źródło, decyduje, co zostanie tu zapisane. Obecność pliku na dysku to
    pierwszy z dwóch kroków, a drugi bywa krótki.

    Mechanizm wygląda archaicznie i rzeczywiście jest pozostałością, ale
    pozostałość działająca sama, cyklicznie i bez udziału człowieka, jest
    warta zamknięcia.
  en: |
    Higher than the other items of this block for one reason: here a file
    lands on the disk. Not a list, not a name, not a description - a file
    fetched without asking, on the strength of what was written on the other
    side of the feed.

    A feed is a subscription: once added, it keeps fetching by itself, and
    the content on the other side changes without this machine taking part.
    Whoever controls the source decides what gets written here. A file being
    on the disk is the first of two steps, and the second is sometimes short.

    The mechanism looks archaic and is indeed a leftover, but a leftover that
    works by itself, on a cycle and without a person taking part, is worth
    closing.
