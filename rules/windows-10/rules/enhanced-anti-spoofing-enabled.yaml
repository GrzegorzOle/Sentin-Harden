id: win10-enhanced-anti-spoofing-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Biometrics > Facial Features
  title:
    pl: Wzmocniona ochrona przed podszyciem przy rozpoznawaniu twarzy
    en: Strengthened protection against spoofing in face recognition
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Logowanie twarzą zastępuje hasło obrazem z kamery. Bez dodatkowego sprawdzenia
    mechanizm porównuje kształt twarzy i na tym poprzestaje — a kształt da się
    pokazać kamerze inaczej niż twarzą.

    Podszycie nie wymaga tu niczego wyszukanego: zdjęcie w wysokiej rozdzielczości,
    nagranie odtworzone na ekranie, wydruk. Materiału dostarcza sam człowiek,
    zwykle publicznie. Skutkiem jest zalogowanie się na cudze konto bez znajomości
    hasła i bez śladu włamania — z punktu widzenia systemu to poprawne logowanie.

    Wzmocnione sprawdzenie bada, czy przed kamerą stoi żywa osoba, a nie obraz.
    Odbiera atakującemu drogę, w której wystarczyło zdjęcie.
  en: |
    Signing in by face replaces a password with a picture from the camera. Without
    an additional check the mechanism compares the shape of a face and stops there
    - and that shape can be shown to a camera by something other than a face.

    Spoofing here calls for nothing elaborate - a high resolution photograph, a
    recording played on a screen, a printout. The material is supplied by the
    person themselves, usually in public. The consequence is signing in to somebody
    else s account without knowing the password and without a trace of a break-in -
    from the system s point of view it is a proper sign-in.

    The strengthened check examines whether a living person stands before the
    camera rather than an image. It takes away the road where a photograph was
    enough.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo nie każda kamera potrafi to sprawdzenie wykonać.
    Wymaga czujnika podczerwieni, a nie zwykłej kamery obrazu.

    Na sprzęcie bez odpowiedniego czujnika skutkiem jest logowanie twarzą, które
    przestaje działać. Użytkownik wraca wtedy do kodu albo hasła — więc nie jest to
    odcięcie od maszyny, ale bywa zgłaszane jako awaria kamery. Warto to sprawdzić
    na modelu sprzętu przed wdrożeniem na cały zestaw stanowisk.

    Na sprzęcie z czujnikiem zmiana jest niewidoczna: logowanie działa jak
    wcześniej, tylko odrzuca obraz zamiast żywej twarzy.
  en: |
    The change calls for a review, because not every camera can carry that check
    out. It needs an infrared sensor rather than an ordinary picture camera.

    On hardware without a suitable sensor the consequence is that signing in by
    face stops working. The user then falls back to a code or a password - so it is
    not being cut off from the machine, but it does get reported as a broken
    camera. It is worth checking on the hardware model before rolling it out to a
    whole set of stations.

    On hardware with the sensor the change is invisible - signing in works as
    before, merely rejecting an image in place of a living face.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Logowanie twarzą przestanie działać na sprzęcie bez czujnika podczerwieni, a użytkownik wróci do kodu albo hasła
      - Objaw bywa zgłaszany jako awaria kamery, choć przyczyną jest wymagane sprawdzenie
      - Kamery zewnętrzne podłączane do stanowiska mogą przestać być przyjmowane jako droga logowania
      - Logowanie kodem, hasłem i odciskiem palca, dostęp do plików i praca użytkownika pozostają bez zmian
    en:
      - Signing in by face stops working on hardware without an infrared sensor, and the user falls back to a code or a password
      - The symptom gets reported as a broken camera, though the cause is the required check
      - External cameras attached to a station may stop being accepted as a road to signing in
      - Signing in by code, password and fingerprint, access to files and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska ze sprzętem bez czujnika podczerwieni, na których logowanie twarzą jest jedyną przyjętą drogą
      - Środowiska dostępności, w których kod i hasło nie są realną drogą zastępczą
    en:
      - Stations with hardware lacking an infrared sensor, where signing in by face is the only accepted road
      - Accessibility environments where a code and a password are not a real fallback road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnhancedAntiSpoofing'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    $name = 'EnhancedAntiSpoofing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnhancedAntiSpoofing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Sprawdzenie wymaga czujnika podczerwieni, więc wynik zasady zależy od modelu
    sprzętu, a nie od samego systemu. Na maszynie bez logowania twarzą ustawienie
    jest zapisem na zapas — nic nie blokuje, ale zamyka drogę na wypadek
    podłączenia kamery w przyszłości.
  en: |
    The check needs an infrared sensor, so the outcome of the rule depends on the
    hardware model rather than on the system alone. On a machine without face
    sign-in the setting is written in reserve - it blocks nothing, but it shuts the
    road against a camera being attached later.
