id: win11-password-minimum-age

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Minimalny okres ważności hasła
    en: Minimum password age
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ten punkt istnieje wyłącznie po to, żeby historia haseł miała sens. Bez
    niego użytkownik zmuszony do zmiany hasła zmienia je tyle razy, ile wynosi
    zapamiętany zakres, i wraca do starego w ciągu minuty. Historia zostaje
    formalnie spełniona, a hasło nie zmieniło się ani razu.

    Wymuszenie odstępu między zmianami odbiera tę możliwość: przejście przez
    historię wymagałoby tylu dni, ile pozycji ma lista. Punkt sam w sobie nie
    zamyka żadnej drogi ataku — pilnuje, żeby nie dało się obejść tego, co ją
    zamyka.
  en: |
    This item exists solely so that password history means something. Without
    it, a user forced to change their password changes it as many times as the
    remembered range and is back on the old one within a minute. The history is
    formally satisfied and the password has not changed once.

    Forcing an interval between changes removes that option: walking through the
    history would take as many days as the list has entries. The item closes no
    attack path by itself - it makes sure the thing that does close one cannot
    be bypassed.

disruption_description:
  pl: |
    Dla użytkownika zmiana jest niewidoczna, dopóki nie zechce zmienić hasła
    dwa razy w ciągu doby. Wtedy druga próba zostanie odrzucona komunikatem,
    który nie mówi wprost, o co chodzi.

    Jeden przypadek jest kłopotliwy: hasło podane komuś przez telefon albo
    ustawione przez administratora do jednorazowego użycia. Użytkownik nie
    będzie mógł zmienić go od razu na własne i przez pełną dobę zostaje przy
    haśle, które zna ktoś jeszcze.
  en: |
    For the user the change is invisible until they want to change their
    password twice within a day. The second attempt is then refused with a
    message that does not state the reason plainly.

    One case is awkward: a password given to somebody over the phone or set by
    an administrator for single use. The user cannot change it to their own
    straight away and stays for a full day on a password somebody else knows.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownik nie zmieni hasła drugi raz tego samego dnia, także po jego zresetowaniu przez administratora
      - Hasło tymczasowe przekazane innym kanałem pozostaje aktywne przez pełną dobę
      - Procedury odzyskiwania dostępu zakładające natychmiastową zmianę hasła wymagają poprawienia
    en:
      - A user cannot change their password twice on the same day, including after an administrator reset
      - A temporary password passed through another channel stays active for a full day
      - Access recovery procedures assuming an immediate password change need adjusting
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Procedura obsługi zgłoszeń opiera się na haśle tymczasowym zmienianym przez użytkownika natychmiast po zalogowaniu
      - Stacja jest zarządzana polityką domeny, która nadpisze ustawienie lokalne przy odświeżeniu
    en:
      - The support procedure relies on a temporary password the user changes immediately after signing in
      - The workstation is managed by a domain policy that overwrites the local setting at the next refresh
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MinimumPasswordAge'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordAge = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-age

notes:
  pl: |
    Wartość musi być mniejsza od maksymalnego okresu ważności, inaczej system
    odmówi przyjęcia polityki. Przy wyłączonym wygasaniu haseł, czyli maksimum
    równym zero, minimum trzeba ustawić najpierw na dopuszczalną wartość albo
    pogodzić się z odmową — to najczęstsza przyczyna niepowodzenia tej naprawy.
  en: |
    The value must be smaller than the maximum age, otherwise the system refuses
    the policy. With password expiry switched off - a maximum of zero - the
    minimum has to be set to an acceptable value first, or the refusal has to be
    accepted; that is the most common reason this remediation fails.
