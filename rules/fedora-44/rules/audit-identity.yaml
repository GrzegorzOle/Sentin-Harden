        a = t[i]
        if (a == "-w") { w = 1; path = t[++i] }
        else if (a == "-p") perm = t[++i]
        else if (a == "-k") i++
        else if (a == "-a" || a == "-A") act = t[++i]
        else if (a == "-S") { x = t[++i]; if (x != "all") sys = sys "," x }
        else if (a == "-C") fl[++nf] = "C:" t[++i]
        else if (a == "-F") {
          f = t[++i]
          if (f ~ /^arch=/) arch = substr(f, 6)
          else if (f ~ /^(key|k)=/) continue
          else if (f ~ /^(path|dir)=/) path = substr(f, index(f, "=") + 1)
          else if (f ~ /^perm=/) perm = substr(f, 6)
          else if (match(f, /^a[0-3][!=<>&]+/)) {
            x = substr(f, RLENGTH + 1)
            if (x ~ /^[0-9]+$/) x = sprintf("0x%x", x + 0); else x = tolower(x)
            sub(/^0x0+/, "0x", x); if (x == "0x") x = "0x0"
            fl[++nf] = "F:" substr(f, 1, RLENGTH) x
          }
          else { if (f ~ /^auid!=(-1|4294967295)$/) f = "auid!=unset"; fl[++nf] = "F:" f }
        }
        else { out[++m] = "O " line; return m }
      }
      if (act == "exit,always") act = "always,exit"
      if (act == "task,never" || act == "never,task") { out[++m] = "T"; return m }
      for (j = 2; j <= nf; j++) { x = fl[j]; for (k = j - 1; k >= 1 && fl[k] > x; k--) fl[k + 1] = fl[k]; fl[k + 1] = x }
      s = ""; for (j = 1; j <= nf; j++) s = s " " fl[j]
      if (path != "" && sys == "" && (w || act == "always,exit")) {
        sub(/\/+$/, "", path); if (path == "") path = "/"
        if (perm == "") perm = "rwxa"
        out[++m] = "W " path s " |" perm; return m
      }
      if (act == "always,exit" && sys != "") {
        ns = split(substr(sys, 2), sy, ",")
        for (j = 1; j <= ns; j++) out[++m] = "S " arch " " sy[j] s
        return m
      }
      out[++m] = "O " line; return m
    }
    FILENAME == ARGV[1] {
      c = canon($0, r)
      for (i = 1; i <= c; i++) {
        x = r[i]
        if (x == "T") tn = 1
        else if (x ~ /^W /) { p = index(x, " |"); wk = substr(x, 1, p - 1); have[wk] = have[wk] substr(x, p + 2) }
        else have[x] = 1
      }
      next
    }
    {
      c = canon($0, r); miss = 0
      for (i = 1; i <= c; i++) {
        x = r[i]
        if (x ~ /^W /) {
          p = index(x, " |"); wk = substr(x, 1, p - 1); pe = substr(x, p + 2)
          if (!(wk in have)) { miss = 1; continue }
          for (j = 1; j <= length(pe); j++) if (index(have[wk], substr(pe, j, 1)) == 0) miss = 1
        } else if (!(x in have)) miss = 1
      }
      if (c && miss) print "MISS " $0
    }
    END { if (tn) print "TASKNEVER" }'
    umin() { local v=""; [ -r /etc/login.defs ] && v=$(awk '$1 == "UID_MIN" { v = $2 } END { print v }' /etc/login.defs); case "$v" in ''|*[!0-9]*) v=1000 ;; esac; echo "$v"; }
    # want: the rule lines for this machine, with the syscalls its tables know
    want() {
      local u l a s n ok p
      u=$(umin)
      while IFS= read -r l; do
        [ -n "$l" ] || continue
        l=${l//%UID_MIN%/$u}
        # a watch needs its parent directory (dir= the directory itself)
        p=$(printf '%s\n' "$l" | sed -n 's/^-w \([^ ]*\).*/\1/p; s/.* -F path=\([^ ]*\).*/\1/p')
        if [ -n "$p" ]; then [ -d "$(dirname "$p")" ] || continue; fi
        p=$(printf '%s\n' "$l" | sed -n 's/.* -F dir=\([^ ]*\).*/\1/p')
        if [ -n "$p" ]; then [ -d "$p" ] || continue; fi
        case "$l" in
          *' -S '*)
            a=$(printf '%s\n' "$l" | sed -n 's/.*-F arch=\(b[0-9]*\).*/\1/p')
            s=$(printf '%s\n' "$l" | sed 's/.* -S \([^ ]*\).*/\1/')
            ok=""
            for n in ${s//,/ }; do ausyscall --exact "${a:-b64}" "$n" >/dev/null 2>&1 && ok="$ok,$n"; done
            [ -n "$ok" ] || continue
            l=$(printf '%s\n' "$l" | sed "s/ -S [^ ]*/ -S ${ok#,}/")
            ;;
        esac
        printf '%s\n' "$l"
      done <<< "$wl"
    }
    # rulesin SKIP: every rules.d file except SKIP, as one rule list
    rulesin() { local f; for f in "$d"/*.rules; do [ -e "$f" ] || continue; [ "$f" = "$1" ] && continue; cat "$f"; echo; done; }
    # cover LIST: MISS lines of want not covered by LIST, TASKNEVER if LIST has it
    cover() { local t; t=$(mktemp); printf '%s\n' "$1" > "$t"; want | awk "$aawk" "$t" -; rm -f "$t"; }
    installed() { command -v auditctl >/dev/null 2>&1 && command -v ausyscall >/dev/null 2>&1; }
    private() { [ -d /etc/audit ] && { [ ! -x /etc/audit ] || { [ -d "$d" ] && { [ ! -r "$d" ] || [ ! -x "$d" ]; }; }; }; }
    evaluate() {
      local r m run
      installed || { echo "NOT_OK:audit-not-installed"; return; }
      if private; then echo "NOT_OK:needs-root"; return; fi
      [ -d "$d" ] || { echo "NOT_OK:no-rules-dir"; return; }
      r=$(cover "$(rulesin)")
      m=$(printf '%s\n' "$r" | grep -c '^MISS ' || true)
      if [ "$m" -gt 0 ]; then echo "NOT_OK:missing=$m$(printf '%s\n' "$r" | grep -q '^TASKNEVER' && echo ,task-never)"; return; fi
      if printf '%s\n' "$r" | grep -q '^TASKNEVER'; then echo "NOT_OK:task-never"; return; fi
      if run=$(auditctl -l 2>/dev/null) && auditctl -s >/dev/null 2>&1; then
        r=$(cover "$run")
        m=$(printf '%s\n' "$r" | grep -c '^MISS ' || true)
        if [ "$m" -gt 0 ]; then echo "NOT_OK:not-loaded=$m"; return; fi
        if printf '%s\n' "$r" | grep -q '^TASKNEVER'; then echo "NOT_OK:task-never-loaded"; return; fi
        echo "OK:rules=$(want | grep -c .),loaded"
      else
        echo "OK:rules=$(want | grep -c .),loaded=unknown"
      fi
    }
    # fput FILE: stdin into FILE keeping its owner, mode and label
    fput() { local t; t=$(mktemp); cat > "$t"; cmp -s "$t" "$1" || cat "$t" > "$1"; rm -f "$t"; }
    tnfiles() { grep -lE '^[[:space:]]*-a[[:space:]]+(task,never|never,task)([[:space:]]|$)' "$d"/*.rules 2>/dev/null || true; }
    tnmarked() { grep -lF "$mark" "$d"/*.rules 2>/dev/null || true; }
    tnoff() { local f; for f in $(tnfiles); do sed -E "s/^([[:space:]]*-a[[:space:]]+(task,never|never,task)([[:space:]].*)?)$/$mark\\1/" "$f" | fput "$f"; echo "Commented out -a task,never in $f"; done; }
    tnon() {
      local f
      for f in "$d"/*.rules; do
        [ -e "$f" ] || continue
        head -n 1 "$f" | grep -q '^# Sentin-Harden: fedora44-.*; rollback removes this file$' && return 0
      done
      for f in $(tnmarked); do awk -v m="$mark" 'index($0, m) == 1 { $0 = substr($0, length(m) + 1) } { print }' "$f" | fput "$f"; echo "Restored -a task,never in $f"; done
    }
    # aload: load the rules when the kernel lets us; 1 when augenrules fails
    aload() {
      local s
      if ! s=$(auditctl -s 2>/dev/null); then echo "audit-rules.service loads the rules at the next start"; return 0; fi
      if printf '%s\n' "$s" | awk '$1 == "enabled" && $2 == "2" { f = 1 } END { exit !f }'; then
        echo "The audit configuration is locked (enabled 2); restart the computer to load the rules"; return 0
      fi
      augenrules --load >/dev/null 2>&1 || return 1
      echo "Loaded the audit rules with augenrules"
    }
      sed -n 1p "$b" | grep -qx 'format=audit-rules-1' || { echo "Backup file is damaged: $b" >&2; exit 1; }
      os=$(sed -n 2p "$b")
      case "$os" in
        'own absent') [ "$(wc -l < "$b")" -eq 2 ] || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
        'own present') if tail -n +3 "$b" | grep -qv '^| '; then echo "Backup file is damaged: $b" >&2; exit 1; fi ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      # putback: the saved own file back, or none
      putback() {
        if [ "$os" = 'own present' ]; then
          if [ ! -e "$own" ]; then (umask 027; : > "$own"); fi
          tail -n +3 "$b" | sed 's/^| //' | fput "$own"
        else
          rm -f "$own"
        fi
      }
      installed || { echo "audit is not installed; install it first" >&2; exit 1; }
      miss=$(cover "$(rulesin "$own")" | sed -n 's/^MISS //p')
      if [ -n "$miss" ]; then
        [ -e "$own" ] || (umask 027; : > "$own")
        { printf '%s\n' "$head"; printf '%s\n' "$miss"; } | fput "$own"
        echo "Wrote $(printf '%s\n' "$miss" | grep -c .) rules to $own"
      else
        rm -f "$own"; echo "Other files already have these rules"
      fi
      tn=$(tnoff)
      [ -z "$tn" ] || printf '%s\n' "$tn"
      r=$(evaluate)
      case "$r" in OK:*|NOT_OK:not-loaded*|NOT_OK:task-never-loaded) ;; *)
        putback; tnon >/dev/null
        echo "Rules still not in place ($r); restored the previous state" >&2; exit 1 ;;
      esac
      if ! aload; then
        putback; tnon >/dev/null; aload >/dev/null || true
        echo "augenrules --load failed; restored the previous state" >&2; exit 1
      fi
      if [ -n "$tn" ]; then echo "Restart the computer so that processes started earlier are audited too"; fi
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
    export LC_ALL=C
    d=/etc/audit/rules.d
    own=$d/50-sentin-harden-audit-identity.rules
    head='# Sentin-Harden: fedora44-audit-identity (CIS 6.3.3.8); rollback removes this file'
    mark='# Sentin-Harden: audit-task-never: '
    wl='-w /etc/group -p wa -k identity
    -w /etc/passwd -p wa -k identity
    -w /etc/gshadow -p wa -k identity
    -w /etc/shadow -p wa -k identity
    -w /etc/security/opasswd -p wa -k identity
    -w /etc/nsswitch.conf -p wa -k identity
    -w /etc/pam.conf -p wa -k identity
    -w /etc/pam.d -p wa -k identity'
    aawk='function canon(line, out,   t, n, i, a, act, arch, sys, path, perm, w, nf, fl, j, k, x, s, m, ns, sy, f) {
      split("", out); split("", fl); m = 0
      sub(/^[ \t]+/, "", line); sub(/[ \t\r]+$/, "", line)
      if (line == "" || line ~ /^#/) return 0
      n = split(line, t, /[ \t]+/)
      act = ""; arch = ""; sys = ""; path = ""; perm = ""; w = 0; nf = 0
      for (i = 1; i <= n; i++) {
        a = t[i]
        if (a == "-w") { w = 1; path = t[++i] }
        else if (a == "-p") perm = t[++i]
        else if (a == "-k") i++
        else if (a == "-a" || a == "-A") act = t[++i]
        else if (a == "-S") { x = t[++i]; if (x != "all") sys = sys "," x }
        else if (a == "-C") fl[++nf] = "C:" t[++i]
        else if (a == "-F") {
          f = t[++i]
          if (f ~ /^arch=/) arch = substr(f, 6)
          else if (f ~ /^(key|k)=/) continue
          else if (f ~ /^(path|dir)=/) path = substr(f, index(f, "=") + 1)
          else if (f ~ /^perm=/) perm = substr(f, 6)
          else if (match(f, /^a[0-3][!=<>&]+/)) {
            x = substr(f, RLENGTH + 1)
            if (x ~ /^[0-9]+$/) x = sprintf("0x%x", x + 0); else x = tolower(x)
            sub(/^0x0+/, "0x", x); if (x == "0x") x = "0x0"
            fl[++nf] = "F:" substr(f, 1, RLENGTH) x
          }
          else { if (f ~ /^auid!=(-1|4294967295)$/) f = "auid!=unset"; fl[++nf] = "F:" f }
        }
        else { out[++m] = "O " line; return m }
      }
      if (act == "exit,always") act = "always,exit"
      if (act == "task,never" || act == "never,task") { out[++m] = "T"; return m }
      for (j = 2; j <= nf; j++) { x = fl[j]; for (k = j - 1; k >= 1 && fl[k] > x; k--) fl[k + 1] = fl[k]; fl[k + 1] = x }
      s = ""; for (j = 1; j <= nf; j++) s = s " " fl[j]
      if (path != "" && sys == "" && (w || act == "always,exit")) {
        sub(/\/+$/, "", path); if (path == "") path = "/"
        if (perm == "") perm = "rwxa"
        out[++m] = "W " path s " |" perm; return m
      }
      if (act == "always,exit" && sys != "") {
        ns = split(substr(sys, 2), sy, ",")
        for (j = 1; j <= ns; j++) out[++m] = "S " arch " " sy[j] s
        return m
      }
      out[++m] = "O " line; return m
    }
    FILENAME == ARGV[1] {
      c = canon($0, r)
      for (i = 1; i <= c; i++) {
        x = r[i]
        if (x == "T") tn = 1
        else if (x ~ /^W /) { p = index(x, " |"); wk = substr(x, 1, p - 1); have[wk] = have[wk] substr(x, p + 2) }
        else have[x] = 1
      }
      next
    }
    {
      c = canon($0, r); miss = 0
      for (i = 1; i <= c; i++) {
        x = r[i]
        if (x ~ /^W /) {
          p = index(x, " |"); wk = substr(x, 1, p - 1); pe = substr(x, p + 2)
          if (!(wk in have)) { miss = 1; continue }
          for (j = 1; j <= length(pe); j++) if (index(have[wk], substr(pe, j, 1)) == 0) miss = 1
        } else if (!(x in have)) miss = 1
      }
      if (c && miss) print "MISS " $0
    }
    END { if (tn) print "TASKNEVER" }'
    umin() { local v=""; [ -r /etc/login.defs ] && v=$(awk '$1 == "UID_MIN" { v = $2 } END { print v }' /etc/login.defs); case "$v" in ''|*[!0-9]*) v=1000 ;; esac; echo "$v"; }
    # want: the rule lines for this machine, with the syscalls its tables know
    want() {
      local u l a s n ok p
      u=$(umin)
      while IFS= read -r l; do
        [ -n "$l" ] || continue
        l=${l//%UID_MIN%/$u}
        # a watch needs its parent directory (dir= the directory itself)
        p=$(printf '%s\n' "$l" | sed -n 's/^-w \([^ ]*\).*/\1/p; s/.* -F path=\([^ ]*\).*/\1/p')
        if [ -n "$p" ]; then [ -d "$(dirname "$p")" ] || continue; fi
        p=$(printf '%s\n' "$l" | sed -n 's/.* -F dir=\([^ ]*\).*/\1/p')
        if [ -n "$p" ]; then [ -d "$p" ] || continue; fi
        case "$l" in
          *' -S '*)
            a=$(printf '%s\n' "$l" | sed -n 's/.*-F arch=\(b[0-9]*\).*/\1/p')
            s=$(printf '%s\n' "$l" | sed 's/.* -S \([^ ]*\).*/\1/')
            ok=""
            for n in ${s//,/ }; do ausyscall --exact "${a:-b64}" "$n" >/dev/null 2>&1 && ok="$ok,$n"; done
            [ -n "$ok" ] || continue
            l=$(printf '%s\n' "$l" | sed "s/ -S [^ ]*/ -S ${ok#,}/")
            ;;
        esac
        printf '%s\n' "$l"
      done <<< "$wl"
    }
    # rulesin SKIP: every rules.d file except SKIP, as one rule list
    rulesin() { local f; for f in "$d"/*.rules; do [ -e "$f" ] || continue; [ "$f" = "$1" ] && continue; cat "$f"; echo; done; }
    # cover LIST: MISS lines of want not covered by LIST, TASKNEVER if LIST has it
    cover() { local t; t=$(mktemp); printf '%s\n' "$1" > "$t"; want | awk "$aawk" "$t" -; rm -f "$t"; }
    installed() { command -v auditctl >/dev/null 2>&1 && command -v ausyscall >/dev/null 2>&1; }
    private() { [ -d /etc/audit ] && { [ ! -x /etc/audit ] || { [ -d "$d" ] && { [ ! -r "$d" ] || [ ! -x "$d" ]; }; }; }; }
    evaluate() {
      local r m run
      installed || { echo "NOT_OK:audit-not-installed"; return; }
      if private; then echo "NOT_OK:needs-root"; return; fi
      [ -d "$d" ] || { echo "NOT_OK:no-rules-dir"; return; }
      r=$(cover "$(rulesin)")
      m=$(printf '%s\n' "$r" | grep -c '^MISS ' || true)
      if [ "$m" -gt 0 ]; then echo "NOT_OK:missing=$m$(printf '%s\n' "$r" | grep -q '^TASKNEVER' && echo ,task-never)"; return; fi
      if printf '%s\n' "$r" | grep -q '^TASKNEVER'; then echo "NOT_OK:task-never"; return; fi
      if run=$(auditctl -l 2>/dev/null) && auditctl -s >/dev/null 2>&1; then
        r=$(cover "$run")
        m=$(printf '%s\n' "$r" | grep -c '^MISS ' || true)
        if [ "$m" -gt 0 ]; then echo "NOT_OK:not-loaded=$m"; return; fi
        if printf '%s\n' "$r" | grep -q '^TASKNEVER'; then echo "NOT_OK:task-never-loaded"; return; fi
        echo "OK:rules=$(want | grep -c .),loaded"
      else
        echo "OK:rules=$(want | grep -c .),loaded=unknown"
      fi
    }
    # fput FILE: stdin into FILE keeping its owner, mode and label
    fput() { local t; t=$(mktemp); cat > "$t"; cmp -s "$t" "$1" || cat "$t" > "$1"; rm -f "$t"; }
    tnfiles() { grep -lE '^[[:space:]]*-a[[:space:]]+(task,never|never,task)([[:space:]]|$)' "$d"/*.rules 2>/dev/null || true; }
    tnmarked() { grep -lF "$mark" "$d"/*.rules 2>/dev/null || true; }
    tnoff() { local f; for f in $(tnfiles); do sed -E "s/^([[:space:]]*-a[[:space:]]+(task,never|never,task)([[:space:]].*)?)$/$mark\\1/" "$f" | fput "$f"; echo "Commented out -a task,never in $f"; done; }
    tnon() {
      local f
      for f in "$d"/*.rules; do
        [ -e "$f" ] || continue
        head -n 1 "$f" | grep -q '^# Sentin-Harden: fedora44-.*; rollback removes this file$' && return 0
      done
      for f in $(tnmarked); do awk -v m="$mark" 'index($0, m) == 1 { $0 = substr($0, length(m) + 1) } { print }' "$f" | fput "$f"; echo "Restored -a task,never in $f"; done
    }
    # aload: load the rules when the kernel lets us; 1 when augenrules fails
    aload() {
      local s
      if ! s=$(auditctl -s 2>/dev/null); then echo "audit-rules.service loads the rules at the next start"; return 0; fi
      if printf '%s\n' "$s" | awk '$1 == "enabled" && $2 == "2" { f = 1 } END { exit !f }'; then
        echo "The audit configuration is locked (enabled 2); restart the computer to load the rules"; return 0
      fi
      augenrules --load >/dev/null 2>&1 || return 1
      echo "Loaded the audit rules with augenrules"
    }
      sed -n 1p "$b" | grep -qx 'format=audit-rules-1' || { echo "Backup file is damaged: $b" >&2; exit 1; }
      os=$(sed -n 2p "$b")
      case "$os" in
        'own absent') [ "$(wc -l < "$b")" -eq 2 ] || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
        'own present') if tail -n +3 "$b" | grep -qv '^| '; then echo "Backup file is damaged: $b" >&2; exit 1; fi ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      # putback: the saved own file back, or none
      putback() {
        if [ "$os" = 'own present' ]; then
          if [ ! -e "$own" ]; then (umask 027; : > "$own"); fi
          tail -n +3 "$b" | sed 's/^| //' | fput "$own"
        else
          rm -f "$own"
        fi
      }
      if [ -e "$own" ] && [ "$(head -n 1 "$own")" != "$head" ]; then
        echo "Kept $own: changed since the remediation; -a task,never stays commented out"
      else
        putback
        if [ "$os" = 'own present' ]; then echo "Restored $own"; else echo "Removed $own"; fi
        tnon
      fi
      aload || { echo "augenrules --load failed" >&2; exit 1; }
    )

privileges: root
runnable: true

