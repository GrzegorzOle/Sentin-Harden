id: win11-builtin-administrator-renamed

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora przemianowane
    en: The built-in administrator account renamed
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Każda maszyna z tym systemem ma wbudowane konto administratora, założone
    w chwili instalacji i nazwane domyślnie tak samo na wszystkich maszynach
    świata. Konta tego nie da się usunąć ani zablokować przez wielokrotne
    nieudane logowanie — a to znaczy, że jest ono jedynym celem, o którym
    napastnik wie z góry i który na pewno istnieje.

    Zgadywanie hasła do takiego konta jest tanie. Napastnik nie musi ustalać
    nazwy, nie musi się obawiać zablokowania i może próbować powoli, przez
    tygodnie, rozkładając próby tak, żeby nie rzucały się w oczy. Narzędzia
    robiące to seryjnie, na wielu maszynach naraz, są publicznie dostępne
    i wbudowana nazwa jest w nich wpisana domyślnie.

    Przemianowanie konta nie jest zabezpieczeniem mocnym i nie należy go za
    takie uważać — identyfikator wewnętrzny konta pozostaje ten sam i da się go
    odczytać, jeżeli napastnik ma już w sieci jakiekolwiek konto. Zabiera
    jednak punkt zaczepienia temu, kto jeszcze niczego nie ma, a to jest
    właśnie ta grupa, z którą maszyna styka się najczęściej.

    Punkt wymaga, żeby konto nosiło nazwę inną niż domyślna.
  en: |
    Every machine with this system has a built-in administrator account, created at
    installation and named, by default, the same on every machine in the world. The
    account cannot be deleted or locked by repeated failed sign-ins - which means it
    is the one target an attacker knows of in advance and which certainly exists.

    Guessing that account's password is cheap. The attacker need not work out the
    name, need not fear a lockout and can try slowly, over weeks, spreading the
    attempts so that they do not stand out. Tools doing this in series, across many
    machines at once, are publicly available and have the built-in name written into
    them by default.

    Renaming the account is not a strong safeguard and should not be taken for one -
    the account's internal identifier stays the same and can be read if the attacker
    already holds any account on the network. But it takes the foothold away from
    whoever holds nothing yet, and that is exactly the group the machine meets most
    often.

    The item requires the account to bear a name other than the default one.

disruption_description:
  pl: |
    Zmiana dotyka konta, do którego odwołują się narzędzia i ludzie, więc wymaga
    świadomego wdrożenia — nie ze względu na restart, tylko ze względu na to,
    co może się o nią potknąć.

    Pierwsze w kolejności są skrypty i narzędzia z nazwą konta wpisaną na
    sztywno: instalatory uruchamiane na koncie wbudowanym, zadania zaplanowane,
    narzędzia obsługi informatycznej, procedury odzyskiwania po awarii.
    Wszystko, co odwołuje się do konta po nazwie, przestanie je znajdować.

    Drugie to ludzie. Nazwa konta ratunkowego bywa zapisana w procedurach,
    w magazynie haseł i w pamięci osób, które z niego korzystają raz na rok —
    dokładnie wtedy, gdy nie ma czasu na szukanie. Przemianowanie bez
    uaktualnienia tych zapisów potrafi zamienić konto ratunkowe w konto
    nieosiągalne.

    Trzecie to wdrożenie masowe. Nadanie wszystkim maszynom tej samej nowej
    nazwy odtwarza dokładnie ten stan, który punkt miał usunąć — nazwa znów
    jest jedna i znów da się ją zgadnąć. Sensowne wdrożenie wiąże nazwę
    z maszyną albo z organizacją.

    Dla zwykłego użytkownika nie zmienia się nic. Konto jest domyślnie
    wyłączone i nikt się na nim nie loguje.

    Nie ma restartu.
  en: |
    The change touches an account that tools and people refer to, so it calls for a
    deliberate rollout - not for a restart's sake but for what may trip over it.

    First in line are scripts and tools with the account's name written hard into
    them: installers run on the built-in account, scheduled tasks, support tools,
    recovery procedures. Everything referring to the account by name stops finding it.

    Second are people. The name of the break-glass account is often written in
    procedures, in a password store and in the memory of those who use it once a year
    - exactly when there is no time to search. Renaming without updating those records
    can turn a break-glass account into an unreachable one.

    Third is the mass rollout. Giving every machine the same new name rebuilds exactly
    the state the item was to remove - the name is one again and can be guessed again.
    A sensible rollout ties the name to the machine or to the organisation.

    For an ordinary user nothing changes. The account is off by default and nobody
    signs in on it.

    There is no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
  what_breaks:
    pl:
      - Skrypty i zadania odwołujące się do konta po nazwie przestaną je znajdować
      - Procedury odzyskiwania po awarii z zapisaną nazwą konta przestaną być aktualne
      - Wpis w magazynie haseł wskazujący konto po nazwie wymaga poprawienia
      - Zwykli użytkownicy nie zauważą niczego, bo na tym koncie się nie logują
    en:
      - Scripts and tasks referring to the account by name stop finding it
      - Recovery procedures with the account's name written in them stop being current
      - An entry in the password store naming the account needs correcting
      - Ordinary users notice nothing, because they do not sign in on this account
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzia obsługi odwołują się do konta wbudowanego po nazwie i nie da się ich poprawić
      - Procedura odzyskiwania po awarii wskazuje to konto po nazwie i nie została jeszcze uaktualniona
    en:
      - Support tools refer to the built-in account by name and cannot be corrected
      - The recovery procedure names this account and has not yet been updated
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The built-in account is found by the ending of its identifier, not by
      # name. The default names below are written without letters outside the
      # basic alphabet, so that the check does not depend on the encoding in
      # which the command reaches the shell.
      $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
      if ($null -eq $account) { 'CHECK_ERROR' }
      elseif ($account.Name -match '^(administrator|administrador|administrateur|amministratore|rendszergazda)$') { 'DEFAULT_NAME' }
      else { 'RENAMED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: RENAMED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    if ($null -eq $account) { throw 'The built-in administrator account was not found.' }
    [pscustomobject]@{
      sid  = $account.SID.Value
      name = $account.Name
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The name below is a starting point. Pick one of the organisation's own,
    # and do not give every machine the same one.
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    if ($null -eq $account) { throw 'The built-in administrator account was not found.' }
    Rename-LocalUser -SID $account.SID -NewName 'adm-local'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $account = Get-LocalUser | Where-Object { $_.SID.Value -eq $b.sid }
    if ($null -eq $account) { throw 'The account from the backup was not found.' }
    Rename-LocalUser -SID $account.SID -NewName $b.name

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-rename-administrator-account

notes:
  pl: |
    Reguła szuka konta po końcówce jego identyfikatora, a nie po nazwie. Jest to
    jedyny sposób, który działa na maszynie już przemianowanej i na maszynie
    z systemem w innym języku — po przemianowaniu nazwa nie mówi nic, a przed
    przemianowaniem zależy od języka instalacji.

    Nazwy domyślne, z którymi reguła porównuje, obejmują najczęstsze wersje
    językowe. Lista nie jest pełna i nie może być — konto nazwane domyślnie
    w rzadkiej wersji językowej zostanie zaraportowane jako przemianowane.
    Jest to świadomie przyjęta granica: pomyłka w tę stronę daje wynik zbyt
    łagodny, ale nie każe nikomu przemianowywać konta już przemianowanego.

    Przemianowanie nie zmienia identyfikatora wewnętrznego i nie ukrywa konta
    przed kimś, kto ma już dostęp do maszyny albo do sieci. Punkt ma sens wobec
    prób z zewnątrz, a nie wobec rozpoznania prowadzonego od środka —
    i właśnie dlatego jego waga jest oceniona jako średnia, a nie wysoka.

    Naprawa nadaje nazwę przykładową. Przed wdrożeniem na wielu maszynach trzeba
    ją zastąpić własną, i to różną dla różnych maszyn albo wyprowadzoną z ich
    nazw.
  en: |
    The rule looks for the account by the ending of its identifier rather than by
    name. It is the only way that works on a machine already renamed and on a machine
    with the system in another language - after renaming the name says nothing, and
    before renaming it depends on the language of the install.

    The default names the rule compares against cover the commonest language
    versions. The list is not complete and cannot be - an account bearing its default
    name in a rare language version will be reported as renamed. It is a deliberately
    accepted bound: an error in that direction gives too mild a result, but it never
    tells anyone to rename an account that is already renamed.

    Renaming does not change the internal identifier and does not hide the account
    from somebody who already has access to the machine or the network. The item makes
    sense against attempts from outside rather than against reconnaissance carried out
    from within - and that is exactly why its weight is judged medium rather than
    high.

    The remediation gives an example name. Before a rollout across many machines it
    has to be replaced with one of the organisation's own, and one that differs
    between machines or is derived from their names.
