id: win11-local-account-sharing-model-classic

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta lokalne uwierzytelniane po sobie, a nie sprowadzane do gościa
    en: Local accounts authenticated as themselves rather than reduced to a guest
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy ktoś sięga przez sieć po udział na tej maszynie, podaje nazwę konta
    i hasło. System może potraktować to na dwa sposoby. Pierwszy: sprawdzić
    podane poświadczenia i przyznać dostęp temu konkretnemu kontu. Drugi:
    zignorować, kto się przedstawił, i obsłużyć każdego jako gościa.

    Drugi sposób jest ustawieniem domyślnym maszyn spoza domeny i został
    pomyślany jako uproszczenie dla sieci domowych. W każdym innym miejscu
    odbiera zabezpieczeniom sens. Uprawnienia nadane pojedynczym kontom
    przestają cokolwiek znaczyć, bo nikt nie występuje pod swoim kontem —
    wszyscy są gościem. Hasło przestaje być potrzebne, bo i tak nie jest
    sprawdzane w sposób, który miałby wpływ na wynik.

    Skutek widać najwyraźniej w dzienniku. Zapis mówi, że udział otworzył
    gość — i tyle wiadomo. Kto to był naprawdę, nie zostaje nigdzie
    odnotowane, więc nie da się ani rozliczyć dostępu, ani zauważyć, że sięga
    po niego ktoś obcy.

    Punkt przywraca uwierzytelnianie po sobie. Konto podane przy połączeniu
    jest tym kontem, którego uprawnienia obowiązują i które trafia do dziennika.
  en: |
    When somebody reaches a share on this machine over the network, they give an
    account name and a password. The system can treat that in two ways. The first:
    check the credentials given and grant access to that particular account. The
    second: ignore who introduced themselves and serve everyone as a guest.

    The second way is the default on machines outside a domain and was meant as a
    simplification for household networks. Anywhere else it takes the sense out of the
    safeguards. Rights granted to single accounts stop meaning anything, because
    nobody appears under their own account - everyone is the guest. A password stops
    being needed, because it is not checked in a way that affects the outcome anyway.

    The effect shows most plainly in the log. The record says a guest opened the share
    - and that is all that is known. Who it really was is recorded nowhere, so access
    can neither be accounted for nor noticed when a stranger reaches for it.

    The item restores authentication as oneself. The account given at connection is
    the account whose rights hold and which reaches the log.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś nie sięga po udziały na tej maszynie bez
    podawania prawdziwych poświadczeń.

    Na stanowisku w domenie zmiana nie zmienia zwykle nic — tam
    uwierzytelnianie po sobie jest już ustawieniem obowiązującym. Poza domeną
    bywa inaczej i to jest właśnie ten przypadek, na który trzeba spojrzeć.

    Po wdrożeniu przestanie działać sięganie po udział na koncie, którego na tej
    maszynie nie ma, oraz na koncie istniejącym, ale z niewłaściwym hasłem.
    Dotychczas takie połączenie przechodziło jako gość; teraz zostanie odrzucone.
    Objawem jest pytanie o poświadczenia w miejscu, w którym dotąd nikt o nic
    nie pytał — albo odmowa dostępu w skrypcie, który poświadczeń nie podaje.

    Dotyczy to przede wszystkim drukarek i skanerów zapisujących pliki na
    udział, urządzeń przemysłowych, starszych aplikacji i skryptów kopiujących
    dane między maszynami spoza domeny. Naprawą jest założenie konta dla takiego
    urządzenia i podanie mu poświadczeń, a nie cofnięcie punktu.

    Nie ma restartu.
  en: |
    What needs checking is whether anybody reaches the shares on this machine without
    giving real credentials.

    At a station in a domain the change usually changes nothing - there authentication
    as oneself already holds. Outside a domain it can be otherwise, and that is
    exactly the case to look at.

    After the rollout, reaching a share under an account that does not exist on this
    machine, or under one that exists but with the wrong password, stops working.
    Until now such a connection went through as a guest; now it is refused. The
    symptom is a request for credentials where nothing used to be asked - or a refusal
    of access in a script that gives no credentials.

    This concerns printers and scanners writing files to a share, industrial devices,
    older applications and scripts copying data between machines outside a domain
    above all. The fix is setting up an account for such a device and giving it
    credentials, not undoing the item.

    There is no restart.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - legacy-authentication
  what_breaks:
    pl:
      - Sięganie po udział na koncie nieistniejącym na tej maszynie przestanie przechodzić
      - Skaner zapisujący pliki na udział bez poświadczeń zgłosi odmowę dostępu
      - Skrypt kopiujący dane między maszynami spoza domeny zacznie wymagać hasła
      - Urządzenia przemysłowe łączące się bez podawania konta stracą dostęp
    en:
      - Reaching a share under an account that does not exist on this machine stops going through
      - A scanner writing files to a share without credentials reports a refusal of access
      - A script copying data between machines outside a domain starts requiring a password
      - Industrial devices connecting without giving an account lose access
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Urządzenia biurowe zapisują pliki na udziale tej maszyny bez podawania poświadczeń
      - Maszyna pracuje poza domeną i udziały są świadomie otwarte dla wszystkich w sieci lokalnej
    en:
      - Office devices write files to this machine's share without giving credentials
      - The machine works outside a domain and the shares are deliberately open to everyone on the local network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero means every account is authenticated as itself; one reduces each
      # network logon with a local account to the guest.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'ForceGuest'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'ForceGuest'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'ForceGuest' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-sharing-and-security-model-for-local-accounts

notes:
  pl: |
    Punkt bywa mylony z wyłączeniem konta gościa, które ma osobną regułę.
    Wyłączenie konta zamyka jedną tożsamość; ten punkt rozstrzyga, czy pozostałe
    tożsamości w ogóle są sprawdzane. Maszyna z wyłączonym gościem
    i sprowadzaniem do gościa odrzuca dostęp zamiast go przyznawać — objaw
    wygląda wtedy jak zepsute udostępnianie, a przyczyną są dwa ustawienia
    naraz.

    Brak wpisu znaczy, że obowiązuje wartość domyślna, a ta zależy od tego, czy
    maszyna należy do domeny. Reguła traktuje brak jako niezgodność właśnie
    dlatego: stan zależny od przynależności nie jest stanem ustalonym.

    Punkt dotyczy wyłącznie kont lokalnych sięgających po zasoby przez sieć.
    Logowania lokalnego i kont domenowych nie obejmuje.

    Gałąź urzędu zabezpieczeń lokalnych jest wspólna z kilkunastoma innymi
    ustawieniami, więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The item is sometimes confused with switching the guest account off, which has a
    rule of its own. Switching the account off closes one identity; this item settles
    whether the remaining identities are checked at all. A machine with the guest
    switched off and reduction to the guest in force refuses access rather than
    granting it - the symptom then looks like broken sharing, and the cause is two
    settings at once.

    A missing entry means the default holds, and that depends on whether the machine
    belongs to a domain. The rule counts a missing entry as a deviation for exactly
    that reason: a state depending on membership is not a settled state.

    The item concerns local accounts reaching resources over the network alone. It
    does not cover local sign-in or domain accounts.

    The local security authority's key is shared with a dozen or so other settings, so
    rollback removes the entry alone.
