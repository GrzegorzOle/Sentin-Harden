id: win2016-local-account-sharing-model-classic

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta lokalne uwierzytelniane po sobie, a nie sprowadzane do gościa
    en: Local accounts authenticated as themselves rather than reduced to a guest
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, jak maszyna traktuje logowanie sieciowe na koncie
    lokalnym: czy uwierzytelnia je jako to konkretne konto, czy sprowadza do
    gościa niezależnie od podanego hasła.

    Wariant sprowadzający do gościa powstał dla wygody w małych sieciach bez
    domeny. Miał zdejmować kłopot zakładania tych samych kont na każdej
    maszynie. Cena była jednak taka, że hasło przestawało mieć znaczenie —
    każdy, kto sięgnął po zasób, dostawał uprawnienia gościa, a podane
    poświadczenia szły do kosza.

    Na serwerze skutki są dwa i oba dotkliwe. Pierwszy: nie da się nadać
    uprawnień konkretnemu kontu lokalnemu, bo każde połączenie wygląda tak samo.
    Wszystko, co gość może, może każdy w zasięgu sieci.

    Drugi jest cichszy i dlatego gorszy. Dziennik zapisuje wtedy gościa, a nie
    osobę. Zdarzenie dostępu przestaje wskazywać na kogokolwiek, a odtworzenie
    przebiegu incydentu na podstawie takich wpisów jest niemożliwe. Zapis
    istnieje, ale nie odpowiada na jedyne pytanie, dla którego go prowadzono.

    W roczniku 2016 wariant ten bywa odziedziczony po maszynie wyjętej kiedyś
    z domeny albo po zasadach przeniesionych ze starszej instalacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    wszystkiego, co udostępniono gościowi, bez znajomości hasła — i pewność,
    że dziennik nie wskaże na niego.
  en: |
    The setting decides how the machine treats a network sign-in on a local account:
    whether it authenticates it as that particular account, or reduces it to a guest
    whatever password was given.

    The variant that reduces to a guest arose for convenience in small networks
    without a domain. It was to take away the trouble of creating the same accounts
    on every machine. The price, though, was that the password ceased to matter -
    anybody reaching for a resource got a guest's rights, and the credentials given
    went into the bin.

    On a server the effects are two and both are severe. The first: rights cannot be
    granted to a particular local account, since every connection looks the same.
    Whatever a guest may do, anybody within reach of the network may do.

    The second is quieter and worse for that. The log then records a guest and not a
    person. An access event ceases to point at anybody, and reconstructing the
    course of an incident from such entries is impossible. The record exists, but it
    does not answer the one question it was kept for.

    In the 2016 vintage this variant is at times inherited from a machine once taken
    out of a domain, or from policy carried over from an older installation.

    What an attacker gains while the item goes unmet: access to everything opened up
    to the guest, without knowing a password - and the certainty that the log will
    not point at them.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i jest to jedna z niewielu reguł, w której
    skutek bywa natychmiastowy i szeroki. Po zmianie połączenia sieciowe
    przestają być sprowadzane do gościa i zaczynają wymagać prawdziwego
    konta z prawdziwym hasłem.

    Wszystko, co dotąd działało dlatego, że uprawnienia gościa wystarczały,
    przestaje działać w tej samej chwili. Nie ma tu okresu przejściowego.

    Najczęstsze przypadki są trzy. Pierwszy: udziały używane przez ludzi,
    którzy nie mają konta na tej maszynie i dotąd nie musieli go mieć. Drugi:
    urządzenia i oprogramowanie łączące się bez poświadczeń. Trzeci:
    zaplanowane zadania i skrypty na innych maszynach, które sięgają do
    zasobów tej maszyny, opierając się na tym, że i tak wejdą jako gość.

    Warto wiedzieć, że zmiana nie działa, dopóki konto gościa jest wyłączone —
    a na serwerze zwykle jest. W takiej sytuacji ustawienie jest formalnie
    niezgodne, ale bez skutku eksploatacyjnego, bo gość i tak nikogo nie
    wpuszcza. To rozróżnienie decyduje o tym, czy wdrożenie będzie bezbolesne,
    czy nie, i trzeba je ustalić przed zmianą.

    Czego to nie psuje: dostępu na kontach domenowych, zasad grupy, pracy
    usług lokalnych ani logowania do konsoli.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and it is one of the few rules whose effect can be
    immediate and wide. After the change, network connections cease to be reduced to
    a guest and begin to call for a real account with a real password.

    Everything that worked until now because a guest's rights sufficed stops working
    in the same moment. There is no transition period here.

    The three commonest cases are these. First: shares used by people who have no
    account on this machine and until now did not need one. Second: devices and
    software connecting without credentials. Third: scheduled tasks and scripts on
    other machines that reach this machine's resources resting on the fact that they
    will get in as a guest anyway.

    It is worth knowing that the change has no effect so long as the guest account
    is switched off - and on a server it usually is. In that situation the setting
    is formally non-compliant but without operational effect, since the guest lets
    nobody in regardless. That distinction decides whether the rollout will be
    painless or not, and has to be established before the change.

    What this does not break: access on domain accounts, group policy, the working
    of local services, or signing in at the console.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - legacy-authentication
    - logging-and-audit
  what_breaks:
    pl:
      - Osoby sięgające do udziałów bez konta na tej maszynie tracą dostęp w tej samej chwili, bez okresu przejściowego
      - Urządzenia i oprogramowanie łączące się bez poświadczeń przestają wchodzić na uprawnieniach gościa
      - Zadania i skrypty na innych maszynach, opierające się na wejściu jako gość, przestają sięgać do zasobów tej maszyny
      - Dostęp na kontach domenowych, zasady grupy i logowanie do konsoli pozostają bez zmian
    en:
      - People reaching shares without an account on this machine lose access in the same moment, with no transition period
      - Devices and software connecting without credentials stop getting in on a guest's rights
      - Tasks and scripts on other machines resting on getting in as a guest stop reaching this machine's resources
      - Access on domain accounts, group policy and signing in at the console stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Konto gościa jest włączone i korzystają z niego ludzie albo urządzenia bez własnych kont na tej maszynie
      - Nie ustalono, kto sięga do udziałów tej maszyny bez podania konta lokalnego
    en:
      - The guest account is switched on and is used by people or devices without accounts of their own on this machine
      - It has not been established who reaches this machine's shares without giving a local account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero means every account is authenticated as itself; one reduces each
      # network logon with a local account to the guest.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'ForceGuest'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'ForceGuest'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From here on a network sign-in with a local account is authenticated as that
    # account. The password starts to matter and the log starts to name a person.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ForceGuest' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-sharing-and-security-model-for-local-accounts

notes:
  pl: |
    Skutek tej reguły zależy od tego, czy konto gościa jest włączone.
    Przy koncie wyłączonym zmiana jest formalnością bez skutku; przy włączonym
    potrafi odciąć dostęp szerokim frontem. Aplikacja powinna pokazywać ten
    punkt razem z regułą o wyłączeniu konta gościa i czytać je łącznie.

    Druga wartość tej reguły jest dowodowa i warto ją podnieść w raporcie
    osobno. Dopóki połączenia idą jako gość, dziennik nie wskazuje na osobę,
    więc wszystkie reguły inspekcji dotyczące dostępu do plików opisują wtedy
    ruch anonimowy. Ta reguła przywraca im sens.

    Wynik zgodny nie mówi nic o tym, czy uprawnienia na udziałach są właściwe.
    Mówi tylko, że wiadomo, komu przysługują.
  en: |
    This rule's effect depends on whether the guest account is switched on. With the
    account off the change is a formality without effect; with it on it can cut off
    access on a wide front. The application should show this item together with the
    rule on disabling the guest account and read them jointly.

    The rule's second worth is evidential and is worth raising separately in the
    report. So long as connections come in as a guest, the log points at no person,
    so all the audit rules on access to files describe anonymous traffic. This rule
    gives them back their sense.

    A compliant result says nothing about whether the rights on the shares are the
    proper ones. It says only that it is known to whom they belong.
