id: win11-vbs-secure-launch

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Bezpieczny start warstwy wirtualizacji włączony
    en: Secure launch of the virtualisation layer switched on
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe uruchamiać warstwę wirtualizacji, na której opiera się
    ochrona sprzętowa systemu, w trybie zabezpieczonego startu — czyli tak,
    żeby jej uruchomienie było potwierdzone przez procesor, niezależnie od
    tego, co wykonało się wcześniej.

    Warto powiedzieć, przed czym to broni, bo problem jest subtelny.
    Pozostałe reguły dotyczące ochrony opartej na wirtualizacji zakładają, że
    warstwa wirtualizacji wystartowała uczciwie. Jeżeli napastnik zdołał
    zmienić coś w tym, co wykonuje się przed systemem — oprogramowanie
    układowe, program rozruchowy, sterownik ładowany bardzo wcześnie — może
    tę warstwę podstawić albo osłabić, zanim cokolwiek zacznie ją
    kontrolować. Wszystko, co na niej stoi, chroni wtedy pozornie.

    Zabezpieczony start przenosi punkt zaufania z oprogramowania na procesor.
    Warstwa wirtualizacji jest uruchamiana w wydzielonym, mierzonym przez
    sprzęt przebiegu, a stan tego, co wykonało się wcześniej, przestaje
    decydować o jej uczciwości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podważenia całej ochrony sprzętowej z poziomu rozruchu, czyli w miejscu,
    w którym żaden mechanizm działający w systemie jeszcze nie patrzy. Jest to
    droga trudna, wymagająca dostępu wcześniejszego niż system — ale też
    droga, po której przejście nie zostawia śladu w niczym, co system później
    zapisze.
  en: |
    The setting has the virtualisation layer on which the system's hardware protection
    rests started in secure launch mode - that is, so that its start is confirmed by the
    processor, whatever ran before it.

    It is worth saying what this guards against, since the problem is subtle. The other
    rules about protection resting on virtualisation assume that the virtualisation layer
    started honestly. If an attacker has managed to change something in what runs before
    the system - the firmware, the boot program, a driver loaded very early - they may
    substitute or weaken that layer before anything begins to watch it. Everything
    standing on it then guards only in appearance.

    Secure launch moves the point of trust from software to the processor. The
    virtualisation layer is started in a separate run measured by the hardware, and the
    state of what ran before stops deciding its honesty.

    What an attacker gains while the item goes unmet: the means of undermining the whole
    hardware protection from the level of boot, that is, at a place where no mechanism
    working in the system is yet looking. It is a hard route, taking access earlier than
    the system - but also a route whose passage leaves no trace in anything the system
    later records.

disruption_description:
  pl: |
    Świadomego wdrożenia wymaga tu sprzęt, bo to od niego zależy, czy zmiana
    będzie niewidoczna, czy maszyna przestanie się uruchamiać.

    Zabezpieczony start wymaga procesora i oprogramowania układowego, które go
    obsługują, oraz włączonych ustawień w oprogramowaniu układowym. Na sprzęcie
    starszym ustawienie zostanie zapisane, ale nie zadziała — maszyna
    uruchomi się normalnie, a ochrona pozostanie w stanie poprzednim. Jest to
    wynik mylący, bo zasada wygląda wtedy na wdrożoną.

    Poważniejszy jest przypadek sprzętu częściowo zgodnego, gdzie warstwa
    wirtualizacji uruchamia się inaczej niż dotąd. Skutkiem bywa brak startu
    systemu albo nierozpoznanie urządzenia, którego sterownik nie spełnia
    wymagań stawianych kodowi ładowanemu wcześnie.

    Dotyczy to szczególnie sterowników starszych urządzeń peryferyjnych,
    kart rozszerzeń i sprzętu przemysłowego. Ich autorzy nie zawsze nadążają
    za wymaganiami stawianymi kodowi uruchamianemu w tym trybie.

    Zmiana wymaga restartu i sprawdzenia dopiero po nim. Wdrożenie na wielu
    maszynach naraz bez uprzedniego sprawdzenia na jednej jest ryzykiem
    nieproporcjonalnym do zysku — maszyna, która się nie uruchomi, wymaga
    obsługi na miejscu.

    Po uruchomieniu praca użytkownika nie zmienia się w żaden sposób.
  en: |
    A conscious rollout takes here the hardware, since it is on that that whether the
    change is invisible or the machine stops starting depends.

    Secure launch takes a processor and firmware that support it, and the settings in the
    firmware switched on. On older hardware the setting will be written but will not work
    - the machine will start normally and the protection will stay in its former state. It
    is a misleading result, since the policy then looks applied.

    Weightier is the case of partly compatible hardware, where the virtualisation layer
    starts otherwise than until now. The effect is sometimes a failure of the system to
    start, or a device going unrecognised whose driver does not meet the demands laid on
    code loaded early.

    This concerns above all drivers of older peripherals, expansion cards and industrial
    equipment. Their authors do not always keep up with the demands laid on code started
    in this mode.

    The change takes a restart and can be checked only after it. Rolling it out to many
    machines at once without first checking on one is a risk out of proportion to the gain
    - a machine that will not start takes attention on the spot.

    Once it has started, the user's work does not change in any way.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Na sprzęcie częściowo zgodnym maszyna może się nie uruchomić po restarcie
      - Sterowniki starszych urządzeń peryferyjnych i kart rozszerzeń mogą przestać być ładowane
      - Na sprzęcie starszym ustawienie zostanie zapisane, ale nie zadziała
      - Po prawidłowym uruchomieniu praca użytkownika nie zmienia się w żaden sposób
    en:
      - On partly compatible hardware the machine may fail to start after a restart
      - Drivers of older peripherals and expansion cards may stop being loaded
      - On older hardware the setting will be written but will not work
      - Once it has started correctly, the user's work does not change in any way
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Sprzęt albo oprogramowanie układowe nie obsługuje zabezpieczonego startu
      - Na maszynie pracują urządzenia ze starszymi sterownikami ładowanymi wcześnie
      - Wdrożenie miałoby objąć wiele maszyn naraz bez sprawdzenia na jednej
    en:
      - The hardware or firmware does not support secure launch
      - Devices with older drivers loaded early work on the machine
      - The rollout would cover many machines at once with no check on one
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ConfigureSystemGuardLaunch'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    $current = (Get-ItemProperty -Path $path -Name 'ConfigureSystemGuardLaunch' -ErrorAction SilentlyContinue).'ConfigureSystemGuardLaunch'
    [pscustomobject]@{
      path        = $path
      name        = 'ConfigureSystemGuardLaunch'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The effect appears only after a restart, and the machine may fail to
    # start where the hardware or an early driver does not meet the demands.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConfigureSystemGuardLaunch' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/system-guard-secure-launch-and-smm-protection

notes:
  pl: |
    Zapis w rejestrze mówi, czego chce zasada, a nie co się faktycznie dzieje
    przy starcie. Na sprzęcie bez wymaganej obsługi obie rzeczy się rozjeżdżają
    i reguła wypada zgodna mimo że ochrona nie działa. Potwierdzenie stanu
    faktycznego trzeba odczytać z informacji o zabezpieczeniach urządzenia po
    restarcie — sprawdzenie w tej regule tego nie zastępuje.

    Punkt opiera się na pozostałych regułach dotyczących ochrony opartej na
    wirtualizacji i sam z siebie niczego nie włącza. Wdrożony tam, gdzie
    warstwa wirtualizacji nie jest włączona, nie ma czego zabezpieczać.

    Wycofanie zmiany wymaga restartu i na maszynie, która przestała się
    uruchamiać, trzeba je wykonać z poziomu środowiska odzyskiwania.
    Warto to przewidzieć przed wdrożeniem, a nie po.
  en: |
    The registry entry says what the policy wants, not what actually happens at start. On
    hardware without the required support the two part ways and the rule comes out
    compliant although the protection does not work. Confirmation of the state of fact has
    to be read from the device security information after a restart - the check in this
    rule does not stand in for that.

    The item rests on the other rules about protection resting on virtualisation and
    switches nothing on of itself. Applied where the virtualisation layer is not switched
    on, it has nothing to secure.

    Undoing the change takes a restart, and on a machine that has stopped starting it has
    to be done from the recovery environment. That is worth foreseeing before the rollout
    rather than after.
