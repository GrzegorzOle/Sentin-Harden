id: win2025-system-objects-default-permissions-strengthened

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wzmocnione uprawnienia domyślne wewnętrznych obiektów systemu
    en: Strengthened default permissions on the system's internal objects
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wzmacnia uprawnienia nadawane domyślnie wewnętrznym
    obiektom systemu w przestrzeni nazw dzielonej przez wszystkie
    procesy.

    Przestrzeń ta jest miejscem, w którym programy zostawiają swoje
    obiekty: nazwane zdarzenia, sekcje pamięci, dowiązania do urządzeń.
    Bez wzmocnienia proces zwykłego użytkownika może w niej tworzyć
    obiekty w miejscach, do których sięgają procesy o wyższych
    uprawnieniach.

    Stąd bierze się droga eskalacji, i warto ją opisać, bo bez tego
    punkt wygląda na porządkowy. Napastnik pracujący na koncie bez
    uprawnień zakłada obiekt o nazwie, po którą sięgnie usługa
    systemowa, zanim ta zdąży założyć swój. Usługa, pracująca
    z uprawnieniami systemu, otwiera obiekt cudzy i przez niego daje
    się skierować tam, gdzie napastnik chce — na przykład na plik, który
    napastnik wskazał dowiązaniem.

    Wzmocnienie odbiera tę możliwość, oddzielając to, co wolno tworzyć
    procesom zwykłym, od tego, po co sięgają procesy uprzywilejowane.

    Na serwerze rzecz waży więcej, bo więcej jest jednoczesnych
    uczestników tej przestrzeni. Serwer z rolą pulpitów zdalnych trzyma
    w niej sesje wielu osób naraz, a serwer aplikacyjny — usługi różnych
    dostawców, pracujące obok siebie i nie wiedzące o sobie nic. To
    właśnie sąsiedztwo, a nie sama liczba procesów, jest tu źródłem
    ryzyka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podłożenia obiektu w miejsce, po które sięgnie proces
    o wyższych uprawnieniach, a więc drogę podniesienia własnych
    uprawnień bez łamania żadnego hasła.
  en: |
    The setting strengthens the rights given by default to the system's inward objects in the
    namespace shared by every process.

    That space is where programs leave their objects: named events, sections of memory, links to
    devices. Without the strengthening a plain user's process may make objects in it at places
    the processes of higher rights reach for.

    Thence comes a road of escalation, and it is worth setting down, for without it the item
    looks like one of good order. An attacker working under an account without rights makes an
    object by a name a system service will reach for, before that service manages to make its
    own. The service, working with the system's rights, opens another's object and through it
    lets itself be steered where the attacker wills - onto a file, say, the attacker named by a
    link.

    The strengthening takes that means away, keeping apart what plain processes may make from
    what privileged processes reach for.

    On a server the matter weighs more, there being more takers in that space at once. A server
    under the part of remote desktops holds in it the sessions of many people at a time, and an
    application server - the services of different makers, working side by side and knowing
    nothing of one another. It is that neighbourhood, and not the count of processes, that is
    here the source of the risk.

    What an attacker gains while the item goes unmet: the means of laying an object at a place a
    process of higher rights will reach for, and so a road to raising their own rights with no
    password broken.

disruption_description:
  pl: |
    Sprawdzenia wymagają dwie rzeczy: to, że zmiana zaczyna działać
    dopiero po ponownym uruchomieniu maszyny, oraz aplikacje starsze
    dzielące pamięć przez przestrzeń globalną.

    Powód pierwszy jest tym, dla którego podniosłem klasę względem
    paczki stanowiska roboczego. Serwer pracuje miesiącami, a jego
    restart jest zdarzeniem planowanym. Zmiana, która bez restartu nie
    działa, nie należy na serwerze do trybu zbiorczego, bo jej
    zastosowanie i jej zadziałanie to dwa różne momenty — a między nimi
    raport pokazywałby stan zgodny, którego system jeszcze nie
    egzekwuje.

    Stan zgodny jest jednocześnie stanem domyślnym systemu, więc
    niezgodność oznacza zwykle wpis wprowadzony ręcznie — najczęściej
    dawno, pod aplikację, której już nie ma.

    Programy pisane zgodnie z zasadami tego systemu zakładają swoje
    obiekty we własnej przestrzeni sesji, a nie w przestrzeni globalnej,
    i wzmocnienia nie zauważą.

    Przypadkiem do rozważenia — choć nie dość częstym, żeby podnosić
    klasę — jest aplikacja starsza, która dzieli pamięć między procesem
    usługi a procesem pracującym w sesji użytkownika i robi to przez
    obiekt zakładany w przestrzeni globalnej. Bywa to spotykane
    w oprogramowaniu przemysłowym i w starszych systemach bazowych. Taka
    aplikacja może po zmianie stracić dostęp do własnego obiektu.

    Objaw jest wtedy jednoznaczny i pojawia się od razu: proces
    w sesji użytkownika zgłasza odmowę dostępu przy otwieraniu obiektu,
    a nie po czasie i nie w sposób zależny od obciążenia.

    Zmiana wymaga ponownego uruchomienia maszyny, bo wartość czyta
    menedżer sesji przy starcie. Do tego czasu nic się nie dzieje,
    więc samą zmianę można wykonać kiedykolwiek, a zaplanować trzeba
    tylko restart.

    Wycofanie przywraca wartość natychmiast, ale zachowanie systemu
    wraca dopiero po ponownym uruchomieniu.
  en: |
    Two things need checking: that the change begins working only after a fresh start of the
    machine, and older applications sharing memory through the global space.

    The first is why I raised the class against the working station's pack. A server works for
    months and its restart is a planned happening. A change that does not work without a restart
    does not belong on a server in the bulk mode, its applying and its working being two
    different moments - and between them a report would show a compliant state the system does
    not yet enforce.

    The compliant state is at once the system's default, so non-compliance usually means an entry
    made by hand - most often long ago, for an application no longer there.

    Programs written by this system's rules make their objects in their own session's space and
    not in the global one, and will not mark the strengthening.

    A case to be weighed - though not common enough to raise the class - is an older application
    that shares memory between a service's process and a process working in a user's session, and
    does so through an object made in the global space. It is met with in industrial software and
    in older base systems. Such an application may after the change lose the way to its own
    object.

    The symptom is then plain and shows at once: the process in the user's session reports a
    refusal of access at the opening of the object, not after a time and not in a way hanging on
    the load.

    The change takes a fresh start of the machine, the session manager reading the value at its
    starting. Until then nothing happens, so the change itself may be made at any time and only
    the restart must be planned.

    The undoing restores the value at once, but the system's behaviour comes back only after a
    fresh start.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - virtualization-and-containers
  what_breaks:
    pl:
      - Aplikacja starsza dzieląca pamięć przez obiekt w przestrzeni globalnej może stracić do niego dostęp
      - Objawem jest odmowa dostępu przy otwieraniu obiektu, widoczna od razu
      - Programy zakładające obiekty we własnej przestrzeni sesji nie zauważą zmiany
      - Wartość czyta menedżer sesji przy starcie, więc do ponownego uruchomienia nic się nie dzieje
    en:
      - An older application sharing memory through an object in the global space may lose the way to it
      - The symptom is a refusal of access at the opening of the object, seen at once
      - Programs making objects in their own session's space will not mark the change
      - The session manager reads the value at its starting, so nothing happens until a fresh start
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje aplikacja dzieląca pamięć między usługą a sesją użytkownika przez obiekt w przestrzeni globalnej
    en:
      - An application sharing memory between a service and a user's session through an object in the global space works on the server
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
      $name = 'ProtectionMode'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    $name = 'ProtectionMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ProtectionMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/system-objects-strengthen-default-permissions-of-internal-system-objects

notes:
  pl: |
    Punkt wygląda na porządkowy, dopóki nie opisze się drogi eskalacji,
    którą zamyka: podłożenie obiektu w miejsce, po które sięgnie proces
    o uprawnieniach systemu.

    Na serwerze waży więcej z powodu sąsiedztwa — usługi różnych
    dostawców i sesje wielu osób dzielą tę samą przestrzeń nazw i nie
    wiedzą o sobie nic.

    Stan zgodny jest stanem domyślnym. Niezgodność oznacza zwykle wpis
    wprowadzony ręcznie dawno temu, pod aplikację, której już nie ma —
    warto to sprawdzić, zanim się go cofnie.

    Klasę podniosłem względem paczki stanowiska roboczego z powodu
    restartu. Między zapisaniem wartości a jej zadziałaniem raport
    pokazywałby stan zgodny, którego system jeszcze nie egzekwuje.
  en: |
    The item looks like one of good order until the road of escalation it shuts is set down: the
    laying of an object at a place a process of the system's rights will reach for.

    On a server it weighs more by reason of neighbourhood - the services of different makers and
    the sessions of many people share the same namespace and know nothing of one another.

    The compliant state is the default one. Non-compliance usually means an entry made by hand
    long ago, for an application no longer there - it is worth checking that before undoing it.

    I raised the class against the working station's pack by reason of the restart. Between the
    writing of the value and its working, a report would show a compliant state the system does
    not yet enforce.
