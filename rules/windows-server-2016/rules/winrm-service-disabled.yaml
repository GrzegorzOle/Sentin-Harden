id: win2016-winrm-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania poleceniami wyłączona
    en: The service for remote management by commands disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przyjmującą zdalne polecenia zarządzające. Usługa
    ta pozwala wykonać na tej maszynie polecenie wydane z innej, i jest to
    wykonanie pełnoprawne, z uprawnieniami konta, które się przedstawiło.

    Wartość tego punktu leży w tym, czym ta droga jest z punktu widzenia
    kogoś, kto już zdobył poświadczenia. Nie musi wnosić na maszynę
    żadnego narzędzia: wszystko, czego potrzebuje, jest na niej i czeka na
    polecenie. Uruchomienie kodu wygląda przy tym jak zwykła czynność
    administracyjna, bo nią formalnie jest.

    Rzecz druga dotyczy śladu. Polecenie wykonane tą drogą zostawia mniej
    niż program uruchomiony na miejscu — nie ma pliku, nie ma instalacji,
    nie ma wpisu w spisie oprogramowania. Jest to droga cicha i właśnie
    dlatego chętnie używana po wejściu.

    Na maszynie zarządzanej z konsoli albo narzędziem własnym usługa ta
    niczego nie wnosi. Na maszynie zarządzanej zdalnie jest natomiast
    warunkiem pracy i punkt ten jest na niej niewykonalny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowe,
    ciche wykonanie kodu z uprawnieniami zdobytego konta, bez wnoszenia
    czegokolwiek na maszynę.
  en: |
    The item switches off the service taking in remote management commands. That service lets a command
    issued from another machine be carried out on this one, and it is a full carrying out, with the
    rights of the account that presented itself.

    This item's value lies in what that road is from the point of view of somebody who has already got
    credentials. They need bring no tool onto the machine: everything they need is on it and waiting for
    a command. The running of code looks besides like an ordinary administrative act, being formally
    just that.

    The second matter concerns the trace. A command carried out by that road leaves less than a program
    run on the spot - there is no file, no installation, no entry in the inventory of software. It is a
    quiet road and for just that reason a favoured one after an entry.

    On a machine administered from a console or by a tool of one's own that service brings nothing. On a
    machine administered remotely it is on the other hand a condition of work, and this item is on it
    not feasible.

    What an attacker gains while the item goes unmet: a ready, quiet running of code with the rights of
    a won account, bringing nothing onto the machine.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a szczególną jej cechą jest to, że
    wykonanie może odciąć drogę do cofnięcia.

    Warunek pierwszy jest właśnie tym. Jeżeli maszyna jest administrowana
    tą drogą, wyłączenie usługi zabiera dostęp — i zabiera go razem
    z możliwością włączenia jej z powrotem tą samą drogą. Przed wykonaniem
    trzeba mieć pewność, że istnieje droga inna: konsola, karta
    zarządzania, dostęp fizyczny.

    Warunek drugi dotyczy narzędzi. Zarządzanie konfiguracją, narzędzia
    inwentaryzacyjne, agenty monitorujące i część procedur kopii zapasowej
    korzystają z tej usługi, często bez wiedzy tego, kto je wdrażał. Objaw
    pojawia się przy następnym przebiegu, a więc niekoniecznie od razu.

    Warunek trzeci dotyczy domeny. Część zadań wykonywanych na maszynach
    członkowskich przez skrypty centralne idzie właśnie tą drogą.

    Czego to nie psuje: pulpitu zdalnego, logowania, udziałów plikowych,
    aplikacji, sieci, dzienników.

    Wymaga zatrzymania usługi; cofnięcie natychmiastowe, o ile jest czym.
  en: |
    The class is "needs a planned rollout", and its particular feature is that the carrying out may cut
    off the road to an undoing.

    The first condition is just that. If the machine is administered by that road, switching the service
    off takes the access away - and takes it away along with the possibility of switching it back on by
    that same road. Before carrying this out one must be sure another road exists: a console, a
    management card, physical access.

    The second condition concerns tools. Configuration management, inventory tools, monitoring agents
    and some backup procedures use that service, often without the knowledge of whoever rolled them out.
    The symptom appears at the next run, and so not necessarily at once.

    The third condition concerns the domain. Some tasks carried out on member machines by central
    scripts go by just that road.

    What this does not break: the remote desktop, logging on, file shares, applications, the network, or
    the logs.

    Calls for a service to be stopped; the undoing is immediate, so far as there is anything to undo it
    with.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - Maszyna administrowana tą drogą traci dostęp razem z możliwością włączenia usługi z powrotem tą samą drogą
      - Zarządzanie konfiguracją, narzędzia inwentaryzacyjne i agenty monitorujące przestają sięgać do maszyny
      - Objaw pojawia się przy następnym przebiegu narzędzia, a więc niekoniecznie od razu
      - Zadania wykonywane na maszynach członkowskich przez skrypty centralne przestają dochodzić
      - Pulpit zdalny, logowanie, udziały plikowe, aplikacje i dzienniki pozostają bez zmian
    en:
      - A machine administered by that road loses its access along with the possibility of switching the service back on by that same road
      - Configuration management, inventory tools and monitoring agents cease to reach the machine
      - The symptom appears at a tool's next run, and so not necessarily at once
      - Tasks carried out on member machines by central scripts cease to arrive
      - The remote desktop, logging on, file shares, applications and the logs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest administrowana tą drogą, a nie ma konsoli ani karty zarządzania jako drogi zapasowej
      - Zarządzanie konfiguracją, agent monitorujący albo procedura kopii zapasowej korzysta z tej usługi
      - Skrypty centralne wykonują na tej maszynie zadania tą drogą
    en:
      - The machine is administered by that road and there is no console or management card as a road in reserve
      - Configuration management, a monitoring agent or a backup procedure uses that service
      - Central scripts carry out tasks on this machine by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'WinRM' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # If this machine is administered remotely, this cuts the way in and the
    # change cannot be undone the same way. Make sure another road exists -
    # a console, a management card - before carrying this out.
    Stop-Service -Name 'WinRM' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinRM' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'WinRM' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/portal

notes:
  pl: |
    Punkt jest w tym bloku jedyny, którego wykonanie może odciąć drogę do
    jego własnego cofnięcia, i warto to w interfejsie postawić przed
    wszystkim innym. Reguła ma zdefiniowaną kopię i wycofanie, więc przycisk
    uruchomienia jest dostępny — ale dostępność przycisku nie znaczy, że
    wycofanie da się wykonać zdalnie po tym, jak zdalny dostęp zniknął.

    Jest to dobry przykład granicy między dwiema osiami. Odwracalność jest
    natychmiastowa w sensie technicznym: jedna wartość, jedno polecenie.
    Koszt wdrożenia leży gdzie indziej — w tym, czy jest kto to polecenie
    wyda i skąd.

    Warto też pokazać opóźnienie objawu. Narzędzia korzystające z tej drogi
    działają cyklicznie, więc wyłączenie usługi objawia się przy następnym
    przebiegu, a nie od razu. Maszyna po zmianie wygląda na zdrową
    i dopiero po dobie okazuje się, że przestała być inwentaryzowana albo
    kopiowana.

    Poziom drugi jest uzasadniony tym, że punkt zakłada maszynę zarządzaną
    inaczej. W środowiskach zarządzanych centralnie odpuszczenie go
    z zapisanym uzasadnieniem jest wynikiem prawidłowym, a nie brakiem.
  en: |
    The item is in this block the only one whose carrying out may cut off the road to its own undoing,
    and that is worth putting in the interface before all else. The rule has a defined backup and
    rollback, so the run button is to be had - but the button's availability does not mean the undoing
    can be carried out remotely after the remote access has gone.

    It is a good example of the line between the two axes. The reversibility is immediate in the
    technical sense: one value, one command. The rollout's cost lies elsewhere - in whether there is
    anybody to issue that command, and from where.

    Worth showing too is the delay in the symptom. Tools using that road work on a cycle, so the
    service's being switched off shows at the next run rather than at once. The machine after the change
    looks healthy, and only after a day does it turn out it has ceased to be inventoried or backed up.

    Level two is warranted by the item assuming a machine administered otherwise. In centrally managed
    surroundings letting it go with a written justification is a proper outcome rather than a want.
