id: win10-domain-secure-channel-signed-when-possible

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera podpisywany, gdy druga strona to potrafi
    en: The secure channel to the controller signed where the other side can
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna podpisuje ruch w kanale do kontrolera
    zawsze, gdy druga strona podpisywanie obsługuje.

    Różnica wobec reguły poprzedniej leży w jednym słowie. Tamta wymaga
    ochrony i zrywa rozmowę, gdy ustalić jej się nie da. Ta mówi: ustal, gdy
    można, a gdy nie można, rozmawiaj dalej.

    Znaczy to, że sama z siebie napastnika nie zatrzymuje. Kto stoi w środku
    rozmowy, może udać stronę, która podpisywania nie obsługuje, i ochrona
    zostanie pominięta zgodnie z regułą.

    Wartość tego punktu jest więc inna, niż sugeruje nazwa. Nie jest to
    zabezpieczenie; jest to ustawienie domyślnego zachowania na takie, które
    ochronę wybiera, gdy tylko jest dostępna. Nabiera znaczenia w zestawieniu
    z regułą wymagającą — razem dają stan, w którym ochrona jest i wybierana,
    i egzekwowana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozmowę
    maszyny z kontrolerem prowadzoną bez podpisu nawet wtedy, gdy obie strony
    podpisywanie obsługują.
  en: |
    The setting makes the machine sign the traffic in the channel to the controller whenever the other side
    serves signing.

    What parts it from the foregoing rule lies in a single word. That one calls for the guard and breaks off the
    conversation where none can be settled upon. This one says: settle upon it where you can, and where you
    cannot, speak on.

    Which means it does not of itself stop an attacker. Whoever stands in the middle of the conversation can
    feign a side that does not serve signing, and the guard will be left out according to the rule.

    This item's value is therefore other than its name suggests. It is not a safeguard; it is a setting of the
    default behaviour to one that chooses the guard wherever it is to be had. It takes on meaning beside the
    rule that requires - together they give a state in which the guard is both chosen and enforced.

    What an attacker gains while the item goes unmet: the machine's conversation with the controller carried on
    without a signature even where both sides serve signing.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślna i reguła zwykle potwierdza stan zastany.

    Ustawienie z definicji nie zrywa żadnej rozmowy: podpisuje, gdy można,
    a gdy nie można, rozmawia dalej. Nie ma więc przypadku, w którym coś
    po nim przestaje działać.

    Koszt obliczeniowy podpisywania tego kanału jest pomijalny, bo ruch
    w nim jest rzadki i krótki — są to zapytania o konta i zasady, nie
    przesyłanie plików.

    Poza domeną ustawienie nie robi nic.

    Nie ma znanych regresji.

    Czego to nie psuje: logowania, kont domenowych, pobierania zasad,
    udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The value called for is the default and the rule as a rule confirms the state found.

    The setting by its own definition breaks off no conversation: it signs where it can, and where it cannot it
    speaks on. There is therefore no case in which something ceases working after it.

    The reckoning cost of signing that channel is beneath notice, the traffic in it being seldom and short -
    these are queries about accounts and policies, not the sending of files.

    Outside a domain the setting does nothing.

    There are no known regressions.

    What this does not break: logging on, domain accounts, the fetching of policies, file shares, printing, or
    applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - encryption-and-tls
  what_breaks:
    pl:
      - Ustawienie nie zrywa żadnej rozmowy, bo podpisuje tylko wtedy, gdy druga strona to obsługuje
      - Koszt obliczeniowy jest pomijalny, bo ruch w tym kanale jest rzadki i krótki
      - Poza domeną ustawienie nie robi nic, bo kanału takiego nie ma wcale
      - Logowanie, konta domenowe i pobieranie zasad domenowych pozostają bez zmian
      - Udziały plikowe, drukowanie, aplikacje i usługi systemowe pozostają bez zmian
    en:
      - The setting breaks off no conversation, signing only where the other side serves it
      - The reckoning cost is beneath notice, the traffic in that channel being seldom and short
      - Outside a domain the setting does nothing, there being no such channel at all
      - Logging on, domain accounts and the fetching of domain policies stay unchanged
      - File shares, printing, applications and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ma takiego przypadku dla tej maszyny, bo ustawienie z definicji nie zrywa rozmowy bez ochrony
    en:
      - There is no such case for this machine, the setting by its own definition breaking off no conversation without a guard
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'SignSecureChannel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'SignSecureChannel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The guard is chosen where it can be had and left out where it cannot, so
    # nothing here refuses a conversation. The refusing belongs to the rule that
    # requires.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SignSecureChannel' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-sign-secure-channel-data-when-possible

notes:
  pl: |
    Reguła jest druga w rodzinie czterech i najłatwiejsza do przecenienia.
    Nazwa mówi o podpisywaniu, więc czyta się ją jako zabezpieczenie,
    a ochrona jest tu warunkowa i napastnik decyduje o warunku.

    Warto, żeby aplikacja postawiła to wprost, bo inaczej użytkownik po
    wykonaniu tej reguły uzna kanał za zabezpieczony i odpuści regułę
    wymagającą — a to jest dokładnie odwrotność właściwej kolejności.

    Kategoria średnia jest oceną świadomą i wynika z tej właśnie
    warunkowości. Punkt ustawia zachowanie domyślne na lepsze, co jest
    wkładem realnym, ale nie zamyka żadnej drogi samodzielnie.
  en: |
    The rule is the second in the family of four and the easiest to overrate. Its name speaks of signing, so it
    gets read as a safeguard, while the guard here is conditional and the attacker settles the condition.

    It is well that the application put that outright, or else the user will after carrying this rule out hold
    the channel guarded and let go the rule that requires - which is exactly the reverse of the right order.

    The medium category is a knowing judgement and comes of that very conditionality. The item sets the default
    behaviour to a better one, which is a real contribution, but closes no road of itself.
