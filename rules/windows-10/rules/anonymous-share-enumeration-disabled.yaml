id: win10-anonymous-share-enumeration-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyliczanie kont i udziałów bez poświadczeń zablokowane
    en: The listing of accounts and shares without credentials blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje odczytanie przez połączenie bez poświadczeń zarówno
    listy kont, jak i listy zasobów udostępnionych przez maszynę.

    Punkt jest szerszy od poprzedniego i dlatego cięższy. Lista kont mówi,
    kogo próbować; lista udziałów mówi, po co. Razem dają obraz maszyny
    wystarczający do zaplanowania czynności dalszych — bez logowania się,
    bez uprawnień i bez czegokolwiek, co zostawia ślad rozpoznawalny jako
    próba włamania.

    Lista udziałów jest przy tym zwykle bardziej wymowna niż lista kont.
    Nazwy udziałów nadaje człowiek i nadaje je opisowo, więc mówią, co
    w środku leży. Wykaz taki odczytany z jednej maszyny bywa najszybszą
    drogą do ustalenia, która maszyna w sieci jest warta uwagi.

    Odnotowuję rzecz istotną dla oceny: ustawienie nie zmienia uprawnień do
    samych zasobów. Udział zabezpieczony pozostaje zabezpieczony; udział
    otwarty pozostaje otwarty. Zmienia się wyłącznie to, czy da się je
    wymienić, nie znając niczego o maszynie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykaz kont
    i wykaz udostępnionych zasobów maszyny, czyli komplet danych do wyboru
    celu, bez jednego uwierzytelnienia.
  en: |
    The setting blocks the reading, by a connection without credentials, of both the list of accounts and the
    list of resources the machine shares.

    The item is broader than the foregoing one and therefore the heavier. A list of accounts says whom to try; a
    list of shares says what for. Together they give a picture of the machine sufficient for planning what comes
    next - without logging in, without rights and without anything leaving a trace recognisable as an attempt at
    breaking in.

    The list of shares is at the same time as a rule more telling than the list of accounts. Shares are named by
    a person and named descriptively, so they say what lies inside. Such a roll read off one machine is at times
    the quickest road to settling which machine on a network is worth attention.

    A thing important to the judgement I set down: the setting does not change the rights upon the resources
    themselves. A guarded share stays guarded; an open one stays open. What changes is only whether they can be
    listed while nothing at all about the machine is known.

    What an attacker gains while the item goes unmet: a roll of the machine's accounts and of its shared
    resources, which is a full set of data for choosing a target, without one authentication.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczy do sprawdzenia są dwie.

    Pierwsza to przeglądanie sieci przez okno systemowe. Maszyna po zmianie
    przestaje pokazywać swoje udziały temu, kto jeszcze się nie
    uwierzytelnił. Ścieżka podana wprost działa dalej i tak trzeba będzie
    do tych udziałów docierać.

    Druga to urządzenia i oprogramowanie starsze, które przed połączeniem
    pytają maszynę o listę udziałów, żeby wybrać właściwy. Takie
    rozwiązania po zmianie zgłaszają brak udziałów, mimo że udział istnieje
    i jest dostępny po podaniu ścieżki. Objaw jest więc mylący: zasób nie
    zniknął, przestał być widoczny w wykazie.

    Na stanowisku roboczym niczego nieudostępniającym zmiana nie ma skutku
    praktycznego.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: dostępu do udziałów po ścieżce, uprawnień do
    zasobów, logowania, kont domenowych, drukowania, usług systemowych.
  en: |
    The class is "needs review", and there are two things to review.

    The first is the browsing of the network through the system's own window. After the change the machine
    ceases showing its shares to whoever has not yet authenticated. A path given outright still works and that
    is how those shares will have to be reached.

    The second is devices and older software that ask the machine for a list of shares before joining, so as to
    pick the right one. Such arrangements report after the change that there are no shares, though the share
    exists and is reachable once the path is given. The symptom therefore misleads: the resource has not gone,
    it has ceased showing in the roll.

    At a workplace sharing nothing the change has no practical effect.

    The change takes hold at once and undoes itself at once.

    What this does not break: reaching shares by a path, the rights upon resources, logging on, domain accounts,
    printing, or system services.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Maszyna przestaje pokazywać swoje udziały w przeglądaniu sieci komuś, kto się jeszcze nie uwierzytelnił
      - Urządzenia i oprogramowanie pytające o listę udziałów przed połączeniem zgłaszają brak udziałów
      - Objaw myli, bo zasób nie znika i pozostaje dostępny po podaniu ścieżki wprost
      - Uprawnienia do zasobów nie zmieniają się wcale, więc udział zabezpieczony zostaje zabezpieczony, a otwarty otwarty
      - Logowanie, konta domenowe, drukowanie oraz usługi systemowe pozostają bez zmian
    en:
      - The machine ceases showing its shares in a browsing of the network to whoever has not yet authenticated
      - Devices and software asking for a list of shares before joining report that there are none
      - The symptom misleads, the resource not going and staying reachable once the path is given outright
      - The rights upon resources do not change at all, so a guarded share stays guarded and an open one open
      - Logging on, domain accounts, printing and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenia korzystające z tej maszyny wybierają udział z wykazu i nie umieją przyjąć ścieżki podanej wprost
      - Maszyna stoi poza domeną, a wymiana plików opiera się na przeglądaniu sieci bez uwierzytelnienia
    en:
      - Devices using this machine pick a share from the roll and cannot take a path given outright
      - The machine stands outside a domain and the exchange of files rests on browsing the network without authenticating
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictAnonymous'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'RestrictAnonymous'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The rolls go, the resources do not. A share stays reachable by a path given
    # outright - only the listing of it before authenticating ceases.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictAnonymous' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts-and-shares

notes:
  pl: |
    Reguła zawiera w sobie poprzednią i warto, żeby aplikacja to pokazała.
    Raport, w którym spełniona jest tylko węższa z tych dwóch, opisuje
    maszynę wciąż wydającą wykaz udziałów — a to jest informacja cenniejsza
    niż lista kont.

    Argument wart postawienia wprost dotyczy nazw. Udziały nazywa człowiek
    i nazywa je tak, żeby było wiadomo, co w środku. Wykaz udziałów jest
    więc spisem zawartości maszyny, wydawanym bez pytania o cokolwiek.

    Odnotowuję granicę tej reguły, żeby nie była oceniana zbyt wysoko:
    uprawnienia do zasobów pozostają nietknięte. Udział otwarty dla
    wszystkich zostaje otwarty i trzeba go zamknąć osobno. Reguła utrudnia
    znalezienie, nie zamyka wejścia.
  en: |
    The rule holds the foregoing one within it, and it is well that the application show that. A report in which
    only the narrower of the two is met describes a machine still giving out a roll of its shares - and that is
    more valuable than a list of accounts.

    The argument worth putting outright touches names. Shares are named by a person and named so that what lies
    inside should be known. A roll of shares is therefore an inventory of the machine's contents, given out
    without a question about anything.

    I set down this rule's bound, that it should not be rated too highly: the rights upon resources stay
    untouched. A share open to everybody stays open and has to be shut separately. The rule makes the finding
    harder, it does not close the way in.
