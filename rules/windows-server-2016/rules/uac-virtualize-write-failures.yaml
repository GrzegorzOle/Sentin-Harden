id: win2016-uac-virtualize-write-failures

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nieudane zapisy starszych programów przekierowane do katalogu użytkownika
    en: Failed writes by older programs redirected to the user's own location
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że program bez uprawnień próbujący zapisać do miejsca
    chronionego nie zapisuje tam, tylko do własnego katalogu, a odpowiedź
    dostaje taką, jakby się udało.

    Nazwa brzmi jak udogodnienie i po części nim jest, ale zabezpieczeniem
    jest z innego powodu. Bez tego mechanizmu starszy program, który zapisuje
    ustawienia do katalogu systemowego albo do wspólnej gałęzi rejestru, po
    prostu zawiedzie — a odruchem administratora jest wtedy nadanie temu
    programowi pełnych uprawnień albo poluzowanie uprawnień do katalogu.
    Oba te kroki są trwałe i oba są gorsze niż problem, który rozwiązują.

    Przekierowanie zdejmuje ten nacisk. Program działa, jego dane trafiają
    do miejsca należącego do konta, na którym pracuje, a nikt nie musi
    otwierać katalogu systemowego dla wszystkich.

    Na serwerze 2016 mechanizm ten wciąż coś robi, bo oprogramowanie z tamtych
    lat pisano często bez rozdziału na dane wspólne i dane użytkownika.
    W wydaniach nowszych znaczenie tego ustawienia maleje, tutaj jeszcze nie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pośrednio —
    maszynę, na której uprawnienia do katalogów systemowych poluzowano, żeby
    jeden stary program działał.
  en: |
    The item makes a program without rights that tries to write to a protected
    location write to its own directory instead, and receive an answer as though
    it had succeeded.

    The name sounds like a convenience and in part it is, but it is a safeguard
    for a different reason. Without this mechanism an older program that writes
    its settings to a system directory or to a shared branch of the registry
    simply fails - and the administrator's reflex is then to give that program
    full rights or to loosen the permissions on the directory. Both steps are
    lasting and both are worse than the problem they solve.

    Redirection takes that pressure away. The program works, its data goes to a
    place belonging to the account it runs under, and nobody has to open a system
    directory to everybody.

    On Server 2016 the mechanism still does something, because software from
    those years was often written without separating shared data from a user's
    own. In newer releases the setting matters less; here, not yet.

    What an attacker gains while the item goes unmet: indirectly - a machine on
    which permissions to system directories were loosened so that one old program
    would work.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Mechanizm działa wyłącznie tam, gdzie bez niego
    zapis i tak by się nie powiódł, więc jego włączenie nie odbiera niczego,
    co dziś działa.

    Jedna rzecz jest warta odnotowania, choć nie zmienia klasy. Program
    korzystający z przekierowania zapisuje dane osobno dla każdego konta,
    więc dwa konta na tej samej maszynie mogą zobaczyć dwa różne zestawy
    ustawień. Dla starego programu jest to zwykle zachowanie poprawniejsze
    niż wspólny plik, ale przy narzędziu obsługiwanym przez kilka osób bywa
    zaskoczeniem.

    Przekierowanie nie działa dla programów 64-bitowych ani dla procesów
    działających z pełnymi uprawnieniami. Nie da się więc
    liczyć na nie jako na rozwiązanie uniwersalne — to jest podpórka dla
    starego oprogramowania, a nie sposób na obejście uprawnień.

    Czego to nie psuje: niczego, co obecnie zapisuje poprawnie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The mechanism works only where the write would
    have failed anyway, so switching it on takes away nothing that works today.

    One thing is worth noting, though it does not change the class. A program
    using redirection writes its data separately for each account, so two
    accounts on the same machine may see two different sets of settings. For an
    old program that is usually more correct than a shared file, but with a tool
    handled by several people it comes as a surprise.

    Redirection does not work for sixty-four-bit programs, nor for processes
    running with full rights. It cannot be counted on as a general answer - it is
    a prop for old software, not a way round permissions.

    What this does not break: nothing that writes correctly today.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Starszy program zapisuje ustawienia osobno dla każdego konta, więc dwie osoby widzą dwa zestawy
      - Przekierowanie nie obejmuje programów 64-bitowych ani procesów działających z pełnymi uprawnieniami
      - Diagnostyka bywa myląca, bo plik leży w katalogu konta zamiast tam, gdzie program go pokazuje
      - Nic, co obecnie zapisuje poprawnie, nie zmienia zachowania
    en:
      - An older program writes its settings separately for each account, so two people see two sets
      - Redirection does not cover sixty-four-bit programs or processes running with full rights
      - Diagnosis can mislead, because the file sits in the account's directory rather than where the program shows it
      - Nothing that writes correctly today changes its behaviour
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Starszy program na tej maszynie wymaga jednego wspólnego pliku ustawień dla wszystkich kont i sprawdzono, że przekierowanie mu to odbiera
    en:
      - An older program on this machine needs one shared settings file for every account and redirection has been checked to take that away
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableVirtualization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableVirtualization'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Redirection works only where the write would have failed anyway. Its value
    # is that nobody has to loosen the permissions on a system directory to make
    # one old program work.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableVirtualization' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-virtualize-file-and-registry-write-failures-to-per-user-locations

notes:
  pl: |
    Jedna z nielicznych reguł tej grupy z klasą „bez uciążliwości", bo
    mechanizm nie odbiera żadnej czynności — dodaje drogę tam, gdzie do tej
    pory było niepowodzenie.

    Rzecz warta zapamiętania przy diagnozowaniu: plik zapisany przez
    przekierowanie leży w katalogu konta, a program pokazuje ścieżkę
    pierwotną. Szukanie pliku tam, gdzie wskazuje program, kończy się
    wnioskiem, że zapis się nie udał.

    Wartość leży w kluczu wspólnym dla całej grupy kontroli uprawnień.
    Przy cofaniu usuwana jest wyłącznie ta jedna wartość.
  en: |
    One of the few rules in this group with the class "no disruption", because
    the mechanism takes no action away - it adds a route where until now there
    was a failure.

    Something to remember when diagnosing: a file written through redirection
    sits in the account's directory while the program shows the original path.
    Looking for the file where the program points ends in the conclusion that the
    write failed.

    The value lies in a key shared by the whole rights-control group. Undoing
    removes this one value alone.
