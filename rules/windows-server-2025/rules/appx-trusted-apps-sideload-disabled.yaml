id: win2025-appx-trusted-apps-sideload-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji z pominięciem sklepu wyłączone
    en: Installing application packages past the store switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza instalowanie pakietów aplikacji z pominięciem sklepu.
    Pakiet przestaje dać się położyć na maszynie z pliku, a jedyną drogą
    zostaje ta, na której ktoś odpowiada za to, co jest rozdawane.

    Różnica wobec trybu programisty jest istotna i warto ją rozróżnić,
    bo oba punkty leżą w tym samym kluczu. Tryb programisty znosi
    sprawdzanie podpisu. Ten punkt sprawdzania podpisu nie znosi —
    pakiet nadal musi być podpisany i zaufany. Znosi natomiast pytanie
    o to, skąd pochodzi, i pozwala wnieść na maszynę cokolwiek, co
    podpisano certyfikatem uznawanym przez tę maszynę.

    I to jest właśnie droga, o której tu mowa. Napastnik potrzebujący
    utrwalić się na serwerze nie musi łamać zabezpieczeń pakietowania —
    wystarczy mu podpis uznawany przez tę jedną maszynę. W środowisku,
    w którym własny urząd certyfikacji wystawia certyfikaty na potrzeby
    wewnętrzne, taki podpis bywa łatwiejszy do zdobycia, niż się wydaje.

    Zostawiam kategorię wysoką. Pakiet aplikacji zainstalowany tą drogą
    wygląda w systemie jak każdy inny i przetrwa restart maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałą
    obecność na serwerze w postaci zainstalowanego pakietu, którą trudno
    odróżnić od oprogramowania wniesionego prawidłowo.
  en: |
    The item switches off the installing of packages of applications past the store. A package stops
    being layable upon the machine out of a file, and the one road left is that whereon somebody
    answers for what is dealt out.

    The difference against the mode of the maker of programs is weighty and worth telling apart, both
    items lying in the same key. The mode of the maker of programs does away with the looking to the
    sign. This item does not away with the looking to the sign - a package must still be signed and
    trusted. It does away with the question whence it comes, and lets anything be brought onto the
    machine that has been signed by a token that machine holds good.

    And that is just the road here spoken of. An attacker needing to make themselves lasting upon a
    server need not break the safekeepings of the packaging - a sign that one machine holds good is
    enough for them. In a setting wherein one's own seat of tokens gives tokens out for inward needs,
    such a sign is at times easier to come by than it seems.

    I leave the category high. A package of an application installed by that road looks in the system
    like any other and outlives a restart of the machine.

    What an attacker gains while the item goes unmet - a lasting being upon the server in the shape of
    an installed package, hard to tell from software brought in rightly.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i powodem jest rzecz, która
    wygląda niewinnie: część narzędzi administracyjnych i konsol
    zarządzania dostarczanych przez producentów sprzętu przychodzi
    właśnie jako pakiet instalowany z pliku. Nie jest to obejście ani
    niedbalstwo — jest to sposób dostarczania przyjęty przez producenta.

    Skutkiem zmiany jest więc nie tyle zatrzymanie czegoś, co działa, ile
    zamknięcie drogi na przyszłość. Pakiety już zainstalowane działają
    dalej i nic się z nimi nie dzieje. Zablokowana zostaje kolejna
    instalacja — a to znaczy, że zmiana ujawni się dopiero przy
    najbliższej aktualizacji narzędzia albo przy odtwarzaniu maszyny.

    To drugie jest tu warte podkreślenia. Serwer odtwarzany po awarii
    instaluje wszystko od nowa, często pod presją czasu i często przez
    kogoś, kto tej maszyny nie stawiał. Zablokowana instalacja narzędzia
    producenta w takim momencie wygląda na awarię odtwarzania, a nie na
    skutek zasady ustawionej przed rokiem.

    Sprawdzenie polega zatem na zebraniu listy oprogramowania, które na
    tej maszynie przychodzi jako pakiet, i zapisaniu tej listy tam, gdzie
    zajrzy się przy odtwarzaniu. Samo zebranie listy zajmuje chwilę,
    a bez niej zmiana jest pułapką zastawioną na przyszłego siebie.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "needs a checking", and the ground is a thing that looks guileless - some of
    the tools of ruling and the boards of ruling given out by makers of gear come as just such a
    package installed out of a file. It is no going round nor a heedlessness - it is the way of
    giving out taken up by the maker.

    The outcome of the change is therefore not so much the stopping of something that works as the
    shutting of a road for time to come. Packages already installed work on and nothing befalls them.
    What is shut is the next installing - and that means the change will come to light only at the
    nearest mending of a tool or at the raising of the machine anew.

    That second is here worth marking. A server raised anew after a fault installs all from the
    beginning, often under the press of time and often by somebody who did not set that machine up. A
    shut installing of a maker's tool at such a moment looks like a fault of the raising anew and not
    like the outcome of a policy set a year since.

    The checking comes therefore to the gathering of the list of software that comes upon that
    machine as a package, and the writing of that list where it will be looked at in the raising
    anew. The gathering itself takes a moment, and without it the change is a trap set for one's own
    self to come.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia i konsole zarządzania dostarczane przez producentów sprzętu jako pakiet nie dadzą się zainstalować
      - Pakiety już zainstalowane działają dalej, zablokowana jest kolejna instalacja
      - Zmiana ujawni się dopiero przy najbliższej aktualizacji narzędzia albo przy odtwarzaniu maszyny
      - Przy odtwarzaniu po awarii wygląda to na awarię odtwarzania, a nie na skutek zasady sprzed roku
      - Bez spisanej listy oprogramowania przychodzącego jako pakiet zmiana jest pułapką zastawioną na przyszłego siebie
    en:
      - Tools and boards of ruling given out by makers of gear as a package will not install
      - Packages already installed work on, what is shut is the next installing
      - The change will come to light only at the nearest mending of a tool or at the raising of the machine anew
      - At a raising anew after a fault it looks like a fault of the raising and not like a policy set a year since
      - Without a written list of software coming as a package the change is a trap set for one's own self to come
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoją narzędzia producenta sprzętu dostarczane wyłącznie jako pakiet instalowany z pliku
      - Nie zebrano listy takiego oprogramowania i nie zapisano jej tam, gdzie zajrzy się przy odtwarzaniu
    en:
      - Tools of the maker of the gear stand upon the machine that are given out only as a package installed out of a file
      - The list of such software was not gathered nor written where it will be looked at in the raising anew
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowAllTrustedApps'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowAllTrustedApps'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Write down which vendor tools on this machine arrive as a package, and
    # keep that list where a rebuild will find it: the block shows up during a
    # rebuild, where it reads as a rebuild failure.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAllTrustedApps' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/sideload-apps-in-windows

notes:
  pl: |
    Rozróżnienie wobec trybu programisty, leżącego w tym samym kluczu:
    tamten punkt znosi sprawdzanie podpisu, ten go nie znosi. Znosi
    pytanie o to, skąd pakiet pochodzi — więc wystarczy podpis uznawany
    przez tę jedną maszynę.

    W środowisku z własnym urzędem certyfikacji taki podpis bywa
    łatwiejszy do zdobycia, niż się wydaje, a pakiet zainstalowany tą
    drogą wygląda jak każdy inny i przetrwa restart.

    Uciążliwość bierze się z tego, że skutek jest odroczony: ujawnia się
    przy odtwarzaniu maszyny po awarii, gdzie wygląda na awarię
    odtwarzania.
  en: |
    The telling apart from the mode of the maker of programs, lying in the same key - that item does
    away with the looking to the sign, this one does not. It does away with the question whence the
    package comes - so a sign that one machine holds good is enough.

    In a setting with one's own seat of tokens such a sign is at times easier to come by than it
    seems, and a package installed by that road looks like any other and outlives a restart.

    The disruption comes of the outcome being put off - it comes to light at the raising of the
    machine anew after a fault, where it looks like a fault of the raising.
