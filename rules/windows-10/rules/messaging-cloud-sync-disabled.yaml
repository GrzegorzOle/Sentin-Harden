id: win10-messaging-cloud-sync-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Messaging
  title:
    pl: Przenoszenie wiadomości tekstowych poza maszynę wyłączone
    en: Carrying text messages beyond the machine disabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Wiadomości tekstowe odebrane na telefonie mogą przechodzić przez usługę
    producenta na maszynę i z powrotem. Zbiór taki gromadzi się z czasem i
    przechowywany jest poza jednym i drugim urządzeniem.

    Waga tego punktu bierze się z tego, co dziś przychodzi wiadomością tekstową.
    To jest kanał kodów jednorazowych, potwierdzeń logowania i odzyskiwania kont.
    Zbiór przeniesiony poza urządzenie sprawia, że przejęcie konta w usłudze
    producenta wystarcza, żeby czytać kody drugiego składnika — a drugi składnik
    miał być właśnie tym, czego przejęcie konta nie daje.

    Wyłączenie przenoszenia zatrzymuje wiadomości na urządzeniu, do którego
    przyszły.
  en: |
    Text messages received on a telephone may pass through the maker s service to
    the machine and back. Such a collection builds up over time and is kept outside
    both devices.

    The weight of this item comes from what arrives by text message these days. It
    is the channel for one-time codes, sign-in confirmations and account recovery.
    A collection carried beyond the device means that taking over an account in the
    maker s service is enough to read second-factor codes - and the second factor
    was meant to be exactly what taking over an account does not give.

    Switching the carrying off keeps messages on the device they arrived at.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo dla części osób czytanie wiadomości z telefonu
    na ekranie maszyny jest wygodą, z której korzystają codziennie.

    Skutek jest widoczny: wiadomości znikają z aplikacji na maszynie i zostają
    wyłącznie w telefonie. Telefon działa bez zmian, więc nic nie ginie — zmienia
    się miejsce, w którym trzeba spojrzeć.

    Wiadomości już przeniesione zostają tam, gdzie są. Zasada zatrzymuje dalsze
    przenoszenie, a nie usuwa zbioru zgromadzonego wcześniej; jego usunięcie jest
    osobną sprawą po stronie konta.
  en: |
    The change calls for a review, since for some people reading messages from
    their telephone on the machine s screen is a convenience they use daily.

    The effect is visible - messages vanish from the application on the machine and
    stay in the telephone alone. The telephone works unchanged, so nothing is lost;
    what changes is where one has to look.

    Messages already carried over stay where they are. The rule stops further
    carrying rather than removing a collection gathered earlier - removing that is
    a separate matter on the account s side.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Wiadomości tekstowe z telefonu przestaną pojawiać się w aplikacji na maszynie
      - Odpisywanie na wiadomość z klawiatury maszyny przestanie być możliwe
      - Historia wiadomości nie przeniesie się na nowe urządzenie przy jego zakładaniu
      - Zbiór przeniesiony wcześniej zostanie tam, gdzie jest, dopóki nie zostanie usunięty osobno
      - Wiadomości na samym telefonie, poczta, komunikatory i praca użytkownika pozostają bez zmian
    en:
      - Text messages from the telephone stop appearing in the application on the machine
      - Replying to a message from the machine s keyboard stops being possible
      - The message history does not carry over to a new device when it is set up
      - A collection carried over earlier stays where it is until it is removed separately
      - Messages on the telephone itself, mail, messengers and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska, na których odpisywanie na wiadomości tekstowe z klawiatury maszyny jest częścią pracy
      - Środowiska dostępności, w których obsługa telefonu jest trudniejsza niż obsługa maszyny
    en:
      - Stations where replying to text messages from the machine s keyboard is part of the work
      - Accessibility environments where working a telephone is harder than working the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowMessageSync'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    $name = 'AllowMessageSync'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowMessageSync' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-messaging

notes:
  pl: |
    Zasada dotyczy przenoszenia wiadomości między urządzeniami przez usługę
    producenta, a nie samego odbierania ich na telefonie. Zbiór zgromadzony przed
    zmianą pozostaje w usłudze i wymaga osobnej decyzji.
  en: |
    The rule concerns the carrying of messages between devices through the maker s
    service rather than their receipt on the telephone itself. A collection
    gathered before the change stays in the service and calls for a decision of its
    own.
