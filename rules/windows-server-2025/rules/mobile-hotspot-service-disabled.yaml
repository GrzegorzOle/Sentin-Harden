id: win2025-mobile-hotspot-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia jako punktu dostępowego wyłączona
    en: The service sharing the connection as an access point disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę pozwalającą udostępnić połączenie tej maszyny
    jako bezprzewodowy punkt dostępowy, do którego podłączają się inne
    urządzenia.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej i powód
    jest zakresowy, nie merytoryczny. Rzecz, której ta usługa dotyczy,
    wymaga karty bezprzewodowej zdolnej pracować jako punkt dostępowy.
    Serwery takich kart zwykle nie mają. Tam, gdzie jej nie ma, usługa
    może być uruchomiona i nie robi nic — nie ma czym nadawać.

    Jest to jeden z nielicznych punktów w tej paczce, przy których
    uczciwa odpowiedź brzmi: ryzyko jest niskie nie dlatego, że zmiana
    jest słaba, tylko dlatego, że na typowym serwerze nie ma czego
    wyłączać.

    Nie schodzę jednak niżej i chcę powiedzieć dlaczego. Serwer
    w mniejszej lokalizacji, maszyna przemysłowa albo urządzenie
    brzegowe bywają wyposażone w kartę bezprzewodową. Tam ta usługa daje
    dokładnie to, co obiecuje: nową sieć, wpuszczoną do wnętrza
    z pominięciem wszystkiego, co postawiono na brzegu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z kartą bezprzewodową — sposób wpuszczenia własnych urządzeń
    do sieci wewnętrznej obok kontroli brzegowej. Na maszynie bez takiej
    karty — nic.
  en: |
    The item switches off the service letting the binding of that machine be dealt out as a wireless
    stead of reach whereto other devices bind themselves.

    I lower the category to low against the reckoning for a workstation, and the ground is one of
    range and not of substance. The thing that service bears upon takes a wireless card able to work
    as a stead of reach. Servers have mostly no such cards. Where there is none, the service may be
    running and does nothing - it has nothing to send with.

    It is one of the few items in this pack whereat the honest answer runs - the hazard is low not
    because the change is weak but because upon a common server there is nothing to switch off.

    I go no lower for all that, and would say why. A server in a lesser stead, a machine of works or a
    device at the edge are at times fitted with a wireless card. There that service gives just what it
    promises - a new net, let into the inwards with a passing by of everything that was set up at the
    edge.

    What an attacker gains while the item goes unmet - upon a machine with a wireless card, a way of
    letting devices of their own into the inner net beside the warding at the edge. Upon a machine
    without such a card, nothing.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" wobec oceny dla stacji roboczej.
    Powód jest ten sam, co przy kategorii, i uczciwie jest go powtórzyć:
    na typowym serwerze ta usługa nic nie robi, więc jej zatrzymanie też
    nic nie zmienia.

    Chcę jednak zaznaczyć różnicę wobec usługi udostępniania połączenia
    sieciowego, opisanej osobnym punktem, bo nazwy brzmią podobnie
    i łatwo je pomylić. Tamta na maszynie z rolą hipernadzorcy obsługuje
    sieć maszyn wirtualnych i jej zatrzymanie ma poważne skutki. Ta nie
    ma z tym nic wspólnego — obsługuje wyłącznie punkt dostępowy.

    Jedyny przypadek, w którym zmiana jest odczuwalna, to maszyna
    z kartą bezprzewodową, do której ktoś faktycznie podłącza urządzenia.
    Rozłączają się one w chwili zatrzymania usługi. Jeżeli tak jest, to
    samo w sobie jest ustaleniem, które warto zapisać, bo punkt dostępowy
    na serwerze rzadko bywa rzeczą zaplanowaną.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease" against the reckoning for a workstation. The ground is the same
    as at the category and it is honest to say it over - upon a common server that service does
    nothing, so its stopping alters nothing either.

    I would mark, though, the difference from the service of the dealing out of a binding of the net,
    set forth in an item of its own, the names sounding alike and being easily mistaken. That one,
    upon a machine bearing the role of an overseer of machines, works the net of the machines made by
    reckoning, and its stopping has weighty outcomes. This one has nothing in common with that - it
    works the stead of reach alone.

    The one case wherein the change is felt is a machine with a wireless card whereto somebody truly
    binds devices. They are unbound at the hour the service stops. If it be so, that in itself is a
    settling worth writing down, a stead of reach upon a server being seldom a thing that was planned.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Urządzenia podłączone do punktu dostępowego rozłączają się w chwili zatrzymania usługi
      - Na maszynie bez karty bezprzewodowej zmiana nie ma żadnego skutku
      - Nie należy mylić tej usługi z udostępnianiem połączenia sieciowego, które na hipernadzorcy obsługuje sieć maszyn wirtualnych
      - Działający punkt dostępowy na serwerze sam w sobie jest ustaleniem wartym zapisania
    en:
      - The devices bound to the stead of reach are unbound at the hour the service stops
      - Upon a machine without a wireless card the change has no outcome at all
      - That service is not to be mistaken for the dealing out of a binding of the net, which upon an overseer of machines works the net of the machines made by reckoning
      - A working stead of reach upon a server is in itself a settling worth writing down
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna ma kartę bezprzewodową i ktoś faktycznie podłącza do niej urządzenia przez punkt dostępowy
    en:
      - The machine has a wireless card and somebody truly binds devices to it through the stead of reach
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Devices attached to the access point lose their connection the moment the
    # service stops. On a server without a wireless card there is nothing to
    # lose - this is not the service that carries virtual machine networking.
    Stop-Service -Name 'icssvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'icssvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'icssvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/

notes:
  pl: |
    Jeden z nielicznych punktów w tej paczce, przy których uczciwa
    odpowiedź brzmi: ryzyko jest niskie nie dlatego, że zmiana jest
    słaba, tylko dlatego, że na typowym serwerze nie ma czego wyłączać.

    Nie schodzę niżej, bo serwer w mniejszej lokalizacji, maszyna
    przemysłowa albo urządzenie brzegowe bywają wyposażone w kartę
    bezprzewodową — a tam ta usługa daje nową sieć wpuszczoną do wnętrza
    z pominięciem kontroli brzegowej.

    Łatwe do pomylenia: to nie jest usługa udostępniania połączenia
    sieciowego, która na hipernadzorcy obsługuje sieć maszyn wirtualnych.
  en: |
    One of the few items in this pack whereat the honest answer runs - the hazard is low not because
    the change is weak but because upon a common server there is nothing to switch off.

    I go no lower, a server in a lesser stead, a machine of works or a device at the edge being at
    times fitted with a wireless card - and there that service gives a new net let into the inwards
    with a passing by of the warding at the edge.

    Easily mistaken - this is not the service of the dealing out of a binding of the net, which upon
    an overseer of machines works the net of the machines made by reckoning.
