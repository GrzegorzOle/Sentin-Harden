notes:
  pl: |
    Reguła chroni maszynę przed jej własnym działaniem i warto, żeby
    aplikacja postawiła to wprost. Punkty tego rodzaju bywają pomijane,
    bo nie kojarzą się z wystawieniem na atak, a stawką jest tutaj hasło
    konta administracyjnego.

    Argument wart postawienia dotyczy serwera podstawionego. Klient
    gotowy wysłać hasło wprost wyśle je także temu, kto tylko udaje
    właściwą maszynę, bo sposób ten nie przewiduje potwierdzania
    tożsamości drugiej strony.

    Odnotowuję objaw mylący: komunikat o odmowie wskaże stronę zdalną,
    choć przyczyna leży na tej maszynie. Aplikacja powinna to wymienić,
    bo inaczej szukanie pójdzie w złą stronę.
  en: |
    The rule guards the machine against its own doing, and it is well that the application put it outright. Items
    of that kind are at times passed over, bringing no setting out to assault to mind, and the stake here is the
    password of a keeper's reckoning.

    The argument worth putting touches a server set in another's place. A client ready to send the password
    outright will send it also to whoever merely feigns to be the right machine, that manner looking for no
    warranting of the other side's name.

    I set down the misleading sign: the message of refusal will point to the far side, though the cause lies upon
    this machine. The application ought to name it, else the seeking will go the wrong way.
