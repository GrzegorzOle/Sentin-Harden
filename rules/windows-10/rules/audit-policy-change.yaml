id: win10-audit-policy-change

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja zmian zasad inspekcji
    en: The audit of changes to the audit rules
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje każdą zmianę w samych zasadach inspekcji — czyli
    w opisie tego, co maszyna ma zapisywać.

    Wyłączenie zapisu jest czynnością pierwszą po zdobyciu uprawnień
    administracyjnych i jedyną, która daje napastnikowi ciszę na wszystko,
    co nastąpi dalej. Ta podkategoria sprawia, że przed nastaniem ciszy
    powstaje jeszcze jeden wpis: ten o jej nastaniu.

    Wartość reguły jest więc jednorazowa i graniczna. Nie mówi, co napastnik
    zrobił potem, bo potem nic już nie jest zapisywane. Mówi, że coś się
    stało i o której godzinie — a to wystarcza, żeby odróżnić maszynę,
    na której zapis wygasł z powodu błędu, od maszyny, na której ktoś go
    wyłączył.

    Odnotowuję, że wpis powstaje także przy zmianach prawidłowych. Każde
    wdrożenie nowych zasad inspekcji zostawi tu ślad i jest to zachowanie
    zamierzone: zapis ma mówić, kto i kiedy ruszył zasady, bez oceniania
    powodu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wyłączenie
    zapisu niezostawiające informacji nawet o tym, że nastąpiło.
  en: |
    The setting writes down every change in the audit rules themselves - which is to say in the description of
    what the machine is to write down.

    The switching off of the record is the first act upon gaining administrative rights, and the only one that
    gives an attacker quiet as to everything that comes after. This subcategory makes it so that before the
    quiet falls one more entry comes about: the entry about its falling.

    The rule's value is therefore a single one and a boundary one. It does not say what the attacker did after,
    nothing being written down after. It says that something happened and at what hour - and that suffices to
    part a machine whose record went out through a fault from one upon which somebody switched it off.

    I set down that an entry comes about at proper changes as well. Every rolling out of new audit rules will
    leave a trace here, and that is the behaviour meant: the record is to say who touched the rules and when,
    without weighing the reason.

    What an attacker gains while the item goes unmet: the switching off of the record, leaving no word even that
    it happened.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia niczego w pracy maszyny ani w tym, kto może
    zasady inspekcji zmieniać. Zapisuje wyłącznie fakt zmiany.

    Liczba wpisów jest bliska zeru, bo zasady inspekcji zmienia się rzadko.
    Na maszynie w domenie, gdzie zasady przychodzą z zewnątrz i są
    odświeżane cyklicznie, wpisów bywa więcej — ale są to wpisy powtarzalne
    i łatwe do odróżnienia od zmiany rzeczywistej.

    Odnotowuję, że zapisywany jest wyłącznie wynik udany. Próba zmiany
    odrzucona z braku uprawnień zostawia ślad w inspekcji użycia uprawnień
    newralgicznych, a nie tutaj.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: zmieniania zasad inspekcji, wdrażania zasad
    z zewnątrz, logowania, kont domenowych, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes nothing in the machine's working nor in who may change the audit rules. It writes down
    the fact of a change alone.

    The number of entries is near nought, the audit rules being changed seldom. Upon a machine in a domain,
    where the rules come from without and are refreshed by turns, the entries are at times more - but they are
    repeating entries and easy to part from a real change.

    I set down that only the successful outcome is written. An attempt at a change refused for want of rights
    leaves its trace in the audit of the use of sensitive rights, and not here.

    There are no known regressions for everyday work.

    What this does not break: the changing of the audit rules, the rolling out of rules from without, logging
    on, domain accounts, file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie w domenie wpisy pojawiają się przy każdym odświeżeniu zasad przychodzących z zewnątrz
      - Są to wpisy powtarzalne i trzeba umieć odróżnić je od zmiany rzeczywistej
      - Zapisywany jest wyłącznie wynik udany, a próba odrzucona zostawia ślad w inspekcji uprawnień newralgicznych
      - Ustawienie nie zmienia tego, kto może zasady inspekcji zmieniać
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Upon a machine in a domain entries come up at every refreshing of rules arriving from without
      - Those are repeating entries and have to be told apart from a real change
      - Only the successful outcome is written, a refused attempt leaving its trace in the audit of sensitive rights
      - The setting does not change who may change the audit rules
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę, a dziennik lokalny po wyłączeniu inspekcji i tak zostanie wyczyszczony
    en:
      - The record is not gathered away from the machine, and a local log will after the audit is switched off be emptied anyway
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE922F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE922F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE922F-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. A change of the audit rules that was
    # refused leaves its trace in the audit of the use of sensitive rights.
    auditpol /set /subcategory:"{0CCE922F-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE922F-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-audit-policy-change

notes:
  pl: |
    Reguła jest w tym bloku jedyną, która opisuje własny koniec. Zapisuje
    zdarzenie, po którym zapisywanie ustaje — i cała jej wartość mieści się
    w tym jednym wpisie.

    Warto, żeby aplikacja postawiła to wprost, bo użytkownik oceniający
    punkt miarą tego, ile mówi o napastniku, uzna go za ubogi. Miarą jest tu
    pytanie, na które odpowiada: czy zapis wygasł, czy został wygaszony.

    Odnotowuję warunek, który tę regułę czyni albo bardzo wartościową, albo
    bezwartościową. Wpis o wyłączeniu inspekcji leży w dzienniku lokalnym,
    a dziennik lokalny na maszynie opanowanej jest czyszczony zaraz potem.
    Reguła ta pracuje w pełni dopiero wtedy, gdy zdarzenia są zbierane poza
    maszynę — i aplikacja powinna to powiedzieć, zamiast obiecywać ochronę,
    której lokalny zapis sam z siebie nie daje.
  en: |
    The rule is the only one in this block that describes its own end. It writes down the event after which the
    writing ceases - and its whole value is held in that one entry.

    It is well that the application put that outright, a user weighing the item by how much it says of an
    attacker holding it poor. The measure here is the question it answers: did the record go out, or was it put
    out.

    I set down the condition that makes this rule either very valuable or worthless. The entry about the audit's
    being switched off lies in the local log, and a local log upon a machine in somebody's hands is emptied right
    after. This rule works in full only where events are gathered away from the machine - and the application
    ought to say so, rather than promise a guard a local record does not of itself give.
