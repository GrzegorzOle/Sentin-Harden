id: iis-app-pool-idle-timeout-limited

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Basic Configurations
  title:
    pl: Limit bezczynności puli aplikacji ustawiony i nie dłuższy niż dwadzieścia minut
    en: The application pool idle limit is set and no longer than twenty minutes
  level: 1
  profile: application

platform:
  system: iis

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Proces roboczy puli aplikacji, do której nikt się nie zwraca, może zostać
    zamknięty po ustalonym czasie bezczynności. Wartość zero oznacza, że nie
    zostanie zamknięty nigdy — proces stoi w pamięci tak długo, jak długo działa
    serwer.

    Co to odbiera atakującemu: proces roboczy trzyma w pamięci to, co aplikacja
    w nim zostawiła — bufory żądań, obiekty sesji, poświadczenia wczytane przy
    starcie, klucze pobrane z magazynu. Proces, który nigdy nie ginie, gromadzi
    to wszystko bez końca i staje się celem wartym zrzucenia pamięci. Zamknięcie
    bezczynnego procesu opróżnia ten zbiór regularnie i skraca okno, w którym
    zawartość pamięci z zeszłego tygodnia jest jeszcze na wyciągnięcie ręki.

    Drugi zysk jest zwyczajniejszy: serwer z kilkudziesięcioma pulami, z których
    korzysta się sporadycznie, odzyskuje pamięć zamiast trzymać ją zajętą przez
    procesy, do których nikt nie zagląda.
  en: |
    The worker process of an application pool nobody addresses can be shut down
    after a set idle time. A value of zero means it will never be shut down - the
    process stands in memory for as long as the server runs.

    What it takes away from an attacker - a worker process holds in memory what
    the application left in it - request buffers, session objects, credentials
    loaded at startup, keys fetched from a store. A process that never dies
    gathers all of that without end and becomes a target worth dumping. Shutting
    an idle process down empties that collection regularly and shortens the
    window in which last week s memory contents are still within reach.

    The second gain is more ordinary - a server with a few dozen pools used only
    now and then reclaims memory instead of holding it occupied by processes
    nobody looks into.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo pierwsze żądanie po wygaśnięciu limitu trafia do
    procesu, którego jeszcze nie ma. Serwer musi go uruchomić, wczytać aplikację
    i dopiero potem odpowiedzieć — i to właśnie widzi użytkownik jako zauważalne
    opóźnienie pierwszej strony.

    Skala zależy od aplikacji. Prosta witryna startuje w ułamku sekundy i nikt
    tego nie zauważy. Aplikacja wczytująca przy starcie dużą konfigurację albo
    rozgrzewająca pamięć podręczną potrafi potrzebować kilkudziesięciu sekund,
    a przy pierwszym porannym wejściu wygląda to jak awaria.

    Osobny przypadek to aplikacje robiące coś w tle bez udziału żądań — zadania
    cykliczne, kolejki, nasłuch. Zamknięcie bezczynnego procesu zatrzymuje je
    razem z nim, a ponieważ nikt nie przysyła żądania, nie ma też czego wznowić.
    Taka aplikacja wymaga albo wyłączenia limitu dla swojej puli, albo przeniesienia
    pracy w tle poza serwer.
  en: |
    The change calls for a review, because the first request after the limit
    expires reaches a process that is not there yet. The server has to start it,
    load the application and only then answer - and that is what the user sees as
    a noticeable delay on the first page.

    The scale depends on the application. A simple site starts in a fraction of a
    second and nobody notices. An application that loads a large configuration at
    startup or warms a cache can need tens of seconds, and on the first visit of
    the morning that looks like a fault.

    A separate case is applications doing something in the background without
    requests - scheduled jobs, queues, listeners. Shutting the idle process down
    stops those with it, and since nobody sends a request there is nothing to
    resume them either. Such an application needs either the limit turned off for
    its own pool, or the background work moved off the web server.

implementation_consequences:
  impact_areas:
    - web-server-services
  what_breaks:
    pl:
      - Pierwsze żądanie po okresie bezczynności czeka na uruchomienie procesu, co przy ciężkiej aplikacji bywa opóźnieniem kilkudziesięciu sekund
      - Zadania cykliczne i kolejki działające wewnątrz aplikacji zatrzymają się razem z procesem i nie wznowią się same
      - Dane trzymane w pamięci procesu, w tym sesje bez magazynu zewnętrznego, przepadają przy zamknięciu
      - Witryny odwiedzane rzadko, na przykład raz dziennie rano, odczują to opóźnienie przy każdym pierwszym wejściu
      - Ruch ciągły sprawia, że limit nigdy nie zadziała, więc na obciążonym serwerze zmiana jest niewidoczna
    en:
      - The first request after an idle period waits for the process to start, which on a heavy application can be a delay of tens of seconds
      - Scheduled jobs and queues running inside the application stop with the process and do not resume by themselves
      - Data held in process memory, including sessions with no external store, is lost on shutdown
      - Sites visited rarely, say once a day in the morning, feel that delay on every first visit
      - Continuous traffic means the limit never fires, so on a busy server the change is invisible
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Pule aplikacji wykonujących pracę w tle bez udziału żądań, takich jak zadania cykliczne i kolejki
      - Aplikacje o długim czasie startu, w których opóźnienie pierwszej strony byłoby odebrane jako awaria
      - Aplikacje przechowujące sesje w pamięci procesu, gdzie zamknięcie oznacza wylogowanie wszystkich
    en:
      - Pools of applications doing background work without requests, such as scheduled jobs and queues
      - Applications with a long startup time, where the delay on the first page would be read as a fault
      - Applications keeping sessions in process memory, where a shutdown means logging everybody out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel' `
            -Name 'idleTimeout' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          else {
            # The cmdlet hands this back as a span of time, but the same value read
            # from a raw configuration file arrives as text or as a count of
            # ticks. All three shapes are reduced to one span before comparing -
            # casting a span straight to a number throws, and the rule would
            # then report that it could not check rather than what it found.
            $span = $null
            if ($value -is [TimeSpan]) { $span = $value }
            elseif ($value -is [string] -and $value -match '^\d+$') { $span = [TimeSpan]::FromTicks([int64]$value) }
            elseif ($value -is [string]) { $span = [TimeSpan]::Parse($value) }
            else { $span = [TimeSpan]::FromTicks([int64]$value) }
            $minutes = [int]$span.TotalMinutes
            # Zero is not a small limit, it is no limit at all - the process is
            # then never shut down. It is called out by name so the reading does
            # not report it as a value comfortably below the threshold.
            if ($minutes -le 0) { 'NO_LIMIT' }
            elseif ($minutes -le 20) { 'WITHIN_LIMIT' }
            else { 'OVER_LIMIT ' + $minutes }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel' `
      -Name 'idleTimeout' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    $span = $null
    if ($value -is [TimeSpan]) { $span = $value }
    elseif ($value -is [string] -and $value -match '^\d+$') { $span = [TimeSpan]::FromTicks([int64]$value) }
    elseif ($value -is [string]) { $span = [TimeSpan]::Parse($value) }
    elseif ($null -ne $value) { $span = [TimeSpan]::FromTicks([int64]$value) }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel'
      name    = 'idleTimeout'
      ticks   = [string]($span.Ticks)
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel' `
      -Name 'idleTimeout' -Value ([TimeSpan]::FromMinutes(20))

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value ([TimeSpan]::FromTicks([int64]$b.ticks))
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/applicationpools/add/processmodel

notes:
  pl: |
    Odczyt porównuje minuty, a nie zapis tekstowy, bo ten sam limit bywa zapisany
    na kilka sposobów. Wartość zero jest zgłaszana osobno jako brak limitu —
    inaczej wyglądałaby na wartość wygodnie mieszczącą się poniżej progu.

    Zapis obejmuje ustawienia domyślne pul. Pula z własnym limitem bezczynności
    wymaga poprawki na swoim poziomie i nie jest tu widoczna.
  en: |
    The reading compares minutes rather than the text, since the same limit can
    be written in several ways. A value of zero is reported separately as no
    limit - it would otherwise look like a value comfortably below the threshold.

    The setting covers the pool defaults. A pool with an idle limit of its own
    calls for a correction at its own level and is not visible here.
