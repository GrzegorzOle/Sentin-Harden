id: win10-installer-vendor-signed-updates-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Poprawki dostawcy bez prawa instalacji z podwyższonymi uprawnieniami
    en: A vendor's patches without leave to install with raised rights
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera poprawkom podpisanym przez dostawcę oprogramowania
    prawo do instalowania się z uprawnieniami podwyższonymi na koncie bez
    uprawnień.

    Mechanizm dotyczy poprawek do pakietów już zainstalowanych. Pomyślany
    był tak, że skoro program zainstalował administrator, a poprawkę
    podpisał ten sam dostawca, to poprawka może dojść do programu bez
    ponownego pytania o uprawnienia.

    Słabość leży w tym, co jest tu sprawdzane. System sprawdza, czy podpis
    poprawki zgadza się z podpisem pakietu bazowego. Nie sprawdza, czy
    poprawka robi to, co poprawka robić powinna. Treścią poprawki może być
    dowolne działanie wykonywane w trakcie instalacji — a wykonywane jest
    ono z uprawnieniami najwyższymi.

    Znaczy to, że każdy, kto zdobędzie klucz podpisujący dowolnego dostawcy,
    którego oprogramowanie stoi na maszynie, dostaje drogę z konta zwykłego
    do pełnych praw. Zdobycie klucza jednego dostawcy bywa łatwiejsze niż
    włamanie do maszyny, i tu właśnie leży wartość reguły.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne prawa
    do maszyny z konta zwykłego, gdy ma dostęp do klucza podpisującego
    któregokolwiek z zainstalowanych dostawców.
  en: |
    The setting takes from patches signed by a software vendor the leave to install themselves with raised
    rights on an account without rights.

    The mechanism touches patches to packages already installed. It was thought out thus: the program having
    been installed by an administrator and the patch signed by that same vendor, the patch may reach the program
    without a fresh question about rights.

    The weakness lies in what gets checked here. The system checks whether the patch's signature agrees with the
    base package's. It does not check whether the patch does what a patch ought to do. A patch's contents may be
    any act at all carried out in the course of installing - and it gets carried out with the highest rights.

    That means anybody who wins the signing key of any vendor whose software stands on the machine gets a road
    from an ordinary account to full rights. Winning one vendor's key is at times easier than breaking into the
    machine, and just there the rule's value lies.

    What an attacker gains while the item goes unmet: full rights to the machine from an ordinary account, where
    they have the signing key of any one of the installed vendors.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", z jednym zastrzeżeniem wartym przeczytania.

    Poprawki przestają instalować się same z konta bez uprawnień. Nie
    przestają się instalować w ogóle — po zmianie wymagają uprawnień
    administratora, czyli tego samego, czego wymaga instalacja pakietu.

    Odczuwalne jest to wyłącznie w jednym układzie: gdy program aktualizuje
    się sam, z konta zalogowanego użytkownika, i robi to poprawkami zamiast
    pełnych pakietów. Wtedy aktualizacja przestanie dochodzić, a program
    zwykle nie powie, dlaczego — powie tylko, że nie udało się zaktualizować.
    Stąd oznaczenie zmiany jako widocznej.

    Programy aktualizujące się przez własną usługę działającą na koncie
    systemowym zmiany nie zauważą. Tak działa większość oprogramowania
    utrzymywanego dziś.

    Nie ma znanych regresji.

    Czego to nie psuje: instalacji poprawek z konta administracyjnego,
    aktualizacji systemowych, wdrożeń przez narzędzie zarządzające, sieci,
    profili, programów już zainstalowanych.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption", with one reservation worth reading.

    Patches cease installing themselves from an account without rights. They do not cease installing at all -
    after the change they call for an administrator's rights, which is what installing a package calls for.

    It makes itself felt in one arrangement only: where a program updates itself, under the logged-on user's
    account, and does so by patches rather than full packages. The update will then cease arriving, and the
    program will as a rule not say why - it will say only that it failed to update. Hence the marking of the
    change as visible.

    Programs updating themselves through a service of their own running under the system account will not notice
    the change. That is how most of the software kept up today works.

    There are no known regressions.

    What this does not break: installing patches from an administrative account, system updates, rollouts by a
    management tool, the network, profiles, or programs already installed.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Program aktualizujący się sam z konta zalogowanego użytkownika poprawkami przestaje dostawać aktualizacje
      - Komunikat takiego programu mówi tylko o nieudanej aktualizacji i nie wskazuje przyczyny, więc szukanie trwa
      - Instalacja poprawki nadal jest możliwa, ale wymaga uprawnień administratora, tak jak instalacja pakietu
      - Programy aktualizujące się przez własną usługę na koncie systemowym nie zauważają zmiany w ogóle
      - Aktualizacje systemowe, wdrożenia przez narzędzie zarządzające, praca sieci i profile pozostają bez zmian
    en:
      - A program updating itself by patches under the logged-on users account ceases getting its updates
      - Such a programs message speaks only of a failed update and gives no cause, so the looking takes a while
      - Installing a patch stays possible but calls for an administrators rights, as installing a package does
      - Programs updating themselves through a service of their own under the system account do not notice the change at all
      - System updates, rollouts by a management tool, the work of the network and profiles stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie stoi program aktualizujący się poprawkami z konta użytkownika i nie ma innej drogi jego aktualizacji
    en:
      - A program stands on the machine updating itself by patches under a users account and there is no other road to its updates
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'DisableLUAPatching'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'DisableLUAPatching'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Patches keep installing, only they call now for an administrator's rights.
    # Where a program updates itself by patches under a user's account, the update
    # will cease arriving and the program will not say why.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLUAPatching' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/patching

notes:
  pl: |
    Reguła zamyka rodzinę instalatora i jest w niej najlepszym przykładem
    tego, czym różni się zaufanie do podpisu od zaufania do działania.
    Podpis mówi, kto poprawkę wydał. Nie mówi, co ta poprawka robi, a to
    właśnie wykonuje się z uprawnieniami najwyższymi.

    Warto, żeby aplikacja pokazała ją razem z regułą o parametrach
    instalacji. Obie dotyczą tego samego pytania — co wolno wykonać
    z uprawnieniami podwyższonymi w trakcie instalacji — i obie odpowiadają
    na nie przez zawężenie, nie przez zakaz.

    Odnotowuję, że objaw niezgodności bywa mylony z awarią aktualizacji
    samego programu. Aplikacja, która przy tej regule wymieni takie
    programy z nazwy po inwentaryzacji, oszczędzi komuś szukania.
  en: |
    The rule closes the installer family and is the best example in it of how trust in a signature differs from
    trust in an act. The signature says who issued the patch. It does not say what the patch does, and it is
    just that which gets carried out with the highest rights.

    It is well that the application show it together with the rule about installation parameters. Both touch the
    same question - what may be carried out with raised rights in the course of installing - and both answer it
    by narrowing rather than by forbidding.

    Worth noting that the symptom of a mismatch gets mistaken at times for a fault in the program's own
    updating. An application that at this rule names such programs after an inventory will spare somebody the
    looking.
