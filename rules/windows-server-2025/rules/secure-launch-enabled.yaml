id: win2025-secure-launch-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Bezpieczne uruchamianie systemu włączone
    en: Secure launch enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza bezpieczne uruchamianie systemu w zestawie ustawień
    warstwy wirtualizacji.

    Zostawiam kategorię wysoką i od razu mówię rzecz, przez którą ten
    punkt bywa pomijany: rozstrzyga on ten sam zamiar co punkt
    o bezpiecznym starcie warstwy wirtualizacji, ale zapisany w innym
    miejscu. Tamten wpis leży wśród zasad, ten wśród ustawień bieżącej
    konfiguracji sterowania.

    Nie jest to powtórzenie, które wolno odpuścić, i chcę to uzasadnić,
    a nie tylko stwierdzić. Benchmark sprawdza oba miejsca, więc raport,
    w którym jedno jest zielone, a drugie czerwone, jest stanem
    prawdziwym i częstym: zamiar zapisano w jednym miejscu, a w drugim
    nie. Maszyna w takim stanie wygląda na skonfigurowaną w połowie
    i zwykle nią jest — najczęściej dlatego, że ktoś ustawił zasadę
    w konsoli zarządzania, a wartość sterowania nigdy się za nią nie
    przepisała, albo odwrotnie, ktoś zmienił rejestr ręcznie, a zasada
    nadpisze to przy najbliższym odświeżeniu.

    Praktyczny wniosek jest taki, że te dwa punkty ustawia się razem
    i sprawdza razem, a rozjazd między nimi traktuje jako ustalenie samo
    w sobie: znaczy, że ktoś kiedyś robił tu coś ręcznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: to samo,
    co przy sąsiednim punkcie — możliwość umieszczenia się poniżej
    systemu, w warstwie, której system nie widzi.
  en: |
    The item switches on the safe starting of the system within the set of settings of the layer of
    unbodying.

    I leave the category high and say straightway the thing whereby that item is at times passed over -
    it settles the same will as the item upon the safe starting of the layer of unbodying, but written
    down in another stead. That entry lies among the rules, this one among the settings of the standing
    setting-up of steering.

    It is no saying over that may be let be, and I would give ground for that and not only state it.
    The benchmark looks into both steads, so a writ-up wherein the one is green and the other red is a
    true state and a common one - the will was written down in one stead and in the other was not. A
    machine in such a state looks half set up and mostly is - oftenest for that somebody set the rule
    in the board of ruling and the worth of steering never wrote itself over after it, or the other way
    about, somebody altered the roll by hand and the rule will write over it at the next freshening.

    The outcome in practice is that those two items are set together and looked into together, and the
    parting between them is held for a settling in itself - it means that somebody once did something
    here by hand.

    What an attacker gains while the item goes unmet - the same as at the item beside it - the might of
    setting themselves beneath the system, in a layer the system sees not.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia", tę samą co przy
    sąsiednim punkcie, i z tego samego powodu: skutek jest zerowy
    w normalnej pracy i całkowity przy rozruchu, jeżeli sprzęt albo
    oprogramowanie układowe nie spełnia wymagań.

    Jedna uwaga, która wynika z podwójnego zapisu i której nie ma przy
    tamtym punkcie. Skoro zasada nadpisuje wartość sterowania przy
    odświeżeniu, to cofnięcie zmiany wykonane tylko tutaj bywa pozorne:
    wartość wróci, gdy tylko zasada zostanie ponownie zastosowana.
    Przy wycofywaniu trzeba więc cofnąć oba punkty, a nie ten, który
    akurat wypadł czerwony.

    Ma to znaczenie w sytuacji najgorszej z możliwych, czyli gdy maszyna
    po restarcie nie wstała i cofa się zmianę z konsoli pod presją czasu.
    Cofnięcie jednego wpisu, restart i drugi nieudany rozruch to
    scenariusz, który zdarza się właśnie dlatego, że pod presją sprawdza
    się jedno miejsce.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I leave the class "needs a witting rolling out", the same as at the item beside it, and for the
    same ground - the outcome is nothing in everyday work and is whole at the rising, if the gear or
    the firmware meet not the demands.

    One note, following from the twofold writing and not to be had at that other item. Since the rule
    writes over the worth of steering at the freshening, an undoing of the change done only here is at
    times but a seeming - the worth will come back as soon as the rule be laid on anew. At the drawing
    back one must therefore undo both items and not the one that happened to come out red.

    This tells in the worst standing there may be, that is, when the machine rose not after a starting
    anew and the change is undone from the board under the press of time. The undoing of one entry, a
    starting anew and a second failed rising is a happening that befalls for just this reason, that
    under a press one stead is looked into.

    The change binds after a starting anew and is undone after a further one.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
  what_breaks:
    pl:
      - Sprzęt albo oprogramowanie układowe niespełniające wymagań daje maszynę, która po restarcie nie wstaje
      - Cofnięcie zmiany wykonane tylko w jednym z dwóch miejsc bywa pozorne, bo zasada nadpisze wartość przy odświeżeniu
      - Rozjazd między tym punktem a sąsiednim znaczy, że ktoś kiedyś zmieniał tu coś ręcznie
      - W normalnej pracy skutek jest zerowy — zmiana niczego nie blokuje i nie odmawia żadnemu programowi
    en:
      - Gear or firmware that meets not the demands gives a machine that after a starting anew rises not
      - An undoing of the change done in only one of the two steads is at times but a seeming, the rule writing over the worth at the freshening
      - A parting between this item and the one beside it means that somebody once altered something here by hand
      - In everyday work the outcome is nothing - the change blocks nothing and denies no program
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie układowe nie zostało uaktualnione do wersji wspieranej przez producenta maszyny
      - Nie ma sprawdzonej drogi dostępu do konsoli maszyny na wypadek, gdyby po restarcie nie wstała
    en:
      - The firmware was not made anew to a make borne by the maker of the machine
      - There is no proven road to the board of the machine for the case that it rise not after the starting anew
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\SystemGuard'
      $name = 'Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\SystemGuard'
    $name = 'Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The same intent as the policy item, recorded in the other of the two
    # places the benchmark checks. Set and roll back both together: undoing
    # only one is undone again at the next policy refresh.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\SystemGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Enabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/how-hardware-based-root-of-trust-helps-protect-windows

notes:
  pl: |
    Ten sam zamiar co punkt o bezpiecznym starcie warstwy wirtualizacji,
    zapisany w innym miejscu: tamten wśród zasad, ten wśród ustawień
    bieżącej konfiguracji sterowania. Benchmark sprawdza oba, więc
    raport z jednym zielonym i jednym czerwonym jest stanem prawdziwym
    i częstym.

    Rozjazd między nimi traktuj jako ustalenie samo w sobie: znaczy, że
    ktoś kiedyś robił tu coś ręcznie.

    Uwaga przy wycofywaniu, której nie ma przy tamtym punkcie: cofnięcie
    tylko jednego wpisu bywa pozorne, bo zasada nadpisze wartość przy
    odświeżeniu. Pod presją czasu, przy maszynie, która nie wstała, jest
    to scenariusz drugiego nieudanego rozruchu.
  en: |
    The same will as the item upon the safe starting of the layer of unbodying, written down in another
    stead - that one among the rules, this one among the settings of the standing setting-up of
    steering. The benchmark looks into both, so a writ-up with one green and one red is a true state
    and a common one.

    Hold the parting between them for a settling in itself - it means that somebody once did something
    here by hand.

    A note at the drawing back, not to be had at that other item - the undoing of one entry alone is at
    times but a seeming, the rule writing over the worth at the freshening. Under a press of time, at a
    machine that rose not, that is the happening of a second failed rising.
