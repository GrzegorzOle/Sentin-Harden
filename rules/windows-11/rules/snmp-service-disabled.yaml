id: win11-snmp-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania siecią starszym protokołem wyłączona
    en: The service managing the network by an older protocol disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia stan maszyny przez starszy protokół zarządzania siecią.
    Systemy nadzoru odpytują ją o obciążenie, interfejsy sieciowe, listę
    procesów, zainstalowane oprogramowanie i konfigurację, a w wielu
    wdrożeniach mogą też część ustawień zmienić.

    Cała rzecz opiera się na haśle wspólnym, przesyłanym w postaci jawnej.
    We wciąż spotykanych wersjach protokołu nie ma ani szyfrowania, ani
    uwierzytelniania wartego tej nazwy: kto zna ciąg znaków pełniący rolę
    hasła, ten jest uprawniony. Ciąg ten bywa domyślny i niezmieniony, bo
    zmiana wymagałaby przestawienia wszystkiego, co odpytuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, jest wyjątkowo
    konkretne. Odpytanie usługi zwraca gotowe rozpoznanie maszyny: co na niej
    stoi, w jakiej wersji, jakie ma adresy i przez jakie interfejsy jest
    podłączona. Jest to dokładnie ten materiał, od którego zaczyna się
    planowanie ataku — a zdobywa się go jednym zapytaniem z sieci, bez
    poświadczeń i bez śladu w dziennikach logowania.

    Tam, gdzie protokół pozwala na zapis, do rozpoznania dochodzi możliwość
    zmiany konfiguracji sieciowej maszyny.

    Na stanowisku roboczym nadzór tym protokołem nie ma zastosowania.
    Monitorowanie stacji prowadzi się dziś mechanizmami, które uwierzytelniają
    obie strony.
  en: |
    The service makes the machine's state available over an older network management
    protocol. Monitoring systems query it for load, network interfaces, the list of
    processes, installed software and configuration, and in many deployments may also
    change some settings.

    The whole thing rests on a shared password sent in the clear. In versions of the
    protocol still met with there is neither encryption nor authentication worth the name:
    whoever knows the string of characters acting as a password is authorised. That string
    is sometimes the default one, unchanged, because changing it would mean resetting
    everything that queries.

    What an attacker gains while the item goes unmet is unusually concrete. Querying the
    service returns a ready reconnaissance of the machine: what stands on it, in what
    version, what addresses it has and through what interfaces it is connected. It is
    exactly the material with which the planning of an attack begins - and it is had with
    one query from the network, with no credentials and no trace in the logon logs.

    Where the protocol allows writing, the reconnaissance is joined by the means of
    changing the machine's network configuration.

    At a workstation supervision by this protocol has no use. Monitoring of stations is
    done today by mechanisms that authenticate both sides.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy jakikolwiek system nadzoru odpytuje tę maszynę
    tym protokołem — a na stanowisku zwykle nie odpytuje.

    Składnik jest opcjonalny i standardowo nie jest instalowany. Na maszynie,
    na której nikt go nie dodał, zmiana nie ma czego dotknąć i sprawdzenie
    mówi o tym wprost, zamiast zgłaszać niezgodność.

    Jeżeli usługa jest zainstalowana i działa, skutkiem będzie zniknięcie
    maszyny z systemu nadzoru. Objawi się to nie błędem, tylko brakiem danych:
    wykresy się urwą, a maszyna zostanie zgłoszona jako nieosiągalna. Warto
    o tym uprzedzić osoby prowadzące monitorowanie, bo w przeciwnym razie
    zmiana wygląda z ich strony jak awaria.

    Nadzór nad stanowiskiem da się prowadzić dalej innymi drogami. Jeżeli
    maszyna ma być monitorowana, wskazane jest przeniesienie jej do mechanizmu
    uwierzytelniającego przed wyłączeniem tej usługi, a nie po.

    Zmiana wymaga zatrzymania usługi. Praca użytkownika nie zmienia się
    w żaden sposób.
  en: |
    What needs checking is whether any monitoring system queries this machine by this
    protocol - and at a station it usually does not.

    The component is optional and as a matter of course is not installed. On a machine
    where nobody added it the change has nothing to touch, and the check says so outright
    instead of reporting non-compliance.

    If the service is installed and running, the effect will be the machine's
    disappearance from the monitoring system. That will show not as an error but as an
    absence of data: the graphs will break off and the machine will be reported as
    unreachable. Those running the monitoring are worth warning, since otherwise the
    change looks from their side like a failure.

    Supervision of a station can be carried on by other routes. If the machine is to be
    monitored, moving it to an authenticating mechanism before disabling this service is
    advisable, rather than after.

    The change takes stopping the service. The user's work does not change in any way.

implementation_consequences:
  impact_areas:
    - remote-management
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - System nadzoru przestaje otrzymywać dane z tej maszyny i zgłasza ją jako nieosiągalną
      - Zdalny odczyt stanu interfejsów, obciążenia i listy procesów przestaje być możliwy
      - Zdalna zmiana konfiguracji sieciowej tym protokołem przestaje działać
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - The monitoring system stops receiving data from this machine and reports it as unreachable
      - Remote reading of interface state, load and the process list stops being possible
      - Remote changing of the network configuration by this protocol stops working
      - The user's work does not change in any way
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest monitorowana wyłącznie tym protokołem i nie ma zastępstwa
      - Urządzenie sieciowe albo system nadzoru wymaga odpytywania tej maszyny tą drogą
    en:
      - The machine is monitored by this protocol alone and has no replacement
      - A network device or monitoring system requires querying this machine by this route
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This service comes from an optional component. Where the component was
      # never added, a bare key without a startup value is left behind - that
      # is an absent service, not an unreadable one.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service removes the machine from any monitoring that reaches
    # it by this protocol.
    Stop-Service -Name 'SNMP' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SNMP' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SNMP' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/snmp/snmp-top

notes:
  pl: |
    Sprawdzenie odbiega tu od reszty reguł dotyczących usług i warto wiedzieć
    dlaczego. W pozostałych klucz usługi bez wartości uruchamiania jest stanem
    nienormalnym i zgłaszamy go jako niemożność sprawdzenia. Tutaj jest to
    stan zwyczajny: klucz zostaje po składniku opcjonalnym, którego nigdy nie
    dodano, i nie opisuje żadnej zainstalowanej usługi. Zgłaszanie w takiej
    sytuacji błędu byłoby fałszywym alarmem na większości maszyn.

    Usługa przyjmująca powiadomienia tego protokołu jest osobnym składnikiem,
    o innym kluczu, i ta reguła jej nie dotyczy. Bywa uruchomiona nawet tam,
    gdzie sama usługa nadzoru nie jest zainstalowana.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The check departs here from the rest of the rules about services, and it is worth
    knowing why. In the others a service key without a startup value is an abnormal state
    and we report it as an inability to check. Here it is the ordinary state: the key is
    left over from an optional component nobody ever added, and it describes no installed
    service. Reporting an error in such a case would be a false alarm on most machines.

    The service taking this protocol's notifications is a separate component, with a
    different key, and this rule does not concern it. It is sometimes running even where
    the supervision service itself is not installed.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
