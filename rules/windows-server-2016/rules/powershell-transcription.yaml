id: win2016-powershell-transcription

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows PowerShell
  title:
    pl: Zapis przebiegu sesji powłoki włączony
    en: The recording of the shell session's course switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zapisywać do pliku cały przebieg sesji powłoki: wpisane
    polecenia wraz z tym, co zwróciły.

    Różnica wobec reguły poprzedniej jest tu istotna i warto ją postawić
    od razu. Tamta zapisuje kod, który powłoka wykonała. Ta zapisuje
    rozmowę: co wpisano i co odpowiedziało. Wyniki poleceń są w niej
    widoczne, a właśnie wyniki mówią, co napastnik zobaczył — a więc co
    wie.

    Dla rozpoznania po incydencie jest to różnica między wiedzą, jakie
    polecenia padły, a wiedzą, jaką odpowiedź na nie dostał ten, kto je
    wydał. Pierwsza mówi o zamiarze; druga o skutku.

    Zapis trafia do plików, a nie do dziennika systemowego, i to pociąga
    za sobą całą uciążliwość tego punktu. Plik leży na dysku, zajmuje
    miejsce i jest osiągalny dla tego, czyją sesję opisuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    po jego pracy nie zostanie zapis tego, co zobaczył — a więc że zakres
    wycieku pozostanie nieznany.
  en: |
    The setting has the whole course of a shell session written to a file: the
    commands typed along with what they returned.

    The difference from the previous rule matters here and is worth putting at once.
    That one records the code the shell ran. This one records the conversation: what
    was typed and what answered. The commands' results show in it, and it is the
    results that say what an attacker saw - and so what they know.

    For establishing things after an incident that is the difference between knowing
    what commands were given and knowing what answer whoever gave them received. The
    first speaks of intent; the second of effect.

    The record goes to files rather than to the system log, and that brings with it
    the whole disruption of this item. The file lies on a disk, takes room, and is
    reachable by whoever's session it describes.

    What an attacker gains while the item goes unmet: the certainty that after their
    work no record will remain of what they saw - and so that the extent of the leak
    will stay unknown.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rozstrzyga miejsce zapisu.

    Pozostawiony domyślnie zapis trafia do katalogu w profilu użytkownika.
    Znaczy to, że ten, czyją sesję opisuje, może go przeczytać, zmienić
    i usunąć — a zapis, który opisywany może usunąć, nie jest dowodem
    niczego. Jest to najczęstszy błąd przy wdrażaniu tego punktu i dlatego
    uwaga o wskazaniu katalogu siedzi w poleceniu naprawczym.

    Katalog właściwy to taki, do którego konto sesji może pisać, ale nie
    może czytać ani kasować. Zwykle jest to udział sieciowy z odpowiednio
    ustawionymi uprawnieniami, co czyni z wdrożenia zadanie
    infrastrukturalne, a nie zmianę wpisu.

    Rzecz druga to objętość. Zapisywane są wyniki poleceń, a te bywają
    wielkie: wypisanie listy plików, zawartość dużej tabeli, zawartość
    pliku konfiguracyjnego. Na maszynie pracującej dużo powłoką zapis
    potrafi zająć znacznie więcej miejsca niż dziennik.

    Rzecz trzecia dotyczy treści. W zapisie ląduje wszystko, co powłoka
    wypisała — łącznie z danymi, których nikt nie zamierzał kopiować poza
    sesję. Katalog zapisu staje się przez to miejscem wymagającym ochrony
    takiej jak dane, które przez tę maszynę przepływają.

    Czego to nie psuje: działania skryptów, usług, zarządzania zdalnego,
    wykonywania poleceń.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and the place of the record settles it.

    Left to the default, the record goes to a directory in the user's profile. That
    means whoever's session it describes can read it, change it and delete it - and
    a record the described can delete is proof of nothing. That is the commonest
    mistake at this item's rollout, and so the remark about naming a directory sits
    in the remedial command.

    The proper directory is one the session's account may write to but may neither
    read nor delete from. As a rule that is a network share with rights set
    accordingly, which makes the rollout a task of infrastructure rather than a
    change of an entry.

    The second thing is volume. What is recorded are the commands' results, and
    those are at times large: a listing of files, the contents of a big table, the
    contents of a configuration file. On a machine working much in the shell the
    record can take considerably more room than the log.

    The third thing concerns substance. Everything the shell printed lands in the
    record - data nobody meant to copy outside the session included. The directory
    of the record thereby becomes a place calling for the same protection as the
    data flowing through this machine.

    What this does not break: the working of scripts, services, remote management,
    or the running of commands.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - Zapis pozostawiony domyślnie trafia do profilu użytkownika, więc opisywany może go przeczytać, zmienić i usunąć
      - Na maszynie pracującej dużo powłoką zapis zajmuje znacznie więcej miejsca niż dziennik, bo zawiera wyniki poleceń
      - W zapisie ląduje wszystko, co powłoka wypisała, więc katalog zapisu wymaga ochrony takiej jak dane przepływające przez maszynę
      - Działanie skryptów, usługi, zarządzanie zdalne i wykonywanie poleceń pozostają bez zmian
    en:
      - Left to the default the record goes to the user's profile, so the described can read it, change it and delete it
      - On a machine working much in the shell the record takes considerably more room than the log, holding the commands' results
      - Everything the shell printed lands in the record, so its directory calls for the same protection as the data flowing through the machine
      - The working of scripts, services, remote management and the running of commands stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przygotowano katalogu, do którego konto sesji może pisać, ale nie może czytać ani kasować
      - Na dysku maszyny nie ma miejsca na zapis wyników poleceń, a udziału sieciowego nie przewidziano
      - Przez powłokę na tej maszynie przepływają dane chronione, a katalogu zapisu nie objęto ochroną im należną
    en:
      - No directory has been prepared that the session's account may write to but neither read nor delete from
      - There is no room on the machine's disk for a record of commands' results, and no network share has been provided
      - Protected data flow through the shell on this machine and the record's directory has not been given the protection due to them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
      $name = 'EnableTranscripting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
    $name = 'EnableTranscripting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle the target directory first and make it a place the session's own
    # account may write to and not read back. Left to the default, the record
    # lands where whoever it describes can delete it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableTranscripting' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_group_policy_settings

notes:
  pl: |
    Punkt jest w bloku najdroższy we wdrożeniu i jedyny, który wymaga
    przygotowania poza maszyną. Warto to powiedzieć wprost, bo wpis
    rejestrowy wygląda tak samo jak każdy inny, a praca stoi gdzie indziej.

    Zależność od reguły poprzedniej jest praktyczna. Zapis bloków skryptu
    mówi, co zostało wykonane; zapis przebiegu sesji mówi, co z tego
    wyniknęło. Wdrożone razem dają obraz pełny, osobno — połowiczny. Warto
    je pokazywać obok siebie, z zaznaczeniem, że kosztują bardzo różnie.

    Rzecz warta powtórzenia w interfejsie: zapis, do którego opisywany ma
    dostęp, nie jest dowodem. Zgodność tego punktu przy zapisie w profilu
    użytkownika jest zgodnością techniczną, która w razie incydentu okaże
    się bezwartościowa — i jest to dokładnie ten rodzaj pozornej zgodności,
    który aplikacja ma wychwytywać.
  en: |
    The item is the dearest in the block to roll out and the only one calling for
    preparation outside the machine. That is worth saying outright, the registry
    entry looking like any other while the work stands elsewhere.

    The bearing of the previous rule is a practical one. The recording of script
    blocks says what was run; the recording of a session's course says what came of
    it. Rolled out together they give a full picture, apart a half one. They are
    worth showing side by side, with it marked that they cost very differently.

    A thing worth repeating in the interface: a record the described has access to
    is no proof. Compliance at this item with the record in the user's profile is a
    technical compliance that in the event of an incident will prove worthless - and
    that is exactly the kind of compliance in appearance the application is to
    catch.
