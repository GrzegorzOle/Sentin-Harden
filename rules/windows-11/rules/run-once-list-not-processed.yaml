id: win11-run-once-list-not-processed

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Lista programów uruchamianych jednorazowo pomijana
    en: The list of programs started once passed over
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Obok listy programów startowych system czyta listę jednorazową: wpis
    uruchamia się przy najbliższym starcie i zaraz potem znika. Mechanizm
    powstał dla instalatorów, którym brakuje jednego kroku po ponownym
    uruchomieniu maszyny — dokończenia kopiowania, rejestracji składnika,
    usunięcia plików tymczasowych.

    Samokasowanie się wpisu, wygodne dla instalatora, jest wprost tym, czego
    szuka napastnik. Kod uruchamia się raz, w sesji następnej osoby logującej
    się do maszyny, po czym wpis przestaje istnieć. Zostaje działanie bez
    zostawionego śladu w miejscu, w które zajrzałby ktoś sprawdzający
    automatyczny start.

    Droga jest wykorzystywana w praktyce i to w obie strony naraz: żeby przetrwać
    ponowne uruchomienie maszyny i żeby wykonać się w sesji kogoś o wyższych
    uprawnieniach niż ten, kto wpis zostawił. Napastnik, który ma już
    uprawnienia na maszynie, dopisuje wpis i czeka na zalogowanie się
    administratora.

    Punkt każe systemowi tę listę pomijać. Wpisy mogą tam trafiać, ale nie będą
    uruchamiane.
  en: |
    Beside the list of startup programs the system reads a one-time list: an entry
    starts at the next start and vanishes right after. The mechanism was made for
    installers short of one step after the machine is restarted - finishing a copy,
    registering a component, clearing temporary files.

    An entry deleting itself, convenient for an installer, is exactly what an attacker
    is after. The code runs once, in the session of the next person signing in to the
    machine, after which the entry stops existing. What is left is an action with no
    trace left in a place anyone checking automatic start would look.

    The route is used in practice, and in both directions at once: to survive a
    restart of the machine and to run in the session of somebody with higher
    privileges than whoever left the entry. An attacker who already holds privileges
    on the machine adds an entry and waits for an administrator to sign in.

    The item has the system pass the list over. Entries may still arrive there, but
    they will not be started.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak na stanowiskach instaluje się oprogramowanie.

    Instalator, który zaplanował dokończenie pracy po ponownym uruchomieniu,
    po wdrożeniu tego kroku nie wykona. Program zostanie w stanie pośrednim:
    pliki na miejscu, ale składnik niezarejestrowany albo konfiguracja
    niedokończona. Bywa, że objawia się to dopiero przy pierwszym użyciu
    i wygląda jak błąd samego programu, a nie jak skutek zasady.

    Dotyczy to przede wszystkim instalatorów starszych i tych rozprowadzanych
    poza centralnym narzędziem. Nowsze pakiety instalacyjne dokańczają pracę
    usługą instalatora i ta droga pozostaje otwarta. Aktualizacje systemu nie
    korzystają z tej listy i działają bez zmian.

    Drugi skutek dotyczy narzędzi przygotowujących stanowisko: obrazy,
    skrypty pierwszego uruchomienia i rozwiązania zarządzania potrafią domykać
    konfigurację właśnie tą drogą. Jeżeli tak jest, punkt trzeba wdrożyć po
    zakończeniu przygotowania maszyny, a nie przed.

    Nie ma restartu, ale skutek widać dopiero przy najbliższym uruchomieniu.
  en: |
    What needs checking is how software gets installed on the stations.

    An installer that planned to finish its work after a restart will not carry that
    step out after the rollout. The program stays in a halfway state: files in place,
    but a component unregistered or a configuration unfinished. It sometimes shows
    only at first use and looks like a fault in the program rather than the effect of
    a policy.

    This concerns older installers above all, and those distributed outside a central
    tool. Newer installation packages finish their work through the installer service
    and that route stays open. System updates do not use this list and work unchanged.

    The second effect concerns tools preparing a station: images, first-run scripts
    and management solutions can close off a configuration by exactly this route. Where
    that is so, the item has to be applied after the machine's preparation is
    finished, not before.

    There is no restart, but the effect shows only at the next start.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Instalator dokańczający pracę po ponownym uruchomieniu zostawi program w stanie pośrednim
      - Skrypt pierwszego uruchomienia przygotowujący stanowisko przestanie się wykonywać
      - Starsze pakiety instalacyjne rozprowadzane poza centralnym narzędziem mogą nie dokończyć konfiguracji
      - Aktualizacje systemu i instalacje przez usługę instalatora działają bez zmian
    en:
      - An installer finishing its work after a restart leaves the program in a halfway state
      - A first-run script preparing a station stops running
      - Older installation packages distributed outside a central tool may not finish their configuration
      - System updates and installs through the installer service work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko jest właśnie przygotowywane i konfigurację domyka skrypt pierwszego uruchomienia
      - Oprogramowanie branżowe instaluje się instalatorem dokańczającym pracę po ponownym uruchomieniu
    en:
      - The station is being prepared and a first-run script closes off the configuration
      - Trade software installs with an installer that finishes its work after a restart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'DisableLocalMachineRunOnce'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'DisableLocalMachineRunOnce'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalMachineRunOnce' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/setupapi/run-and-runonce-registry-keys

notes:
  pl: |
    Reguła powtarza kształt swojej pary — pominięcia starszej listy programów
    startowych — i jest to zamierzone. Oba punkty czyta się razem, oba wdraża
    razem i oba mają tę samą wartość dopiero we dwa.

    Różnica jest w koszcie. Starsza lista bywa pusta i wtedy jej pominięcie nie
    kosztuje nic. Lista jednorazowa jest używana przez instalatory na bieżąco,
    więc to ten punkt częściej daje o sobie znać — i to jego warto wdrażać po
    zakończeniu przygotowania stanowiska.

    Pominięcie nie czyści listy. Wpisy pozostawione tam wcześniej zostają
    w rejestrze i wrócą do uruchamiania po wycofaniu punktu. Przy podejrzeniu
    kompromitacji maszyny listę trzeba obejrzeć i wyczyścić osobno.

    Wycofanie nie usuwa gałęzi — jest wspólna z ustawieniami nośników wymiennych
    i powłoki.
  en: |
    The rule repeats the shape of its pair - the passing over of the older list of
    startup programs - and that is deliberate. Both items are read together, applied
    together and both hold their worth only as a pair.

    The difference lies in the cost. The older list is often empty and then passing it
    over costs nothing. The one-time list is used by installers as a matter of course,
    so it is this item that makes itself felt more often - and it is this one worth
    applying after a station's preparation is finished.

    Passing the list over does not clear it. Entries left there earlier stay in the
    registry and will go back to being started once the item is undone. Where a
    machine is suspected of being compromised the list has to be looked at and cleared
    separately.

    Rollback does not remove the key - it is shared with the removable media and shell
    settings.
