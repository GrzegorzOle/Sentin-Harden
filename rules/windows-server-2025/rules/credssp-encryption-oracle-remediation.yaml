id: win2025-credssp-encryption-oracle-remediation

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Credentials Delegation
  title:
    pl: Odmowa połączenia z serwerami bez poprawki mechanizmu delegowania poświadczeń
    en: Connections refused to servers without the credential delegation fix
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt każe odmawiać połączenia, gdy druga strona nie ma poprawki
    usuwającej błąd w mechanizmie przekazywania poświadczeń. Błąd ten
    pozwalał komuś stojącemu w środku połączenia doprowadzić do
    ujawnienia przekazywanych poświadczeń.

    Wartość tej zmiany jest inna niż większości punktów tej grupy i warto
    to rozróżnić. Nie chodzi o wzmocnienie tej maszyny, tylko o to, żeby
    przestała rozmawiać z maszynami, które są słabe. Ochrona jest tu
    pochodną stanu sąsiadów, nie stanu własnego.

    Na serwerze punkt dotyczy obu kierunków i to podnosi jego wagę.
    Serwer bywa maszyną pośredniczącą, z której administratorzy łączą się
    dalej — i wtedy każde połączenie do niezałatanej maszyny jest
    połączeniem, przy którym ich poświadczenia można wydobyć. Bywa też
    stroną docelową i wtedy sam musi mieć poprawkę, bo inaczej to do
    niego nie będzie się dało wejść.

    Zostawiam kategorię wysoką. Wykorzystanie wymaga od napastnika
    dodatkowego warunku — miejsca w środku połączenia — ale spełnienie
    tego warunku w sieci wewnętrznej nie jest trudne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    poświadczenia administratora, który łączy się z tego serwera do
    maszyny, gdzie napastnik zdołał stanąć pośrodku.
  en: |
    The item bids the refusing of a binding where the other side has not the mending that does away
    with a fault in the working that hands tokens of leave over. That fault let one standing in the
    midst of a binding bring about the laying bare of the tokens handed over.

    The worth of this change is other than that of most items of this group, and it is worth telling
    apart. It is not about the strengthening of this machine but about its ceasing to speak with
    machines that are weak. The guard here follows from the state of the neighbours and not from
    one's own.

    On a server the item bears on both ways, and that raises its weight. A server is at times the
    machine that goes between, wherefrom administrators bind on further - and then every binding to
    an unmended machine is a binding whereat their tokens of leave may be drawn out. It is at times
    also the side meant, and then it must itself have the mending, else it will not be come into.

    I leave the category high. The using takes of an attacker a further bond - a place in the midst
    of a binding - but the meeting of that bond within an inward net is not hard.

    What an attacker gains while the item goes unmet - the tokens of leave of an administrator
    binding off that server to a machine whereon the attacker has managed to stand in the midst.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia, choć dla stacji roboczej
    wystarcza sprawdzenie. Powód leży w tym, kogo ta odmowa spotka i w
    którym momencie.

    Po zmianie ta maszyna przestaje się łączyć z każdą maszyną bez
    poprawki. Nie jest to lista, którą da się zobaczyć — ustala się ją
    połączenie po połączeniu, w chwili próby. W sieci wewnętrznej
    maszynami bez poprawki są zwykle te, do których nikt nie zagląda:
    stare konsole urządzeń, serwery aplikacji dziedziczonych, maszyny
    testowe, które stały się produkcyjnymi, i sprzęt z własnym systemem
    dostarczonym przez producenta.

    Moment jest tu najgorszy z możliwych i to on przesądza o klasie.
    Odmowa pojawia się przy próbie połączenia, a najważniejsze próby
    połączenia z maszyną, o której nikt nie pamięta, zdarzają się wtedy,
    gdy właśnie przestała działać. Człowiek, który pierwszy zobaczy
    komunikat, jest człowiekiem naprawiającym awarię.

    Dlatego kolejność wygląda tak: najpierw zbierz listę maszyn, do
    których z tego serwera ktokolwiek się łączy, sprawdź ich stan,
    załataj albo zapisz wyjątek dla konkretnej maszyny, i dopiero potem
    zamknij ustawienie. Zmiana na serwerze pośredniczącym bez tego kroku
    jest zmianą, którą cofnie się w środku nocy.

    Zmiana cofa się natychmiast i nie wymaga restartu. Sesje już otwarte
    nie są zrywane — warunek sprawdza się przy kolejnym połączeniu.
  en: |
    I raise the class to a witting rolling out, though for a workstation a checking is enough. The
    ground lies in whom that refusal will meet and at what moment.

    After the change this machine stops binding to every machine without the mending. It is no list
    to be seen - it is settled binding by binding, at the hour of the trying. Within an inward net
    the machines without the mending are mostly those nobody looks at - old boards of gear, servers
    of inherited applications, machines for trials that became machines of production, and gear with
    a system of its own given by its maker.

    The moment is here the worst there could be, and it is that which settles the class. The refusal
    comes at the trying of a binding, and the weightiest tryings of a binding to a machine nobody
    remembers happen just when it has stopped working. The person who first sees the word given is
    the person mending a fault.

    Therefore the order looks thus - first gather the list of machines anybody binds to off that
    server, look to their state, mend them or write an exception down for the one machine, and only
    then shut the setting. A change on a machine that goes between without that step is a change
    that will be undone in the middle of the night.

    The change is undone at once and takes no restart. Sittings already open are not broken off -
    the bond is looked to at the next binding.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - legacy-applications
  what_breaks:
    pl:
      - Maszyna przestaje się łączyć z każdą maszyną bez poprawki, a listy takich maszyn nie da się zobaczyć
      - Bez poprawki bywają stare konsole urządzeń, serwery aplikacji dziedziczonych i sprzęt z własnym systemem
      - Odmowa pojawia się przy próbie połączenia, czyli zwykle w trakcie naprawiania awarii
      - Człowiek, który pierwszy zobaczy komunikat, jest człowiekiem naprawiającym awarię
      - Sesje już otwarte nie są zrywane, warunek sprawdza się przy kolejnym połączeniu
    en:
      - The machine stops binding to every machine without the mending, and that list cannot be seen
      - Without the mending are at times old boards of gear, servers of inherited applications and gear with a system of its own
      - The refusal comes at the trying of a binding, that is mostly in the midst of the mending of a fault
      - The person who first sees the word given is the person mending a fault
      - Sittings already open are not broken off, the bond is looked to at the next binding
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie zebrano listy maszyn, do których z tego serwera ktokolwiek się łączy, i nie sprawdzono ich stanu
      - Serwer jest maszyną pośredniczącą, a wśród celów są urządzenia z systemem dostarczonym przez producenta
    en:
      - The list of machines anybody binds to off that server was not gathered and their state not looked to
      - The server is a machine that goes between and among its targets is gear with a system given by its maker
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
      $name = 'AllowEncryptionOracle'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
    $name = 'AllowEncryptionOracle'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a jump host gather first the list of machines anybody connects to from
    # here: the refusal shows up at connect time, usually during an outage.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowEncryptionOracle' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/credentials-protection-and-management/credential-guard-considerations

notes:
  pl: |
    Wartość tej zmiany jest inna niż większości punktów grupy: nie
    chodzi o wzmocnienie tej maszyny, tylko o to, żeby przestała
    rozmawiać z maszynami słabymi. Ochrona jest pochodną stanu
    sąsiadów, nie stanu własnego.

    Klasa podniesiona przez moment, w którym odmowa się pojawia:
    przy próbie połączenia z maszyną, o której nikt nie pamięta —
    a takie próby zdarzają się wtedy, gdy ta maszyna właśnie przestała
    działać. Pierwszy zobaczy komunikat człowiek naprawiający awarię.

    Na serwerze pośredniczącym bez zebrania listy celów jest to zmiana,
    którą cofnie się w środku nocy.
  en: |
    The worth of this change is other than that of most items of the group - it is not about the
    strengthening of this machine but about its ceasing to speak with weak ones. The guard follows
    from the state of the neighbours and not from one's own.

    The class is raised by the moment the refusal comes at - at the trying of a binding to a machine
    nobody remembers, and such tryings happen just when that machine has stopped working. The first
    to see the word given is the person mending a fault.

    On a machine that goes between, without the gathering of the list of targets, it is a change
    that will be undone in the middle of the night.
