id: win10-error-reporting-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zgłaszania błędów wyłączona
    en: The service reporting faults switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę zbierającą dane o błędach programów
    i systemu i wysyłającą je producentowi.

    Zgłoszenie błędu nie jest krótkim komunikatem. Zawiera zrzut pamięci
    programu w chwili awarii, nazwę i wersję programu, ścieżkę pliku,
    a często także fragmenty przetwarzanych danych. Zrzut pamięci potrafi
    zawierać wszystko, co program miał wtedy w rękach.

    Zagrożenie płynie z treści zrzutu. Program obsługujący dokument ma
    w pamięci ten dokument. Program łączący się z bazą ma w pamięci
    poświadczenia. Awaria w niewłaściwej chwili oznacza wysłanie tego
    poza organizację, bez niczyjej decyzji.

    Drugim zastrzeżeniem jest to, że zgłoszenia gromadzą się także
    miejscowo, w katalogu na dysku. Powstaje tam zbiór zrzutów pamięci,
    do którego nikt nie zagląda, a który bywa czytelny dla użytkownika.

    Odnotowuję, że wyłączenie usługi odbiera także pożyteczną stronę
    mechanizmu: dzienniki awarii bywają jedynym śladem, po którym da się
    ustalić, co powtarza się na maszynie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zbiór
    zrzutów pamięci na dysku i kanał wysyłający je na zewnątrz.
  en: |
    The setting switches off the service gathering word of the faults of programs and of the system and sending it
    to the maker.

    A report of a fault is no short message. It holds a casting out of the program's memory at the hour of the
    breakdown, the program's name and version, the road to its file, and often pieces of the data then being
    worked upon. A casting out of memory can hold everything the program then had in its hands.

    The danger flows from the content of the casting out. A program working upon a paper has that paper in memory.
    A program joining itself to a store of data has warrants in memory. A breakdown at the wrong hour means the
    sending of that beyond the body, with nobody's decision.

    The second reservation is that the reports gather upon the spot as well, in a directory upon the disk. There
    arises a gathering of castings out of memory nobody looks into, and one at times readable by the user.

    I set down that the switching off of the service takes also the useful side of the mechanism: records of
    breakdowns are at times the one trace by which it may be told what keeps happening upon a machine.

    What an attacker gains while the item goes unmet: a gathering of castings out of memory upon the disk and a
    channel sending them abroad.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    obsługa opiera diagnozę na zgłoszeniach awarii.

    Miejscem pierwszym jest dział wsparcia. Zgłoszenie awarii bywa
    jedynym materiałem, na którym da się ustalić, dlaczego program
    zamyka się sam. Po zmianie zostanie sam komunikat, bez zrzutu.

    Miejscem drugim są producenci oprogramowania branżowego proszący
    o zrzut pamięci przy zgłaszaniu usterki. Po zmianie trzeba będzie
    zebrać go inną drogą, ręcznie, w chwili wystąpienia problemu.

    Odnotowuję, że rozwiązaniem pośrednim jest pozostawienie zbierania
    miejscowego i zamknięcie samego wysyłania. Są na to osobne punkty
    w zasadach i warto je rozważyć przed wyłączeniem usługi w całości.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pracy programów, dzienników zdarzeń systemu,
    aktualizowania, logowania, drukowania, dostępu do sieci.
  en: |
    The class is "needs review", and the object of the review is whether the keepers rest their telling of causes
    upon reports of breakdowns.

    The first place is the board of help. A report of a breakdown is at times the one matter by which it may be
    told why a program shuts itself. After the change there will be left the message alone, with no casting out.

    The second place is makers of software of a trade who ask for a casting out of memory at the reporting of a
    fault. After the change it will have to be gathered by another road, by hand, at the hour the trouble comes.

    I set down that a middle answer is the leaving of the gathering upon the spot and the shutting of the sending
    alone. There are items apart for that among the policy, and they are worth weighing before the service is
    switched off whole.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the work of programs, the system's records of happenings, the bringing up to date,
    logging on, printing, or the reach of the network.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Dział wsparcia straci zrzuty pamięci, na których ustala, dlaczego program zamyka się sam
      - Producenci oprogramowania branżowego proszący o zrzut przy zgłoszeniu usterki będą musieli dostać go inną drogą
      - Zrzut trzeba będzie zebrać ręcznie, w chwili wystąpienia problemu, co nie zawsze jest wykonalne
      - Rozwiązaniem pośrednim jest pozostawienie zbierania miejscowego i zamknięcie samego wysyłania
      - Praca programów, dzienniki zdarzeń systemu, aktualizowanie, logowanie i drukowanie pozostają bez zmian
    en:
      - The board of help will lose the castings out of memory by which it tells why a program shuts itself
      - Makers of software of a trade who ask for a casting out at the reporting of a fault will have to get it by another road
      - The casting out will have to be gathered by hand at the hour the trouble comes, which is not always to be done
      - A middle answer is the leaving of the gathering upon the spot and the shutting of the sending alone
      - The work of programs, the system s records of happenings, the bringing up to date, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Dział wsparcia opiera diagnozę powtarzających się awarii na zrzutach pamięci z tej maszyny
    en:
      - The board of help rests its telling of the cause of repeated breakdowns upon castings out of memory from this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'WerSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WerSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WerSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Reguła jest z tych, w których warto uczciwie powiedzieć, co się
    traci. Zgłoszenia awarii bywają jedynym materiałem diagnostycznym,
    a wyłączenie usługi odbiera go całkiem, nie tylko po stronie
    producenta.

    Argument wart postawienia wprost dotyczy treści zrzutu. Nie jest to
    opis błędu — to zawartość pamięci programu w chwili awarii. Program
    obsługujący dokument ma w niej ten dokument, program łączący się
    z bazą ma poświadczenia. Wysyłka takiego materiału poza organizację
    jest decyzją, którą ktoś powinien podjąć świadomie.

    Odnotowuję rozwiązanie pośrednie: zbieranie miejscowe zostaje,
    wysyłanie zostaje zamknięte osobnym punktem. Aplikacja powinna je
    wskazać, bo dla wielu maszyn jest to właściwy wybór.
  en: |
    The rule is of those where it is well to say honestly what is lost. Reports of breakdowns are at times the one
    matter for the telling of causes, and the switching off of the service takes it away altogether and not only
    upon the maker's side.

    The argument worth putting outright touches the content of a casting out. It is no setting out of a fault - it
    is the content of a program's memory at the hour of the breakdown. A program working upon a paper has that
    paper in it, a program joining itself to a store of data has warrants. The sending of such matter beyond the
    body is a decision somebody ought to take knowingly.

    I set down the middle answer: the gathering upon the spot stays, the sending is shut by an item apart. The
    application ought to point it out, it being for many machines the right choice.
