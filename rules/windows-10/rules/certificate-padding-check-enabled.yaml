id: win10-certificate-padding-check-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Ścisłe sprawdzanie wypełnienia podpisu pliku wykonywalnego włączone
    en: Strict checking of an executable signature padding switched on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe sprawdzać, czy podpis pliku wykonywalnego nie zawiera
    treści dopisanej poza tym, co podpis obejmuje.

    Format pliku podpisanego zostawia w strukturze podpisu miejsce, które
    nie jest liczone do skrótu. Można tam dopisać dowolne dane, a podpis
    pozostanie ważny — plik zmieniony przedstawia się wtedy jako plik
    nadal podpisany przez wydawcę.

    Znaczenie tego jest poważniejsze, niż wygląda. Cały mechanizm zaufania
    do programów opiera się na założeniu, że ważny podpis oznacza
    niezmieniony plik. Miejsce, w którym da się coś dopisać bez unieważnienia
    podpisu, znosi to założenie — a wraz z nim wartość każdego sprawdzenia
    opartego na podpisie.

    Ścisłe sprawdzanie wypełnienia zamyka tę drogę: plik z dopisaną
    treścią przestaje być uznawany za poprawnie podpisany.

    Odnotowuję, że ustawienie jest przechowywane w dwóch miejscach, po
    jednym na sposób uruchamiania programów. Program sprawdza podpis
    w widoku, w którym działa, więc wpis w jednym miejscu obejmuje tylko
    część programów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    dołożenia własnej treści do cudzego podpisanego pliku bez utraty
    ważności podpisu.
  en: |
    The setting has it checked whether an executable file's signature holds matter added beyond what the signature
    takes in.

    The format of a signed file leaves within the signature's structure a room that is not reckoned into the
    digest. Any data at all may be added there and the signature will stay valid - a changed file then presenting
    itself as one still signed by its issuer.

    The weight of that is graver than it looks. The whole mechanism of trust in programs rests upon the
    assumption that a valid signature means an unchanged file. A room in which something may be added without the
    signature falling undoes that assumption - and with it the worth of every check resting upon a signature.

    Strict checking of the padding shuts that road: a file with matter added ceases to be held rightly signed.

    I set down that the setting is kept in two places, one per manner of running programs. A program checks a
    signature in the view it runs in, so an entry in one place takes in a part of the programs alone.

    What an attacker gains while the item goes unmet: the adding of matter of their own to somebody else's signed
    file without the signature falling.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    w użyciu są pliki korzystające z tego miejsca zgodnie z przeznaczeniem.

    Miejsce to bywa używane legalnie. Niektórzy dostawcy zapisują tam dane
    o instalacji: identyfikator klienta, wariant pakietu, parametry
    wdrożenia. Po zmianie takie pliki przestaną być uznawane za poprawnie
    podpisane, a system je odrzuci.

    Skutek jest widoczny natychmiast: instalator nie uruchomi się,
    sterownik nie zostanie wczytany, aktualizacja nie przejdzie. Komunikat
    wskaże na problem z podpisem, więc rozpoznanie przyczyny jest tu
    łatwiejsze niż zwykle.

    Sprawdzenie polega na uruchomieniu na jednej maszynie oprogramowania
    instalowanego regularnie — instalatorów, sterowników, pakietów
    aktualizacyjnych — i sprawdzeniu, czy wszystko przechodzi.

    Odnotowuję, że wycofanie zmiany jest natychmiastowe i nie wymaga
    restartu, więc koszt pomyłki jest tu niski.

    Czego to nie psuje: uruchamiania programów już zainstalowanych,
    logowania, dostępu do plików, wydajności, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether files are in use that put that room to
    its intended purpose.

    That room is at times used lawfully. Some suppliers write data about an installation there: a customer's mark,
    the variant of a package, the parameters of a rollout. After the change such files will cease to be held
    rightly signed and the system will turn them away.

    The consequence shows at once: an installer will not run, a driver will not be taken in, an update will not go
    through. The message will point at a trouble with the signature, so the telling of the cause is here easier
    than is usual.

    The review is done by running upon one machine the software installed regularly - installers, drivers,
    packages of updates - and seeing whether all goes through.

    I set down that the taking back of the change is at once and calls for no restart, so the cost of a mistake is
    here a low one.

    What this does not break: the running of programs already installed, logging on, the way to files, speed, or
    printing.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - updates-and-servicing
    - drivers-and-devices
  what_breaks:
    pl:
      - Pliki, w których dostawca zapisał dane o instalacji w miejscu poza podpisem, przestaną być uznawane za podpisane
      - Instalator się nie uruchomi, sterownik nie zostanie wczytany, a aktualizacja nie przejdzie
      - Komunikat wskaże na problem z podpisem, więc rozpoznanie przyczyny jest łatwiejsze niż zwykle
      - Wycofanie zmiany jest natychmiastowe i nie wymaga restartu, więc koszt pomyłki jest niski
      - Uruchamianie programów już zainstalowanych, logowanie, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - Files in which a supplier wrote data about an installation in the room outside the signature will cease to be held signed
      - An installer will not run, a driver will not be taken in and an update will not go through
      - The message will point at a trouble with the signature, so the telling of the cause is easier than is usual
      - The taking back of the change is at once and calls for no restart, so the cost of a mistake is low
      - The running of programs already installed, logging on, the way to files and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W użyciu jest oprogramowanie, którego dostawca zapisuje dane wdrożenia w miejscu nieobjętym podpisem
    en:
      - Software is in use whose supplier writes the data of a rollout in the room the signature does not take in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is kept twice: once for programs built for this system and once
      # for those built for the older word length. Both have to be set, because a
      # program checks the signature in the view it runs in.
      $paths = [ordered]@{
        native  = 'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config'
        wow6432 = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
      }
      $name = 'EnableCertPaddingCheck'
      $missing = @()
      $other = @()
      foreach ($entry in $paths.GetEnumerator()) {
        $value = $null
        if (Test-Path -Path $entry.Value) {
          $value = (Get-ItemProperty -Path $entry.Value -ErrorAction Stop).$name
        }
        if ($null -eq $value) { $missing += $entry.Key }
        elseif (([string]$value).Trim() -ne '1') { $other += ($entry.Key + '=' + [string]$value) }
      }
      if ($missing.Count -gt 0) { 'MISSING ' + ($missing -join ',') }
      elseif ($other.Count -gt 0) { 'OTHER ' + ($other -join ',') }
      else { 'AS_REQUIRED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    $name = 'EnableCertPaddingCheck'
    $state = foreach ($path in $paths) {
      $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
      [pscustomobject]@{
        path        = $path
        name        = $name
        value       = $current
        existed     = ($null -ne $current)
        key_existed = (Test-Path -Path $path)
      }
    }
    $state | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number, and in both views at once. Set
    # in one view alone it would hold for a part of the programs and not for the rest.
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    foreach ($path in $paths) {
      if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
      Set-ItemProperty -Path $path -Name 'EnableCertPaddingCheck' -Value '1' -Type String
    }

  rollback_command: |
    $state = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($b in @($state)) {
      if ($b.existed) {
        Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
      } else {
        Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
        if (-not $b.key_existed) {
          # The key is removed only where the change created it and nothing else has
          # since been written into it.
          $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
          if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
            Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
          }
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/

notes:
  pl: |
    Reguła dotyczy założenia, na którym stoi cała reszta sprawdzania
    programów, i warto, żeby aplikacja to podkreśliła. Bez niej podpis
    przestaje mówić „ten plik jest taki, jaki wydał go wydawca", a zaczyna
    mówić „ten plik był kiedyś taki".

    Argument wart postawienia wprost dotyczy zasięgu. Nie chodzi o jeden
    program ani o jedną drogę ataku. Chodzi o to, że każde sprawdzenie
    oparte na podpisie — listy dozwolonych programów, kontrola
    sterowników, weryfikacja aktualizacji — opiera się na tym samym
    założeniu. Wszystkie tracą znaczenie w tym samym momencie.

    Odnotowuję dwa miejsca przechowywania, bo jest to najczęstszy błąd przy
    tej regule. Wpis w jednym widoku obejmuje tylko programy uruchamiane
    w tym widoku, a raport pokazujący wtedy stan zgodny mówi o połowie
    maszyny. Sprawdzenie czyta oba miejsca i nazywa po nazwie to, którego
    brakuje.
  en: |
    The rule touches the assumption the whole rest of the checking of programs stands upon, and it is well that
    the application stress it. Without it a signature ceases to say "this file is as its issuer sent it out" and
    begins to say "this file once was so".

    The argument worth putting outright touches reach. It is not about one program nor about one road of attack.
    It is about this, that every check resting upon a signature - lists of admitted programs, the watching of
    drivers, the proving of updates - rests upon the same assumption. All lose their meaning at the same hour.

    I set down the two places of keeping, that being the commonest error at this rule. An entry in one view takes
    in the programs run in that view alone, and a report showing a compliant state then speaks of half the
    machine. The check reads both places and names the one that is wanting.
