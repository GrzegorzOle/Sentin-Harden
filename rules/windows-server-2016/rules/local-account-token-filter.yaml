id: win2016-local-account-token-filter

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Filtrowanie uprawnień kont lokalnych przy dostępie sieciowym zachowane
    en: Filtering of local accounts' rights on network access preserved
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt pilnuje, żeby konto lokalne łączące się przez sieć pracowało
    z uprawnieniami ograniczonymi, a nie z pełnymi uprawnieniami
    administracyjnymi.

    Domyślnie system robi to sam. Członek lokalnej grupy administratorów,
    który loguje się zdalnie, dostaje uprawnienia okrojone — mimo że przy
    konsoli mógłby je podnieść. Powód jest prosty: przy połączeniu sieciowym
    nie ma komu zadać pytania o zgodę, więc uprawnienia nie są podnoszone
    wcale.

    Istnieje jednak wpis, który to filtrowanie znosi. Trafia on na maszyny
    zwykle przy okazji: rozwiązywania problemu z zarządzaniem zdalnym,
    uruchamiania narzędzia, które „nie działa przez sieć", albo instrukcji
    znalezionej w internecie. Po jego ustawieniu każde lokalne konto
    administracyjne pracuje zdalnie z pełnymi uprawnieniami, bez żadnego
    potwierdzenia.

    Kategoria krytyczna wynika z tego, co to znaczy w skali. Jedno hasło
    lokalnego administratora powtórzone na kilku maszynach — a na serwerach
    z czasów wdrożenia bywa powtórzone — daje wtedy pełne uprawnienia na
    każdej z nich, zdalnie i od razu. To jest podręcznikowy mechanizm ruchu
    bocznego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne
    uprawnienia administracyjne na maszynie z samego poświadczenia konta
    lokalnego, bez dostępu do konsoli i bez podnoszenia uprawnień.
  en: |
    The item sees to it that a local account connecting over the network works
    with limited rights rather than full administrative ones.

    By default the system does this itself. A member of the local administrators
    group signing in remotely receives cut-down rights - even though at the
    console they could raise them. The reason is simple: over a network
    connection there is nobody to ask for consent, so rights are not raised at
    all.

    There is, however, an entry that cancels this filtering. It reaches machines
    usually by the way: while fixing a problem with remote management, while
    getting a tool that "does not work over the network" to run, or from an
    instruction found online. Once set, every local administrative account works
    remotely with full rights and no confirmation whatever.

    The critical category follows from what that means at scale. One local
    administrator password repeated across several machines - and on servers from
    the time of deployment it tends to be repeated - then grants full rights on
    every one of them, remotely and at once. This is the textbook mechanism of
    lateral movement.

    What an attacker gains while the item goes unmet: full administrative rights
    on the machine from a local account's credential alone, with no console
    access and no elevation.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo usunięcie tego wpisu przywraca stan
    domyślny, ale robi to na maszynie, na której ktoś go kiedyś świadomie
    dodał — i warto wiedzieć po co.

    Po zmianie przestanie działać to, co działało dzięki temu wpisowi:
    zarządzanie zdalne z konta lokalnego administratora, skrypty sięgające
    po zasoby administracyjne, narzędzia inwentaryzacyjne łączące się na
    konto lokalne oraz część oprogramowania kopii zapasowych.

    Rozwiązanie w prawie wszystkich tych przypadkach jest to samo i lepsze
    niż wpis: użycie konta domenowego zamiast lokalnego. Konto domenowe
    filtrowaniu nie podlega, więc problem znika bez otwierania drogi, którą
    zamyka ta reguła.

    Na serwerze 2016 warto sprawdzić to szczególnie uważnie, bo maszyny tego
    rocznika bywają zarządzane narzędziami starszymi niż one same, a część
    tych narzędzi ustawiała ten wpis samodzielnie przy instalacji.

    Czego to nie psuje: logowania przy konsoli, pracy przez pulpit zdalny,
    kont domenowych ani udostępniania plików.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because removing this entry restores the default
    state, but does so on a machine where somebody once added it deliberately -
    and it is worth knowing what for.

    After the change, what worked thanks to that entry will stop: remote
    management from a local administrator account, scripts reaching for
    administrative shares, inventory tools connecting to a local account, and
    some backup software.

    The answer in nearly all those cases is the same and better than the entry:
    using a domain account instead of a local one. A domain account is not
    subject to the filtering, so the problem disappears without opening the road
    this rule closes.

    On Server 2016 this is worth checking especially carefully, because machines
    of this vintage are sometimes managed with tools older than they are, and
    some of those tools set this entry themselves at installation.

    What this does not break: signing in at the console, working through remote
    desktop, domain accounts, or file sharing.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - accounts-and-passwords
    - scripting-and-automation
    - file-sharing
  what_breaks:
    pl:
      - Zarządzanie zdalne z konta lokalnego administratora przestaje dostawać pełne uprawnienia
      - Skrypty sięgające zdalnie po zasoby administracyjne na koncie lokalnym kończą się odmową
      - Narzędzia inwentaryzacyjne i część oprogramowania kopii zapasowych łączące się na konto lokalne przestają działać
      - Konta domenowe, logowanie przy konsoli i pulpit zdalny pozostają bez zmian
    en:
      - Remote management from a local administrator account stops receiving full rights
      - Scripts reaching administrative shares remotely under a local account end in a refusal
      - Inventory tools and some backup software connecting to a local account stop working
      - Domain accounts, signing in at the console and remote desktop stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyną zarządza narzędzie łączące się wyłącznie na konto lokalne administratora i nie da się przestawić go na konto domenowe
    en:
      - The machine is managed by a tool that connects only to a local administrator account and cannot be switched to a domain account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'LocalAccountTokenFilterPolicy'
      $value = $null
      if (Test-Path -Path $path -ErrorAction Stop) {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
      }
      # Here the missing value is the secure state: filtering is the system
      # default and only an explicit 1 switches it off.
      if ($null -eq $value -or [int]$value -eq 0) { 'FILTERED' } else { 'NOT_FILTERED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FILTERED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'LocalAccountTokenFilterPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The remedy removes the entry rather than setting it to zero, because
    # filtering is the default and an absent value is the compliant state.
    Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'LocalAccountTokenFilterPolicy' -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/windows-security/user-account-control-and-remote-restriction

notes:
  pl: |
    To jest jedna z nielicznych reguł, w których brak wpisu jest stanem
    zgodnym, a obecność wpisu — niezgodnym. Audyt zgłasza więc `FILTERED`
    zarówno wtedy, gdy wartości nie ma, jak i wtedy, gdy wynosi zero,
    bo oba stany znaczą to samo.

    Naprawa usuwa wpis, zamiast ustawiać go na zero. Wynik jest ten sam,
    ale maszyna zostaje w stanie domyślnym, a nie w stanie domyślnym
    zapisanym ręcznie — i późniejszy przegląd rejestru nie musi się
    zastanawiać, po co ktoś ten wpis dodał.

    Filtrowanie dotyczy wyłącznie kont lokalnych. Konto domenowe nie
    podlega mu wcale i to jest zwykle właściwa odpowiedź na problem,
    dla którego ten wpis bywa dodawany.
  en: |
    This is one of the few rules in which an absent entry is the compliant state
    and a present one is not. The audit therefore reports `FILTERED` both where
    the value is missing and where it is zero, because both states mean the same
    thing.

    The remedy removes the entry rather than setting it to zero. The result is
    the same, but the machine is left in the default state rather than in the
    default state written down by hand - and a later review of the registry need
    not wonder what somebody added it for.

    The filtering concerns local accounts alone. A domain account is not subject
    to it at all, and that is usually the right answer to the problem this entry
    gets added for.
