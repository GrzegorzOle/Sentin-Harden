id: win2016-remote-interactive-logon-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie przez pulpit zdalny ograniczone do administratorów i użytkowników pulpitu zdalnego
    en: Remote desktop sign-in restricted to administrators and remote desktop users
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zawęża listę kont uprawnionych do logowania przez pulpit zdalny do
    administratorów i grupy użytkowników pulpitu zdalnego.

    Wartość punktu polega na tym, że wprowadza jedno miejsce, w którym decyzja
    o dostępie zdalnym jest podejmowana. Bez niego dostęp wynika z członkostwa
    w grupach nadawanych z różnych powodów i przez różnych ludzi, a nikt nie
    umie odpowiedzieć, kto właściwie może się na tę maszynę zalogować.

    Wskazanie grupy użytkowników pulpitu zdalnego jest tu wyborem, a nie
    formalnością. Ta grupa istnieje wyłącznie po to i nie niesie żadnych innych
    uprawnień, więc dopisanie do niej kogoś jest decyzją widoczną i odwracalną.
    Grupa nadana przy okazji czegoś innego takiej własności nie ma.

    Kategoria wysoka, bo pulpit zdalny jest na serwerze podstawowym kanałem
    obsługi i pierwszym, po który sięga napastnik z poświadczeniem.

    Na serwerze 2016 warto sprawdzić tę listę osobno, bo maszyny tego rocznika
    bywały udostępniane szeroko w czasach, gdy sesja zdalna zastępowała
    przyjazd do serwerowni.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję zdalną
    z konta, którego uprawnienie do niej wynika z członkostwa nadanego
    w zupełnie innej sprawie.
  en: |
    The item narrows the list of accounts permitted to sign in through remote
    desktop to the administrators and the remote desktop users group.

    The item's value is that it introduces one place where the decision about
    remote access is taken. Without it, access follows from membership of groups
    granted for various reasons by various people, and nobody can say who may
    actually sign in to this machine.

    Naming the remote desktop users group is a choice here rather than a formality.
    That group exists for this alone and carries no other rights, so adding
    somebody to it is a visible and reversible decision. A group granted in passing
    for something else has no such property.

    The category is high, because remote desktop is a server's principal
    administration channel and the first one an attacker with a credential reaches
    for.

    On Server 2016 this list is worth checking separately, because machines of this
    vintage were sometimes opened widely at a time when a remote session replaced a
    trip to the server room.

    What an attacker gains while the item goes unmet: a remote session from an
    account whose right to one follows from a membership granted in an entirely
    different matter.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo lista ta bywa jedyną drogą wejścia
    dla ludzi, którzy tę maszynę obsługują.

    Sprawdzić trzeba, kto dziś loguje się zdalnie i z jakiego tytułu. Częstym
    przypadkiem jest grupa operatorów albo grupa działowa nadana lata temu,
    z której nikt już nie pamięta, kogo obejmuje. Zawężenie listy bez tego
    przeglądu odetnie tych ludzi przy pierwszej próbie.

    Właściwą kolejnością jest przeniesienie potrzebnych osób do grupy
    użytkowników pulpitu zdalnego przed zmianą, a nie po. Zajmuje to kwadrans
    i zostawia listę, którą da się przeczytać.

    Na maszynie z rolą sesji zdalnych zmiana dotknie wszystkich użytkowników
    naraz i tam ten punkt jest właściwie rozmową o modelu dostępu, a nie
    poprawką konfiguracji.

    Czego to nie psuje: logowania przy konsoli, usług, zadań harmonogramu ani
    dostępu do udziałów sieciowych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs planned rollout", because this list is sometimes the only
    way in for the people who serve this machine.

    What has to be checked is who signs in remotely today and on what basis. A
    common case is an operators group or a departmental group granted years ago,
    which nobody now remembers the membership of. Narrowing the list without that
    review will cut those people off at the first attempt.

    The right order is to move the people who need it into the remote desktop users
    group before the change, not after. That takes a quarter of an hour and leaves
    a list that can be read.

    On a machine with the remote sessions role the change touches every user at
    once, and there this item is really a conversation about the access model
    rather than a correction to the configuration.

    What this does not break: signing in at the console, services, scheduled tasks,
    or access to network shares.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoby logujące się zdalnie z tytułu grupy działowej albo operatorskiej tracą dostęp przy pierwszej próbie
      - Na maszynie z rolą sesji zdalnych zmiana dotyka wszystkich użytkowników naraz
      - Wpisy pozostałe po dawnych uprawnieniach znikają razem z tymi, które są jeszcze potrzebne
      - Logowanie przy konsoli, usługi i dostęp do udziałów sieciowych działają bez zmian
    en:
      - People signing in remotely by virtue of a departmental or operators group lose access at the first attempt
      - On a machine with the remote sessions role the change touches every user at once
      - Entries left over from former rights disappear along with those still needed
      - Signing in at the console, services and access to network shares work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie przeniesiono jeszcze osób obsługujących maszynę do grupy użytkowników pulpitu zdalnego
      - Maszyna pełni rolę sesji zdalnych, a dostęp użytkowników wynika z grup innych niż grupa pulpitu zdalnego
    en:
      - The people serving the machine have not yet been moved into the remote desktop users group
      - The machine serves the remote sessions role and users' access follows from groups other than the remote desktop group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRemoteInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544,S-1-5-32-555|S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRemoteInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRemoteInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Move the people who need remote access into the remote desktop users group
    # before running this. The list is replaced wholesale and the refusal shows at
    # the first attempt.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRemoteInteractiveLogonRight = *S-1-5-32-544,*S-1-5-32-555',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRemoteInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/allow-log-on-through-remote-desktop-services

notes:
  pl: |
    Grupa użytkowników pulpitu zdalnego nie niesie żadnych uprawnień poza tym
    jednym. To jest jej zaleta: członkostwo w niej znaczy dokładnie tyle, ile
    mówi nazwa, i nic ponadto.

    Wariant z samymi administratorami również uchodzi za zgodny i bywa
    właściwy na maszynie obsługiwanej wyłącznie przez zespół techniczny.

    Punkt warto czytać razem z regułą odmawiającą logowania zdalnego kontom
    lokalnym. Odmowa jest silniejsza od zgody, więc tamta reguła działa nawet
    wtedy, gdy konto lokalne znajdzie się kiedyś w grupie uprawnionej.
  en: |
    The remote desktop users group carries no rights beyond this one. That is its
    merit: membership of it means exactly what the name says and nothing more.

    The variant holding the administrators alone also counts as compliant and is
    sometimes right on a machine served by the technical team alone.

    The item is worth reading together with the rule refusing remote sign-in to
    local accounts. A refusal is stronger than a permission, so that rule works
    even where a local account finds its way into a permitted group some day.
