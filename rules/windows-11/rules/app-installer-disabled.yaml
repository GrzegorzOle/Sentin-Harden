id: win11-app-installer-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Wbudowany instalator pakietów wyłączony
    en: The built-in package installer disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    System niesie własny instalator pakietów: potrafi pobrać program
    z zewnętrznego repozytorium i zainstalować go jednym poleceniem, bez
    przechodzenia przez sklep, bez pytania o uprawnienia administratora
    i bez udziału kogokolwiek, kto zarządza oprogramowaniem w organizacji.

    Jest to ścieżka instalacji równoległa do wszystkiego, co zwykle pilnuje
    oprogramowania na maszynie. Lista tego, co wolno zainstalować, nie
    pochodzi stąd — pochodzi z repozytorium, a repozytoriów można dodać
    własne. Rejestr zainstalowanych programów prowadzony przez dział
    informatyczny nie zobaczy tej instalacji, bo nie przeszła przez żadne
    z jego narzędzi.

    Z punktu widzenia napastnika jest to narzędzie gotowe, podpisane przez
    producenta systemu i obecne na każdej maszynie. Pobranie i uruchomienie
    programu sprowadza się do jednego polecenia, które nie wygląda podejrzanie,
    bo jest poleceniem systemowym. Nie trzeba niczego przenosić, kompilować ani
    podpisywać.

    Wyłączenie instalatora zamyka tę ścieżkę. Instalacja oprogramowania wraca
    do dróg, które ktoś nadzoruje.
  en: |
    The system carries a package installer of its own: it can fetch a program from an
    outside repository and install it with a single command, without going through the
    store, without asking for administrator rights and with nobody who manages software
    in the organisation involved.

    It is an installation path running alongside everything that usually watches over
    software on a machine. The list of what may be installed does not come from here -
    it comes from a repository, and repositories of one's own can be added. The register
    of installed programs kept by the computing department will not see the
    installation, because it passed through none of its tools.

    From an attacker's point of view it is a ready tool, signed by the system's maker
    and present on every machine. Fetching and running a program comes down to one
    command that does not look suspicious, because it is a system command. Nothing has
    to be carried in, compiled or signed.

    Disabling the installer closes that path. Installing software returns to routes
    somebody oversees.

disruption_description:
  pl: |
    To jest zmiana, którą ludzie zauważą, i wymaga uzgodnienia przed wdrożeniem.

    Po wyłączeniu przestaje działać narzędzie wiersza poleceń do instalowania
    programów, a wraz z nim wszystkie skrypty, które się na nim opierają.
    Dotyczy to przede wszystkim przygotowania nowych stanowisk: skrypt
    stawiający maszynę od zera bardzo często zaczyna się właśnie od tego
    narzędzia.

    Przestaje też działać instalacja pakietów w nowszym formacie przez
    otwarcie pliku. Program dostarczany w tym formacie — a dostarcza się tak
    coraz więcej oprogramowania wewnętrznego — trzeba będzie wdrożyć inną
    drogą.

    Najmocniej odczują to stanowiska programistów i administratorów, gdzie
    instalowanie narzędzi tym poleceniem jest codziennością. Na stanowisku
    biurowym, gdzie oprogramowanie instaluje dział informatyczny, zmiana
    przejdzie niezauważona.

    Przed wyłączeniem trzeba mieć gotową drogę zastępczą dla pakietów
    w nowszym formacie oraz przejrzane skrypty przygotowania stanowisk.
    Bez tego wdrożenie zostanie cofnięte po pierwszym nowym komputerze.

    Nie ma restartu, ale zmiana obowiązuje od następnego zalogowania.
  en: |
    This is a change people will notice and it takes agreeing before the rollout.

    Once it is off, the command line tool for installing programs stops working, and
    with it every script resting on it. This concerns preparing new workstations above
    all: a script setting a machine up from nothing very often starts with that very
    tool.

    Installing packages in the newer format by opening a file stops working too. A
    program delivered in that format - and more and more internal software is delivered
    that way - will have to be rolled out by another route.

    Developers' and administrators' workstations will feel it most, where installing
    tools with that command is an everyday thing. At an office workstation, where the
    computing department installs the software, the change will pass unnoticed.

    Before switching it off one has to have a replacement route ready for packages in
    the newer format and the workstation preparation scripts looked through. Without
    that the rollout will be undone after the first new computer.

    There is no restart, but the change holds from the next sign-in.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzie wiersza poleceń do instalowania programów przestaje działać w całości
      - Skrypty przygotowania nowego stanowiska oparte na tym narzędziu kończą się błędem
      - Instalacja pakietu w nowszym formacie przez otwarcie pliku przestaje być możliwa
      - Aktualizacja programów zainstalowanych wcześniej tą drogą przestaje działać
    en:
      - The command line tool for installing programs stops working altogether
      - Scripts preparing a new workstation that rest on that tool end in an error
      - Installing a package in the newer format by opening a file stops being possible
      - Updating programs installed by that route earlier stops working
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Przygotowanie nowych stanowisk opiera się na skryptach używających tego narzędzia
      - Oprogramowanie wewnętrzne jest dostarczane w nowszym formacie pakietów i nie ma innej drogi wdrożenia
      - Stanowisko należy do programisty, dla którego instalowanie narzędzi tym poleceniem jest codzienną pracą
    en:
      - Preparing new workstations rests on scripts using that tool
      - Internal software is delivered in the newer package format and there is no other route for rolling it out
      - The workstation belongs to a developer for whom installing tools with that command is everyday work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableAppInstaller'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableAppInstaller'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableAppInstaller' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Punkt jest najszerszy z rodziny ustawień tego instalatora i wyłącza go
    w całości. Pozostałe reguły tej rodziny zawężają jego zachowanie, zakładając,
    że instalator zostaje włączony. Wdrożenie tego punktu czyni tamte bez
    znaczenia, ale ich nie unieważnia — warto je ustawić mimo wszystko, bo
    chronią maszynę, na której ktoś kiedyś ten punkt cofnie.

    Wyłączenie nie odinstalowuje programów zainstalowanych wcześniej tą drogą
    i nie zmienia ich działania. Przestaje działać samo instalowanie
    i aktualizowanie.

    Gałąź zasad jest wspólna dla wszystkich ustawień tego instalatora, więc
    wycofanie usuwa wyłącznie sam wpis. Usunięcie całej gałęzi skasowałoby
    także pozostałe ustawienia tej rodziny.
  en: |
    The item is the broadest of this installer's family of settings and switches it off
    altogether. The other rules of the family narrow its behaviour, assuming the
    installer stays on. Applying this item makes those of no consequence, but does not
    void them - they are worth setting all the same, since they guard a machine on which
    somebody one day undoes this item.

    Switching it off does not uninstall programs installed by that route earlier and
    does not change how they work. What stops working is the installing and updating
    itself.

    The policy key is shared by every setting of this installer, so rollback removes the
    entry alone. Removing the whole key would wipe the family's other settings as well.
