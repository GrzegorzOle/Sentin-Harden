id: win2016-routing-and-remote-access-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa routingu i dostępu zdalnego wyłączona
    en: The routing and remote access service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pozwala tej maszynie przekazywać ruch między sieciami i przyjmować
    połączenia zdalne z zewnątrz — czyli pełnić rolę routera i bramy
    dostępowej naraz.

    Serwer, na którym usługa ta pracuje, przestaje być maszyną w sieci
    i staje się przejściem między sieciami. Jest to zmiana charakteru,
    a nie dodanie funkcji. Ruch, który dotąd zatrzymywał się na granicy
    segmentu, zaczyna przez tę maszynę przechodzić, a podział na strefy,
    który ktoś kiedyś zaprojektował, przestaje obowiązywać w tym jednym
    miejscu.

    Najgorszy wariant nie polega na tym, że ktoś usługę uruchomił świadomie.
    Polega na tym, że została włączona kiedyś, do czegoś tymczasowego,
    i nikt jej nie wyłączył. Przejście między sieciami, o którym nikt nie
    pamięta, nie pojawia się w żadnym schemacie i nie jest przez nikogo
    pilnowane.

    Druga strona usługi jest równie ważna. Przyjmuje ona połączenia
    zdalne z zewnątrz, a więc udostępnia sieć wewnętrzną temu, kto
    uwierzytelni się na tej maszynie. Zakres tego dostępu bywa szerszy,
    niż wynika z nazwy konta, którym się wszedł.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przejście
    między segmentami sieci i drogę wejścia do sieci wewnętrznej z zewnątrz,
    obie w miejscu, którego podział na strefy nie przewidywał.
  en: |
    The service lets this machine pass traffic between networks and take in remote
    connections from outside - which is to say fill the role of a router and an access
    gateway at once.

    A server on which that service works stops being a machine on the network and
    becomes a passage between networks. It is a change of character rather than the
    adding of a feature. Traffic that until now stopped at the segment's boundary begins
    passing through this machine, and the division into zones somebody once designed
    ceases to hold at this one place.

    The worst variant is not that somebody started the service knowingly. It is that it
    was switched on at some time, for something temporary, and nobody switched it off.
    A passage between networks nobody remembers appears on no diagram and is watched
    over by nobody.

    The service's other side matters as much. It takes in remote connections from
    outside, and so opens the inner network to whoever authenticates on this machine.
    The reach of that access is at times wider than the name of the account one came in
    by would suggest.

    What an attacker gains while the item goes unmet: a passage between network segments
    and a road into the inner network from outside, both at a place the division into
    zones did not foresee.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i to jest w tym bloku przypadek,
    w którym pomyłka kosztuje najwięcej.

    Rzecz rozstrzygająca jest jedna: czy ta maszyna pełni rolę bramy.
    Jeżeli pełni, wyłączenie usługi zatrzymuje cały ruch, który przez nią
    przechodzi — nie jedno połączenie, tylko wszystkie naraz, w tym ruch
    maszyn, które o istnieniu tej bramy nie wiedzą, bo mają ją wpisaną jako
    trasę domyślną.

    Objaw jest natychmiastowy i szeroki. Całe segmenty tracą łączność
    w jednej chwili, a przyczyna leży na maszynie, która sama pozostaje
    osiągalna i sprawna. Jest to najgorszy możliwy układ przy szukaniu
    przyczyny, bo maszyna nie wygląda na uszkodzoną.

    Drugi przypadek dotyczy dostępu zdalnego. Jeżeli ktoś łączy się do tej
    sieci przez tę maszynę, straci połączenie w chwili zatrzymania usługi,
    bez ostrzeżenia i bez możliwości powrotu tą samą drogą. Warto sprawdzić
    to przed wykonaniem, a nie po — także dlatego, że wykonujący może sam
    być połączony właśnie w ten sposób.

    Na zwykłym serwerze aplikacyjnym usługa nie pracuje i wyłączenie nie
    zmienia nic poza wpisem.

    Czego to nie psuje: zwykłego ruchu sieciowego tej maszyny, udziałów,
    pulpitu zdalnego, zarządzania zdalnego, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and it is in this block the case where a
    mistake costs the most.

    One thing settles it: whether this machine fills the role of a gateway. If it does,
    switching the service off stops all the traffic passing through it - not one
    connection but all at once, the traffic of machines that do not know this gateway
    exists among them, having it entered as their default route.

    The symptom is immediate and wide. Whole segments lose their link in one moment, and
    the cause lies on a machine that stays itself reachable and sound. It is the worst
    possible arrangement when a cause is being sought, the machine not looking broken.

    The second case concerns remote access. If somebody connects into this network
    through this machine, they will lose the connection the moment the service is
    stopped, with no warning and no way back by the same road. That is worth checking
    before execution rather than after - also because the one executing may themselves be
    connected in just that way.

    On an ordinary application server the service does not work and switching it off
    changes nothing but the entry.

    What this does not break: this machine's ordinary network traffic, shares, the
    remote desktop, remote management, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Maszyna pełniąca rolę bramy przestaje przekazywać ruch - całe segmenty tracą łączność w jednej chwili
      - Przyczyna leży na maszynie, która sama pozostaje osiągalna i sprawna, więc nie wygląda na uszkodzoną
      - Połączenia zdalne prowadzone do tej sieci przez tę maszynę zrywają się bez ostrzeżenia i bez drogi powrotu
      - Zwykły ruch sieciowy tej maszyny, udziały, pulpit zdalny i zarządzanie zdalne pozostają bez zmian
    en:
      - A machine filling the role of a gateway stops passing traffic - whole segments lose their link in one moment
      - The cause lies on a machine that stays itself reachable and sound, so it does not look broken
      - Remote connections led into this network through this machine break off with no warning and no road back
      - This machine's ordinary network traffic, shares, the remote desktop and remote management stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę bramy albo routera między segmentami sieci i inne maszyny mają ją wpisaną jako trasę
      - Dostęp zdalny do tej sieci prowadzi przez tę maszynę i nie ma dla niego drogi zastępczej
      - Wykonujący zmianę jest połączony z tą maszyną właśnie przez dostęp zdalny tej usługi
    en:
      - The machine fills the role of a gateway or router between network segments and other machines have it entered as a route
      - Remote access into this network leads through this machine and there is no substitute road for it
      - The one making the change is connected to this machine by just this service's remote access
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'RemoteAccess' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a machine filling the role of a gateway this stops all traffic passing
    # through it. Check the role before running, not after.
    Stop-Service -Name 'RemoteAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'RemoteAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/remote-access

notes:
  pl: |
    Punkt otwiera blok o usługach, które budują albo wyszukują drogi
    sieciowe wychodzące z tej maszyny. Jest w nim najcięższy, bo jako
    jedyny potrafi przy wyłączeniu odciąć maszyny postronne, a nie tylko
    tę, na której działa.

    Podgląd przed wykonaniem powinien przy tym punkcie zrobić więcej niż
    przy innych. Sama lista poleceń nic nie mówi; wartość ma odpowiedź na
    pytanie, czy ta maszyna jest dla kogokolwiek trasą. Jeżeli aplikacja
    potrafi to sprawdzić w chwili audytu, powinna to pokazać obok reguły,
    a nie zostawiać decyzję samemu opisowi.

    Wariant najczęstszy w praktyce jest łagodny i warto go nazwać, żeby
    ostrzeżenie nie brzmiało nieproporcjonalnie. Na zwykłym serwerze
    aplikacyjnym usługa stoi wyłączona albo uruchamiana ręcznie i nigdy nie
    startowała. Punkt jest wtedy zapisem porządkującym, nie zmianą.
  en: |
    The item opens the block about services that build or seek out network roads leading
    out of this machine. It is the heaviest in it, being the only one able, when switched
    off, to cut off bystanding machines and not merely the one it works on.

    The preview before execution should do more at this item than at the others. The bare
    list of commands says nothing; what has worth is the answer to the question whether
    this machine is a route for anybody. Should the application be able to check that at
    the moment of the audit, it ought to show it beside the rule rather than leave the
    decision to the description alone.

    The commonest variant in practice is a mild one and worth naming, so that the warning
    does not sound out of proportion. On an ordinary application server the service stands
    switched off or set to start by hand and has never started. The item is then a tidying
    entry rather than a change.
