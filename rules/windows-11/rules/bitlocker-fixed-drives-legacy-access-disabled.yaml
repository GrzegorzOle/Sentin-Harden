id: win11-bitlocker-fixed-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Odczyt chronionego dysku stałego w starszych wersjach systemu wyłączony
    en: Reading a protected fixed data drive on earlier system versions disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy chroniony dysk stały z danymi ma być
    przygotowany tak, aby dał się odczytać w systemach starszych niż ten,
    w którym został zaszyfrowany.

    Mechanizm działa w sposób, który warto opisać, bo nie jest oczywisty.
    Aby stary system mógł otworzyć chroniony nośnik, na nośniku zakłada się
    niewielki obszar w starym formacie zapisu, poza szyfrowaniem, i umieszcza
    w nim program odczytujący. Stary system widzi ten obszar, uruchamia
    program, program prosi o hasło i udostępnia zawartość.

    Ceną jest to, że na nośniku znajduje się jawny obszar i program, którego
    nikt nie aktualizuje. Jest to składnik przeznaczony dla systemów
    niewspieranych od lat, więc i sam jest bez opieki.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce
    na nośniku, które nie jest objęte szyfrowaniem i daje się zapisać, oraz
    program uruchamiany z nośnika przy jego otwarciu. Podmiana tego programu
    jest drogą do wykonania własnego kodu w chwili, gdy ktoś podłącza nośnik
    i spodziewa się wyłącznie prośby o hasło.

    Odebranie tej możliwości nie zmniejsza ochrony danych — one były i są
    zaszyfrowane. Zmniejsza powierzchnię, która z tą ochroną sąsiaduje.
  en: |
    The setting settles whether a protected fixed data drive is to be prepared so that it
    can be read on systems older than the one it was encrypted on.

    The mechanism works in a way worth describing, since it is not obvious. So that an old
    system can open a protected medium, a small area in the old recording format is laid
    down on the medium, outside the encryption, and a reading program is placed in it. The
    old system sees that area, starts the program, the program asks for a password and
    makes the contents available.

    The price is that the medium carries an area in the clear and a program nobody
    updates. It is a component meant for systems unsupported for years, so it too is
    without care.

    What an attacker gains while the item goes unmet: room on the medium that the
    encryption does not cover and that can be written to, and a program started from the
    medium when it is opened. Substituting that program is a route to running one's own
    code at the moment somebody plugs the medium in expecting nothing but a request for a
    password.

    Taking that possibility away does not lessen the protection of the data - they were
    and are encrypted. It lessens the surface that adjoins that protection.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy dyski chronione na tej maszynie bywają
    odczytywane gdzie indziej, na systemie sprzed kilku wersji.

    W praktyce skutek jest niewielki, bo dysk stały z danymi rzadko opuszcza
    maszynę, a systemy, których to ustawienie dotyczy, dawno wyszły z użycia.
    Na typowym stanowisku zmiana jest niewidoczna.

    Skutek pojawia się tam, gdzie dysk bywa wymontowywany i podłączany do
    innego komputera — na przykład przy odzyskiwaniu danych z maszyny, która
    się nie uruchamia. Jeżeli komputerem ratunkowym jest stary sprzęt
    z niewspieranym systemem, dysku nie da się na nim otworzyć. Wystarczy
    jednak dowolny komputer z systemem wspieranym.

    Nośniki przygotowane przed wdrożeniem zasady zachowują swój obszar
    zgodności. Zmiana dotyczy tych, które zostaną zaszyfrowane później.

    Odczyt i zapis na tej maszynie nie zmienia się w żaden sposób.
  en: |
    What needs checking is whether disks protected on this machine are sometimes read
    elsewhere, on a system several versions old.

    In practice the effect is slight, since a fixed data disk rarely leaves the machine,
    and the systems this setting concerns went out of use long ago. At a typical station
    the change is invisible.

    The effect appears where a disk is sometimes taken out and plugged into another
    computer - for instance when recovering data from a machine that will not start. If
    the rescue computer is old hardware with an unsupported system, the disk cannot be
    opened on it. Any computer with a supported system will do, however.

    Media prepared before the policy was applied keep their compatibility area. The change
    concerns those that are encrypted later.

    Reading and writing on this machine does not change in any way.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Dysku chronionego po wdrożeniu zasady nie otworzy komputer z systemem sprzed kilku wersji
      - Odzyskiwanie danych na starym sprzęcie ratunkowym wymaga komputera z systemem wspieranym
      - Nośniki przygotowane wcześniej zachowują swój obszar zgodności
      - Odczyt i zapis na tej maszynie nie zmienia się w żaden sposób
    en:
      - A disk protected after the policy is applied will not open on a computer several system versions old
      - Recovering data on old rescue hardware takes a computer with a supported system
      - Media prepared earlier keep their compatibility area
      - Reading and writing on this machine does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedura odzyskiwania danych opiera się na komputerze z niewspieranym systemem
      - Dyski chronione tutaj są odczytywane na sprzęcie, którego nie da się wymienić
    en:
      - The data recovery procedure rests on a computer with an unsupported system
      - Disks protected here are read on hardware that cannot be replaced
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the
      # word <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: <none>
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'FDVDiscoveryVolumeType' -ErrorAction SilentlyContinue).'FDVDiscoveryVolumeType'
    [pscustomobject]@{
      path        = $path
      name        = 'FDVDiscoveryVolumeType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Wartość jest tekstem, nie liczbą, i to jest jedyna nietypowa rzecz w tej
    regule. Oczekiwany zapis to dosłownie słowo w nawiasach ostrych — taki jest
    format zapisywany przez zasadę wyłączoną, a nie opis braku wartości. Brak
    wartości jest stanem osobnym i sprawdzenie zgłasza go inaczej.

    Reguła tworzy parę z bliźniaczą, dotyczącą nośników wymiennych. Tam jej
    waga jest większa, bo to nośniki wymienne faktycznie krążą między
    komputerami — tutaj chodzi raczej o spójność ustawienia niż o codzienny
    skutek.

    Zasada działa przy zakładaniu ochrony i nie usunie obszaru zgodności
    z nośnika już przygotowanego.
  en: |
    The value is text rather than a number, and that is the one unusual thing about this
    rule. The expected entry is literally a word in angle brackets - that is the form the
    switched-off policy writes, not a description of a missing value. A missing value is a
    separate state and the check reports it differently.

    The rule forms a pair with its twin for removable media. There its weight is greater,
    since it is removable media that actually circulate between computers - here it is a
    matter of a consistent setting rather than an everyday effect.

    The policy works when protection is being set up and will not remove the compatibility
    area from a medium already prepared.
