id: win2025-network-selection-ui-hidden

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Wybór sieci niedostępny z ekranu logowania
    en: Network selection unavailable from the sign-in screen
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt usuwa z ekranu logowania możliwość wybrania sieci i połączenia się
    z nią.

    Kategoria średnia i chcę nazwać, na czym polega tu problem, bo lista
    sieci wygląda niewinnie. Ekran logowania jest miejscem, w którym nikt
    jeszcze nie podał hasła. Wszystko, co można stamtąd zrobić, jest
    czynnością wykonywaną przez osobę nieuwierzytelnioną — a tutaj tą
    czynnością jest zmiana sieci, do której podłączona jest maszyna.

    To jest właściwa treść punktu. Ktoś stojący przy konsoli może przepiąć
    serwer do sieci, którą sam kontroluje, zanim zdąży się zalogować.
    Maszyna w takiej sieci dostaje cudze ustawienia rozwiązywania nazw
    i cudzą bramę, a logowanie domenowe, które zaraz nastąpi, jest już
    rozmową z tym, kto tę sieć postawił.

    Osobno waży to, że sama lista też jest informacją. Wykaz sieci
    widocznych z serwera, dostępny bez logowania, mówi o otoczeniu maszyny
    więcej, niż wygląda — w tym o tym, jakie nazwy sieci są tu używane.

    Na serwerze kontekstem jest konsola maszyny wirtualnej, dostępna
    z panelu wirtualizacji dla szerszego grona niż sam serwer.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zmiany sieci maszyny przed uwierzytelnieniem, czyli ustawienia warunków,
    w których nastąpi cudze logowanie.
  en: |
    The item removes from the sign-in screen the ability to choose a network
    and connect to it.

    The category is medium, and I want to name where the problem lies,
    because a list of networks looks innocent. The sign-in screen is a place
    where nobody has yet given a password. Everything that can be done from
    there is an action performed by an unauthenticated person - and here that
    action is changing the network the machine is attached to.

    That is the real substance of the item. Somebody standing at the console
    can move the server over to a network they control themselves, before
    ever signing in. A machine in such a network receives somebody else's
    name resolution settings and somebody else's gateway, and the domain
    sign-in that follows is already a conversation with whoever set that
    network up.

    It weighs separately that the list itself is information too. A record of
    the networks visible from the server, available without signing in, says
    more about the machine's surroundings than it appears to - including
    which network names are used here.

    On a server the context is the virtual machine's console, available from
    the virtualisation panel to a wider circle than the server itself.

    What an attacker gains while the item goes unmet: the ability to change
    the machine's network before authentication - that is, to set the
    conditions under which somebody else's sign-in will happen.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy jednej sytuacji, za to
    takiej, w której skutek jest dotkliwy: odzyskiwania łączności przy
    awarii.

    Jeżeli serwer straci sieć, a ktoś dotąd naprawiał to z ekranu logowania,
    po zmianie tej drogi nie będzie. Trzeba będzie zalogować się kontem
    lokalnym i naprawić sieć z wnętrza sesji — co jest wykonalne, o ile
    konto lokalne istnieje i ktoś zna jego hasło. To jest dokładnie ten
    warunek, który trzeba sprawdzić przed zastosowaniem, a nie w trakcie
    awarii.

    Drugi przypadek dotyczy maszyn z kartą bezprzewodową, gdzie ekran
    logowania bywa jedyną drogą podłączenia się do sieci przed logowaniem.
    Na serwerze przewodowym nie ma to zastosowania.

    Czego to nie psuje: sieci już podłączonej, logowania domenowego przy
    działającej sieci, sesji zdalnych ani niczego, co dzieje się po
    zalogowaniu. Ustawienia sieci zmienia się dalej normalnie, tyle że
    z sesji.

    Rzecz do zapamiętania: wpis leży w gałęzi systemowej razem z kilkoma
    regułami o zupełnie innym przedmiocie. Znajoma ścieżka nie znaczy, że
    grupa jest zamknięta.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns one situation, but
    one where the effect bites: recovering connectivity during an outage.

    If the server loses its network and somebody used to fix that from the
    sign-in screen, after the change that road will be gone. They will have
    to sign in with a local account and fix the network from inside a session
    - which is feasible, provided a local account exists and somebody knows
    its password. That is exactly the condition to check before applying, not
    in the middle of an outage.

    The second case concerns machines with a wireless card, where the sign-in
    screen is sometimes the only way of joining a network before signing in.
    On a wired server it does not apply.

    What this does not break: the network already attached, domain sign-in
    while the network works, remote sessions, or anything happening after
    signing in. Network settings are still changed normally, only from within
    a session.

    Something to remember: the entry lies in the system branch together with
    several rules of an entirely different subject. A familiar path does not
    mean the group is closed.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Przy utracie sieci nie da się jej naprawić z ekranu logowania — trzeba zalogować się kontem lokalnym i naprawić ją z sesji
      - Warunkiem jest istnienie konta lokalnego i znajomość jego hasła, co trzeba sprawdzić przed zastosowaniem, a nie w trakcie awarii
      - Na maszynie z kartą bezprzewodową ekran logowania bywa jedyną drogą podłączenia się do sieci przed logowaniem
      - Sieć już podłączona, logowanie domenowe przy działającej sieci i sesje zdalne działają bez zmian
    en:
      - If the network is lost it cannot be fixed from the sign-in screen - one has to sign in with a local account and fix it from a session
      - This requires a local account to exist and somebody to know its password, to be checked before applying rather than during an outage
      - On a machine with a wireless card the sign-in screen is sometimes the only way of joining a network before signing in
      - The network already attached, domain sign-in while the network works and remote sessions work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie nie ma konta lokalnego z dostępnym hasłem, a naprawa łączności odbywa się z ekranu logowania
    en:
      - The machine has no local account with an available password and connectivity is repaired from the sign-in screen
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'DontDisplayNetworkSelectionUI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'DontDisplayNetworkSelectionUI'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Changing the network is an action performed by somebody who has given no
    # password: the machine can be moved to a network the attacker controls, and
    # the domain sign-in that follows is a conversation with whoever set it up.
    # Make sure a local account exists before taking this road away.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontDisplayNetworkSelectionUI' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Ekran logowania jest miejscem, w którym nikt jeszcze nie podał hasła.
    Wszystko, co można stamtąd zrobić, jest czynnością osoby
    nieuwierzytelnionej — a tutaj tą czynnością jest zmiana sieci, do której
    podłączona jest maszyna.

    Maszyna przepięta do cudzej sieci dostaje cudze ustawienia rozwiązywania
    nazw i cudzą bramę, a logowanie domenowe, które zaraz nastąpi, jest już
    rozmową z tym, kto tę sieć postawił.

    Warunek do sprawdzenia przed zastosowaniem, nie w trakcie awarii: czy
    istnieje konto lokalne i czy ktoś zna jego hasło. Bez tego odbieramy
    jedyną drogę naprawy łączności.
  en: |
    The sign-in screen is a place where nobody has yet given a password.
    Everything that can be done from there is an action by an unauthenticated
    person - and here that action is changing the network the machine is
    attached to.

    A machine moved to somebody else's network receives their name resolution
    settings and their gateway, and the domain sign-in that follows is
    already a conversation with whoever set that network up.

    A condition to check before applying, not during an outage: whether a
    local account exists and somebody knows its password. Without that we
    take away the only road to repairing connectivity.
