id: win2016-profile-system-performance-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Profilowanie wydajności systemu tylko dla administratorów
    en: Profiling system performance restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do profilowania wydajności całego systemu do
    grupy administratorów lokalnych.

    Różnica wobec profilowania pojedynczego procesu jest istotna. Tamto pozwala
    zajrzeć we wskazany program. To daje obraz całej maszyny naraz: co działa,
    ile zużywa, kiedy zaczyna i kiedy kończy. Jest to zestawienie, z którego
    odczytuje się rytm pracy serwera — godziny kopii zapasowej, porę
    przetwarzania wsadowego, moment skanowania przez mechanizm zabezpieczający.

    Uprawnienie nie daje dostępu do danych. Daje rozeznanie w tym, kiedy
    maszyna jest zajęta i kiedy nikt na nią nie patrzy. Dla napastnika
    przygotowującego działanie jest to informacja o tym, którą godzinę wybrać.

    Kategoria średnia. To nie jest droga wejścia ani eskalacji, tylko
    przygotowanie: ogranicza rozpoznanie i sprawia, że próba zebrania takich
    danych z konta bez uprawnień staje się widoczna jako odmowa.

    Na serwerze 2016 uprawnienie domyślnie należy do administratorów oraz do
    konta usługi diagnostycznej systemu. Drugi wpis jest prawidłowy i musi
    zostać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozkład zajętości
    maszyny w czasie, czyli wiedzę, kiedy jego działanie nie rzuci się w oczy.
  en: |
    The item limits the right to profile the whole system's performance to the local
    administrators group.

    The difference from profiling a single process matters. That one allows a named
    program to be looked into. This one gives a picture of the whole machine at
    once: what runs, how much it uses, when it starts and when it ends. It is a
    reading from which a server's rhythm of work can be told - the hours of the
    backup, the time of batch processing, the moment the protective mechanism scans.

    The right gives no access to data. It gives an understanding of when the machine
    is busy and when nobody is watching it. To an attacker preparing a move, that is
    information about which hour to choose.

    The category is medium. This is no way in and no elevation, only preparation: it
    narrows reconnaissance and makes an attempt to gather such data from an
    unprivileged account visible as a refusal.

    On Server 2016 the right belongs by default to the administrators and to the
    system's diagnostic service account. That second entry is correct and has to
    stay.

    What an attacker gains while the item goes unmet: the distribution of the
    machine's busyness over time, which is to say the knowledge of when their doings
    will not catch the eye.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zwykła praca tego uprawnienia nie dotyka, a wpis
    konta usługi diagnostycznej zostaje zachowany przez polecenie naprawcze,
    jeżeli już tam jest.

    Sprawdzenia wymagają agenci monitorujący. Oprogramowanie do zbierania
    metryk wydajności — własne albo dostarczone przez usługodawcę — działa
    czasem na koncie utworzonym ręcznie, a nie na koncie usługi wbudowanej.
    Taki agent po zmianie zacznie zwracać puste zestawy zamiast danych, zwykle
    bez wyraźnego komunikatu.

    Objaw jest łagodny i przez to mylący: wykresy przestają się wypełniać,
    ale nic nie zgłasza błędu. Warto to sprawdzić przed zmianą, a nie po
    tygodniu pustych raportów.

    Czego to nie psuje: menedżera zadań, monitora zasobów uruchamianego przez
    administratora, zbierania liczników przez usługi wbudowane ani diagnostyki
    systemu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Ordinary work does not touch this right, and the
    diagnostic service account entry is kept by the remediation command where it is
    already there.

    Monitoring agents call for a check. Software gathering performance metrics - the
    organisation's own or a supplier's - sometimes runs under an account made by
    hand rather than under a built-in service account. After the change such an
    agent will begin returning empty sets instead of data, usually without a clear
    message.

    The symptom is mild and therefore misleading: the charts stop filling, but
    nothing reports an error. This is worth checking before the change rather than
    after a week of empty reports.

    What this does not break: the task manager, the resource monitor started by an
    administrator, the gathering of counters by built-in services, or the system's
    diagnostics.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Agent monitorujący działający na koncie utworzonym ręcznie zwraca puste zestawy liczników zamiast danych
      - Wykresy wydajności przestają się wypełniać, ale nic nie zgłasza błędu, więc usterka bywa zauważona po tygodniach
      - Konto usługi diagnostycznej systemu zostaje na liście, jeżeli już tam było
      - Menedżer zadań, monitor zasobów i zbieranie liczników przez usługi wbudowane działają bez zmian
    en:
      - A monitoring agent running under an account made by hand returns empty counter sets instead of data
      - Performance charts stop filling but nothing reports an error, so the fault gets noticed after weeks
      - The system's diagnostic service account stays on the list where it already was
      - The task manager, the resource monitor and the gathering of counters by built-in services work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa agent zbierający metryki wydajności na koncie utworzonym ręcznie i nie da się go przenieść na konto usługi wbudowanej
    en:
      - An agent gathering performance metrics runs on the machine under an account made by hand and cannot be moved onto a built-in service account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420)?|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemProfilePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The system diagnostic service account stays in the list where it is already
    # there. A picture of the whole machine over time tells when nobody is watching.
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = '*S-1-5-32-544'
    if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') {
      if ($Matches[1] -match 'S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420') { $value = '*S-1-5-32-544,*S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420' }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemProfilePrivilege = ' + $value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemProfilePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/profile-system-performance

notes:
  pl: |
    Reguła bywa mylona z profilowaniem pojedynczego procesu. Różnica jest
    w zakresie: tamta dotyczy wskazanego programu, ta obrazu całej maszyny.
    W raporcie warto je czytać razem, bo osobno każda wygląda drobniej, niż
    jest.

    Polecenie naprawcze odczytuje stan bieżący i zachowuje konto usługi
    diagnostycznej. Oczekiwanie dopuszcza zatem dwa poprawne stany: samych
    administratorów albo administratorów wraz z tym kontem.

    Wartość punktu jest przygotowawcza, nie obronna. Nie zamyka żadnej drogi —
    utrudnia wybranie momentu. Tak też należy go ważyć wobec punktów
    krytycznych.
  en: |
    The rule gets confused with profiling a single process. The difference lies in
    the scope: that one concerns a named program, this one a picture of the whole
    machine. In the report they are worth reading together, because apart each looks
    smaller than it is.

    The remediation command reads the present state and keeps the diagnostic service
    account. The expectation therefore admits two correct states: the administrators
    alone, or the administrators together with that account.

    The item's worth is preparatory, not defensive. It closes no road - it makes
    choosing the moment harder. That is how it should be weighed against the
    critical items.
