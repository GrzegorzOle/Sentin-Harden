id: win2025-bitlocker-standard-user-pin-change-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Zmiana kodu startowego zastrzeżona dla administratorów
    en: Changing the startup code reserved to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera zwykłym użytkownikom możliwość zmiany kodu startowego
    wolumenu systemowego. Zostaje ona przy administratorach.

    Zostawiam kategorię średnią, ale muszę od razu powiedzieć rzecz, która
    rozstrzyga o tym, jak tę regułę czytać na serwerze: ona zależy od innej.
    Kod startowy istnieje tylko tam, gdzie włączono uwierzytelnianie przy
    starcie. Tam, gdzie tej reguły nie wdrożono — a przy serwerze
    pracującym bez obsługi przy konsoli bywa to świadoma decyzja zapisana
    jako wyjątek — ten punkt nie ma czym zarządzać. Będzie zgodny i nie
    będzie znaczył nic.

    Tam, gdzie kod startowy jednak istnieje, rzecz jest sensowna i warto
    ją nazwać po imieniu. Kod startowy nie chroni konta, tylko maszynę.
    Jest jeden dla całego wolumenu, niezależnie od tego, ile osób się na
    tę maszynę loguje, i nie podlega polityce haseł. Możliwość jego zmiany
    przez każdego, kto ma na maszynie konto, znaczy, że ostatnia zmiana
    ustala dostęp do wolumenu dla wszystkich pozostałych — łącznie z tymi,
    którzy o zmianie nie wiedzą.

    Na serwerze dochodzi jeszcze to, że zwykłych użytkowników bywa tam
    niewielu, ale bywają konta o ograniczonych prawach należące do usług,
    dostawców i obsługi. To właśnie te konta są najmniej pilnowane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    trwałe odcięcie obsługi od maszyny albo na zapewnienie sobie dostępu
    do niej po restarcie, z poziomu konta bez praw administratora.
  en: |
    The item takes from ordinary users the ability to change the system
    volume's startup code. It stays with administrators.

    I keep the category medium, but I have to say at once the thing that
    settles how to read this rule on a server: it depends on another one. A
    startup code exists only where startup authentication has been turned
    on. Where that rule has not been rolled out - and on a server working
    without anybody at the console that is often a deliberate decision
    recorded as an exception - this item has nothing to manage. It will be
    compliant and will mean nothing.

    Where a startup code does exist, the matter makes sense and is worth
    naming plainly. A startup code does not protect an account; it protects
    the machine. There is one for the whole volume regardless of how many
    people sign in to that machine, and it is not subject to the password
    policy. Letting anybody with an account on the machine change it means
    the last change settles access to the volume for everybody else -
    including those who do not know about it.

    On a server there is also this: ordinary users are few there, but there
    are limited-rights accounts belonging to services, vendors and
    operators. Those are precisely the accounts nobody watches.

    What an attacker gains while the item goes unmet: a way to cut the
    operators off from the machine for good, or to secure their own access
    to it after a restart, from an account with no administrative rights.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać, czego konkretnie
    tu sprawdzić, bo przy tej regule łatwo o dwa różne błędy.

    Pierwszy to wdrożenie jej bez uwierzytelniania przy starcie. Wtedy
    zmiana niczego nie robi, ale raport pokaże punkt jako spełniony —
    a spełniony punkt bez działania jest gorszy niż niespełniony, bo
    zamyka temat. Jeżeli reguła o uwierzytelnianiu przy starcie poszła na
    tej maszynie do wyjątku, ta powinna pójść razem z nią i z tym samym
    uzasadnieniem.

    Drugi to sytuacja odwrotna. Jeżeli kod startowy istnieje, a obsługa
    maszyny opiera się na kontach bez praw administratora — typowo
    w zespole, który ma dyżury i dostęp do konsoli, ale nie ma pełnych
    uprawnień — po tej zmianie te osoby przestaną móc zmienić kod.
    Nie tracą dostępu do maszyny; tracą możliwość rotacji sekretu, którego
    używają. Zaplanowanie, kto ma tę zmianę wykonywać i jak szybko, należy
    do wdrożenia, a nie do pierwszej sytuacji, w której kod trzeba zmienić.

    Zmiana nie wymaga przerwy, obowiązuje od razu i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to point out what exactly
    to check here, because this rule invites two different mistakes.

    The first is rolling it out without startup authentication. The change
    then does nothing, but the report will show the item as met - and a met
    item that does nothing is worse than an unmet one, because it closes
    the subject. If the rule on startup authentication went to an exception
    on this machine, this one should go with it and on the same grounds.

    The second is the reverse. If a startup code does exist and the
    machine's operation rests on accounts without administrative rights -
    typically a team that keeps a rota and has console access but not full
    privileges - after this change those people will no longer be able to
    change the code. They do not lose access to the machine; they lose the
    ability to rotate a secret they use. Planning who is to make that
    change, and how quickly, belongs to the rollout rather than to the
    first situation in which the code has to be changed.

    The change needs no outage, takes effect at once and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - boot-and-firmware
  what_breaks:
    pl:
      - Bez włączonego uwierzytelniania przy starcie zmiana niczego nie robi, ale raport pokaże punkt jako spełniony
      - Spełniony punkt bez działania jest gorszy niż niespełniony, bo zamyka temat
      - Obsługa pracująca na kontach bez praw administratora przestanie móc zmienić kod startowy
      - Te osoby nie tracą dostępu do maszyny, tracą możliwość rotacji sekretu, którego używają
    en:
      - Without startup authentication on, the change does nothing but the report shows the item as met
      - A met item that does nothing is worse than an unmet one, because it closes the subject
      - Operators working from accounts without administrative rights will no longer be able to change the startup code
      - Those people do not lose access to the machine; they lose the ability to rotate a secret they use
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Reguła o uwierzytelnianiu przy starcie poszła na tej maszynie do wyjątku — ta powinna pójść razem z nią
      - Obsługa maszyny opiera się na kontach bez praw administratora, a nie ustalono, kto i jak szybko zmieni kod startowy w razie potrzeby
    en:
      - The rule on startup authentication went to an exception on this machine - this one should go with it
      - The machine's operation rests on accounts without administrative rights and it is not settled who changes the startup code, or how quickly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'DisallowStandardUserPINReset'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'DisallowStandardUserPINReset'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This only means something where startup authentication is on. Without it
    # the entry makes the item read as met while doing nothing, which is worse
    # than leaving it unmet, because it closes the subject.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisallowStandardUserPINReset' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Ta reguła zależy od innej: kod startowy istnieje tylko tam, gdzie
    włączono uwierzytelnianie przy starcie. Jeżeli tamta poszła na serwerze
    do wyjątku, ta powinna pójść razem z nią i z tym samym uzasadnieniem.

    Kod startowy nie chroni konta, tylko maszynę. Jest jeden dla całego
    wolumenu, nie podlega polityce haseł, a ostatnia zmiana ustala dostęp
    dla wszystkich pozostałych — łącznie z tymi, którzy o niej nie wiedzą.

    Na serwerze zwykłych użytkowników bywa niewielu, ale bywają konta
    o ograniczonych prawach należące do usług, dostawców i obsługi. To one
    są najmniej pilnowane.
  en: |
    This rule depends on another: a startup code exists only where startup
    authentication has been turned on. If that one went to an exception on
    the server, this one should go with it and on the same grounds.

    A startup code does not protect an account; it protects the machine.
    There is one for the whole volume, it is not subject to the password
    policy, and the last change settles access for everybody else -
    including those who do not know about it.

    On a server ordinary users are few, but there are limited-rights
    accounts belonging to services, vendors and operators. Those are the
    ones nobody watches.
