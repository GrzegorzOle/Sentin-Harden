id: win2025-defender-asr-credential-stealing

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wykradania poświadczeń z procesu logowania
    en: Credential theft from the sign-in process blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Proces odpowiedzialny za logowanie trzyma w pamięci to, czym
    zalogowane konta potwierdzają swoją tożsamość. Punkt zabrania
    procesom spoza wąskiego kręgu zaufanych sięgać do tej pamięci.

    Jest to najważniejsza reguła w całej grupie i chcę powiedzieć,
    dlaczego tak uważam. Wyciągnięcie poświadczeń z pamięci jest
    czynnością, od której zaczyna się druga połowa każdego poważnego
    włamania. Pierwsza połowa to wejście na jedną maszynę. Druga to
    przejście z niej na pozostałe — i do tego potrzebne są cudze
    poświadczenia, a najtańszym ich źródłem jest pamięć procesu
    logowania.

    Na serwerze źródło to jest bogatsze, i to jest różnica, którą warto
    nazwać. Na stanowisku w pamięci leży zwykle jedno konto. Na
    serwerze leżą konta usługowe, konta zadań i wszystko, czym
    logowali się ostatnio administratorzy. Serwer terminalowy trzyma
    w pamięci tylu ludzi, ilu właśnie pracuje.

    Z tego wynika rzecz nieoczywista: maszyna, do której administrator
    właśnie się zalogował, żeby coś naprawić, jest w tej chwili
    najcenniejszym celem w całej sieci. Napastnik nie musi tam wchodzić
    — wystarczy, że już tam jest i poczeka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zebrania z jednej opanowanej maszyny poświadczeń
    wszystkich kont, które się na niej ostatnio logowały, łącznie
    z administracyjnymi.
  en: |
    The process answerable for signing in holds in memory that whereby the signed-in accounts bear
    out their names. The item forbids processes outside a narrow ring of the trusted to reach for
    that memory.

    It is the weightiest rule of the whole group and I mean to say why I hold so. The drawing of
    credentials out of memory is the act the second half of every grave breaking-in begins with.
    The first half is the coming onto one machine. The second is the going from it onto the rest -
    and for that another's credentials are needed, and their cheapest well is the memory of the
    process of signing in.

    On a server that well is the richer, and that is a difference worth naming. At a station one
    account mostly lies in memory. On a server there lie service accounts, accounts of tasks and
    all that administrators last signed in with. A terminal server holds in memory as many people
    as are at that moment at work.

    Out of this comes a thing not plain - the machine an administrator has just signed in to in
    order to mend something is at that moment the worthiest mark in the whole net. The attacker
    need not come in there - it is enough that they are there already and wait.

    What an attacker gains while the item goes unmet: the means of gathering off one machine they
    hold the credentials of every account that has lately signed in upon it, the administrative
    ones among them.

disruption_description:
  pl: |
    Podnoszę tu klasę względem paczki stanowiska roboczego i uważam, że
    jest to konieczne, choć sama blokada jest w obu przypadkach ta sama.

    Powód leży w tym, co na serwerze sięga do procesu logowania. Na
    stanowisku prawie nic — i dlatego tamta reguła może iść hurtem.
    Na serwerze sięga tam więcej rzeczy i część z nich robi to
    prawidłowo.

    Pierwsza grupa to agenty ochronne innych wytwórców, które
    obserwują pamięć procesu logowania właśnie po to, żeby wykryć atak,
    o którym mowa w tej regule. Odróżnia je od narzędzia napastnika
    podpis i wpis na liście zaufanych, a nie zachowanie.

    Druga to narzędzia diagnostyczne: zbieranie zrzutów pamięci przy
    awarii, narzędzia producenta sprzętu, oprogramowanie analizujące
    zużycie zasobów. Zrzut pamięci całej maszyny obejmuje także ten
    proces.

    Trzecia to narzędzia do zarządzania tożsamością i audytu, które
    sprawdzają, kto jest zalogowany i czym.

    Objaw jest tu szczególnie mylący. Zablokowany agent nie zgłasza,
    że został zablokowany — zgłasza, że nie może odczytać danych, albo
    milczy. Monitorowanie, które przestało widzieć część obrazu, wygląda
    tak samo jak monitorowanie, które nic nie znajduje.

    Dlatego przed zmianą wypisz, co na tej maszynie ma prawo tam
    sięgać, a po zmianie sprawdź dziennik mechanizmu. To jest jedyny
    sposób, żeby odróżnić ciszę od ciszy.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    I raise the class here against the working station's pack and hold it needful, though the
    blocking itself is in both cases the same.

    The ground lies in what on a server reaches for the process of signing in. At a station all but
    nothing - and therefore that rule may go in bulk. On a server more things reach there and some
    of them do it rightly.

    The first band is guarding agents of other makers, which watch the memory of the process of
    signing in for the very purpose of finding the attack this rule speaks of. What tells them from
    an attacker's tool is a signing and an entry on a list of the trusted, and not their behaviour.

    The second is tools of diagnosis - the gathering of castings of memory at a fault, tools of the
    maker of the gear, software that weighs the spending of means. A casting of the whole machine's
    memory takes in this process too.

    The third is tools for the managing of names and for auditing, which look at who is signed in
    and with what.

    The symptom here misleads above all. A blocked agent does not report that it was blocked - it
    reports that it cannot read the readings, or it is silent. A watching that has stopped seeing
    part of the picture looks the same as a watching that finds nothing.

    Therefore before the change write out what on this machine has the right to reach there, and
    after the change look into the mechanism's log. It is the one way of telling silence from
    silence.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - diagnostics-and-reporting
    - logging-and-audit
  what_breaks:
    pl:
      - Agent ochronny innego wytwórcy obserwujący pamięć procesu logowania może zostać zablokowany
      - Zbieranie zrzutów pamięci przy awarii obejmuje ten proces i może przestać działać
      - Narzędzia sprawdzające, kto jest zalogowany i czym, mogą stracić dostęp do tych danych
      - Zablokowany agent nie zgłasza blokady, tylko milczy albo zgłasza brak danych
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - A guarding agent of another maker watching the memory of the sign-in process may be blocked
      - The gathering of castings of memory at a fault takes in this process and may stop working
      - Tools that look at who is signed in and with what may lose access to those readings
      - A blocked agent does not report the blocking, it is silent or reports readings wanting
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje agent ochronny innego wytwórcy sięgający do pamięci procesu logowania
      - Nikt nie sprawdzi po zmianie dziennika mechanizmu, więc zablokowany agent zostanie niezauważony
    en:
      - A guarding agent of another maker reaching for the sign-in process's memory works on the machine
      - Nobody will look into the mechanism's log after the change, so a blocked agent will go unmarked
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Uważam to za najważniejszą regułę w całej grupie. Wyciągnięcie
    poświadczeń z pamięci jest czynnością, od której zaczyna się przejście
    z jednej opanowanej maszyny na pozostałe.

    Na serwerze pamięć procesu logowania jest bogatsza niż na
    stanowisku: konta usługowe, konta zadań i wszystko, czym logowali
    się ostatnio administratorzy. Maszyna, do której administrator
    właśnie się zalogował, żeby coś naprawić, jest w tej chwili
    najcenniejszym celem w sieci.

    Klasę podniosłem, bo na serwerze do tego procesu sięga więcej
    rzeczy prawidłowych niż na stanowisku — agenty ochronne innych
    wytwórców, narzędzia diagnostyczne, narzędzia audytu tożsamości.
    Odróżnia je podpis, a nie zachowanie.
  en: |
    I hold this the weightiest rule of the whole group. The drawing of credentials out of memory is
    the act the going from one held machine onto the rest begins with.

    On a server the memory of the process of signing in is the richer than at a station - service
    accounts, accounts of tasks and all that administrators last signed in with. The machine an
    administrator has just signed in to in order to mend something is at that moment the worthiest
    mark in the net.

    I raised the class, more right things reaching for that process on a server than at a station -
    guarding agents of other makers, tools of diagnosis, tools for the auditing of names. What
    tells them apart is a signing and not a behaviour.
