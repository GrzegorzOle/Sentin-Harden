id: win2016-audit-authorization-policy-change

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja zmiany zasad autoryzacji
    en: Audit authorization policy change
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje zmiany w przypisaniu uprawnień użytkownika — czyli
    dokładnie te zmiany, które opisuje cały blok reguł o uprawnieniach.

    Związek jest bezpośredni i wart nazwania. Reguły uprawnień ustalają, kto
    może obejść system plików, przejąć własność, debugować procesy albo zamknąć
    maszynę zdalnie. Ta podkategoria zapisuje moment, w którym ktoś tę listę
    zmienia. Bez niej konfiguracja uprawnień jest stanem, który da się sprawdzić,
    ale nie historią, którą da się prześledzić.

    W praktyce znaczy to tyle: audyt przeprowadzony dziś pokaże, że uprawnienie
    ma ktoś niewłaściwy. Bez tej podkategorii nie odpowie na pytanie, kiedy to
    się stało — a więc czy jest to zaniedbanie sprzed trzech lat, czy ślad
    włamania sprzed trzech dni. To jest różnica między ustaleniem a incydentem.

    Zmiany w przypisaniu uprawnień idą zwykle przez zasady grupy, a nie ręcznie.
    Zdarzenie powstaje w obu przypadkach, więc odróżnienie zmiany wdrożonej od
    zmiany ręcznej wymaga porównania z cyklem odświeżania zasad.

    Rejestruje się powodzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nadanie sobie
    uprawnienia systemowego tak, że wygląda ono na zastane, a nie na nadane.
  en: |
    The subcategory records changes to the assignment of user rights - which is to
    say exactly the changes the whole block of rules on rights describes.

    The connection is direct and worth naming. The rules on rights settle who may go
    round the file system, take ownership, debug processes or shut the machine down
    remotely. This subcategory records the moment somebody alters that list. Without
    it the configuration of rights is a state that can be checked, but not a history
    that can be traced.

    In practice that means this: an audit carried out today will show that a right is
    held by the wrong person. Without this subcategory it will not answer the
    question when that happened - and so whether it is a three-year-old oversight or
    the trace of a break-in three days old. That is the difference between a finding
    and an incident.

    Changes to the assignment of rights usually come through group policy rather
    than by hand. The event arises in either case, so telling a deployed change from
    one made by hand calls for a comparison with the policy refresh cycle.

    Successes are recorded.

    What an attacker gains while the item goes unmet: the granting of a system right
    to themselves in such a way that it looks inherited rather than granted.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Przypisanie uprawnień zmienia się rzadko, a na
    maszynie zarządzanej zasadami grupy zmiany są skupione w momentach
    wdrożenia.

    Zastrzeżenie jest takie samo jak przy zmianie zasad inspekcji: jeżeli zasady
    grupy nadpisują przypisanie uprawnień przy każdym cyklu odświeżania,
    zdarzenia będą powstawać regularnie mimo braku faktycznej zmiany. Warto
    wtedy sprawdzić, czy konfiguracja lokalna nie walczy z wdrożoną — sam
    strumień zdarzeń jest tu użytecznym sygnałem.

    Nic przy tym nie przestaje działać i nikt niczego nie zauważy.

    Czego to nie psuje: nadawania i odbierania uprawnień, zasad grupy, pracy
    narzędzi administracyjnych ani wdrożeń.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The assignment of rights changes seldom, and on a
    machine managed by group policy the changes cluster at moments of deployment.

    The reservation is the same as with the change of audit policy: if group policy
    overwrites the assignment of rights at every refresh cycle, events will arise
    regularly despite no actual change. It is then worth checking whether the local
    configuration is at odds with the deployed one - the stream of events is itself a
    useful signal here.

    Nothing stops working while this goes on and nobody notices anything.

    What this does not break: the granting and withdrawal of rights, group policy,
    the work of administrative tools, or deployments.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — przypisanie uprawnień zmienia się rzadko i zdarzeń przybywa niewiele
      - Jeżeli zasady grupy nadpisują przypisanie przy każdym cyklu, zdarzenia powstają regularnie mimo braku zmiany
      - Nadawanie i odbieranie uprawnień oraz zasady grupy działają bez zmian
      - Praca narzędzi administracyjnych i wdrożenia pozostają nietknięte
    en:
      - No regression in the working - the assignment of rights changes seldom and few events accrue
      - If group policy overwrites the assignment at every cycle, events arise regularly despite no change
      - The granting and withdrawal of rights, and group policy, work unchanged
      - The work of administrative tools and deployments stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — objętość jest pomijalna nawet przy ciasnym dzienniku
    en:
      - No known contraindication - the volume is negligible even with a tight log
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9231-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9231-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9231-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9231-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9231-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-authorization-policy-change

notes:
  pl: |
    Punkt jest domknięciem całego bloku uprawnień użytkownika. Tamte reguły
    sprawdzają stan; ta zapewnia, że zmiana stanu zostanie zapisana. W raporcie
    warto je pokazać razem, bo osobno każda odpowiada na połowę pytania.

    Zdarzenie powstaje niezależnie od tego, czy zmianę wprowadzono ręcznie, czy
    przez zasady grupy. Odróżnienie wymaga zestawienia z cyklem odświeżania —
    reguła tego nie robi i nie powinna udawać, że robi.

    Kategoria wysoka, mimo że sama zmiana wymaga wysokich uprawnień. Powód jest
    taki, że bez tego zapisu każde ustalenie audytu uprawnień jest
    nieumiejscowione w czasie, a przez to nierozstrzygalne.
  en: |
    The item closes the whole block on user rights. Those rules check the state; this
    one ensures a change of state is recorded. They are worth showing together in
    the report, since apart each answers half the question.

    The event arises whether the change was made by hand or through group policy.
    Telling them apart calls for a comparison with the refresh cycle - the rule does
    not do that and should not pretend to.

    The category is high although the change itself calls for high rights. The reason
    is that without this record every finding of an audit of rights is unplaced in
    time, and thereby undecidable.
