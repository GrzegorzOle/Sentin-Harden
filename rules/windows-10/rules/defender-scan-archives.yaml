id: win10-defender-scan-archives

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan
  title:
    pl: Skanowanie zawartości archiwów
    en: Archive contents scanned
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zaglądać do wnętrza archiwów zamiast oceniać je jako
    pojedynczy plik.

    Archiwum jest opakowaniem, które zmienia skrót pliku, nie zmieniając
    jego zawartości. Spakowanie pliku złośliwego jest czynnością
    kosztującą sekundę i wystarczającą, żeby sprawdzenie po skrócie nie
    znalazło nic. Bez zaglądania do środka ochrona widzi plik archiwum,
    o którym nie wie nic poza tym, że jest archiwum.

    Droga ta jest wykorzystywana przede wszystkim w poczcie, bo archiwum
    przechodzi tam, gdzie plik wykonywalny zostałby odrzucony. Odbiorca
    rozpakowuje je sam i przez to wykonuje za napastnika czynność, której
    ten nie mógł wykonać zdalnie.

    Odnotowuję, że mechanizm obejmuje również archiwa zagnieżdżone,
    z ograniczeniem głębokości. Archiwum spakowane kilkanaście razy
    przestaje być sprawdzane, ale jest wtedy samo w sobie sygnałem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przepuszczenie
    pliku złośliwego przez sprawdzenie za cenę jednego spakowania.
  en: |
    The setting bids the inside of archives be looked into, rather than their being weighed as a single file.

    An archive is a wrapping that changes a file's digest without changing its contents. The packing of a
    malicious file is an act costing a second and enough that a check upon the digest finds nothing. Without a
    looking inside, the protection sees an archive file about which it knows nothing beyond its being an archive.

    That road is used above all in the post, an archive going through where an executable file would be turned
    away. The receiver unpacks it themselves and by that carries out for the attacker an act the attacker could
    not carry out from afar.

    I set down that the mechanism takes in nested archives as well, with a bound upon the depth. An archive packed
    a dozen times over ceases to be checked, but is then of itself a signal.

    What an attacker gains while the item goes unmet: the letting of a malicious file through the check at the
    cost of one packing.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Rozpakowywanie do sprawdzenia kosztuje czas przy pierwszym dostępie do
    archiwum. Dla plików spotykanych w pracy biurowej jest to czas
    niezauważalny.

    Odnotowuję, gdzie bywa widoczny: archiwa liczone w gigabajtach,
    otwierane po raz pierwszy. Otwarcie takiego archiwum trwa dłużej,
    bo ochrona musi przejść jego zawartość. Nie jest to zatrzymanie, tylko
    opóźnienie jednorazowe.

    Druga rzecz warta odnotowania: archiwa zabezpieczone hasłem nie dają
    się sprawdzić i przechodzą jako nieznane. Nie jest to skutek tej
    zmiany, tylko granica mechanizmu — ale użytkownik, który po włączeniu
    skanowania uzna archiwa za sprawdzane wszystkie, będzie w błędzie.

    Czego to nie psuje: tworzenia archiwów, rozpakowywania, otwierania
    dokumentów, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The unpacking for a check costs time at the first reaching for an archive. For the files met with in office
    work that time goes unnoticed.

    I set down where it shows at times: archives counted in gigabytes, opened for the first time. The opening of
    such an archive takes longer, the protection having to go through its contents. It is no halting but a delay
    of one time.

    A second thing worth setting down: archives guarded by a password cannot be checked and go through as
    unknown. It is no consequence of this change but the mechanism's bound - yet a user who after the switching
    on holds every archive checked will be in the wrong.

    What this does not break: the making of archives, their unpacking, the opening of documents, logging on, file
    shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - email-and-attachments
  what_breaks:
    pl:
      - Archiwa liczone w gigabajtach otwierają się przy pierwszym dostępie dłużej, bo ochrona przechodzi ich zawartość
      - Archiwa zabezpieczone hasłem nie dają się sprawdzić i przechodzą jako nieznane
      - Archiwum spakowane kilkanaście razy przekracza ograniczenie głębokości i przestaje być sprawdzane
      - Opóźnienie jest jednorazowe i dotyczy pierwszego dostępu, a nie każdego otwarcia
      - Tworzenie archiwów, rozpakowywanie, otwieranie dokumentów, logowanie i drukowanie pozostają bez zmian
    en:
      - Archives counted in gigabytes open the slower at the first reaching, the protection going through their contents
      - Archives guarded by a password cannot be checked and go through as unknown
      - An archive packed a dozen times over passes the bound upon depth and ceases to be checked
      - The delay is of one time and touches the first reaching, not every opening
      - The making of archives, their unpacking, the opening of documents, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje wyłącznie z archiwami liczonymi w gigabajtach i pierwszy dostęp do nich jest czasem krytycznym
    en:
      - The machine works with archives counted in gigabytes alone and the first reaching for them is a critical time
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableArchiveScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableArchiveScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is a negative one, so the compliant value is a nought: the scanning
    # of archives is not switched off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableArchiveScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest pierwszą z trzech opisujących zasięg skanowania i warto
    pokazywać je razem. Każda dokłada jedno miejsce, w które ochrona
    zagląda; osobno wyglądają na drobiazgi, razem układają się w odpowiedź
    na pytanie, czego skanowanie nie obejmuje.

    Argument wart postawienia wprost dotyczy kosztu po stronie napastnika.
    Spakowanie pliku to czynność jednego polecenia, więc różnica między
    ochroną zaglądającą do archiwów a nieodróżniającą ich jest różnicą
    między sprawdzeniem a jego pozorem.

    Odnotowuję granicę mechanizmu, bo jest źródłem złudzenia. Archiwum
    z hasłem przechodzi nietknięte i właśnie dlatego jest w poczcie
    używane. Spełnienie tego punktu nie zamyka tej drogi — zamyka drogę
    prostszą, z której korzysta się częściej.
  en: |
    The rule is the first of three describing the reach of the scan, and it is well to show them together. Each
    adds one place the protection looks into; apart they look like trifles, together they make up an answer to
    the question of what the scanning does not take in.

    The argument worth putting outright touches the cost upon the attacker's side. The packing of a file is an
    act of one command, so the difference between a protection that looks into archives and one that does not
    tell them apart is the difference between a check and the seeming of one.

    I set down the mechanism's bound, it being a source of delusion. An archive with a password goes through
    untouched, and for just that reason it is used in the post. The meeting of this item does not close that road
    - it closes the simpler road, the one used the oftener.
