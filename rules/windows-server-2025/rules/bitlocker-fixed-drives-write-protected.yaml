id: win2025-bitlocker-fixed-drives-write-protected

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Zapis na niezaszyfrowanych dyskach stałych zabroniony
    en: Writing to unencrypted fixed drives forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że wolumen stały, który nie jest zaszyfrowany, daje się
    tylko czytać. Zapis na niego zostaje odmówiony.

    Zostawiam kategorię wysoką i chcę powiedzieć, czym ta reguła różni się
    od wszystkich pozostałych w grupie BitLockera, bo różnica jest
    zasadnicza. Tamte opisują, jak ma wyglądać szyfrowanie. Ta wymusza,
    żeby w ogóle nastąpiło. Bez niej cała grupa jest zbiorem ustawień
    czekających na to, aż ktoś pamiętał o zaszyfrowaniu nowego wolumenu.
    Z nią pominięcie tego kroku przestaje być możliwe do przeoczenia, bo
    wolumen niezaszyfrowany od razu przestaje przyjmować dane.

    To jest jedyny punkt w tej grupie, który zamyka lukę proceduralną,
    a nie techniczną. Nośniki niezaszyfrowane na serwerze nie biorą się
    z decyzji, tylko z rutyny: ktoś dołożył wolumen w oknie serwisowym,
    ktoś podłączył nową jednostkę z macierzy, ktoś odtworzył dane na
    świeży nośnik. Nikt nie postanowił, że te dane mają leżeć otwarte —
    po prostu zabrakło jednego kroku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wolumeny
    z danymi produkcyjnymi, które nigdy nie zostały zaszyfrowane, bo
    w procedurze ich dołożenia nie było o tym mowy.
  en: |
    The item makes a fixed volume that is not encrypted readable only.
    Writing to it is refused.

    I keep the category high, and I want to say how this rule differs from
    all the others in the BitLocker group, because the difference is
    fundamental. Those describe what encryption should look like. This one
    forces it to happen at all. Without it the whole group is a set of
    settings waiting for somebody to remember to encrypt a new volume. With
    it, skipping that step stops being something that can be overlooked,
    because an unencrypted volume immediately stops accepting data.

    This is the only item in the group that closes a procedural gap rather
    than a technical one. Unencrypted media on a server do not come from a
    decision but from routine: somebody added a volume in a service window,
    somebody attached a new unit from the array, somebody restored data
    onto a fresh medium. Nobody resolved that this data should lie open -
    one step was simply missed.

    What an attacker gains while the item goes unmet: volumes holding
    production data that were never encrypted, because the procedure for
    adding them said nothing about it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać, jak ta
    zmiana wygląda od strony objawu, bo jest to punkt, który potrafi
    zatrzymać usługę bez żadnego komunikatu skierowanego do człowieka.

    Wolumen przechodzi w tryb tylko do odczytu natychmiast. Aplikacja,
    która na nim pisze, nie dostaje informacji o polityce szyfrowania —
    dostaje odmowę zapisu. Baza zgłosi to jako błąd dysku, usługa kopii
    zapasowych jako brak miejsca, a serwer plików jako odmowę dostępu dla
    użytkownika. Żaden z tych komunikatów nie prowadzi w stronę przyczyny,
    więc diagnoza potrafi zająć więcej czasu niż sama naprawa.

    Dlatego kolejność ma tutaj znaczenie większe niż w pozostałych punktach
    tej grupy. Najpierw wykaz wszystkich wolumenów stałych tej maszyny
    razem ze stanem szyfrowania każdego z nich, potem zaszyfrowanie tych,
    które tego wymagają, a dopiero na końcu ta reguła — jako zamknięcie,
    nie jako początek. Zastosowana pierwsza, zatrzyma produkcję tego samego
    dnia.

    Na serwerze do wykazu należy wpisać także nośniki, o których łatwo
    zapomnieć, bo nie wyglądają na dyski maszyny: jednostki udostępnione
    z macierzy, wolumeny klastrowe i nośniki podłączane wyłącznie na czas
    odtwarzania. Każdy z nich podlega tej regule dokładnie tak samo.

    Zmiana nie wymaga przerwy i cofa się natychmiast — i to jest tu istotne,
    bo daje wyjście awaryjne, gdy okaże się, że wykaz był niepełny.
  en: |
    I keep the class "needs a planned rollout" and want to name what this
    change looks like from the symptom side, because this is an item that
    can stop a service without any message addressed to a human being.

    The volume goes read-only immediately. An application writing to it
    gets no information about an encryption policy - it gets a write
    refusal. A database will report it as a disk error, a backup service as
    a lack of space, a file server as access denied for the user. None of
    those messages leads towards the cause, so the diagnosis can take
    longer than the fix.

    That is why order matters more here than at the other items in this
    group. First an inventory of every fixed volume on this machine
    together with the encryption state of each, then encrypting those that
    need it, and only at the end this rule - as a closure, not as a start.
    Applied first, it will stop production the same day.

    On a server the inventory has to include media that are easy to forget
    because they do not look like the machine's disks: units presented from
    an array, cluster volumes, and media attached only for the duration of
    a restore. Every one of them is subject to this rule in exactly the
    same way.

    The change needs no outage and is undone immediately - and that matters
    here, because it provides a way out when the inventory turns out to
    have been incomplete.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Każdy niezaszyfrowany wolumen stały przechodzi w tryb tylko do odczytu natychmiast
      - Baza zgłosi to jako błąd dysku, usługa kopii jako brak miejsca, a serwer plików jako odmowę dostępu
      - Żaden z tych komunikatów nie prowadzi w stronę przyczyny, więc diagnoza trwa dłużej niż naprawa
      - Podlegają temu także jednostki z macierzy, wolumeny klastrowe i nośniki podłączane na czas odtwarzania
      - Zastosowana przed zaszyfrowaniem wolumenów zatrzyma produkcję tego samego dnia
    en:
      - Every unencrypted fixed volume goes read-only immediately
      - A database reports it as a disk error, a backup service as a lack of space, a file server as access denied
      - None of those messages leads towards the cause, so the diagnosis takes longer than the fix
      - Units from an array, cluster volumes and media attached for a restore are equally subject to it
      - Applied before the volumes are encrypted, it will stop production the same day
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sporządzono wykazu wszystkich wolumenów stałych tej maszyny wraz ze stanem szyfrowania każdego z nich
      - Na maszynie pozostają wolumeny, które nie zostały jeszcze zaszyfrowane, a mają przyjmować zapis
      - Do maszyny podłącza się nośniki na czas odtwarzania, a procedura odtworzeniowa nie przewiduje ich szyfrowania
    en:
      - No inventory of every fixed volume on this machine together with each one's encryption state has been made
      - Volumes that are not yet encrypted remain on the machine and are meant to accept writes
      - Media are attached for restores and the restore procedure does not provide for encrypting them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
      $name = 'FDVDenyWriteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    $name = 'FDVDenyWriteAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Run this last, not first. Every unencrypted fixed volume goes read-only
    # at once, and the application sees a write refusal rather than a policy -
    # a database reports a disk error, a backup service reports no space.
    # Inventory the volumes and encrypt them before this.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVDenyWriteAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Jedyny punkt w tej grupie, który zamyka lukę proceduralną, a nie
    techniczną. Pozostałe opisują, jak ma wyglądać szyfrowanie; ten wymusza,
    żeby w ogóle nastąpiło.

    Nośniki niezaszyfrowane na serwerze nie biorą się z decyzji, tylko
    z rutyny: wolumen dołożony w oknie serwisowym, nowa jednostka
    z macierzy, odtworzenie na świeży nośnik. Nikt nie postanowił, żeby te
    dane leżały otwarte — zabrakło jednego kroku.

    Kolejność ma tu większe znaczenie niż gdzie indziej w grupie: najpierw
    wykaz wolumenów ze stanem szyfrowania, potem szyfrowanie, a ta reguła
    na końcu. Zastosowana pierwsza, zatrzyma produkcję tego samego dnia.
  en: |
    The only item in this group that closes a procedural gap rather than a
    technical one. The others describe what encryption should look like;
    this one forces it to happen at all.

    Unencrypted media on a server do not come from a decision but from
    routine: a volume added in a service window, a new unit from the array,
    a restore onto a fresh medium. Nobody resolved that this data should
    lie open - one step was missed.

    Order matters more here than elsewhere in the group: first the
    inventory of volumes with their encryption state, then the encryption,
    and this rule last. Applied first, it will stop production the same
    day.
