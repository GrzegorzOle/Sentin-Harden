id: win2025-wireless-connect-now-wizards-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connect Now
  title:
    pl: Dostęp do kreatorów uproszczonego parowania sieci zablokowany
    en: Access to the simplified network pairing wizards blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje dostęp do kreatorów uproszczonego parowania sieci —
    okien, którymi człowiek uruchamia ten mechanizm ze swojej strony.

    Kategoria średnia i chcę wyjaśnić, czemu ten punkt istnieje obok
    poprzedniego, skoro dotyczą tego samego mechanizmu. Tamten wyłącza samą
    możliwość wymiany ustawień. Ten zamyka drogę, którą człowiek tę wymianę
    rozpoczyna. Rozdzielenie ma sens, bo kreatory robią coś, czego sam
    mechanizm nie robi: zapisują konfigurację sieci na nośniku wymiennym
    i odczytują ją z niego.

    To jest właściwa treść tego punktu. Konfiguracja sieci wraz z kluczem
    ląduje w pliku na nośniku, który ktoś potem wynosi z serwerowni
    w kieszeni. Klucz do sieci przestaje wtedy być rzeczą w maszynie,
    a staje się rzeczą w czyjejś kieszeni — i nie zostawia po sobie śladu
    w żadnym dzienniku, bo z punktu widzenia systemu nic złego się nie
    stało.

    Warto też widzieć, że kreator jest tu stroną czynną. Nie trzeba
    czekać, aż urządzenie się ogłosi — wystarczy, że ktoś zalogowany na
    maszynie otworzy okno i przeprowadzi procedurę do końca.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przewidzianą
    procedurę wyniesienia konfiguracji sieci wraz z kluczem na nośniku
    wymiennym.
  en: |
    The item blocks access to the simplified network pairing wizards - the
    windows by which a person starts that mechanism from their side.

    The category is medium, and I want to explain why this item exists
    alongside the previous one, given that both concern the same mechanism.
    That one switches off the very possibility of exchanging settings. This
    one closes the road by which a person begins that exchange. The
    separation makes sense, because the wizards do something the mechanism
    itself does not: they write the network's configuration to removable
    media and read it back from there.

    That is the real substance of this item. The network's configuration
    together with its key lands in a file on media which somebody then
    carries out of the server room in a pocket. The network's key then stops
    being a thing inside a machine and becomes a thing in somebody's pocket -
    and it leaves no trace in any log, because from the system's point of
    view nothing bad has happened.

    It is also worth seeing that the wizard is the active party here. There
    is no need to wait for a device to announce itself - it is enough that
    somebody signed in to the machine opens the window and carries the
    procedure through.

    What an attacker gains while the item goes unmet: a foreseen procedure
    for carrying the network configuration, key and all, out on removable
    media.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie widzę tu nic do stracenia:
    te kreatory są elementem powłoki stanowiskowej i w pracy serwera nie
    występują.

    Skutek, gdyby ktoś ich szukał: okna po prostu się nie otworzą. Nie
    znika przy tym żaden inny sposób konfigurowania sieci. Wybranie sieci
    z listy, wpisanie hasła, zaimportowanie profilu, ustawienie sieci
    poleceniem — wszystko to działa dalej i wszystko to jest drogą
    właściwą.

    Czego to nie psuje: połączeń bezprzewodowych, zapisanych profili,
    sieci przewodowej, nośników wymiennych jako takich ani żadnej usługi.
    Punkt dotyczy dwóch okien kreatora i niczego więcej.

    Rzecz do zapamiętania: ten punkt i wyłączenie samej wymiany ustawień
    leżą pod sąsiednimi, ale różnymi ścieżkami rejestru — jedna dotyczy
    mechanizmu, druga jego interfejsu. Zrobienie jednego nie zamyka
    drugiego i w sprawozdaniu stoją osobno.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption" and on a server I see nothing to lose: these
    wizards are part of the workstation shell and do not occur in a server's
    work.

    The effect, were anybody to look for them: the windows simply will not
    open. No other way of configuring a network disappears with them.
    Choosing a network from a list, typing a password, importing a profile,
    setting a network by a command - all of that still works and all of it is
    the proper route.

    What this does not break: wireless connections, saved profiles, the wired
    network, removable media as such, or any service. The item concerns two
    wizard windows and nothing more.

    Something to remember: this item and the switching off of the settings
    exchange itself lie under neighbouring but different registry paths - one
    concerns the mechanism, the other its interface. Doing one does not close
    the other, and in the report they stand separately.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Okna kreatorów uproszczonego parowania sieci po prostu się nie otworzą
      - Wybranie sieci z listy, wpisanie hasła, zaimportowanie profilu i ustawienie sieci poleceniem działają dalej
      - Połączenia bezprzewodowe, zapisane profile, sieć przewodowa i nośniki wymienne nie są tym objęte
      - Punkt i wyłączenie samej wymiany ustawień leżą pod różnymi ścieżkami — zrobienie jednego nie zamyka drugiego
    en:
      - The windows of the simplified network pairing wizards simply will not open
      - Choosing a network from a list, typing a password, importing a profile and setting a network by command still work
      - Wireless connections, saved profiles, the wired network and removable media are not covered
      - This item and the switching off of the settings exchange lie under different paths - doing one does not close the other
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym konfiguracja sieci jest przenoszona między urządzeniami tymi kreatorami i nie ma innej drogi
    en:
      - The machine is a workstation where network configuration is moved between devices by these wizards and there is no other route
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # A neighbouring path to the one holding the settings exchange itself:
      # this entry concerns the interface, that one the mechanism.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
      $name = 'DisableWcnUi'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
    $name = 'DisableWcnUi'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wizards do what the mechanism itself does not: they write the network
    # configuration, key and all, to removable media and read it back. The key
    # then stops being a thing inside a machine and becomes a thing in somebody's
    # pocket, leaving no trace in any log.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWcnUi' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/mobilebroadband/

notes:
  pl: |
    Punkt istnieje obok wyłączenia samego mechanizmu, bo kreatory robią coś,
    czego mechanizm nie robi: zapisują konfigurację sieci na nośniku
    wymiennym i odczytują ją z niego.

    Konfiguracja wraz z kluczem ląduje w pliku, który ktoś wynosi
    z serwerowni w kieszeni. Klucz przestaje być rzeczą w maszynie, a staje
    się rzeczą w czyjejś kieszeni — bez śladu w dzienniku, bo z punktu
    widzenia systemu nic złego się nie stało.

    Kreator jest tu stroną czynną: nie trzeba czekać, aż urządzenie się
    ogłosi, wystarczy, że ktoś otworzy okno i przeprowadzi procedurę.
  en: |
    The item exists alongside the switching off of the mechanism itself,
    because the wizards do something the mechanism does not: they write the
    network configuration to removable media and read it back.

    The configuration, key and all, lands in a file somebody carries out of
    the server room in a pocket. The key stops being a thing inside a machine
    and becomes a thing in somebody's pocket - with no trace in any log,
    because from the system's point of view nothing bad has happened.

    The wizard is the active party here: there is no need to wait for a
    device to announce itself, it is enough that somebody opens the window
    and carries the procedure through.
