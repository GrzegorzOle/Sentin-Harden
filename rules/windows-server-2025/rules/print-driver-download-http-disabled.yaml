id: win2025-print-driver-download-http-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Blokada pobierania sterowników drukarek z internetu
    en: Printer drivers not downloaded from the internet
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania systemowi pobierania sterowników drukarek z zasobu
    internetowego przy dodawaniu urządzenia.

    Kategoria średnia, a przedmiot jest tu poważniejszy niż w pozostałych
    punktach tego bloku, bo mowa o sterowniku. Sterownik drukarki nie jest
    plikiem opisującym urządzenie — to kod, który zostaje zainstalowany
    w systemie i pracuje z wysokimi uprawnieniami. Na serwerze wydruku
    dochodzi do tego druga rzecz: ten sam sterownik bywa następnie
    rozsyłany do stanowisk, które z tego serwera drukują.

    To jest właściwa treść tego punktu. Bez blokady droga instalowania kodu
    na serwerze prowadzi przez czynność, która nie wygląda na instalowanie
    kodu — przez dodanie drukarki. Robi to administrator, w dobrej wierze,
    zwykle w pośpiechu, bo ktoś czeka na wydruk.

    Nie twierdzę, że pobierane stamtąd sterowniki są złe — są podpisane
    i pochodzą ze znanego zasobu. Twierdzę, że serwer produkcyjny nie
    powinien ściągać i instalować kodu z sieci na skutek czynności
    obsługowej, a zestaw sterowników, które na nim są, powinien być
    wiadomy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sytuację,
    w której kod uprzywilejowany trafia na serwer drogą, której nikt nie
    zapisuje jako instalacji oprogramowania.
  en: |
    The item forbids the system to fetch printer drivers from an internet
    resource when a device is being added.

    The category is medium, and the subject here is graver than in the other
    items of this block, because a driver is what is at stake. A printer
    driver is not a file describing a device - it is code that gets installed
    in the system and runs with high privileges. On a print server a second
    thing follows: that same driver is then handed out to the workstations
    printing through it.

    That is the real substance of the item. Without the block, the route by
    which code gets installed on the server runs through an action that does
    not look like installing code - through adding a printer. An
    administrator does it, in good faith, usually in a hurry, because
    somebody is waiting for a printout.

    I am not claiming the drivers fetched from there are bad - they are
    signed and come from a known resource. I claim that a production server
    should not pull down and install code from the network as a result of a
    routine action, and that the set of drivers on it should be known.

    What an attacker gains while the item goes unmet: a situation in which
    privileged code reaches the server by a route nobody records as
    installing software.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i tutaj sprawdzenie jest realne, a nie
    formalne — bo skutek dotyka czynności, którą ktoś prędzej czy później
    wykona.

    Po zmianie dodanie drukarki, której sterownika nie ma ani w systemie,
    ani w zasobie wewnętrznym, nie powiedzie się. Komunikat mówi
    o niepowodzeniu instalacji sterownika i nie wskazuje polityki jako
    przyczyny, więc administrator zobaczy problem ze sprzętem tam, gdzie
    jest decyzja konfiguracyjna. Warto to zapisać, bo diagnozowanie tego na
    ślepo potrafi zająć godzinę.

    Droga obejścia pozostaje w całości: sterownik pobiera się ręcznie od
    producenta i instaluje normalnie. To jest zresztą dokładnie ta zmiana,
    o którą w tym punkcie chodzi — pobranie sterownika staje się świadomą
    czynnością, a nie skutkiem ubocznym podłączenia urządzenia.

    Czego to nie psuje: drukarek już zainstalowanych, serwera wydruku jako
    roli, sterowników rozsyłanych ze wspólnego zasobu w organizacji ani
    sterowników dostarczanych wraz z systemem.

    Warunkiem wartym sprawdzenia przed zastosowaniem jest to, czy
    organizacja ma miejsce, z którego administrator weźmie sterownik. Jeżeli
    nie ma, reguła nie tyle zabezpiecza, co przenosi problem na osobę
    stojącą przy drukarce.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and here the review is real rather than
    formal - because the effect touches an action somebody will sooner or
    later perform.

    After the change, adding a printer whose driver is neither in the system
    nor in an internal resource will fail. The message speaks of the driver
    installation failing and does not name policy as the cause, so an
    administrator will see a hardware problem where there is a configuration
    decision. That is worth recording, because diagnosing it blind can take
    an hour.

    The way round remains entirely open: the driver is fetched by hand from
    the maker and installed normally. That is in fact exactly the change this
    item is about - fetching a driver becomes a deliberate action rather than
    a side effect of plugging a device in.

    What this does not break: printers already installed, the print server
    role, drivers handed out from a shared resource in the organisation, or
    drivers delivered with the system.

    A condition worth checking before applying: whether the organisation has
    a place from which an administrator will take a driver. If it has not,
    the rule does not so much protect as move the problem onto the person
    standing by the printer.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Dodanie drukarki, której sterownika nie ma w systemie ani w zasobie wewnętrznym, nie powiedzie się
      - Komunikat mówi o niepowodzeniu instalacji sterownika i nie wskazuje polityki jako przyczyny
      - Sterownik nadal można pobrać ręcznie od producenta i zainstalować normalnie
      - Drukarki już zainstalowane, rola serwera wydruku i sterowniki dostarczane z systemem działają bez zmian
    en:
      - Adding a printer whose driver is neither in the system nor in an internal resource will fail
      - The message speaks of the driver installation failing and does not name policy as the cause
      - The driver can still be fetched by hand from the maker and installed normally
      - Printers already installed, the print server role and drivers delivered with the system work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Organizacja nie ma własnego zasobu ze sterownikami, a drukarki bywają dodawane pilnie przez osobę stojącą przy urządzeniu
    en:
      - The organisation has no driver resource of its own and printers are sometimes added urgently by whoever is standing at the device
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'DisableWebPnPDownload'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'DisableWebPnPDownload'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A printer driver is code installed with high privileges, and on a print
    # server it is then handed out to the workstations. After this, adding a
    # printer with no local driver fails with a message that does not name
    # policy - make sure an internal driver resource exists first.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWebPnPDownload' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/print-management-group-policy

notes:
  pl: |
    Sterownik drukarki to nie plik opisujący urządzenie, tylko kod
    instalowany w systemie i pracujący z wysokimi uprawnieniami. Na serwerze
    wydruku bywa następnie rozsyłany do stanowisk.

    Bez blokady droga instalowania kodu na serwerze prowadzi przez czynność,
    która nie wygląda na instalowanie kodu — przez dodanie drukarki, zwykle
    w pośpiechu.

    Zastrzeżenie: komunikat o błędzie nie wskazuje polityki jako przyczyny,
    więc administrator widzi problem ze sprzętem tam, gdzie jest decyzja
    konfiguracyjna. Bez wewnętrznego zasobu ze sterownikami reguła przenosi
    problem, zamiast go rozwiązywać.
  en: |
    A printer driver is not a file describing a device but code installed in
    the system and running with high privileges. On a print server it is then
    handed out to the workstations.

    Without the block, the route by which code gets installed on the server
    runs through an action that does not look like installing code - through
    adding a printer, usually in a hurry.

    A caveat: the error message does not name policy as the cause, so an
    administrator sees a hardware problem where there is a configuration
    decision. Without an internal driver resource, the rule moves the problem
    rather than solving it.
