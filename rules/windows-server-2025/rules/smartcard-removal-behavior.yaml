id: win2025-smartcard-removal-behavior

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyjęcie karty inteligentnej kończy albo blokuje sesję
    en: Taking out a smart card locks or ends the session
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, co dzieje się z sesją, gdy karta inteligentna
    użyta do zalogowania zostanie wyjęta z czytnika: sesja ma zostać
    zablokowana albo zakończona, zamiast trwać dalej.

    Sens tego punktu bierze się z obietnicy, jaką składa karta.
    Wprowadza się ją po to, żeby dostęp zależał od przedmiotu, który
    człowiek nosi przy sobie — karta przy nim, dostęp jest; karta
    wyjęta, dostępu nie ma. Bez tego ustawienia druga połowa tej
    obietnicy nie jest dotrzymana: karta wraca do kieszeni, a sesja
    zostaje otwarta na ekranie.

    Jest to zatem punkt domykający mechanizm już wdrożony, a nie
    wprowadzający nowy. Kto poniósł koszt kart i czytników, a tego nie
    ustawił, kupił połowę tego, za co zapłacił.

    Na serwerze rzecz dotyczy administratorów, bo to oni logują się
    kartą do maszyn o szerokich uprawnieniach. Sesja administratora
    domeny pozostawiona otwarta po wyjęciu karty jest dokładnie tą
    sesją, której przejęcie jest najwięcej warte.

    Wyjęcie karty jest przy tym sygnałem lepszym niż upływ czasu:
    następuje w chwili, w której człowiek odchodzi, a nie kilkanaście
    minut później. Oba mechanizmy warto mieć jednocześnie, bo odpowiadają
    na różne sytuacje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    administracyjną trwającą po odejściu jej właściciela wraz z kartą,
    czyli dokładnie to, przed czym karta miała bronić.
  en: |
    The setting settles what becomes of a session when the smart card used to sign in is taken
    out of the reader: the session is to be locked or ended, rather than lasting on.

    The sense of this item comes from the promise the card makes. It is brought in so that access
    should hang on a thing the person carries about them - the card with them, access is there;
    the card taken out, access is gone. Without this setting the second half of that promise is
    not kept: the card goes back into a pocket while the session stays open on the screen.

    It is thus an item that closes a mechanism already rolled out rather than bringing in a new
    one. Whoever bore the cost of cards and readers and never set this bought half of what they
    paid for.

    On a server the matter bears on administrators, they being the ones who sign in by card to
    machines of wide rights. A domain administrator's session left open after the card is taken
    out is exactly the session whose taking is worth the most.

    The taking out of a card is withal a better signal than the passing of time: it comes at the
    moment the person leaves rather than a dozen minutes later. Both mechanisms are worth having
    at once, answering as they do to different situations.

    What an attacker gains while the item goes unmet: an administrative session lasting on after
    its owner left along with the card - exactly what the card was to guard against.

disruption_description:
  pl: |
    Nikt tego nie zauważy poza osobami, które logują się kartą — a te
    właśnie tego po karcie oczekują.

    Naprawa ustawia łagodniejszy z dwóch wariantów: sesja zostaje
    zablokowana, a nie zakończona. Jest to różnica istotna i dlatego
    wybrałem ją świadomie. Sesja zablokowana czeka: uruchomione programy
    pracują dalej, otwarte dokumenty zostają, a powrót do niej wymaga
    jedynie włożenia karty. Sesja zakończona zamyka wszystko, co było
    otwarte, i nie ma po niej powrotu.

    Wariant kończący sesję jest zgodny z punktem i bywa uzasadniony,
    ale nie należy do klasy bez uciążliwości — praca utracona przy
    przypadkowym wyjęciu karty jest kosztem realnym. Kto go chce, niech
    ustawi go świadomie; naprawa tego nie robi za niego.

    Zmiana nie dotyczy sesji założonych hasłem. Konto zalogowane bez
    karty nie zauważy różnicy, bo nie ma karty, której wyjęcie miałoby
    cokolwiek wywołać. Na serwerze, na którym kart nikt nie używa,
    ustawienie jest zapasem na przyszłość i nic nie zmienia dziś.

    Zmiana nie dotyczy także procesów pracujących w tle. Usługa, zadanie
    harmonogramu i kopiowanie plików nie są sesją interaktywną i trwają
    dalej niezależnie od stanu czytnika.

    Sprawdzić warto jedną rzecz, choć nie zmienia ona klasy: czy czytnik
    kart nie zgłasza wyjęcia karty przy zaśnięciu albo przy przełączeniu
    sesji. Zdarza się to przy czytnikach starszych i objawia się
    blokowaniem sesji bez wyraźnej przyczyny.

    Zmiana nie wymaga przerwy i wchodzi w życie przy następnym
    logowaniu.
  en: |
    Nobody will mark it beyond the people who sign in by card - and those expect just this of a
    card.

    The mending sets the milder of the two variants: the session is locked, not ended. That is a
    weighty difference and hence I chose it knowingly. A locked session waits: the programs
    started run on, the documents opened stay, and a return to it takes only the putting in of
    the card. An ended session closes all that was open and there is no return after it.

    The variant that ends the session meets the item and is at times warranted, but it does not
    belong in the class without disruption - work lost at an accidental taking out of a card is a
    real cost. Whoever wants it should set it knowingly; the mending does not do it for them.

    The change does not bear on sessions opened by password. An account signed in without a card
    will mark no difference, there being no card whose taking out should call anything forth. On
    a server where nobody uses cards the setting is a store against the future and changes
    nothing today.

    Neither does the change bear on processes working in the background. A service, the
    scheduler's job and a copying of files are no interactive session and last on whatever the
    reader's state.

    One thing is worth checking, though it changes no class: whether the card reader reports a
    taking out of the card at a falling asleep or at a switching of sessions. That happens with
    older readers and shows itself as a locking of the session for no plain cause.

    The change takes no break and comes into force at the next signing in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Sesja osoby logującej się kartą zostanie zablokowana w chwili wyjęcia karty z czytnika
      - Sesje założone hasłem, bez karty, nie zauważą żadnej różnicy
      - Usługi, zadania harmonogramu i kopiowanie plików trwają dalej niezależnie od stanu czytnika
      - Czytnik starszego typu może zgłaszać wyjęcie karty przy zaśnięciu i blokować sesję bez przyczyny
    en:
      - The session of a person signing in by card will be locked the moment the card leaves the reader
      - Sessions opened by password, without a card, will mark no difference at all
      - Services, the scheduler's jobs and a copying of files last on whatever the reader's state
      - An older reader may report a taking out of the card at a falling asleep and lock the session for no cause
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Czytniki kart zgłaszają wyjęcie karty przy zaśnięciu maszyny albo przy przełączeniu sesji
    en:
      - The card readers report a taking out of the card at the machine's falling asleep or at a switching of sessions
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Any answer but 'take no action' meets the item: locking, ending the
      # session and parting from it all shut the session after the card goes.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'ScRemoveOption'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[123]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'ScRemoveOption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is text, not a number, despite looking like one - writing it
    # as a number leaves an entry the system quietly ignores.
    # One stands for locking the session, the milder of the answers: the
    # started programs run on and a return takes only the card put back.
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' `
      -Name 'ScRemoveOption' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-smart-card-removal-behavior

notes:
  pl: |
    Wartość zapisywana jest tekstem, mimo że wygląda na liczbę. Zapisana
    jako liczba zostawia wpis, który system po cichu pomija — sprawdzenie
    pokaże wtedy stan pozornie zgodny, a zachowanie się nie zmieni.

    Naprawa ustawia wariant blokujący sesję, nie kończący ją. Wariant
    kończący jest zgodny z punktem, ale nie należy do klasy bez
    uciążliwości i trzeba go ustawić świadomie.

    Punkt domyka mechanizm już wdrożony. Na serwerze, na którym nikt nie
    loguje się kartą, jest zapasem na przyszłość i nie zmienia nic
    dzisiaj.
  en: |
    The value is written as text although it looks like a number. Written as a number it leaves
    an entry the system quietly passes by - the check will then show a seemingly compliant state
    while the behaviour does not change.

    The mending sets the variant that locks the session, not the one that ends it. The ending
    variant meets the item but does not belong in the class without disruption and must be set
    knowingly.

    The item closes a mechanism already rolled out. On a server where nobody signs in by card it
    is a store against the future and changes nothing today.
