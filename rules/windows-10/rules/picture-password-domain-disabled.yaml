id: win10-picture-password-domain-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie obrazem dla kont domenowych wyłączone
    en: Picture sign-in for domain accounts switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Logowanie obrazem zastępuje hasło serią gestów wykonanych na zdjęciu. Liczba
    możliwych kombinacji jest znacznie mniejsza niż przy haśle, a same gesty
    układa się w miejscach, na które patrzy się odruchowo — na twarzach, w rogach,
    wzdłuż widocznych krawędzi.

    Osobnym problemem jest ślad. Gest zostawia na ekranie dotykowym smugę, którą
    widać pod kątem i przy dobrym świetle. Hasło wpisane z klawiatury takiego
    śladu nie zostawia.

    Wyłączenie tego sposobu dla kont domenowych sprawia, że siła uwierzytelnienia
    do zasobów organizacji nie zależy od gestu narysowanego na zdjęciu.
  en: |
    Picture sign-in replaces the password with a series of gestures made on a
    photograph. The number of possible combinations is far smaller than with a
    password, and the gestures themselves get laid out in the places one looks at
    by reflex - on faces, in corners, along visible edges.

    The trace is a separate problem. A gesture leaves a smear on a touch screen,
    visible at an angle and in good light. A password typed on a keyboard leaves
    no such trace.

    Switching this method off for domain accounts means the strength of
    authentication to the organisation s resources does not rest on a gesture
    drawn over a photograph.

disruption_description:
  pl: |
    Zmiana dotyka tylko tych stanowisk, na których ktoś ten sposób logowania
    włączył — a jest to głównie sprzęt dotykowy. Na maszynach z klawiaturą
    mechanizm zwykle leży nieużywany i wyłączenie go nie kosztuje nic.

    Tam, gdzie jest w użyciu, skutkiem jest powrót do wpisywania hasła na
    klawiaturze ekranowej. Warto to sprawdzić przed wdrożeniem, bo na tablecie
    bywa to realna różnica w wygodzie pracy, a nie drobiazg.
  en: |
    The change touches only those stations where somebody switched this sign-in
    method on - and that is mainly touch hardware. On machines with a keyboard the
    mechanism usually lies unused and switching it off costs nothing.

    Where it is in use, the consequence is a return to typing a password on an
    on-screen keyboard. That is worth checking before the rollout, because on a
    tablet it is a real difference in the comfort of work rather than a detail.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Logowanie obrazem do kont domenowych przestanie być możliwe, a ustawione wcześniej gesty stracą ważność
      - Tablety i stanowiska dotykowe wrócą do wpisywania hasła na klawiaturze ekranowej
      - Użytkownicy, którzy nie wpisywali hasła od dawna, mogą go nie pamiętać i zgłosić utratę dostępu
      - Konta lokalne, logowanie kartą, krótki kod i praca po zalogowaniu pozostają bez zmian
    en:
      - Picture sign-in to domain accounts stops being possible, and gestures set earlier lose their validity
      - Tablets and touch stations return to typing a password on an on-screen keyboard
      - Users who have not typed their password for a long time may not remember it and report a loss of access
      - Local accounts, signing in with a card, the short code and work after signing in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Tablety i stanowiska dotykowe, na których logowanie obrazem jest jedynym wdrożonym sposobem
      - Środowiska bez klawiatury ekranowej wygodnej na tyle, by wpisać na niej długie hasło
    en:
      - Tablets and touch stations, where picture sign-in is the only method deployed
      - Environments with no on-screen keyboard comfortable enough to type a long password on
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BlockDomainPicturePassword'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'BlockDomainPicturePassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockDomainPicturePassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/

notes:
  pl: |
    Punkt dotyczy wyłącznie kont domenowych. Konta lokalne mogą nadal korzystać z
    tego sposobu i rozstrzyga o tym osobne ustawienie. Zasadę ocenia się razem z
    pozostałymi punktami tego bloku, bo wszystkie mówią o tym, czym wolno zastąpić
    hasło.
  en: |
    The item covers domain accounts alone. Local accounts may go on using this
    method, and a separate setting decides that. The rule is judged together with
    the other items of this block, since all of them are about what the password
    may be replaced with.
