id: win10-virtualization-based-security-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Zabezpieczenia oparte na wirtualizacji włączone
    en: Virtualization-based security enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Napastnik, który zdobył uprawnienia jądra systemu, przestaje podlegać
    zabezpieczeniom działającym wewnątrz tego systemu — bo sam jest już na tym
    samym poziomie co one. Przez lata było to końcem obrony: przejęcie jądra
    znaczyło przejęcie wszystkiego.

    Zabezpieczenia oparte na wirtualizacji przenoszą część mechanizmów obronnych
    poza system operacyjny, do osobnego środowiska utrzymywanego przez
    hipernadzorcę. Jądro traci do niego dostęp — i traci go również ten, kto
    jądro opanował. Poświadczenia, decyzje o tym, jaki kod wolno uruchomić, i
    klucze przestają leżeć w zasięgu opanowanego systemu.

    Ten punkt włącza sam mechanizm. Pozostałe punkty bloku ustawiają to, co ma
    w tym środowisku być chronione — bez tego pierwszego nie mają na czym stanąć.
  en: |
    An attacker who has gained kernel privileges stops being subject to the
    defences running inside that system - because they are already at the same
    level as those defences. For years that was where defence ended - taking the
    kernel meant taking everything.

    Virtualization-based security moves part of the defensive machinery outside
    the operating system, into a separate environment kept by the hypervisor. The
    kernel loses access to it - and so does whoever has taken the kernel.
    Credentials, decisions about what code may run, and keys stop lying within
    reach of the compromised system.

    This item switches the mechanism itself on. The remaining items of the block
    set what is to be protected inside that environment - without this first one
    they have nothing to stand on.

disruption_description:
  pl: |
    To jest najpoważniejsza zmiana w całym zestawie reguł dla tej platformy i
    wymaga świadomego wdrożenia w pełnym znaczeniu tego słowa. Nie chodzi o
    niewygodę użytkownika, tylko o to, że maszyna może nie wstać.

    Mechanizm wymaga sprzętu: wirtualizacji włączonej w oprogramowaniu układowym,
    odpowiedniego procesora i sterowników zgodnych z pracą pod hipernadzorcą.
    Sterownik niespełniający wymagań bywa blokowany przy starcie, a jeżeli jest to
    sterownik dysku albo karty sieciowej, stanowisko przestaje działać.

    Druga sprawa to wydajność i współpraca z innymi hipernadzorcami. Maszyny
    uruchamiające własne maszyny wirtualne tracą część możliwości albo działają
    wolniej. Kolejność jest zawsze ta sama: najpierw maszyny próbne, potem
    stanowiska zwykłe, na końcu te ze sprzętem specjalistycznym.
  en: |
    This is the gravest change in the whole rule set for this platform and calls
    for a planned rollout in the full sense of the phrase. The matter is not user
    inconvenience but that the machine may fail to start.

    The mechanism demands hardware - virtualization switched on in the firmware, a
    suitable processor and drivers able to work under a hypervisor. A driver that
    fails the requirements tends to be blocked at start-up, and where that is a
    disk or network card driver, the station stops working.

    The second matter is performance and coexistence with other hypervisors.
    Machines running virtual machines of their own lose some capabilities or run
    slower. The order is always the same - trial machines first, then ordinary
    stations, and those with specialist equipment last.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - boot-and-firmware
    - drivers-and-devices
  what_breaks:
    pl:
      - Maszyna bez włączonej wirtualizacji w oprogramowaniu układowym nie uruchomi mechanizmu i zmiana pozostanie bez skutku
      - Sterowniki niezgodne z pracą pod hipernadzorcą mogą zostać zablokowane przy starcie, a przy sterowniku dysku lub karty sieciowej maszyna nie wstanie
      - Oprogramowanie wirtualizacyjne innych producentów może przestać działać albo znacząco zwolnić
      - Wydajność spada zauważalnie na starszym sprzęcie, zwłaszcza przy obciążeniu wejścia i wyjścia
      - Wycofanie zmiany wymaga ponownego uruchomienia maszyny, więc powrót nie jest natychmiastowy
    en:
      - A machine without virtualization switched on in the firmware does not start the mechanism and the change has no effect
      - Drivers incompatible with running under a hypervisor may be blocked at start-up, and with a disk or network card driver the machine does not come up
      - Virtualization software from other vendors may stop working or slow down markedly
      - Performance drops noticeably on older hardware, especially under input and output load
      - Undoing the change calls for a restart, so the return is not immediate
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska ze sprzętem specjalistycznym, którego sterowniki nie zostały sprawdzone pod pracę z hipernadzorcą
      - Maszyny uruchamiające własne maszyny wirtualne w oprogramowaniu innego producenta
      - Starszy sprzęt bez wsparcia dla wirtualizacji albo z wydajnością na granicy potrzeb
    en:
      - Stations with specialist equipment whose drivers have not been checked for work with a hypervisor
      - Machines running virtual machines of their own in another vendor s software
      - Older hardware with no virtualization support or with performance already at the edge of what is needed
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableVirtualizationBasedSecurity'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    $name = 'EnableVirtualizationBasedSecurity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Wpis leży w gałęzi sterowania, a nie w gałęzi zasad — obie istnieją i łatwo
    je pomylić. Sam wpis nie dowodzi, że mechanizm rzeczywiście działa: o tym
    przesądza sprzęt i stan po ponownym uruchomieniu. Punkt jest podstawą dla
    pozostałych reguł tego bloku i ocenia się je razem.
  en: |
    The entry lies in the control branch rather than the policy one - both exist
    and are easily confused. The entry alone is no proof that the mechanism really
    runs - the hardware and the state after a restart settle that. The item is the
    foundation for the remaining rules of this block and they are judged together.
