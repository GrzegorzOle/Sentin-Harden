id: windows-11
nazwa: Windows 11
rodzina: windows
powloka: powershell
profil: workstation

benchmark:
  nazwa: CIS Microsoft Windows 11 Benchmark
  # Wersja dokumentu, na którym opieramy paczkę. Zmiana wersji oznacza przegląd
  # wszystkich reguł i ponowne rozpatrzenie zapisanych wyjątków.
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 1 = stacja robocza. Windows 11 to numer kompilacji od 22000 wzwyż.
  dopasowanie: '^Microsoft Windows 11 .*\|(2[2-9][0-9]{3}|[3-9][0-9]{4})\|1$'

uwagi: |
  Wydania Windows 11 różnią się między sobą (22H2, 23H2, 24H2) — klucze rejestru
  bywają nieobecne w starszych. Regułę oznaczaj jako NOT_APPLICABLE zamiast FAIL,
  gdy sprawdzany element nie istnieje w danym wydaniu.
