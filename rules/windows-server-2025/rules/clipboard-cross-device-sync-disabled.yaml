id: win2025-clipboard-cross-device-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > OS Policies
  title:
    pl: Przenoszenie schowka między urządzeniami wyłączone
    en: Carrying the clipboard between devices disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza przenoszenie zawartości schowka między urządzeniami.
    Jest to reguła siostrzana wobec historii schowka i obie mówią o tym
    samym kanale, ale odpowiadają na różne pytania. Tamta pyta, jak długo
    skopiowana rzecz zostaje. Ta pyta, jak daleko wyjeżdża.

    I to drugie pytanie jest na serwerze poważniejsze. Historia zostaje
    w granicach maszyny. Przenoszenie wynosi zawartość schowka poza
    maszynę — przez usługę zewnętrzną, do innych urządzeń zalogowanych na
    to samo konto. Hasło skopiowane przy konsoli serwera produkcyjnego
    może w ten sposób pojawić się na prywatnym telefonie, i nie jest to
    obraz przesadzony, tylko dokładny opis tego, do czego ta funkcja
    służy.

    Zostawiam kategorię wysoką. Powód jest ten sam, co przy historii
    schowka — schowek na serwerze jest kanałem poświadczeń — ale skutek
    jest gorszy, bo wykracza poza maszynę, poza sieć i poza kontrolę
    organizacji. Dane, które wyszły, nie dają się cofnąć.

    Podam też uczciwie warunek, bez którego to nie zadziała: funkcja
    wymaga zalogowanego konta w usłudze producenta. Na większości serwerów
    takiego konta nie ma i wtedy punkt zabezpiecza możliwość, a nie stan.
    Rzecz w tym, że administrator logujący się na serwerze kontem
    służbowym powiązanym z usługą ten warunek spełnia — i zwykle o tym nie
    wie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    poświadczeń kopiowanych na serwerze przez dowolne inne urządzenie
    zalogowane na to samo konto, bez dotykania samego serwera.
  en: |
    The item switches off the bearing of what is in the clipboard between gear. It is a sister rule
    to the story of the clipboard, and both speak of the same channel, yet they answer sundry
    questions. That one asks how long a copied thing stays. This one asks how far it rides.

    And that second question is upon a server the weightier. The story stays within the machine's
    bounds. The bearing carries what is in the clipboard beyond the machine - through an outward
    service, onto other gear signed in upon the same account. A password copied at the board of a
    server of production may in this wise come forth upon a telephone of somebody's own, and that is
    no overdrawn picture but the close setting forth of what that feature is for.

    I leave the category high. The ground is the same as at the story of the clipboard - the
    clipboard upon a server is a channel of tokens of leave - but the outcome is worse, going as it
    does beyond the machine, beyond the net and beyond the ordering's hand. What has gone out cannot
    be called back.

    I shall give honestly also the bond without which this works not - the feature takes a signed-in
    account in the maker's service. Upon most servers there is no such account, and then the item
    guards a may-be and not a state. The thing is that an administrator signing in upon the server by
    an account of work bound to that service meets that bond - and mostly knows it not.

    What an attacker gains while the item goes unmet - a reach to the tokens of leave copied upon the
    server, by any other gear signed in upon the same account, without a touching of the server
    itself.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i odwracam ocenę widoczności
    wobec stacji roboczej, z tego samego powodu, dla którego zrobiłem to
    przy historii schowka.

    Na serwerze nie ma pracy ciągłej, której ta funkcja miałaby służyć.
    Nikt nie kopiuje tu rzeczy po to, żeby wkleić je na własnym telefonie.
    Jeżeli ktoś tak robi, to znaczy, że obchodzi brak innej drogi
    przenoszenia danych z serwera — i wtedy rozwiązaniem jest ta droga,
    a nie zostawienie schowka otwartego na świat.

    Zmiana nie dotyka kopiowania i wklejania na samej maszynie. Nie dotyka
    też przekierowania schowka w sesji zdalnej, które jest osobnym
    mechanizmem i osobną decyzją — to warto rozróżnić, bo są mylone.
    Sesja zdalna przenosi schowek między dwiema maszynami, które obie
    należą do organizacji. Ta funkcja przenosi go do usługi zewnętrznej.

    Nie znam serwerowego zastosowania, w którym przenoszenie schowka poza
    maszynę jest czynnością potrzebną.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption" and turn about the reckoning of being seen against the
    workstation, of the same ground whereof I did so at the story of the clipboard.

    On a server there is no unbroken work this feature might serve. Nobody copies here a thing that
    they may paste it upon a telephone of their own. If somebody does so, it means they go round the
    want of another road for the bearing of data off the server - and then the mending is that road
    and not the leaving of the clipboard open onto the world.

    The change touches not the copying and the pasting upon the machine itself. Nor does it touch the
    turning of the clipboard in a far-off sitting, which is a working of its own and a deciding of
    its own - that is worth telling apart, the two being mistaken one for another. A far-off sitting
    bears the clipboard between two machines that both belong to the ordering. This feature bears it
    into an outward service.

    I know of no use on a server wherein the bearing of the clipboard beyond the machine is a needed
    doing.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zawartość schowka przestaje pojawiać się na innych urządzeniach zalogowanych na to samo konto
      - Zmiana nie dotyka kopiowania i wklejania na samej maszynie
      - Nie dotyka przekierowania schowka w sesji zdalnej, które jest osobnym mechanizmem i osobną decyzją
      - Funkcja wymaga zalogowanego konta w usłudze producenta, więc na wielu serwerach zabezpiecza możliwość, a nie stan
      - Brak serwerowego zastosowania, w którym przenoszenie schowka poza maszynę jest potrzebne
    en:
      - What is in the clipboard stops coming forth upon other gear signed in upon the same account
      - The change touches not the copying and the pasting upon the machine itself
      - It touches not the turning of the clipboard in a far-off sitting, which is a working of its own and a deciding of its own
      - The feature takes a signed-in account in the maker's service, so upon many servers it guards a may-be and not a state
      - No use on a server wherein the bearing of the clipboard beyond the machine is needed
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowCrossDeviceClipboard'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $current = (Get-ItemProperty -Path $path -Name 'AllowCrossDeviceClipboard' -ErrorAction SilentlyContinue).'AllowCrossDeviceClipboard'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowCrossDeviceClipboard'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Not the same thing as clipboard redirection in a remote session: that
    # moves the clipboard between two machines of the organisation, this moves
    # it into an outside service.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCrossDeviceClipboard' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła siostrzana wobec historii schowka: tamta pyta, jak długo
    skopiowana rzecz zostaje, ta — jak daleko wyjeżdża. Historia zostaje
    w granicach maszyny, przenoszenie wynosi zawartość poza maszynę, poza
    sieć i poza kontrolę organizacji. Dane, które wyszły, nie dają się
    cofnąć.

    Warunek podany uczciwie: funkcja wymaga zalogowanego konta w usłudze
    producenta, więc na wielu serwerach zabezpiecza możliwość, a nie
    stan. Administrator logujący się kontem służbowym powiązanym z tą
    usługą ten warunek spełnia i zwykle o tym nie wie.

    Rozróżnienie warte zapamiętania: przekierowanie schowka w sesji
    zdalnej to osobny mechanizm i osobna decyzja.
  en: |
    A sister rule to the story of the clipboard - that one asks how long a copied thing stays, this
    one how far it rides. The story stays within the machine's bounds; the bearing carries what is in
    it beyond the machine, beyond the net and beyond the ordering's hand. What has gone out cannot be
    called back.

    The bond given honestly - the feature takes a signed-in account in the maker's service, so upon
    many servers it guards a may-be and not a state. An administrator signing in by an account of
    work bound to that service meets that bond and mostly knows it not.

    A telling apart worth bearing in mind - the turning of the clipboard in a far-off sitting is a
    working of its own and a deciding of its own.
