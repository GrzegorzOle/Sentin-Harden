id: win2016-winrm-service-unencrypted-traffic-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service
  title:
    pl: Nieszyfrowany ruch usługi zarządzania zdalnego zabroniony
    en: Unencrypted traffic to the remote management service refused
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zarządzania zdalnego przyjmować połączenia,
    w których treść sesji nie jest szyfrowana.

    Treścią sesji zarządzania zdalnego są polecenia i ich wyniki. Nie jest
    to ruch zwykły: idą tędy nazwy kont, zawartość plików konfiguracyjnych,
    wyniki zapytań o stan systemu, a przy pracy administracyjnej również
    hasła podawane poleceniom.

    Podsłuchujący ruch nieszyfrowany dostaje więc nie tylko wiedzę o tym,
    co się dzieje na maszynie, ale często same poświadczenia — i dostaje je
    bez łamania czegokolwiek.

    Gorsza jest druga możliwość. Ruch nieszyfrowany daje się nie tylko
    czytać, ale i zmieniać po drodze. Polecenie zmienione w locie wykonuje
    się z uprawnieniami tego, kto je wysłał, a wynik zmieniony w locie
    wraca do administratora jako prawda o stanie maszyny.

    Warto powiedzieć, czego punkt nie dotyczy. Uwierzytelnianie mechanizmem
    domenowym szyfruje treść samo z siebie, więc w środowisku domenowym
    połączenia i tak są zaszyfrowane. Punkt zamyka przypadki pozostałe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    i zmianę poleceń administracyjnych w locie, bez łamania uwierzytelnienia.
  en: |
    The setting forbids the remote management service to accept connections in which
    the session's contents are not encrypted.

    The contents of a remote management session are commands and their results. That
    is no ordinary traffic: account names go this way, the contents of configuration
    files, the results of queries about the system's state, and in administrative
    work also passwords given to commands.

    Whoever listens in on unencrypted traffic therefore gets not only knowledge of
    what is happening on the machine but often the credentials themselves - and gets
    them without breaking anything.

    The second possibility is worse. Unencrypted traffic can not only be read but
    changed along the way. A command changed in flight runs with the rights of
    whoever sent it, and a result changed in flight comes back to the administrator
    as the truth about the machine's state.

    Worth saying what the item does not touch. Authentication by the domain
    mechanism encrypts the contents of itself, so in domain surroundings the
    connections are encrypted anyway. The item shuts the remaining cases.

    What an attacker gains while the item goes unmet: the reading and the changing
    of administrative commands in flight, with no authentication broken.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy coś łączy się z tą
    maszyną sposobem, który sam szyfrowania nie zapewnia.

    W środowisku domenowym wdrożenie zwykle nie zmienia nic, bo
    uwierzytelnianie domenowe szyfruje treść z własnej natury. Połączenia
    takie spełniają warunek, zanim ktokolwiek go postawi.

    Sprawdzić trzeba przypadki pozostałe: połączenia z maszyn spoza domeny,
    narzędzia łączące się przez port nieszyfrowany, biblioteki napisane
    z myślą o prostocie. Te zostaną odrzucone.

    Objaw jest wyraźny — połączenie nie dochodzi do skutku, a komunikat
    mówi o wymaganiu szyfrowania. Jest to jeden z nielicznych przypadków,
    w których komunikat prowadzi wprost do przyczyny.

    Rzecz warta odnotowania: nasłuch na porcie nieszyfrowanym pozostaje.
    Punkt nie zamyka portu i nie zmienia konfiguracji nasłuchów — odrzuca
    sesje, w których treść nie byłaby szyfrowana. Zamknięcie portu jest
    osobną decyzją.

    Czego to nie psuje: połączeń domenowych, połączeń przez nasłuch
    szyfrowany, pulpitu zdalnego, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anything
    connects to this machine in a way that does not itself provide encryption.

    In domain surroundings the rollout as a rule changes nothing, domain
    authentication encrypting the contents by its own nature. Such connections meet
    the condition before anybody sets it.

    What has to be checked are the remaining cases: connections from machines
    outside the domain, tools connecting over the unencrypted port, libraries
    written with simplicity in mind. Those will be refused.

    The symptom is plain - the connection does not come about and the message speaks
    of encryption being required. It is one of the few cases where the message leads
    straight to the cause.

    Worth noting: listening on the unencrypted port remains. The item does not shut
    the port and does not change the configuration of listeners - it refuses
    sessions whose contents would not be encrypted. Shutting the port is a separate
    decision.

    What this does not break: domain connections, connections over an encrypted
    listener, the remote desktop, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - encryption-and-tls
    - network-and-firewall
  what_breaks:
    pl:
      - Połączenia z maszyn spoza domeny, w których nic nie zapewnia szyfrowania treści, zostają odrzucone
      - Narzędzia i biblioteki łączące się przez port nieszyfrowany przestają działać, a komunikat mówi o wymaganiu szyfrowania
      - Nasłuch na porcie nieszyfrowanym pozostaje otwarty, bo punkt odrzuca sesje, a nie zamyka portu
      - Połączenia domenowe, połączenia przez nasłuch szyfrowany i pulpit zdalny pozostają bez zmian
    en:
      - Connections from machines outside the domain, where nothing provides encryption of the contents, are refused
      - Tools and libraries connecting over the unencrypted port stop working, and the message speaks of encryption being required
      - Listening on the unencrypted port stays open, the item refusing sessions rather than shutting the port
      - Domain connections, connections over an encrypted listener and the remote desktop stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyną zarządza się z hostów spoza domeny przez nasłuch nieszyfrowany i nie przygotowano nasłuchu szyfrowanego
      - Narzędzie monitorujące łączy się z tą maszyną wyłącznie bez szyfrowania treści
    en:
      - The machine is managed from hosts outside the domain over an unencrypted listener and no encrypted listener has been prepared
      - A monitoring tool connects to this machine only without encryption of the contents
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'AllowUnencryptedTraffic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowUnencryptedTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowUnencryptedTraffic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Punkt tworzy z regułą o uwierzytelnianiu podstawowym parę, która
    zamyka dwie strony tego samego problemu. Tamta pilnuje, żeby hasło nie
    docierało w postaci jawnej. Ta pilnuje, żeby reszta sesji nie szła
    otwartym tekstem. Wdrożone osobno zostawiają lukę po drugiej stronie.

    Rozróżnienie warte postawienia w interfejsie: punkt nie zamyka portu
    nieszyfrowanego. Nasłuch pozostaje, a odrzucane są sesje. Zgodność
    w tym punkcie bywa czytana jako zamknięcie drogi i nie jest tym.

    Warto też zauważyć, że w środowisku domenowym punkt najczęściej nie
    zmienia nic, co czyni go wtedy tanim. Kosztowny staje się dopiero tam,
    gdzie ktoś zarządza maszyną spoza domeny — a wtedy właściwą odpowiedzią
    jest przygotowanie nasłuchu szyfrowanego, nie odpuszczenie punktu.
  en: |
    The item makes with the rule about basic authentication a pair shutting two
    sides of the same trouble. That one sees to it that the password does not arrive
    in the clear. This one sees to it that the rest of the session does not go in
    plain text. Rolled out apart they leave a gap on the other side.

    A distinction worth putting in the interface: the item does not shut the
    unencrypted port. The listener remains and the sessions are refused. Compliance
    at this item is at times read as the shutting of a road, and it is not that.

    Worth noticing too that in domain surroundings the item most often changes
    nothing, which makes it cheap there. It grows dear only where somebody manages
    the machine from outside the domain - and then the proper answer is to prepare
    an encrypted listener rather than to let the item go.
