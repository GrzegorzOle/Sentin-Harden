id: win2025-steps-recorder-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Rejestrator czynności użytkownika wyłączony
    en: The recorder of user actions switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wbudowane narzędzie rejestrujące czynności wykonywane na
    maszynie. Narzędzie to zapisuje kolejne kliknięcia wraz ze zrzutami
    ekranu i składa z nich jeden plik do przekazania wsparciu.

    Kategoria średnia i chcę uzasadnić ją przez to, co taki plik zawiera na
    serwerze, bo to jest tutaj całe uzasadnienie. Zrzut ekranu z sesji
    administracyjnej to nie jest obrazek. To są otwarte okna konsoli
    z pełnymi poleceniami, nazwy kont, ścieżki do zasobów, fragmenty
    konfiguracji, czasem wprowadzane hasło widoczne w polu, które akurat
    nie maskuje znaków.

    Narzędzie to nie jest złe i nie o to chodzi. Chodzi o to, że powstaje
    plik, którego nikt nie klasyfikuje, i że jego zwykłą drogą jest
    przekazanie dalej — do wsparcia, do współpracownika, w załączniku
    wiadomości. Materiał przygotowany po to, żeby ktoś go obejrzał,
    z definicji opuszcza maszynę.

    Na stacji roboczej jest to głównie sprawa prywatności. Na serwerze to
    kompletny zapis pracy administratora, z wyglądem konsoli włącznie,
    krążący poza wszystkimi mechanizmami, którymi organizacja pilnuje
    swoich danych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość,
    że gdzieś w poczcie albo w zgłoszeniu leży komplet zrzutów z sesji
    administracyjnej tego serwera.
  en: |
    The item switches off the built-in tool that records actions carried out
    on the machine. It writes down each click together with screenshots and
    assembles them into a single file to be passed to support.

    The category is medium, and I want to justify it through what such a
    file holds on a server, because that is the whole justification here. A
    screenshot from an administrative session is not a picture. It is open
    console windows with full commands, account names, paths to resources,
    fragments of configuration, sometimes a password being typed and visible
    in a field that happens not to mask the characters.

    The tool is not bad, and that is not the point. The point is that a file
    comes into being which nobody classifies, and that its ordinary road is
    to be passed on - to support, to a colleague, as an attachment to a
    message. Material prepared so that somebody may look at it leaves the
    machine by definition.

    On a workstation this is mainly a matter of privacy. On a server it is a
    complete record of an administrator's work, the look of the console
    included, circulating outside every mechanism by which the organisation
    guards its data.

    What an attacker gains while the item goes unmet: the possibility that
    somewhere in a mailbox or a ticket lies a full set of screenshots from
    an administrative session on this server.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę nazwać, komu ta zmiana
    faktycznie przeszkodzi, bo nie jest tak, że nikomu.

    Przeszkodzi stanowisku wsparcia, dla którego prośba „proszę nagrać, co
    pan robi" jest najkrótszą drogą do zrozumienia problemu zgłoszonego
    przez kogoś, kto nie potrafi go opisać. Na serwerze terminali, gdzie
    ludzie pracują przez pulpit zdalny, jest to narzędzie używane naprawdę
    i odebranie go zmienia sposób obsługi zgłoszeń.

    Poza takim przypadkiem na serwerze produkcyjnym nikt z tego nie
    korzysta i zmiana nie będzie widoczna. Skutek jest jednak dostrzegalny
    dla człowieka — narzędzie przestaje się uruchamiać — więc nie nazywam
    jej niewidoczną i dlatego nie schodzę do klasy niegroźnej.

    Rzecz do sprawdzenia przed zmianą jest jedna: czy procedura obsługi
    zgłoszeń w tej organizacji wymienia to narzędzie z nazwy. Jeżeli tak,
    trzeba wskazać, czym je zastąpić, zanim zniknie. Opis słowny
    i dzienniki wystarczają w większości przypadków, ale to ma być decyzja,
    nie zaskoczenie.

    Czego to nie psuje: zgłaszania błędów, dzienników zdarzeń, żadnej
    ścieżki audytu ani pracy jakiejkolwiek usługi. Zmiana nie wymaga
    przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to name who this change will
    actually hinder, because it is not nobody.

    It will hinder a support desk for whom the request "please record what
    you are doing" is the shortest road to understanding a problem reported
    by somebody who cannot describe it. On a terminal server, where people
    work over remote desktop, this is a tool genuinely in use, and taking it
    away changes how tickets are handled.

    Outside such a case nobody on a production server uses it and the change
    will not be noticed. The effect is nevertheless perceptible to a person
    - the tool stops starting - so I do not call it invisible, and that is
    why I do not drop to the harmless class.

    There is one thing to check before the change: whether the ticket
    procedure in this organisation names this tool. If it does, what
    replaces it has to be pointed out before it disappears. A written
    description and the logs suffice in most cases, but that should be a
    decision rather than a surprise.

    What this does not break: error reporting, event logs, any audit trail,
    or the working of any service. The change needs no outage and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Narzędzie przestaje się uruchamiać, więc prośba o nagranie czynności przestaje być drogą obsługi zgłoszenia
      - Na serwerze terminali, gdzie ludzie pracują przez pulpit zdalny, zmienia to sposób obsługi zgłoszeń
      - Poza takim przypadkiem na serwerze produkcyjnym nikt z tego nie korzysta
      - Nie zmienia się zgłaszanie błędów, dzienniki zdarzeń ani żadna ścieżka audytu
    en:
      - The tool stops starting, so asking somebody to record their actions is no longer a way of handling a ticket
      - On a terminal server, where people work over remote desktop, this changes how tickets are handled
      - Outside such a case nobody on a production server uses it
      - Error reporting, event logs and every audit trail stay as they are
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Procedura obsługi zgłoszeń w tej organizacji wymienia to narzędzie z nazwy i nie wskazano, czym je zastąpić
      - Maszyna jest serwerem terminali, na którym wsparcie prowadzi ludzi przez zgłoszenia tą drogą
    en:
      - The ticket procedure in this organisation names this tool and no replacement has been pointed out
      - The machine is a terminal server where support handles people's tickets this way
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'DisableUAR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'DisableUAR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A screenshot from an administrative session is not a picture: open
    # consoles with full commands, account names, paths, configuration
    # fragments. Where the ticket procedure names this tool, point out the
    # replacement before it disappears.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableUAR' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/planning/compatibility-administrator-users-guide

notes:
  pl: |
    Całe uzasadnienie leży w tym, co taki plik zawiera na serwerze. Zrzut
    ekranu z sesji administracyjnej to nie obrazek: otwarte okna konsoli
    z pełnymi poleceniami, nazwy kont, ścieżki do zasobów, fragmenty
    konfiguracji, czasem hasło widoczne w polu, które nie maskuje znaków.

    Rzecz nie w tym, że narzędzie jest złe, tylko że powstaje plik,
    którego nikt nie klasyfikuje, a jego zwykłą drogą jest przekazanie
    dalej. Materiał przygotowany po to, żeby ktoś go obejrzał, z definicji
    opuszcza maszynę.

    Komu to przeszkodzi: stanowisku wsparcia, dla którego prośba „proszę
    nagrać, co pan robi" jest najkrótszą drogą do zrozumienia problemu.
    Na serwerze terminali to narzędzie używane naprawdę.
  en: |
    The whole justification lies in what such a file holds on a server. A
    screenshot from an administrative session is not a picture: open console
    windows with full commands, account names, paths to resources,
    configuration fragments, sometimes a password visible in a field that
    does not mask the characters.

    The point is not that the tool is bad but that a file comes into being
    which nobody classifies, and whose ordinary road is to be passed on.
    Material prepared so that somebody may look at it leaves the machine by
    definition.

    Who this will hinder: a support desk for whom "please record what you
    are doing" is the shortest road to understanding a problem. On a
    terminal server it is a tool genuinely in use.
