id: win2016-update-restart-not-deferred-by-logged-on-user

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Zalogowany użytkownik nie wstrzymuje restartu po aktualizacji
    en: A signed-in user does not hold back the restart after an update
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że obecność zalogowanego użytkownika nie wstrzymuje
    restartu wykonywanego po zainstalowaniu aktualizacji.

    Punkt zamyka cykl opisany w trzech poprzednich regułach i jest w nim
    ogniwem, które najczęściej pęka. Maszyna pobrała poprawkę, zainstalowała
    ją i czeka na restart, bo ktoś ma otwartą sesję. Poprawka
    zainstalowana, ale niedziałająca, bo wymaga restartu, jest poprawką
    nieistniejącą.

    Sesja wstrzymująca restart bywa sesją zapomnianą. Ktoś zalogował się
    przez pulpit zdalny, zamknął okno bez wylogowania i zostawił sesję
    otwartą na tygodnie. Maszyna czeka na jego odejście, a on już odszedł —
    tylko system o tym nie wie.

    Na serwerze jest to zjawisko powszechne i właśnie dlatego punkt tu
    waży. Na stanowisku sesja kończy się, gdy ktoś idzie do domu. Na
    serwerze sesje trwają.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę
    z poprawką zainstalowaną i nieaktywną, czekającą na restart, którego
    nikt nie wykona.
  en: |
    The setting has it that the presence of a signed-in user does not hold back the
    restart carried out once an update is installed.

    The item closes the cycle described in the three previous rules and is the link
    in it that breaks most often. The machine fetched the fix, installed it, and
    waits for the restart because somebody has an open session. A fix installed but
    not working, because it calls for a restart, is a fix that does not exist.

    A session holding the restart back is at times a forgotten session. Somebody
    signed in over the remote desktop, shut the window without signing out, and left
    the session open for weeks. The machine waits for them to leave, and they have
    left already - only the system does not know it.

    On a server this is a common thing, and just for that reason the item weighs
    here. At a workstation a session ends when somebody goes home. On a server
    sessions last.

    What an attacker gains while the item goes unmet: a machine with a fix installed
    and inactive, waiting for a restart nobody will carry out.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i nie ma tu wątpliwości, bo skutek
    jest odczuwalny wprost przez ludzi.

    Kto ma otwartą sesję w chwili restartu, traci ją. Ostrzeżenie się
    pojawia, ale na serwerze zwykle nie ma go kto zobaczyć, a ten, kto
    pracuje przez pulpit zdalny, zobaczy je tylko wtedy, gdy akurat patrzy
    na ekran. Niezapisana praca ginie.

    Skutek drugi jest poważniejszy i dotyczy sesji niebędących ludźmi.
    Zadanie długo trwające uruchomione w sesji użytkownika, otwarta sesja
    narzędzia migracyjnego, proces wsadowy uruchomiony ręcznie — wszystkie
    one zostają przerwane w połowie. Przerwanie w połowie bywa gorsze niż
    nieuruchomienie.

    Skutek trzeci dotyczy administratora prowadzącego akurat pracę na
    maszynie. Restart w trakcie zmiany konfiguracji potrafi zostawić stan
    częściowy, z którego wyjście zajmuje więcej czasu niż sama zmiana.

    Odpowiedzią na wszystkie trzy jest wyznaczone okno restartu, nie
    rezygnacja z punktu. Uwaga o tym siedzi w poleceniu naprawczym.

    Czego to nie psuje: usług, które wstają same po restarcie, sieci,
    konfiguracji, danych zapisanych.
  en: |
    The class is "needs a planned rollout", and there is no doubt here, the
    consequence being felt directly by people.

    Whoever has an open session at the moment of the restart loses it. A warning
    appears, but on a server as a rule there is nobody to see it, and whoever works
    over the remote desktop will see it only if they happen to be looking at the
    screen. Unsaved work is lost.

    The second consequence is graver and concerns sessions that are not people. A
    long-running task started in a user's session, an open session of a migration
    tool, a batch process started by hand - all of them are cut off halfway. Being
    cut off halfway is at times worse than never having started.

    The third consequence concerns an administrator at work on the machine just
    then. A restart in the middle of a change of configuration can leave a partial
    state, getting out of which takes longer than the change itself.

    The answer to all three is a restart window set, not the giving up of the item.
    The remark about that sits in the remedial command.

    What this does not break: services that rise by themselves after a restart, the
    network, the configuration, or saved data.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
    - remote-desktop
  what_breaks:
    pl:
      - Każdy z otwartą sesją traci ją w chwili restartu, a niezapisana praca ginie
      - Zadanie długo trwające uruchomione w sesji użytkownika zostaje przerwane w połowie, co bywa gorsze niż nieuruchomienie
      - Restart w trakcie zmiany konfiguracji potrafi zostawić stan częściowy, z którego wyjście zajmuje więcej czasu niż sama zmiana
      - Usługi wstające same po restarcie, sieć i dane zapisane pozostają bez zmian
    en:
      - Everybody with an open session loses it at the moment of the restart, and unsaved work is lost
      - A long-running task started in a user session is cut off halfway, which is at times worse than never having started
      - A restart in the middle of a change of configuration can leave a partial state, getting out of which takes longer than the change itself
      - Services rising by themselves after a restart, the network and saved data stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie uruchamia się długotrwałe zadania w sesjach użytkownika i nie ma sposobu na ich wznowienie po przerwaniu
      - Okna restartu nie wyznaczono, więc restart nastąpi w chwili nieprzewidzianej przez nikogo
      - Maszyna służy do pracy interaktywnej przez pulpit zdalny w godzinach, w których wypada okno instalacji
    en:
      - Long-running tasks are started in user sessions on the machine and there is no way of resuming them once cut off
      - No restart window has been set, so the restart will fall at a moment nobody foresaw
      - The machine serves interactive work over the remote desktop in the hours the installing window falls in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'NoAutoRebootWithLoggedOnUsers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'NoAutoRebootWithLoggedOnUsers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Anybody with an open session loses it at the restart, warning or none. Settle
    # the restart window before this is applied.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutoRebootWithLoggedOnUsers' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-restart

notes:
  pl: |
    Punkt jest ostatnim ogniwem cyklu i zarazem jedynym, który ktoś
    faktycznie zauważy. Warto pokazywać go razem z trzema poprzednimi,
    z wyraźnym zaznaczeniem, że wdrożenie tamtych bez tego daje maszynę
    z poprawkami zainstalowanymi i nieaktywnymi.

    Rozróżnienie warte postawienia w interfejsie: poprawka pobrana,
    poprawka zainstalowana i poprawka działająca to trzy różne stany.
    Raport mówiący o zainstalowanych mówi mniej, niż czytelnik przyjmie.

    Punkt zakłada, że okno restartu jest wyznaczone gdzie indziej, i sam go
    nie wyznacza. Reguła bez tego założenia jest przepisem na restart
    w chwili przypadkowej, więc aplikacja powinna o tym mówić przed
    wykonaniem, a nie po.

    Wartość zero czyta się tu odwrotnie do intuicji: zero oznacza „nie
    wstrzymuj", czyli stan wymagany. Warto to tłumaczyć w opisie, bo nazwa
    wpisu sugeruje coś przeciwnego.
  en: |
    The item is the cycle's last link and at the same time the only one anybody will
    actually notice. It is worth showing along with the three before it, with it
    plainly marked that rolling those out without this one gives a machine with
    fixes installed and inactive.

    A distinction worth putting in the interface: a fix fetched, a fix installed and
    a fix working are three different states. A report speaking of installed ones
    says less than the reader will take it to.

    The item assumes a restart window is set elsewhere, and does not set one itself.
    The rule without that assumption is a recipe for a restart at a chance moment,
    so the application should say so before execution rather than after.

    The value zero reads here contrary to intuition: zero means "do not hold back",
    which is to say the required state. That is worth explaining in the description,
    the entry's name suggesting the opposite.
