id: win2025-increase-quota-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana przydziału pamięci procesu ograniczona
    en: Changing a process memory quota restricted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala zmienić ilość pamięci, jaką wolno zająć wskazanemu
    procesowi — także procesowi cudzemu.

    Przydział pamięci jest jednym z niewielu ograniczeń, które system
    stawia procesom niezależnie od ich uprawnień. Proces z uprawnieniami
    administratora i proces zwykły podlegają temu samemu mechanizmowi
    i to on sprawia, że pojedynczy program nie jest w stanie zagłodzić
    reszty maszyny.

    Prawo omawiane tutaj pozwala mechanizm ten obejść w obie strony.
    Podniesienie przydziału własnemu procesowi znosi ograniczenie;
    obniżenie przydziału procesowi cudzemu potrafi go zatrzymać albo
    wprowadzić w stan, w którym zaczyna zawodzić w sposób nieprzewidziany
    przez jego autora.

    Na serwerze drugi kierunek jest tym istotniejszym i różni to ten
    punkt od paczki stanowiska roboczego. Obniżenie przydziału usłudze
    krytycznej — bazie danych, kontrolerowi domeny, usłudze
    uwierzytelniania — jest sposobem na jej zatrzymanie, który nie
    wygląda jak atak, bo usługa zgłasza wyłącznie brak pamięci.

    Punkt zawęża wykaz do administratorów i dwóch kont usług
    wbudowanych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zatrzymania wybranej usługi serwera bez sięgania po
    uprawnienia do niej, pod pozorem awarii pamięci.
  en: |
    The right allows the amount of memory a named process may take to be changed - including
    another's process.

    A memory quota is one of the few bounds the system sets on processes free of their rights.
    A process with administrative rights and an ordinary process fall under the same mechanism,
    and it is what keeps a single program from starving the rest of the machine.

    The right spoken of here allows that mechanism to be got round both ways. Raising one's own
    process's quota undoes the bound; lowering another's process's quota can halt it or bring
    it into a state where it starts failing in a way its author never foresaw.

    On a server the second direction is the weightier, and that sets this item apart from the
    working station's pack. Lowering a critical service's quota - a database's, a domain
    controller's, an authentication service's - is a way of halting it that does not look like
    an attack, since the service reports nothing but a want of memory.

    The item narrows the list to administrators and the two built-in service accounts.

    What an attacker gains while the item goes unmet: the means of halting a chosen server
    service without reaching for rights to it, under the guise of a memory failure.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym wykaz obejmuje dokładnie te konta, których
    wymaga punkt, więc na większości serwerów naprawa nie zmienia
    niczego.

    Przydziały pamięci pozostają takie, jakie są. Naprawa dotyczy tego,
    kto może je zmienić, a nie ich wartości bieżących.

    Administratorzy i konta usług wbudowanych zachowują prawo, więc
    dostrajanie pamięci przy wdrożeniu aplikacji i zmiany wprowadzane
    przez system działają dalej.

    Skutek dotyczy wyłącznie kont spoza wykazu, którym prawo nadano
    dodatkowo. Na serwerze bywają to konta narzędzi zarządzających
    zasobami i oprogramowania dzielącego moc maszyny między aplikacje.

    Objaw, gdyby wystąpił, jest natychmiastowy i czytelny: narzędzie
    zgłasza odmowę przy próbie zmiany przydziału. W odróżnieniu od
    większości punktów w tej grupie nie ma tu objawu cichego.
  en: |
    The change has no known side effects and takes no break.

    In the default state the list takes in exactly the accounts the item asks for, so on most
    servers the mending changes nothing.

    Memory quotas stay as they are. The mending bears on who may change them rather than on
    their present values.

    Administrators and the built-in service accounts keep the right, so the tuning of memory at
    an application's rollout and the changes the system makes go on working.

    The effect concerns only accounts outside the list that were granted the right besides. On
    a server those are at times the accounts of resource management tools and of software
    dividing the machine's power among applications.

    The symptom, should it arise, is immediate and plain: the tool reports a refusal at a try to
    change a quota. Unlike most items in this group there is no quiet symptom here.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzie zarządzające zasobami na koncie spoza wykazu zgłosi odmowę przy zmianie przydziału
      - Przydziały pamięci pozostają takie, jakie są, bo naprawa nie dotyka wartości bieżących
      - Administratorzy i konta usług wbudowanych zachowują prawo i działają bez zmiany
      - Objaw jest natychmiastowy i czytelny, bez wariantu cichego
    en:
      - A resource management tool under an account outside the list will report a refusal at a change of quota
      - Memory quotas stay as they are, since the mending does not touch the present values
      - Administrators and built-in service accounts keep the right and work unchanged
      - The symptom is immediate and plain, with no quiet variant
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie dzielące moc maszyny między aplikacje zmienia przydziały z konta spoza wykazu
    en:
      - Software dividing the machine's power among applications changes quotas from an account outside the list
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeIncreaseQuotaPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20,S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeIncreaseQuotaPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeIncreaseQuotaPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeIncreaseQuotaPrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeIncreaseQuotaPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/adjust-memory-quotas-for-a-process

notes:
  pl: |
    Nazwa prawa mówi o zwiększaniu, ale pozwala ono zmieniać przydział
    w obie strony. Na serwerze groźniejszy jest kierunek drugi:
    obniżenie przydziału usłudze krytycznej zatrzymuje ją bez
    sięgania po uprawnienia do niej.

    Naprawa nie zmienia przydziałów. Dotyczy wyłącznie tego, kto może
    je zmienić.

    Punkt czyta się razem z prawem do zmiany priorytetu. Oba pozwalają
    wpływać na warunki pracy procesów cudzych, choć na różnych osiach.
  en: |
    The right's name speaks of increasing, but it allows a quota to be changed both ways. On a
    server the second direction is the graver: lowering a critical service's quota halts it
    without reaching for rights to it.

    The mending does not change the quotas. It bears only on who may change them.

    The item is read together with the right of changing priority. Both allow the terms of
    others' processes' working to be bent, though along different axes.
