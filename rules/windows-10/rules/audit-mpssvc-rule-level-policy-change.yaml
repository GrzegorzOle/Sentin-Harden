id: win10-audit-mpssvc-rule-level-policy-change

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja zmian reguł zapory
    en: The audit of changes to the firewall rules
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zmiany w regułach zapory: dodanie reguły, jej
    usunięcie, zmianę profilu i wyłączenie zapory w całości.

    Zapora jest granicą, na której kończy się to, co z maszyny widać
    z sieci. Otwarcie w niej dziury jest czynnością konieczną, żeby
    z maszyny opanowanej dało się wyprowadzić dane albo wejść na nią
    ponownie po restarcie. Czynność ta jest cicha: reguła zapory nie jest
    plikiem, nie jest procesem i nie rzuca się w oczy nikomu, kto nie
    porównuje wykazu reguł z wykazem sprzed tygodnia.

    Wartość podkategorii bierze się z porównania, którego dzięki niej nie
    trzeba robić. Zamiast pytać, czym dzisiejszy wykaz reguł różni się od
    wcześniejszego, czyta się wpisy mówiące, kto i kiedy go zmienił.

    Zapisywane są oba wyniki i jest to tu istotne. Próba otwarcia zapory
    odrzucona z braku uprawnień poprzedza zwykle próbę udaną i mówi o niej
    więcej niż ona sama.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dziurę
    w zaporze otwartą bez śladu i widoczną wyłącznie dla kogoś, kto zna
    wykaz reguł sprzed zmiany.
  en: |
    The setting writes down changes in the firewall rules: the adding of a rule, its taking away, a change of
    profile, and the switching off of the firewall whole.

    The firewall is the bound at which ends what of a machine is seen from the network. The opening of a hole in
    it is a needful act if data are to be led out of a machine in somebody's hands, or if it is to be come back
    into after a restart. That act is a quiet one: a firewall rule is no file, is no process, and strikes the eye
    of nobody who does not set the roll of rules against the roll of a week past.

    The subcategory's value comes of a comparison that thanks to it need not be made. Instead of asking how
    today's roll of rules differs from the earlier one, one reads entries saying who changed it and when.

    Both outcomes are written, and here that matters. An attempt at opening the firewall refused for want of
    rights as a rule goes before a successful one, and says more of it than it says of itself.

    What an attacker gains while the item goes unmet: a hole in the firewall opened without a trace and seen
    only by somebody who knows the roll of rules from before the change.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia ani jednej reguły zapory i nie wpływa na to,
    co przez zaporę przechodzi. Zapisuje wyłącznie zmiany w wykazie.

    Liczba wpisów zależy od tego, co na maszynie stoi. Na stanowisku
    z ustalonym zestawem programów jest bliska zeru. Na maszynie, na której
    instaluje się oprogramowanie często, wpisów bywa więcej, bo instalator
    dodający regułę zapory zostawia tu ślad.

    Odnotowuję źródło wpisów, które bywa mylone ze zmianą ręczną:
    oprogramowanie dodające i usuwające własne reguły przy uruchamianiu
    i zamykaniu. Wpisy takie są powtarzalne i wiążą się z tym samym
    programem.

    Zapisywane są oba wyniki, bo połowa nieudana zawiera próby otwarcia
    zapory odrzucone z braku uprawnień.

    Czego to nie psuje: działania zapory, reguł już dodanych, instalowania
    oprogramowania, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes not one firewall rule and bears not upon what passes through the firewall. It writes
    down changes in the roll alone.

    The number of entries hangs upon what stands on the machine. Upon a workplace with a settled set of programs
    it is near nought. Upon a machine on which software is installed often the entries are more, an installer
    adding a firewall rule leaving a trace here.

    I set down a source of entries at times mistaken for a change by hand: software adding and taking away rules
    of its own at its starting and its closing. Such entries repeat and tie to the same program.

    Both outcomes are written, the failed half holding the attempts at opening the firewall refused for want of
    rights.

    What this does not break: the firewall's working, the rules already added, the installing of software,
    logging on, file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Na maszynie, na której instaluje się oprogramowanie często, wpisów bywa wiele, bo instalator dodający regułę zapory zostawia ślad
      - Oprogramowanie dodające i usuwające własne reguły przy starcie i zamknięciu daje wpisy powtarzalne, mylone ze zmianą ręczną
      - Zapisywane są oba wyniki, bo połowa nieudana zawiera próby otwarcia zapory odrzucone z braku uprawnień
      - Ustawienie nie zmienia ani jednej reguły zapory i nie wpływa na to, co przez nią przechodzi
      - Instalowanie oprogramowania, logowanie, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Upon a machine on which software is installed often the entries are many, an installer adding a firewall rule leaving a trace
      - Software adding and taking away rules of its own at its start and close gives repeating entries, mistaken for a change by hand
      - Both outcomes are written, the failed half holding attempts at opening the firewall refused for want of rights
      - The setting changes not one firewall rule and bears not upon what passes through it
      - The installing of software, logging on, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stale instaluje się oprogramowanie i nikt nie przejrzy wpisów, których źródłem są instalatory
    en:
      - Software is installed upon the machine without cease and nobody will look over entries whose source is the installers
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9232-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9232-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9232-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. A refused attempt at opening the firewall is worth
    # as much as one that succeeded, and comes as a rule before it.
    auditpol /set /subcategory:"{0CCE9232-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9232-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-mpssvc-rule-level-policy-change

notes:
  pl: |
    Reguła jest w tym bloku jedyną o zakresie ścisłym: wymagam obu wyników
    i nie uznaję za zgodną maszyny zapisującej same powodzenia. Powód jest
    konkretny — próba otwarcia zapory odrzucona z braku uprawnień jest
    zwykle wcześniejsza niż udana i to ona mówi, że ktoś próbował, zanim
    mu się udało.

    Warto, żeby aplikacja pokazała tę regułę razem z regułami o samej
    zaporze. Tamte mówią, jaki jest stan granicy; ta mówi, kiedy i przez
    kogo był zmieniany.

    Odnotowuję szum, bo bywa powodem wyłączenia tej podkategorii w kilka dni
    po włączeniu. Instalatory i programy zarządzające własnymi regułami
    generują wpisy powtarzalne. Nie jest to argument za wyłączeniem, tylko
    za odsianiem — a aplikacja powinna uprzedzić o tym przed wykonaniem,
    nie po.
  en: |
    The rule is the only one in this block of a strict reach: I call for both outcomes and do not hold as
    compliant a machine writing successes alone. The reason is a plain one - an attempt at opening the firewall
    refused for want of rights as a rule comes before a successful one, and it is that which says somebody tried
    before they got through.

    It is well that the application show this rule beside the rules about the firewall itself. Those say what the
    state of the bound is; this says when and by whom it was changed.

    I set down the noise, it being at times the reason for switching this subcategory off within a few days of
    its being switched on. Installers and programs handling rules of their own raise repeating entries. That is
    no argument for switching off but for sifting - and the application ought to give warning of it before the
    carrying out, not after.
