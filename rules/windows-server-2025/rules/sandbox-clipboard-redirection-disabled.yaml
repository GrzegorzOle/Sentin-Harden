id: win2025-sandbox-clipboard-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Wspólny schowek piaskownicy z systemem wyłączony
    en: The sandbox's shared clipboard with the system switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt rozdziela schowek piaskownicy od schowka gospodarza.

    Kategoria średnia i chcę nazwać oba kierunki, bo każdy z nich znaczy co
    innego, a mówi się zwykle tylko o jednym.

    Kierunek do środka jest tym, o którym się zapomina. Schowek na serwerze
    bywa pełen rzeczy, których nie wolno wynosić: wklejonego hasła,
    poświadczeń do bazy, ciągu połączenia, fragmentu konfiguracji. Wspólny
    schowek oznacza, że podejrzany program w piaskownicy czyta to wszystko
    w chwili, w której administrator coś skopiował po swojej stronie.
    Nie musi niczego wykradać — wystarczy, że czeka.

    Kierunek na zewnątrz jest prostszy: schowek to droga wnoszenia danych
    z piaskownicy do systemu gospodarza. Sama treść wklejona do okna
    niewiele znaczy, ale wklejenie do konsoli jest już wykonaniem, a wklejanie
    poleceń do konsoli jest nawykiem powszechnym.

    Warto to czytać razem z resztą tej grupy. Żaden z tych punktów nie jest
    zaporą sam z siebie; one razem odbierają piaskownicy kolejne drogi
    wyjścia, a wartość widać dopiero w sumie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podgląd tego,
    co administrator kopiuje na gospodarzu, oraz drogę wnoszenia treści
    z powrotem.
  en: |
    The item separates the sandbox's clipboard from the host's.

    The category is medium, and I want to name both directions, because each
    means something different and usually only one is spoken of.

    The inward direction is the one forgotten. A clipboard on a server is
    sometimes full of things that must not leave: a pasted password, database
    credentials, a connection string, a fragment of configuration. A shared
    clipboard means a suspect program in the sandbox reads all of that the
    moment an administrator copies something on their side. It does not have
    to steal anything - it is enough that it waits.

    The outward direction is simpler: the clipboard is a route for carrying
    data from the sandbox into the host system. Content pasted into a window
    means little by itself, but pasting into a console is already execution,
    and pasting commands into a console is a widespread habit.

    This is worth reading together with the rest of the group. None of these
    items is a barrier on its own; together they take one route out after
    another from the sandbox, and the value shows only in the sum.

    What an attacker gains while the item goes unmet: a view of what the
    administrator copies on the host, and a route for carrying content back.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i tutaj skutek jest natychmiast odczuwalny
    dla każdego, kto piaskownicy używa — o ile na tej maszynie w ogóle jest,
    bo to funkcja opcjonalna i na serwerach zwykle jej nie ma.

    Po zmianie nie da się skopiować niczego między piaskownicą a systemem.
    Ani adresu, ani nazwy pliku, ani wyniku, który chciało się zachować.
    To jest zauważalne przy pierwszym użyciu i zgłaszane od razu, bo schowek
    jest tym, czego się używa bez zastanowienia.

    Warto znać skutek uboczny: bez schowka ludzie zaczynają przepisywać
    z ekranu, a przepisując robią błędy, albo — co gorsze — zaczynają
    współdzielić katalog, żeby ominąć niedogodność. Współdzielony katalog
    jest szerszą drogą niż schowek, więc odebranie schowka bez rozmowy
    o tym, jak ludzie będą sobie radzić, potrafi pogorszyć stan całości.

    Czego to nie psuje: schowka w systemie gospodarza, kopiowania między
    programami, sesji zdalnych i ich przekierowania schowka. Punkt dotyczy
    wyłącznie granicy piaskownicy.

    Zmiana obowiązuje od następnego uruchomienia piaskownicy. Bez przerwy,
    natychmiast odwracalne.
  en: |
    The class is "needs review", and here the effect is felt at once by
    anybody using the sandbox - so long as the machine has one at all, since
    it is an optional feature and servers usually do not.

    After the change nothing can be copied between the sandbox and the
    system. Not an address, not a file's name, not a result somebody wanted
    to keep. It is noticed at the first use and reported at once, because the
    clipboard is what people use without thinking.

    A side effect worth knowing: without a clipboard people start copying
    from the screen by hand, and copying by hand they make mistakes, or -
    worse - they start sharing a directory to get round the inconvenience. A
    shared directory is a wider road than a clipboard, so taking the
    clipboard away without a conversation about how people will manage can
    make the whole worse.

    What this does not break: the clipboard in the host system, copying
    between programs, remote sessions and their clipboard redirection. The
    item concerns the sandbox's boundary alone.

    The change holds from the next start of the sandbox. No outage, undone
    immediately.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - user-interface
  what_breaks:
    pl:
      - Nie da się skopiować niczego między piaskownicą a systemem — ani adresu, ani nazwy pliku, ani wyniku
      - Skutek uboczny — ludzie zaczynają przepisywać z ekranu i robią błędy albo współdzielą katalog, żeby ominąć niedogodność
      - Współdzielony katalog jest szerszą drogą niż schowek, więc odebranie schowka bez rozmowy potrafi pogorszyć stan całości
      - Schowek w systemie gospodarza, kopiowanie między programami i przekierowanie schowka w sesjach zdalnych działają bez zmian
    en:
      - Nothing can be copied between the sandbox and the system - not an address, not a file's name, not a result
      - A side effect - people start copying from the screen by hand and make mistakes, or share a directory to get round it
      - A shared directory is a wider road than a clipboard, so taking the clipboard away without a conversation can make the whole worse
      - The clipboard in the host system, copying between programs and clipboard redirection in remote sessions work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Odebranie schowka doprowadzi do współdzielenia katalogu z piaskownicą, bo nie przewidziano innego sposobu przenoszenia wyników
    en:
      - Taking the clipboard away will lead to a directory being shared with the sandbox, because no other way of moving results was planned
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      $name = 'AllowClipboardRedirection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $name = 'AllowClipboardRedirection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two directions. Inward: a suspect program reads whatever the administrator
    # copies on the host - a pasted password, a connection string - simply by
    # waiting. Outward: pasting into a console is already execution. Plan how
    # results will be moved, or people will share a directory instead.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowClipboardRedirection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Dwa kierunki, a mówi się zwykle o jednym. Do środka: schowek na serwerze
    bywa pełen rzeczy, których nie wolno wynosić — wklejonego hasła,
    poświadczeń do bazy, ciągu połączenia. Podejrzany program nie musi
    niczego wykradać, wystarczy, że czeka.

    Na zewnątrz: schowek to droga wnoszenia treści z piaskownicy do systemu.
    Wklejenie do okna niewiele znaczy, ale wklejenie do konsoli jest już
    wykonaniem, a wklejanie poleceń do konsoli jest nawykiem powszechnym.

    Skutek uboczny wart uwagi: bez schowka ludzie zaczynają współdzielić
    katalog, a to droga szersza niż schowek.
  en: |
    Two directions, and usually only one is spoken of. Inward: a clipboard on
    a server is sometimes full of things that must not leave - a pasted
    password, database credentials, a connection string. A suspect program
    does not have to steal anything, it is enough that it waits.

    Outward: the clipboard is a route for carrying content from the sandbox
    into the system. Pasting into a window means little, but pasting into a
    console is already execution, and pasting commands into a console is a
    widespread habit.

    A side effect worth attention: without a clipboard people start sharing a
    directory, and that is a wider road than a clipboard.
