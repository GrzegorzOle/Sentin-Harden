id: win2016-trusted-credential-manager-access-none

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dostęp do menedżera poświadczeń jako zaufany obiekt wywołujący nieprzyznany nikomu
    en: Trusted caller access to the credential manager granted to nobody
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy uprawnienie do dostępu do menedżera poświadczeń jako
    zaufany obiekt wywołujący nie zostało przyznane nikomu.

    Menedżer poświadczeń to miejsce, w którym system przechowuje zapamiętane
    hasła: do udziałów sieciowych, do połączeń pulpitu zdalnego, do stron
    i aplikacji. Jest zaprojektowany tak, żeby zapamiętane hasło dawało się
    użyć, ale nie dawało się odczytać — program prosi o połączenie, a nie
    o treść hasła.

    Uprawnienie opisane tym punktem znosi to rozróżnienie. Posiadacz zwraca się
    do menedżera poświadczeń jako składnik zaufany i dostaje zapamiętane hasła
    w postaci jawnej, nie tylko dla siebie, ale dla wszystkich kont na maszynie.

    Kategoria krytyczna. Hasła zapamiętane na serwerze prowadzą zwykle dalej niż
    sam serwer: do udziałów, do innych maszyn, do kont obsługi używanych
    wszędzie. To jest jedno z niewielu uprawnień dających poświadczenia w
    postaci nadającej się do użycia od razu, bez łamania czegokolwiek.

    Na serwerze 2016 lista jest domyślnie pusta i żadne legalne oprogramowanie
    tego uprawnienia nie potrzebuje. Sam system, gdy sięga po zapamiętane
    poświadczenie, robi to inną drogą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapamiętane
    hasła wszystkich kont tej maszyny w postaci jawnej, gotowe do użycia gdzie
    indziej.
  en: |
    The item checks that the right to reach the credential manager as a trusted
    caller has been granted to nobody.

    The credential manager is where the system keeps remembered passwords: for
    network shares, for remote desktop connections, for sites and applications. It
    is designed so that a remembered password can be used but not read - a program
    asks for a connection, not for the password's content.

    The right this item describes cancels that distinction. Its holder approaches
    the credential manager as a trusted component and receives remembered passwords
    in the clear, not only its own but those of every account on the machine.

    The critical category applies. Passwords remembered on a server usually lead
    further than the server itself: to shares, to other machines, to administration
    accounts used everywhere. This is one of the few rights that yield credentials
    in a form usable at once, with nothing cracked.

    On Server 2016 the list is empty by default and no legitimate software needs
    this right. The system itself, when it reaches for a remembered credential,
    does so by another route.

    What an attacker gains while the item goes unmet: the remembered passwords of
    every account on this machine in the clear, ready for use elsewhere.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Domyślnie lista jest pusta, a oprogramowanie
    korzystające z tego uprawnienia praktycznie nie istnieje.

    Jeżeli na liście coś jest, warto potraktować to jako ustalenie audytu,
    a nie jako drobiazg do poprawienia po drodze. Wpis tutaj nie pojawia się
    przypadkiem: uprawnienie to nie bywa nadawane przez instalatory ani
    zalecane w instrukcjach.

    Czego to nie psuje: zapamiętywania haseł przez użytkowników, logowania na
    udziały sieciowe, połączeń pulpitu zdalnego korzystających z zapamiętanych
    poświadczeń ani samego menedżera poświadczeń.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The list is empty by default, and software using
    this right practically does not exist.

    If something is on the list, it is worth treating as a finding of the audit
    rather than a detail to correct in passing. An entry here does not appear by
    accident: this right is not granted by installers nor recommended in
    instructions.

    What this does not break: users remembering passwords, signing in to network
    shares, remote desktop connections using remembered credentials, or the
    credential manager itself.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-desktop
    - file-sharing
  what_breaks:
    pl:
      - Konto wpisane na tę listę traci możliwość odczytania zapamiętanych haseł w postaci jawnej
      - Obecność jakiegokolwiek wpisu na tej liście jest sama w sobie ustaleniem wymagającym wyjaśnienia
      - Zapamiętywanie haseł przez użytkowników i korzystanie z nich działa bez zmian
      - Logowanie na udziały sieciowe i połączenia pulpitu zdalnego pozostają nietknięte
    en:
      - An account written onto this list loses the ability to read remembered passwords in the clear
      - The presence of any entry on this list is itself a finding that calls for an explanation
      - Users remembering passwords and using them works unchanged
      - Signing in to network shares and remote desktop connections stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Uprawnienie ma konto oprogramowania, którego producent potwierdził ten wymóg na piśmie, a maszyny nie da się obsłużyć inaczej
    en:
      - The right is held by an account of software whose vendor confirmed the requirement in writing and the machine cannot be served otherwise
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTrustedCredManAccessPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list is emptied. The credential manager is built so that a remembered
    # password can be used and not read; this right cancels that distinction for
    # every account on the machine at once.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTrustedCredManAccessPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTrustedCredManAccessPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/access-credential-manager-as-a-trusted-caller

notes:
  pl: |
    Uprawnienie to nie jest potrzebne do korzystania z zapamiętanych haseł.
    Użytkownik łączący się z udziałem sieciowym korzysta z menedżera
    poświadczeń bez niego — i to jest właśnie ta granica, której punkt broni.

    Wynik niezgodny na tej regule warto obejrzeć przed naprawą, nie dlatego,
    że naprawa coś zepsuje, tylko dlatego, że sam wpis jest informacją.

    Punkt warto czytać razem z regułami o debugowaniu programów i o odczycie
    pamięci. Wszystkie trzy prowadzą do poświadczeń, tylko innymi drogami.
  en: |
    The right is not needed to use remembered passwords. A user connecting to a
    network share uses the credential manager without it - and that is exactly the
    boundary the item defends.

    A non-compliant result on this rule is worth looking at before remedying, not
    because the remedy will break anything, but because the entry is itself
    information.

    The item is worth reading together with the rules on debugging programs and on
    reading memory. All three lead to credentials, only by different roads.
