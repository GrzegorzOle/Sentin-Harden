id: win2025-certificate-padding-check-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Ścisłe sprawdzanie wypełnienia podpisu pliku wykonywalnego włączone
    en: Strict checking of an executable signature's padding switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podpis pliku wykonywalnego obejmuje jego treść, ale nie całą.
    W strukturze podpisu jest miejsce wypełniające, które przy
    sprawdzaniu było historycznie pomijane — wolno w nim było umieścić
    cokolwiek, a podpis pozostawał ważny.

    Nadużycie jest proste i było stosowane w praktyce. Napastnik bierze
    plik podpisany przez uznanego wydawcę, dokłada do miejsca
    wypełniającego własne dane i rozsyła tak przygotowany plik. System
    sprawdza podpis, widzi wydawcę, którego zna, i przepuszcza plik
    razem z doklejoną zawartością.

    Wartość tej drogi dla napastnika nie polega na samym doklejeniu.
    Polega na tym, że plik przechodzi przez wszystko, co ufa podpisowi:
    przez reguły dopuszczające programy znanych wydawców, przez kontrolę
    sterowników, przez narzędzia sprawdzające, czy pobrany instalator
    jest tym, za co się podaje.

    Na serwerze ufa się podpisom szerzej niż na stanowisku roboczym
    i mniej ostrożnie. Serwer przyjmuje pakiety aktualizacyjne, agenty
    kopii zapasowych, agenty nadzoru i sterowniki kontrolerów — wszystko
    od dostawców, którym się z założenia ufa, i zwykle instalowane bez
    udziału człowieka, przez narzędzie do wdrażania oprogramowania.
    Podpis jest tam często jedynym sprawdzeniem, jakie w ogóle zachodzi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wniesienia własnych danych do pliku podpisanego przez
    zaufanego wydawcę, tak że plik przechodzi każdą kontrolę opartą na
    podpisie.
  en: |
    The signature of an executable file takes in its contents, but not all of them. Within the
    structure of the signature there is a filling place that was historically passed over at the
    checking - anything might be laid there and the signature stayed good.

    The misuse is simple and was put to use in practice. An attacker takes a file signed by a
    known publisher, adds their own data to the filling place and sends the file so made ready
    about. The system checks the signature, sees a publisher it knows, and lets the file through
    together with what was stuck to it.

    What makes that road worth having for the attacker is not the sticking itself. It is that the
    file passes through everything that trusts a signature: through rules admitting programs of
    known publishers, through the checking of drivers, through tools checking whether a fetched
    installer is what it gives itself out to be.

    On a server signatures are trusted more widely than at a working station and less warily. A
    server takes in packages of updates, agents of backup, agents of watching and drivers of
    controllers - all from suppliers trusted by assumption, and usually installed with no person's
    part, by a tool for the rolling out of software. The signature is there often the one check
    that happens at all.

    What an attacker gains while the item goes unmet: the means of bringing their own data into a
    file signed by a trusted publisher, so that the file passes every check resting on a
    signature.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy na tym serwerze nie pracuje
    oprogramowanie, które własnemu podpisanemu plikowi dopisuje dane
    po podpisaniu.

    Brzmi to jak przypadek teoretyczny, ale nie jest. Robią tak
    instalatory znakowane identyfikatorem wdrożenia — plik jest
    podpisywany raz, a następnie każda organizacja dostaje własny
    egzemplarz z dopisanym znacznikiem, żeby nie trzeba było podpisywać
    od nowa. Robi tak również część oprogramowania branżowego, które
    dokłada do gotowego pliku klucz licencyjny albo adres serwera.

    Po zmianie taki plik przestaje być uznawany za podpisany. Objaw jest
    zależny od tego, co plik sprawdza: instalator może odmówić
    uruchomienia, sterownik może nie zostać załadowany, a narzędzie
    do wdrażania może odrzucić pakiet jako niepodpisany.

    Na serwerze rozpoznanie idzie po liście zainstalowanych agentów
    i po repozytorium pakietów, z którego ten serwer bierze
    oprogramowanie. Jeżeli pakiety pochodzą wprost od producenta,
    ryzyko jest znikome. Jeżeli przechodzą przez wewnętrzne narzędzie
    znakujące, trzeba spytać jego właściciela.

    Wartość zapisywana jest w dwóch miejscach: dla programów
    zbudowanych pod obecną długość słowa i dla tych pod poprzednią.
    Ustawienie tylko jednego zostawia drugą drogę otwartą, bo program
    sprawdza podpis w tym widoku rejestru, w którym sam pracuje.

    Zmiana działa natychmiast i cofa się natychmiast, bez restartu.
  en: |
    One thing needs checking: whether software that adds data to its own signed file after the
    signing works on this server.

    It sounds like a theoretical case and is not. Installers marked with an identifier of a
    rollout do so - the file is signed once, and thereafter each organisation gets a copy of its
    own with a mark added, so that there is no need to sign anew. So does a part of trade
    software, which adds a key of licence or a server's address to a finished file.

    After the change such a file stops being held signed. The symptom depends on what the file
    checks: an installer may refuse to start, a driver may not be loaded, and a tool for rolling
    out software may turn the package away as unsigned.

    On a server the reconnaissance goes by the list of installed agents and by the store of
    packages this server takes its software from. Where the packages come straight from the maker,
    the risk is slight. Where they pass through an inner tool that marks them, its owner must be
    asked.

    The value is written in two places: for programs built for the present word length and for
    those for the former. Setting only one leaves the other road open, a program checking the
    signature in the view of the registry it works in itself.

    The change works at once and is undone at once, with no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - updates-and-servicing
    - drivers-and-devices
  what_breaks:
    pl:
      - Instalator znakowany identyfikatorem wdrożenia po podpisaniu przestanie być uznawany za podpisany
      - Oprogramowanie branżowe dopisujące do gotowego pliku klucz licencyjny albo adres serwera może odmówić uruchomienia
      - Sterownik przygotowany w ten sam sposób może nie zostać załadowany
      - Narzędzie do wdrażania może odrzucić taki pakiet jako niepodpisany
    en:
      - An installer marked with an identifier of a rollout after signing will stop being held signed
      - Trade software adding a key of licence or a server's address to a finished file may refuse to start
      - A driver made ready the same way may not be loaded
      - A tool for rolling out software may turn such a package away as unsigned
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Organizacja rozprowadza na serwery instalatory znakowane identyfikatorem już po podpisaniu
      - Producent oprogramowania branżowego dopisuje dane do gotowego, podpisanego pliku
    en:
      - The organisation distributes to its servers installers marked with an identifier after the signing
      - The maker of trade software adds data to a finished, signed file
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is kept twice: once for programs built for this system and
      # once for those built for the older word length. Both have to be set,
      # because a program checks the signature in the view it runs in.
      $paths = [ordered]@{
        native  = 'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config'
        wow6432 = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
      }
      $name = 'EnableCertPaddingCheck'
      $missing = @()
      $other = @()
      foreach ($entry in $paths.GetEnumerator()) {
        $value = $null
        if (Test-Path -Path $entry.Value) {
          $value = (Get-ItemProperty -Path $entry.Value -ErrorAction Stop).$name
        }
        if ($null -eq $value) { $missing += $entry.Key }
        elseif (([string]$value).Trim() -ne '1') { $other += ($entry.Key + '=' + [string]$value) }
      }
      if ($missing.Count -gt 0) { 'MISSING ' + ($missing -join ',') }
      elseif ($other.Count -gt 0) { 'OTHER ' + ($other -join ',') }
      else { 'AS_REQUIRED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    $name = 'EnableCertPaddingCheck'
    $state = foreach ($path in $paths) {
      $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
      [pscustomobject]@{
        path        = $path
        name        = $name
        value       = $current
        existed     = ($null -ne $current)
        key_existed = (Test-Path -Path $path)
      }
    }
    $state | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both views of the registry are written. Setting only one leaves the other
    # road open.
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    foreach ($path in $paths) {
      if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
      Set-ItemProperty -Path $path -Name 'EnableCertPaddingCheck' -Value '1' -Type String
    }

  rollback_command: |
    $state = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($b in @($state)) {
      if ($b.existed) {
        Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
      } else {
        Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
        if (-not $b.key_existed) {
          # The key is removed only where the change created it and nothing else
          # has since been written into it.
          $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
          if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
            Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
          }
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/security-updates/securityadvisories/2014/2915720

notes:
  pl: |
    Wartość zapisuję w dwóch widokach rejestru. Program sprawdza podpis
    w tym widoku, w którym sam pracuje, więc ustawienie jednego zostawia
    drugą drogę otwartą.

    Na serwerze waży to, że podpis bywa jedynym sprawdzeniem pakietu
    aktualizacyjnego, agenta kopii zapasowych albo sterownika kontrolera
    — instalowanych zwykle bez udziału człowieka.

    Przed zmianą sprawdź, czy pakiety trafiające na ten serwer nie
    przechodzą przez wewnętrzne narzędzie znakujące je po podpisaniu.
  en: |
    I write the value in both views of the registry. A program checks the signature in the view it
    works in itself, so setting one leaves the other road open.

    On a server what weighs is that a signature is at times the one check of a package of updates,
    of an agent of backup or of a controller's driver - installed usually with no person's part.

    Before the change see whether the packages reaching this server pass through an inner tool
    that marks them after the signing.
