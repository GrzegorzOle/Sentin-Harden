id: win2016-bitlocker-os-drive-encryption-type

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Szyfrowanie całego dysku systemowego wymuszone
    en: Full encryption of the operating system drive enforced
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza szyfrowanie całej powierzchni dysku systemowego,
    a nie wyłącznie obszaru obecnie zajętego.

    Rozumowanie jest to samo co przy dyskach z danymi, ale przedmiot inny
    i warto ten przedmiot nazwać. Obszar wolny dysku systemowego nie jest
    pustką — jest cmentarzyskiem wszystkiego, co system przez lata tam
    odkładał i kasował.

    Leżą tam pliki stronicowania sprzed lat, pliki tymczasowe aplikacji,
    zawartość profili usuniętych użytkowników, pozostałości po
    aktualizacjach, pliki instalacyjne, kopie kluczy i konfiguracji,
    zrzuty pamięci po awariach. Ostatnia pozycja jest tu najważniejsza:
    zrzut pamięci zawiera to, co maszyna miała w pamięci w chwili awarii,
    łącznie z poświadczeniami.

    Szyfrowanie samego obszaru zajętego zostawia to wszystko czytelne. Dysk
    wyjęty z maszyny nie odda plików bieżących, ale odda historię — i ta
    historia bywa cenniejsza niż stan obecny, bo obejmuje rzeczy dawno
    zapomniane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czytelny
    dostęp do wszystkiego, co system kiedykolwiek odłożył i skasował,
    łącznie ze zrzutami pamięci.
  en: |
    The setting enforces the encryption of the operating system drive's whole surface and not solely of
    the area now taken up.

    The reasoning is the same as at the data drives, but the subject another and that subject is worth
    naming. The free area of a system drive is no emptiness - it is a graveyard of everything the
    system laid there and deleted over the years.

    There lie paging files of years past, applications' temporary files, the contents of removed users'
    profiles, remains of updates, installation files, copies of keys and configurations, dumps of
    memory after faults. The last of those matters most here: a dump of memory holds what the machine
    had in memory at the moment of the fault, credentials among it.

    Encrypting the taken-up area alone leaves all that readable. A drive taken out of the machine will
    not give the current files up, but it will give the history up - and that history is at times
    dearer than the present state, taking in as it does things long forgotten.

    What an attacker gains while the item goes unmet: readable access to everything the system ever
    laid down and deleted, dumps of memory among it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy czasu
    i momentu.

    Zmiana nie dotyka dysku już zaszyfrowanego. Dysk systemowy zaszyfrowany
    wcześniej w trybie obszaru zajętego pozostaje w tym trybie i nie
    przeszyfruje się sam. Przeniesienie wymaga odszyfrowania i zaszyfrowania
    na nowo, a to znaczy dwa przejścia przez całą powierzchnię, w czasie
    których dysk systemowy jest nieszyfrowany.

    Skutek dotyczy pierwszego szyfrowania. Przejście przez całą powierzchnię
    dysku systemowego obciąża podsystem dyskowy przez godziny, a robi to na
    dysku, z którego maszyna jednocześnie pracuje. Na serwerze obsługującym
    ruch bywa to odczuwalne dla użytkowników.

    Trzecia rzecz jest raczej wskazówką niż ostrzeżeniem. Właściwym momentem
    na tę zmianę jest chwila przed pierwszym zaszyfrowaniem, czyli przy
    stawianiu maszyny. Wprowadzona wtedy nie kosztuje nic — bo dysk i tak
    trzeba zaszyfrować, a szyfrowanie całej powierzchni nowego dysku trwa
    niewiele dłużej.

    Czego to nie psuje: dostępu do danych, pracy usług, sieci, aplikacji,
    odblokowywania, odzyskiwania.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be reviewed concerns time and timing.

    The change does not touch an already encrypted drive. A system drive encrypted earlier in the
    taken-up-area mode stays in that mode and will not re-encrypt itself. The carrying over calls for
    decrypting and encrypting anew, and that means two passes through the whole surface, during which
    the system drive is unencrypted.

    The consequence concerns the first encryption. Going through the whole surface of a system drive
    loads the disk subsystem for hours, and does so on the very drive the machine is working from. On a
    server serving traffic that is at times felt by the users.

    The third matter is a pointer rather than a warning. The right moment for this change is the moment
    before the first encryption, which is to say when the machine is being set up. Brought in then it
    costs nothing - the drive having to be encrypted anyway, and encrypting a new drive's whole surface
    taking little longer.

    What this does not break: access to data, the working of services, the network, applications,
    unlocking, or recovering.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - updates-and-servicing
  what_breaks:
    pl:
      - Dysk systemowy zaszyfrowany wcześniej w trybie obszaru zajętego pozostaje w tym trybie i nie przeszyfruje się sam
      - Przeniesienie istniejącego dysku wymaga dwóch przejść przez całą powierzchnię, w czasie których dysk systemowy jest nieszyfrowany
      - Pierwsze szyfrowanie obciąża podsystem dyskowy przez godziny na dysku, z którego maszyna jednocześnie pracuje
      - Dostęp do danych, praca usług, odblokowywanie i odzyskiwanie pozostają bez zmian
    en:
      - A system drive encrypted earlier in the taken-up-area mode stays in that mode and will not re-encrypt itself
      - Carrying an existing drive over calls for two passes through the whole surface, during which the system drive is unencrypted
      - The first encryption loads the disk subsystem for hours on the very drive the machine is working from
      - Access to data, the working of services, unlocking and recovering stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dysk systemowy jest już zaszyfrowany w trybie obszaru zajętego, a okna na dwukrotne przejście przez powierzchnię nie ma
      - Maszyna obsługuje ruch bez przerwy, a wielogodzinne obciążenie dysku systemowego jest dla użytkowników odczuwalne
    en:
      - The system drive is already encrypted in the taken-up-area mode and there is no window for two passes through the surface
      - The machine serves traffic without a break and a load on the system drive lasting hours is felt by the users
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'OSEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FULL'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'OSEncryptionType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One enforces full encryption, two leaves it at the used space alone, zero
    # hands the choice to whoever encrypts the drive.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'OSEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest czwarty w tej części i domyka temat trybu szyfrowania, który
    przewijał się przez cały zestaw. Ta sama decyzja pojawia się przy trzech
    klasach dysków i za każdym razem ma inny koszt oraz inny przedmiot.

    Zestawienie tych trzech w jednym miejscu jest tu wartościowe i warto,
    żeby aplikacja je pokazywała. Przy nośniku wymiennym kosztem był czas
    człowieka. Przy dysku stałym — obciążenie maszyny. Przy dysku systemowym
    — obciążenie maszyny na dysku, z którego ona pracuje. Przedmiotem zaś są
    kolejno: historia nośnika, historia woluminu z danymi i historia samego
    systemu, w tym zrzuty pamięci.

    Argument o zrzutach pamięci jest przy tym punkcie mocniejszy niż
    cokolwiek innego i warto go postawić wprost, zamiast mówić ogólnie
    o skasowanych plikach. Zrzut pamięci po awarii zawiera poświadczenia
    i leży na obszarze, który przy trybie obszaru zajętego nie jest
    szyfrowany.

    Wskazówka o właściwym momencie należy tu do treści, nie do dodatków.
    Reguła wdrożona przy stawianiu maszyny nie kosztuje nic; ta sama reguła
    wdrożona trzy lata później wymaga dwóch przejść przez terabajty.
    Aplikacja powinna to mówić, bo różnica nie wynika z niczego, co widać
    w samym ustawieniu.
  en: |
    The item is the fourth in this part and shuts the matter of the encryption mode that ran through the
    whole set. The same decision appears at three classes of drive and each time has another cost and
    another subject.

    Setting those three side by side in one place is here of worth and it is well that the application
    show it. At a removable medium the cost was a person's time. At a fixed drive - a load on the
    machine. At the system drive - a load on the machine on the very drive it works from. The subjects
    are in turn: a medium's history, a data volume's history and the history of the system itself,
    dumps of memory among it.

    The argument about dumps of memory is at this item stronger than anything else and is worth putting
    outright rather than speaking generally of deleted files. A dump of memory after a fault holds
    credentials and lies in the area that, in the taken-up-area mode, is not encrypted.

    The pointer about the right moment belongs here to the substance and not to the additions. The rule
    rolled out when a machine is set up costs nothing; the same rule rolled out three years later calls
    for two passes through terabytes. The application should say so, the difference following from
    nothing to be seen in the setting itself.
