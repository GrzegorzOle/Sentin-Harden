id: win2016-remote-desktop-configuration-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konfiguracji pulpitu zdalnego wyłączona
    en: The Remote Desktop configuration service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przygotowującą sesje pulpitu zdalnego: ustawienia
    sesji, uprawnienia, certyfikaty i sprawy związane z licencjonowaniem
    dostępu.

    Usługa ta nie przyjmuje połączeń z sieci. Pracuje obok tej, która je
    przyjmuje, i wykonuje dla niej czynności przygotowawcze. Z punktu
    widzenia powierzchni ataku znaczy to, że sama w sobie nie jest drogą
    wejścia.

    Wartość tego punktu jest inna i warto ją nazwać wprost. Usługa ta
    działa w tle nawet tam, gdzie pulpit zdalny został wyłączony, i zostaje
    po nim jako składnik uruchamiany bez powodu. Kod uruchomiony bez zadania
    jest kodem, który trzeba łatać, a którego nikt nie obserwuje, bo nikt
    nie pamięta, że chodzi.

    Jest to więc reguła porządkowa, domykająca punkt poprzedni. Wykonana
    osobno zostawia stan dziwny: połączenia przyjmowane, ale przygotowywane
    niekompletnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio — działający składnik systemu, który na tej maszynie nie
    ma zadania.
  en: |
    The item switches off the service preparing remote desktop sessions: the session's settings, the
    permissions, the certificates and the matters bound up with the licensing of access.

    That service takes no connections from the network. It works beside the one that takes them, and
    carries out preparatory acts for it. From the point of view of the attack surface that means it is
    of itself no road in.

    This item's value is another and worth naming outright. That service works in the background even
    where the remote desktop has been switched off, and stays after it as a component started without
    cause. Code started without a task is code that has to be patched and that nobody watches, nobody
    remembering that it runs.

    It is therefore a rule of order, shutting the item before it. Carried out on its own it leaves an odd
    state: connections taken in but prepared incompletely.

    What an attacker gains while the item goes unmet: little directly - a working component of the system
    that has no task on this machine.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", ale powód jest inny niż w dwóch
    poprzednich regułach. Tu nie chodzi o odcięcie dostępu, tylko
    o kolejność.

    Warunek zasadniczy: ten punkt ma sens wyłącznie razem z punktem
    o usłudze pulpitu zdalnego. Wykonany osobno, przy pulpicie zdalnym
    działającym, zostawia stan, w którym połączenia są przyjmowane, ale
    przygotowanie sesji nie dochodzi do skutku. Objawem są logowania
    kończące się rozłączeniem, sesje, które nie wstają, i błędy dotyczące
    certyfikatu sesji.

    Jest to objaw gorszy niż czyste odrzucenie połączenia, bo wygląda na
    usterkę przejściową. Ktoś spróbuje ponownie, uda się albo nie uda,
    i przyczyna zostanie uznana za sieć.

    Warunek drugi dotyczy licencjonowania dostępu. Na maszynie z rolą hosta
    sesji usługa ta obsługuje sprawy licencyjne i jej brak odcina sesje
    nawet wtedy, gdy wszystko inne stoi.

    Czego to nie psuje: zdalnych poleceń zarządzających, udziałów
    plikowych, logowania lokalnego, aplikacji, sieci.

    Wymaga zatrzymania usługi; cofnięcie natychmiastowe.
  en: |
    The class is "needs a planned rollout", but the reason is another than in the two rules before. Here
    it is not a matter of cutting off access but of order.

    The cardinal condition: this item makes sense solely together with the item about the remote desktop
    service. Carried out on its own, with the remote desktop working, it leaves a state in which
    connections are taken in but the session's preparation does not come off. The symptoms are logons
    ending in a disconnection, sessions that do not come up, and errors about the session's certificate.

    That is a worse symptom than a clean refusal of the connection, looking as it does like a passing
    defect. Somebody will try again, it will succeed or it will not, and the cause will be set down to
    the network.

    The second condition concerns the licensing of access. On a machine with the session host role that
    service attends the licensing matters, and its absence cuts sessions off even where everything else
    stands.

    What this does not break: remote management commands, file shares, a local logon, applications, or
    the network.

    Calls for a service to be stopped; the undoing is immediate.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Wykonany osobno, przy działającym pulpicie zdalnym, zostawia logowania kończące się rozłączeniem i sesje, które nie wstają
      - Objaw wygląda na usterkę przejściową, więc przyczyna bywa uznawana za sieć
      - Na maszynie z rolą hosta sesji odcina sesje przez sprawy licencyjne, nawet gdy wszystko inne stoi
      - Pojawiają się błędy dotyczące certyfikatu sesji
      - Zdalne polecenia zarządzające, udziały plikowe, logowanie lokalne i aplikacje pozostają bez zmian
    en:
      - Carried out on its own, with the remote desktop working, it leaves logons ending in a disconnection and sessions that do not come up
      - The symptom looks like a passing defect, so the cause is at times set down to the network
      - On a machine with the session host role it cuts sessions off through the licensing matters, even where everything else stands
      - Errors about the session's certificate appear
      - Remote management commands, file shares, a local logon and applications stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Usługa pulpitu zdalnego na tej maszynie pozostaje włączona, bo wykonanie samego tego punktu daje stan niespójny
      - Maszyna pełni rolę hosta sesji i usługa obsługuje na niej sprawy licencyjne
    en:
      - The remote desktop service on this machine stays switched on, carrying out this item alone giving an inconsistent state
      - The machine holds the session host role and the service attends the licensing matters on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'SessionEnv' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the companion of the remote desktop service and is worth switching
    # off only where that one is off too. Alone it leaves connections that come
    # up unevenly, which is worse to diagnose than a clean refusal.
    Stop-Service -Name 'SessionEnv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SessionEnv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'SessionEnv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Punkt jest jedyny w tym bloku, który nie broni się sam. Jego treścią
    jest domknięcie punktu poprzedniego, a wykonany bez niego szkodzi
    bardziej, niż pomaga.

    Aplikacja powinna tę zależność znać i pokazać. Wyobrażalne jest
    podpowiedzenie kolejności: najpierw usługa przyjmująca połączenia,
    potem ta przygotowująca sesje. Odwrotna kolejność daje objawy, których
    nikt nie powiąże ze zmianą, bo wyglądają jak niestabilność.

    Kategoria średnia zamiast wysokiej jest postawiona zgodnie
    z kryterium. Usługa ta nie nasłuchuje i nie jest drogą wejścia; to, co
    zyskuje napastnik przy jej działaniu, sprowadza się do obecności kodu
    bez zadania. Wartość reguły jest porządkowa i opis powinien to przyznać
    zamiast naciągać uzasadnienie do poziomu sąsiada.

    Warto też zauważyć, że objaw niespójnego wdrożenia — sesja, która raz
    wstaje, a raz nie — jest gorszy od objawu wdrożenia pełnego. Jest to
    rzadki przypadek, w którym wykonanie połowy pracy kosztuje więcej niż
    niewykonanie żadnej.
  en: |
    The item is the only one in this block that does not stand up on its own. Its substance is the
    shutting of the item before it, and carried out without that one it harms more than it helps.

    The application should know that bearing and show it. An advising of the order is conceivable:
    first the service taking connections in, then the one preparing sessions. The reverse order gives
    symptoms nobody will tie to the change, looking as they do like instability.

    The medium category instead of a high one is set in keeping with the criterion. That service does
    not listen and is no road in; what an attacker gains from its working comes to the presence of code
    without a task. The rule's value is one of order and the description ought to own it rather than
    strain the warrant up to its neighbour's level.

    Worth noticing too that the symptom of an inconsistent rollout - a session that now comes up and now
    does not - is worse than the symptom of a full one. It is a rare case in which carrying out half the
    work costs more than carrying out none.
