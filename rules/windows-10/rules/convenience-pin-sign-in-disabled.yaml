id: win10-convenience-pin-sign-in-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie kodem zastępującym hasło domenowe wyłączone
    en: Sign-in with a code standing in for the domain password turned off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ten mechanizm pozwala zalogować się do konta domenowego krótkim kodem zamiast
    hasła. Kod jest wygodny i krótki, a otwiera dokładnie to samo konto, co hasło
    — z tą różnicą, że da się go podejrzeć przez ramię albo odgadnąć z liczby
    kombinacji, których nie ma wiele.

    Trzeba tu odróżnić dwie rzeczy noszące tę samą nazwę. Kod związany z
    poświadczeniem sprzętowym maszyny jest silnym mechanizmem i nie zastępuje
    hasła, tylko odblokowuje klucz. Kod wygodnościowy, o którym mówi ten punkt,
    nie ma za sobą sprzętu i jest po prostu krótszym hasłem.

    Wyłączenie zdejmuje możliwość obniżenia siły uwierzytelnienia decyzją
    pojedynczego użytkownika.
  en: |
    This mechanism allows signing in to a domain account with a short code instead
    of a password. The code is convenient and short, and opens exactly the same
    account as the password - with the difference that it can be watched over a
    shoulder or guessed from a number of combinations that is not large.

    Two things bearing the same name have to be told apart here. A code tied to
    the machine s hardware credential is a strong mechanism and does not replace
    the password, it unlocks a key. The convenience code this item is about has no
    hardware behind it and is simply a shorter password.

    Switching it off removes the ability of a single user to lower the strength of
    authentication by their own decision.

disruption_description:
  pl: |
    Waga zmiany zależy od tego, ilu ludzi zdążyło się na ten sposób przestawić.
    Tam, gdzie kod jest w użyciu, wyłączenie oznacza powrót do wpisywania pełnego
    hasła — i pierwszym skutkiem bywa fala zgłoszeń o zapomnianym haśle, którego
    nikt nie wpisywał od miesięcy.

    Przed wdrożeniem warto sprawdzić, czy w organizacji nie działa mechanizm
    oparty na poświadczeniu sprzętowym maszyny. Ten punkt nie powinien go
    wyłączać, a ustawienia bywają mylone, bo w oknie logowania oba wyglądają tak
    samo.
  en: |
    How heavy the change is depends on how many people have switched over to this
    way of signing in. Where the code is in use, turning it off means returning to
    typing the full password - and the first consequence tends to be a wave of
    reports about a forgotten password nobody has typed for months.

    Before the rollout it is worth checking whether a mechanism based on the
    machine s hardware credential is in use in the organisation. This item should
    not switch that off, and the settings get confused, because in the sign-in
    window the two look the same.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Logowanie krótkim kodem do konta domenowego przestanie być możliwe i wróci wpisywanie pełnego hasła
      - Kody ustawione wcześniej przestaną działać, a użytkownicy zgłoszą to jako utratę dostępu
      - Stanowiska dotykowe, na których kod był jedynym wygodnym sposobem logowania, staną się uciążliwe w obsłudze
      - Odblokowanie maszyny po przerwie będzie wymagało hasła, także przy krótkich odejściach od biurka
      - Konta lokalne, logowanie kartą, poświadczenia sprzętowe maszyny i praca po zalogowaniu pozostają bez zmian
    en:
      - Signing in to a domain account with a short code stops being possible and typing the full password returns
      - Codes set earlier stop working, and users report that as a loss of access
      - Touch stations, where the code was the one convenient way of signing in, become a nuisance to operate
      - Unlocking the machine after a break calls for a password, including after short trips away from the desk
      - Local accounts, signing in with a card, the machine s hardware credentials and work after signing in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Środowiska, w których krótki kod jest jedynym wdrożonym sposobem logowania na stanowiskach dotykowych
      - Organizacje bez przygotowanej obsługi zgłoszeń o zapomnianym haśle przed wdrożeniem
    en:
      - Environments where the short code is the only sign-in method deployed on touch stations
      - Organisations with no handling of forgotten-password reports prepared before the rollout
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDomainPINLogon'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowDomainPINLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainPINLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Punkt dotyczy kodu wygodnościowego, a nie kodu odblokowującego klucz związany
    z poświadczeniem sprzętowym maszyny. Oba noszą w oknie logowania tę samą nazwę
    i bywają mylone, więc przed wdrożeniem warto ustalić, który z nich jest w
    użyciu.
  en: |
    The item covers the convenience code rather than the code unlocking a key tied
    to the machine s hardware credential. In the sign-in window both bear the same
    name and get confused, so before the rollout it is worth establishing which of
    them is in use.
