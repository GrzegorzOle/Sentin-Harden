id: win11-automatic-updates-schedule-mode

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Aktualizacje pobierane i instalowane bez pytania użytkownika
    en: Updates downloaded and installed without asking the user
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Samo włączenie automatycznych aktualizacji nie mówi jeszcze, co się dzieje
    po ich znalezieniu. Tryb rozstrzyga, czy system tylko powiadamia, czy pobiera
    i czeka na zgodę, czy pobiera i instaluje w wyznaczonym czasie.

    Każdy tryb wymagający zgody sprowadza się do tego samego: poprawka leży
    pobrana na dysku i nie działa. Okno między wydaniem poprawki a jej
    zainstalowaniem jest tym, w którym podatność jest już publicznie opisana,
    a maszyna wciąż ją ma — czyli okresem najwyższego ryzyka w całym cyklu życia
    poprawki, nie najniższego. Tryb pytający wydłuża je dokładnie o tyle, ile
    czasu mija, zanim ktoś kliknie.

    Kategoria wysoka bierze się stąd, że mowa o całej klasie podatności naraz,
    a nie o jednym mechanizmie. Instalowanie bez pytania nie zamyka konkretnej
    drogi wejścia — skraca czas, przez który każda kolejna droga pozostaje
    otwarta.
  en: |
    Turning automatic updates on says nothing yet about what happens once updates
    are found. The mode settles whether the system merely notifies, or downloads
    and waits for consent, or downloads and installs at an appointed time.

    Every mode requiring consent amounts to the same thing: the fix sits
    downloaded on the disk and does nothing. The window between a fix being
    released and being installed is the one in which the weakness is already
    publicly described while the machine still has it - the period of highest risk
    in a fix's whole life, not the lowest. A mode that asks lengthens it by
    exactly as long as it takes somebody to click.

    The high category comes from this being about a whole class of weaknesses at
    once rather than one mechanism. Installing without asking closes no particular
    route in - it shortens the time each successive route stays open.

disruption_description:
  pl: |
    Zmiana jest odczuwalna i dlatego wymaga sprawdzenia, choć nie wymaga okna
    serwisowego.

    Użytkownik traci możliwość odłożenia instalacji. Aktualizacje wejdą
    o wyznaczonej porze niezależnie od tego, co akurat jest otwarte — a część
    z nich pociąga za sobą ponowne uruchomienie. Osoba, która zostawia na noc
    otwarte dokumenty albo długo liczący proces, znajdzie rano maszynę po
    restarcie.

    Sprawdzenia wymagają przede wszystkim stanowiska sterujące czymś, co nie
    znosi przerwy: maszyny w produkcji, stanowiska pomiarowe, komputery przy
    urządzeniach pracujących w cyklu. Tam instalacja o stałej porze bywa
    błędem i punkt trzeba świadomie odpuścić albo obudować własnym oknem.

    Na zwykłym stanowisku biurowym zmiana jest kłopotliwa co najwyżej raz
    w miesiącu i mieści się w tym, co ludzie i tak znają z aktualizacji.
  en: |
    The change is felt and so needs checking, though it needs no maintenance
    window.

    The user loses the ability to put the installation off. Updates go in at the
    appointed time regardless of what happens to be open - and some of them pull a
    restart behind them. Somebody who leaves documents open overnight, or a
    long-running computation, will find the machine restarted in the morning.

    What most needs checking are stations controlling something that does not
    tolerate an interruption: machines in production, measurement stations,
    computers attached to equipment running in a cycle. There an installation at a
    fixed hour can be a mistake, and the item has to be deliberately passed over
    or wrapped in a window of one's own.

    On an ordinary office station the change is awkward at most once a month and
    falls within what people already know from updates.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Użytkownik przestanie móc odłożyć instalację aktualizacji na później
      - Instalacja wejdzie o wyznaczonej porze niezależnie od otwartej pracy, a część aktualizacji pociągnie restart
      - Długo liczący proces zostawiony na noc może nie dotrwać do rana
    en:
      - The user can no longer put an update installation off
      - The installation goes in at the appointed hour regardless of open work, and some updates pull a restart behind them
      - A long-running computation left overnight may not survive until morning
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko steruje procesem, w którym instalacja o stałej porze przerywa pracę urządzenia
      - Aktualizacje są wdrażane z wewnętrznego serwera według własnego harmonogramu
    en:
      - The station controls a process where an installation at a fixed hour interrupts a device's work
      - Updates are rolled out from an internal server on a schedule of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'AUOptions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'AUOptions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AUOptions' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-wu-settings

notes:
  pl: |
    Punkt czyta się razem z włączeniem samych automatycznych aktualizacji, ale
    odpowiada na inne pytanie i żaden nie zastępuje drugiego. Tamten mówi, czy
    system w ogóle szuka poprawek; ten, co z nimi robi po znalezieniu. Maszyna
    spełniająca sam tamten punkt potrafi mieć pobrane poprawki, których nikt nie
    zainstalował — i w raporcie wygląda wtedy na zaktualizowaną.

    Naprawa wpisuje tryb pobierania i instalowania według harmonogramu. Sam
    harmonogram jest osobnym punktem i bez niego system użyje wartości domyślnej,
    więc oba warto wdrażać razem.
  en: |
    The item is read together with turning automatic updates on, but answers a
    different question and neither replaces the other. That one says whether the
    system looks for fixes at all; this one, what it does with them once found. A
    machine satisfying only that one can hold downloaded fixes nobody installed -
    and in the report it then looks up to date.

    Remediation writes the mode that downloads and installs on a schedule. The
    schedule itself is a separate item and without it the system uses a default,
    so the two are worth applying together.
