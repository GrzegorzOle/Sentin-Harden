id: win2016-lock-screen-camera-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Personalization
  title:
    pl: Dostęp do aparatu przy zablokowanym ekranie zablokowany
    en: Access to the camera at a locked screen blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje sięganie po aparat z poziomu zablokowanego ekranu.

    Argument jest ten sam co przy punkcie poprzednim i dotyczy tej samej
    granicy. Aparat uruchamiany przed zalogowaniem jest urządzeniem
    dostępnym dla każdego, kto stoi przy maszynie, bez znajomości
    jakiegokolwiek hasła.

    Skutek praktyczny jest dwojaki. Po pierwsze, powstaje obraz i trafia do
    miejsca, do którego ktoś potem sięgnie — a zrobiony został przez osobę,
    której nikt nie uwierzytelnił. Po drugie, uruchomienie urządzenia przed
    zalogowaniem znaczy, że stos obsługi aparatu pracuje po niewłaściwej
    stronie granicy, a jest to stos obszerny, z własnymi sterownikami
    i własną historią usterek.

    Na serwerze aparatu zwykle nie ma i punkt jest wtedy porządkowy. Warto
    go mimo to wykonać: ustawienie obowiązuje także wtedy, gdy aparat
    pojawi się później, a maszyny wirtualne bywają wyposażane w urządzenia
    przekazywane z hosta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchomienia urządzenia i jego sterowników przed przekroczeniem granicy
    uwierzytelnienia.
  en: |
    The setting blocks the reaching for the camera from a locked screen.

    The argument is the same as at the item before and concerns the same boundary. A camera started
    before a logon is a device to be had by anybody standing at the machine, without the knowledge of any
    password.

    The practical consequence is twofold. First, a picture comes into being and lands in a place somebody
    will later reach for - and it was made by a person nobody authenticated. Second, a device's being
    started before a logon means the camera's attending stack works on the wrong side of the boundary,
    and it is a broad stack, with drivers of its own and a history of defects of its own.

    On a server there is as a rule no camera and the item is then one of order. It is worth carrying out
    all the same: the setting holds also where a camera appears later, and virtual machines are at times
    fitted with devices passed through from the host.

    What an attacker gains while the item goes unmet: the chance to start a device and its drivers before
    the boundary of authentication is crossed.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Punkt dotyczy wyłącznie drogi z ekranu blokady. Aparat jako urządzenie
    działa dalej i aplikacje uruchamiane po zalogowaniu korzystają z niego
    tak jak dotąd.

    Rozróżnienie to warto powiedzieć wprost, bo nazwa sugeruje więcej.
    Ustawienie nie wyłącza aparatu, nie odłącza sterownika i nie dotyczy
    rozwiązań konferencyjnych ani monitoringu.

    Na serwerze bez aparatu zmiana nie robi nic poza wpisem w rejestrze.

    Nie ma znanych regresji.

    Czego to nie psuje: pracy aparatu po zalogowaniu, aplikacji
    konferencyjnych, sterowników, urządzeń przekazywanych z hosta,
    usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The item concerns solely the road from the lock screen. The camera as a device works on, and
    applications started after a logon use it as before.

    That distinction is worth saying outright, the name suggesting more. The setting does not switch the
    camera off, does not detach a driver and does not concern conferencing solutions or monitoring.

    On a server without a camera the change does nothing beyond an entry in the registry.

    There are no known regressions.

    What this does not break: the camera's working after a logon, conferencing applications, drivers,
    devices passed through from a host, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Sięganie po aparat z poziomu zablokowanego ekranu przestaje być możliwe
      - Aparat jako urządzenie działa dalej i aplikacje uruchamiane po zalogowaniu korzystają z niego tak jak dotąd
      - Aplikacje konferencyjne, sterowniki i urządzenia przekazywane z hosta pozostają bez zmian
      - Na serwerze bez aparatu zmiana nie robi nic poza wpisem w rejestrze
    en:
      - The reaching for the camera from a locked screen ceases to be possible
      - The camera as a device works on and applications started after a logon use it as before
      - Conferencing applications, drivers and devices passed through from a host stay unchanged
      - On a server without a camera the change does nothing beyond an entry in the registry
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym aparat z ekranu blokady jest świadomie używany do zgłaszania usterek
    en:
      - The machine is a workplace where the camera from the lock screen is knowingly used for reporting defects
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      $name = 'NoLockScreenCamera'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    $name = 'NoLockScreenCamera'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This concerns the camera reached from the lock screen, not the camera as a
    # device. Applications started after a logon use it as before.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLockScreenCamera' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-abovelock

notes:
  pl: |
    Punkt jest w bloku najlżejszy i warto to przyznać. Na serwerze bez
    aparatu jego wartość sprowadza się do tego, że ustawienie będzie już
    na miejscu, gdy urządzenie kiedyś się pojawi.

    Kategoria niska jest postawiona zgodnie z kryterium. Napastnik nie
    zyskuje przy niespełnieniu tego punktu drogi wejścia; zyskuje
    uruchomienie stosu sterowników po niewłaściwej stronie granicy, co jest
    warunkiem, nie zdobyczą.

    Warto pokazywać tę regułę razem z pozostałymi dotyczącymi ekranu
    blokady, jako jedną decyzję. Trzy ustawienia leżą w dwóch różnych
    gałęziach rejestru i w dwóch różnych sekcjach benchmarku, ale
    rozstrzyga się je wspólnie i wspólnie kosztują nic.

    Odnotowuję, że nazwa ustawienia bywa czytana jako wyłączenie aparatu
    w ogóle. Obawa ta prowadzi do odpuszczania punktu na maszynach,
    na których aparat jest używany — i jest bezpodstawna.
  en: |
    The item is the lightest in the block and that is worth owning. On a server without a camera its value
    comes to the setting being already in place when a device one day appears.

    The low category is set in keeping with the criterion. An attacker gains at this item's going unmet no
    road in; they gain the starting of a driver stack on the wrong side of the boundary, which is a
    condition and not a spoil.

    It is worth showing this rule together with the rest about the lock screen, as one decision. Three
    settings lie in two different branches of the registry and in two different sections of the benchmark,
    but they are settled together and together cost nothing.

    Worth noting that the setting's name is at times read as a switching off of the camera altogether.
    That fear leads to the item being let go on machines where a camera is used - and it is groundless.
