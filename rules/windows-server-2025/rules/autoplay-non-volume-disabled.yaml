id: win2025-autoplay-non-volume-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Autoodtwarzanie dla urządzeń niebędących woluminami wyłączone
    en: AutoPlay for devices that are not volumes disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza autoodtwarzanie dla urządzeń, które nie zgłaszają się
    systemowi jako dysk. Aparat, telefon, czytnik, urządzenie
    przedstawiające się własnym protokołem przesyłania plików — wszystkie
    one mają swoją drogę uruchamiania, osobną od tej, którą zamyka reguła
    o rodzajach napędów.

    I to jest cała treść tego punktu, więc powiem ją wprost. Zasada
    wyłączająca autoodtwarzanie operuje rodzajami napędów. Urządzenie,
    które napędem nie jest, do żadnego z tych rodzajów nie należy —
    i przechodzi obok tamtej reguły, chociaż ta wygląda na wyczerpującą.

    Zostawiam kategorię średnią. Na serwerze takie urządzenia pojawiają
    się rzadko, ale warto zauważyć jedną rzecz o charakterze ogólnym:
    urządzenie, które chce zostać uruchomione, a jednocześnie nie
    przedstawia się jako dysk, samym tym połączeniem już coś o sobie
    mówi. Sprzęt podszywający się pod urządzenie wejściowe albo pod
    czytnik to nie jest zjawisko teoretyczne, a serwerownia bywa
    pomieszczeniem, do którego wchodzi więcej osób, niż ma konto na tych
    maszynach.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    uruchomienia kodu przez urządzenie, które celowo nie zgłasza się jako
    dysk, żeby ominąć zasadę mówiącą o dyskach.
  en: |
    The item switches off the self-playing for gear that gives itself out to the system not as a
    disk. A picture-taker, a telephone, a reader, gear setting itself forth by a reckoning of its own
    for the bearing of files - all of them have a road of running of their own, sundered from the one
    the rule about kinds of drives shuts.

    And that is the whole matter of this item, so I shall say it outright. The policy switching off
    the self-playing works by kinds of drives. Gear that is no drive belongs to none of those kinds -
    and passes beside that rule, though the rule looks to leave nothing out.

    I leave the category middling. On a server such gear comes forth seldom, but one thing of a
    general kind is worth marking - gear that would be run and at the same time sets itself not forth
    as a disk says by that very binding something of itself. Gear feigning to be a thing of putting
    in, or a reader, is no matter of theory, and a room of servers is at times a room more people
    come into than have an account upon those machines.

    What an attacker gains while the item goes unmet - a road for the running of code by gear that
    of set purpose gives itself not out as a disk, that it may pass beside the rule speaking of
    disks.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i na serwerze jest to ocena
    łatwa, choć chcę ją uzasadnić inaczej niż przez samo „nie ma tu
    takich urządzeń".

    Zmiana nie odbiera urządzeniu dostępu. Sprzęt podłączony jest dalej
    rozpoznawany, sterownik się ładuje, urządzenie widać w systemie
    i można z niego skorzystać. Wyłączone zostaje wyłącznie
    automatyczne uruchomienie czegoś w chwili podłączenia.

    Na serwerze różnica ta jest bez znaczenia z jednego dodatkowego
    powodu, którego na stacji roboczej nie ma: nawet gdyby okno się
    otworzyło, nie miałby go kto zobaczyć ani w nim kliknąć. Funkcja,
    którą ten punkt wyłącza, na serwerze i tak nie ma odbiorcy.

    Nie znam serwerowej roli, w której automatyczne uruchamianie po
    podłączeniu urządzenia niebędącego dyskiem jest do czegoś potrzebne.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption", and on a server it is an easy reckoning, though I would stand
    by it otherwise than by the bare "there is no such gear here".

    The change takes not from the gear its coming at. Gear bound on is known still, the driver loads,
    the gear is seen in the system and may be made use of. What is switched off is the running of
    something of itself at the hour of the binding on alone.

    On a server that difference is of no weight for one further ground a workstation has not - even
    were the window to open, there would be nobody to see it nor to click in it. The feature this
    item switches off has upon a server no taker anyway.

    I know of no role of a server wherein the running of itself after the binding on of gear that is
    no disk is needed for anything.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
  what_breaks:
    pl:
      - Urządzenie niebędące dyskiem nie uruchomi już niczego samo w chwili podłączenia
      - Sprzęt podłączony jest dalej rozpoznawany, sterownik się ładuje, urządzenie widać w systemie
      - Nawet gdyby okno się otworzyło, na serwerze nie miałby go kto zobaczyć ani w nim kliknąć
      - Zasada o rodzajach napędów nie obejmuje urządzeń, które napędem nie są, choć wygląda na wyczerpującą
      - Brak serwerowej roli, w której automatyczne uruchamianie po podłączeniu takiego urządzenia jest potrzebne
    en:
      - Gear that is no disk will no longer run anything of itself at the hour of the binding on
      - Gear bound on is known still, the driver loads, the gear is seen in the system
      - Even were the window to open, there would be nobody on a server to see it nor to click in it
      - The rule about kinds of drives holds not gear that is no drive, though it looks to leave nothing out
      - No role of a server wherein the running of itself after the binding on of such gear is needed
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      $name = 'NoAutoplayfornonVolume'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    $name = 'NoAutoplayfornonVolume'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # NoDriveTypeAutoRun works by drive type, so a device that is not a drive
    # passes beside it. This value covers exactly that gap.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutoplayfornonVolume' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-autoplay

notes:
  pl: |
    Cała treść punktu mieści się w jednym zdaniu: zasada wyłączająca
    autoodtwarzanie operuje rodzajami napędów, a urządzenie, które
    napędem nie jest, do żadnego z tych rodzajów nie należy — i przechodzi
    obok tamtej reguły, chociaż ta wygląda na wyczerpującą.

    Uwaga ogólna warta zapamiętania: urządzenie, które chce zostać
    uruchomione, a jednocześnie nie przedstawia się jako dysk, samym tym
    połączeniem już coś o sobie mówi. Serwerownia bywa pomieszczeniem, do
    którego wchodzi więcej osób, niż ma konto na tych maszynach.
  en: |
    The whole matter of the item lies in one sentence - the policy switching off the self-playing
    works by kinds of drives, and gear that is no drive belongs to none of those kinds, and passes
    beside that rule though the rule looks to leave nothing out.

    A general marking worth bearing in mind - gear that would be run and at the same time sets itself
    not forth as a disk says by that very binding something of itself. A room of servers is at times
    a room more people come into than have an account upon those machines.
