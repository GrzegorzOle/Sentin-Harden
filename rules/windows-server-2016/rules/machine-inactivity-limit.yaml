id: win2016-machine-inactivity-limit

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Blokada ekranu po okresie bezczynności
    en: Screen lock after a period of inactivity
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje ekran po ustalonym czasie bez aktywności i wymaga okresu
    nie dłuższego niż piętnaście minut.

    Broni przed jedną rzeczą: sesją pozostawioną otwartą. Jest to sytuacja
    banalna i przez to lekceważona, a na serwerze wyjątkowo kosztowna, bo
    sesja pozostawiona na serwerze jest z reguły sesją administratora.

    Napastnik nie musi wtedy zdobywać hasła ani niczego łamać. Wchodzi
    w gotowy kontekst z pełnymi uprawnieniami, a wszystko, co zrobi, zostanie
    zapisane w dzienniku pod nazwiskiem osoby, która sesję zostawiła. To drugie
    bywa gorsze od pierwszego, bo zaciera obraz zdarzenia na długo.

    Na serwerze obraz jest podwójny i warto rozdzielić te dwa przypadki.
    Konsola stoi w serwerowni, więc dostęp do niej ma wąskie grono — ale sesje
    zdalne otwierane z biurek są zupełnie czymś innym. Sesja pulpitu zdalnego,
    rozłączona zamiast zakończonej, żyje dalej na serwerze i czeka. Na maszynie
    z rolą sesji zdalnych to właśnie ten punkt jest rzeczywistą treścią reguły.

    Piętnaście minut jest kompromisem między bezpieczeństwem a wygodą i nie ma
    w tej liczbie nic świętego. Znaczenie ma to, że jakikolwiek limit istnieje,
    a nie jego dokładna wartość.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową sesję
    z uprawnieniami administratora, bez potrzeby uwierzytelniania i z cudzym
    nazwiskiem w dzienniku.
  en: |
    The setting locks the screen after a set time without activity and requires a
    period no longer than fifteen minutes.

    It defends against one thing: a session left open. The situation is a trivial
    one and slighted for that reason, yet on a server it is uncommonly costly,
    because a session left on a server is as a rule an administrator's session.

    The attacker then need obtain no password and break nothing. They step into a
    ready context with full privileges, and everything they do will be written in
    the log under the name of the person who left the session. The second of these
    is at times worse than the first, since it blurs the picture of the event for
    long afterwards.

    On a server the picture is twofold and the two cases are worth keeping apart.
    The console stands in the server room, so few have access to it - but remote
    sessions opened from desks are quite another matter. A remote desktop session,
    disconnected rather than ended, lives on at the server and waits. On a machine
    with the remote sessions role it is exactly this case that is the rule's real
    substance.

    Fifteen minutes is a compromise between safety and convenience and there is
    nothing sacred in the number. What matters is that any limit at all exists, not
    its exact value.

    What an attacker gains while the item goes unmet: a ready session with
    administrator privileges, with no need to authenticate and with somebody else's
    name in the log.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo zmiana jest widoczna dla każdego, kto na tej
    maszynie pracuje, i bo ma jeden scenariusz, w którym potrafi realnie
    zaszkodzić.

    Tym scenariuszem są okna otwarte na stałe. Serwer często wyświetla coś,
    na co się patrzy, a nie w czym się klika: konsolę monitoringu, wykres
    obciążenia, widok kolejki. Przy włączonej blokadzie ekran gaśnie po
    kwadransie i taki podgląd przestaje spełniać swoje zadanie. Rozwiązaniem
    jest wydzielenie takiej maszyny albo takiego ekranu, a nie rezygnacja
    z blokady wszędzie.

    Drugi scenariusz dotyczy długich operacji prowadzonych z sesji graficznej —
    instalacji, migracji, konwersji. Blokada ekranu ich nie przerywa i to warto
    powiedzieć wprost, bo obawa jest powszechna. Przerywa je natomiast
    rozłączenie sesji, a to zupełnie inne ustawienie.

    Trzeci to starsze aplikacje okienkowe, które po odblokowaniu ekranu tracą
    połączenie z bazą albo gubią stan formularza. Zdarza się to rzadko, ale
    zdarza — i jest to jedyny przypadek, w którym blokada faktycznie coś psuje.

    Czego to nie psuje: zadań w tle, usług, operacji uruchomionych z sesji ani
    sesji zdalnych rozłączonych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because the change is visible to everybody working
    at the machine, and because it has one scenario in which it can genuinely do
    harm.

    That scenario is windows left open for good. A server often displays something
    that is looked at rather than clicked in: a monitoring console, a load chart, a
    queue view. With the lock on, the screen goes dark after a quarter of an hour
    and such a view stops serving its purpose. The answer is to set such a machine
    or such a screen apart, not to give up the lock everywhere.

    The second scenario concerns long operations carried on from a graphical session
    - installations, migrations, conversions. The screen lock does not interrupt
    them, and that is worth saying outright, since the fear is a common one. What
    does interrupt them is the disconnecting of the session, and that is quite
    another setting.

    The third is older windowed applications that lose their connection to a
    database or mislay a form's state once the screen is unlocked. It happens
    seldom, but it happens - and it is the one case in which the lock genuinely
    breaks something.

    What this does not break: background tasks, services, operations started from a
    session, or disconnected remote sessions.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - legacy-applications
  what_breaks:
    pl:
      - Konsola monitoringu albo wykres wyświetlany na stałe gaśnie po kwadransie i przestaje pełnić swoją rolę
      - Starsze aplikacje okienkowe potrafią po odblokowaniu ekranu zgubić połączenie z bazą albo stan formularza
      - Każdy powrót do sesji wymaga ponownego podania hasła, co przy pracy przerywanej czuć kilkanaście razy dziennie
      - Zadania w tle, usługi i operacje uruchomione z sesji biegną dalej bez przeszkód
    en:
      - A monitoring console or a chart displayed permanently goes dark after a quarter of an hour and stops serving its role
      - Older windowed applications can lose their database connection or a form's state once the screen is unlocked
      - Every return to the session calls for the password again, felt a dozen times a day where work is interrupted
      - Background tasks, services and operations started from a session run on unhindered
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna służy jako stały podgląd — konsola monitoringu, wykres obciążenia, widok kolejki
      - Pracują na niej starsze aplikacje okienkowe znane z gubienia stanu po odblokowaniu ekranu
    en:
      - The machine serves as a permanent view - a monitoring console, a load chart, a queue view
      - Older windowed applications run on it, known for mislaying their state once the screen is unlocked
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'InactivityTimeoutSecs'
      $value = $null
      if (Test-Path -Path $path -ErrorAction Stop) {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
      }
      # Zero means 'never lock' and is a misconfiguration, not a large timeout - it
      # must not slip through a numeric comparison as a small value.
      if ($null -eq $value -or [int]$value -eq 0) { 'NEVER' } else { [string]$value }
    } catch {
      'CHECK_ERROR'
    }
  expected: '900'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'InactivityTimeoutSecs'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Fifteen minutes expressed in seconds. Zero would mean never locking, so the
    # audit reports it apart rather than letting it pass as a small number.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'InactivityTimeoutSecs' -Value 900 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-machine-inactivity-limit

notes:
  pl: |
    Audyt zgłasza wartość zero jako osobny stan, a nie jako liczbę. Zero
    oznacza „nigdy nie blokuj" i przy porównaniu liczbowym przeszłoby jako
    wartość najmniejsza z możliwych — czyli błąd konfiguracji zostałby
    zaraportowany jako wzorowa zgodność. To jest sedno tej reguły, nie detal
    implementacji.

    Punkt czyta się razem z ustawieniami limitów sesji pulpitu zdalnego. One
    rozstrzygają, co się dzieje z sesją rozłączoną, a ten punkt — co się dzieje
    z sesją otwartą, przy której nikt nie siedzi. Bez tamtych ta reguła zamyka
    tylko połowę problemu.

    Porównanie jest typu „nie więcej niż", więc krótszy czas jest zgodny.
  en: |
    The audit reports a value of zero as a state apart, not as a number. Zero means
    "never lock" and under a numeric comparison would pass as the smallest value
    possible - which is to say a misconfiguration would be reported as exemplary
    compliance. That is the heart of this rule, not a detail of its implementation.

    The item reads together with the remote desktop session limits. Those settle
    what happens to a disconnected session, and this item what happens to an open
    session nobody is sitting at. Without them this rule closes only half the
    problem.

    The comparison is of the "not greater than" kind, so a shorter time is
    compliant.
