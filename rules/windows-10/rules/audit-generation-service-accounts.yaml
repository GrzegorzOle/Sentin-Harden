id: win10-audit-generation-service-accounts

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Generowanie wpisów inspekcji ograniczone do kont usługowych
    en: The making of audit entries bounded to the service accounts
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozostawia prawo zapisywania wpisów w dzienniku zabezpieczeń
    wyłącznie dwóm kontom usługowym, którymi posługuje się sam system.

    Konto posiadające to prawo dopisuje do dziennika zabezpieczeń wpisy
    własnej treści. Nie zmienia wpisów istniejących i niczego nie usuwa —
    dopisuje. Skutek jest jednak ten sam co przy usuwaniu, tylko osiągnięty
    z drugiej strony: dziennik zalany wpisami wytworzonymi traci wartość
    dowodową, a wpisy prawdziwe wypadają z niego jako najstarsze.

    Jest to sposób na zatarcie śladów odporniejszy niż wyczyszczenie
    dziennika, bo nie zostawia po sobie pustki. Dziennik pozostaje pełny,
    ciągły i pozornie nietknięty.

    Odnotowuję rzecz istotną dla oceny stanu zastanego: prawa tego nie
    potrzebuje żadne oprogramowanie użytkowe. Konto spoza dwóch systemowych,
    znalezione tu przy audycie, ktoś dopisał — i pytanie o to, kto i po co,
    bywa ciekawsze niż sama naprawa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wypełnienia dziennika zabezpieczeń treścią własną i wyparcia z niego
    zapisów prawdziwych.
  en: |
    The setting leaves the right of writing entries into the security log to the two service accounts the system
    itself works by alone.

    An account holding that right writes into the security log entries of its own making. It changes no existing
    entry and takes nothing away - it writes. The consequence is nonetheless the same as at a taking away, only
    come at from the other side: a log flooded with made-up entries loses its worth as evidence, and the true
    entries fall out of it as the oldest.

    It is a means of covering traces hardier than the emptying of a log, leaving no void behind it. The log
    stays full, unbroken and seemingly untouched.

    I set down a thing that matters to the judgement of the state found: no working software needs that right.
    An account outside the two of the system, found here at an audit, was written in by somebody - and the
    question who and to what end is at times more interesting than the mending itself.

    What an attacker gains while the item goes unmet: the power to fill the security log with matter of their
    own and to crowd the true records out of it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Prawo to jest domyślnie przypisane dwóm kontom systemowym i reguła
    zwykle potwierdza stan zastany.

    Skutek mógłby wystąpić wyłącznie tam, gdzie dopisano konto własne.
    Oprogramowania wymagającego tego prawa w praktyce nie ma, a narzędzia
    zabezpieczające zapisujące zdarzenia korzystają z dzienników własnych
    albo z kont systemowych.

    Odnotowuję przerwę: prawa tego rodzaju wchodzą przy następnym
    zalogowaniu konta, którego dotyczą. Usługa pracująca na koncie
    usuniętym z tego prawa zachowa je aż do restartu tej usługi.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: zapisywania zdarzeń przez system, dzienników
    aplikacji, logowania, kont domenowych, udziałów plikowych, drukowania.
  en: |
    The class is "no disruption".

    That right is by default granted to two accounts of the system, and the rule as a rule confirms the state
    found.

    A consequence could come up only where an account of one's own had been written in. Software calling for
    that right there is in practice none, and guarding tools that write events down use logs of their own or the
    system's accounts.

    I set down the break: rights of this kind take hold at the next logging on of the account they touch. A
    service running upon an account taken out of that right will keep it until that service is restarted.

    There are no known regressions for everyday work.

    What this does not break: the writing down of events by the system, applications' logs, logging on, domain
    accounts, file shares, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Usługa pracująca na koncie usuniętym z tego prawa zachowa je aż do restartu tej usługi
      - Konto dopisane świadomie traci możliwość zapisywania wpisów w dzienniku zabezpieczeń
      - Narzędzia zabezpieczające korzystają z dzienników własnych albo z kont systemowych, więc zmiana ich nie dotyczy
      - Zapisywanie zdarzeń przez sam system nie zmienia się wcale
      - Dzienniki aplikacji, logowanie, konta domenowe, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A service running upon an account taken out of that right will keep it until that service is restarted
      - An account written in knowingly loses the means of writing entries into the security log
      - Guarding tools use logs of their own or the system s accounts, so the change does not touch them
      - The writing down of events by the system itself does not change at all
      - Applications logs, logging on, domain accounts, file shares and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa usługa, której konto dopisano do tego prawa świadomie i której nie da się jeszcze zastąpić
    en:
      - A service works upon the machine whose account was written into that right knowingly and which cannot yet be replaced
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeAuditPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left with the two service accounts the system itself works by.
    # An account holding it writes into the security log entries of its own making.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeAuditPrivilege = *S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeAuditPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/generate-security-audits

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną, która nie włącza zapisu, tylko
    go broni. Wszystkie pozostałe mówią, co ma trafiać do dziennika; ta
    mówi, komu wolno tam pisać.

    Argument wart postawienia wprost dotyczy kierunku ataku na dziennik.
    Oczekuje się usuwania, a tańsze i skuteczniejsze jest dopisywanie —
    bo dziennik zalany treścią wytworzoną wygląda na nietknięty, a jego
    wartość dowodowa jest wtedy zerowa.

    Odnotowuję, że sprawdzenie uznaje za zgodny także wykaz pusty.
    Odebranie prawa obu kontom systemowym nie jest stanem zalecanym, ale
    jest stanem ostrzejszym niż wymagany i nie zasługuje na wynik
    niezgodny. Maszyna w tym stanie ma inny problem, o którym powiedzą inne
    reguły.
  en: |
    The rule closes the block and is the only one in it that switches on no record but guards one. All the rest
    say what is to come into the log; this says who may write there.

    The argument worth putting outright touches the quarter from which a log is attacked. A taking away is
    looked for, while the cheaper and the surer means is a writing in - a log flooded with made-up matter looking
    untouched, while its worth as evidence is then nought.

    I set down that the check holds as compliant an empty roll as well. Taking the right from both of the
    system's accounts is no recommended state, but it is a state harder than the one called for and does not earn
    an outcome of fault. A machine in that state has another problem, of which other rules will speak.
