id: win11-add-workstations-to-domain-administrators

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dodawanie stacji roboczych do domeny zastrzeżone dla administratorów
    en: Adding workstations to the domain restricted to administrators
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Uprawnienie pozwala utworzyć w katalogu konto komputera — czyli wprowadzić
    do domeny nową maszynę. Konto komputera jest pełnoprawną tożsamością:
    uwierzytelnia się, dostaje polityki i bywa obdarzane zaufaniem, którego
    zwykłe konto użytkownika nie ma.

    Konto zdolne dodawać maszyny do domeny może więc tworzyć tożsamości
    z pominięciem procesu, w którym ktoś takie konto zatwierdza. Maszyna
    wprowadzona tą drogą wygląda w katalogu jak każda inna, a jej konto bywa
    punktem wyjścia do sięgnięcia po więcej. Na stacji roboczej uprawnienie nie
    ma żadnego zastosowania i lista powinna być pusta albo obejmować wyłącznie
    administratorów.
  en: |
    The right allows a computer account to be created in the directory - that is,
    a new machine to be brought into the domain. A computer account is a
    full-fledged identity: it authenticates, receives policies and is sometimes
    granted trust an ordinary user account does not have.

    An account able to add machines to the domain can therefore create identities
    bypassing the process in which somebody approves such an account. A machine
    brought in this way looks like any other in the directory, and its account can
    be a starting point for reaching further. On a workstation the right has no
    application at all and the list should be empty or hold administrators alone.

disruption_description:
  pl: |
    Nic. Uprawnienie ma znaczenie na kontrolerze domeny, nie na stacji roboczej —
    tutaj jego obecność na liście niczego nie uruchamia i jego brak niczego nie
    zatrzymuje.

    Dołączenie tej maszyny do domeny odbywa się na poświadczeniach podanych przy
    dołączaniu i sprawdzanych po stronie kontrolera, a nie na podstawie wpisu na
    tej liście. Zmiana nie wpływa więc ani na obecne członkostwo w domenie, ani
    na możliwość dołączenia maszyny w przyszłości.
  en: |
    Nothing. The right matters on a domain controller, not on a workstation - here
    its presence on the list starts nothing and its absence stops nothing.

    Joining this machine to a domain runs on credentials supplied at join time and
    checked on the controller's side, not on an entry in this list. The change
    therefore affects neither current domain membership nor the ability to join
    the machine in future.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Na stacji roboczej nie przestaje działać nic, bo uprawnienie nie ma tu zastosowania
      - Konta dopisane do listy ręcznie stracą to uprawnienie po zmianie
    en:
      - On a workstation nothing stops working, because the right has no application here
      - Accounts added to the list by hand lose the right after the change
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę kontrolera domeny albo jest do tej roli przygotowywana
    en:
      - The machine acts as a domain controller or is being prepared for that role
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeMachineAccountPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeMachineAccountPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeMachineAccountPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/add-workstations-to-domain

notes:
  pl: |
    Punkt należy do tej samej grupy co włączanie delegowania i synchronizowanie
    danych katalogu: na stacji roboczej jest wyłącznie sprawdzeniem, a właściwe
    znaczenie zyskuje dopiero na kontrolerze domeny. Trzymamy go w paczce mimo
    to, bo wpis na liście na stacji roboczej mówi coś o tym, jak ta maszyna była
    konfigurowana.

    Niezależnie od tej listy w katalogu obowiązuje osobne ograniczenie liczby
    maszyn, które jeden użytkownik może dołączyć. To ustawienie leży po stronie
    domeny i żadna reguła tej paczki go nie dotyczy — warto o tym wiedzieć,
    zanim uzna się drogę tworzenia kont komputerów za zamkniętą.
  en: |
    The item belongs to the same group as enabling delegation and synchronising
    directory data: on a workstation it is a check and nothing more, gaining its
    real meaning only on a domain controller. We keep it in the pack regardless,
    because an entry on the list on a workstation says something about how the
    machine was configured.

    Independently of this list, the directory enforces a separate limit on how
    many machines one user may join. That setting lives on the domain side and no
    rule in this pack touches it - worth knowing before considering the route to
    creating computer accounts closed.
