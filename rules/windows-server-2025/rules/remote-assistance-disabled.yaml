id: win2025-remote-assistance-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Assistance
  title:
    pl: Pomoc zdalna wyłączona
    en: Remote Assistance disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza pomoc zdalną, czyli mechanizm pozwalający
    zaprosić drugą osobę do wglądu w sesję i do przejęcia nad nią
    sterowania.

    Podnoszę tu kategorię ryzyka względem paczki stanowiska roboczego
    i powód jest jeden, ale mocny: jest to drugie wejście do maszyny,
    a wszystko, co ustalono o pierwszym, do niego nie stosuje się wcale.

    Warto tę myśl rozwinąć, bo w tym leży cała treść punktu. Zespół
    utrzymujący serwer wymusza na pulpicie zdalnym uwierzytelnianie
    przed zestawieniem sesji, ustala warstwę zabezpieczeń na protokół
    szyfrujący, podnosi poziom szyfrowania i szyfruje kanał zarządzania.
    Pomoc zdalna jest osobnym mechanizmem, z osobnym sposobem wpuszczania
    ludzi do środka, i żadne z tych ustawień jej nie dotyczy. Drzwi
    wejściowe są opancerzone, a obok nich stoją drugie, o których nikt
    nie pamięta.

    Na serwerze rzecz waży tym bardziej, że pomoc zdalna jest tam
    narzędziem bez zastosowania. Powstała po to, żeby człowiek siedzący
    przy komputerze mógł poprosić kogoś o pomoc i pokazać mu swój ekran.
    Przy serwerze nikt nie siedzi. Zostaje mechanizm, który nikomu nie
    służy, a działa.

    Zysk napastnika jest przy tym konkretny. Pomoc zdalna daje wgląd
    w cudzą sesję i sterowanie nią, czyli pracę na cudzych uprawnieniach
    — a na serwerze terminali sesji jest wiele i część z nich należy do
    osób o uprawnieniach wysokich.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drugą
    drogę wejścia do sesji na serwerze, nieobjętą żadnym z ustawień
    chroniących pulpit zdalny.
  en: |
    The setting switches off remote assistance, that is the mechanism letting a second person be
    bidden to look into a session and to take the steering of it.

    I raise the category of risk here against the working station's pack, and the reason is one but
    strong: it is a second way into the machine, and all that was settled about the first does not
    hold for it at all.

    The thought is worth unfolding, for in it lies the item's whole substance. The team keeping the
    server forces upon remote desktop an authentication before a session is set up, fixes the
    security layer to the encrypting protocol, raises the level of encryption and encrypts the
    channel of management. Remote assistance is a mechanism apart, with a way of its own of letting
    people in, and none of those settings bears on it. The front door is armoured and beside it
    stands a second one nobody remembers.

    On a server the matter weighs the more for remote assistance being there a tool without use. It
    arose so that a person sitting at a computer might ask somebody for help and show them their
    screen. At a server nobody sits. There is left a mechanism that serves nobody and runs.

    The attacker's gain is withal definite. Remote assistance gives a sight into another's session
    and the steering of it, that is work with another's rights - and on a terminal server the
    sessions are many and some of them belong to people with high rights.

    What an attacker gains while the item goes unmet: a second road into a session on the server,
    taken in by none of the settings guarding remote desktop.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno i w większości instalacji odpowiedź brzmi
    „nikt tego nie używa", ale są dwa przypadki, w których brzmi inaczej.

    Pierwszy to pomoc techniczna na serwerze terminali. Tam, gdzie
    w sesjach pracują ludzie spoza działu informatyki, wsparcie bywa
    zorganizowane właśnie tak: użytkownik zgłasza problem, dostaje
    zaproszenie i pokazuje swój ekran. Po zmianie ta droga znika
    i trzeba ją czymś zastąpić, zanim się ją odetnie.

    Drugi to narzędzia zbudowane na tym mechanizmie. Część systemów
    obsługi zgłoszeń i część narzędzi dostawców korzysta z pomocy
    zdalnej pod spodem, nie nazywając tego wprost. Objawem jest wtedy
    przycisk „połącz z użytkownikiem", który przestaje działać, przy
    komunikacie niemówiącym nic o pomocy zdalnej.

    Warto odróżnić to od podglądu sesji wbudowanego w usługi pulpitu
    zdalnego. Podglądanie sesji na serwerze terminali jest osobnym
    mechanizmem, z osobnym ustawieniem, i ta zmiana go nie wyłącza.
    Zespół, który podgląda sesje tamtą drogą, zmiany nie zauważy.

    Na serwerze bez sesji użytkowników — a więc na większości serwerów —
    zmiana jest całkowicie niewidoczna.

    Zmiana wchodzi w życie od razu, bez restartu, i cofa się
    natychmiast. Trwające sesje pomocy zdalnej nie są przerywane, ale
    nowej nie da się już nawiązać.
  en: |
    One thing needs checking, and in most installations the answer runs "nobody uses it", but there
    are two cases where it runs otherwise.

    The first is technical help on a terminal server. Where people from outside the department of
    computing work in the sessions, support is at times ordered just so: the user reports a
    trouble, gets an invitation and shows their screen. After the change that road vanishes and
    something must take its place before it is cut off.

    The second is tools built upon this mechanism. Some systems for the handling of reports and
    some vendors' tools use remote assistance underneath without naming it outright. The symptom is
    then a button "connect with the user" that stops working, with a message saying nothing about
    remote assistance.

    It is worth telling apart from the watching of sessions built into the remote desktop services.
    The watching of a session on a terminal server is a mechanism apart, with a setting apart, and
    this change does not switch it off. A team that watches sessions by that road will not notice
    the change.

    On a server without users' sessions - and so on most servers - the change is wholly unseen.

    The change comes into force straight away, with no restart, and is undone at once. Running
    sessions of remote assistance are not broken, but a new one can no longer be opened.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Pomoc techniczna oparta na zaproszeniu wysyłanym przez użytkownika przestanie być możliwa
      - Narzędzie obsługi zgłoszeń korzystające z tego mechanizmu pod spodem przestanie łączyć się z użytkownikiem
      - Komunikat o błędzie nie mówi nic o pomocy zdalnej, więc przyczyna nie jest oczywista
      - Podgląd sesji wbudowany w usługi pulpitu zdalnego jest osobnym mechanizmem i działa dalej
      - Na serwerze bez sesji użytkowników zmiana jest całkowicie niewidoczna
    en:
      - Technical help resting on an invitation sent by the user stops being possible
      - A tool for the handling of reports using this mechanism underneath will stop connecting with the user
      - The message of the fault says nothing about remote assistance, so the cause is not plain
      - The watching of sessions built into the remote desktop services is a mechanism apart and works on
      - On a server without users' sessions the change is wholly unseen
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wsparcie użytkowników serwera terminali opiera się na zaproszeniu do pomocy zdalnej
      - Narzędzie obsługi zgłoszeń korzysta z tego mechanizmu, a nie ma dla niego zastępstwa
    en:
      - The support of a terminal server's users rests on an invitation to remote assistance
      - A tool for the handling of reports uses this mechanism and there is no stand-in for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $name = 'fAllowToGetHelp'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
    $name = 'fAllowToGetHelp'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Running sessions of assistance are not broken. A new one is not opened.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
      -Name 'fAllowToGetHelp' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Kategorię podniosłem względem paczki stanowiska roboczego, bo na
    serwerze jest to drugie wejście do maszyny, a wszystko, co ustalono
    o pierwszym, do niego się nie stosuje. Drzwi wejściowe są
    opancerzone, a obok nich stoją drugie, o których nikt nie pamięta.

    Pomoc zdalna powstała dla człowieka siedzącego przy komputerze.
    Przy serwerze nikt nie siedzi, więc zostaje mechanizm, który nikomu
    nie służy, a działa.

    Nie mylić z podglądem sesji wbudowanym w usługi pulpitu zdalnego —
    to osobny mechanizm z osobnym ustawieniem i ta zmiana go nie
    wyłącza.
  en: |
    I raised the category against the working station's pack, it being on a server a second way
    into the machine, and all that was settled about the first not holding for it. The front door
    is armoured and beside it stands a second one nobody remembers.

    Remote assistance arose for a person sitting at a computer. At a server nobody sits, so there
    is left a mechanism that serves nobody and runs.

    Not to be mistaken for the watching of sessions built into the remote desktop services - that
    is a mechanism apart with a setting apart, and this change does not switch it off.
