id: win2016-removable-media-format-eject-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Formatowanie i wysuwanie nośników wymiennych zastrzeżone dla administratorów
    en: The formatting and ejecting of removable media reserved for administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega formatowanie i wysuwanie nośników wymiennych dla
    administratorów.

    Punkt jest wąski i warto to przyznać na początku. Dotyczy jednej
    czynności przy jednym rodzaju sprzętu, a na serwerze w szafie nośników
    wymiennych zwykle nie ma.

    Argument, który go broni, jest dwuczęściowy. Pierwsza część: nośnik
    wysunięty to nośnik zabrany, a formatowanie to zniszczenie zawartości
    bez śladu w postaci usuniętych plików. Obie czynności są nieodwracalne
    i obie da się wykonać w kilka sekund.

    Druga część jest ważniejsza. Wymaganie uprawnień administratora nie
    robi z tego rzeczy niemożliwej, ale przesuwa ją do kręgu osób, których
    jest mniej i których działania łatwiej powiązać z człowiekiem. Jest to
    zysk w rozliczalności, nie w obronie, i tak należy o nim mówić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    sformatowania albo zabrania nośnika bez uprawnień administratora.
  en: |
    The setting reserves the formatting and ejecting of removable media for administrators.

    The item is a narrow one and that is worth owning at the outset. It concerns one act at one kind of gear, and on a
    server in a cabinet there are as a rule no removable media.

    The argument defending it has two parts. The first part: a medium ejected is a medium taken, and a formatting is a
    destroying of the contents without the trace that deleted files leave. Both acts are past undoing and both can be
    done in a few seconds.

    The second part is the weightier. Calling for an administrator's rights does not make the thing impossible, but
    moves it into a circle of people who are fewer and whose acts are easier to tie to a person. It is a gain in
    accountability, not in defence, and so it ought to be spoken of.

    What an attacker gains while the item goes unmet: the chance to format or to take a medium without an
    administrator's rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć rzecz do sprawdzenia jest niewielka.

    Ustalić trzeba, czy ktokolwiek bez uprawnień administratora obsługuje
    na tej maszynie nośniki wymienne. Zdarza się to tam, gdzie kopie
    zapasowe wynosi się na taśmach albo dyskach przenoszonych ręcznie,
    a robi to osoba bez pełnych uprawnień.

    Jeżeli tak jest, po zmianie taka osoba nie sformatuje nośnika ani go
    nie wysunie z poziomu systemu. Nośnik da się nadal odłączyć fizycznie,
    tylko system potraktuje to jako odłączenie nagłe — a przy zapisie
    w toku znaczy to uszkodzony zapis.

    Na maszynie bez nośników wymiennych zmiana nie robi nic.

    Czego to nie psuje: odczytu i zapisu na nośnikach już podłączonych,
    dysków stałych, udziałów sieciowych, kopii zapasowych robionych po
    sieci, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though the thing to be established is a small one.

    It has to be settled whether anybody without an administrator's rights handles removable media on this machine. That
    happens where backups are carried off on tapes or on disks moved by hand, and it is done by a person without full
    rights.

    If it is so, after the change such a person will neither format a medium nor eject it from within the system. The
    medium can still be detached physically, only the system will treat it as a sudden detaching - and with a writing in
    progress that means a damaged writing.

    On a machine without removable media the change does nothing.

    What this does not break: the reading and writing on media already attached, fixed disks, network shares, backups
    made over the network, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - removable-media
  what_breaks:
    pl:
      - Osoba bez uprawnień administratora nie sformatuje nośnika wymiennego ani nie wysunie go z poziomu systemu
      - Fizyczne odłączenie nośnika pozostaje możliwe, ale system potraktuje je jako odłączenie nagłe
      - Przy zapisie w toku odłączenie nagłe oznacza uszkodzony zapis, a nie tylko komunikat
      - Odczyt i zapis na nośnikach już podłączonych oraz dyski stałe pozostają bez zmian
      - Udziały sieciowe, kopie zapasowe robione po sieci i usługi systemowe pozostają bez zmian
    en:
      - A person without an administrator's rights will neither format a removable medium nor eject it from within the system
      - Detaching the medium physically stays possible, but the system will treat it as a sudden detaching
      - With a writing in progress a sudden detaching means a damaged writing and not merely a message
      - The reading and writing on media already attached and fixed disks stay unchanged
      - Network shares, backups made over the network and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nośniki wymienne obsługuje na tej maszynie osoba bez uprawnień administratora
      - Kopie zapasowe wynosi się z tej maszyny na nośnikach przenoszonych ręcznie
    en:
      - Removable media are handled on this machine by a person without an administrator's rights
      - Backups are carried off this machine on media moved by hand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is kept as text, not a number, so it is compared as text.
      # Reading it numerically would turn an absent value into a zero and report
      # a machine with no setting at all as satisfying the item.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'AllocateDASD'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'AllocateDASD'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is text despite looking like a number. Written as a number it
    # would not be read back by the mechanism that uses it.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllocateDASD' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/devices-allowed-to-format-and-eject-removable-media

notes:
  pl: |
    Punkt jest czwarty w bloku i najwęższy. Opis powinien to przyznać,
    zamiast dorabiać mu wagę.

    Argument wart zachowania dotyczy rozliczalności, nie obrony.
    Wymaganie uprawnień administratora nie czyni czynności niemożliwą,
    tylko przesuwa ją do kręgu osób, których jest mniej i których
    działania łatwiej powiązać z człowiekiem. Postawienie tego wprost
    jest uczciwsze niż opisywanie punktu jako blokady.

    Pułapka warta wyróżnienia dotyczy typu wartości. Wpis jest tekstem,
    mimo że wygląda na liczbę. Zapisany jako liczba nie zostanie
    odczytany przez mechanizm, który z niego korzysta, a audyt czytający
    go liczbowo zamieniłby brak wartości w zero i zgłosił maszynę bez
    ustawienia jako spełniającą punkt. Jest to dokładnie ten rodzaj
    pomyłki, który daje zgodność pozorną.

    Odnotowuję, że reguła dzieli klucz z punktem o zwłoce przed
    zablokowaniem ekranu. Gałąź logowania zbiera ustawienia o różnym
    przeznaczeniu i przy czytaniu kopii zapasowej warto o tym pamiętać.
  en: |
    The item is the fourth in the block and the narrowest. The description ought to own that rather than get up a weight
    for it.

    The argument worth keeping concerns accountability, not defence. Calling for an administrator's rights does not make
    the act impossible, only moves it into a circle of people who are fewer and whose acts are easier to tie to a person.
    Setting that down outright is more honest than describing the item as a block.

    A trap worth setting apart concerns the value's type. The entry is text, though it looks a number. Written as a
    number it will not be read by the mechanism that uses it, and an audit reading it numerically would turn an absent
    value into a zero and report a machine with no setting as meeting the item. It is exactly that kind of mistake which
    gives a seeming compliance.

    Worth noting that the rule shares its key with the item about the delay before the screen locks. The logon branch
    gathers settings of different purposes and that is worth keeping in mind when reading the backup.
