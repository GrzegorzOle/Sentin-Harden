id: iis-ssl-required-on-resources

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Transport Encryption
  title:
    pl: Połączenie szyfrowane wymagane do zasobów
    en: An encrypted connection required to reach the resources
  level: 1
  profile: application

platform:
  system: iis

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer może obsługiwać ten sam zasób po połączeniu szyfrowanym i po
    nieszyfrowanym. Samo posiadanie certyfikatu niczego nie przesądza — dopóki
    droga otwarta pozostaje dostępna, zawsze ktoś nią pójdzie.

    Konsekwencje są dokładnie takie, jak przy każdym ruchu bez szyfrowania: hasła,
    ciasteczka sesji i treść dokumentów idą siecią otwartym tekstem. W sieci
    współdzielonej odczytanie ich nie wymaga niczego poza nasłuchem. Gorzej — ruch
    nieszyfrowany daje się po drodze zmienić, więc odwiedzający może dostać stronę
    logowania, której serwer nigdy nie wysłał.

    Wymaganie szyfrowania zamyka drogę otwartą, zamiast liczyć na to, że nikt jej
    nie wybierze.
  en: |
    The server may serve the same resource over an encrypted connection and over
    an unencrypted one. Holding a certificate settles nothing by itself - as long
    as the open road stays available, somebody always takes it.

    The consequences are exactly those of any traffic without encryption -
    passwords, session cookies and the contents of documents travel the network in
    the clear. On a shared network reading them calls for nothing beyond listening.
    Worse - unencrypted traffic can be altered on the way, so a visitor may receive
    a login page the server never sent.

    Requiring encryption shuts the open road instead of counting on nobody taking
    it.

disruption_description:
  pl: |
    To jest zmiana wymagająca świadomego wdrożenia i najostrzejsza w całej paczce.
    Zapisana na poziomie serwera odcina natychmiast każdy zasób dostępny bez
    szyfrowania — łącznie z tymi, o których nikt nie pamiętał.

    Warunkiem jest komplet: ważny certyfikat na każdej witrynie, powiązanie dla
    połączenia szyfrowanego na każdym adresie, przekierowanie z adresu otwartego.
    Brak któregokolwiek z tych elementów oznacza, że zasób po prostu przestaje
    odpowiadać.

    Osobno trzeba wskazać dwa przypadki, w których ta zmiana jest błędem. Pierwszy
    to adres wystawiony wyłącznie po to, żeby przekierować na szyfrowany —
    wymuszenie szyfrowania na nim likwiduje samo przekierowanie. Drugi to ścieżka
    sprawdzania własności domeny przy odnawianiu certyfikatu, która z założenia
    wywoływana jest bez szyfrowania. Oba wymagają wyjątku na swoim poziomie.
  en: |
    This is a change calling for a planned rollout and the sharpest in the whole
    pack. Written at server level it cuts off at once every resource reachable
    without encryption - including those nobody remembered.

    The condition is a full set - a valid certificate on every site, a binding for
    the encrypted connection on every address, a redirection from the open address.
    Any one of those missing means the resource simply stops answering.

    Two cases where this change is a mistake have to be named apart. The first is
    an address exposed solely in order to redirect to the encrypted one - requiring
    encryption on it does away with the redirection itself. The second is the path
    for proving ownership of a domain when a certificate is renewed, which by
    design is called without encryption. Both call for an exception at their own
    level.

implementation_consequences:
  impact_areas:
    - web-server-services
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Każdy zasób dostępny bez szyfrowania przestanie odpowiadać natychmiast po zapisie
      - Adres wystawiony wyłącznie po to, żeby przekierować na szyfrowany, przestanie przekierowywać
      - Ścieżka sprawdzania własności domeny przy odnawianiu certyfikatu przestanie działać i odnowienie się nie powiedzie
      - Witryny bez ważnego certyfikatu albo bez powiązania dla połączenia szyfrowanego staną się niedostępne
      - Integracje wywołujące zasób po adresie bez szyfrowania zaczną dostawać odmowę
    en:
      - Every resource reachable without encryption stops answering at once after the write
      - An address exposed solely in order to redirect to the encrypted one stops redirecting
      - The path for proving domain ownership on certificate renewal stops working and the renewal fails
      - Sites without a valid certificate or without a binding for the encrypted connection become unreachable
      - Integrations calling the resource at an address without encryption begin receiving a refusal
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwery, na których choć jedna witryna nie ma ważnego certyfikatu albo powiązania dla połączenia szyfrowanego
      - Adresy istniejące wyłącznie po to, żeby przekierować ruch na wersję szyfrowaną
      - Zasoby obsługujące ścieżkę sprawdzania własności domeny przy odnawianiu certyfikatu
    en:
      - Servers where even one site has no valid certificate or no binding for the encrypted connection
      - Addresses existing solely in order to redirect traffic to the encrypted version
      - Resources serving the path for proving domain ownership on certificate renewal
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/security/access' -Name 'sslFlags' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          else {
            $flags = ([string]$value) -split ',' | ForEach-Object { $_.Trim() }
            if ($flags -contains 'Ssl') { 'REQUIRED' }
            else { 'NOT_REQUIRED' }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/access' -Name 'sslFlags' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.webServer/security/access'
      name    = 'sslFlags'
      value   = [string]$value
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/access' -Name 'sslFlags' -Value 'Ssl'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value $b.value
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/security/access

notes:
  pl: |
    Odczyt sprawdza obecność samego wymogu szyfrowania i nie rozstrzyga o dalszych
    ustawieniach, takich jak żądanie certyfikatu klienta — te ocenia się osobno.
    Zapis idzie na poziomie serwera i obowiązuje wszystkie witryny bez własnego
    ustawienia; wyjątek dla przekierowania albo dla ścieżki odnawiania certyfikatu
    ustawia się na jego poziomie.
  en: |
    The reading checks for the requirement of encryption itself and settles nothing
    about further settings, such as asking for a client certificate - those are
    judged apart. The setting is written at server level and holds for every site
    with no setting of its own; an exception for a redirection or for the
    certificate renewal path is set at its own level.
