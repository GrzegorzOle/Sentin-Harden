id: win11-linguistic-data-collection-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Text Input
  title:
    pl: Zbieranie materiału językowego z pisania i pisma odręcznego wyłączone
    en: Collection of language material from typing and handwriting switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza zbieranie przez system materiału językowego
    pochodzącego z tego, co użytkownik pisze na klawiaturze i rysuje piórem.

    Deklarowanym celem mechanizmu jest poprawa rozpoznawania pisma i
    podpowiadania słów. Żeby to robić, składnik wejścia tekstowego zbiera
    wzorzec pisania: słowa nietypowe, nazwy własne, skróty, terminy branżowe,
    a przy piśmie odręcznym — kształt liter.

    Rzecz w tym, czym te słowa są w kontekście pracy. Nazwy własne
    to nazwiska klientów, nazwy projektów, nazwy serwerów i systemów
    wewnętrznych. Terminy branżowe to słownik organizacji. Skróty to często
    oznaczenia spraw i numery umów. Materiał nie jest ani wybierany przez
    użytkownika, ani przez niego oglądany przed wysłaniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: strumień
    wyjątków językowych z tej maszyny, czyli spis rzeczy, których nie ma
    w słowniku ogólnym — a więc dokładnie tych, które organizację opisują.
    Nie jest to treść dokumentów, ale jest to mapa pojęć, którymi
    organizacja się posługuje, wraz z nazwiskami.

    Punkt należy do tej samej rodziny co ograniczenia danych
    diagnostycznych, ale dotyczy materiału innego rodzaju: nie tego, jak
    maszyna działa, lecz tego, co na niej się pisze.
  en: |
    The setting switches off the system's collection of language material coming from what
    the user types on the keyboard and draws with a pen.

    The mechanism's declared purpose is bettering handwriting recognition and word
    suggestion. To do that, the text input component gathers a pattern of writing: unusual
    words, proper names, abbreviations, trade terms, and in handwriting the shape of the
    letters.

    The thing is what those words are in the context of work. Proper names are clients'
    surnames, project names, the names of internal servers and systems. Trade terms are the
    organisation's dictionary. Abbreviations are often case marks and contract numbers. The
    material is neither chosen by the user nor looked over by them before sending.

    What an attacker gains while the item goes unmet: a stream of linguistic exceptions
    from this machine, that is, a list of the things absent from the general dictionary -
    and so exactly those that describe the organisation. It is not the content of
    documents, but it is a map of the notions the organisation works with, along with
    surnames.

    The item belongs to the same family as the limits on diagnostic data, but concerns
    material of another kind: not how the machine works but what is written on it.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji, z której ktoś korzysta świadomie.

    Podpowiadanie słów i rozpoznawanie pisma odręcznego działa dalej.
    Zmienia się to, czy materiał z tej maszyny zasila naukę mechanizmu poza
    nią. Słownik użytkownika budowany lokalnie pozostaje lokalny i działa
    bez zmiany.

    Efekt uboczny, jeżeli w ogóle wystąpi, jest odległy i niemierzalny:
    rozpoznawanie pisma nie poprawi się o to, co ta maszyna mogłaby wnieść.
    Żadnego objawu w codziennej pracy z tego nie wynika.

    Zmiana nie wymaga restartu ani wylogowania i cofa się natychmiast.
  en: |
    The change takes away no function anyone uses knowingly.

    Word suggestion and handwriting recognition go on working. What changes is whether
    material from this machine feeds the mechanism's learning beyond it. The user's
    dictionary built locally stays local and works unchanged.

    The side effect, if it appears at all, is remote and unmeasurable: handwriting
    recognition will not better itself by what this machine might have contributed. No
    symptom in daily work follows from that.

    The change takes no restart nor signing out and reverses at once.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Materiał z pisania na tej maszynie przestaje zasilać naukę rozpoznawania poza nią
      - Podpowiadanie słów i rozpoznawanie pisma odręcznego działa bez zmiany
      - Słownik użytkownika budowany lokalnie pozostaje nietknięty
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - Material from typing on this machine stops feeding recognition learning beyond it
      - Word suggestion and handwriting recognition work unchanged
      - The user's dictionary built locally is left untouched
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych konfiguracji, na których ta zmiana byłaby błędem
    en:
      - There are no known configurations on which this change would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This key sits outside the Policies\Microsoft branch - the path is
      # shorter than in most rules and it is easy to mistype.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\TextInput'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowLinguisticDataCollection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\TextInput'
    $current = (Get-ItemProperty -Path $path -Name 'AllowLinguisticDataCollection' -ErrorAction SilentlyContinue).'AllowLinguisticDataCollection'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowLinguisticDataCollection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\TextInput'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowLinguisticDataCollection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Ścieżka klucza odbiega od reszty paczki i warto na to uważać przy
    sprawdzaniu ręcznym: ustawienie nie leży w gałęzi zasad producenta, lecz
    w gałęzi zasad w bieżącej wersji systemu.

    Reguła należy do klasy bez uciążliwości i nadaje się do trybu zbiorczego.
    Jest to rzadki przypadek, w którym zysk jest realny, a koszt operacyjny
    zerowy — bo mechanizm nie jest funkcją, z której ktoś korzysta, tylko
    zbieraniem prowadzonym w tle.

    Odpowiednik tego ustawienia istnieje także po stronie użytkownika,
    w ustawieniach prywatności. Reguła dotyczy wyłącznie zapisu maszynowego,
    który tamten wybór przesądza.

    Brak wartości nie jest stanem zgodnym, bo domyślnie zbieranie bywa
    włączone.
  en: |
    The key's path departs from the rest of the pack and it is worth watching for when
    checking by hand: the setting lies not in the maker's policy branch but in the policy
    branch of the system's current version.

    The rule belongs to the class without disruption and suits the bulk mode. It is a rare
    case in which the gain is real and the operational cost nil - since the mechanism is
    not a function anyone uses but a collection carried on in the background.

    A counterpart of this setting exists on the user's side as well, in the privacy
    settings. The rule concerns the machine-side record alone, which settles that choice.

    A missing value is not a compliant state, since by default the collection is sometimes
    switched on.
