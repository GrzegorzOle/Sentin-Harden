id: ubuntu2404-rsyslog-reads-journal

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.1.3.3
  section: Logging and Auditing > System Logging > Configure rsyslog
  title:
    pl: Komunikaty journald trafiają do rsysloga
    en: Ensure journald is configured to send logs to rsyslog
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Na Ubuntu komunikaty programów najpierw odbiera journald i przekazuje je
    dalej do gniazda sysloga, z którego czyta rsyslog. Jeśli przekazywanie
    jest wyłączone, pliki w /var/log i serwer dzienników dostają tylko
    komunikaty jądra, a reszta zostaje w dzienniku journald.

    Punkt wymaga, żeby komunikaty journald trafiały do rsysloga.
  en: |
    On Ubuntu journald receives the messages of programs first and forwards
    them to the syslog socket, which rsyslog reads. If forwarding is turned
    off, the files in /var/log and the log server get only kernel messages,
    and the rest stays in the journald journal.

    The item requires the journald messages to reach rsyslog.

disruption_description:
  pl: |
    Nikt tego nie zauważy: pakiet systemd na Ubuntu domyślnie przekazuje
    komunikaty do sysloga. Naprawa jest potrzebna tylko wtedy, gdy ktoś
    wyłączył ForwardToSyslog; restartuje wtedy systemd-journald, a pliki
    w /var/log znów dostają wszystkie komunikaty.
  en: |
    Nobody will notice: the systemd package on Ubuntu forwards messages to
    syslog by default. The remediation is only needed when someone turned
    ForwardToSyslog off; it then restarts systemd-journald, and the files in
    /var/log get all messages again.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
    if ! in_use rsyslog; then echo NOT_APPLICABLE; exit 0; fi
    export LC_ALL=C
    # rs_files: the main rsyslog file and the drop-ins it includes by default
    rs_files() {
      local f
      [ -f /etc/rsyslog.conf ] && echo /etc/rsyslog.conf
      for f in /etc/rsyslog.d/*.conf; do [ -f "$f" ] && echo "$f"; done
      return 0
    }
    imj() {
      local f
      for f in $(rs_files); do
        if sed -e 's/#.*//' "$f" | tr '\n' ' ' | grep -qiE '(module[[:space:]]*\([^)]*load[[:space:]]*=[[:space:]]*"?imjournal|\$modload[[:space:]]+imjournal)'; then return 0; fi
      done
      return 1
    }
    if imj; then echo OK:imjournal; exit 0; fi
    if ! systemd-analyze cat-config systemd/journald.conf >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    c=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -v s="[Journal]" -v k="ForwardToSyslog" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
    if printf '%s\n' "$c" | grep -qxE 'yes|true|on|1'; then echo "OK:$c"; else echo "NOT_OK:${c:-default}"; fi
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/systemd/journald.conf.d/zz-sentin-harden-rsyslog-forward.conf
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
      if ! in_use rsyslog; then
        echo "rsyslog is switched off, so this item does not apply; nothing to change"; exit 0
      fi
      export LC_ALL=C
      # rs_files: the main rsyslog file and the drop-ins it includes by default
      rs_files() {
        local f
        [ -f /etc/rsyslog.conf ] && echo /etc/rsyslog.conf
        for f in /etc/rsyslog.d/*.conf; do [ -f "$f" ] && echo "$f"; done
        return 0
      }
      imj() {
        local f
        for f in $(rs_files); do
          if sed -e 's/#.*//' "$f" | tr '\n' ' ' | grep -qiE '(module[[:space:]]*\([^)]*load[[:space:]]*=[[:space:]]*"?imjournal|\$modload[[:space:]]+imjournal)'; then return 0; fi
        done
        return 1
      }
      if imj; then echo "rsyslog reads the journal through imjournal, nothing to change"; exit 0; fi
      f=/etc/systemd/journald.conf.d/zz-sentin-harden-rsyslog-forward.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      mkdir -p /etc/systemd/journald.conf.d
      printf '%s\n' '# Sentin-Harden: ubuntu2404-rsyslog-reads-journal' '[Journal]' 'ForwardToSyslog=yes' > "$f"
      chmod 0644 "$f"
      c=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -v s="[Journal]" -v k="ForwardToSyslog" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
      if [ "$c" != "yes" ]; then
        if [ "$(sed -n 's/^existed=//p' "$b" | head -n 1)" = 1 ]; then sed '1,/^---$/d' "$b" > "$f"; else rm -f "$f"; fi
        echo "Another drop-in sets ForwardToSyslog after $f; the effective value is ${c:-default}; restored the previous state" >&2; exit 1
      fi
      echo "Set ForwardToSyslog=yes in $f"
      if [ -d /run/systemd/system ]; then
        ju="systemd-journald.service systemd-journald.socket systemd-journald-dev-log.socket"
        systemctl reset-failed $ju >/dev/null 2>&1 || true
        if ! systemctl try-reload-or-restart systemd-journald.service; then
          systemctl reset-failed $ju >/dev/null 2>&1 || true
          systemctl start systemd-journald.socket systemd-journald-dev-log.socket systemd-journald.service
        fi
        echo "Restarted systemd-journald so that it reads the configuration"
      fi
    )

  rollback_command: |
    (
      set -e
      f=/etc/systemd/journald.conf.d/zz-sentin-harden-rsyslog-forward.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      echo "Restored the previous state of $f"
      if [ -d /run/systemd/system ]; then
        ju="systemd-journald.service systemd-journald.socket systemd-journald-dev-log.socket"
        systemctl reset-failed $ju >/dev/null 2>&1 || true
        if ! systemctl try-reload-or-restart systemd-journald.service; then
          systemctl reset-failed $ju >/dev/null 2>&1 || true
          systemctl start systemd-journald.socket systemd-journald-dev-log.socket systemd-journald.service
        fi
        echo "Restarted systemd-journald so that it reads the configuration"
      fi
    )

privileges: root
runnable: true

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
  - https://www.rsyslog.com/doc/configuration/modules/imjournal.html

notes:
  pl: |
    Pakiet systemd na Ubuntu ustawia ForwardToSyslog=yes w pliku
    /usr/lib/systemd/journald.conf.d/syslog.conf, a rsyslog odbiera
    komunikaty modułem imuxsock przez gniazdo syslog.socket, więc na
    domyślnej instalacji wynik to OK:yes. Wynik OK:imjournal oznacza, że
    rsyslog wczytuje moduł imjournal i sam czyta dziennik journald;
    przekazywanie jest wtedy zbędne i naprawa niczego nie zmienia. Parametr
    jądra systemd.journald.forward_to_syslog ma pierwszeństwo przed
    plikami, więc trzeba go sprawdzić ręcznie w /proc/cmdline.

    Sprawdzenie odczytuje wartość z polecenia systemd-analyze cat-config
    systemd/journald.conf, które pokazuje plik główny i pliki z katalogów
    journald.conf.d w kolejności stosowania, więc liczy się ostatnie
    przypisanie w sekcji [Journal]. Naprawa zapisuje ustawienie w
    /etc/systemd/journald.conf.d/zz-sentin-harden-rsyslog-forward.conf. Nazwa zaczyna się od zz-, bo
    pliki są stosowane w kolejności nazw, a pakiet systemd na Ubuntu ma
    własny plik /usr/lib/systemd/journald.conf.d/syslog.conf. Jeśli inny plik
    nadal nadpisuje ustawienie, naprawa przywraca poprzedni stan i kończy się
    błędem. systemd-journald w systemd 255 nie obsługuje przeładowania
    konfiguracji, więc naprawa i wycofanie restartują usługę; usługi
    piszące do dziennika nie tracą połączenia, bo journald przechowuje je
    w systemd na czas restartu. Przed restartem naprawa zeruje licznik
    uruchomień jednostki (systemctl reset-failed), bo po pięciu startach
    w ciągu 10 sekund systemd zatrzymałby journald razem z jego gniazdami.
    Wycofanie przywraca poprzedni stan pliku.

    Plik tej reguły jest stosowany po pliku reguły z punktu 6.1.2.2, więc
    naprawa włącza przekazywanie także wtedy, gdy po przejściu na rsyslog
    został tamten plik z ForwardToSyslog=no.

    Punkty 6.1.3 dotyczą komputerów, na których dzienniki prowadzi rsyslog.
    Uznaję go za używany, gdy jest włączony albo działa (tak samo rozstrzyga
    punkt 6.1.1.4); w przeciwnym razie wynik to NOT_APPLICABLE, naprawa
    niczego nie zmienia i obowiązują punkty 6.1.2.
  en: |
    The systemd package on Ubuntu sets ForwardToSyslog=yes in the
    /usr/lib/systemd/journald.conf.d/syslog.conf file, and rsyslog receives
    messages with the imuxsock module through the syslog.socket socket, so
    on a default installation the result is OK:yes. The OK:imjournal result
    means that rsyslog loads the imjournal module and reads the journald
    journal itself; forwarding is then not needed and the remediation
    changes nothing. The systemd.journald.forward_to_syslog kernel parameter
    takes precedence over the files, so it has to be checked by hand in
    /proc/cmdline.

    The check reads the value from the systemd-analyze cat-config
    systemd/journald.conf command, which shows the main file and the files
    from the journald.conf.d directories in the order they are applied, so
    the last assignment in the [Journal] section counts. The remediation
    writes the setting to /etc/systemd/journald.conf.d/zz-sentin-harden-rsyslog-forward.conf. The name
    starts with zz-, because the files are applied in the order of their
    names, and the systemd package on Ubuntu has its own
    /usr/lib/systemd/journald.conf.d/syslog.conf file. If another file still
    overrides the setting, the remediation restores the previous state and
    ends with an error. systemd-journald in systemd 255 does not support
    reloading its configuration, so the remediation and rollback restart the
    service; services writing to the journal keep their connection, because
    journald keeps it in systemd during the restart. Before the restart the
    remediation clears the start counter of the unit (systemctl
    reset-failed), because after five starts within 10 seconds systemd would
    stop journald together with its sockets. Rollback restores the previous
    state of the file.

    The file of this rule is applied after the file of the rule for item
    6.1.2.2, so the remediation turns forwarding on also when that file with
    ForwardToSyslog=no is left after switching to rsyslog.

    Items 6.1.3 apply to computers where rsyslog keeps the logs. It counts
    as used when it is enabled or running (item 6.1.1.4 decides the same
    way); otherwise the result is NOT_APPLICABLE, the remediation changes
    nothing and items 6.1.2 apply.
