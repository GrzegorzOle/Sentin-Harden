id: win2025-anonymous-named-pipes-empty

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista nazwanych potoków dostępnych anonimowo pusta
    en: The list of named pipes reachable anonymously empty
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przechowuje wykaz nazwanych potoków, do których wolno
    sięgnąć połączeniem bez poświadczeń, i punkt wymaga, żeby wykaz ten był
    pusty.

    Nazwany potok jest kanałem, przez który programy rozmawiają ze sobą
    przez sieć. Nie przenosi plików, tylko wywołania: „podaj listę", „zmień
    ustawienie", „uruchom zadanie". Wykaz z tego ustawienia otwiera
    wskazane kanały dla połączenia, które nie podało żadnego konta.

    Różnica wobec wykazu udziałów jest zasadnicza i warto ją zobaczyć.
    Udział otwarty anonimowo wydaje pliki. Potok otwarty anonimowo wydaje
    dostęp do usługi — a usługa po drugiej stronie potoku zwykle pracuje
    z uprawnieniami systemu. Otwarcie potoku jest więc otwarciem drogi do
    czegoś, co działa, a nie do czegoś, co leży.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozmowę
    z usługą systemową bez uwierzytelnienia. Co z tej rozmowy wynika,
    zależy od usługi — bywa, że odczyt konfiguracji, bywa, że wykaz kont,
    bywa, że więcej.

    Wpisy na tej liście są dziś prawie zawsze zaszłością. Powstawały
    w czasach, gdy część usług systemowych wymagała rozmowy przed
    zalogowaniem, i bywają przenoszone z serwera na serwer razem z gałęzią
    ustawień.
  en: |
    The setting keeps a list of named pipes that may be reached by a connection with no
    credentials, and the item takes that the list be empty.

    A named pipe is a channel through which programs talk to one another over the network.
    It carries not files but calls: "give the list", "change the setting", "run the task".
    The list in this setting opens the named channels to a connection that has given no
    account.

    The difference from the list of shares is fundamental and worth seeing. A share opened
    anonymously gives out files. A pipe opened anonymously gives out access to a service -
    and the service on the other end of the pipe usually works with the system's rights.
    Opening a pipe is therefore opening a road to something that runs, not to something that
    lies.

    What an attacker gains while the item goes unmet: a conversation with a system service
    without authentication. What follows from that conversation depends on the service -
    sometimes the reading of a configuration, sometimes a list of accounts, sometimes more.

    Entries on this list are today almost always a legacy. They arose in days when some
    system services took a conversation before signing in, and are at times carried from
    server to server along with a branch of settings.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy któryś z wpisanych potoków obsługuje coś,
    co na tym serwerze albo wokół niego działa.

    Na większości serwerów lista jest pusta i wdrożenie nie zmienia niczego.
    Tam, gdzie nie jest, wpis pochodzi zwykle z konkretnej potrzeby sprzed
    lat i warto ją odtworzyć, zanim wykaz zostanie wyczyszczony.

    Potrzeby typowe: starsze systemy kopii zapasowej pytające serwer
    o zawartość przed zalogowaniem, narzędzia inwentaryzacyjne odpytujące
    usługi bez konta, oprogramowanie do zdalnej obsługi drukarek oraz
    aplikacje własne rozmawiające z usługą przez nazwany kanał.

    Objawem jest błąd połączenia po stronie narzędzia, zwykle opisany jako
    odmowa dostępu albo jako niedostępność usługi. Sama maszyna nie zgłasza
    niczego, bo odrzucenie połączenia anonimowego nie jest dla niej
    zdarzeniem nadzwyczajnym.

    Właściwym rozwiązaniem jest nadanie narzędziu konta, a nie pozostawienie
    kanału otwartego dla wszystkich.

    Zmiana wymaga restartu usługi udostępniania.
  en: |
    What needs checking is whether one of the entered pipes serves something working on or
    around this server.

    On most servers the list is empty and the rollout changes nothing. Where it is not, the
    entry usually comes from a definite need of years ago and it is worth reconstructing it
    before the list is cleared.

    Typical needs: older backup systems asking the server about contents before signing in,
    inventory tools querying services with no account, software for the remote handling of
    printers, and applications of one's own talking to a service through a named channel.

    The symptom is a connection error on the tool's side, usually described as denied access
    or as the service being unavailable. The machine itself reports nothing, since the
    refusal of an anonymous connection is for it no out-of-the-way event.

    The right answer is giving the tool an account rather than leaving the channel open to
    everyone.

    The change takes a restart of the sharing service.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - remote-management
    - printing
  what_breaks:
    pl:
      - Narzędzia rozmawiające z usługą przez nazwany kanał bez konta tracą dostęp
      - Starsze systemy kopii zapasowej odpytujące serwer przed zalogowaniem przestają działać
      - Sama maszyna nie zgłasza niczego — objaw widać wyłącznie po stronie narzędzia
      - Restart usługi udostępniania zrywa sesje otwarte w chwili zmiany
    en:
      - Tools talking to a service through a named channel with no account lose access
      - Older backup systems querying the server before signing in stop working
      - The machine itself reports nothing - the symptom shows on the tool's side alone
      - The restart of the sharing service breaks sessions open at the moment of the change
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie bez własnego konta rozmawia z usługą przez potok wpisany na tę listę
    en:
      - A tool with no account of its own talks to a service through a pipe entered on this list
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a
      # list with nothing on it mean the same thing here - no pipe is reachable
      # anonymously - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'NullSessionPipes'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: EMPTY
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $current = (Get-ItemProperty -Path $path -Name 'NullSessionPipes' -ErrorAction SilentlyContinue).'NullSessionPipes'
    [pscustomobject]@{
      path    = $path
      name    = 'NullSessionPipes'
      entries = @($current)
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NullSessionPipes' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string[]]@($b.entries)) -Type MultiString
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-named-pipes-that-can-be-accessed-anonymously

notes:
  pl: |
    Brak wartości i lista pusta znaczą tu to samo i oba są spełnieniem.
    Wartość jest wykazem wyjątków, a nie ustawieniem, więc wykaz
    nieistniejący opisuje ten sam stan co wykaz pusty — nie domysł
    o wartości domyślnej.

    Wynik „ENTRIES" podaje wykaz wprost, żeby przed wyczyszczeniem dało się
    zobaczyć, o które kanały chodzi. Nazwy wpisów mówią zwykle, która
    usługa za nimi stoi, i to jest najszybsza droga do ustalenia, czy wpis
    ma jeszcze powód.

    Punkt czyta się razem z wykazem udziałów dostępnych anonimowo, który
    jest osobną wartością w tym samym kluczu. Tamten otwiera dostęp do
    plików, ten — do usług, i dlatego ten waży więcej mimo identycznej
    mechaniki.
  en: |
    An absent value and an empty list mean the same thing here and both are a meeting of the
    item. The value is a list of exceptions rather than a setting, so a list that does not
    exist describes the same state as an empty one - not a guess about a default value.

    The "ENTRIES" result gives the list outright, so that before clearing it can be seen
    which channels are meant. The entries' names usually say which service stands behind
    them, and that is the quickest road to establishing whether an entry still has a reason.

    The item is read together with the list of shares reachable anonymously, which is a
    separate value in the same key. That one opens access to files, this one to services,
    and hence this one weighs more despite the identical mechanics.
