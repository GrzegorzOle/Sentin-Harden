id: win2025-feedback-notifications-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Prośby o opinię o systemie wyłączone
    en: Prompts asking for feedback about the system turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wyświetlanie próśb o opinię o systemie — okien pytających
    o zadowolenie, o ocenę funkcji, o opisanie napotkanego problemu.

    Kategoria niska i chcę być przy niej konsekwentny, mimo że pokusa jest
    tu inna niż przy pozostałych podpowiedziach. Te okna nie tylko
    wyświetlają — one zbierają. Odpowiedź wpisana w takie okno wychodzi
    z maszyny jako tekst napisany przez człowieka, a nie jako dana
    techniczna.

    To jest jedyny powód, dla którego reguła w ogóle ma treść. Administrator
    opisujący napotkany problem pisze tak, jak myśli: podaje nazwę serwera,
    nazwę roli, wersję oprogramowania, czasem fragment komunikatu błędu
    wraz ze ścieżką. Materiał, który w danych diagnostycznych jest
    ograniczany polityką, tutaj wychodzi w polu tekstowym, bez żadnego
    ograniczenia poza rozwagą piszącego.

    Kategorii nie podnoszę, bo warunkiem jest to, że ktoś usiądzie
    i napisze — a na serwerze rzadko kto to robi. Wolę jednak nazwać
    mechanizm uczciwie niż udawać, że chodzi wyłącznie o zbędne okno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Istnieje natomiast pole, w które człowiek z dostępem do
    serwera może wpisać dowolny opis jego wnętrza — bez złej woli i bez
    świadomości, że to opuszcza organizację.
  en: |
    The item turns off the display of prompts asking for feedback about the
    system - windows asking about satisfaction, for a rating of a feature,
    for a description of a problem encountered.

    The category is low, and I want to be consistent about it, even though
    the temptation here differs from the other hints. These windows do not
    only display - they collect. An answer typed into such a window leaves
    the machine as text written by a person rather than as a technical
    datum.

    That is the only reason this rule has any substance at all. An
    administrator describing a problem writes as they think: they give the
    server's name, the role's name, the software version, sometimes a
    fragment of an error message together with its path. Material that in
    diagnostic data is trimmed by policy goes out here in a text box, with
    no limit beyond the writer's discretion.

    I do not raise the category, because the precondition is that somebody
    sits down and writes - and on a server hardly anybody does. I would
    rather name the mechanism honestly, though, than pretend it is merely a
    matter of a needless window.

    What an attacker gains while the item goes unmet: nothing directly.
    There does exist, however, a box into which a person with access to the
    server can type any description of its insides - with no ill will and no
    awareness that it leaves the organisation.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i uzasadnienie jest tu wyjątkowo proste: nikt
    nie traci narzędzia pracy, bo to nie jest narzędzie pracy.

    Jedyna strata jest po stronie producenta i wypada ją nazwać: opinie
    stąd wpływają na to, co zostanie w systemie poprawione. Nie równoważy
    to jednak niczego przy serwerze produkcyjnym, gdzie takich opinii i tak
    nikt nie pisze, a droga zgłaszania usterek prowadzi przez wsparcie,
    nie przez okno na pulpicie.

    Rzecz do zapamiętania przy czytaniu sprawozdania: ten punkt leży
    w gałęzi rejestru z danymi diagnostycznymi, a nie w tej z treściami
    z chmury — mimo że temat wydaje się ten sam. Przy przeglądaniu grupy
    łatwo go przeoczyć właśnie dlatego, że leży gdzie indziej niż
    pozostałe podpowiedzi.

    Czego to nie psuje: zgłaszania błędów, dzienników zdarzeń, żadnej
    ścieżki wsparcia, żadnej usługi. Nie wpływa też na zakres wysyłanych
    danych diagnostycznych — to osobna wartość w tej samej gałęzi.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and the justification here is
    exceptionally simple: nobody loses a tool of their work, because this is
    not a tool of anybody's work.

    The only loss is on the maker's side and it is as well to name it:
    opinions from here influence what gets fixed in the system. That
    balances nothing on a production server, though, where nobody writes
    such opinions anyway and the route for reporting faults runs through
    support rather than through a window on the desktop.

    Something to remember when reading the report: this item lies in the
    registry branch with the diagnostic data, not in the one with cloud
    content - even though the subject seems the same. When going through the
    group it is easy to miss precisely because it lies elsewhere than the
    other hints.

    What this does not break: error reporting, event logs, any support
    route, any service. It also does not affect the scope of diagnostic data
    sent - that is a separate value in the same branch.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Znikają okna pytające o zadowolenie, o ocenę funkcji i o opisanie napotkanego problemu
      - Strata jest po stronie producenta — opinie stąd wpływają na to, co zostanie w systemie poprawione
      - Punkt leży w gałęzi rejestru z danymi diagnostycznymi, nie w tej z treściami z chmury, więc łatwo go przeoczyć w grupie
      - Nie wpływa na zakres wysyłanych danych diagnostycznych, zgłaszanie błędów, dzienniki ani ścieżki wsparcia
    en:
      - The windows asking about satisfaction, for a rating of a feature and for a description of a problem disappear
      - The loss is on the maker's side - opinions from here influence what gets fixed in the system
      - The item lies in the registry branch with the diagnostic data, not the one with cloud content, so it is easy to miss in the group
      - It does not affect the scope of diagnostic data sent, error reporting, the logs, or any support route
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Organizacja świadomie uczestniczy w zgłaszaniu opinii o systemie jako droga wpływania na jego rozwój
    en:
      - The organisation deliberately takes part in giving feedback about the system as a way of influencing its development
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'DoNotShowFeedbackNotifications'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'DoNotShowFeedbackNotifications'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # These windows do not only display, they collect: an answer typed into one
    # leaves as free text, with no limit beyond the writer's discretion, while
    # the same material in the diagnostic data is trimmed by policy. A separate
    # value from the diagnostic data scope, in the same branch.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DoNotShowFeedbackNotifications' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-feedback

