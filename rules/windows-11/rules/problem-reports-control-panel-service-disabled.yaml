id: win11-problem-reports-control-panel-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi panelu zgłoszeń o problemach wyłączona
    en: The service backing the problem reports panel disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obsługuje widok w panelu sterowania, w którym użytkownik ogląda
    historię awarii programów na tej maszynie i sprawdza, czy producent
    przysłał do którejś z nich rozwiązanie.

    Kategoria ryzyka jest tu niska i warto powiedzieć wprost dlaczego, zamiast
    dorabiać punktowi wagi, której nie ma. Usługa nie przyjmuje połączeń
    z sieci, nie udostępnia niczego na zewnątrz i nie wykonuje cudzego kodu.
    Sama nie jest drogą wejścia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, sprowadza się
    do dwóch rzeczy drobnych. Pierwsza: zgromadzona historia awarii jest
    opisem tego, co na maszynie bywa uruchamiane i w jakich wersjach, a więc
    materiałem rozpoznawczym dla kogoś, kto już na maszynie jest. Druga:
    widok potrafi zaproponować pobranie rozwiązania z zewnątrz, czyli ruch
    wychodzący zainicjowany kliknięciem w panelu.

    Wartość punktu leży więc w porządku, nie w odparciu konkretnego
    zagrożenia: jedna usługa mniej, jedna ścieżka wychodząca mniej i jedna
    składnica danych o maszynie mniej. Jest to typowy punkt do świadomego
    odpuszczenia tam, gdzie widok bywa używany.
  en: |
    The service backs the control panel view where a user looks over the history of
    program failures on this machine and checks whether the maker has sent a solution to
    any of them.

    The risk category is low here, and it is worth saying outright why, rather than
    getting up for the item a weight it does not have. The service takes no connections
    from the network, makes nothing available outward and runs nobody else's code. It is
    not itself a way in.

    What an attacker gains while the item goes unmet comes down to two small things. The
    first: the gathered history of failures is a description of what is run on the machine
    and in what versions, and so reconnaissance material for somebody already on the
    machine. The second: the view can offer to fetch a solution from outside, that is,
    outgoing traffic begun by a click in the panel.

    The item's worth therefore lies in orderliness rather than in fending off a particular
    threat: one service fewer, one outgoing path fewer and one store of data about the
    machine fewer. It is a typical item for a conscious letting-go where the view is used.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś tego widoku używa przy rozpoznawaniu
    awarii — bo poza tym zastosowaniem zmiana jest niewidoczna.

    Panel z historią awarii przestanie się otwierać albo otworzy się pusty.
    Dotyczy to wyłącznie widoku dla człowieka; zbieranie danych o awariach
    prowadzi inny składnik i ta reguła go nie dotyczy.

    Odczuje to osoba, która przy zgłoszeniu problemu zagląda do historii
    awarii, żeby sprawdzić, czy program przestał działać raz, czy przestaje
    regularnie. Ten sam materiał jest dostępny w dziennikach systemowych,
    tylko czyta się go mniej wygodnie.

    Użytkownik, który z tego widoku nie korzysta, a takich jest większość,
    nie zauważy niczego. Programy działają i zgłaszają awarie tak jak
    wcześniej.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anybody uses this view when recognising failures -
    since apart from that use the change is invisible.

    The panel with the history of failures will stop opening, or will open empty. This
    concerns the view for a person alone; the gathering of failure data is carried on by
    another component and this rule does not concern it.

    It will be felt by whoever, on a reported problem, looks into the failure history to
    check whether a program stopped working once or stops regularly. The same material is
    available in the system logs, only it is read less conveniently.

    A user who does not use that view, and most do not, will notice nothing. Programs run
    and report failures as before.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
    - logging-and-audit
  what_breaks:
    pl:
      - Panel z historią awarii programów przestaje się otwierać albo otwiera się pusty
      - Sprawdzenie, czy producent przysłał rozwiązanie do zgłoszonej awarii, przestaje być możliwe
      - Zbieranie danych o awariach prowadzi inny składnik i działa dalej
      - Programy działają i zgłaszają awarie tak jak wcześniej
    en:
      - The panel with the history of program failures stops opening, or opens empty
      - Checking whether the maker sent a solution to a reported failure stops being possible
      - The gathering of failure data is carried on by another component and works on
      - Programs run and report failures as before
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Obsługa zgłoszeń opiera się na historii awarii oglądanej w panelu sterowania
    en:
      - The handling of reports rests on the failure history seen in the control panel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\wercplsupport'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\wercplsupport'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'wercplsupport' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'wercplsupport' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'wercplsupport' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Na wielu maszynach usługa jest wyłączona fabrycznie i reguła wypada
    zgodna bez żadnej zmiany. Jest to wynik prawidłowy, a nie podejrzany —
    warto to wiedzieć, żeby nie szukać przyczyny tam, gdzie jej nie ma.

    Punkt nie dotyczy przesyłania zgłoszeń o awariach na zewnątrz. Tym zajmuje
    się osobna usługa, która ma w tej paczce własną regułę, i to tam leży
    właściwa decyzja o tym, co maszyna wysyła.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    On many machines the service is disabled as shipped and the rule comes out compliant
    with no change at all. That is a correct result rather than a suspicious one - worth
    knowing, so as not to look for a cause where there is none.

    The item does not concern the sending of failure reports outward. A separate service
    deals with that, has its own rule in this pack, and it is there that the real decision
    about what the machine sends lies.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
