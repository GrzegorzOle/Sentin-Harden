id: win10-logon-legal-notice-caption

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nagłówek komunikatu wyświetlanego przed zalogowaniem ustalony
    en: The heading of the message shown before sign-in settled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Okno komunikatu przed zalogowaniem ma dwie części: nagłówek i treść. Nagłówek
    zapisywany jest osobnym wpisem i bez niego okno pojawia się bez tytułu.

    Nie jest to drobiazg wyłącznie estetyczny. Okno bez tytułu wygląda jak błąd
    systemu albo komunikat nieznanego programu, a taki komunikat ludzie zamykają
    odruchowo, nie czytając. Nagłówek jest tym, co sprawia, że treść w ogóle
    zostaje przeczytana, a w sporze — że da się wykazać, iż komunikat był
    czytelny, a nie ukryty.

    Nagłówek, tak jak treść, układa organizacja.
  en: |
    The message window before sign-in has two parts - a heading and a body. The
    heading is written as a separate entry, and without it the window appears
    untitled.

    This is not a matter of appearance alone. An untitled window looks like a
    system fault or a message from an unknown program, and such a message people
    close by reflex without reading. The heading is what makes the body read at
    all, and in a dispute what allows it to be shown that the message was legible
    rather than hidden.

    The heading, like the body, is composed by the organisation.

disruption_description:
  pl: |
    Zmiana nie kosztuje nic i nie zmienia zachowania maszyny poza tytułem okna,
    które i tak się pojawia. Nie ma przerwy, nie ma restartu, cofnięcie jest
    natychmiastowe.

    Sama w sobie nie wywołuje okna komunikatu. Okno pojawia się dopiero wtedy, gdy
    ustawiona jest także treść — więc wdrożenie samego nagłówka jest bez skutku i
    punkt ocenia się razem z treścią.

    Tak jak przy treści, nagłówek należy do organizacji i aplikacja nie wpisuje go
    sama.
  en: |
    The change costs nothing and alters no behaviour of the machine beyond the
    title of a window that appears anyway. There is no interruption, no restart,
    and reversing it is immediate.

    By itself it brings up no message window. The window appears only where the
    body is also set - so rolling out the heading alone has no effect and the item
    is judged together with the body.

    As with the body, the heading belongs to the organisation and the application
    does not enter it by itself.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Okno komunikatu przed zalogowaniem przestanie być oknem bez tytułu
      - Sam nagłówek bez ustawionej treści nie wywoła okna komunikatu i pozostanie bez skutku
      - Logowanie, uprawnienia, dostęp do zasobów i praca po zalogowaniu pozostają bez zmian
    en:
      - The message window before sign-in stops being an untitled window
      - The heading alone, with no body set, brings up no message window and has no effect
      - Signing in, privileges, access to resources and work after sign-in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Środowiska, w których nie podjęto jeszcze decyzji o treści komunikatu przed zalogowaniem
    en:
      - Environments where no decision has yet been taken on the wording of the message before sign-in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is read whatever its type - written by policy it is a single
      # string, written by a security template it is a list of lines. Both are
      # joined and judged by whether anything is left after trimming.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'LegalNoticeCaption'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'EMPTY' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $text = (@($value) -join ' ').Trim()
          if ($text.Length -eq 0) { 'EMPTY' } else { 'SET' }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'SET'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'LegalNoticeCaption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording belongs to the organisation, so the application does not
    # write it by itself. Replace the text below before running the command.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LegalNoticeCaption' -Value 'Warunki korzystania z systemu' -Type String

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-text-for-users-attempting-to-log-on

notes:
  pl: |
    Nagłówek należy do organizacji, więc aplikacja podaje polecenie do skopiowania
    zamiast uruchamiać je sama — tekst w poleceniu jest przykładem do zastąpienia.
    Sprawdzenie rozstrzyga wyłącznie, czy nagłówek jest niepusty. Punkt nie ma
    skutku bez ustawionej treści komunikatu i ocenia się go razem z nią.
  en: |
    The heading belongs to the organisation, so the application hands the command
    over to be copied instead of running it itself - the text in the command is an
    example to be replaced. The check settles only whether the heading is
    non-empty. The item has no effect without the message body set and is judged
    together with it.
