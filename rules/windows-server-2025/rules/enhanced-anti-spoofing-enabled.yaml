id: win2025-enhanced-anti-spoofing-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Biometrics > Facial Features
  title:
    pl: Wzmocniona ochrona przed podszyciem przy rozpoznawaniu twarzy
    en: Strengthened protection against spoofing in face recognition
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza wzmocnione sprawdzanie, czy przed kamerą stoi człowiek,
    a nie jego podobizna.

    Kategoria wysoka i chcę nazwać, czego ten punkt dotyczy, bo brzmi jak
    dostrojenie czułości. Dotyczy tego, czy rozpoznanie twarzy jest
    uwierzytelnieniem, czy tylko rozpoznaniem obrazu. Bez wzmocnionego
    sprawdzania mechanizm porównuje to, co widzi, ze wzorcem — i przechodzi
    przy zdjęciu, nagraniu odtworzonym z ekranu albo wydruku w odpowiedniej
    skali.

    To jest właściwa treść punktu. Twarz nie jest tajemnicą. Zdjęcie osoby
    da się zdobyć bez żadnego włamania, a często bez jej wiedzy. Jeżeli
    zdjęcie wystarcza, żeby wejść, to nie mamy drugiego składnika, tylko
    hasło wydrukowane na okładce.

    Na serwerze rzecz sprowadza się do wagi konta. Jeżeli ktokolwiek loguje
    się na tę maszynę twarzą, robi to na konto o szerokich uprawnieniach —
    i wtedy koszt fałszywego przejścia jest najwyższy z możliwych.

    Warto powiedzieć uczciwie, że sprawdzanie wymaga odpowiedniego
    urządzenia. Reguła nie tworzy możliwości, której sprzęt nie ma;
    zapewnia, że tam, gdzie mechanizm działa, działa w trybie mocniejszym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zalogowania się podobizną osoby uprawnionej, bez znajomości
    jakiegokolwiek hasła.
  en: |
    The item turns on the strengthened check of whether a person stands
    before the camera rather than a likeness of them.

    The category is high, and I want to name what this item concerns, because
    it sounds like tuning a sensitivity. It concerns whether face recognition
    is authentication or merely the recognition of a picture. Without the
    strengthened check the mechanism compares what it sees with a pattern -
    and lets through a photograph, a recording played back from a screen, or
    a print at the right scale.

    That is the real substance of the item. A face is not a secret. A
    person's photograph can be had with no break-in at all, and often without
    their knowing. If a photograph is enough to get in, then we do not have a
    second factor but a password printed on the cover.

    On a server the matter comes down to the weight of the account. If
    anybody signs in to this machine by face, they do so to an account with
    broad rights - and then the cost of a false admission is the highest
    there is.

    It is worth saying honestly that the check requires suitable hardware.
    The rule does not create a capability the hardware lacks; it makes sure
    that where the mechanism works, it works in its stronger mode.

    What an attacker gains while the item goes unmet: the ability to sign in
    with a likeness of an authorised person, knowing no password at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy sprzętu oraz warunków,
    w jakich ludzie się logują.

    Wzmocnione sprawdzanie stawia wyższe wymagania kamerze i oświetleniu.
    Na urządzeniu, które ich nie spełnia, rozpoznanie twarzy przestanie
    przechodzić — nie czasem, tylko w ogóle. Osoba logująca się w ten
    sposób musi mieć wtedy czym wejść inaczej, a to trzeba przygotować
    przed zastosowaniem reguły, nie po pierwszym nieudanym logowaniu.

    Drugą rzeczą do przewidzenia jest wzrost liczby odrzuceń przy słabym
    świetle. To nie jest usterka, tylko cena mocniejszego sprawdzania —
    ale dla osoby, która przez pół roku wchodziła od razu, wygląda jak
    awaria i tak zostanie zgłoszona.

    Na serwerze pytanie jest krótkie: czy ktokolwiek loguje się tu twarzą.
    Najczęściej nie, i wtedy reguła nie zmienia nic poza sprawozdaniem.

    Czego to nie psuje: logowania hasłem, kodem, kartą ani kluczem;
    logowania odciskiem palca; sesji zdalnych ani niczego poza samym
    rozpoznawaniem twarzy.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns the hardware and the
    conditions in which people sign in.

    The strengthened check makes higher demands of the camera and of the
    lighting. On a device that does not meet them, face recognition will stop
    going through - not sometimes, but at all. Whoever signs in that way must
    then have another way in, and that has to be prepared before the rule is
    applied, not after the first failed sign-in.

    The second thing to expect is a rise in refusals in poor light. That is
    not a fault but the price of a stronger check - yet to somebody who has
    walked straight in for half a year it looks like a failure and will be
    reported as one.

    On a server the question is short: does anybody sign in here by face.
    Most often not, and then the rule changes nothing beyond the report.

    What this does not break: signing in by password, code, card or key;
    signing in by fingerprint; remote sessions; or anything beyond face
    recognition itself.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Na urządzeniu niespełniającym wyższych wymagań rozpoznanie twarzy przestanie przechodzić w ogóle, a nie czasem
      - Osoba logująca się twarzą musi mieć czym wejść inaczej, przygotowane przed zastosowaniem reguły
      - Przy słabym świetle przybędzie odrzuceń — to cena mocniejszego sprawdzania, ale zostanie zgłoszona jako awaria
      - Logowanie hasłem, kodem, kartą, kluczem i odciskiem palca oraz sesje zdalne działają bez zmian
    en:
      - On a device that does not meet the higher demands, face recognition stops going through at all rather than sometimes
      - Whoever signs in by face must have another way in, prepared before the rule is applied
      - In poor light there will be more refusals - the price of a stronger check, but it will be reported as a failure
      - Signing in by password, code, card, key or fingerprint and remote sessions work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś loguje się na tę maszynę twarzą, a urządzenie nie spełnia wyższych wymagań i nie przygotowano innego sposobu wejścia
    en:
      - Somebody signs in to this machine by face, the device does not meet the higher demands, and no other way in has been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
      $name = 'EnhancedAntiSpoofing'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    $name = 'EnhancedAntiSpoofing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A face is not a secret: a photograph can be had with no break-in and often
    # without the person knowing. Without the strengthened check, a photograph, a
    # recording played from a screen or a print at the right scale goes through.
    # The check needs suitable hardware - make sure another way in exists.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnhancedAntiSpoofing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Brzmi jak dostrojenie czułości, a dotyczy tego, czy rozpoznanie twarzy
    jest uwierzytelnieniem, czy tylko rozpoznaniem obrazu. Bez wzmocnionego
