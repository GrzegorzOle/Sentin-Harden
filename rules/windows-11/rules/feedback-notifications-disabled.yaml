id: win11-feedback-notifications-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Prośby o opinię o systemie wyłączone
    en: Prompts asking for feedback about the system turned off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System sam z siebie pyta użytkownika o opinię — okienkiem przy pracy albo
    prośbą o ocenę po skorzystaniu z jakiejś funkcji. Odpowiedź wychodzi do
    producenta razem z kontekstem, w którym padło pytanie.

    Dwie rzeczy są tu warte uwagi, obie drobne. Pierwsza: użytkownik wpisuje
    w to pole tekst swobodny, a w tekście swobodnym ludzie piszą wszystko,
    łącznie z nazwą systemu wewnętrznego i opisem tego, nad czym akurat
    pracują. Druga: okienko z prośbą o opinię uczy, że system czasem pyta
    o rzeczy, których nie prosiliśmy — a to jest dokładnie ten nawyk, na
    którym stoi podszywanie się pod komunikaty systemowe.

    Punkt zamyka jedno i drugie przy zerowym koszcie.
  en: |
    The system asks the user for feedback of its own accord - a window during
    work, or a request to rate something after a feature has been used. The
    answer goes out to the vendor along with the context in which the question
    was asked.

    Two things here are worth noting, both small. First: the user types free text
    into that field, and in free text people write anything, including the name
    of an internal system and a description of what they are working on. Second:
    a window asking for feedback teaches that the system sometimes asks about
    things nobody requested - and that is precisely the habit on which
    impersonation of system messages rests.

    The item closes both at no cost.

disruption_description:
  pl: |
    Nic nie przestaje działać. Znika okienko, które i tak zamyka się krzyżykiem.

    Użytkownik, który chce zgłosić producentowi problem, nadal może to zrobić
    sam — punkt wyłącza wyłącznie pytanie zadawane z inicjatywy systemu, nie
    samą możliwość zgłoszenia.

    Nie ma tu restartu, wylogowania ani żadnej zmiany w działaniu programów.
    Zmiana jest natychmiastowa i natychmiast odwracalna.
  en: |
    Nothing stops working. What disappears is a window people close with the
    cross anyway.

    A user who wants to report a problem to the vendor can still do so - the item
    turns off only the question asked at the system's initiative, not the ability
    to report.

    There is no restart, no sign-out and no change to how programs behave. The
    change is immediate and immediately reversible.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Nic nie przestaje działać; znika wyłącznie okienko z prośbą o opinię
    en:
      - Nothing stops working; only the window asking for feedback disappears
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'DoNotShowFeedbackNotifications'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'DoNotShowFeedbackNotifications'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DoNotShowFeedbackNotifications' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-feedback

notes:
  pl: |
    Klasa „bez uciążliwości" jest tu uzasadniona mimo tego, że zmiana jest dla
    użytkownika widoczna. Widoczność i uciążliwość to nie to samo: zniknięcie
    okienka, którego nikt nie chciał, nie wymaga od nikogo zmiany sposobu pracy.

    Pole mówiące, że zmiana jest widoczna, zostaje ustawione mimo to — po to,
    żeby obsługa zgłoszenia „nie mam już tego pytania" nie zaczynała się od
    szukania usterki.
  en: |
    The class "no disruption" is justified here even though the change is visible
    to the user. Visibility and disruption are not the same thing: the
    disappearance of a window nobody wanted requires nobody to change how they
    work.

    The field saying the change is visible is set all the same - so that handling
    a report of "that question is gone" does not start with a hunt for a fault.
