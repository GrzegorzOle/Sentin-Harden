id: fedora44-chrony-not-root

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 2.3.3
  section: Services > Configure Time Synchronization
  title:
    pl: Chrony nie działa jako root
    en: Ensure chrony is not run as the root user
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Chronyd odbiera pakiety NTP z sieci. Jeśli błąd w ich obsłudze pozwoli
    przejąć proces, napastnik dostaje uprawnienia użytkownika, jako który
    chronyd działa. Proces działający jako root oddaje mu cały system.

    Punkt wymaga, żeby chronyd nie działał jako root. Fedora uruchamia go
    domyślnie jako użytkownik chrony, który może tylko ustawiać zegar.
  en: |
    chronyd receives NTP packets from the network. If a flaw in handling
    them lets someone take over the process, the attacker gets the rights
    of the user chronyd runs as. A process running as root hands over the
    whole system.

    The item requires that chronyd does not run as root. Fedora runs it as
    the chrony user by default, which can only set the clock.

disruption_description:
  pl: |
    Nikt tego nie zauważy na Fedorze z domyślną konfiguracją, bo chronyd
    nie działa tam jako root. Jeśli administrator ustawił root celowo, np.
    dla zegara referencyjnego dostępnego tylko dla roota, to źródło czasu
    może przestać działać.
  en: |
    Nobody will notice on Fedora with the default configuration, because
    chronyd does not run as root there. If an administrator set root on
    purpose, for example for a reference clock only root can access, that
    time source can stop working.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Zegary referencyjne (refclock) i inne źródła czasu dostępne tylko dla roota przestają działać
    en:
      - Reference clocks (refclock) and other time sources only root can access stop working
  interruption: service-restart
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v rpm >/dev/null 2>&1 || ! command -v ps >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    if ! rpm -q --quiet chrony; then echo NOT_INSTALLED; exit 0; fi
    s=/etc/sysconfig/chronyd
    c=/etc/chrony.conf
    re="^[[:space:]]*OPTIONS=(.*[\"'[:space:]])?-u[[:space:]]*root([\"'[:space:]]|\$)"
    cfiles() {
      echo "c $c"
      awk '{ d = tolower($1) } d == "include" || d == "confdir" || d == "sourcedir" { for (i = 2; i <= NF; i++) print d, $i }' "$c" |
      while read -r d p; do
        case "$d" in
          include) for f in $p; do if [ -f "$f" ]; then echo "c $f"; fi; done ;;
          confdir) for f in "$p"/*.conf; do if [ -f "$f" ]; then echo "c $f"; fi; done ;;
          sourcedir) for f in "$p"/*.sources; do if [ -f "$f" ]; then echo "s $f"; fi; done ;;
        esac
      done
    }
    state() {
      w=""
      if [ -r "$s" ] && grep -Eq "$re" "$s"; then w="$w,options"; fi
      cu=""
      if [ -r "$c" ]; then
        while read -r k f; do
          [ "$k" = c ] || continue
          x=$(awk 'tolower($1) == "user" { u = $2 } END { print u }' "$f" 2>/dev/null) || true
          if [ -n "$x" ]; then cu=$x; fi
        done < <(cfiles)
      fi
      if [ "$cu" = root ]; then w="$w,user-directive"; fi
      pu=$(ps -o user= -C chronyd 2>/dev/null | sort -u | tr '\n' ' ') || true
      case " $pu" in *" root "*) w="$w,process" ;; esac
      if [ -n "$w" ]; then echo "ROOT:${w#,}"
      elif [ -n "$pu" ]; then echo "NOT_ROOT:${pu% }"
      else echo NOT_ROOT:not-running; fi
    }
    state
  expected: '^(NOT_ROOT:|NOT_INSTALLED$)'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/sysconfig/chronyd
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=file-1
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      if ! rpm -q --quiet chrony; then echo "chrony is not installed, nothing to change"; exit 0; fi
      s=/etc/sysconfig/chronyd
      c=/etc/chrony.conf
      re="^[[:space:]]*OPTIONS=(.*[\"'[:space:]])?-u[[:space:]]*root([\"'[:space:]]|\$)"
      cfiles() {
        echo "c $c"
        awk '{ d = tolower($1) } d == "include" || d == "confdir" || d == "sourcedir" { for (i = 2; i <= NF; i++) print d, $i }' "$c" |
        while read -r d p; do
          case "$d" in
            include) for f in $p; do if [ -f "$f" ]; then echo "c $f"; fi; done ;;
            confdir) for f in "$p"/*.conf; do if [ -f "$f" ]; then echo "c $f"; fi; done ;;
            sourcedir) for f in "$p"/*.sources; do if [ -f "$f" ]; then echo "s $f"; fi; done ;;
          esac
        done
      }
      state() {
        w=""
        if [ -r "$s" ] && grep -Eq "$re" "$s"; then w="$w,options"; fi
        cu=""
        if [ -r "$c" ]; then
          while read -r k f; do
            [ "$k" = c ] || continue
            x=$(awk 'tolower($1) == "user" { u = $2 } END { print u }' "$f" 2>/dev/null) || true
            if [ -n "$x" ]; then cu=$x; fi
          done < <(cfiles)
        fi
        if [ "$cu" = root ]; then w="$w,user-directive"; fi
        pu=$(ps -o user= -C chronyd 2>/dev/null | sort -u | tr '\n' ' ') || true
        case " $pu" in *" root "*) w="$w,process" ;; esac
        if [ -n "$w" ]; then echo "ROOT:${w#,}"
        elif [ -n "$pu" ]; then echo "NOT_ROOT:${pu% }"
        else echo NOT_ROOT:not-running; fi
      }
      st=$(state)
      case "$st" in
        NOT_ROOT:*) echo "chronyd does not run as root ($st), nothing to change"; exit 0 ;;
        *user-directive*) echo "The user directive in the chrony configuration sets root ($st); change it by hand" >&2; exit 1 ;;
      esac
      if [ ! -r "$s" ] || ! grep -Eq "$re" "$s"; then
        echo "chronyd runs as root ($st), but not because of $s; check ExecStart of chronyd.service" >&2; exit 1
      fi
      tmp=$(mktemp)
      trap 'rm -f "$tmp"' EXIT
      sed -E ":a; s/^([[:space:]]*OPTIONS=(.*[\"'[:space:]])?)-u[[:space:]]*root([\"'[:space:]]|\$)/\\1\\3/; ta" "$s" > "$tmp"
      cat "$tmp" > "$s"
      systemctl try-restart chronyd.service
      st=$(state)
      case "$st" in ROOT:*) echo "chronyd still runs as root ($st)" >&2; exit 1 ;; esac
      echo "Removed -u root from OPTIONS in $s and restarted chronyd ($st)"
    )

  rollback_command: |
    (
      set -e
      f=/etc/sysconfig/chronyd
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=file-1 ] && [ "$(sed -n 3p "$b")" = --- ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      ex=$(sed -n '2s/^existed=//p' "$b")
      case "$ex" in
        1) ;;
        0) echo "$f did not exist before the change, nothing to restore"; exit 0 ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      tmp=$(mktemp)
      trap 'rm -f "$tmp"' EXIT
      sed '1,/^---$/d' "$b" > "$tmp"
      if [ -f "$f" ] && cmp -s "$tmp" "$f"; then echo "$f is unchanged, nothing to restore"; exit 0; fi
      cat "$tmp" > "$f"
      systemctl try-restart chronyd.service
      echo "Restored the previous content of $f"
    )

privileges: root
runnable: true

sources:
  - https://chrony-project.org/doc/latest/chronyd.html
  - https://chrony-project.org/doc/latest/chrony.conf.html

notes:
  pl: |
    Sprawdzenie szuka opcji -u root w zmiennej OPTIONS w pliku
    /etc/sysconfig/chronyd, z którego usługa chronyd.service bierze opcje,
    oraz dyrektywy user root w konfiguracji chrony, i odczytuje użytkownika
    działającego procesu chronyd. Wynik ROOT wymienia, co z tych rzeczy
    wskazuje roota, a NOT_ROOT podaje użytkownika procesu albo not-running.

    Naprawa usuwa opcję -u root z OPTIONS i restartuje działający chronyd,
    co przerywa synchronizację na chwilę. Dyrektywy user root w konfiguracji
    nie zmienia, tylko kończy się błędem, bo o jej zastąpieniu powinien
    zdecydować administrator. Kopia zapisuje cały plik /etc/sysconfig/chronyd,
    a wycofanie przywraca jego treść i restartuje działający chronyd.
  en: |
    The check looks for the -u root option in the OPTIONS variable of
    /etc/sysconfig/chronyd, where chronyd.service takes its options from,
    and for a user root directive in the chrony configuration, and reads the
    user of the running chronyd process. The ROOT result lists which of
    these point to root, and NOT_ROOT gives the process user or not-running.

    The remediation removes the -u root option from OPTIONS and restarts a
    running chronyd, which pauses synchronization for a moment. It does not
    change a user root directive in the configuration and fails instead,
    because replacing it is up to the administrator. The backup records the
    whole /etc/sysconfig/chronyd file, and rollback restores its content and
    restarts a running chronyd.
