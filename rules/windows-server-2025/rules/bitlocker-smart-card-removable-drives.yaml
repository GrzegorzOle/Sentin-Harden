id: win2025-bitlocker-smart-card-removable-drives

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Karta wymagana do odblokowania nośników wymiennych
    en: A card required to unlock removable media
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby nośnik wymienny odblokowywało się certyfikatem
    z karty, a nie innym sposobem. Pierwsza wartość dopuszcza kartę, druga
    czyni ją wymaganą — dopuszczenie bez wymagania zostawia wybór otwarty
    i audyt raportuje ten stan osobno.

    Zostawiam kategorię średnią. Zestawiona z regułą o hasłach z tej samej
    paczki, ta mówi to samo od drugiej strony: hasło do nośnika jest
    sekretem, którego nikt nie unieważni, a certyfikat da się unieważnić.
    Przy nośniku wymiennym ta różnica waży więcej niż przy dysku stałym,
    bo nośnik trafia w ręce osób, nad którymi organizacja nie ma kontroli,
    i wraca po czasie, w którym część z nich zmieniła rolę albo odeszła.

    Przy dysku stałym pisałem, że mechanizm jest certyfikatowy, więc
    w praktyce chodzi o certyfikat w magazynie, niekoniecznie o plastik.
    Tutaj to zastrzeżenie odwraca się na korzyść reguły: skoro nośnik ma
    być odczytany na innej maszynie, certyfikat trzymany osobno od nośnika
    jest dokładnie tym, czego ten układ potrzebuje. Nośnik i klucz podróżują
    wtedy osobno, a to jest najstarsza i wciąż najlepsza właściwość takiego
    rozwiązania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    nośnika wydanego na zewnątrz oparty na sekrecie, którego organizacja nie
    może wycofać po tym, jak nośnik przestał być pod jej kontrolą.
  en: |
    The item requires a removable medium to be unlocked with a certificate
    from a card rather than by another means. The first value admits the
    card, the second makes it required - admitted without required leaves
    the choice open, and the audit reports that state separately.

    I keep the category medium. Set beside the rule about passwords from
    the same pack, this one says the same thing from the other side: a
    password to a medium is a secret nobody will revoke, and a certificate
    can be revoked. With a removable medium that difference weighs more
    than with a fixed drive, because the medium passes into the hands of
    people the organisation has no control over and comes back after a time
    in which some of them have changed role or left.

    At the fixed drive I wrote that the mechanism is certificate-based, so
    in practice this concerns a certificate in a store, not necessarily
    plastic. Here that caveat turns in the rule's favour: if the medium is
    to be read on another machine, a certificate kept apart from the medium
    is exactly what this arrangement needs. The medium and the key then
    travel separately, and that is the oldest and still the best property
    of such a solution.

    What an attacker gains while the item goes unmet: access to a medium
    released outside, resting on a secret the organisation cannot withdraw
    once the medium has left its control.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę wskazać, gdzie
    leży tu sprzeczność, bo jest ona inna niż przy dyskach stałych i łatwo
    ją przeoczyć.

    Przy dysku stałym wymaganie karty kłóciło się z automatycznym
    odblokowywaniem przy starcie maszyny. Tutaj nie ma z czym się kłócić —
    nikt nie odblokowuje nośnika wymiennego automatycznie przy starcie.
    Sprzeczność jest gdzie indziej: certyfikat jest związany z magazynem
    konkretnego człowieka albo konkretnej maszyny, a nośnik wymienny jedzie
    tam, gdzie tego magazynu nie ma.

    Z tego wynika skutek, o którym trzeba rozstrzygnąć przed wdrożeniem,
    a nie po nim: ta reguła decyduje, kto będzie mógł odczytać nośnik
    później. To jest decyzja o ludziach, a nie o tej maszynie. Wydanie
    nośnika podmiotowi z zewnątrz przestaje być możliwe, dopóki nie zostanie
    uzgodnione, czyj certyfikat ma go otwierać.

    Drugi skutek dotyczy zadań bezobsługowych i on jest na serwerze
    najważniejszy. Usługa kopii zapasowych działająca na koncie usługowym
    nie przedstawi certyfikatu użytkownika, bo żaden człowiek nie bierze
    udziału w tej operacji. Tam, gdzie nośnik wymienny jest celem kopii —
    czyli w typowym zastosowaniu serwerowym — ta reguła i praca
    bezobsługowa wykluczają się. Właściwym wynikiem bywa wtedy zapisany
    wyjątek z uzasadnieniem, a nie wdrożenie na siłę.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs a planned rollout", and I want to point out
    where the contradiction lies here, because it differs from the one at
    fixed drives and is easy to miss.

    At the fixed drive, requiring a card clashed with unlocking
    automatically at machine start. Here there is nothing to clash with -
    nobody unlocks a removable medium automatically at start. The
    contradiction is elsewhere: the certificate is tied to the store of a
    particular person or a particular machine, and a removable medium
    travels to where that store is not.

    From that follows an effect to be settled before the rollout rather
    than after: this rule decides who will be able to read the medium
    later. That is a decision about people, not about this machine.
    Releasing a medium to an outside party stops being possible until it
    has been agreed whose certificate is to open it.

    The second effect concerns unattended jobs and on a server it is the
    most important one. A backup service running under a service account
    will not present a user's certificate, because no human being takes
    part in the operation. Where a removable medium is the target of a
    backup - that is, in the typical server use - this rule and unattended
    work exclude each other. The right result is then often a recorded
    exception with a justification rather than a forced rollout.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Usługa kopii zapasowych na koncie usługowym nie przedstawi certyfikatu użytkownika, bo żaden człowiek nie bierze w tym udziału
      - Tam, gdzie nośnik wymienny jest celem kopii, ta reguła i praca bezobsługowa wykluczają się
      - Certyfikat jest związany z magazynem konkretnego człowieka albo maszyny, a nośnik jedzie tam, gdzie tego magazynu nie ma
      - Wydanie nośnika podmiotowi z zewnątrz wymaga wcześniejszego uzgodnienia, czyj certyfikat ma go otwierać
    en:
      - A backup service under a service account will not present a user's certificate, because no human takes part
      - Where a removable medium is the target of a backup, this rule and unattended work exclude each other
      - The certificate is tied to a particular person's or machine's store, and the medium travels to where that store is not
      - Releasing a medium to an outside party requires agreeing beforehand whose certificate is to open it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki wymienne są celem zadań kopii zapasowych działających bezobsługowo, bez udziału człowieka
      - Nie uzgodniono, czyj certyfikat ma otwierać nośniki wydawane podmiotom z zewnątrz
      - Certyfikat miałby być trzymany razem z nośnikiem, co znosi całą wartość tego rozwiązania
    en:
      - Removable media are the target of backup jobs running unattended, with no person involved
      - It has not been agreed whose certificate is to open media released to outside parties
      - The certificate would be kept together with the medium, which cancels the whole value of the arrangement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes
      # it required - admitted without required leaves the choice open and is
      # reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'RDVAllowUserCert'
        $enforce = $item.'RDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'RDVAllowUserCert'
      allow_existed   = ($null -ne $item.'RDVAllowUserCert')
      enforce         = $item.'RDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'RDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This and unattended work exclude each other: a backup service under a
    # service account presents no user certificate. Where a removable medium is
    # the backup target, a recorded exception is usually the right answer
    # instead of this change.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -ErrorAction SilentlyContinue
    }
    if ($b.enforce_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -Value $b.enforce -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Przy nośniku wymiennym różnica między hasłem a certyfikatem waży więcej
    niż przy dysku stałym: nośnik trafia w ręce osób poza kontrolą
    organizacji i wraca po czasie, w którym część z nich zmieniła rolę albo
    odeszła. Hasła nikt nie unieważni, certyfikat da się unieważnić.

    Sprzeczność jest tu inna niż przy dyskach stałych. Tam kłóciło się to
    z automatycznym odblokowywaniem przy starcie; tu nie ma z czym się
    kłócić, za to certyfikat jest związany z magazynem konkretnego
    człowieka, a nośnik jedzie tam, gdzie tego magazynu nie ma.

    Na serwerze rozstrzygające jest to, że usługa kopii zapasowych na
    koncie usługowym nie przedstawi certyfikatu użytkownika. Gdzie nośnik
    wymienny jest celem kopii, właściwym wynikiem bywa zapisany wyjątek.
  en: |
    With a removable medium the difference between a password and a
    certificate weighs more than with a fixed drive: the medium passes into
    the hands of people outside the organisation's control and comes back
    after a time in which some of them have changed role or left. Nobody
    will revoke a password; a certificate can be revoked.

    The contradiction here differs from the one at fixed drives. There it
    clashed with unlocking automatically at start; here there is nothing to
    clash with, but the certificate is tied to a particular person's store
    and the medium travels to where that store is not.

    On a server the deciding point is that a backup service under a service
    account will not present a user's certificate. Where a removable medium
    is the backup target, a recorded exception is often the right result.
