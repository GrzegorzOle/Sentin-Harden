id: win11-picture-password-domain-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie obrazem dla kont domenowych wyłączone
    en: Picture sign-in for domain accounts switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera kontom domenowym możliwość logowania się gestem
    rysowanym na obrazie zamiast wpisania hasła.

    Mechanizm polega na tym, że użytkownik wybiera własny obraz i rysuje na
    nim trzy gesty — kółka, linie, dotknięcia. Zgodność gestów z zapisanym
    wzorem odblokowuje konto. Hasło nadal istnieje i nadal działa; gest jest
    dodatkową drogą do tego samego konta.

    Słabość bierze się z dwóch rzeczy naraz. Pierwsza to rozmiar przestrzeni,
    z której wybiera się wzór: gestów jest nieporównanie mniej niż kombinacji
    znaków w haśle o przyzwoitej długości. Druga jest ważniejsza — gest
    rysuje się na ekranie ruchem ręki, więc daje się podejrzeć z odległości
    i zapamiętać. Hasła wpisywanego na klawiaturze podejrzeć równie łatwo
    się nie da, a ślady palców na ekranie dotykowym bywają czytelne jeszcze
    długo po zalogowaniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do konta
    domenowego, którą można odtworzyć z obserwacji albo ze śladów na szkle,
    bez łamania czegokolwiek. Konto domenowe jest przy tym celem znacznie
    cenniejszym niż lokalne, bo otwiera zasoby poza tą maszyną.
  en: |
    The setting takes from domain accounts the means of signing in with a gesture drawn on
    a picture instead of typing a password.

    The mechanism lies in the user choosing their own picture and drawing three gestures on
    it - circles, lines, taps. The gestures matching the recorded pattern unlocks the
    account. The password still exists and still works; the gesture is an additional road
    to the same account.

    The weakness comes from two things at once. The first is the size of the space the
    pattern is chosen from: there are incomparably fewer gestures than combinations of
    characters in a password of decent length. The second matters more - a gesture is drawn
    on the screen by a movement of the hand, and so can be watched from a distance and
    remembered. A password typed on a keyboard cannot be watched as easily, and finger
    marks on a touch screen are sometimes legible long after the sign-in.

    What an attacker gains while the item goes unmet: a road to a domain account that can
    be reproduced from observation or from marks on the glass, without breaking anything. A
    domain account is at that a far more valuable target than a local one, since it opens
    resources beyond this machine.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek w organizacji faktycznie loguje się
    gestem — a na urządzeniach z ekranem dotykowym zdarza się to częściej,
    niż wynikałoby z założeń.

    Skutek jest natychmiastowy i widoczny. Użytkownik, który miał gest
    skonfigurowany, przy następnym logowaniu zobaczy wyłącznie pole hasła.
    Gest nie zostaje usunięty, tylko przestaje być oferowany, więc wycofanie
    zmiany przywraca go bez ponownej konfiguracji.

    Problem praktyczny polega na tym, że część osób logujących się gestem nie
    pamięta hasła domenowego — bo od dawna go nie wpisywała. Na tabletach
    i urządzeniach bez klawiatury fizycznej dochodzi do tego niewygoda:
    wpisanie długiego hasła na klawiaturze ekranowej przy każdym logowaniu
    jest odczuwalnie uciążliwsze.

    Warto uprzedzić użytkowników przed wdrożeniem. Zmiana nie wymaga
    restartu i obowiązuje od następnego logowania.
  en: |
    What needs checking is whether anyone in the organisation actually signs in with a
    gesture - and on devices with a touch screen that happens more often than assumptions
    would suggest.

    The effect is immediate and visible. A user who had a gesture set up will, at the next
    sign-in, see the password field alone. The gesture is not removed, merely no longer
    offered, so rolling the change back restores it without setting it up afresh.

    The practical trouble is that some of the people signing in with a gesture do not
    remember the domain password - because they have not typed it for a long time. On
    tablets and devices with no physical keyboard, inconvenience is added to that: typing a
    long password on a screen keyboard at every sign-in is noticeably more of a burden.

    It is worth forewarning users before the rollout. The change takes no restart and binds
    from the next sign-in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Logowanie gestem na obrazie przestaje być oferowane kontom domenowym
      - Użytkownik, który od dawna nie wpisywał hasła domenowego, może go nie pamiętać
      - Logowanie na tablecie wymaga wpisania hasła na klawiaturze ekranowej
      - Konta lokalne i numer PIN działają bez zmiany
    en:
      - Picture gesture sign-in stops being offered to domain accounts
      - A user who has not typed the domain password for a long time may not remember it
      - Signing in on a tablet takes typing the password on a screen keyboard
      - Local accounts and the PIN work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Podstawowym sposobem logowania na urządzeniach dotykowych w organizacji jest gest na obrazie
    en:
      - The chief means of signing in on the organisation's touch devices is a picture gesture
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BlockDomainPicturePassword'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $current = (Get-ItemProperty -Path $path -Name 'BlockDomainPicturePassword' -ErrorAction SilentlyContinue).'BlockDomainPicturePassword'
    [pscustomobject]@{
      path        = $path
      name        = 'BlockDomainPicturePassword'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockDomainPicturePassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/

notes:
  pl: |
    Punkt dotyczy wyłącznie kont domenowych. Konta lokalne mogą dalej
    korzystać z gestu i ustawienie ich nie obejmuje — stąd słowo „domenowych"
    w nazwie wartości, która to zapisuje.

    Reguła nie dotyczy numeru PIN, choć bywa z nim mylona. PIN jest związany
    ze sprzętem maszyny i nie daje się przenieść na inną, gest zaś jest
    wiedzą odtwarzalną z obserwacji. To jest właśnie ta różnica, przez którą
    jeden mechanizm jest tu blokowany, a drugi nie.

    Klucz jest wspólny z innymi ustawieniami systemowymi, więc wycofanie
    usuwa wyłącznie tę jedną wartość. Sam klucz znika tylko wtedy, gdy nic
    innego w nim nie zostało.

    Brak wartości nie jest stanem zgodnym, bo domyślnie gest jest dostępny.
  en: |
    The item concerns domain accounts alone. Local accounts may go on using the gesture and
    the setting does not take them in - whence the word "domain" in the name of the value
    that records it.

    The rule does not concern the PIN, though it is sometimes confused with it. A PIN is
    bound to the machine's hardware and cannot be carried to another, whereas a gesture is
    knowledge reproducible from observation. That is exactly the difference for which one
    mechanism is blocked here and the other is not.

    The key is shared with other system settings, so a rollback removes that one value
    alone. The key itself goes only where nothing else is left in it.

    A missing value is not a compliant state, since by default the gesture is available.
