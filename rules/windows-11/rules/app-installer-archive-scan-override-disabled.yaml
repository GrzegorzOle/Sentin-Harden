id: win11-app-installer-archive-scan-override-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Pomijanie skanowania archiwum przed instalacją zablokowane
    en: Skipping the scan of an archive before installation blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Pakiet dostarczony jako archiwum jest przed rozpakowaniem sprawdzany przez
    ochronę antywirusową maszyny. Sprawdzenie odbywa się w momencie, w którym ma
    sens: zanim zawartość trafi na dysk i zanim cokolwiek z niej zostanie
    uruchomione.

    Instalator pozwala jednak to sprawdzenie pominąć. Przełącznik istnieje po to,
    żeby obejść fałszywy alarm — sytuację skądinąd realną, bo instalatory
    programów narzędziowych bywają zgłaszane przez ochronę mimo że są
    w porządku.

    Kłopot polega na tym, że przełącznik nie rozróżnia fałszywego alarmu od
    prawdziwego. Dla osoby instalującej oba wyglądają tak samo: ochrona
    zatrzymała instalację, a w dokumentacji jest przełącznik, który to
    odblokowuje. Decyzja o pominięciu sprawdzenia zapada wtedy bez żadnej
    wiedzy o tym, co zostało zgłoszone i dlaczego.

    Zablokowanie przełącznika nie odbiera możliwości poradzenia sobie
    z fałszywym alarmem — do tego służy wyjątek w ochronie, nadawany świadomie
    i dla wskazanego pliku. Odbiera jedynie możliwość pominięcia sprawdzenia
    w całości, bez śladu i bez decyzji.
  en: |
    A package delivered as an archive is checked by the machine's antivirus protection
    before it is unpacked. The check happens at the moment where it makes sense: before
    the contents reach the disk and before anything of them is run.

    The installer, though, allows that check to be passed over. The switch exists to get
    round a false alarm - a situation real enough in itself, since installers of utility
    programs are sometimes reported by protection although they are in order.

    The trouble is that the switch does not tell a false alarm from a true one. To the
    person installing, both look the same: protection stopped the installation, and the
    documentation holds a switch that unblocks it. The decision to pass the check over
    is then taken with no knowledge at all of what was reported and why.

    Blocking the switch does not take away the means of dealing with a false alarm -
    that is what an exception in the protection is for, granted deliberately and for a
    named file. It takes away only the means of passing the check over altogether, with
    no trace and no decision.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy instalacje z archiwów są w organizacji
    prowadzone i czy zdarzało się je odblokowywać tym przełącznikiem.

    Na maszynie, na której takich instalacji się nie prowadzi, zmiana nie robi
    nic. Nie dotyczy zwykłych instalatorów ani pakietów pobieranych z repozytorium
    — wyłącznie pakietów dostarczonych jako archiwum lokalne.

    Tam, gdzie się je prowadzi, skutek pojawi się dopiero w chwili, gdy ochrona
    coś zgłosi. Wcześniej nic się nie zmieni. Kiedy zgłosi, instalacja zostanie
    przerwana i nie będzie już szybkiego sposobu, żeby ją przepchnąć. Droga
    prowadzi wtedy przez osobę odpowiedzialną za ochronę: obejrzenie zgłoszenia
    i, jeśli jest fałszywe, nadanie wyjątku.

    Jest to krok wolniejszy i tak należy go przedstawić przed wdrożeniem —
    razem z informacją, kto ten wyjątek nadaje i w jakim czasie. Bez tego
    pierwsze zatrzymanie instalacji skończy się wnioskiem o cofnięcie zasady.

    Nie ma restartu.
  en: |
    What needs checking is whether installations from archives are done in the
    organisation and whether they have ever been unblocked with that switch.

    On a machine where such installations are not done, the change does nothing. It does
    not concern ordinary installers or packages fetched from a repository - only
    packages delivered as a local archive.

    Where they are done, the effect will appear only at the moment protection reports
    something. Before that nothing changes. When it does report, the installation will
    be broken off and there will no longer be a quick way of pushing it through. The
    route then leads through whoever is answerable for the protection: looking at the
    report and, if it is false, granting an exception.

    That is a slower step and it should be presented as one before the rollout -
    together with who grants that exception and how quickly. Without that, the first
    installation stopped will end in a request to undo the policy.

    There is no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - removable-media
  what_breaks:
    pl:
      - Instalacja pakietu z archiwum zgłoszonego przez ochronę nie da się przepchnąć przełącznikiem
      - Odblokowanie fałszywego alarmu wymaga nadania wyjątku przez osobę odpowiedzialną za ochronę
      - Skrypt instalacyjny używający tego przełącznika kończy się błędem
      - Instalacja pakietu, którego ochrona nie zgłasza, przebiega bez żadnej zmiany
    en:
      - An installation from an archive reported by protection cannot be pushed through with the switch
      - Unblocking a false alarm takes an exception granted by whoever is answerable for the protection
      - An installation script using that switch ends in an error
      - Installing a package protection does not report runs with no change at all
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nikt nie jest w stanie nadać wyjątku w ochronie w czasie krótszym niż okno wdrożenia
      - Narzędzia używane w organizacji są regularnie zgłaszane fałszywie i wyjątki nie są prowadzone
    en:
      - Nobody can grant an exception in the protection sooner than the rollout window
      - Tools used in the organisation are regularly reported falsely and no exceptions are kept
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableLocalArchiveMalwareScanOverride'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableLocalArchiveMalwareScanOverride'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableLocalArchiveMalwareScanOverride' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Punkt dotyczy wyłącznie archiwów instalowanych lokalnie. Pakiety pobierane
    z repozytorium przechodzą inną drogę i rozstrzyga o nich sprawdzenie skrótu,
    opisane osobną regułą tej rodziny.

    Skuteczność zależy od tego, czy ochrona na maszynie w ogóle sprawdza
    archiwa. Tam, gdzie sprawdzanie archiwów jest wyłączone — a bywa wyłączane
    dla wydajności — ten punkt nie ma czego egzekwować. Warto ustawić obie
    rzeczy razem.

    Gałąź zasad jest wspólna dla wszystkich ustawień tego instalatora, więc
    wycofanie usuwa wyłącznie sam wpis.
  en: |
    The item concerns archives installed locally alone. Packages fetched from a
    repository take another route and are settled by the digest check, described by a
    rule of its own in this family.

    How much it achieves rests on whether the protection on the machine checks archives
    at all. Where checking archives is switched off - and it is sometimes switched off
    for speed - this item has nothing to enforce. The two are worth setting together.

    The policy key is shared by every setting of this installer, so rollback removes the
    entry alone.
