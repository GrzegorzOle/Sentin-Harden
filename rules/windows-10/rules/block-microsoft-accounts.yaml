id: win10-block-microsoft-accounts

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zakładanie i logowanie kontem powiązanym z dostawcą zablokowane
    en: The making of and signing in by a provider-linked account blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje zarówno dodawanie do maszyny kont powiązanych
    z dostawcą systemu, jak i logowanie się takimi kontami.

    Rzecz dotyczy tego, gdzie leżą poświadczenia otwierające tę maszynę.
    Konto powiązane uwierzytelnia się poza nią, u dostawcy, więc o tym,
    kto się zaloguje, rozstrzyga hasło, którego ta maszyna nigdy nie widziała
    i którego jej administrator nie może ani zmienić, ani unieważnić, ani
    sprawdzić.

    Skutki są trzy i każdy istotny osobno. Odejście człowieka z organizacji
    nie odbiera mu dostępu, bo konto należy do niego, nie do organizacji.
    Wyciek hasła u dostawcy otwiera maszynę bez żadnego zdarzenia po jej
    stronie. Zasady haseł ustawione na maszynie tego konta nie obejmują,
    więc cały blok reguł o hasłach omija je w całości.

    Wartość ustawienia polega więc na sprowadzeniu wszystkich dróg wejścia
    do zbioru, nad którym organizacja ma władzę. Nie chodzi o to, że konto
    u dostawcy jest słabsze — chodzi o to, że nie jest jej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę wejścia
    opartą o poświadczenia spoza maszyny, niepodlegające jej zasadom haseł
    ani jej administratorowi.
  en: |
    The setting blocks both the adding to the machine of accounts linked to the system's provider and the
    signing in by such accounts.

    The matter touches where the credentials that open this machine lie. A linked account authenticates away
    from it, at the provider, so who signs in is settled by a password this machine has never seen and which its
    administrator can neither change, nor void, nor examine.

    There are three consequences and each matters apart. A person's leaving the organisation does not take their
    access away, the account belonging to them and not to it. A leak of the password at the provider opens the
    machine with no event on its side at all. The password policies set on the machine do not cover that
    account, so the whole block of rules about passwords passes it by entirely.

    The setting's value rests therefore on bringing every road in down to a set the organisation has power over.
    The point is not that an account at the provider is weaker - the point is that it is not theirs.

    What an attacker gains while the item goes unmet: a road in resting on credentials from outside the machine,
    bound neither by its password policies nor by its administrator.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana potrafi odciąć człowieka
    od jego własnego profilu.

    Polecenie naprawcze sprawdza to przed wykonaniem. Czyta konta na maszynie
    i odmawia zapisu, gdy któreś konto powiązane jest włączone. Jest to druga
    reguła w tej paczce, która może odmówić, i powód jest tu ten sam:
    wykonanie na ślepo zamieniłoby utwardzenie w utratę dostępu.

    Tam, gdzie takich kont nie ma, zmiana blokuje wyłącznie zakładanie ich
    w przyszłości. Widać to przy pierwszym uruchomieniu maszyny i przy
    dodawaniu użytkownika — droga przez konto powiązane znika z okna,
    zostaje konto lokalne.

    Odnotowuję skutek uboczny, który bywa zaskoczeniem: ustawienie dotyczy
    logowania do maszyny, nie logowania do aplikacji. Sklep i aplikacje
    proszące o konto dostawcy działają dalej, o ile wolno im pytać osobno.
    Reguła sąsiednia zamyka i to, i warto tych dwóch nie mylić.

    Czego to nie psuje: kont lokalnych, kont domenowych, profilów już
    istniejących, usług systemowych, sieci, drukowania, aplikacji.
  en: |
    The class is "needs a planned rollout", the change being able to cut a person off from their own profile.

    The remedy command reviews that before running. It reads the accounts on the machine and refuses to write
    where any linked account is switched on. It is the second rule in this pack that may refuse, and the reason
    here is the same: a blind carrying out would turn a hardening into a loss of access.

    Where there are no such accounts, the change blocks only the making of them hereafter. It is seen at the
    machine's first start and at the adding of a user - the road by a linked account goes from the window, the
    local account remains.

    I set down a side consequence that comes at times as a surprise: the setting touches signing in to the
    machine, not signing in to an application. The store and applications asking for a provider's account work
    on, so far as they may ask apart. The neighbouring rule closes that too, and it is well not to confuse the
    two.

    What this does not break: local accounts, domain accounts, profiles already there, system services, the
    network, printing, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - updates-and-servicing
  what_breaks:
    pl:
      - Dodanie do maszyny nowego konta powiązanego z dostawcą przestaje być możliwe przy zakładaniu użytkownika
      - Polecenie naprawcze odmawia wykonania, gdy na maszynie jest włączone konto powiązane, żeby nie odciąć nikogo od profilu
      - Przy pierwszym uruchomieniu maszyny droga przez konto powiązane znika z okna i zostaje konto lokalne
      - Sklep i aplikacje proszące o konto dostawcy działają dalej, bo ustawienie dotyczy logowania do maszyny, nie do aplikacji
      - Konta lokalne, konta domenowe, profile już istniejące oraz usługi systemowe i sieć pozostają bez zmian
    en:
      - Adding a new provider-linked account to the machine ceases to be possible when a user is being made
      - The remedy command refuses to run where a linked account is switched on, that nobody be cut off from their profile
      - At the machines first start the road by a linked account goes from the window and the local account remains
      - The store and applications asking for a providers account work on, the setting touching a signing in to the machine and not to an application
      - Local accounts, domain accounts, profiles already there and system services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracują ludzie logujący się kontem powiązanym i nie przygotowano im kont lokalnych
      - Maszyna jest wydawana użytkownikowi do samodzielnego uruchomienia i konto powiązane jest jedyną przewidzianą drogą
    en:
      - People work on the machine signing in by a linked account and no local accounts have been prepared for them
      - The machine gets handed to a user to start by themselves and a linked account is the only road foreseen
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'NoConnectedUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'NoConnectedUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The accounts already on the machine are read first. Blocking the sign-in
    # where such an account is switched on would shut its owner out of their own
    # profile, so the change refuses to run instead.
    $connected = @(Get-LocalUser -ErrorAction Stop | Where-Object {
      $_.Enabled -and $_.PrincipalSource -eq 'MicrosoftAccount'
    })
    if ($connected.Count -gt 0) {
      throw "Enabled connected accounts on this machine: $($connected.Name -join ', '). Blocking sign-in would lock them out - refusing."
    }
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoConnectedUser' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-block-microsoft-accounts

notes:
  pl: |
    Reguła jest w tym bloku tą, przy której najłatwiej wyrządzić szkodę
    wykonaniem bez sprawdzenia, i dlatego polecenie naprawcze sprawdza
    za użytkownika. Warto, żeby aplikacja pokazała treść tego sprawdzenia
    w symulacji — wymienienie kont, które by ucierpiały, jest tu treścią
    ostrzeżenia, a nie jego ozdobą.

    Argument wart postawienia wprost brzmi: nie chodzi o to, że konto
    u dostawcy jest słabo chronione, tylko o to, że nie podlega tej
    organizacji. Cały blok reguł o hasłach — długość, wygasanie, historia,
    blokada — omija takie konto w całości. Aplikacja, która to powie,
    tłumaczy regułę jednym zdaniem.

    Odnotowuję granicę wobec reguły sąsiedniej. Ta blokuje logowanie do
    maszyny; osobna blokuje uwierzytelnianie aplikacji. Pokazywanie ich
    razem jest potrzebne, bo użytkownik oczekujący po tej regule odcięcia
    sklepu uzna ją za niedziałającą.
  en: |
    The rule is the one in this block at which harm is most easily done by a carrying out without a check, and
    for that the remedy command checks for the user. It is well that the application show what that check finds
    in the simulation - the naming of the accounts that would suffer is here the warning's content and not its
    ornament.

    The argument worth putting outright runs thus: the point is not that an account at the provider is poorly
    guarded, but that it is not subject to this organisation. The whole block of rules about passwords - length,
    expiry, history, locking - passes such an account by entirely. An application saying so explains the rule in
    one sentence.

    I set down the boundary against the neighbouring rule. This one blocks a signing in to the machine; a
    separate one blocks the authenticating of applications. Showing them together is needed, a user expecting
    this rule to cut the store off judging it not to work.
