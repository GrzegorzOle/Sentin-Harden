id: win2025-password-reversible-encryption-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Przechowywanie haseł w postaci odwracalnej wyłączone
    en: Keeping passwords in a reversible form switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje przechowywania haseł kont w postaci, z której da się
    odtworzyć hasło pierwotne.

    Nazwa ustawienia mówi o szyfrowaniu i to jest źródłem nieporozumienia,
    które trzeba tu rozwiać. Hasła normalnie nie są szyfrowane — są
    przekształcane funkcją jednokierunkową, z której hasła odtworzyć nie
    można; da się jedynie sprawdzić, czy podane hasło pasuje. Włączenie tego
    ustawienia zmienia to zasadniczo: hasło jest szyfrowane kluczem, który
    system trzyma przy sobie, a więc jest odwracalne.

    W praktyce znaczy to, że hasła kont są na tej maszynie przechowywane
    w postaci równoważnej tekstowi jawnemu. Klucz jest w systemie, więc kto
    ma bazę kont, ten ma hasła — wszystkie, w oryginalnym brzmieniu, gotowe
    do użycia także poza tą maszyną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła
    w postaci czytelnej, bez łamania czegokolwiek. Na kontrolerze domeny
    oznacza to hasła wszystkich kont w domenie naraz. Jest to jeden
    z nielicznych punktów benchmarku, przy których pojedyncze niedopatrzenie
    przekreśla całą resztę zabezpieczeń dotyczących haseł: ich długość,
    budowę, historię i wygasanie.

    Dlatego kategoria jest krytyczna, choć samo ustawienie bywa opisywane
    jako techniczny szczegół zgodności.
  en: |
    The setting bans the keeping of accounts' passwords in a form from which the original
    password can be recovered.

    The setting's name speaks of encryption and that is the source of a misunderstanding to
    be cleared up here. Passwords are normally not encrypted - they are transformed by a
    one-way function from which a password cannot be recovered; one can only check whether
    a given password matches. Switching this setting on changes that fundamentally: the
    password is encrypted with a key the system keeps by it, and so is reversible.

    In practice that means the accounts' passwords are kept on this machine in a form
    equivalent to plain text. The key is in the system, so whoever has the accounts
    database has the passwords - all of them, in their original wording, ready to use
    beyond this machine as well.

    What an attacker gains while the item goes unmet: passwords in a legible form, without
    breaking anything. On a domain controller that means the passwords of every account in
    the domain at once. It is one of the few items of the benchmark at which a single
    oversight cancels all the rest of the safeguards concerning passwords: their length,
    make-up, history and expiry.

    Hence the category is critical, though the setting itself is sometimes described as a
    technical detail of compliance.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na serwerze pracuje uwierzytelnianie
    wymagające znajomości hasła pierwotnego — bo ono jest jedynym powodem,
    dla którego ktoś to ustawienie kiedykolwiek włącza.

    Mechanizmów takich jest kilka i wszystkie pochodzą sprzed lat:
    uwierzytelnianie skrótem stosowane w dostępie zdalnym, uwierzytelnianie
    zgodne ze starszym protokołem dostępu do katalogu oraz część
    mechanizmów uwierzytelniania połączeń zdalnych. Wspólną ich cechą jest
    to, że serwer musi znać hasło, a nie tylko potrafić je sprawdzić.

    Jeżeli któryś z nich jest w użyciu, wyłączenie ustawienia odetnie
    logowanie tą drogą. Objaw jest natychmiastowy i jednoznaczny.

    W przeważającej większości instalacji żaden z nich nie jest używany,
    a ustawienie bywa włączone przypadkiem — odziedziczone z szablonu
    sprzed lat albo włączone kiedyś dla jednej aplikacji, której już nie ma.

    Hasła przechowane wcześniej w postaci odwracalnej nie znikają w chwili
    zmiany. Znikają dopiero przy następnej zmianie hasła każdego konta
    z osobna, i o tym trzeba wiedzieć: sama zmiana ustawienia nie usuwa
    materiału już zapisanego.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether authentication taking knowledge of the original password
    works on the server - since that is the one reason anyone ever switches this setting
    on.

    There are a few such mechanisms and all come from years ago: digest authentication used
    in remote access, authentication conforming to an older directory access protocol, and
    some of the mechanisms authenticating remote connections. Their common trait is that
    the server has to know the password rather than merely be able to check it.

    If any of them is in use, switching the setting off will cut off signing in by that
    road. The symptom is immediate and plain.

    In the great majority of installations none of them is used, and the setting is
    sometimes switched on by accident - inherited from a template of years ago, or switched
    on once for one application that is no longer there.

    Passwords kept earlier in a reversible form do not vanish at the moment of the change.
    They vanish only at the next password change of each account apart, and that has to be
    known: the change of the setting itself does not remove material already recorded.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Uwierzytelnianie wymagające znajomości hasła pierwotnego przestaje działać
      - Logowanie przez starszy mechanizm dostępu zdalnego kończy się odmową
      - Hasła zapisane wcześniej w postaci odwracalnej znikają dopiero przy ich zmianie
      - Logowanie zwykłe kont lokalnych i domenowych działa bez zmiany
    en:
      - Authentication taking knowledge of the original password stops working
      - Signing in by an older remote access mechanism ends in a refusal
      - Passwords recorded earlier in a reversible form vanish only when they are changed
      - Ordinary signing in of local and domain accounts works unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje uwierzytelnianie skrótem wymagające znajomości hasła pierwotnego
      - Aplikacja katalogowa sprzed lat uwierzytelnia użytkowników mechanizmem wymagającym hasła jawnego
    en:
      - Digest authentication taking knowledge of the original password works on the server
      - A directory application from years ago authenticates users by a mechanism taking a plain password
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ClearTextPassword\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^ClearTextPassword\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'ClearTextPassword'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ClearTextPassword = 0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue
    # The material already recorded goes only at the next change of each
    # account's password.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ClearTextPassword = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption

notes:
  pl: |
    Punkt jest w całej grupie haseł jedynym o kategorii krytycznej i warto
    wiedzieć, dlaczego akurat on. Pozostałe podnoszą koszt zdobycia hasła;
    ten przesądza, czy hasło w ogóle trzeba zdobywać.

    Samo wyłączenie ustawienia nie usuwa haseł zapisanych wcześniej
    w postaci odwracalnej. Tam, gdzie ustawienie było włączone dłużej,
    domknięciem tej reguły jest wymuszenie zmiany haseł — i jest to osobna
    decyzja, której reguła nie podejmuje za nikogo.

    To samo ustawienie istnieje także jako właściwość pojedynczego konta
    i wtedy obowiązuje niezależnie od zasady. Reguła sprawdza zasadę, więc
    wynik spełniony nie wyklucza pojedynczych kont z włączoną właściwością.
    Jest to znane ograniczenie tego sprawdzenia i warto je zweryfikować
    osobno.
  en: |
    The item is the only one of critical category in the whole password group and it is
    worth knowing why that one. The rest raise the cost of taking a password; this one
    settles whether a password has to be taken at all.

    Switching the setting off does not by itself remove passwords recorded earlier in a
    reversible form. Where the setting was on for longer, this rule is completed by forcing
    a change of passwords - and that is a separate decision the rule takes for nobody.

    The same setting exists as a property of a single account as well, and then binds
    regardless of the policy. The rule checks the policy, so a met result does not rule out
    single accounts with the property switched on. That is a known limit of this check and
    is worth verifying apart.
