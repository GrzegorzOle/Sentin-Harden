id: win11-bitlocker-removable-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Odczyt chronionego nośnika wymiennego w starszych wersjach systemu wyłączony
    en: Reading a protected removable medium on earlier system versions disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy chroniony nośnik wymienny ma być przygotowany
    tak, aby dał się odczytać w systemach starszych niż ten, w którym został
    zaszyfrowany.

    Mechanizm jest ten sam co przy dyskach stałych: na nośniku zakłada się
    niewielki obszar w starym formacie zapisu, poza szyfrowaniem, i umieszcza
    w nim program odczytujący. Różnica polega na tym, na czym ten obszar
    się znajduje i dokąd trafia.

    Nośnik wymienny jest z definicji przenoszony między maszynami, w tym
    obcymi. Jawny, zapisywalny obszar na nośniku, który bywa podłączany
    u klienta, w punkcie usługowym albo u kogoś w domu, wraca do maszyny
    z zawartością, nad którą nikt nie panował. Przy dysku stałym jest to
    możliwość teoretyczna; tutaj jest to codzienność tego nośnika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce na
    nośniku, w którym może zapisać, co chce, bez znajomości hasła do części
    chronionej, oraz program uruchamiany z nośnika w chwili jego otwarcia.
    Użytkownik podłącza nośnik spodziewając się prośby o hasło, a nie
    uruchomienia czegokolwiek.

    Dane w części chronionej pozostają zaszyfrowane niezależnie od tego
    ustawienia. Punkt dotyczy wyłącznie tego, co nośnik niesie obok nich.
  en: |
    The setting settles whether a protected removable medium is to be prepared so that it
    can be read on systems older than the one it was encrypted on.

    The mechanism is the same as with fixed disks: a small area in the old recording
    format is laid down on the medium, outside the encryption, and a reading program is
    placed in it. The difference lies in what that area sits on and where it travels.

    A removable medium is by definition carried between machines, other people's among
    them. An area in the clear that can be written to, on a medium sometimes plugged in at
    a customer's, at a service point or in somebody's home, comes back to the machine with
    contents nobody had charge of. With a fixed disk that is a theoretical possibility;
    here it is that medium's everyday life.

    What an attacker gains while the item goes unmet: room on the medium where they may
    write what they like, without knowing the password to the protected part, and a
    program started from the medium the moment it is opened. The user plugs the medium in
    expecting a request for a password, not the starting of anything.

    The data in the protected part stay encrypted whatever this setting says. The item
    concerns only what the medium carries alongside them.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy chronione nośniki wymienne bywają otwierane na
    systemach sprzed kilku wersji — i tutaj odpowiedź bywa twierdząca częściej
    niż przy dyskach stałych.

    Typowe przypadki to sprzęt, który zostaje przy stanowisku pracy dłużej niż
    komputery: maszyna sterująca, stanowisko pomiarowe, komputer przy linii
    produkcyjnej, kasa. Bywa, że pracuje na systemie, którego nikt nie
    aktualizował od lat, bo producent urządzenia nie przewidział aktualizacji.
    Jeżeli nośniki krążą między takim stanowiskiem a maszyną biurową, po
    zmianie przestaną się tam otwierać.

    Warto to ustalić przed wdrożeniem, bo objaw jest mylący: nośnik na starym
    systemie będzie widoczny jako niesformatowany albo uszkodzony, a nie jako
    chroniony. Użytkownik uzna, że nośnik się zepsuł, i może go sformatować.

    Nośniki przygotowane przed wdrożeniem zasady zachowują swój obszar
    zgodności i otwierają się dalej. Zmiana dotyczy tych, które zostaną
    zaszyfrowane później.

    Odczyt i zapis na maszynach z systemem wspieranym nie zmienia się w żaden
    sposób.
  en: |
    What needs checking is whether protected removable media are sometimes opened on
    systems several versions old - and here the answer is yes more often than with fixed
    disks.

    The usual cases are equipment that stays at a workplace longer than computers do: a
    control machine, a measuring station, a computer by a production line, a till.
    Sometimes it runs a system nobody has updated for years, because the equipment's maker
    made no provision for updates. If media circulate between such a station and an office
    machine, after the change they will stop opening there.

    That is worth establishing before a rollout, since the symptom misleads: on the old
    system the medium will show as unformatted or damaged rather than as protected. The
    user will judge the medium to have failed, and may format it.

    Media prepared before the policy was applied keep their compatibility area and go on
    opening. The change concerns those that are encrypted later.

    Reading and writing on machines with a supported system does not change in any way.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nośnika chronionego po wdrożeniu zasady nie otworzy stanowisko z systemem sprzed kilku wersji
      - Na starym systemie nośnik jest widoczny jako niesformatowany, co bywa brane za awarię
      - Nośniki przygotowane wcześniej zachowują swój obszar zgodności i otwierają się dalej
      - Odczyt i zapis na maszynach z systemem wspieranym nie zmienia się w żaden sposób
    en:
      - A medium protected after the policy is applied will not open on a station several system versions old
      - On an old system the medium shows as unformatted, which is sometimes taken for a failure
      - Media prepared earlier keep their compatibility area and go on opening
      - Reading and writing on machines with a supported system does not change in any way
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki krążą między maszyną a stanowiskiem na niewspieranym systemie, którego nie da się wymienić
      - Chronione nośniki są przekazywane odbiorcom, nad których sprzętem nie ma kontroli
    en:
      - Media circulate between the machine and a station on an unsupported system that cannot be replaced
      - Protected media are handed to recipients whose equipment is beyond control
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the
      # word <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: <none>
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'RDVDiscoveryVolumeType' -ErrorAction SilentlyContinue).'RDVDiscoveryVolumeType'
    [pscustomobject]@{
      path        = $path
      name        = 'RDVDiscoveryVolumeType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła zamyka parę z bliźniaczą, dotyczącą dysków stałych. Obie warto
    czytać razem, ale to ta ma znaczenie praktyczne: dysk stały rzadko trafia
    do obcej maszyny, nośnik wymienny robi to z założenia.

    Oczekiwany zapis to dosłownie słowo w nawiasach ostrych, a nie opis braku
    wartości. Brak wartości jest stanem osobnym i sprawdzenie zgłasza go
    inaczej.

    Zasada działa przy zakładaniu ochrony i nie usunie obszaru zgodności
    z nośnika już przygotowanego. Nośniki w obiegu trzeba przygotować od nowa,
    jeżeli ich jawny obszar ma zniknąć.

    Przed wdrożeniem warto sprawdzić, czy w organizacji są stanowiska na
    niewspieranym systemie, do których nośniki trafiają. Reguła sama tego nie
    wykryje, bo skutek ujawnia się na innej maszynie niż ta, na której zasadę
    ustawiono.
  en: |
    The rule closes the pair with its twin for fixed disks. Both are worth reading
    together, but it is this one that carries practical weight: a fixed disk rarely
    reaches another machine, a removable medium does so by design.

    The expected entry is literally a word in angle brackets, not a description of a
    missing value. A missing value is a separate state and the check reports it
    differently.

    The policy works when protection is being set up and will not remove the compatibility
    area from a medium already prepared. Media in circulation have to be prepared afresh
    if their area in the clear is to go.

    Before a rollout it is worth checking whether the organisation has stations on an
    unsupported system that media reach. The rule will not detect this itself, since the
    effect shows on a machine other than the one the policy was set on.
