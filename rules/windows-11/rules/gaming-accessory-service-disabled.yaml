id: win11-gaming-accessory-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi urządzeń sterujących do gier wyłączona
    en: The service handling game controllers disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obsługuje urządzenia sterujące do gier podłączone do maszyny:
    rozpoznaje je, zarządza ich konfiguracją i pilnuje aktualizacji ich
    oprogramowania układowego.

    Ostatnia z tych czynności jest jedyną, która zasługuje na uwagę
    w rozważaniach o bezpieczeństwie. Usługa pobiera oprogramowanie układowe
    z sieci i wgrywa je do urządzenia podłączonego do maszyny — jest to więc
    ścieżka, która kończy się zapisem kodu do sprzętu, prowadzona przez
    składnik działający stale i z wysokimi uprawnieniami.

    Poza tym jednym wątkiem kategoria ryzyka jest niska i podnoszenie jej
    byłoby nadużyciem. Usługa nie wystawia niczego do sieci i nie obsługuje
    połączeń przychodzących.

    Powód, dla którego punkt istnieje, jest więc przede wszystkim
    porządkowy: na stanowisku służbowym urządzenia sterujące do gier nie są
    używane, a składnik, który stale czeka na ich podłączenie, jest
    powierzchnią bez zastosowania.
  en: |
    The service handles game controllers attached to the machine: it recognises them,
    manages their configuration and watches over updates to their firmware.

    The last of these is the only one deserving attention where security is concerned.
    The service fetches firmware from the network and writes it into a device attached to
    the machine - so it is a path ending in code being written to hardware, run by a
    component working all the time and with high rights.

    Apart from that single thread the risk category is low and raising it would be an
    abuse. The service puts nothing out to the network and handles no incoming
    connections.

    The reason the item exists is therefore chiefly one of good order: at a work station
    game controllers are not used, and a component waiting all the time for one to be
    attached is surface with no use.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno pytanie, ale zadane szerzej niż o gry.

    Urządzenia sterujące tego rodzaju bywają używane poza grami i jest to
    przypadek, o którym trzeba powiedzieć wprost. Służą jako urządzenia
    wspomagające dla osób, którym trudno korzystać z myszy i klawiatury, jako
    sterowniki w programach do projektowania i modelowania, a także jako
    element stanowisk prezentacyjnych. W każdym z tych zastosowań wyłączenie
    usługi odbiera możliwość korzystania ze sprzętu, który nie ma nic wspólnego
    z rozrywką.

    Przypadek wspomagania dostępności zasługuje na osobne potraktowanie.
    Jeżeli takie urządzenie jest dla kogoś podstawowym sposobem obsługi
    komputera, punkt nie powinien być wdrażany na tej maszynie, a świadome
    odpuszczenie go z zapisanym uzasadnieniem jest wynikiem prawidłowym.

    Poza tymi zastosowaniami zmiana nie robi nic zauważalnego. Urządzenia
    wskazujące, klawiatury i pozostały sprzęt wejściowy działają dalej —
    obsługuje je inny mechanizm.

    Zmiana wymaga zatrzymania usługi.
  en: |
    One question needs checking, but asked more widely than about games.

    Controllers of this kind are sometimes used outside games, and that is a case which
    has to be stated outright. They serve as assistive devices for people who find a
    mouse and keyboard hard to use, as controllers in design and modelling programs, and
    as part of presentation stations. In each of these uses disabling the service takes
    away the means of using hardware that has nothing to do with entertainment.

    The accessibility case deserves separate treatment. If such a device is somebody's
    main way of working a computer, the item should not be applied on that machine, and
    deliberately accepting it with a written reason is a proper outcome.

    Outside these uses the change does nothing noticeable. Pointing devices, keyboards
    and the rest of the input hardware carry on working - another mechanism handles them.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Urządzenie sterujące podłączone do maszyny przestaje być rozpoznawane i konfigurowane
      - Urządzenie używane jako wspomagające dla osoby z trudnościami w obsłudze przestaje działać
      - Aktualizacja oprogramowania układowego takiego urządzenia przestaje być wykonywana
      - Urządzenia wskazujące, klawiatury i pozostały sprzęt wejściowy działają dalej bez zmiany
    en:
      - A controller attached to the machine stops being recognised and configured
      - A device used as an aid by somebody who finds a computer hard to work stops working
      - Updating such a device's firmware stops being done
      - Pointing devices, keyboards and the rest of the input hardware carry on unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Urządzenie sterujące jest dla kogoś podstawowym sposobem obsługi komputera
      - Program do projektowania albo modelowania korzysta z takiego urządzenia jako sterownika
      - Stanowisko prezentacyjne obsługuje się urządzeniem sterującym tego rodzaju
    en:
      - A controller is somebody's main way of working a computer
      - A design or modelling program uses such a device as a controller
      - A presentation station is operated with a controller of this kind
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxGipSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxGipSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XboxGipSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XboxGipSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XboxGipSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/hid/

notes:
  pl: |
    Reguła należy do czwórki opisującej platformę gier, ale jest w niej
    jedyną, która dotyka sprzętu. Z tego powodu jej skutki bywają szersze niż
    pozostałych trzech i przed wdrożeniem warto sprawdzić, co jest do maszyny
    podłączone, zamiast pytać, czy ktoś gra.

    Punkt nie dotyczy urządzeń sterujących podłączanych jako zwykły sprzęt
    wejściowy bez tego mechanizmu. Część urządzeń starszego rodzaju działa
    właśnie tak i po wyłączeniu usługi nadal będzie działać, choć bez
    konfiguracji i bez aktualizacji oprogramowania układowego.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa uruchamiana przy podłączeniu urządzenia bywa
    zatrzymana i mimo to niezgodna.
  en: |
    The rule belongs to the quartet describing the gaming platform but is the only one in
    it that touches hardware. For that reason its effects are sometimes wider than the
    other three's, and before a rollout it is worth checking what is attached to the
    machine rather than asking whether anybody plays.

    The item does not concern controllers attached as ordinary input hardware without
    this mechanism. Some devices of an older kind work just so and will go on working
    once the service is off, though with no configuration and no firmware updates.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment. A service started when a device is attached is sometimes stopped
    and deviating all the same.
