id: win11-sandbox-networking-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Dostęp piaskownicy do sieci wyłączony
    en: The sandbox's access to the network switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Piaskownica z dostępem do sieci nie jest odizolowana — jest odizolowana od
    dysku maszyny i od niczego więcej. Dostaje własną kartę sieciową wpiętą
    w sieć, w której stoi gospodarz, a to znaczy, że wszystko, co w niej
    uruchomiono, widzi tę sieć tak samo jak każdy inny komputer.

    Skutki są dwa i oba istotne. Kod uruchomiony w piaskownicy może sięgnąć do
    zasobów sieci firmowej — udziałów, drukarek, paneli zarządzania urządzeniami
    — czyli zrobić dokładnie to, przed czym miała chronić izolacja. Może też
    nawiązać połączenie na zewnątrz i pobrać kolejną część tego, co miało zostać
    zbadane, albo zgłosić się do swojego operatora.

    Odcięcie sieci sprawia, że z piaskownicy nie da się wyjść w żadną stronę.
    Pozostaje tym, za co ją się bierze: miejscem, w którym coś się otwiera i po
    zamknięciu przestaje istnieć.
  en: |
    A sandbox with access to the network is not isolated - it is isolated from the
    machine's disk and from nothing else. It gets a network card of its own plugged
    into the network the host stands in, which means everything started in it sees
    that network exactly as any other computer does.

    There are two effects and both matter. Code running in the sandbox can reach the
    company network's resources - shares, printers, device management panels - that
    is, do exactly what the isolation was meant to guard against. It can also make a
    connection outwards and fetch the next part of what was to be examined, or
    report to its operator.

    Cutting the network off means there is no way out of the sandbox in any
    direction. It stays what it is taken for: a place where something is opened and
    stops existing once it is closed.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, do czego na stanowiskach służy piaskownica.

    Na maszynie bez włączonej piaskownicy zmiana nie ma skutku. Tam, gdzie jest
    używana, odcięcie sieci wyłącza wszystkie zastosowania oparte na pobieraniu:
    otwarcie odsyłacza, sprawdzenie strony, zainstalowanie w środku programu
    pobranego z sieci, przetestowanie instalatora sięgającego po składniki.
    Zostają wyłącznie te, w których materiał wnosi się do środka gotowy.

    Dla wielu zespołów jest to zmiana zakresu, a nie drobne ograniczenie —
    piaskownica przestaje służyć do oglądania rzeczy z sieci, a zaczyna wyłącznie
    do uruchamiania plików. Warto to rozstrzygnąć przed wdrożeniem, bo alternatywą
    bywa maszyna wirtualna w osobnej sieci, którą trzeba wcześniej przygotować.

    Objawem jest brak łączności w piaskownicy przy sprawnej sieci na maszynie
    gospodarza.

    Nie ma restartu maszyny. Zmiana obowiązuje przy następnym uruchomieniu
    piaskownicy.
  en: |
    What needs checking is what the sandbox serves for at the stations.

    On a machine with the sandbox not switched on the change has no effect. Where it
    is used, cutting the network off ends every use resting on fetching: opening a
    link, checking a page, installing inside it a program fetched from the network,
    testing an installer that reaches for components. Only the uses where material
    is brought inside ready remain.

    For many teams this is a change of scope rather than a small limit - the sandbox
    stops serving to look at things from the network and starts serving only to run
    files. It is worth settling before the rollout, because the alternative is often
    a virtual machine on a separate network, which has to be prepared in advance.

    The symptom is no connectivity in the sandbox while the network on the host
    machine works.

    There is no machine restart. The change takes effect the next time the sandbox
    starts.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - network-and-firewall
  what_breaks:
    pl:
      - Programy uruchomione w piaskownicy stracą łączność z siecią i z internetem
      - Otwarcie odsyłacza ani sprawdzenie strony w piaskownicy przestanie być możliwe
      - Instalatory sięgające w trakcie pracy po składniki z sieci nie zainstalują się w piaskownicy
    en:
      - Programs running in the sandbox lose connectivity to the network and the internet
      - Opening a link or checking a page in the sandbox stops being possible
      - Installers reaching for components from the network while they work will not install in the sandbox
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica służy do sprawdzania odsyłaczy i stron, a nie przygotowano dla tego zastosowania maszyny w osobnej sieci
    en:
      - The sandbox serves to check links and pages, and no machine on a separate network has been prepared for that use
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      $name = 'AllowNetworking'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $name = 'AllowNetworking'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowNetworking' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Punkt tworzy parę z wyłączeniem wspólnego schowka i oba wdraża się razem.
    Rozdzielone dają układ niespójny: piaskownica bez sieci, ale ze schowkiem,
    wciąż ma kanał na zewnątrz, a piaskownica z siecią, ale bez schowka, ma go
    tym bardziej.

    Ustawienie ma pierwszeństwo przed plikiem konfiguracyjnym piaskownicy —
    wpis w pliku włączający sieć nie zadziała, kiedy ten punkt jest wdrożony.

    Uciążliwość jest tu wyraźnie wyższa niż przy schowku i celowo oceniam je
    osobno, mimo wspólnego wdrożenia. Odcięcie sieci zmienia zakres zastosowań
    piaskownicy, a nie tylko wygodę pracy z nią.
  en: |
    The item pairs with switching the shared clipboard off, and the two are applied
    together. Split apart they give an inconsistent arrangement: a sandbox without
    the network but with the clipboard still has a channel out, and a sandbox with
    the network but without the clipboard has one all the more.

    The setting takes precedence over the sandbox's configuration file - an entry in
    the file switching networking on will not work while this item is applied.

    The disruption here is markedly higher than with the clipboard, and I judge them
    apart on purpose despite the shared rollout. Cutting the network off changes
    what the sandbox can be used for, not merely how comfortable it is to work with.
