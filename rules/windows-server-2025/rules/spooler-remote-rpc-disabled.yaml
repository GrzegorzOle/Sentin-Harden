id: win2025-spooler-remote-rpc-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Zdalny punkt końcowy bufora wydruku wyłączony
    en: Remote endpoint of the print spooler disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Bufor wydruku wystawia punkt końcowy, przez który inne maszyny
    w sieci mogą go prosić o wykonanie czynności: dodanie drukarki,
    wgranie sterownika, wysłanie zadania. Ten punkt jest wystawiony
    domyślnie, także tam, gdzie żadna drukarka nie jest udostępniana.

    Bufor pracuje z uprawnieniami systemu. Wszystko, co przez ten punkt
    do niego dociera, jest wykonywane właśnie z tymi uprawnieniami —
    i to jest cała treść problemu. Kolejne błędy w tej usłudze prowadziły
    do wykonania cudzego kodu na najwyższym poziomie uprawnień,
    zdalnie, bez udziału człowieka po stronie zaatakowanej maszyny.

    Na serwerze dwie rzeczy podnoszą tę sprawę ponad to, czym jest na
    stanowisku roboczym.

    Pierwsza: bufor wydruku bywa uruchomiony na serwerach, które
    z drukowaniem nie mają nic wspólnego, bo usługa ta startuje sama
    i nikt jej nie wyłącza. Wystawiony punkt końcowy jest wtedy czystym
    kosztem — drogą wejścia bez żadnej funkcji w zamian.

    Druga: na kontrolerze domeny ta usługa wystawiona zdalnie jest drogą
    z sieci wprost do uprawnień systemowych na maszynie trzymającej
    bazę kont. Jest to jedna z najkrótszych znanych dróg do przejęcia
    całej domeny i dlatego pytanie pierwsze na każdym serwerze brzmi nie
    „czy zamknąć ten punkt", tylko „czy bufor wydruku ma tu w ogóle
    pracować".

    Ustawienie nie wyłącza usługi. Odbiera jej wyłącznie możliwość
    przyjmowania poleceń z sieci — bufor działa dalej i obsługuje
    drukowanie z tej maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zdalnie
    osiągalną usługę pracującą z uprawnieniami systemu, na maszynie,
    która często nie ma z drukowaniem nic wspólnego.
  en: |
    The print spooler holds out an endpoint through which other machines on the network may ask it
    to do things: add a printer, lay in a driver, send a job. That endpoint is held out by
    default, also where no printer is shared at all.

    The spooler works with the system's rights. Everything reaching it through that endpoint is
    done with just those rights - and therein lies the whole trouble. Fault after fault in this
    service has led to the running of another's code at the highest level of rights, from afar,
    with no person's part on the attacked machine's side.

    On a server two things raise this matter above what it is at a working station.

    The first: the print spooler is at times running on servers having nothing to do with
    printing, that service starting of itself and nobody switching it off. The endpoint held out
    is then a pure cost - a road in with no use given back.

    The second: on a domain controller this service held out to the network is a road from the
    network straight to the system's rights on the machine keeping the base of accounts. It is one
    of the shortest known roads to the taking of a whole domain, and hence the first question on
    every server is not "whether to shut this endpoint" but "whether the print spooler is to work
    here at all".

    The setting does not switch the service off. It takes from it only the means of taking orders
    from the network - the spooler works on and serves printing from this machine.

    What an attacker gains while the item goes unmet: a service reachable from afar working with
    the system's rights, on a machine that often has nothing to do with printing.

disruption_description:
  pl: |
    Ta zmiana nigdy nie idzie hurtem na serwerze i jest to różnica
    względem paczki stanowiska roboczego, gdzie zaliczyłem ją do klasy
    bez uciążliwości.

    Powód jest prosty: na stanowisku roboczym udostępnianie drukarki
    innym jest rzadkim wyjątkiem, a na serwerze bywa jego zadaniem.
    Serwer wydruku, na którym zamknie się ten punkt, przestaje obsługiwać
    drukowanie dla wszystkich swoich klientów naraz. Nie jest to
    pogorszenie działania — to jest wyłączenie roli.

    Warunek wstępny jest więc jeden i trzeba go rozstrzygnąć przed
    zmianą: czy ta maszyna udostępnia drukarki albo kolejki innym.
    Odpowiedź da wykaz udostępnionych drukarek na tej maszynie, nie
    domysł.

    Odpowiedź twierdząca nie kończy jednak sprawy, tylko ją przesuwa.
    Serwer wydruku z wystawionym punktem końcowym to dokładnie ta
    maszyna, o którą chodzi w opisie ryzyka. Rozwiązaniem nie jest
    pozostawienie punktu otwartego, tylko odcięcie go od sieci
    niezaufanej i ograniczenie kręgu maszyn, które mogą się z nim
    połączyć.

    Odpowiedź przecząca znaczy, że zmiana nie zepsuje niczego — ale
    wtedy właściwym pytaniem jest, czy bufor wydruku ma na tej maszynie
    w ogóle pracować. Zamknięcie punktu końcowego na serwerze, który
    nie drukuje, jest półśrodkiem wobec zatrzymania usługi.

    Zmiana wymaga ponownego uruchomienia bufora wydruku. Na serwerze
    wydruku oznacza to przerwanie zadań w toku i utratę tego, co stoi
    w kolejce — czyli skutek odczuwalny przez ludzi, którzy o zmianie
    nie wiedzą. Restart usługi planuje się poza godzinami pracy.

    Drukowanie z samej tej maszyny działa po zmianie bez różnicy.
  en: |
    This change never goes in bulk on a server, and that is a difference against the working
    station's pack, where I reckoned it to the class without disruption.

    The reason is plain: at a working station the sharing of a printer with others is a rare
    exception, and on a server it is at times its task. A print server on which this endpoint is
    shut stops serving printing for all its clients at once. It is no worsening of working - it is
    a switching off of the role.

    The precondition is therefore one and must be settled before the change: whether this machine
    shares printers or queues with others. The answer is given by the list of shared printers on
    this machine and not by a guess.

    An answer in the affirmative does not end the matter, though, but moves it. A print server
    with its endpoint held out is exactly the machine the description of risk is about. The
    remedy is not the leaving of the endpoint open but the cutting of it off from the untrusted
    network and the bounding of the circle of machines that may connect to it.

    An answer in the negative means the change will break nothing - but then the right question is
    whether the print spooler is to work on this machine at all. The shutting of the endpoint on a
    server that does not print is a half measure beside the stopping of the service.

    The change takes a fresh start of the print spooler. On a print server that means the breaking
    of jobs under way and the loss of what stands in the queue - that is an effect felt by people
    who know nothing of the change. A restart of the service is planned outside working hours.

    Printing from this machine itself works after the change with no difference.

implementation_consequences:
  impact_areas:
    - printing
    - network-and-firewall
  what_breaks:
    pl:
      - Serwer wydruku przestanie obsługiwać drukowanie dla wszystkich swoich klientów naraz
      - Inne maszyny nie połączą się z udostępnioną tu drukarką ani nie pobiorą z niej sterownika
      - Ponowne uruchomienie bufora przerywa zadania w toku i kasuje to, co stoi w kolejce
      - Drukowanie z samej tej maszyny działa bez różnicy
    en:
      - A print server will stop serving printing for all its clients at once
      - Other machines will not connect to a printer shared here nor fetch a driver from it
      - A fresh start of the spooler breaks jobs under way and clears what stands in the queue
      - Printing from this machine itself works with no difference
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę serwera wydruku i udostępnia drukarki albo kolejki innym maszynom w sieci
      - Nie sprawdzono wykazu udostępnionych drukarek na tej maszynie
    en:
      - The machine acts as a print server and shares printers or queues with other machines on the network
      - The list of shared printers on this machine was not checked
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'RegisterSpoolerRemoteRpcEndPoint'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'RegisterSpoolerRemoteRpcEndPoint'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change refuses on a machine that shares printers. Shutting the
    # endpoint there switches the role off rather than hardening it.
    $shared = @(Get-Printer -ErrorAction SilentlyContinue | Where-Object { $_.Shared })
    if ($shared.Count -gt 0) {
      throw ('This machine shares ' + $shared.Count + ' printer(s). Shutting the remote endpoint would stop printing for its clients - decide on the role first.')
    }
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RegisterSpoolerRemoteRpcEndPoint' -Value 2 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/print-spooler-service-security-hardening

notes:
  pl: |
    Ustawienie nie wyłącza usługi, tylko odbiera jej możliwość
    przyjmowania poleceń z sieci. Drukowanie z tej maszyny działa dalej.

    Pytanie pierwsze na serwerze brzmi jednak inaczej: czy bufor wydruku
    ma tu w ogóle pracować. Na kontrolerze domeny ta usługa wystawiona
    zdalnie jest drogą z sieci wprost do uprawnień systemowych na
    maszynie trzymającej bazę kont.

    Klasę podniosłem względem paczki stanowiska roboczego, bo na
    serwerze udostępnianie drukarek bywa rolą, a nie wyjątkiem.
    Polecenie naprawcze odmawia wykonania na maszynie udostępniającej
    drukarki.
  en: |
    The setting does not switch the service off but takes from it the means of taking orders from
    the network. Printing from this machine works on.

    The first question on a server runs otherwise, though: whether the print spooler is to work
    here at all. On a domain controller this service held out to the network is a road from the
    network straight to the system's rights on the machine keeping the base of accounts.

    I raised the class against the working station's pack, the sharing of printers being on a
    server at times a role and not an exception. The remedying command refuses on a machine that
    shares printers.
