id: win2016-smartscreen-bypass-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Ostrzeżenie filtra reputacyjnego bez możliwości pominięcia
    en: The reputation filter's warning with no way past it
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość pominięcia ostrzeżenia filtra
    reputacyjnego.

    Ostrzeżenie, które da się pominąć jednym kliknięciem, jest sugestią.
    Cała wartość filtra ujawnia się w chwili, w której użytkownik jest
    pewien, że wie lepiej — a jest to dokładnie ta chwila, w której trafił
    na niego napastnik.

    Rzecz warta nazwania wprost: ostrzeżenie nie pojawia się w próżni.
    Pojawia się wtedy, gdy ktoś ma powód, żeby ten plik uruchomić — dostał
    go od kogoś, kogo zna, albo czeka na niego, albo właśnie go szukał.
    Pod takim naciskiem przycisk „uruchom mimo to" jest naciskany zawsze.

    Punkt ten przycisk usuwa. Nie zmienia tego, co filtr sprawdza, ani
    tego, kiedy ostrzega; zmienia tylko to, czy ostrzeżenie da się
    przekreślić.

    Jest to reguła o tym, żeby decyzja nie zapadała w najgorszym możliwym
    momencie i pod największym naciskiem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: jedno
    kliknięcie, którym użytkownik znosi cały zysk z poprzedniego punktu.
  en: |
    The setting takes away the possibility of getting past the reputation filter's warning.

    A warning that can be got past with one click is a suggestion. The filter's whole value shows itself at the
    moment the user is sure they know better - and that is exactly the moment an attacker found them.

    A thing worth naming outright: the warning does not appear in a void. It appears where somebody has a reason to
    start that file - they had it from somebody they know, or they are waiting for it, or they were just looking for
    it. Under such pressure the button "run anyway" is pressed every time.

    This item removes that button. It changes neither what the filter checks nor when it warns; it changes only
    whether the warning can be struck out.

    It is a rule about a decision not falling at the worst possible moment and under the greatest pressure.

    What an attacker gains while the item goes unmet: one click by which the user undoes all the gain of the item
    before.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a nacisk jest tu odwrotny niż zwykle: nie
    chodzi o to, czy zmiana coś zepsuje, tylko o to, czy będzie komu
    odblokować plik, gdy filtr pomyli się w złej chwili.

    Ostrzeżenie staje się odmową. Plik nowy i nieznany, ale potrzebny,
    nie uruchomi się wcale, a osoba przy maszynie nie będzie miała czym
    tego obejść. Rozwiązaniem jest podpisanie narzędzi własnych albo
    świadome wyjęcie ich spod filtra — i jedno, i drugie trzeba przygotować
    przed zmianą, a nie w chwili awarii.

    Objaw jest przy tym stanowczy i czytelny: plik się nie uruchamia
    i widać dlaczego. Jest to zaleta, bo nie ma tu cichego niepowodzenia
    ani szukania przyczyny gdzie indziej.

    Zmiana nie ma sensu bez punktu poprzedniego. Sam poziom ostrzeżenia
    bez włączonego filtra nie rozstrzyga niczego.

    Czego to nie psuje: plików już zaufanych, programów podpisanych,
    aplikacji systemowych, usług, ról serwera.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the weight here falls the other way than usual: it is not a question of whether
    the change will break something, but of whether there will be anybody to unblock a file when the filter errs at a
    bad moment.

    The warning becomes a refusal. A file new and unknown but needed will not start at all, and the person at the
    machine will have nothing to get round it with. The answer is the signing of one's own tools or a knowing taking
    of them out from under the filter - and both have to be made ready before the change and not at the moment of a
    fault.

    The symptom is at that firm and legible: the file does not start and it is plain why. It is an advantage, there
    being here no quiet failure and no looking for the cause elsewhere.

    The change makes no sense without the item before. The level of warning alone, with the filter not switched on,
    settles nothing.

    What this does not break: files already trusted, signed programs, system applications, services, or the server's
    roles.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Ostrzeżenie staje się odmową i plik nowy, nieznany, ale potrzebny nie uruchomi się wcale
      - Osoba przy maszynie nie ma czym tego obejść, więc trzeba wcześniej podpisać narzędzia własne
      - Objaw jest stanowczy i czytelny, bez cichego niepowodzenia i bez szukania przyczyny gdzie indziej
      - Zmiana nie ma sensu bez punktu o włączeniu samego filtra reputacyjnego
      - Pliki już zaufane, programy podpisane, aplikacje systemowe i role serwera pozostają bez zmian
    en:
      - The warning becomes a refusal and a file new, unknown but needed will not start at all
      - The person at the machine has nothing to get round it with, so one's own tools have to be signed beforehand
      - The symptom is firm and legible, without a quiet failure and without looking for the cause elsewhere
      - The change makes no sense without the item about the filter itself being switched on
      - Files already trusted, signed programs, system applications and the server roles stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na tej maszynie uruchamia się narzędzia własne niepodpisane i nie przygotowano dla nich wyjątku
      - Nie ma na miejscu osoby mogącej odblokować plik, gdy filtr pomyli się w złej chwili
    en:
      - Unsigned tools of one's own are started on this machine and no exception has been made ready for them
      - There is nobody on hand able to unblock a file when the filter errs at a bad moment
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number, and is compared without regard to
      # letter case. The milder variant is reported by name so the report tells
      # a machine set leniently from one with no setting at all.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'ShellSmartScreenLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value -or [string]$value -eq '') { 'MISSING' }
        else { ([string]$value).Trim().ToUpperInvariant() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'BLOCK'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'ShellSmartScreenLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value here is text, not a number, so it is written as a string. After
    # this the warning has no button leading past it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ShellSmartScreenLevel' -Value 'Block' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/

notes:
  pl: |
    Punkt zamyka blok i jest drugi z pary o filtrze reputacyjnym. Bez niego
    poprzedni daje sugestię; z nim daje zabezpieczenie. Warto, żeby
    aplikacja pokazywała je razem i mówiła, że wykonanie jednego bez
    drugiego jest połową roboty.

    Argument wart zachowania dotyczy chwili, w której zapada decyzja.
    Ostrzeżenie nie pojawia się w próżni — pojawia się wtedy, gdy ktoś ma
    powód, żeby plik uruchomić. Jest to ten sam typ rozumowania co przy
    regule o koncie konsumenckim: nacisk zdejmuje się z człowieka zamiast
    liczyć na jego wytrzymałość.

    Rzecz warta wyróżnienia w interfejsie dotyczy odczytu. Wartość jest
    tekstem, nie liczbą, a audyt podaje wariant łagodniejszy po nazwie.
    Dzięki temu raport odróżnia maszynę ustawioną łagodnie od maszyny bez
    ustawienia w ogóle — a są to dwa różne stany i dwie różne rozmowy.

    Odnotowuję, że koszt tej reguły jest odwrotny do zwykłego. Nie chodzi
    o to, co przestanie działać, tylko o to, czy będzie komu odblokować
    plik, gdy filtr pomyli się w złej chwili.
  en: |
    The item shuts the block and is the second of the pair about the reputation filter. Without it the one before
    gives a suggestion; with it, a safeguard. It is well that the application show them together and say that the
    carrying out of one without the other is half the work.

    The argument worth keeping concerns the moment at which the decision falls. The warning does not appear in a void
    - it appears where somebody has a reason to start the file. It is the same type of reasoning as at the rule about
    the consumer account: the pressure is lifted from the person instead of being met by counting on their endurance.

    A thing worth setting apart in the interface concerns the reading. The value is text, not a number, and the audit
    gives the milder variant by name. Thereby the report tells a machine set leniently from one with no setting at all
    - and those are two different states and two different conversations.

    Worth noting that this rule's cost falls the other way than usual. It is not a question of what will cease to work
    but of whether there will be anybody to unblock a file when the filter errs at a bad moment.
