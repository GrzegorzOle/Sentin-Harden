id: win10-audit-file-share

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja dostępu do udziałów sieciowych
    en: The audit of access to network shares
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje każde połączenie z udziałem sieciowym tej maszyny —
    udane i odrzucone — wraz z kontem i adresem, z którego nastąpiło.

    Wpis dotyczy samego udziału, a nie plików w nim. Jest to rozróżnienie
    istotne, bo przesądza o objętości: zapis powstaje raz na połączenie,
    a nie raz na otwarty plik.

    Wartość bierze się z tego, że udziały są drogą poruszania się po sieci.
    Napastnik, który zdobył poświadczenia na jednej maszynie, sprawdza nimi
    udziały na maszynach sąsiednich — i robi to hurtem, bo nie wie,
    do których ma dostęp. Połowa nieudana tego zapisu pokazuje właśnie takie
    sprawdzanie: serię odmów z jednego adresu, w krótkim czasie, na wielu
    kontach albo na wielu maszynach.

    Odnotowuję, że na stanowisku roboczym udziały bywają uznawane za
    nieistniejące. Udziały administracyjne istnieją jednak zawsze i to one
    są tu przedmiotem zainteresowania — nie udziały wystawione świadomie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sprawdzanie
    udziałów zdobytymi poświadczeniami niezostawiające śladu ani przy
    odmowie, ani przy powodzeniu.
  en: |
    The setting writes down every connection to a network share of this machine - the successful and the refused
    alike - together with the account and the address it came from.

    The entry touches the share itself and not the files within it. That parting matters, settling as it does
    the bulk: a record comes about once to a connection and not once to a file opened.

    The worth comes of this, that shares are the road by which one moves about a network. An attacker who has
    gained credentials upon one machine tries them against the shares of the neighbouring ones - and does so
    wholesale, not knowing which they can reach. The failed half of this record shows just such a trying: a run
    of refusals from one address, within a short while, upon many accounts or upon many machines.

    I set down that upon a working station shares are at times held not to exist. The administrative shares are
    nonetheless always there, and it is they that are here of interest - not the shares set out knowingly.

    What an attacker gains while the item goes unmet: the trying of shares with gained credentials, leaving no
    trace at a refusal nor at a success.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia uprawnień do udziałów i nie wpływa na to, kto
    i co przez nie zrobi. Zapisuje wyłącznie fakt połączenia.

    Liczba wpisów zależy od roli maszyny. Na stanowisku roboczym jest
    niewielka. Na maszynie, z której korzysta wiele osób albo która
    wystawia udziały, rośnie wprost proporcjonalnie do liczby połączeń.

    Odnotowuję źródło wpisów niespodziewane na stanowisku: narzędzia do
    zarządzania i inwentaryzacji łączą się z udziałami administracyjnymi
    cyklicznie. Wpisy te są powtarzalne, pochodzą z tych samych adresów
    i łatwo je odsiać — ale zanim się je odsieje, wyglądają niepokojąco.

    Zapisywane są oba wyniki, bo połowa nieudana zawiera próby sprawdzania
    udziałów cudzymi poświadczeniami.

    Czego to nie psuje: udziałów sieciowych, uprawnień do nich, łączenia
    się z nimi, logowania, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no rights upon shares and bears not upon who does what through them. It writes down the
    fact of a connection alone.

    The number of entries hangs upon the machine's part. Upon a working station it is small. Upon a machine used
    by many people, or one that sets out shares, it grows straight with the number of connections.

    I set down a source of entries unlooked for upon a workstation: tools of management and of taking stock join
    the administrative shares by turns. Those entries repeat, come from the same addresses and are easy to sift
    out - but before they are sifted out they look disquieting.

    Both outcomes are written, the failed half holding the tryings of shares with somebody else's credentials.

    What this does not break: network shares, the rights upon them, the joining of them, logging on, printing,
    or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - file-sharing
  what_breaks:
    pl:
      - Narzędzia do zarządzania i inwentaryzacji łączą się z udziałami administracyjnymi cyklicznie i dają wpisy powtarzalne
      - Zanim się je odsieje, wyglądają niepokojąco, bo pochodzą z adresów spoza stanowiska
      - Na maszynie wystawiającej udziały liczba wpisów rośnie wprost proporcjonalnie do liczby połączeń
      - Wpis dotyczy samego udziału, a nie plików w nim, więc powstaje raz na połączenie
      - Uprawnienia do udziałów, łączenie się z nimi, logowanie i drukowanie pozostają bez zmian
    en:
      - Tools of management and of taking stock join the administrative shares by turns and give repeating entries
      - Before they are sifted out they look disquieting, coming as they do from addresses outside the workstation
      - Upon a machine that sets out shares the number of entries grows straight with the number of connections
      - The entry touches the share itself and not the files within it, so it comes about once to a connection
      - The rights upon shares, the joining of them, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna wystawia udziały używane przez wiele osób, a dziennik zabezpieczeń ma rozmiar domyślny
    en:
      - The machine sets out shares used by many people while the security log is of its default size
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9224-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9224-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9224-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. A refused connection to a share is worth as much
    # here as one that succeeded, and comes as a rule before it.
    auditpol /set /subcategory:"{0CCE9224-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9224-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-file-share

notes:
  pl: |
    Reguła jest w tym bloku tą, której połowa nieudana jest warta więcej
    niż udana — i jest to rzadkie. Serię odmów z jednego adresu widać gołym
    okiem i nie wymaga ona narzędzia do korelacji.

    Warto, żeby aplikacja powiedziała, że reguła dotyczy także maszyny bez
    świadomie wystawionych udziałów. Udziały administracyjne istnieją zawsze
    i to one są tu przedmiotem zainteresowania; użytkownik przekonany,
    że „nic nie udostępnia", odpuści ten punkt bez powodu.

    Odnotowuję szum od narzędzi zarządzających, bo jest to najczęstsza
    przyczyna fałszywego alarmu przy tej regule. Połączenia cykliczne
    z tych samych adresów są łatwe do odsiania, ale trzeba o nich wiedzieć
    wcześniej — inaczej pierwsze spojrzenie w ten zapis wygląda jak
    odkrycie.
  en: |
    The rule is the one in this block whose failed half is worth more than its successful one - and that is
    rare. A run of refusals from one address is seen with the naked eye and calls for no tool of correlation.

    It is well that the application say the rule touches a machine with no shares knowingly set out as well. The
    administrative shares are always there and it is they that are here of interest; a user sure they "share
    nothing" will let this item go for no reason.

    I set down the noise from tools of management, it being the commonest cause of a false alarm at this rule.
    Connections by turns from the same addresses are easy to sift out, but they have to be known of beforehand -
    failing which the first look into that record looks like a discovery.
