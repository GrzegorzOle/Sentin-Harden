id: win10-rdp-temp-folders-deleted-on-exit

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary Folders
  title:
    pl: Foldery tymczasowe sesji zdalnej usuwane po jej zakończeniu
    en: The folders of the hour of a session from afar taken away once it ends
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby foldery tymczasowe utworzone na potrzeby
    sesji zdalnej zostały usunięte w chwili jej zakończenia.

    Sesja zdalna tworzy własny katalog na pliki przejściowe. Trafiają
    tam dokumenty otwierane z poczty, pliki rozpakowywane, wersje robocze
    zapisywane przez programy i wszystko, co program uznaje za dane
    tymczasowe.

    Zagrożenie pierwsze to trwałość. Katalog pozostawiony po sesji
    zawiera treści, które użytkownik uważa za zamknięte razem z nią,
    a które leżą na dysku do czasu, aż ktoś je zauważy.

    Zagrożenie drugie to dostępność. Katalogi te bywają czytelne dla
    innych kont na maszynie, więc treść jednej sesji bywa dostępna
    kolejnej.

    Zagrożenie trzecie to narastanie. Pozostawione katalogi zbierają się
    przez miesiące i tworzą zbiór, którego nikt nie przegląda ani nie
    czyści.

    Odnotowuję, że mechanizm działa sam i nie wymaga niczego od
    użytkownika. Jest to porządek wprowadzany raz i obowiązujący dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zbiór
    plików roboczych z zakończonych sesji, leżący na dysku.
  en: |
    The setting calls for the folders of the hour made for the needs of a session from afar to be taken away the
    moment it ends.

    A session from afar makes a directory of its own for files that pass. There come papers opened out of the
    post, files unpacked, working forms written by programs and everything a program holds to be data of the hour.

    The first danger is lastingness. A directory left after a session holds content the user believes shut
    together with it, and which lies upon the disk until somebody marks it.

    The second danger is its being to be had. Those directories are at times readable by other reckonings upon the
    machine, so the content of one session is at times to be had by the next.

    The third danger is the heaping up. Directories left behind gather through months and make a store nobody
    looks over and nobody clears.

    I set down that the mechanism works of itself and calls for nothing from the user. It is an order brought in
    once and holding thereafter.

    What an attacker gains while the item goes unmet: a store of working files from ended sessions, lying upon the
    disk.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Foldery tymczasowe z zakończonej sesji nie
    są nikomu do niczego potrzebne, a ich usunięcie nie zmienia niczego
    w pracy.

    Odnotowuję jedyne miejsce warte spojrzenia: program zapisujący do
    katalogu tymczasowego dane, które mają przetrwać do następnej sesji.
    Jest to błąd w programie, nie skutek tego punktu — katalog tymczasowy
    z definicji nie daje takiej gwarancji.

    Zastrzegam, że usunięcie dotyczy wyłącznie katalogów sesji.
    Dokumenty zapisane w katalogu użytkownika, na dysku i na udziałach
    zostają nietknięte.

    Skutek nie jest widoczny dla użytkownika. Ujawnia się wyłącznie tym,
    że po wylogowaniu na dysku nie zostaje nic.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: dokumentów użytkownika, sesji jako takich, pracy
    programów, logowania, drukowania.
  en: |
    The class is "no disruption". The folders of the hour from an ended session are needed by nobody for anything,
    and their taking away changes nothing in the work.

    I set down the one place worth a look: a program writing into the directory of the hour data meant to outlast
    until the next session. It is a fault in the program and no upshot of this item - a directory of the hour
    gives by its nature no such warrant.

    I set down that the taking away touches the directories of the session alone. Papers written into the user's
    directory, upon the disk and upon shares stay untouched.

    The consequence is not plain to the user. It comes to light only in this, that after the logging off nothing
    is left upon the disk.

    The consequence shows at once, with no restart.

    What this does not break: the user's papers, the sessions themselves, the work of programs, logging on, or
    printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
  what_breaks:
    pl:
      - Znanych regresji brak, bo foldery tymczasowe z zakończonej sesji nie są nikomu potrzebne
      - Program zapisujący do katalogu tymczasowego dane mające przetrwać do następnej sesji zawiedzie
      - Jest to błąd w programie, nie skutek tego punktu, bo katalog tymczasowy takiej gwarancji nie daje
      - Dokumenty zapisane w katalogu użytkownika, na dysku i na udziałach zostają nietknięte
      - Sesje jako takie, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - No known backsliding, the folders of the hour from an ended session being needed by nobody
      - A program writing into the directory of the hour data meant to outlast until the next session will fail
      - It is a fault in the program and no upshot of this item, a directory of the hour giving no such warrant
      - Papers written into the user s directory, upon the disk and upon shares stay untouched
      - The sessions themselves, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Program używany w sesji zdalnej przechowuje w katalogu tymczasowym dane mające przetrwać wylogowanie
    en:
      - A program used in the session from afar holds in the directory of the hour data meant to outlast the logging off
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DeleteTempDirsOnExit'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'DeleteTempDirsOnExit'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeleteTempDirsOnExit' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-rdsh-security

notes:
  pl: |
    Reguła jest z tych, które kosztują najmniej, a robią porządek,
    którego nikt nie robi ręcznie. Warto, żeby aplikacja pokazała to
    zestawienie, bo są to punkty właściwe do wykonania hurtem.

    Argument wart zachowania dotyczy tego, co w tych katalogach leży.
    Dokumenty otwierane z poczty, pliki rozpakowywane i wersje robocze —
    czyli treści, które użytkownik uważa za zamknięte razem z sesją.

    Odnotowuję jedyny przypadek sporny: program przechowujący
    w katalogu tymczasowym dane mające przetrwać wylogowanie. Warto
    nazwać to błędem w programie, a nie skutkiem tego punktu.
  en: |
    The rule is of those that cost least and set in order what nobody sets by hand. It is well that the
    application show that setting side by side, such items being the right ones to be worked in bulk.

    The argument worth keeping touches what lies in those directories. Papers opened out of the post, files
    unpacked and working forms - which is to say content the user believes shut together with the session.

    I set down the one case in dispute: a program holding in the directory of the hour data meant to outlast the
    logging off. It is worth naming a fault in the program and no upshot of this item.
