id: win2025-msdt-support-provider-communication-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Troubleshooting and Diagnostics > Microsoft Support Diagnostic Tool
  title:
    pl: Łączność narzędzia diagnostycznego z dostawcą wsparcia wyłączona
    en: The diagnostic tool's communication with the support provider disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza tryb, w którym wbudowane narzędzie diagnostyczne
    porozumiewa się z dostawcą wsparcia i przyjmuje od niego treści do
    wykonania na tej maszynie.

    Kategoria wysoka i chcę nazwać, czym to narzędzie jest, bo nazwa brzmi
    niewinnie. Nie chodzi o wysyłanie danych. Chodzi o mechanizm, który
    odbiera z zewnątrz pakiet diagnostyczny — zestaw czynności do wykonania
    na tej maszynie, w kontekście uprawnień, które temu narzędziu
    przysługują. Przekierowanie źródła takiego pakietu oznacza wykonanie
    cudzych czynności na serwerze.

    To już nie jest kwestia tego, co wychodzi. To jest kanał, który prowadzi
    do środka.

    Chcę też wskazać rzecz drugą, mniej oczywistą, a przy serwerze ważną:
    ten sam mechanizm bywa uruchamiany na żądanie, z odsyłacza albo
    z dokumentu, nie tylko przez administratora otwierającego kreator.
    Wbudowane narzędzia diagnostyczne systemu Windows mają za sobą historię
    usterek, w których dało się je wywołać zdalnie i skłonić do wykonania
    czegoś, czego nikt nie zamawiał. To znane, powtarzające się miejsce,
    i na serwerze nie ma żadnego powodu, żeby było otwarte.

    Wartość, której audyt oczekuje, to zero — mimo że nazwa wpisu
    sugerowałaby jedynkę. Zasada wyłączona zapisuje tu zero, a jedynka
    oznacza tryb dopuszczony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wykonania czynności na serwerze przez mechanizm, który z założenia ma
    słuchać poleceń z zewnątrz.
  en: |
    The item switches off the mode in which the built-in diagnostic tool
    communicates with a support provider and accepts content from it to run
    on this machine.

    The category is high, and I want to name what this tool is, because its
    name sounds innocent. This is not about sending data. It is about a
    mechanism that receives a diagnostic package from outside - a set of
    actions to carry out on this machine, in the context of the privileges
    that tool holds. Redirecting the source of such a package means
    somebody else's actions being carried out on the server.

    This is no longer a question of what goes out. This is a channel that
    leads inwards.

    I also want to point out a second, less obvious thing that matters on a
    server: the same mechanism is sometimes started on demand, from a link
    or a document, not only by an administrator opening a wizard. The
    built-in diagnostic tools of Windows have a history of faults in which
    they could be invoked remotely and induced to carry out something nobody
    ordered. It is a known, recurring place, and on a server there is no
    reason whatever for it to stand open.

    The value the audit expects is zero - even though the entry's name would
    suggest one. The policy switched off writes zero here, and one means the
    mode is permitted.

    What an attacker gains while the item goes unmet: a way of carrying out
    actions on the server through a mechanism designed to take instructions
    from outside.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę być uczciwy co do tego, co
    się tu traci, bo coś się jednak traci.

    Po zmianie kreatory rozwiązywania problemów uruchamiane na tej maszynie
    przestaną pobierać treści od dostawcy wsparcia. Będą działać dalej —
    z tym, co mają wbudowane — ale nie dostaną zaktualizowanych pakietów
    diagnostycznych ani tych przygotowanych pod konkretny, świeżo opisany
    problem. Ktoś, kto przywykł zaczynać naprawę od kreatora, dostanie
    mniej niż dotąd.

    Na serwerze produkcyjnym nie uważam tego za dużą stratę i mówię to
    wprost: naprawa serwera prowadzona przez kreator jest rzadkością,
    a dostęp do dzienników, poleceń i narzędzi diagnostycznych pozostaje
    niezmieniony. Strata jest realna głównie tam, gdzie stanowisko wsparcia
    prowadzi ludzi przez kreatory zdalnie.

    Rzecz do sprawdzenia jest jedna: czy organizacja używa tego mechanizmu
    jako drogi dostarczania własnych pakietów diagnostycznych. Bywa tak
    w większych działach wsparcia i wtedy zmiana odcina narzędzie, na
    którym opiera się ich procedura.

    Do zapamiętania przy kłopotach: wartość oczekiwana to zero, nie jeden.
    Nazwa wpisu sugeruje odwrotnie i to jest dokładnie ten rodzaj pułapki,
    przy której sprawdzenie wypada dobrze, a zabezpieczenia nie ma.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to be honest about what is
    lost here, because something is lost.

    After the change, troubleshooting wizards started on this machine will
    stop fetching content from the support provider. They will go on working
    - with what they have built in - but will not receive updated diagnostic
    packages or ones prepared for a particular, freshly described problem.
    Somebody used to starting a repair from a wizard will get less than
    before.

    On a production server I do not consider this a great loss, and I say so
    plainly: repairing a server through a wizard is a rarity, and access to
    logs, commands and diagnostic tools stays unchanged. The loss is real
    mainly where a support desk walks people through wizards remotely.

    There is one thing to check: whether the organisation uses this
    mechanism as a route for delivering its own diagnostic packages. That
    happens in larger support departments, and then the change cuts off a
    tool their procedure rests on.

    To remember when trouble comes: the expected value is zero, not one. The
    entry's name suggests the opposite, and that is exactly the kind of trap
    where the check comes out well and the protection is not there.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - remote-management
    - logging-and-audit
  what_breaks:
    pl:
      - Kreatory rozwiązywania problemów przestaną pobierać treści od dostawcy wsparcia i zostaną z tym, co mają wbudowane
      - Nie dostaną pakietów przygotowanych pod konkretny, świeżo opisany problem
      - Stanowisko wsparcia prowadzące ludzi przez kreatory zdalnie straci część narzędzia
      - Dostęp do dzienników, poleceń i narzędzi diagnostycznych pozostaje niezmieniony
    en:
      - Troubleshooting wizards stop fetching content from the support provider and are left with what they have built in
      - They will not receive packages prepared for a particular, freshly described problem
      - A support desk walking people through wizards remotely loses part of its tool
      - Access to logs, commands and diagnostic tools stays unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja używa tego mechanizmu jako drogi dostarczania własnych pakietów diagnostycznych
      - Procedura wsparcia w tej organizacji opiera się na prowadzeniu ludzi przez kreatory zdalnie
    en:
      - The organisation uses this mechanism as a route for delivering its own diagnostic packages
      - The support procedure in this organisation rests on walking people through wizards remotely
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name reads as if it switched the mode off, while the policy
      # writes 1 when the mode is allowed and 0 when it is forbidden. The
      # expected entry is therefore zero, not one.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableQueryRemoteServer'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    $current = (Get-ItemProperty -Path $path -Name 'DisableQueryRemoteServer' -ErrorAction SilentlyContinue).'DisableQueryRemoteServer'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableQueryRemoteServer'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is correct here despite the value name reading the other way: the
    # policy switched off writes zero, one means the mode is allowed. This is a
    # channel that leads inwards - the tool receives packages of actions to run
    # on this machine, not merely sends data out.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableQueryRemoteServer' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/windows-update-troubleshooting

notes:
  pl: |
    Nazwa brzmi niewinnie, a chodzi o mechanizm odbierający z zewnątrz
    pakiet czynności do wykonania na tej maszynie. To nie kwestia tego, co
    wychodzi — to kanał prowadzący do środka.

    Wbudowane narzędzia diagnostyczne mają za sobą historię usterek,
    w których dało się je wywołać zdalnie i skłonić do wykonania czegoś,
    czego nikt nie zamawiał. Na serwerze nie ma powodu, żeby to miejsce
    było otwarte.

    Pułapka: wartość oczekiwana to zero, nie jeden. Nazwa wpisu sugeruje
    odwrotnie i to jest ten rodzaj miejsca, w którym sprawdzenie wypada
    dobrze, a zabezpieczenia nie ma.
  en: |
    The name sounds innocent, and what is meant is a mechanism that receives
    from outside a package of actions to carry out on this machine. This is
    not a question of what goes out - it is a channel leading inwards.

    The built-in diagnostic tools have a history of faults in which they
    could be invoked remotely and induced to carry out something nobody
    ordered. On a server there is no reason for this place to stand open.

    A trap: the expected value is zero, not one. The entry's name suggests
    the opposite, and this is the kind of place where the check comes out
    well and the protection is not there.
