id: win2016-audit-policy-subcategory-override

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Szczegółowe zasady inspekcji nadrzędne wobec starszych kategorii
    en: Detailed audit policy takes precedence over the legacy categories
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, który z dwóch mechanizmów konfiguracji inspekcji
    obowiązuje na maszynie: starszy, oparty na dziewięciu szerokich
    kategoriach, czy nowszy, oparty na kilkudziesięciu podkategoriach.

    Oba mechanizmy istnieją w systemie równolegle i opisują to samo, tylko
    z inną dokładnością. Kłopot polega na tym, że starszy potrafi nadpisać
    nowszy. Jeżeli gdziekolwiek w zasadach grupy ustawiono szeroką kategorię,
    to przy wyłączonym ustawieniu opisanym tym punktem ta kategoria zastąpi
    całą szczegółową konfigurację podkategorii — łącznie z tą, którą właśnie
    z troską zbudowano.

    Skutek jest cichy i to jest w nim najgorsze. Zasady szczegółowe wyglądają
    w narzędziu tak, jakby obowiązywały. System ich nie zgłasza jako
    nieaktywnych. Dopiero zestawienie oczekiwanych zdarzeń z zawartością
    dziennika pokazuje, że części z nich nigdy nie było.

    Kategoria średnia: ustawienie samo w sobie nie blokuje ataku, ale bez
    niego cała reszta konfiguracji inspekcji stoi na piasku. Punkt jest
    warunkiem wstępnym dla kilkudziesięciu reguł audytu, a nie zabezpieczeniem
    obok nich.

    Na serwerze 2016 mechanizm podkategorii jest dostępny i to on ma
    obowiązywać. Starsze kategorie zostają w systemie wyłącznie ze względu na
    zgodność wsteczną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rejestrowanie
    zdarzeń rzadsze, niż wynika z konfiguracji, i przekonanie obrońcy, że
    dziennik zawiera to, czego w nim nie ma.
  en: |
    The setting decides which of the system's two mechanisms for configuring
    auditing holds on the machine: the older one, resting on nine broad
    categories, or the newer one, resting on some dozens of subcategories.

    Both mechanisms exist in the system side by side and describe the same
    thing, only to a different fineness. The trouble is that the older one can
    overwrite the newer. If a broad category has been set anywhere in group
    policy, then with the setting this item describes switched off that category
    will replace the whole detailed configuration of subcategories - the one
    just built with care included.

    The effect is quiet, and that is the worst of it. The detailed policy looks
    in the tool as though it holds. The system does not report it as inactive.
    Only setting the expected events beside the log's content shows that some of
    them were never there.

    The category is medium: the setting by itself blocks no attack, but without
    it the whole rest of the audit configuration stands on sand. The item is a
    precondition for some dozens of audit rules, not a safeguard beside them.

    On Server 2016 the subcategory mechanism is available and it is the one that
    should hold. The older categories remain in the system for backward
    compatibility alone.

    What an attacker gains while the item goes unmet: the recording of events
    more sparingly than the configuration implies, and a defender's conviction
    that the log holds what is not in it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", i to nie ze względu na samo ustawienie, tylko
    na to, co ono uaktywnia.

    Samo przełączenie niczego nie psuje. Psuje natomiast — a właściwie
    ujawnia — to, że od tej chwili obowiązuje konfiguracja podkategorii.
    Jeżeli jest ona szeroka, a maszyna nie miała jej dotąd faktycznie
    włączonej, liczba zapisywanych zdarzeń potrafi wzrosnąć wielokrotnie
    z dnia na dzień.

    Skutki są dwa. Dziennik zabezpieczeń o domyślnym rozmiarze zapełnia się
    wtedy w godziny zamiast w tygodnie i zaczyna nadpisywać najstarsze wpisy —
    czyli dokładnie te, po które sięga się przy analizie. Drugi skutek dotyczy
    zbieracza dzienników: nagły wzrost strumienia potrafi wypełnić przydział
    u odbiorcy albo przeciążyć łącze do niego.

    Sprawdzenie sprowadza się do dwóch rzeczy: jaki jest rozmiar dziennika
    zabezpieczeń na tej maszynie i czy zbieracz uniesie zwiększony strumień.
    Obie da się ustalić przed zmianą, a nie po zapełnieniu dziennika.

    Czego to nie psuje: pracy użytkowników, usług, wydajności maszyny
    w normalnym obciążeniu ani odczytu dotychczasowych wpisów.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and not on account of the setting itself but of
    what it brings into force.

    The switching itself breaks nothing. What it does break - or rather reveal -
    is that from that moment the subcategory configuration holds. If that
    configuration is broad and the machine has not until now actually had it on,
    the number of events written can rise many times over from one day to the
    next.

    There are two consequences. A security log of the default size then fills in
    hours rather than in weeks and begins overwriting the oldest entries - which
    is to say precisely those one reaches for when analysing. The second
    consequence concerns the log collector: a sudden rise in the stream can fill
    the allowance at the receiving end or overload the link to it.

    The check comes down to two things: what size the security log is on this
    machine, and whether the collector will bear the increased stream. Both can
    be established before the change rather than after the log has filled.

    What this does not break: users' work, services, the machine's performance
    under normal load, or the reading of entries already there.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Szeroka konfiguracja podkategorii zaczyna faktycznie obowiązywać i liczba zapisywanych zdarzeń potrafi wzrosnąć wielokrotnie
      - Dziennik zabezpieczeń o domyślnym rozmiarze zapełnia się w godziny i zaczyna nadpisywać najstarsze wpisy
      - Zbieracz dzienników dostaje nagle większy strumień, co potrafi wypełnić przydział u odbiorcy albo przeciążyć łącze
      - Praca użytkowników, usług i wydajność maszyny w normalnym obciążeniu pozostają bez zmian
    en:
      - A broad subcategory configuration begins actually to hold and the number of events written can rise many times over
      - A security log of the default size fills in hours and begins overwriting the oldest entries
      - The log collector suddenly receives a larger stream, which can fill the allowance at the receiving end or overload the link
      - Users' work, services and the machine's performance under normal load stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie sprawdzono rozmiaru dziennika zabezpieczeń na tej maszynie ani jego zachowania przy przepełnieniu
      - Zbieracz dzienników pracuje na granicy przydziału albo przepustowości łącza do niego
    en:
      - The size of the security log on this machine and its behaviour on overflow have not been checked
      - The log collector works at the edge of its allowance or of the link's capacity
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'SCENoApplyLegacyAuditPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'SCENoApplyLegacyAuditPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From this moment the detailed subcategory policy holds. Where it is broad,
    # the volume of events can rise many times over, so the security log size
    # should be settled first.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    Set-ItemProperty -Path $path -Name 'SCENoApplyLegacyAuditPolicy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings of the local
      # security authority and must stay.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/audit-force-audit-policy-subcategory-settings-to-override-audit-policy-category-settings

notes:
  pl: |
    Punkt należy czytać jako warunek wstępny dla całego bloku reguł inspekcji,
    a nie jako jedną z nich. Bez niego wyniki tamtych reguł opisują to, co
    ustawiono, a niekoniecznie to, co obowiązuje.

    Sama zgodność tego punktu nie dowodzi, że szczegółowe zasady inspekcji są
    poprawnie skonfigurowane — dowodzi tylko, że jeżeli są, to działają.
    Te dwie rzeczy warto w raporcie rozdzielić.

    Rozmiar dziennika zabezpieczeń i jego zachowanie przy przepełnieniu to
    osobne punkty i osobne reguły. Kolejność wdrożenia ma tu znaczenie:
    najpierw pojemność, potem przełączenie.
  en: |
    The item should be read as a precondition for the whole block of audit rules,
    not as one of them. Without it, those rules' results describe what has been
    set, and not necessarily what holds.

    This item being compliant does not by itself prove the detailed audit policy
    is configured properly - it proves only that if it is, it works. Those two
    things are worth keeping apart in the report.

    The security log's size and its behaviour on overflow are separate items and
    separate rules. The order of rollout matters here: capacity first, then the
    switch.
