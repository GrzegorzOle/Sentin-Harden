id: win2025-defender-local-admin-merge-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Dołączanie lokalnych list wyłączeń do zasady zablokowane
    en: Merging of local exclusion lists into the policy blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że obowiązuje wyłącznie lista wyłączeń zapisana
    w zasadzie. Wszystko, co ustawiono lokalnie na maszynie, przestaje
    być brane pod uwagę.

    Wyłączenie jest miejscem, w które mechanizm ochronny z założenia nie
    zagląda. Kto potrafi dopisać do listy wyłączeń własny katalog,
    ten ma na tej maszynie obszar poza nadzorem — i nie musi się nigdzie
    włamywać, bo wystarczyło mu jedno uprawnienie administracyjne
    i jedna linijka.

    Na serwerze jest to technika stosowana i praktyczna, bo listy
    wyłączeń na serwerach są długie i nikt ich nie czyta. Serwer ma
    wyłączenia dla bazy, dla składnicy kopii, dla katalogu wdrożeń, dla
    maszyn wirtualnych. Kolejny wpis nie rzuca się w oczy, a jeśli
    nazwać go podobnie do sąsiadów, nie rzuci się w oczy nigdy.

    Punkt zamyka to jednym ruchem: lokalna lista przestaje cokolwiek
    znaczyć, a lista w zasadzie jest widoczna tam, gdzie zasadę się
    utrzymuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość samodzielnego wyznaczenia na serwerze obszaru, do którego
    ochrona nie zagląda.
  en: |
    The item makes it so that only the list of leavings-out written in the policy binds. All that
    was set locally on the machine stops being taken into account.

    A leaving-out is a place a guarding working by design looks not into. Whoever can write their
    own folder into the list of leavings-out has on that machine a reach outside all watch - and
    need break in nowhere, one right of an administrator and one line having been enough for them.

    On a server it is a craft both used and workable, the lists of leavings-out on servers being
    long and nobody reading them. A server has leavings-out for the base, for the storehouse of
    copies, for the folder of rollings out, for the machines made by reckoning. One more entry
    catches no eye, and if it be named like its neighbours it will catch no eye ever.

    The item shuts that at one stroke - the local list stops meaning anything, and the list in the
    policy is seen where the policy is kept.

    What an attacker gains while the item goes unmet - the means of marking out on a server, by
    themselves, a reach the guard looks not into.

disruption_description:
  pl: |
    Jest to najniebezpieczniejsza w skutkach reguła całej tej grupy
    i chcę powiedzieć wprost dlaczego, bo powód wynika z tego, co
    napisałem przy wszystkich poprzednich punktach.

    Przy każdym z nich powtarzałem to samo zalecenie: ustal wyłączenia
    dla ścieżek i procesów roli, zanim włączysz mechanizm. Te wyłączenia
    w ogromnej większości instalacji są ustawione lokalnie — administrator
    postawił rolę, przeczytał wskazówki producenta i wpisał je na tej
    maszynie. Nigdzie nie trafiły, bo nie musiały.

    Ta zmiana unieważnia je wszystkie, i to natychmiast, bez restartu
    i bez komunikatu. W chwili jej zastosowania serwer bazy danych,
    host wirtualizacji i kontroler domeny zaczynają być skanowane
    w całości, łącznie z plikami, które producent roli wprost kazał
    pominąć.

    Objaw jest natychmiastowy i dotkliwy: spadek wydajności widoczny
    w aplikacji, w skrajnym przypadku blokady plików i przerwana praca
    roli. Nikt nie zobaczy przy tym żadnego ostrzeżenia. Widać jedynie,
    że maszyna nagle zwolniła.

    Kolejność jest więc jedyną treścią tej reguły. Przed zmianą trzeba
    zebrać lokalne listy wyłączeń ze wszystkich maszyn, które ta zasada
    obejmie, przenieść je do zasady i sprawdzić, że tam doszły. Dopiero
    wtedy wolno zablokować dołączanie. Wykonanie tego w odwrotnej
    kolejności jest najszybszym znanym mi sposobem na zatrzymanie
    serwera produkcyjnego przy pomocy ustawienia ochronnego.

    Zmiana cofa się natychmiast i wyłączenia lokalne wracają w całości.
  en: |
    It is in its outcomes the most dangerous rule of this whole group, and I mean to say outright
    why, the ground following from what I wrote at all the items before.

    At every one of them I said over the same counsel - settle the leavings-out for the role's paths
    and processes before you switch the working on. Those leavings-out are in the great mass of
    settings-up set locally - an administrator raised the role, read the maker's counsel and wrote
    them on that machine. They went nowhere else, there being no need.

    This change makes them all void, and that at once, with no restart and no word given. At the
    moment of its laying on, the server of a base of data, the host of virtualisation and the warder
    of the domain begin to be searched whole, together with the files the maker of the role bade
    outright be passed over.

    The symptom is at once and it bites - a fall of doing seen in the application, in the utmost
    case lockings of files and the work of the role broken off. Nobody will see thereat any warning.
    What is seen is only that the machine has suddenly slowed.

    The order is therefore the only substance of this rule. Before the change the local lists of
    leavings-out must be gathered off all the machines this policy will take in, borne over into the
    policy, and it must be looked to that they arrived there. Only then may the merging be blocked.
    The doing of this in the other order is the swiftest way I know of stopping a server of
    production by means of a setting meant to guard it.

    The change is undone at once and the local leavings-out come back whole.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - virtualization-and-containers
    - updates-and-servicing
  what_breaks:
    pl:
      - Lokalne wyłączenia dla bazy, hosta wirtualizacji i kontrolera domeny przestają obowiązywać natychmiast
      - Objawem jest spadek wydajności widoczny w aplikacji, a w skrajnym przypadku blokady plików
      - Nikt nie zobaczy żadnego ostrzeżenia, widać jedynie, że maszyna nagle zwolniła
      - Wykonanie tego przed przeniesieniem wyłączeń do zasady zatrzymuje serwer produkcyjny
      - Cofnięcie zmiany przywraca wyłączenia lokalne w całości i natychmiast
    en:
      - The local leavings-out for the base, the host of virtualisation and the warder of the domain stop binding at once
      - The symptom is a fall of doing seen in the application, and in the utmost case lockings of files
      - Nobody will see any warning, what is seen is only that the machine has suddenly slowed
      - The doing of this before the leavings-out are borne into the policy stops a server of production
      - The undoing of the change brings the local leavings-out back whole and at once
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie zebrano lokalnych list wyłączeń ze wszystkich maszyn, które ta zasada obejmie
      - Nie sprawdzono, że przeniesione wyłączenia faktycznie doszły do zasady na maszynie docelowej
    en:
      - The local lists of leavings-out were not gathered off all the machines this policy will take in
      - It was not looked to that the borne-over leavings-out truly arrived in the policy on the machine meant
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One here means the merging of local lists is forbidden.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableLocalAdminMerge'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableLocalAdminMerge'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    $local = @()
    try {
      $p = Get-MpPreference -ErrorAction Stop
      $local = @{
        paths      = @($p.ExclusionPath)
        extensions = @($p.ExclusionExtension)
        processes  = @($p.ExclusionProcess)
      }
    } catch { }
    [pscustomobject]@{
      path              = $path
      name              = $name
      value             = $current
      existed           = ($null -ne $current)
      key_existed       = (Test-Path -Path $path)
      local_exclusions  = $local
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state and the local exclusion lists to {{backup_file}}"

  change_command: |
    # From this moment only the exclusion list written into the policy binds;
    # everything defined locally stops mattering at once. Carry the local lists
    # into the policy first and confirm they arrived.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalAdminMerge' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-exclusions-microsoft-defender-antivirus

notes:
  pl: |
    Wyłączenie jest miejscem, w które mechanizm ochronny z założenia
    nie zagląda. Na serwerze listy wyłączeń są długie i nikt ich nie
    czyta, więc kolejny wpis nazwany podobnie do sąsiadów nie rzuci
    się w oczy nigdy.

    Najniebezpieczniejsza w skutkach reguła tej grupy, i to wprost
    z powodu zalecenia powtarzanego przy wszystkich poprzednich
    punktach: wyłączenia dla ról są w ogromnej większości instalacji
    ustawione lokalnie. Ta zmiana unieważnia je natychmiast, bez
    restartu i bez komunikatu.

    Kolejność jest jedyną treścią reguły: najpierw zebrać lokalne listy
    i przenieść je do zasady, sprawdzić, że doszły, dopiero potem
    blokować dołączanie. Odwrotna kolejność to najszybszy znany sposób
    na zatrzymanie serwera produkcyjnego ustawieniem ochronnym.

    Kopia zapasowa zapisuje przy okazji obowiązujące listy wyłączeń,
    żeby było z czego odtworzyć zasadę.
  en: |
    A leaving-out is a place a guarding working by design looks not into. On a server the lists of
    leavings-out are long and nobody reads them, so one more entry named like its neighbours will
    catch no eye ever.

    In its outcomes the most dangerous rule of this group, and that straight from the counsel said
    over at all the items before - the leavings-out for roles are in the great mass of settings-up
    set locally. This change makes them void at once, with no restart and no word given.

    The order is the only substance of the rule - first gather the local lists and bear them into
    the policy, look that they arrived, and only then block the merging. The other order is the
    swiftest known way of stopping a server of production by a setting meant to guard it.

    The keeping of a copy writes down at the same turn the binding lists of leavings-out, so that
    there be something to raise the policy from.
