id: win10-firmware-environment-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana wartości środowiska układowego zastrzeżona dla administratorów
    en: The changing of values of the firmware environment reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo zmiany wartości środowiska oprogramowania
    układowego dla administratorów lokalnych.

    Wartości te są ustawieniami, które maszyna czyta przed uruchomieniem
    systemu. Zapisane są poza dyskiem systemowym, w pamięci trwałej
    płyty głównej, i przechowują między innymi kolejność urządzeń
    startowych oraz stan mechanizmu sprawdzającego podpisy ładowanego
    kodu.

    Zagrożenie dotyczy właśnie tego ostatniego. Konto z tym prawem może
    zmienić ustawienia startu w taki sposób, żeby maszyna uruchomiła kod
    spoza dysku albo przestała sprawdzać podpisy. Zabezpieczenia działające
    w systemie nie mają tu nic do powiedzenia, bo zmiana zachodzi poniżej
    nich i obowiązuje zanim system wystartuje.

    Skutek jest trwały w sposób, który odróżnia ten punkt od pozostałych.
    Przeinstalowanie systemu nie usuwa zmiany, bo nie leży ona na dysku.
    Maszyna wraca do stanu poprzedniego dopiero po ręcznym poprawieniu
    ustawień układowych.

    Odnotowuję, że sprawdzenie przyjmuje wykaz węższy niż wymagany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zmiany warunków startu maszyny, przeżywającą przeinstalowanie systemu.
  en: |
    The setting reserves the right of changing the values of the firmware environment to the local administrators.

    Those values are the settings a machine reads before the system starts. They are written beyond the system's
    disk, in the lasting memory of the mainboard, and hold among other things the order of the devices of the
    start and the state of the mechanism that checks the signatures of the code being loaded.

    The danger touches just that last. An account with this right may change the settings of the start so that the
    machine runs code from beyond the disk or ceases to check signatures. The guardings working within the system
    have nothing to say here, the change falling below them and holding good before the system starts.

    The consequence lasts in a manner that sets this item apart from the others. The setting of the system up anew
    does not take the change away, it not lying upon the disk. The machine comes back to its former state only
    after the settings of the firmware are put right by hand.

    I set down that the check takes a list narrower than the one called for.

    What an attacker gains while the item goes unmet: the changing of the terms of the machine's start, outliving
    the setting up of the system anew.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz zawiera samych administratorów i na maszynie
    utrzymywanej normalnie zmiana jest zapisem stanu.

    Odnotowuję jedyne miejsce warte spojrzenia: narzędzia producenta
    sprzętu do zarządzania ustawieniami układowymi z poziomu systemu.
    Część z nich bywa uruchamiana z konta serwisowego. Po zmianie zgłoszą
    błąd uprawnień, ale samo ustawienie da się poprawić ręcznie przy
    starcie maszyny.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.
    Ustawienia układowe zapisane wcześniej pozostają bez zmian.

    Czego to nie psuje: startu maszyny, logowania, pracy z plikami,
    aktualizacji systemu, drukowania.
  en: |
    The class is "no disruption".

    The default list holds the administrators alone, and upon a machine kept in the ordinary way the change is a
    setting down of a state.

    I set down the one place worth a look: the maker's tools for the ruling of the firmware's settings from within
    the system. Some of them are at times run from a service account. After the change they will report a fault of
    rights, but the setting itself may be put right by hand at the machine's start.

    The consequence shows at the next signing in of an account that loses the right. Settings of the firmware
    written earlier stay unchanged.

    What this does not break: the machine's start, logging on, work with files, the servicing of the system, or
    printing.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Narzędzia producenta sprzętu zmieniające ustawienia układowe z poziomu systemu zgłoszą błąd uprawnień
      - Ustawienie da się wtedy poprawić ręcznie przy starcie maszyny, więc droga nie zostaje zamknięta
      - Domyślny wykaz zawiera samych administratorów, więc na większości maszyn zmiana jest zapisem stanu
      - Ustawienia układowe zapisane wcześniej pozostają bez zmian, a skutek dotyczy tylko nowych zapisów
      - Start maszyny, logowanie, praca z plikami, aktualizacje systemu i drukowanie pozostają bez zmian
    en:
      - The maker s tools that change the firmware s settings from within the system will report a fault of rights
      - The setting may then be put right by hand at the machine s start, so the road is not shut
      - The default list holds the administrators alone, so upon most machines the change is a setting down of a state
      - Settings of the firmware written earlier stay unchanged, the consequence touching only new writings
      - The machine s start, logging on, work with files, the servicing of the system and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Konto serwisowe uruchamia narzędzia producenta sprzętu zarządzające ustawieniami układowymi z poziomu systemu
    en:
      - A service account runs the maker s tools that rule the firmware s settings from within the system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemEnvironmentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemEnvironmentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemEnvironmentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSystemEnvironmentPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemEnvironmentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/modify-firmware-environment-values

notes:
  pl: |
    Reguła wyróżnia się w całym zbiorze tym, że jej naruszenie przeżywa
    przeinstalowanie systemu. Warto, żeby aplikacja to powiedziała wprost,
    bo zmienia sposób liczenia kosztu: wszystkie pozostałe punkty da się
    naprawić czystym systemem, ten nie.

    Argument wart zachowania dotyczy warstwy. Zabezpieczenia systemu
    działają dopiero wtedy, gdy system już wystartował. Ustawienia układowe
    rozstrzygają, czy wystartuje i co dokładnie — więc leżą poniżej
    wszystkiego, co system może o sobie powiedzieć.

    Odnotowuję, że reguła nie broni przed administratorem i bronić nie
    może. Administrator lokalny zmienia ustawienia układowe z definicji.
    Wartością jest to, że konto usługowe albo serwisowe, któremu prawo
    nadano przy instalacji jakiegoś narzędzia, przestaje być drogą do
    warstwy startu.
  en: |
    The rule stands out in the whole set in this, that the breach of it outlives the setting up of the system
    anew. It is well that the application say so outright, it changing how the cost is reckoned: every other item
    may be put right with a clean system, this one may not.

    The argument worth keeping touches the layer. The system's guardings work only once the system has started.
    The firmware's settings settle whether it will start and what exactly - so they lie below everything the
    system can say about itself.

    I set down that the rule does not guard against an administrator and cannot. A local administrator changes the
    firmware's settings by definition. The worth lies in this, that a service account granted the right at the
    installing of some tool ceases to be a road to the layer of the start.
