id: win10-firewall-logging-successful-connections

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Rejestrowanie nawiązanych połączeń we wszystkich profilach
    en: The recording of joinings that came through in all profiles
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza zapisywanie do pliku dziennika zapory połączeń,
    które zostały przepuszczone.

    Zapis połączeń udanych jest uzupełnieniem zapisu odrzuceń i dotyczy
    zupełnie innego pytania. Odrzucenia mówią, kto próbował wejść.
    Połączenia udane mówią, dokąd maszyna faktycznie się łączyła — a to
    jest pytanie zadawane po każdym podejrzeniu, że coś na niej działa.

    Wartość ujawnia się przy szukaniu połączeń wychodzących. Kod
    uruchomiony na maszynie musi zwykle skontaktować się ze swoim
    nadawcą: po instrukcje, po kolejny składnik albo żeby wysłać to, co
    zebrał. Połączenie takie przechodzi przez zaporę legalnie, bo ruch
    wychodzący jest dozwolony — i bez tego zapisu nie zostawia śladu.

    Odnotowuję, że jest to punkt najbardziej obciążający plik dziennika.
    Połączeń udanych jest na zwykłej maszynie wielokrotnie więcej niż
    odrzuceń, więc historia skraca się proporcjonalnie.

    Sprawdzenie wymienia profile, w których zapis jest wyłączony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: połączenia
    wychodzące niezostawiające śladu na maszynie.
  en: |
    The setting turns on the writing into the firewall's file of record of the joinings that were let through.

    The record of joinings that came through fills out the record of castings aside and touches a wholly other
    question. The castings aside say who tried to come in. The joinings that came through say whither the machine
    truly joined itself - and that is the question put after every suspicion that something is afoot upon it.

    The worth shows at the seeking of outbound joinings. Code started upon a machine has commonly to speak with
    whoever sent it: for orders, for a further part, or to send what it has gathered. Such a joining passes
    through the firewall lawfully, outbound traffic being allowed - and without this record it leaves no trace.

    I set down that it is the item that burdens the file of record the most. Joinings that come through are upon
    an ordinary machine many times more numerous than castings aside, so the history shortens in like measure.

    The check names the profiles in which the record stands off.

    What an attacker gains while the item goes unmet: outbound joinings leaving no trace upon the machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest rozmiar
    pliku dziennika zapory w zestawieniu z ruchem na tej maszynie.

    Powód jest jeden i konkretny. Połączeń udanych jest dużo, więc plik
    o rozmiarze domyślnym zapełni się w kilkadziesiąt minut i zacznie
    nadpisywać sam siebie. Efektem jest dziennik, który formalnie działa,
    a praktycznie nie sięga nigdzie wstecz — i przy okazji przykrywa
    zapis odrzuceń, bo oba trafiają do tego samego pliku.

    Sprawdzenie polega na oszacowaniu, ile połączeń dziennie wykonuje ta
    maszyna, i dobraniu rozmiaru pliku tak, żeby mieścił co najmniej kilka
    dni. Włączenie tego zapisu bez powiększenia pliku jest zmianą
    pozorną.

    Miejscem drugim wartym uwagi jest system zbierający dzienniki:
    przyrost objętości przesyłanych danych bywa tu odczuwalny.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: przepuszczania ruchu, reguł zapory, połączeń
    wychodzących, pracy programów, drukowania.
  en: |
    The class is "needs review", and the object of the review is the size of the firewall's file of record set
    beside the traffic upon this machine.

    The ground is one and it is plain. Joinings that come through are many, so a file of the default size will
    fill up in some tens of minutes and begin to write over itself. The upshot is a record that works in form and
    in practice reaches nowhere back - and that covers over the record of castings aside besides, both going into
    the same file.

    The review comes down to a reckoning of how many joinings this machine makes in a day and a choosing of the
    file's size so that it holds at least some days. The turning on of this record without an enlarging of the
    file is a change in seeming only.

    The second place worth notice is the system that gathers journals: the growth of the bulk of the data sent is
    here at times to be felt.

    The consequence shows at once, with no restart.

    What this does not break: the letting through of traffic, the firewall's rules, outbound joinings, the work of
    programs, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Plik dziennika zapory o rozmiarze domyślnym zapełni się w kilkadziesiąt minut i zacznie nadpisywać sam siebie
      - Zapis połączeń udanych przykryje wtedy zapis odrzuceń, bo oba trafiają do tego samego pliku
      - Włączenie tego zapisu bez powiększenia pliku dziennika jest zmianą pozorną
      - W systemie zbierającym dzienniki przyrost objętości przesyłanych danych bywa odczuwalny
      - Przepuszczanie ruchu, reguły zapory, połączenia wychodzące, praca programów i drukowanie pozostają bez zmian
    en:
      - The firewall s file of record at its default size will fill up in some tens of minutes and begin to write over itself
      - The record of joinings that came through will then cover over the record of castings aside, both going into the same file
      - The turning on of this record without an enlarging of the file is a change in seeming only
      - In the system that gathers journals the growth of the bulk of the data sent is at times to be felt
      - The letting through of traffic, the firewall s rules, outbound joinings, the work of programs and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Rozmiaru pliku dziennika zapory nie da się zwiększyć, a maszyna wykonuje bardzo dużo połączeń
      - System zbierający dzienniki jest rozliczany z objętości i przyrost danych byłby tu kosztem realnym
    en:
      - The size of the firewall s file of record cannot be raised and the machine makes very many joinings
      - The system gathering journals is reckoned by bulk and the growth of data would here be a real cost
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # The three profiles are weighed together. Naming the ones that fall out
        # matters, a machine set in two of three being a different case from one
        # set in none.
        $wrong = @($profiles | Where-Object { $_.LogAllowed -ne 'True' })
        if ($wrong.Count -eq 0) { 'ALL_LOGGED' } else { 'SILENT_IN_' + ($wrong.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_LOGGED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogAllowed |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogAllowed True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogAllowed $p.LogAllowed
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest parą do punktu o odrzuconych pakietach, ale odpowiada na
    inne pytanie i warto, żeby aplikacja to rozdzieliła. Odrzucenia
    opisują ruch przychodzący i cudze próby; połączenia udane opisują
    ruch wychodzący i to, co robi sama maszyna.

    Argument wart postawienia wprost dotyczy połączeń wychodzących. Kod,
    który już działa na maszynie, kontaktuje się ze swoim nadawcą
    legalnie — zapora go przepuszcza, bo tak jest ustawiona. Jest to
    jedyny moment, w którym takie połączenie da się zauważyć, i bez tego
    zapisu ono po prostu nie istnieje.

    Odnotowuję ostrzeżenie o objętości, bo jest tu najważniejsze
    praktycznie. Punkt ten wdrożony bez powiększenia pliku dziennika nie
    tylko nie daje nic, ale odbiera wartość punktowi sąsiedniemu, zalewając
    plik do tego stopnia, że zapis odrzuceń nie mieści się w nim dłużej
    niż kilkadziesiąt minut.
  en: |
    The rule is the pair of the item about cast-aside packets, but answers another question, and it is well that
    the application part them. The castings aside set out inbound traffic and other people's attempts; the
    joinings that came through set out outbound traffic and what the machine itself does.

    The argument worth putting outright touches outbound joinings. Code already working upon a machine speaks with
    whoever sent it lawfully - the firewall lets it through, being so set. It is the one hour at which such a
    joining may be marked, and without this record it simply does not exist.

    I set down the warning about bulk, that being here the weightiest in practice. This item rolled out without an
    enlarging of the file of record not only gives nothing but takes the worth from the neighbouring item,
    flooding the file so far that the record of castings aside no longer fits in it beyond some tens of minutes.
