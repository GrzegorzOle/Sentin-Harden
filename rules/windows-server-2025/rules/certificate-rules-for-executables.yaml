id: win2025-certificate-rules-for-executables

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Reguły oparte o certyfikat stosowane do plików wykonywalnych
    en: Rules resting on a certificate applied to executable files
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza w mechanizmie ograniczania oprogramowania rozpoznawanie
    plików po certyfikacie wydawcy, obok rozpoznawania po ścieżce i po
    odcisku pliku.

    Trzy sposoby rozpoznawania różnią się tym, co da się obejść. Regułę
    opartą o ścieżkę obchodzi się przeniesieniem pliku. Regułę opartą
    o odcisk — zmianą jednego bajtu, bo odcisk jest wtedy inny. Reguła
    oparta o certyfikat przeżywa jedno i drugie, bo opisuje tego, kto
    plik podpisał, a nie to, gdzie plik leży ani jak dokładnie wygląda.

    Bez tego ustawienia reguły po wydawcy są w polityce zapisane, ale
    nie obowiązują. Jest to stan najgorszy z możliwych — nie dlatego,
    że coś przepuszcza, tylko dlatego, że wygląda w konsoli zarządzania
    tak samo jak stan działający. Osoba, która taką regułę napisała,
    ma prawo sądzić, że coś zablokowała.

    Na serwerze rzecz waży dokładnie tyle, ile ktoś zainwestował w ten
    mechanizm. Jeżeli reguł po wydawcy nie ma, ustawienie nie robi nic
    i trzeba to powiedzieć wprost. Jeżeli są — a bywają na serwerach
    aplikacyjnych, gdzie ktoś chciał ograniczyć zbiór uruchamianego
    oprogramowania — to bez tej wartości cała ta praca jest bezużyteczna.

    Warto też wiedzieć, że mechanizm ograniczania oprogramowania jest
    rozwiązaniem starszej generacji. Na serwerze nowym właściwym
    narzędziem jest kontrola aplikacji oparta o polityki integralności
    kodu. Ten punkt zamyka lukę w narzędziu starym, a nie zastępuje
    nowego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchomienia pliku, który został zablokowany regułą po wydawcy,
    bo reguła ta nie jest stosowana.
  en: |
    The setting switches on, within the mechanism of software restriction, the telling of files by
    the publisher's certificate, beside the telling by path and by the file's fingerprint.

    The three ways of telling differ in what can be gone round. A rule resting on a path is gone
    round by moving the file. A rule resting on a fingerprint - by changing one byte, the
    fingerprint being then another. A rule resting on a certificate lives through both, setting
    down who signed the file and not where the file lies nor how exactly it looks.

    Without this setting the rules by publisher are written in the policy but do not hold. It is
    the worst state to be had - not because it lets something through, but because it looks in the
    console of management just like a working state. The person who wrote such a rule has every
    right to believe they blocked something.

    On a server the matter weighs exactly as much as somebody put into this mechanism. Where there
    are no rules by publisher, the setting does nothing and that must be said outright. Where
    there are - and there are at times on application servers, where somebody wished to bound the
    set of software run - then without this value all that work is of no use.

    It is worth knowing too that the mechanism of software restriction is a solution of an older
    generation. On a new server the right tool is a control of applications resting on policies of
    code integrity. This item shuts a gap in the old tool and does not stand in for the new.

    What an attacker gains while the item goes unmet: the means of running a file blocked by a
    rule by publisher, that rule not being applied.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy na tym serwerze mechanizm ograniczania
    oprogramowania jest w ogóle używany, a jeżeli tak, to czy ktoś
    przejrzał reguły po wydawcy, zanim zaczną obowiązywać.

    Jest to porządek odwrotny do zwykłego. Nie pytamy tu, co zmiana
    zepsuje w systemie, tylko co włączy w polityce napisanej przez kogoś
    innego, być może lata temu i być może nie do końca.

    Reguła po wydawcy napisana niedbale potrafi zablokować więcej, niż
    zamierzono, bo wydawca podpisuje zwykle całą swoją linię produktów,
    a nie jeden program. Po włączeniu takie reguły zaczynają działać
    wszystkie naraz i to jest moment, w którym serwer przestaje uruchamiać
    rzeczy uruchamiane dotąd bez przeszkód.

    Drugi skutek dotyczy sprawdzania unieważnień. Rozpoznanie po
    certyfikacie oznacza, że przy uruchamianiu plików system może
    próbować sprawdzić, czy certyfikat nie został unieważniony. Serwer
    odcięty od sieci publicznej — a taki bywa w segmencie zamkniętym —
    czeka wtedy na odpowiedź, której nie dostanie, i uruchamianie
    programów zwalnia zauważalnie.

    Objaw jest wtedy mylący: serwer nie zgłasza błędu, tylko robi
    wszystko wolniej, a opóźnienie pojawia się przy starcie każdego
    procesu. Wygląda to na problem z wydajnością, nie na skutek zmiany
    w polityce.

    Zmiana działa natychmiast i cofa się natychmiast, bez restartu
    i bez przerwy w pracy.

    Tam, gdzie mechanizmu ograniczania oprogramowania nikt nie używa,
    zmiana nie robi nic — i nie robi też nic dobrego. Warto to zapisać
    w raporcie zamiast liczyć ją jako wygraną.
  en: |
    One thing needs checking: whether the mechanism of software restriction is used on this server
    at all, and if so, whether anyone has gone over the rules by publisher before they begin to
    hold.

    It is the contrary order to the usual. We do not ask here what the change will break in the
    system, but what it will switch on within a policy written by somebody else, perhaps years ago
    and perhaps not to the end.

    A rule by publisher written carelessly can block more than was meant, a publisher usually
    signing their whole line of products and not one program. After the switching on such rules
    begin working all at once, and that is the moment the server stops running things run until
    then without let.

    The second effect bears on the checking of revocations. The telling by certificate means that
    at the running of files the system may try to check whether the certificate was not revoked. A
    server cut off from the public network - and such it is at times in a closed segment - then
    waits for an answer it will not get, and the starting of programs slows noticeably.

    The symptom then misleads: the server reports no fault but does everything more slowly, and
    the delay shows at the start of every process. It looks like a trouble of performance and not
    like the effect of a change in policy.

    The change works at once and is undone at once, with no restart and no break in work.

    Where nobody uses the mechanism of software restriction the change does nothing - and does
    nothing good either. It is worth writing that in the report instead of counting it a win.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - encryption-and-tls
  what_breaks:
    pl:
      - Reguły po wydawcy napisane niedbale zaczną obowiązywać wszystkie naraz i mogą zablokować więcej, niż zamierzono
      - Serwer odcięty od sieci publicznej może zwalniać przy starcie procesów przez sprawdzanie unieważnień
      - Objawem jest spowolnienie bez komunikatu, wyglądające na problem z wydajnością
      - Tam, gdzie mechanizmu ograniczania oprogramowania nikt nie używa, zmiana nie robi nic
    en:
      - Rules by publisher written carelessly will begin to hold all at once and may block more than was meant
      - A server cut off from the public network may slow at the start of processes through the checking of revocations
      - The symptom is a slowing with no message, looking like a trouble of performance
      - Where nobody uses the mechanism of software restriction the change does nothing
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Mechanizm ograniczania oprogramowania jest używany, a reguł po wydawcy nikt nie przejrzał
      - Serwer pracuje w segmencie odciętym od sieci publicznej i sprawdzenie unieważnień kończy się oczekiwaniem
    en:
      - The mechanism of software restriction is in use and nobody has gone over the rules by publisher
      - The server works in a segment cut off from the public network and the checking of revocations ends in waiting
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
      $name = 'AuthenticodeEnabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
    $name = 'AuthenticodeEnabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AuthenticodeEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/hh994606(v=ws.11)

notes:
  pl: |
    Bez tego ustawienia reguły po wydawcy są w polityce zapisane, ale
    nie obowiązują — a w konsoli zarządzania wyglądają tak samo jak
    reguły działające. To jest właściwa treść tego punktu.

    Tam, gdzie reguł po wydawcy nie ma, zmiana nie robi nic. Warto to
    zapisać w raporcie zamiast liczyć ją jako wygraną.

    Mechanizm ograniczania oprogramowania jest rozwiązaniem starszej
    generacji. Na serwerze nowym właściwym narzędziem jest kontrola
    aplikacji oparta o polityki integralności kodu — ten punkt zamyka
    lukę w narzędziu starym, a nie zastępuje nowego.
  en: |
    Without this setting the rules by publisher are written in the policy but do not hold - and in
    the console of management they look just like working rules. That is the true substance of
    this item.

    Where there are no rules by publisher the change does nothing. It is worth writing that in the
    report instead of counting it a win.

    The mechanism of software restriction is a solution of an older generation. On a new server the
    right tool is a control of applications resting on policies of code integrity - this item
    shuts a gap in the old tool and does not stand in for the new.
