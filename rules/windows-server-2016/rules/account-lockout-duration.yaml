id: win2016-account-lockout-duration

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Czas, przez jaki zablokowane konto pozostaje zamknięte
    en: How long a locked account stays closed
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby zablokowane konto pozostawało zamknięte przez co
    najmniej piętnaście minut.

    Sam czas blokady niczego nie zamyka i dlatego kategoria jest niska.
    Wartość tego punktu polega na tym, że dopiero on nadaje progowi blokady
    znaczenie. Próg ustawiony razem z blokadą trwającą minutę spowalnia
    zgadywanie o tę minutę — czyli prawie wcale. Piętnaście minut zmienia
    arytmetykę ataku na tyle, że zgadywanie przestaje się opłacać.

    Liczbę warto zobaczyć od strony napastnika. Przy progu dziesięciu prób
    i blokadzie piętnastominutowej maszyna przyjmuje niecałe czterdzieści
    prób na godzinę. Lista haseł, którą da się w takim tempie przejść
    w rozsądnym czasie, jest krótka.

    Na serwerze ten punkt nie jest odczuwalny prawie w ogóle, bo mało kto
    loguje się tu codziennie. Odczuwalny bywa wtedy, gdy zablokuje się konto
    administracyjne — i to jest jedyny scenariusz, dla którego warto
    przeczytać opis do końca.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przy krótkiej
    blokadzie zgadywanie hasła jest tylko wolniejsze, a nie nieopłacalne.
    Blokada minutowa mnoży czas ataku przez niewiele.
  en: |
    The item requires a locked account to stay closed for at least fifteen
    minutes.

    The lockout time closes nothing by itself, and that is why the category is
    low. The value of this item is that it is what gives the lockout threshold
    its meaning. A threshold set alongside a one-minute lockout slows guessing
    down by that one minute - which is to say barely at all. Fifteen minutes
    changes the arithmetic of the attack enough that guessing stops being
    worthwhile.

    The number is worth seeing from the attacker's side. With a threshold of
    ten attempts and a fifteen-minute lockout, the machine accepts fewer than
    forty attempts an hour. The list of passwords that can be worked through at
    that rate in reasonable time is a short one.

    On a server this item is barely felt at all, because few people sign in
    here daily. It is felt when an administrative account gets locked - and
    that is the one scenario for which the description is worth reading to the
    end.

    What an attacker gains while the item goes unmet: with a short lockout,
    guessing a password is merely slower rather than unprofitable. A one-minute
    lockout multiplies the time an attack takes by very little.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest jedna: czy ktoś
    jest w stanie odblokować konto poza godzinami pracy.

    Skutek reguły jest prosty. Konto zablokowane o drugiej w nocy otwiera się
    samo kwadrans później. Bez tego ustawienia — przy blokadzie bezterminowej
    — nie otworzy się wcale, dopóki nie zrobi tego człowiek. Na serwerze
    pracującym bez obsady nocnej różnica między tymi dwoma stanami to różnica
    między kwadransem przerwy a przerwą do rana.

    Kierunek wdrożenia bywa więc odwrotny, niż podpowiada intuicja. Ta reguła
    zwykle nie zaostrza ustawienia, tylko je łagodzi: zastępuje blokadę
    wymagającą człowieka blokadą, która mija sama.

    Rzecz do zapamiętania przy tym roczniku: serwer 2016 bywa maszyną, do
    której nikt nie zagląda tygodniami. Blokada bezterminowa oznacza tam
    usługę stojącą tak długo, aż ktoś zauważy.

    Czego to nie psuje: logowania kontami niezablokowanymi, odblokowania
    ręcznego, które działa dalej, ani żadnej usługi.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and there is one thing to review: whether
    anybody is able to unlock an account outside working hours.

    The effect of the rule is simple. An account locked at two in the morning
    opens by itself a quarter of an hour later. Without this setting - with a
    lockout that has no end - it does not open at all until a person does it.
    On a server running with no night staff, the difference between those two
    states is the difference between a quarter-hour outage and an outage until
    morning.

    The direction of the rollout is therefore often the opposite of what
    intuition suggests. This rule usually does not tighten a setting but eases
    it: it replaces a lockout that needs a person with one that passes by
    itself.

    Something to remember with this vintage: a Server 2016 machine is sometimes
    one nobody looks at for weeks. An endless lockout there means a service
    standing still until somebody notices.

    What this does not break: signing in with accounts that are not locked,
    manual unlocking, which goes on working, or any service.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Zablokowane konto otwiera się samo po upływie ustawionego czasu, bez udziału człowieka
      - Blokada bezterminowa zastąpiona czasową przestaje wymagać obsługi nocnej
      - Odblokowanie ręczne przez administratora działa dalej
      - Konta niezablokowane i usługi działają bez zmian
    en:
      - A locked account opens by itself once the set time passes, with nobody involved
      - An endless lockout replaced by a timed one stops requiring night cover
      - Manual unlocking by an administrator goes on working
      - Accounts that are not locked, and services, work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Przyjęto świadomie, że każde zablokowanie konta ma być rozpatrzone przez człowieka, i jest kto to robi całą dobę
    en:
      - It has been deliberately decided that every lockout is to be reviewed by a person, and somebody is there to do it around the clock
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LockoutDuration\s*=\s*(-?\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^LockoutDuration\s*=\s*(-?\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'LockoutDuration'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A lockout with no end also satisfies the benchmark, but it takes a person
    # to lift every lockout by hand. On a machine with no night cover that is
    # the difference between a quarter of an hour and a morning.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LockoutDuration = 15',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('LockoutDuration = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/account-lockout-duration

notes:
  pl: |
    Punkt jest środkowym z trójki: próg, czas trwania blokady i czas powrotu
    licznika do zera. Żaden z nich sam nie daje ochrony, a ustawione
    niespójnie potrafią się znosić.

    Warto pamiętać, że czas trwania blokady nie może być krótszy niż czas
    powrotu licznika — system tego pilnuje i przy próbie ustawienia inaczej
    poprawia wartość po swojemu.

    Kategoria niska, bo sam czas blokady nie zamyka żadnej drogi. Nadaje
    natomiast sens progowi, z którym tworzy parę.
  en: |
    The item is the middle one of three: the threshold, how long the lockout
    lasts, and how long before the counter returns to zero. None of them gives
    protection alone, and set inconsistently they can cancel each other out.

    Worth remembering that the lockout duration cannot be shorter than the
    counter reset time - the system enforces that and, on an attempt to set it
    otherwise, corrects the value in its own way.

    The category is low, because the lockout time closes no road. What it does
    is give the threshold its meaning, with which it forms a pair.
