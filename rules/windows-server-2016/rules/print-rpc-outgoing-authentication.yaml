id: win2016-print-rpc-outgoing-authentication

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Uwierzytelnianie połączeń wychodzących podsystemu druku wymagane
    en: Authentication of outgoing connections of the printing subsystem required
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pilnuje, żeby podsystem druku nie rezygnował
    z uwierzytelnienia przy sięganiu do cudzych serwerów wydruku.

    Wartość ma trzy stany, a groźny jest jeden: wyłączenie uwierzytelnienia
    wprost. Jest to ustawienie, którego nikt nie wprowadza przypadkiem.
    Wprowadza się je ręcznie, żeby coś zadziałało — zwykle stare urządzenie
    wielofunkcyjne, które nie potrafi się uwierzytelnić. Zostaje potem na
    zawsze, bo urządzenie działa i nikt do tego nie wraca.

    Skutek jest szerszy, niż zakładał ten, kto wpis wprowadził. Wyłączenie
    nie dotyczy jednego urządzenia — dotyczy każdego połączenia wychodzącego
    podsystemu druku. Maszyna przestaje sprawdzać, z kim rozmawia, przy
    wszystkich serwerach wydruku, także tych, z którymi rozmawiała dotąd
    poprawnie.

    Otwiera to drogę podstawienia się pod serwer wydruku. Maszyna przyjmie
    odpowiedź od kogokolwiek, kto odpowie pierwszy na jej pytanie o kolejkę,
    a odpowiedź ta niesie między innymi wskazanie sterownika do pobrania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia się pod dowolny serwer wydruku, z którym ta maszyna się
    łączy, bez łamania czegokolwiek — bo strona pytająca przestała sprawdzać
    odpowiadającego.
  en: |
    The setting sees to it that the printing subsystem does not give up
    authentication when reaching other print servers.

    The value has three states and one of them is dangerous: switching authentication
    off outright. It is a setting nobody puts in by accident. It is put in by hand to
    make something work - as a rule an old multifunction device unable to
    authenticate. It then stays for good, the device working and nobody returning to
    it.

    The consequence is wider than whoever put the entry in assumed. The switching off
    does not concern one device - it concerns every outgoing connection of the
    printing subsystem. The machine stops checking whom it talks to at every print
    server, those included with which it talked properly until now.

    That opens the road to standing in for a print server. The machine will take an
    answer from whoever answers its question about a queue first, and that answer
    carries among other things a pointer to a driver to fetch.

    What an attacker gains while the item goes unmet: the chance to stand in for any
    print server this machine connects to, without breaking anything at all - the
    asking side having stopped checking the answering one.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest jedna i wąska:
    czy ktoś wyłączył uwierzytelnienie po to, żeby jakieś urządzenie
    zadziałało.

    Jeżeli nie — a tak jest na większości maszyn — wdrożenie zapisuje
    wartość domyślną i nie zmienia nic.

    Jeżeli tak, wdrożenie zabierze możliwość drukowania na tym urządzeniu.
    Jest to skutek zamierzony i trzeba go nazwać wprost: reguła przywraca
    sprawdzanie, a urządzenie, które sprawdzenia nie przechodzi, przestanie
    przyjmować zadania.

    Trudność polega na odszukaniu, którego urządzenia dotyczy. Wpis jest
    jeden i obejmuje wszystkie połączenia wychodzące, więc nie mówi, dla
    kogo został wprowadzony. Rozpoznanie idzie od strony objawu: po
    wdrożeniu przestanie drukować to, dla czego wpis powstał.

    Odpowiedzią jest zastąpienie albo aktualizacja urządzenia, a nie
    utrzymywanie wyłączonego sprawdzania dla całej maszyny.

    Wymaga zatrzymania usługi wydruku, więc zadania stojące w kolejce
    zostaną przerwane.

    Czego to nie psuje: drukowania na drukarkach podłączonych lokalnie,
    kolejek udostępnianych z tej maszyny, dostępu do plików, usług.
  en: |
    The class is "needs review", and the thing to check is one and narrow: whether
    somebody switched authentication off to make some device work.

    If not - and so it is on most machines - the rollout writes down the default
    value and changes nothing.

    If so, the rollout will take away the ability to print on that device. It is an
    intended consequence and has to be named outright: the rule restores checking,
    and a device that does not pass the check will stop taking jobs.

    The difficulty lies in finding out which device is meant. There is one entry and
    it covers every outgoing connection, so it does not say for whom it was put in.
    The search goes from the symptom's side: after the rollout, whatever the entry
    was made for will stop printing.

    The answer is to replace or update the device rather than to keep checking
    switched off for the whole machine.

    Calls for the print service to be stopped, so jobs standing in the queue will be
    broken off.

    What this does not break: printing on locally attached printers, queues shared
    from this machine, access to files, or services.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Urządzenie, dla którego wyłączono uwierzytelnienie, przestanie przyjmować zadania - jest to skutek zamierzony
      - Wpis jest jeden i obejmuje wszystkie połączenia wychodzące, więc nie mówi, dla kogo powstał, i rozpoznanie idzie od strony objawu
      - Zatrzymanie usługi wydruku przerywa zadania stojące w kolejce
      - Drukowanie na drukarkach podłączonych lokalnie i kolejki udostępniane z tej maszyny pozostają bez zmian
    en:
      - A device for which authentication was switched off will stop taking jobs - that is an intended consequence
      - There is one entry and it covers every outgoing connection, so it does not say for whom it was made and the search goes from the symptom
      - Stopping the print service breaks off jobs standing in the queue
      - Printing on locally attached printers and queues shared from this machine stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Wyłączenie uwierzytelnienia utrzymuje tu przy życiu urządzenie, którego nie da się na razie zastąpić ani zaktualizować
      - Nie da się zatrzymać usługi wydruku bez uzgodnienia okna serwisowego
    en:
      - Switching authentication off keeps alive here a device that cannot be replaced or updated for the time being
      - The print service cannot be stopped without a maintenance window being agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero is the default handling, in which authentication is used;
      # two switches it off outright.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcAuthentication'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'RpcAuthentication'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is the default handling, in which authentication is used. Two switches
    # it off outright and is the value this item guards against.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcAuthentication' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-print-spooler-service

notes:
  pl: |
    Punkt zamyka blok o wydruku i jest w nim jedynym, którego niezgodność
    zawsze oznacza decyzję człowieka. Pozostałe reguły bloku bywają
    niespełnione dlatego, że nikt ich nie wdrażał. Ta bywa niespełniona
    dlatego, że ktoś ją wprost odwrócił — i to zwykle po to, żeby coś
    zadziałało.

    Warto z tego zrobić użytek w interfejsie. Niezgodność w tym punkcie
    jest wskazówką, że na maszynie stoi urządzenie, które nie potrafi się
    uwierzytelnić, a to jest informacja przydatna niezależnie od samej
    reguły.

    Blok o wydruku liczy dwanaście reguł i dzieli się na trzy części:
    usunięcie usługi, zastrzeżenie instalowania sterowników, ograniczenie
    dróg sieciowych. Najmocniejsza jest część pierwsza i tam, gdzie da się
    ją wykonać, pozostałe dziesięć traci znaczenie praktyczne. Tam, gdzie
    się nie da — a więc na każdym serwerze wydruku — dopiero one są tym,
    co zostaje.

    Wpis wymaga na tym wydaniu systemu aktualizacji z drugiej połowy
    2021 roku.
  en: |
    The item shuts the block about printing and is the only one in it whose
    non-compliance always means a person's decision. The block's other rules are at
    times unmet because nobody rolled them out. This one is at times unmet because
    somebody reversed it outright - and as a rule to make something work.

    That is worth putting to use in the interface. A non-compliance at this item is a
    sign that a device stands on the machine unable to authenticate, and that is
    useful information apart from the rule itself.

    The block about printing counts twelve rules and falls into three parts:
    removing the service, reserving the installing of drivers, limiting the network
    roads. The first part is the strongest, and where it can be carried out the other
    ten lose their practical weight. Where it cannot - which is to say on every print
    server - those are what is left.

    On this release of the system the entry calls for an update from the second half
    of 2021.
