id: win2025-consumer-account-state-content-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Zachęty dotyczące stanu konta w chmurze wyłączone
    en: Prompts about the state of a cloud account turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wyświetlanie zachęt dotyczących stanu konta w chmurze:
    propozycji dokończenia konfiguracji, podpięcia konta, uzupełnienia
    danych, wykupienia miejsca.

    Kategoria średnia i chcę uzasadnić ją przez to, co te zachęty robią,
    a nie przez to, że są nachalne. One prowadzą do jednego: do podpięcia
    konta zewnętrznego do konta używanego na tej maszynie. Na serwerze
    oznacza to powiązanie konta administracyjnego z tożsamością spoza
    organizacji.

    Skutek jest konkretny i trwały. Konto z takim powiązaniem daje się
    odzyskać drogą, nad którą organizacja nie ma kontroli, a stan
    poświadczeń przestaje być w całości ustalany przez jej katalog. To jest
    zmiana granicy zaufania, wykonana przez kliknięcie w propozycję, która
    wygląda na drobiazg porządkowy.

    Chcę też zwrócić uwagę na kontekst, w którym to się dzieje. Zachęty
    pojawiają się przy pierwszym zalogowaniu na świeżym profilu — czyli
    dokładnie wtedy, gdy ktoś stawia serwer, ma dziesięć rzeczy do zrobienia
    i klika, żeby okno zniknęło. To nie jest sytuacja, w której zapadają
    przemyślane decyzje o tożsamości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: szansę, że
    konto na serwerze jest powiązane z tożsamością spoza organizacji —
    i że droga odzyskania tego konta prowadzi poza jej katalog.
  en: |
    The item turns off the display of prompts about the state of a cloud
    account: proposals to finish setting up, to attach an account, to fill
    in details, to buy storage.

    The category is medium, and I want to justify it by what these prompts
    do rather than by their being insistent. They lead to one thing: the
    attaching of an outside account to the account used on this machine. On
    a server that means tying an administrative account to an identity from
    outside the organisation.

    The effect is concrete and lasting. An account with such a tie can be
    recovered by a route the organisation does not control, and the state of
    its credentials stops being settled entirely by the organisation's
    directory. That is a change in the boundary of trust, made by clicking a
    proposal that looks like a tidying-up trifle.

    I also want to draw attention to the context in which this happens. The
    prompts appear at the first sign-in on a fresh profile - that is,
    exactly when somebody is setting a server up, has ten things to do, and
    clicks so the window goes away. That is not a situation in which
    considered decisions about identity are taken.

    What an attacker gains while the item goes unmet: the chance that an
    account on the server is tied to an identity from outside the
    organisation - and that the route to recovering that account leads
    outside its directory.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i chcę być precyzyjny co do tego, czego ta
    reguła nie robi, bo zakres jest węższy, niż sugeruje temat.

    Ona wyłącza wyświetlanie zachęt. Nie zrywa istniejących powiązań, nie
    odłącza kont już podpiętych i nie blokuje możliwości podpięcia konta
    komuś, kto zechce to zrobić świadomie, przechodząc do ustawień. Jeżeli
    na tej maszynie ktoś już powiązał konto z tożsamością zewnętrzną, ta
    reguła tego nie cofnie — i warto to sprawdzić osobno, bo wykryje się to
    tylko przez spojrzenie, nie przez audyt tego punktu.

    Zablokowanie samego podpinania kont jest osobnym punktem i nie należy
    tych dwóch mylić. Ten jest po to, żeby propozycja nie pojawiała się
    w chwili, w której nikt nie ma głowy do decyzji.

    Czego to nie psuje: logowania, kont lokalnych, kont z katalogu
    organizacji, ról serwera, usług, niczego. Człowiek zobaczy różnicę
    tylko przez to, że coś przestanie się pojawiać.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and I want to be precise about what this
    rule does not do, because its scope is narrower than the subject
    suggests.

    It turns off the display of prompts. It does not break existing ties,
    does not detach accounts already attached, and does not block the
    attaching of an account by somebody who chooses to do it deliberately by
    going into the settings. If somebody on this machine has already tied an
    account to an outside identity, this rule will not undo it - and that is
    worth checking separately, because it will be found only by looking, not
    by auditing this item.

    Blocking the attaching of accounts itself is a separate item and the two
    should not be confused. This one exists so that the proposal does not
    appear at a moment when nobody has the head for a decision.

    What this does not break: signing in, local accounts, accounts from the
    organisation's directory, server roles, services, anything. A person
    will see the difference only in that something stops appearing.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Reguła wyłącza wyświetlanie zachęt, a nie zrywa istniejących powiązań konta z tożsamością zewnętrzną
      - Konto podpięte wcześniej pozostaje podpięte i wykryje się to tylko przez spojrzenie, nie przez audyt tego punktu
      - Nie blokuje podpięcia konta komuś, kto zrobi to świadomie, przechodząc do ustawień — to osobny punkt
      - Nie zmienia się logowanie, konta lokalne, konta z katalogu organizacji, role serwera ani usługi
    en:
      - The rule turns off the display of prompts; it does not break existing ties between an account and an outside identity
      - An account attached earlier stays attached, and that will be found only by looking, not by auditing this item
      - It does not block the attaching of an account by somebody who does it deliberately in the settings - that is a separate item
      - Signing in, local accounts, directory accounts, server roles and services stay as they are
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym użytkownicy świadomie korzystają z kont chmurowych w ramach swojej pracy
    en:
      - The machine is a terminal server where users deliberately use cloud accounts as part of their work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableConsumerAccountStateContent'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableConsumerAccountStateContent'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This stops the prompts appearing; it does not break ties already made.
    # An account tied earlier to an outside identity stays tied and has to be
    # looked for separately - auditing this item will not reveal it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableConsumerAccountStateContent' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Uzasadnieniem nie jest nachalność zachęt, tylko to, dokąd prowadzą:
    do podpięcia konta zewnętrznego do konta używanego na tej maszynie.
    Na serwerze to powiązanie konta administracyjnego z tożsamością spoza
    organizacji — konto daje się wtedy odzyskać drogą, nad którą
    organizacja nie ma kontroli.

    Kontekst jest tu istotny: zachęty pojawiają się przy pierwszym
    zalogowaniu na świeżym profilu, czyli gdy ktoś stawia serwer, ma
    dziesięć rzeczy do zrobienia i klika, żeby okno zniknęło.

    Zakres węższy, niż sugeruje temat: reguła nie zrywa istniejących
    powiązań. Konto podpięte wcześniej trzeba sprawdzić osobno, bo audyt
    tego punktu tego nie pokaże.
  en: |
    The justification is not the insistence of the prompts but where they
    lead: to attaching an outside account to the account used on this
    machine. On a server that ties an administrative account to an identity
    from outside the organisation - the account can then be recovered by a
    route the organisation does not control.

    The context matters here: the prompts appear at the first sign-in on a
    fresh profile, that is, when somebody is setting a server up, has ten
    things to do, and clicks so the window goes away.

    The scope is narrower than the subject suggests: the rule does not break
    existing ties. An account attached earlier has to be checked separately,
    because auditing this item will not show it.
