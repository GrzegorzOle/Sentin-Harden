id: win2025-rdp-com-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów szeregowych w sesji pulpitu zdalnego wyłączone
    en: Serial port redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie portów szeregowych maszyny łączącej
    się do sesji zdalnej. Urządzenie wpięte do portu szeregowego na
    stanowisku przestaje być widoczne z wnętrza sesji na serwerze.

    Ocenę stawiam tu nisko i chcę powiedzieć wprost dlaczego, zamiast
    podpierać ją powagą sąsiednich punktów.

    Port szeregowy przenosi strumień znaków i nic więcej. Nie da się
    nim uruchomić pliku, nie udostępnia katalogu, nie niesie systemu
    plików. Napastnik, który ma sesję na serwerze, zyskuje tą drogą
    dostęp do urządzenia wpiętego u siebie — czyli u siebie. Jest to
    zysk bliski zeru i nie ma powodu twierdzić inaczej.

    Wartość punktu jest inna i mieści się w jednym zdaniu: podsystem
    obsługujący przekierowanie jest kodem, który działa w sesji i nie
    jest nikomu potrzebny. Kod nieużywany nie jest kodem nieszkodliwym —
    jest kodem niesprawdzonym. Zamknięcie ścieżki, z której nikt nie
    korzysta, zmniejsza powierzchnię, na której może ujawnić się błąd.

    Na serwerze rzecz ma jeszcze jedną stronę, wartą odnotowania przy
    okazji. Port szeregowy jest na serwerach drogą konsoli zapasowej,
    tyle że nie tą drogą — konsola szeregowa serwera idzie przez kartę
    zarządzającą, a nie przez przekierowanie w sesji. Tego ustawienia
    te dwie rzeczy nie łączą i wyłączenie przekierowania niczego
    w konsoli zapasowej nie zmienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    ponad to, że w sesji działa podsystem, którego nikt nie sprawdza.
  en: |
    The setting cuts off the joining of the connecting machine's serial ports to the remote
    session. A device plugged into a serial port at the station stops being seen from within the
    session on the server.

    I set the reckoning low here and mean to say plainly why, rather than propping it on the
    gravity of the neighbouring items.

    A serial port carries a stream of characters and nothing more. No file can be run by it, it
    gives over no folder, it bears no system of files. An attacker who holds a session on the
    server wins by that road a hold of a device plugged in at their own end - that is, at their
    own. It is a gain near to nothing and there is no cause to say otherwise.

    The item's worth is another and fits in one sentence: the subsystem serving the redirection is
    code which runs in the session and which nobody needs. Code unused is not code harmless - it is
    code unexamined. The shutting of a path nobody uses lessens the surface on which a fault may
    come out.

    On a server the matter has one further side, worth noting in passing. A serial port is on
    servers a road for a spare console, only not this road - a server's serial console goes through
    the management card and not through redirection within a session. This setting does not join
    those two things, and the switching off of the redirection changes nothing in the spare
    console.

    What an attacker gains while the item goes unmet: little beyond this, that a subsystem nobody
    examines runs in the session.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno i w większości instalacji odpowiedź brzmi
    „nikt", ale tam, gdzie brzmi inaczej, skutek jest natychmiastowy.

    Chodzi o serwer terminali obsługujący oprogramowanie dziedzinowe,
    które rozmawia z urządzeniem wpiętym u człowieka na stanowisku:
    wagą, czytnikiem kodów, terminalem płatniczym, sterownikiem
    maszyny, urządzeniem pomiarowym. Te urządzenia rozmawiają portem
    szeregowym do dziś i przekierowanie jest sposobem, w jaki aplikacja
    w sesji je widzi.

    Drugi przypadek to klucz licencyjny wpięty szeregowo. Brzmi to jak
    rzecz sprzed dwóch dekad i takie właśnie bywa oprogramowanie, które
    na serwerach terminali pracuje najdłużej.

    Objaw jest jednoznaczny i łatwy do powiązania ze zmianą: aplikacja
    zgłasza, że nie znajduje urządzenia albo portu. Zdarza się jednak
    wariant mylący — oprogramowanie z kluczem licencyjnym zgłasza brak
    licencji, a nie brak portu, i wtedy nikt nie szuka przyczyny tutaj.

    Poza tymi przypadkami zmiana jest całkowicie niewidoczna. Na
    serwerze bez oprogramowania dziedzinowego nikt jej nie zauważy.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    nawiązane zachowują przekierowanie do końca.
  en: |
    One thing needs checking, and in most installations the answer runs "nobody", but where it runs
    otherwise the effect is at once.

    It is about a terminal server serving trade software which speaks with a device plugged in at a
    person's station: a scale, a reader of codes, a terminal of payment, a driver of a machine, a
    device of measuring. Those devices speak by a serial port to this day, and the redirection is
    the way an application in the session sees them.

    The second case is a key of licence plugged in serially. It sounds like a thing of two decades
    ago, and such indeed is the software that works longest on terminal servers.

    The symptom is plain and easy to tie to the change: the application reports that it does not
    find the device or the port. There happens, though, a misleading turn - software with a key of
    licence reports a lack of licence and not a lack of a port, and then nobody looks for the cause
    here.

    Outside those cases the change is wholly unseen. On a server without trade software nobody will
    notice it.

    The change comes into force straight away and is undone at once. Sessions already opened keep
    the redirection to their end.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - legacy-applications
  what_breaks:
    pl:
      - Aplikacja w sesji przestanie widzieć wagę, czytnik kodów albo terminal płatniczy wpięty u człowieka
      - Oprogramowanie z kluczem licencyjnym wpiętym szeregowo przestanie się uruchamiać
      - Wariant mylący, gdy oprogramowanie zgłasza brak licencji, a nie brak portu
      - Poza serwerem terminali z oprogramowaniem dziedzinowym zmiana jest całkowicie niewidoczna
      - Sesje już nawiązane zachowują przekierowanie do końca
    en:
      - An application in the session will stop seeing a scale, a reader of codes or a terminal of payment plugged in at a person's end
      - Software with a key of licence plugged in serially will stop starting
      - A misleading turn where the software reports a lack of licence and not a lack of a port
      - Outside a terminal server with trade software the change is wholly unseen
      - Sessions already opened keep the redirection to their end
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie na serwerze terminali rozmawia z urządzeniem wpiętym szeregowo u człowieka na stanowisku
      - Licencja oprogramowania pracującego w sesji opiera się na kluczu wpiętym do portu szeregowego
    en:
      - Software on a terminal server speaks with a device plugged in serially at a person's station
      - The licence of software working in the session rests on a key plugged into a serial port
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableCcm'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableCcm'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableCcm' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Kategoria jest niska i jest to ocena uczciwa, nie ostrożna. Port
    szeregowy przenosi strumień znaków: nie uruchomi pliku, nie
    udostępni katalogu. Napastnik z sesją na serwerze zyskuje tą drogą
    dostęp do urządzenia wpiętego u siebie.

    Wartość punktu leży gdzie indziej: podsystem przekierowania jest
    kodem działającym w sesji, którego nikt nie potrzebuje i nikt nie
    sprawdza.

    Konsola szeregowa serwera idzie przez kartę zarządzającą, a nie
    przez przekierowanie w sesji — to ustawienie jej nie dotyczy.
  en: |
    The category is low and it is an honest reckoning, not a cautious one. A serial port carries a
    stream of characters: it will not run a file nor give over a folder. An attacker with a session
    on the server wins by that road a hold of a device plugged in at their own end.

    The item's worth lies elsewhere: the subsystem of redirection is code running in the session
    which nobody needs and nobody examines.

    A server's serial console goes through the management card and not through redirection within a
    session - this setting does not bear on it.
