id: iis-ftp-anonymous-authentication-disabled

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: FTP Requests
  title:
    pl: Usługa plików nie wpuszcza bez podania konta
    en: The file service admits nobody without an account

  level: 1
  profile: application

platform:
  system: iis

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Logowanie anonimowe pozwala pobrać zawartość serwisu plików bez żadnego
    konta — wystarczy podać umowną nazwę, a hasła nikt nie sprawdza. Usługa
    wykonuje wtedy operacje na jednym wspólnym koncie systemowym, tym samym dla
    wszystkich przychodzących.

    Co to odbiera atakującemu: dostęp do zawartości bez zdobywania czegokolwiek.
    Nie ma hasła do zgadnięcia ani konta do przejęcia — jest wejście otwarte.
    Jeśli serwis pozwala także zapisywać, otwarte jest również miejsce na
    umieszczenie pliku: katalog na cudzym serwerze, z którego można podać dalej
    złośliwą zawartość, firmowym adresem i z firmowym certyfikatem.

    Drugi skutek jest cichszy i przez to gorszy: wpisy w dzienniku przestają
    wskazywać osoby. Wszystkie operacje anonimowe są w nim nie do rozróżnienia,
    więc po incydencie nie da się ustalić, kto co pobrał ani kto co wgrał.

    Po zmianie każde połączenie ma nazwę, którą da się odebrać, i ślad, który da
    się do kogoś przypisać.
  en: |
    Anonymous sign-in allows the contents of a file site to be fetched with no
    account at all - a conventional name is enough, and no password is checked. The
    service then acts under one shared system account, the same for everybody coming
    in.

    What it takes away from an attacker - access to the contents without obtaining
    anything. There is no password to guess and no account to take over; there is an
    open door. If the site also allows writing, then a place to put a file is open
    too - a directory on somebody else's server from which malicious content can be
    handed on, under a company address and with a company certificate.

    The second consequence is quieter and worse for it - the log entries stop
    pointing at people. Every anonymous operation in it is indistinguishable, so
    after an incident there is no establishing who fetched what or who uploaded
    what.

    After the change every connection has a name that can be taken away, and leaves
    a trace that can be attributed to somebody.

disruption_description:
  pl: |
    To jest odcięcie dostępu, nie utrudnienie go, więc wymaga świadomego
    wdrożenia. Wszyscy, którzy dziś pobierają pliki bez logowania, przestaną
    móc to zrobić w chwili zapisania zmiany.

    Kto to zwykle jest: skrypty i urządzenia pobierające pliki aktualizacji
    albo konfiguracji, w których nikt nigdy nie wpisał poświadczeń, bo nie było
    takiej potrzeby; instalatory i obrazy systemów sięgające po zasoby po
    starym adresie; partnerzy zewnętrzni, którym kiedyś podano sam adres
    katalogu. Żadna z tych grup nie jest nigdzie zapisana — wychodzą na jaw
    dopiero po zmianie.

    Jest jeden przypadek, w którym wejście anonimowe jest wyborem, a nie
    zaniedbaniem: publiczne repozytorium plików do pobrania, świadomie otwarte
    dla wszystkich. Tam ta zasada nie ma zastosowania i ważniejsze jest, żeby
    taki serwis nie pozwalał zapisywać i nie stał na tej samej maszynie, co
    zawartość wewnętrzna.

    Przed zmianą trzeba przejrzeć dziennik usługi za okres obejmujący także
    zadania miesięczne. Adresy, z których przychodzą logowania anonimowe, to
    jedyna lista klientów, jaka istnieje.
  en: |
    This is a cutting off of access, not a hindrance to it, so it calls for a
    planned rollout. Everybody fetching files today without signing in stops being
    able to at the moment the change is written.

    Who that usually is - scripts and devices fetching update or configuration
    files, into which nobody ever typed credentials because there was no need;
    installers and system images reaching for resources at an old address; outside
    partners who were once given the directory address alone. None of those groups
    is written down anywhere - they come to light only after the change.

    There is one case in which anonymous entry is a choice rather than a neglect - a
    public repository of files to download, deliberately open to everybody. There
    this principle does not apply, and what matters more is that such a site should
    not allow writing and should not stand on the same machine as internal content.

    Before the change the service log should be reviewed over a period that covers
    monthly jobs as well. The addresses anonymous sign-ins come from are the only
    list of clients in existence.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Skrypty i urządzenia pobierające pliki bez poświadczeń przestają je pobierać
      - Instalatory i obrazy systemów sięgające po zasoby po starym adresie przestają działać
      - Partnerzy zewnętrzni, którym podano sam adres katalogu, tracą dostęp bez uprzedzenia
      - Publiczne repozytorium plików do pobrania przestaje być publiczne, jeśli zmianę zastosować na nim bez zastanowienia
      - Zadania uruchamiane raz na miesiąc ujawnią problem dopiero przy następnym przebiegu
    en:
      - Scripts and devices fetching files without credentials stop fetching them
      - Installers and system images reaching for resources at an old address stop working
      - Outside partners given the directory address alone lose access without warning
      - A public repository of files to download stops being public, where the change is applied to it without thought
      - Jobs run once a month reveal the problem only at their next pass
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Publiczne repozytoria plików do pobrania, otwarte świadomie i tylko do odczytu
      - Serwery obsługujące klientów, dla których nie da się ustalić poświadczeń, dopóki ci nie zostaną przeniesieni
    en:
      - Public repositories of files to download, open deliberately and read-only
      - Servers serving clients for whom credentials cannot be settled, until those have been moved across
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name FTPSVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $leaf = 'ftpServer/security/authentication/anonymousAuthentication'
          $open = @()
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter ('system.applicationHost/sites/siteDefaults/' + $leaf) -Name 'enabled' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($value -eq $true) { $open += 'siteDefaults' }
          # Each site is read separately as well. A site carrying a setting of
          # its own overrides the defaults there, and the defaults say nothing
          # about it.
          foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
            $siteFilter = "system.applicationHost/sites/site[@name='" + $site.Name + "']/" + $leaf
            $siteRaw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
              -Filter $siteFilter -Name 'enabled' -ErrorAction SilentlyContinue
            $siteValue = $siteRaw
            if ($null -ne $siteRaw -and $null -ne $siteRaw.Value) { $siteValue = $siteRaw.Value }
            if ($siteValue -eq $true) { $open += $site.Name }
          }
          if ($open.Count -eq 0) { 'AS_REQUIRED' }
          else { 'ANONYMOUS ' + ($open -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $stamp = 'sentin-ftp-anonymous-' + (Get-Date -Format 'yyyyMMddHHmmss')
    Backup-WebConfiguration -Name $stamp | Out-Null
    $leaf = 'ftpServer/security/authentication/anonymousAuthentication'
    $entries = @()
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter ('system.applicationHost/sites/siteDefaults/' + $leaf) -Name 'enabled' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    $entries += [pscustomobject]@{
      label  = 'siteDefaults'
      filter = 'system.applicationHost/sites/siteDefaults/' + $leaf
      state  = [string]$value
    }
    foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
      $siteFilter = "system.applicationHost/sites/site[@name='" + $site.Name + "']/" + $leaf
      $siteRaw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $siteFilter -Name 'enabled' -ErrorAction SilentlyContinue
      $siteValue = $siteRaw
      if ($null -ne $siteRaw -and $null -ne $siteRaw.Value) { $siteValue = $siteRaw.Value }
      $entries += [pscustomobject]@{
        label  = $site.Name
        filter = $siteFilter
        state  = [string]$siteValue
      }
    }
    [pscustomobject]@{
      entries = $entries
      backup  = $stamp
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and took a server configuration backup named $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $leaf = 'ftpServer/security/authentication/anonymousAuthentication'
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter ('system.applicationHost/sites/siteDefaults/' + $leaf) -Name 'enabled' -Value $false
    # A site carrying a setting of its own keeps it regardless of the defaults,
    # so each one is closed by name. Leaving this out would look like a fix and
    # change nothing where it matters.
    foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
      $siteFilter = "system.applicationHost/sites/site[@name='" + $site.Name + "']/" + $leaf
      $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $siteFilter -Name 'enabled' -ErrorAction SilentlyContinue
      $value = $raw
      if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
      if ($value -eq $true) {
        Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
          -Filter $siteFilter -Name 'enabled' -Value $false
      }
    }

  rollback_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.entries)) {
      $value = [string]$entry.state
      if ([string]::IsNullOrWhiteSpace($value)) { continue }
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $entry.filter -Name 'enabled' -Value ([bool]::Parse($value))
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/sites/sitedefaults/ftpserver/security/authentication/anonymousauthentication
  - https://learn.microsoft.com/iis/publish/using-the-ftp-service/configuring-ftp-user-isolation-in-iis-7

notes:
  pl: |
    Sprawdzenie ocenia ustawienia domyślne serwisów oraz każdy serwis osobno.
    Serwis z własnym ustawieniem nadpisuje domyślne u siebie, więc ocena samych
    wartości domyślnych potrafiłaby zgłosić spełnienie przy otwartym wejściu.
    Naprawa zamyka je tą samą drogą — najpierw domyślne, potem każdy serwis,
    który miał własne.

    Zgłaszane są nazwy serwisów z otwartym wejściem, bo bez nich wynik nie
    wskazuje, gdzie szukać.

    Lista klientów korzystających dziś z wejścia anonimowego nie istnieje
    nigdzie w konfiguracji. Jedynym jej przybliżeniem jest dziennik usługi za
    okres obejmujący zadania miesięczne — stąd klasa wymagająca świadomego
    wdrożenia mimo braku przerwy w działaniu usługi.

    Publiczne repozytorium plików do pobrania jest wyjątkiem, w którym wejście
    anonimowe jest wyborem. Taki serwis to kandydat na świadome odpuszczenie
    punktu wraz z uzasadnieniem, a nie na naprawę.
  en: |
    The check judges the site defaults and each site separately. A site with a
    setting of its own overrides the defaults there, so judging the defaults alone
    could report a pass with the door open. The fix closes it the same way - the
    defaults first, then every site that carried its own.

    The names of sites with the door open are reported, because without them the
    result does not say where to look.

    The list of clients using anonymous entry today exists nowhere in the
    configuration. Its only approximation is the service log over a period covering
    monthly jobs - hence the class calling for a planned rollout, despite no break
    in the service.

    A public repository of files to download is the exception in which anonymous
    entry is a choice. Such a site is a candidate for accepting the risk knowingly,
    with a reason recorded, rather than for a fix.
