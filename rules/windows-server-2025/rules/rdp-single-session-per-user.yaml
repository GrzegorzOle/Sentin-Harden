id: win2025-rdp-single-session-per-user

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Connections
  title:
    pl: Jedna sesja pulpitu zdalnego na użytkownika
    en: One Remote Desktop session per user
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
assessment_state: assessed-impact-described
disruption: needs-review

description:
  pl: |
    Ustawienie sprawia, że kolejne połączenie tego samego konta wraca
    do sesji już istniejącej, zamiast tworzyć obok niej następną.

    Wartość tego punktu widać dopiero wtedy, gdy się spojrzy, co zostaje
    po sesji porzuconej. Ktoś łączy się z domu, pracuje, zamyka okno
    bez wylogowania. Sesja zostaje odłączona, ale żywa: procesy działają,
    dokumenty są otwarte, a token dostępu ze wszystkimi uprawnieniami
    tej osoby leży w pamięci serwera.

    Bez tego ustawienia takich sesji przybywa. Połączenie z innej
    maszyny tworzy sesję nową, a stara zostaje. Po tygodniu jedna osoba
    ma ich kilka i żadna nie zostanie zamknięta, bo nikt o nich nie wie.

    Napastnikowi, który zdobył na serwerze uprawnienia administratora,
    porzucone sesje dają dwie rzeczy. Pierwszą jest materiał
    poświadczeniowy leżący w pamięci — im więcej sesji, tym więcej osób
    do zebrania za jednym razem. Drugą jest możliwość przejęcia sesji
    już zalogowanej, czyli pracy na cudzych uprawnieniach bez hasła.

    Punkt ten nie zamyka żadnej drogi wejścia i trzeba to powiedzieć.
    Ogranicza natomiast to, co napastnik zastanie po wejściu — a na
    serwerze terminali obsługującym kilkadziesiąt osób jest to różnica
    znaczna.

    Na serwerze ma to jeszcze jedno działanie, mniej oczywiste:
    porzucone sesje trzymają pamięć i miejsce, a ich sprzątanie jest
    zwykle czynnością, do której nikt nie wraca.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: więcej
    żywych sesji na maszynie, czyli więcej materiału poświadczeniowego
    w pamięci i więcej sesji do przejęcia.
  en: |
    The setting makes a further connecting by the same account come back to the session already
    there, instead of making another beside it.

    This item's worth is seen only when one looks at what is left after an abandoned session.
    Somebody connects from home, works, closes the window without signing off. The session is left
    disconnected but living: processes run, documents are open, and a token of access with all
    that person's rights lies in the server's memory.

    Without this setting such sessions grow in number. A connecting from another machine makes a
    new session and the old one stays. After a week one person has several of them and none will
    be closed, nobody knowing of them.

    To an attacker who has won administrative rights on the server, abandoned sessions give two
    things. The first is credential matter lying in memory - the more sessions, the more people to
    gather at one go. The second is the means of taking over an already signed-in session, that is
    of working with another's rights with no password.

    This item shuts no road in and that must be said. It bounds, though, what the attacker will
    find after getting in - and on a terminal server serving dozens of people that is a difference
    of weight.

    On a server it has one further working, less plain: abandoned sessions hold memory and room,
    and their clearing is usually a task nobody comes back to.

    What an attacker gains while the item goes unmet: more living sessions on the machine, that is
    more credential matter in memory and more sessions to take over.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy ktokolwiek pracuje na tym serwerze
    w dwóch sesjach naraz, świadomie.

    Przypadki, w których tak jest, dają się wskazać i żaden z nich nie
    jest wymyślony.

    Pierwszy to konto wspólne — kilka osób zna jedno hasło i pracuje
    z różnych miejsc jednocześnie. Po zmianie zobaczą nawzajem swoje
    ekrany, bo wszystkie połączenia trafią do tej samej sesji. Jest to
    skutek zaskakujący i nieprzyjemny, a przy koncie wspólnym zdarza się
    częściej, niż ktokolwiek przyznaje.

    Drugi to praca w dwóch sesjach z założenia: jedna z narzędziem
    długo liczącym, druga do bieżących spraw. Na serwerze bywa to
    ustalonym tokiem pracy, zwłaszcza u administratorów i u analityków
    danych.

    Trzeci, najbardziej mylący, to praca z dwóch miejsc na przemian.
    Ktoś łączy się ze stanowiska, potem z domu — i dotąd zastawał sesję
    nową. Po zmianie zastanie tę samą, z otwartymi oknami i ze stanem
    sprzed kilku godzin. Dla części osób jest to zaleta, dla części
    zaskoczenie, ale zaskoczeniem jest zawsze.

    Objawu awarii tu nie ma. Nic nie przestaje działać — rzecz zaczyna
    działać inaczej, a to bywa trudniejsze do zgłoszenia niż awaria,
    bo nie wiadomo, czy to usterka, czy tak ma być.

    Skutek uboczny wart odnotowania jest dobry: porzucone sesje przestają
    się mnożyć, więc maszyna zwalnia pamięć, której dotąd nikt nie
    odzyskiwał.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    istniejące nie są łączone wstecz — punkt działa od następnego
    połączenia.

    Punkt czyta się razem z ograniczeniami czasu sesji. Ten mówi, ile
    sesji może być; tamte, jak długo sesja bezczynna albo odłączona ma
    żyć. Oba adresują ten sam problem z dwóch stron.
  en: |
    One thing needs checking: whether anyone works on this server in two sessions at once,
    knowingly.

    The cases where it is so can be named and none of them is made up.

    The first is a shared account - several people know one password and work from differing
    places at the same time. After the change they will see each other's screens, all the
    connectings going to the same session. It is a startling and unpleasant effect, and with a
    shared account it happens oftener than anyone owns to.

    The second is work in two sessions by design: one with a tool that reckons long, another for
    matters at hand. On a server that is at times the established way of working, above all with
    administrators and with analysts of data.

    The third, and the most misleading, is work from two places by turns. Somebody connects from
    their station, then from home - and until now found a new session. After the change they will
    find the same one, with windows open and with the state of some hours ago. For some people
    that is a boon and for some a surprise, but a surprise it always is.

    There is no symptom of a breakdown here. Nothing stops working - the thing begins working
    otherwise, and that is at times harder to report than a breakdown, it not being known whether
    it is a fault or meant to be so.

    A side effect worth noting is good: abandoned sessions stop breeding, so the machine frees
    memory that until now nobody won back.

    The change comes into force straight away and is undone at once. Sessions already there are
    not joined backwards - the item works from the next connecting on.

    The item is read together with the bounds on a session's time. This one says how many sessions
    there may be; those, how long an idle or disconnected session is to live. Both take up the
    same trouble from two sides.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoby korzystające ze wspólnego konta z różnych miejsc zobaczą nawzajem swoje ekrany
      - Praca w dwóch sesjach naraz przestanie być możliwa dla tego samego konta
      - Łączący się z drugiego miejsca zastanie sesję sprzed kilku godzin zamiast nowej
      - Nic nie przestaje działać, rzecz zaczyna działać inaczej, więc zgłoszenie bywa trudne
      - Sesje już istniejące nie są łączone wstecz, punkt działa od następnego połączenia
    en:
      - People using a shared account from differing places will see each other's screens
      - Work in two sessions at once will stop being possible for the same account
      - The one connecting from a second place will find a session of some hours ago instead of a new one
      - Nothing stops working, the thing begins working otherwise, so reporting it is at times hard
      - Sessions already there are not joined backwards, the item works from the next connecting on
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z jednego konta korzysta kilka osób naraz i rozdzielenie kont nie jest w tej chwili możliwe
      - Praca w osobnych sesjach z kilku miejsc jednocześnie jest na tym serwerze ustalonym tokiem pracy
    en:
      - Several people use one account at once and the parting of the accounts is not possible for now
      - Work in separate sessions from several places at once is on this server the established way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fSingleSessionPerUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fSingleSessionPerUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fSingleSessionPerUser' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt nie zamyka żadnej drogi wejścia. Ogranicza to, co napastnik
    zastanie po wejściu: mniej żywych sesji to mniej materiału
    poświadczeniowego w pamięci i mniej sesji do przejęcia.

    Skutek najbardziej mylący dla ludzi to nie awaria, tylko zmiana
    zachowania — łączący się z drugiego miejsca zastanie sesję sprzed
    kilku godzin zamiast nowej.

    Przy koncie wspólnym skutek jest ostrzejszy: kilka osób zobaczy
    nawzajem swoje ekrany.

    Czytaj razem z ograniczeniami czasu sesji. Ten punkt mówi, ile sesji
    może być; tamte, jak długo sesja bezczynna albo odłączona ma żyć.
  en: |
    The item shuts no road in. It bounds what the attacker will find after getting in: fewer
    living sessions means less credential matter in memory and fewer sessions to take over.

    The effect most misleading to people is not a breakdown but a change of behaviour - the one
    connecting from a second place will find a session of some hours ago instead of a new one.

    With a shared account the effect is sterner: several people will see each other's screens.

    Read together with the bounds on a session's time. This item says how many sessions there may
    be; those, how long an idle or disconnected session is to live.
