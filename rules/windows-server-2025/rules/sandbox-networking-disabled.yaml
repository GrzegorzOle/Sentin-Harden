id: win2025-sandbox-networking-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Dostęp piaskownicy do sieci wyłączony
    en: The sandbox's access to the network switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera piaskownicy dostęp do sieci.

    Kategoria wysoka i zacznę od tego, czym piaskownica jest, bo od tego
    zależy cała ocena. To odizolowane środowisko uruchamiane po to, żeby
    otworzyć w nim coś, czemu się nie ufa. Innego powodu, dla którego ktoś
    ją włącza, w praktyce nie ma. Wszystko, co w niej pracuje, jest więc
    z założenia podejrzane — to nie jest dodatkowe zastrzeżenie, tylko opis
    jej zastosowania.

    Dostęp do sieci znosi połowę izolacji. Podejrzany program uruchomiony
    w piaskownicy nie jest odcięty: widzi sieć, w której stoi serwer, może
    się w niej rozglądać, sięgać do innych maszyn i wypuszczać na zewnątrz
    to, co zdoła zebrać. Z izolacji zostaje ochrona systemu plików gospodarza
    i to wszystko.

    Na serwerze rzecz waży bardziej niż na stanowisku, bo sieć widziana
    z serwera jest inna. Serwer stoi zwykle w segmencie, do którego
    stanowiska nie mają wstępu, i widzi rzeczy, których stanowisko nie
    widzi: kontrolery domeny, bazy danych, interfejsy zarządzania. Program
    uruchomiony w piaskownicy na serwerze ogląda sieć z tego właśnie
    miejsca.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: punkt
    wyjścia do sieci serwerowej, uruchomiony dobrowolnie przez
    administratora, który sądził, że właśnie coś odizolował.
  en: |
    The item takes the sandbox's access to the network away.

    The category is high, and I will start from what a sandbox is, because
    the whole assessment turns on it. It is an isolated environment started
    in order to open something in it that is not trusted. In practice there
    is no other reason anybody switches it on. Everything working inside it
    is therefore suspect by assumption - that is not an added caveat but a
    description of what it is for.

    Access to the network undoes half the isolation. A suspect program run in
    the sandbox is not cut off: it sees the network the server stands in, can
    look around in it, reach other machines and send out whatever it manages
    to gather. What remains of the isolation is protection of the host's file
    system, and that is all.

    On a server this weighs more than on a workstation, because the network
    seen from a server is a different one. A server usually stands in a
    segment workstations have no entry to, and sees things a workstation does
    not: domain controllers, databases, management interfaces. A program run
    in a sandbox on a server looks at the network from exactly that place.

    What an attacker gains while the item goes unmet: a point of departure
    into the server network, started willingly by an administrator who
    believed they had just isolated something.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i chcę być uczciwy co do tego, czego to
    sprawdzenie dotyczy, bo na większości serwerów piaskownicy po prostu
    nie ma — to funkcja opcjonalna, instalowana osobno.

    Gdzie jest zainstalowana, zmiana jest odczuwalna. Piaskownica bez sieci
    nie pobierze programu, który miała otworzyć, ani nie sprawdzi niczego,
    co wymaga połączenia. Pozostaje jej to, co da się do niej wnieść innym
    sposobem, a przy wyłączonym wspólnym schowku i braku współdzielenia
    katalogów zostaje niewiele. Trzeba wiedzieć, że te punkty sumują się
    w skutku, nawet jeśli w sprawozdaniu stoją osobno.

    Warto powiedzieć, kiedy ta reguła jest błędem. Jeżeli ktoś używa
    piaskownicy właśnie do oglądania podejrzanych stron albo do sprawdzania
    zachowania programu w sieci, odebranie jej sieci odbiera sens całej
    czynności. Wtedy właściwą odpowiedzią jest przeniesienie tej pracy na
    maszynę stojącą w wydzielonym segmencie, a nie na serwer produkcyjny —
    i to jest rozmowa, którą ten punkt ma wywołać.

    Czego to nie psuje: sieci gospodarza, żadnej usługi, żadnej roli.
    Wszystkie sześć punktów o piaskownicy leży pod jedną ścieżką rejestru,
    pod różnymi nazwami wartości.

    Zmiana obowiązuje od następnego uruchomienia piaskownicy. Bez przerwy,
    natychmiast odwracalne.
  en: |
    The class is "needs review", and I want to be honest about what the
    review concerns, because on most servers there is simply no sandbox - it
    is an optional feature, installed separately.

    Where it is installed, the change is felt. A sandbox without a network
    will not fetch the program it was meant to open, nor check anything
    needing a connection. What is left to it is whatever can be brought in by
    another route, and with the shared clipboard off and no shared
    directories, little remains. It has to be known that these items add up
    in their effect, even though in the report they stand separately.

    It is worth saying when this rule is a mistake. If somebody uses the
    sandbox precisely to look at suspect pages, or to watch how a program
    behaves on a network, taking the network away takes the point out of the
    whole exercise. Then the right answer is to move that work to a machine
    standing in a separated segment, not to a production server - and that is
    the conversation this item is meant to start.

    What this does not break: the host's network, any service, any role. All
    six sandbox items lie under one registry path, under different value
    names.

    The change holds from the next start of the sandbox. No outage, undone
    immediately.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - network-and-firewall
  what_breaks:
    pl:
      - Piaskownica nie pobierze programu, który miała otworzyć, ani nie sprawdzi niczego, co wymaga połączenia
      - Kto używa piaskownicy do oglądania podejrzanych stron albo badania zachowania programu w sieci, traci sens całej czynności
      - Właściwą odpowiedzią w takim przypadku jest wydzielony segment sieci, a nie piaskownica na serwerze produkcyjnym
      - Sieć gospodarza, usługi i role działają bez zmian, a zmiana obowiązuje od następnego uruchomienia piaskownicy
    en:
      - The sandbox will not fetch the program it was meant to open, nor check anything needing a connection
      - Anybody using the sandbox to look at suspect pages or watch a program's behaviour on a network loses the point of the exercise
      - The right answer in that case is a separated network segment, not a sandbox on a production server
      - The host's network, services and roles work unchanged, and the change holds from the next start of the sandbox
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica na tej maszynie służy do badania zachowania podejrzanych programów w sieci i nie ma dla niej wydzielonego stanowiska
    en:
      - The sandbox on this machine is used to study how suspect programs behave on a network and has no separated machine of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      $name = 'AllowNetworking'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $name = 'AllowNetworking'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A sandbox exists to open what is not trusted, so everything inside it is
    # suspect by assumption. Network access undoes half the isolation, and the
    # network seen from a server holds domain controllers, databases and
    # management interfaces. Holds from the next start of the sandbox.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowNetworking' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Piaskownica to środowisko uruchamiane po to, żeby otworzyć w nim coś,
    czemu się nie ufa. Innego powodu w praktyce nie ma, więc wszystko, co
    w niej pracuje, jest z założenia podejrzane.

    Dostęp do sieci znosi połowę izolacji: podejrzany program widzi sieć,
    w której stoi serwer, może się w niej rozglądać i wypuszczać na zewnątrz
    to, co zdoła zebrać. Zostaje ochrona systemu plików gospodarza i tyle.

    Sieć widziana z serwera jest inna niż ze stanowiska — kontrolery domeny,
    bazy danych, interfejsy zarządzania. To jest punkt wyjścia uruchomiony
    dobrowolnie przez administratora, który sądził, że coś odizolował.
  en: |
    A sandbox is an environment started in order to open something in it that
    is not trusted. In practice there is no other reason, so everything
    working inside it is suspect by assumption.

    Network access undoes half the isolation: a suspect program sees the
    network the server stands in, can look around in it and send out whatever
    it gathers. What remains is protection of the host's file system, and
    that is all.

    The network seen from a server differs from the one seen from a
    workstation - domain controllers, databases, management interfaces. This
    is a point of departure started willingly by an administrator who
    believed they had isolated something.
