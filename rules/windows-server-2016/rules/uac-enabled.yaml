id: win2016-uac-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kontrola uprawnień administracyjnych włączona
    en: Control of administrative rights switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza mechanizm, dzięki któremu członek grupy administratorów
    pracuje domyślnie z uprawnieniami zwykłymi, a pełne otrzymuje dopiero na
    żądanie.

    Kategoria krytyczna, bo ten jeden wpis rozstrzyga o tym, czym jest każda
    sesja administracyjna na tej maszynie. Przy mechanizmie wyłączonym
    program uruchomiony przez administratora — dowolny, również uruchomiony
    przez pomyłkę — dostaje pełne uprawnienia od razu i bez pytania. Nie ma
    momentu, w którym ktokolwiek mógłby powiedzieć „nie".

    Rzecz warto zobaczyć od strony następstw, a nie samego okienka.
    Wyłączenie tego mechanizmu znosi także te zabezpieczenia, które się na
    nim opierają: rozdzielenie procesów o różnych uprawnieniach, tryb
    chroniony w przeglądarce, izolację składników systemu. To nie jest
    wyłączenie jednego pytania, tylko podstawy, na której stoi reszta.

    Na serwerze 2016 ten punkt wymaga sprawdzenia mimo pozornej oczywistości.
    Maszyny tego rocznika bywały ustawiane w czasach, gdy wyłączenie tego
    mechanizmu uchodziło za zwykły krok po instalacji, a starsze aplikacje
    branżowe wprost tego wymagały.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: każdy kod
    uruchomiony na koncie administratora działa z pełnymi uprawnieniami od
    pierwszej instrukcji, bez konieczności podnoszenia ich i bez śladu
    w postaci pytania, które ktoś zobaczył.
  en: |
    The item switches on the mechanism by which a member of the administrators
    group works with ordinary rights by default and receives full ones only on
    request.

    The category is critical, because this single entry settles what every
    administrative session on this machine is. With the mechanism off, a program
    started by an administrator - any program, including one started by mistake
    - gets full rights at once and without asking. There is no moment at which
    anybody could say no.

    The matter is worth seeing through its consequences rather than through the
    dialog box. Switching this mechanism off also cancels the safeguards that
    rest on it: the separation of processes with different rights, protected
    mode in the browser, the isolation of system components. It is not the
    switching off of one question but of the foundation the rest stands on.

    On Server 2016 this item needs checking despite looking obvious. Machines of
    this vintage were sometimes set up at a time when switching this mechanism
    off passed for an ordinary step after installation, and older
    line-of-business applications demanded it outright.

    What an attacker gains while the item goes unmet: any code run under an
    administrator account works with full rights from its first instruction,
    with no need to elevate and no trace in the form of a question somebody saw.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedna z najpoważniejszych
    zmian w paczce, jeśli mechanizm jest obecnie wyłączony.

    Skutek dotyczy wszystkiego, co na tej maszynie działa z uprawnieniami
    administracyjnymi w sposób milczący. Aplikacje zapisujące dane do
    katalogów systemowych, narzędzia branżowe wymagające pełnych uprawnień
    od startu oraz skrypty uruchamiane bez podnoszenia uprawnień przestaną
    działać albo zaczną prosić o potwierdzenie, którego nikt nie kliknie,
    bo serwer pracuje bez obsługi.

    To ostatnie jest najważniejsze. Na stanowisku pytanie o zgodę zobaczy
    człowiek. Na serwerze zadanie harmonogramu uruchomione nocą zatrzyma się
    na pytaniu, którego nikt nie widzi, i zgłosi się jako zawieszone albo
    zakończone błędem.

    Sprawdzić trzeba więc dwie listy: aplikacje branżowe z czasów wdrożenia
    maszyny oraz zadania uruchamiane automatycznie. Zadania wymagające
    pełnych uprawnień należy przed zmianą ustawić tak, żeby podnosiły je
    jawnie, a nie liczyły na to, że dostaną je same.

    Czego to nie psuje: logowania, usług systemowych działających na kontach
    usługowych, pracy domeny ani udostępniania plików.

    Zmiana wymaga ponownego uruchomienia maszyny. Odwrócenie również.
  en: |
    The class is "needs planned rollout", and this is one of the weightiest
    changes in the pack if the mechanism is currently off.

    The effect reaches everything on this machine that runs with administrative
    rights silently. Applications writing to system directories, line-of-business
    tools needing full rights from startup, and scripts run without elevating
    will either stop working or start asking for a confirmation nobody will
    click, because the server runs unattended.

    That last is the most important. On a workstation a person sees the question
    about consent. On a server a scheduled task started at night stops at a
    question nobody sees, and reports itself as hung or ended in error.

    Two lists therefore need checking: line-of-business applications from the
    time the machine was deployed, and tasks that run automatically. Tasks that
    need full rights should be set before the change to elevate explicitly
    rather than count on being given them.

    What this does not break: signing in, system services running under service
    accounts, the domain's work, or file sharing.

    The change needs the machine restarted. So does undoing it.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - user-interface
    - updates-and-servicing
  what_breaks:
    pl:
      - Aplikacje działające dotąd z pełnymi uprawnieniami milcząco zaczynają prosić o potwierdzenie albo przestają działać
      - Zadania harmonogramu uruchamiane nocą zatrzymują się na pytaniu, którego nikt nie widzi
      - Starsze aplikacje branżowe zapisujące do katalogów systemowych mogą przestać kończyć pracę poprawnie
      - Usługi działające na kontach usługowych, logowanie i praca domeny działają bez zmian
    en:
      - Applications that until now ran with full rights silently start asking for confirmation or stop working
      - Scheduled tasks run at night stop at a question nobody sees
      - Older line-of-business applications writing to system directories may stop finishing cleanly
      - Services running under service accounts, signing in and the domain's work go on unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja branżowa wymagająca pełnych uprawnień od startu i nie ma dla niej zamiennika
      - Nie przejrzano zadań uruchamianych automatycznie pod kątem tego, czy podnoszą uprawnienia jawnie
    en:
      - A line-of-business application needing full rights from startup runs on the machine and there is no replacement for it
      - Tasks that run automatically have not been reviewed for whether they elevate explicitly
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableLUA'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableLUA'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the foundation the other rights-control items rest on, not one
    # dialog box. Review the automatic tasks first - on a server the question
    # about consent is asked where nobody is watching.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableLUA' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-run-all-administrators-in-admin-approval-mode

notes:
  pl: |
    To jest punkt nadrzędny wobec pozostałych reguł z tej grupy. Przy
    mechanizmie wyłączonym reszta ustawień kontroli uprawnień nie ma żadnego
    skutku, choć w rejestrze wygląda na ustawioną — i to jest dokładnie ten
    przypadek, w którym raport bywa mylący.

    Klucz mieści kilka wartości należących do różnych reguł tej grupy.
    Przy cofaniu usuwana jest wyłącznie ta jedna wartość, bo pozostałe
    należą do innych punktów.

    Zmiana działa dopiero po restarcie i nie ma tu drogi na skróty. Maszyna
    sprawdzona bez restartu pokaże wartość ustawioną przy zachowaniu
    niezmienionym.
  en: |
    This item stands above the other rules in this group. With the mechanism
    off, the remaining rights-control settings have no effect at all, although
    in the registry they look set - and that is exactly the case where a report
    misleads.

    The key holds several values belonging to different rules in this group.
    Undoing removes this one value alone, because the others belong to other
    items.

    The change takes effect only after a restart and there is no short cut here.
    A machine checked without a restart will show the value set while the
    behaviour is unchanged.
