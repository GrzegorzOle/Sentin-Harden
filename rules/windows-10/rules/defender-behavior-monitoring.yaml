id: win10-defender-behavior-monitoring

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection
  title:
    pl: Monitorowanie zachowania włączone
    en: Behaviour monitoring enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza obserwowanie tego, co programy robią, a nie tego,
    z czego się składają.

    Jest to jedyny mechanizm ochrony niezależny od znajomości próbki.
    Skanowanie pliku rozpoznaje to, co ktoś już widział; monitorowanie
    zachowania rozpoznaje czynność — masowe szyfrowanie plików, wstrzykiwanie
    kodu do cudzego procesu, kasowanie kopii woluminów, zapis do obszarów
    rozruchu. Czynności te wyglądają tak samo niezależnie od tego, w czym
    napisano program, który je wykonuje.

    Przesądza to o wartości reguły wobec oprogramowania przygotowanego
    pod jeden cel. Plik widziany po raz pierwszy nie ma sygnatury
    i przechodzi przez skanowanie bez zatrzymania. Zachowania nie da się
    jednak zmienić bez rezygnacji z celu: program szyfrujący pliki musi
    je szyfrować.

    Odnotowuję, że mechanizm działa dopiero w chwili uruchomienia, a nie
    przy zapisie pliku. Zatrzymanie następuje więc po pierwszych
    czynnościach, nie przed nimi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: swobodę
    w narzędziu przygotowanym specjalnie, którego żadna sygnatura nie opisuje.
  en: |
    The setting switches on the watching of what programs do, and not of what they are made.

    It is the one mechanism of protection standing free of the knowledge of a sample. The scanning of a file
    knows again what somebody has already seen; behaviour monitoring knows an act - the enciphering of files in
    bulk, the shooting of code into somebody else's process, the striking out of volume copies, a writing to the
    areas of starting up. Those acts look the same whatever the program that does them was written in.

    That settles the rule's worth against software made ready for one end. A file seen for the first time has no
    signature and goes through the scan unstopped. Behaviour nonetheless cannot be changed without giving the end
    up: a program that enciphers files has to encipher them.

    I set down that the mechanism works only at the hour of starting and not at the writing of a file. The
    holding back comes therefore after the first acts and not before them.

    What an attacker gains while the item goes unmet: a free hand with a tool made ready on purpose, which no
    signature describes.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm obserwuje czynności już wykonywane i nie dokłada czasu przy
    otwieraniu plików. Kosztu wymiernego w codziennej pracy nie ma.

    Odnotowuję jedyne miejsce, w którym bywa widoczny: programy
    instalacyjne i narzędzia do przywracania systemu wykonują czynności
    wyglądające tak samo jak czynności złośliwe — masowy zapis, zmiany
    w obszarze rozruchu, zatrzymywanie usług. Zdarza się, że zostają
    zatrzymane.

    Nie jest to jednak sytuacja częsta ani nieodwracalna. Zatrzymany
    program wraca do pracy po wskazaniu go jako dozwolonego, a zdarzenie
    zostaje opisane w dzienniku ochrony wraz z powodem.

    Czego to nie psuje: uruchamiania programów, otwierania dokumentów,
    wydajności, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The mechanism watches acts already being carried out and adds no time at the opening of files. There is no
    measurable cost in daily work.

    I set down the one place at which it shows at times: installing programs and tools for the restoring of a
    system carry out acts looking the same as malicious ones - a writing in bulk, changes in the area of
    starting up, the stopping of services. It happens that they are held back.

    It is nonetheless neither a common nor an unrecallable case. A held-back program returns to work once it is
    named as allowed, and the happening is set down in the protection's log together with its ground.

    What this does not break: the starting of programs, the opening of documents, the speed of work, logging on,
    file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Programy instalacyjne i narzędzia do przywracania systemu bywają zatrzymywane jako fałszywe trafienie
      - Zatrzymany program wraca do pracy po wskazaniu go jako dozwolonego, a zdarzenie opisuje dziennik ochrony
      - Mechanizm obserwuje czynności już wykonywane i nie dokłada czasu przy otwieraniu plików
      - Zatrzymanie następuje po pierwszych czynnościach, a nie przed nimi, bo mechanizm działa od uruchomienia
      - Uruchamianie programów, wydajność, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Installing programs and tools for the restoring of a system are at times held back as a false hit
      - A held-back program returns to work once it is named as allowed, and the protection s log sets the happening down
      - The mechanism watches acts already being carried out and adds no time at the opening of files
      - The holding back comes after the first acts and not before them, the mechanism working from the starting
      - The starting of programs, the speed of work, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Monitorowanie wyłączono świadomie z powodu fałszywego trafienia, którego nie rozstrzygnięto
    en:
      - Monitoring was switched off deliberately because of a false hit that has not been resolved
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableBehaviorMonitoring) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableBehaviorMonitoring'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is a negative one, so the compliant value is a nought: monitoring
    # is not switched off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableBehaviorMonitoring' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest w tym bloku tą o najlepszym stosunku zysku do kosztu.
    Kosztu wymiernego nie ma, a zysk dotyczy dokładnie tej kategorii
    zagrożeń, wobec której skanowanie sygnaturowe jest bezradne.

    Argument wart zachowania dotyczy tego, czego nie da się ukryć.
    Napastnik może zmienić plik tak, żeby nie pasował do żadnej sygnatury —
    jest to czynność tania i powtarzalna. Nie może natomiast zmienić tego,
    co program musi zrobić, żeby osiągnąć swój cel. Monitorowanie zachowania
    patrzy właśnie na to.

    Odnotowuję granicę mechanizmu, bo opis pomijający ją obiecuje za dużo.
    Zatrzymanie następuje po pierwszych czynnościach, więc część szkody
    bywa już wyrządzona. Mechanizm skraca zdarzenie, nie zapobiega mu.
  en: |
    The rule is in this block the one with the best standing of gain against cost. There is no measurable cost,
    and the gain touches just that kind of threat against which signature scanning is helpless.

    The argument worth keeping touches what cannot be hidden. An attacker may change a file so that it matches no
    signature - that is a cheap act and one easily repeated. They cannot nonetheless change what a program has to
    do to reach its end. Behaviour monitoring looks at just that.

    I set down the mechanism's bound, a description passing it over promising too much. The holding back comes
    after the first acts, so a part of the harm is at times already done. The mechanism shortens a happening; it
    does not forestall it.
