  en: |
    The thing common to the four rules of that platform, set down here once - the platform of the net
    of equals came about for the working together of workstations with no server in the midst. A
    server is in it by its very design needless - that is the whole thought of that platform.

    The middling category bears upon this one service of the four alone - it is a second, side-by-side
    road of the turning of a name into a whereabouts, wherein the answer comes off machines and not
    off a server of names.

    The difference from the finding of devices in the near net - that one asks and hearkens within the
