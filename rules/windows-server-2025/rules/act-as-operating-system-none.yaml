id: win2025-act-as-operating-system-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Działanie jako część systemu operacyjnego nieprzyznane nikomu
    en: Act as part of the operating system granted to nobody
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo to jest najmocniejszym, jakie system potrafi nadać, i jego
    nazwa nie jest przesadą. Proces, który je ma, może utworzyć token
    dostępu przedstawiający dowolną tożsamość — także taką, która
    w systemie nie istnieje, i taką, której uprawnień nikt nigdy nikomu
    nie nadał.

    Skutek jest jakościowo inny niż przy uprawnieniach administratora.
    Administrator może wiele, ale działa jako ktoś: jego czynności mają
    autora i zostają zapisane pod jego nazwą. Proces z tym prawem może
    działać jako ktokolwiek, więc zapis przestaje mówić prawdę o tym, kto
    coś zrobił. Nie jest to obejście kontroli dostępu — jest to obejście
    samego pojęcia tożsamości w systemie.

    Na serwerze konsekwencja rozciąga się poza maszynę. Serwer pracujący
    w domenie przechowuje poświadczenia pozwalające sięgnąć dalej,
    a kontroler domeny przechowuje je dla wszystkich. Prawo to na takiej
    maszynie jest równoważne przejęciu całego środowiska.

    Nie jest ono potrzebne niczemu, co działa dzisiaj. Jądro systemu go
    nie używa — ma dostęp z innego tytułu. Usługi systemowe go nie
    potrzebują. Wpis w tym wykazie jest więc albo pozostałością po
    oprogramowaniu sprzed dwóch dekad, albo śladem po kimś, kto był tu
    przed nami.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zdolność
    przedstawiania się dowolną tożsamością bez znajomości jakiegokolwiek
    hasła, a przy okazji utratę wiarygodności zapisu, który miałby to
    wykryć.
  en: |
    This right is the strongest the system can grant, and its name is no overstatement. A
    process holding it can make a token of access presenting any identity whatever - including
    one that does not exist in the system, and one whose rights nobody ever granted to anyone.

    The effect differs in kind from administrative rights. An administrator can do much but
    acts as somebody: their doings have an author and are recorded under their name. A process
    with this right can act as anybody, so the record stops telling the truth about who did
    what. It is no getting round access control - it is a getting round of the very notion of
    identity in the system.

    On a server the consequence stretches past the machine. A server working in a domain holds
    credentials allowing a reach further, and a domain controller holds them for everyone.
    This right on such a machine is the equal of a whole environment being taken over.

    It is needed by nothing that works today. The system's kernel does not use it - it has
    access on another title. System services do not take it. An entry in this list is thus
    either a leaving of software from two decades back or a trace of somebody who was here
    before us.

    What an attacker gains while the item goes unmet: the power of presenting any identity
    whatever with no knowledge of any password, and along with it the loss of trustworthiness
    of the record that would have caught it.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Powód jest prosty: w stanie domyślnym wykaz jest pusty. Zmiana nie ma
    wtedy czego usunąć i nie zmienia niczego.

    Jeżeli wykaz pusty nie jest, jest to ustalenie samo w sobie — i warto
    zatrzymać się nad nim przed zastosowaniem naprawy. Wpis oznacza jedno
    z dwóch: albo pracuje tu oprogramowanie sprzed dwóch dekad, które
    zostanie tą zmianą zatrzymane, albo ktoś to prawo nadał celowo,
    a wtedy pytanie brzmi kto i po co.

    Oprogramowanie, które faktycznie tego prawa używa, przestanie działać
    natychmiast i zwykle w sposób gwałtowny — z błędem uprawnień przy
    starcie usługi. Nie jest to objaw subtelny.

    Prawo to jest jednak na tyle nieproporcjonalne, że nawet potwierdzona
    zależność nie jest argumentem za pozostawieniem go. Jest argumentem
    za wymianą tego oprogramowania, a do tego czasu — za odizolowaniem go
    na maszynie, która niczego więcej nie robi.
  en: |
    The change has no known side effects and takes no break.

    The reason is simple: in the default state the list is empty. The change then has nothing
    to remove and changes nothing.

    Where the list is not empty, that is a finding in itself - and worth pausing over before
    the mending is applied. An entry means one of two things: either software from two decades
    back works here and will be halted by this change, or somebody granted the right on
    purpose, and then the question is who and what for.

    Software that in fact uses this right will stop working at once and usually abruptly -
    with a rights error at the service's start. It is no subtle symptom.

    The right is so out of proportion, though, that even a confirmed dependence is no argument
    for leaving it. It is an argument for replacing that software, and until then - for
    setting it apart on a machine that does nothing else.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - logging-and-audit
  what_breaks:
    pl:
      - W stanie domyślnym wykaz jest pusty i zmiana nie ma czego usunąć
      - Oprogramowanie faktycznie używające tego prawa zatrzyma się przy starcie usługi
      - Objaw jest gwałtowny i jednoznaczny — błąd uprawnień, a nie ciche pogorszenie
      - Niepusty wykaz jest ustaleniem samym w sobie i wymaga wyjaśnienia przed naprawą
    en:
      - In the default state the list is empty and the change has nothing to remove
      - Software in fact using this right will halt at the service's start
      - The symptom is abrupt and unmistakable - a rights error rather than a quiet worsening
      - A list that is not empty is a finding in itself and takes explaining before the mending
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Potwierdzono, że prawa używa oprogramowanie krytyczne, a wymiany nie da się przeprowadzić natychmiast
    en:
      - It is confirmed that critical software uses the right and a replacement cannot be carried out at once
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTcbPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTcbPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTcbPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTcbPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTcbPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/act-as-part-of-the-operating-system

notes:
  pl: |
    Sprawdzenie przyjmuje dwa stany zgodne: wykaz pusty i brak wpisu
    w eksporcie. Oznaczają to samo — prawa nie ma nikt — a różnią się
    wyłącznie sposobem zapisania tego w pliku zasad.

    Wykaz jest porządkowany przed porównaniem, żeby kolejność nie
    decydowała o wyniku. Konta wskazywane są identyfikatorami, a nie
    nazwami, bo nazwy kont wbudowanych są tłumaczone razem z systemem.

    Jest to jedno z nielicznych praw, przy których niepusty wykaz sam
    w sobie jest ustaleniem wartym zgłoszenia, niezależnie od tego,
    co w nim stoi.
  en: |
    The check accepts two compliant states: an empty list and no entry in the export. They
    mean the same thing - nobody has the right - and differ only in how that is recorded in
    the policy file.

    The list is put in order before the comparison, so that order does not settle the outcome.
    Accounts are pointed to by identifier rather than by name, since the names of built-in
    accounts are translated along with the system.

    It is one of the few rights at which a list that is not empty is a finding worth reporting
    in itself, whatever stands in it.
