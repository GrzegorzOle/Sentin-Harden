id: win11-installer-script-security-prompt-kept

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Ostrzeżenie przed instalatorem wywołanym ze skryptu zachowane
    en: The warning before an installer called from a script kept
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Instalator systemowy da się wywołać ze skryptu — również ze skryptu
    pochodzącego ze strony internetowej albo z dokumentu. Domyślnie takie
    wywołanie jest traktowane jako niebezpieczne i przeglądarka pyta
    użytkownika, zanim cokolwiek się wydarzy.

    Ustawienie, którego dotyczy ten punkt, pozwala to pytanie znieść. Wtedy
    skrypt wywołuje instalator bez żadnego okna, a użytkownik dowiaduje się
    o instalacji dopiero po fakcie — albo wcale.

    Znaczenie tego dla bezpieczeństwa jest wprost proporcjonalne do tego, co
    instalator potrafi. Pakiet instalacyjny wykonuje działania z podwyższonymi
    uprawnieniami, kopiuje pliki, zakłada usługi i zmienia wpisy w rejestrze.
    Skrypt na odwiedzonej stronie, który wywołuje go bez pytania, dostaje tę
    drogę w całości — i robi to składnikiem systemowym, podpisanym, na który
    narzędzia zabezpieczające patrzą łagodniej niż na obcy program.

    Punkt każe zapisać, że pytanie zostaje. Jest to przywrócenie stanu
    domyślnego, ale zapisane wprost, żeby nie zależało od tego, czy ktoś
    kiedyś ustawił inaczej.
  en: |
    The system installer can be called from a script - including one coming from a
    web page or a document. By default such a call is treated as dangerous and the
    browser asks the user before anything happens.

    The setting this item concerns allows that question to be done away with. Then
    the script calls the installer with no window at all, and the user learns of the
    installation only after the fact - or not at all.

    What that means for security is directly proportional to what the installer can
    do. An installation package carries out actions with raised privileges, copies
    files, sets up services and changes registry entries. A script on a visited page
    that calls it without asking gets that whole route - and does so through a system
    component, signed, at which security tools look more kindly than at a foreign
    program.

    The item says to write down that the question stays. It restores the default
    state, but written explicitly, so that it does not depend on whether somebody
    once set it otherwise.

disruption_description:
  pl: |
    Nic nie przestaje działać. Wpisywana wartość jest tą, która obowiązuje
    domyślnie — zmienia się wyłącznie to, że przestaje być domyślna.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego i żaden program nie zachowuje się po wdrożeniu inaczej.

    Odczuwalny jest wyłącznie tam, gdzie ktoś zniósł pytanie celowo — zwykle po
    to, żeby własna aplikacja internetowa mogła instalować składniki bez udziału
    użytkownika. Taka aplikacja przestanie działać w ten sposób i będzie
    wymagać potwierdzenia albo innego sposobu rozprowadzania.

    Jest to rozwiązanie spotykane w starszych systemach wewnętrznych,
    najczęściej razem z przeglądarką ustawioną w trybie zgodności. Warto zajrzeć,
    czy nie ma go w organizacji, zanim się wdroży.
  en: |
    Nothing stops working. The value written is the one that holds by default - all
    that changes is that it stops being a default.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no program behaving differently after the rollout.

    It is felt only where somebody did away with the question on purpose - usually so
    that an in-house web application could install components without the user's
    involvement. Such an application stops working that way and will need a
    confirmation or another means of distribution.

    It is an arrangement met in older internal systems, most often alongside a
    browser set to a compatibility mode. Worth looking into whether the organisation
    has one before applying.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - updates-and-servicing
  what_breaks:
    pl:
      - Nic nie przestaje działać; wpisywana wartość jest tą, która obowiązywała domyślnie
      - Wewnętrzna aplikacja internetowa instalująca składniki bez pytania zacznie wymagać potwierdzenia
    en:
      - Nothing stops working; the value written is the one that held by default
      - An internal web application installing components without asking will start requiring a confirmation
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wewnętrzna aplikacja internetowa rozprowadza składniki przez instalator wywoływany ze skryptu
    en:
      - An internal web application distributes components through an installer called from a script
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name describes doing away with the warning, so the required
      # value is zero - the warning kept.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'SafeForScripting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'SafeForScripting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SafeForScripting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-portal

notes:
  pl: |
    Wycofanie nie usuwa gałęzi, nawet jeśli reguła ją założyła. Gałąź instalatora
    jest wspólna z pozostałymi punktami benchmarku dotyczącymi instalacji —
    w tym z zakazem podnoszenia uprawnień przy instalacji — i jej usunięcie
    cofnęłoby także je.

    Nazwa wpisu opisuje zniesienie ostrzeżenia, więc wartością wymaganą jest
    zero. Jedynka to stan, którego punkt zabrania.

    Punkt jest częścią rodziny ustawień instalatora i warto czytać go razem
    z regułą o podnoszeniu uprawnień przy instalacji. Osobno każdy z nich
    zamyka inną drogę, razem odbierają instalatorowi rolę narzędzia do
    wykonywania cudzego kodu z pełnymi prawami.
  en: |
    Rollback does not remove the key, even if the rule created it. The installer's
    key is shared with the benchmark's remaining items about installation - including
    the ban on raising privileges during an install - and removing it would undo
    those as well.

    The entry's name describes doing away with the warning, so the required value is
    zero. A one is the state the item forbids.

    The item belongs to a family of installer settings and is worth reading together
    with the rule about raising privileges during an install. Apart, each closes a
    different route; together they take away the installer's role as a tool for
    running somebody else's code with full rights.
