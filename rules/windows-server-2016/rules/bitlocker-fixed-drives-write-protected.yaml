id: win2016-bitlocker-fixed-drives-write-protected

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Zapis na niezaszyfrowanych dyskach stałych zabroniony
    en: Writing to unencrypted fixed drives forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zapisywania na dyskach stałych, które nie są
    zaszyfrowane, pozostawiając je do odczytu.

    Wszystkie pozostałe reguły tego bloku opisują, jak ma wyglądać
    szyfrowanie, gdy ktoś je włączy. Ta jedna sprawia, że włączenie
    przestaje być dobrowolne.

    Różnica jest zasadnicza. Zasada wymagająca szyfrowania, ale
    niesprawdzająca go przy zapisie, działa dopóty, dopóki ktoś o niej
    pamięta. Wolumin dołożony w pośpiechu, dysk podłączony na chwilę,
    przestrzeń utworzona przy rozbudowie macierzy — każde z tych miejsc
    przyjmie dane bez szyfrowania i nikt tego nie zauważy, dopóki nie stanie
    się coś złego.

    Zakaz zapisu zamyka tę drogę na poziomie systemu plików. Dysk
    niezaszyfrowany daje się czytać, ale nie daje się zapisywać, więc dane
    nie trafiają tam, gdzie nie powinny — niezależnie od tego, czy ktoś
    pamiętał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: woluminy
    z danymi, które uniknęły szyfrowania, bo nikt o nim nie pomyślał w chwili
    ich zakładania.
  en: |
    The setting forbids writing to fixed drives that are not encrypted, leaving them to be read.

    All the other rules of this block describe what encryption is to look like once somebody
    switches it on. This one makes the switching on cease to be voluntary.

    The difference is a cardinal one. A rule requiring encryption but not checking it at a write
    works as long as somebody remembers it. A volume added in haste, a drive plugged in for a
    moment, room made while an array was extended - each of those places will take data in without
    encryption and nobody will notice until something bad happens.

    A ban on writing shuts that road at the file system's level. An unencrypted drive can be read
    but cannot be written to, so data do not land where they should not - whoever did or did not
    remember.

    What an attacker gains while the item goes unmet: volumes with data that escaped encryption
    because nobody thought of it when they were set up.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana ta potrafi zatrzymać
    usługę bez żadnego ostrzeżenia.

    Skutek jest natychmiastowy i dotyczy każdego niezaszyfrowanego woluminu
    na maszynie. Baza danych zapisująca na takim woluminie przestanie
    zapisywać. Usługa odkładająca tam pliki tymczasowe przestanie działać.
    Oprogramowanie kopii zapasowych nie odłoży kopii. Wszystko to dzieje się
    od razu i objawia się błędem odmowy dostępu, a nie komunikatem
    o szyfrowaniu.

    Wdrożenie zaczyna się więc od wykazu. Trzeba wiedzieć, które woluminy na
    tej maszynie są zaszyfrowane, a które nie, i co na te drugie zapisuje.
    Wykaz robi się przed zmianą; po zmianie robi się go z komunikatów
    o błędach, a to jest droga droższa.

    Szczególnej uwagi wymagają miejsca, o których łatwo zapomnieć: wolumin
    z plikami maszyn wirtualnych, wolumin z dziennikami, przestrzeń
    tymczasowa aplikacji, dysk przeznaczony na kopie. Każde z nich potrafi
    być niezaszyfrowane właśnie dlatego, że uchodzi za robocze.

    Warto zauważyć, że reguła nie wymaga zaszyfrowania czegokolwiek.
    Wymaga tylko, żeby na tym, co niezaszyfrowane, przestało się zapisywać.
    Kolejność jest zatem następująca: najpierw zaszyfrować to, co ma nadal
    przyjmować dane, potem wprowadzić zakaz.

    Czego to nie psuje: odczytu z dysków niezaszyfrowanych, zapisu na dyskach
    zaszyfrowanych, pracy systemu, sieci.

    Nie wymaga restartu, ale usługi zapisujące na dotkniętych woluminach
    trzeba zwykle uruchomić ponownie.
  en: |
    The class is "needs a planned rollout", the change being able to stop a service with no
    warning at all.

    The consequence is immediate and touches every unencrypted volume on the machine. A database
    writing to such a volume will cease to write. A service laying temporary files there will
    cease to work. Backup software will not lay a copy down. All that happens at once and shows
    itself as an access-denied error rather than a message about encryption.

    The rollout therefore begins with a register. It has to be known which volumes on this machine
    are encrypted and which are not, and what writes to the latter. The register is made before the
    change; after the change it is made from error messages, and that is the dearer road.

    Particular attention is called for by places easily forgotten: the volume with virtual machine
    files, the volume with logs, an application's temporary room, a drive meant for copies. Each
    of them can be unencrypted precisely because it passes for a working one.

    Worth noticing that the rule requires nothing to be encrypted. It requires only that writing
    to what is unencrypted cease. The order is therefore this: first encrypt what is to go on
    taking data in, then bring in the ban.

    What this does not break: reading from unencrypted drives, writing to encrypted ones, the
    system's working, or the network.

    Calls for no restart, but services writing to the touched volumes have as a rule to be started
    anew.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Baza danych zapisująca na niezaszyfrowanym woluminie przestaje zapisywać od razu, z błędem odmowy dostępu
      - Usługa odkładająca pliki tymczasowe na takim woluminie przestaje działać, a przyczyna nie wygląda na związaną z szyfrowaniem
      - Oprogramowanie kopii zapasowych nie odłoży kopii na dysk przeznaczony na kopie, jeżeli nie jest on zaszyfrowany
      - Wolumin z plikami maszyn wirtualnych przestaje przyjmować zapis, a maszyny na nim stojące zatrzymują się
      - Odczyt z dysków niezaszyfrowanych i zapis na zaszyfrowanych pozostają bez zmian
    en:
      - A database writing to an unencrypted volume ceases to write at once, with an access-denied error
      - A service laying temporary files on such a volume ceases to work, and the cause does not look tied to encryption
      - Backup software will not lay a copy on a drive meant for copies if that drive is not encrypted
      - A volume with virtual machine files ceases to take writes, and the machines standing on it stop
      - Reading from unencrypted drives and writing to encrypted ones stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sporządzono wykazu woluminów tej maszyny wraz z informacją, który z nich jest zaszyfrowany
      - Na maszynie stoi wolumin z plikami maszyn wirtualnych albo z dziennikami, który nie jest zaszyfrowany i ma nadal przyjmować zapis
      - Nie ma okna na zaszyfrowanie woluminów, które mają dalej działać, a zakaz miałby wejść wcześniej
    en:
      - No register of this machine's volumes has been made along with which of them is encrypted
      - A volume with virtual machine files or with logs stands on the machine, is not encrypted and is to go on taking writes
      - There is no window for encrypting the volumes that are to go on working, and the ban would come in first
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
      $name = 'FDVDenyWriteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    $name = 'FDVDenyWriteAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVDenyWriteAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest w bloku najcięższy w skutkach i zarazem jedyny, który
    cokolwiek wymusza. Reszta reguł opisuje kształt szyfrowania; ta czyni je
    obowiązkowym w praktyce, a nie na papierze.

    Kolejność wdrożenia jest tu treścią, nie szczegółem, i aplikacja
    powinna ją narzucić. Zakaz zapisu wprowadzony przed zaszyfrowaniem
    woluminów zatrzymuje usługi; ten sam zakaz po zaszyfrowaniu nie robi
    nic widocznego. Różnica między tymi dwoma wdrożeniami polega wyłącznie
    na kolejności i jest to najlepszy w całym zestawie argument za tym,
    żeby podsumowanie skutków pokazywać przed wykonaniem.

    Inwentaryzacja z etapu audytu ma tu zastosowanie bezpośrednie. Lista
    woluminów wraz ze stanem szyfrowania każdego z nich odpowiada na całe
    pytanie tej reguły i warto ją pokazać obok, zamiast zostawiać
    użytkownika z ostrzeżeniem ogólnym.

    Odnotowuję, że wartość leży w tym punkcie w innej gałęzi rejestru niż
    pozostałe reguły tego bloku. Jest to właściwość samego ustawienia, nie
    pomyłka, i warto o tym wiedzieć przy porównywaniu z dokumentacją.
  en: |
    The item is the heaviest in consequences in this block and at the same time the only one that
    enforces anything. The rest of the rules describe the shape of encryption; this one makes it
    obligatory in practice rather than on paper.

    The order of rollout is here the substance, not a detail, and the application should impose
    it. A ban on writing brought in before the volumes are encrypted stops services; the same ban
    after they are encrypted does nothing that shows. The difference between those two rollouts
    lies solely in the order, and it is the best argument in the whole set for showing the summary
    of consequences before execution.

    The inventory from the audit stage has here a direct use. A list of volumes along with the
    state of encryption of each answers the whole of this rule's question and is worth showing
    beside it, rather than leaving the user with a general warning.

    Worth noting that the value lies at this item in a different branch of the registry than the
    other rules of this block. It is a property of the setting itself, not a mistake, and is worth
    knowing when comparing against the documentation.
