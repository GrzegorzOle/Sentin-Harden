id: ubuntu2404-dev-shm-separate-partition

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.1.2.2.1
  section: Initial Setup > Filesystem > Configure Filesystem Partitions > Configure /dev/shm
  title:
    pl: Katalog /dev/shm jest osobną partycją
    en: Ensure /dev/shm is a separate partition
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    /dev/shm to katalog pamięci współdzielonej POSIX: programy tworzą w nim
    pliki, przez które wymieniają dane bez zapisu na dysk. Korzystają z niego
    m.in. PostgreSQL, przeglądarki i biblioteki komunikacji między procesami.
    Podobnie jak /tmp jest otwarty do zapisu dla wszystkich, więc powinien być
    osobnym systemem plików z własnymi opcjami i własnym limitem rozmiaru.

    Na Ubuntu tak jest zawsze: systemd montuje /dev/shm jako tmpfs na samym
    początku startu, zanim uruchomi jakąkolwiek usługę. Punkt jest więc
    spełniony na każdej działającej instalacji, a reguła daje pozycji z tabeli
    CIS wynik zamiast luki.
  en: |
    /dev/shm is the POSIX shared memory directory: programs create files in it
    through which they exchange data without writing to disk. PostgreSQL,
    browsers and interprocess communication libraries use it, among others.
    Like /tmp it is open for writing to everybody, so it should be a separate
    file system with its own options and its own size limit.

    On Ubuntu it always is: systemd mounts /dev/shm as a tmpfs at the very
    beginning of startup, before it runs any service. The item is therefore
    met on every running installation, and the rule gives the CIS table entry
    a result instead of a gap.

disruption_description:
  pl: |
    Nic nie przestaje działać, bo nic nie trzeba zmieniać: /dev/shm jest
    osobnym systemem plików z samej konstrukcji systemu.
  en: |
    Nothing stops working, because nothing has to change: /dev/shm is a
    separate file system by the design of the system itself.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    t=/dev/shm
    if [ ! -r /proc/self/mountinfo ] || ! command -v findmnt >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if findmnt -kn --mountpoint "$t" >/dev/null 2>&1; then echo SEPARATE; else echo NOT_SEPARATE; fi
  expected: '^SEPARATE$'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://docs.kernel.org/filesystems/tmpfs.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.html

notes:
  pl: |
    Wynik niespełniony oznacza, że system nie został uruchomiony przez systemd
    albo ktoś odmontował /dev/shm ręcznie. W obu przypadkach potrzebna jest
    diagnoza, a nie zmiana konfiguracji, dlatego reguła nie ma naprawy.
    Rozmiar /dev/shm (domyślnie połowa RAM) i jego opcje ustawia się wpisem
    w /etc/fstab, co robią reguły 1.1.2.2.2-1.1.2.2.4.
  en: |
    A non-compliant result means that the system was not started by systemd or
    somebody unmounted /dev/shm by hand. Either case needs diagnosis rather
    than a configuration change, which is why the rule has no remediation.
    The size of /dev/shm (half of RAM by default) and its options are set by an
    entry in /etc/fstab, which is what rules 1.1.2.2.2-1.1.2.2.4 do.
