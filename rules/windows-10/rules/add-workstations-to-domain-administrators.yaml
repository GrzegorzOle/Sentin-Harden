id: win10-add-workstations-to-domain-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dodawanie stacji roboczych do domeny zastrzeżone dla administratorów
    en: The adding of workstations to the domain reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo dodawania stacji roboczych do domeny dla
    administratorów lokalnych.

    Konto maszyny w katalogu jest pełnoprawnym kontem: ma własne hasło,
    loguje się do katalogu i może odpytywać go o dane. Dodanie maszyny do
    domeny tworzy takie konto, a zakładający staje się jego właścicielem.

    Zagrożenie polega na tym, że konto maszyny bywa punktem wyjścia
    do dalszego rozpoznania. Napastnik, który może założyć własną maszynę
    w katalogu, dostaje tożsamość wyglądającą na uprawnioną, z hasłem
    przez siebie ustawionym, i może nią odpytywać katalog tak jak każdy
    inny komputer w organizacji.

    Odnotowuję, że na stanowisku roboczym prawo to ma znaczenie
    ograniczone, bo rozstrzyga o nim katalog, a nie zasada lokalna.
    Zapisanie wykazu jest tu utrwaleniem stanu na wypadek, gdyby maszyna
    kiedyś pełniła inną rolę.

    Sprawdzenie przyjmuje wykaz węższy niż wymagany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tożsamość
    maszynową założoną samodzielnie, przydatną do rozpoznania katalogu.
  en: |
    The setting reserves the right of adding workstations to the domain to the local administrators.

    A machine's account in a directory is an account in full: it has a password of its own, signs in to the
    directory and may ask it for data. The adding of a machine to a domain makes such an account, and whoever
    makes it becomes its owner.

    The danger rests in this, that a machine's account is at times the starting place for further looking about.
    An attacker who may set up a machine of their own in the directory gets a name that looks entitled, with a
    password of their own setting, and may with it ask the directory as any other computer in the body does.

    I set down that upon a working station the right bears a bounded weight, the directory settling it and not a
    local policy. The writing of the list is here a setting down of a state against the hour the machine should
    bear some other part.

    The check takes a list narrower than the one called for.

    What an attacker gains while the item goes unmet: a machine's name set up by themselves, of use for the
    looking over of the directory.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na stanowisku roboczym wykaz jest zwykle pusty albo zawiera samych
    administratorów, a samo dodawanie maszyn do domeny i tak odbywa się
    po stronie katalogu.

    Odnotowuję, że zasada lokalna nie ma tu wpływu na maszyny przyłączane
    przez administratorów domeny. Punkt dotyczy wyłącznie tego, kto może
    wykonać tę operację z tej maszyny.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: przyłączenia maszyny do domeny wykonywanego przez
    administratora, logowania domenowego, dostępu do zasobów sieciowych,
    pracy z plikami, drukowania.
  en: |
    The class is "no disruption".

    Upon a working station the list stands commonly empty or holds the administrators alone, and the adding of
    machines to a domain happens in any case upon the directory's side.

    I set down that a local policy bears here no weight upon machines joined by the administrators of the domain.
    The item touches solely who may carry that out from this machine.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the joining of a machine to a domain done by an administrator, the domain signing
    in, the way to resources upon the network, work with files, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Konto pomocnicze, któremu prawo nadano na potrzeby wdrożeń, straci możliwość przyłączania maszyn z tego stanowiska
      - Zasada lokalna nie wpływa na maszyny przyłączane przez administratorów domeny
      - Na stanowisku roboczym wykaz jest zwykle pusty, więc zmiana jest tam zapisem stanu
      - Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo
      - Logowanie domenowe, dostęp do zasobów sieciowych, praca z plikami i drukowanie pozostają bez zmian
    en:
      - A helping account granted the right for the needs of rollouts will lose the joining of machines from this station
      - A local policy bears no weight upon machines joined by the administrators of the domain
      - Upon a working station the list stands commonly empty, so there the change is a setting down of a state
      - The consequence shows at the next signing in of an account that loses the right
      - The domain signing in, the way to resources upon the network, work with files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna służy do wdrożeń i konto pomocnicze przyłącza z niej stacje robocze do domeny
    en:
      - The machine serves for rollouts and a helping account joins working stations to the domain from it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeMachineAccountPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeMachineAccountPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeMachineAccountPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/add-workstations-to-domain

notes:
  pl: |
    Reguła jest w tym bloku najsłabsza w skutkach na stanowisku roboczym
    i warto, żeby aplikacja powiedziała to wprost, zamiast podnosić jej
    wagę. Ocena średnia wynika z realnej wartości dla napastnika, a nie
    z tego, jak punkt wygląda w wykazie.

    Argument wart zachowania dotyczy tego, po co komu konto maszyny.
    Nie daje ono uprawnień nadzwyczajnych, ale daje tożsamość
    wyglądającą na należącą do organizacji — a to wystarcza do odpytania
    katalogu o strukturę, grupy i konta. Rozpoznanie jest pierwszym krokiem
    i tani sposób na jego utrudnienie ma sens.

    Odnotowuję, że zapisanie wykazu jest tu przede wszystkim utrwaleniem
    stanu. Maszyna, która dziś jest stanowiskiem roboczym, jutro bywa
    przenoszona do innej roli — a zasada zapisana przeżyje tę zmianę.
  en: |
    The rule is of this block the weakest in its effects upon a working station, and it is well that the
    application say so outright instead of raising its weight. The middling grading follows from its real worth to
    an attacker and not from how the item looks in a list.

    The argument worth keeping touches what anybody wants a machine's account for. It gives no rights out of the
    ordinary, but it gives a name that looks as if it belonged to the body - and that is enough for the asking of
    the directory about its build, its groups and its accounts. The looking over is the first step and a cheap way
    of making it harder has sense.

    I set down that the writing of the list is here above all a setting down of a state. A machine that today is a
    working station is tomorrow at times carried over to another part - and a policy written down will outlive
    that change.
