id: win10-web-management-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania serwerem sieciowym wyłączona
    en: The service of ordering the web server from afar switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę pozwalającą zarządzać serwerem sieciowym
    tej maszyny przez sieć, z narzędzia uruchomionego gdzie indziej.

    Jest to warstwa zarządzająca, nie sama usługa serwera. Wyłączenie jej
    nie zatrzymuje udostępniania stron — odbiera możliwość zmieniania
    konfiguracji serwera zdalnie.

    Zagrożenie pierwsze to zakres uprawnień. Kto zarządza serwerem
    sieciowym, ten ustala, co i z jakiego katalogu jest udostępniane oraz
    z jakimi uprawnieniami wykonywany jest kod aplikacji. Jest to dostęp
    równoważny wykonaniu kodu na maszynie.

    Zagrożenie drugie to własne konta. Usługa ta dopuszcza logowanie
    kontami, które istnieją wyłącznie w konfiguracji serwera i nie
    podlegają zasadom kont systemu ani domeny.

    Zagrożenie trzecie to nasłuch na osobnym porcie, prowadzony
    niezależnie od samego serwera i łatwo przeoczany przy przeglądzie.

    Odnotowuję, że na stanowisku roboczym usługa ta pojawia się wyłącznie
    razem z rolą serwera i zwykle nie jest uruchomiona.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zdalną
    zmianę konfiguracji serwera, kontem spoza systemu i domeny.
  en: |
    The setting switches off the service letting the web server of this machine be ordered over the network, from
    a tool set going elsewhere.

    It is a layer of ordering and not the server's service itself. Its switching off stops not the giving out of
    pages - it takes away the power of changing the server's setting from afar.

    The first danger is the reach of the rights. Whoever orders a web server settles what is given out and from
    what directory, and with what rights the code of an application is worked. It is a reach matching the working
    of code upon the machine.

    The second danger is reckonings of its own. That service allows a logging on with reckonings that are only in
    the server's setting and fall under the rules of neither the system's nor the domain's reckonings.

    The third danger is a listening upon a door apart, kept without regard to the server itself and easily passed
    over at a looking over.

    I set down that upon a station of work that service shows only together with the part of a server and is
    commonly not set going.

    What an attacker gains while the item goes unmet: the changing of the server's setting from afar, with a
    reckoning from beyond the system and the domain.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, kto i skąd
    zarządza serwerem na tej maszynie.

    Miejscem pierwszym jest zarządzanie z konsoli na innej maszynie. Po
    zmianie połączenie zostanie odrzucone, a zarządzanie trzeba będzie
    prowadzić przy maszynie albo pulpitem zdalnym.

    Miejscem drugim są dostawcy zewnętrzni utrzymujący aplikację
    i korzystający z własnego konta zdefiniowanego w serwerze. Po zmianie
    stracą dostęp, a to jest zysk punktu i zarazem sprawa do uzgodnienia
    z nimi przed wdrożeniem, nie po.

    Odnotowuję, że udostępnianie stron działa dalej. Punkt dotyczy
    wyłącznie zdalnej zmiany konfiguracji.

    Zastrzegam, że zdalne zarządzanie kontem systemowym przez pulpit
    zdalny pozostaje dostępne, więc nie jest to odcięcie maszyny.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: udostępniania stron, pracy aplikacji sieciowych,
    sieci, logowania, drukowania.
  en: |
    The class is "needs review", and the review touches who orders the server upon this machine and from where.

    The first place is the ordering from a board upon another machine. After the change the joining will be
    refused, and the ordering will have to be done at the machine or by the desk from afar.

    The second place is outward sellers upholding an application and using a reckoning of their own set in the
    server. After the change they will lose their reach, and that is the item's gain and withal a matter to be
    settled with them before the rollout and not after.

    I set down that the giving out of pages works on. The item touches solely the changing of the setting from
    afar.

    I set down that the ordering from afar with a reckoning of the system through the desk from afar stays to be
    had, so it is no cutting off of the machine.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the giving out of pages, the work of applications of the web, the network, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Zarządzanie serwerem z konsoli na innej maszynie zostanie odrzucone
      - Zarządzanie trzeba będzie prowadzić przy maszynie albo pulpitem zdalnym
      - Dostawcy zewnętrzni korzystający z konta zdefiniowanego w serwerze stracą dostęp
      - Uzgodnienie tego z dostawcą należy przeprowadzić przed wdrożeniem, a nie po
      - Udostępnianie stron, praca aplikacji sieciowych, sieć, logowanie i drukowanie pozostają bez zmian
    en:
      - The ordering of the server from a board upon another machine will be refused
      - The ordering will have to be done at the machine or by the desk from afar
      - Outward sellers using a reckoning set in the server will lose their reach
      - The settling of that with the seller is to be done before the rollout and not after
      - The giving out of pages, the work of applications of the web, the network, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwerem na tej maszynie zarządza się zdalnie z konsoli i nie ma do niej dostępu pulpitem zdalnym
      - Dostawca zewnętrzny utrzymuje aplikację przez konto zdefiniowane w serwerze
    en:
      - The server upon this machine is ordered from afar from a board and there is no reach of it by the desk from afar
      - An outward seller upholds an application through a reckoning set in the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'WMSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WMSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/manage/remote-administration/remote-administration-for-iis-manager

notes:
  pl: |
    Reguła bywa mylona z punktem o samej usłudze serwera i warto, żeby
    aplikacja rozdzieliła to jednym zdaniem. Tutaj strony są udostępniane
    dalej; znika zdalna zmiana konfiguracji.

    Argument wart postawienia dotyczy zakresu uprawnień. Kto zarządza
    serwerem, ustala, co i skąd jest udostępniane oraz z jakimi
    uprawnieniami wykonywany jest kod. Jest to dostęp równoważny
    wykonaniu kodu na maszynie.

    Odnotowuję własne konta serwera jako zastrzeżenie warte osobnego
    zdania. Nie podlegają zasadom kont systemu ani domeny, więc nie
    obejmuje ich ani polityka haseł, ani wykrywanie prób.
  en: |
    The rule is at times taken for the item about the server's service itself, and it is well that the application
    part them in one sentence. Here the pages are given out still; what goes is the changing of the setting from
    afar.

    The argument worth putting touches the reach of the rights. Whoever orders the server settles what is given
    out and whence, and with what rights the code is worked. It is a reach matching the working of code upon the
    machine.

    I set down the server's own reckonings as a reservation worth a sentence apart. They fall under the rules of
    neither the system's nor the domain's reckonings, so neither the policy of passwords nor the marking of tries
    takes them in.
