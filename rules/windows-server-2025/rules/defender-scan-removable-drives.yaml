id: win2025-defender-scan-removable-drives

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan
  title:
    pl: Skanowanie nośników wymiennych przy skanowaniu pełnym
    en: Removable drives scanned during a full scan
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza obejmowanie nośników wymiennych skanowaniem pełnym.
    Bez niego dysk podłączony przez port zewnętrzny jest przy tym
    skanowaniu pomijany, choć system ma do niego pełny dostęp.

    Obniżam kategorię do niskiej. Powód jest ten sam, który podałem przy
    regule blokującej niezaufane procesy z nośników wymiennych: wzorzec,
    którego to dotyczy, ma w środku człowieka stojącego przy maszynie,
    a w zamkniętej serwerowni tego ogniwa nie ma. Nośnik trafia do
    serwera rzadko i zawsze dlatego, że ktoś go tam świadomie włożył.

    Jest jednak układ, w którym punkt przestaje być formalnością,
    i warto go nazwać, bo jest częstszy, niż się wydaje. Nośnikiem
    wymiennym bywa zewnętrzny dysk kopii zapasowych podłączony na stałe.
    Nie jest to wtedy „coś, co ktoś włożył na chwilę", tylko
    pełnoprawna składnica danych, która przy takim ustawieniu nie jest
    przez skanowanie pełne oglądana nigdy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obszar
    dysku dostępny dla systemu, a pomijany przez skanowanie pełne.
  en: |
    The item switches on the taking in of removable bearers by the full searching. Without it a disk
    bound in by an outward port is passed over at that searching, though the system reaches it
    wholly.

    I lower the category to low. The ground is the same I gave at the rule blocking untrusted
    processes off removable bearers - the pattern it bears upon has in its midst a person standing
    at the machine, and in a shut room of servers that link is wanting. A bearer comes to a server
    seldom and always because somebody wittingly put it there.

    There is, though, a setting wherein the item stops being a formality, and it is worth naming,
    being commoner than it seems. A removable bearer is at times an outward disk of keepings of
    copies bound in for good. It is then no "something somebody put in for a moment" but a full
    storehouse of data, which at such a setting is by the full searching never looked at.

    What an attacker gains while the item goes unmet - a reach of disk open to the system and passed
    over by the full searching.

disruption_description:
  pl: |
    Na serwerze, do którego nic nie jest podłączone, zmiana nie robi
    nic: nie ma czego obejmować. Zostaje mimo to poza trybem zbiorczym
    i to właśnie przez ten jeden układ opisany wyżej.

    Zewnętrzny dysk kopii zapasowych podłączony na stałe zostanie przy
    najbliższym skanowaniu pełnym przeczytany w całości. Bywa to
    kilkanaście terabajtów. Skutkiem nie jest awaria, tylko skanowanie
    trwające wielokrotnie dłużej niż dotąd i zajmujące łącze dyskowe
    dokładnie w oknie, w którym zwykle robi się kopie. Dwa zadania
    czytające ten sam dysk naraz spowalniają się wzajemnie i oba
    kończą się później.

    Rzeczą do sprawdzenia jest więc jedno pytanie: czy do maszyny jest
    coś podłączone na stałe i co to jest. Jeżeli jest to składnica
    kopii, rozstrzygnij świadomie, co jest tańsze — wydłużone skanowanie
    czy wyłączenie dla tego wolumenu. Obie odpowiedzi bywają prawidłowe
    i zależą od tego, czy na tym dysku ląduje cokolwiek poza kopiami.

    Drugi przypadek jest drobny: nośnik serwisowy wetknięty na czas
    naprawy i zapomniany. Skanowanie pełne go obejmie i wydłuży się
    nieznacznie. Nie jest to powód do niczego poza uśmiechem.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    On a server with nothing bound in the change does nothing - there is nothing to take in. It
    stays outside the bulk mode for all that, and that by the one setting set forth above.

    An outward disk of keepings of copies bound in for good will at the nearest full searching be
    read whole. That is at times some tens of terabytes. The outcome is no fault but a searching
    lasting many times longer than hitherto and taking the disk's line just in the window wherein
    copies are commonly made. Two tasks reading the same disk at once slow each other, and both end
    later.

    The thing to check is therefore one question - is anything bound in to the machine for good and
    what is it. If it is a storehouse of copies, settle wittingly which is the cheaper - the
    lengthened searching or a leaving-out for that volume. Both answers are at times right and hang
    upon whether anything besides copies lands on that disk.

    The second case is a small one - a bearer for service stuck in for the time of a mending and
    forgotten. The full searching will take it in and will lengthen a little. It is no ground for
    anything but a smile.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - removable-media
    - updates-and-servicing
  what_breaks:
    pl:
      - Zewnętrzny dysk kopii zapasowych podłączony na stałe zostanie przy skanowaniu pełnym przeczytany w całości
      - Skanowanie zajmuje łącze dyskowe w tym samym oknie, w którym zwykle robi się kopie
      - Dwa zadania czytające ten sam dysk naraz spowalniają się wzajemnie i oba kończą się później
      - Na serwerze, do którego nic nie jest podłączone, zmiana nie robi zupełnie nic
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy
    en:
      - An outward disk of keepings of copies bound in for good will be read whole at the full searching
      - The searching takes the disk's line in the same window wherein copies are commonly made
      - Two tasks reading the same disk at once slow each other and both end later
      - On a server with nothing bound in the change does nothing at all
      - Where a guarding product of another maker rules, the audit reports the state does not apply
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do maszyny podłączona jest na stałe składnica kopii i nie rozstrzygnięto, co jest tańsze
    en:
      - A storehouse of copies is bound in to the machine for good and it was not settled which is the cheaper
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableRemovableDriveScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableRemovableDriveScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRemovableDriveScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Kategoria obniżona z tego samego powodu co przy niezaufanych
    procesach z nośników wymiennych: wzorzec ma w środku człowieka
    stojącego przy maszynie, a w zamkniętej serwerowni tego ogniwa
    nie ma.

    Układ, w którym punkt przestaje być formalnością: nośnikiem
    wymiennym bywa zewnętrzny dysk kopii zapasowych podłączony na
    stałe. Wtedy to pełnoprawna składnica danych, której skanowanie
    pełne nie ogląda nigdy.

    Ten sam układ jest jedynym powodem pozostawienia punktu poza
    trybem zbiorczym: kilkanaście terabajtów czytanych w oknie, w którym
    i tak robi się kopie.
  en: |
    The category is lowered of the same ground as at the untrusted processes off removable bearers -
    the pattern has in its midst a person standing at the machine, and in a shut room of servers
    that link is wanting.

    The setting wherein the item stops being a formality - a removable bearer is at times an outward
    disk of keepings of copies bound in for good. It is then a full storehouse of data the full
    searching never looks at.

    That same setting is the only ground for leaving the item outside the bulk mode - some tens of
    terabytes read in the window wherein copies are made anyway.
