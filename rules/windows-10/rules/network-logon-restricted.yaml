id: win10-network-logon-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dostęp z sieci ograniczony do administratorów i użytkowników pulpitu zdalnego
    en: The way in from the network bounded to administrators and users of the remote desktop
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo dostępu do tej maszyny z sieci do
    administratorów i grupy użytkowników pulpitu zdalnego.

    Prawo to jest bramą, przez którą przechodzi wszystko, co przychodzi
    z sieci i wymaga zalogowania: udziały plikowe, kolejki wydruku,
    zarządzanie zdalne, odpytywanie rejestru przez sieć i połączenia
    pulpitu zdalnego. Sprawdzane jest przed uprawnieniami do samego
    zasobu — konto bez tego prawa nie dojdzie nawet do miejsca, w którym
    jego uprawnienia do udziału zostałyby rozpatrzone.

    Wartość polega na odebraniu drogi ruchowi bocznemu. Napastnik, który
    przejął poświadczenia na jednej maszynie, próbuje ich na sąsiednich —
    i robi to przez sieć, właśnie przez tę bramę. Wykaz zawężony do dwóch
    grup sprawia, że przejęte konto zwykłego użytkownika nie otwiera
    drzwi nigdzie indziej.

    Odnotowuję, że sprawdzenie przyjmuje sam wykaz administratorów jako
    spełniający wymaganie, a także wykaz pusty. Maszyna odcięta od sieci
    szczelniej, niż wymaga punkt, nie jest niezgodna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wejścia na maszynę z sieci poświadczeniami dowolnego konta.
  en: |
    The setting bounds the right of coming to this machine from the network to the administrators and to the group
    of the users of the remote desktop.

    That right is the gate through which passes everything that comes from the network and calls for a signing in:
    file shares, queues of printing, ruling from afar, the asking of the register over the network and joinings of
    the remote desktop. It is checked before the rights to the resource itself - an account without this right
    will not come even to the place where its rights to a share would be weighed.

    The worth lies in the taking of a road from the sideways movement. An attacker who has taken credentials upon
    one machine tries them upon the neighbouring ones - and does so over the network, through just that gate. A
    list narrowed to two groups brings it about that a taken account of an ordinary user opens a door nowhere
    else.

    I set down that the check takes the list of the administrators alone as meeting the requirement, and an empty
    list too. A machine cut off from the network more tightly than the item calls for is not out of compliance.

    What an attacker gains while the item goes unmet: the coming onto the machine from the network with the
    credentials of any account at all.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to w tym bloku jedyny punkt
    tej klasy. Zmiana dotyka wszystkiego, co z tą maszyną rozmawia przez
    sieć.

    Miejscem najczęstszym są udziały plikowe. Konto, które dotąd sięgało
    po katalog na tej maszynie, po zmianie dostanie odmowę dostępu —
    i komunikat nie powie nic o brakującym prawie, tylko o odmowie na
    samym udziale. Dotyczy to także kont usługowych kopii zapasowych
    i systemów monitorujących.

    Miejscem drugim są kolejki wydruku udostępnione z tej maszyny.
    Drukarka przestanie odpowiadać kontom spoza wykazu.

    Miejscem trzecim jest zarządzanie zdalne. Konto narzędzia
    inwentaryzującego albo zarządzającego aktualizacjami przestanie
    odpytywać maszynę, a w jego raporcie maszyna zniknie zamiast zgłosić
    błąd.

    Wdrożenie wymaga wcześniejszego wypisania kont, które łączą się
    z maszyną przez sieć, i uzupełnienia wykazu o te, które mają zostać.
    Bez tego kroku zmiana jest odcięciem maszyny, a nie utwardzeniem.

    Skutek pojawia się przy następnym połączeniu. Sesje trwające nie są
    przerywane.

    Czego to nie psuje: pracy lokalnej, logowania przy maszynie,
    uruchamiania programów, dostępu do dysków lokalnych.
  en: |
    The class is "needs planned rollout", and it is of this block the one item of that class. The change touches
    everything that speaks with this machine over the network.

    The commonest place is file shares. An account that reached hitherto for a folder upon this machine will after
    the change get a refusal of access - and the message will say nothing of a right that is wanting, only of a
    refusal upon the share itself. That holds also of the service accounts of backing up and of systems that
    watch.

    The second place is the queues of printing shared from this machine. The printer will cease to answer accounts
    outside the list.

    The third place is ruling from afar. The account of a tool that takes stock or rules the servicing will cease
    to ask the machine, and in its report the machine will vanish rather than report a fault.

    The rollout calls for a writing out beforehand of the accounts that join themselves to the machine over the
    network, and for the filling out of the list with those that are to stay. Without that step the change is a
    cutting off of the machine and no hardening.

    The consequence shows at the next joining. Sessions at work are not broken off.

    What this does not break: work upon the machine itself, signing in at the machine, the running of programs, or
    the way to local disks.

implementation_consequences:
  impact_areas:
    - file-sharing
    - printing
    - remote-management
  what_breaks:
    pl:
      - Konta spoza wykazu stracą dostęp do udziałów plikowych na tej maszynie, także konta kopii zapasowych
      - Komunikat mówi o odmowie na samym udziale, a nie o brakującym prawie, więc diagnoza idzie w złą stronę
      - Kolejki wydruku udostępnione z tej maszyny przestaną odpowiadać kontom spoza wykazu
      - Narzędzia inwentaryzujące i zarządzające aktualizacjami przestaną odpytywać maszynę, a ona zniknie z ich raportów
      - Praca lokalna, logowanie przy maszynie, uruchamianie programów i dostęp do dysków lokalnych pozostają bez zmian
    en:
      - Accounts outside the list will lose the way to file shares upon this machine, the accounts of backing up among them
      - The message speaks of a refusal upon the share itself and not of a right that is wanting, so the looking into it goes the wrong way
      - Queues of printing shared from this machine will cease to answer accounts outside the list
      - Tools that take stock and rule the servicing will cease to ask the machine, and it will vanish from their reports
      - Work upon the machine itself, signing in at it, the running of programs and the way to local disks stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna udostępnia katalogi albo drukarki kontom spoza wykazu i nie ma kto uzupełnić tej listy
      - Konta usługowe kopii zapasowych i systemów monitorujących sięgają po tę maszynę przez sieć
    en:
      - The machine shares folders or printers to accounts outside the list and there is nobody to fill that list out
      - The service accounts of backing up and of systems that watch reach for this machine over the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeNetworkLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544,S-1-5-32-555|S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeNetworkLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeNetworkLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators and to the users of the remote
    # desktop. A list narrower than that meets the item too.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeNetworkLogonRight = *S-1-5-32-544,*S-1-5-32-555',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeNetworkLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/access-this-computer-from-the-network

notes:
  pl: |
    Reguła jest najmocniejszym pojedynczym punktem przeciw ruchowi
    bocznemu w całym zbiorze przywilejów i warto, żeby aplikacja
    postawiła ją wysoko w domyślnej kolejności. Zysk jest realny, koszt
    też — jest to dokładnie ten przypadek, dla którego opis skutków
    istnieje.

    Argument wart postawienia wprost dotyczy kolejności sprawdzeń. Prawo to
    jest badane przed uprawnieniami do zasobu, więc uporządkowanie
    uprawnień na udziałach niczego tu nie zastąpi. Konto bez prawa nie
    dochodzi do miejsca, w którym uprawnienia do udziału mają znaczenie.

    Odnotowuję powód, dla którego klasa jest najwyższa. Nie chodzi
    o restart ani o widoczną zmianę w pracy ludzi, tylko o to, że zakres
    zależy od tego, kto z tą maszyną rozmawia — a tego nie da się
    odczytać z samej zasady. Wykaz trzeba wypisać przed zmianą, na tej
    konkretnej maszynie.
  en: |
    The rule is the strongest single item against the sideways movement in the whole set of privileges, and it is
    well that the application set it high in the standing order. The gain is real and so is the cost - it is just
    that case for which the setting out of consequences exists.

    The argument worth putting outright touches the order of the checks. That right is weighed before the rights
    to the resource, so a tidying of rights upon shares will replace nothing here. An account without the right
    does not come to the place where rights to a share bear weight.

    I set down the ground upon which the class stands highest. What is at stake is neither a restart nor a change
    plain in people's work, but this, that the reach depends upon who speaks with this machine - and that cannot
    be read out of the policy itself. The list has to be written out before the change, upon that one machine.
