      - Maszyna jest hostem wirtualizacji i nie przeprowadzono próby na maszynie bliźniaczej
      - Sterowniki producenta sprzętu nie zostały sprawdzone pod kątem ostrzejszych wymagań odgrodzenia
      - Na serwerze działa system dziedziczony logujący się starszym mechanizmem uwierzytelniania
    en:
      - The machine is a host of virtualisation and no trial was run on a twin machine
      - The drivers of the maker of the gear were not looked over against the sharper bonds of the fencing off
      - An inherited system signing in by an older working of proving self works on the server
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $dg = Get-CimInstance -ClassName Win32_DeviceGuard `
        -Namespace 'root\Microsoft\Windows\DeviceGuard' -ErrorAction Stop
      if ($null -eq $dg) { 'CHECK_ERROR' }
      elseif ($dg.SecurityServicesRunning -contains 1) { 'RUNNING' }
      else { 'NOT_RUNNING' }
    } catch {
      'CHECK_ERROR'
    }
  expected: RUNNING
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $lsa = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $dg  = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    [pscustomobject]@{
      lsa_cfg_flags  = (Get-ItemProperty -Path $lsa -Name 'LsaCfgFlags' -ErrorAction SilentlyContinue).LsaCfgFlags
      vbs_enabled    = (Get-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -ErrorAction SilentlyContinue).EnableVirtualizationBasedSecurity
      dg_key_existed = (Test-Path -Path $dg)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a host of virtual machines try this on a twin machine first: it goes
    # straight athwart that role and a restart is needed either way.
    $dg = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $dg)) { New-Item -Path $dg -Force | Out-Null }
    Set-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord
    Set-ItemProperty -Path $dg -Name 'RequirePlatformSecurityFeatures' -Value 1 -Type DWord
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'LsaCfgFlags' -Value 1 -Type DWord

privileges: administrator
runnable: false

sources:
