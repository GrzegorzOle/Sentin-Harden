id: win2025-installer-vendor-signed-updates-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Nakładanie poprawek podpisanych przez producenta zastrzeżone dla administratorów
    en: Applying patches signed by the vendor reserved for administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zastrzega nakładanie poprawek do zainstalowanych programów dla
    kont z uprawnieniami. Bez niego poprawkę podpisaną przez producenta
    może nałożyć konto bez uprawnień, a nałożenie poprawki jest zapisem
    w miejscu, do którego takie konto samo zapisywać nie może.

    Słowo „podpisana przez producenta" brzmi jak zabezpieczenie i na tym
    polega cała trudność tego punktu. Podpis mówi wyłącznie, kto tę
    poprawkę wydał. Nie mówi, czy wolno ją nałożyć teraz, na tej maszynie
    i z tego konta — a właśnie to jest pytanie, na które ten punkt
    odpowiada.

    Zostawiam kategorię wysoką. Na serwerze droga jest ta sama, którą
    opisałem przy wpływie na przebieg instalacji: konto usługi, na którym
    napastnik stanął po wykorzystaniu błędu w aplikacji, szuka sposobu
    zapisania czegoś z prawami wyższymi niż własne. Stara poprawka
    producenta, prawidłowo podpisana i zawierająca znany błąd, jest
    takim sposobem — i nie przestaje nim być przez to, że podpis jest
    ważny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapis
    z prawami podniesionymi, dokonany prawidłowo podpisaną poprawką
    sprzed lat, z konta, które własnych praw do tego nie ma.
  en: |
    The item keeps the laying on of mendings to installed programs for accounts with rights. Without
    it a mending signed by a maker may be laid on by an account without rights, and the laying on of
    a mending is a writing in a stead such an account cannot write in of itself.

    The word "signed by the maker" sounds like a safekeeping, and therein lies the whole hardness of
    this item. A sign says only who gave that mending out. It says not whether it may be laid on now,
    upon that machine and off that account - and that is just the question this item answers.

    I leave the category high. On a server the road is the same I set forth at the swaying of the
    going of an installing - the account of a service an attacker stood upon after the using of a
    fault in an application seeks a way of writing something down with rights higher than its own. An
    old mending of a maker, rightly signed and bearing a known fault, is such a way - and stops not
    being one for the sign's being good.

    What an attacker gains while the item goes unmet - a writing with rights raised, done by a rightly
    signed mending from years back, off an account that has no rights of its own to it.

disruption_description:
  pl: |
    Podnoszę klasę do sprawdzenia, choć dla stacji roboczej oceniłem ten
    punkt jako niegroźny. Powód jest serwerowy i dotyczy tego, jak
    aktualizuje się oprogramowanie, które na serwerze faktycznie stoi.

    Aplikacja biznesowa na serwerze bywa aktualizowana własnym agentem
    producenta, chodzącym na koncie usługi. Agent taki pobiera poprawkę,
    sprawdza podpis i ją nakłada — i robi to właśnie dlatego, że dotąd
    było mu wolno. Po zmianie nakładanie przestaje się udawać.

    Odwracam też ocenę widoczności wobec stacji roboczej. Tam skutkiem
    jest pytanie o uprawnienia pokazane człowiekowi. Na serwerze nie ma
    komu go pokazać, więc skutkiem jest cisza: agent próbuje, nie
    dostaje praw, zapisuje coś w swoim dzienniku i próbuje jutro znowu.

    I to jest tu rzecz najważniejsza. Zatrzymane aktualizowanie aplikacji
    nie boli w dniu, w którym nastąpiło. Boli pół roku później, kiedy
    okazuje się, że maszyna stoi na wersji sprzed wielu poprawek — w tym
    tych, które usuwały błędy istotne dla bezpieczeństwa. Punkt zdejmujący
    ryzyko potrafi w ten sposób zbudować inne.

    Dlatego sprawdzenie polega na jednym pytaniu: czy cokolwiek na tej
    maszynie aktualizuje się samo, nie z konta administratora. Jeżeli tak,
    zmiana wymaga wcześniejszego przestawienia tego mechanizmu na konto
    z uprawnieniami albo na okno serwisowe.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I raise the class to a checking, though for a workstation I reckoned this item harmless. The
    ground is of the server and bears on how that software is mended which truly stands upon a
    server.

    An application of business upon a server is at times mended by the maker's own agent, going upon
    the account of a service. Such an agent fetches the mending, looks to the sign and lays it on -
    and does so just because hitherto it was allowed. After the change the laying on stops
    succeeding.

    I turn about also the reckoning of being seen, against the workstation. There the outcome is a
    question about rights shown to a person. On a server there is nobody to show it to, so the
    outcome is silence - the agent tries, gets no rights, writes something in its day-book and tries
    again tomorrow.

    And that is here the weightiest thing. A stopped mending of an application bites not on the day
    it came about. It bites half a year later, when it turns out the machine stands upon a make from
    before many mendings - among them those that did away with faults weighty for safekeeping. An
    item that takes a hazard away can in this wise build another.

    Therefore the checking comes to one question - whether anything upon that machine mends itself,
    not off the account of an administrator. If so, the change takes the setting over of that working
    beforehand onto an account with rights, or onto a window of service.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Agent producenta aktualizujący aplikację z konta usługi przestaje nakładać poprawki
      - Na serwerze nie ma komu pokazać pytania o uprawnienia, więc skutkiem jest cisza, a nie komunikat
      - Agent próbuje, nie dostaje praw, zapisuje coś w swoim dzienniku i próbuje nazajutrz znowu
      - Boli nie w dniu zmiany, tylko pół roku później, gdy maszyna stoi na wersji sprzed wielu poprawek
      - Punkt zdejmujący jedno ryzyko potrafi w ten sposób zbudować inne
    en:
      - A maker's agent mending an application off the account of a service stops laying mendings on
      - On a server there is nobody to show the question about rights to, so the outcome is silence and no word given
      - The agent tries, gets no rights, writes something in its day-book and tries again on the morrow
      - It bites not on the day of the change but half a year later, the machine standing upon a make from before many mendings
      - An item taking one hazard away can in this wise build another
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja na serwerze aktualizuje się własnym agentem producenta chodzącym na koncie usługi
      - Nie przestawiono mechanizmu aktualizacji na konto z uprawnieniami ani na okno serwisowe
    en:
      - An application upon the server mends itself by the maker's own agent going upon the account of a service
      - The working of mending was not set over onto an account with rights nor onto a window of service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'DisableLUAPatching'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'DisableLUAPatching'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where a vendor agent patches an application under a service account, move
    # it to an account with rights first: after this it fails in silence and the
    # machine falls behind on updates without anyone noticing.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLUAPatching' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/patching

notes:
  pl: |
    Trudność tego punktu leży w słowie „podpisana przez producenta",
    które brzmi jak zabezpieczenie. Podpis mówi wyłącznie, kto poprawkę
    wydał — nie mówi, czy wolno ją nałożyć teraz, na tej maszynie
    i z tego konta.

    Klasa podniesiona wobec stacji roboczej i widoczność odwrócona: na
    serwerze nie ma komu pokazać pytania o uprawnienia, więc agent
    producenta po prostu przestaje aktualizować aplikację po cichu.

    Rzecz do zapamiętania: punkt zdejmujący jedno ryzyko potrafi zbudować
    inne. Zatrzymane aktualizowanie boli pół roku później, gdy maszyna
    stoi na wersji sprzed wielu poprawek.
  en: |
    The hardness of this item lies in the word "signed by the maker", which sounds like a safekeeping.
    A sign says only who gave the mending out - it says not whether it may be laid on now, upon that
    machine and off that account.

    The class is raised against the workstation and the being seen turned about - on a server there
    is nobody to show the question about rights to, so the maker's agent simply stops mending the
    application in silence.

    The thing to bear in mind - an item taking one hazard away can build another. A stopped mending
    bites half a year later, the machine standing upon a make from before many mendings.
