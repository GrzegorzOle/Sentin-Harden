id: win2025-vendor-settings-downloads-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Pobieranie ustawień ze zdalnej usługi konfiguracyjnej wyłączone
    en: Downloading settings from the remote configuration service turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza pobieranie ustawień ze zdalnej usługi konfiguracyjnej —
    mechanizmu, którym producent systemu zmienia zachowanie jego składników
    bez aktualizacji.

    Kategoria średnia i chcę nazwać rzecz dokładnie, bo mechanizm jest mało
    znany. To nie jest aktualizacja. Aktualizacja ma wersję, ma opis i da
    się ją wstrzymać. To jest kanał, którym przychodzą same ustawienia:
    maszyna pyta okresowo, dostaje wartości i stosuje je u siebie, bez
    zdarzenia, które ktokolwiek zobaczy.

    To jest właściwa treść punktu. Organizacja ustala, jak ma pracować jej
    serwer, i zapisuje to w zasadach. Ten kanał stoi obok tego porządku —
    wartości przychodzące tą drogą nie pochodzą od organizacji i nie
    przechodzą przez jej procedurę zmian. Rzecz nie w tym, że przyjdzie coś
    złośliwego. Rzecz w tym, że konfiguracja maszyny przestaje być w całości
    znana temu, kto za nią odpowiada.

    Na serwerze waży to więcej niż na stanowisku, bo serwer jest maszyną,
    której zachowanie ma być powtarzalne i wyjaśnialne. Zmiana, której nikt
    nie zlecił i nikt nie odnotował, jest tu kosztem większym niż korzyść
    z dostrojenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost —
    ale maszyna przyjmuje ustawienia spoza procedury zmian organizacji,
    więc rozbieżność między stanem zakładanym a rzeczywistym może powstać
    bez niczyjego działania.
  en: |
    The item turns off the downloading of settings from the remote
    configuration service - the mechanism by which the system's maker changes
    the behaviour of its components without an update.

    The category is medium, and I want to name the thing exactly, because the
    mechanism is little known. It is not an update. An update has a version,
    has a description and can be held back. This is a channel down which
    settings alone arrive: the machine asks periodically, receives values and
    applies them, with no event anybody will see.

    That is the real substance of the item. An organisation settles how its
    server is to work and writes that down in policy. This channel stands
    beside that order - values arriving this way do not come from the
    organisation and do not pass through its procedure for changes. The
    matter is not that something malicious will arrive. The matter is that
    the machine's configuration stops being wholly known to whoever answers
    for it.

    On a server it weighs more than on a workstation, because a server is a
    machine whose behaviour is meant to be repeatable and explainable. A
    change nobody ordered and nobody recorded is a greater cost here than the
    benefit of being tuned.

    What an attacker gains while the item goes unmet: nothing directly - but
    the machine takes settings from outside the organisation's procedure for
    changes, so a divergence between the assumed and the actual state can
    arise with nobody acting at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż skutek jest niewidoczny w pracy.
    Powód klasy jest inny niż zwykle: nie chodzi o to, że coś przestanie
    działać, tylko o to, że przestanie się samo naprawiać.

    Tym kanałem producent rozsyła między innymi obejścia świeżo wykrytych
    usterek w składnikach systemu — zmiany, które w normalnym trybie trafią
    do maszyny dopiero z aktualizacją, a czasem nie trafią wcale. Po
    zastosowaniu reguły maszyna ich nie dostanie i zostanie na zachowaniu
    z wydania.

    To jest świadomy wybór, nie efekt uboczny: pewność, co jest ustawione,
    kosztem samoczynnego dostrajania. Wybór ten ma sens tam, gdzie zmiana
    konfiguracji musi być wyjaśnialna — czyli na serwerze — i mniej sensu
    tam, gdzie nikt tej konfiguracji nie pilnuje.

    Czego to nie psuje: aktualizacji systemu, poprawek bezpieczeństwa, zasad
    grupy, ustawień lokalnych ani niczego, co przychodzi drogą znaną
    i odnotowaną.

    Rzecz do zapamiętania: ten punkt i rejestrowanie pobrań z tej samej
    usługi leżą pod tym samym kluczem i są dwoma osobnymi ustawieniami.
    Rejestrowanie ma sens również wtedy, gdy pobieranie zostaje wyłączone.

    Bez przerwy, niewidoczne, natychmiast odwracalne.
  en: |
    The class is "needs review", although the effect is invisible in work.
    The reason for the class is unlike the usual one: it is not that
    something stops working, but that it stops mending itself.

    Down this channel the maker sends, among other things, workarounds for
    freshly found faults in the system's components - changes which in the
    ordinary way reach a machine only with an update, and sometimes never.
    After the rule is applied the machine will not receive them and will stay
    with the behaviour of its release.

    That is a deliberate choice, not a side effect: certainty about what is
    set, at the cost of automatic tuning. The choice makes sense where a
    change of configuration must be explainable - that is, on a server - and
    less sense where nobody watches that configuration.

    What this does not break: system updates, security fixes, group policy,
    local settings, or anything arriving by a known and recorded route.

    Something to remember: this item and the logging of downloads from the
    same service lie under the same key and are two separate settings. The
    logging has a point even when the downloading is switched off.

    No outage, invisible, undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - Maszyna przestanie dostawać obejścia świeżo wykrytych usterek rozsyłane tą drogą i zostanie na zachowaniu z wydania
      - To świadomy wybór, nie efekt uboczny — pewność, co jest ustawione, kosztem samoczynnego dostrajania
      - Aktualizacje systemu, poprawki bezpieczeństwa i zasady grupy działają bez zmian
      - Punkt i rejestrowanie pobrań z tej samej usługi leżą pod tym samym kluczem i są dwoma osobnymi ustawieniami
    en:
      - The machine stops receiving workarounds for freshly found faults sent this way and stays with the behaviour of its release
      - That is a deliberate choice, not a side effect - certainty about what is set, at the cost of automatic tuning
      - System updates, security fixes and group policy work unchanged
      - This item and the logging of downloads from the same service lie under the same key and are two separate settings
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest utrzymywana bez bieżącego nadzoru nad konfiguracją, a samoczynne dostrajanie składników jest tam jedyną drogą poprawek
    en:
      - The machine is kept without current oversight of its configuration and automatic tuning of components is the only route for fixes there
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'DisableOneSettingsDownloads'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'DisableOneSettingsDownloads'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Not an update: an update has a version, a description and can be held back.
    # This is a channel down which settings alone arrive, applied with no event
    # anybody will see. The cost of the change is that components stop being
    # tuned by themselves; the gain is that the configuration stays known.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableOneSettingsDownloads' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    To nie aktualizacja. Aktualizacja ma wersję, opis i da się ją wstrzymać;
    tu przychodzą same ustawienia, stosowane bez zdarzenia, które ktokolwiek
    zobaczy.

    Rzecz nie w tym, że przyjdzie coś złośliwego, tylko w tym, że
    konfiguracja maszyny przestaje być w całości znana temu, kto za nią
    odpowiada. Na serwerze to koszt większy niż korzyść z dostrojenia.

    Uczciwie o cenie: tym kanałem rozsyłane są też obejścia świeżo wykrytych
    usterek. Po wyłączeniu maszyna zostanie na zachowaniu z wydania — to
    świadomy wybór, nie efekt uboczny.
  en: |
    Not an update. An update has a version, a description and can be held
    back; here settings alone arrive, applied with no event anybody will see.

    The matter is not that something malicious will arrive but that the
    machine's configuration stops being wholly known to whoever answers for
    it. On a server that is a greater cost than the benefit of tuning.

    Honestly about the price: workarounds for freshly found faults are sent
    down this channel too. Once it is off, the machine stays with the
    behaviour of its release - a deliberate choice, not a side effect.
