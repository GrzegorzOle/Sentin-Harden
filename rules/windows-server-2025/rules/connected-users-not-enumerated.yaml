id: win2025-connected-users-not-enumerated

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Ekran logowania nie wylicza kont połączonych z usługą sieciową
    en: The sign-in screen does not enumerate accounts bound to a network service
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania ekranowi logowania pokazywać listę kont połączonych
    z usługą sieciową. Bez tego zakazu człowiek stojący przed maszyną
    widzi, czyje konta są na niej używane, zanim poda jakiekolwiek
    poświadczenie.

    Wartością jest to, że nazwa konta przestaje być czymś, co się
    odczytuje. Napastnik, który zna nazwę, ma połowę pary — zostaje mu
    hasło. Napastnik, który nazwy nie zna, musi ją najpierw zgadnąć,
    a zgadywanie zostawia ślad w dzienniku.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej i powód
    jest prosty: przed serwerem nikt nie stoi. Ekran logowania serwera
    przez większość czasu w ogóle nie jest przez nikogo oglądany,
    a maszyna trzymana jest w pomieszczeniu, do którego trzeba wejść.
    Warstwa ochrony jest tu więc już zapewniona przez drzwi.

    Wartość wraca w dwóch przypadkach i warto je wskazać, bo wtedy ocena
    byłaby inna. Pierwszy to serwer terminali, gdzie ekran logowania
    ogląda każdy użytkownik zdalny. Drugi to konsola dostępna przez kartę
    zarządzającą albo hipernadzorcę — tam „nikt nie stoi" przestaje być
    prawdą, bo stoi każdy, kto ma dostęp do tej konsoli.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwy kont
    faktycznie używanych na tej maszynie, bez podawania czegokolwiek.
  en: |
    The item forbids the sign-in screen to show the list of accounts bound to a network service.
    Without that forbidding the person standing before the machine sees whose accounts are used upon
    it, before handing over any token of leave.

    The worth is that the account's name stops being a thing that is read off. An attacker who knows
    the name holds half the pair - the password is left them. An attacker who knows not the name must
    first guess it, and guessing leaves a trace in the day-book.

    I lower the category to low against the reckoning for a workstation, and the ground is plain -
    nobody stands before a server. A server's sign-in screen is for most of the time looked upon by
    nobody at all, and the machine is held in a room that must be come into. The layer of guarding is
    therefore here already given by the door.

    The worth comes back in two cases and they are worth naming, the reckoning being there other.
    The first is a server of terminals, whereon the sign-in screen is looked upon by every far-off
    user. The second is a board come at through a card of ruling or an overseer - there "nobody
    stands" stops being true, for everyone stands there who has a reach to that board.

    What an attacker gains while the item goes unmet - the names of the accounts truly used upon that
    machine, without the handing over of anything.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i nie mam tu zastrzeżeń, które
    trzeba byłoby wyważać.

    Zmiana nie dotyka żadnego sposobu logowania. Konta działają tak samo,
    hasła tak samo, logowanie zdalne tak samo. Zmienia się wyłącznie to,
    co widać na ekranie przed podaniem poświadczeń — i to o jedną rzecz
    mniej.

    Skutek praktyczny jest jeden: przy logowaniu z konsoli nazwę konta
    trzeba wpisać, zamiast wybrać ją z listy. Na stacji roboczej byłaby
    to codzienna niewygoda powtarzana kilka razy dziennie. Na serwerze
    zdarza się to przy okazji serwisu, a administrator nazwę konta zna.

    Warto natomiast wiedzieć, że ustawienie nie ukrywa wszystkiego.
    Ostatnio zalogowany użytkownik to osobna zasada i osobny wpis — te
    dwie rzeczy bywają mylone, a zastosowanie jednej bez drugiej zostawia
    na ekranie dokładnie to, przed czym się bronimy.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption" and I have here no doubts that would need weighing.

    The change touches no way of signing in. The accounts work the same, the passwords the same, the
    signing in from afar the same. What alters is only what is seen upon the screen before the
    handing over of tokens of leave - and that by one thing less.

    The outcome in practice is one - at a signing in from the board the account's name must be typed
    in place of being picked off a list. On a workstation that would be a daily unease borne several
    times a day. On a server it happens at the time of service, and an administrator knows the
    account's name.

    It is worth knowing for all that that the setting hides not everything. The user last signed in
    is a rule of its own and an entry of its own - those two things are at times mistaken one for
    another, and the laying on of the one without the other leaves upon the screen just that against
    which we ward.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Przy logowaniu z konsoli nazwę konta trzeba wpisać, zamiast wybrać ją z listy
      - Zmiana nie dotyka żadnego sposobu logowania ani logowania zdalnego
      - Ustawienie nie ukrywa ostatnio zalogowanego użytkownika, to osobna zasada i osobny wpis
      - Zastosowanie jednej z tych dwóch zasad bez drugiej zostawia na ekranie to, przed czym się bronimy
      - Na serwerze terminali ekran logowania ogląda każdy użytkownik zdalny i wtedy ocena jest inna
    en:
      - At a signing in from the board the account's name must be typed in place of being picked off a list
      - The change touches no way of signing in nor the signing in from afar
      - The setting hides not the user last signed in, that being a rule of its own and an entry of its own
      - The laying on of one of those two rules without the other leaves upon the screen that against which we ward
      - On a server of terminals the sign-in screen is looked upon by every far-off user and the reckoning is there other
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'DontEnumerateConnectedUsers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'DontEnumerateConnectedUsers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Hiding the last signed-in user is a separate policy and a separate value:
    # applying only one of the two leaves a name on the screen either way.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontEnumerateConnectedUsers' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Kategoria obniżona, bo przed serwerem nikt nie stoi, a maszyna leży
    w pomieszczeniu, do którego trzeba wejść — warstwa ochrony jest już
    zapewniona przez drzwi.

    Wartość wraca w dwóch przypadkach i wtedy ocena byłaby inna: serwer
    terminali, gdzie ekran logowania ogląda każdy użytkownik zdalny,
    oraz konsola dostępna przez kartę zarządzającą albo hipernadzorcę,
    gdzie „nikt nie stoi" przestaje być prawdą.

    Rzecz często mylona: ukrycie ostatnio zalogowanego użytkownika to
    osobna zasada i osobny wpis.
  en: |
    The category is lowered, nobody standing before a server, and the machine lying in a room that
    must be come into - the layer of guarding is already given by the door.

    The worth comes back in two cases and the reckoning would there be other - a server of terminals,
    whereon the sign-in screen is looked upon by every far-off user, and a board come at through a
    card of ruling or an overseer, where "nobody stands" stops being true.

    A thing often mistaken - the hiding of the user last signed in is a rule of its own and an entry
    of its own.
