id: win11-defender-local-admin-merge-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Dołączanie lokalnych list wyłączeń do zasady zablokowane
    en: Merging of local exclusion lists into the policy blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy listy wyłączeń zdefiniowane na samej maszynie
    przez administratora lokalnego mają być doliczane do list zapisanych
    w zasadzie, czy pomijane.

    Lista wyłączeń jest wykazem miejsc, plików, rozszerzeń i procesów, których
    ochrona nie sprawdza. Jest to jedyne miejsce w całej konfiguracji ochrony,
    w którym wpisuje się wprost, czego nie oglądać — i dlatego jest to miejsce
    warte pilnowania bardziej niż jakiekolwiek inne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    dopisania własnego katalogu do listy wyłączeń, jeżeli zdobył uprawnienia
    administratora na tej maszynie, i to bez naruszania zasady obowiązującej
    w organizacji. Zasada zostaje nienaruszona, raport zgodności nie drgnie,
    a jedno miejsce na dysku przestaje być sprawdzane. Co do niego trafi,
    zostaje niewidoczne.

    Jest to droga używana w praktyce właśnie dlatego, że nie wygląda na atak.
    Wpis na liście wyłączeń jest czynnością administracyjną, którą wykonuje
    się z całkowicie uczciwych powodów, i nie odróżnia się od niej niczym
    poza intencją.

    Zablokowanie dołączania sprawia, że obowiązuje wyłącznie lista zapisana
    w zasadzie. Wpisy lokalne dalej można utworzyć, ale przestają mieć
    znaczenie.
  en: |
    The setting settles whether exclusion lists defined on the machine itself by a local
    administrator are to be counted in with the lists written into the policy, or passed
    over.

    An exclusion list is a record of places, files, extensions and processes that the
    protection does not check. It is the one place in the whole configuration of the
    protection where what is not to be looked at is written down outright - and so it is a
    place worth watching more than any other.

    What an attacker gains while the item goes unmet: the means of adding their own
    directory to the exclusion list, if they have gained administrator rights on this
    machine, and that without touching the policy binding in the organisation. The policy
    stays untouched, the compliance report does not stir, and one place on the disk stops
    being checked. Whatever goes there becomes invisible.

    It is a route used in practice precisely because it does not look like an attack. An
    entry on an exclusion list is an administrative act done for entirely honest reasons,
    and differs from one in nothing but intent.

    Blocking the merge makes the list written into the policy the only one that binds.
    Local entries can still be made, but they stop mattering.

disruption_description:
  pl: |
    Świadomego wdrożenia wymaga tu spis tego, co na maszynach jest dziś
    wyłączone ze sprawdzania lokalnie — bo po zmianie wszystkie te wyłączenia
    przestają działać naraz.

    Skutek jest natychmiastowy i może być dotkliwy. Ochrona zacznie sprawdzać
    miejsca, które dotąd pomijała: katalogi baz danych, magazyny maszyn
    wirtualnych, katalogi robocze narzędzi programistycznych, składnice
    aplikacji branżowych. Wyłączenia te zwykle powstały z powodu — albo
    wydajnościowego, albo dlatego, że sprawdzanie pliku w użyciu psuło pracę
    aplikacji.

    Objawy bywają dwojakie. Pierwszy to spowolnienie: aplikacja pracująca na
    dużym pliku otwartym na stałe zaczyna czekać na sprawdzenie. Drugi,
    poważniejszy, to blokada pliku w użyciu — aplikacja zgłasza błąd zapisu
    albo uszkodzenie bazy.

    Właściwa kolejność jest jedna: najpierw zebrać wyłączenia lokalne
    z maszyn, potem przenieść uzasadnione do zasady, dopiero potem wdrożyć tę
    regułę. Wdrożenie bez tego kroku zamienia poprawną zmianę w awarię
    aplikacji.

    Zmiana nie wymaga restartu, ale skutek pojawia się od razu na wszystkich
    maszynach objętych zasadą.
  en: |
    A conscious rollout takes here a record of what is today excluded from checking
    locally on the machines - since after the change all those exclusions stop working at
    once.

    The effect is immediate and may be severe. The protection will begin checking places
    it passed over until now: database directories, stores of virtual machines, working
    directories of development tools, repositories of trade applications. Those exclusions
    usually came about for a reason - either of performance, or because checking a file in
    use spoiled an application's work.

    The symptoms are sometimes of two kinds. The first is a slowing: an application
    working on a large file held open begins to wait for a check. The second, weightier,
    is a lock on a file in use - the application reports a write error or a damaged
    database.

    The right order is one: first gather the local exclusions from the machines, then move
    the justified ones into the policy, and only then apply this rule. A rollout without
    that step turns a correct change into an application failure.

    The change takes no restart, but the effect appears at once on all the machines the
    policy covers.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - virtualization-and-containers
    - updates-and-servicing
  what_breaks:
    pl:
      - Wszystkie wyłączenia zdefiniowane lokalnie przestają obowiązywać naraz
      - Aplikacje pracujące na dużych plikach otwartych na stałe zwalniają albo zgłaszają błąd zapisu
      - Katalogi baz danych i magazyny maszyn wirtualnych zaczynają być sprawdzane
      - Wyłączenia przeniesione wcześniej do zasady działają dalej bez zmiany
    en:
      - All locally defined exclusions stop binding at once
      - Applications working on large files held open slow down or report a write error
      - Database directories and stores of virtual machines begin to be checked
      - Exclusions moved into the policy beforehand work on unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Wyłączenia lokalne nie zostały zebrane i przeniesione do zasady
      - Na maszynie stoi aplikacja branżowa, której dostawca wymaga wyłączeń ustawianych lokalnie
      - Maszyna prowadzi bazę danych albo magazyn maszyn wirtualnych bez wyłączeń w zasadzie
    en:
      - The local exclusions have not been gathered and moved into the policy
      - A trade application stands on the machine whose supplier requires locally set exclusions
      - The machine runs a database or a store of virtual machines with no exclusions in the policy
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One here means the merging of local lists is forbidden.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableLocalAdminMerge'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $current = (Get-ItemProperty -Path $path -Name 'DisableLocalAdminMerge' -ErrorAction SilentlyContinue).'DisableLocalAdminMerge'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableLocalAdminMerge'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From this moment only the exclusion list written into the policy binds;
    # everything defined locally stops mattering at once.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalAdminMerge' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-exclusions-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest jedną z nielicznych w tej paczce, przy których kolejność
    czynności decyduje o tym, czy zmiana będzie poprawna, czy będzie awarią.
    Sam zapis wartości jest trywialny; trudna jest praca, którą trzeba
    wykonać przed nim.

    Przed wdrożeniem warto wypisać wyłączenia obowiązujące dziś na maszynie.
    Pusta lista oznacza zmianę bez skutków. Lista niepusta jest spisem rzeczy,
    które po zmianie zaczną być sprawdzane — i każdą z nich trzeba rozważyć
    z osobna, bo część powstała z powodu, a część z wygody.

    Wyłączenie, którego nikt nie potrafi uzasadnić, jest samo w sobie
    ustaleniem wartym zapisania w raporcie — niezależnie od tego, czy trafi
    do zasady, czy zniknie.

    Punkt nie usuwa wpisów lokalnych i nie zabrania ich tworzyć. Sprawia, że
    przestają obowiązywać, więc po cofnięciu zmiany wracają do działania
    w tym samym kształcie.
  en: |
    The rule is one of the few in this pack where the order of acts decides whether the
    change will be correct or a failure. Writing the value is trivial; what is hard is the
    work that has to be done before it.

    Before the rollout it is worth listing the exclusions binding on the machine today. An
    empty list means a change with no effects. A non-empty list is a record of things that
    after the change will begin to be checked - and each of them has to be weighed apart,
    since some came about for a reason and some out of convenience.

    An exclusion nobody can justify is itself a finding worth writing into the report -
    whether it goes into the policy or disappears.

    The item does not remove local entries and does not forbid their making. It makes them
    stop binding, so once the change is undone they come back into force in the same
    shape.
