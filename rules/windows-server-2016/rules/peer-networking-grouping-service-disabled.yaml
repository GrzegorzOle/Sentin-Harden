id: win2016-peer-networking-grouping-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa grupowania w sieci równorzędnej wyłączona
    en: The grouping service in peer networking disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pozwala maszynom łączyć się w grupy, w których dzielą się plikami
    i wiadomościami bezpośrednio, bez serwera i bez udziału sieciowego.

    Konstrukcja jest tu warta uwagi, bo tłumaczy ocenę. Grupa powstaje przez
    zaproszenie i utrzymuje się między maszynami, które do niej należą.
    Nie ma administratora grupy w znaczeniu, w jakim rozumie to katalog —
    jest tylko ten, kto zaprosił, i ci, których zaproszono. Prawa do
    zawartości wynikają z członkostwa, a członkostwo z zaproszenia.

    Znaczy to, że przez taką grupę dane mogą wyjść z maszyny drogą, której
    nie widać w żadnym miejscu, gdzie zwykle się patrzy. Nie ma udziału,
    więc nie ma uprawnień do sprawdzenia. Nie ma serwera, więc nie ma
    dziennika. Nie ma katalogu, więc nie ma listy, kto miał dostęp.

    Dla organizacji jest to kanał wymiany plików omijający wszystkie
    przyjęte drogi naraz — i to jest właściwa treść tego punktu, poważniejsza
    niż podatność samego protokołu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wyniesienia danych z tej maszyny bez udziału sieciowego, bez uprawnień
    i bez zapisu w jakimkolwiek dzienniku.
  en: |
    The service lets machines join into groups in which they share files and messages
    directly, without a server and without a network share.

    The construction is worth attention here, explaining as it does the assessment. A
    group comes about by invitation and holds among the machines belonging to it. There
    is no group administrator in the sense a directory understands - there is only the
    one who invited and those who were invited. Rights to the contents follow from
    membership, and membership from an invitation.

    That means data may leave the machine through such a group by a road not seen at any
    place one usually looks. There is no share, so there are no permissions to check.
    There is no server, so there is no log. There is no directory, so there is no list
    of who had access.

    For the organisation it is a channel of file exchange going round all the accepted
    roads at once - and that is this item's real substance, graver than any weakness of
    the protocol itself.

    What an attacker gains while the item goes unmet: a road of carrying data out of
    this machine with no network share, no permissions and no entry in any log.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy ktoś tej drogi
    faktycznie używa — bo jeżeli używa, to prawdopodobnie właśnie dlatego,
    że drogi zwykłe okazały się dla niego niewygodne.

    Grupy już zawiązane rozpadają się w chwili zatrzymania usługi. Nie ma
    tu stanu, który by to przetrwał, i nie ma ostrzeżenia dla pozostałych
    uczestników. Z ich strony maszyna po prostu znika z grupy.

    Zastosowania na serwerze są rzadkie, ale jedno warto wymienić osobno:
    starsze pakiety współpracy dokumentowej i przestrzeni roboczych
    działające bez serwera opierały się właśnie na tym mechanizmie. Jeżeli
    na maszynie stoi takie rozwiązanie, wyłączenie usługi odbierze mu
    podstawę działania, a nie jedną funkcję.

    Rzecz do sprawdzenia przed wykonaniem jest przy tym inna niż zwykle.
    Nie chodzi o to, czy coś przestanie działać, tylko o to, czy przez tę
    drogę nie przechodzą dziś dane, które gdzieś muszą trafić. Zamknięcie
    kanału bez wskazania zamiennika kończy się zwykle tym, że ktoś znajdzie
    sobie kanał jeszcze mniej widoczny.

    Czego to nie psuje: udziałów sieciowych, poczty, uwierzytelniania,
    pulpitu zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anybody in fact
    uses this road - for if they do, it is likely precisely because the ordinary roads
    proved inconvenient to them.

    Groups already formed fall apart at the moment the service is stopped. There is no
    state here that would survive it, and there is no warning for the remaining
    participants. From their side the machine simply vanishes from the group.

    Uses on a server are rare, but one is worth naming apart: older suites for document
    collaboration and workspaces working without a server rested on just this mechanism.
    Should such a solution stand on the machine, switching the service off will take
    away the ground of its working, not one of its features.

    The thing to check before execution is here other than usual. It is not a matter of
    whether something will stop working, but of whether data that has to get somewhere
    does not pass by this road today. Shutting a channel with no replacement named ends
    as a rule in somebody finding themselves a channel less visible still.

    What this does not break: network shares, mail, authentication, or the remote
    desktop.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Grupy już zawiązane rozpadają się w chwili zatrzymania usługi, bez ostrzeżenia dla pozostałych uczestników
      - Starsze pakiety współpracy dokumentowej działające bez serwera tracą podstawę działania, a nie pojedynczą funkcję
      - Wymiana plików prowadzona dotąd tą drogą ustaje i nie ma dla niej wskazanego zamiennika
      - Udziały sieciowe, poczta, uwierzytelnianie i pulpit zdalny pozostają bez zmian
    en:
      - Groups already formed fall apart at the moment the service is stopped, with no warning for the remaining participants
      - Older document collaboration suites working without a server lose the ground of their working, not a single feature
      - File exchange carried on by this road until now ceases and no replacement has been named for it
      - Network shares, mail, authentication and the remote desktop stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi pakiet współpracy dokumentowej opierający się na grupach równorzędnych
      - Przez tę drogę przechodzi dziś wymiana plików, dla której nie wskazano zamiennika
    en:
      - A document collaboration suite resting on peer groups stands on the machine
      - File exchange for which no replacement has been named passes by this road today
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'p2psvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Groups already formed fall apart at the stop - the service does not keep a
    # state that survives it.
    Stop-Service -Name 'p2psvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2psvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'p2psvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-to-peer

notes:
  pl: |
    Punkt domyka trójkę o sieci równorzędnej i jest z niej najciekawszy,
    bo jego treścią nie jest podatność, tylko obejście. Pozostałe dwa
    dotyczą tego, jak maszyny się znajdują; ten dotyczy tego, co przez
    znalezione połączenie przechodzi.

    Warto to odnotować w raporcie osobno, bo punkty o kanałach wymiany
    danych czyta się inaczej niż punkty o usługach. Pytanie brzmi tu nie
    „czy to jest dziurawe", tylko „czy chcemy, żeby taka droga istniała".
    Odpowiedź bywa różna i dlatego punkt jest w klasie wymagającej
    sprawdzenia mimo braku widocznych skutków wdrożenia.

    Uwaga praktyczna do podglądu przed wykonaniem: zamknięcie kanału bez
    zamiennika rzadko kończy się tym, że wymiana ustaje. Kończy się tym, że
    przenosi się gdzie indziej. Aplikacja powinna to powiedzieć wprost,
    zamiast obiecywać, że problem znika wraz z usługą.
  en: |
    The item shuts the three about peer networking and is the most interesting of them,
    its substance being not a weakness but a way round. The other two concern how
    machines find one another; this one concerns what passes through the connection
    found.

    That is worth noting apart in the report, items about channels of data exchange
    being read otherwise than items about services. The question here is not "is this
    leaky" but "do we want such a road to exist at all". The answer varies, and so the
    item is of the class needing review despite the rollout having no visible
    consequences.

    A practical note for the preview before execution: shutting a channel with no
    replacement rarely ends in the exchange ceasing. It ends in its moving elsewhere.
    The application should say that outright rather than promise the trouble goes away
    with the service.
