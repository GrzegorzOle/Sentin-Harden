id: win10-lan-manager-auth-level

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Poziom uwierzytelniania LAN Manager ograniczony do odmiany nowszej
    en: The LAN Manager authentication level held to the newer kind
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna posługuje się wyłącznie najnowszą odmianą
    starszego mechanizmu uwierzytelniania i odmawia odmian wcześniejszych —
    zarówno wysyłając, jak i przyjmując.

    Mechanizm ten ma kilka pokoleń. Najstarsze z nich powstało, gdy hasła
    były krótkie, a moc obliczeniowa droga: przechwycona wymiana pozwala
    dziś odtworzyć z niego hasło w czasie liczonym w minutach. Pokolenie
    pośrednie jest lepsze, ale wciąż otwarte na przekazanie cudzego
    uwierzytelnienia dalej.

    Wartość wymagana odcina wszystko poza pokoleniem ostatnim. Jest to
    zmiana o innym charakterze niż reguły o zabezpieczeniu sesji: tamte
    mówią, jak mocno chronić rozmowę, ta mówi, którym mechanizmem w ogóle
    wolno się przedstawiać.

    Rzecz warta odnotowania: ustawienie działa w obie strony naraz.
    Maszyna przestaje wysyłać odmiany starsze i przestaje je przyjmować,
    więc skutek dotyczy i tego, po co sięga, i tego, co wystawia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wymianę
    uwierzytelniającą prowadzoną pokoleniem, z którego hasło odtwarza się
    nakładem niewielkim.
  en: |
    The setting makes the machine use the newest kind alone of the older authentication mechanism and refuse the
    earlier kinds - both in sending and in taking in.

    That mechanism has several generations. The oldest of them came about when passwords were short and
    reckoning power dear: a caught exchange lets a password be recovered from it today in minutes. The middle
    generation is better but still open to somebody's authentication being passed on further.

    The value called for cuts off everything but the last generation. It is a change of another nature than the
    rules about a session's guard: those say how strongly a conversation is to be guarded, this says by which
    mechanism one may present oneself at all.

    A thing worth noting: the setting works both ways at once. The machine ceases sending the older kinds and
    ceases taking them in, so the consequence touches both what it reaches for and what it sets out.

    What an attacker gains while the item goes unmet: an authenticating exchange carried on in a generation from
    which a password is recovered at small cost.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedyna reguła w tym bloku
    z klasą najwyższą.

    Powód jest dwojaki. Po pierwsze zmiana wchodzi po restarcie maszyny,
    więc skutku nie da się obejrzeć od razu ani cofnąć bez kolejnego
    restartu. Po drugie dotyka obu kierunków naraz, więc awaria może
    wystąpić po stronie, której się nie sprawdzało.

    Zakres jest szeroki. Urządzenia wielofunkcyjne, magazyny sieciowe
    sprzed lat, oprogramowanie branżowe z własną implementacją
    uwierzytelniania i systemy sterowania bywają zatrzymane na pokoleniu
    wcześniejszym. Po zmianie żadne z nich nie uzgodni z maszyną sesji.

    Objaw jest widoczny dla użytkownika i mylący: przy dostępie do zasobu
    wraca pytanie o hasło albo pojawia się odmowa dostępu. Nic w komunikacie
    nie wskazuje mechanizmu jako przyczyny.

    Odnotowuję, że trzeba to uprzedzić, a nie tylko zaplanować. Osoba,
    która straci dostęp do magazynu, zgłosi to jako awarię hasła.

    Czego to nie psuje: uwierzytelniania mechanizmem nowszym, logowania
    kontami lokalnymi, uprawnień do zasobów, aplikacji lokalnych, drukowania
    przez kolejkę lokalną.
  en: |
    The class is "needs a planned rollout", and it is the only rule in this block of the highest class.

    The reason is twofold. First, the change takes hold after a restart of the machine, so the consequence
    cannot be looked at straight away nor undone without another restart. Second, it touches both directions at
    once, so a fault may come up on the side that was not reviewed.

    The reach is wide. Multifunction devices, network stores of years ago, trade software with an authentication
    of its own making and control systems are at times stopped at an earlier generation. After the change none
    of them will agree a session with the machine.

    The symptom is plain to the user and misleading: at a reaching for a resource a question about a password
    comes back, or a refusal of access comes up. Nothing in the message points at the mechanism as the cause.

    I set down that this has to be forewarned, not merely planned. A person losing their reach to a store will
    report it as a fault with a password.

    What this does not break: authentication by the newer mechanism, logging on by local accounts, the rights
    upon resources, local applications, or printing through a local queue.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - network-and-firewall
    - accounts-and-passwords
  what_breaks:
    pl:
      - Urządzenia wielofunkcyjne i magazyny sieciowe zatrzymane na pokoleniu wcześniejszym przestają uzgadniać sesję z tą maszyną
      - Oprogramowanie branżowe z własną implementacją uwierzytelniania traci dostęp do zasobów sieciowych
      - Objaw wygląda na kłopot z hasłem, bo wraca pytanie o poświadczenia albo pojawia się odmowa dostępu
      - Zmiana dotyka obu kierunków naraz, więc awaria może wystąpić po stronie, której nie sprawdzano
      - Uwierzytelnianie mechanizmem nowszym, logowanie kontami lokalnymi i uprawnienia do zasobów pozostają bez zmian
    en:
      - Multifunction devices and network stores stopped at an earlier generation cease agreeing a session with this machine
      - Trade software with an authentication of its own making loses its reach to network resources
      - The symptom looks a trouble with a password, a question about credentials coming back or access being refused
      - The change touches both directions at once, so a fault may come up on the side that was not reviewed
      - Authentication by the newer mechanism, logging on by local accounts and the rights upon resources stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna łączy się z urządzeniem albo systemem obsługującym wyłącznie pokolenie wcześniejsze tego mechanizmu
      - Nie uprzedzono osób korzystających z zasobów sieciowych, że zgłoszą to jako awarię hasła
    en:
      - The machine joins a device or a system serving only an earlier generation of that mechanism
      - The people using network resources have not been forewarned, and will report it as a fault with a password
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'LmCompatibilityLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'LmCompatibilityLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change takes hold at the next start of the machine and works both ways -
    # what this machine reaches for and what it sets out. Forewarn the people
    # using network resources; they will report it as a fault with a password.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LmCompatibilityLevel' -Value 5 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level

notes:
  pl: |
    Reguła jest w tym bloku najcięższa i warto, żeby aplikacja postawiła ją
    osobno, a nie w jednym rzędzie z pozostałymi. Jest jedyną, która wymaga
    restartu, jedyną z klasą najwyższą i jedyną działającą w obie strony.

    Odnotowuję relację do reguł o zabezpieczeniu sesji. Tamte mówią, jak
    mocno chronić rozmowę już prowadzoną; ta mówi, którym mechanizmem wolno
    ją zacząć. Wykonanie tamtych bez tej zostawia pokolenie wcześniejsze
    w użyciu, tylko lepiej opakowane.

    Argument wart postawienia wprost dotyczy zgłoszenia awarii. Osoba, która
    straci dostęp, powie „nie przyjmuje hasła", a nie „zmienił się mechanizm
    uwierzytelniania". Aplikacja, która nazwie ten objaw przy opisie skutków,
    skróci rozpoznanie z godzin do minut.
  en: |
    The rule is the heaviest in this block, and it is well that the application set it apart rather than in one
    row with the rest. It is the only one calling for a restart, the only one of the highest class and the only
    one working both ways.

    I set down its relation to the rules about a session's guard. Those say how strongly a conversation already
    under way is to be guarded; this says by which mechanism it may be begun. Carrying those out without this
    leaves the earlier generation in use, only better wrapped.

    The argument worth putting outright touches how the fault gets reported. A person losing their reach will
    say "it will not take my password", not "the authentication mechanism has changed". An application naming
    that symptom beside the description of consequences will shorten the recognising from hours to minutes.
