id: win2016-file-sharing-server-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera udostępniania plików wyłączona
    en: The file sharing server service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę wydającą pliki innym maszynom. Usługa ta odpowiada
    na połączenia z sieci i udostępnia zawartość udziałów.

    Rozumowanie jest tu proste i dotyczy powierzchni. Usługa nasłuchuje
    stale, przyjmuje połączenia od każdego, kto do niej dotrze, i wykonuje
    uwierzytelnianie zanim ktokolwiek obejrzy, kto się łączy. Jest to
    składnik o długiej historii, obsługujący protokół o wielu wariantach,
    i każdy wariant jest kodem, który trzeba utrzymywać.

    Na maszynie, która niczego nie udostępnia, usługa ta jest otwartym
    portem bez zadania. Wyłączenie jej nie zabiera niczego, bo niczego nie
    dawała, a zamyka drogę, którą historycznie chodziło najwięcej
    robactwa rozchodzącego się po sieci lokalnej.

    Trzeba przy tym rozróżnić dwie usługi o mylnie podobnych nazwach. Ta
    wydaje pliki innym. Druga, o której ten punkt nie mówi, pozwala tej
    maszynie sięgać po pliki cudze. Wyłączenie pierwszej nie odbiera
    drugiej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nasłuchujący
    port obsługujący złożony protokół na maszynie, która nie ma powodu
    niczego wydawać.
  en: |
    The item switches off the service giving files out to other machines. That service answers
    connections from the network and serves the contents of shares.

    The reasoning here is plain and concerns surface. The service listens ceaselessly, takes
    connections from anybody who reaches it, and carries out authentication before anybody looks at who
    is connecting. It is a component of long history, serving a protocol of many variants, and every
    variant is code that has to be kept up.

    On a machine that gives nothing out, that service is an open port without a task. Switching it off
    takes nothing away, having given nothing, and shuts the road along which historically the most
    vermin spreading over a local network travelled.

    Two services of misleadingly like names have to be told apart here. This one gives files out to
    others. The other, of which this item does not speak, lets this machine reach for files of others.
    Switching the first off does not take the second away.

    What an attacker gains while the item goes unmet: a listening port serving a complex protocol on a
    machine with no cause to give anything out.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a jeden z warunków jest twardszy
    niż wszystko inne w tym bloku.

    Warunek pierwszy: kontroler domeny. Udziały, z których maszyny czytają
    zasady, a ludzie pobierają skrypty logowania, wydaje właśnie ta usługa.
    Wyłączenie jej na kontrolerze zatrzymuje domenę — maszyny przestają
    czytać zasady, a ludzie przestają się logować. Nie jest to regresja do
    przewidzenia po objawach; jest to awaria natychmiastowa i obejmująca
    wszystkich.

    Warunek drugi: udziały wydawane z tej maszyny. Każdy folder
    udostępniony innym znika dla wszystkich, którzy z niego korzystali.
    Objawem jest odmowa dostępu, a nie pusty folder, więc przyczyna bywa
    szukana w uprawnieniach.

    Warunek trzeci: kolejki wydruku. Kolejka udostępniona z tej maszyny
    wydawana jest tą samą usługą, więc przestaje być widoczna razem
    z udziałami plikowymi.

    Warunek czwarty: narzędzia zdalne. Część narzędzi administracyjnych
    i agentów kopii zapasowych sięga do maszyny przez udziały ukryte, które
    ta usługa obsługuje.

    Czego to nie psuje: sięgania z tej maszyny po pliki cudze, pracy
    aplikacji lokalnych, sieci, uwierzytelniania użytkownika przy logowaniu
    lokalnym.

    Wymaga zatrzymania usługi; cofnięcie natychmiastowe.
  en: |
    The class is "needs a planned rollout", and one of the conditions is harder than anything else in
    this block.

    The first condition: a domain controller. The shares from which machines read policy and people
    fetch logon scripts are served by just that service. Switching it off on a controller stops the
    domain - machines cease to read policy and people cease to log in. It is no regression to be
    foreseen from symptoms; it is an immediate fault taking in everybody.

    The second condition: the shares given out from this machine. Every folder shared with others
    vanishes for all who used it. The symptom is a refusal of access rather than an empty folder, so the
    cause is at times looked for in permissions.

    The third condition: print queues. A queue shared from this machine is served by that same service,
    so it ceases to be visible along with the file shares.

    The fourth condition: remote tools. Some administrative tools and backup agents reach the machine
    through hidden shares that this service serves.

    What this does not break: this machine's reaching for the files of others, the working of local
    applications, the network, or a user's authentication at a local logon.

    Calls for a service to be stopped; the undoing is immediate.

implementation_consequences:
  impact_areas:
    - file-sharing
    - remote-management
    - printing
  what_breaks:
    pl:
      - Na kontrolerze domeny zatrzymuje domenę — maszyny przestają czytać zasady, a ludzie przestają się logować
      - Każdy udział wydawany z tej maszyny znika dla wszystkich, którzy z niego korzystali
      - Objawem jest odmowa dostępu, a nie pusty folder, więc przyczyna bywa szukana w uprawnieniach
      - Kolejka wydruku udostępniona z tej maszyny przestaje być widoczna razem z udziałami plikowymi
      - Narzędzia administracyjne i agenty kopii zapasowych sięgające przez udziały ukryte tracą do nich dostęp
      - Sięganie z tej maszyny po pliki cudze i praca aplikacji lokalnych pozostają bez zmian
    en:
      - On a domain controller it stops the domain - machines cease to read policy and people cease to log in
      - Every share given out from this machine vanishes for all who used it
      - The symptom is a refusal of access rather than an empty folder, so the cause is at times looked for in permissions
      - A print queue shared from this machine ceases to be visible along with the file shares
      - Administrative tools and backup agents reaching through hidden shares lose their access to them
      - This machine's reaching for the files of others and the working of local applications stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest kontrolerem domeny, bo usługa ta wydaje udziały z zasadami i skryptami logowania
      - Maszyna wydaje udziały plikowe albo kolejki wydruku komukolwiek
      - Narzędzia administracyjne albo agenty kopii zapasowych sięgają do tej maszyny przez udziały ukryte
    en:
      - The machine is a domain controller, that service serving the shares with policies and logon scripts
      - The machine gives out file shares or print queues to anybody
      - Administrative tools or backup agents reach this machine through hidden shares
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'LanmanServer' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a domain controller this stops the domain. The shares holding policies
    # and logon scripts are served by this very service, so machines cease to
    # read policy and people cease to log in. Establish the role first.
    Stop-Service -Name 'LanmanServer' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'LanmanServer' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'LanmanServer' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/file-server-smb-overview

notes:
  pl: |
    Punkt otwiera blok o usługach, które serwer trzyma włączone przez
    domyślność, a nie przez potrzebę. Wszystkie reguły bloku mają ten sam
    kształt: usługa nasłuchuje, obsługuje protokół, i albo pełni na tej
    maszynie rolę, albo jest otwartym portem bez zadania.

    Ta reguła jest w bloku najgroźniejsza we wdrożeniu i warto ją w
    interfejsie wyróżnić. Na kontrolerze domeny jej wykonanie nie powoduje
    regresji dającej się opisać jako „coś przestanie działać" — powoduje
    zatrzymanie domeny. Aplikacja, która potrafi odczytać rolę maszyny,
    powinna przy tym punkcie tę rolę sprawdzić i powiedzieć wprost, zamiast
    zostawiać użytkownikowi rozpoznanie skutku po fakcie.

    Rozróżnienie dwóch usług o podobnych nazwach jest drugą rzeczą wartą
    pokazania. Obawa, że maszyna straci dostęp do cudzych plików, jest przy
    tym punkcie częsta i bezpodstawna — i prowadzi do odpuszczania go tam,
    gdzie byłby zupełnie bezbolesny.

    Poziom drugi odzwierciedla to, że punkt zakłada maszynę niczego nie
    udostępniającą. Na maszynie z rolą serwera plików jest niewykonalny
    i odpuszczenie go z zapisanym uzasadnieniem jest wynikiem prawidłowym.
  en: |
    The item opens the block about services a server keeps switched on out of default rather than out of
    need. All the block's rules share one shape: the service listens, serves a protocol, and either
    holds a role on this machine or is an open port without a task.

    This rule is in the block the most dangerous in the rollout and is worth setting apart in the
    interface. On a domain controller its carrying out causes no regression describable as "something
    will cease to work" - it causes the domain to stop. An application able to read the machine's role
    ought at this item to check that role and say so outright, rather than leaving the user to recognise
    the consequence after the fact.

    Telling the two services of like names apart is the second thing worth showing. The misgiving that
    the machine will lose its access to the files of others is at this item a common one and groundless
    - and leads to its being let go where it would be wholly painless.

    Level two reflects that the item assumes a machine sharing nothing. On a machine with the file
    server role it is not feasible, and letting it go with a written justification is a proper outcome.
