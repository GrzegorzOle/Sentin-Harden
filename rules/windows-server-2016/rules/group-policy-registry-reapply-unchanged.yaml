id: win2016-group-policy-registry-reapply-unchanged

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Group Policy
  title:
    pl: Ustawienia rejestru wgrywane ponownie nawet bez zmiany zasad
    en: Registry settings loaded again even when policy has not changed
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe wgrywać ustawienia rejestru z zasad grupy przy każdym
    odświeżeniu, a nie tylko wtedy, gdy zasada po stronie serwera się
    zmieniła.

    Zachowanie domyślne jest oszczędne i logiczne: skoro zasada się nie
    zmieniła, nie ma czego wgrywać. Logika ta ma jedną lukę i to jest
    przedmiot tej reguły.

    Zasada nie jest jedyną rzeczą, która wpływa na ustawienie w rejestrze.
    Ktoś z uprawnieniami administratora może je zmienić na miejscu.
    Instalator może je nadpisać. Oprogramowanie może je wyczyścić.
    Po żadnej z tych rzeczy zasada po stronie serwera się nie zmienia —
    a więc przy zachowaniu domyślnym nic jej nie przywróci.

    Zmiana taka bywa cicha i trwała. Ustawienie wraca do stanu sprzed
    utwardzenia, raport z serwera zasad pokazuje, że zasada obowiązuje,
    i rozbieżność ta potrafi trwać do najbliższej zmiany zasady — czyli
    dowolnie długo.

    Punkt zamyka tę lukę: zasada wgrywa się co odświeżenie, więc zmiana
    dokonana na miejscu zostaje cofnięta najdalej po godzinie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałość
    zmiany wprowadzonej na miejscu — wyłączone zabezpieczenie zostaje
    wyłączone, choć zasada mówi inaczej, i nikt tego nie zauważa.
  en: |
    The setting has registry settings from group policy loaded at every refresh
    rather than only where the policy on the server's side has changed.

    The default behaviour is sparing and logical: the policy having not changed,
    there is nothing to load. That logic has one gap, and that gap is this rule's
    subject.

    The policy is not the only thing bearing on a setting in the registry. Somebody
    with administrator rights may change it on the spot. An installer may overwrite
    it. Software may clear it. After none of those things does the policy on the
    server's side change - so with the default behaviour nothing will restore it.

    Such a change is at times quiet and lasting. The setting returns to its state
    from before the hardening, the report from the policy server shows the policy
    holds, and that discrepancy can last until the next change of policy - which is
    to say as long as you like.

    The item shuts that gap: the policy is loaded at every refresh, so a change made
    on the spot is undone within an hour at most.

    What an attacker gains while the item goes unmet: the lasting of a change made
    on the spot - a protection switched off stays switched off though the policy
    says otherwise, and nobody notices.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na tej maszynie
    utrzymuje się ustawienia rozmyślnie odbiegające od zasady.

    Bywa tak i nie zawsze jest to niedbalstwo. Serwer bazy danych z inną
    wartością limitu, maszyna aplikacyjna z odstępstwem uzgodnionym
    z dostawcą, stanowisko testowe — wszędzie tam ktoś zmienił ustawienie
    na miejscu, bo zasada ogólna mu nie odpowiadała.

    Po wdrożeniu tej reguły takie odstępstwa przestaną się utrzymywać.
    Wrócą do wartości z zasady przy najbliższym odświeżeniu, czyli
    najdalej po godzinie. Jest to skutek zamierzony, ale dla kogoś, kto
    o odstępstwie nie wiedział, wygląda jak samoczynna zmiana konfiguracji.

    Rzecz druga jest mniejsza i dotyczy obciążenia. Wgrywanie zasad co
    odświeżenie zamiast tylko przy zmianie kosztuje trochę więcej pracy
    maszyny i trochę więcej ruchu sieciowego. Na pojedynczej maszynie jest
    to niezauważalne; przy kilkuset maszynach pytających ten sam serwer
    zasad bywa mierzalne.

    Czego to nie psuje: pracy użytkowników, usług, logowania, dostępu do
    plików. Nie wymaga restartu ani wylogowania.
  en: |
    The class is "needs review", and what has to be checked is whether settings
    deliberately departing from policy are kept on this machine.

    That does happen, and it is not always carelessness. A database server with a
    different limit value, an application machine with a departure agreed with the
    supplier, a test position - in each of those somebody changed a setting on the
    spot, the general policy not suiting them.

    After this rule's rollout such departures will stop holding. They will return to
    the policy's values at the next refresh, which is to say within an hour at most.
    That is an intended consequence, but to somebody who did not know of the
    departure it looks like a configuration changing of itself.

    The second thing is smaller and concerns load. Loading policy at every refresh
    rather than only at a change costs a little more work by the machine and a
    little more network traffic. On a single machine that is unnoticeable; with a
    few hundred machines asking the same policy server it is at times measurable.

    What this does not break: users' work, services, signing in, or access to files.
    Calls for no restart and no sign-out.

implementation_consequences:
  impact_areas:
    - remote-management
  what_breaks:
    pl:
      - Ustawienia zmienione na miejscu wbrew zasadzie wrócą do wartości z zasady najdalej po godzinie, co bez wiedzy o odstępstwie wygląda na samoczynną zmianę
      - Odstępstwa uzgodnione z dostawcą oprogramowania przestaną się utrzymywać i trzeba je przenieść do zasady albo do osobnej jednostki
      - Wgrywanie zasad co odświeżenie kosztuje trochę więcej pracy maszyny i ruchu do serwera zasad
      - Praca użytkowników, usługi, logowanie i dostęp do plików pozostają bez zmian
    en:
      - Settings changed on the spot against policy will return to the policy's values within an hour, which without knowing of the departure looks like a change of itself
      - Departures agreed with a software supplier will stop holding and have to be moved into the policy or into a unit of their own
      - Loading policy at every refresh costs a little more work by the machine and traffic to the policy server
      - Users' work, services, signing in and access to files stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie utrzymuje się uzgodnione odstępstwa od zasady ogólnej i nie przeniesiono ich jeszcze do osobnej jednostki organizacyjnej
      - Serwer zasad obsługuje dużą liczbę maszyn i jego obciążenie jest już bliskie granicy
    en:
      - Agreed departures from the general policy are kept on the machine and have not yet been moved into a unit of their own
      - The policy server serves a large number of machines and its load is already near its limit
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is named in the negative: zero means unchanged policy is not
      # passed over, so the wanted state is written with a zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
      $name = 'NoGPOListChanges'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    $name = 'NoGPOListChanges'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is named in the negative - zero means unchanged policy is not
    # passed over, so the wanted state is written with a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoGPOListChanges' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc978526(v=technet.10)

notes:
  pl: |
    Punkt tworzy parę z regułą o odświeżaniu w tle i dopiero obie razem
    dają to, o co chodzi. Tamta pilnuje, żeby maszyna w ogóle pytała
    o zasady. Ta pilnuje, żeby pytanie miało skutek także wtedy, gdy
    odpowiedź brzmi „bez zmian".

    Wdrożenie samej tamtej zostawia lukę dokładnie tak szeroką, jak opisana
    wyżej: maszyna pyta regularnie, dostaje odpowiedź „nic nowego"
    i niczego nie przywraca, choć ustawienie zostało na miejscu zmienione.

    Jest to jedyny punkt w zestawie, który przywraca zgodność sam z siebie,
    bez udziału człowieka. Warto to zaznaczyć, bo zmienia sposób pracy
    z raportem: po jego wdrożeniu niezgodność w punkcie sterowanym zasadą
    znaczy albo brak zasady, albo jej nieskuteczność — nie zaś zwykłe
    odstępstwo, które ktoś kiedyś wprowadził.
  en: |
    The item makes a pair with the rule about refreshing in the background, and only
    both together give what is meant. That one sees to the machine asking about
    policy at all. This one sees to the asking having effect also where the answer
    is "no change".

    Rolling out that one alone leaves a gap exactly as wide as described above: the
    machine asks regularly, gets the answer "nothing new" and restores nothing,
    though the setting has been changed on the spot.

    It is the one item in the set that restores compliance of itself, with no person
    taking part. That is worth marking, changing as it does the way of working with
    the report: after its rollout, a non-compliance at an item driven by policy means
    either no policy or an ineffective one - not an ordinary departure somebody once
    put in.
