id: win2016-smartcard-removal-behavior

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyjęcie karty inteligentnej kończy albo blokuje sesję
    en: Taking out a smart card locks or ends the session
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, co dzieje się z sesją, gdy karta inteligentna użyta
    do zalogowania zostanie wyjęta z czytnika: sesja ma zostać zablokowana albo
    zakończona, zamiast trwać dalej.

    Bez tego ustawienia karta jest przepustką jednorazową. Otwiera sesję i od
    tej chwili przestaje mieć znaczenie — można ją wyjąć, schować do kieszeni
    i odejść, a sesja zostaje otwarta. Cały pomysł uwierzytelniania czymś, co
    się ma przy sobie, opiera się na tym, że obecność tej rzeczy jest warunkiem
    ciągłym. Tutaj przestaje nim być.

    Skutek jest odwrotny do zamierzonego. Organizacja wprowadza karty właśnie
    po to, żeby odejście od stanowiska kończyło dostęp — i po to, żeby nie
    polegać na tym, że ktoś pamięta o zablokowaniu ekranu. Bez tego ustawienia
    karta daje wygodę logowania bez hasła, ale nie daje niczego z tego, co było
    powodem jej wprowadzenia.

    Na serwerze karty pojawiają się tam, gdzie dostęp administracyjny wymaga
    drugiego składnika. Zostawiona w czytniku karta administratora domeny jest
    wtedy dokładnie tym, przed czym miała chronić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję otwartą
    kartą, która dawno opuściła budynek razem z jej właścicielem.
  en: |
    The setting decides what happens to the session when the smart card used to sign
    in is taken out of the reader: the session is to be locked or ended rather than
    to carry on.

    Without this setting the card is a one-time pass. It opens the session and from
    that moment ceases to matter - it can be taken out, put in a pocket and carried
    away, and the session stays open. The whole idea of authenticating with
    something one carries rests on the presence of that thing being a continuing
    condition. Here it stops being one.

    The effect is the opposite of the one intended. An organisation brings in cards
    precisely so that stepping away from a workstation ends access - and so as not
    to rely on somebody remembering to lock the screen. Without this setting the
    card gives the convenience of signing in without a password but gives none of
    what was the reason for bringing it in.

    On a server, cards appear where administrative access calls for a second factor.
    A domain administrator's card left in the reader is then exactly the thing it
    was meant to guard against.

    What an attacker gains while the item goes unmet: a session opened by a card
    that left the building long ago along with its owner.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", z jednym zastrzeżeniem, które trzeba przeczytać
    przed zaznaczeniem tej reguły do trybu zbiorczego.

    Zastrzeżenie brzmi tak: ustawienie nie robi nic na maszynie, na której
    nikt nie loguje się kartą. Jeżeli kart nie ma, zmiana jest zapisem wartości
    w rejestrze i niczym więcej. Reguła jest wtedy zgodna, ale bezużyteczna —
    i lepiej to powiedzieć, niż pozwolić jej udawać zabezpieczenie.

    Tam, gdzie karty są, wybieramy wariant łagodniejszy: zablokowanie sesji,
    a nie jej zakończenie. Różnica jest istotna w codziennej pracy. Blokada
    zostawia uruchomione programy i otwarte pliki, a powrót kosztuje tyle, co
    włożenie karty z powrotem. Zakończenie sesji zamyka wszystko — łącznie
    z niezapisanym dokumentem i trwającą operacją.

    Wyjmowanie karty na chwilę, żeby otworzyć nią drzwi albo użyć jej w innym
    czytniku, staje się po zmianie odczuwalne. Jest to przyzwyczajenie, które
    zmienia się w jeden dzień.

    Czego to nie psuje: logowania hasłem, sesji zdalnych bez karty, pracy usług
    ani zadań działających w tle.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", with one reservation that has to be read before
    this rule is marked for the bulk mode.

    The reservation runs thus: the setting does nothing on a machine where nobody
    signs in with a card. If there are no cards, the change is the writing of a
    value in the registry and nothing besides. The rule is then compliant but
    useless - and it is better to say so than to let it pretend to be a safeguard.

    Where cards are in use, the milder variant is chosen: locking the session rather
    than ending it. The difference matters in daily work. A lock leaves running
    programs and open files, and a return costs no more than putting the card back.
    Ending the session closes everything - an unsaved document and an operation in
    progress included.

    Taking the card out for a moment, to open a door with it or use it in another
    reader, becomes noticeable after the change. It is a habit that changes within a
    day.

    What this does not break: signing in with a password, remote sessions without a
    card, the working of services, or tasks running in the background.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Wyjęcie karty na chwilę — do drzwi albo do innego czytnika — blokuje sesję i wymaga włożenia jej z powrotem
      - Na maszynie bez czytników i bez kart zmiana nie robi nic poza zapisaniem wartości w rejestrze
      - Przy wariancie kończącym sesję zamiast blokującej przepada niezapisany dokument i trwająca operacja
      - Logowanie hasłem, sesje zdalne bez karty i zadania w tle pozostają bez zmian
    en:
      - Taking the card out for a moment - for a door or another reader - locks the session and calls for putting it back
      - On a machine with no readers and no cards the change does nothing beyond writing a value in the registry
      - Under the variant that ends the session rather than locks it, an unsaved document and an operation in progress are lost
      - Signing in with a password, remote sessions without a card and background tasks stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Karta służy jednocześnie jako przepustka do pomieszczeń i bywa wyjmowana kilkanaście razy dziennie
      - Czytnik jest znany z gubienia kontaktu z kartą, co system odczyta jako jej wyjęcie
    en:
      - The card serves at once as a pass to rooms and is taken out a dozen times a day
      - The reader is known for losing contact with the card, which the system will read as its removal
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'ScRemoveOption'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[123]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'ScRemoveOption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is text, not a number, despite looking like one - written as a
    # number it leaves an entry the system quietly ignores.
    # One stands for locking the session, the milder of the answers: the started
    # programs run on and a return takes only the card put back.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ScRemoveOption' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-smart-card-removal-behavior

notes:
  pl: |
    Audyt przyjmuje każdą odpowiedź poza „nie rób nic": zablokowanie,
    zakończenie sesji i rozłączenie od niej. Wszystkie trzy zamykają sesję po
    zniknięciu karty, a wybór między nimi jest decyzją organizacji, nie
    przedmiotem tej reguły.

    Warto czytać ten punkt razem z regułą o blokadzie ekranu po bezczynności.
    Obie zamykają sesję pozostawioną bez opieki, tylko z innego powodu: jedna
    po czasie, druga po zdarzeniu. Maszyna z kartami potrzebuje obu, bo karta
    zapomniana w czytniku jest sytuacją równie częstą jak karta zabrana.

    Na maszynie bez kart reguła jest zgodna i bezużyteczna jednocześnie.
    Raport powinien to rozróżniać, zamiast liczyć ją jako wygraną.
  en: |
    The audit accepts every answer but "take no action": locking, ending the session
    and parting from it. All three shut the session once the card is gone, and the
    choice among them is the organisation's decision, not the subject of this rule.

    The item is worth reading together with the rule on locking the screen after
    inactivity. Both shut a session left unattended, only for a different reason:
    one after a time, the other after an event. A machine with cards needs both,
    since a card forgotten in the reader is as common a situation as a card taken
    away.

    On a machine without cards the rule is compliant and useless at once. The report
    should tell that apart rather than counting it as a win.
