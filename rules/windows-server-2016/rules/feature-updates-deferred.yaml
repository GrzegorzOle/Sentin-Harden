id: win2016-feature-updates-deferred

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Aktualizacje funkcji opóźnione o co najmniej 180 dni
    en: Feature updates put off by at least 180 days
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odkłada aktualizacje funkcji o wskazaną liczbę dni.
    Wymagane minimum to sto osiemdziesiąt.

    Jest to jedyna reguła w całym zestawie, która każe czegoś nie robić od
    razu — i dlatego warto powiedzieć, czemu służy, zamiast zostawiać ją
    jako wyjątek bez wyjaśnienia.

    Aktualizacja funkcji podnosi wersję systemu. Zmienia sposób działania
    składników, wymienia sterowniki, bywa że usuwa mechanizmy uznane za
    przestarzałe. Na serwerze zmiana taka dotyka wszystkiego, co na nim
    stoi, i nie każde oprogramowanie jest na nią gotowe w dniu wydania.

    Wartość dla bezpieczeństwa jest tu pośrednia i niska, co odzwierciedla
    kategoria. Punkt nie zamyka żadnej drogi ataku. Broni przed czymś
    innym: przed maszyną, która po samoczynnej zmianie wersji przestaje
    działać albo traci zgodność z tym, co na niej pracuje — a maszyna
    niedziałająca bywa naprawiana pośpiesznie i wtedy utwardzenie schodzi
    na drugi plan.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Wartość reguły leży w przewidywalności, nie w obronie.
  en: |
    The setting puts feature updates off by a named number of days. The required
    minimum is one hundred and eighty.

    This is the only rule in the whole set telling the machine not to do something
    at once - and so it is worth saying what it serves, rather than leaving it as an
    exception unexplained.

    A feature update raises the system's version. It changes how components work,
    replaces drivers, and at times removes mechanisms reckoned outdated. On a server
    such a change touches everything standing on it, and not every piece of software
    is ready for it on the day of release.

    The value to security is indirect here and low, as the category reflects. The
    item shuts no road of attack. It guards against something else: against a
    machine that, after a version change happening by itself, stops working or loses
    compatibility with what runs on it - and a machine that does not work gets
    mended in haste, and then hardening falls to second place.

    What an attacker gains while the item goes unmet: nothing directly. The rule's
    value lies in predictability rather than in defence.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy sto osiemdziesiąt
    dni mieści się w okresie wsparcia wydania, na którym maszyna stoi.

    Jest to jedyny realny kłopot z tą regułą i warto go postawić wprost.
    Opóźnienie zbyt długie prowadzi do maszyny stojącej na wydaniu, które
    przestało być serwisowane — a wtedy nie przychodzą już żadne poprawki,
    również te jakości. Skutek jest dokładnie odwrotny do zamierzonego.

    Rzecz druga dotyczy zgodności w drugą stronę. Dostawca oprogramowania
    pracującego na maszynie bywa gotowy na nową wersję systemu wcześniej
    niż po pół roku i wtedy opóźnienie nic nie wnosi, a odsuwa poprawki
    dostępne wyłącznie w wydaniu nowszym.

    Rzecz trzecia: liczba dni liczy się od wydania, nie od wdrożenia
    zasady. Ustawienie jej na maszynie, na której nowe wydanie już czeka,
    nie cofa niczego — wydanie przyjdzie tym wcześniej, im dawniej zostało
    opublikowane.

    Uwaga o dobraniu liczby dni do okresu wsparcia siedzi w poleceniu
    naprawczym.

    Czego to nie psuje: poprawek jakości, usług, logowania, sieci,
    harmonogramu instalacji.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether one hundred
    and eighty days fits within the support period of the release the machine stands
    on.

    That is the only real trouble with this rule, and it is worth putting outright.
    Too long a delay leads to a machine standing on a release that has stopped being
    serviced - and then no fixes come at all, quality ones among them. The
    consequence is exactly the opposite of the one intended.

    The second thing concerns compatibility the other way. The supplier of software
    working on the machine is at times ready for a new version of the system sooner
    than in half a year, and then the delay brings nothing while putting off fixes
    available only in a newer release.

    The third: the number of days counts from the release, not from the rolling out
    of the policy. Setting it on a machine where a new release already waits undoes
    nothing - the release will come the sooner the longer ago it was published.

    The remark about matching the number of days to the support period sits in the
    remedial command.

    What this does not break: quality fixes, services, signing in, the network, or
    the schedule of installing.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Opóźnienie zbyt długie zostawia maszynę na wydaniu, które przestało być serwisowane, a wtedy nie przychodzą już żadne poprawki
      - Poprawki dostępne wyłącznie w wydaniu nowszym są odsuwane razem z samą zmianą wersji
      - Liczba dni liczy się od wydania, a nie od wdrożenia zasady, więc wydanie już opublikowane przyjdzie wcześniej
      - Poprawki jakości, usługi, logowanie i harmonogram instalacji pozostają bez zmian
    en:
      - Too long a delay leaves the machine on a release that has stopped being serviced, and then no fixes come at all
      - Fixes available only in a newer release are put off along with the version change itself
      - The number of days counts from the release rather than from the rolling out of the policy, so a release already published will come sooner
      - Quality fixes, services, signing in and the schedule of installing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wydanie, na którym stoi maszyna, kończy okres wsparcia wcześniej niż po stu osiemdziesięciu dniach od kolejnego wydania
      - Dostawca oprogramowania pracującego na maszynie wymaga wersji systemu dostępnej wyłącznie w wydaniu nowszym
    en:
      - The release the machine stands on ends its support period sooner than one hundred and eighty days from the next release
      - The supplier of software working on the machine requires a version of the system available only in a newer release
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch and the number of days.
      # The switch set without a long enough delay is reported apart,
      # because it is the number that settles the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DeferFeatureUpdates'
        $days = $item.'DeferFeatureUpdatesPeriodInDays'
        if ($null -eq $switch -or $null -eq $days) { 'MISSING' }
        elseif ([int]$switch -ne 1) { 'NOT_SET' }
        elseif ([int]$days -lt 180) { 'BELOW_MINIMUM ' + [int]$days }
        else { 'AT_OR_ABOVE_MINIMUM' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AT_OR_ABOVE_MINIMUM'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path           = $path
      key_existed    = (Test-Path -Path $path)
      switch         = $item.'DeferFeatureUpdates'
      switch_existed = ($null -ne $item.'DeferFeatureUpdates')
      days           = $item.'DeferFeatureUpdatesPeriodInDays'
      days_existed   = ($null -ne $item.'DeferFeatureUpdatesPeriodInDays')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Pick the number of days to match the supplier's support period for what runs
    # on this machine. Too long a delay leaves a release that stops being
    # serviced.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdates' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdatesPeriodInDays' -Value 180 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -ErrorAction SilentlyContinue
    }
    if ($b.days_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -Value $b.days -Type DWord
    } else {
      # Only these two values are removed. The key holds unrelated update settings
      # and stays.
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Punkt zamyka blok o aktualizacjach i stoi w nim osobno, bo jako jedyny
    opóźnia zamiast przyspieszać. Warto pokazywać go obok reguły
    o poprawkach jakości, żeby różnica między dwoma rodzajami aktualizacji
    była widoczna od razu — bez niej ten punkt wygląda na zaprzeczenie
    tamtego.

    Kategoria niska jest tu świadoma i nie oznacza, że punkt nie ma
    znaczenia. Oznacza, że jego wartość leży w utrzymaniu maszyny
    w stanie przewidywalnym, a nie w odebraniu czegoś napastnikowi.
    Mieszanie tych dwóch rzeczy sprawia, że lista przestaje pomagać
    w ustalaniu kolejności.

    Liczba stu osiemdziesięciu dni nie jest tu wartością świętą. Właściwą
    liczbą jest taka, która mieści się w okresie wsparcia wydania i daje
    dostawcom oprogramowania czas na przygotowanie. Audyt sprawdza minimum,
    a nie równość, właśnie po to, żeby liczba wyższa nie była zgłaszana
    jako niezgodność.
  en: |
    The item shuts the block about updates and stands apart in it, being the only
    one that puts off rather than hastens. It is worth showing beside the rule about
    quality fixes, so that the difference between the two kinds of update shows at
    once - without it this item looks like a denial of that one.

    The low category here is deliberate and does not mean the item is of no account.
    It means its value lies in keeping the machine in a predictable state rather
    than in taking something from an attacker. Mixing those two things makes the
    list stop helping to settle an order of work.

    The number of one hundred and eighty days is no sacred value here. The proper
    number is one fitting within the release's support period and giving software
    suppliers time to prepare. The audit checks a minimum rather than an equality,
    precisely so that a higher number is not reported as a non-compliance.
