id: win11-rdp-temp-folders-per-session

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary Folders
  title:
    pl: Osobny folder tymczasowy dla każdej sesji zdalnej
    en: A separate temporary folder for each remote session
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Sesje pulpitu zdalnego mogą dzielić jeden katalog na pliki tymczasowe albo
    dostawać po jednym każda. Różnica ujawnia się dopiero wtedy, gdy na maszynie
    pracuje więcej niż jedna osoba.

    We wspólnym katalogu pliki tymczasowe jednej sesji leżą obok plików drugiej.
    Trafiają tam otwierane załączniki, podglądy dokumentów i pliki rozpakowane
    z archiwów, czyli treść, a nie nazwy. Użytkownik jednej sesji ma wtedy
    dostęp do materiałów kogoś, kto pracuje obok — nie dlatego, że złamał
    uprawnienia, tylko dlatego, że system położył te pliki we wspólnym miejscu.

    Rozdzielenie katalogów przywraca stan, w którym sesja widzi wyłącznie to, co
    sama odłożyła.
  en: |
    Remote desktop sessions can share one directory for temporary files, or each
    get one of its own. The difference shows only once more than one person works
    on the machine.

    In a shared directory one session's temporary files lie next to another's.
    Into it go attachments being opened, document previews and files unpacked from
    archives - that is, contents, not names. A user in one session then has access
    to the material of somebody working alongside - not because they broke any
    permission, but because the system put those files in a common place.

    Separating the directories restores a state in which a session sees only what
    it put there itself.

disruption_description:
  pl: |
    Nic nie przestaje działać. Każda sesja dostaje własny katalog tymczasowy.

    Jedynym mierzalnym skutkiem jest miejsce na dysku: przy wielu sesjach naraz
    katalogów jest tyle, ile sesji, zamiast jednego. Przy włączonym kasowaniu po
    zakończeniu sesji różnica jest znikoma, bo katalogi znikają razem z sesjami.

    Na stanowisku używanym przez jedną osobę zmiana nie robi zupełnie nic —
    sesja i tak jest jedna. Punkt ma znaczenie tam, gdzie z maszyny korzysta
    zdalnie kilka osób.

    Nie ma restartu ani wylogowania, a zmiana dotyczy sesji zakładanych po jej
    wprowadzeniu.
  en: |
    Nothing stops working. Each session gets a temporary directory of its own.

    The only measurable effect is disk space: with several sessions at once there
    are as many directories as sessions instead of one. With deletion on exit
    turned on the difference is negligible, because the directories disappear along
    with the sessions.

    On a station used by one person the change does absolutely nothing - there is
    one session anyway. The item matters where several people use the machine
    remotely.

    There is no restart and no sign-out, and the change concerns sessions started
    after it is made.

implementation_consequences:
  impact_areas:
    - remote-desktop
  what_breaks:
    pl:
      - Przy wielu sesjach naraz katalogów tymczasowych jest tyle, ile sesji, więc rośnie zużycie dysku
    en:
      - With several sessions at once there are as many temporary directories as sessions, so disk use rises
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'PerSessionTempDir'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'PerSessionTempDir'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PerSessionTempDir' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-rdsh-security

notes:
  pl: |
    Tak jak przy kasowaniu katalogów, zasada jest w szablonach zapisana przez
    zaprzeczenie i wartość jeden oznacza tu rozdzielenie katalogów, a nie ich
    połączenie.

    Punkt jest na stanowisku jednoosobowym praktycznie bez znaczenia i to jest
    uczciwe do powiedzenia — ale wdrożenie kosztuje zero, a maszyna bywa
    przeznaczeniem zmieniana. Reguła, która na tej maszynie nic nie robi dzisiaj,
    jutro robi wszystko, gdy ktoś udostępni ją drugiej osobie.
  en: |
    As with deleting the directories, the policy is written in the templates by
    negation, and a value of one means separating the directories here rather than
    joining them.

    On a single-person station the item is practically meaningless and that is
    fair to say - but applying it costs nothing, and a machine's purpose sometimes
    changes. A rule that does nothing on this machine today does everything
    tomorrow, once somebody shares it with a second person.
