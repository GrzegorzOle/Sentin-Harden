id: win11-defender-asr-email-executable-content

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania plików wykonywalnych z poczty
    en: Executable content from email blocked from running
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła nie pozwala uruchomić pliku wykonywalnego ani skryptu, który przyszedł
    jako załącznik — z programu pocztowego albo z poczty otwieranej w
    przeglądarce. Dotyczy uruchomienia, nie odebrania: wiadomość przychodzi,
    załącznik daje się zapisać, nie daje się wystartować.

    Wartość tego punktu bierze się stąd, że poczta jest drogą wejścia, której
    nie da się zamknąć — maszyna ma odbierać wiadomości od nieznajomych i to jest
    jej zadanie. Reguła zdejmuje z użytkownika ciężar rozstrzygnięcia, czy
    tym razem załącznik jest w porządku, w sytuacji, w której rozstrzygnięcie to
    bywa trudne także dla kogoś przygotowanego.
  en: |
    The rule does not allow an executable or a script that arrived as an
    attachment to run - whether from a mail client or from webmail opened in a
    browser. It covers running, not receiving: the message arrives, the attachment
    can be saved, it cannot be started.

    The value of the item comes from email being an entry route that cannot be
    closed - the machine is supposed to receive messages from strangers, that is
    its job. The rule takes off the user the burden of deciding whether this time
    the attachment is fine, in a situation where that decision is hard even for
    somebody prepared for it.

disruption_description:
  pl: |
    Zaboli tam, gdzie oprogramowanie rozsyła się pocztą. Dzieje się tak częściej,
    niż się przyznaje: dostawca przysyła aktualizację narzędzia jako załącznik,
    dział wysyła współpracownikom plik wsadowy z instrukcją „uruchom u siebie",
    ktoś przesyła sobie narzędzie na drugą maszynę, bo tak szybciej niż przez
    udział sieciowy.

    Objaw jest tu czytelniejszy niż przy pozostałych regułach z tej grupy —
    użytkownik klika załącznik i nic się nie uruchamia — ale przyczyna nadal nie
    jest podana wprost, więc zgłoszenie będzie brzmiało „nie mogę otworzyć pliku
    od dostawcy".

    Droga wyjścia istnieje i nie wymaga wyłączania reguły: plik przełożony
    na udział sieciowy albo do repozytorium oprogramowania uruchamia się
    normalnie, bo blokada dotyczy pochodzenia z poczty, nie samego pliku.
  en: |
    It hurts where software is distributed by email. That happens more often than
    is admitted: a supplier sends a tool update as an attachment, a department
    sends colleagues a batch file with "run this on your machine", somebody mails
    themselves a tool to reach a second machine, because it is quicker than going
    through a share.

    The symptom here is clearer than with the other rules in the group - the user
    clicks the attachment and nothing starts - but the cause is still not stated
    outright, so the report will read "I cannot open the file from the supplier".

    A way out exists and does not require turning the rule off: a file moved to a
    share or to a software repository runs normally, because the block is on
    coming from email, not on the file itself.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - scripting-and-automation
  what_breaks:
    pl:
      - Załączniki będące programem albo skryptem nie uruchomią się wprost z poczty
      - Aktualizacje narzędzi przysyłane przez dostawców pocztą wymagają przełożenia pliku poza pocztę
      - Zgłoszenie użytkownika wskaże na uszkodzony plik, a nie na blokadę
    en:
      - Attachments that are a program or a script do not run straight from email
      - Tool updates sent by suppliers as attachments require moving the file out of email first
      - The user's report points at a broken file rather than at a block
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Narzędzia i aktualizacje są w tej organizacji rozprowadzane pocztą i nie ma innej drogi
      - Praca części osób opiera się na skryptach przysyłanych przez podmioty zewnętrzne
    en:
      - Tools and updates are distributed by email in this organisation and there is no other route
      - Some people's work relies on scripts sent in by outside parties
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Blokada obejmuje pliki wykonywalne i skrypty, a nie dokumenty — załącznik
    z arkuszem otworzy się normalnie i to jego makra rozstrzygają pozostałe
    reguły z tej grupy. Warto to w interfejsie powiedzieć wprost, bo nazwa punktu
    sugeruje szerszy zakres, niż ma w rzeczywistości.
  en: |
    The block covers executables and scripts, not documents - a spreadsheet
    attachment opens normally and its macros are the business of the other rules
    in this group. Worth saying outright in the interface, because the item's name
    suggests a wider scope than it actually has.
