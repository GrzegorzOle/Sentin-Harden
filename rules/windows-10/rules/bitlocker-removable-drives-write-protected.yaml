id: win10-bitlocker-removable-drives-write-protected

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na niezaszyfrowanych nośnikach wymiennych zabroniony
    en: Writing to unencrypted removable media forbidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zapisu na nośnikach wymiennych, które nie są
    zaszyfrowane.

    Jest to w całej rodzinie punkt o najszerszym zasięgu praktycznym,
    bo nośnik wymienny jest jedynym, który wychodzi z budynku w kieszeni.
    Dysk stały kradnie się razem z maszyną; pamięć przenośną gubi się
    w pociągu, zostawia w wypożyczonym samochodzie i wkłada do cudzego
    komputera, żeby coś wydrukować.

    Każde z tych zdarzeń kończy się tak samo, jeżeli nośnik nie był
    zaszyfrowany: dane leżą otworem dla każdego, kto go podniesie.
    Nie potrzeba tu żadnej wiedzy ani narzędzia — wystarczy wsunąć.

    Zabronienie zapisu odwraca układ. Odczyt z nośnika niezaszyfrowanego
    pozostaje możliwy, więc przyniesione materiały dają się otworzyć, ale
    nic własnego na taki nośnik nie trafi. Kto chce wynieść dane, musi
    najpierw założyć ochronę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dane wyniesione
    poza budynek na nośniku, który wystarczy podnieść i wsunąć.
  en: |
    The setting forbids the writing to removable media that are not enciphered.

    It is of the whole family the item of the widest practical reach, a removable medium being the only one that
    leaves the building in a pocket. A fixed drive is stolen together with its machine; a travelling memory is
    lost upon a train, left in a hired car and put into somebody else's computer to get something printed.

    Each of those endings comes out the same where the medium was not enciphered: the data lie open to whoever
    picks it up. No knowledge is needed here and no tool - it is enough to push it in.

    The forbidding of writing turns the arrangement about. Reading from an unenciphered medium stays possible, so
    brought materials may be opened, but nothing of one's own will go onto such a medium. Whoever would carry data
    out has first to lay the guarding on.

    What an attacker gains while the item goes unmet: data carried outside the building upon a medium it is enough
    to pick up and push in.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo skutek jest natychmiastowy,
    powszechny i trafia w ludzi, nie w usługi.

    Od chwili zapisania wartości każda pamięć przenośna bez szyfrowania
    staje się tylko do odczytu. Dotyczy to również nośników cudzych:
    pamięci przyniesionej przez kontrahenta, karty z aparatu, dysku
    przyniesionego przez serwis. Skopiowanie czegokolwiek na taki nośnik
    przestaje być możliwe.

    Skutek ten jest odczuwalny w konkretnych sytuacjach, które warto
    przewidzieć. Przekazanie materiałów komuś z zewnątrz, zgranie logów
    z maszyny bez sieci, wyniesienie kopii na spotkanie u klienta,
    zgranie zdjęć z karty pamięci — wszystko to wymaga teraz nośnika
    zaszyfrowanego, a nośnik zaszyfrowany otworzy się nie wszędzie.

    Odnotowuję związek z punktem o odblokowywaniu hasłem. Jeżeli oba są
    wdrożone, nośnik wyniesiony na zewnątrz nie otworzy się u odbiorcy bez
    klucza odzyskiwania. Jest to zamierzone, ale trzeba to powiedzieć
    ludziom wprost, zanim zaczną wynosić nośniki, których nikt nie umie
    otworzyć.

    Czego to nie psuje: odczytu z nośników niezaszyfrowanych, pracy na
    dyskach stałych, logowania, drukowania, udziałów plikowych.
  en: |
    The class is "needs a planned rollout", the consequence being at once, widespread and falling upon people and
    not upon services.

    From the hour the value is written every travelling memory without enciphering becomes readable only. That
    touches likewise media belonging to others: a memory brought by a contractor, a card out of a camera, a drive
    brought by a workshop. The copying of anything at all onto such a medium ceases to be possible.

    That consequence is felt in particular cases worth foreseeing. The handing of materials to somebody outside,
    the taking of logs off a machine without a network, the carrying of a copy to a meeting at a client's, the
    taking of pictures off a card - all of those now call for an enciphered medium, and an enciphered medium will
    not open everywhere.

    I set down the tie to the item about unlocking with a password. Where both are rolled out, a medium carried
    outside will not open at the receiver's without a key of recovery. It is meant, but it has to be said to
    people outright before they begin to carry media out that nobody can open.

    What this does not break: reading from unenciphered media, work upon fixed drives, logging on, printing, or
    file shares.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Każda pamięć przenośna bez szyfrowania staje się tylko do odczytu od chwili zapisania wartości
      - Dotyczy to też nośników cudzych — pamięci kontrahenta, karty z aparatu, dysku przyniesionego przez serwis
      - Przekazanie materiałów na zewnątrz i zgranie logów z maszyny bez sieci wymagają teraz nośnika zaszyfrowanego
      - Nośnik zaszyfrowany nie otworzy się u odbiorcy, jeżeli wdrożono także zakaz odblokowywania hasłem
      - Odczyt z nośników niezaszyfrowanych, praca na dyskach stałych, logowanie i drukowanie pozostają bez zmian
    en:
      - Every travelling memory without enciphering becomes readable only from the hour the value is written
      - That touches media belonging to others too - a contractor s memory, a card out of a camera, a drive brought by a workshop
      - The handing of materials outside and the taking of logs off a machine without a network now call for an enciphered medium
      - An enciphered medium will not open at the receiver s where the forbidding of a password was rolled out as well
      - Reading from unenciphered media, work upon fixed drives, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki wymienne są podstawową drogą przekazywania materiałów na zewnątrz, gdzie nikt nie otworzy nośnika chronionego
      - Na maszynie zgrywa się dane z kart pamięci urządzeń, które nie potrafią ich zaszyfrować
    en:
      - Removable media are the main road for handing materials outside, where nobody will open a guarded medium
      - Upon the machine data are taken off the cards of apparatus that cannot encipher them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
      $name = 'RDVDenyWriteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    $name = 'RDVDenyWriteAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value sits under the system hive, not under the policy hive where most of
    # this family lives - a difference easy to pass over when checking.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyWriteAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest odpowiednikiem punktu o dyskach stałych, ale jej skutek
    jest szerszy i szybciej zauważalny. Warto, żeby aplikacja pokazała je
    obok siebie, a przy tej postawiła ostrzeżenie wyżej.

    Argument wart postawienia wprost dotyczy tego, czym nośnik wymienny
    różni się od każdego innego. Nie chroni go budynek, drzwi ani czyjakolwiek
    uwaga — wychodzi na zewnątrz z założenia, bo po to istnieje. Ochrona
    zależna od miejsca nie obejmuje go nigdy, a ochrona zapisana na nim
    samym obejmuje go wszędzie.

    Odnotowuję położenie wartości w rejestrze, bo odbiega od reszty
    rodziny. Leży pod gałęzią systemową, nie pod gałęzią zasad, tak samo
    jak odpowiednik dla dysków stałych — i tak samo bywa przy sprawdzaniu
    pomijana.
  en: |
    The rule is the counterpart of the item about fixed drives, but its consequence is wider and the sooner
    marked. It is well that the application show them beside one another, and set the warning higher at this one.

    The argument worth putting outright touches how a removable medium differs from every other. No building
    guards it, no door and nobody's watching - it goes outside by design, that being what it is for. A guarding
    that hangs upon a place never takes it in, and a guarding written upon the medium itself takes it in
    everywhere.

    I set down where the value lies in the registry, it standing apart from the rest of the family. It lies under
    the system hive and not under the hive of policies, as with its counterpart for fixed drives - and as with
    that one it is at times passed over when checking.
