id: win2016-rdp-disconnected-session-limit

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits
  title:
    pl: Rozłączona sesja pulpitu zdalnego kończona po minucie
    en: A disconnected remote desktop session ended after a minute
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyznacza czas, po jakim serwer kończy sesję zdalną, z której
    ktoś się rozłączył bez wylogowania.

    Rozłączenie a wylogowanie to dwie różne rzeczy i na tej różnicy stoi cały
    punkt. Zamknięcie okna klienta, zerwanie łącza, zamknięcie pokrywy
    laptopa — każde z nich kończy połączenie, ale nie kończy sesji. Sesja
    zostaje na serwerze w stanie działającym: z otwartymi programami,
    z konsolą zarządzania, z zalogowanym kontem.

    Konto zalogowane znaczy tu więcej, niż brzmi. Poświadczenie tego konta
    zostaje w pamięci maszyny tak długo, jak długo trwa sesja, a tam sięga
    po nie każdy, kto zdobędzie na serwerze uprawnienia wysokie. Sesja
    porzucona miesiąc temu przez osobę, która o niej zapomniała, jest
    miesiącem, przez który to poświadczenie leżało do wzięcia.

    Druga strona jest prostsza i równie ważna. Sesja rozłączona wciąż
    działa, więc wszystko, co w niej uruchomiono, działa dalej — łącznie
    z narzędziami otwartymi na chwilę i nigdy niezamkniętymi. Kto przejmie
    taką sesję, nie musi niczego uruchamiać ani uwierzytelniać; zastaje
    gotowe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poświadczenia
    kont porzuconych sesji, leżące w pamięci maszyny bez ograniczenia czasu,
    oraz gotowe do przejęcia środowisko pracy.
  en: |
    The setting marks the time after which the server ends a remote session somebody
    disconnected from without signing out.

    Disconnecting and signing out are two different things, and the whole item rests
    on that difference. Closing the client window, a broken link, the shutting of a
    laptop lid - each of these ends the connection but does not end the session. The
    session stays on the server in a running state: with its programs open, with a
    management console, with an account signed in.

    A signed-in account means more here than it sounds. That account's credential
    stays in the machine's memory for as long as the session lasts, and there it is
    reached for by anybody gaining high privileges on the server. A session
    abandoned a month ago by somebody who forgot about it is a month during which
    that credential lay there for the taking.

    The other side is simpler and just as important. A disconnected session still
    runs, so everything started inside it runs on - tools opened for a moment and
    never closed included. Whoever takes such a session over need start nothing and
    authenticate to nothing; they find it ready.

    What an attacker gains while the item goes unmet: the credentials of the
    accounts of abandoned sessions, lying in the machine's memory with no limit of
    time, and a working environment ready to be taken over.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód leży w tym, co zostaje
    przerwane w połowie.

    Minuta jest krótka celowo, ale bywa krótsza niż przerwa w łączu. Kto
    pracuje przez łącze niestabilne albo przez sieć komórkową, rozłącza się
    mimowolnie kilka razy dziennie i wraca do tej samej sesji. Po zmianie
    wróci do świeżej, a to co robił, zostanie zamknięte bez zapisu.

    Najcięższe są jednak zadania długo trwające, uruchamiane z sesji
    i zostawiane na noc: kopie, importy, kompilacje, migracje danych.
    Wszystkie kończą się razem z sesją, i to bez ostrzeżenia. Jest to
    klasyczny błąd wdrożeniowy: reguła wchodzi w piątek, a w poniedziałek
    okazuje się, że weekendowa kopia nie doszła do końca.

    Droga zastępcza istnieje i trzeba ją wskazać przed zmianą, nie po.
    Zadania długie uruchamia się mechanizmem niezwiązanym z sesją —
    harmonogramem albo usługą — i wtedy koniec sesji nie ma na nie wpływu.
    Dopóki jednak ktoś uruchamia je z otwartego okna, zmiana je zabija.

    Objaw jest widoczny i mylący zarazem: człowiek wraca do pracy i zastaje
    czysty pulpit zamiast tego, co zostawił. Wygląda to na utratę danych,
    choć jest zaplanowanym zakończeniem sesji.

    Czego to nie psuje: sesji aktywnych, konsoli lokalnej, zadań
    harmonogramu, usług działających poza sesją.

    Bez restartu, natychmiast odwracalne — ale skutek dotyka każdego, kto
    rozłączy się po zmianie.
  en: |
    The class is "needs a planned rollout", and the reason lies in what gets
    interrupted halfway.

    A minute is short deliberately, but it is at times shorter than a break in the
    link. Whoever works over an unstable link or over a mobile network disconnects
    unwillingly several times a day and comes back to the same session. After the
    change they will come back to a fresh one, and what they were doing will be
    closed unsaved.

    The heaviest, though, are long running jobs started from a session and left for
    the night: backups, imports, builds, data migrations. All of them end along with
    the session, and without warning. It is the classic rollout mistake: the rule
    goes in on a Friday and on Monday it turns out the weekend backup never
    finished.

    A substitute road exists and has to be named before the change rather than
    after. Long jobs are started by a mechanism unconnected with the session - a
    scheduler or a service - and then the end of the session has no bearing on them.
    As long as somebody starts them from an open window, though, the change kills
    them.

    The symptom is visible and misleading at once: a person comes back to their work
    and finds a clean desktop instead of what they left. It looks like a loss of
    data, though it is a planned ending of a session.

    What this does not break: active sessions, the local console, scheduled tasks,
    or services running outside a session.

    No restart, undone immediately - but the effect touches everybody who
    disconnects after the change.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Zadanie długo trwające uruchomione z sesji i zostawione na noc zostaje przerwane razem z sesją, bez ostrzeżenia
      - Praca przez łącze niestabilne albo sieć komórkową kończy się powrotem do świeżej sesji zamiast do porzuconej
      - Niezapisane dokumenty i otwarte narzędzia zostają zamknięte bez pytania, co wygląda na utratę danych
      - Sesje aktywne, konsola lokalna, zadania harmonogramu i usługi działające poza sesją pozostają bez zmian
    en:
      - A long running job started from a session and left for the night is broken off along with the session, without warning
      - Work over an unstable link or a mobile network ends in a return to a fresh session rather than to the abandoned one
      - Unsaved documents and open tools are closed unasked, which looks like a loss of data
      - Active sessions, the local console, scheduled tasks and services running outside a session stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z sesji zdalnych na tej maszynie uruchamiane są zadania długo trwające i nie przeniesiono ich do harmonogramu ani do usługi
      - Praca na tej maszynie odbywa się przez łącza niestabilne, a minuta jest krótsza niż typowa przerwa w połączeniu
    en:
      - Long running jobs are started from remote sessions on this machine and have not been moved to a scheduler or a service
      - Work on this machine is done over unstable links and a minute is shorter than a typical break in the connection
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it is the absence of a limit, not the
      # shortest one. Reported apart, so a report cannot read it as a very strict
      # setting.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'MaxDisconnectionTime'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_LIMIT' }
        elseif ([int]$value -le 60000) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'MaxDisconnectionTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxDisconnectionTime' -Value 60000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Audyt rozróżnia trzy stany zamiast dwóch i jest to rozróżnienie celowe.
    Zero nie znaczy tu „najkrótszy limit", tylko „brak limitu" — czyli stan
    przeciwny do zamierzonego. Raport, który wyświetliłby zero jako wartość
    bardzo surową, wprowadzałby czytelnika w błąd, więc reguła zwraca go
    osobno.

    Wartość przekroczoną reguła też podaje wprost, razem z liczbą. Różnica
    między dwiema minutami a dwiema dobami jest dla decyzji istotna, a samo
    „niezgodne" jej nie niesie.

    Punkt idzie w parze z limitem bezczynności i razem porządkują to samo
    zjawisko z dwóch stron: ta dotyczy sesji, z której ktoś odszedł
    rozłączając się, tamta — sesji, przy której ktoś siedzi, ale nic nie
    robi. Wdrażać warto obie naraz, bo każda osobno zostawia drugą drogę
    otwartą.
  en: |
    The audit tells three states apart rather than two, and that is deliberate. Zero
    does not mean "the shortest limit" here but "no limit" - which is to say the
    state opposite to the one intended. A report showing zero as a very strict value
    would mislead the reader, so the rule returns it apart.

    An exceeded value is likewise given outright, with its number. The difference
    between two minutes and two days matters to the decision, and a bare
    "non-compliant" does not carry it.

    The item goes in a pair with the idle limit and together they put order into the
    same thing from two sides: this one concerns a session somebody left by
    disconnecting, that one a session somebody sits at while doing nothing. Both are
    worth rolling out together, since each alone leaves the other road open.
