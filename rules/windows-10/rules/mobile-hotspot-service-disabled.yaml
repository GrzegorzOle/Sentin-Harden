id: win10-mobile-hotspot-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia jako punkt dostępowy wyłączona
    en: The service serving out the joining as a point of entry switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę zamieniającą maszynę w bezprzewodowy punkt
    dostępowy, do którego podłączają się inne urządzenia.

    Mechanizm ten jest wygodny i dostępny jednym przełącznikiem w oknie
    ustawień. Użytkownik włącza go bez świadomości, że uruchamia na
    maszynie punkt dostępowy widoczny dla wszystkich w zasięgu.

    Zagrożenie leży w tym, czym maszyna wtedy się staje. Ogłasza własną
    sieć, przyjmuje urządzenia, rozdaje im adresy i przepuszcza ich ruch
    do sieci, w której sama stoi. Urządzenie, które nigdy nie dostałoby
    dostępu do sieci firmowej, dostaje go przez stanowisko pracownika.

    Drugim skutkiem jest to, że sieć taka bywa zabezpieczona słabo.
    Hasło jest krótkie, bo ma być podyktowane przez telefon, i bywa to
    samo od miesięcy.

    Odnotowuję, że punkt dostępowy bywa włączony i zapomniany. Działa
    dalej po powrocie do biura, bo nikt go nie wyłącza — przełącznik
    zniknął z pola widzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sieć
    bezprzewodową prowadzącą do sieci, w której stoi to stanowisko.
  en: |
    The setting switches off the service turning the machine into a point of entry without wires, to which other
    devices join themselves.

    That mechanism is handy and to be had at one switch in a window of settings. The user turns it on without
    knowing that they set going upon the machine a point of entry seen by everybody within reach.

    The danger lies in what the machine then becomes. It puts out a network of its own, takes devices in, hands
    them addresses and lets their traffic through into the network it stands in itself. A device that would never
    have got a reach of the firm's network gets it through a worker's station.

    The second upshot is that such a network is at times weakly guarded. The word of passing is short, being meant
    to be dictated over a telephone, and is at times the same for months.

    I set down that a point of entry is at times turned on and forgotten. It works on after the return to the
    office, nobody switching it off - the switch has gone out of sight.

    What an attacker gains while the item goes unmet: a network without wires leading into the network this
    station stands in.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś korzysta z tego mechanizmu w terenie.

    Miejscem wartym uwagi są stanowiska przenośne używane w podróży.
    Punkt dostępowy z maszyny bywa tam sposobem na podłączenie telefonu
    albo drugiej maszyny do jedynego dostępnego łącza.

    Odnotowuję, że skutek jest natychmiastowy i widoczny: urządzenia
    podłączone do punktu dostępowego tracą łączność w chwili zatrzymania
    usługi. Warto wybrać moment, w którym nikt z niego nie korzysta.

    Miejscem drugim są pokazy i szkolenia, na których jedna maszyna
    udostępnia łącze pozostałym. Zdarza się to poza biurem i bywa
    zaplanowane z wyprzedzeniem.

    Zastrzegam, że usługa ta jest wspólna z mechanizmem udostępniania
    połączenia. Oba punkty dotyczą tej samej warstwy, opisanej z dwóch
    stron.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: własnego dostępu maszyny do sieci bezprzewodowej,
    internetu, udziałów, pulpitu zdalnego, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody uses that mechanism in the field.

    The place worth notice is stations to be carried about, used upon journeys. A point of entry out of the
    machine is there at times the way of putting a telephone or a second machine onto the one link to be had.

    I set down that the consequence is at once and to be seen: devices hanging upon the point of entry lose their
    joining at the hour the service is stopped. It is well to choose an hour when nobody is using it.

    The second place is showings and teachings, where one machine serves the link out to the rest. That happens
    outside the office and is at times planned beforehand.

    I set down that this service is held in common with the mechanism of the serving out of the joining. Both
    items touch that same layer, set out from two sides.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the machine's own reach of the network without wires, the internet, shares, the desk
    from afar, logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Urządzenia podłączone do punktu dostępowego tracą łączność w chwili zatrzymania usługi
      - Stanowiska przenośne używane w podróży stracą sposób na podłączenie telefonu do jedynego dostępnego łącza
      - Pokazy i szkolenia, na których jedna maszyna udostępnia łącze pozostałym, wymagają innej drogi
      - Usługa jest wspólna z mechanizmem udostępniania połączenia, więc oba punkty dotyczą tej samej warstwy
      - Własny dostęp maszyny do sieci bezprzewodowej, internet, udziały, logowanie i drukowanie pozostają bez zmian
    en:
      - Devices hanging upon the point of entry lose their joining at the hour the service is stopped
      - Stations carried about upon journeys will lose the way of putting a telephone onto the one link to be had
      - Showings and teachings where one machine serves the link out to the rest call for another road
      - The service is held in common with the mechanism of the serving out of the joining, so both items touch that same layer
      - The machine s own reach of the network without wires, the internet, shares, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko przenośne udostępnia łącze innym urządzeniom w podróży i nie ma dla tego zamiennika
    en:
      - A station carried about serves the link out to other devices upon journeys and there is nothing to stand in its stead
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Devices hanging upon the point of entry lose their joining the moment the
    # service stops.
    Stop-Service -Name 'icssvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'icssvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'icssvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/

notes:
  pl: |
    Reguła dotyczy mechanizmu dostępnego jednym przełącznikiem i warto,
    żeby aplikacja to podkreśliła. Użytkownik nie uważa, że uruchamia
    punkt dostępowy — uważa, że dzieli się internetem. Różnica między
    tymi dwoma zdaniami jest treścią tego punktu.

    Argument wart postawienia wprost dotyczy tego, dokąd ta sieć prowadzi.
    Urządzenie podłączone do punktu dostępowego trafia do sieci, w której
    stoi stanowisko. Jeżeli stanowisko stoi w sieci firmowej, właśnie
    tam trafia urządzenie, którego nikt nie dopuszczał.

    Odnotowuję, że punkt dostępowy bywa włączony i zapomniany.
    Przełącznik znika z pola widzenia, a sieć działa dalej po powrocie do
    biura. Aplikacja powinna to wymienić, bo to jest najczęstszy przypadek,
    a nie świadome udostępnianie.
  en: |
    The rule touches a mechanism to be had at one switch, and it is well that the application mark that. The user
    holds not that they set a point of entry going - they hold that they share the internet. The difference
    between those two sentences is the substance of this item.

    The argument worth putting outright touches whither that network leads. A device hanging upon the point of
    entry comes into the network the station stands in. If the station stands in the network of the firm, thither
    comes a device nobody let in.

    I set down that a point of entry is at times turned on and forgotten. The switch goes out of sight and the
    network works on after the return to the office. The application ought to name that, it being the commonest
    case and no knowing serving out.
