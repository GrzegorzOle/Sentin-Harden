id: win2025-winrm-basic-auth-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management
  title:
    pl: Uwierzytelnianie podstawowe usługi zarządzania zdalnego wyłączone
    en: Basic authentication for the remote management service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zarządzania zdalnego przyjmowania
    uwierzytelnienia podstawowego, czyli takiego, w którym nazwa i hasło
    idą w treści żądania.

    Podnoszę tu kategorię do krytycznej względem paczki stanowiska
    roboczego i nie jest to odruch ostrożności. Powód jest w tym, czym
    ta usługa na serwerze jest.

    Zarządzanie zdalne to kanał, którym wykonuje się na maszynie
    polecenia. Nie odczytuje się przez niego pliku ani nie ogląda
    ekranu — uruchamia się kod. Poświadczenie przejęte na tym kanale
    daje napastnikowi to samo, co daje konsola administracyjna,
    a na serwerze poświadczenie używane do zarządzania jest
    poświadczeniem uprzywilejowanym.

    Uwierzytelnianie podstawowe przenosi hasło w postaci, z której da
    się je odzyskać wprost, bez łamania. Jedyną osłoną jest szyfrowanie
    warstwy niższej, a o tym, czy ono jest, rozstrzyga osobne ustawienie.
    Dopóki oba są otwarte, hasło administratora idzie przez sieć czytelne.

    Na serwerze droga ta jest przy tym wyjątkowo wygodna dla napastnika,
    bo prowadzi od razu do wykonania i nie zostawia śladu wyglądającego
    na włamanie. Zalogowanie się poświadczeniem prawdziwym jest w dzienniku
    zdarzeniem zwyczajnym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    administracyjne do odczytania z ruchu i kanał, którym od razu
    wykonuje się na serwerze polecenia.
  en: |
    The setting forbids the remote management service to take basic authentication, that is such
    wherein the name and the password go within the body of the request.

    I raise the category to critical here against the working station's pack, and it is no reflex
    of caution. The reason lies in what that service is on a server.

    Remote management is a channel by which orders are carried out upon the machine. No file is
    read by it nor any screen watched - code is run. A credential taken on that channel gives the
    attacker what an administrative console gives, and on a server the credential used for managing
    is a privileged one.

    Basic authentication carries the password in a form from which it can be won back outright,
    with no breaking. The only cover is the encryption of the lower layer, and whether that is
    there is settled by an item apart. While both stand open, the administrator's password goes
    through the network readable.

    On a server that road is withal uncommonly handy for the attacker, leading straight to the
    carrying out and leaving no trace that looks like a breaking in. A signing in with a true
    credential is in the log an ordinary event.

    What an attacker gains while the item goes unmet: an administrative password to be read out of
    the traffic, and a channel by which orders are at once carried out upon the server.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy czymś, co łączy się z tą usługą,
    nie jest narzędzie spoza świata Windows.

    Jest to różnica istotna wobec stanowiska roboczego. Na stanowisku
    z usługą zarządzania zdalnego rozmawiają narzędzia domenowe
    i uwierzytelniają się mechanizmem domenowym. Na serwerze rozmawiają
    z nią także systemy monitorowania, narzędzia automatyzacji
    uruchamiane z maszyn linuksowych, agenci kopii zapasowych i konsole
    dostawców. Część z nich potrafi wyłącznie uwierzytelnianie
    podstawowe, bo mechanizmu domenowego nie implementuje.

    Objaw po zmianie jest jednoznaczny: narzędzie zgłasza odmowę
    uwierzytelnienia, mimo że hasło jest poprawne. Łatwo pomylić to
    z hasłem wygasłym albo kontem zablokowanym i szukać przyczyny po
    stronie konta.

    Sprawa druga dotyczy serwerów spoza domeny. Maszyna w strefie
    zdemilitaryzowanej albo serwer utrzymywany osobno bywa zarządzany
    właśnie kontem lokalnym z uwierzytelnianiem podstawowym, bo nie ma
    tam mechanizmu domenowego. Odcięcie tej drogi bez przygotowania
    innej — uwierzytelniania certyfikatem albo dopisania maszyny do
    listy zaufanych hostów po stronie klienta — odbiera zarządzanie
    nad taką maszyną.

    Dlatego przed zmianą trzeba wiedzieć, czym się ten serwer zarządza,
    a przy serwerze spoza domeny mieć drogę zapasową do maszyny.

    Zmiana wchodzi w życie od razu, bez restartu usługi, i cofa się
    natychmiast. Sesje zarządzania już trwające nie są przerywane.
  en: |
    One thing needs checking: whether what connects to this service is not a tool from outside the
    world of Windows.

    It is a weighty difference against the working station. At a station the tools speaking with
    the remote management service are of the domain and authenticate themselves by the domain's
    mechanism. On a server there also speak with it systems of watching, tools of automation run
    off Linux machines, agents of backup and vendors' consoles. Some of them can do basic
    authentication alone, not carrying out the domain's mechanism.

    The symptom after the change is plain: the tool reports a refusal of authentication though the
    password is right. That is easily mistaken for a password run out or an account shut, and the
    cause looked for at the account's side.

    The second matter bears on servers outside a domain. A machine in a demilitarised zone or a
    server kept apart is at times managed by just a local account with basic authentication, there
    being no domain mechanism there. The cutting off of that road without another made ready -
    authentication by certificate, or the writing of the machine into the list of trusted hosts at
    the client's side - takes away the managing of such a machine.

    Therefore before the change one must know what this server is managed by, and with a server
    outside a domain hold a spare road to the machine.

    The change comes into force straight away, with no restart of the service, and is undone at
    once. Sessions of management already running are not broken.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - System monitorowania albo narzędzie automatyzacji z maszyny linuksowej przestanie się uwierzytelniać
      - Narzędzie zgłasza odmowę uwierzytelnienia, mimo że hasło jest poprawne, co myli z kontem zablokowanym
      - Serwer spoza domeny zarządzany kontem lokalnym przestanie być osiągalny tą drogą
      - Agent kopii zapasowej albo konsola dostawcy obsługująca wyłącznie ten mechanizm przestanie działać
      - Sesje zarządzania już trwające nie są przerywane
    en:
      - A system of watching or a tool of automation off a Linux machine will stop authenticating itself
      - The tool reports a refusal of authentication though the password is right, which misleads towards a shut account
      - A server outside a domain managed by a local account will stop being reachable by this road
      - An agent of backup or a vendor's console serving this mechanism alone will stop working
      - Sessions of management already running are not broken
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer jest zarządzany narzędziem obsługującym wyłącznie uwierzytelnianie podstawowe
      - Maszyna stoi poza domeną i nie przygotowano dla niej uwierzytelniania certyfikatem
    en:
      - The server is managed by a tool serving basic authentication alone
      - The machine stands outside a domain and authentication by certificate was not made ready for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'AllowBasic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowBasic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sessions of management already running are not broken. The condition is
    # checked at the next authenticating.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBasic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Kategorię podniosłem do krytycznej, bo zarządzanie zdalne nie służy
    do odczytu pliku ani do oglądania ekranu — służy do wykonywania
    kodu. Poświadczenie przejęte na tym kanale daje to samo, co konsola
    administracyjna.

    Uwierzytelnianie podstawowe przenosi hasło w postaci, z której da
    się je odzyskać wprost. Jedyną osłoną jest szyfrowanie warstwy
    niższej, a o tym rozstrzyga osobne ustawienie — czytaj oba razem.

    Na serwerze rozmawiają z tą usługą także narzędzia spoza świata
    Windows, a część z nich potrafi wyłącznie ten mechanizm. To jest
    rzecz do sprawdzenia przed zmianą.
  en: |
    I raised the category to critical, remote management serving not for the reading of a file nor
    the watching of a screen but for the running of code. A credential taken on that channel gives
    what an administrative console gives.

    Basic authentication carries the password in a form from which it can be won back outright. The
    only cover is the encryption of the lower layer, and that is settled by an item apart - read
    both together.

    On a server there speak with this service tools from outside the world of Windows too, and some
    of them can do this mechanism alone. That is the thing to check before the change.
