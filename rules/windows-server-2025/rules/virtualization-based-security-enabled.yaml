id: win2025-virtualization-based-security-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Zabezpieczenia oparte na wirtualizacji włączone
    en: Virtualization-based security enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza zabezpieczenia oparte na wirtualizacji — warstwę,
    w której część mechanizmów systemu działa odgrodzona od reszty
    systemu przez hipernadzorcę.

    Zostawiam kategorię wysoką. Jest to punkt nadrzędny wobec kilku
    następnych: pozostałe reguły z tej grupy opisują, co dokładnie
    w tej warstwie ma się dziać, a ta włącza samą warstwę. Bez niej
    tamte nie robią nic.

    Rzecz polega na tym, co ta warstwa odbiera napastnikowi. Po wejściu
    na poziom jądra systemu napastnik ma tradycyjnie dostęp do wszystkiego,
    co w tym systemie jest — łącznie z pamięcią, w której trzymane są
    poświadczenia. Oddzielenie części mechanizmów do osobnej, chronionej
    przez hipernadzorcę przestrzeni znaczy, że zdobycie jądra przestaje
    wystarczać: żeby sięgnąć po to, co jest w środku, trzeba złamać
    jeszcze jedną granicę, i to granicę pilnowaną przez sprzęt.

    Na serwerze waży to więcej niż na stacji roboczej i powód jest
    konkretny. Na stacji roboczej w pamięci leży poświadczenie jednego
    człowieka. Na serwerze — poświadczenia kont usługowych, biletów
    sesji użytkowników, którzy się na nim logowali, i kont używanych
    przez agenty zarządzania. Jest to więc maszyna, na której zawartość
    tej pamięci ma wartość nieporównanie większą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: to, że
    zdobycie jądra na tej maszynie od razu oznacza dostęp do wszystkich
    poświadczeń, jakie w niej są — bez żadnej dodatkowej granicy do
    pokonania.
  en: |
    The item switches on virtualisation-based security: a layer in which
    part of the system's workings runs fenced off from the rest of the
    system by the hypervisor.

    I keep the category high. This is the item that stands over several
    that follow - the other rules in this group say what exactly is to
    happen inside that layer, and this one switches the layer itself on.
    Without it those others do nothing.

    The point is what that layer takes away from an attacker. On reaching
    the system kernel an attacker has, in the old arrangement, access to
    everything inside that system - including the memory where the tokens
    are held. Separating part of the workings into a room of its own,
    guarded by the hypervisor, means that winning the kernel stops being
    enough: to reach what is inside, one more boundary must be broken, and
    a boundary watched over by the hardware.

    On a server this weighs more than on a workstation, and the reason is
    concrete. On a workstation the memory holds one person's token. On a
    server it holds the tokens of service accounts, the session tickets of
    every user who signed in, and the accounts used by management agents.
    It is therefore a machine on which what sits in that memory is worth
    incomparably more.

    What an attacker gains while the item goes unmet: that winning the
    kernel on this machine means immediate access to every token inside
    it, with no further boundary to overcome.
disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę wyłożyć, co
    w tej grupie znaczy ona konkretnie, bo jest to pierwsza grupa reguł
    w tej paczce wymagająca restartu maszyny, a na serwerze restart nie
    jest czynnością, tylko wydarzeniem.

    Po pierwsze, warunek tej zmiany często nie leży na tej maszynie.
    Jeżeli serwer sam jest maszyną wirtualną, warstwa ta wymaga włączenia
    wirtualizacji zagnieżdżonej po stronie gospodarza. Jest to ustawienie
    na innej maszynie, należącej zwykle do innego zespołu. Wynik czerwony
    oznacza wtedy nie zaniedbanie administratora tego serwera, tylko
    zgłoszenie do właściciela środowiska wirtualnego — i warto to wiedzieć,
    zanim ktoś zacznie szukać przyczyny u siebie.

    Po drugie, warstwa ta zajmuje pamięć i kosztuje wydajność. Na maszynie
    obsługującej intensywny ruch wejścia-wyjścia albo samej goszczącej
    maszyny wirtualne koszt jest mierzalny. Nie jest to powód, żeby zmiany
    nie robić, ale jest to powód, żeby zmierzyć przed i po, zamiast
    zakładać, że nic się nie stanie.

    Po trzecie, zmiana wiąże się dopiero po restarcie, a maszyna, która
    po nim nie wstanie, wymaga dostępu do konsoli. Jest to dokładnie ten
    moment, o którym pisałem przy usłudze konsoli awaryjnej i przy
    pulpicie zdalnym: drogę awaryjną trzeba znać wcześniej i trzeba ją
    mieć sprawdzoną przez faktyczne zalogowanie, a nie przez przeczytanie
    dokumentacji. Tutaj ta droga przestaje być ostrożnością, a staje się
    warunkiem wykonania.

    Cofnięcie wymaga kolejnego restartu, czyli kolejnego okna.
  en: |
    I keep the class "needs a planned rollout" and want to set out what
    that means for this group, because it is the first group of rules in
    this pack that requires a restart of the machine, and on a server a
    restart is not an action but an event.

    First, the prerequisite for this change often does not live on this
    machine. If the server is itself a virtual machine, the layer requires
    nested virtualization switched on at the host. That is a setting on
    another machine, usually belonging to another team. A red result then
    means no negligence on the part of this server's administrator but a
    ticket to the owner of the virtualization platform - and it is worth
    knowing that before somebody starts looking for the cause locally.

    Second, the layer consumes memory and costs throughput. On a machine
    carrying heavy traffic, or itself hosting virtual machines, the cost
    may be measurable. That is no reason to leave the change undone, but
    it is a reason to measure before and after rather than to assume
    nothing will happen.

    Third, the change binds only after a restart, and a machine that does
    not come up afterwards requires access to the console. This is exactly
    the moment I wrote about at the emergency management console service
    and at the remote desktop item: the out-of-band route must be known
    beforehand and must be verified by actually signing in, not by reading
    documentation. Here that route stops being a precaution and becomes a
    condition of execution.

    The rollback needs another restart, that is, another window.
implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - boot-and-firmware
    - drivers-and-devices
  what_breaks:
    pl:
      - Na maszynie wirtualnej warstwa ta wymaga wirtualizacji zagnieżdżonej włączonej po stronie gospodarza
      - Warunek zmiany leży wtedy na innej maszynie, zwykle należącej do innego zespołu
      - Warstwa zajmuje pamięć i kosztuje wydajność, mierzalnie przy intensywnym ruchu wejścia-wyjścia
      - Zmiana wiąże się dopiero po restarcie, a maszyna, która po nim nie wstanie, wymaga dostępu do konsoli
      - Cofnięcie wymaga kolejnego restartu, czyli kolejnego okna serwisowego
    en:
      - On a virtual machine the layer requires nested virtualization switched on at the host
      - The prerequisite for the change then lies on another machine, usually belonging to another team
      - The layer consumes memory and costs throughput, measurably under heavy traffic
      - The change binds only after a restart, and a machine that does not come up needs console access
      - The rollback needs another restart, that is, another service window
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer jest maszyną wirtualną, a gospodarz nie ma włączonej wirtualizacji zagnieżdżonej
      - Nie ma sprawdzonej drogi dostępu do konsoli maszyny na wypadek, gdyby po restarcie nie wstała
      - Maszyna gości maszyny wirtualne albo obsługuje ruch, którego wydajności nie zmierzono przed zmianą
    en:
      - The server is a virtual machine and the host does not have nested virtualization switched on
      - There is no proven route to the machine console in case it does not come up after the restart
      - The machine hosts virtual machines or carries traffic whose throughput was not measured before the change
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      $name = 'EnableVirtualizationBasedSecurity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    $name = 'EnableVirtualizationBasedSecurity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The master switch of this group; the other items do nothing without it.
    # On a virtual machine it needs nested virtualization enabled on the host -
    # a setting on a different machine. The effect appears after a restart, so
    # have a tested console route before this one.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Punkt nadrzędny wobec pozostałych w tej grupie: one opisują, co ma
    się w tej warstwie dziać, ten włącza samą warstwę. Bez niego tamte
    nie robią nic.

    Na serwerze waży więcej niż na stacji roboczej, bo w pamięci leżą nie
    poświadczenia jednego człowieka, tylko konta usługowe, bilety sesji
    zalogowanych i konta agentów zarządzania.

    Trzy rzeczy do wiedzenia przed zmianą: na maszynie wirtualnej warunek
    leży u gospodarza, czyli na cudzej maszynie; warstwa kosztuje pamięć
    i wydajność, więc mierzy się przed i po; zmiana wiąże się po
    restarcie, więc droga do konsoli przestaje być ostrożnością, a staje
    się warunkiem wykonania.
  en: |
    The item that stands over the rest of this group - they say what is to
    happen inside that layer, this one switches the layer itself on.
    Without it the others do nothing.

    On a server it weighs more than on a workstation, because the memory
    holds not one person's token but service accounts, the session tickets
    of everyone signed in, and the accounts of management agents.

    Three things to know before the change: on a virtual machine the
    prerequisite lies with the host, that is, on somebody else's machine;
    the layer costs memory and throughput, so measure before and after;
    the change binds after a restart, so the route to the console stops
    being a precaution and becomes a condition of execution.
