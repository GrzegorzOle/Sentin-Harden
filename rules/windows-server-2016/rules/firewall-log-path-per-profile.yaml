id: win2016-firewall-log-path-per-profile

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Osobny plik dziennika zapory dla każdego profilu
    en: A separate firewall log file for each profile
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozdziela dziennik zapory na trzy pliki, po jednym na każdy
    profil sieciowy.

    Domyślnie wszystkie profile piszą do jednego miejsca. Wpisy mieszają się
    w kolejności czasu, a z samego wiersza nie wynika, który profil
    obowiązywał, gdy powstał. Pytanie „czy to działo się w sieci domenowej,
    czy w nierozpoznanej" nie ma wtedy odpowiedzi.

    Rozdzielenie plików odpowiada na nie natychmiast i bez analizy. Ruch
    zapisany w dzienniku profilu publicznego pochodzi z okresu, w którym
    maszyna była w sieci nierozpoznanej — a to jest informacja, która sama
    z siebie zmienia wagę wpisu.

    Znaczenie ma to także przy odczytywaniu zmian profilu. Serwer, który
    przeszedł do profilu publicznego, na przykład przy utracie łączności
    z kontrolerem domeny, zostawia tę zmianę widoczną w postaci pliku, który
    nagle zaczyna rosnąć. Bez rozdziału trzeba tego szukać, zamiast
    zobaczyć.

    Reguła ustala też samo miejsce zapisu, a nie tylko podział. Dzienniki
    w przewidywalnym, jednym katalogu systemowym dają się zbierać
    i archiwizować bez odgadywania ścieżki na każdej maszynie osobno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Punkt jest porządkowy i podnosi użyteczność zapisu,
    a nie odporność maszyny.
  en: |
    The setting divides the firewall log into three files, one for each network
    profile.

    By default all profiles write to one place. The entries mingle in order of time,
    and the line itself does not tell which profile held when it was made. The
    question "did this happen on a domain network or on an unrecognised one" then
    has no answer.

    Dividing the files answers it at once and without analysis. Traffic written into
    the public profile's log comes from a spell in which the machine was on an
    unrecognised network - and that is a piece of knowledge which by itself changes
    an entry's weight.

    It matters too in reading changes of profile. A server that has moved into the
    public profile, at a loss of contact with a domain controller, say, leaves that
    change visible as a file that suddenly begins to grow. Without the division it
    has to be looked for rather than seen.

    The rule also settles the place of writing, not the division alone. Logs in a
    foreseeable single system directory can be gathered and archived without
    guessing at the path on each machine apart.

    What an attacker gains while the item goes unmet: nothing directly. The item is
    one of tidiness and raises the usefulness of the record rather than the
    machine's resilience.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana dotyczy wyłącznie tego, dokąd zapora
    pisze, i nie zmienia ani tego, co przepuszcza, ani tego, co notuje.

    Jedyną rzeczą wartą odnotowania jest to, co dzieje się z dotychczasowym
    dziennikiem. Zapora zaczyna pisać do plików nowych, a stary zostaje
    tam, gdzie był, i przestaje rosnąć. Nic nie ginie, ale ciągłość zapisu
    w jednym pliku się kończy — kto zbiera dzienniki po ścieżce, musi
    uwzględnić nowe.

    Jest to zarazem jedyny realny skutek tej zmiany: narzędzia zbierające
    dziennik ze ścieżki dotychczasowej przestaną dostawać nowe wpisy.
    Zgłoszenie brzmi wtedy „dziennik zapory przestał przychodzić", choć
    zapora pisze normalnie. Warto to sprawdzić przed zmianą, jeśli takie
    zbieranie jest skonfigurowane.

    Czego to nie psuje: działania zapory, reguł, usług, połączeń,
    istniejącego pliku dziennika.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The change concerns only where the firewall
    writes, and alters neither what it lets through nor what it notes.

    The one thing worth noting is what becomes of the log kept until now. The
    firewall begins writing to new files, while the old one stays where it was and
    stops growing. Nothing is lost, but the continuity of the record in one file
    ends - whoever gathers logs by path must take the new ones into account.

    That is at the same time the one real consequence of this change: tools
    gathering the log from the path used hitherto will stop getting new entries. The
    report then reads "the firewall log has stopped coming", though the firewall
    writes as usual. Worth checking before the change, if such gathering is
    configured.

    What this does not break: the firewall's working, rules, services, connections,
    or the existing log file.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Narzędzia zbierające dziennik ze ścieżki dotychczasowej przestaną dostawać nowe wpisy, a zgłoszenie zabrzmi jakby zapora przestała pisać
      - Ciągłość zapisu w jednym pliku się kończy, więc analiza obejmująca okres sprzed zmiany wymaga sięgnięcia do dwóch miejsc
      - Stary plik dziennika zostaje tam, gdzie był, i nic z niego nie ginie
      - Działanie zapory, reguły, usługi i połączenia pozostają bez zmian
    en:
      - Tools gathering the log from the path used hitherto will stop getting new entries, and the report will sound as though the firewall had stopped writing
      - The continuity of the record in one file ends, so an analysis covering the spell before the change calls for two places to be reached into
      - The old log file stays where it was and nothing in it is lost
      - The firewall's working, rules, services and connections stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zbieranie dzienników jest skonfigurowane po ścieżce dotychczasowej i nie przewidziano jej zmiany
      - Na woluminie systemowym brakuje miejsca na trzy pliki zamiast jednego
    en:
      - The gathering of logs is configured by the path used hitherto and no change to it has been planned
      - There is no room on the system volume for three files instead of one
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Each profile is expected to write to a file of its own under the system's
      # firewall log directory. The comparison ignores letter case, since the path is
      # not case sensitive, and names the profiles that differ.
      $expected = @{
        Domain  = "$env:SystemRoot\System32\logfiles\firewall\domainfw.log"
        Private = "$env:SystemRoot\System32\logfiles\firewall\privatefw.log"
        Public  = "$env:SystemRoot\System32\logfiles\firewall\publicfw.log"
      }
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $wrong = @()
        foreach ($p in $profiles) {
          $want = $expected[[string]$p.Name]
          if ($null -eq $want) { continue }
          $have = [string]$p.LogFileName
          if ($have.Trim().ToUpperInvariant() -ne $want.ToUpperInvariant()) { $wrong += [string]$p.Name }
        }
        if ($wrong.Count -eq 0) { 'ALL_SEPARATE' } else { 'OTHER_IN_' + ($wrong -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_SEPARATE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogFileName |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $dir = Join-Path $env:SystemRoot 'System32\logfiles\firewall'
    Set-NetFirewallProfile -Profile Domain -LogFileName (Join-Path $dir 'domainfw.log')
    Set-NetFirewallProfile -Profile Private -LogFileName (Join-Path $dir 'privatefw.log')
    Set-NetFirewallProfile -Profile Public -LogFileName (Join-Path $dir 'publicfw.log')

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogFileName $p.LogFileName
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt zamyka blok zapory i jest w nim najlżejszy. Jego wartość ujawnia
    się wyłącznie razem z dwiema regułami o rejestrowaniu — bez nich
    rozdziela pliki, do których nic nie trafia. Aplikacja powinna pokazywać
    całą trójkę razem i w tej kolejności.

    Ocena niska jest nadana zgodnie z kryterium: punkt nie odbiera
    napastnikowi niczego. Podnosi natomiast użyteczność materiału, z którego
    odtwarza się przebieg zdarzeń, a to jest wartość realna, tylko innego
    rodzaju.

    Audyt porównuje ścieżki bez względu na wielkość liter i wymienia profile,
    które piszą gdzie indziej. Dopuszczenie dowolnej ścieżki byłoby tu
    wygodniejsze, ale odebrałoby regule drugą połowę sensu — przewidywalne
    miejsce jest częścią tego, co ta reguła daje.
  en: |
    The item shuts the firewall block and is the lightest in it. Its value shows
    only together with the two rules on logging - without them it divides files
    nothing reaches. The application should show all three together and in that
    order.

    The low judgement is given by the criterion: the item takes nothing from an
    attacker. It does raise the usefulness of the material from which a course of
    events is reconstructed, and that is a real value, only of another kind.

    The audit compares paths without regard to letter case and names the profiles
    writing elsewhere. Admitting any path at all would be more convenient here, but
    would take half the rule's sense away - a foreseeable place is part of what this
    rule gives.
