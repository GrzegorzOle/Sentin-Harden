id: win10-smb-insecure-guest-logons-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Lanman Workstation
  title:
    pl: Niezabezpieczone logowanie gościa do udziałów wyłączone
    en: Unguarded guest logons to shares switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje maszynie łączenia się z udziałem w trybie gościa,
    czyli bez uwierzytelnienia i bez podpisu.

    Słowo „gość" sugeruje uprawnienia małe i przez to punkt bywa oceniany
    zbyt nisko. Rzecz nie dotyczy tego, co maszyna w takim udziale może;
    dotyczy tego, że nie wie, z kim rozmawia. Sesja bez uwierzytelnienia
    nie daje żadnej podstawy do stwierdzenia, czy po drugiej stronie stoi
    serwer, po który sięgnięto, czy ktoś, kto na pytanie o niego odpowiedział
    szybciej.

    Skutek jest poważniejszy niż odczytanie cudzych plików. Podstawiony
    udział podaje treść dowolną — skrypt, dokument z makrem, plik
    wykonywalny — a maszyna przyjmuje ją jako pochodzącą z zasobu, po który
    sama sięgnęła. Jest to dostarczenie treści na życzenie ofiary, a nie
    włamanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia własnego udziału pod ścieżkę, po którą maszyna sięga,
    i podania z niego treści dowolnej.
  en: |
    The setting forbids the machine to join a share in guest mode, which is to say without authentication and
    without a signature.

    The word "guest" hints at small rights and for that the item gets rated too low. The matter is not what the
    machine may do in such a share; it is that it does not know whom it speaks with. A session without
    authentication gives no ground at all for settling whether on the other side stands the server reached for
    or somebody who answered the question about it the quicker.

    The consequence is graver than the reading of somebody's files. A share put in the way gives out content of
    any kind - a script, a document with a macro, an executable file - and the machine takes it in as coming of
    a resource it reached for itself. That is a delivering of content at the victim's own asking, not a breaking
    in.

    What an attacker gains while the item goes unmet: the means of putting a share of their own under the path
    the machine reaches for, and of giving out of it content of any kind.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie polega na ustaleniu, czy
    maszyna łączy się dziś z jakimkolwiek udziałem bez hasła.

    Udziały bez uwierzytelnienia zdarzają się przy sprzęcie: dyski sieciowe
    domowe, skanery, drukarki wielofunkcyjne z katalogiem wbudowanym,
    urządzenia pomiarowe. Po zmianie maszyna przestanie do nich dochodzić.

    Objaw jest przy tym mylący w sposób wart odnotowania. Komunikat mówi
    o odmowie dostępu i wygląda na kłopot z uprawnieniami, więc pierwszym
    odruchem bywa szukanie w konfiguracji udziału, gdzie nic się nie
    zmieniło. Aplikacja powinna nazwać ten objaw wprost, bo bez tego
    rozpoznanie zajmuje godziny.

    Rozwiązaniem właściwym jest uwierzytelnienie na urządzeniu, nawet
    poświadczeniami prostymi, a nie powrót do trybu gościa.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: udziałów wymagających uwierzytelnienia, uprawnień
    do plików, logowania, kont domenowych, drukowania przez kolejkę,
    aplikacji.
  en: |
    The class is "needs review", and the review comes to settling whether the machine today joins any share
    without a password.

    Shares without authentication occur with gear: home network drives, scanners, multifunction printers with a
    built-in directory, measuring devices. After the change the machine will cease reaching them.

    The symptom misleads in a way worth setting down. The message speaks of access denied and looks a trouble
    with rights, so the first reflex is a searching in the share's configuration, where nothing has changed. The
    application ought to name that symptom outright, for without it the recognising takes hours.

    The right answer is an authentication upon the device, even by plain credentials, and not a return to guest
    mode.

    The change takes hold at once and undoes itself at once.

    What this does not break: shares calling for authentication, the rights upon files, logging on, domain
    accounts, printing through a queue, or applications.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - printing
  what_breaks:
    pl:
      - Udziały udostępniane bez uwierzytelnienia przestają być dostępne z tej maszyny
      - Dyski sieciowe, skanery i drukarki wielofunkcyjne z katalogiem bez hasła tracą łączność z tą maszyną
      - Komunikat mówi o odmowie dostępu i nie wskazuje tej zmiany jako przyczyny, co wydłuża rozpoznanie
      - Pierwszy odruch prowadzi do konfiguracji udziału, w której nic się nie zmieniło
      - Udziały wymagające uwierzytelnienia, uprawnienia do plików, logowanie i drukowanie przez kolejkę pozostają bez zmian
    en:
      - Shares set out without authentication cease being reachable from this machine
      - Network drives, scanners and multifunction printers with a passwordless directory lose their link to this machine
      - The message speaks of access denied and does not point at this change as the cause, which lengthens the recognising
      - The first reflex leads to the shares configuration, in which nothing has changed
      - Shares calling for authentication, the rights upon files, logging on and printing through a queue stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W sieci działa urządzenie udostępniające pliki bez uwierzytelnienia i nie da się go przestawić
      - Nie ustalono, z jakimi udziałami ta maszyna się łączy w pracy codziennej
    en:
      - A device sharing files without authentication works on the network and cannot be set otherwise
      - It has not been established what shares this machine joins in its everyday work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
      $name = 'AllowInsecureGuestAuth'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
    $name = 'AllowInsecureGuestAuth'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where a device shares without a password, give it credentials rather than
    # put this value back. The message after the change speaks of access denied
    # and does not name the cause.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowInsecureGuestAuth' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/guest-access-in-smb2-is-disabled-by-default

notes:
  pl: |
    Reguła zamyka blok i jest w nim jedyną odczuwalną w pracy codziennej
    natychmiast po wykonaniu. Pozostałe albo czekają na restart, albo
    dotyczą sprzętu, którego na maszynie typowej nie ma.

    Argument wart zachowania dotyczy słowa „gość". Punkt nie mówi
    o uprawnieniach w udziale, tylko o braku podstawy do rozpoznania
    rozmówcy. Bez tego zdania reguła wygląda na drobiazg o koncie
    o małych prawach.

    Odnotowuję objaw mylący, bo to on kosztuje najwięcej. Odmowa dostępu
    kieruje uwagę na uprawnienia, a przyczyna leży w ustawieniu klienta.
    Aplikacja, która wypisze to przy opisie skutków, oszczędzi komuś
    przeglądu, w którym niczego się nie znajdzie.
  en: |
    The rule closes the block and is the only one in it felt in everyday work at once upon the carrying out. The
    rest either wait upon a restart or touch gear a typical machine has not.

    The argument worth keeping touches the word "guest". The item speaks not of rights within a share but of the
    want of any ground for recognising whom one speaks with. Without that sentence the rule looks a trifle about
    an account of small rights.

    I set down the misleading symptom, that costing the most. Access denied turns attention to rights, while the
    cause lies in a setting upon the client. An application writing that out beside the description of
    consequences will spare somebody a review in which nothing will be found.
