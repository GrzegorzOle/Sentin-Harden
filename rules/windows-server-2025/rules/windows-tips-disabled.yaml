id: win2025-windows-tips-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Porady i wskazówki systemu wyłączone
    en: System tips and hints turned off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wyświetlanie porad i wskazówek systemu — krótkich
    komunikatów podpowiadających funkcje, pojawiających się po instalacji
    i po aktualizacjach.

    Kategoria niska i nie zamierzam jej podnosić. Porada jest tekstem.
    Nie instaluje oprogramowania, nie zmienia ustawień, nie prowadzi do
    podpięcia konta. Jedyne, co wnosi ta reguła, to jedno połączenie
    wychodzące mniej i jedno okno mniej na ekranie, na który na serwerze
    nikt nie patrzy.

    Piszę o tym wprost, zamiast dorabiać regule wagę, bo lista, na której
    wszystko wygląda na ważne, przestaje pomagać w wyborze. Ten punkt jest
    porządkiem i tyle.

    Warto go jednak zastosować z powodu, który łatwiej dostrzec przy całej
    grupie niż przy pojedynczej pozycji. Serwer po zmianie wersji systemu
    zaczyna pokazywać rzeczy, których wcześniej nie pokazywał, i nawiązywać
    połączenia, których wcześniej nie nawiązywał. Reguły tej grupy nie
    bronią przed niczym pojedynczo — razem sprawiają, że maszyna zachowuje
    się przewidywalnie także po aktualizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic. Taka
    jest uczciwa odpowiedź i tak to oceniam.
  en: |
    The item turns off the display of system tips and hints - short messages
    suggesting features, appearing after installation and after updates.

    The category is low and I do not intend to raise it. A tip is text. It
    installs no software, changes no settings, leads to no account being
    attached. All this rule brings is one outbound connection fewer and one
    window fewer on a screen nobody on a server looks at.

    I write this plainly rather than invent a weight for the rule, because a
    list on which everything looks important stops helping anybody choose.
    This item is good order and no more.

    It is nevertheless worth applying, for a reason easier to see across the
    whole group than in a single entry. After a change of system version a
    server starts showing things it did not show before and opening
    connections it did not open before. The rules in this group defend
    against nothing individually - together they make the machine behave
    predictably after an update as well.

    What an attacker gains while the item goes unmet: nothing. That is the
    honest answer and that is how I rate it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tu nie mam żadnych zastrzeżeń do
    postawienia.

    Nikt nie traci dostępu do niczego. Dokumentacja systemu pozostaje
    dostępna, pomoc w ustawieniach działa, wyszukiwanie działa. Znikają
    wyłącznie samoczynne podpowiedzi wyświetlane bez pytania.

    Jedyna rzecz, jaką warto zapisać, dotyczy sposobu czytania tej reguły
    w sprawozdaniu. Ten punkt leży w tej samej gałęzi rejestru co punkty
    o funkcjach konsumenckich, treściach dobieranych w chmurze i zachętach
    dotyczących konta. Cztery różne wartości, cztery różne zachowania,
    jedna ścieżka. Kto zobaczy znajomą ścieżkę i uzna sprawę za
    załatwioną, zamknie jeden z czterech punktów.

    Bez restartu, niewidoczne w pracy usług, natychmiast odwracalne, wolno
    zastosować hurtem.
  en: |
    The class is "no disruption", and here I have no caveat to state.

    Nobody loses access to anything. The system documentation stays
    available, the help in the settings works, search works. All that
    disappears is the unsolicited hints shown without being asked for.

    The only thing worth recording concerns how this rule is read in a
    report. This item lies in the same registry branch as the items on
    consumer features, cloud-chosen content and account prompts. Four
    different values, four different behaviours, one path. Anybody who sees
    the familiar path and considers the matter settled will have closed one
    item out of four.

    No restart, invisible in the working of services, undone immediately,
    may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Znikają samoczynne podpowiedzi wyświetlane bez pytania, pojawiające się po instalacji i po aktualizacjach
      - Dokumentacja systemu pozostaje dostępna, pomoc w ustawieniach i wyszukiwanie działają bez zmian
      - Punkt leży w tej samej gałęzi rejestru co trzy inne z tej grupy — cztery wartości, cztery zachowania, jedna ścieżka
      - Kto zobaczy znajomą ścieżkę i uzna sprawę za załatwioną, zamknie jeden z czterech punktów
    en:
      - The unsolicited hints shown after installation and after updates disappear
      - The system documentation stays available; the help in the settings and search work unchanged
      - The item lies in the same registry branch as three others in this group - four values, four behaviours, one path
      - Anybody who sees the familiar path and considers the matter settled will have closed one item out of four
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym podpowiedzi systemu są częścią przyjętego sposobu wdrażania użytkowników
    en:
      - The machine is a terminal server where system hints are part of the accepted way of introducing users
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableSoftLanding'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableSoftLanding'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One of four values in this branch, each with its own behaviour - applying
    # this one does not settle the other three. A tip is text, so the value here
    # is order rather than defence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSoftLanding' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Porada jest tekstem — nie instaluje oprogramowania, nie zmienia
    ustawień, nie prowadzi do podpięcia konta. Piszę to wprost, zamiast
    dorabiać regule wagę, bo lista, na której wszystko wygląda na ważne,
    przestaje pomagać w wyborze.

    Powód, dla którego i tak warto: serwer po zmianie wersji systemu
    zaczyna pokazywać rzeczy, których wcześniej nie pokazywał, i nawiązywać
    połączenia, których wcześniej nie nawiązywał. Reguły tej grupy nie
    bronią przed niczym pojedynczo — razem utrzymują przewidywalność
    maszyny po aktualizacji.

    Do zapamiętania przy sprawdzaniu: cztery punkty z tej grupy leżą w tej
    samej gałęzi rejestru pod różnymi nazwami.
  en: |
    A tip is text - it installs no software, changes no settings, leads to
    no account being attached. I write this plainly rather than invent a
    weight for the rule, because a list on which everything looks important
    stops helping anybody choose.

    The reason it is worth applying anyway: after a change of system version
    a server starts showing things it did not show before and opening
    connections it did not open before. The rules in this group defend
    against nothing individually - together they keep the machine
    predictable after an update.

    To remember when checking: four items in this group lie in the same
    registry branch under different names.
