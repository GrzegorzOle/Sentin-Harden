id: win2025-tcp-retransmissions-limited

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Liczba powtórzeń wysyłki danych ograniczona do trzech
    en: The number of data send repeats limited to three
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy wysłane dane nie zostaną potwierdzone, system wysyła je ponownie.
    Odstęp między kolejnymi próbami rośnie dwukrotnie, więc pięć prób
    trwa nie o dwie próby dłużej niż trzy, lecz kilkakrotnie dłużej
    w całości.

    Przez cały ten czas połączenie zajmuje miejsce w tablicy połączeń
    i trzyma przypisaną mu pamięć. Jest to koszt ponoszony przez maszynę
    wysyłającą, niezależnie od tego, czy druga strona jeszcze istnieje.

    Kategorię ryzyka podniosłem względem paczki stanowiska roboczego
    z tego samego powodu co przy pakietach podtrzymujących: serwer jest
    stroną przyjmującą i utrzymuje połączenia wielu klientów naraz.
    Napastnik, który nawiązuje połączenia i przestaje odpowiadać, płaci
    za każde z nich jednym pakietem, a serwer płaci pamięcią i miejscem
    w tablicy przez czas wynikający z liczby prób.

    Skrócenie tego czasu nie zamyka drogi, tylko ją zwęża. Zmienia
    stosunek kosztów: napastnik musi powtarzać częściej, żeby utrzymać
    ten sam stan, a serwer szybciej odzyskuje to, co zajęte.

    Na serwerze waży też to, czego na stanowisku roboczym nie ma —
    liczba. Pojedyncze połączenie wiszące pięć prób to drobiazg;
    dziesiątki tysięcy takich połączeń to usługa, która przestaje
    przyjmować nowe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dłuższy
    czas, przez który jedno nieodpowiadające połączenie zajmuje zasoby
    serwera, a więc tańsze utrzymanie stanu wyczerpania tablicy.
  en: |
    Where data sent are not borne out, the system sends them again. The interval between one try
    and the next grows twofold, so five tries last not two tries longer than three but several
    times longer in all.

    All that while the connection holds a place in the table of connections and keeps the memory
    set aside for it. It is a cost borne by the sending machine, whether or not the other side
    still is.

    I raised the category of risk against the working station's pack for the same reason as at the
    keep-alive packets: a server is the taking side and keeps the connections of many clients at
    once. An attacker who opens connections and stops answering pays one packet for each, while
    the server pays with memory and a place in the table for the time the number of tries brings
    about.

    Shortening that time does not shut the road but narrows it. It changes the ratio of costs: the
    attacker must repeat oftener to hold the same state, and the server wins back what was taken
    sooner.

    On a server there weighs too what is not at a working station - number. A single connection
    hanging five tries is a trifle; tens of thousands of such connections are a service that stops
    taking new ones.

    What an attacker gains while the item goes unmet: a longer time in which one unanswering
    connection holds the server's means, and so a cheaper keeping up of a state in which the table
    is exhausted.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia, a na serwerze jej skutek jest
    innego rodzaju niż na stanowisku roboczym. Stanowisko ogranicza tu
    cierpliwość własną. Serwer ogranicza cierpliwość wobec klientów —
    czyli wobec ludzi i systemów, które o tej zmianie nie wiedzą.

    Rzecz dotyczy łączy o zmiennej jakości. Trzy próby wystarczają
    w sieci lokalnej i w każdym łączu, które gubi pakiety rzadko.
    Nie wystarczają tam, gdzie pakiety giną seriami: łącze komórkowe,
    łącze satelitarne, tunel przez sieć publiczną, łącze do oddziału
    obciążone kopią zapasową.

    Objawem nie jest komunikat o błędzie sieci. Objawem jest przerwane
    przesyłanie pliku, zerwana sesja pulpitu zdalnego albo zapytanie
    do bazy, które nie wraca — po stronie klienta, nie serwera. Jest to
    najgorszy możliwy układ diagnostyczny: zmiana jest tutaj, a skarga
    przychodzi stamtąd.

    Do tego skutek ujawnia się dopiero po ponownym uruchomieniu serwera,
    a więc być może wiele tygodni po zmianie. Kto szuka przyczyny,
    ten patrzy na to, co zmieniło się ostatnio, a nie na to, co zapisano
    w rejestrze przed miesiącem.

    Rozpoznanie przed zmianą polega na ustaleniu, przez jakie łącza
    docierają do tego serwera klienci, i czy któryś z nich pracuje
    w terenie. Serwer obsługujący wyłącznie sieć lokalną nie odczuje
    zmiany w ogóle.

    Wartość trzech prób jest granicą górną wynikającą z punktu, nie
    zaleceniem wynikającym z pomiaru.

    Czytaj razem z tym samym punktem dla protokołu szóstej wersji.
    Ustawienie jednego bez drugiego zostawia połowę ruchu przy starym
    zachowaniu.
  en: |
    The change takes a knowing rollout, and on a server its effect is of another kind than at a
    working station. A station bounds here its own patience. A server bounds its patience towards
    clients - that is towards people and systems that know nothing of this change.

    The matter bears on links of uneven quality. Three tries are enough in a local network and in
    every link that loses packets seldom. They are not enough where packets go in runs: a mobile
    link, a satellite link, a tunnel through a public network, a link to a branch laden with a
    backup.

    The symptom is not a message about a fault of the network. The symptom is a broken sending of
    a file, a severed remote desktop session or a query to a database that does not come back - on
    the client's side and not the server's. It is the worst possible setting for diagnosis: the
    change is here and the complaint comes from there.

    Besides, the effect shows only after a fresh start of the server, and so perhaps many weeks
    after the change. Whoever seeks the cause looks at what changed lately and not at what was
    written into the registry a month ago.

    The reconnaissance before the change lies in settling by what links the clients reach this
    server, and whether any of them works in the field. A server serving the local network alone
    will not feel the change at all.

    The value of three tries is an upper bound coming from the item and not a counsel coming from
    a measurement.

    Read together with the same item for the sixth version of the protocol. Setting one without
    the other leaves half the traffic at the old behaviour.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Klient na łączu komórkowym, satelitarnym albo w tunelu przez sieć publiczną straci połączenie szybciej niż dotąd
      - Objawem jest przerwane przesyłanie pliku albo zerwana sesja po stronie klienta, a nie komunikat na serwerze
      - Łącze do oddziału obciążone kopią zapasową gubi pakiety seriami i zacznie zrywać sesje
      - Skutek ujawnia się dopiero po ponownym uruchomieniu serwera, być może tygodnie po zmianie
      - Serwer obsługujący wyłącznie sieć lokalną nie odczuje zmiany
    en:
      - A client on a mobile or satellite link or in a tunnel through a public network will lose their connection sooner than until now
      - The symptom is a broken sending of a file or a severed session on the client's side and not a message on the server
      - A link to a branch laden with a backup loses packets in runs and will begin severing sessions
      - The effect shows only after a fresh start of the server, perhaps weeks after the change
      - A server serving the local network alone will not feel the change
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer obsługuje klientów pracujących w terenie, na łączu komórkowym albo satelitarnym
      - Aplikacja utrzymuje długie sesje przez tunel o zmiennej jakości
    en:
      - The server serves clients working in the field, on a mobile or a satellite link
      - An application keeps long sessions through a tunnel of uneven quality
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'TcpMaxDataRetransmissions'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'TcpMaxDataRetransmissions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' `
      -Name 'TcpMaxDataRetransmissions' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Kategorię ryzyka podniosłem względem paczki stanowiska roboczego:
    serwer jest stroną przyjmującą, a liczba wiszących połączeń
    przesądza o tym, czy usługa przyjmie następne.

    Na serwerze ta zmiana ogranicza cierpliwość wobec klientów, nie
    własną. Skarga przyjdzie stamtąd, a zmiana jest tutaj — i to jest
    najgorszy możliwy układ diagnostyczny.

    Czytaj razem z tym samym punktem dla protokołu szóstej wersji.
  en: |
    I raised the category of risk against the working station's pack: a server is the taking side,
    and the number of hanging connections settles whether the service will take the next.

    On a server this change bounds the patience towards clients and not one's own. The complaint
    will come from there and the change is here - and that is the worst possible setting for
    diagnosis.

    Read together with the same item for the sixth version of the protocol.
