id: win2016-tcp-retransmissions-limited-ipv6

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Liczba powtórzeń wysyłki danych ograniczona do trzech w protokole szóstej wersji
    en: The number of data send repeats limited to three in the sixth version protocol
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie robi w protokole szóstej wersji dokładnie to, co reguła
    bliźniacza w protokole starszym: ogranicza liczbę powtórzeń wysyłki
    danych, zanim maszyna uzna połączenie za martwe.

    Osobna reguła jest potrzebna dlatego, że oba stosy liczą to niezależnie.
    Wpis nosi tę samą nazwę, ale leży w innym kluczu i nie dziedziczy
    wartości z tamtego. Maszyna z ustawionym tylko jednym zachowuje się
    różnie w zależności od tego, którym protokołem nawiązano połączenie.

    Ma to dziś znaczenie większe, niż bywa przyjmowane. Protokół szóstej
    wersji jest na tym wydaniu systemu włączony domyślnie i domyślnie
    preferowany, więc część połączeń idzie nim nawet wtedy, gdy nikt tego
    świadomie nie skonfigurował — zwłaszcza w obrębie segmentu, gdzie adresy
    powstają same.

    Skutek jest taki, że maszyna uznana za utwardzoną na podstawie wpisu
    w starszym stosie bywa nieutwardzona dla połączeń, które faktycznie
    przechodzą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: to samo co
    przy regule bliźniaczej, tyle że drogą, którą maszyna wybiera domyślnie.
  en: |
    The setting does in the sixth version protocol exactly what its twin rule does
    in the older one: it limits the number of data send repeats before the machine
    takes a connection for dead.

    A separate rule is needed because the two stacks count this independently. The
    entry bears the same name but lies in another key and does not inherit the value
    from that one. A machine with only one of them set behaves differently depending
    on which protocol the connection was made over.

    This matters more today than is at times assumed. On this release of the system
    the sixth version protocol is switched on by default and preferred by default,
    so some connections go by it even where nobody configured that deliberately -
    within a segment especially, where addresses arise by themselves.

    The upshot is that a machine judged hardened on the strength of an entry in the
    older stack is at times unhardened for the connections that actually pass.

    What an attacker gains while the item goes unmet: the same as at the twin rule,
    only by the road the machine picks by default.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", identycznie jak przy regule
    bliźniaczej i z tych samych powodów.

    Sprawdzenie jest jednak inne, bo trzeba zacząć od pytania, czy protokół
    szóstej wersji jest na tej maszynie w ogóle używany. Bywa wyłączony na
    poziomie karty sieciowej albo zasad; wtedy zmiana nie ma skutku żadnego
    i punkt jest czystym porządkiem.

    Jeżeli jest używany, obowiązują te same zastrzeżenia: łącza o zmiennej
    jakości, tunele, oprogramowanie nieumiejące nawiązać przerwanego
    połączenia ponownie. Z jednym dodatkiem. Tunele przenoszące protokół
    szóstej wersji przez sieć zbudowaną na starszym są z natury mniej
    stabilne niż łączność natywna, więc właśnie tam ograniczenie liczby prób
    zaboli najszybciej. Jeżeli maszyna korzysta z takiego tunelu, zmianę
    trzeba ocenić osobno.

    Objaw jest ten sam i równie trudny do powiązania z ustawieniem:
    nieregularne zrywanie połączeń przy chwilowym zakłóceniu.

    Czego to nie psuje: połączeń protokołem starszym, łączności w sieci
    lokalnej, usług, nowych połączeń.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", just as at the twin rule and for the
    same reasons.

    The checking, though, is different, since it must begin with the question
    whether the sixth version protocol is used on this machine at all. It is at
    times switched off at the network card or by policy; the change then has no
    effect whatever and the item is pure tidiness.

    If it is used, the same reservations hold: links of varying quality, tunnels,
    software unable to make a broken connection afresh. With one addition. Tunnels
    carrying the sixth version protocol across a network built on the older one are
    by nature less stable than native connectivity, so it is there that limiting the
    number of attempts will hurt soonest. If the machine uses such a tunnel, the
    change has to be judged apart.

    The symptom is the same and just as hard to tie to a setting: connections
    breaking irregularly at a passing disturbance.

    What this does not break: connections over the older protocol, connectivity on a
    local network, services, or new connections.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Tunele przenoszące protokół szóstej wersji przez sieć zbudowaną na starszym zaczynają zrywać połączenia przy chwilowym zakłóceniu
      - Starsze oprogramowanie nieumiejące nawiązać przerwanego połączenia ponownie zgłasza błąd nieregularnie
      - Na maszynie z protokołem szóstej wersji wyłączonym zmiana nie ma skutku żadnego i punkt jest czystym porządkiem
      - Połączenia protokołem starszym, łączność w sieci lokalnej i usługi pozostają bez zmian
    en:
      - Tunnels carrying the sixth version protocol across a network built on the older one begin breaking connections at a passing disturbance
      - Older software unable to make a broken connection afresh reports an error irregularly
      - On a machine with the sixth version protocol switched off the change has no effect whatever and the item is pure tidiness
      - Connections over the older protocol, connectivity on a local network and services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna korzysta z tunelu przenoszącego protokół szóstej wersji przez sieć zbudowaną na starszym
      - Na maszynie działa starsze oprogramowanie, o którym nie wiadomo, czy umie nawiązać przerwane połączenie ponownie
    en:
      - The machine uses a tunnel carrying the sixth version protocol across a network built on the older one
      - Older software runs on the machine and it is not known whether it can make a broken connection afresh
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is named as in the older stack, but lives in the key of the
      # sixth version protocol and is counted separately from it.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
      $name = 'TcpMaxDataRetransmissions'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
    $name = 'TcpMaxDataRetransmissions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'TcpMaxDataRetransmissions' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Reguła istnieje osobno wyłącznie dlatego, że stosy liczą powtórzenia
    niezależnie, i aplikacja powinna to mówić wprost. Bez tego zdania oba
    punkty wyglądają na duplikat i czytelnik odhaczy jeden, sądząc, że
    załatwił obydwa.

    Wdrażać trzeba je razem. Maszyna utwardzona w jednym stosie, a nie
    w drugim, zachowuje się rozbieżnie i przy diagnozie to właśnie ta
    rozbieżność kosztuje najwięcej czasu — objaw zależy wtedy od tego, jaki
    adres wybrała strona łącząca się.

    Uwaga o domyślnym pierwszeństwie protokołu szóstej wersji warto pokazać
    przy obu punktach. Powszechne założenie, że „i tak wszystko idzie
    starszym protokołem", jest na tym wydaniu systemu nieprawdziwe,
    a właśnie ono prowadzi do pomijania tej reguły.
  en: |
    The rule exists apart solely because the stacks count repeats independently, and
    the application should say so outright. Without that sentence the two items look
    like a duplicate and the reader will tick one off supposing they have settled
    both.

    They must be rolled out together. A machine hardened in one stack and not in the
    other behaves inconsistently, and in diagnosis it is that inconsistency that
    costs most time - the symptom then depends on what address the connecting side
    picked.

    The remark about the sixth version protocol being preferred by default is worth
    showing at both items. The common assumption that "everything goes over the
    older protocol anyway" is untrue on this release of the system, and it is
    exactly that assumption which leads to this rule being passed over.
