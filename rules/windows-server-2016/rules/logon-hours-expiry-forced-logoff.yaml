id: win2016-logon-hours-expiry-forced-logoff

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wylogowanie po upływie dozwolonych godzin pracy wymuszane
    en: Signing out once the allowed working hours pass enforced
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, co dzieje się z sesją użytkownika, któremu skończyły
    się dozwolone godziny logowania: ma zostać zamknięta, a nie trwać dalej.

    Ograniczenie godzin pracy jest cechą konta w katalogu i bez tego ustawienia
    działa tylko w jedną stronę. Blokuje rozpoczęcie nowej sesji po godzinach,
    ale nie rusza sesji już otwartej. Osoba, która zalogowała się o
    siedemnastej, pracuje spokojnie do rana — a ograniczenie, na którym ktoś
    oparł kontrolę dostępu, okazuje się kurtyną z jednej strony.

    To jest właściwa treść tego punktu: bez niego godziny logowania są
    ustawieniem pozornym. Ich zapis w katalogu wygląda tak, jakby obowiązywał,
    raport zgodności pokazuje, że konta mają ograniczenia, a faktyczny dostęp
    nie jest ograniczony niczym poza porą pierwszego logowania.

    Na serwerze skutek dotyczy przede wszystkim połączeń do zasobów — udziałów
    plików i sesji sieciowych — bo to one żyją najdłużej i najczęściej
    przeciągają się poza godziny pracy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję działającą
    poza oknem czasowym, w którym ktokolwiek na nią patrzy, założoną na koncie,
    które formalnie nie ma wtedy prawa dostępu.
  en: |
    The setting decides what happens to the session of a user whose allowed sign-in
    hours have run out: it is to be shut rather than to carry on.

    A limit on working hours is a property of an account in the directory and
    without this setting works only one way. It blocks the starting of a new session
    after hours but does not touch a session already open. A person who signed in at
    five o'clock works on undisturbed until morning - and the limit somebody rested
    their access control on turns out to be a curtain on one side only.

    That is this item's proper substance: without it, sign-in hours are a setting in
    appearance only. Their record in the directory looks as though it holds, a
    compliance report shows that accounts have limits, and actual access is limited
    by nothing beyond the hour of the first sign-in.

    On a server the effect concerns above all connections to resources - file shares
    and network sessions - since it is those that live longest and most often run
    past working hours.

    What an attacker gains while the item goes unmet: a session working outside the
    window of time in which anybody is looking at it, made on an account that
    formally has no right of access then.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedna z niewielu reguł w tym
    zestawie, w której zmiana potrafi przerwać komuś pracę w trakcie.

    Zamknięcie sesji nie jest uprzejme. Otwarty dokument na udziale sieciowym,
    trwający zapis, przeciągająca się operacja — wszystko to kończy się
    w chwili, w której wybije godzina. Nie ma tu okna na zapisanie zmian.

    Drugi scenariusz jest cichszy i częstszy, przez co gorszy. Konta usług
    i konta techniczne bywają w katalogu założone jak konta zwykłych ludzi,
    razem z odziedziczonymi godzinami pracy. Dopóki nikt nie wymuszał
    wylogowania, nie miało to znaczenia — po zmianie usługa zostaje odcięta
    wieczorem i zgłasza się jako awaria następnego ranka.

    Trzeci dotyczy pracy zmianowej i stref czasowych. Godziny w katalogu są
    liczone według zegara kontrolera domeny, a nie według miejsca, w którym
    siedzi człowiek. Zespół pracujący w innej strefie potrafi trafić na koniec
    okna w środku swojego dnia pracy.

    Przed wdrożeniem trzeba przejrzeć dwie rzeczy: które konta mają
    w ogóle ustawione godziny i czy któreś z nich nie jest kontem technicznym.

    Czego to nie psuje: kont bez ustawionych godzin pracy, sesji lokalnych na
    konsoli, zadań zaplanowanych działających na koncie systemowym ani usług
    uruchomionych pod kontem maszyny.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and it is one of the few rules in this
    set where the change can cut somebody's work off midway.

    Shutting a session is not a courteous act. An open document on a network share,
    a write in progress, an operation running long - all of it ends at the moment
    the hour strikes. There is no window here for saving changes.

    The second scenario is quieter and more common, and worse for that. Service
    accounts and technical accounts are at times set up in the directory as
    ordinary people's accounts are, inherited working hours included. So long as
    nobody enforced the signing out it did not matter - after the change the service
    is cut off in the evening and reports itself as a fault the next morning.

    The third concerns shift work and time zones. The hours in the directory are
    reckoned by the domain controller's clock, not by the place the person sits. A
    team working in another zone can meet the end of the window in the middle of
    their working day.

    Two things have to be looked over before the rollout: which accounts have hours
    set at all, and whether any of them is a technical account.

    What this does not break: accounts with no working hours set, local sessions at
    the console, scheduled tasks running under the system account, or services
    running under the machine account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - scripting-and-automation
  what_breaks:
    pl:
      - Sesja zostaje zamknięta bez okna na zapisanie zmian — otwarty dokument na udziale sieciowym przepada
      - Konto techniczne z odziedziczonymi godzinami pracy zostaje odcięte wieczorem i zgłasza się jako awaria rano
      - Zespół w innej strefie czasowej trafia na koniec okna w środku swojego dnia pracy
      - Konta bez ustawionych godzin, zadania na koncie systemowym i usługi pod kontem maszyny pozostają bez zmian
    en:
      - The session is shut with no window for saving changes - an open document on a network share is lost
      - A technical account with inherited working hours is cut off in the evening and reports itself as a fault in the morning
      - A team in another time zone meets the end of the window in the middle of their working day
      - Accounts without hours set, tasks under the system account and services under the machine account stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie przejrzano, które konta mają ustawione godziny pracy, i nie wiadomo, czy nie ma wśród nich kont technicznych
      - Organizacja pracuje zmianowo albo w kilku strefach czasowych, a godziny w katalogu liczą się według zegara kontrolera domeny
    en:
      - It has not been looked over which accounts have working hours set, and whether any technical accounts are among them
      - The organisation works in shifts or across several time zones, while the hours in the directory count by the domain controller clock
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting lives in the security policy rather than in the registry, so it is
      # read from an export of that policy.
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ForceLogoffWhenHourExpire\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'MISSING' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^ForceLogoffWhenHourExpire\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'ForceLogoffWhenHourExpire'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The hours themselves are a property of the account in the directory. This
    # setting only decides whether an open session honours them.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ForceLogoffWhenHourExpire = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ForceLogoffWhenHourExpire = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-force-logoff-when-logon-hours-expire

notes:
  pl: |
    Reguła nie ustawia godzin pracy i nie sprawdza, czy ktokolwiek je ma.
    Rozstrzyga wyłącznie, czy sesja już otwarta je uszanuje. Na maszynie
    w organizacji, która nie korzysta z godzin logowania, zmiana jest zgodna
    i bez skutku — i raport powinien to rozróżniać.

    Warto czytać ten punkt razem z regułą o rozłączaniu bezczynnych sesji
    sieciowych. Obie zamykają sesję, która przestała być uprawniona, tylko
    jedna liczy czas, a druga patrzy na zegar.

    Ustawienie mieszka w zasadach zabezpieczeń, a nie w rejestrze, więc audyt
    czyta je z eksportu tych zasad. Bez uprawnień administratora eksport się
    nie uda i reguła zgłosi to jako niemożność sprawdzenia, a nie jako brak
    zgodności.
  en: |
    The rule sets no working hours and does not check whether anybody has them. It
    settles only whether a session already open honours them. On a machine in an
    organisation that makes no use of sign-in hours the change is compliant and
    without effect - and the report should tell that apart.

    The item is worth reading together with the rule on disconnecting idle network
    sessions. Both shut a session that has ceased to be entitled, only one counts
    time and the other watches the clock.

    The setting lives in the security policy rather than in the registry, so the
    audit reads it from an export of that policy. Without administrator rights the
    export will not succeed and the rule reports that as an inability to check, not
    as non-compliance.
