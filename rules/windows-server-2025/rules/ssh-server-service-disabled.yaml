id: win2025-ssh-server-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera powłoki zdalnej wyłączona
    en: The remote shell server service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę serwera powłoki zdalnej. Usługa ta nasłuchuje na
    połączenia i pozwala zdalnie uruchamiać polecenia na tej maszynie
    oraz kopiować na nią i z niej pliki.

    Zostawiam kategorię wysoką. Jest to trzecia droga zdalnego wykonywania
    poleceń na serwerze, obok pulpitu zdalnego i zarządzania poleceniami,
    i każda z nich ma osobną regułę. Nie jest to powtórzenie — to są
    osobne wejścia, z osobnymi ustawieniami i osobnymi uprawnieniami, a
    zamknięcie dwóch z nich nie zamyka trzeciej.

    Ta ma jednak cechę, której tamte nie mają, i to ona decyduje o ocenie.
    Uwierzytelnia się do niej kluczem. Klucz nie wygasa, nie podlega
    polityce haseł, nie widać go w narzędziach pilnujących kont i nie
    znika, gdy komuś kończy się współpraca. Wpis dodany do pliku kluczy
    na serwerze jest dostępem trwałym, którego zwykłe przeglądy kont
    po prostu nie obejmują.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trzecią
    drogę wykonywania poleceń na serwerze i sposób pozostawienia na nim
    dostępu, którego przegląd kont nie wykryje.
  en: |
    The item switches off the server service of the far-off shell. That service listens for bindings
    and lets commands be run upon that machine from afar and files be copied onto it and off it.

    I leave the category high. It is the third road of the running of commands upon a server from
    afar, beside the far-off board and the ruling by commands, and each of them has a rule of its own.
    It is no saying twice - these are sundered ways in, with sundered settings and sundered leaves,
    and the shutting of two of them shuts not the third.

    This one has, though, a mark the others have not, and it is that which settles the reckoning. One
    is known to it by a key. A key does not run out, stands under no rule of words of passing, is not
    seen in the tools that watch over standings, and goes not away when somebody's working together
    comes to an end. An entry set into the file of keys upon the server is a lasting reach that the
    common looking over of standings simply does not take in.

    What an attacker gains while the item goes unmet - a third road of the running of commands upon
    the server, and a way of leaving upon it a reach that a looking over of standings will not find.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" z tego samego powodu,
    co przy zarządzaniu poleceniami: zamykasz drogę, którą ktoś wchodzi na
    tę maszynę, a jeżeli mylisz się co do tego, kto nią wchodzi, mylisz
    się w sposób trudny do naprawienia zdalnie.

    Są tu dwie sprawy własne dla tej usługi.

    Pierwsza to najostrzejszy przypadek zasady, którą powtarzam w tej
    paczce: polecenie zrywa sesję, z której jest wydawane. Człowiek
    zalogowany tą drogą i wykonujący tę regułę rozłącza sam siebie, i to
    w połowie roboty. Znaj drogę awaryjną — kartę zarządzania albo konsolę
    hipernadzorcy — zanim ruszysz, i sprawdź ją logując się, a nie czytając
    dokumentację.

    Druga jest specyficzna dla środowisk mieszanych i łatwo ją przeoczyć,
    bo powłoka zdalna nie kojarzy się z serwerem tego systemu. Tą drogą
    coraz częściej chodzi automatyzacja prowadzona spoza Windowsa:
    wdrożenia z potoku budowania, narzędzia orkiestracji sterujące
    maszynami różnych systemów jednym sposobem, kopiowanie artefaktów.
    Strony te logują się kluczem, działają bez człowieka i nie zgłaszają
    problemu — zgłaszają go dopiero zadania, które od nich zależą, i to
    zwykle po stronie zupełnie innego zespołu.

    Sprawdzenie sprowadza się do jednego pytania: czy ktokolwiek albo
    cokolwiek wchodzi na tę maszynę tą drogą. Odpowiedź „ludzie nie" nie
    wystarczy.

    Zmiana cofa się natychmiast, ale cofnąć ją musi ktoś, kto ma inną
    drogę wejścia.
  en: |
    I leave the class "needs a witting rolling out" of the same ground as at the ruling by commands -
    you shut a road by which somebody comes onto that machine, and if you be wrong as to who comes by
    it, you are wrong in a way hard to mend from afar.

    There are here two matters of that service's own.

    The first is the sharpest case of a rule I say over in this pack - the command breaks off the
    sitting it is given from. A person signed in by that road and carrying out that rule unbinds
    themselves, and that in the midst of the work. Know the road of need - the card of ruling or the
    board of the overseer of machines - before you stir, and look to it by signing in and not by
    reading what is written down.

    The second is of mingled settings and is easily overlooked, a far-off shell not calling to mind a
    server of this system. By that road there goes ever more of the working of itself led from outside
    Windows - rollings out off a pipe of building, tools of ordering that steer machines of sundry
    systems by one way, the copying of wrought things. Those sides sign in by a key, work without a
    person and give word of no trouble - word is given rather by the tasks that hang upon them, and
    that mostly on the side of a wholly other band.

    The checking comes to one question - whether anybody or anything comes onto that machine by that
    road. The answer "people do not" is not enough.

    The change is undone at once, but it must be undone by somebody who has another road in.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - network-and-firewall
  what_breaks:
    pl:
      - Polecenie zrywa sesję powłoki zdalnej, z której jest wydawane, w połowie roboty
      - Wdrożenia prowadzone z potoku budowania spoza Windowsa przestają docierać na tę maszynę
      - Narzędzia orkiestracji sterujące maszynami różnych systemów tracą do niej dostęp
      - Kopiowanie artefaktów tą drogą przestaje działać i nie zgłasza tego żaden człowiek
      - Zgłaszają problem dopiero zadania zależne, zwykle po stronie zupełnie innego zespołu
    en:
      - The command breaks off the sitting of the far-off shell it is given from, in the midst of the work
      - Rollings out led off a pipe of building outside Windows stop reaching that machine
      - Tools of ordering that steer machines of sundry systems lose their reach to it
      - The copying of wrought things by that road stops working and no person gives word of it
      - Word is given rather by the hanging tasks, mostly on the side of a wholly other band
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie sprawdzono drogi awaryjnej wejścia na maszynę przez faktyczne zalogowanie się nią
      - Tą drogą wchodzi na maszynę automatyzacja prowadzona spoza Windowsa albo potok wdrożeniowy
    en:
      - The road of need onto the machine was not looked to by a true signing in through it
      - A working of itself led from outside Windows or a pipe of rolling out comes onto the machine by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sshd'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sshd'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off any remote shell session open at this
    # moment, including a session this command is being run from. Verify the
    # out-of-band route by signing in through it first.
    Stop-Service -Name 'sshd' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'sshd' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'sshd' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/administration/openssh/openssh_overview

notes:
  pl: |
    Trzecia droga zdalnego wykonywania poleceń, obok pulpitu zdalnego
    i zarządzania poleceniami. Nie jest to powtórzenie tamtych reguł —
    to osobne wejścia, z osobnymi ustawieniami, a zamknięcie dwóch nie
    zamyka trzeciej.

    Cecha własna tej usługi, decydująca o ocenie: uwierzytelnia się do
    niej kluczem. Klucz nie wygasa, nie podlega polityce haseł, nie widać
    go w narzędziach pilnujących kont i nie znika, gdy komuś kończy się
    współpraca — więc przegląd kont go nie wykryje.

    Łatwe do przeoczenia w środowiskach mieszanych: tą drogą chodzi
    automatyzacja prowadzona spoza Windowsa. Odpowiedź „ludzie tędy nie
    wchodzą" nie wystarczy.
  en: |
    The third road of the running of commands from afar, beside the far-off board and the ruling by
    commands. It is no saying over of those rules - these are sundered ways in, with sundered
    settings, and the shutting of two shuts not the third.

    The mark of that service's own, settling the reckoning - one is known to it by a key. A key does
    not run out, stands under no rule of words of passing, is not seen in the tools that watch over
    standings and goes not away when somebody's working together comes to an end - so a looking over
    of standings will not find it.

    Easily overlooked in mingled settings - by that road there goes the working of itself led from
    outside Windows. The answer "people do not come this way" is not enough.
