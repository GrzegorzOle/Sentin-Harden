id: win2025-vendor-settings-auditing-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Rejestrowanie pobrań ze zdalnej usługi konfiguracyjnej włączone
    en: Logging of downloads from the remote configuration service turned on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza rejestrowanie tego, co maszyna pobrała ze zdalnej usługi
    konfiguracyjnej.

    Kategoria niska i chcę to powiedzieć wprost, zamiast podnosić ją dla
    powagi. Ta reguła niczego nie blokuje. Nie zamyka żadnej drogi i nie
    odbiera napastnikowi żadnej możliwości. Jej wartość jest inna: sprawia,
    że po fakcie da się odpowiedzieć na pytanie, co i kiedy tą drogą
    przyszło.

    Wartość taka nie jest jednak żadna, i dlatego punkt istnieje. Kanał,
    którym przychodzą ustawienia spoza procedury zmian organizacji, jest
    dokładnie tym miejscem, w którym zapis ma sens największy — bo zmiana
    stamtąd nie zostawia po sobie nic innego. Bez rejestrowania rozbieżność
    między stanem zakładanym a rzeczywistym jest nie tylko możliwa, ale
    i niewyjaśnialna.

    Na serwerze ma to ten dodatkowy sens, że serwer jest maszyną, o którą
    audyt pyta imiennie. „Nie wiem, skąd wzięło się to ustawienie" jest
    odpowiedzią gorszą niż samo ustawienie.

    Punkt ma sens również wtedy, gdy pobieranie zostało wyłączone. Zapis
    pokaże wówczas, czy wyłączenie rzeczywiście działa — a to jest
    informacja warta osobnego wpisu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost,
    ale zmiana wprowadzona tym kanałem nie zostawia śladu, po którym dałoby
    się ją później odtworzyć.
  en: |
    The item turns on the logging of what the machine has downloaded from the
    remote configuration service.

    The category is low, and I want to say so plainly rather than raise it
    for gravity. This rule blocks nothing. It closes no road and takes no
    possibility from an attacker. Its value is of another kind: it makes it
    possible, after the fact, to answer what came down that road and when.

    Such a value is not nothing, though, and that is why the item exists. A
    channel down which settings arrive from outside the organisation's
    procedure for changes is exactly the place where a record has the
    greatest point - because a change from there leaves nothing else behind.
    Without the logging, a divergence between the assumed and the actual
    state is not only possible but unexplainable.

    On a server this has the further point that a server is a machine an
    audit asks about by name. "I do not know where that setting came from" is
    a worse answer than the setting itself.

    The item has a point even when the downloading has been switched off. The
    record will then show whether the switching off genuinely works - and
    that is information worth an entry of its own.

    What an attacker gains while the item goes unmet: nothing directly, but a
    change introduced down this channel leaves no trace by which it could
    later be reconstructed.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to jeden z tych punktów, przy których
    można powiedzieć to bez zastrzeżeń. Reguła dodaje zapis, a zapisy
    niczego nie blokują.

    Skutek jedyny: w dzienniku przybędzie wpisów. Ich liczba jest niewielka,
    bo mechanizm odpytuje usługę rzadko, a nie przy każdej czynności. Nie
    ma tu ryzyka zapełnienia dziennika ani utraty starszych zdarzeń przez
    zalew nowych.

    Czego to nie psuje: niczego. Nie zmienia zachowania żadnego składnika,
    nie dotyka sieci, nie wpływa na wydajność w sposób mierzalny.

    Rzecz do zapamiętania: ten punkt i wyłączenie samego pobierania leżą pod
    tym samym kluczem i są dwoma osobnymi ustawieniami. Warto zrobić oba —
    jedno zamyka drogę, drugie pozwala sprawdzić, czy jest zamknięta.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption", and this is one of those items where that
    can be said without reservation. The rule adds a record, and records
    block nothing.

    The only effect: there will be more entries in the log. Their number is
    small, because the mechanism queries the service rarely rather than at
    every action. There is no risk here of filling the log or of losing older
    events under a flood of new ones.

    What this does not break: nothing. It changes the behaviour of no
    component, does not touch the network, and does not affect performance
    measurably.

    Something to remember: this item and the switching off of the downloading
    itself lie under the same key and are two separate settings. Both are
    worth doing - one closes the road, the other lets one check that it is
    closed.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Nic — reguła dodaje zapis, a zapisy niczego nie blokują
      - W dzienniku przybędzie wpisów, ale niewiele, bo mechanizm odpytuje usługę rzadko, a nie przy każdej czynności
      - Nie ma ryzyka zapełnienia dziennika ani utraty starszych zdarzeń przez zalew nowych
      - Punkt i wyłączenie samego pobierania są dwoma osobnymi ustawieniami — warto zrobić oba
    en:
      - Nothing - the rule adds a record, and records block nothing
      - There will be more entries in the log, but few, because the mechanism queries the service rarely rather than at every action
      - There is no risk of filling the log or of losing older events under a flood of new ones
      - This item and the switching off of the downloading are two separate settings - both are worth doing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik na tej maszynie jest tak ciasno wymierzony, że każdy dodatkowy strumień zdarzeń wypycha z niego starsze wpisy
    en:
      - The log on this machine is so tightly sized that every extra stream of events pushes older entries out of it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'EnableOneSettingsAuditing'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'EnableOneSettingsAuditing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The rule blocks nothing; it makes it possible to answer afterwards what
    # came down this channel and when. A change arriving that way leaves nothing
    # else behind. It has a point even where the downloading is switched off: the
    # record then shows whether the switching off genuinely works.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableOneSettingsAuditing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

