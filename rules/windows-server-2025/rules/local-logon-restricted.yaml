id: win2025-local-logon-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie lokalne zastrzeżone dla administratorów
    en: Logging on locally restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo rozstrzyga, kto może założyć sesję interaktywną przy konsoli
    maszyny.

    Na stanowisku roboczym jest to prawo oczywiste — użytkownik siada
    przed swoim komputerem i się loguje. Na serwerze rzecz wygląda
    inaczej i to jest sedno różnicy między paczkami. Do serwera nikt
    nie siada. Praca na nim odbywa się przez pulpit zdalny albo przez
    zarządzanie zdalne, a konsola jest drogą wyjątkową, po którą sięga
    się wtedy, gdy zawiodły pozostałe.

    Wyjątkowość ta ma wartość obronną tylko wtedy, gdy konsola jest
    zawężona. Warto przy tym pamiętać, że „konsola" serwera nie jest
    tym samym co ekran na biurku: zalicza się do niej karta
    zarządzająca i konsola hosta wirtualizacji, a obie są dostępne
    przez sieć. Sesja przy konsoli omija to, co pilnuje sesji zdalnej,
    i nie podlega ograniczeniom nałożonym na pulpit zdalny.

    Punkt zawęża wykaz do administratorów. Różni się tym od paczki
    stanowiska roboczego, gdzie w wykazie zgodnym są również
    użytkownicy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    sesji interaktywnej na serwerze z konta zwykłego, z pominięciem
    ograniczeń nałożonych na pulpit zdalny.
  en: |
    The right settles who may open an interactive session at the machine's console.

    At a working station it is a plain right - a user sits before their computer and logs in. On
    a server the matter looks otherwise, and that is the heart of the difference between the
    packs. Nobody sits at a server. Work on it goes by remote desktop or by remote management,
    and the console is an exceptional road, reached for when the others have failed.

    That exceptionality is worth something in defence only where the console is narrowed. It is
    worth keeping in mind, moreover, that a server's "console" is not the screen on a desk: the
    management card and the virtualisation host's console count within it, and both are open
    over the network. A session at the console goes round what watches a remote session and does
    not fall under the bounds set on remote desktop.

    The item narrows the list to administrators. It differs thereby from the working station's
    pack, where users stand in the compliant list as well.

    What an attacker gains while the item goes unmet: a road to an interactive session on the
    server from an ordinary account, with the bounds set on remote desktop passed by.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy części osób i wymaga
    uprzedzenia ich, zanim zostanie wprowadzona.

    Warunkiem wstępnym jest sprawna droga powrotu. Zanim zawęzisz
    logowanie przy konsoli, upewnij się, że logowanie przez pulpit
    zdalny działa dla konta, którym się posługujesz, i że karta
    zarządzająca odpowiada. Jest to jedyny punkt w tej grupie, przy
    którym błąd potrafi odciąć od maszyny osobę, która zmianę
    wprowadza.

    Najważniejsze zdanie praktyczne brzmi jednak inaczej: logowanie
    przez pulpit zdalny nie zależy od tego prawa. Rządzi nim prawo
    osobne i zawężenie tego punktu pulpitu zdalnego nie dotyka.
    Nieporozumienie w tej sprawie jest najczęstszym powodem
    odpuszczania punktu.

    W stanie domyślnym na serwerze członkowskim prawo mają
    administratorzy, użytkownicy i operatorzy kopii zapasowych,
    a na kontrolerze domeny dodatkowo operatorzy serwera, wydruku
    i kont. To właśnie te grupy zawężenie odcina od konsoli.

    Skutek jest natychmiastowy i widoczny. Osoba spoza wykazu wpisuje
    poświadczenia poprawnie i dostaje komunikat o braku prawa do
    zalogowania się lokalnie — nie o złym haśle. Komunikat jest
    czytelny, co ułatwia diagnozę.

    Zmiana nie dotyka sesji już otwartych i nie wymaga restartu.
  en: |
    The change surely changes how some people work and takes a warning to them before it is
    brought in.

    The precondition is a working road back. Before narrowing the logging in at the console,
    make sure that logging in by remote desktop works for the account you use and that the
    management card answers. It is the one item in this group where a mistake can cut the person
    making the change off from the machine.

    The weightiest practical sentence runs otherwise, though: logging in by remote desktop does
    not hang on this right. A separate right governs it, and a narrowing of this item does not
    touch remote desktop. A misunderstanding in that matter is the commonest reason the item is
    let go.

    In the default state on a member server administrators, users and backup operators hold the
    right, and on a domain controller server, print and account operators besides. It is those
    groups the narrowing cuts off from the console.

    The effect is immediate and plain to see. A person outside the list enters their credentials
    rightly and gets a message about wanting the right to log on locally - not about a wrong
    password. The message is clear, which eases the diagnosis.

    The change does not touch sessions already open and takes no restart.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Użytkownicy i operatorzy kopii zapasowych stracą możliwość zalogowania się przy konsoli serwera
      - Na kontrolerze domeny prawo tracą także operatorzy serwera, wydruku i kont
      - Logowanie przez pulpit zdalny nie zależy od tego prawa i działa bez zmiany
      - Komunikat mówi wprost o braku prawa do logowania lokalnego, a nie o złym haśle
    en:
      - Users and backup operators will lose the means of logging in at the server's console
      - On a domain controller server, print and account operators lose the right as well
      - Logging in by remote desktop does not hang on this right and works unchanged
      - The message speaks plainly of wanting the right to log on locally rather than of a wrong password
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sprawdzono, czy logowanie przez pulpit zdalny działa dla konta wprowadzającego zmianę
      - Obsługa serwera przy konsoli należy do osób, którym celowo nie nadano uprawnień administratora
      - Karta zarządzająca maszyny nie odpowiada albo nie została skonfigurowana
    en:
      - It has not been checked whether logging in by remote desktop works for the account making the change
      - The tending of the server at the console belongs to people purposely not granted administrative rights
      - The machine's management card does not answer or was never set up
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeInteractiveLogonRight = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/allow-log-on-locally

notes:
  pl: |
    Wykaz zgodny obejmuje wyłącznie administratorów. W paczce stanowiska
    roboczego dopuszczeni są również użytkownicy — na serwerze nie,
    i jest to różnica celowa.

    Logowanie przez pulpit zdalny rządzi się prawem osobnym i nie zależy
    od tego punktu. Jest to najczęstsze nieporozumienie przy tej regule.

    Przed zawężeniem sprawdź drogę powrotu: działający pulpit zdalny dla
    konta wprowadzającego zmianę oraz odpowiadającą kartę zarządzającą.
    Punkt zostaje poza trybem zbiorczym.
  en: |
    The compliant list takes in administrators alone. In the working station's pack users are
    allowed as well - on a server they are not, and that difference is on purpose.

    Logging in by remote desktop is governed by a separate right and does not hang on this item.
    That is the commonest misunderstanding at this rule.

    Before the narrowing, check the road back: a working remote desktop for the account making
    the change and a management card that answers. The item stays outside the bulk mode.
