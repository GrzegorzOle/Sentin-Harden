id: win2025-infrared-monitor-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa nadzoru łącza podczerwonego wyłączona
    en: The monitor service for the infrared link disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę nadzorującą łącze podczerwone — wykrywającą
    urządzenia w zasięgu i obsługującą przesyłanie plików tą drogą.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej, ale nie
    do zera, i chcę powiedzieć osobno, co obniżam, a czego nie.

    Obniżam dlatego, że sprzętu praktycznie nie ma. Serwer w szafie nie
    ma nadajnika podczerwieni, a bez sprzętu usługa nie ma czym się
    zajmować.

    Nie obniżam do zera dlatego, że gdzie sprzęt jest, tam rzecz wygląda
    inaczej niż przy większości punktów w tej paczce. Jest to kanał
    przesyłania plików, który nie przechodzi przez sieć. Nie widzi go
    zapora, nie widzi go rejestrowanie ruchu, nie widzi go nic
    z tego, co postawiono po to, żeby wiedzieć, co z maszyny wychodzi
    i co do niej wchodzi. Warunkiem jest bliskość fizyczna, a więc jest
    to zagrożenie dla maszyn, do których ktoś podchodzi — i dokładnie te
    maszyny bywają najsłabiej pilnowane, bo stoją poza serwerownią.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tam, gdzie
    sprzęt jest, drogę wniesienia i wyniesienia plików omijającą sieć
    i wszystko, czym się sieć obserwuje.
  en: |
    The item switches off the service that watches over the infrared link - that finds devices within
    reach and deals with the bearing of files by that road.

    I lower the category to low against the reckoning for a workstation, but not to nothing, and I
    would say on its own what I lower and what I do not.

    I lower it for that the gear is as good as never there. A server in a press has no sender of
    infrared, and without the gear the service has nothing to busy itself with.

    I lower it not to nothing for that where the gear is, the thing looks otherwise than at most items
    in this pack. It is a channel for the bearing of files that goes not through the net. The wall of
    fire sees it not, the writing down of traffic sees it not, nothing sees it of all that was set up
    to know what goes out of the machine and what comes into it. It takes a bodily nearness, so it is
    a threat to the machines that somebody walks up to - and just those machines are at times the
    least watched over, standing as they do outside the room of servers.

    What an attacker gains while the item goes unmet - where the gear is, a road for the bearing in and
    the bearing out of files that goes about the net and about everything whereby the net is watched.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i posługuję się tym samym
    rozumowaniem, które zapisałem przy udostępnianiu połączenia przez
    sieć bezprzewodową: scenariusz, w którym ktoś ucierpi, wymaga sprzętu,
    a tam gdzie sprzętu nie ma, zmiana jest bezskutkowa. Nie da się
    zepsuć czegoś, czego maszyna nie potrafi.

    Zastrzeżenie zapisuję w polu „kiedy nie stosować", bo istnieje realnie
    i nie chcę go chować w prozie. Maszyny przemysłowe, kasowe i część
    urządzeń brzegowych mają porty podczerwone i bywa, że coś przez nie
    przechodzi — odczyt z licznika, wymiana danych z terminalem.
    W takim miejscu zmiana zrywa działającą wymianę danych, a objawem
    będzie urządzenie, które przestało się zgłaszać, nie komunikat.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease" and go by the same reckoning I set down at the dealing out of a
    binding over the wireless net - the happening wherein somebody suffers takes gear, and where the
    gear is not, the change is of no outcome. One cannot break what the machine cannot do.

    The saving I write into the field "when not to lay it on", it being a true one and I would not hide
    it in the prose. Machines of industry, of tills and a share of the devices at the edge have steads
    for infrared, and at times something goes through them - a reading off a counter, a swapping of
    data with a till. In such a stead the change breaks a working swapping of data, and the showing
    will be a device that stopped calling in, and no message.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Przestaje działać wykrywanie urządzeń w zasięgu łącza podczerwonego i przesyłanie plików tą drogą
      - Na serwerze w szafie nie ma nadajnika podczerwieni, więc zmiana jest tam bezskutkowa
      - W maszynie przemysłowej albo kasowej zrywa się wymiana danych z terminalem lub odczyt z licznika
      - Objawem jest urządzenie, które przestało się zgłaszać, a nie komunikat na ekranie
    en:
      - The finding of devices within reach of the infrared link and the bearing of files by that road stop working
      - A server in a press has no sender of infrared, so the change is there of no outcome
      - In a machine of industry or of tills the swapping of data with a till or the reading off a counter is broken
      - The showing is a device that stopped calling in and no message upon a screen
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest urządzeniem przemysłowym, kasowym albo brzegowym i wymienia dane przez port podczerwony
    en:
      - The machine is a device of industry, of tills or of the edge and swaps data through a stead for infrared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A rack server has no infrared hardware and the change does nothing there.
    # On industrial, till and edge machines the port may carry real traffic -
    # check for that first, the symptom is a device that stops reporting.
    Stop-Service -Name 'irmon' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'irmon' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'irmon' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/introduction-to-irda

notes:
  pl: |
    Obniżam kategorię, bo sprzętu praktycznie nie ma. Nie obniżam do zera,
    bo gdzie sprzęt jest, rzecz wygląda inaczej niż przy większości
    punktów tej paczki: jest to kanał przesyłania plików, który nie
    przechodzi przez sieć — nie widzi go zapora ani rejestrowanie ruchu.

    Warunkiem jest bliskość fizyczna, więc zagrożone są maszyny, do
    których ktoś podchodzi — a te bywają najsłabiej pilnowane, bo stoją
    poza serwerownią.

    Klasa obniżona tym samym rozumowaniem, co przy udostępnianiu
    połączenia przez sieć bezprzewodową: scenariusz wymaga sprzętu,
    a bez sprzętu zmiana jest bezskutkowa.
  en: |
    I lower the category, the gear being as good as never there. I lower it not to nothing, for where
    the gear is, the thing looks otherwise than at most items of this pack - it is a channel for the
    bearing of files that goes not through the net; the wall of fire sees it not, nor the writing down
    of traffic.

    It takes a bodily nearness, so the machines under threat are those somebody walks up to - and those
    are at times the least watched over, standing outside the room of servers.

    The class is lowered by the same reckoning as at the dealing out of a binding over the wireless net
    - the happening takes gear, and without the gear the change is of no outcome.
