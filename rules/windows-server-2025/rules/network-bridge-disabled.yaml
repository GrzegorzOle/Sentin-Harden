id: win2025-network-bridge-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Tworzenie mostka sieciowego zabronione
    en: Creating a network bridge forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Mostek sieciowy łączy dwie karty maszyny w jedną sieć na poziomie
    ramek. Ruch, który wszedł jedną kartą, wychodzi drugą, omijając
    wszystko, co między tymi sieciami postawiono.

    Na stanowisku roboczym jest to zwykle nieporozumienie jednej osoby.
    Na serwerze jest to zdjęcie granicy, o której ktoś kiedyś świadomie
    zdecydował — i tu leży właściwa waga tego punktu.

    Serwer ma karty w różnych sieciach nie przypadkiem. Karta
    produkcyjna, karta zarządzania, karta kopii zapasowych, karta
    pamięci masowej — rozdział między nimi jest zwykle jedynym
    zabezpieczeniem, jakie te sieci w ogóle mają, bo wewnątrz każdej
    z nich ruch chodzi swobodnie. Mostek zdejmuje ten rozdział jedną
    czynnością i nie zostawia po sobie nic, co rzucałoby się w oczy:
    zapora dalej stoi, reguły dalej są, tylko ruch już ich nie dotyka.

    Sieć zarządzania jest w tym rachunku najgorszym przypadkiem. Zwykle
    jest płaska, zwykle nie ma w niej uwierzytelnienia na poziomie
    sieci, a leżą w niej karty zarządzające serwerów i konsole
    hipernadzorców. Most między nią a siecią produkcyjną oddaje ją
    każdemu, kto do sieci produkcyjnej sięgnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zniesienia rozdziału między sieciami maszyny jedną
    czynnością, bez śladu w konfiguracji zapory.
  en: |
    A bridge of the net joins two cards of a machine into one net at the level of frames. Traffic
    that came in by one card goes out by the other, going round everything that was set between
    those nets.

    At a working station it is mostly one person's misunderstanding. On a server it is the taking
    away of a boundary somebody once knowingly decided upon - and there lies this item's true
    weight.

    A server has cards in sundry nets not by chance. A card for production, a card for management,
    a card for backups, a card for the store of data - the parting between them is mostly the only
    guard those nets have at all, traffic going freely within each of them. A bridge takes that
    parting away by one act and leaves behind nothing that strikes the eye - the firewall stands
    yet, the rules are yet there, only the traffic no longer touches them.

    The net of management is in this reckoning the worst case. It is mostly flat, mostly has no
    authentication at the net's level, and in it lie the managing cards of servers and the consoles
    of hypervisors. A bridge between it and the net of production hands it to anyone who reaches
    the net of production.

    What an attacker gains while the item goes unmet: the means of doing away with the parting
    between the machine's nets by one act, with no trace in the firewall's setup.

disruption_description:
  pl: |
    Na zwykłym serwerze zmiana nie odbiera niczego. Nikt tam mostków nie
    tworzy, a zakaz dotyczy rzeczy, której się nie używa.

    Jest jednak przypadek, dla którego zostawiam tę regułę poza trybem
    zbiorczym, i nazywam go wprost, zamiast pisać ogólne ostrzeżenie.

    Chodzi o gospodarzy maszyn wirtualnych. Przełącznik wirtualny roli
    hipernadzorcy to inny mechanizm niż mostek sieciowy systemu i ta
    zmiana go nie dotyka — maszyny wirtualne pracują dalej. Rzecz w tym,
    że konfiguracje sieciowe gospodarzy bywają budowane latami,
    warstwami, przez różne osoby, a to, co w nich rzeczywiście stoi,
    nie zawsze pokrywa się z tym, co miało stać. Zanim zamkniesz
    mechanizm mostkowania na takiej maszynie, sprawdź, czy któryś
    interfejs nie opiera się na nim faktycznie.

    Drugi przypadek jest rzadszy i również wart wymienienia: maszyny
    laboratoryjne i stanowiska testowe, na których mostek bywa
    narzędziem pracy, bo trzeba połączyć dwa segmenty na próbę.

    Poza tymi dwoma przypadkami zmiana jest niewidoczna. Karty pracują
    jak dotąd, zapora pracuje jak dotąd, żadne połączenie się nie
    zrywa. Zakaz dotyczy wyłącznie tworzenia mostka od nowa.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    On an ordinary server the change takes nothing away. Nobody makes bridges there, and the ban
    bears on a thing that is not used.

    There is, though, a case for which I leave this rule outside the bulk mode, and I name it
    outright rather than write a warning in general.

    It is about hosts of made-up machines. The made-up switch of the hypervisor's part is another
    mechanism than the system's bridge of the net, and this change does not touch it - the made-up
    machines work on. The thing is that the net setups of hosts are at times built over years, in
    layers, by sundry people, and what truly stands in them does not always answer to what was
    meant to stand. Before shutting the bridging mechanism on such a machine, check whether some
    interface does not in fact lean upon it.

    The second case is rarer and likewise worth naming - machines for trials and stations for
    testing, whereon a bridge is at times a tool of the work, two lengths having to be joined for
    a trial.

    Outside those two cases the change is unseen. The cards work as before, the firewall works as
    before, no connection is broken. The ban bears on the making of a bridge anew alone.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
  what_breaks:
    pl:
      - Na maszynie laboratoryjnej nie da się już połączyć dwóch segmentów mostkiem na próbę
      - Na gospodarzu maszyn wirtualnych trzeba sprawdzić, czy któryś interfejs nie opiera się na mostkowaniu
      - Przełącznik wirtualny roli hipernadzorcy to inny mechanizm i ta zmiana go nie dotyka
      - Istniejące połączenia i reguły zapory pracują bez zmian, zakaz dotyczy tworzenia mostka od nowa
    en:
      - On a machine for trials two lengths can no longer be joined by a bridge for a trial
      - On a host of made-up machines it must be checked whether some interface leans upon bridging
      - The made-up switch of the hypervisor's part is another mechanism and this change touches it not
      - Standing connections and firewall rules work unaltered, the ban bearing on the making of a bridge anew
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest gospodarzem wirtualizacji o konfiguracji sieciowej budowanej warstwami przez lata
      - Na stanowisku laboratoryjnym mostek sieciowy jest narzędziem pracy, a nie pomyłką
    en:
      - The machine is a host of virtualization with a net setup built in layers over years
      - At a station for trials a bridge of the net is a tool of the work and not a slip
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_AllowNetBridge_NLA'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_AllowNetBridge_NLA'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The ban bears on the making of a bridge anew. A bridge already standing is
    # not undone by it, so a host built in layers is checked before the change.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_AllowNetBridge_NLA' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/network-subsystem/net-sub-interface-metric

notes:
  pl: |
    Waga tego punktu na serwerze bierze się stąd, że rozdział między
    kartami jest zwykle jedynym zabezpieczeniem, jakie te sieci mają.
    Mostek zdejmuje go jedną czynnością i nie zostawia śladu
    w konfiguracji zapory — reguły dalej są, tylko ruch ich nie dotyka.

    Zostawiam regułę poza trybem zbiorczym z powodu gospodarzy
    wirtualizacji. Przełącznik wirtualny to inny mechanizm i zmiana go
    nie dotyka, ale konfiguracje sieciowe gospodarzy bywają budowane
    latami i warto sprawdzić, co faktycznie w nich stoi.

    Zakaz dotyczy tworzenia mostka od nowa. Mostek już istniejący nie
    zostaje przez tę zmianę rozebrany.
  en: |
    This item's weight on a server comes of the parting between cards being mostly the only guard
    those nets have. A bridge takes it away by one act and leaves no trace in the firewall's setup
    - the rules are yet there, only the traffic does not touch them.

    I leave the rule outside the bulk mode on account of hosts of virtualization. The made-up
    switch is another mechanism and the change touches it not, but hosts' net setups are at times
    built over years and it is worth checking what truly stands in them.

    The ban bears on the making of a bridge anew. A bridge already standing is not pulled down by
    this change.
