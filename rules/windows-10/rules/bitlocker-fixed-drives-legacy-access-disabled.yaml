id: win10-bitlocker-fixed-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Odczyt chronionego dysku stałego w starszych wersjach systemu wyłączony
    en: Reading a protected fixed data drive on earlier system versions disabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza dokładanie do zaszyfrowanego dysku stałego obszaru
    pozwalającego odczytać go w starszych wersjach systemu.

    Mechanizm ten powstał dla zgodności: dysk zaszyfrowany nowszym
    systemem otrzymuje niewielki obszar niezaszyfrowany, w którym leży
    program odczytujący i opis nośnika. Dzięki temu dysk podłączony do
    starszej maszyny daje się otworzyć.

    Cena jest podwójna. Po pierwsze, obszar ten jest niezaszyfrowany
    i jawnie opisuje nośnik — mówi, że dysk jest chroniony i w jaki
    sposób. Po drugie, i ważniejsze, zachęca do odblokowywania dysku na
    maszynach, nad którymi nikt nie panuje. Dysk otwarty na obcym
    komputerze jest otwarty tak samo, jak byłby na własnym.

    Wyłączenie tego obszaru zamyka wariant odczytu poza kontrolą. Dysk
    pozostaje czytelny wszędzie tam, gdzie system potrafi go obsłużyć sam,
    czyli na maszynach bieżących.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: jawny opis
    chronionego nośnika oraz przyzwolenie na otwieranie go gdziekolwiek.
  en: |
    The setting switches off the adding to an enciphered fixed data drive of a room that lets it be read upon
    earlier versions of the system.

    That mechanism came about for compatibility: a drive enciphered by a newer system gets a small unenciphered
    room holding a reading program and a description of the drive. By that a drive plugged into an older machine
    may be opened.

    The price is a double one. First, that room is unenciphered and describes the drive openly - it says the drive
    is guarded and in what manner. Second, and the weightier, it invites the unlocking of the drive upon machines
    nobody has a hand upon. A drive opened upon a strange computer is opened just as it would be upon one's own.

    The switching off of that room shuts the variant of reading outside one's hand. The drive stays readable
    everywhere the system can handle it of itself, which is to say upon machines of the day.

    What an attacker gains while the item goes unmet: an open description of a guarded drive and leave to open it
    anywhere at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktokolwiek nosi te dyski do starszych maszyn.

    Skutek jest wąski i dotyczy wyłącznie maszyn ze starszym systemem.
    Dysk zaszyfrowany po zmianie nie otworzy się na takiej maszynie
    w żaden sposób — nie pojawi się na nim program odczytujący i system nie
    będzie wiedział, co z nośnikiem zrobić.

    Miejscami, w których to boli, są stanowiska pomiarowe, maszyny sterujące
    urządzeniami i komputery pozostawione przy starszym systemie z powodu
    oprogramowania, którego nie da się przenieść. Jeżeli ktoś przenosi
    dane na takie stanowisko dyskiem zewnętrznym, ta droga się zamyka.

    Odnotowuję, że dyski zaszyfrowane wcześniej zachowują dołożony obszar
    i nadal otwierają się na starszych maszynach. Zmiana obowiązuje przy
    zakładaniu ochrony, nie wstecz.

    Na maszynach bieżących zmiana jest niewidoczna. Nikt nie zauważy
    różnicy, bo system radzi sobie z nośnikiem bez pomocy.

    Czego to nie psuje: odczytu na maszynach bieżących, zapisu, udziałów
    plikowych, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody carries these drives to older
    machines.

    The consequence is a narrow one and touches machines with an older system alone. A drive enciphered after the
    change will not open upon such a machine by any means - no reading program will show upon it and the system
    will not know what to do with the drive.

    The places at which that hurts are stations of measuring, machines driving apparatus and computers left upon
    an older system for the sake of software that cannot be carried over. Where somebody brings data to such a
    station by an outside drive, that road shuts.

    I set down that drives enciphered earlier keep the added room and still open upon older machines. The change
    holds at the laying on of the guarding and not backwards.

    Upon machines of the day the change is unseen. Nobody will mark a difference, the system handling the drive
    without help.

    What this does not break: reading upon machines of the day, writing, file shares, logging on, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Dysk zaszyfrowany po zmianie nie otworzy się w żaden sposób na maszynie ze starszym systemem
      - Przenoszenie danych dyskiem zewnętrznym na stanowiska pomiarowe i maszyny sterujące urządzeniami przestaje działać
      - Dyski zaszyfrowane wcześniej zachowują dołożony obszar i nadal otwierają się na starszych maszynach
      - Na maszynach bieżących zmiana jest niewidoczna, bo system radzi sobie z nośnikiem bez pomocy
      - Odczyt na maszynach bieżących, zapis, udziały plikowe, logowanie i drukowanie pozostają bez zmian
    en:
      - A drive enciphered after the change will not open by any means upon a machine with an older system
      - The bringing of data by an outside drive to stations of measuring and machines driving apparatus ceases to work
      - Drives enciphered earlier keep the added room and still open upon older machines
      - Upon machines of the day the change is unseen, the system handling the drive without help
      - Reading upon machines of the day, writing, file shares, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dane są przenoszone dyskiem na stanowiska ze starszym systemem, których nie da się zaktualizować
    en:
      - Data are brought by a drive to stations with an older system that cannot be brought up to date
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the word
      # <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '<none>'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'FDVDiscoveryVolumeType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text. The word <none> is the setting, not a stand-in
    # for an empty entry, and an empty string here means something else.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w tym bloku najmniej kosztowna i warto, żeby aplikacja
    pokazała ją wcześnie wśród punktów o dyskach stałych. Na maszynach
    bieżących nie zmienia niczego, a zamyka wariant, którego istnienia
    większość ludzi nie jest świadoma.

    Argument wart zachowania nie dotyczy samego obszaru zgodności, tylko
    tego, do czego on zachęca. Możliwość otwarcia dysku wszędzie jest
    wygodna, więc jest używana — a otwarcie chronionego dysku na obcej
    maszynie znosi sens jego szyfrowania w tej jednej chwili, w której
    najbardziej by się przydało.

    Odnotowuję postać wartości, bo bywa źródłem pomyłki. Jest to tekst,
    a zasada wyłączona zapisuje w nim słowo, nie pustkę. Wpis pusty znaczy
    tu co innego niż wpis ze słowem i sprawdzenie porównujące z pustym
    łańcuchem odpowiadałoby błędnie.
  en: |
    The rule is the least costly of this block, and it is well that the application show it early among the items
    about fixed drives. Upon machines of the day it changes nothing, and it shuts a variant most people are not
    aware exists.

    The argument worth keeping does not touch the room of compatibility itself but what it invites. The chance of
    opening a drive everywhere is a handy one, so it is used - and the opening of a guarded drive upon a strange
    machine undoes the sense of its enciphering in the one hour at which it would serve most.

    I set down the shape of the value, it being at times a ground of error. It is text, and the policy switched
    off writes a word in it and not a blank. An empty entry means here something other than an entry with the
    word, and a check set against an empty string would answer wrongly.
