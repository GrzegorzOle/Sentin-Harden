id: win11-sandbox-vgpu-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Współdzielenie karty graficznej z piaskownicą wyłączone
    en: Sharing of the graphics card with the sandbox disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy piaskownica ma korzystać z karty graficznej
    maszyny, czy rysować obraz wyłącznie mocą procesora.

    Punkt wygląda na wydajnościowy, a jest izolacyjny, i to jest w nim
    najważniejsze. Udostępnienie karty graficznej oznacza, że kod uruchomiony
    w piaskownicy — czyli kod, któremu z założenia się nie ufa — rozmawia
    wprost ze sterownikiem karty działającym na maszynie gospodarza.

    Sterowniki kart graficznych są dużymi składnikami pracującymi blisko
    jądra systemu i historia zna w nich wiele błędów pozwalających wyjść
    poza obszar, w którym kod miał pozostać. Piaskownica ma być granicą;
    wspólny sterownik jest kanałem przechodzącym przez tę granicę
    w najgorszym możliwym miejscu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: bezpośredni
    kontakt z oprogramowaniem gospodarza z wnętrza środowiska, które miało
    go odgrodzić. Wyjście z piaskownicy przestaje wymagać obejścia samego
    mechanizmu izolacji — wystarczy błąd w sterowniku.

    Jest to więc punkt o tym, czy piaskownica jest granicą, czy granicą
    z przejściem. Stąd kategoria wysoka, mimo że samo ustawienie brzmi jak
    wybór między szybciej a wolniej.
  en: |
    The setting settles whether the sandbox is to use the machine's graphics card, or draw
    its picture by the processor's strength alone.

    The item looks like one of performance and is one of isolation, and that is the chief
    thing about it. Making the graphics card available means that code running in the
    sandbox - that is, code not trusted by design - speaks directly with the card's driver
    running on the host machine.

    Graphics card drivers are large components working close to the system's kernel, and
    history knows in them many faults allowing an escape beyond the area the code was to
    stay in. The sandbox is to be a border; a shared driver is a passage crossing that
    border at the worst possible place.

    What an attacker gains while the item goes unmet: direct contact with the host's
    software from inside the environment that was to fence it off. Escaping the sandbox
    stops taking a circumvention of the isolation mechanism itself - a fault in the driver
    is enough.

    It is therefore an item about whether the sandbox is a border or a border with a
    crossing. Hence the high category, though the setting itself sounds like a choice
    between faster and slower.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, co się w piaskownicy uruchamia — bo skutek jest
    wyłącznie wydajnościowy i jego dotkliwość zależy od zastosowania.

    Po zmianie obraz w piaskownicy rysuje procesor. Okno piaskownicy będzie
    reagowało wolniej, przewijanie bywa szarpane, a otwieranie stron z bogatą
    grafiką trwa dłużej. Przy zwykłym sprawdzeniu, co robi nieznany plik, jest
    to różnica bez znaczenia.

    Odczuwalne staje się to w dwóch przypadkach. Pierwszy: testowanie
    programu, który sam z karty graficznej korzysta — takiego programu w
    piaskownicy albo nie da się sensownie ocenić, albo nie uruchomi się wcale.
    Drugi: dłuższa praca w piaskownicy, w której wolniejszy obraz przestaje
    być drobiazgiem.

    Rośnie też obciążenie procesora na czas działania piaskownicy, co na
    komputerze przenośnym skraca pracę na baterii.

    Poza piaskownicą nic się nie zmienia. Karta graficzna na samej maszynie
    działa tak jak wcześniej.
  en: |
    What needs checking is what is run in the sandbox - since the effect is one of
    performance alone and its severity depends on the use.

    After the change the picture in the sandbox is drawn by the processor. The sandbox's
    window will respond more slowly, scrolling is sometimes jerky, and opening pages with
    rich graphics takes longer. For an ordinary look at what an unknown file does that is
    a difference of no account.

    It becomes felt in two cases. The first: testing a program that itself uses the
    graphics card - such a program either cannot be sensibly judged in the sandbox or will
    not start at all. The second: longer work in the sandbox, where a slower picture stops
    being a trifle.

    The load on the processor also grows for the time the sandbox runs, which on a
    portable computer shortens the work on battery.

    Outside the sandbox nothing changes. The graphics card on the machine itself works as
    before.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Obraz w piaskownicy rysuje procesor, więc okno reaguje wolniej
      - Program korzystający z karty graficznej nie uruchomi się w piaskownicy albo zadziała źle
      - Obciążenie procesora rośnie na czas działania piaskownicy
      - Karta graficzna na samej maszynie działa tak jak wcześniej
    en:
      - The picture in the sandbox is drawn by the processor, so the window responds more slowly
      - A program using the graphics card will not start in the sandbox or will work badly
      - The load on the processor grows for the time the sandbox runs
      - The graphics card on the machine itself works as before
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica służy do testowania programów korzystających z karty graficznej
      - Praca w piaskownicy jest długa i wolniejszy obraz uniemożliwia jej prowadzenie
    en:
      - The sandbox serves to test programs using the graphics card
      - Work in the sandbox is long and a slower picture makes it impossible to carry on
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowVGPU'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $current = (Get-ItemProperty -Path $path -Name 'AllowVGPU' -ErrorAction SilentlyContinue).'AllowVGPU'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowVGPU'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowVGPU' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Jest to najmocniejszy punkt w całym zestawie dotyczącym piaskownicy
    i warto go czytać jako pierwszy. Pozostałe ograniczają to, co kod
    w piaskownicy może zobaczyć albo dokąd sięgnąć; ten ogranicza to, przez
    co może wyjść.

    Ustawienie działa wyłącznie na piaskownicę. Na maszynie bez włączonego
    składnika reguła nie ma czego dotyczyć, ale wdrożona wcześniej obejmie go
    od razu po włączeniu.

    Brak wartości nie jest stanem zgodnym, bo domyślnie współdzielenie bywa
    dozwolone tam, gdzie sprzęt na nie pozwala.
  en: |
    This is the weightiest item in the whole set about the sandbox and is worth reading
    first. The others limit what the code in the sandbox may see or reach; this one limits
    what it may leave through.

    The setting works on the sandbox alone. On a machine with the component switched off
    the rule has nothing to concern, but applied beforehand it will cover it as soon as it
    is switched on.

    A missing value is not a compliant state, since by default the sharing is sometimes
    allowed where the hardware permits it.
