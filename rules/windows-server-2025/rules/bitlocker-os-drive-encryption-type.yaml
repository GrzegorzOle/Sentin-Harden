id: win2025-bitlocker-os-drive-encryption-type

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Szyfrowanie całego dysku systemowego wymuszone
    en: Full encryption of the operating system drive enforced
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymusza szyfrowanie całego wolumenu systemowego zamiast samego
    miejsca zajętego przez pliki.

    Zostawiam kategorię wysoką i chcę wyjaśnić, dlaczego różnica między
    tymi dwoma trybami nie jest różnicą wydajnościową, tylko różnicą
    w tym, co zostaje na dysku. Szyfrowanie samego miejsca zajętego
    obejmuje bloki, w których coś leży teraz. Nie obejmuje bloków, z
    których coś usunięto — a usunięcie pliku nie kasuje jego zawartości,
    tylko zdejmuje z niej nazwę.

    Na serwerze to jest cała treść tego punktu. Dysk systemowy serwera
    pracuje latami i przez ten czas przewija się przez niego materiał,
    którego nikt już nie pamięta: stare dzienniki, strony bazy sprzed
    migracji, plik kopii zapasowej odłożony „na chwilę" przed aktualizacją,
    zrzut pamięci po awarii sprzed dwóch lat. W trybie częściowym to
    wszystko wyjeżdża z budynku w postaci czytelnej, razem z dyskiem
    zwróconym na gwarancję — a raport pokazuje maszynę zaszyfrowaną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czytelną
    zawartość wolnej przestrzeni dysku, czyli dokładnie tę część danych,
    o której nikt nie pamięta, że wciąż tam jest.
  en: |
    The item enforces encryption of the whole system volume rather than
    only the space occupied by files.

    I keep the category high, and I want to explain why the difference
    between these two modes is not a performance difference but a
    difference in what stays on the disk. Encrypting only the occupied
    space covers the blocks where something lies now. It does not cover
    blocks something was deleted from - and deleting a file does not erase
    its contents, it only takes the name off them.

    On a server that is the whole substance of this item. A server's system
    drive works for years, and in that time material passes through it that
    nobody remembers any more: old logs, database pages from before a
    migration, a backup file set aside "for a moment" before an update, a
    memory dump from a crash two years ago. In partial mode all of that
    leaves the building in readable form, together with a disk returned
    under warranty - while the report shows an encrypted machine.

    What an attacker gains while the item goes unmet: the readable contents
    of the drive's free space, that is, exactly the part of the data nobody
    remembers is still there.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać jedno ograniczenie
    oraz jeden koszt, bo bez nich punkt wyglądałby na darmowy.

    Ograniczenie jest takie, że ustawienie działa w przód. Rozstrzyga, jak
    zostanie zaszyfrowany wolumen, który dopiero będzie szyfrowany. Na
    dysku zaszyfrowanym wcześniej w trybie częściowym nic się nie zmieni:
    wpis będzie zgodny, raport zielony, a stare bloki nadal czytelne.
    Uczciwa odpowiedź na taką maszynę to sprawdzenie, w jakim trybie
    wolumen został zaszyfrowany, a nie poprzestanie na tym punkcie. Wolę
    to powiedzieć, niż pozwolić, żeby zgodność zastąpiła stan faktyczny.

    Koszt dotyczy tylko pierwszego szyfrowania i jest realny na serwerze:
    tryb pełny przechodzi przez cały wolumen, także przez przestrzeń
    nigdy nieużywaną, więc na dysku wielkoformatowym trwa wielokrotnie
    dłużej i przez cały ten czas obciąża podsystem dyskowy. Ma to znaczenie
    przy zakładaniu nowej maszyny, kiedy okno jest zwykle krótkie i wypełnione
    innymi czynnościami.

    Sama zmiana wpisu nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review" and want to point out one limitation
    and one cost, because without them the item would look free.

    The limitation is that the setting works forward. It decides how a
    volume that is yet to be encrypted will be encrypted. On a disk
    encrypted earlier in partial mode nothing will change: the entry will
    be compliant, the report green, and the old blocks still readable. The
    honest response to such a machine is to check which mode the volume was
    encrypted in, rather than stopping at this item. I would rather say
    that than let compliance stand in for the actual state.

    The cost applies only to the first encryption and is real on a server:
    full mode goes through the whole volume, including space never used, so
    on a large-format disk it takes many times longer and loads the disk
    subsystem throughout. That matters when building a new machine, where
    the window is usually short and already filled with other work.

    The change to the entry itself needs no outage and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - updates-and-servicing
  what_breaks:
    pl:
      - Pierwsze szyfrowanie obejmuje cały wolumen, także przestrzeń nigdy nieużywaną, więc na dużym dysku trwa wielokrotnie dłużej
      - Przez cały ten czas obciążony jest podsystem dyskowy, co przy zakładaniu maszyny wypada w krótkim oknie
      - Na dysku zaszyfrowanym wcześniej w trybie częściowym wpis będzie zgodny, a stare bloki nadal czytelne
      - Sama zmiana wpisu nie wymaga przerwy i cofa się natychmiast
    en:
      - The first encryption covers the whole volume, including space never used, so on a large disk it takes many times longer
      - Throughout that time the disk subsystem is loaded, which when building a machine falls into a short window
      - On a disk encrypted earlier in partial mode the entry will be compliant while the old blocks stay readable
      - The change to the entry itself needs no outage and is undone immediately
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest właśnie zakładana, a okno nie mieści pełnego szyfrowania wolumenu tej wielkości
      - Wolumen został już zaszyfrowany w trybie częściowym, a ustawienie ma zastąpić sprawdzenie jego faktycznego stanu
    en:
      - The machine is being built and the window does not fit full encryption of a volume this size
      - The volume has already been encrypted in partial mode and the setting is meant to stand in for checking its actual state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'OSEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: FULL
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'OSEncryptionType' -ErrorAction SilentlyContinue).'OSEncryptionType'
    [pscustomobject]@{
      path        = $path
      name        = 'OSEncryptionType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This decides how a volume yet to be encrypted will be encrypted. A drive
    # already encrypted in partial mode will report compliant and keep its old
    # readable blocks - check the volume's actual mode separately.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'OSEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Różnica między trybami nie jest wydajnościowa, tylko dotyczy tego, co
    zostaje na dysku. Usunięcie pliku nie kasuje zawartości, tylko zdejmuje
    z niej nazwę, a tryb częściowy takich bloków nie obejmuje.

    Na serwerze dysk systemowy pracuje latami i przewija się przez niego
    materiał, którego nikt nie pamięta: stare dzienniki, strony bazy sprzed
    migracji, kopia odłożona przed aktualizacją, zrzut pamięci po awarii.

    Ograniczenie, którego nie wolno przemilczeć: ustawienie działa w przód.
    Na dysku zaszyfrowanym wcześniej w trybie częściowym raport będzie
    zielony, a stare bloki nadal czytelne.
  en: |
    The difference between the modes is not about performance but about
    what stays on the disk. Deleting a file does not erase its contents, it
    only takes the name off them, and partial mode does not cover such
    blocks.

    On a server the system drive works for years and material passes
    through it that nobody remembers: old logs, database pages from before
    a migration, a backup set aside before an update, a crash memory dump.

    A limitation not to be passed over in silence: the setting works
    forward. On a disk encrypted earlier in partial mode the report will be
    green and the old blocks still readable.
