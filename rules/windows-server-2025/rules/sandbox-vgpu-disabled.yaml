id: win2025-sandbox-vgpu-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Współdzielenie karty graficznej z piaskownicą wyłączone
    en: Sharing of the graphics card with the sandbox disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania udostępniania piaskownicy karty graficznej gospodarza.

    Kategoria wysoka, choć nazwa brzmi jak ustawienie wydajności. Rzecz
    w tym, co tu jest współdzielone: nie obraz, tylko sprzęt. Program
    pracujący w piaskownicy z dostępem do karty wysyła polecenia wprost do
    urządzenia gospodarza i do jego sterownika — czyli do kodu pracującego
    w jądrze systemu, po tej stronie granicy, którą piaskownica ma
    utrzymywać.

    To jest właściwa treść punktu. Izolacja piaskownicy opiera się na tym,
    że wszystko, co z niej wychodzi, przechodzi przez warstwę
    wirtualizacji. Udostępniona karta jest wyjątkiem od tej zasady:
    otwiera drogę od kodu, któremu się nie ufa, do sterownika graficznego
    gospodarza. Błędy w sterownikach graficznych są klasą znaną
    i regularnie prowadzą do wykonania kodu w jądrze.

    Na serwerze dochodzi rzecz druga: serwer z kartą wartą współdzielenia
    to zwykle maszyna, na której ta karta do czegoś służy — do obliczeń,
    do przetwarzania obrazu, do wirtualnych pulpitów. Wtedy dzielimy się
    z piaskownicą nie ozdobą, tylko zasobem produkcyjnym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    z wnętrza piaskownicy do sterownika pracującego w jądrze gospodarza,
    czyli dokładnie tam, gdzie izolacja miała nie sięgać.
  en: |
    The item forbids the host's graphics card to be shared with the sandbox.

    The category is high, even though the name sounds like a performance
    setting. The matter is what is shared: not a picture but hardware. A
    program working in the sandbox with access to the card sends commands
    straight to the host's device and to its driver - that is, to code
    running in the system's kernel, on this side of the boundary the sandbox
    is supposed to hold.

    That is the real substance of the item. The sandbox's isolation rests on
    everything leaving it passing through the virtualisation layer. A shared
    card is an exception to that principle: it opens a road from code that is
    not trusted to the host's graphics driver. Faults in graphics drivers are
    a well-known class and lead regularly to code running in the kernel.

    On a server a second thing follows: a server with a card worth sharing is
    usually a machine where that card serves a purpose - computation, image
    processing, virtual desktops. Then what is shared with the sandbox is not
    an ornament but a production resource.

    What an attacker gains while the item goes unmet: a road from inside the
    sandbox to a driver running in the host's kernel - that is, exactly where
    the isolation was meant not to reach.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze bez zainstalowanej
    piaskownicy zmiana nie robi nic. Piaskownica jest funkcją opcjonalną
    i na większości serwerów jej nie ma.

    Gdzie jest, skutek jest widoczny od razu: piaskownica będzie rysować
    obraz programowo, czyli wolniej. Przy zwykłym oknie z przeglądarką albo
    edytorem nikt tego nie zauważy. Przy czymkolwiek, co rysuje dużo,
    różnica będzie wyraźna — okno zacznie się ociągać i ludzie zgłoszą to
    jako niedziałającą piaskownicę, a nie jako wolniejszą.

    Warto powiedzieć, kiedy ta reguła jest błędem, bo taki przypadek
    istnieje. Jeżeli ktoś używa piaskownicy do sprawdzania programu, który
    bez karty graficznej się nie uruchomi, odebranie karty odbiera sens
    czynności. Właściwą odpowiedzią jest wtedy osobna maszyna, a nie
    piaskownica na serwerze produkcyjnym.

    Czego to nie psuje: karty graficznej gospodarza, sesji zdalnych,
    przyspieszenia sprzętowego w systemie ani niczego poza piaskownicą.
    Wszystkie sześć punktów o piaskownicy leży pod jedną ścieżką rejestru —
    znajoma ścieżka nie znaczy, że grupa jest zamknięta.

    Zmiana obowiązuje od następnego uruchomienia piaskownicy. Bez przerwy,
    natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server with no sandbox
    installed the change does nothing. The sandbox is an optional feature and
    most servers do not have it.

    Where it is present, the effect is visible at once: the sandbox will draw
    its picture in software, that is, more slowly. With an ordinary window
    holding a browser or an editor nobody will notice. With anything that
    draws a lot the difference will be plain - the window will start to drag
    and people will report it as a sandbox that does not work rather than one
    that is slower.

    It is worth saying when this rule is a mistake, because such a case
    exists. If somebody uses the sandbox to check a program that will not
    start without a graphics card, taking the card away takes the point out
    of the exercise. The right answer then is a separate machine, not a
    sandbox on a production server.

    What this does not break: the host's graphics card, remote sessions,
    hardware acceleration in the system, or anything outside the sandbox. All
    six sandbox items lie under one registry path - a familiar path does not
    mean the group is closed.

    The change holds from the next start of the sandbox. No outage, undone
    immediately.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Piaskownica rysuje obraz programowo, czyli wolniej — przy programach rysujących dużo różnica będzie wyraźna
      - Ludzie zgłoszą to jako niedziałającą piaskownicę, a nie jako wolniejszą
      - Program, który bez karty graficznej się nie uruchomi, nie da się w piaskownicy sprawdzić — wtedy potrzebna jest osobna maszyna
      - Karta graficzna gospodarza, sesje zdalne i przyspieszenie sprzętowe w systemie działają bez zmian
    en:
      - The sandbox draws its picture in software, that is more slowly - with programs that draw a lot the difference will be plain
      - People will report it as a sandbox that does not work rather than one that is slower
      - A program that will not start without a graphics card cannot be checked in the sandbox - a separate machine is needed then
      - The host's graphics card, remote sessions and hardware acceleration in the system work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica na tej maszynie służy do sprawdzania programów, które bez karty graficznej się nie uruchamiają
    en:
      - The sandbox on this machine is used to check programs that will not start without a graphics card
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      $name = 'AllowVGPU'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $name = 'AllowVGPU'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # What is shared is not a picture but hardware: the sandbox sends commands
    # straight to the host's device and its driver, that is to code running in
    # the kernel, on this side of the boundary the sandbox is meant to hold.
    # The sandbox will draw in software, that is more slowly.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowVGPU' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Nazwa brzmi jak ustawienie wydajności, a współdzielony jest sprzęt, nie
    obraz. Program w piaskownicy wysyła polecenia wprost do urządzenia
    gospodarza i do jego sterownika — kodu pracującego w jądrze, po tej
    stronie granicy, którą piaskownica ma utrzymywać.

    Izolacja opiera się na tym, że wszystko, co z piaskownicy wychodzi,
    przechodzi przez warstwę wirtualizacji. Udostępniona karta jest
    wyjątkiem od tej zasady. Błędy w sterownikach graficznych regularnie
    prowadzą do wykonania kodu w jądrze.

    Na serwerze karta warta współdzielenia zwykle do czegoś służy — do
    obliczeń albo do wirtualnych pulpitów. Dzielimy się wtedy zasobem
    produkcyjnym, nie ozdobą.
  en: |
    The name sounds like a performance setting, yet what is shared is
    hardware, not a picture. A program in the sandbox sends commands straight
    to the host's device and its driver - code running in the kernel, on this
    side of the boundary the sandbox is meant to hold.

    The isolation rests on everything leaving the sandbox passing through the
    virtualisation layer. A shared card is an exception to that principle.
    Faults in graphics drivers lead regularly to code running in the kernel.

    On a server a card worth sharing usually serves a purpose - computation
    or virtual desktops. What is shared is then a production resource, not an
    ornament.
