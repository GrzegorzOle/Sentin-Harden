id: win2016-msdt-support-provider-communication-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Troubleshooting and Diagnostics > Microsoft Support Diagnostic Tool
  title:
    pl: Łączność narzędzia diagnostycznego z dostawcą wsparcia wyłączona
    en: The diagnostic tool's link with the support provider switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza tryb, w którym narzędzie diagnostyczne łączy się
    z dostawcą wsparcia po zestaw czynności do wykonania.

    Rzecz, która czyni ten punkt poważnym, polega na kierunku. Nie jest to
    kanał wysyłający dane o maszynie na zewnątrz — takich kanałów
    w systemie jest wiele i większość z nich jest niegroźna. Ten kanał
    prowadzi do środka: narzędzie pobiera paczkę diagnostyczną i ją
    uruchamia.

    Paczka diagnostyczna nie jest opisem problemu ani listą pytań. Jest
    zestawem czynności wykonywanych na tej maszynie, z uprawnieniami,
    jakie narzędzie ma. Pobranie jej kończy się więc wykonaniem kodu,
    o którego treści decyduje strona odpowiadająca na zapytanie.

    Znaczy to, że przy włączonym trybie na maszynie istnieje przewidziana
    droga: zapytaj — dostań zestaw czynności — wykonaj. Nie trzeba niczego
    łamać; trzeba tylko być tym, kto odpowiada.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    dostarczenia na maszynę zestawu czynności, który zostanie na niej
    wykonany.
  en: |
    The setting switches off the mode in which the diagnostic tool joins the support provider for a set of
    actions to carry out.

    The thing that makes this item a grave one rests on the direction. It is no channel sending data about the
    machine outward - of such channels there are many in the system and most of them are harmless. This channel
    leads inward: the tool fetches a diagnostic package and runs it.

    A diagnostic package is no description of a trouble nor a list of questions. It is a set of actions carried
    out on this machine, with the rights the tool holds. The fetching of it ends therefore in the running of
    code whose content the side answering the query decides.

    That means that with the mode switched on there is on the machine a foreseen road: ask - receive a set of
    actions - carry it out. Nothing has to be broken; one has only to be the one who answers.

    What an attacker gains while the item goes unmet: a road for delivering onto the machine a set of actions
    that will be carried out on it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy przyjętej procedury
    zgłoszeń.

    Rzecz do ustalenia: czy ktokolwiek na tej maszynie używa kreatorów
    rozwiązywania problemów jako pierwszego kroku przy zgłoszeniu. Jeżeli
    tak, po zmianie kreatory nadal się uruchomią, ale nie sięgną po
    nowsze paczki i będą pracować na tym, co maszyna ma u siebie.

    Objaw jest przy tym mylący. Kreator nie powie, że zasada go
    ogranicza — po prostu nie znajdzie rozwiązania albo zgłosi, że nie
    może się połączyć. Osoba szukająca przyczyny będzie jej szukać w sieci.

    Na serwerze kreatorów rozwiązywania problemów zwykle nie używa nikt,
    a diagnozę stawia się z dzienników i z poleceń. Tam zmiana nie zabiera
    niczego.

    Czego to nie psuje: dzienników zdarzeń, poleceń diagnostycznych,
    zdalnego zarządzania, ról serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the accepted procedure for reports.

    The thing to be established: whether anybody at all on this machine uses the troubleshooting wizards as a
    first step at a report. If so, after the change the wizards will still start, but will not reach for newer
    packages and will work on what the machine holds at home.

    The symptom is at that misleading. The wizard will not say that a policy limits it - it will simply find no
    solution or report that it cannot connect. A person looking for the cause will look for it in the network.

    On a server as a rule nobody uses the troubleshooting wizards, the diagnosis being made from the logs and
    from commands. There the change takes away nothing.

    What this does not break: the event logs, diagnostic commands, remote management, the server's roles,
    services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - remote-management
    - logging-and-audit
  what_breaks:
    pl:
      - Kreatory rozwiązywania problemów przestają pobierać nowsze paczki i pracują na tym, co maszyna ma u siebie
      - Kreator nie zgłosi ograniczenia zasadą, tylko brak rozwiązania albo brak połączenia, więc przyczyna bywa szukana w sieci
      - Procedura zgłoszeń wskazująca kreator jako pierwszy krok wymaga wskazania zastępstwa
      - Dzienniki zdarzeń, polecenia diagnostyczne i zdalne zarządzanie pozostają bez zmian
      - Role serwera, usługi systemowe i aplikacje pozostają bez zmian
    en:
      - The troubleshooting wizards cease to fetch newer packages and work on what the machine holds at home
      - The wizard will report no limiting by a policy, only a want of a solution or of a connection, so the cause is at times looked for in the network
      - A procedure for reports naming the wizard as a first step calls for a replacement to be named
      - The event logs, diagnostic commands and remote management stay unchanged
      - The server roles, system services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Przyjęta procedura zgłoszeń każe uruchomić kreator rozwiązywania problemów przed przekazaniem sprawy dalej
      - Nie ustalono, czy ktoś na tej maszynie rozpoznaje usterki kreatorami
    en:
      - The accepted procedure for reports calls for a troubleshooting wizard to be started before the matter is passed on
      - It has not been established whether anybody on this machine diagnoses faults by wizards
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name reads as if it switched the mode off, while the policy
      # writes 1 when the mode is allowed and 0 when it is forbidden. The
      # expected entry is therefore zero, not one.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableQueryRemoteServer'
        if ($null -eq $value) { 'MISSING' } else { ([string]$value).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    $name = 'DisableQueryRemoteServer'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is correct here despite the value name reading the other way: the
    # policy switched off writes zero, one means the mode is allowed.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableQueryRemoteServer' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/windows-update-troubleshooting

notes:
  pl: |
    Punkt otwiera blok o zdalnych zapytaniach i zapisach, których nikt nie
    zamawiał. Pierwsze trzy reguły dotyczą pytań przychodzących
    i odpowiedzi kończących się działaniem; kolejne — zapisów, które
    maszyna robi o własnej pracy.

    Rzecz, którą trzeba postawić wprost w opisie, to kierunek. Punkt
    wygląda na pozycję o wysyłaniu danych diagnostycznych i tak zostanie
    odczytany, jeśli się tego nie sprostuje. Kanał prowadzi do środka
    i kończy się wykonaniem kodu na tej maszynie.

    Pułapka warta wyróżnienia w interfejsie dotyczy odczytu. Nazwa
    wartości brzmi tak, jakby wyłączała tryb, a zasada zapisuje jedynkę,
    gdy tryb jest dopuszczony, i zero, gdy zabroniony. Oczekiwany jest
    zatem zero. Jest to jedno z niewielu miejsc w zestawie, gdzie
    odczytanie nazwy dosłownie prowadzi do ustawienia odwrotności.

    Odnotowuję, że ten sam klucz niesie drugą pozycję, o pobieraniu treści
    diagnostycznych. Są to dwa osobne ustawienia i wykonanie jednego nie
    rozstrzyga drugiego.
  en: |
    The item opens the block about remote queries and records nobody ordered. The first three rules concern
    questions coming in and answers ending in an action; the later ones concern records the machine makes about
    its own work.

    The thing to be set down outright in the description is the direction. The item looks an entry about the
    sending out of diagnostic data and will be so read unless that is put right. The channel leads inward and
    ends in the running of code on this machine.

    A trap worth setting apart in the interface concerns the reading. The value's name sounds as if it switched
    the mode off, while the policy writes one where the mode is allowed and zero where it is forbidden. What is
    expected is therefore zero. It is one of the few places in the set where reading the name literally leads to
    the setting of its opposite.

    Worth noting that the same key carries a second entry, about the fetching of diagnostic content. They are two
    separate settings and the carrying out of one does not settle the other.
