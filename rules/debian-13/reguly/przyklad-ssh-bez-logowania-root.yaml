# REGUŁA WZORCOWA — odpowiednik przykładu windowsowego po stronie Linuksa.
# Pokazuje wzorzec kopii i wycofania oparty na pliku nakładkowym oraz
# obowiązkową weryfikację konfiguracji przed przeładowaniem usługi.

id: debian13-ssh-bez-logowania-root

benchmark:
  nazwa: CIS Debian Linux Benchmark
  wersja: PRZYKLAD
  punkt: PRZYKLAD
  tytul: Logowanie na konto root przez SSH wyłączone
  poziom: 1
  profil: server

platforma:
  system: debian-13

kategoria_ryzyka: wysokie
uciazliwosc: wymaga-swiadomego-wdrozenia
stan_oceny: oceniono-wplyw-opisany

opis: |
  Konto root istnieje pod tą samą nazwą na każdej maszynie z Linuksem, więc
  wystawione na SSH daje atakującemu połowę potrzebnych danych za darmo — zostaje
  tylko hasło. Udane logowanie oznacza od razu pełną władzę nad systemem, bez
  etapu podnoszenia uprawnień.

  Po zmianie do systemu trzeba zalogować się kontem zwykłego użytkownika, a dopiero
  potem podnieść uprawnienia. Atakujący musi zdobyć dwie rzeczy zamiast jednej,
  a w dziennikach zostaje ślad, kto faktycznie wykonał operację — przy wspólnym
  koncie root taki ślad nie istnieje.

opis_uciazliwosci: |
  To zmiana sposobu pracy, nie ustawienie kosmetyczne. Jeżeli jakikolwiek proces
  łączy się z tą maszyną jako root, przestanie działać w chwili przeładowania usługi.

  Dodatkowe ryzyko: błąd w konfiguracji SSH potrafi odciąć dostęp do maszyny
  zdalnej całkowicie. Dlatego reguła sprawdza poprawność konfiguracji przed
  przeładowaniem i nie zrywa istniejących sesji.

konsekwencje_wdrozenia:
  obszary_wplywu:
    - zarzadzanie-zdalne
    - konta-i-hasla
    - skrypty-i-automatyzacja
  co_przestanie_dzialac:
    - Skrypty kopii zapasowych logujące się jako root po SSH przestaną się uwierzytelniać
    - Narzędzia wdrożeniowe i orkiestracyjne skonfigurowane na konto root stracą dostęp do tej maszyny
    - Procedura awaryjna oparta na zdalnym logowaniu jako root wymaga przepisania przed wdrożeniem zmiany
  przerwa: restart-uslugi
  widoczne_dla_uzytkownika: true
  nie_stosowac_gdy:
    - Na maszynie nie istnieje jeszcze konto zwykłego użytkownika z możliwością podniesienia uprawnień
    - Jedyny dostęp do maszyny prowadzi przez SSH i nie ma dostępu do konsoli poza pasmem
  odwracalnosc: natychmiastowa

audyt:
  powloka: bash
  polecenie_testu: |
    sshd -T 2>/dev/null | awk '$1=="permitrootlogin" {print $2; found=1} END {if (!found) print "BRAK"}'
  oczekiwane: '^no$'
  porownanie: wyrazenie-regularne

remediacja:
  powloka: bash
  polecenie_kopii: |
    set -eu
    kat=/var/lib/sentin-harden/kopie
    mkdir -p "$kat"
    znacznik=$(date +%Y%m%d-%H%M%S)
    sshd -T > "$kat/sshd-efektywna-$znacznik.conf" 2>/dev/null || true
    if [ -f /etc/ssh/sshd_config.d/60-sentin-harden.conf ]; then
      cp -a /etc/ssh/sshd_config.d/60-sentin-harden.conf \
            "$kat/60-sentin-harden-$znacznik.conf"
    fi
    echo "Zapisano stan sprzed zmiany w $kat (znacznik $znacznik)"

  polecenie_zmiany: |
    set -eu
    install -d -m 0755 /etc/ssh/sshd_config.d
    printf 'PermitRootLogin no\n' > /etc/ssh/sshd_config.d/60-sentin-harden.conf
    chmod 0644 /etc/ssh/sshd_config.d/60-sentin-harden.conf
    # Konfiguracja niepoprawna = usluga sie nie podniesie. Sprawdzamy PRZED przeladowaniem.
    sshd -t
    # reload, nie restart - istniejace sesje pozostaja zywe.
    systemctl reload ssh

  polecenie_wycofania: |
    set -eu
    rm -f /etc/ssh/sshd_config.d/60-sentin-harden.conf
    sshd -t
    systemctl reload ssh

uprawnienia: root
uruchamialne: true

zrodla:
  - https://man.openbsd.org/sshd_config#PermitRootLogin

uwagi: |
  Zmiana przez plik nakładkowy w sshd_config.d, a nie przez edycję sshd_config:
  wycofanie sprowadza się wtedy do usunięcia jednego pliku i niczego nie trzeba
  odtwarzać z kopii.

  Zanim wykonasz zmianę na maszynie zdalnej, zostaw otwartą drugą sesję SSH.
  Jeśli coś pójdzie nie tak, będzie to jedyna droga powrotu.
