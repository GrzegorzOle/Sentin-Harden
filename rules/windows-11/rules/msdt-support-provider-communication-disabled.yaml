id: win11-msdt-support-provider-communication-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Troubleshooting and Diagnostics > Microsoft Support Diagnostic Tool
  title:
    pl: Łączność narzędzia diagnostycznego z dostawcą wsparcia wyłączona
    en: The diagnostic tool's communication with the support provider disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy systemowe narzędzie diagnostyczne może pracować
    w trybie wsparcia: nawiązać łączność z dostawcą wsparcia, przyjąć od niego
    klucz opisujący zgłoszenie, zebrać wskazane dane z maszyny i odesłać je.

    Tryb ten jest mechanizmem zdalnej diagnostyki wbudowanym w system. Warto
    zobaczyć, co na to składa się w praktyce: narzędzie uruchamiane lokalnie
    przyjmuje z zewnątrz opis tego, co ma zrobić, i wykonuje go na maszynie,
    a wynik wysyła dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, ma dwie postaci.
    Pierwsza: droga wyniesienia z maszyny danych diagnostycznych — dzienników,
    konfiguracji, zrzutów pamięci awaryjnych — kanałem, który wygląda jak
    czynność serwisowa, a nie jak wyciek. Druga, poważniejsza: sam mechanizm
    przyjmowania z zewnątrz opisu czynności do wykonania jest powierzchnią,
    która w przeszłości bywała nadużywana do uruchomienia cudzego kodu.

    Wyłączenie trybu wsparcia odbiera napastnikowi gotowy, podpisany przez
    system kanał do zbierania i wynoszenia danych. Narzędzie przestaje działać
    w tym trybie i nie zbierze ani nie wyśle niczego.
  en: |
    The setting settles whether the system's diagnostic tool may work in support mode:
    establish communication with the support provider, take from them a key describing the
    case, gather the named data from the machine and send it back.

    That mode is a mechanism of remote diagnosis built into the system. It is worth seeing
    what it comes to in practice: a tool started locally takes from outside a description
    of what it is to do, carries it out on the machine, and sends the result on.

    What an attacker gains while the item goes unmet takes two forms. The first: a route
    for carrying diagnostic data out of the machine - logs, configuration, crash dumps -
    by a channel that looks like servicing rather than like a leak. The second, weightier:
    the very mechanism of taking from outside a description of work to be carried out is
    surface that has in the past been misused to run somebody else's code.

    Switching support mode off takes from an attacker a ready channel, signed by the
    system, for gathering and carrying out data. The tool stops working in that mode and
    will gather and send nothing.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy obsługa zgłoszeń w organizacji korzysta z tego
    trybu — bo tam, gdzie korzysta, zmiana odbiera konkretną procedurę.

    Tryb wsparcia jest używany przede wszystkim w rozmowie ze wsparciem
    producenta systemu, rzadziej w obsłudze wewnętrznej. Jeżeli ktoś prowadzi
    zgłoszenie tą drogą, po zmianie narzędzie odmówi zebrania danych i osoba
    po drugiej stronie poprosi o nie inaczej.

    Pozostałe narzędzia rozwiązywania problemów działają dalej. Zmiana nie
    dotyczy diagnostyki uruchamianej lokalnie, tylko tej sterowanej z zewnątrz
    kluczem zgłoszenia.

    Dzienniki systemowe, raporty o awariach i dane o stanie maszyny są dalej
    dostępne wszystkimi zwykłymi drogami — zebranie ich ręcznie jest dłuższe,
    ale nie niemożliwe.

    Zmiana nie wymaga restartu i działa od razu. Użytkownik, który z trybu
    wsparcia nie korzysta, nie zauważy niczego.
  en: |
    What needs checking is whether the handling of cases in the organisation uses this
    mode - because where it does, the change takes away a particular procedure.

    Support mode is used chiefly in dealings with the system maker's support, less often
    in in-house handling. If somebody runs a case by that route, after the change the tool
    will refuse to gather the data and the person on the other side will ask for it
    otherwise.

    The remaining troubleshooting tools work on. The change does not concern diagnosis
    started locally, only that steered from outside by a case key.

    The system logs, failure reports and data on the machine's state stay available by all
    the ordinary routes - gathering them by hand is slower, but not impossible.

    The change takes no restart and works at once. A user who does not use support mode
    will notice nothing.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - remote-management
    - logging-and-audit
  what_breaks:
    pl:
      - Narzędzie diagnostyczne odmawia pracy w trybie wsparcia i nie zbierze danych na klucz zgłoszenia
      - Zgłoszenie prowadzone ze wsparciem producenta tą drogą wymaga zebrania danych inaczej
      - Narzędzia rozwiązywania problemów uruchamiane lokalnie działają dalej
      - Dzienniki, raporty o awariach i dane o stanie maszyny pozostają dostępne zwykłymi drogami
    en:
      - The diagnostic tool refuses to work in support mode and will not gather data on a case key
      - A case run with the maker's support by that route takes gathering the data otherwise
      - Troubleshooting tools started locally work on
      - Logs, failure reports and data on the machine's state stay available by the ordinary routes
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Obsługa zgłoszeń opiera się na zbieraniu danych tym trybem na klucz od dostawcy wsparcia
    en:
      - The handling of cases rests on gathering data in this mode on a key from the support provider
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name reads as if it switched the mode off, while the policy
      # writes 1 when the mode is allowed and 0 when it is forbidden. The
      # expected entry is therefore zero, not one.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableQueryRemoteServer'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    $current = (Get-ItemProperty -Path $path -Name 'DisableQueryRemoteServer' -ErrorAction SilentlyContinue).'DisableQueryRemoteServer'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableQueryRemoteServer'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableQueryRemoteServer' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/windows-update-troubleshooting

notes:
  pl: |
    Nazwa wartości w rejestrze myli i jest to najważniejsza rzecz do
    zapamiętania przy tej regule. Brzmi jak przełącznik wyłączający łączność,
    a w rzeczywistości jedynka oznacza tryb wsparcia dozwolony, a zero —
    zabroniony. Stan zgodny to zero. Kto ustawi jedynkę kierując się nazwą,
    osiągnie dokładnie odwrotność zamierzenia.

    Brak wartości nie jest stanem zgodnym. Standardowo tryb wsparcia jest
    dozwolony, więc reguła wymaga zapisania zera wprost, a nie usunięcia
    ustawienia.

    Punkt dotyczy trybu sterowanego z zewnątrz kluczem zgłoszenia. Diagnostyka
    uruchamiana przez użytkownika na miejscu jest przedmiotem osobnej reguły
    w tej paczce i te dwie warto czytać razem, bo dotyczą tego samego
    narzędzia z dwóch stron.
  en: |
    The value's name in the registry misleads, and that is the most important thing to
    remember about this rule. It reads like a switch that turns communication off, while
    in fact a one means support mode allowed and a zero means it forbidden. The compliant
    state is zero. Whoever sets a one going by the name will achieve exactly the opposite
    of their intent.

    A missing value is not a compliant state. As a matter of course support mode is
    allowed, so the rule takes writing a zero outright rather than removing the setting.

    The item concerns the mode steered from outside by a case key. Diagnosis started by
    the user on the spot is the subject of a separate rule in this pack, and the two are
    worth reading together, since they concern the same tool from two sides.
