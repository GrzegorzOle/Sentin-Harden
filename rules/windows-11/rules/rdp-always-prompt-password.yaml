id: win11-rdp-always-prompt-password

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Zawsze pytaj o hasło przy połączeniu pulpitem zdalnym
    en: Always prompt for a password on Remote Desktop connection
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Klient pulpitu zdalnego potrafi zapamiętać hasło i podać je przy połączeniu
    bez pytania. Wygoda jest realna, ale przenosi decyzję o dostępie z osoby na
    maszynę: kto siedzi przy tej maszynie, ten połączy się do zdalnej,
    niezależnie od tego, czy zna hasło.

    To ustawienie każe pytać o hasło po stronie maszyny docelowej, więc zapisane
    poświadczenia przestają wystarczać. Znaczenie widać przy przejętej stacji:
    napastnik ma dostęp do zapisanych połączeń, ale nie do haseł, którymi
    te połączenia stoją.
  en: |
    The Remote Desktop client can remember a password and supply it on
    connection without asking. The convenience is real, but it moves the access
    decision from the person to the machine: whoever sits at this machine
    connects to the remote one, whether or not they know the password.

    This setting makes the target machine ask for the password, so stored
    credentials stop being enough. Its significance shows on a compromised
    workstation: the attacker has the saved connections but not the passwords
    those connections rest on.

disruption_description:
  pl: |
    Zmiana jest odczuwalna dla każdego, kto łączy się do tej maszyny i miał
    hasło zapamiętane — przy każdym połączeniu pojawi się pytanie. Przy
    połączeniach wykonywanych kilkanaście razy dziennie to zauważalna różnica
    w pracy.

    Poważniejszy przypadek to automatyzacja: skrypty i narzędzia otwierające
    sesję zdalną bez udziału człowieka przestaną działać, bo nie ma komu
    odpowiedzieć na pytanie. Kończą się zwykle po upływie limitu czasu, czyli
    z opóźnieniem i bez czytelnego powodu.
  en: |
    The change is felt by everybody connecting to this machine who had the
    password remembered - a prompt appears at every connection. With connections
    made a dozen times a day that is a noticeable difference in work.

    The more serious case is automation: scripts and tools opening a remote
    session with no human involved stop working, because there is nobody to
    answer the prompt. They usually end at a timeout, that is, with a delay and
    with no clear reason.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zapamiętane hasło w kliencie pulpitu zdalnego przestanie wystarczać do połączenia
      - Skrypty otwierające sesję zdalną bez udziału człowieka zakończą się po upływie limitu czasu
      - Narzędzia serwisowe łączące się automatycznie do tej maszyny wymagają zmiany sposobu logowania
    en:
      - A password remembered in the Remote Desktop client stops being enough to connect
      - Scripts opening a remote session with no human involved end at a timeout
      - Support tools connecting to this machine automatically need their sign-in method changed
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Do tej maszyny łączy się automatyzacja korzystająca z zapisanych poświadczeń
      - Połączenia zdalne są wykonywane wielokrotnie w ciągu dnia i pytanie o hasło zatrzyma pracę
    en:
      - Automation using stored credentials connects to this machine
      - Remote connections are made many times a day and a password prompt will hold up the work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fPromptForPassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fPromptForPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fPromptForPassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-security

notes:
  pl: |
    Punkt bywa mylony z uwierzytelnianiem na poziomie sieci. Tamten decyduje,
    kiedy następuje sprawdzenie poświadczeń — przed czy po zestawieniu sesji.
    Ten decyduje, czy hasło w ogóle trzeba podać. Oba są potrzebne i dotyczą
    różnych rzeczy.

    Ustawienie obowiązuje po stronie maszyny, do której ktoś się łączy, więc
    nie zmienia zachowania klienta zainstalowanego na tej samej stacji.
  en: |
    The item is sometimes confused with network level authentication. That one
    decides when credentials are checked - before or after the session is
    established. This one decides whether the password has to be supplied at
    all. Both are needed and they concern different things.

    The setting applies on the machine being connected to, so it does not change
    the behaviour of a client installed on that same workstation.
