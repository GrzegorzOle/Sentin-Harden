id: win2016-windows-tips-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Porady i sugestie systemowe wyłączone
    en: System tips and suggestions switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wyświetlanie porad i sugestii pobieranych przez
    system z sieci.

    Uzasadnienie jest tu skromne i warto to przyznać wprost, zamiast
    budować argument z niczego. Porady są treścią pobieraną z zewnątrz
    i wyświetlaną na maszynie — a więc kanałem, którym coś przychodzi
    i jest pokazywane człowiekowi. Kanał taki na serwerze jest zbędny,
    bo nie ma komu czytać porad.

    Wartość praktyczna leży w tym, co porady bywają w stanie zasugerować.
    Treść przychodząca z zewnątrz i wyświetlana z autorytetem systemu jest
    miejscem, w którym warto zachować ostrożność — komunikat wyglądający
    na systemowy jest czytany inaczej niż komunikat z sieci.

    Punkt jest najlżejszy w całym bloku i należy do tych, które robi się
    przy okazji. Nie ma powodu poświęcać mu więcej uwagi, niż wart.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    otwarty kanał wyświetlający na maszynie treść przychodzącą z zewnątrz
    z autorytetem systemu.
  en: |
    The setting switches off the showing of tips and suggestions the system fetches from the network.

    The warrant is here a modest one and that is worth owning outright, rather than building an argument
    out of nothing. Tips are content fetched from outside and shown on the machine - which is to say a
    channel by which something comes and is shown to a person. Such a channel on a server is needless,
    there being nobody to read tips.

    The practical value lies in what tips are at times able to suggest. Content coming from outside and
    shown with the system's authority is a place where caution is worth keeping - a message that looks
    like the system's is read otherwise than a message from the network.

    The item is the lightest in the whole block and belongs among those done in passing. There is no cause
    to give it more attention than it is worth.

    What an attacker gains while the item goes unmet: little - an open channel showing on the machine
    content that comes from outside with the system's authority.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Porady przestają się wyświetlać. Nic, z czego ktokolwiek korzysta
    w pracy, nie znika razem z nimi.

    Na serwerze zmiana jest widoczna wyłącznie dla tego, kto akurat pracuje
    przy konsoli, a i wtedy sprowadza się do braku okienek, których nikt
    nie chciał.

    Nie ma znanych regresji.

    Czego to nie psuje: pomocy systemowej dostępnej na żądanie,
    dokumentacji, menu startowego, aplikacji, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    Tips cease to be shown. Nothing anybody uses in the work goes away with them.

    On a server the change is visible solely to whoever happens to be working at the console, and even
    then it comes to an absence of little windows nobody wanted.

    There are no known regressions.

    What this does not break: the system help to be had on demand, documentation, the start menu,
    applications, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Porady i sugestie przestają się wyświetlać przy pracy na konsoli
      - Pomoc systemowa dostępna na żądanie i dokumentacja pozostają bez zmian
      - Menu startowe, aplikacje, usługi i sieć pozostają bez zmian
      - Na serwerze zmiana sprowadza się do braku okienek, których nikt nie chciał
    en:
      - Tips and suggestions cease to be shown when working at the console
      - The system help to be had on demand and documentation stay unchanged
      - The start menu, applications, services and the network stay unchanged
      - On a server the change comes to an absence of little windows nobody wanted
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest wydana komuś do pracy, kto korzysta z porad systemowych przy poznawaniu nowego wydania
    en:
      - The machine is handed for work to somebody who uses the system tips when learning a new release
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableSoftLanding'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableSoftLanding'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Tips and suggestions stop being shown. Nothing that anybody uses in the
    # work goes away with them.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSoftLanding' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt jest w bloku najsłabszy i opis powinien to mówić, zamiast
    udawać, że każda reguła waży tyle samo. Kategoria niska przy poziomie
    drugim odpowiada temu, czym ten punkt jest: porządkiem, nie obroną.

    Warto go pokazywać razem z punktem o treściach konsumenckich, bo oba
    leżą w tej samej gałęzi rejestru i rozstrzyga się je jednym ruchem.
    Różnica między nimi jest jednak realna: tamten zamyka drogę instalacji,
    ten wyłącza wyświetlanie. Zlanie ich w jedno zaciera to, co w tamtym
    jest istotne.

    Odnotowuję jedyny argument, który tę regułę broni poza porządkiem:
    treść przychodząca z zewnątrz i wyświetlana z autorytetem systemu jest
    czytana inaczej niż ta sama treść w przeglądarce. Jest to argument
    słaby, ale prawdziwy, i lepiej postawić go wprost niż podnosić
    kategorię bez pokrycia.
  en: |
    The item is the weakest in the block and the description ought to say so, rather than pretend every
    rule weighs the same. The low category at the second level answers to what this item is: order, not
    defence.

    It is worth showing together with the item about consumer content, both lying in the same branch of the
    registry and being settled by one move. The difference between them is real, though: that one shuts a
    road of installation, this one switches a showing off. Running them together blurs what in that one
    matters.

    Worth noting the one argument defending this rule beyond order: content coming from outside and shown
    with the system's authority is read otherwise than the same content in a browser. It is a weak
    argument, but a true one, and better set down outright than used to raise a category without backing.
