id: win11-link-layer-topology-mapper-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa odwzorowania topologii sieci wyłączona
    en: The service mapping the network's topology disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa buduje obraz sieci, w której stoi maszyna: odpytuje urządzenia
    w segmencie lokalnym, ustala, co jest z czym połączone, i składa z tego
    mapę pokazującą maszyny, przełączniki i połączenia między nimi.

    Zadanie to wykonuje na warstwie łącza, a więc poniżej adresowania
    sieciowego. Ma to skutek, o którym trzeba powiedzieć wprost: zapytania
    tego mechanizmu nie przechodzą przez bramę i nie podlegają regułom zapory
    ustawionym na adresach. Urządzenie odpowiada, bo odpowiada sam sterownik
    karty sieciowej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową mapę
    segmentu sieci, w którym się znalazł. Jest to dokładnie ten materiał,
    od którego zaczyna się rozpoznanie po wejściu na pierwszą maszynę — ile
    urządzeń stoi obok, jak się nazywają, jak są połączone. Zdobycie tej
    wiedzy w inny sposób wymaga skanowania, czyli ruchu, który bywa zauważany.
    Tutaj wystarczy zapytać, a odpowiedź przychodzi mechanizmem przewidzianym
    do tego przez system.

    Kierunek odwrotny liczy się tak samo: maszyna odpowiadająca na te
    zapytania sama ogłasza, że istnieje i jak się nazywa.
  en: |
    The service builds a picture of the network the machine stands in: it questions
    devices in the local segment, works out what is joined to what, and puts together a
    map showing machines, switches and the links between them.

    It does this work at the link layer, that is below network addressing. That has an
    effect which has to be said outright: this mechanism's questions do not pass through
    the gateway and are not subject to firewall rules set on addresses. A device answers
    because the network adapter's driver itself answers.

    What an attacker gains while the item goes unmet: a ready map of the network segment
    they have landed in. That is exactly the material reconnaissance starts from after
    entry to the first machine - how many devices stand nearby, what they are called, how
    they are joined. Gaining that knowledge another way takes scanning, that is traffic
    that is sometimes noticed. Here it is enough to ask, and the answer comes by a
    mechanism the system provides for it.

    The opposite direction counts just as much: a machine answering these questions
    announces of itself that it exists and what it is called.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek korzysta z graficznej mapy sieci
    — i jest to jedno z nielicznych miejsc w tej paczce, gdzie odpowiedź brzmi
    „prawie nigdy".

    Mechanizm powstał dla sieci domowych i jego jedynym widocznym zastosowaniem
    jest widok mapy pokazujący, co jest podłączone do czego. Widok ten w sieci
    organizacji jest bezużyteczny, bo obejmuje wyłącznie segment lokalny
    i nie obejmuje niczego za bramą.

    Odnajdywanie maszyn i udziałów w oknie sieci nie korzysta z tego mechanizmu
    i działa dalej. Jest to najczęstsze nieporozumienie przy ocenie skutków tego
    punktu: nazwa sugeruje, że wyłączenie usługi odetnie widoczność maszyn
    w sieci, a odcina wyłącznie rysowanie mapy połączeń.

    Sprawdzić warto narzędzia diagnostyczne działu informatycznego. Część
    programów do inwentaryzacji sieci korzysta z tego mechanizmu jako jednego
    ze źródeł — zwykle nie jedynego, więc skutkiem będzie uboższy wynik,
    a nie brak wyniku.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anybody uses the graphical map of the network - and
    this is one of the few places in this pack where the answer is "almost never".

    The mechanism was made for home networks and its only visible use is the map view
    showing what is joined to what. That view is useless on an organisation's network,
    since it covers the local segment alone and covers nothing beyond the gateway.

    Finding machines and shares in the network window does not use this mechanism and
    carries on working. That is the commonest misunderstanding when this item's effects
    are weighed: the name suggests that disabling the service will cut off the visibility
    of machines on the network, whereas it cuts off only the drawing of a map of links.

    The computing department's diagnostic tools are worth checking. Some network
    inventory programs use this mechanism as one of their sources - usually not the only
    one, so the effect will be a poorer result rather than no result.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Graficzna mapa połączeń w segmencie sieci przestaje się rysować
      - Maszyna przestaje odpowiadać na zapytania o topologię od innych urządzeń
      - Program do inwentaryzacji sieci traci jedno ze źródeł i podaje uboższy wynik
      - Odnajdywanie maszyn i udziałów w oknie sieci działa dalej bez zmiany
    en:
      - The graphical map of links in the network segment stops being drawn
      - The machine stops answering questions about topology from other devices
      - A network inventory program loses one source and gives a poorer result
      - Finding machines and shares in the network window carries on unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Dział informatyczny inwentaryzuje sieć narzędziem opartym na tym mechanizmie
      - Diagnostyka połączeń w segmencie lokalnym opiera się na graficznej mapie sieci
    en:
      - The computing department inventories the network with a tool resting on this mechanism
      - Diagnosing links in the local segment rests on the graphical map of the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'lltdsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lltdsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'lltdsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/lltd/link-layer-topology-discovery-overview

notes:
  pl: |
    Mechanizm składa się z usługi odpytującej sieć oraz ze sterowników
    odpowiadających na cudze zapytania. Ta reguła dotyczy usługi. Sterowniki
    da się wyłączyć osobno, w ustawieniach karty sieciowej, i jest to
    uzupełnienie warte zrobienia tam, gdzie zależy nam także na tym, by maszyna
    nie odpowiadała innym.

    Nazwa punktu bywa myląca. Nie dotyczy on odnajdywania maszyn i udziałów
    w sieci, które obsługują zupełnie inne mechanizmy, opisane w tej paczce
    osobnymi regułami.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa uruchamiana ręcznie bywa zatrzymana i mimo to
    niezgodna.
  en: |
    The mechanism is made up of a service questioning the network and of drivers
    answering others' questions. This rule concerns the service. The drivers can be
    disabled separately, in the network adapter's settings, and that is a completion
    worth making where it also matters that the machine should not answer others.

    The item's name is sometimes misleading. It does not concern the finding of machines
    and shares on the network, which entirely different mechanisms handle, described by
    rules of their own in this pack.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment. A service started by hand is sometimes stopped and deviating all
    the same.
