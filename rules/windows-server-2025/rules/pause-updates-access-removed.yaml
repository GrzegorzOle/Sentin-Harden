id: win2025-pause-updates-access-removed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Wstrzymywanie aktualizacji niedostępne dla użytkownika
    en: Pausing updates unavailable to the user
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt usuwa z ustawień systemu możliwość wstrzymania aktualizacji.
    Mechanizm pozostaje, zmienia się tylko to, kto może go uruchomić:
    zarządzanie zamiast kliknięcia na maszynie.

    Kategoria średnia i chcę być tu dokładny, bo łatwo tę zmianę opisać
    zbyt mocno. Wstrzymanie w tym miejscu nie jest wieczne — to zwłoka
    ograniczona do kilku tygodni, po której aktualizacje wracają same.
    Ten punkt nie zamyka więc drogi do maszyny pozostającej bez poprawek
    na zawsze.

    Zamyka co innego i to jest realne: kilkutygodniowe okno, którego nie
    widać w żadnym sprawozdaniu. Maszyna ze wstrzymanymi aktualizacjami
    nie zgłasza błędu, nie odstaje w wykazie zasad, nie ma nic
    nieprawidłowego w stanie usługi. Wygląda dokładnie jak maszyna, na
    której nic jeszcze nie przyszło.

    Na serwerze dochodzi rzecz osobna. Wstrzymanie zwykle włącza ktoś, kto
    naprawia coś na maszynie i chce spokoju na godzinę. Godzina mija, prace
    się kończą, wstrzymania nikt nie cofa — bo nic o nim nie przypomina.
    Punkt ten usuwa nie tyle złą decyzję, co decyzję, o której się
    zapomina.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kilka
    tygodni na maszynie, którą organizacja uważa za objętą normalnym
    rytmem łatania.
  en: |
    The item removes from the system settings the ability to pause updates.
    The mechanism stays; what changes is who may set it going: management
    rather than a click on the machine.

    The category is medium, and I want to be exact here, because it is easy
    to describe this change too strongly. A pause in this place is not
    forever - it is a delay limited to a few weeks, after which updates come
    back by themselves. So this item does not close the road to a machine
    left without fixes indefinitely.

    It closes something else, and that is real: a window of several weeks
    that shows up in no report. A machine with updates paused raises no
    error, does not stand out in a list of policies, has nothing wrong in
    the state of its service. It looks exactly like a machine on which
    nothing has arrived yet.

    On a server there is a further matter of its own. A pause is usually
    switched on by somebody repairing something on the machine who wants an
    hour of quiet. The hour passes, the work ends, nobody undoes the pause -
    because nothing reminds them of it. This item removes not so much a bad
    decision as a decision that gets forgotten.

    What an attacker gains while the item goes unmet: a few weeks on a
    machine the organisation believes to be inside the normal rhythm of
    patching.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę nazwać jedno pytanie, które
    trzeba postawić przed zmianą, bo od odpowiedzi zależy, czy ta reguła
    pomaga, czy szkodzi.

    Pytanie brzmi: czy ktoś, kto dziś naprawia coś na tej maszynie, ma inną
    drogę zatrzymania aktualizacji na czas prac. Jeżeli ma — zarządzanie
    z zewnątrz, okno serwisowe, polecenie zatrzymujące usługę — to zabranie
    przełącznika z ustawień niczego nie psuje, tylko przenosi decyzję tam,
    gdzie zostaje po niej ślad. Jeżeli nie ma, to po zmianie osoba
    prowadząca dłuższą naprawę zostaje bez żadnego sposobu i jej sytuacja
    jest gorsza niż przed nią.

    Rzecz do zapamiętania przy kłopotach: po zmianie przycisk znika
    z ustawień, ale wstrzymanie wpisane wcześniej nie cofa się samo.
    Maszyna, na której ktoś wstrzymał aktualizacje w zeszłym tygodniu,
    pozostanie wstrzymana i nikt już nie będzie miał gdzie tego odkliknąć.
    Warto więc sprawdzić stan wstrzymania przed zastosowaniem reguły,
    a nie po.

    Skutek jest widoczny dla człowieka pracującego na maszynie — element
    ustawień znika — więc nie nazywam tej zmiany niewidoczną. Nie wymaga
    jednak przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to name the one question to
    ask before the change, because the answer decides whether this rule
    helps or harms.

    The question is: does somebody repairing something on this machine have
    another way of stopping updates for the duration of the work. If they
    do - management from outside, a maintenance window, a command that stops
    the service - then taking the switch out of the settings breaks nothing
    and merely moves the decision to where it leaves a trace. If they do
    not, then after the change a person running a longer repair is left with
    no way at all, and their position is worse than before.

    Something to remember when trouble comes: after the change the button
    disappears from the settings, but a pause entered earlier does not undo
    itself. A machine on which somebody paused updates last week will stay
    paused, and nobody will have anywhere left to click it off. So it is
    worth checking the pause state before applying the rule rather than
    after.

    The effect is visible to a person working on the machine - an item of
    the settings disappears - so I do not call this change invisible. It
    needs no outage, though, and is undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Z ustawień systemu znika element pozwalający wstrzymać aktualizacje na maszynie
      - Osoba prowadząca dłuższą naprawę zostaje bez sposobu na zatrzymanie aktualizacji, jeśli nie ma innej drogi
      - Wstrzymanie wpisane przed zmianą nie cofa się samo i nie będzie już gdzie go odkliknąć
      - Mechanizm nie znika — decyzja przenosi się do zarządzania, gdzie zostaje po niej ślad
    en:
      - The item that lets updates be paused on the machine disappears from the system settings
      - A person running a longer repair is left with no way to stop updates, if no other route exists
      - A pause entered before the change does not undo itself and there will be nowhere left to click it off
      - The mechanism does not disappear - the decision moves to management, where it leaves a trace
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Osoby prowadzące prace na tej maszynie nie mają innej drogi zatrzymania aktualizacji na czas naprawy
      - Nie sprawdzono, czy na maszynie nie obowiązuje właśnie wstrzymanie wpisane wcześniej
    en:
      - The people working on this machine have no other way of stopping updates for the duration of a repair
      - It has not been checked whether a pause entered earlier is in force on the machine right now
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      $name = 'SetDisablePauseUXAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $name = 'SetDisablePauseUXAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A pause entered before this change does not undo itself, and after it
    # there is nowhere left to click it off - check the current pause state
    # first. Make sure the people who repair this machine have another way of
    # stopping updates for the duration of the work.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SetDisablePauseUXAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Nie opisuj tej zmiany zbyt mocno: wstrzymanie w tym miejscu nie jest
    wieczne, to zwłoka na kilka tygodni, po której aktualizacje wracają
    same. Realne jest co innego — kilkutygodniowe okno, którego nie widać
    w żadnym sprawozdaniu, bo maszyna ze wstrzymanymi aktualizacjami
    wygląda jak maszyna, na której nic jeszcze nie przyszło.

    Na serwerze wstrzymanie włącza zwykle ktoś, kto naprawia coś i chce
    spokoju na godzinę. Godzina mija, prace się kończą, wstrzymania nikt
    nie cofa, bo nic o nim nie przypomina.

    Do sprawdzenia przed zmianą: stan wstrzymania. Wpisane wcześniej nie
    cofnie się samo, a przycisku do odklikania już nie będzie.
  en: |
    Do not describe this change too strongly: a pause here is not forever,
    it is a delay of a few weeks after which updates return by themselves.
    What is real is something else - a window of several weeks that shows up
    in no report, because a machine with updates paused looks like a machine
    on which nothing has arrived yet.

    On a server a pause is usually switched on by somebody repairing
    something who wants an hour of quiet. The hour passes, the work ends,
    nobody undoes the pause, because nothing reminds them of it.

    To check before the change: the pause state. One entered earlier will
    not undo itself, and the button to click it off will be gone.
