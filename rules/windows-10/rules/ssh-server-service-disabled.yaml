id: win10-ssh-server-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera powłoki zdalnej wyłączona
    en: The server service of the shell from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przyjmującą połączenia powłoki zdalnej,
    czyli pozwalającą zalogować się na maszynę przez sieć i wykonywać na
    niej polecenia.

    Zastrzeżenie nie dotyczy samego protokołu, który jest dobrze
    zaprojektowany i szyfrowany. Dotyczy tego, że jest to pełny dostęp do
    wiersza poleceń, otwarty z sieci, na stanowisku roboczym, gdzie
    zwykle nikt go nie zamawiał.

    Zagrożenie pierwsze to zgadywanie haseł. Usługa przyjmuje próby
    logowania i przy uwierzytelnianiu hasłem daje napastnikowi cel, który
    można atakować bez ograniczeń czasowych.

    Zagrożenie drugie to przekierowanie ruchu. Połączenie tą drogą
    pozwala przenosić ruch innych protokołów przez zaszyfrowany tunel,
    więc staje się drogą obejścia podziału sieci.

    Zagrożenie trzecie to trwałość. Klucz dopisany do pliku
    uwierzytelniającego daje dostęp bez hasła i bez śladu w zarządzaniu
    kontami organizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełny
    dostęp do wiersza poleceń z sieci, z tunelem i z własnym kluczem.
  en: |
    The setting switches off the service taking in joinings of the shell from afar - that which lets one log on to
    the machine over the network and work orders upon it.

    The reservation touches not the protocol itself, which is well shaped and enciphered. It touches this, that it
    is a full reach of the line of orders, open from the network, upon a station of work where commonly nobody
    ordered it.

    The first danger is the guessing of passwords. The service takes in tries at logging on, and with warranting
    by password it gives an attacker a mark to be assaulted with no bound of time.

    The second danger is the turning aside of traffic. A joining by that road lets the traffic of other protocols
    be carried through an enciphered tunnel, so it becomes a way round the parting of the network.

    The third danger is lastingness. A key written into the file of warranting gives a reach with no password and
    with no trace in the body's ordering of reckonings.

    What an attacker gains while the item goes unmet: a full reach of the line of orders from the network, with a
    tunnel and with a key of their own.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo na maszynach, na których
    usługa ta jest używana, jest używana do rzeczy istotnych.

    Miejscem pierwszym są narzędzia wdrożeniowe i skrypty łączące się
    z maszyną tą drogą. Po zmianie przestaną się łączyć, a błąd pojawi
    się po stronie narzędzia, nie maszyny, więc szukanie przyczyny
    potrwa.

    Miejscem drugim są sesje otwarte w chwili zmiany. Zatrzymanie usługi
    zrywa je natychmiast, łącznie z sesją, z której polecenie jest
    wykonywane. Wykonanie zdalne kończy się tu odcięciem samego siebie.

    Miejscem trzecim jest przenoszenie plików tą drogą, używane przez
    osoby przyzwyczajone do narzędzi wiersza poleceń.

    Odnotowuję, że na stanowisku roboczym usługa ta zwykle nie jest
    zainstalowana. Wynik „nieadekwatne" jest tu częsty i oznacza brak
    składnika, a nie spełnienie punktu.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pracy programów, sieci, udostępniania plików,
    drukowania, logowania przy maszynie.
  en: |
    The class is "needs a planned rollout", for upon machines where that service is used it is used for weighty
    things.

    The first place is tools of rollout and scripts joining themselves to the machine by that road. After the
    change they will cease to join, and the fault will show upon the tool's side and not the machine's, so the
    seeking of the cause will take time.

    The second place is sessions open at the hour of the change. The stopping of the service breaks them at once,
    the session this order is worked from among them. A working from afar ends here in the cutting off of oneself.

    The third place is the carrying of files by that road, used by people used to the tools of the line of orders.

    I set down that upon a station of work that service is commonly not laid on. The outcome "does not apply" is
    here a common one and means a want of the part and not the item's being met.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the work of programs, the network, the giving out of files, printing, or logging on
    at the machine.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - network-and-firewall
  what_breaks:
    pl:
      - Narzędzia wdrożeniowe i skrypty łączące się tą drogą przestaną się łączyć
      - Błąd pojawi się po stronie narzędzia, nie maszyny, więc szukanie przyczyny potrwa
      - Sesje otwarte w chwili zmiany zostaną zerwane, łącznie z tą, z której polecenie jest wykonywane
      - Przenoszenie plików tą drogą przestanie działać
      - Praca programów, sieć, udostępnianie plików, drukowanie i logowanie przy maszynie pozostają bez zmian
    en:
      - Tools of rollout and scripts joining themselves by that road will cease to join
      - The fault will show upon the tool s side and not the machine s, so the seeking of the cause will take time
      - Sessions open at the hour of the change will be broken, that one among them this order is worked from
      - The carrying of files by that road will cease to work
      - The work of programs, the network, the giving out of files, printing and logging on at the machine stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana zdalnie przez powłokę i nie ma innej drogi zarządzania
      - Narzędzie wdrożeniowe albo kopia zapasowa łączy się z maszyną tą drogą
    en:
      - The machine is served from afar through the shell and there is no other road of ordering
      - A tool of rollout or of safe copies joins itself to the machine by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sshd'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sshd'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off every session of the shell from afar open at
    # this hour, the session this command is run from among them.
    Stop-Service -Name 'sshd' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'sshd' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'sshd' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/administration/openssh/openssh_overview

notes:
  pl: |
    Reguła wymaga ostrzeżenia, które aplikacja musi pokazać przed
    uruchomieniem: polecenie zrywa sesję, z której jest wykonywane.
    Uruchomienie tego punktu zdalnie kończy się odcięciem samego siebie
    i jest to skutek pewny, nie możliwy.

    Argument wart postawienia nie dotyczy protokołu, tylko zakresu.
    Protokół jest dobry i szyfrowany. Rzecz w tym, że daje pełny dostęp
    do wiersza poleceń z sieci na stanowisku, na którym nikt go nie
    zamawiał.

    Odnotowuję trwałość jako zagrożenie warte osobnego zdania. Klucz
    dopisany do pliku uwierzytelniającego daje dostęp bez hasła i nie
    pojawia się w żadnym wykazie kont organizacji.
  en: |
    The rule calls for a warning the application must show before the setting going: the order breaks the session
    it is worked from. The setting going of this item from afar ends in the cutting off of oneself, and it is a
    sure upshot and no possible one.

    The argument worth putting touches not the protocol but the reach. The protocol is good and enciphered. The
    matter is that it gives a full reach of the line of orders from the network upon a station where nobody
    ordered it.

    I set down lastingness as a danger worth a sentence apart. A key written into the file of warranting gives a
    reach with no password and shows in no roll of the body's reckonings.
