id: win2025-defender-pua-protection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Blokowanie aplikacji potencjalnie niepożądanych
    en: Blocking of potentially unwanted applications
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza blokowanie programów, które nie są złośliwe, ale
    zachowują się w sposób, na który nikt się świadomie nie godził:
    narzędzi dokładanych przy instalacji czegoś innego, programów
    zmieniających ustawienia bez pytania, pakowaczy używanych zarówno
    przez uczciwych, jak i nieuczciwych.

    Zostawiam kategorię średnią. Blokowana klasa programów nie jest
    drogą wejścia — jest tym, co zostaje wniesione już potem, i zwykle
    przez kogoś, kto miał prawo coś zainstalować. Utwardzenie ogranicza
    pole manewru, ale nie zamyka żadnej drogi.

    Na serwerze jest jednak drugie zastosowanie, przez które nie schodzę
    niżej, i warto je nazwać. Do tej klasy należą także narzędzia, które
    napastnik wnosi po wejściu na maszynę: odzyskiwanie haseł, zdalny
    pulpit poza domeną, skanery, zrzutniki pamięci. Nie są złośliwe
    w sensie ścisłym i dlatego przechodzą obok wykrywania — a właśnie
    tutaj bywają zatrzymane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: prawo
    wniesienia na serwer narzędzi, które nie liczą się jako złośliwe
    i przez to przechodzą nierozpoznane.
  en: |
    The item switches on the blocking of programs that are not ill-meaning but bear themselves in a
    way nobody wittingly agreed to - tools set alongside at the setting up of something else,
    programs that alter settings without asking, packers used both by the honest and by the
    dishonest.

    I leave the category middling. The blocked kind of programs is no road of entry - it is what is
    brought in afterwards, and mostly by somebody who had the right to set something up. The
    hardening narrows the room to move but shuts no road.

    On a server there is, though, a second use for which I go no lower, and it is worth naming. To
    that kind belong also the tools an attacker brings in after coming onto the machine - the
    winning back of passwords, a desk from afar outside the domain, searchers of ports, droppers of
    memory. They are not ill-meaning in the strict sense and therefore pass by the finding out - and
    just here they are at times stopped.

    What an attacker gains while the item goes unmet - the right of bearing onto the server tools
    that count not as ill-meaning and thereby pass unknown.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedna rzecz i jest ona dokładnie po drugiej
    stronie tego samego zdania, które uzasadnia punkt.

    Klasa „potencjalnie niepożądane" nie zna zamiaru. Narzędzia
    używane przez napastnika po wejściu na maszynę i narzędzia używane
    przez administratora podczas serwisu są w dużej części tymi samymi
    narzędziami. Odzyskiwanie haseł do konta, do którego nikt już nie ma
    dostępu; zdalny pulpit spoza domeny, gdy kontroler nie odpowiada;
    skaner sieci przy szukaniu, co jeszcze odpowiada; zrzut pamięci
    procesu przy diagnozowaniu awarii. To jest normalna praca
    administratora serwera.

    Objaw pojawia się więc dokładnie wtedy, gdy przeszkadza najbardziej:
    w trakcie awarii, przy narzędziu, po które ktoś właśnie sięgnął,
    zwykle pod presją. Ryzykiem nie jest tu zablokowane narzędzie —
    ryzykiem jest to, co człowiek robi w tej chwili dalej, czyli
    wyłącza mechanizm w całości i nie włącza go z powrotem.

    Rzeczą do zrobienia przed zmianą jest przejrzenie zawartości
    katalogu z narzędziami serwisowymi na maszynie i ustalenie dla niego
    wyłączenia. To rozwiązuje przypadek, o który tu chodzi, bez
    otwierania wszystkiego.

    Drugim wartym uwagi przypadkiem jest oprogramowanie dostawcy
    spakowane pakowaczem, który sam z siebie trafia do tej klasy.
    Zdarza się to przy starszych systemach dziedziczonych i objawia
    zniknięciem pliku po aktualizacji.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    One thing needs checking, and it is just on the other side of the same sentence that makes the
    ground of the item.

    The kind "potentially unwanted" knows no intent. The tools used by an attacker after coming onto
    a machine and the tools used by an administrator during service are in great measure the same
    tools. The winning back of a password to an account nobody reaches any more; a desk from afar
    from outside the domain where the warder answers not; a searcher of the net at the seeking of
    what else answers; a dropping of a process's memory at the sounding of a fault. That is the
    ordinary work of a server's administrator.

    The symptom comes therefore just where it hinders most - in the midst of a fault, at a tool
    somebody has this moment reached for, mostly under a press. The risk here is not the blocked
    tool - the risk is what the person does next, that is they switch the working off whole and
    switch it not back on.

    The thing to do before the change is to look over what is in the folder of tools for service on
    the machine and to settle a leaving-out for it. That answers the case at issue here without
    opening everything.

    The second case worth heed is a seller's software packed by a packer that of itself falls into
    that kind. It happens at older inherited systems and shows itself as a file vanished after a
    freshening.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - remote-desktop
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Narzędzia serwisowe administratora należą w dużej części do tej samej klasy co narzędzia napastnika
      - Objaw pojawia się w trakcie awarii, przy narzędziu, po które ktoś właśnie sięgnął pod presją
      - Prawdziwym ryzykiem jest wyłączenie mechanizmu w całości i niewłączenie go z powrotem
      - Oprogramowanie dostawcy spakowane niewłaściwym pakowaczem znika po aktualizacji
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy
    en:
      - The administrator's tools for service belong in great measure to the same kind as the attacker's
      - The symptom comes in the midst of a fault, at a tool somebody has this moment reached for under a press
      - The true risk is the switching off of the working whole and the not switching it back on
      - A seller's software packed by an ill-chosen packer vanishes after a freshening
      - Where a guarding product of another maker rules, the audit reports the state does not apply
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ustalono wyłączenia dla katalogu z narzędziami serwisowymi stojącego na tej maszynie
      - Na serwerze stoi starszy system dziedziczony spakowany pakowaczem należącym do tej klasy
    en:
      - No leaving-out was settled for the folder of tools for service standing on that machine
      - An older inherited system packed by a packer of that kind stands on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else { [string][int](Get-MpPreference -ErrorAction Stop).PUAProtection }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'PUAProtection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle a leaving-out for the folder of service tools first: the blocking
    # shows up during a fault, and that is when the whole guard gets switched off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PUAProtection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/detect-block-potentially-unwanted-apps-microsoft-defender-antivirus

notes:
  pl: |
    Powód, dla którego nie schodzę niżej niż do średniej: do tej klasy
    należą narzędzia, które napastnik wnosi po wejściu na maszynę —
    odzyskiwanie haseł, zdalny pulpit poza domeną, skanery, zrzutniki
    pamięci. Nie są złośliwe w sensie ścisłym i przechodzą obok
    wykrywania, a tutaj bywają zatrzymane.

    Przeciwwskazanie jest po drugiej stronie tego samego zdania: klasa
    nie zna zamiaru, a narzędzia napastnika i narzędzia administratora
    są w dużej części tymi samymi narzędziami.

    Prawdziwym ryzykiem nie jest zablokowane narzędzie, tylko to, co
    człowiek robi dalej pod presją awarii: wyłącza mechanizm w całości
    i nie włącza go z powrotem.
  en: |
    The ground for which I go no lower than middling - to that kind belong the tools an attacker
    brings in after coming onto the machine, the winning back of passwords, a desk from afar outside
    the domain, searchers, droppers of memory. They are not ill-meaning in the strict sense and pass
    by the finding out, and here they are at times stopped.

    What speaks against it is on the other side of the same sentence - the kind knows no intent, and
    the attacker's tools and the administrator's are in great measure the same tools.

    The true risk is not the blocked tool but what the person does next under the press of a fault -
    they switch the working off whole and switch it not back on.
