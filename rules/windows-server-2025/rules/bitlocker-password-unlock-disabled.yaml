id: win2025-bitlocker-password-unlock-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Odblokowywanie dysków hasłem niedopuszczone
    en: Unlocking drives with a password inadmissible
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania odblokowywania zaszyfrowanych wolumenów hasłem
    wpisywanym przez człowieka. Dotyczy wszystkich trzech rodzajów
    wolumenów naraz: systemowego, stałego z danymi i wymiennego.

    Zostawiam kategorię średnią i chcę powiedzieć, dlaczego nie wyżej,
    skoro hasło brzmi jak najsłabsze ogniwo. Bo nie o siłę hasła tu chodzi.
    Hasło do wolumenu jest jedynym elementem całego łańcucha szyfrowania,
    który człowiek wymyśla, zapamiętuje i przekazuje dalej ustnie. Nie
    podlega polityce haseł w domenie, nie wygasa, nie widać go w przeglądzie
    kont, nie da się go odebrać człowiekowi, który odszedł z pracy. Przy
    pozostałych sposobach odblokowania — moduł sprzętowy, certyfikat,
    hasło odzyskiwania w katalogu — zawsze istnieje coś, co da się
    unieważnić. Przy haśle nie istnieje nic.

    Na serwerze dochodzi rzecz, która czyni tę drogę szczególnie kuszącą,
    i warto ją nazwać, bo to ona tłumaczy, skąd takie hasła się biorą.
    Wolumen zabezpieczony hasłem daje się odblokować zdalnie, z sesji
    powłoki, bez chodzenia do serwerowni i bez zależności od modułu
    sprzętowego. Jest to więc rozwiązanie, które administrator wybiera nie
    z niedbalstwa, tylko dlatego, że działa wtedy, gdy nic innego nie
    działa. Reguła ma tę drogę zamknąć — i dlatego musi przyjść po
    ustaleniu drogi zastępczej, a nie przed.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sekret
    otwierający zaszyfrowany wolumen, który istnieje wyłącznie w czyjejś
    pamięci i w notatkach, i którego nikt nie może cofnąć.
  en: |
    The item forbids unlocking encrypted volumes with a password typed by a
    person. It covers all three kinds of volume at once: the system one,
    the fixed data one and the removable one.

    I keep the category medium and want to say why not higher, given that a
    password sounds like the weakest link. Because it is not about the
    password's strength. A volume password is the only element in the whole
    encryption chain that a person invents, memorises and passes on by
    word of mouth. It is not subject to the domain password policy, it does
    not expire, it is not visible in an account review, and it cannot be
    taken away from somebody who has left the company. With the other ways
    of unlocking - the hardware module, a certificate, a recovery password
    in the directory - there is always something that can be revoked. With
    a password there is nothing.

    On a server there is something that makes this route especially
    tempting, and it is worth naming, because it explains where such
    passwords come from. A volume protected by a password can be unlocked
    remotely, from a shell session, without walking to the server room and
    without depending on a hardware module. So it is a solution an
    administrator chooses not out of carelessness but because it works when
    nothing else does. The rule is meant to close that route - and that is
    why it has to come after a replacement route is settled, not before.

    What an attacker gains while the item goes unmet: a secret that opens
    an encrypted volume, existing only in somebody's memory and notes, and
    which nobody can revoke.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać jedno pytanie,
    na które trzeba odpowiedzieć przed zastosowaniem, bo od odpowiedzi
    zależy, czy ta zmiana jest porządkowa, czy odcina dostęp.

    Pytanie brzmi: czy na tej maszynie jakikolwiek wolumen jest dziś
    odblokowywany hasłem. Jeżeli nie — a na serwerze zwykle nie, bo
    wolumeny odblokowują się automatycznie — zmiana nic nie robi poza
    zamknięciem drogi na przyszłość i jest z gatunku porządkowych. Jeżeli
    tak, to hasło jest w tej chwili jedynym sposobem dostania się do tych
    danych i zmiana go nie unieważnia, ale blokuje ustawienie nowego
    w przyszłości, w tym po ponownym zaszyfrowaniu nośnika.

    Praktyczna kolejność jest więc taka: najpierw ustal, jak wolumen ma
    się odblokowywać bez hasła i sprawdź, że tak się odblokowuje, a dopiero
    potem zamknij tę drogę. Odwrotna kolejność kończy się nośnikiem, który
    odblokowuje się tylko hasłem odzyskiwania — czyli techniką przewidzianą
    na awarię, użytą jako codzienność.

    Punkt jest jedną decyzją zapisaną w trzech wartościach, po jednej na
    rodzaj wolumenu. Audyt czyta je razem i nazywa tę, która odstaje,
    żeby maszyna ustawiona w dwóch trzecich nie przechodziła jako ustawiona.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review" and want to point at one question that
    has to be answered before applying it, because the answer decides
    whether this change is housekeeping or cuts off access.

    The question is: is any volume on this machine unlocked with a password
    today. If not - and on a server usually not, because volumes unlock
    automatically - the change does nothing beyond closing the route for
    the future and is housekeeping. If yes, then the password is at this
    moment the only way into that data, and the change does not invalidate
    it but does block setting a new one in future, including after the
    medium is encrypted afresh.

    So the practical order is: first settle how the volume is to unlock
    without a password and verify that it does, and only then close this
    route. The reverse order ends with a medium that unlocks only with its
    recovery password - that is, a technique meant for emergencies used as
    everyday practice.

    The item is one decision recorded in three values, one per kind of
    volume. The audit reads them together and names the one that differs,
    so that a machine set two thirds of the way does not pass as set.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - accounts-and-passwords
  what_breaks:
    pl:
      - Nie da się ustawić hasła na nowo szyfrowanym wolumenie ani po ponownym zaszyfrowaniu nośnika
      - Tam, gdzie wolumen jest dziś odblokowywany hasłem, zostaje wyłącznie hasło odzyskiwania jako droga awaryjna
      - Zamyka drogę, którą administrator wybierał dlatego, że działa zdalnie i nie zależy od modułu sprzętowego
      - Na serwerze, gdzie wolumeny odblokowują się automatycznie, zmiana jest porządkowa i nie robi nic więcej
    en:
      - A password cannot be set on a newly encrypted volume, nor after a medium is encrypted afresh
      - Where a volume is unlocked with a password today, only the recovery password remains as an emergency route
      - It closes the route an administrator chose because it works remotely and does not depend on a hardware module
      - On a server where volumes unlock automatically, the change is housekeeping and does nothing more
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na tej maszynie jakikolwiek wolumen jest dziś odblokowywany hasłem, a droga zastępcza nie została ustalona i sprawdzona
      - Wolumeny nie odblokowują się automatycznie, a moduł sprzętowy jest niedostępny albo niesprawny
    en:
      - Any volume on this machine is unlocked with a password today and no replacement route has been settled and verified
      - Volumes do not unlock automatically and the hardware module is unavailable or faulty
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. All three have to
      # be at zero, and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $names = @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $names) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne 0) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'ALL_DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_DISABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle how each volume unlocks without a password, and verify that it
    # does, before closing this route. The reverse order leaves a medium that
    # opens only with its recovery password - an emergency technique used as
    # everyday practice.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      Set-ItemProperty -Path $path -Name $name -Value 0 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Nie o siłę hasła tu chodzi. Hasło do wolumenu jest jedynym elementem
    łańcucha szyfrowania, który człowiek wymyśla i przekazuje ustnie: nie
    podlega polityce haseł, nie wygasa, nie widać go w przeglądzie kont
    i nie da się go odebrać komuś, kto odszedł. Przy pozostałych sposobach
    zawsze jest coś do unieważnienia.

    Na serwerze ta droga kusi, bo działa zdalnie i nie zależy od modułu
    sprzętowego. Administrator wybiera ją nie z niedbalstwa, tylko dlatego,
    że działa wtedy, gdy nic innego nie działa.

    Dlatego reguła musi przyjść po ustaleniu drogi zastępczej. Odwrotna
    kolejność zostawia nośnik otwierany wyłącznie hasłem odzyskiwania —
    techniką przewidzianą na awarię, użytą jako codzienność.
  en: |
    It is not about the password's strength. A volume password is the only
    element in the encryption chain that a person invents and passes on by
    word of mouth: it is not subject to the password policy, does not
    expire, is not visible in an account review, and cannot be taken from
    somebody who has left. With the other methods there is always something
    to revoke.

    On a server this route is tempting because it works remotely and does
    not depend on a hardware module. An administrator chooses it not out of
    carelessness but because it works when nothing else does.

    That is why the rule has to come after a replacement route is settled.
    The reverse order leaves a medium opened only with its recovery
    password - an emergency technique used as everyday practice.
