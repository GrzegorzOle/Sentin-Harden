id: win2016-certificate-padding-check-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Ścisłe sprawdzanie wypełnienia podpisu pliku wykonywalnego włączone
    en: Strict checking of an executable signature's padding switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe odrzucać podpis pliku wykonywalnego, w którym obok
    danych podpisu znalazło się cokolwiek jeszcze.

    Sposób podpisywania plików wykonywalnych ma miejsce na wypełnienie —
    kilka bajtów dokładanych do właściwej długości. Wypełnienie to nie jest
    objęte podpisem, bo nie miało nic znaczyć.

    Okazało się, że znaczyć może. Wypełnienie da się rozciągnąć i umieścić
    w nim dowolną treść, a podpis pozostanie ważny, bo treść ta do podpisu
    nie wchodzi. Otrzymujemy plik poprawnie podpisany przez producenta,
    który niesie w sobie coś, czego producent nigdy nie widział.

    Trik ten był wykorzystywany do rozsyłania instalatorów sprawiających
    wrażenie oryginalnych. Plik przechodził każdą kontrolę opartą na
    podpisie, bo podpis był prawdziwy — należał do wytwórcy, który podpisał
    inną zawartość.

    Ścisłe sprawdzanie odrzuca takie pliki. Podpis obejmujący mniej niż
    całość pliku przestaje być uznawany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    dołączenia własnej treści do cudzego, poprawnie podpisanego pliku
    wykonywalnego, tak że podpis nadal się zgadza.
  en: |
    The setting has a signature of an executable file rejected where anything else
    has been found beside the signature's data.

    The way executable files are signed has room for padding - a few bytes added to
    reach the proper length. That padding is not covered by the signature, having
    been meant to mean nothing.

    It turned out it can mean something. The padding can be stretched and any
    contents put in it, and the signature stays valid, those contents not entering
    into it. So we get a file properly signed by its maker which carries in itself
    something the maker never saw.

    The trick was used to send round installers giving the impression of being
    genuine. The file passed every check resting on the signature, the signature
    being real - it belonged to a maker who had signed other contents.

    Strict checking rejects such files. A signature covering less than the whole file
    ceases to be accepted.

    What an attacker gains while the item goes unmet: the chance to attach their own
    contents to somebody else's properly signed executable file, so that the
    signature still agrees.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na maszynie
    używa się oprogramowania podpisanego w ten sposób rozmyślnie.

    Brzmi to dziwnie i wymaga wyjaśnienia. Miejsce na wypełnienie było
    wykorzystywane także zgodnie z przeznaczeniem — do dopisywania do
    podpisanego instalatora danych właściwych dla odbiorcy. Klucz licencji,
    identyfikator partnera, ustawienia wstępne. Instalator był podpisany
    raz, a każdy odbiorca dostawał swoją odmianę.

    Takie instalatory po wdrożeniu przestaną być uznawane za podpisane.
    Objawem jest ostrzeżenie o nieznanym wydawcy przy uruchomieniu albo
    odrzucenie pliku przez mechanizm sprawdzający podpisy.

    Jest to skutek zamierzony i trzeba go tak nazwać. Plik taki rzeczywiście
    niesie treść spoza podpisu i nie ma sposobu odróżnić danych licencji od
    czegokolwiek innego.

    Rzecz druga dotyczy zakresu. Wpis trzeba ustawić w dwóch miejscach —
    osobno dla programów zbudowanych dla tej długości słowa i osobno dla
    starszej. Ustawienie jednego zostawia drugą drogę otwartą, a reguła
    sprawdza oba.

    Czego to nie psuje: oprogramowania podpisanego normalnie, aktualizacji
    systemowych, sterowników od producentów sprzętu, pracy z plikami.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether software
    signed that way deliberately is used on the machine.

    That sounds odd and calls for explanation. The room for padding was used also as
    intended - for adding to a signed installer data proper to its receiver. A licence
    key, a partner's identifier, preset settings. The installer was signed once and
    each receiver got their own variant.

    Such installers will stop being accepted as signed after the rollout. The symptom
    is a warning about an unknown publisher at starting, or the file being rejected by
    the mechanism checking signatures.

    That is an intended consequence and has to be named as such. Such a file does
    indeed carry contents outside the signature, and there is no way of telling
    licence data from anything else.

    The second thing concerns scope. The entry has to be set in two places - apart for
    programs built for this word length and apart for the older one. Setting one
    leaves the other road open, and the rule checks both.

    What this does not break: normally signed software, system updates, drivers from
    hardware makers, or work with files.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - updates-and-servicing
    - drivers-and-devices
  what_breaks:
    pl:
      - Instalator z danymi odbiorcy dopisanymi do podpisanego pliku przestanie być uznawany za podpisany - klucz licencji, identyfikator partnera, ustawienia wstępne
      - Objawem jest ostrzeżenie o nieznanym wydawcy przy uruchomieniu albo odrzucenie pliku przez mechanizm sprawdzający podpisy
      - Wpis trzeba ustawić w dwóch miejscach rejestru, bo program sprawdza podpis w tym widoku, w którym sam pracuje
      - Oprogramowanie podpisane normalnie, aktualizacje systemowe i sterowniki producentów sprzętu pozostają bez zmian
    en:
      - An installer with the receiver's data added to the signed file will stop being accepted as signed - a licence key, a partner identifier, preset settings
      - The symptom is a warning about an unknown publisher at starting, or the file being rejected by the mechanism checking signatures
      - The entry has to be set in two places in the registry, a program checking the signature in the view it runs in
      - Normally signed software, system updates and hardware makers' drivers stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Organizacja używa oprogramowania, którego instalator niesie dane odbiorcy dopisane do podpisanego pliku, i nie ma dla niego zamiennika
      - Na maszynie wdraża się pakiety podpisane przez pośrednika w sposób wykorzystujący miejsce na wypełnienie
    en:
      - The organisation uses software whose installer carries the receiver's data added to the signed file and there is no replacement for it
      - Packages signed by an intermediary in a way using the room for padding are deployed on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is kept twice: once for programs built for this system and
      # once for those built for the older word length. Both have to be set,
      # because a program checks the signature in the view it runs in.
      $paths = [ordered]@{
        native  = 'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config'
        wow6432 = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
      }
      $name = 'EnableCertPaddingCheck'
      $missing = @()
      $other = @()
      foreach ($entry in $paths.GetEnumerator()) {
        $value = $null
        if (Test-Path -Path $entry.Value) {
          $value = (Get-ItemProperty -Path $entry.Value -ErrorAction Stop).$name
        }
        if ($null -eq $value) { $missing += $entry.Key }
        elseif (([string]$value).Trim() -ne '1') { $other += ($entry.Key + '=' + [string]$value) }
      }
      if ($missing.Count -gt 0) { 'MISSING ' + ($missing -join ',') }
      elseif ($other.Count -gt 0) { 'OTHER ' + ($other -join ',') }
      else { 'AS_REQUIRED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    $name = 'EnableCertPaddingCheck'
    $state = foreach ($path in $paths) {
      $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
      [pscustomobject]@{
        path        = $path
        name        = $name
        value       = $current
        existed     = ($null -ne $current)
        key_existed = (Test-Path -Path $path)
      }
    }
    $state | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both views of the registry are written. Setting only one leaves the other
    # road open.
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    foreach ($path in $paths) {
      if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
      Set-ItemProperty -Path $path -Name 'EnableCertPaddingCheck' -Value '1' -Type String
    }

  rollback_command: |
    $state = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($b in @($state)) {
      if ($b.existed) {
        Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
      } else {
        Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
        if (-not $b.key_existed) {
          # The key is removed only where the change made it and nothing else has
          # since been written into it.
          $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
          if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
            Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
          }
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/security-updates/securityadvisories/2014/2915720

notes:
  pl: |
    Punkt jest jedynym w bloku, który dotyczy zaufania do pliku, a nie
    zachowania procesu. Umieszczenie go tutaj ma jednak sens, bo odpowiada
    na to samo pytanie w innym miejscu łańcucha: czy to, co ma być kodem,
    jest tym, za co się podaje.

    Dwa miejsca w rejestrze to szczegół, który łatwo przeoczyć i który
    unieważnia całą regułę, gdy się go przeoczy. Program sprawdza podpis
    w tym widoku rejestru, w którym sam pracuje, więc ustawienie jednego
    wpisu zostawia całą klasę programów bez ochrony. Audyt zgłasza oba
    osobno właśnie po to.

    Warto zaznaczyć, że dopisywanie danych odbiorcy do podpisanego pliku
    było praktyką dopuszczalną i część oprogramowania z niej korzystała.
    Reguła nie odróżnia jej od nadużycia, bo odróżnić się nie da. Jest to
    przypadek, w którym odpuszczenie punktu z zapisanym uzasadnieniem bywa
    decyzją poprawną.
  en: |
    The item is the only one in the block concerning trust in a file rather than a
    process's behaviour. Putting it here makes sense all the same, answering the same
    question at another place in the chain: is what is meant to be code what it gives
    itself out to be.

    The two places in the registry are a detail easily passed over, and one that
    undoes the whole rule when it is. A program checks a signature in the view of the
    registry it works in, so setting one entry leaves a whole class of programs
    unguarded. The audit reports both apart for just that reason.

    Worth marking that adding a receiver's data to a signed file was an allowed
    practice and some software made use of it. The rule does not tell it from an
    abuse, because it cannot be told apart. It is a case where letting the item go
    with a written justification is at times a proper decision.
