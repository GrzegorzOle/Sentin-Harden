id: win2016-audit-detailed-file-share

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja szczegółowego dostępu do udziałów plikowych
    en: Audit detailed file share access
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje sięgnięcie po konkretny plik lub katalog w udziale
    sieciowym — a nie samo nawiązanie połączenia.

    Jest to najbardziej szczegółowa inspekcja dostępu do plików, jaką system
    oferuje, i zarazem najdroższa. Zdarzenie powstaje dla każdego otwarcia
    każdego obiektu przez sieć, więc otwarcie katalogu z dwustoma plikami
    w programie, który czyta je wszystkie, to dwieście zdarzeń.

    Dlatego reguła wymaga rejestrowania wyłącznie niepowodzeń. Jest to
    rozstrzygnięcie celowe i warte uzasadnienia. Rejestrowanie powodzeń dałoby
    pełny obraz ruchu plikowego, ale zapełniłoby dziennik w minuty na
    jakimkolwiek działającym serwerze plików. Rejestrowanie niepowodzeń kosztuje
    prawie nic, bo odmowy dostępu w normalnej pracy są rzadkie.

    I właśnie dlatego są cenne. Odmowa dostępu do pliku oznacza, że ktoś
    sięgnął po coś, czego nie miał prawa otworzyć. Jedna taka odmowa to zwykle
    pomyłka. Kilkadziesiąt w ciągu minuty, po kolejnych katalogach, to
    przeszukiwanie udziału — i jest to wzorzec, którego nie da się zobaczyć
    nigdzie indziej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przeszukiwania udziałów w poszukiwaniu tego, co uda się otworzyć, bez
    zostawiania śladu po tym, czego otworzyć się nie udało.
  en: |
    The subcategory records a reach for a particular file or directory in a network
    share - not the making of a connection.

    It is the most detailed auditing of file access the system offers, and at the
    same time the dearest. An event arises for every opening of every object over
    the network, so opening a directory of two hundred files in a program that reads
    them all is two hundred events.

    Hence the rule requires failures alone to be recorded. That is a deliberate
    decision and worth justifying. Recording successes would give a full picture of
    file traffic, but would fill the log in minutes on any working file server.
    Recording failures costs almost nothing, refusals of access being rare in the
    ordinary course of work.

    And that is exactly why they are valuable. A refusal of access to a file means
    somebody reached for something they had no right to open. One such refusal is
    usually a mistake. Some dozens within a minute, across one directory after
    another, is the searching of a share - and it is a pattern visible nowhere else.

    What an attacker gains while the item goes unmet: the means of searching shares
    for whatever will open, leaving no trace of what would not.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", ale wyłącznie dzięki ograniczeniu do niepowodzeń.

    To ograniczenie jest rdzeniem tej reguły, a nie szczegółem konfiguracji.
    Punkt z rejestrowaniem powodzeń byłby najdroższym w całej aplikacji
    i należałby do klasy wymagającej świadomego wdrożenia. Z samymi
    niepowodzeniami jest jednym z tańszych.

    Jeden przypadek warto sprawdzić: aplikacja, która w normalnej pracy sonduje
    istnienie plików, próbując je otworzyć i przyjmując odmowę jako odpowiedź.
    Taki wzorzec — rzadki, ale spotykany w starszym oprogramowaniu — generuje
    odmowy w tempie stałym i zamienia tę podkategorię w źródło szumu.

    Nic przy tym nie przestaje działać i nikt niczego nie zauważy. Odmowa
    dostępu następuje tak samo przed zmianą, jak po niej.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", but solely thanks to the limitation to failures.

    That limitation is the heart of this rule, not a detail of configuration. The
    item with successes recorded would be the dearest in the whole application and
    would belong to the class needing a planned rollout. With failures alone it is
    among the cheaper ones.

    One case is worth checking: an application that in the ordinary course of work
    probes for the existence of files by trying to open them and taking a refusal as
    the answer. Such a pattern - rare, but met with in older software - generates
    refusals at a steady pace and turns this subcategory into a source of noise.

    Nothing stops working while this goes on and nobody notices anything. Access is
    refused just as before the change.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — rejestrowane są wyłącznie odmowy dostępu, a te w normalnej pracy są rzadkie
      - Starsza aplikacja sondująca istnienie plików przez próby otwarcia zamienia tę podkategorię w źródło szumu
      - Odmowa dostępu następuje tak samo jak przed zmianą — zmienia się tylko to, czy zostaje po niej zapis
      - Włączenie rejestrowania powodzeń zapełniłoby dziennik w minuty i reguła celowo tego nie robi
    en:
      - No regression in the working - only refusals of access are recorded, and those are rare in ordinary work
      - An older application probing for files by trying to open them turns this subcategory into a source of noise
      - Access is refused just as before the change - what alters is only whether a record is left of it
      - Switching on the recording of successes would fill the log in minutes, and the rule deliberately does not
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja, która w normalnej pracy sonduje istnienie plików przez próby otwarcia zakończone odmową
    en:
      - An application that in ordinary work probes for files by attempts to open them ending in refusal runs on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9244-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[23]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9244-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9244-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9244-69AE-11D9-BED3-505054503030}" /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9244-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-detailed-file-share

notes:
  pl: |
    Ograniczenie do niepowodzeń jest tu decyzją projektową i tak ją opisuję.
    Organizacja, która potrzebuje pełnego obrazu ruchu plikowego, powinna
    sięgnąć po inspekcję nałożoną na konkretne katalogi, a nie włączać powodzenia
    w tej podkategorii. Koszt tego drugiego rozwiązania rośnie z całym ruchem,
    a nie z wagą danych.

    Punkt czyta się razem z inspekcją dostępu do udziałów. Tamta mówi, kto się
    połączył; ta mówi, po co sięgał i czego nie dostał.

    Oczekiwanie dopuszcza oba stany bitu powodzeń. Organizacja, która świadomie
    włączy także powodzenia, nie narusza tej reguły — przyjmuje tylko jej koszt.
  en: |
    The limitation to failures is a design decision here and is described as such.
    An organisation needing a full picture of file traffic should reach for auditing
    laid on particular directories rather than switch successes on in this
    subcategory. The cost of that second course grows with all the traffic rather
    than with the weight of the data.

    The item is read together with the auditing of share access. That one says who
    connected; this one says what they reached for and what they did not get.

    The expectation admits either state of the success bit. An organisation
    deliberately switching successes on too does not break this rule - it only takes
    on its cost.
