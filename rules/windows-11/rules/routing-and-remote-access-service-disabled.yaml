id: win11-routing-and-remote-access-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa trasowania i dostępu zdalnego wyłączona
    en: The routing and remote access service disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zamienia maszynę w urządzenie sieciowe: potrafi przekazywać ruch
    między jej kartami sieciowymi, przydzielać adresy, tłumaczyć adresy
    i przyjmować połączenia zestawiane z zewnątrz do sieci wewnętrznej.

    Na stacji roboczej żadna z tych ról nie jest potrzebna, a każda z nich jest
    obejściem tego, co pilnuje ruchu w sieci. Maszyna przekazująca ruch między
    dwiema kartami łączy sieci, które ktoś świadomie rozdzielił — i robi to
    poniżej poziomu, na którym stoją reguły na urządzeniach brzegowych.
    Połączenie zestawione z zewnątrz wprowadza ruch do środka sieci, omijając
    drogę, którą ten ruch miał przechodzić.

    Z punktu widzenia napastnika jest to gotowa droga wyjścia i wejścia.
    Maszyna, do której udało się dostać, zestawia połączenie na zewnątrz
    i staje się stałym wejściem do sieci — przy czym wszystko, czego do tego
    potrzeba, jest już zainstalowane i podpisane przez producenta systemu.

    Stacja robocza ma być punktem końcowym sieci, a nie jej węzłem.
    Wyłączenie usługi utrzymuje ten podział.
  en: |
    The service turns the machine into a piece of network equipment: it can pass traffic
    between its network cards, hand out addresses, translate addresses and take
    connections made from outside into the internal network.

    On a workstation none of these roles is needed, and each is a way round what watches
    over traffic on the network. A machine passing traffic between two cards joins
    networks somebody deliberately kept apart - and does so below the level at which the
    rules on edge equipment sit. A connection made from outside brings traffic into the
    middle of the network, going round the route that traffic was meant to take.

    From an attacker's point of view it is a ready way out and in. A machine they have
    managed to reach makes a connection outwards and becomes a standing way into the
    network - and everything needed for that is already installed and signed by the
    system's maker.

    A workstation is meant to be an end point of a network, not a node of it. Disabling
    the service keeps that division.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna pełni jakąkolwiek rolę sieciową poza
    byciem stacją roboczą.

    Na zdecydowanej większości stanowisk usługa jest już wyłączona i zmiana nie
    robi nic. Jest to ustawienie domyślne dla systemu klienckiego.

    Skutki pojawiają się w trzech sytuacjach. Pierwsza: maszyna udostępnia
    połączenie innym urządzeniom — przez przewód albo jako punkt dostępowy.
    Druga: maszyna przyjmuje połączenia zestawiane z zewnątrz, co zdarza się
    w małych sieciach jako doraźne rozwiązanie serwisowe. Trzecia: program
    innej firmy do zestawiania połączeń szyfrowanych opiera się na tej usłudze
    — część starszych klientów tak właśnie działa.

    Ten trzeci przypadek jest najmniej oczywisty i wart sprawdzenia przed
    wdrożeniem. Objawem jest wtedy niemożność zestawienia połączenia
    szyfrowanego, a nie żaden komunikat wskazujący na usługę.

    Przy pierwszych dwóch przypadkach właściwym rozwiązaniem nie jest cofnięcie
    zmiany, tylko przeniesienie roli sieciowej na urządzenie, które ma ją
    pełnić.

    Nie ma restartu.
  en: |
    What needs checking is whether the machine holds any network role beyond being a
    workstation.

    At the great majority of stations the service is already off and the change does
    nothing. It is the default for a client system.

    Effects appear in three situations. The first: the machine shares its connection
    with other devices - by a cable or as an access point. The second: the machine takes
    connections made from outside, which happens on small networks as a makeshift
    service arrangement. The third: a third party program for making encrypted
    connections rests on this service - some older clients work exactly that way.

    That third case is the least obvious and worth checking before the rollout. The
    symptom is then an encrypted connection that cannot be made, and no message pointing
    at the service at all.

    In the first two cases the right answer is not undoing the change but moving the
    network role to equipment meant to hold it.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Udostępnianie połączenia sieciowego innym urządzeniom przez tę maszynę przestaje działać
      - Połączenia szyfrowane zestawiane do tej maszyny z zewnątrz nie zostaną przyjęte
      - Starszy program do zestawiania połączeń szyfrowanych oparty na tej usłudze przestanie działać
      - Zwykła praca sieciowa stacji roboczej nie zmienia się w żaden sposób
    en:
      - Sharing the network connection with other devices through this machine stops working
      - Encrypted connections made to this machine from outside are not taken
      - An older program for making encrypted connections resting on this service stops working
      - The ordinary network work of a workstation does not change in any way
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna świadomie udostępnia połączenie sieciowe innym urządzeniom
      - Program do zestawiania połączeń szyfrowanych używany w organizacji opiera się na tej usłudze
    en:
      - The machine deliberately shares its network connection with other devices
      - The program for making encrypted connections used in the organisation rests on this service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RemoteAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RemoteAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/remote-access

notes:
  pl: |
    Usługa nie ma związku z pulpitem zdalnym mimo podobnej nazwy. Wyłączenie
    jej nie zmienia niczego w połączeniach pulpitem zdalnym, które obsługuje
    zupełnie inna usługa, opisana osobną regułą.

    Nie należy jej też mylić z usługą udostępniania połączenia, opisaną
    w tej paczce osobno. Tamta obsługuje udostępnianie połączenia
    i punkt dostępowy; ta pełni role trasowania i przyjmowania połączeń
    z zewnątrz. Na stacji roboczej obie powinny być wyłączone, ale są to dwa
    osobne ustawienia i wyłączenie jednej nie wyłącza drugiej.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The service has nothing to do with Remote Desktop despite the similar name.
    Disabling it changes nothing about Remote Desktop connections, which are handled by
    an entirely different service, described by a rule of its own.

    Nor should it be confused with the connection sharing service, described separately
    in this pack. That one handles connection sharing and the access point; this one
    holds the roles of routing and of taking connections from outside. On a workstation
    both should be off, but they are two separate settings and disabling one does not
    disable the other.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment.
