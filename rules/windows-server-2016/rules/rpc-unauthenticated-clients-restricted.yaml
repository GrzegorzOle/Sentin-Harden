id: win2016-rpc-unauthenticated-clients-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Procedure Call
  title:
    pl: Nieuwierzytelnieni klienci zdalnych wywołań ograniczeni
    en: Unauthenticated clients of remote procedure calls restricted
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe odrzucać zdalne wywołania procedur przychodzące od
    klientów, którzy się nie uwierzytelnili.

    Mechanizm zdalnego wywołania procedur jest tym, na czym opiera się
    większość rozmowy między maszynami w tej rodzinie systemów. Idą nim
    zapytania o usługi, zarządzanie, replikacja katalogu, druk, dziennik
    zdarzeń. Jest to droga szeroka i stara.

    Zachowanie domyślne dopuszcza wywołania bez uwierzytelnienia, bo część
    zastosowań tego wymaga — na przykład zapytanie o to, co maszyna w ogóle
    udostępnia, zadawane zanim ktokolwiek się przedstawi.

    Dopuszczenie to jest jednak powierzchnią samą w sobie. Zapytanie bez
    uwierzytelnienia dociera do kodu obsługującego interfejs, a kod ten
    bywa taki sam niezależnie od tego, kto pyta. Liczne podatności w tej
    rodzinie systemów dawały się wywołać właśnie w ten sposób: przed
    zalogowaniem, bez konta, z drugiej strony sieci.

    Ograniczenie zamyka tę drogę bez zamykania samego mechanizmu.
    Interfejsy, które uwierzytelnienia wymagają, pracują dalej; te, które
    go nie wymagały, przestają być osiągalne dla nikogo nieznanego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    kodu obsługującego zdalne wywołania bez konta i bez logowania — a więc
    punkt wyjścia dla podatności, które nie wymagają poświadczeń.
  en: |
    The setting has remote procedure calls coming from clients that have not
    authenticated turned away.

    The mechanism of remote procedure calls is what most of the conversation between
    machines in this family of systems rests on. Queries about services, management,
    directory replication, printing and the event log all go by it. It is a wide road
    and an old one.

    The default behaviour admits calls without authentication, some uses calling for
    it - for instance a query about what the machine shares at all, asked before
    anybody has presented themselves.

    That admission is a surface in itself all the same. A query without
    authentication reaches the code handling the interface, and that code is at times
    the same whoever asks. Numerous weaknesses in this family of systems could be set
    off in just that way: before signing in, without an account, from the other side
    of the network.

    The restriction shuts that road without shutting the mechanism itself. Interfaces
    calling for authentication work on; those that did not call for it stop being
    reachable by anybody unknown.

    What an attacker gains while the item goes unmet: access to the code handling
    remote calls without an account and without signing in - which is to say a
    starting point for weaknesses calling for no credentials.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedno z wdrożeń, przy
    których warto najpierw ustalić, kto z tą maszyną rozmawia.

    Ograniczenie trafia w wywołania bez uwierzytelnienia niezależnie od
    tego, czy są nadużyciem, czy zwykłą pracą. Zastosowań zaś jest sporo
    i nie wszystkie są oczywiste.

    Pierwsze to starsze narzędzia zarządzania i monitorowania, które pytają
    maszynę o stan przed przedstawieniem się. Po wdrożeniu przestaną
    dostawać odpowiedź.

    Drugie to maszyny spoza domeny. Stanowisko, które nie ma jak się
    uwierzytelnić wobec tej maszyny, traci dostęp do wszystkiego, co przez
    ten mechanizm szło — a idzie przez niego więcej, niż widać.

    Trzecie to część wywołań między maszynami w środowiskach po migracji,
    gdzie zaufanie bywa niepełne.

    Rzecz do zapamiętania przy wykonaniu: wartość jeden ogranicza wywołania
    nieuwierzytelnione, zostawiając wyjątki potrzebne samemu systemowi.
    Wartość dwa nie dopuszcza żadnego i psuje rzeczy, o których zepsucie
    ten punkt nie prosi. Różnica bywa mylona.

    Zmiana wymaga restartu. Do czasu restartu raport pokaże zgodność,
    a system będzie pracował po staremu.

    Czego to nie psuje: logowania użytkowników, dostępu do plików,
    drukowania lokalnego, pracy lokalnej.
  en: |
    The class is "needs a planned rollout", and it is one of those rollouts where it
    is worth first establishing who talks to this machine.

    The restriction strikes at calls without authentication whether they are an abuse
    or ordinary work. And the uses are many, not all of them obvious.

    The first is older management and monitoring tools asking the machine about its
    state before presenting themselves. After the rollout they will stop getting an
    answer.

    The second is machines outside the domain. A position with no way of
    authenticating towards this machine loses access to everything that went by that
    mechanism - and more goes by it than is seen.

    The third is some calls between machines in surroundings after a migration, where
    trust is at times incomplete.

    A thing to remember at execution: the value one restricts unauthenticated calls
    while leaving the exceptions the system itself needs. The value two admits none at
    all and breaks things this item does not ask to break. The difference is at times
    confused.

    The change calls for a restart. Until the restart the report will show compliance
    and the system will work in the old way.

    What this does not break: users signing in, access to files, local printing, or
    local work.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Starsze narzędzia zarządzania i monitorowania pytające maszynę o stan przed przedstawieniem się przestaną dostawać odpowiedź
      - Stanowisko spoza domeny, które nie ma jak się uwierzytelnić, traci dostęp do wszystkiego, co przez ten mechanizm szło
      - Wartość dwa zamiast jedynki nie dopuszcza żadnych wywołań nieuwierzytelnionych i psuje rzeczy, o których zepsucie ten punkt nie prosi
      - Do czasu restartu raport pokaże zgodność, a system będzie pracował po staremu
    en:
      - Older management and monitoring tools asking the machine about its state before presenting themselves will stop getting an answer
      - A position outside the domain with no way of authenticating loses access to everything that went by that mechanism
      - The value two instead of one admits no unauthenticated calls at all and breaks things this item does not ask to break
      - Until the restart the report will show compliance and the system will work in the old way
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z maszyną rozmawiają stanowiska spoza domeny albo narzędzia, które nie potrafią się uwierzytelnić przed zapytaniem
      - Nie ustalono, które maszyny sięgają do tej przez zdalne wywołania procedur
      - Nie da się wyznaczyć okna na restart maszyny
    en:
      - Positions outside the domain or tools unable to authenticate before asking talk to the machine
      - It has not been established which machines reach this one by remote procedure calls
      - No window can be set for restarting the machine
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The key spells the last element as Rpc, not RPC as in the printing rules.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
      $name = 'RestrictRemoteClients'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    $name = 'RestrictRemoteClients'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One restricts unauthenticated calls while leaving the exceptions the
    # system itself needs. Two admits none at all and breaks things this
    # item does not ask to break.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictRemoteClients' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/rpc-security

notes:
  pl: |
    Punkt otwiera blok o tym, co maszyna przyjmuje z sieci i co o sobie
    ogłasza. Jest w nim najszerszy w skutkach i dlatego stoi pierwszy.

    Poziom drugi jest tu uzasadniony i warto powiedzieć dlaczego. Punkt nie
    zakłada maszyny o szczególnym przeznaczeniu — zakłada środowisko, które
    wie, kto z kim rozmawia. Tam, gdzie tego nie wiadomo, wdrożenie jest
    strzałem w ciemno i kończy się cofnięciem.

    Rozróżnienie wartości jeden i dwa to najważniejsza rzecz praktyczna
    w całej regule. Aplikacja powinna pokazywać ją w podglądzie przed
    wykonaniem, bo pomyłka jest tu kosztowna, a nazwa ustawienia nie mówi
    nic o tym, że są dwa stopnie.
  en: |
    The item opens the block about what the machine takes in from the network and what
    it announces about itself. It is the widest in its consequences and so stands
    first.

    Level two is warranted here, and it is worth saying why. The item assumes no
    machine of a particular purpose - it assumes surroundings that know who talks to
    whom. Where that is not known, the rollout is a shot in the dark and ends in being
    undone.

    Telling the values one and two apart is the most important practical thing in the
    whole rule. The application should show it in the preview before execution, a slip
    being costly here and the setting's name saying nothing about there being two
    degrees.
