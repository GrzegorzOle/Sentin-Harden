id: win2025-user-activity-upload-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > OS Policies
  title:
    pl: Wysyłanie historii czynności użytkownika wyłączone
    en: Sending the history of a user's activities switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wysyłanie poza maszynę historii czynności użytkownika —
    zapisu tego, co było otwierane, w jakiej kolejności i kiedy.

    Kategoria średnia i chcę nazwać, czym ta historia jest, bo nazwa brzmi
    niewinnie. To nie jest lista ostatnich plików, którą widać w menu. To
    uporządkowany w czasie zapis pracy: jaki dokument, jaka aplikacja, jaki
    zasób, o której. Zapis pojedynczego otwarcia mówi niewiele. Zapis
    tygodnia mówi, czym ta maszyna jest i co się na niej robi.

    To jest właściwa treść punktu. Na serwerze historia czynności to
    historia pracy administratora: które konsole były otwierane, w jakiej
    kolejności, po jakich zdarzeniach. Ktoś, kto ma to przed sobą, wie
    o infrastrukturze więcej niż z samej listy ról.

    Druga rzecz to zasięg. Historia wysłana poza maszynę jest dostępna
    z każdego miejsca, w którym da się zalogować tym kontem, a więc również
    ze stanowiska, które nie podlega żadnym zabezpieczeniom ustawionym
    tutaj.

    Punkt dotyczy wyłącznie wysyłki. Sama historia dalej powstaje i dalej
    leży na maszynie — i jest to różnica, którą warto rozumieć, zanim ktoś
    uzna, że reguła sprząta więcej, niż sprząta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uporządkowany
    opis pracy wykonywanej na tym serwerze, osiągalny bez dostępu do samego
    serwera.
  en: |
    The item switches off the sending beyond the machine of a user's activity
    history - the record of what was opened, in what order and when.

    The category is medium, and I want to name what that history is, because
    the name sounds innocent. It is not the list of recent files shown in a
    menu. It is a record of work ordered in time: which document, which
    application, which resource, at what hour. The record of a single opening
    says little. The record of a week says what this machine is and what is
    done on it.

    That is the real substance of the item. On a server the activity history
    is the history of an administrator's work: which consoles were opened, in
    what order, after what events. Somebody with that in front of them knows
    more about the infrastructure than from the list of roles alone.

    The second thing is reach. A history sent beyond the machine is available
    from every place where that account can sign in, and so also from a
    workstation covered by none of the protections set up here.

    The item covers only the sending. The history itself still comes into
    being and still lies on the machine - a difference worth understanding
    before anybody decides the rule tidies up more than it does.

    What an attacker gains while the item goes unmet: an ordered description
    of the work done on this server, reachable without access to the server
    itself.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Wysyłanie historii daje pożytek dopiero
    wtedy, gdy ktoś przesiada się między maszynami i chce wrócić do tego,
    co robił gdzie indziej. Na serwerze taki scenariusz nie występuje.

    Skutek, gdyby ktoś tego używał: widok czynności pokaże wyłącznie to, co
    robiono na tej maszynie, a nie to, co robiono na innych. Historia
    lokalna zostaje nietknięta.

    Czego to nie psuje: listy ostatnio używanych plików, historii
    w aplikacjach, dzienników systemowych, dzienników zabezpieczeń ani
    niczego, co służy do odtwarzania zdarzeń po fakcie. Punkt dotyczy
    wygody, a nie nadzoru — nie zabiera żadnego materiału dowodowego.

    Rzecz do zapamiętania: wpis leży w gałęzi systemowej, w której stoi już
    kilka reguł o zupełnie innym przedmiocie. Znajoma ścieżka nie znaczy, że
    grupa jest zamknięta.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption". Sending the history is of use only when
    somebody moves between machines and wants to return to what they were
    doing elsewhere. On a server that case does not arise.

    The effect, were anybody using it: the activity view will show only what
    was done on this machine, not what was done on others. The local history
    is left untouched.

    What this does not break: the list of recently used files, history within
    applications, system logs, security logs, or anything used to reconstruct
    events after the fact. The item concerns convenience rather than
    oversight - it takes away no evidence.

    Something to remember: the entry lies in the system branch, where several
    rules of an entirely different subject already stand. A familiar path
    does not mean the group is closed.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Widok czynności pokaże wyłącznie to, co robiono na tej maszynie, a nie to, co robiono na innych
      - Historia lokalna zostaje nietknięta — punkt dotyczy wyłącznie wysyłki poza maszynę
      - Lista ostatnio używanych plików, historia w aplikacjach i dzienniki systemowe działają bez zmian
      - Reguła nie zabiera żadnego materiału dowodowego — dotyczy wygody, a nie nadzoru
    en:
      - The activity view shows only what was done on this machine, not what was done on others
      - The local history is left untouched - the item covers only the sending beyond the machine
      - The list of recently used files, history within applications and system logs work unchanged
      - The rule takes away no evidence - it concerns convenience rather than oversight
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest jednym ze stanowisk, między którymi ta sama osoba przenosi pracę, opierając się na widoku czynności
    en:
      - The machine is one of several workstations between which the same person moves their work, relying on the activity view
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'UploadUserActivities'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'UploadUserActivities'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The record of a single opening says little; the record of a week says what
    # this machine is and what is done on it. On a server that is the history of
    # an administrator's work. The change stops the sending only - the history
    # still comes into being and still lies on the machine.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UploadUserActivities' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy

