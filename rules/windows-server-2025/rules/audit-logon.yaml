id: win2025-audit-logon

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja logowania
    en: Audit logon
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje każde logowanie do tej maszyny — udane
    i nieudane, z konsoli, z sieci, przez pulpit zdalny, przez udział
    plikowy i przez usługę.

    Jest to zapis odpowiadający na pytanie zadawane po każdym incydencie
    jako pierwsze: kto tu był i kiedy. Na serwerze pytanie to ma szerszy
    zakres niż na stanowisku roboczym, bo do serwera loguje się wiele
    osób i wiele usług, a większość z nich nigdy nie zobaczy jego ekranu.

    Zdarzenie niesie typ logowania i to jest w nim najcenniejsze.
    Rozróżnienie między logowaniem sieciowym, interaktywnym a logowaniem
    usługi pozwala odróżnić zwykłe odwołanie do udziału od kogoś, kto
    faktycznie pracuje na tej maszynie — a to jest różnica, wokół której
    obraca się każde dochodzenie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wejścia na maszynę, przebywania na niej i wyjścia bez pozostawienia
    zapisu o tym, że się to stało. Skradzione poświadczenia działają wtedy
    bezgłośnie — konto jest prawidłowe, logowanie jest prawidłowe i nic
    tego nie odnotowuje.

    Rejestrowanie niepowodzeń pokazuje próby, rejestrowanie powodzeń
    pokazuje, które z nich się udały. Dopiero obie razem dają wykaz,
    z którego da się cokolwiek odtworzyć.
  en: |
    The subcategory records every sign-in to this machine - successful and failed, from the
    console, from the network, over remote desktop, over a file share and by a service.

    It is the record answering the question asked first after every incident: who was here
    and when. On a server that question has a wider reach than at a working station, since
    many people and many services sign in to a server, and most of them will never see its
    screen.

    The event carries the kind of sign-in and that is the most precious thing in it. Telling
    apart a network sign-in, an interactive one and a service's one allows an ordinary call
    on a share to be told from somebody actually working on this machine - and that is the
    difference every inquiry turns around.

    What an attacker gains while the item goes unmet: the means of coming onto the machine,
    staying on it and leaving with no record that any of it happened. Stolen credentials
    then work soundlessly - the account is right, the sign-in is right, and nothing notes
    it.

    Recording failures shows the attempts, recording successes shows which of them worked.
    Only the two together give a list from which anything can be pieced back.

disruption_description:
  pl: |
    Sprawdzenia wymaga objętość, bo jest to jedna z najobfitszych
    podkategorii w całym zestawie, a na serwerze obfitsza niż gdziekolwiek
    indziej.

    Nic nie przestaje działać i nikt się nie wyloguje. Koszt jest
    w całości kosztem miejsca i przepustowości.

    Rząd wielkości bywa zaskakujący. Zdarzenie powstaje nie tylko wtedy,
    gdy ktoś siada do maszyny, ale przy każdym odwołaniu do udziału
    plikowego, przy każdym uruchomieniu usługi i przy każdym połączeniu
    z zadania zaplanowanego. Serwer plików albo serwer aplikacji potrafi
    w ten sposób zapisywać zdarzenia w tempie kilkudziesięciu na minutę,
    nie mając na pokładzie ani jednej zalogowanej osoby.

    Dlatego punkt wdraża się razem z powiększeniem dziennika zabezpieczeń,
    nie przed nim. Przy rozmiarze domyślnym zapis obraca się na serwerze
    plikowym w ciągu godzin, a w raporcie wygląda na wdrożony.

    Warto też policzyć strumień wysyłany do systemu zbierającego zdarzenia.
    To właśnie ta podkategoria zwykle przesądza o tym, ile miejsca zajmują
    tam dane z serwera.
  en: |
    What needs checking is the volume, since it is one of the most abundant subcategories in
    the whole set, and on a server more abundant than anywhere else.

    Nothing stops working and nobody gets signed out. The cost is wholly one of space and of
    throughput.

    The order of size is at times surprising. An event arises not only when somebody sits
    down at the machine, but at every call on a file share, at every start of a service and
    at every connection from a scheduled task. A file server or an application server can in
    this way record events at a pace of a few dozen a minute with not one signed-in person
    aboard.

    Hence the item is rolled out together with the enlarging of the security log rather than
    before it. At the default size the record turns over on a file server within hours, and
    in the report it looks rolled out.

    It is worth counting the stream sent to the event-gathering system as well. It is
    exactly this subcategory that usually settles how much room a server's data take up
    there.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — rośnie wyłącznie objętość dziennika zabezpieczeń
      - Zdarzenie powstaje przy każdym odwołaniu do udziału, nie tylko przy pracy człowieka
      - Na serwerze plikowym zapis przy domyślnym rozmiarze dziennika obraca się w ciągu godzin
      - To zwykle ta podkategoria przesądza o objętości danych w systemie zbierającym
    en:
      - No regression in the working - only the security log's volume grows
      - An event arises at every call on a share, not only at a person's work
      - On a file server the record at the log's default size turns over within hours
      - It is usually this subcategory that settles the volume of data in the gathering system
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma domyślny rozmiar i nie ma go jak powiększyć
      - Zdarzenia z tej maszyny są rozliczane objętościowo w systemie zbierającym
    en:
      - The security log is at its default size and there is no way of enlarging it
      - Events from this machine are billed by volume in the gathering system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9215-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9215-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9215-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9215-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9215-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-logon

notes:
  pl: |
    Punkt dotyczy logowania do tej maszyny, a nie sprawdzenia poświadczeń.
    Rozróżnienie jest istotne i oba punkty istnieją osobno — poświadczenia
    sprawdza ta maszyna, która przechowuje hasło, a logowanie zapisuje ta,
    na którą ktoś wchodzi. Przy koncie domenowym są to dwie różne maszyny.

    Zdarzenie niesie typ logowania i to on decyduje o wartości zapisu.
    Bez niego wykaz mówi, że ktoś był, ale nie mówi, czy pracował na
    maszynie, czy tylko odczytał plik z udziału.

    Punkt czyta się razem z rozmiarem dziennika zabezpieczeń. Jest to
    podkategoria, która ten dziennik zapełnia najszybciej.
  en: |
    The item concerns signing in to this machine rather than the checking of credentials.
    The distinction matters and the two items exist apart - credentials are checked by the
    machine holding the password, and a sign-in is recorded by the one somebody comes onto.
    At a domain account those are two different machines.

    The event carries the kind of sign-in and it is that which settles the record's worth.
    Without it the list says somebody was here but does not say whether they worked on the
    machine or merely read a file off a share.

    The item is read together with the security log's size. It is the subcategory that fills
    that log the fastest.
