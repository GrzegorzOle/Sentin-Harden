id: win2025-remote-assistance-unsolicited-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Assistance
  title:
    pl: Pomoc zdalna oferowana bez prośby użytkownika zablokowana
    en: Remote assistance offered without the user asking blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje odmianę pomocy zdalnej, w której to pomagający
    zgłasza się pierwszy. Zostaje wyłącznie odmiana z zaproszeniem
    wysłanym przez tego, komu pomoc jest potrzebna.

    Różnica między tymi dwiema odmianami jest całą treścią punktu
    i warto ją nazwać dokładnie, bo brzmią podobnie, a znaczą co innego.

    W odmianie z zaproszeniem to człowiek przy maszynie decyduje, kiedy
    ktoś zagląda do jego sesji: sam prosi, sam wysyła zaproszenie, sam
    wie, że ktoś patrzy. W odmianie bez prośby kierunek jest odwrotny.
    Połączenie zaczyna się po stronie pomagającego, a lista tych, którzy
    mogą je zacząć, jest zapisana w konfiguracji maszyny.

    Tu leży zysk napastnika i jest on inny niż przy samym mechanizmie
    pomocy zdalnej. Lista pomagających jest ustawieniem, a ustawienie da
    się zmienić. Napastnik, który raz zdobył uprawnienia pozwalające
    dopisać się do tej listy, dostaje drogę powrotną — trwałą, wyglądającą
    na element normalnej konfiguracji i niewymagającą ani hasła, ani
    zaproszenia.

    Na serwerze takie wejście jest szczególnie wygodne z powodu, który
    warto zapisać wprost: nikt przy serwerze nie siedzi, więc nikt nie
    zobaczy, że ktoś właśnie podłączył się do sesji. Na stanowisku
    roboczym człowiek zauważyłby obcy kursor. Tutaj nie ma komu zauważyć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    powrotną do sesji na serwerze, zaczynaną po jego stronie, bez
    zaproszenia i bez świadka.
  en: |
    The setting blocks that turn of remote assistance wherein it is the helper who comes forward
    first. There is left only the turn with an invitation sent by the one who needs the help.

    The difference between those two turns is the item's whole substance and is worth naming
    exactly, for they sound alike and mean otherwise.

    In the turn with an invitation it is the person at the machine who settles when somebody looks
    into their session: they ask themselves, they send the invitation themselves, they themselves
    know that somebody is watching. In the turn without asking the way is the other about. The
    connection begins at the helper's side, and the list of those who may begin it is written in
    the machine's settings.

    Here lies the attacker's gain and it is other than with the mechanism of remote assistance
    itself. The list of helpers is a setting, and a setting can be changed. An attacker who once
    won the rights letting them write themselves into that list gets a road back - lasting, looking
    like a piece of ordinary settings, and taking neither a password nor an invitation.

    On a server such a way in is uncommonly handy for a reason worth writing plainly: nobody sits
    at a server, so nobody will see that somebody has just joined a session. At a working station a
    person would mark a strange cursor. Here there is nobody to mark it.

    What an attacker gains while the item goes unmet: a road back into a session on the server,
    begun at their own side, with no invitation and with no witness.

disruption_description:
  pl: |
    Zostawiam ten punkt w klasie bez uciążliwości i jest to jedyna
    reguła w tym bloku, którą wolno zastosować hurtem. Podaję powody,
    żeby nie brzmiało to jak wygoda.

    Odmiana pomocy zdalnej bez prośby wymaga wcześniejszego
    skonfigurowania listy pomagających. Bez tej listy nie działa w ogóle,
    a lista ta na serwerach praktycznie nie bywa wypełniana — została
    pomyślana dla działów wsparcia obsługujących stanowiska pracowników,
    nie dla serwerowni.

    Ustawienie nie dotyka odmiany z zaproszeniem. Tam, gdzie pomoc
    zdalna na serwerze terminali jest faktycznie używana, używa się jej
    właśnie z zaproszeniem — i to działa dalej. Odcinamy drogę, z której
    nikt nie korzysta, zostawiając tę, z której ktoś może korzystać.

    Zmiana nie wymaga restartu maszyny ani usługi, nie wymaga
    wylogowania i cofa się natychmiast przez przywrócenie poprzedniej
    wartości.

    Jedyna rzecz warta sprawdzenia dotyczy dużych organizacji, w których
    dział wsparcia ma jedną konfigurację dla wszystkich maszyn, łącznie
    z serwerami. Jeżeli lista pomagających jest tam wypełniona i ktoś
    faktycznie z niej korzysta, zobaczy to od razu po zmianie. Jest to
    sytuacja rzadka, ale gdy występuje, występuje świadomie — ktoś tę
    listę wypełnił celowo.

    Punkt czyta się razem z wyłączeniem samej pomocy zdalnej. Tamten
    zamyka oba wejścia; ten zamyka to, którego nikt nie potrzebuje,
    i dlatego nadaje się do zastosowania od razu, także wtedy, gdy
    decyzja o tamtym jeszcze nie zapadła.
  en: |
    I leave this item in the class without disruption, and it is the only rule in this block which
    may be applied in bulk. I give the reasons lest it sound like convenience.

    The turn of remote assistance without asking takes a list of helpers set up beforehand. Without
    that list it does not work at all, and that list on servers is next to never filled - it was
    thought out for departments of support serving workers' stations and not for server rooms.

    The setting does not touch the turn with an invitation. Where remote assistance on a terminal
    server is in fact used, it is used with an invitation - and that works on. We cut off a road
    nobody uses, leaving the one somebody may use.

    The change takes no restart of the machine nor of a service, takes no signing off, and is
    undone at once by the setting back of the former value.

    The one thing worth checking bears on large organisations where the department of support has
    one set of settings for all machines, servers included. If the list of helpers is filled there
    and somebody does in fact use it, they will see it straight after the change. It is a rare
    state, but where it occurs it occurs knowingly - somebody filled that list on purpose.

    The item is read together with the switching off of remote assistance itself. That one shuts
    both ways in; this one shuts the way nobody needs, and so is fit for applying at once, also
    where the decision on that one has not yet been made.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Odmiana z zaproszeniem wysłanym przez użytkownika działa dalej i nie jest tym punktem dotknięta
      - Bez wypełnionej listy pomagających odmiana bez prośby nie działa w ogóle, więc nie ma czego zepsuć
      - Tam, gdzie dział wsparcia wypełnił listę dla wszystkich maszyn, połączenie przestanie się nawiązywać
      - Zmiana nie wymaga restartu maszyny ani usługi, ani wylogowania
    en:
      - The turn with an invitation sent by the user works on and is untouched by this item
      - Without a filled list of helpers the turn without asking does not work at all, so there is nothing to break
      - Where a department of support filled the list for all machines, the connection will stop opening
      - The change takes no restart of the machine nor of a service, nor a signing off
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dział wsparcia celowo wypełnił listę pomagających także dla serwerów i z niej korzysta
      - Obsługa serwera opiera się na połączeniu zaczynanym po stronie pomagającego
    en:
      - A department of support has on purpose filled the list of helpers for servers too and uses it
      - The serving of the server rests on a connection begun at the helper's side
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fAllowUnsolicited'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fAllowUnsolicited'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fAllowUnsolicited' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Różnica między odmianami jest całą treścią punktu: z zaproszeniem
    decyduje człowiek przy maszynie, bez prośby — lista zapisana
    w konfiguracji.

    Dlatego zysk napastnika jest inny niż przy samym mechanizmie pomocy
    zdalnej: kto raz dopisze się do tej listy, ma drogę powrotną
    wyglądającą na element normalnej konfiguracji.

    Na serwerze nikt nie siedzi, więc nikt nie zobaczy obcego kursora.
    Na stanowisku roboczym człowiek by zauważył.

    Jedyna reguła w tym bloku nadająca się do zastosowania hurtem —
    bez wypełnionej listy pomagających odmiana bez prośby nie działa
    w ogóle, więc nie ma czego zepsuć.
  en: |
    The difference between the turns is the item's whole substance: with an invitation the person
    at the machine settles it, without asking - a list written in the settings.

    Hence the attacker's gain is other than with the mechanism of remote assistance itself: whoever
    once writes themselves into that list has a road back looking like a piece of ordinary
    settings.

    Nobody sits at a server, so nobody will see a strange cursor. At a working station a person
    would mark it.

    The only rule in this block fit for applying in bulk - without a filled list of helpers the
    turn without asking does not work at all, so there is nothing to break.
