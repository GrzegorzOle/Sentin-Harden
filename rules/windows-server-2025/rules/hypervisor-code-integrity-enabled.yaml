id: win2025-hypervisor-code-integrity-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Wymuszanie integralności kodu przez hipernadzorcę włączone
    en: Hypervisor-enforced code integrity enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza sprawdzanie integralności kodu jądra przez warstwę
    wirtualizacji. Kod, który ma zostać wykonany z uprawnieniami jądra,
    musi być podpisany i zgodny z regułami, a decyzję podejmuje warstwa
    leżąca poza samym jądrem.

    Zostawiam kategorię wysoką. Jest to mechanizm, który zamyka drogę
    wykorzystywaną od lat: napastnik, który zdobył dość uprawnień, ładuje
    do jądra własny sterownik albo sterownik cudzy, podpisany i znany
    jako podatny, i od tego momentu działa poniżej wszystkiego, co go
    mogło zobaczyć. Sprawdzanie prowadzone spoza jądra znaczy, że sam
    fakt zdobycia jądra nie pozwala tego sprawdzania obejść.

    Na serwerze wartość jest większa niż na stacji roboczej o tyle,
    o ile więcej na serwerze stoi oprogramowania pracującego w jądrze:
    agenty kopii zapasowych, filtry ochrony, sterowniki kontrolerów
    dyskowych, agenty monitorowania sprzętu producenta maszyny. Każdy
    z nich jest kodem w jądrze, a więc każdy jest drogą, jeżeli okaże się
    podatny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    załadowania do jądra własnego kodu po zdobyciu odpowiednich
    uprawnień, a więc zejścia poniżej poziomu, na którym cokolwiek na tej
    maszynie mogłoby go jeszcze zauważyć.
  en: |
    The item switches on the looking over of the wholeness of the kernel's code by the layer of
    unbodying. Code that is to run with the leaves of the kernel must be signed and in keeping with the
    rules, and the deciding is made by a layer lying outside the kernel itself.

    I leave the category high. It is a working that shuts a road used for years - an attacker who has
    won leaves enough loads into the kernel a driver of their own, or another's driver, signed and known
    to be open to harm, and from that hour works beneath everything that might have seen them. A
    looking over led from outside the kernel means that the mere winning of the kernel lets not that
    looking over be gone about.

    Upon a server the worth is greater than upon a workstation by as much as there stands upon a server
    more software working within the kernel - agents of backing up, filters of warding, drivers of the
    rulers of disks, agents watching over the gear of the maker of the machine. Each of them is code
    within the kernel, and therefore each is a road, should it prove open to harm.

    What an attacker gains while the item goes unmet - the might of loading their own code into the
    kernel upon the winning of leaves enough, and thereby of going beneath the level whereat anything
    upon that machine might still mark them.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i mówię wprost, że
    jest to najgroźniejszy punkt w tej grupie, a prawdopodobnie
    najgroźniejszy w całej dotychczasowej paczce. Nie dlatego, że coś
    psuje, tylko dlatego, że to, co może zepsuć, uniemożliwia start
    maszyny.

    Mechanizm ten odmawia załadowania sterownika, który nie spełnia
    wymagań. Na stacji roboczej odmowa dotyczy zwykle sterownika drukarki
    i objawia się tym, że nie da się drukować. Na serwerze ten sam
    mechanizm może odmówić sterownikowi kontrolera dyskowego, karcie
    magistrali pamięci masowej albo filtrowi systemu plików należącemu do
    agenta kopii zapasowych. Odmowa sterownikowi, przez który maszyna
    widzi swój dysk, znaczy maszynę, która się nie uruchamia.

    Dlatego kolejność przy tym punkcie jest inna niż przy wszystkich
    pozostałych. Nie wystarczy podgląd skutków ani okno serwisowe.
    Właściwym sposobem jest sprawdzenie na maszynie tego samego modelu,
    z tym samym zestawem sterowników i tym samym oprogramowaniem
    pracującym w jądrze. Sprawdzenie na innej maszynie nie odpowiada na
    zadane pytanie, bo pytanie brzmi o konkretne sterowniki tej maszyny.

    Producent systemu udostępnia tryb, w którym mechanizm nie blokuje,
    tylko zapisuje, co by zablokował. Na serwerze produkcyjnym jest to
    właściwy pierwszy krok i wprost zalecam wykonanie go przed samą
    zmianą: kilka dni w trybie zapisu daje listę sterowników, które
    trzeba wymienić albo uaktualnić, i robi to bez ryzyka.

    Zmiana wiąże się po restarcie i cofa się po kolejnym, ale przy
    maszynie, która nie wstała, cofnięcie wykonuje się z konsoli albo ze
    środowiska naprawczego — a nie z sesji zdalnej, bo tej nie będzie.
  en: |
    I leave the class "needs a witting rolling out" and say outright that it is the grimmest item of
    that band, and belike the grimmest in the whole pack thus far. Not for that it breaks something,
    but for that what it may break makes the machine unable to start.

    That working denies the loading of a driver that meets not the demands. Upon a workstation the
    denying mostly touches the driver of a printer and shows itself in that one cannot print. Upon a
    server that same working may deny the driver of the ruler of disks, a card of the way to the mass
    store, or a filter of the file-keeping belonging to an agent of backing up. A denying to the driver
    whereby the machine sees its own disk means a machine that starts not.

    Therefore the ordering at this item is other than at all the rest. Neither a foresight of the
    outcomes nor a window of service is enough. The right way is a trying upon a machine of the same
    make, with the same set of drivers and the same software working within the kernel. A trying upon
    another machine answers not the question asked, the question being upon the set drivers of that
    machine.

    The maker of the system gives a mode wherein the working blocks not but writes down what it would
    have blocked. Upon a server at work that is the right first step and I bid outright that it be
    taken before the change itself - a few days in the mode of writing gives the list of drivers that
    must be swapped or made anew, and gives it without hazard.

    The change binds after a starting anew and is undone after a further one, but at a machine that
    rose not the undoing is done from the board or from the setting of mending - and not from a far-off
    session, there being none.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - virtualization-and-containers
    - printing
  what_breaks:
    pl:
      - Sterownik niespełniający wymagań nie zostaje załadowany, a na serwerze bywa to sterownik kontrolera dyskowego
      - Odmowa sterownikowi, przez który maszyna widzi swój dysk, znaczy maszynę, która się nie uruchamia
      - Filtry systemu plików agentów kopii zapasowych i ochrony przestają się ładować, jeżeli nie spełniają wymagań
      - Sprawdzenie na innej maszynie nie odpowiada na zadane pytanie, bo pytanie dotyczy sterowników tej maszyny
      - Przy maszynie, która nie wstała, cofnięcie wykonuje się z konsoli albo ze środowiska naprawczego, nie z sesji zdalnej
    en:
      - A driver that meets not the demands is not loaded, and upon a server that is at times the driver of the ruler of disks
      - A denying to the driver whereby the machine sees its own disk means a machine that starts not
      - Filters of the file-keeping belonging to agents of backing up and of warding stop loading if they meet not the demands
      - A trying upon another machine answers not the question asked, the question being upon the drivers of that machine
      - At a machine that rose not the undoing is done from the board or the setting of mending and not from a far-off session
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sprawdzono maszyny tego samego modelu z tym samym zestawem sterowników i oprogramowaniem pracującym w jądrze
      - Nie uruchomiono wcześniej trybu, w którym mechanizm tylko zapisuje, co by zablokował
      - Nie ma dostępu do konsoli maszyny ani do środowiska naprawczego na wypadek, gdyby po restarcie nie wstała
    en:
      - No machine of the same make with the same set of drivers and software working within the kernel was tried
      - The mode wherein the working only writes down what it would have blocked was not run beforehand
      - There is no reach to the board of the machine nor to the setting of mending for the case that it rise not
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
      $name = 'Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
    $name = 'Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The most dangerous item in this group. A driver that fails the check is
    # not loaded - on a server that can be the storage controller, and then the
    # machine does not boot. Run the audit-only mode for a few days first and
    # test on a machine of the same model with the same drivers.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Enabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Najgroźniejszy punkt w tej grupie i prawdopodobnie w całej paczce —
    nie dlatego, że coś psuje, tylko dlatego, że to, co może zepsuć,
    uniemożliwia start maszyny.

    Na stacji roboczej odmowa dotyczy sterownika drukarki. Na serwerze
    może dotyczyć kontrolera dyskowego, karty magistrali pamięci masowej
    albo filtru systemu plików agenta kopii zapasowych.

    Kolejność inna niż przy pozostałych punktach: nie wystarczy podgląd
    skutków ani okno serwisowe. Najpierw kilka dni w trybie, w którym
    mechanizm tylko zapisuje, co by zablokował, potem sprawdzenie na
    maszynie tego samego modelu z tym samym zestawem sterowników. Przy
    maszynie, która nie wstała, cofnięcie idzie z konsoli, nie z sesji
    zdalnej.
  en: |
    The grimmest item of that band and belike of the whole pack - not for that it breaks something, but
    for that what it may break makes the machine unable to start.

    Upon a workstation the denying touches the driver of a printer. Upon a server it may touch the
    ruler of disks, a card of the way to the mass store, or a filter of the file-keeping of an agent of
    backing up.

    An ordering other than at the rest - neither a foresight of the outcomes nor a window of service is
    enough. First a few days in the mode wherein the working only writes down what it would have
    blocked, then a trying upon a machine of the same make with the same set of drivers. At a machine
    that rose not the undoing goes from the board and not from a far-off session.
