id: win2016-optional-subsystems-empty

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista opcjonalnych środowisk uruchomieniowych pusta
    en: The list of optional runtime environments left empty
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozostawia pustą listę dodatkowych środowisk uruchomieniowych
    startujących razem z systemem.

    System potrafi uruchomić obok własnego środowiska inne — takie, które
    przyjmują programy napisane pod odmienny zestaw reguł i tłumaczą ich
    wywołania na wywołania jądra. Mechanizm pochodzi z czasów, gdy trzeba
    było uruchamiać programy pisane pod systemy obce, i został w systemie
    długo po tym, jak przestało to być potrzebne.

    Zagrożenie leży w tym, że środowisko takie jest równoległą drogą do
    jądra. Reguły, mechanizmy kontroli i zapisy zbudowane wokół środowiska
    podstawowego nie muszą obowiązywać w środowisku dodatkowym — bo zostało
    ono napisane po to, żeby zachowywać się inaczej.

    Praktyczny skutek bywa dokładnie taki: program uruchomiony w środowisku
    dodatkowym potrafi sięgnąć tam, gdzie program zwykły zostałby
    zatrzymany, i zrobić to bez obchodzenia czegokolwiek — po prostu inną
    drogą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: równoległą
    drogę do jądra, w której część reguł zbudowanych wokół drogi
    podstawowej nie obowiązuje.
  en: |
    The setting leaves empty the list of additional runtime environments starting along with the
    system.

    The system can start beside its own environment others - such as take in programs written to
    a different set of rules and translate their calls into calls on the kernel. The mechanism
    comes from times when programs written for foreign systems had to be run, and it stayed in
    the system long after that ceased to be needed.

    The threat lies in such an environment being a parallel road to the kernel. The rules,
    mechanisms of control and records built around the basic environment need not hold in the
    additional one - it having been written in order to behave otherwise.

    The practical upshot is at times exactly that: a program started in the additional
    environment can reach where an ordinary program would be stopped, and do so without going
    round anything - simply by another road.

    What an attacker gains while the item goes unmet: a parallel road to the kernel, on which
    some of the rules built around the basic road do not hold.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie jest na serwerze bieżącym
    krótkie.

    Lista jest w wydaniach bieżących pusta albo niemal pusta, bo
    środowiska, o które chodziło, zostały z systemu usunięte. Wykonanie
    zmiany na maszynie, na której lista już jest pusta, nie robi nic poza
    zapisaniem stanu.

    Sprawdzić warto, co na liście stoi, jeżeli cokolwiek stoi. Wpis
    niestandardowy oznacza, że ktoś ten mechanizm świadomie wykorzystał —
    zwykle do uruchomienia oprogramowania przeniesionego z systemu obcego.
    Takie oprogramowanie przestanie działać po restarcie i nie będzie to
    objaw subtelny.

    Zmiana działa dopiero po restarcie, co warto zaznaczyć. Środowiska
    uruchamiają się przy starcie systemu i opróżnienie listy w czasie pracy
    nie zatrzymuje tego, co już wstało.

    Czego to nie psuje: aplikacji uruchamianych w środowisku podstawowym,
    powłoki, skryptów, usług, sieci, uwierzytelniania.

    Wymaga restartu; cofnięcie działa po kolejnym restarcie.
  en: |
    The class is "needs review", and on a current server the review is a short one.

    The list is in current editions empty or nearly so, the environments in question having been
    taken out of the system. Making the change on a machine where the list is already empty does
    nothing beyond recording the state.

    It is worth checking what stands on the list, if anything does. A non-standard entry means
    somebody used that mechanism knowingly - as a rule to run software carried over from a
    foreign system. Such software will stop working after a restart and the symptom will not be a
    subtle one.

    The change takes effect only after a restart, which is worth marking. The environments start
    when the system starts, and emptying the list while it runs does not stop what has already
    come up.

    What this does not break: applications run in the basic environment, the shell, scripts,
    services, the network, or authentication.

    Calls for a restart; the undoing works after a further restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Oprogramowanie przeniesione z systemu obcego i uruchamiane w środowisku dodatkowym przestanie działać po restarcie
      - Zmiana nie zatrzymuje środowiska, które już wstało - skutek pojawia się dopiero przy kolejnym starcie systemu
      - Na maszynie z listą już pustą wykonanie nie robi nic poza zapisaniem stanu
      - Aplikacje w środowisku podstawowym, powłoka, skrypty i usługi pozostają bez zmian
    en:
      - Software carried over from a foreign system and run in the additional environment will stop working after a restart
      - The change does not stop an environment already up - the consequence appears only at the system's next start
      - On a machine where the list is already empty the execution does nothing beyond recording the state
      - Applications in the basic environment, the shell, scripts and services stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje oprogramowanie przeniesione z systemu obcego, uruchamiane w środowisku dodatkowym
      - Wpis na liście został dodany świadomie i nie ustalono, co go tam umieściło
    en:
      - Software carried over from a foreign system, run in the additional environment, works on the machine
      - An entry on the list was added knowingly and it has not been established what put it there
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a
      # list with nothing on it mean the same thing here - no additional
      # environment is started - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems'
      $name = 'Optional'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'EMPTY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems'
    $name = 'Optional'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = @($current)
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is emptied rather than removed. The value itself is expected by
    # the system, and its want is read the same way as an empty list.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Optional' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value @($b.value) -Type MultiString
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/system-settings-optional-subsystems

notes:
  pl: |
    Punkt zamyka blok i odstaje od reszty czasem, którego dotyczy. Cztery
    poprzednie mówią o chwili przed startem systemu; ten mówi o tym, co
    system uruchamia obok siebie zaraz po starcie.

    Wspólny jest natomiast wzorzec, i on uzasadnia umieszczenie punktu
    tutaj: chodzi o to, co zostaje wpuszczone do maszyny, zanim ktokolwiek
    zdąży na to spojrzeć.

    Warto odnotować, że jest to jeden z nielicznych punktów, w których
    oczekiwanym stanem jest pustka, a nie wartość. Audyt musi wtedy
    rozróżnić trzy rzeczy: wpis nieistniejący, wpis pusty i wpis z treścią.
    Dwie pierwsze znaczą to samo i tak są zgłaszane; trzecia jest jedynym
    przypadkiem, który wymaga uwagi. Sposób zapisu wyniku powinien to
    odzwierciedlać, bo lista niezgodności mówiąca „brak wartości" przy
    regule wymagającej pustki jest myląca.
  en: |
    The item shuts the block and stands apart from the rest in the moment it concerns. The four
    before it speak of the moment before the system starts; this one speaks of what the system
    starts beside itself right after.

    What is shared, however, is the pattern, and that warrants the item's place here: the matter
    is what is let into the machine before anybody has time to look at it.

    Worth noting that it is one of the few items where the state wanted is an emptiness rather
    than a value. The audit must then tell three things apart: an entry that is not there, an
    empty entry and an entry with contents. The first two mean the same and are reported so; the
    third is the one case calling for attention. The way the outcome is recorded should reflect
    that, a list of non-compliances saying "no value" at a rule calling for emptiness being
    misleading.
