id: win2016-installer-script-security-prompt-kept

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Ostrzeżenie przed instalatorem wywołanym ze skryptu zachowane
    en: The warning before an installer called from a script kept
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zachowuje ostrzeżenie pojawiające się wtedy, gdy mechanizm
    instalacyjny zostaje wywołany ze skryptu uruchomionego w przeglądarce
    albo w innym środowisku ograniczonym.

    Mechanizm instalacyjny daje się wywołać programowo, a nie tylko przez
    otwarcie pakietu. Jest to właściwość przydatna i używana przez narzędzia
    wdrożeniowe. Kłopot polega na tym, że wywołać go tak potrafi również
    skrypt uruchomiony w środowisku, które z założenia nie powinno móc
    instalować niczego.

    Ostrzeżenie jest tu jedyną przeszkodą. Zdjęte, zamienia skrypt
    wykonany w przeglądarce albo w dokumencie w narzędzie instalujące
    oprogramowanie na maszynie — cicho i bez pytania.

    Łańcuch jest przy tym krótszy, niż wygląda. Skrypt nie musi niczego
    łamać. Wywołuje mechanizm obecny w systemie, podaje ścieżkę do pakietu
    i mechanizm wykonuje resztę z własnymi uprawnieniami.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    dowolnego pakietu wykonaną przez skrypt w środowisku ograniczonym, bez
    żadnego ostrzeżenia po drodze.
  en: |
    The setting keeps the warning that appears where the installing mechanism is
    called from a script running in a browser or in other limited surroundings.

    The installing mechanism can be called from a program and not only by the
    opening of a package. That is a useful property and deployment tools use it. The
    trouble is that a script running in surroundings that by design ought not to be
    able to install anything can call it the same way.

    The warning is the only obstacle here. Taken away, it turns a script run in a
    browser or in a document into a tool installing software on the machine -
    quietly and without asking.

    The chain is shorter than it looks, besides. The script need break nothing. It
    calls a mechanism present in the system, gives the path to a package, and the
    mechanism does the rest with rights of its own.

    What an attacker gains while the item goes unmet: the installing of any package
    at all carried out by a script in limited surroundings, with no warning
    anywhere along the way.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", bo wartością wymaganą jest stan domyślny
    systemu.

    Ostrzeżenie jest zachowane wszędzie tam, gdzie nikt go nie zdjął, więc
    wdrożenie punktu na maszynie nietkniętej nie zmienia niczego poza
    zapisaniem decyzji.

    Na maszynie, na której ktoś ostrzeżenie zdjął, warto ustalić dlaczego,
    zanim zmiana zostanie wykonana. Powodem bywa stare narzędzie
    wdrożeniowe wywołujące mechanizm instalacyjny ze skryptu w sposób,
    który dziś uchodzi za niewłaściwy. Takie narzędzie po przywróceniu
    ostrzeżenia zatrzyma się na nim i nie dokończy pracy.

    Jest to sytuacja rzadka, bo narzędzia wdrożeniowe wywołują mechanizm
    instalacyjny inaczej — jako proces, nie jako obiekt skryptowy. Właśnie
    dlatego klasa pozostaje najniższa.

    Czego to nie psuje: instalacji z pakietu, narzędzi wdrożeniowych
    uruchamiających instalator jako proces, odinstalowywania, usług,
    logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", the required value being the system's default
    state.

    The warning is kept everywhere nobody has taken it away, so rolling the item out
    on an untouched machine changes nothing beyond the writing down of a decision.

    On a machine where somebody has taken the warning away it is worth establishing
    why before the change is carried out. The reason is at times an old deployment
    tool calling the installing mechanism from a script in a way reckoned improper
    today. Such a tool, once the warning is back, will stop at it and not finish its
    work.

    That is a rare case, deployment tools calling the installing mechanism
    otherwise - as a process rather than as a scripting object. Just for that reason
    the class stays the lowest.

    What this does not break: installing from a package, deployment tools starting
    an installer as a process, uninstalling, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - updates-and-servicing
  what_breaks:
    pl:
      - Stare narzędzie wdrożeniowe wywołujące mechanizm instalacyjny jako obiekt skryptowy zatrzyma się na przywróconym ostrzeżeniu i nie dokończy pracy
      - Na maszynie nietkniętej nie zmienia się nic, bo wartość wymagana jest stanem domyślnym systemu
      - Instalacje uruchamiane z pakietu oraz przez narzędzia startujące instalator jako proces pozostają bez zmian
      - Odinstalowywanie, naprawa pakietów, usługi i logowanie pozostają bez zmian
    en:
      - An old deployment tool calling the installing mechanism as a scripting object will stop at the restored warning and not finish its work
      - On an untouched machine nothing changes, the required value being the system's default state
      - Installations started from a package and by tools starting an installer as a process stay unchanged
      - Uninstalling, the repairing of packages, services and signing in stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrożenia na tej maszynie opierają się na starszym narzędziu wywołującym mechanizm instalacyjny jako obiekt skryptowy
    en:
      - Rollouts on this machine rest on an older tool calling the installing mechanism as a scripting object
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name describes doing away with the warning, so the required
      # value is zero - the warning kept.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'SafeForScripting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'SafeForScripting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SafeForScripting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-portal

notes:
  pl: |
    Punkt jest przykładem reguły, której wykonanie na maszynie zdrowej nie
    zmienia nic, a która mimo to ma wartość. Nie chodzi o zmianę stanu,
    tylko o to, że stan przestaje zależeć od tego, czy ktoś kiedyś czegoś
    nie przestawił.

    Nazwa wpisu mówi o uznaniu wywołania ze skryptu za bezpieczne, więc
    wartość wymagana jest zerem, a tytuł reguły celowo opisuje skutek —
    ostrzeżenie zachowane — zamiast powtarzać nazwę ustawienia.

    Reguła stoi w macierzy tam, gdzie zysk jest realny, a koszt żaden,
    i nadaje się do wykonania hurtem. Warto przy tym pokazywać ją razem
    z dwiema pozostałymi regułami o mechanizmie instalacyjnym, bo dopiero
    razem opisują, skąd ten mechanizm przyjmuje polecenia.
  en: |
    The item is an example of a rule whose execution on a healthy machine changes
    nothing and has value all the same. The point is not a change of state but that
    the state ceases to depend on whether somebody once moved something.

    The entry's name speaks of reckoning a call from a script safe, so the required
    value is zero, and the rule's title describes the consequence on purpose - the
    warning kept - instead of repeating the setting's name.

    The rule stands in the matrix where the gain is real and the cost none, and is
    fit for bulk execution. It is worth showing along with the other two rules about
    the installing mechanism, since only together do they describe where that
    mechanism takes its orders from.
