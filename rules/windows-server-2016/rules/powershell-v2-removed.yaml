id: win2016-powershell-v2-removed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Features
  title:
    pl: Silnik powłoki w wersji drugiej usunięty
    en: The shell engine in its second version removed
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z systemu starszy silnik powłoki, pozostawiony
    w nim dla zgodności ze skryptami napisanymi lata temu.

    Punkt stoi w tym bloku nie przez przypadek. Dwie poprzednie reguły
    włączają zapis tego, co powłoka robi. Silnik starszy tego zapisu nie
    zna — powstał, zanim mechanizmy nadzoru powstały, i nie da się ich do
    niego dołożyć. Nie rejestruje wykonywanego kodu, nie podlega
    ograniczeniom uruchamiania skryptów i nie zna zapisu przebiegu sesji.

    Skutek jest taki, że obecność starszego silnika unieważnia obie
    poprzednie reguły. Napastnik, który chce pracować niewidocznie, nie
    musi niczego wyłączać ani obchodzić. Dopisuje do polecenia jeden
    parametr wskazujący wersję silnika i pracuje w środowisku, w którym
    nadzoru nigdy nie było.

    Jest to wzorzec znany, opisany i powszechnie stosowany, a jego
    wykrycie jest trudne właśnie dlatego, że polega na użyciu mechanizmu
    wbudowanego zgodnie z jego przeznaczeniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: środowisko
    wykonawcze bez rejestrowania i bez ograniczeń, osiągalne jednym
    parametrem, na maszynie skądinąd nadzorowanej.
  en: |
    The setting removes from the system the older shell engine, left in it for
    compatibility with scripts written years ago.

    The item stands in this block for a reason. The two previous rules switch on the
    recording of what the shell does. The older engine knows nothing of that
    recording - it came about before the mechanisms of oversight did, and they
    cannot be added to it. It records no code it runs, is subject to no limits on
    the running of scripts, and knows no recording of a session's course.

    The upshot is that the presence of the older engine undoes both previous rules.
    An attacker who wants to work unseen need switch nothing off and get round
    nothing. They add to their command one parameter naming the engine's version and
    work in surroundings where oversight never was.

    This is a known, described and widely used pattern, and detecting it is hard for
    the very reason that it rests on using a built-in mechanism as intended.

    What an attacker gains while the item goes unmet: a runtime with no recording
    and no limits, reachable by one parameter, on a machine otherwise watched.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy cokolwiek na tej
    maszynie starszego silnika jeszcze używa.

    Używających jest niewielu, ale bywają i są charakterystyczni. Starsze
    narzędzia administracyjne z czasów, gdy nowszego silnika jeszcze nie
    było. Moduły zarządzania sprzętem dostarczane przez producentów macierzy
    i serwerów. Skrypty wywołujące powłokę z jawnym wskazaniem wersji, bo
    tak napisano je kiedyś i nigdy nie poprawiono.

    Objaw jest przy tym jednoznaczny: wywołanie ze wskazaniem wersji
    kończy się błędem mówiącym, że wersja nie jest dostępna. Prowadzi to
    wprost do przyczyny, co czyni tę regułę łatwiejszą w rozpoznaniu niż
    większość.

    Restart jest tu warunkiem i dotyczy obu kierunków. Usunięcie wymaga
    restartu, przywrócenie również — więc pomyłka kosztuje drugie okno
    serwisowe.

    Rzecz warta odnotowania: audyt tego punktu wymaga uprawnień
    administratora i bez nich zwraca błąd sprawdzenia, a nie brak składnika.
    Jest to rozróżnienie celowe — nieudany odczyt nigdy nie ma prawa wyglądać
    jak potwierdzenie nieobecności.

    Czego to nie psuje: skryptów niewskazujących wersji jawnie, usług,
    logowania, zarządzania zdalnego.
  en: |
    The class is "needs review", and what has to be checked is whether anything on
    this machine still uses the older engine.

    There are few users, but they exist and are of a distinct kind. Older
    administrative tools from days when the newer engine was not yet there. Modules
    for managing hardware supplied by the makers of arrays and servers. Scripts
    calling the shell with the version named outright, because they were written so
    once and never mended.

    The symptom is unambiguous besides: a call naming the version ends in an error
    saying the version is not on hand. That leads straight to the cause, which makes
    this rule easier to trace than most.

    The restart is a condition here and holds both ways. The removal calls for a
    restart and so does the restoring - so a mistake costs a second service window.

    Worth noting: the audit of this item calls for administrator rights, and without
    them returns a check error rather than an absent component. That distinction is
    deliberate - a failed read must never look like a confirmation of absence.

    What this does not break: scripts not naming a version outright, services,
    signing in, or remote management.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
    - logging-and-audit
  what_breaks:
    pl:
      - Skrypty wywołujące powłokę z jawnym wskazaniem starszej wersji kończą się błędem mówiącym, że wersja nie jest dostępna
      - Moduły zarządzania sprzętem dostarczane przez producentów macierzy i serwerów bywają napisane pod starszy silnik
      - Usunięcie wymaga restartu i przywrócenie również, więc pomyłka kosztuje drugie okno serwisowe
      - Skrypty niewskazujące wersji jawnie, usługi i zarządzanie zdalne pozostają bez zmian
    en:
      - Scripts calling the shell with the older version named outright end in an error saying the version is not on hand
      - Modules for managing hardware supplied by the makers of arrays and servers are at times written for the older engine
      - The removal calls for a restart and so does the restoring, so a mistake costs a second service window
      - Scripts not naming a version outright, services and remote management stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje moduł zarządzania sprzętem napisany pod starszy silnik i producent nie wydał nowszego
      - Okna serwisowego z restartem nie da się uzyskać, a punkt bez restartu nie zadziała
      - Skrypty utrzymaniowe tej maszyny wskazują wersję silnika jawnie i nie da się ich poprawić przed wdrożeniem
    en:
      - A module for managing hardware written for the older engine works on the machine and its maker has released no newer one
      - A service window with a restart cannot be had, and without a restart the item will not take effect
      - This machine's maintenance scripts name the engine's version outright and cannot be mended before the rollout
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $feature = Get-WindowsOptionalFeature -Online `
        -FeatureName 'MicrosoftWindowsPowerShellV2Root' -ErrorAction Stop
      if ($null -eq $feature) { 'CHECK_ERROR' } else { [string]$feature.State }
    } catch {
      # Reading optional features needs elevation. Without it the call fails, and
      # a failed read must never be reported as the feature being absent.
      'CHECK_ERROR'
    }
  expected: 'Disabled'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-WindowsOptionalFeature -Online |
      Where-Object { $_.FeatureName -like 'MicrosoftWindowsPowerShellV2*' } |
      Select-Object -Property FeatureName, State |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The old engine knows none of the oversight mechanisms added later: it does
    # not record the code it runs and is not subject to script restrictions. With
    # both engines present, the choice of which to use is one parameter.
    # Calls for a restart; undoing it calls for a restart as well.
    Disable-WindowsOptionalFeature -Online `
      -FeatureName 'MicrosoftWindowsPowerShellV2Root' -NoRestart

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($feature in @($b)) {
      if ($feature.State -eq 'Enabled') {
        Enable-WindowsOptionalFeature -Online -FeatureName $feature.FeatureName -NoRestart | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/scripting/windows-powershell/install/windows-powershell-system-requirements

notes:
  pl: |
    Punkt jest w bloku najważniejszy, choć wygląda na najbardziej
    techniczny. Bez niego dwie poprzednie reguły dają zgodność, którą
    obchodzi się jednym parametrem — i jest to najczystszy przykład
    zgodności pozornej w całym zestawie.

    Aplikacja powinna pokazywać tę trójkę razem i mówić wprost, że zapis
    włączony przy obecnym starszym silniku znaczy mniej, niż wygląda.
    Kolejność wdrażania jest przy tym obojętna, ale komplet — nie.

    Audyt zwraca tu stan błędu sprawdzenia, gdy zabrakło uprawnień.
    Rozróżnienie to jest warte podkreślenia, bo składnik nieobecny
    i składnik niesprawdzony wyglądają w raporcie podobnie, a znaczą coś
    zupełnie innego. Jest to ta sama zasada, która w całym zestawie każe
    trzymać niemożność sprawdzenia z dala od niezgodności.
  en: |
    The item is the most important in the block, though it looks the most technical.
    Without it the two previous rules give a compliance got round by one parameter -
    and that is the purest example of compliance in appearance in the whole set.

    The application should show the three together and say outright that recording
    switched on with the older engine present means less than it looks to. The order
    of rolling them out is besides indifferent, but the full set is not.

    The audit here returns a state of check error where rights were wanting. That
    distinction is worth underlining, an absent component and an unchecked one
    looking alike in a report while meaning something altogether different. It is
    the same principle that across the whole set keeps an inability to check apart
    from a non-compliance.
