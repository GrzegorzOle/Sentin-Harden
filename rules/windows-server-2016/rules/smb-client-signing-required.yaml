id: win2016-smb-client-signing-required

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podpisywanie pakietów wymagane po stronie klienta udostępniania plików
    en: Packet signing required on the file-sharing client side
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby maszyna łącząca się do cudzego udziału żądała
    podpisywania pakietów i odmawiała połączenia, gdy druga strona tego nie
    zapewnia.

    Podpisywanie nie ukrywa treści — ono pilnuje, żeby treść nie została
    zmieniona w drodze i żeby rozmówca pozostał tym samym, z którym sesja się
    zaczęła. To jest dokładnie ta właściwość, której brak wykorzystuje atak
    polegający na wstawieniu się w środek połączenia.

    Kategoria wysoka, bo bez tego wymagania sesja daje się przejąć w sposób,
    którego żadna ze stron nie zauważy. Napastnik stojący w ścieżce sieciowej
    przepuszcza uwierzytelnienie, a potem prowadzi rozmowę dalej w imieniu
    maszyny — z jej uprawnieniami i pod jej nazwą.

    Słowo „wymagane" jest tu istotne i warto je odróżnić od „dozwolone".
    Ustawienie łagodniejsze mówi: podpisuj, jeśli druga strona umie. To
    wystarcza wobec sprzętu, ale nie wobec napastnika, bo ten po prostu
    powie, że nie umie.

    Na serwerze rzecz dotyczy połączeń wychodzących: kopii na inny serwer,
    raportów zapisywanych na udziale, odczytu z urządzenia przechowującego
    dane. Idą one z poświadczeniem konta usługi albo administratora, więc
    stawka jest wyższa niż przy stanowisku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wstawienia się w połączenie tej maszyny do cudzego udziału i prowadzenia
    go dalej jej uprawnieniami.
  en: |
    The item requires the machine connecting to somebody else's share to demand
    packet signing, and to refuse the connection where the other side does not
    provide it.

    Signing does not hide content - it makes sure the content is not altered in
    transit and that the other party stays the same one the session began with.
    That is exactly the property whose absence the attack of stepping into the
    middle of a connection relies on.

    The category is high, because without this requirement a session can be
    taken over in a way neither side notices. An attacker sitting in the network
    path lets the authentication through and then carries the conversation on in
    the machine's name - with its rights and under its identity.

    The word "required" matters here and is worth telling apart from
    "permitted". The milder setting says: sign if the other side can. That is
    enough against equipment but not against an attacker, who will simply say
    they cannot.

    On a server the matter concerns outgoing connections: copies to another
    server, reports written to a share, reads from a storage device. Those go
    carrying the credential of a service account or an administrator, so the
    stake is higher than on a workstation.

    What an attacker gains while the item goes unmet: the ability to step into
    this machine's connection to somebody else's share and carry it on with the
    machine's rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy drugiej strony,
    nie tej maszyny.

    Po zmianie maszyna odmówi połączenia z udziałem, który podpisywania nie
    obsługuje. W praktyce dotyczy to urządzeń przechowujących dane
    z oprogramowaniem sprzed lat, prostych serwerów plików w urządzeniach
    wbudowanych oraz implementacji protokołu pisanych poza systemem.
    Połączenia do współczesnych serwerów nie są tym dotknięte.

    Na serwerze 2016 warto przejrzeć osobno to, co maszyna montuje przy
    starcie i co robi nocą. Połączenia widoczne w ciągu dnia zespół zna;
    zadania nocne zapisujące kopie na starym urządzeniu bywają tymi, które
    ujawniają się dopiero po tygodniu.

    Rzecz do zapamiętania: podpisywanie ma pewien koszt wydajnościowy przy
    dużym ruchu plikowym. Na maszynie tego rocznika, gdzie sprzęt bywa równie
    stary co system, warto o tym wiedzieć — choć w praktyce koszt ten zwykle
    ustępuje wartości ochrony.

    Zmiana wymaga ponownego uruchomienia usługi stacji roboczej i dopiero
    wtedy działa.
  en: |
    The class is "needs review", and what needs reviewing is the other side,
    not this machine.

    After the change the machine will refuse to connect to a share that does not
    support signing. In practice that concerns storage devices running software
    from years ago, simple file servers inside embedded systems, and
    implementations of the protocol written outside the system. Connections to
    present-day servers are untouched.

    On Server 2016 it is worth looking separately at what the machine mounts at
    startup and what it does at night. The team knows the connections visible in
    the daytime; night jobs writing copies to an old device tend to be the ones
    that show up only after a week.

    Something to remember: signing carries some cost in performance under heavy
    file traffic. On a machine of this vintage, where the hardware is often as
    old as the system, that is worth knowing - though in practice the cost
    usually gives way to the value of the protection.

    The change requires the workstation service to be restarted and works only
    then.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - Połączenia do udziałów nieobsługujących podpisywania są odrzucane, a nie nawiązywane bez podpisu
      - Urządzenia przechowujące dane z oprogramowaniem sprzed lat przestają przyjmować zapis z tej maszyny
      - Zadania nocne kopiujące pliki na stare urządzenie ujawnią się dopiero po pełnym cyklu pracy
      - Podpisywanie ma pewien koszt wydajnościowy przy dużym ruchu plikowym
    en:
      - Connections to shares that do not support signing are refused rather than made unsigned
      - Storage devices running software from years ago stop accepting writes from this machine
      - Night jobs copying files to an old device will show up only after a full working cycle
      - Signing carries some cost in performance under heavy file traffic
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna zapisuje dane na urządzeniu nieobsługującym podpisywania pakietów i nie ma dla niego zamiennika
    en:
      - The machine writes data to a device that does not support packet signing and there is no replacement for it
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $name = 'RequireSecuritySignature'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    $name = 'RequireSecuritySignature'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Required, not permitted: the milder setting signs when the other side can,
    # and an attacker simply says they cannot. This is the outgoing side - where
    # the machine connects, carrying its own credential.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSecuritySignature' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-client-digitally-sign-communications-always

notes:
  pl: |
    Wpis dotyczy usługi stacji roboczej, czyli strony łączącej się na zewnątrz.
    Jego odpowiednik po stronie serwera leży pod inną gałęzią usługi i jest
    osobną regułą — nazwa wartości jest w obu miejscach ta sama, co bywa
    źródłem pomyłki przy sprawdzaniu ręcznym.

    Różnica między „wymagane" a „dozwolone" jest tu całą treścią punktu.
    Ustawienie łagodniejsze wygląda w raporcie podobnie, a nie chroni przed
    napastnikiem, który deklaruje brak obsługi.

    Brak wpisu audyt zgłasza jako ustawienie brakujące, a nie jako stan dobry,
    bo domyślne zachowanie tego wydania nie jest wymaganiem.
  en: |
    The entry concerns the workstation service, that is, the side connecting
    outwards. Its counterpart on the server side lies under a different service
    branch and is a separate rule - the value's name is the same in both places,
    which is a common source of confusion when checking by hand.

    The difference between "required" and "permitted" is the whole substance of
    the item here. The milder setting looks similar in a report and does not
    protect against an attacker who declares no support.

    A missing entry is reported by the audit as a missing setting rather than a
    good state, because this release's default behaviour is not a requirement.
