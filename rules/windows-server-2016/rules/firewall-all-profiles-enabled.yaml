id: win2016-firewall-all-profiles-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Zapora włączona we wszystkich profilach sieciowych
    en: The firewall switched on in all network profiles
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza zaporę systemu we wszystkich trzech profilach
    sieciowych, a nie tylko w tym, który jest w użyciu dzisiaj.

    Rozdział na profile jest tu rzeczą najważniejszą do zrozumienia. System
    rozpoznaje trzy rodzaje sieci — domenową, prywatną i publiczną — i trzyma
    dla każdej osobny komplet ustawień zapory. Profil wybierany jest
    samoczynnie, na podstawie tego, co system rozpozna po drugiej stronie
    karty sieciowej.

    Stąd bierze się słabość, którą ta reguła zamyka. Zapora wyłączona
    w jednym profilu wygląda na nieszkodliwą dopóty, dopóki maszyna stoi
    w sieci rozpoznanej jako inny. Rozpoznanie zmienia się jednak samo: przy
    utracie łączności z kontrolerem domeny, przy dodaniu karty, przy zmianie
    w sieci, przy uruchomieniu maszyny wcześniej niż usługi domenowej.
    W chwili, gdy się zmieni, zaczyna obowiązywać komplet ustawień, którego
    nikt nigdy nie przeglądał.

    Maszyna bez zapory jest osiągalna na każdym porcie, na którym cokolwiek
    nasłuchuje — łącznie z usługami, o których administrator nie wie, że
    w ogóle są uruchomione. Zapora jest jedyną warstwą, która nie wymaga
    wiedzy o tym, co na maszynie stoi: blokuje to, czego nie dopuszczono
    wprost.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: bezpośredni
    dostęp do wszystkiego, co na maszynie nasłuchuje, w każdej sieci, dla
    której profil został pozostawiony bez zapory.
  en: |
    The setting switches the system's firewall on in all three network profiles, and
    not in the one in use today alone.

    The division into profiles is the chief thing to grasp here. The system
    recognises three kinds of network - domain, private and public - and keeps a
    separate set of firewall settings for each. The profile is picked of its own
    accord, on the strength of what the system recognises on the far side of a
    network card.

    Hence the weakness this rule shuts. A firewall switched off in one profile looks
    harmless so long as the machine stands in a network recognised as another. The
    recognition, though, changes by itself: at a loss of contact with a domain
    controller, at the adding of a card, at a change in the network, at the machine
    starting sooner than the domain service. The moment it changes, a set of
    settings nobody ever reviewed comes into force.

    A machine without a firewall is reachable on every port where anything is
    listening - services the administrator does not know are running among them. The
    firewall is the one layer calling for no knowledge of what stands on the
    machine: it blocks whatever has not been expressly admitted.

    What an attacker gains while the item goes unmet: direct access to everything
    listening on the machine, in every network whose profile has been left without a
    firewall.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i powód jest prosty — zapora
    włączona zaczyna blokować.

    Na maszynie, na której zapora działa od zawsze i wyłączony jest tylko
    jeden profil, zmiana przechodzi gładko: reguły są te same we wszystkich
    profilach i nowy po prostu zaczyna ich używać. Ryzyko leży tam, gdzie
    zaporę wyłączono celowo, żeby coś zadziałało, a regułą nigdy tego nie
    zastąpiono.

    Objaw jest wtedy natychmiastowy i ostry: usługi przestają być osiągalne
    z sieci. Dotyczy to także dostępu zarządzającego, więc zmiana
    wprowadzana zdalnie potrafi odciąć drogę naprawy w trakcie własnego
    wykonania. Jest to najpoważniejsza rzecz do rozważenia przed
    uruchomieniem.

    Sprawdzenie musi zatem objąć dwie rzeczy: czy dla każdej usługi
    dostępnej z sieci istnieje reguła ją dopuszczająca, oraz czy reguły te są
    obecne w profilu, który był dotąd wyłączony. Druga część bywa pomijana,
    a to właśnie tam siedzi niespodzianka — reguły potrafią być przypisane
    tylko do jednego profilu.

    Osobno warto wymienić maszyny wirtualne, klastry i połączenia
    wewnętrzne. Ruch między węzłami klastra oraz ruch przez przełącznik
    maszyn wirtualnych bywa prowadzony przez profil, o którym nikt nie
    myślał.

    Czego to nie psuje: połączeń wychodzących, ruchu lokalnego, usług
    dopuszczonych regułami, pulpitu zdalnego, jeśli reguła dla niego istnieje
    w tym profilu.

    Bez restartu, natychmiast odwracalne — o ile ma się jeszcze dostęp do
    maszyny.
  en: |
    The class is "needs a planned rollout", and the reason is plain - a firewall
    switched on begins blocking.

    On a machine whose firewall has always run and where one profile alone is off,
    the change passes smoothly: the rules are the same in every profile and the new
    one simply begins using them. The risk lies where the firewall was switched off
    deliberately so that something might work, and was never replaced by a rule.

    The symptom is then immediate and sharp: services cease to be reachable from the
    network. That takes in management access too, so a change made remotely can cut
    off the road of repair in the course of its own execution. It is the gravest
    thing to weigh before running it.

    The check must therefore take in two things: whether a rule admitting it exists
    for every service reachable from the network, and whether those rules are
    present in the profile that was off until now. The second part is at times
    passed over, and it is just there that the surprise sits - rules can be bound to
    one profile alone.

    Virtual machines, clusters and internal connections are worth naming apart.
    Traffic between cluster nodes and traffic through a virtual machine switch is at
    times carried by a profile nobody thought about.

    What this does not break: outbound connections, local traffic, services admitted
    by rules, or the remote desktop if a rule for it exists in that profile.

    No restart, undone immediately - provided one still has access to the machine.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Usługi dostępne z sieci bez reguły dopuszczającej przestają być osiągalne natychmiast, łącznie z dostępem zarządzającym
      - Reguły przypisane tylko do jednego profilu nie zadziałają w profilu dotąd wyłączonym, więc usługa działająca w domenie może przestać działać po zmianie rozpoznania sieci
      - Ruch między węzłami klastra i ruch przez przełącznik maszyn wirtualnych bywa prowadzony przez profil, o którym nikt nie myślał
      - Połączenia wychodzące, ruch lokalny i usługi dopuszczone regułami pozostają bez zmian
    en:
      - Services reachable from the network with no rule admitting them cease to be reachable at once, management access included
      - Rules bound to one profile alone will not work in the profile that was off, so a service working in the domain can stop working once the network recognition changes
      - Traffic between cluster nodes and traffic through a virtual machine switch is at times carried by a profile nobody thought about
      - Outbound connections, local traffic and services admitted by rules stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zaporę wyłączono celowo, żeby jakaś usługa działała, i nie zastąpiono tego regułą dopuszczającą
      - Nie sprawdzono, czy reguły dopuszczające istnieją w profilu, który był dotąd wyłączony
      - Zmiana miałaby zostać wprowadzona zdalnie, a brak reguły dla dostępu zarządzającego odciąłby drogę naprawy
    en:
      - The firewall was switched off deliberately so that some service might work, and no admitting rule was put in its place
      - It has not been checked whether the admitting rules exist in the profile that was off until now
      - The change would be made remotely and the want of a rule for management access would cut off the road of repair
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # All three profiles are read at once and the ones left off are named, so the
      # report says where the gap is rather than merely that there is one.
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $off = @($profiles | Where-Object { $_.Enabled -ne 'True' })
        if ($off.Count -eq 0) { 'ALL_ENABLED' } else { 'DISABLED_IN_' + ($off.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, Enabled |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -Enabled $p.Enabled
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt otwiera blok zapory i jest jednym z dwóch w całym zestawie
    serwerowym zdolnych odciąć operatora od maszyny w trakcie własnego
    wykonania. Ostrzeżenie o tym powinno być widoczne przy przycisku
    uruchomienia, a nie dopiero w opisie uciążliwości.

    Audyt wymienia z nazwy profile, w których zapora jest wyłączona.
    Odpowiedź „nie we wszystkich" jest w tym punkcie bezużyteczna — cała
    praca polega na tym, żeby wiedzieć który profil, bo od tego zależy,
    gdzie szukać brakujących reguł.

    Kategoria krytyczna nie odnosi się do trudności wykorzystania, tylko do
    zakresu. Nie chodzi o jedną drogę wejścia — chodzi o to, że maszyna
    przestaje mieć jakąkolwiek warstwę odcinającą dostęp do usług, o których
    nikt nie pamięta.

    Symulacja przed wykonaniem waży przy tym punkcie więcej niż gdzie
    indziej i powinna pokazywać nie tylko, co zostanie zmienione, ale i to,
    jakie reguły są obecne w profilach, które zostaną włączone.
  en: |
    The item opens the firewall block and is one of two in the whole server set able
    to cut the operator off from the machine in the course of its own execution. A
    warning about that should be visible at the run button, and not in the
    description of disruption alone.

    The audit names the profiles in which the firewall is off. The answer "not in
    all of them" is useless at this item - the whole work consists in knowing which
    profile, since on that hangs where the missing rules are to be looked for.

    The critical category refers not to the difficulty of exploitation but to the
    scope. This is not about one road in - it is about the machine ceasing to have
    any layer at all cutting off access to services nobody remembers.

    The simulation before execution weighs more at this item than elsewhere, and
    should show not only what will be changed but what rules are present in the
    profiles that will be switched on.
