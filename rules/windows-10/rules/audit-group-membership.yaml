id: win10-audit-group-membership

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja przynależności do grup
    en: The audit of belonging to groups
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie dopisuje do każdego zdarzenia zalogowania wykaz grup, z których
    uprawnieniami konto faktycznie weszło do systemu.

    Jest to różnica między wiedzą, kto się zalogował, a wiedzą, co przy tym
    zalogowaniu wolno mu było zrobić. Konto samo w sobie nie mówi o swoich
    uprawnieniach prawie nic — mówią o nich grupy, a te zmieniają się bez
    zmiany konta i bez wiedzy osoby badającej zdarzenie.

    Wartość widać przy badaniu po fakcie. Grupy sprawdzone dzisiaj mówią
    o stanie dzisiejszym; wpis mówi o stanie z chwili wejścia. Jeśli konto
    zostało między tymi chwilami dodane do grupy albo z niej usunięte,
    różnica jest całą odpowiedzią.

    Odnotowuję rzecz osobną: wykaz obejmuje grupy przyznane w tokenie, a nie
    wszystkie, do których konto należy. Grupa wyłączona albo odfiltrowana
    przy wejściu nie zostanie wypisana — i jest to zapis prawdziwy, bo mówi
    o uprawnieniach czynnych, a nie o przynależności na papierze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję,
    o której uprawnieniach po fakcie da się mówić wyłącznie z dzisiejszego
    stanu kont.
  en: |
    The setting writes, against every event of logging on, a roll of the groups by whose rights the account in
    fact came into the system.

    It is the difference between knowing who logged on and knowing what, at that logging on, they were free to
    do. An account of itself says next to nothing of its rights - the groups say it, and they change without the
    account's changing and without the knowledge of a person looking into a happening.

    The value shows in a looking into after the fact. Groups checked today speak of today's state; the entry
    speaks of the state at the moment of entry. Where an account has between those moments been added to a group
    or taken out of one, that difference is the whole answer.

    I set down a thing apart: the roll takes in the groups granted in the token, and not all those the account
    belongs to. A group switched off or filtered out at the entry will not be set out - and that is a true
    record, it speaking of rights in force and not of a belonging upon paper.

    What an attacker gains while the item goes unmet: a session whose rights can after the fact be spoken of
    only from today's state of the accounts.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie niczego nie zabrania i nie zmienia sposobu logowania.
    Dopisuje wyłącznie pole do zdarzenia, które i tak powstaje.

    Skutek dla dziennika jest łagodniejszy, niż się wydaje. Wpisy nie
    przybywają — przybywa treści do już istniejących. Pojedynczy wpis bywa
    za to dłuższy, zwłaszcza na maszynie w domenie, gdzie konto należy do
    wielu grup.

    Odnotowuję zależność, którą trzeba przeczytać razem z pierwszą regułą
    bloku. Przy wyłączonej inspekcji logowania ta podkategoria nie ma czego
    uzupełniać i nie daje nic. Włączenie jej samej jest czynnością pustą.

    Zapisywany jest wyłącznie wynik udany, bo przy wejściu, które nie doszło
    do skutku, nie ma grup do wypisania.

    Czego to nie psuje: logowania, uprawnień kont, członkostwa w grupach,
    udziałów plikowych, drukowania, aplikacji.
  en: |
    The class is "no disruption".

    The setting forbids nothing and changes no manner of logging on. It writes only a field against an event
    that comes about anyway.

    The consequence to the log is milder than it seems. Entries do not grow in number - what grows is the
    contents of those already there. A single entry is in return at times longer, above all upon a machine in a
    domain, where an account belongs to many groups.

    I set down a tie to be read together with the block's first rule. With the audit of logging on switched off
    this subcategory has nothing to fill out and gives nothing. Switching it on alone is an empty act.

    Only the successful outcome is written, there being at an entry that did not come about no groups to set
    out.

    What this does not break: logging on, accounts' rights, belonging to groups, file shares, printing, or
    applications.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Pojedynczy wpis bywa dłuższy, zwłaszcza na maszynie w domenie, gdzie konto należy do wielu grup
      - Przy wyłączonej inspekcji logowania podkategoria nie ma czego uzupełniać i włączenie jej samej jest czynnością pustą
      - Wykaz obejmuje grupy przyznane w tokenie, więc grupa wyłączona albo odfiltrowana nie zostanie wypisana
      - Zapisywany jest wyłącznie wynik udany, bo przy wejściu nieudanym nie ma grup do wypisania
      - Logowanie, uprawnienia kont, członkostwo w grupach, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A single entry is at times longer, above all upon a machine in a domain where an account belongs to many groups
      - With the audit of logging on switched off the subcategory has nothing to fill out and switching it on alone is an empty act
      - The roll takes in the groups granted in the token, so a group switched off or filtered out will not be set out
      - Only the successful outcome is written, an entry that failed having no groups to set out
      - Logging on, accounts rights, belonging to groups, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Inspekcja logowania jest wyłączona i wpisy o grupach nie mają się do czego dopisać
    en:
      - The audit of logging on is switched off and the entries about groups have nothing to be written against
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9249-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9249-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9249-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is written along with a session that came about. There are no groups
    # to list for one that did not.
    auditpol /set /subcategory:"{0CCE9249-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9249-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-group-membership

notes:
  pl: |
    Reguła jest w tym bloku drugą, która sama z siebie nie daje nic —
    pierwsza jest jej warunkiem. Warto, żeby aplikacja umiała taką
    zależność pokazać, bo lista płaska pozwala włączyć uzupełnienie bez
    rzeczy uzupełnianej.

    Argument wart zachowania dotyczy czasu. Uprawnienia sprawdzane dzisiaj
    są uprawnieniami dzisiejszymi, a pytanie dochodzeniowe dotyczy chwili
    sprzed tygodnia. Podkategoria ta zamraża odpowiedź w chwili, w której
    jest prawdziwa — i to jest cała jej treść.

    Odnotowuję różnicę między grupami w tokenie a członkostwem na papierze,
    bo prowadzi ona do sporu przy czytaniu raportu. Wpis krótszy od
    oczekiwanego nie jest zapisem niepełnym; jest zapisem uprawnień, które
    faktycznie działały.
  en: |
    The rule is the second in this block that of itself gives nothing - the first is its condition. It is well
    that the application be able to show such a tie, a flat list letting the filling out be switched on without
    the thing filled out.

    The argument worth keeping touches time. Rights checked today are today's rights, while an inquiry's question
    touches a moment a week past. This subcategory freezes the answer at the moment at which it is true - and
    that is its whole substance.

    I set down the difference between the groups in a token and a belonging upon paper, it leading to argument
    at the reading of a report. An entry shorter than looked for is not an incomplete record; it is a record of
    the rights that were in fact in force.
