id: win10-defender-network-protection

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Network Protection
  title:
    pl: Ochrona sieciowa w trybie blokowania
    en: Network protection in blocking mode
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zatrzymuje połączenia wychodzące do adresów rozpoznanych
    jako złośliwe, niezależnie od tego, który program je nawiązuje.

    Jest to jedyny mechanizm z tej rodziny patrzący na to, dokąd maszyna
    się łączy, a nie na to, co na niej działa. Przesądza to o jego
    zasięgu: obejmuje przeglądarkę, ale też skrypt, narzędzie systemowe
    i program, którego nikt nie instalował.

    Wartość praktyczna jest największa po fakcie. Kod, który już się
    uruchomił, musi w końcu zgłosić się po instrukcje albo wysłać to, co
    zebrał. Zatrzymanie tego połączenia przerywa atak w miejscu, w którym
    wszystkie wcześniejsze zabezpieczenia już zawiodły.

    Odnotowuję, że wartością zgodną jest blokowanie, a nie zapisywanie.
    Ustawienie zapisujące odnotowuje próbę i przepuszcza połączenie, więc
    daje wiedzę, a nie ochronę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: łączność
    z maszyną po uruchomieniu kodu, prowadzoną przez dowolny program.
  en: |
    The setting stops outgoing links to addresses known as malicious, whatever the program making them.

    It is the one mechanism of this family looking at where the machine links to, and not at what runs upon it.
    That settles its reach: it takes in the browser, but likewise a script, a system tool and a program nobody
    installed.

    The practical worth is greatest after the fact. Code that has already started must in the end report for
    orders or send off what it gathered. The stopping of that link breaks the attack at the place where every
    earlier guard has already failed.

    I set down that the compliant value is the blocking and not the writing down. The reporting setting sets the
    attempt down and lets the link through, so it gives knowledge and not guarding.

    What an attacker gains while the item goes unmet: a link to the machine once the code has started, carried on
    by any program at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczą odczuwalną jest połączenie, które
    nie dochodzi.

    Blokowanie opiera się na ocenie adresu, a ocena bywa błędna.
    Najczęstszym przypadkiem jest adres należący do usługi używanej
    w pracy, który trafił na listę przez to, że ktoś inny nadużył tej
    samej usługi. Skutkiem jest program, który przestaje się łączyć,
    bez żadnej zmiany po stronie samego programu.

    Użytkownik widzi wtedy komunikat ochrony w przeglądarce albo błąd
    połączenia w programie, zależnie od tego, co próbowało się łączyć.
    Drugi przypadek jest trudniejszy, bo błąd wygląda na awarię sieci.

    Sprawdzić trzeba, czy w pracy są usługi sieciowe o wątpliwej
    reputacji — hosting plików, skracacze adresów, narzędzia do zdalnej
    pomocy. Są to kategorie trafiane najczęściej.

    Odnotowuję wariant pośredni: ustawienie zapisujące pozwala zobaczyć,
    co zostałoby zablokowane, bez blokowania. Nie spełnia punktu, ale jest
    sensownym krokiem przed nim.

    Czego to nie psuje: pracy sieciowej z adresami o dobrej reputacji,
    zapory, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the thing that is felt is a link that does not go through.

    The blocking rests upon a weighing of the address, and a weighing is at times wrong. The commonest case is an
    address belonging to a service used at work, which came upon the list because somebody else misused that same
    service. The consequence is a program that ceases to link, with no change upon the program's own side.

    The user then sees the protection's message in the browser, or an error of linking within the program,
    according to what tried to link. The second case is the harder, the error looking like a fault of the
    network.

    What has to be reviewed is whether network services of doubtful repute are in use at work - the hosting of
    files, shorteners of addresses, tools for help from afar. Those are the kinds struck the oftenest.

    I set down the middle variant: the reporting setting lets one see what would be blocked, without blocking. It
    does not meet the item, but it is a sensible step before it.

    What this does not break: network work with addresses of good repute, the firewall, logging on, file shares,
    or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - scripting-and-automation
  what_breaks:
    pl:
      - Adres usługi używanej w pracy bywa zablokowany przez to, że ktoś inny nadużył tej samej usługi
      - Program przestaje się łączyć bez żadnej zmiany po własnej stronie, a błąd wygląda na awarię sieci
      - Hosting plików, skracacze adresów i narzędzia do zdalnej pomocy są trafiane najczęściej
      - Ustawienie zapisujące pozwala zobaczyć, co zostałoby zablokowane, ale punktu nie spełnia
      - Praca sieciowa z adresami o dobrej reputacji, zapora, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - The address of a service used at work is at times blocked because somebody else misused that same service
      - A program ceases to link with no change upon its own side, and the error looks like a fault of the network
      - The hosting of files, shorteners of addresses and tools for help from afar are struck the oftenest
      - The reporting setting lets one see what would be blocked, but does not meet the item
      - Network work with addresses of good repute, the firewall, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W pracy używane są usługi hostingu plików i skracacze adresów, a ich blokowanie zatrzymuje obieg dokumentów
      - Nie ma kto obsłużyć zgłoszeń o zablokowanych połączeniach
    en:
      - Services for the hosting of files and shorteners of addresses are used at work, and the blocking of them stops the round of documents
      - There is nobody to handle the reports about blocked links
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        [string][int](Get-MpPreference -ErrorAction Stop).EnableNetworkProtection
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection'
    $name = 'EnableNetworkProtection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One blocks; two only writes the attempt down. The reporting value leaves the
    # link open, so it is not what this item asks for.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableNetworkProtection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/network-protection

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną patrzącą na sieć. Pozostałe
    zamykają drogi wejścia; ta zamyka drogę wyjścia — czyli działa
    wtedy, gdy tamte już nie zadziałały.

    Argument wart zachowania dotyczy tego, dlaczego ten punkt ma
    wartość mimo błędnych ocen. Kod, który się uruchomił, musi się
    połączyć. Nie ma wariantu, w którym tego nie robi, bo bez łączności
    nie dostanie instrukcji ani nie wyniesie niczego. Jest to więc
    wąskie gardło, przez które musi przejść każdy atak prowadzony zdalnie.

    Odnotowuję wariant pośredni, bo aplikacja powinna go proponować.
    Ustawienie zapisujące pokazuje, co zostałoby zablokowane, i pozwala
    zebrać listę wyjątków przed włączeniem blokowania. Punktu nie spełnia
    i raport powinien to mówić wprost, ale jako krok pośredni jest
    lepszy niż odłożenie sprawy.
  en: |
    The rule closes the block and is the only one in it looking at the network. The rest close the roads of
    entry; this closes the road out - which is to say it works once those have already failed.

    The argument worth keeping touches why this item has worth despite wrong weighings. Code that has started
    must link. There is no variant in which it does not, for without a link it will get no orders and carry
    nothing off. It is therefore a narrow gate through which every attack carried on from afar has to pass.

    I set down the middle variant, the application being right to offer it. The reporting setting shows what would
    be blocked and lets a list of exceptions be gathered before the blocking is switched on. It does not meet the
    item and the report ought to say so outright, but as a middle step it is better than a putting off of the
    matter.
