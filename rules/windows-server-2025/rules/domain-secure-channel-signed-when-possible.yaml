id: win2025-domain-secure-channel-signed-when-possible

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera podpisywany, gdy druga strona to potrafi
    en: The secure channel to the controller signed where the other side can
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie nakazuje podpisywać ruch kanału bezpiecznego wszędzie
    tam, gdzie druga strona to potrafi.

    Podpis nie ukrywa treści — potwierdza, że w drodze nikt jej nie
    zmienił. Jest to ochrona przed napastnikiem czynnym, czyli takim,
    który nie poprzestaje na podsłuchu, tylko przerabia to, co przez
    niego przechodzi.

    Na kanale bezpiecznym zmiana treści ma skutki poważniejsze, niż
    sugeruje techniczny opis. Kanałem tym maszyna ustala, kim jest
    wobec domeny, przekazuje żądania uwierzytelnienia i odbiera
    odpowiedzi na nie. Przerobienie odpowiedzi jest sposobem na
    wmówienie maszynie, że uwierzytelnienie się powiodło — albo że
    konto należy do grupy, do której nie należy.

    Na serwerze rzecz waży bardziej niż na stanowisku roboczym, bo
    serwer bywa stroną przyjmującą uwierzytelnienia cudze. Kontroler
    domeny prowadzi ten kanał wobec innych kontrolerów, a odpowiedź
    przerobiona rozchodzi się wtedy poza jedną maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość przerobienia w drodze treści kanału bezpiecznego
    wszędzie tam, gdzie ochrona nie została uzgodniona.
  en: |
    The setting orders the secure channel's traffic to be signed wherever the other side can.

    A signature does not hide the content - it bears out that nobody changed it on the way. It
    is a guard against an active attacker, that is, one who does not stop at listening but works
    over what passes through them.

    On the secure channel a change of content has graver effects than the technical description
    suggests. Over that channel the machine settles who it is towards the domain, passes on
    requests to authenticate and takes back the answers to them. Working an answer over is a way
    of telling the machine that an authentication succeeded - or that an account stands in a
    group it does not stand in.

    On a server the matter weighs more than at a working station, a server being at times the
    side taking others' authentications. A domain controller keeps this channel towards other
    controllers, and an answer worked over then spreads beyond one machine.

    What an attacker gains while the item goes unmet: the means of working over the secure
    channel's content on the way, wherever the guard was never agreed.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Tak jak przy szyfrowaniu, cała treść ustawienia mieści się w
    słowach „gdy druga strona to potrafi". Wobec strony niepotrafiącej
    podpisać maszyna zachowuje się tak, jak przedtem, i połączenia nie
    zrywa. Punkt nie może więc niczego zepsuć samodzielnie.

    W stanie domyślnym ustawienie jest włączone na wszystkich
    współczesnych wersjach systemu, więc na większości serwerów
    naprawa nie zmienia niczego.

    Podpis nie jest tym samym co szyfrowanie i punkty te nie zastępują
    się nawzajem. Podpis chroni przed zmianą, szyfrowanie przed
    odczytem. Włącza się oba, bo bronią przed różnymi rzeczami.

    Punkt nie obejmuje podpisywania ruchu udziałów plików. To osobna
    grupa ustawień, o innym wpływie eksploatacyjnym i innej ocenie —
    warto trzymać je rozdzielone, bo nazwy brzmią podobnie.

    Zmiana wchodzi w życie przy następnym nawiązywaniu kanału i nie
    wymaga restartu.
  en: |
    The change has no known side effects and takes no break.

    As at the encryption, the whole of the setting lies in the words "where the other side can".
    Towards a side unable to sign, the machine behaves as it did before and does not break the
    connection. The item thus cannot spoil anything of itself.

    In the default state the setting is on in every present-day version of the system, so on most
    servers the mending changes nothing.

    A signature is not the same as encryption, and the items do not stand in for one another. A
    signature guards against change, encryption against reading. Both are turned on, guarding
    against different things.

    The item does not take in the signing of file share traffic. That is a group of settings
    apart, of another effect in service and another rating - worth keeping separate, the names
    sounding alike.

    The change comes into force at the next setting up of the channel and takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Wobec strony niepotrafiącej podpisać maszyna zachowuje się tak jak przedtem i nie zrywa połączenia
      - Podpisywanie ruchu udziałów plików to osobna grupa ustawień i ten punkt jej nie dotyczy
      - W stanie domyślnym ustawienie jest włączone, więc zmiana zwykle nie robi nic
      - Punkt nie zastępuje szyfrowania kanału, bo broni przed inną rzeczą
    en:
      - Towards a side unable to sign the machine behaves as before and does not break the connection
      - The signing of file share traffic is a group of settings apart and this item does not bear on it
      - In the default state the setting is on, so the change usually does nothing
      - The item does not stand in for the channel's encryption, guarding against another thing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, czy inne punkty z grupy kanału bezpiecznego zostały już wprowadzone
    en:
      - It has not been settled whether the other items of the secure channel group were brought in already
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'SignSecureChannel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'SignSecureChannel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SignSecureChannel' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-sign-secure-channel-data-when-possible

notes:
  pl: |
    Punkt należy do czwórki dotyczącej kanału bezpiecznego i sam
    z siebie niczego nie zrywa. Stąd klasa bez uciążliwości.

    Nie myl go z podpisywaniem ruchu udziałów plików. Nazwy brzmią
    podobnie, a ustawienia dotyczą zupełnie różnych połączeń i mają
    różny wpływ eksploatacyjny.

    Podpis broni przed napastnikiem czynnym, czyli takim, który
    przerabia ruch w drodze. Szyfrowanie broni przed biernym, czyli
    czytającym.
  en: |
    The item belongs to the four bearing on the secure channel and breaks nothing of itself.
    Thence the class without disruption.

    Do not mistake it for the signing of file share traffic. The names sound alike while the
    settings bear on wholly different connections and have a different effect in service.

    A signature guards against an active attacker, one who works traffic over on the way.
    Encryption guards against a passive one, who reads.
