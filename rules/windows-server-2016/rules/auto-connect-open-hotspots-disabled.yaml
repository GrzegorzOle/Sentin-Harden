id: win2016-auto-connect-open-hotspots-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > WLAN Service > WLAN Settings
  title:
    pl: Samoczynne łączenie z otwartymi sieciami wyłączone
    en: The connecting of itself to open networks switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza samoczynne łączenie się z otwartymi sieciami
    bezprzewodowymi udostępnianymi przez operatorów.

    Rzecz jest niepozorna, a skutek daleko idący. Maszyna z włączonym tym
    zachowaniem sama przyłącza się do sieci, której nikt nie wybierał,
    o której nic nie wiadomo i w której cały ruch idzie przez sprzęt obcy.
    Dzieje się to bez pytania i zwykle wtedy, gdy nikt na maszynę nie
    patrzy.

    Zagrożeniem nie jest samo połączenie, tylko to, że sieć obca widzi
    i może zmieniać wszystko, co nie jest szyfrowane niezależnie. Nazwy
    rozwiązywane, ruch pomocniczy, próby połączeń z usługami wewnętrznymi —
    wszystko to wychodzi w sieć, której nikt nie wybierał.

    Rzecz druga dotyczy trwałości ustawienia. Wartość leży poza gałęzią
    zasad, w konfiguracji własnej usługi. Znaczy to, że jej brak nie
    oznacza zasady nieustawionej, tylko domyślne zachowanie systemu —
    a to zachowanie zostawia rzecz włączoną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przyciągnięcia maszyny do sieci pod własną kontrolą bez żadnej
    czynności po stronie obsługującego.
  en: |
    The setting switches off the connecting of itself to open wireless networks made available by
    operators.

    The thing is unassuming and the consequence far-reaching. A machine with that behaviour switched on
    joins itself to a network nobody chose, of which nothing is known and in which all the traffic goes
    through somebody else's gear. It happens without an asking and as a rule when nobody is looking at the
    machine.

    The threat is not the connection itself but that a foreign network sees and may change everything not
    encrypted independently. Resolved names, ancillary traffic, attempts at connecting to internal services
    - all of it goes out into a network nobody chose.

    The second matter concerns the setting's endurance. The value sits outside the policy branch, in the
    service's own configuration. That means its absence stands not for an unset policy but for the system's
    default behaviour - and that behaviour leaves the thing switched on.

    What an attacker gains while the item goes unmet: the chance to draw the machine into a network under
    their own control with no act at all on the side of whoever attends it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na maszynie bez karty bezprzewodowej
    skutek jest żaden.

    Pytanie zasadnicze: czy ta maszyna ma kartę bezprzewodową i czy z niej
    korzysta. Na serwerze w szafie odpowiedź brzmi zwykle nie i punkt jest
    wtedy porządkowy. Na maszynie wirtualnej karty takiej nie ma wcale.

    Jeżeli maszyna z karty korzysta, warto ustalić jedno: czy połączenie
    przez sieć operatora jest gdzieś drogą zapasową. Bywa tak przy sprzęcie
    w terenie i przy maszynach, które mają pozostać osiągalne przy awarii
    łącza podstawowego. Wtedy zmiana odbiera tę drogę.

    Rzecz trzecia, o której trzeba powiedzieć, dotyczy trwałości.
    Ustawienie leży poza gałęzią zasad i większa aktualizacja systemu może
    je przywrócić do stanu domyślnego. Punkt ten warto sprawdzać ponownie
    po aktualizacjach, a nie zakładać, że raz ustawiony zostaje na zawsze.

    Czego to nie psuje: łączenia się z sieciami skonfigurowanymi ręcznie,
    sieci przewodowej, zapamiętanych sieci firmowych, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on a machine without a wireless card the consequence is none.

    The cardinal question: has this machine a wireless card and does it use one. On a server in a cabinet
    the answer is as a rule no and the item is then one of order. On a virtual machine there is no such card
    at all.

    If the machine does use one, one thing is worth establishing: whether a connection through an operator's
    network is anywhere a road in reserve. So it is at times with gear in the field and with machines that
    are to stay reachable when the main link fails. Then the change takes that road away.

    The third matter that has to be said concerns endurance. The setting lies outside the policy branch, and
    a bigger update of the system may put it back to its default state. This item is worth rechecking after
    updates rather than assuming that once set it stays so for good.

    What this does not break: the connecting to networks configured by hand, the wired network, remembered
    company networks, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Maszyna przestaje sama przyłączać się do otwartych sieci operatorskich i traci tę drogę jako zapasową
      - Na sprzęcie w terenie, który ma pozostać osiągalny przy awarii łącza podstawowego, zmianę trzeba rozważyć osobno
      - Ustawienie leży poza gałęzią zasad i większa aktualizacja systemu może je przywrócić do stanu domyślnego
      - Łączenie z sieciami skonfigurowanymi ręcznie i zapamiętanymi sieciami firmowymi pozostaje bez zmian
      - Sieć przewodowa, usługi i aplikacje pozostają bez zmian
    en:
      - The machine ceases to join itself to open operator networks and loses that road as one in reserve
      - On gear in the field that is to stay reachable when the main link fails the change has to be weighed apart
      - The setting lies outside the policy branch and a bigger update of the system may put it back to its default state
      - The connecting to networks configured by hand and to remembered company networks stays unchanged
      - The wired network, services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Połączenie przez otwartą sieć operatora jest dla tej maszyny drogą zapasową przy awarii łącza podstawowego
      - Maszyna pracuje w terenie i nie ma innego sposobu utrzymania jej osiągalności
    en:
      - A connection through an operator's open network is for this machine a road in reserve when the main link fails
      - The machine works in the field and there is no other way of keeping it reachable
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry sits outside the policy branch, in the service's own
      # configuration, so an absent value means the system default rather than
      # an unset policy - and that default leaves the automatic behaviour on.
      $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
      $name = 'AutoConnectAllowedOEM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
    $name = 'AutoConnectAllowedOEM'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value sits outside the policy branch, so a later system update may put
    # it back. Worth rechecking after a bigger update rather than assuming it
    # holds for good.
    $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AutoConnectAllowedOEM' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/nativewifi/about-the-native-wifi-api

notes:
  pl: |
    Punkt jest w bloku jedyny, w którym ustawienie leży poza gałęzią zasad,
    i warto, żeby aplikacja to pokazała. Ma to dwa skutki praktyczne.

    Pierwszy dotyczy odczytu. Brak wartości nie oznacza zasady
    nieustawionej — oznacza domyślne zachowanie systemu, a to zachowanie
    zostawia rzecz włączoną. Raport, który brak wartości potraktuje jako
    stan neutralny, powie nieprawdę.

    Drugi dotyczy trwałości. Wartość spoza gałęzi zasad bywa przywracana
    przez aktualizacje. Jest to jedna z niewielu reguł w całym zestawie,
    przy których ponowny audyt po aktualizacji jest rzeczą konieczną,
    a nie rutynową — i warto to odnotować przy samej regule, bo inaczej
    zniknie w ogólnym zaleceniu.

    Kategoria wysoka jest postawiona zgodnie z kryterium: maszyna
    przyłączająca się sama do cudzej sieci oddaje cały nieszyfrowany ruch
    komuś, kogo nikt nie wybierał, bez żadnego warunku po stronie
    napastnika poza postawieniem punktu dostępowego.
  en: |
    The item is in the block the only one whose setting lies outside the policy branch, and it is well that
    the application show that. It has two practical consequences.

    The first concerns the reading. An absent value does not stand for an unset policy - it stands for the
    system's default behaviour, and that behaviour leaves the thing switched on. A report treating an absent
    value as a neutral state would say an untruth.

    The second concerns endurance. A value from outside the policy branch is at times put back by updates.
    It is one of the few rules in the whole set at which a fresh audit after an update is a necessary thing
    rather than a routine one - and that is worth noting at the rule itself, else it will vanish into a
    general recommendation.

    The high category is set in keeping with the criterion: a machine joining itself to somebody else's
    network gives all its unencrypted traffic to somebody nobody chose, with no condition at all on the
    attacker's side beyond the setting up of an access point.
