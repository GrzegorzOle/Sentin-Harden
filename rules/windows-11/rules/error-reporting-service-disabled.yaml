id: win11-error-reporting-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zgłaszania błędów wyłączona
    en: The error reporting service disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zbiera dane o programie, który przestał działać, przygotowuje z nich
    raport i wysyła go na zewnątrz maszyny.

    Treść takiego raportu jest sednem sprawy. Raport zawiera fragment pamięci
    programu z chwili awarii — a więc to, co program akurat przetwarzał.
    W przypadku przeglądarki bywa to zawartość otwartej strony, w przypadku
    programu pocztowego treść wiadomości, w przypadku programu łączącego się
    z bazą danych parametry połączenia razem z hasłem. Nikt tego nie wybiera
    i nikt nie przegląda tego przed wysłaniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, ma dwie postaci.
    Pierwsza to dane wychodzące z maszyny drogą, która omija zwykłą kontrolę
    treści — wysyłką zajmuje się składnik systemowy, nie użytkownik. Druga jest
    subtelniejsza: raport o awarii mówi, że dany program na danej maszynie
    przewrócił się w określony sposób. Jest to dokładnie ta informacja, której
    szuka się przy szukaniu podatności, a maszyna wysyła ją sama.

    Osobno liczy się to, że mechanizm zgłaszania błędów jest uruchamiany
    w reakcji na awarię cudzego procesu, z wysokimi uprawnieniami. Jest to
    powierzchnia, która istnieje nawet wtedy, gdy nic nie zostaje wysłane.
  en: |
    The service gathers data about a program that has stopped working, makes a report of
    them and sends it off the machine.

    The contents of such a report are the heart of the matter. A report holds a fragment
    of the program's memory from the moment of the crash - that is, what the program
    happened to be handling. With a browser that is sometimes the contents of an open
    page, with a mail program the text of a message, with a program connecting to a
    database the connection parameters along with the password. Nobody chooses this and
    nobody looks it over before it is sent.

    What an attacker gains while the item goes unmet takes two forms. The first is data
    leaving the machine by a route that gets round the usual inspection of content - a
    system component does the sending, not the user. The second is subtler: a crash
    report says that a given program on a given machine fell over in a particular way.
    That is exactly the information looked for when looking for weaknesses, and the
    machine sends it itself.

    It counts separately that the error reporting mechanism is started in answer to
    another process's crash, with high rights. That is surface existing even when nothing
    is sent.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek korzysta z danych o awariach — i jest
    to pytanie poważniejsze, niż wygląda, bo odpowiedź brzmi „tak" częściej,
    niż się przypuszcza.

    Skutek pierwszy dotyczy własnego działu informatycznego. Ustalenie, dlaczego
    program przewraca się na jednej maszynie, a na innych nie, opiera się zwykle
    na zrzucie z chwili awarii. Po wyłączeniu usługi zrzuty przestają powstawać
    i zgłoszenie „przestało działać" trzeba rozstrzygać bez materiału.

    Skutek drugi dotyczy dostawców oprogramowania. Część programów branżowych
    zbiera własne raporty o awariach, ale część opiera się na mechanizmie
    systemowym. W tym drugim przypadku zgłoszenie usterki do dostawcy skończy
    się prośbą o materiał, którego nie będzie.

    Skutek trzeci dotyczy monitorowania. Systemy zbierające zdarzenia
    o awariach programów przestaną je dostawać z tej maszyny, przez co maszyna
    zniknie ze statystyk stabilności — wygląda to na poprawę, a jest brakiem
    danych.

    Użytkownik nie zauważy niczego: okno z pytaniem o wysłanie raportu i tak
    bywa wyłączone, a sam program przewraca się tak samo jak wcześniej.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anybody uses crash data - and that is a weightier
    question than it looks, because the answer is "yes" more often than supposed.

    The first effect concerns one's own computing department. Working out why a program
    falls over on one machine and not on others usually rests on a dump from the moment
    of the crash. Once the service is off, dumps stop being made and a report that
    something "stopped working" has to be settled with no material.

    The second effect concerns software suppliers. Some line-of-business programs gather
    crash reports of their own, but some rest on the system's mechanism. In the latter
    case reporting a fault to the supplier will end in a request for material that will
    not exist.

    The third effect concerns monitoring. Systems gathering events about program crashes
    will stop getting them from this machine, so the machine will vanish from stability
    statistics - which looks like an improvement but is an absence of data.

    The user will notice nothing: the window asking whether to send a report is often
    switched off anyway, and the program falls over just as before.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Zrzuty pamięci z chwili awarii programu przestają powstawać na maszynie
      - Zgłoszenie usterki do dostawcy oprogramowania zostaje bez materiału do analizy
      - Maszyna przestaje przekazywać zdarzenia o awariach do systemu monitorowania
      - Sam program przewraca się tak samo jak wcześniej i użytkownik nie zauważa zmiany
    en:
      - Memory dumps from the moment of a program crash stop being made on the machine
      - A fault reported to a software supplier is left with no material to analyse
      - The machine stops passing crash events to the monitoring system
      - The program itself falls over just as before and the user notices no change
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Dział informatyczny rozstrzyga zgłoszenia o awariach na podstawie zrzutów pamięci
      - Dostawca programu branżowego wymaga raportu z mechanizmu systemowego przy zgłoszeniu usterki
      - Maszyna bierze udział w badaniu niestabilności, którego materiałem są raporty o awariach
    en:
      - The computing department settles crash reports on the strength of memory dumps
      - A line-of-business supplier requires a report from the system mechanism when a fault is raised
      - The machine takes part in an investigation of instability whose material is crash reports
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'WerSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WerSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WerSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Reguła jest szersza niż opisana w tej paczce zasada blokująca dosyłanie
    danych uzupełniających do raportu. Tamta ogranicza, co zostanie wysłane,
    i zostawia mechanizm na miejscu; ta zdejmuje mechanizm z maszyny.
    Wdrożenie obu naraz jest sensowne — zasada broni maszyny, na której usługa
    zostanie kiedykolwiek włączona z powrotem.

    Przed wyłączeniem usługi warto rozważyć wariant pośredni, jeżeli materiał
    o awariach jest potrzebny: zrzuty da się kierować do katalogu na maszynie
    zamiast wysyłać na zewnątrz. Rozwiązuje to problem wycieku bez utraty
    materiału do analizy i bywa właściwszą odpowiedzią niż wyłączenie usługi.
    Reguła tego nie robi i nie udaje, że robi.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa uruchamiana w reakcji na awarię bywa zatrzymana
    i mimo to niezgodna.
  en: |
    The rule is wider than this pack's policy blocking the sending of supplementary data
    with a report. That one limits what will be sent and leaves the mechanism in place;
    this one takes the mechanism off the machine. Applying both at once makes sense - the
    policy guards a machine on which the service is ever switched back on.

    Before disabling the service a middle course is worth weighing if crash material is
    needed: dumps can be directed to a folder on the machine instead of being sent
    outside. That solves the leak without losing material to analyse and is sometimes the
    fitter answer than disabling the service. The rule does not do this and does not
    pretend to.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment. A service started in answer to a crash is sometimes stopped and
    deviating all the same.
