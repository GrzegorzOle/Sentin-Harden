id: win2016-steps-recorder-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Rejestrator czynności użytkownika wyłączony
    en: The recorder of a user's actions switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza rejestrator zapisujący czynności wykonywane przy
    maszynie razem ze zrzutami ekranu.

    Narzędzie powstało po to, żeby osoba zgłaszająca usterkę mogła pokazać,
    co robiła, zamiast to opisywać. Jest to cel sensowny, a kłopot leży
    w tym, co powstaje po drodze.

    Zrzut ekranu z sesji administracyjnej nie jest obrazkiem. Jest
    otwartymi konsolami z pełnymi poleceniami, nazwami kont, ścieżkami,
    fragmentami konfiguracji, nazwami maszyn i udziałów. Jeden plik zbiera
    to wszystko razem i porządkuje po kolei, krok po kroku.

    Plik ten powstaje po to, żeby go wysłać. Wychodzi więc z maszyny
    z założenia, zwykle pocztą, zwykle do kogoś spoza zespołu, i wędruje
    dalej wraz ze zgłoszeniem. Nikt go przy tym nie przegląda pod kątem
    tego, co znalazło się w kadrze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uporządkowany
    zapis sesji administracyjnej w jednym pliku, przeznaczonym do wysłania
    poza maszynę.
  en: |
    The setting switches off the recorder that writes down the actions carried out at the machine along with
    screenshots.

    The tool came about so that a person reporting a fault could show what they did instead of describing it. It
    is a sensible aim, and the trouble lies in what comes into being along the way.

    A screenshot from an administrative session is no picture. It is open consoles with full commands, the names
    of accounts, paths, fragments of configuration, the names of machines and of shares. One file gathers all of
    that together and orders it one after another, step by step.

    That file comes into being in order to be sent. It leaves the machine therefore by design, as a rule by mail,
    as a rule to somebody outside the team, and travels on along with the report. Nobody at that looks it over
    with an eye to what got into the frame.

    What an attacker gains while the item goes unmet: an ordered record of an administrative session in one file,
    meant for sending beyond the machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy procedury zgłoszeń.

    Rzecz do ustalenia: czy przyjęty sposób zgłaszania usterek wskazuje to
    narzędzie. Zdarza się to tam, gdzie wsparcie prosi o „nagranie kroków",
    i bywa zapisane w instrukcji. Po zmianie narzędzie nie uruchomi się,
    a osoba zgłaszająca zostanie z instrukcją, której nie da się wykonać.

    Dlatego zastępstwo trzeba wskazać przed zmianą, a nie po pierwszym
    zgłoszeniu. Zwykle wystarczy opis słowny albo pojedynczy zrzut ekranu
    robiony świadomie — z tą różnicą, że wtedy ktoś patrzy, co jest
    w kadrze.

    Rzecz druga dotyczy plików już zapisanych. Zostają tam, gdzie leżą,
    i wędrują dalej razem ze starymi zgłoszeniami. Reguła zamyka
    powstawanie nowych i nie sprząta po dawnych.

    Czego to nie psuje: zrzutów ekranu robionych zwykłą drogą, dzienników
    zdarzeń, zgłaszania usterek jako takiego, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the procedure for reports.

    The thing to be established: whether the accepted way of reporting faults names this tool. That happens where
    support asks for "a recording of the steps", and it is at times written into an instruction. After the change
    the tool will not start, and the person reporting will be left with an instruction that cannot be carried out.

    Therefore a replacement has to be named before the change and not after the first report. As a rule a
    description in words or a single screenshot taken knowingly is enough - with this difference, that then
    somebody looks at what is in the frame.

    The second matter concerns the files already written. They stay where they lie and travel on along with the
    old reports. The rule shuts the making of new ones and does not tidy after the old.

    What this does not break: screenshots taken the ordinary road, the event logs, the reporting of faults as such,
    services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Rejestrator nie uruchomi się, a instrukcja zgłaszania usterek wskazująca go przestaje dać się wykonać
      - Osoba zgłaszająca usterkę musi opisać ją słowami albo zrobić zrzut ekranu świadomie
      - Pliki zapisane wcześniej zostają tam, gdzie leżą, i wędrują dalej razem ze starymi zgłoszeniami
      - Zrzuty ekranu robione zwykłą drogą i dzienniki zdarzeń pozostają bez zmian
      - Role serwera, usługi systemowe i aplikacje pozostają bez zmian
    en:
      - The recorder will not start, and an instruction for reporting faults that names it ceases to be possible to carry out
      - A person reporting a fault has to describe it in words or take a screenshot knowingly
      - Files written earlier stay where they lie and travel on along with the old reports
      - Screenshots taken the ordinary road and the event logs stay unchanged
      - The server roles, system services and applications stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Przyjęta procedura zgłoszeń wskazuje to narzędzie i nie wskazano dla niego zastępstwa
      - Wsparcie zewnętrzne prosi o zapis kroków wykonany właśnie tym narzędziem
    en:
      - The accepted procedure for reports names this tool and no replacement for it has been named
      - Outside support asks for a record of the steps made by just that tool
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'DisableUAR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'DisableUAR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the ticket procedure names this tool, point out the replacement
    # before it disappears - otherwise the first report will undo the rule.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableUAR' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/planning/compatibility-administrator-users-guide

notes:
  pl: |
    Punkt otwiera drugą część bloku — o zapisach, które maszyna robi
    o własnej pracy.

    Argument wart postawienia wprost dotyczy tego, czym jest zrzut ekranu
    z sesji administracyjnej. Napisany ogólnie, punkt brzmi jak pozycja
    o prywatności i zostanie odpuszczony. Napisany konkretnie — otwarte
    konsole, pełne polecenia, nazwy kont i ścieżki, wszystko w jednym
    pliku i po kolei — tłumaczy się sam.

    Druga połowa argumentu jest równie ważna: plik powstaje po to, żeby go
    wysłać. Nie jest to zapis, który zostaje na maszynie; jest to zapis
    przeznaczony do wyjścia na zewnątrz, i to zwykle do kogoś spoza
    zespołu.

    Warunek do sprawdzenia jest miękki, ale realny: instrukcja zgłaszania
    usterek. Aplikacja, która o niego zapyta, oszczędzi komuś sytuacji,
    w której reguła zostaje cofnięta przy pierwszym zgłoszeniu, bo
    „przestało działać".

    Odnotowuję, że reguła dzieli gałąź z punktami o zbieraniu danych
    zgodności i o spisie zainstalowanych programów. Gałąź zgodności
    aplikacji zbiera rzeczy o różnym przeznaczeniu.
  en: |
    The item opens the block's second part - about the records the machine makes of its own work.

    The argument worth setting down outright concerns what a screenshot from an administrative session is. Written
    generally, the item sounds an entry about privacy and will be let go. Written definitely - open consoles, full
    commands, the names of accounts and paths, all in one file and one after another - it explains itself.

    The argument's second half is as weighty: the file comes into being in order to be sent. It is no record that
    stays on the machine; it is a record meant to go outside, and as a rule to somebody beyond the team.

    The condition to be checked is a soft one but real: the instruction for reporting faults. An application that
    asks after it will spare somebody the case in which the rule is undone at the first report because "it has
    stopped working".

    Worth noting that the rule shares its branch with the items about the gathering of compatibility data and
    about the inventory of installed programs. The branch of application compatibility gathers things of different
    purposes.
