id: win10-setup-log-retention

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Setup
  title:
    pl: Zachowanie dziennika instalacji po zapełnieniu
    en: The behaviour of the journal of setup once it fills up
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że dziennik instalacji po zapełnieniu nadpisuje
    wpisy najstarsze, zamiast przestać przyjmować nowe.

    Punkt domyka trójkę zasad o zachowaniu dzienników. Zasada jest ta
    sama co przy pozostałych: dziennik ma zapisywać zawsze, nawet za cenę
    utraty wpisów najdawniejszych.

    Szczególny jest tu rachunek. Dziennik instalacji przyrasta wolno, więc
    przy wymaganym rozmiarze zapełnienie jest zdarzeniem bardzo odległym.
    Wybór zachowania po zapełnieniu wygląda więc na rozstrzyganie sprawy,
    która nigdy nie nastąpi.

    Argument za wdrożeniem jest mimo to prosty. Maszyna stoi latami,
    a dziennik zapełni się kiedyś — najpewniej przy aktualizacji wersji
    systemu, czyli dokładnie wtedy, gdy zapis instalacji jest potrzebny
    najbardziej. Ustawienie zapisane dziś obowiązuje wtedy samo.

    Odnotowuję, że zachowanie domyślne bywa różne w zależności od wersji
    systemu, więc zapisanie tej zasady wprost jest tu utrwaleniem decyzji,
    a nie powtórzeniem stanu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania zapisu zmian w składnikach systemu.
  en: |
    The setting brings it about that the journal of setup, once full, writes over the oldest entries instead of
    ceasing to take new ones.

    The item closes the three policies about the behaviour of journals. The principle is the same as at the
    others: a journal is to write always, even at the price of the loss of the oldest entries.

    What is particular here is the reckoning. The journal of setup grows slowly, so at the called-for size a
    filling up is a very distant happening. The choosing of a behaviour upon a filling looks therefore like the
    settling of a matter that will never come about.

    The argument for the rollout is none the less a plain one. A machine stands for years, and the journal will
    fill up at some hour - most likely at an upgrade of the system's version, which is to say just when the record
    of setup is needed most. A setting written down today holds good then of itself.

    I set down that the default behaviour differs at times by the version of the system, so the writing of this
    policy outright is here a setting down of a decision and no repeating of a state.

    What an attacker gains while the item goes unmet: the halting of the record of changes in the system's parts.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie zwiększa pliku dziennika ani nie kasuje wpisów już
    zapisanych, a przy tempie przyrostu tego dziennika przez długi czas
    nie zmienia niczego w praktyce.

    Odnotowuję, że nie widzę tu scenariusza, w którym archiwizowanie
    pełnych dzienników instalacji byłoby potrzebne. Dziennik ten nie
    zapełnia się na tyle często, żeby archiwa miały z czego powstać.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: wgrywania poprawek, dodawania i usuwania
    składników, wpisów już zapisanych, pracy programów, drukowania.
  en: |
    The class is "no disruption".

    The change makes the journal's file no greater and deletes no entries already written, and at the pace at
    which this journal grows it changes for a long while nothing in practice.

    I set down that I see here no course of things in which a laying up of full journals of setup would be needed.
    That journal does not fill up often enough for stores to have whence to come about.

    The consequence shows at once, with no restart.

    What this does not break: the laying on of patches, the adding and the taking away of parts, the entries
    already written, the work of programs, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie archiwizującej pełne dzienniki instalacji archiwa przestaną powstawać
      - Przy tempie przyrostu tego dziennika zmiana przez długi czas nie zmienia niczego w praktyce
      - Zachowanie domyślne bywa różne w zależności od wersji systemu, więc zapis utrwala decyzję
      - Zmiana nie kasuje wpisów już zapisanych i nie zmienia rozmiaru pliku dziennika
      - Wgrywanie poprawek, dodawanie składników, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - Upon a machine laying up full journals of setup the stores will cease to come about
      - At the pace at which this journal grows the change alters for a long while nothing in practice
      - The default behaviour differs at times by the version of the system, so the writing sets a decision down
      - The change deletes no entries already written and changes not the size of the journal s file
      - The laying on of patches, the adding of parts, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie obowiązuje wymóg zewnętrzny nakazujący archiwizowanie pełnych dzienników instalacji
    en:
      - Upon the machine holds an outward requirement bidding that full journals of setup be laid up
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'Retention'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the service of the journal
    # reads this entry as a string and a number written here is passed over.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Reguła domyka trójkę i warto, żeby aplikacja pokazała wszystkie trzy
    razem, razem z trzema punktami o rozmiarze. Sześć punktów układa się
    w jedną decyzję o dziennikach zdarzeń i osobne ich rozważanie niewiele
    daje.

    Argument wart postawienia wprost dotyczy odległości w czasie.
    Zapełnienie tego dziennika nastąpi najprawdopodobniej przy
    aktualizacji wersji systemu — czyli w momencie, w którym zapisów
    przybywa najwięcej i w którym są najbardziej potrzebne. Zasada
    zapisana dziś działa wtedy bez niczyjego udziału.

    Odnotowuję, że zachowanie domyślne różni się między wersjami systemu.
    Punkt ten nie jest więc powtórzeniem stanu zastanego, tylko jego
    utrwaleniem — a to ma znaczenie przy aktualizacji, bo wartość zapisana
    przeżyje zmianę wersji, a wartość domyślna niekoniecznie.
  en: |
    The rule closes the three, and it is well that the application show all three together with the three items
    about size. Six items make up one decision about the journals of events and the weighing of them apart gives
    little.

    The argument worth putting outright touches the distance in time. The filling of this journal will most likely
    come at an upgrade of the system's version - which is to say at the hour when records grow most in number and
    when they are needed most. A policy written down today works then without anybody's hand.

    I set down that the default behaviour differs between versions of the system. This item is therefore no
    repeating of what was found but a setting down of it - and that bears weight at an upgrade, a value written
    down outliving the change of version where a default value may not.
