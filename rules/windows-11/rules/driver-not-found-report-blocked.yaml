id: win11-driver-not-found-report-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Zgłaszanie braku sterownika do producenta wyłączone
    en: Reporting a missing driver to the maker switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Kiedy do maszyny zostaje podłączone urządzenie, dla którego nie ma
    właściwego sterownika, system uruchamia sterownik zastępczy i wysyła
    producentowi zgłoszenie. Zgłoszenie zawiera identyfikatory urządzenia:
    producenta, model, wersję sprzętową.

    Wysyłka jest niewielka i nie zawiera danych użytkownika. Jej znaczenie
    bierze się z czegoś innego: identyfikatory urządzeń opisują wyposażenie
    stanowiska. Zebrane z wielu maszyn układają się w obraz tego, jakim
    sprzętem organizacja się posługuje — jakie czytniki, jakie urządzenia
    pomiarowe, jakie zabezpieczenia sprzętowe, jaki sprzęt specjalistyczny.

    Jest to informacja, której nikt nie zamierzał ujawniać, a która wychodzi
    przy zwykłym podłączeniu urządzenia. Dla napastnika przygotowującego atak
    na konkretną organizację ma wartość rozpoznawczą — mówi, czego szukać
    i z czym rozmawiać.

    Punkt zatrzymuje wysyłkę. Sterownik zastępczy jest uruchamiany dalej,
    więc urządzenie działa dokładnie tak samo jak wcześniej.
  en: |
    When a device is attached to the machine and no proper driver exists for it, the
    system starts a stand-in driver and sends the maker a report. The report holds
    the device's identifiers: maker, model, hardware version.

    The sending is small and holds no user data. Its significance comes from
    something else: device identifiers describe a station's equipment. Gathered from
    many machines they build a picture of what hardware an organisation works with -
    what readers, what measuring devices, what hardware safeguards, what specialist
    equipment.

    It is information nobody meant to disclose and which goes out on an ordinary
    attachment of a device. For an attacker preparing a move against a particular
    organisation it has reconnaissance value - it says what to look for and what to
    talk to.

    The item stops the sending. The stand-in driver is still started, so the device
    works exactly as it did before.

disruption_description:
  pl: |
    Nic nie przestaje działać. Urządzenia bez sterownika działają tak samo jak
    wcześniej, na sterowniku zastępczym; znika wyłącznie zgłoszenie wysyłane
    w tle.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego, nie ma programu ani urządzenia, które zachowa się po
    wdrożeniu inaczej.

    Warto odnotować jeden skutek pośredni. Zgłoszenia o braku sterownika są
    jednym ze źródeł, z których producent dowiaduje się, że dla jakiegoś
    sprzętu sterownika brakuje. Maszyna przestaje w tym uczestniczyć. Jest to
    koszt ponoszony zbiorowo i odłożony w czasie, a nie strata na tym
    stanowisku.

    Nie ma restartu.
  en: |
    Nothing stops working. Devices without a driver work as they did before, on the
    stand-in driver; only the report sent in the background disappears.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no program or device behaving differently after the
    rollout.

    One indirect effect is worth noting. Reports about a missing driver are one of
    the sources from which a maker learns that a driver for some hardware is lacking.
    The machine stops taking part in that. It is a cost borne collectively and
    deferred in time, not a loss at this station.

    There is no restart.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Nic nie przestaje działać; urządzenie bez sterownika dalej pracuje na sterowniku zastępczym
      - Producent przestaje dostawać z tej maszyny informację o sprzęcie, dla którego brakuje sterownika
    en:
      - Nothing stops working; a device without a driver keeps running on the stand-in driver
      - The maker stops receiving word from this machine about hardware for which a driver is lacking
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Trwa uzgadnianie z producentem obsługi sprzętu, dla którego brakuje sterownika
    en:
      - Support for hardware lacking a driver is being agreed with the maker
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
      $name = 'DisableSendGenericDriverNotFoundToWER'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    $name = 'DisableSendGenericDriverNotFoundToWER'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSendGenericDriverNotFoundToWER' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-overview

notes:
  pl: |
    Punkt tworzy parę z ustawieniem blokującym zgłoszenie wysyłane wtedy, gdy
    sterownik prosi o dodatkowe oprogramowanie. Oba leżą w tej samej gałęzi,
    oba dotyczą tego samego strumienia i wdrażanie ich osobno nie ma sensu —
    zamknięcie jednego zostawia drugi otwarty przy niewiele innym zdarzeniu.

    Wartość punktu jest skromna i benchmark stawia go w poziomie drugim.
    Zamyka jeden z wielu drobnych strumieni wychodzących; liczy się w sumie
    z pozostałymi, a nie sam z siebie.

    Zgłoszenie idzie tym samym mechanizmem co raporty o błędach programów,
    więc wyłączenie zgłaszania błędów w całości czyni ten punkt bezprzedmiotowym.
    Reguła sprawdza jednak wpis szczegółowy, bo to on jest treścią punktu.
  en: |
    The item forms a pair with the setting blocking the report sent when a driver
    asks for additional software. Both sit in the same key, both concern the same
    stream, and rolling them out apart makes little sense - closing one leaves the
    other open at a barely different event.

    The item's worth is modest and the benchmark places it at the second level. It
    closes one of many small outgoing streams; it counts in sum with the others
    rather than on its own.

    The report goes by the same mechanism as reports about program faults, so
    switching fault reporting off entirely makes this item moot. The rule checks the
    detailed entry all the same, because that is the item's content.
