id: win2025-domain-secure-channel-encrypted-when-possible

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera szyfrowany, gdy druga strona to potrafi
    en: The secure channel to the controller encrypted where the other side can
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie nakazuje szyfrować ruch kanału bezpiecznego wszędzie
    tam, gdzie druga strona to potrafi.

    Jest to jeden z trzech punktów uzupełniających wymaganie twarde.
    Tamten mówi, że rozmowa bez ochrony nie dochodzi do skutku; ten
    mówi, co zrobić, gdy ochrona jest możliwa — szyfrować, a nie
    poprzestawać na podpisie.

    Różnica między podpisem a szyfrowaniem jest tu treścią sprawy.
    Podpis chroni przed zmianą: kto stoi w środku, ten nie przerobi
    treści niezauważenie. Szyfrowanie chroni przed odczytem: kto stoi
    w środku, ten treści nie zobaczy. Na kanale bezpiecznym idą dane
    o tożsamości maszyny oraz przekazywane żądania uwierzytelnienia,
    więc odczyt sam w sobie ma dla napastnika wartość — nawet gdy
    zmiana jest niemożliwa.

    Na serwerze kanał ten jest prowadzony stale, a na kontrolerze
    domeny prowadzony jest również wobec innych kontrolerów. Ruch tam
    płynący dotyczy nie jednej maszyny, lecz wielu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odczytania treści kanału bezpiecznego wszędzie tam, gdzie
    ochrona ograniczyła się do samego podpisu.
  en: |
    The setting orders the secure channel's traffic to be encrypted wherever the other side can.

    It is one of three items filling out the hard requirement. That one says a conversation
    without guard does not come about; this one says what to do where guard is possible - to
    encrypt rather than to stop at a signature.

    The difference between a signature and encryption is here the matter itself. A signature
    guards against change: whoever stands in the middle will not work the content over unseen.
    Encryption guards against reading: whoever stands in the middle will not see the content. On
    the secure channel go data about the machine's identity and requests to authenticate passed
    on, so a reading is of itself worth something to an attacker - even where a change is out of
    reach.

    On a server that channel is kept steadily, and on a domain controller it is kept towards
    other controllers as well. The traffic flowing there bears not on one machine but on many.

    What an attacker gains while the item goes unmet: the means of reading the secure channel's
    content wherever the guard stopped at the signature alone.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Cała treść ustawienia mieści się w słowach „gdy druga strona to
    potrafi". Wobec strony niepotrafiącej szyfrować maszyna zachowuje
    się tak, jak przedtem — nie zrywa połączenia i nie odmawia
    rozmowy. Dlatego punkt ten nie może niczego zepsuć samodzielnie
    i dlatego zaliczono go do bezpiecznych hurtem.

    To wymaganie twarde rozstrzyga o zerwaniu, a nie ten. Kto włącza
    oba naraz — a tak zwykle się robi — ten ryzykiem obarcza tamten
    punkt, nie ten.

    W stanie domyślnym ustawienie jest włączone na wszystkich
    współczesnych wersjach systemu, więc na większości serwerów
    naprawa nie zmienia niczego.

    Szyfrowanie kanału nie dotyczy ruchu, którym idą dane użytkowników.
    Udziały plików, bazy danych i ruch aplikacyjny chronione są
    osobno i ten punkt ich nie obejmuje. Nieporozumienie w tej sprawie
    bierze się z nazwy, która brzmi szerzej, niż jest w istocie.

    Zmiana wchodzi w życie przy następnym nawiązywaniu kanału i nie
    wymaga restartu.
  en: |
    The change has no known side effects and takes no break.

    The whole of the setting lies in the words "where the other side can". Towards a side unable
    to encrypt, the machine behaves as it did before - it does not break the connection and does
    not refuse the conversation. Hence this item cannot spoil anything of itself, and hence it
    was counted among those safe in bulk.

    It is the hard requirement that settles a breaking, not this. Whoever turns both on at once
    - and it is usually so done - lays the risk on that item rather than on this.

    In the default state the setting is on in every present-day version of the system, so on most
    servers the mending changes nothing.

    The channel's encryption does not bear on the traffic that carries users' data. File shares,
    databases and application traffic are guarded apart and this item does not take them in. The
    misunderstanding in that matter comes of a name that sounds wider than it is in truth.

    The change comes into force at the next setting up of the channel and takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Wobec strony niepotrafiącej szyfrować maszyna zachowuje się tak jak przedtem i nie zrywa połączenia
      - Ruch aplikacyjny i udziały plików nie są objęte tym punktem i pozostają bez zmiany
      - W stanie domyślnym ustawienie jest włączone, więc zmiana zwykle nie robi nic
      - O zerwaniu połączenia rozstrzyga punkt wymagający podpisu lub szyfrowania zawsze, nie ten
    en:
      - Towards a side unable to encrypt the machine behaves as before and does not break the connection
      - Application traffic and file shares are not taken in by this item and stay unchanged
      - In the default state the setting is on, so the change usually does nothing
      - It is the item requiring a signature or encryption always that settles a breaking, not this
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, czy inne punkty z grupy kanału bezpiecznego zostały już wprowadzone
    en:
      - It has not been settled whether the other items of the secure channel group were brought in already
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'SealSecureChannel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'SealSecureChannel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SealSecureChannel' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-encrypt-secure-channel-data-when-possible

notes:
  pl: |
    Punkt należy do czwórki dotyczącej kanału bezpiecznego i sam
    z siebie niczego nie zrywa — działa wyłącznie tam, gdzie druga
    strona potrafi. Stąd klasa bez uciążliwości.

    Szyfrowanie chroni przed odczytem, podpis przed zmianą. Na kanale
    bezpiecznym warto mieć oba, bo idą nim dane o tożsamości maszyny.

    Punkt nie obejmuje ruchu aplikacyjnego ani udziałów plików. Nazwa
    brzmi szerzej, niż jest w istocie.
  en: |
    The item belongs to the four bearing on the secure channel and breaks nothing of itself - it
    works only where the other side can. Thence the class without disruption.

    Encryption guards against reading, a signature against change. On the secure channel both
    are worth having, data about the machine's identity going over it.

    The item does not take in application traffic or file shares. The name sounds wider than it
    is in truth.
