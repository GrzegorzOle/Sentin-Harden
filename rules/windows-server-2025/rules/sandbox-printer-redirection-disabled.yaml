id: win2025-sandbox-printer-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Udostępnianie drukarek piaskownicy wyłączone
    en: Sharing of printers with the sandbox disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania udostępniania piaskownicy drukarek gospodarza.

    Kategoria średnia i chcę powiedzieć, dlaczego ten punkt nie jest
    o drukowaniu, choć tak się nazywa. Udostępnienie drukarki nie polega na
    przekazaniu obrazu do wydruku. Polega na tym, że wewnątrz piaskownicy
    pojawia się urządzenie, a wraz z nim kanał prowadzący do usługi
    buforowania wydruku gospodarza — usługi pracującej z wysokimi
    uprawnieniami i mającej długą, dobrze udokumentowaną historię błędów.

    To jest właściwa treść punktu. Z perspektywy izolacji udostępniona
    drukarka jest jeszcze jednym wyjątkiem od zasady, że wszystko, co
    z piaskownicy wychodzi, przechodzi przez warstwę wirtualizacji. Program,
    któremu nie ufamy na tyle, że uruchamiamy go w odseparowanym
    środowisku, dostaje sposób rozmawiania z uprzywilejowaną usługą
    gospodarza.

    Kierunek drugi jest prostszy i dotyczy tego, co wychodzi: drukowanie to
    wyniesienie treści poza maszynę. Piaskownica bez sieci, ale z drukarką,
    nadal ma jedną drogę na zewnątrz — a jest to droga, której nikt nie
    szuka, przeglądając połączenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    z wnętrza piaskownicy do uprzywilejowanej usługi gospodarza oraz drogę
    wyniesienia treści, niewidoczną w ruchu sieciowym.
  en: |
    The item forbids the host's printers to be shared with the sandbox.

    The category is medium, and I want to say why this item is not about
    printing, although that is its name. Sharing a printer does not consist
    in handing over an image to be printed. It consists in a device appearing
    inside the sandbox, and with it a channel leading to the host's print
    spooler - a service running with high privileges and carrying a long,
    well-documented history of faults.

    That is the real substance of the item. From the point of view of
    isolation, a shared printer is one more exception to the principle that
    everything leaving the sandbox passes through the virtualisation layer. A
    program we distrust enough to run in a separated environment is given a
    way of talking to a privileged service of the host.

    The second direction is simpler and concerns what goes out: printing is
    the carrying of content off the machine. A sandbox with no network but
    with a printer still has one road outwards - and it is a road nobody
    looks for when going through connections.

    What an attacker gains while the item goes unmet: a channel from inside
    the sandbox to a privileged service of the host, and a route for carrying
    content out that is invisible in network traffic.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż to jest najłagodniejszy punkt
    z całej tej szóstki — i na serwerze bez zainstalowanej piaskownicy nie
    robi nic, bo piaskownica jest funkcją opcjonalną.

    Skutek: z piaskownicy nie da się wydrukować. To wszystko. Trudno
    wskazać scenariusz, w którym ktoś drukuje z odizolowanego środowiska,
    w którym otworzył coś, czemu nie ufa — a jeśli taki scenariusz istnieje,
    to sam w sobie zasługuje na pytanie, po co.

    Klasy nie obniżam do „bez uciążliwości" z jednego powodu: nie wiem, do
    czego ktoś tę piaskownicę na tej maszynie postawił, a przy wątpliwości
    reguła idzie wyżej, nie niżej. Na serwerze wydruku, gdzie ktoś mógł
    piaskownicą sprawdzać podejrzany sterownik, wydruk bywa właśnie tym,
    co się sprawdza.

    Czego to nie psuje: drukarek gospodarza, roli serwera wydruku,
    drukowania z sesji zdalnych ani przekierowania drukarek w tych sesjach.
    Punkt dotyczy wyłącznie granicy piaskownicy.

    Zmiana obowiązuje od następnego uruchomienia piaskownicy. Bez przerwy,
    natychmiast odwracalne.
  en: |
    The class is "needs review", although this is the mildest item of the
    six - and on a server with no sandbox installed it does nothing, because
    the sandbox is an optional feature.

    The effect: nothing can be printed from the sandbox. That is all. It is
    hard to point to a case where somebody prints from an isolated
    environment in which they opened something they do not trust - and if
    such a case exists, it deserves the question why in its own right.

    I do not lower the class to "no disruption" for one reason: I do not know
    what somebody set this sandbox up for on this machine, and in doubt a
    rule goes higher, not lower. On a print server, where somebody may have
    been using the sandbox to check a suspect driver, printing is precisely
    what is being checked.

    What this does not break: the host's printers, the print server role,
    printing from remote sessions, or printer redirection in those sessions.
    The item concerns the sandbox's boundary alone.

    The change holds from the next start of the sandbox. No outage, undone
    immediately.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Z piaskownicy nie da się wydrukować i to jest cała lista skutków
      - Na serwerze wydruku, gdzie piaskownicą sprawdza się podejrzany sterownik, wydruk bywa właśnie tym, co się sprawdza
      - Drukarki gospodarza, rola serwera wydruku i drukowanie z sesji zdalnych działają bez zmian
      - Zmiana obowiązuje od następnego uruchomienia piaskownicy, a nie od razu
    en:
      - Nothing can be printed from the sandbox, and that is the whole list of effects
      - On a print server, where a suspect driver is checked in the sandbox, printing is precisely what is being checked
      - The host's printers, the print server role and printing from remote sessions work unchanged
      - The change holds from the next start of the sandbox rather than straight away
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica na tej maszynie służy do sprawdzania sterowników drukarek albo zachowania programu przy wydruku
    en:
      - The sandbox on this machine is used to check printer drivers or how a program behaves when printing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      $name = 'AllowPrinterRedirection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $name = 'AllowPrinterRedirection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Not about printing: sharing a printer puts a device inside the sandbox and
    # with it a channel to the host's print spooler, a privileged service with a
    # long history of faults. It is also a road outwards that stays invisible
    # when connections are reviewed.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowPrinterRedirection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Punkt nie jest o drukowaniu, choć tak się nazywa. Udostępnienie drukarki
    polega na tym, że wewnątrz piaskownicy pojawia się urządzenie, a wraz
    z nim kanał do usługi buforowania wydruku gospodarza — pracującej
    z wysokimi uprawnieniami i mającej długą historię błędów.

    Kierunek drugi: drukowanie to wyniesienie treści poza maszynę.
    Piaskownica bez sieci, ale z drukarką, nadal ma jedną drogę na zewnątrz,
    i to drogę, której nikt nie szuka, przeglądając połączenia.

    Klasy nie obniżam do „bez uciążliwości", bo nie wiadomo, po co
    piaskownica na danej maszynie stoi — przy wątpliwości reguła idzie
    wyżej, nie niżej.
  en: |
    The item is not about printing, although that is its name. Sharing a
    printer means a device appearing inside the sandbox, and with it a
    channel to the host's print spooler - running with high privileges and
    carrying a long history of faults.

    The second direction: printing is the carrying of content off the
    machine. A sandbox with no network but with a printer still has one road
    outwards, and it is a road nobody looks for when going through
    connections.

    I do not lower the class to "no disruption", because what the sandbox was
    set up for on a given machine is not known - in doubt a rule goes higher,
    not lower.
