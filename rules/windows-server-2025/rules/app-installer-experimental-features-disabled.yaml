id: win2025-app-installer-experimental-features-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Funkcje eksperymentalne instalatora pakietów wyłączone
    en: Experimental features of the package installer disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza funkcje instalatora pakietów oznaczone jako
    eksperymentalne — czyli takie, o których producent mówi wprost, że
    nie są jeszcze gotowe i mogą się zmienić albo zniknąć.

    Obniżam kategorię do niskiej i chcę powiedzieć wprost, do której
    szuflady ten punkt należy, żeby nie udawał czegoś, czym nie jest.
    Jest to punkt porządkowy. Nie zamyka drogi wejścia, nie odbiera
    napastnikowi narzędzia i nie broni przed dającym się nazwać atakiem.

    Wartość jest inna i mniejsza, ale realna: maszyna produkcyjna ma
    działać na mechanizmach, których zachowanie jest opisane i niezmienne
    między wydaniami. Funkcja eksperymentalna z definicji tego nie
    gwarantuje. Włączona na serwerze znaczy, że ktoś kiedyś czegoś
    próbował — i jest to ta sama sytuacja, co przy trybie programisty,
    tylko o mniejszej wadze.

    Ma to jeszcze jedną konsekwencję, wartą wymienienia, bo dotyczy
    rzeczy, na której stoją inne punkty tej grupy: funkcja
    eksperymentalna bywa właśnie tą, która omija sprawdzenia opisane
    obok. Zakazy pomijania skrótu i badania archiwum zakładają, że
    instalator zachowuje się tak, jak udokumentowano.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    wprost — ale działanie instalatora na tej maszynie przestaje być
    w pełni przewidywalne, a na tym opierają się sąsiednie punkty.
  en: |
    The item switches off the features of the installer of packages marked as of trial - that is,
    such as the maker says outright are not yet ready and may alter or go away.

    I lower the category to low and mean to say outright to which drawer this item belongs, that it
    feign not to be what it is not. It is an item of order. It shuts no road of coming in, takes no
    tool from an attacker and wards against no onslaught that could be named.

    The worth is other and smaller, but true - a machine of production is to work upon workings whose
    bearing is written down and unaltering between givings out. A feature of trial by its making
    warrants that not. Switched on upon a server it means somebody once tried something - and it is
    the same case as at the mode of the maker of programs, only of lesser weight.

    It has one further outcome worth naming, bearing as it does on a thing whereon other items of
    this group stand - a feature of trial is at times just that which goes round the lookings-to set
    forth alongside. The forbiddings of the passing over of the digest and of the scanning of the
    archive hold that the installer bears itself as has been written down.

    What an attacker gains while the item goes unmet - little outright, but the working of the
    installer upon that machine stops being wholly foreseeable, and thereupon the neighbouring items
    lean.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i na serwerze jest to ocena
    łatwa.

    Zmiana nie dotyka niczego, co na maszynie produkcyjnej działa. Funkcje
    eksperymentalne są domyślnie wyłączone, więc na większości serwerów
    zmiana zapisuje jawne zero w miejsce braku i nie robi nic więcej.

    Jeżeli funkcje są włączone, przestanie działać to, dla czego ktoś je
    włączył. Nie potrafię tego wymienić z nazwy i nie chcę udawać, że
    potrafię: zestaw funkcji eksperymentalnych zmienia się z każdym
    wydaniem instalatora, więc opis wymieniający je po imieniu zestarzałby
    się szybciej niż reguła. Jest to jedna z niewielu rzeczy w tej paczce,
    o których mogę powiedzieć tylko tyle, że zależą od wersji
    zastanej na maszynie.

    Rzecz do zrobienia przed zmianą jest za to prosta i nie wymaga
    wiedzy o tym, co dokładnie jest włączone: sprawdź, czy wpis w ogóle
    istnieje. Jeżeli nie — zmiana jest bez skutku. Jeżeli istnieje —
    znaczy, że ktoś go tu świadomie położył, i warto ustalić kto oraz po
    co, zanim się go zdejmie.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption", and on a server that is an easy reckoning.

    The change touches nothing that works upon a machine of production. Features of trial are
    switched off by default, so upon most servers the change writes an outright nought in the place
    of a want and does nothing further.

    If the features are switched on, that will stop working for whose sake somebody switched them on.
    I cannot name it and will not feign that I can - the set of features of trial alters with every
    giving out of the installer, so a setting forth that named them one by one would grow old faster
    than the rule. It is one of the few things in this pack whereof I can say no more than that they
    hang upon the make found upon the machine.

    The thing to do before the change is, on the other hand, plain, and takes no knowing of what
    exactly is switched on - look to whether the entry is there at all. If not - the change is
    without outcome. If it is - it means somebody laid it here wittingly, and it is worth settling
    who and to what end before it is taken away.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Przestanie działać to, dla czego ktoś włączył funkcje eksperymentalne na tej maszynie
      - Zestaw tych funkcji zmienia się z każdym wydaniem instalatora, więc nie da się ich wymienić z nazwy
      - Na większości serwerów wpisu nie ma i zmiana jest bez skutku
      - Istniejący wpis znaczy, że ktoś go tu świadomie położył, i warto ustalić kto oraz po co
      - Funkcje eksperymentalne są domyślnie wyłączone i zmiana zapisuje jawne zero w miejsce braku
    en:
      - That will stop working for whose sake somebody switched the features of trial on upon that machine
      - The set of those features alters with every giving out of the installer, so they cannot be named one by one
      - Upon most servers the entry is not there and the change is without outcome
      - An entry that is there means somebody laid it here wittingly, and it is worth settling who and to what end
      - Features of trial are switched off by default and the change writes an outright nought in the place of a want
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wpis na maszynie istnieje i nie ustalono, kto go położył ani po co
    en:
      - The entry is there upon the machine and it was not settled who laid it nor to what end
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableExperimentalFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableExperimentalFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # If the value already exists, somebody set it deliberately: find out who
    # and why before clearing it. The neighbouring hash and archive rules
    # assume the installer behaves as documented.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableExperimentalFeatures' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Punkt porządkowy i nazywam go tak wprost, żeby nie udawał czegoś,
    czym nie jest. Nie zamyka drogi wejścia i nie odbiera napastnikowi
    narzędzia.

    Wartość mniejsza, ale realna, i ma jedną konsekwencję wartą
    wymienienia: funkcja eksperymentalna bywa właśnie tą, która omija
    sprawdzenia opisane w sąsiednich punktach. Zakazy pomijania skrótu
    i badania archiwum zakładają, że instalator zachowuje się tak, jak
    udokumentowano.

    Jedna z niewielu reguł w tej paczce, o której mogę powiedzieć tylko,
    że skutek zależy od wersji zastanej na maszynie — zestaw funkcji
    eksperymentalnych zmienia się z każdym wydaniem.
  en: |
    An item of order, and I name it so outright that it feign not to be what it is not. It shuts no
    road of coming in and takes no tool from an attacker.

    The worth is lesser but true, and it has one outcome worth naming - a feature of trial is at
    times just that which goes round the lookings-to set forth in the neighbouring items. The
    forbiddings of the passing over of the digest and of the scanning of the archive hold that the
    installer bears itself as has been written down.

    One of the few rules in this pack whereof I can say only that the outcome hangs upon the make
    found upon the machine - the set of features of trial alters with every giving out.
