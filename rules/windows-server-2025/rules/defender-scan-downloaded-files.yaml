id: win2025-defender-scan-downloaded-files

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection
  title:
    pl: Sprawdzanie plików pobranych i załączników włączone
    en: Checking of downloaded files and attachments switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt dotyczy oglądania plików pochodzących z zewnątrz — pobranych
    i przyniesionych jako załącznik — w chwili, gdy trafiają na dysk.
    Nazwa wpisu w polityce mówi o wyłączeniu, więc stanem zgodnym jest
    zero, a nie jedynka.

    Obniżam kategorię wobec oceny dla stacji roboczej i robię to
    świadomie, bo droga, której ten punkt pilnuje, na serwerze prawie
    nie istnieje. Nikt tu nie przegląda stron i nie odbiera poczty.
    Pliki przychodzą na serwer innymi drogami: przez udziały, przez
    wdrożenia, przez interfejsy wymiany — a tych pilnuje ochrona
    w czasie rzeczywistym, nie ten punkt.

    Nie schodzę jednak niżej niż do wysokiej i powód jest konkretny.
    Administratorzy pobierają narzędzia wprost na serwer — sterownik od
    producenta, narzędzie diagnostyczne, aktualizację agenta,
    rozpakowywacz. Robią to rzadko, zwykle pod presją czasu, w trakcie
    awarii, i robią to kontem o pełnych uprawnieniach na tej maszynie.
    Jest to droga wąska, ale prowadząca od razu na sam szczyt.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: plik
    pobrany na serwer przez administratora podczas awarii trafia na dysk
    bez obejrzenia przez ten mechanizm.
  en: |
    The item bears on the looking at files coming from without - drawn down and brought in as an
    attachment - at the moment they come onto the disk. The name of the entry in the policy speaks
    of a switching off, so the meeting state is a nought and not a one.

    I lower the category against the reckoning for a workstation and do it wittingly, the road this
    item keeps hardly being on a server at all. Nobody here looks over pages nor takes in post.
    Files come onto a server by other roads - by shares, by rollings out, by the meeting places of
    exchange - and those the guard in real time keeps, not this item.

    I go, though, no lower than high, and the ground is a set one. Administrators draw tools down
    straight onto a server - a driver from the maker, a tool of diagnosis, a freshening of an agent,
    an unpacker. They do it seldom, mostly under the press of time, in the midst of a fault, and
    they do it by an account of full rights on that machine. It is a narrow road, but one leading
    straightway to the very top.

    What an attacker gains while the item goes unmet - a file drawn down onto the server by an
    administrator during a fault comes onto the disk unlooked at by this working.

disruption_description:
  pl: |
    Zmiana nie blokuje pobierania i nie dokłada kroku do żadnej
    procedury. Ogląda plik, który już się pobiera, w chwili zapisu.
    W zwykłej pracy serwera nie widać jej wcale.

    Zostaje mimo to poza trybem zbiorczym, bo sprawdzenia wymaga jedna
    rzecz, którą łatwo przeoczyć. Wpis obejmuje także pliki napływające
    z sieci do katalogów wymiany, jeżeli system rozpozna je jako
    pochodzące z zewnątrz. Na serwerze przyjmującym duże zbiory
    z innych systemów — zrzuty, paczki wsadowe, archiwa — oznacza to
    oglądanie każdej porcji w chwili przyjęcia. Przy plikach rzędu
    gigabajtów bywa to odczuwalne w czasie przyjęcia zbioru.

    Jeżeli serwer pełni taką rolę, właściwą odpowiedzią jest wyłączenie
    dla konkretnego katalogu wymiany opisane w procedurze, a nie
    wyłączenie mechanizmu na całej maszynie. To rozróżnienie warto
    zapisać przy okazji tej zmiany, bo wraca przy każdym punkcie tej
    grupy.

    Drugą rzeczą wartą sprawdzenia jest to, czy jakiekolwiek narzędzie
    wdrożeniowe nie pobiera na tę maszynę plików w pętli. Wtedy skutek
    jest ten sam co powyżej, tylko rozłożony na wiele małych pobrań.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    The change blocks no drawing down and adds no step to any way of going about things. It looks at
    a file that is already being drawn down, at the moment of its writing. In a server's ordinary
    work it is not seen at all.

    It stays outside the bulk mode for all that, one thing needing checking that is lightly
    overlooked. The entry takes in also files flowing in off the net into folders of exchange, where
    the system knows them for coming from without. On a server taking in great sets off other
    systems - droppings, bundles of batches, stores - that means the looking at every helping at the
    moment of its taking in. At files of the order of gigabytes it can be marked in the time of a
    set's taking in.

    If the server bears such a role, the right answer is a leaving-out for the set folder of
    exchange, set forth in the way of going about it, and not the switching off of the working on
    the whole machine. That telling apart is worth writing down at this change, it coming back at
    every item of this group.

    The second thing worth checking is whether any tool of rolling out draws files onto that machine
    in a ring. Then the outcome is the same as above, only laid out over many small drawings down.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Serwer przyjmujący duże zbiory z innych systemów ogląda każdą porcję w chwili przyjęcia
      - Przy plikach rzędu gigabajtów bywa to odczuwalne w czasie przyjęcia zbioru
      - Narzędzie wdrożeniowe pobierające pliki w pętli daje ten sam skutek rozłożony na wiele pobrań
      - Właściwą odpowiedzią jest wyłączenie dla konkretnego katalogu wymiany, a nie dla całej maszyny
      - Sama zmiana nie blokuje pobierania i nie dokłada kroku do żadnej procedury
    en:
      - A server taking in great sets off other systems looks at every helping at the moment of its taking in
      - At files of the order of gigabytes it can be marked in the time of a set's taking in
      - A tool of rolling out drawing files in a ring gives the same outcome laid out over many drawings down
      - The right answer is a leaving-out for the set folder of exchange and not for the whole machine
      - The change itself blocks no drawing down and adds no step to any way of going about things
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer przyjmuje wielkie zbiory do katalogu wymiany i nie ustalono dla niego wyłączenia
    en:
      - The server takes great sets into a folder of exchange and no leaving-out was settled for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name reads the other way round: the policy writes 0 where
      # the checking is switched on. The expected entry is therefore zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableIOAVProtection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableIOAVProtection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableIOAVProtection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Kategoria obniżona, bo droga, której punkt pilnuje — przeglądanie
    stron i poczta — na serwerze prawie nie istnieje. Pliki przychodzą
    tu udziałami i wdrożeniami, a tych pilnuje ochrona w czasie
    rzeczywistym.

    Nie schodzę niżej niż do wysokiej, bo administrator pobiera
    narzędzia wprost na serwer: rzadko, pod presją czasu, w trakcie
    awarii, kontem o pełnych uprawnieniach. Droga wąska, ale prowadząca
    od razu na szczyt.

    Rozróżnienie warte zapisania przy tej okazji, bo wraca w całej
    grupie: wyłączenie dla konkretnego katalogu zamiast wyłączenia
    mechanizmu na całej maszynie.
  en: |
    The category is lowered, the road the item keeps - the looking over of pages and the post -
    hardly being on a server at all. Files come here by shares and rollings out, and those the guard
    in real time keeps.

    I go no lower than high, an administrator drawing tools down straight onto a server - seldom,
    under the press of time, in the midst of a fault, by an account of full rights. A narrow road,
    but one leading straightway to the top.

    A telling apart worth writing down at this turn, it coming back through the whole group - a
    leaving-out for a set folder instead of the switching off of the working on the whole machine.
