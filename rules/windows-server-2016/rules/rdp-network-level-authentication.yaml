id: win2016-rdp-network-level-authentication

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services
  title:
    pl: Uwierzytelnianie na poziomie sieci wymagane dla pulpitu zdalnego
    en: Network Level Authentication required for Remote Desktop
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe serwerowi uwierzytelnić łączącego się, zanim w ogóle
    zestawi dla niego sesję.

    Bez tego wymagania kolejność jest odwrotna i w tym tkwi cała rzecz.
    Serwer najpierw tworzy sesję, uruchamia w niej obsługę pulpitu
    i rysuje ekran logowania — a dopiero potem pyta, kim jest gość. Praca
    ta zostaje wykonana na żądanie kogoś, kto nie podał jeszcze żadnego
    poświadczenia.

    Wynikają z tego dwie rzeczy, różne co do wagi. Pierwsza jest prosta:
    każdy, kto sięgnie do portu, zajmuje pamięć i czas procesora serwera,
    więc dość szybkiego strumienia takich żądań wystarczy, by maszyna
    przestała obsługiwać kogokolwiek. Druga waży więcej: kod obsługujący
    zestawianie sesji i rysujący ekran logowania jest w tym układzie
    osiągalny dla kogoś nieuwierzytelnionego, a to jest dokładnie ta
    powierzchnia, na której znajdowano w tej usłudze błędy pozwalające
    przejąć maszynę bez żadnego hasła.

    Po włączeniu wymagania serwer nie robi nic, dopóki łączący się nie
    udowodni, kim jest. Nieuwierzytelniony nie ma się czego dotknąć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    sięgnięcia do kodu zestawiającego sesję bez podania jakiegokolwiek
    poświadczenia — i to na maszynie, do której ma dostęp wyłącznie
    sieciowy.
  en: |
    The setting has the server authenticate whoever connects before it sets up a
    session for them at all.

    Without that demand the order is reversed, and there lies the whole matter. The
    server first makes a session, starts the desktop handling inside it and draws
    the sign-in screen - and only then asks who the guest is. That work is done at
    the request of somebody who has offered no credential yet.

    Two things follow, differing in weight. The first is plain: anybody reaching for
    the port takes up the server's memory and processor time, so a fast enough
    stream of such requests is enough for the machine to stop serving anybody at
    all. The second weighs more: the code setting up the session and drawing the
    sign-in screen is in this arrangement reachable by somebody unauthenticated, and
    that is exactly the surface on which faults letting a machine be taken over with
    no password at all have been found in this service.

    With the demand switched on the server does nothing until whoever connects
    proves who they are. The unauthenticated have nothing to touch.

    What an attacker gains while the item goes unmet: the means of reaching the code
    that sets up a session without offering any credential - and that on a machine
    they have network access to alone.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Sprawa rozstrzyga się po stronie klientów,
    nie serwera, i sprowadza się do jednego pytania: czy wszystko, co się
    do tej maszyny łączy, potrafi uwierzytelnić się wcześniej.

    Nowsze systemy potrafią i robią to domyślnie. Kłopot leży gdzie
    indziej — w narzędziach, które nie są systemowym klientem pulpitu
    zdalnego. Konsole zarządzania wbudowane w sprzęt, klienty na urządzeniach
    przenośnych, biblioteki wbudowane w oprogramowanie monitorujące,
    uproszczone terminale bezdyskowe. Część z nich zna wyłącznie starszy
    sposób łączenia.

    Osobno stoi uwierzytelnianie kontem lokalnym maszyny, gdy ta nie jest
    w domenie. Działa, ale bywa wrażliwe na rozbieżność nazw i na brak
    zaufania do certyfikatu serwera po stronie klienta — objawem jest
    wtedy ostrzeżenie zamiast odmowy, więc łatwo je przeoczyć w testach.

    Objaw jest jednoznaczny: klient dostaje komunikat, że maszyna zdalna
    wymaga uwierzytelnienia na poziomie sieci, i połączenie nie dochodzi
    do skutku. Nie ma tu cichego pogorszenia.

    Czego to nie psuje: sesji już otwartych, bo warunek waży się przy
    kolejnym łączeniu; konsoli lokalnej; zarządzania przez powłokę zdalną.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". The matter is settled on the clients' side, not the
    server's, and comes down to a single question: whether everything that connects
    to this machine can authenticate beforehand.

    Newer systems can and do so by default. The trouble lies elsewhere - in tools
    that are not the system's own remote desktop client. Management consoles built
    into hardware, clients on handheld devices, libraries built into monitoring
    software, plain diskless terminals. Some of them know the older way of
    connecting alone.

    Authentication with the machine's local account, where the machine is not in a
    domain, stands apart. It works, but it is at times sensitive to a mismatch of
    names and to the client not trusting the server's certificate - the symptom is
    then a warning rather than a refusal, so it is easily missed in testing.

    The symptom is unambiguous: the client gets a message that the remote machine
    demands network level authentication, and the connection does not come about.
    There is no quiet worsening here.

    What this does not break: sessions already open, since the condition is weighed
    at the next connecting; the local console; management through a remote shell.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Klient nieumiejący uwierzytelnić się przed zestawieniem sesji dostaje odmowę i nie dochodzi do ekranu logowania
      - Konsole zarządzania wbudowane w sprzęt oraz uproszczone terminale bezdyskowe tracą dostęp do pulpitu zdalnego tej maszyny
      - Łączenie kontem lokalnym maszyny spoza domeny bywa wrażliwe na rozbieżność nazw i brak zaufania do certyfikatu serwera
      - Sesje już otwarte, konsola lokalna i zarządzanie przez powłokę zdalną pozostają bez zmian
    en:
      - A client unable to authenticate before the session is set up gets a refusal and never reaches the sign-in screen
      - Management consoles built into hardware and plain diskless terminals lose access to this machine's remote desktop
      - Connecting with the local account of a machine outside a domain is at times sensitive to name mismatch and to the server certificate not being trusted
      - Sessions already open, the local console and management through a remote shell stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, jakimi narzędziami łączą się do tej maszyny osoby nią zarządzające, i czy wszystkie potrafią uwierzytelnić się wcześniej
      - Pulpit zdalny tej maszyny jest jedyną drogą zarządzania, a nie ma żadnej innej na wypadek odcięcia
    en:
      - It has not been established what tools the people managing this machine connect with, and whether all can authenticate beforehand
      - This machine's remote desktop is the only way of managing it and there is no other should access be cut off
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $ts = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $deny = (Get-ItemProperty -Path $ts -Name 'fDenyTSConnections' -ErrorAction Stop).fDenyTSConnections
      if ($deny -eq 1) {
        # Remote Desktop is switched off, so there is no session layer to guard.
        'NOT_APPLICABLE'
      } else {
        $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        $name = 'UserAuthentication'
        if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
        else {
          $item = Get-ItemProperty -Path $path -ErrorAction Stop
          if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    $name = 'UserAuthentication'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sessions already opened are not broken. The condition is weighed at the next
    # connecting, so the session this is run from stays.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    Set-ItemProperty -Path $path -Name 'UserAuthentication' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła jest zapisana tak, by nie krzyczeć na maszynę, która pulpitu
    zdalnego w ogóle nie udostępnia. Gdy usługa jest wyłączona, audyt zwraca
    stan „nie dotyczy" zamiast niezgodności — bo nie ma wtedy czego chronić,
    a czerwony punkt w raporcie byłby tu wyłącznie szumem.

    Wartość jest jednym z najlepszych stosunków zysku do kosztu w całym
    zestawie serwerowym: zamyka drogę dostępną z sieci komuś bez żadnego
    poświadczenia, a jedyną ceną jest sprawdzenie listy klientów.

    Punkt sąsiaduje z regułą o warstwie zabezpieczeń i bywa z nią mylony.
    Ta mówi, kiedy nastąpi uwierzytelnienie; tamta, w co opakowana jest
    sesja. Obie są potrzebne i żadna nie zastępuje drugiej.
  en: |
    The rule is written so as not to shout at a machine that offers no remote
    desktop at all. Where the service is switched off, the audit returns the state
    "not applicable" rather than a non-compliance - since there is then nothing to
    guard, and a red item in the report would here be noise alone.

    The value is one of the best ratios of gain to cost in the whole server set: it
    shuts a road open from the network to somebody with no credential at all, and
    the only price is a reading of the list of clients.

    The item neighbours the rule on the security layer and is at times confused with
    it. This one says when authentication happens; that one says what the session is
    wrapped in. Both are needed and neither stands in for the other.
