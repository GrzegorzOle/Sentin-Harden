id: win10-connected-standby-password-delay-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Odroczenie żądania hasła po wybudzeniu z uśpienia wyłączone
    en: Delay of the password demand after waking from sleep switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Maszyna wybudzona z uśpienia może dać kilka sekund, a nawet kilkadziesiąt, na
    powrót do pracy bez podania hasła. Ustawienie powstało dla wygody: podniesienie
    pokrywy laptopa nie przerywa wtedy toku pracy.

    Okno to jest jednak dokładnie tym momentem, w którym maszyna leży bez opieki.
    Laptop zamknięty i odłożony na biurko albo w pociągu wybudza się po otwarciu
    pokrywy przez kogokolwiek — a przez czas odroczenia oddaje pulpit bez pytania
    o cokolwiek. Nie trzeba tu żadnego ataku, wystarczy podnieść pokrywę.

    Wyłączenie odroczenia sprawia, że wybudzenie zawsze kończy się ekranem
    logowania.
  en: |
    A machine woken from sleep may allow a few seconds, or even a few dozen, for a
    return to work without a password. The setting was made for convenience -
    lifting a laptop s lid then does not break the flow of work.

    That window is, however, exactly the moment when the machine lies unattended. A
    laptop shut and left on a desk or in a train wakes when anybody at all opens
    the lid - and for the length of the delay it hands over the desktop without
    asking for anything. No attack is needed here; lifting the lid is enough.

    Switching the delay off means waking always ends at the sign-in screen.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo jest odczuwalna przy każdym otwarciu pokrywy.
    Ludzie przyzwyczajeni do wracania do pracy bez hasła zgłoszą to jako
    utrudnienie — i będą mieli rację, bo to jest ten koszt.

    Waga tego kosztu zależy od tego, czym się logują. Tam, gdzie działa logowanie
    odciskiem palca albo twarzą, powrót trwa chwilę i nikt nie protestuje. Tam,
    gdzie trzeba wpisać długie hasło kilkanaście razy dziennie, zmiana jest realnie
    uciążliwa.

    Przed wdrożeniem warto więc sprawdzić, czy na stanowiskach przenośnych działa
    szybka droga logowania. Jeżeli nie, lepiej najpierw ją postawić.
  en: |
    The change calls for a review, since it is felt every time a lid is opened.
    People used to returning to work without a password report it as a hindrance -
    and they are right, since that is the cost.

    How heavy that cost is depends on what they sign in with. Where signing in by
    fingerprint or face works, the return takes a moment and nobody protests. Where
    a long password has to be typed a dozen times a day, the change is really
    burdensome.

    Before the rollout it is therefore worth checking whether a quick road to
    signing in works on the portable stations. If not, it is better to put one in
    place first.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Powrót do pracy po otwarciu pokrywy będzie zawsze wymagał podania hasła, kodu albo odcisku palca
      - Na stanowiskach bez szybkiej drogi logowania zmiana jest odczuwalna kilkanaście razy dziennie
      - Użytkownicy zgłoszą to jako utrudnienie, zwłaszcza tam, gdzie hasło jest długie
      - Czas wybudzania maszyny, zachowanie po zamknięciu pokrywy, łączność sieciowa i praca użytkownika pozostają bez zmian
    en:
      - Returning to work after opening the lid always calls for a password, a code or a fingerprint
      - On stations without a quick road to signing in the change is felt a dozen times a day
      - Users report it as a hindrance, especially where the password is long
      - The time the machine takes to wake, its behaviour when the lid is shut, network connectivity and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska przenośne bez działającego logowania odciskiem palca albo twarzą, dopóki taka droga nie zostanie postawiona
      - Maszyny w pomieszczeniach zamkniętych, wybudzane wielokrotnie w ciągu dnia przez tę samą osobę
    en:
      - Portable stations with no working fingerprint or face sign-in, until such a road is put in place
      - Machines in closed rooms, woken many times a day by the same person
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDomainDelayLock'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowDomainDelayLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainDelayLock' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby

notes:
  pl: |
    Ustawienie dotyczy maszyn z nowoczesnym trybem uśpienia i kont domenowych.
    Punkt ocenia się razem z czasem do zablokowania ekranu, bo obie pozycje
    opisują to, jak długo maszyna pozostaje otwarta bez obecności użytkownika.
  en: |
    The setting concerns machines with the modern sleep mode and domain accounts.
    The item is judged together with the time before the screen locks, since both
    describe how long the machine stays open with nobody present.
