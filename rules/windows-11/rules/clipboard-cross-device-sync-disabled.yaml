id: win11-clipboard-cross-device-sync-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > OS Policies
  title:
    pl: Przenoszenie schowka między urządzeniami wyłączone
    en: Carrying the clipboard between devices disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy to, co użytkownik skopiuje na tej maszynie, ma
    być wysłane na zewnątrz i udostępnione jego pozostałym urządzeniom.

    Schowek jest miejscem, przez które przechodzi materiał najbardziej wrażliwy
    w całej pracy, i warto nazwać to wprost zamiast mówić ogólnie o danych.
    Przez schowek przenosi się hasła kopiowane z menedżera haseł, kody
    jednorazowe, klucze dostępu, numery rachunków, fragmenty umów i dokumentów
    przed wysłaniem. Wszystko to trafia tam na chwilę, ale trafia.

    Przy włączonym przenoszeniu każda taka pozycja opuszcza maszynę
    automatycznie, bez pytania i bez śladu widocznego dla użytkownika, i jest
    przechowywana poza nią, aby inne urządzenie mogło ją pobrać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    treści skopiowanych na tej maszynie z każdego innego urządzenia
    powiązanego z tym samym kontem. Przejęcie konta przestaje więc dotyczyć
    samego konta — obejmuje również to, co użytkownik kopiował, w tym
    poświadczenia do systemów zupełnie z kontem niezwiązanych.

    Dochodzi do tego drugi skutek, mniej oczywisty: materiał, którego nikt
    świadomie nigdzie nie wysłał, znajduje się poza maszyną i poza zasięgiem
    reguł, które tę maszynę chronią.
  en: |
    The setting settles whether what the user copies on this machine is to be sent outward
    and made available to their other devices.

    The clipboard is the place through which the most sensitive material in all of one's
    work passes, and that is worth naming outright rather than speaking generally of data.
    Through the clipboard go passwords copied from a password manager, one-time codes,
    access keys, account numbers, pieces of contracts and of documents before they are
    sent. All of it lands there for a moment, but it lands.

    With carrying switched on, each such item leaves the machine automatically, unasked
    and with no trace visible to the user, and is held outside it so that another device
    may fetch it.

    What an attacker gains while the item goes unmet: access to what was copied on this
    machine from every other device tied to the same account. Taking over an account
    therefore stops concerning the account alone - it takes in as well what the user
    copied, credentials to systems wholly unconnected with the account among them.

    A second effect joins it, less obvious: material nobody knowingly sent anywhere is
    outside the machine and beyond the reach of the rules that guard that machine.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś na tej maszynie pracuje na kilku
    urządzeniach naraz i przenosi między nimi treści schowkiem — bo dla tych
    osób zmiana jest odczuwalna od razu.

    Kopiowanie i wklejanie na tej maszynie działa bez żadnej zmiany. Znika
    wyłącznie przenoszenie schowka na inne urządzenie i z innego urządzenia.

    Odczuje to przede wszystkim ktoś, kto kopiuje odnośnik albo fragment
    tekstu na telefonie i wkleja go na komputerze, a także ktoś pracujący
    na dwóch komputerach jednocześnie. Zamiast schowka trzeba będzie użyć
    innej drogi: wiadomości do siebie, pliku w miejscu wspólnym, notatki.

    Historia schowka na samej maszynie, jeżeli jest włączona, działa dalej —
    to osobne ustawienie i ta reguła go nie dotyczy.

    Zmiana nie wymaga restartu. Treści przeniesione wcześniej na inne
    urządzenia pozostają tam, gdzie trafiły; reguła ich nie usuwa.
  en: |
    What needs checking is whether anybody on this machine works on several devices at
    once and carries content between them by the clipboard - since for those people the
    change is felt at once.

    Copying and pasting on this machine works with no change at all. What goes is only the
    carrying of the clipboard to another device and from another device.

    It will be felt above all by somebody who copies a link or a piece of text on a phone
    and pastes it on a computer, and by somebody working on two computers at the same
    time. Instead of the clipboard another route will have to be used: a message to
    oneself, a file in a shared place, a note.

    The clipboard history on the machine itself, if it is switched on, works on - that is
    a separate setting and this rule does not concern it.

    The change takes no restart. Content carried to other devices earlier stays where it
    went; the rule does not remove it.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Skopiowana treść przestaje być dostępna na innych urządzeniach tego użytkownika
      - Wklejenie na tej maszynie treści skopiowanej na telefonie przestaje działać
      - Kopiowanie i wklejanie w obrębie tej maszyny działa bez żadnej zmiany
      - Treści przeniesione wcześniej pozostają tam, gdzie trafiły
    en:
      - Copied content stops being available on the user's other devices
      - Pasting on this machine content copied on a phone stops working
      - Copying and pasting within this machine works with no change at all
      - Content carried earlier stays where it went
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca opiera się na przenoszeniu treści schowkiem między komputerem a telefonem
      - Użytkownik pracuje na dwóch maszynach naraz i nie ma innej drogi przenoszenia treści
    en:
      - The work rests on carrying content by clipboard between computer and phone
      - The user works on two machines at once and has no other route for carrying content
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowCrossDeviceClipboard'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $current = (Get-ItemProperty -Path $path -Name 'AllowCrossDeviceClipboard' -ErrorAction SilentlyContinue).'AllowCrossDeviceClipboard'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowCrossDeviceClipboard'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCrossDeviceClipboard' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła tworzy parę z tą, która dotyczy historii schowka na samej maszynie.
    Różnica jest zasadnicza i warto ją mieć na uwadze przy czytaniu raportu:
    tamta ogranicza to, co zostaje w pamięci maszyny, ta ogranicza to, co
    maszynę opuszcza. Pierwsza dotyczy kogoś, kto do maszyny doszedł, druga —
    kogoś, kto do niej nigdy nie musi dojść.

    Brak wartości nie jest stanem zgodnym. Reguła wymaga zapisania zera
    wprost, bo bez ustawienia decyzję podejmuje użytkownik w ustawieniach
    systemu, a domyślnie mechanizm bywa dostępny.

    Zmiana obejmuje wszystkich użytkowników maszyny i nie da się jej cofnąć
    z poziomu ustawień użytkownika. Przełącznik po prostu przestaje być
    dostępny — i to jest właśnie ta część, którą użytkownik zauważy jako
    pierwszą.
  en: |
    The rule forms a pair with the one about the clipboard history on the machine itself.
    The difference is fundamental and worth bearing in mind when reading the report: that
    one limits what stays in the machine's memory, this one limits what leaves the
    machine. The first concerns somebody who has reached the machine, the second somebody
    who never has to reach it.

    A missing value is not a compliant state. The rule takes writing a zero outright,
    since with no setting the decision falls to the user in the system settings, and by
    default the mechanism is sometimes available.

    The change covers all the machine's users and cannot be undone from the user's
    settings. The switch simply stops being available - and that is the part the user will
    notice first.
