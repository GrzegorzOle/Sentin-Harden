id: win2025-cloud-search-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Wyszukiwanie w zasobach chmurowych wyłączone
    en: Searching cloud resources switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza rozszerzanie wyszukiwania na zasoby chmurowe powiązane
    z kontem zalogowanego użytkownika.

    Kategoria średnia i chcę nazwać, co właściwie dzieje się po włączeniu
    tego mechanizmu, bo nazwa sugeruje, że rozszerza się zakres wyników.
    Rozszerza się coś jeszcze: wpisywana fraza opuszcza maszynę. Żeby
    przeszukać zasób zewnętrzny, trzeba mu powiedzieć, czego się szuka.

    Na serwerze fraza wpisana w wyszukiwanie to zwykle nazwa pliku
    konfiguracyjnego, nazwa udziału, fragment ścieżki, nazwa dziennika
    albo nazwa konta. To nie jest treść, ale jest to bardzo konkretny opis
    tego, co na tej maszynie istnieje i czym ktoś się właśnie zajmuje.
    Strumień takich fraz, zbierany przez czas, mówi o organizacji więcej
    niż niejeden wykaz.

    Druga strona jest symetryczna i równie warta uwagi: wyniki
    przychodzą. Zasób zewnętrzny powiązany z kontem administratora staje
    się przeszukiwalny z poziomu serwera, a więc dostępny każdemu, kto na
    tym serwerze przejmie jego sesję.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pomost
    w obie strony — nazwy z serwera wychodzą, a zawartość konta
    zewnętrznego staje się osiągalna z serwera.
  en: |
    The item switches off the extension of search to cloud resources tied to
    the signed-in user's account.

    The category is medium, and I want to name what actually happens once
    this mechanism is on, because the name suggests the range of results is
    what widens. Something else widens too: the phrase typed leaves the
    machine. To search an outside resource, it has to be told what is being
    looked for.

    On a server a phrase typed into search is usually the name of a
    configuration file, the name of a share, a fragment of a path, the name
    of a log or the name of an account. That is not content, but it is a
    very precise description of what exists on this machine and what
    somebody is busy with at that moment. A stream of such phrases, gathered
    over time, says more about an organisation than many an inventory.

    The other side is symmetrical and just as worth attention: results come
    back. An outside resource tied to an administrator's account becomes
    searchable from the server, and so available to anybody who takes over
    that session on it.

    What an attacker gains while the item goes unmet: a bridge in both
    directions - names leave the server, and the contents of an outside
    account become reachable from it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", chociaż na zwykłym serwerze ta
    zmiana nie zmieni nic i po prostu wyłączy to, czego nikt nie używał.

    Sprawdzenia wymaga jeden przypadek: serwer terminali. Tam ludzie
    pracują na dokumentach i część z nich naprawdę szuka plików
    przechowywanych w zasobie chmurowym swojego konta. Po zmianie
    wyszukiwanie przestanie je znajdować. Pliki nie znikną i nadal da się
    do nich dotrzeć tą samą drogą co zawsze, ale okno wyszukiwania
    przestanie być skrótem, którym były. Ta różnica jest odczuwalna
    i trzeba o niej uprzedzić, zamiast zostawiać ludzi z wrażeniem, że coś
    zginęło.

    Czego to nie psuje — i to jest tutaj ważniejsze niż lista skutków.
    Wyszukiwanie plików na samej maszynie działa bez zmian. Indeks
    lokalny działa. Wyszukiwanie na udziałach sieciowych działa.
    Wyłączamy wyłącznie sięganie poza organizację.

    Rzecz do zapamiętania przy czytaniu sprawozdania: ten punkt leży
    w gałęzi wyszukiwania razem z trzema innymi z tej grupy. Cztery różne
    wartości, cztery różne zachowania, jedna ścieżka — znajoma ścieżka nie
    znaczy, że pozostałe są zrobione.

    Bez przerwy, natychmiast odwracalne.
  en: |
    I keep the class "needs review", although on an ordinary server this
    change will alter nothing and will simply switch off what nobody was
    using.

    One case needs the review: a terminal server. There people work on
    documents and some of them genuinely look for files kept in the cloud
    resource of their account. After the change, search will stop finding
    them. The files will not disappear and can still be reached the same way
    as always, but the search window will stop being the shortcut it was.
    That difference is felt, and people should be warned rather than left
    with the impression that something has been lost.

    What this does not break - and that matters more here than the list of
    effects. Searching for files on the machine itself works unchanged. The
    local index works. Searching on network shares works. What is switched
    off is reaching outside the organisation, and nothing else.

    Something to remember when reading the report: this item lies in the
    search branch together with three others in this group. Four different
    values, four different behaviours, one path - a familiar path does not
    mean the rest are done.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - file-sharing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Na serwerze terminali wyszukiwanie przestanie znajdować pliki przechowywane w zasobie chmurowym konta użytkownika
      - Pliki nie znikną i nadal da się do nich dotrzeć zwykłą drogą, ale okno wyszukiwania przestanie być skrótem
      - Wyszukiwanie plików na samej maszynie, indeks lokalny i wyszukiwanie na udziałach sieciowych działają bez zmian
      - Punkt leży w gałęzi wyszukiwania razem z trzema innymi — znajoma ścieżka nie znaczy, że pozostałe są zrobione
    en:
      - On a terminal server, search stops finding files kept in the cloud resource of a user's account
      - The files do not disappear and can still be reached the ordinary way, but the search window stops being a shortcut
      - Searching for files on the machine itself, the local index and searching network shares work unchanged
      - The item lies in the search branch together with three others - a familiar path does not mean the rest are done
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym ludzie pracują na plikach przechowywanych w zasobach chmurowych swoich kont
    en:
      - The machine is a terminal server where people work on files kept in the cloud resources of their accounts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowCloudSearch'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowCloudSearch'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Searching an outside resource means telling it what is being looked for,
    # so the typed phrase leaves the machine. Local search, the local index and
    # searching network shares are untouched by this.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCloudSearch' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Nazwa sugeruje, że rozszerza się zakres wyników. Rozszerza się coś
    jeszcze: wpisywana fraza opuszcza maszynę, bo żeby przeszukać zasób
    zewnętrzny, trzeba mu powiedzieć, czego się szuka.

    Na serwerze taka fraza to zwykle nazwa pliku konfiguracyjnego, nazwa
    udziału, fragment ścieżki albo nazwa konta. Strumień takich fraz,
    zbierany przez czas, mówi o organizacji więcej niż niejeden wykaz.

    Druga strona jest symetryczna: zasób zewnętrzny powiązany z kontem
    administratora staje się przeszukiwalny z serwera, a więc dostępny
    każdemu, kto przejmie tam jego sesję.
  en: |
    The name suggests the range of results is what widens. Something else
    widens too: the phrase typed leaves the machine, because searching an
    outside resource means telling it what is being looked for.

    On a server such a phrase is usually the name of a configuration file,
    the name of a share, a fragment of a path or the name of an account. A
    stream of such phrases, gathered over time, says more about an
    organisation than many an inventory.

    The other side is symmetrical: an outside resource tied to an
    administrator's account becomes searchable from the server, and so
    available to anybody who takes over that session there.
