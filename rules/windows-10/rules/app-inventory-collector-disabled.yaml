id: win10-app-inventory-collector-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Zbieranie spisu zainstalowanego oprogramowania wyłączone
    en: The gathering of a setting down of laid-on software switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm zgodności, który spisuje zainstalowane
    programy i ich urządzenia, a wynik przekazuje producentowi systemu.

    Spis powstaje po to, żeby producent wiedział, jakie oprogramowanie
    działa na maszynach i mógł przygotować poprawki zgodności przed
    aktualizacją systemu. Cel jest sensowny, a mechanizm działa cicho,
    w tle.

    Zastrzeżenie dotyczy tego, co spis zawiera. Jest to wykaz programów
    zainstalowanych na maszynie wraz z wersjami — czyli dokładnie ten
    zestaw informacji, od którego zaczyna się dobieranie sposobu wejścia.
    Wykaz taki opuszczający maszynę jest wartością sam w sobie, niezależnie
    od tego, kto go odbiera.

    Odnotowuję, że wyłączenie nie psuje samej zgodności programów.
    Mechanizmy dopasowujące zachowanie systemu do starszych programów
    działają dalej — punkt dotyczy wyłącznie spisywania i odsyłania.

    Zastrzegam też, że punkt nie jest zabezpieczeniem przed napastnikiem
    obecnym na maszynie. Ktoś, kto ma na niej dostęp, ten wykaz i tak
    zrobi. Wartością jest ograniczenie tego, co maszyna wysyła sama.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost
    — maszyna wysyła wykaz oprogramowania poza własną sieć.
  en: |
    The setting switches off the mechanism of agreement that sets down laid-on programs and their devices and
    hands the outcome to the system's maker.

    The setting down comes about so that the maker should know what software works upon the machines and might
    make ready patches of agreement before the system is brought up to date. The end is sound and the mechanism
    works quietly, in the background.

    The reservation touches what the setting down holds. It is a roll of the programs laid on upon the machine
    together with their versions - which is to say just that set of word with which the choosing of a way in
    begins. Such a roll leaving the machine is a worth of itself, whoever may take it.

    I set down that the switching off breaks not the agreement of programs itself. The mechanisms fitting the
    system's bearing to older programs work on - the item touches solely the setting down and the sending back.

    I set down besides that the item is no guard against an attacker already upon the machine. Whoever has a reach
    of it will make that roll in any case. The worth lies in the bounding of what the machine sends of itself.

    What an attacker gains while the item goes unmet: nothing outright - the machine sends a roll of its software
    beyond its own network.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana dotyczy wyłącznie spisywania i wysyłania. Nic, co użytkownik
    robi na maszynie, nie zmienia się w sposób dla niego widoczny.

    Odnotowuję jedyne miejsce warte uwagi: narzędzia planowania
    aktualizacji korzystające z danych zgodności po stronie producenta.
    Jeżeli organizacja z takiego narzędzia korzysta i opiera na nim
    przygotowanie aktualizacji, po zmianie maszyna przestanie zasilać je
    danymi i raport stanie się niepełny.

    Jest to zastrzeżenie dotyczące narzędzia po stronie obsługi, a nie
    pracy użytkownika. Warto sprawdzić, zanim punkt zostanie wdrożony
    hurtem na wszystkich maszynach.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: zgodności starszych programów, ich uruchamiania,
    aktualizowania systemu, sklepu systemowego, logowania, drukowania.
  en: |
    The class is "no disruption".

    The change touches solely the setting down and the sending. Nothing the user does upon the machine changes in
    a manner plain to them.

    I set down the one place worth notice: tools of the planning of updates that draw upon data of agreement held
    by the maker. If a body uses such a tool and rests the making ready of updates upon it, after the change the
    machine will cease to feed it with data and the report will become wanting.

    It is a reservation touching a tool upon the keepers' side and not the user's work. It is worth looking into
    before the item is rolled out in bulk upon every machine.

    The consequence shows at once, with no restart.

    What this does not break: the agreement of older programs, the setting of them going, the bringing of the
    system up to date, the system's store, logging on, or printing.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia planowania aktualizacji korzystające z danych zgodności po stronie producenta przestaną dostawać dane z tej maszyny
      - Raport takiego narzędzia stanie się niepełny, co warto sprawdzić przed wdrożeniem hurtowym
      - Zgodność starszych programów działa dalej, bo punkt dotyczy wyłącznie spisywania i odsyłania
      - Nic z tego, co użytkownik robi na maszynie, nie zmienia się w sposób dla niego widoczny
      - Uruchamianie programów, aktualizowanie systemu, sklep systemowy, logowanie i drukowanie pozostają bez zmian
    en:
      - Tools of the planning of updates drawing upon data of agreement held by the maker will cease to get data from this machine
      - The report of such a tool will become wanting, which is worth looking into before a rollout in bulk
      - The agreement of older programs works on, the item touching solely the setting down and the sending back
      - Nothing of what the user does upon the machine changes in a manner plain to them
      - The setting of programs going, the bringing of the system up to date, the system s store, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Przygotowanie aktualizacji opiera się na narzędziu planowania zasilanym danymi zgodności z maszyn
    en:
      - The making ready of updates rests upon a tool of planning fed with data of agreement from the machines
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableInventory'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'DisableInventory'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableInventory' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/planning/compatibility-administrator-users-guide

notes:
  pl: |
    Reguła jest z tych, w których warto powiedzieć wprost, czego nie
    robi. Nie broni przed napastnikiem obecnym na maszynie — ten wykaz
    oprogramowania zrobi sam. Ogranicza to, co maszyna wysyła z siebie
    bez pytania.

    Argument wart zachowania dotyczy treści spisu. Wykaz programów wraz
    z wersjami to dokładnie ten zestaw, od którego zaczyna się dobieranie
    sposobu wejścia. Nie zmienia tego fakt, że odbiorcą jest producent
    systemu: wartość wykazu nie zależy od tego, kto go trzyma.

    Odnotowuję, że zgodność starszych programów działa dalej. Warto to
    wymienić, bo nazwa ustawienia bywa czytana jako wyłączenie całego
    mechanizmu zgodności, a dotyczy wyłącznie spisywania.
  en: |
    The rule is of those where it is well to say outright what it does not do. It guards not against an attacker
    already upon the machine - they will make that roll of software themselves. It bounds what the machine sends
    of itself unasked.

    The argument worth keeping touches the content of the setting down. A roll of programs together with their
    versions is just that set with which the choosing of a way in begins. It is not altered by the taker being the
    system's maker: a roll's worth hangs not upon who holds it.

    I set down that the agreement of older programs works on. It is worth naming, the setting's name being at
    times read as a switching off of the whole mechanism of agreement, while it touches solely the setting down.
