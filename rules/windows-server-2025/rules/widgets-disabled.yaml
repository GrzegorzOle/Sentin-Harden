id: win2025-widgets-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Widgets
  title:
    pl: Panel widżetów na pasku zadań wyłączony
    en: The widgets panel on the taskbar switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza panel widżetów — powierzchnię na pasku zadań pokazującą
    treści pobierane z sieci.

    Kategoria średnia i chcę nazwać, czym ten panel jest z punktu widzenia
    maszyny, bo wygląda na ozdobę. Jest oknem przeglądarki bez paska adresu.
    Wyświetla treść pobraną z zewnątrz, odświeża ją sama z siebie i robi to
    bez żadnego działania użytkownika — a treść, która przychodzi, zawiera
    również materiały reklamowe, czyli rzeczy podawane przez pośredników,
    nie przez jednego dostawcę.

    To jest właściwa treść punktu. Powierzchnia, która sama z siebie pobiera
    i wyświetla cudzą treść, jest kanałem wejścia, niezależnie od tego, jak
    niewinnie wygląda. Kliknięcie w taką treść otwiera stronę — a na
    serwerze otwiera ją sesja administratora.

    Osobno waży to, że panel działa stale. Nie trzeba go otwierać, żeby
    pobierał; wystarczy, że jest. Maszyna nawiązuje więc połączenia
    wychodzące, których nikt nie zamawiał, i robi to również wtedy, gdy przy
    konsoli nikogo nie ma.

    Na serwerze nie ma dla tego panelu zastosowania, które dałoby się
    obronić.

    Uwaga na ścieżkę: ostatni człon klucza jest krótkim skrótem niemającym
    nic wspólnego z nazwą panelu. To miejsce łatwo przeoczyć przy przeglądzie
    rejestru.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: powierzchnię
    wyświetlającą cudzą treść w sesji administratora serwera, odświeżaną
    bez niczyjego udziału.
  en: |
    The item switches off the widgets panel - the surface on the taskbar
    showing content fetched from the network.

    The category is medium, and I want to name what this panel is from the
    machine's point of view, because it looks like an ornament. It is a
    browser window without an address bar. It displays content fetched from
    outside, refreshes it by itself and does so without any action by the
    user - and the content arriving includes advertising material, that is,
    things served by intermediaries rather than by a single provider.

    That is the real substance of the item. A surface that by itself fetches
    and displays somebody else's content is a way in, however innocent it
    looks. Clicking such content opens a page - and on a server it is an
    administrator's session that opens it.

    It weighs separately that the panel works constantly. It does not have to
    be opened in order to fetch; it is enough that it is there. The machine
    therefore makes outgoing connections nobody asked for, and does so also
    when there is nobody at the console.

    On a server there is no use for this panel that could be defended.

    Mind the path: the key's last element is a short abbreviation with
    nothing in common with the panel's own name. It is easy to overlook when
    reviewing the registry.

    What an attacker gains while the item goes unmet: a surface displaying
    somebody else's content in the session of a server's administrator,
    refreshed without anybody's involvement.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie ma tu nic do stracenia. Panel
    na wydaniu serwerowym zwykle nie występuje, a gdzie występuje, jego
    usunięcie z paska zadań nie dotyka niczego poza wyglądem.

    Skutek: pasek zadań traci jedną ikonę i jedną powierzchnię. Żadna
    aplikacja, usługa ani rola nie zależy od jej obecności.

    Czego to nie psuje: paska zadań jako takiego, powiadomień systemowych,
    przeglądarki, pogody sprawdzanej świadomie ani niczego, co ktoś otwiera
    sam.

    Rzecz do zapamiętania przy sprawdzaniu: ostatni człon ścieżki jest
    krótkim skrótem, niepodobnym do nazwy panelu. Szukając tego wpisu po
    nazwie funkcji, nie znajdziesz go.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption" and on a server there is nothing to lose.
    The panel is usually absent from the server edition, and where it is
    present, removing it from the taskbar touches nothing beyond appearance.

    The effect: the taskbar loses one icon and one surface. No application,
    service or role depends on its presence.

    What this does not break: the taskbar as such, system notifications, the
    browser, weather checked deliberately, or anything somebody opens
    themselves.

    Something to remember when checking: the path's last element is a short
    abbreviation, unlike the panel's name. Looking for this entry by the
    feature's name will not find it.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Pasek zadań traci jedną ikonę i jedną powierzchnię, a żadna aplikacja ani rola nie zależy od jej obecności
      - Pasek zadań jako taki, powiadomienia systemowe i przeglądarka działają bez zmian
      - Maszyna przestaje nawiązywać połączenia wychodzące, których nikt nie zamawiał, także przy pustej konsoli
      - Ostatni człon ścieżki jest krótkim skrótem, niepodobnym do nazwy panelu — po nazwie funkcji wpisu nie znajdziesz
    en:
      - The taskbar loses one icon and one surface, and no application or role depends on its presence
      - The taskbar as such, system notifications and the browser work unchanged
      - The machine stops making outgoing connections nobody asked for, including when the console is empty
      - The path's last element is a short abbreviation unlike the panel's name - looking by the feature's name will not find it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym panel widżetów jest używanym i uzgodnionym źródłem informacji
    en:
      - The machine is a workstation where the widgets panel is a used and agreed source of information
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key's last element is a short name unrelated to the panel's own.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh'
      $name = 'AllowNewsAndInterests'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh'
    $name = 'AllowNewsAndInterests'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The panel is a browser window without an address bar: it fetches and
    # refreshes somebody else's content by itself, including when nobody is at
    # the console, and a click on that content opens a page in an administrator's
    # session. The key's last element is a short abbreviation, not the name.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowNewsAndInterests' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-windows-widgets

notes:
  pl: |
    Wygląda na ozdobę, a jest oknem przeglądarki bez paska adresu:
    wyświetla treść pobraną z zewnątrz, odświeża ją sama z siebie i robi to
    bez żadnego działania użytkownika.

    Panel działa stale — nie trzeba go otwierać, żeby pobierał. Maszyna
    nawiązuje połączenia wychodzące, których nikt nie zamawiał, także gdy
    przy konsoli nikogo nie ma. Kliknięcie w treść otwiera stronę w sesji
    administratora.

    Uwaga na ścieżkę: ostatni człon klucza jest krótkim skrótem niemającym
    nic wspólnego z nazwą panelu. Szukając po nazwie funkcji, nie znajdziesz
    go.
  en: |
    It looks like an ornament, yet it is a browser window without an address
    bar: it displays content fetched from outside, refreshes it by itself and
    does so without any action by the user.

    The panel works constantly - it does not have to be opened in order to
    fetch. The machine makes outgoing connections nobody asked for, including
    when there is nobody at the console. A click on the content opens a page
    in an administrator's session.

    Mind the path: the key's last element is a short abbreviation with
    nothing in common with the panel's name. Looking by the feature's name
    will not find it.
