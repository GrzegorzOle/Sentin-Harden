id: win2025-event-collector-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zbierania dzienników z innych maszyn wyłączona
    en: The service collecting logs from other machines disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę zbierającą zdarzenia przesyłane przez inne
    maszyny. Usługa ta nasłuchuje na połączenia i przyjmuje dzienniki
    z maszyn, którym kazano je tutaj odsyłać.

    Zostawiam kategorię średnią i chcę powiedzieć, co ją wyznacza, bo nie
    jest to samo nasłuchiwanie. Maszyna, która zbiera dzienniki, trzyma
    u siebie zapis tego, co działo się gdzie indziej. Jest to zbiór
    o wartości podwójnej: mówi napastnikowi, co inne maszyny widziały,
    i jest jedynym miejscem, w którym jego własne ślady istnieją
    w kopii poza maszyną, na której je zostawił.

    Zbieranie dzienników jest przy tym mechanizmem obronnym, a nie
    powierzchnią ataku w zwykłym rozumieniu — i to jest powód, dla
    którego nie idę wyżej. Punkt ten nie mówi „to jest niebezpieczne".
    Mówi „to nie powinno działać tam, gdzie nie zostało do tego
    przeznaczone", bo usługa nasłuchująca bez powodu jest usługą
    nasłuchującą bez powodu, niezależnie od tego, do czego służy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: usługę
    przyjmującą połączenia na maszynie, która nie została zbierającą
    dziennik i nikt jej tak nie pilnuje.
  en: |
    The item switches off the service that gathers happenings sent over by other machines. That
    service listens for bindings and takes in day-books off machines that were bidden to send them
    hither.

    I leave the category middling and would say what marks it out, it being not the listening itself.
    A machine that gathers day-books keeps by it a writing of what befell elsewhere. It is a holding
    of a twofold worth - it tells an attacker what other machines saw, and it is the one stead wherein
    their own traces are in a copy off the machine whereon they left them.

    The gathering of day-books is withal a working of warding and no face of an attack in the common
    understanding - and that is the ground whereof I go no higher. This item says not "this is
    unsafe". It says "this should not work where it was not set to work", a service that listens
    without ground being a service that listens without ground, whatever it be good for.

    What an attacker gains while the item goes unmet - a service taking bindings upon a machine that
    was never made a gatherer of day-books and that nobody watches as one.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia wobec oceny dla stacji
    roboczej i jest to kolejny przypadek usługi, która bywa rolą — ale
    rolą szczególną, bo jej utrata nie objawia się niczym.

    Jeżeli ta maszyna jest punktem zbierania dzienników z innych maszyn,
    zatrzymanie usługi kończy zbieranie natychmiast. Nie pojawia się
    żaden błąd. Maszyny odsyłające nie zgłaszają, że nie mają dokąd
    odsyłać — po prostu przestają być słyszane. Dziennik, który się nie
    zbiera, wygląda na tablicy tak samo jak dziennik, w którym nic się
    nie dzieje, a to jest różnica, o którą pyta każdy audyt i której nie
    da się uzupełnić wstecz. Zdarzenia z czasu po zmianie nie trafią
    nigdzie i nie odzyskasz ich, uruchamiając usługę tydzień później.

    Tam, gdzie maszyna jest zbierającą, właściwym wynikiem pracy z tą
    regułą jest zapisany wyjątek z uzasadnieniem i datą przeglądu, a nie
    naprawa. Zabezpieczenia stawia się wtedy wokół samej usługi —
    ograniczeniem źródeł i dostępu — a nie przez jej wyłączenie.

    Sprawdzenie jest jednoznaczne i zajmuje chwilę: wypisz subskrypcje
    zdefiniowane na tej maszynie. Pusta lista znaczy, że usługa nasłuchuje
    bez powodu i zmiana jest czysta. Lista niepusta znaczy, że masz przed
    sobą punkt zbierania i trzeba to zapisać, zanim cokolwiek zatrzymasz.

    Zmiana cofa się natychmiast, ale zebrane w międzyczasie zdarzenia
    nie wracają.
  en: |
    I raise the class to a witting rolling out against the reckoning for a workstation, and it is
    another case of a service that at times is the role - but a role of an odd kind, its loss showing
    itself by nothing.

    If that machine be the stead of the gathering of day-books off other machines, the stopping of the
    service ends the gathering at once. No fault comes forth. The machines that send give no word that
    they have nowhere to send to - they simply stop being heard. A day-book that is not gathered looks
    upon the board the same as a day-book wherein nothing befalls, and that is the difference every
    looking over asks after and that may not be filled in after the fact. The happenings of the time
    after the change will go nowhere and you will not win them back by starting the service a week
    later.

    Where the machine is the gatherer, the right outcome of the work with this rule is a written-down
    exception with a standing by it and a day of looking over, and not a mending. The warding is then
    set about the service itself - by a bounding of the springs and of the reach - and not by its
    switching off.

    The checking is of one meaning and takes a moment - write out the takings set down upon that
    machine. An empty list means the service listens without ground and the change is clean. A list
    not empty means you have before you a stead of gathering and it must be written down before you
    stop anything.

    The change is undone at once, but the happenings gathered in the meanwhile come not back.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Zbieranie dzienników z innych maszyn kończy się natychmiast i bez żadnego błędu
      - Maszyny odsyłające nie zgłaszają, że nie mają dokąd odsyłać, tylko przestają być słyszane
      - Dziennik, który się nie zbiera, wygląda tak samo jak dziennik, w którym nic się nie dzieje
      - Zdarzenia z czasu po zmianie nie trafią nigdzie i nie da się ich uzupełnić wstecz
      - Uruchomienie usługi tydzień później nie odzyskuje tego, co przepadło
    en:
      - The gathering of day-books off other machines ends at once and with no fault at all
      - The machines that send give no word that they have nowhere to send to, they simply stop being heard
      - A day-book that is not gathered looks the same as a day-book wherein nothing befalls
      - The happenings of the time after the change will go nowhere and may not be filled in after the fact
      - The starting of the service a week later wins not back what was lost
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest punktem zbierania dzienników z innych maszyn i ma zdefiniowane subskrypcje
      - Nie wypisano subskrypcji zdefiniowanych na tej maszynie
    en:
      - The machine is the stead of the gathering of day-books off other machines and has set-down takings
      - The takings set down upon that machine were not written out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # List the subscriptions defined here first. Stopping the service ends the
    # collection of events from other machines; events from the time after the
    # change will go nowhere and cannot be filled in afterwards.
    Stop-Service -Name 'Wecsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Wecsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Wecsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wec/windows-event-collector

