id: win11-gaming-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa uwierzytelniania w platformie gier wyłączona
    en: The authentication service of the gaming platform disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa uwierzytelnia maszynę i użytkownika wobec platformy gier: utrzymuje
    znacznik zalogowania, odnawia go i udostępnia programom, które go żądają.

    Kategoria ryzyka jest tu niska i nie ma powodu podnosić jej sztucznie.
    Usługa nie przyjmuje połączeń z sieci, nie wystawia portu i nie wykonuje
    poleceń z zewnątrz. Wszystko, co robi, dzieje się z inicjatywy maszyny.

    Wartość punktu leży w tym, co usługa utrzymuje. Jest to tożsamość osobista
    użytkownika, zwykle konto prywatne, powiązane z jego danymi poza
    organizacją, i ta tożsamość zostaje na maszynie służbowej razem ze
    znacznikiem pozwalającym z niej korzystać. Z punktu widzenia porządku
    w kontach jest to obecność, której nikt nie planował.

    Drugi powód jest zwyczajny: usługa działa stale i sięga do sieci, żeby
    odnawiać znacznik, czyli utrzymuje kanał wychodzący, który istnieje bez
    związku z pracą wykonywaną na maszynie. Na stanowisku służbowym platforma
    gier nie jest do niczego potrzebna, a składniki, które ją obsługują, są
    powierzchnią bez zastosowania.
  en: |
    The service authenticates the machine and the user to the gaming platform: it keeps
    up a sign-in token, renews it and makes it available to programs that ask for it.

    The risk category here is low and there is no reason to raise it artificially. The
    service takes no connections from the network, puts out no port and carries out no
    commands from outside. All it does happens on the machine's initiative.

    The item's worth lies in what the service keeps up. It is the user's personal
    identity, usually a private account, tied to their data outside the organisation, and
    that identity stays on a work machine along with a token allowing it to be used. As
    far as order among accounts goes, it is a presence nobody planned for.

    The second reason is ordinary: the service runs all the time and reaches out to the
    network to renew the token, that is it keeps up an outgoing channel existing with no
    bearing on the work done on the machine. At a work station the gaming platform is
    needed for nothing, and the components serving it are surface with no use.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie działa cokolwiek korzystającego
    z tożsamości platformy gier — a bywa to szersze niż same gry.

    Gry pobrane ze sklepu systemowego przestaną się uruchamiać albo uruchomią
    się bez zapisu stanu i bez rozgrywki przez sieć. Na stanowisku służbowym
    jest to skutek zamierzony i nie wymaga dyskusji.

    Sprawdzić natomiast warto dwie rzeczy mniej oczywiste. Pierwsza to programy
    ze sklepu systemowego, które nie są grami, ale korzystają z tej samej
    warstwy tożsamości do logowania użytkownika — jest to rozwiązanie rzadkie,
    lecz spotykane w programach wydanych przez tego samego producenta.

    Druga to stanowiska nietypowe: maszyny do prezentacji, stanowiska
    szkoleniowe i komputery w świetlicach, na których gry bywają dopuszczone
    celowo. Tam zmiana jest odczuwalna i decyzja należy do osoby
    odpowiedzialnej za takie stanowisko.

    Na zwykłym stanowisku biurowym zmiana zwykle nie robi nic zauważalnego.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anything using the gaming platform's identity runs on
    the machine - and that is sometimes wider than games alone.

    Games fetched from the system store will stop starting, or will start with no saving
    of progress and no play over the network. At a work station that is an intended
    effect and calls for no discussion.

    Two less obvious things are worth checking, though. The first is programs from the
    system store that are not games but use the same identity layer to sign the user in -
    a rare arrangement, but met with in programs released by the same maker.

    The second is unusual stations: presentation machines, training stations and
    computers in common rooms, where games are sometimes allowed on purpose. There the
    change is felt and the decision belongs to whoever is responsible for such a station.

    At an ordinary office station the change usually does nothing noticeable.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Gry ze sklepu systemowego nie zalogują użytkownika do platformy i nie uruchomią rozgrywki przez sieć
      - Program ze sklepu korzystający z tej samej warstwy tożsamości nie zaloguje użytkownika
      - Stanowisko szkoleniowe albo świetlicowe z dopuszczonymi grami traci tę możliwość
      - Na zwykłym stanowisku biurowym nie zmienia się nic zauważalnego
    en:
      - Games from the system store will not sign the user in to the platform and will not start network play
      - A store program using the same identity layer will not sign the user in
      - A training or common room station with games allowed loses that possibility
      - At an ordinary office station nothing noticeable changes
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko jest przeznaczone do prezentacji albo szkoleń z dopuszczonymi grami
      - Program ze sklepu systemowego loguje użytkownika przez tę warstwę tożsamości
    en:
      - The station is meant for presentations or training with games allowed
      - A program from the system store signs the user in through this identity layer
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XblAuthManager' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XblAuthManager' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XblAuthManager' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła należy do czwórki opisującej platformę gier: uwierzytelnianie,
    zapis stanu rozgrywki, obsługa urządzeń sterujących i łączność sieciowa.
    Wyniki tych czterech reguł warto czytać razem — składniki są ze sobą
    powiązane i pozostawienie jednego włączonego zwykle znaczy, że platforma
    na maszynie pozostała.

    Punkt nie usuwa gier ani nie blokuje ich instalowania ze sklepu
    systemowego. Jeżeli celem jest niedopuszczenie do ich obecności na
    stanowisku, właściwym narzędziem są reguły dotyczące sklepu i uruchamiania
    programów, a nie ta.

    Wyłączenie usługi nie usuwa tożsamości zapisanej wcześniej na maszynie.
    Po cofnięciu zmiany logowanie działa znów bez wprowadzania poświadczeń
    od nowa.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The rule belongs to a quartet describing the gaming platform: authentication, saving
    the state of play, handling controllers and network connectivity. The results of
    these four rules are worth reading together - the components are tied to one another
    and leaving one running usually means the platform has stayed on the machine.

    The item removes no games and does not block their installation from the system
    store. If the aim is to keep them off the station, the right tools are the rules about
    the store and about running programs, not this one.

    Disabling the service does not remove an identity saved on the machine earlier. Once
    the change is undone, signing in works afresh with no credentials entered again.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
