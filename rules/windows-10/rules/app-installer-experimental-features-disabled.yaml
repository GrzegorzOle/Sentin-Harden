id: win10-app-installer-experimental-features-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Funkcje eksperymentalne instalatora pakietów wyłączone
    en: The trial features of the installer of packages switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza w instalatorze pakietów funkcje oznaczone przez
    producenta jako eksperymentalne.

    Funkcje takie są w narzędziu obecne, ale nieukończone. Nie przeszły
    pełnego cyklu przeglądu, ich zachowanie zmienia się między wydaniami,
    a część z nich jest w ogóle wycofywana. Włącza się je pojedynczo,
    po nazwie, zwykle po to, żeby sprawdzić coś, czego narzędzie jeszcze
    oficjalnie nie umie.

    Zagrożenie nie polega na tym, że któraś z nich jest szkodliwa. Polega
    na tym, że zestaw jest zmienny i nieopisany. Funkcja włączona
    w wydaniu bieżącym może w następnym zmienić znaczenie albo objąć
    przypadek, o którym nikt przy włączaniu nie pomyślał.

    Dla narzędzia pobierającego i instalującego oprogramowanie z sieci
    jest to warunek niedobry. Zachowanie takiego narzędzia powinno być
    przewidywalne w każdym wydaniu, bo na nim opiera się kontrola tego,
    co wchodzi na maszynę.

    Odnotowuję, że punkt nie odbiera żadnej funkcji ukończonej. Wyłącza
    wyłącznie te, które producent sam oznaczył jako niegotowe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    do zachowań narzędzia nieopisanych i zmiennych między wydaniami.
  en: |
    The setting switches off in the installer of packages the features marked by the maker as being upon trial.

    Such features stand in the tool but are unfinished. They went not through the full round of review, their
    bearing shifts between issues, and some of them are drawn back altogether. They are turned on one by one, by
    name, commonly so that something the tool cannot yet do in form may be looked at.

    The danger rests not in any of them being harmful. It rests in the set being shifting and unset out. A feature
    turned on in the standing issue may in the next change its meaning or take in a case nobody thought of at the
    turning on.

    For a tool drawing and laying on software out of the network that is a poor state of things. The bearing of
    such a tool ought to be foreseeable in every issue, the control of what comes upon the machine resting upon
    it.

    I set down that the item takes away no finished feature. It switches off solely those the maker themselves
    marked as unready.

    What an attacker gains while the item goes unmet: a reach for bearings of the tool unset out and shifting
    between issues.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś korzysta z funkcji włączonej po nazwie.

    Miejscem wartym uwagi są zespoły, które sięgnęły po funkcję
    eksperymentalną, bo rozwiązywała ich problem wcześniej niż wydanie
    oficjalne. Po zmianie przestanie działać, a polecenie, które na niej
    stało, zwróci błąd o nieznanej opcji.

    Odnotowuję, że wykaz funkcji włączonych da się odczytać z ustawień
    narzędzia przed wdrożeniem. Na stanowisku, na którym nikt niczego
    świadomie nie włączał, punkt nie zmienia nic.

    Skutek pojawia się natychmiast, bez restartu, i jest niewidoczny dla
    osoby, która z takich funkcji nie korzystała.

    Czego to nie psuje: zwykłego instalowania pakietów, wyszukiwania
    w repozytoriach, aktualizowania, programów już zainstalowanych,
    drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody uses a feature turned on by name.

    The place worth notice is teams that reached for a feature upon trial because it answered their trouble sooner
    than the issue in form. After the change it will cease to work, and a command that stood upon it will give
    back a fault of an unknown choice.

    I set down that the roll of features turned on may be read from the tool's settings before the rollout. Upon a
    station where nobody knowingly turned anything on the item changes nothing.

    The consequence shows at once, with no restart, and is unseen by whoever used no such features.

    What this does not break: the ordinary laying on of packages, the seeking in stores, the bringing up to date,
    programs already laid on, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Funkcja eksperymentalna włączona po nazwie przestanie działać, a polecenie na niej oparte zwróci błąd o nieznanej opcji
      - Zespoły, które sięgnęły po taką funkcję zamiast czekać na wydanie oficjalne, będą musiały wrócić do drogi zwykłej
      - Wykaz funkcji włączonych da się odczytać z ustawień narzędzia przed wdrożeniem
      - Na stanowisku, na którym nikt niczego świadomie nie włączał, zmiana nie robi nic
      - Zwykłe instalowanie pakietów, wyszukiwanie w repozytoriach, aktualizowanie i drukowanie pozostają bez zmian
    en:
      - A feature upon trial turned on by name will cease to work, and a command resting upon it will give back a fault of an unknown choice
      - Teams that reached for such a feature rather than wait for the issue in form will have to go back to the ordinary road
      - The roll of features turned on may be read from the tool s settings before the rollout
      - Upon a station where nobody knowingly turned anything on the change does nothing
      - The ordinary laying on of packages, the seeking in stores, the bringing up to date and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zespół opiera pracę na funkcji eksperymentalnej i nie ma dla niej odpowiednika w wydaniu oficjalnym
    en:
      - A team rests its work upon a feature upon trial and there is no like of it in the issue in form
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableExperimentalFeatures'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableExperimentalFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableExperimentalFeatures' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Reguła jest oceniona średnio, bo nie zamyka żadnej konkretnej drogi
    wejścia. Warto, żeby aplikacja powiedziała, czemu mimo to warto ją
    wdrożyć: chodzi o przewidywalność narzędzia, na którym stoi kontrola
    tego, co wchodzi na maszynę.

    Argument wart postawienia wprost dotyczy zmienności. Funkcja
    eksperymentalna nie jest opisana wiążąco i może w następnym wydaniu
    znaczyć co innego. Ocena wykonana raz przestaje wtedy obowiązywać,
    a nikt tego nie zauważy, bo nic się formalnie nie zmieniło.

    Odnotowuję, że punkt jest tani do sprawdzenia. Wykaz funkcji
    włączonych odczytuje się z ustawień narzędzia, więc da się przed
    wdrożeniem stwierdzić, czy ktokolwiek cokolwiek stracił.
  en: |
    The rule is graded middling, closing no one road in. It is well that the application say why it is worth
    rolling out all the same: what is at stake is the foreseeableness of a tool upon which rests the control of
    what comes upon the machine.

    The argument worth putting outright touches the shifting. A feature upon trial is not set out bindingly and
    may in the next issue mean another thing. A grading made once then ceases to hold, and nobody will mark it,
    nothing having changed in form.

    I set down that the item is cheap to look into. The roll of features turned on is read from the tool's
    settings, so it may be told before the rollout whether anybody has lost anything at all.
