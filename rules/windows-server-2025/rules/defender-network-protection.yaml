id: win2025-defender-network-protection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Network Protection
  title:
    pl: Ochrona sieciowa w trybie blokowania
    en: Network protection in blocking mode
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ochrona sieciowa zatrzymuje połączenia wychodzące do adresów
    uznanych za złe. Nie pyta, jaki program je nawiązuje — pyta, dokąd
    prowadzą. Jest to więc mechanizm działający wtedy, gdy wszystkie
    wcześniejsze już zawiodły: kod się uruchomił i próbuje się
    odezwać.

    Na serwerze wartość tego mechanizmu leży w jednym miejscu i warto je
    wskazać dokładnie, bo od niego zależy ocena. Serwer bywa maszyną,
    na której napastnik siedzi długo. Nie musi nic pobierać ani nikogo
    oszukiwać — musi tylko utrzymać łączność z tym, co nim steruje.
    Odcięcie tej łączności jest zdjęciem trwałości, a nie zdjęciem
    wejścia.

    Zostawiam kategorię wysoką. Mechanizm istotnie utrudnia rozwinięcie
    ataku, ale nie zamyka drogi wejścia i opiera się na wiedzy
    o adresach, czyli na czymś, co się starzeje. Napastnik, któremu na
    tym zależy, zmienia adres.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: swobodną
    drogę wyjścia z serwera — do sterowania, do wyniesienia danych, do
    pobrania kolejnego narzędzia.
  en: |
    The guard of the net stops outgoing bindings to addresses held to be ill. It asks not what
    program makes them - it asks whither they lead. It is therefore a working that works where all
    the earlier ones have already failed - the code has run and is trying to speak up.

    On a server the worth of this working lies in one place, and it is worth pointing at exactly,
    the reckoning hanging upon it. A server is at times the machine an attacker sits upon for long.
    They need draw nothing down nor cheat anyone - they need only hold their binding with what
    steers them. The cutting of that binding is the taking away of lastingness and not the taking
    away of an entry.

    I leave the category high. The working does markedly hinder an attack's unfolding, but it shuts
    no road of entry and rests upon a knowing of addresses, that is upon something that grows old.
    An attacker who cares for it alters the address.

    What an attacker gains while the item goes unmet - a free road out of the server, to their
    steering, to the bearing out of data, to the drawing down of the next tool.

disruption_description:
  pl: |
    Klasę podnoszę do świadomego wdrożenia, mimo że sama zmiana jest
    wpisem w rejestrze i cofa się natychmiast. Rzecz w tym, co ten wpis
    robi z ruchem wychodzącym.

    Serwer nawiązuje połączenia wychodzące jako część swojej pracy,
    a nie przy okazji. Odpytuje źródła aktualizacji, serwery licencji,
    bramki płatności, interfejsy partnerów, dostawców poczty,
    repozytoria pakietów. Większość tych adresów nie jest znana
    zespołowi, który zmienia to ustawienie — są wpisane w konfigurację
    aplikacji, czasem wewnątrz zadania sprzed lat.

    Pomyłka w tej grupie wygląda inaczej niż na stacji roboczej i to
    jest tu rzecz do zapamiętania. Na stacji zablokowane połączenie daje
    komunikat i użytkownik dzwoni. Na serwerze nie daje nic. Objawem
    jest nocne przetwarzanie, które się nie rozliczyło, albo interfejs,
    który przestał odbierać. Nikt nie połączy tego ze zmianą sprzed
    dwóch dni, bo zmiana dotyczyła „ochrony", a awaria wygląda na
    sieciową.

    Kolejność jest więc taka sama jak przy regułach ograniczania
    powierzchni ataku i równie obowiązkowa: najpierw tryb obserwacji
    przez pełny cykl pracy maszyny, potem przegląd tego, co by zostało
    zablokowane, dopiero potem blokowanie. Pełnym cyklem serwera bywa
    miesiąc, bo zamknięcie okresu wywołuje połączenia, których nie widać
    w żadnym zwykłym dniu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    I raise the class to a witting rolling out, though the change itself is an entry in the registry
    and is undone at once. The matter is what that entry does with the outgoing traffic.

    A server makes outgoing bindings as a share of its work and not by the way. It asks of the
    wellsprings of freshenings, the servers of leave, the gates of payment, the meeting places of
    partners, the givers of post, the storehouses of bundles. Most of those addresses are unknown to
    the team altering the setting - they are written into the setting up of the application,
    sometimes within a task from years back.

    A mistake in this group looks otherwise than on a workstation, and that is here the thing to
    bear in mind. On a workstation a blocked binding gives a word and the user rings. On a server it
    gives nothing. The symptom is a nightly working through that did not settle, or a meeting place
    that stopped taking in. Nobody will bind that to a change of two days back, the change having
    borne on "guarding" and the fault looking like one of the net.

    The order is therefore the same as at the rules of the narrowing of the surface of attack and
    as binding - first the mode of watching through a full round of the machine's work, then the
    looking over of what would have been blocked, and only then the blocking. A server's full round
    is at whiles a month, the closing of the term calling up bindings seen in no ordinary day.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - scripting-and-automation
  what_breaks:
    pl:
      - Połączenia do źródeł aktualizacji, serwerów licencji i interfejsów partnerów mogą zostać zatrzymane
      - Adresy te bywają wpisane w konfigurację aplikacji, czasem wewnątrz zadania sprzed lat
      - Objawem jest nocne przetwarzanie, które się nie rozliczyło, a nie komunikat o zablokowaniu
      - Awaria wygląda na sieciową, więc nikt nie połączy jej ze zmianą sprzed dwóch dni
      - Tryb obserwacji przez pełny cykl jest tu obowiązkowy, a pełnym cyklem serwera bywa miesiąc
    en:
      - Bindings to the wellsprings of freshenings, servers of leave and partners' meeting places can be stopped
      - Those addresses are at times written into the setting up of the application, sometimes within a task from years back
      - The symptom is a nightly working through that did not settle and no word about a blocking
      - The fault looks like one of the net, so nobody will bind it to a change of two days back
      - The mode of watching through a full round is here binding, and a server's full round is at whiles a month
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przeprowadzono trybu obserwacji przez pełny cykl pracy maszyny wraz z zamknięciem okresu
      - Nie zebrano listy adresów wychodzących wpisanych w konfigurację aplikacji stojących na maszynie
    en:
      - The mode of watching was not run through a full round of the machine's work along with the closing of the term
      - No list was gathered of the outgoing addresses written into the setting up of the applications standing on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else { [string][int](Get-MpPreference -ErrorAction Stop).EnableNetworkProtection }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection'
    $name = 'EnableNetworkProtection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Value 2 is the watching mode and is the right first step here; this
    # command writes the blocking mode and belongs after that watching.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableNetworkProtection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/network-protection

notes:
  pl: |
    Mechanizm działa wtedy, gdy wszystkie wcześniejsze zawiodły: kod się
    uruchomił i próbuje odezwać. Na serwerze wartość leży w odcięciu
    trwałości, a nie wejścia — serwer bywa maszyną, na której napastnik
    siedzi długo.

    Kategoria zostaje wysoka, bo mechanizm opiera się na wiedzy
    o adresach, czyli na czymś, co się starzeje.

    Klasa podniesiona do świadomego wdrożenia: serwer nawiązuje
    połączenia wychodzące jako część pracy, a większość tych adresów
    jest wpisana w konfigurację aplikacji, nie znana zespołowi
    zmieniającemu ustawienie. Objawem pomyłki jest przetwarzanie, które
    się nie rozliczyło, a nie komunikat.
  en: |
    The working works where all the earlier ones have failed - the code has run and is trying to
    speak up. On a server the worth lies in the cutting of lastingness and not of an entry - a
    server is at times the machine an attacker sits upon for long.

    The category stays high, the working resting upon a knowing of addresses, that is upon something
    that grows old.

    The class is raised to a witting rolling out - a server makes outgoing bindings as a share of
    its work, and most of those addresses are written into the setting up of the applications and
    unknown to the team altering the setting. The symptom of a mistake is a working through that did
    not settle and no word given.
