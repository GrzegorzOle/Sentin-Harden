id: win11-linux-subsystem-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa podsystemu obcego systemu operacyjnego wyłączona
    en: The service of the foreign operating system subsystem disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zarządza podsystemem pozwalającym uruchamiać na maszynie programy
    napisane dla innego systemu operacyjnego: utrzymuje jego dystrybucje,
    startuje je i pośredniczy w dostępie do plików oraz sieci.

    Jest to pełne środowisko uruchomieniowe działające obok systemu
    gospodarza, z własnym zestawem narzędzi, własnym menedżerem pakietów
    i własnym sposobem uruchamiania procesów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, wynika wprost
    ze słowa „obok". Programy uruchamiane w podsystemie są dla wielu narzędzi
    obserwujących system gospodarza słabo widoczne: nie są zwykłymi procesami
    tego systemu, ich pliki leżą w obrazie podsystemu, a wywołania, które
    wykonują, nie przechodzą przez te same punkty kontroli. Oprogramowanie
    ochronne działające na maszynie widzi je w innym zakresie niż programy
    natywne, a część reguł ograniczających uruchamianie nie obejmuje ich
    w ogóle.

    Drugi zysk jest praktyczny: podsystem przynosi na maszynę gotowy zestaw
    narzędzi sieciowych i narzędzi do pracy z plikami, których na stacji
    roboczej normalnie nie ma. Napastnik nie musi ich dostarczać, bo już tam
    są.

    Osobno liczy się dostęp do plików gospodarza. Podsystem czyta i zapisuje
    dyski maszyny, a uprawnienia w nim nie odpowiadają wprost uprawnieniom
    systemu gospodarza.
  en: |
    The service manages a subsystem allowing programs written for another operating
    system to be run on the machine: it keeps its distributions, starts them and mediates
    access to files and to the network.

    It is a full runtime environment working alongside the host system, with a set of
    tools of its own, a package manager of its own and its own way of starting processes.

    What an attacker gains while the item goes unmet follows straight from the word
    "alongside". Programs run in the subsystem are poorly visible to many tools watching
    the host system: they are not that system's ordinary processes, their files lie in
    the subsystem's image, and the calls they make do not pass through the same points of
    control. Protective software running on the machine sees them to a different extent
    than native programs, and some rules limiting what may be run do not cover them at
    all.

    The second gain is practical: the subsystem brings onto the machine a ready set of
    network and file handling tools that a workstation normally does not have. An
    attacker need not deliver them, because they are already there.

    Access to the host's files counts separately. The subsystem reads and writes the
    machine's disks, and permissions within it do not answer directly to those of the
    host system.

disruption_description:
  pl: |
    To jest zmiana, którą trzeba uzgodnić z osobą pracującą na maszynie,
    a nie wdrożyć i obserwować. Powód jest prosty: podsystem nie trafia na
    maszynę przypadkiem. Jeżeli tam jest, ktoś go zainstalował, bo go
    potrzebuje.

    Po wyłączeniu usługi przestają się uruchamiać wszystkie dystrybucje
    podsystemu naraz. Razem z nimi przestają działać: środowiska
    programistyczne oparte na tym podsystemie, narzędzia budowania
    uruchamiane w nim, kontenery pracujące na jego jądrze oraz skrypty
    wywoływane z systemu gospodarza, ale wykonywane po tamtej stronie.

    Ostatni przypadek jest najłatwiejszy do przeoczenia. Skrypt uruchamiany
    harmonogramem albo z narzędzia budowania wygląda w systemie gospodarza jak
    zwykłe zadanie, a wykonuje się w podsystemie. Po zmianie zakończy się
    błędem, którego treść nie wskaże przyczyny.

    Dane w obrazach dystrybucji nie są usuwane i po cofnięciu zmiany wracają
    w całości.

    Jeżeli podsystem jest podstawowym narzędziem pracy na tym stanowisku,
    właściwym wynikiem bywa świadome odpuszczenie punktu z zapisanym
    uzasadnieniem — wraz z decyzją o tym, jak objąć podsystem obserwacją,
    skoro ma zostać.

    Zmiana wymaga zatrzymania usługi.
  en: |
    This is a change to be agreed with whoever works on the machine, not applied and
    watched. The reason is simple: the subsystem does not land on a machine by accident.
    If it is there, somebody installed it because they need it.

    Once the service is off, every distribution of the subsystem stops starting at once.
    Along with them stop working: development environments resting on this subsystem,
    build tools run in it, containers working on its kernel and scripts called from the
    host system but carried out on the other side.

    That last case is the easiest to overlook. A script started by a schedule or from a
    build tool looks in the host system like an ordinary task while being carried out in
    the subsystem. After the change it will end in an error whose text will not point to
    the cause.

    The data in the distributions' images are not removed and come back whole once the
    change is undone.

    If the subsystem is the main working tool at this station, the proper outcome is
    sometimes deliberately accepting the item with a written reason - along with a
    decision about how to bring the subsystem under watch, since it is to stay.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Wszystkie dystrybucje podsystemu przestają się uruchamiać naraz
      - Środowisko programistyczne oparte na podsystemie przestaje działać
      - Kontenery pracujące na jądrze podsystemu nie wystartują
      - Skrypt wywoływany z systemu gospodarza, a wykonywany w podsystemie, kończy się błędem
    en:
      - Every distribution of the subsystem stops starting at once
      - A development environment resting on the subsystem stops working
      - Containers working on the subsystem's kernel will not start
      - A script called from the host system but carried out in the subsystem ends in an error
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko programisty pracuje w środowisku opartym na tym podsystemie
      - Narzędzie budowania albo zadanie harmonogramu wykonuje się po stronie podsystemu
      - Kontenery uruchamiane na tej maszynie korzystają z jądra podsystemu
    en:
      - A programmer's station works in an environment resting on this subsystem
      - A build tool or a scheduled task is carried out on the subsystem's side
      - Containers run on this machine use the subsystem's kernel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LxssManager'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LxssManager'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service ends every running distribution of the subsystem;
    # work not saved in them will be lost.
    Stop-Service -Name 'LxssManager' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'LxssManager' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'LxssManager' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/wsl/

notes:
  pl: |
    Na maszynie bez zainstalowanego podsystemu usługi nie ma i audyt zwróci
    wynik „nie dotyczy". Jest to przypadek najczęstszy na stanowisku biurowym.

    Wyłączenie usługi nie odinstalowuje podsystemu ani nie usuwa obrazów
    dystrybucji. Zajmują one miejsce na dysku dalej, a po cofnięciu zmiany
    wracają wraz z całą zawartością. Trwałym rozwiązaniem jest odinstalowanie
    funkcji systemu, a nie wyłączenie usługi — reguła tego nie robi i nie
    udaje, że robi.

    Nowsze wydania podsystemu bywają dostarczane jako program ze sklepu
    systemowego i wtedy korzystają z własnych usług, innych niż ta. Wynik
    zgodny tej reguły nie dowodzi więc, że podsystemu na maszynie nie ma —
    dowodzi tylko, że nie działa on tą jedną drogą. Warto o tym pamiętać przy
    czytaniu raportu.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    On a machine with the subsystem not installed the service is absent and the audit
    will return "not applicable". That is the commonest case at an office station.

    Disabling the service neither uninstalls the subsystem nor removes the
    distributions' images. They go on taking up disk space, and once the change is undone
    they come back with all their contents. The lasting solution is to uninstall the
    system feature rather than disable the service - the rule does not do this and does
    not pretend to.

    Newer releases of the subsystem are sometimes delivered as a program from the system
    store and then use services of their own, other than this one. A compliant result for
    this rule therefore does not prove the subsystem is absent from the machine - it
    proves only that it does not work by this one route. That is worth keeping in mind
    when the report is read.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
