id: win10-anonymous-sid-name-translation-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zamiana identyfikatora na nazwę konta bez poświadczeń zablokowana
    en: The turning of an identifier into an account's name without credentials blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje możliwość zapytania maszyny, bez podawania
    poświadczeń, o to, jakiej nazwie konta odpowiada podany identyfikator.

    Punkt wygląda na techniczny i taki bywa oceniany, ale zamyka obejście
    dwóch reguł poprzednich. Zablokowanie wyliczania kont sprawia, że nie
    da się poprosić o listę. Nie sprawia jednak, że nie da się tej listy
    zbudować po kawałku — bo identyfikatory kont nie są losowe.

    Konta wbudowane mają końcówki znane z góry, a konta zakładane później
    dostają numery kolejne, zaczynające się od tysiąca. Wystarczy więc
    zapytać o tysiąc, tysiąc jeden, tysiąc dwa i tak dalej, żeby odtworzyć
    ten sam wykaz, którego reguła sąsiednia zabroniła wydać wprost.

    Blokada zamyka to obejście u źródła. Zapytanie zwraca wtedy odpowiedź
    pustą i lista kont pozostaje niedostępna także tą drogą okrężną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odtworzenia wykazu kont maszyny numer po numerze, mimo zablokowania
    zapytania o wykaz.
  en: |
    The setting blocks the asking of the machine, without credentials being given, what account name answers to
    an identifier laid before it.

    The item looks technical and gets judged so, but it closes a way round the two foregoing rules. Blocking the
    listing of accounts means the list cannot be asked for. It does not mean the list cannot be built up piece
    by piece - accounts' identifiers not being random.

    Built-in accounts have endings known beforehand, and accounts made later get numbers in order, beginning at
    a thousand. It is enough, then, to ask about a thousand, a thousand and one, a thousand and two and so on,
    to make again the very roll the neighbouring rule forbade to be given outright.

    The block closes that way round at its source. The query then returns an empty answer and the list of
    accounts stays out of reach by that roundabout road as well.

    What an attacker gains while the item goes unmet: the means of making the machine's roll of accounts again
    number by number, the query for the roll being blocked notwithstanding.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślną na stanowisku roboczym i reguła zwykle
    potwierdza stan zastany.

    Skutek, gdy wartość była zmieniona, dotyczy wyłącznie relacji zaufania
    z domenami starszymi, sprzed wprowadzenia mechanizmów obecnych. Układ
    taki na stanowisku roboczym nie występuje.

    Nie ma znanych regresji dla pracy codziennej. Zamiana identyfikatorów
    na nazwy dla kont uwierzytelnionych działa dalej bez zmiany — dotyczy
    to wyświetlania właścicieli plików, uprawnień do zasobów i zdarzeń
    w dzienniku.

    Czego to nie psuje: wyświetlania właścicieli plików i uprawnień,
    dziennika zdarzeń, logowania, kont domenowych, udziałów plikowych,
    usług systemowych, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The value called for is the default at a workplace and the rule as a rule confirms the state found.

    The consequence, where the value had been changed, touches trust relationships with older domains alone,
    from before the present mechanisms were brought in. Such an arrangement does not occur at a workplace.

    There are no known regressions for everyday work. The turning of identifiers into names for authenticated
    accounts works on unchanged - that touches the showing of files' owners, the rights upon resources and the
    events in the log.

    What this does not break: the showing of files' owners and of rights, the event log, logging on, domain
    accounts, file shares, system services, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
  what_breaks:
    pl:
      - Relacje zaufania z domenami sprzed wprowadzenia mechanizmów obecnych tracą krok potrzebny do rozpoznania kont
      - Zapytanie o nazwę konta zadane bez poświadczeń zwraca odpowiedź pustą zamiast nazwy
      - Zamiana identyfikatorów na nazwy dla kont uwierzytelnionych działa dalej bez żadnej zmiany
      - Wyświetlanie właścicieli plików, uprawnień do zasobów i zdarzeń w dzienniku pozostaje bez zmian
      - Logowanie, konta domenowe, udziały plikowe oraz usługi systemowe i aplikacje pozostają bez zmian
    en:
      - Trust relationships with domains from before the present mechanisms lose a step needed to recognise accounts
      - A query about an accounts name put without credentials returns an empty answer instead of the name
      - The turning of identifiers into names for authenticated accounts works on without any change
      - The showing of files owners, of rights upon resources and of events in the log stays unchanged
      - Logging on, domain accounts, file shares and system services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna uczestniczy w relacji zaufania z domeną sprzed wprowadzenia mechanizmów obecnych
    en:
      - The machine takes part in a trust relationship with a domain from before the present mechanisms
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LSAAnonymousNameLookup\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^LSAAnonymousNameLookup\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'LSAAnonymousNameLookup'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The turning of identifiers into names for authenticated accounts is
    # untouched - only the query put without credentials ceases to answer.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LSAAnonymousNameLookup = 0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('LSAAnonymousNameLookup = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-allow-anonymous-sidname-translation

notes:
  pl: |
    Reguła wygląda na drobiazg techniczny i tak bywa oceniana, a jest
    domknięciem dwóch reguł poprzednich. Warto, żeby aplikacja pokazywała tę
    trójkę razem, bo dwie pierwsze bez tej trzeciej dają się obejść
    zapytaniami po kolei.

    Rachunek wart postawienia wprost jest prosty: identyfikatory kont nie są
    losowe, tylko kolejne od tysiąca. Kto to wie, odtwarza wykaz kont
    w kilkadziesiąt zapytań. To jedno zdanie tłumaczy całą regułę lepiej niż
    opis mechanizmu.

    Odnotowuję, że jest to jedyna reguła w tym bloku czytana przez zasady
    zabezpieczeń, a nie z rejestru. Kopia zapasowa i wycofanie idą więc
    inną drogą niż przy pozostałych pięciu i warto, żeby aplikacja pokazała
    to w symulacji.
  en: |
    The rule looks a technical trifle and gets judged so, while it is the closing of the two foregoing rules. It
    is well that the application show the three together, the first two without this third being able to be gone
    round by queries put in turn.

    The reckoning worth putting outright is a plain one: accounts' identifiers are not random but run in order
    from a thousand. Whoever knows that makes the roll of accounts again in some tens of queries. That one
    sentence explains the whole rule better than a description of the mechanism.

    Worth noting that it is the only rule in this block read through the security policies rather than from the
    registry. The backup and the rollback therefore go another road than at the other five, and it is well that
    the application show that in the simulation.
