id: win2025-automatic-updates-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update
  title:
    pl: Automatyczne pobieranie i instalowanie aktualizacji włączone
    en: Automatic download and installation of updates enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby maszyna sama pobierała i instalowała aktualizacje.
    Wyłączenie zapisuje się jawnie; brak wpisu oznacza ustawienie domyślne,
    czyli aktualizacje automatyczne, i audyt traktuje ten stan jako zgodny.

    Kategoria wysoka, bo niezainstalowana poprawka nie jest zaniedbaniem
    administracyjnym, tylko otwartą drogą — i to zwykle drogą opisaną
    publicznie, z gotowym narzędziem, dostępną każdemu, kto przeczyta
    ogłoszenie producenta.

    Chcę jednak od razu powiedzieć rzecz, której nie da się ominąć przy
    serwerze, a która na stacji roboczej nie występuje. Dobrze prowadzone
    serwerownie zwykle **nie** pozwalają każdej maszynie sięgać po
    aktualizacje samodzielnie. Aktualizacje idą przez usługę centralną albo
    przez narzędzie do zarządzania poprawkami, które testuje je najpierw,
    wypuszcza pierścieniami i zapisuje, co gdzie trafiło. Włączenie
    automatycznych aktualizacji może taki układ obejść.

    Dlatego czytam ten punkt dwojako. Tam, gdzie mechanizm centralny
    istnieje i działa, właściwym wynikiem bywa zapisany wyjątek
    z uzasadnieniem: maszyna nie aktualizuje się sama, bo aktualizuje ją
    coś innego, i da się to pokazać. Tam, gdzie nic takiego nie działa —
    a to zdarza się częściej, niż wynika z dokumentacji — ten punkt jest
    różnicą między serwerem łatanym a serwerem, który dwa lata temu wypadł
    z procesu i nikt tego nie zauważył.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę
    z lukami opisanymi publicznie, do których narzędzia są gotowe
    i powszechnie dostępne.
  en: |
    The item requires the machine to fetch and install updates by itself.
    Switching this off is written down explicitly; a missing entry means
    the default setting, that is, automatic updates, and the audit treats
    that state as compliant.

    The category is high, because an uninstalled fix is not an
    administrative oversight but an open route - and usually a route
    described publicly, with a ready-made tool, available to anybody who
    reads the maker's announcement.

    I want to say at once, though, a thing that cannot be avoided on a
    server and does not arise on a workstation. Well-run server estates
    usually do **not** let each machine reach for updates on its own.
    Updates go through a central service or a patch management tool that
    tests them first, releases them in rings and records what went where.
    Turning automatic updates on can bypass such an arrangement.

    So I read this item two ways. Where a central mechanism exists and
    works, the right result is often a recorded exception with a
    justification: the machine does not update itself because something
    else updates it, and that can be shown. Where nothing of the kind is
    running - which happens more often than the documentation suggests -
    this item is the difference between a patched server and one that fell
    out of the process two years ago with nobody noticing.

    What an attacker gains while the item goes unmet: a machine with
    publicly described flaws for which the tools are ready and widely
    available.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać rzecz,
    która odróżnia serwer od stacji roboczej w tym punkcie: aktualizacja
    serwera nie jest zdarzeniem w tle, tylko przerwą w usłudze.

    Po tej zmianie maszyna zacznie pobierać i instalować aktualizacje,
    a część z nich kończy się restartem. Restart serwera to przerwa
    w działaniu wszystkiego, co on udostępnia. Jeżeli ten serwer należy do
    klastra albo do farmy, restart w nieuzgodnionym momencie potrafi
    uruchomić przeniesienie roli, przełączenie węzła albo przerwanie
    replikacji — czyli zdarzenia, które same w sobie bywają groźniejsze niż
    opóźniona poprawka.

    Dlatego ta reguła nie chodzi sama. Bez ustalenia, kiedy maszyna
    instaluje i kiedy się restartuje, samo jej włączenie przenosi wybór
    momentu na maszynę. Punkty o trybie instalowania i o restarcie
    z tej samej grupy są częścią tego samego wdrożenia i wdraża się je
    razem, a nie po kolei w odstępie tygodnia.

    Drugi skutek dotyczy sterowników. Automatyczne aktualizacje przynoszą
    również sterowniki, a na serwerze to jest ta kategoria zmian, która
    potrafi zaboleć najbardziej: sterownik karty sieciowej, kontrolera
    macierzy albo karty rozszerzeń zmieniony bez uprzedzenia. Warto
    ustalić, czy sterowniki mają iść tą samą drogą, zanim droga zostanie
    otwarta.

    Zmiana nie wymaga przerwy w chwili wykonania i cofa się natychmiast,
    ale jej skutek — restart — przychodzi później i niezapowiedziany.
  en: |
    I keep the class "needs a planned rollout", and I want to name the
    thing that sets a server apart from a workstation on this item: a
    server's update is not a background event but an interruption of
    service.

    After this change the machine will start fetching and installing
    updates, and some of them end in a restart. A server restart is an
    interruption of everything it serves. If this server belongs to a
    cluster or a farm, a restart at an unagreed moment can set off a role
    transfer, a node failover or a break in replication - events that are
    sometimes more dangerous in themselves than a delayed fix.

    So this rule does not travel alone. Without settling when the machine
    installs and when it restarts, turning it on merely moves the choice of
    moment to the machine. The items on the installation mode and on the
    restart from this same group are part of the same rollout and are
    rolled out together rather than one at a time a week apart.

    The second effect concerns drivers. Automatic updates bring drivers
    too, and on a server that is the category of change that can hurt most:
    the driver of a network card, an array controller or an expansion card
    changed without warning. It is worth settling whether drivers are to
    travel the same road before the road is opened.

    The change needs no outage at the moment of execution and is undone
    immediately, but its consequence - the restart - comes later and
    unannounced.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Maszyna zacznie instalować aktualizacje, a część z nich kończy się restartem serwera
      - Restart w nieuzgodnionym momencie potrafi uruchomić przeniesienie roli, przełączenie węzła albo przerwanie replikacji
      - Automatyczne aktualizacje przynoszą również sterowniki karty sieciowej, kontrolera macierzy i kart rozszerzeń
      - Włączenie tego punktu bez ustalenia trybu instalowania i zasad restartu przenosi wybór momentu na maszynę
      - Tam, gdzie aktualizacje idą przez usługę centralną albo narzędzie do zarządzania poprawkami, ta zmiana może ten układ obejść
    en:
      - The machine will start installing updates, and some of them end in a server restart
      - A restart at an unagreed moment can set off a role transfer, a node failover or a break in replication
      - Automatic updates also bring drivers for network cards, array controllers and expansion cards
      - Turning this on without settling the installation mode and the restart rules moves the choice of moment to the machine
      - Where updates go through a central service or a patch management tool, this change can bypass that arrangement
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Aktualizacje tej maszyny idą przez usługę centralną albo narzędzie do zarządzania poprawkami, które testuje je i wypuszcza pierścieniami
      - Nie ustalono jeszcze trybu instalowania ani zasad restartu z tej samej grupy reguł
      - Maszyna należy do klastra albo farmy, w której restart w nieuzgodnionym momencie uruchamia przełączenie
      - Nie rozstrzygnięto, czy sterowniki mają przychodzić tą samą drogą co poprawki systemu
    en:
      - This machine's updates go through a central service or a patch management tool that tests them and releases them in rings
      - The installation mode and the restart rules from the same group of items have not been settled yet
      - The machine belongs to a cluster or farm where a restart at an unagreed moment triggers a failover
      - It has not been decided whether drivers are to arrive by the same road as system fixes
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'NoAutoUpdate'
      $value = $null
      if (Test-Path -Path $path -ErrorAction Stop) {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
      }
      # No policy at all means the system default applies, which is automatic
      # updates. Only an explicit 1 switches them off.
      if ($null -eq $value -or [int]$value -eq 0) { 'AUTOMATIC' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: AUTOMATIC
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      no_auto_update  = $item.NoAutoUpdate
      existed         = ($null -ne $item.NoAutoUpdate)
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle the installation mode and the restart rules from this same group
    # before this. On their own, these lines move the choice of the restart
    # moment to the machine, and a server restart is an interruption of service.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (Test-Path -Path $path) {
      Remove-ItemProperty -Path $path -Name 'NoAutoUpdate' -ErrorAction SilentlyContinue
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      if (-not (Test-Path -Path $b.path)) { New-Item -Path $b.path -Force | Out-Null }
      Set-ItemProperty -Path $b.path -Name 'NoAutoUpdate' -Value $b.no_auto_update -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'NoAutoUpdate' -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Punkt do czytania dwojako. Dobrze prowadzone serwerownie zwykle nie
    pozwalają każdej maszynie sięgać po aktualizacje samodzielnie —
    aktualizacje idą przez usługę centralną albo narzędzie testujące je
    i wypuszczające pierścieniami. Tam właściwym wynikiem bywa zapisany
    wyjątek: maszyna nie aktualizuje się sama, bo aktualizuje ją coś
    innego, i da się to pokazać.

    Tam, gdzie nic takiego nie działa — a zdarza się to częściej, niż
    wynika z dokumentacji — ten punkt jest różnicą między serwerem łatanym
    a serwerem, który dwa lata temu wypadł z procesu.

    Reguła nie chodzi sama: punkty o trybie instalowania i o restarcie są
    częścią tego samego wdrożenia.
  en: |
    An item to be read two ways. Well-run server estates usually do not let
    each machine reach for updates on its own - updates go through a
    central service or a tool that tests them and releases them in rings.
    There the right result is often a recorded exception: the machine does
    not update itself because something else updates it, and that can be
    shown.

    Where nothing of the kind is running - which happens more often than
    the documentation suggests - this item is the difference between a
    patched server and one that fell out of the process two years ago.

    The rule does not travel alone: the items on the installation mode and
    on the restart are part of the same rollout.
