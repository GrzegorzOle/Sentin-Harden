id: win2016-bitlocker-smart-card-removable-drives

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Karta wymagana do odblokowania nośników wymiennych
    en: A card required to unlock removable media
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga karty z certyfikatem do odblokowania zaszyfrowanego
    nośnika wymiennego.

    Argument jest tu mocniejszy niż przy dyskach stałych i warto to
    powiedzieć wprost. Nośnik wymienny zostaje zgubiony razem z tym, co
    leży obok niego w torbie. Hasło zapisane na karteczce jedzie w tej samej
    torbie. Nośnik z kluczem odblokowującym — również.

    Karta jest jedyną rzeczą, która tej wspólnej podróży nie odbywa, o ile
    nosi się ją osobno. Znaleziona pamięć bez karty jest ciągiem znaków bez
    znaczenia, niezależnie od tego, co jeszcze było w torbie.

    Punkt niesie dwie wartości, bo dopuszczenie karty i wymaganie karty to
    dwie różne decyzje. Pierwsza bez drugiej zostawia wybór człowiekowi,
    który za chwilę wyjdzie z nośnikiem — a ten wybierze to, co działa
    wszędzie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    znalezionego nośnika przy pomocy rzeczy, które zgubiono razem z nim.
  en: |
    The setting requires a card holding a certificate for the unlocking of an encrypted removable
    medium.

    The argument is here stronger than at the fixed drives and that is worth saying outright. A
    removable medium is lost along with whatever lies beside it in the bag. A password written on a
    slip travels in that same bag. A medium holding the unlocking key - likewise.

    The card is the one thing that does not make that shared journey, so long as it is carried apart.
    A found memory without a card is a string of characters without meaning, whatever else was in the
    bag.

    The item carries two values, admitting a card and requiring a card being two different decisions.
    The first without the second leaves the choice to the person who will in a moment walk out with
    the medium - and they will choose what works everywhere.

    What an attacker gains while the item goes unmet: access to a found medium by means of things
    lost along with it.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powód jest jeden: karta wiąże
    nośnik z czytnikiem, a nośnik z definicji jeździ tam, gdzie czytnika
    może nie być.

    Jest to sprzeczność wewnętrzna tej reguły i trzeba ją nazwać, zamiast
    udawać, że jej nie ma. Nośnik zaszyfrowany z wymogiem karty otwiera się
    wyłącznie tam, gdzie jest czytnik, sterowniki i ważny certyfikat.
    Poza tym zbiorem miejsc jest pamięcią, której nie da się otworzyć.

    Z tego wynika, do czego ta reguła się nadaje, a do czego nie. Nadaje się
    do nośników krążących wewnątrz organizacji, gdzie karty i czytniki są
    wszędzie. Nie nadaje się do nośników przekazywanych na zewnątrz ani do
    noszonych przez ludzi pracujących w terenie na cudzym sprzęcie.

    Przed wykonaniem trzeba więc odpowiedzieć na jedno pytanie: gdzie te
    nośniki są otwierane. Odpowiedź „u nas i u klientów" znaczy, że punkt
    należy zapisać jako wyjątek albo wdrożyć wraz z osobną drogą
    przekazywania danych na zewnątrz.

    Drugi warunek dotyczy zgubienia karty. Nośnik zostaje wtedy do
    odzyskania wyłącznie kluczem odzyskiwania — więc reguła o sposobie
    odzyskiwania musi być wdrożona wcześniej, nie później.

    Wdrożenie nie dotyczy nośników już zaszyfrowanych.

    Czego to nie psuje: odczytu nośników zaszyfrowanych wcześniej, pracy
    systemu, sieci, udziałów.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs a planned rollout", and the reason is a single one: a card binds the medium
    to a reader, and a medium by definition travels where a reader may not be.

    It is this rule's inward contradiction and it has to be named rather than pretended away. A
    medium encrypted with a card required opens solely where there is a reader, drivers and a valid
    certificate. Outside that set of places it is a memory that cannot be opened.

    From that follows what this rule suits and what it does not. It suits media circling inside the
    organisation, where cards and readers are everywhere. It does not suit media handed outward, nor
    those carried by people working in the field on another's hardware.

    Before execution one question therefore has to be answered: where are those media opened. The
    answer "with us and with clients" means the item should be recorded as an exception or rolled out
    along with a separate road for handing data outward.

    The second condition concerns a lost card. The medium is then to be recovered solely by the
    recovery key - so the rule about the way of recovering has to be rolled out beforehand, not
    after.

    The rollout does not concern media already encrypted.

    What this does not break: the reading of media encrypted earlier, the system's working, the
    network, or shares.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Nośnik zaszyfrowany z wymogiem karty otwiera się wyłącznie tam, gdzie jest czytnik, sterowniki i ważny certyfikat
      - Przekazanie danych na nośniku komuś spoza organizacji przestaje działać, bo odbiorca karty nie ma
      - Zgubienie karty zostawia nośnik do odzyskania wyłącznie kluczem odzyskiwania
      - Człowiek pracujący w terenie na cudzym sprzęcie nie otworzy własnego nośnika
      - Odczyt nośników zaszyfrowanych wcześniej i praca systemu pozostają bez zmian
    en:
      - A medium encrypted with a card required opens solely where there is a reader, drivers and a valid certificate
      - Handing data over on a medium to somebody outside the organisation ceases to work, the receiver having no card
      - Losing the card leaves the medium to be recovered solely by the recovery key
      - A person working in the field on another's hardware will not open their own medium
      - The reading of media encrypted earlier and the system's working stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki przekazywane są ludziom spoza organizacji, którzy kart ani czytników nie mają
      - Ludzie pracujący w terenie otwierają własne nośniki na cudzym sprzęcie
      - Reguła o sposobie odzyskiwania dostępu do nośników nie została jeszcze wdrożona
    en:
      - Media are handed to people outside the organisation, who have neither cards nor readers
      - People working in the field open their own media on another's hardware
      - The rule about the way of recovering access to media has not been rolled out yet
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes
      # it required - admitted without required leaves the choice open and is
      # reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'RDVAllowUserCert'
        $enforce = $item.'RDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'RDVAllowUserCert'
      allow_existed   = ($null -ne $item.'RDVAllowUserCert')
      enforce         = $item.'RDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'RDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A card required on a medium binds it to the reader. Settle where that
    # medium is to be read before shutting the other roads, or the answer will
    # be a stick that opens nowhere it is actually carried to.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -ErrorAction SilentlyContinue
    }
    if ($b.enforce_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -Value $b.enforce -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest piąty w bloku i najbardziej wewnętrznie sprzeczny w całym
    zestawie. Nośnik ma jeździć; karta wiąże go z miejscem. Reguła jest
    dobra wtedy i tylko wtedy, gdy „miejscem" jest cała organizacja.

    Warto pokazywać go w parze z regułą o odczycie w starszych wersjach
    systemu, bo obie odpowiadają na to samo pytanie z przeciwnych stron.
    Tamta pyta, czy nośnik ma się otwierać wszędzie, i odpowiada „nie". Ta
    pyta, gdzie ma się otwierać, i odpowiada „tam, gdzie jest czytnik".
    Kto odpuścił tamtą ze względu na przekazywanie danych na zewnątrz, tę
    odpuści z tego samego powodu — i warto, żeby aplikacja powiedziała to
    od razu, zamiast pytać dwa razy o to samo.

    Zależność od reguły o odzyskiwaniu jest tu twarda i warto ją pokazać
    jako kolejność, nie jako uwagę. Karta bywa gubiona częściej niż nośnik;
    bez wcześniej ustalonego sposobu odzyskiwania zgubienie karty znaczy
    utratę zawartości.
  en: |
    The item is the fifth in the block and the most inwardly contradictory in the whole set. A medium
    is to travel; a card binds it to a place. The rule is good if and only if that "place" is the
    whole organisation.

    It is worth showing paired with the rule about reading on earlier system versions, both answering
    the same question from opposite sides. That one asks whether the medium is to open everywhere and
    answers "no". This one asks where it is to open and answers "where there is a reader". Whoever let
    that one go on account of handing data outward will let this one go for the same reason - and it
    is well that the application say so at once rather than ask twice about the same thing.

    The dependency on the rule about recovering is here a hard one and is worth showing as an order
    rather than as a remark. A card is lost oftener than a medium; without a way of recovering settled
    beforehand, losing the card means losing the contents.
