id: win10-bitlocker-standard-user-pin-change-blocked

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Zmiana kodu startowego zastrzeżona dla administratorów
    en: Changing the startup code reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega zmianę kodu startowego dla administratorów.

    Bez tego wpisu kod startowy może zmienić każdy, kto jest zalogowany
    w sesji — bez znajomości kodu dotychczasowego. Jest to układ, który
    podważa cały sens tego kodu. Ma on bowiem chronić przed kimś, kto
    przejął sesję albo usiadł przy odblokowanej maszynie, a właśnie taka
    osoba może go wtedy ustawić na własny.

    Skutek jest gorszy niż samo zdjęcie ochrony. Napastnik nie musi niczego
    łamać ani wynosić: zmienia kod, restartuje maszynę i ma ją całkowicie
    dla siebie, a właściciel zostaje przed ekranem, którego nie przejdzie.

    Zastrzeżenie tej czynności dla administratorów zamyka drogę.
    Kod pozostaje tym, czym miał być — warunkiem znanym osobie
    uprawnionej, a nie ustawieniem dostępnym z wnętrza sesji.

    Odnotowuję, że zmiana nie dotyczy ustawienia kodu przy pierwszym
    szyfrowaniu. Tam, gdzie kodu jeszcze nie ma, wszystko zostaje po
    staremu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przestawienia kodu startowego na własny z wnętrza przejętej sesji.
  en: |
    The setting reserves the changing of the startup code to administrators.

    Without that entry the startup code may be changed by anybody signed into a session - with no knowledge of the
    code that stood before. It is an arrangement that undoes that code's whole sense. It is to guard against
    somebody who has taken a session or sat down at an unlocked machine, and it is just such a person who may then
    set it to one of their own.

    The consequence is worse than the mere taking off of the guarding. The attacker need break nothing and carry
    nothing out: they change the code, restart the machine and have it wholly to themselves, while the owner is
    left before a screen they cannot pass.

    The reserving of that doing to administrators shuts the road. The code stays what it was to be - a condition
    known to a person with the right, and not a setting within reach from inside a session.

    I set down that the change does not touch the setting of a code at the first enciphering. Where there is no
    code yet, all stays as it was.

    What an attacker gains while the item goes unmet: the setting of the startup code to one of their own from
    inside a taken session.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, kto
    dotychczas zmieniał te kody.

    Skutek dotyczy użytkowników bez uprawnień administratora. Po zmianie
    nie zmienią kodu sami — ani wtedy, gdy uznają, że ktoś go podejrzał,
    ani wtedy, gdy zwyczajnie chcą inny. Każdy taki przypadek staje się
    zgłoszeniem do obsługi.

    Warto oszacować, jak często to się zdarza, bo koszt jest wprost
    proporcjonalny. W organizacji, w której kody ustawia się raz i nikt
    ich nie rusza, zmiana nie kosztuje nic. Tam, gdzie użytkownicy
    zmieniają je sami po każdym podejrzeniu, obciążenie obsługi wzrośnie
    zauważalnie.

    Odnotowuję skutek uboczny, który idzie w stronę przeciwną do
    zamierzonej. Użytkownik, który nie może zmienić kodu po tym, jak ktoś
    go zobaczył, zwykle nie zgłosi tego wcale — i kod znany osobie
    postronnej zostanie na maszynie. Jest to argument za tym, żeby
    procedura zgłoszenia była naprawdę łatwa.

    Czego to nie psuje: startu maszyny, logowania, dostępu do plików,
    wydajności, drukowania.
  en: |
    The class is "needs review", and the object of the review is who has been changing these codes until now.

    The consequence touches users without an administrator's right. After the change they will not set a code
    themselves - neither where they judge somebody has seen it nor where they simply want another. Every such case
    becomes a report to the support.

    It is worth reckoning how often that happens, the cost standing in direct proportion. In a body where codes
    are set once and nobody touches them the change costs nothing. Where users change them themselves after every
    suspicion the support's burden will rise noticeably.

    I set down a side consequence that runs against what was meant. A user who cannot change a code after somebody
    has seen it commonly will not report it at all - and a code known to an outsider will stay upon the machine.
    It is an argument for making the way of reporting truly easy.

    What this does not break: the machine's start, logging on, the way to files, speed, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - boot-and-firmware
  what_breaks:
    pl:
      - Użytkownik bez uprawnień administratora nie zmieni kodu startowego sam, nawet gdy uzna go za podejrzany
      - Każdy taki przypadek staje się zgłoszeniem do obsługi, więc jej obciążenie rośnie
      - Użytkownik, który nie może zmienić kodu, zwykle nie zgłosi w ogóle, że ktoś go zobaczył
      - Ustawienie kodu przy pierwszym szyfrowaniu pozostaje możliwe jak dotychczas
      - Start maszyny, logowanie, dostęp do plików, wydajność i drukowanie pozostają bez zmian
    en:
      - A user without an administrator s right will not change the startup code themselves, even judging it suspect
      - Every such case becomes a report to the support, so its burden grows
      - A user who cannot change a code commonly will not report at all that somebody has seen it
      - The setting of a code at the first enciphering stays possible as before
      - The machine s start, logging on, the way to files, speed and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Użytkownicy zmieniają kody samodzielnie po każdym podejrzeniu, a obsługa nie udźwignie takiej liczby zgłoszeń
    en:
      - The users change codes themselves after every suspicion, and the support will not bear such a number of reports
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'DisallowStandardUserPINReset'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'DisallowStandardUserPINReset'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value shuts the changing of the code from within a session. Setting a code
    # at the first enciphering stays where it was.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisallowStandardUserPINReset' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła domyka trójkę punktów o kodzie startowym: wymaganie kodu, jego
    długość i znaki, a teraz — kto wolno go zmienić. Warto, żeby aplikacja
    pokazała to jako całość, bo brak tego ostatniego znosi sens dwóch
    poprzednich.

    Argument wart postawienia wprost dotyczy tego, przed czym ten kod ma
    bronić. Broni przed kimś, kto już jest w środku albo ma maszynę w ręku.
    Pozwolenie takiej osobie na zmianę kodu z wnętrza sesji nie jest
    osłabieniem ochrony — jest jej odwróceniem, bo napastnik zyskuje
    narzędzie, którym odcina właściciela.

    Odnotowuję skutek uboczny, bo warto, żeby aplikacja go wymieniła.
    Utrudnienie zmiany kodu zmniejsza liczbę zgłoszeń, ale nie dlatego,
    że podejrzeń jest mniej. Zgłoszenie, które kosztuje czas, po prostu nie
    powstaje — a kod znany osobie postronnej zostaje.
  en: |
    The rule closes the three items about the startup code: the calling for a code, its length and marks, and now
    - who may change it. It is well that the application show it as a whole, the want of this last undoing the
    sense of the two before.

    The argument worth putting outright touches what that code is to guard against. It guards against somebody
    already within or holding the machine. To let such a person change the code from inside a session is no
    weakening of the guarding - it is a turning of it about, the attacker gaining a tool by which to cut the owner
    off.

    I set down the side consequence, it being well that the application name it. The making harder of a code's
    changing lessens the number of reports, but not because there are fewer suspicions. A report that costs time
    simply does not come about - and a code known to an outsider stays.
