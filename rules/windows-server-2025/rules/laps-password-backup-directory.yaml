id: win2025-laps-password-backup-directory

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Miejsce przechowywania hasła lokalnego administratora wskazane
    en: The place of keeping the local administrator's password named
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza mechanizm, który sam ustala hasło lokalnego administratora
    tej maszyny, sam je zmienia i odkłada w katalogu. Wartość wskazuje
    katalog: w sieci albo w chmurze. Zero wyłącza całość.

    To jest reguła nadrzędna wobec pozostałych punktów LAPS. Długość,
    złożoność i okres ważności opisują hasło, którego bez tego wpisu
    w ogóle nie ma. Wdrażać ją trzeba pierwszą, ale rozstrzygać ostatnią.

    Kategoria krytyczna, bo to jest punkt o jedynym koncie, które na
    serwerze działa wtedy, gdy nie działa nic innego. Lokalny administrator
    jest drogą wejścia przy zerwanej łączności z katalogiem, przy awarii
    uwierzytelniania i przy maszynie odciętej od sieci. Dokładnie dlatego
    jego hasło jest tym, które najczęściej jest wszędzie: w procedurze
    awaryjnej, na kartce w szafie, w zgłoszeniu sprzed roku, w wiadomości
    do dostawcy. Bywa też jedno dla całej serwerowni — a wtedy przejęcie
    jednej maszyny jest przejęciem wszystkich.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło, które
    się nie zmienia, nie jest nigdzie odnotowane i z dużym
    prawdopodobieństwem otwiera więcej niż jedną maszynę.
  en: |
    The item turns on the mechanism that sets this machine's local
    administrator password itself, changes it itself, and deposits it in a
    directory. The value names the directory: in the network or in the
    cloud. Zero switches the whole thing off.

    This rule governs the other LAPS items. Length, complexity and term of
    validity describe a password that without this entry does not exist at
    all. It has to be rolled out first and decided last.

    The category is critical, because this item is about the one account
    that works on a server when nothing else does. The local administrator
    is the way in when connectivity to the directory is broken, when
    authentication fails, and when the machine is cut off from the network.
    That is exactly why its password is the one that tends to be
    everywhere: in the emergency procedure, on a card in the cabinet, in a
    ticket from last year, in a message to a vendor. It is also often one
    password for the whole server room - and then taking over one machine
    is taking over all of them.

    What an attacker gains while the item goes unmet: a password that does
    not change, is recorded nowhere, and in all likelihood opens more than
    one machine.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać
    sprzeczność, bo ona jest właściwą treścią tej reguły na serwerze,
    a nie żadna niedogodność.

    Lokalny administrator jest kontem na wypadek, gdy katalog jest
    nieosiągalny. Po tej zmianie hasło tego konta leży w katalogu.
    Maszyna, która najbardziej potrzebuje tego konta — odcięta, z zerwanym
    zaufaniem, w segmencie bez łączności — jest maszyną, dla której hasła
    nie da się odczytać, bo odczyt wymaga tego samego katalogu. To nie jest
    usterka wdrożenia. To jest właściwość mechanizmu i trzeba ją przyjąć
    świadomie: droga awaryjna przestaje być samowystarczalna.

    Wniosek praktyczny jest taki, że przed wdrożeniem musi istnieć druga
    droga dostępu, niezależna od katalogu i od samej maszyny — konsola
    poza systemem przez kontroler zarządzania, dostęp fizyczny, procedura
    odtworzenia. I tę drogę trzeba sprawdzić faktycznym zalogowaniem,
    a nie założyć.

    Drugi skutek: wszystko, co dotychczas znało to hasło, przestaje działać
    w momencie pierwszej zmiany. Procedury awaryjne, skrypty łączące się
    tym kontem, zapisy w systemie zgłoszeń, dane przekazane dostawcy
    utrzymania. Nie wszystkie z nich są spisane, więc trzeba je znaleźć
    przed zmianą, a nie po pierwszym telefonie.

    Rzecz do zapamiętania przy cofaniu: wycofanie wpisu wyłącza mechanizm,
    ale nie przywraca poprzedniego hasła. Hasło już zmienione zostaje
    zmienione. Jeżeli maszyna ma pozostać osiągalna, bieżące hasło trzeba
    odczytać z katalogu **przed** wyłączeniem mechanizmu.

    Zmiana nie wymaga przerwy, ale skutek pojawia się dopiero przy
    pierwszej zmianie hasła.
  en: |
    I keep the class "needs a planned rollout", and I want to name the
    contradiction, because it is the real substance of this rule on a
    server rather than any inconvenience.

    The local administrator is the account for when the directory is
    unreachable. After this change that account's password lies in the
    directory. The machine that needs the account most - cut off, with a
    broken trust, in a segment with no connectivity - is the machine whose
    password cannot be read, because reading it needs that same directory.
    This is not a rollout fault. It is a property of the mechanism and has
    to be accepted knowingly: the emergency route stops being
    self-sufficient.

    The practical conclusion is that a second route of access has to exist
    before the rollout, independent of both the directory and the machine -
    an out-of-band console through the management controller, physical
    access, a restore procedure. And that route has to be verified by
    actually signing in rather than assumed.

    The second effect: everything that knew this password until now stops
    working at the moment of the first change. Emergency procedures,
    scripts connecting with this account, entries in the ticket system,
    details handed to a maintenance vendor. Not all of these are written
    down, so they have to be found before the change rather than after the
    first phone call.

    Something to remember when undoing this: withdrawing the entry switches
    the mechanism off but does not restore the previous password. A
    password already changed stays changed. If the machine is to remain
    reachable, the current password has to be read from the directory
    **before** the mechanism is switched off.

    The change needs no outage, but its effect appears only at the first
    password change.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Maszyna odcięta od katalogu jest tą, dla której hasła nie da się odczytać, bo odczyt wymaga tego samego katalogu
      - Droga awaryjna przestaje być samowystarczalna i wymaga drugiej drogi dostępu, niezależnej od katalogu i od maszyny
      - Wszystko, co znało to hasło, przestaje działać przy pierwszej zmianie — procedury, skrypty, zgłoszenia, dane u dostawcy
      - Nie wszystkie z tych miejsc są spisane, więc trzeba je znaleźć przed zmianą, a nie po pierwszym telefonie
      - Wycofanie wpisu wyłącza mechanizm, ale nie przywraca poprzedniego hasła
    en:
      - The machine cut off from the directory is the one whose password cannot be read, because reading it needs that same directory
      - The emergency route stops being self-sufficient and needs a second route, independent of both the directory and the machine
      - Everything that knew this password stops working at the first change - procedures, scripts, tickets, details at a vendor
      - Not all of those places are written down, so they have to be found before the change rather than after the first phone call
      - Withdrawing the entry switches the mechanism off but does not restore the previous password
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono drugiej drogi dostępu do maszyny, niezależnej od katalogu, ani nie sprawdzono jej faktycznym zalogowaniem
      - Nie odszukano wszystkich miejsc, w których obecne hasło lokalnego administratora jest zapisane albo używane
      - Maszyna pracuje w segmencie bez trwałej łączności z katalogiem, w którym hasła nie dałoby się odczytać w razie awarii
    en:
      - No second route of access independent of the directory has been settled, nor verified by actually signing in
      - Not every place where the current local administrator password is written down or used has been found
      - The machine works in a segment with no lasting connectivity to the directory, where the password could not be read in a failure
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # One means the directory in the network, two the directory in the cloud;
      # zero switches the whole mechanism off.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BackupDirectory'
        if ($null -eq $value) { 'MISSING' }
        elseif ($value -eq 1) { 'CLOUD_DIRECTORY' }
        elseif ($value -eq 2) { 'ACTIVE_DIRECTORY' }
        elseif ($value -eq 0) { 'NOT_CONFIGURED' }
        else { 'OTHER ' + [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ^(CLOUD_DIRECTORY|ACTIVE_DIRECTORY)$
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'BackupDirectory' -ErrorAction SilentlyContinue).'BackupDirectory'
    [pscustomobject]@{
      path        = $path
      name        = 'BackupDirectory'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Have a second route of access ready before this - one independent of both
    # the directory and this machine - and verify it by actually signing in.
    # After the first password change the old password stops working
    # everywhere it was written down.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Two names the directory in the network. On a machine joined to the cloud
    # directory alone, one is the value to write instead.
    Set-ItemProperty -Path $path -Name 'BackupDirectory' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    # The password already changed does not return to its former value.
    # Where the machine is to be reachable again, the current password has to be
    # read from the directory before the mechanism is switched off.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-overview

notes:
  pl: |
    Reguła nadrzędna wobec pozostałych punktów LAPS: długość, złożoność
    i okres ważności opisują hasło, którego bez tego wpisu w ogóle nie ma.

    Sprzeczność do przyjęcia świadomie: lokalny administrator jest kontem
    na wypadek, gdy katalog jest nieosiągalny, a po tej zmianie hasło tego
    konta leży w katalogu. Maszyna, która najbardziej potrzebuje tego
    konta, jest maszyną, dla której hasła nie da się odczytać.

    Na serwerze hasło lokalnego administratora bywa jedno dla całej
    serwerowni — wtedy przejęcie jednej maszyny jest przejęciem wszystkich.

    Przy cofaniu: wyłączenie mechanizmu nie przywraca poprzedniego hasła.
  en: |
    The rule governing the other LAPS items: length, complexity and term of
    validity describe a password that without this entry does not exist.

    A contradiction to accept knowingly: the local administrator is the
    account for when the directory is unreachable, and after this change
    that account's password lies in the directory. The machine that needs
    the account most is the machine whose password cannot be read.

    On a server the local administrator password is often one password for
    the whole server room - and then taking over one machine is taking over
    all of them.

    When undoing: switching the mechanism off does not restore the previous
    password.
