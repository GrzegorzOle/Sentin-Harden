id: win10-auto-connect-open-hotspots-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > WLAN Service > WLAN Settings
  title:
    pl: Automatyczne łączenie z otwartymi sieciami bezprzewodowymi wyłączone
    en: The automatic joining to open wireless networks switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm samoczynnego łączenia maszyny z otwartymi
    sieciami bezprzewodowymi udostępnianymi przez operatorów.

    Mechanizm ten miał ułatwiać życie: maszyna sama podłącza się do
    znanej sieci publicznej i użytkownik nie musi nic robić. Cena polega
    na tym, że decyzja o wejściu do sieci obcej przestaje być decyzją.

    Sieć otwarta nie szyfruje ruchu na poziomie łącza, więc wszystko, co
    nie jest zabezpieczone wyżej, jest czytelne dla każdego w zasięgu.
    Nazwa sieci nie jest przy tym niczym chronionym — dowolne urządzenie
    może ogłosić się jako sieć o tej samej nazwie i przyjąć połączenie.

    Skutek jest taki, że maszyna niesiona w torbie przez lotnisko potrafi
    sama podłączyć się do sieci ogłoszonej przez kogokolwiek i zacząć
    w niej rozmawiać. Użytkownik nie wie o tym, bo niczego nie klikał.

    Odnotowuję, że wpis leży poza gałęzią zasad, w konfiguracji samej
    usługi. Brak wartości oznacza więc zachowanie domyślne systemu,
    a ono pozostawia mechanizm włączony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: połączenie
    maszyny z siecią przez siebie ogłoszoną, bez udziału użytkownika.
  en: |
    The setting switches off the mechanism by which the machine joins itself of its own accord to open wireless
    networks put out by carriers.

    That mechanism was to make life easier: the machine joins itself to a known public network and the user need
    do nothing. The price is that the decision to enter a strange network ceases to be a decision.

    An open network ciphers no traffic at the level of the link, so everything not guarded higher up stands
    readable to anybody within reach. The network's name is besides nothing guarded - any device at all may give
    itself out as a network of that same name and take the joining.

    The upshot is that a machine carried in a bag through an airport can join itself of its own accord to a
    network put out by anybody and begin to speak in it. The user knows nothing of it, having pressed nothing.

    I set down that the entry sits outside the branch of policy, in the service's own setting. A value absent
    means therefore the system's default behaviour, and that leaves the mechanism on.

    What an attacker gains while the item goes unmet: the joining of the machine to a network put out by
    themselves, with no part taken by the user.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie odbiera możliwości połączenia z siecią otwartą. Odbiera
    wyłącznie samoczynność: użytkownik wybiera sieć z listy i łączy się
    sam, tak jak z każdą inną.

    Odnotowuję, że skutek jest widoczny dla użytkownika w sposób
    pośredni. Maszyna, która dotąd łączyła się sama w znanym miejscu,
    przestanie to robić — i wygląda to na problem z siecią, a nie na
    zmianę ustawienia. Warto uprzedzić osoby często korzystające z sieci
    operatorskich.

    Miejscem wartym uwagi są maszyny używane w podróży służbowej, gdzie
    sieć operatorska bywa jedynym dostępnym łączem.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: ręcznego łączenia z siecią otwartą, sieci
    zapamiętanych, połączenia przewodowego, sieci firmowej, drukowania.
  en: |
    The class is "no disruption".

    The change takes not the power of joining to an open network. It takes solely the self-acting: the user
    chooses the network from a roll and joins themselves, as with any other.

    I set down that the consequence is plain to the user in an indirect manner. A machine that hitherto joined
    itself of its own accord in a known place will cease to do so - and that looks like a trouble with the network
    and no change of a setting. It is worth forewarning people who often use the networks of carriers.

    The place worth notice is machines used upon journeys of business, where a carrier's network is at times the
    one link to be had.

    The consequence shows at once, with no restart.

    What this does not break: the joining to an open network by hand, networks remembered, the joining by wire,
    the network of the firm, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Maszyna przestanie sama łączyć się z sieciami operatorskimi w miejscach, w których dotąd to robiła
      - Wygląda to na problem z siecią, a nie na zmianę ustawienia, więc warto uprzedzić osoby często z nich korzystające
      - Ręczne połączenie z siecią otwartą pozostaje możliwe i wygląda tak samo jak dotąd
      - W podróży służbowej sieć operatorska bywa jedynym łączem, więc połączenie wymaga teraz kilku kliknięć
      - Sieci zapamiętane, połączenie przewodowe, sieć firmowa i drukowanie pozostają bez zmian
    en:
      - The machine will cease to join itself of its own accord to carriers networks in places where it did so hitherto
      - That looks like a trouble with the network and no change of a setting, so people who often use them are best forewarned
      - A joining to an open network by hand stays open and looks just as it did
      - Upon a journey of business a carrier s network is at times the one link, so a joining now calls for some presses
      - Networks remembered, the joining by wire, the network of the firm and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje w terenie i sieć operatorska jest na niej jedynym dostępnym łączem
    en:
      - The machine works in the field and a carrier s network is upon it the one link to be had
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry sits outside the branch of policy, in the service's own setting, so
      # an absent value means the system's default and no unset policy - and that
      # default leaves the automatic behaviour on.
      $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AutoConnectAllowedOEM'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
    $name = 'AutoConnectAllowedOEM'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AutoConnectAllowedOEM' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-wifi

notes:
  pl: |
    Reguła broni przed czymś, czego użytkownik nie zauważy, i warto, żeby
    aplikacja postawiła to na początku opisu. Nie chodzi o to, że sieć
    otwarta jest niebezpieczna — o tym wszyscy wiedzą. Chodzi o to, że
    maszyna wchodzi do niej sama, bez pytania i bez śladu widocznego dla
    człowieka.

    Argument wart postawienia wprost dotyczy nazwy sieci. Nazwa nie jest
    niczym chronionym i dowolne urządzenie może ogłosić się jako sieć
    znana. Mechanizm samoczynnego łączenia nie ma jak tego rozróżnić, bo
    rozpoznaje właśnie po nazwie.

    Odnotowuję położenie wpisu poza gałęzią zasad. Ma to skutek
    praktyczny: brak wartości nie znaczy tu „zasada nieustawiona", tylko
    „zachowanie domyślne", a domyślne zostawia mechanizm włączony.
    Raport pokazujący brak wartości jako niezgodność jest więc
    prawidłowy, a nie nadmiarowy.
  en: |
    The rule guards against something the user will not mark, and it is well that the application set that at the
    head of its setting out. What is at stake is not that an open network is dangerous - everybody knows that. It
    is that the machine enters it of its own accord, unasked and with no trace a person can see.

    The argument worth putting outright touches the network's name. A name is nothing guarded and any device at
    all may give itself out as a known network. The mechanism of self-acting joining has no means of telling that
    apart, knowing it by the name alone.

    I set down the entry's seat outside the branch of policy. That has a practical upshot: a value absent means
    here not "a policy unset" but "the default behaviour", and the default leaves the mechanism on. A report
    showing an absent value as a want of compliance is therefore right and no excess.
