id: fedora44-bootloader-password-set

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.4.1
  section: Initial Setup > Configure Bootloader
  title:
    pl: Hasło programu rozruchowego jest ustawione
    en: Ensure bootloader password is set
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Kto ma dostęp do klawiatury przy starcie, może w menu GRUB zmienić wpis
    rozruchu, np. dodać parametr init=/bin/bash albo rd.break, i uzyskać
    powłokę roota bez podawania żadnego hasła. Hasło programu rozruchowego
    wymaga zalogowania do GRUB przed edycją wpisu lub użyciem wiersza poleceń.

    Na Fedorze hasło ustawia polecenie grub2-setpassword, które zapisuje jego
    skrót w pliku /boot/grub2/user.cfg. Wpisy tworzone przez system mają opcję
    --unrestricted, więc zwykły start bez zmian nadal nie pyta o hasło.

    Ochrona nie zastępuje szyfrowania dysku: kto może uruchomić komputer
    z innego nośnika, ominie GRUB całkowicie.
  en: |
    Anyone with keyboard access at start can change a boot entry in the GRUB
    menu, for example add the init=/bin/bash or rd.break parameter, and get a
    root shell without entering any password. A bootloader password requires
    signing in to GRUB before editing an entry or using the command line.

    On Fedora the password is set by the grub2-setpassword command, which
    stores its hash in /boot/grub2/user.cfg. Entries created by the system have
    the --unrestricted option, so a normal start without changes still does not
    ask for the password.

    The protection does not replace disk encryption: anyone who can start the
    computer from other media bypasses GRUB completely.

disruption_description:
  pl: |
    Klasa wymaga przeglądu, bo hasło utrudnia naprawę systemu na miejscu:
    dodanie parametru jądra przy starcie w razie awarii wymaga znajomości
    hasła. Hasło trzeba przechowywać tak, żeby administrator miał do niego
    dostęp przy konsoli, a nie tylko na tej stacji.
  en: |
    The class needs review because the password makes on-site repair harder:
    adding a kernel parameter at start in an emergency requires knowing the
    password. The password has to be stored so that an administrator can reach
    it at the console, not only on this workstation.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
  what_breaks:
    pl:
      - Edycja wpisu w menu GRUB i wiersz poleceń GRUB, np. do uruchomienia systemu w trybie ratunkowym, wymagają podania nazwy root i hasła programu rozruchowego
    en:
      - Editing an entry in the GRUB menu and the GRUB command line, for example to start the system in rescue mode, require the root name and the bootloader password
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ma bezpiecznego miejsca, w którym administratorzy przechowują hasła programu rozruchowego dla wielu stacji
    en:
      - There is no safe place where administrators keep bootloader passwords for many workstations
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    d=/boot/grub2
    if [ ! -d "$d" ] || [ ! -r "$d" ] || [ ! -x "$d" ]; then echo CHECK_ERROR; exit 0; fi
    if [ -f "$d/user.cfg" ] && grep -qE '^[[:space:]]*GRUB2_PASSWORD=grub\.pbkdf2\.' "$d/user.cfg"; then echo SET; exit 0; fi
    if [ -f "$d/grub.cfg" ] && grep -qE '^[[:space:]]*password(_pbkdf2)?[[:space:]]+[^[:space:]$]+[[:space:]]+[^[:space:]$]' "$d/grub.cfg"; then echo SET; exit 0; fi
    echo NOT_SET
  expected: '^SET$'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://docs.fedoraproject.org/en-US/fedora/latest/system-administrators-guide/kernel-module-driver-configuration/Working_with_the_GRUB_2_Boot_Loader/
  - https://www.gnu.org/software/grub/manual/grub/html_node/Authentication-and-authorisation.html

notes:
  pl: |
    Reguła tylko sprawdza stan. Hasło ustawia się ręcznie poleceniem
    grub2-setpassword uruchomionym jako root, bo wymaga wybrania i przechowania
    hasła; naprawa nie może zrobić tego za administratora. Usunięcie pliku
    /boot/grub2/user.cfg wyłącza hasło.

    Sprawdzenie wymaga uprawnień roota, bo katalog /boot/grub2 jest dostępny
    tylko dla niego. Za ustawione uznaje także hasło wpisane bezpośrednio do
    grub.cfg lub plików w /etc/grub.d.
  en: |
    The rule only checks the state. The password is set by hand with the
    grub2-setpassword command run as root, because it requires choosing and
    storing a password; a remediation cannot do that for the administrator.
    Deleting the /boot/grub2/user.cfg file turns the password off.

    The check needs root privileges because the /boot/grub2 directory is only
    accessible to root. It also counts a password written directly into
    grub.cfg or the files in /etc/grub.d as set.
