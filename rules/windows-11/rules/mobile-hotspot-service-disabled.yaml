id: win11-mobile-hotspot-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia jako punkt dostępowy wyłączona
    en: The service sharing the connection as an access point disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zamienia maszynę w bezprzewodowy punkt dostępowy: rozgłasza własną
    sieć, przyjmuje do niej urządzenia i przepuszcza ich ruch przez połączenie,
    z którego maszyna sama korzysta.

    Skutek jest poważniejszy niż wygoda, którą daje. Maszyna, która to robi,
    staje się mostem między siecią organizacji a urządzeniami, których w tej
    sieci nigdy nie dopuszczono — prywatnymi telefonami, sprzętem gości,
    czymkolwiek, co zna hasło do rozgłaszanej sieci. Ruch tych urządzeń wchodzi
    do sieci z adresu maszyny, więc z punktu widzenia zapory i dzienników
    wygląda jak ruch tej maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę wejścia,
    która omija kontrolę dostępu do sieci w całości. Uwierzytelnianie urządzeń
    przy porcie, podział na sieci wydzielone, lista dopuszczonego sprzętu —
    żaden z tych mechanizmów nie widzi urządzenia podłączonego do punktu
    dostępowego postawionego wewnątrz. Do jego postawienia nie trzeba zresztą
    uprawnień administratora, jeżeli funkcja pozostaje włączona.

    Osobno liczy się kierunek odwrotny. Punkt dostępowy postawiony na maszynie
    rozgłasza swoją obecność na zewnątrz budynku i przyjmuje próby połączenia
    od każdego, kto go zobaczy.
  en: |
    The service turns the machine into a wireless access point: it broadcasts a network
    of its own, admits devices to it and passes their traffic through the connection the
    machine itself uses.

    The effect is weightier than the convenience it gives. A machine doing this becomes a
    bridge between the organisation's network and devices never admitted to that network
    - private phones, guests' hardware, anything at all that knows the password to the
    broadcast network. Those devices' traffic enters the network from the machine's
    address, so as far as the firewall and the logs are concerned it looks like that
    machine's traffic.

    What an attacker gains while the item goes unmet: a way in that gets round access
    control for the network entirely. Authenticating devices at the port, division into
    separated networks, a list of admitted hardware - none of these mechanisms sees a
    device attached to an access point set up inside. Nor does setting one up take
    administrator rights, as long as the feature stays on.

    The opposite direction counts separately. An access point set up on the machine
    broadcasts its presence beyond the building and takes connection attempts from
    anybody who sees it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek udostępnia z tej maszyny połączenie
    innym urządzeniom.

    Na stanowisku stacjonarnym w siedzibie zmiana nie robi nic. Funkcja jest
    tam używana rzadko i zwykle nikt nie zauważy jej braku.

    Skutek dotyczy pracy w terenie. Komputer przenośny z modemem sieci
    komórkowej bywa jedynym źródłem połączenia dla reszty sprzętu ekipy —
    tabletu z dokumentacją, urządzenia pomiarowego, telefonu służbowego.
    Po wyłączeniu usługi ten sposób pracy przestaje być możliwy i trzeba go
    zastąpić: albo punktem dostępowym z telefonu, albo osobnym urządzeniem.

    Zamiennik z telefonu jest zwykle dostępny od ręki i jest przy okazji
    rozwiązaniem lepszym, bo nie przepuszcza cudzych urządzeń przez maszynę
    należącą do sieci organizacji. Warto powiedzieć to użytkownikowi wprost
    zamiast samej odmowy.

    Zmiana wymaga zatrzymania usługi; urządzenia podłączone w tej chwili tracą
    połączenie.
  en: |
    What needs checking is whether anybody shares a connection from this machine with
    other devices.

    At a stationary station on the premises the change does nothing. The feature is
    little used there and usually nobody will notice its absence.

    The effect concerns work in the field. A portable computer with a mobile network
    modem is sometimes the only source of a connection for the rest of a team's hardware
    - a tablet holding documentation, a measuring device, a work phone. Once the service
    is off that way of working stops being possible and has to be replaced: either with
    an access point from a phone or with a device of its own.

    The replacement from a phone is usually to hand and is, at that, the better solution,
    since it does not pass other people's devices through a machine belonging to the
    organisation's network. It is worth saying so to the user outright rather than
    refusing alone.

    The change takes stopping the service; devices attached at that moment lose their
    connection.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Udostępnianie połączenia innym urządzeniom z tej maszyny przestaje być możliwe
      - Urządzenia podłączone w chwili zmiany tracą połączenie z siecią
      - Praca terenowa z komputerem jako jedynym źródłem połączenia dla ekipy wymaga zamiennika
      - Połączenie samej maszyny z siecią działa dalej bez żadnej zmiany
    en:
      - Sharing the connection with other devices from this machine stops being possible
      - Devices attached at the moment of the change lose their connection to the network
      - Field work with the computer as a team's only source of connection takes a replacement
      - The machine's own connection to the network carries on working with no change at all
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Komputer przenośny jest jedynym źródłem połączenia dla sprzętu ekipy w terenie
      - Urządzenie pomiarowe albo tablet łączy się z siecią wyłącznie przez tę maszynę
    en:
      - A portable computer is the only source of connection for a team's hardware in the field
      - A measuring device or tablet connects to the network through this machine alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\icssvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Devices attached to the access point lose their connection the moment the
    # service stops.
    Stop-Service -Name 'icssvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'icssvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'icssvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/

notes:
  pl: |
    W tej paczce są trzy reguły dotyczące udostępniania połączenia i warto je
    rozróżnić. Jedna ustawia zasadę ukrywającą tę funkcję w interfejsie, druga
    wyłącza usługę udostępniania połączenia sięgającą czasów sieci
    przewodowych, ta wyłącza nowszy mechanizm punktu dostępowego. Wyniki tych
    trzech reguł należy czytać razem — pozostawienie jednej z dróg otwartej
    znosi korzyść z zamknięcia pozostałych.

    Wyłączenie usługi nie wyłącza karty bezprzewodowej i nie przeszkadza
    maszynie łączyć się z sieciami. Znosi wyłącznie możliwość rozgłaszania
    własnej sieci.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa uruchamiana wyzwalaczem bywa zatrzymana i mimo to
    niezgodna.
  en: |
    This pack holds three rules about sharing a connection and they are worth telling
    apart. One sets a policy hiding the feature in the interface, another disables the
    connection sharing service dating from the days of wired networks, this one disables
    the newer access point mechanism. The results of these three rules should be read
    together - leaving one of the routes open undoes the gain from closing the rest.

    Disabling the service does not disable the wireless adapter and does not stop the
    machine connecting to networks. It does away only with the means of broadcasting a
    network of its own.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment. A service started by a trigger is sometimes stopped and deviating
    all the same.
