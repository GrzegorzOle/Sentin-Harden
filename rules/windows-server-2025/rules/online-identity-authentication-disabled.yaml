id: win2025-online-identity-authentication-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uwierzytelnianie tożsamościami z usług sieciowych zabronione
    en: Authentication with identities from online services forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania uwierzytelniania się na tej maszynie
    tożsamościami pochodzącymi z usług sieciowych, z pominięciem
    domeny i kont lokalnych.

    Mechanizm, o który chodzi, pozwala dwóm maszynom uwierzytelnić się
    wzajemnie bez wspólnego kontrolera domeny. Zamiast niego
    rozstrzyga tożsamość zewnętrzna, powiązana z usługą sieciową
    dostawcy systemu. Zaprojektowano to dla komputerów domowych
    i dla łączenia się między urządzeniami jednej osoby.

    Na serwerze mechanizm ten nie ma zastosowania, a jego obecność
    jest drogą wejścia omijającą wszystko, co zbudowano wokół domeny.
    Konta domenowe podlegają zasadom haseł, blokadom, wykazom praw
    logowania i dziennikowi. Tożsamość zewnętrzna nie podlega żadnej
    z tych rzeczy, bo nie pochodzi stąd — a mimo to pozwala na tej
    maszynie założyć sesję.

    Druga rzecz dotyczy rozliczalności. Sesja założona taką tożsamością
    nie wskazuje konta domenowego, więc raport z maszyny nie odpowiada
    na pytanie, kto to był, w sposób dający się zestawić z pozostałymi
    zapisami.

    Punkt jest tani: mechanizm ten na serwerze nie jest do niczego
    używany, a jego wyłączenie zamyka drogę, której nikt nie pilnuje,
    bo nikt o niej nie pamięta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    uwierzytelnienia omijającą zasady domeny i wykazy praw logowania,
    zostawiającą w dzienniku ślad niedający się zestawić z kontami
    domenowymi.
  en: |
    The setting forbids authenticating on this machine with identities coming from online
    services, with the domain and local accounts passed by.

    The mechanism in question lets two machines authenticate one another without a shared domain
    controller. In its stead an outside identity settles the matter, tied to the system maker's
    online service. It was designed for home computers and for the connecting of one person's
    devices to each other.

    On a server the mechanism has no use, and its standing there is a road in that goes round
    all that was built about the domain. Domain accounts fall under password rules, lockouts,
    the lists of sign-in rights and the log. An outside identity falls under none of those, not
    coming from here - and nonetheless lets a session be opened on this machine.

    A second matter bears on accountability. A session opened by such an identity names no
    domain account, so a report from the machine does not answer who it was in a way that can be
    set beside the remaining records.

    The item is cheap: the mechanism is put to no use on a server, and its switching off shuts a
    road nobody watches, because nobody remembers it.

    What an attacker gains while the item goes unmet: a road of authentication going round the
    domain's rules and the lists of sign-in rights, leaving in the log a trace that cannot be
    set beside domain accounts.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ten serwer bierze udział we wdrożeniu
    opartym na tożsamościach z usługi sieciowej dostawcy.

    Na serwerze należącym do domeny i zarządzanym kontami domenowymi
    zmiana nie ma skutków. Mechanizm ten nie jest wtedy używany do
    niczego i jego wyłączenie przechodzi niezauważone.

    Sprawdzenie jest wymagane z powodu wdrożeń mieszanych. Bywa, że
    serwer włączono do zarządzania opartego na usłudze katalogowej
    dostawcy, obok domeny klasycznej albo zamiast niej. W takim
    wdrożeniu mechanizm ten bywa częścią drogi uwierzytelniania, choć
    rzadko tą główną.

    Objaw byłby wtedy natychmiastowy i czytelny: połączenie zdalne
    tożsamością zewnętrzną kończy się odmową, a komunikat mówi wprost
    o niedozwolonym sposobie uwierzytelnienia.

    Zmiana nie dotyka uwierzytelniania kontami domenowymi ani
    lokalnymi. Logowanie przy konsoli, pulpit zdalny na koncie
    domenowym i zarządzanie zdalne działają po niej bez różnicy —
    i to właśnie sprawia, że na typowym serwerze punkt jest bezkosztowy.

    Zmiana nie wymaga przerwy i wchodzi w życie natychmiast.
  en: |
    What needs checking is whether this server takes part in a rollout resting on identities
    from the maker's online service.

    On a server belonging to a domain and managed by domain accounts the change has no effects.
    The mechanism is then put to no use, and its switching off passes unmarked.

    The check is asked for by reason of mixed rollouts. It happens that a server was drawn into
    a management resting on the maker's directory service, beside the classic domain or in its
    stead. In such a rollout the mechanism is at times part of the road of authentication, though
    seldom the main one.

    The symptom would then be immediate and plain: a remote connection by an outside identity
    ends in a refusal, and the message speaks outright of a way of authenticating not allowed.

    The change does not touch authentication by domain or local accounts. Signing in at the
    console, remote desktop under a domain account and remote management all work after it with
    no difference - and that is just what makes the item costless on a typical server.

    The change takes no break and comes into force at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-desktop
    - legacy-authentication
  what_breaks:
    pl:
      - Połączenie zdalne uwierzytelniane tożsamością z usługi sieciowej dostawcy zostanie odrzucone
      - Uwierzytelnianie kontami domenowymi i lokalnymi działa bez zmiany
      - Logowanie przy konsoli, pulpit zdalny i zarządzanie zdalne działają po zmianie bez różnicy
      - Na serwerze zarządzanym kontami domenowymi zmiana przechodzi niezauważona
    en:
      - A remote connection authenticated by an identity from the maker's online service will be turned away
      - Authentication by domain and local accounts works unchanged
      - Signing in at the console, remote desktop and remote management work after the change with no difference
      - On a server managed by domain accounts the change passes unmarked
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer bierze udział we wdrożeniu opartym na usłudze katalogowej dostawcy, obok domeny albo zamiast niej
      - Nie ustalono, czy jakakolwiek droga uwierzytelniania do tego serwera opiera się na tożsamości zewnętrznej
    en:
      - The server takes part in a rollout resting on the maker's directory service, beside the domain or in its stead
      - It has not been settled whether any road of authentication to this server rests on an outside identity
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\pku2u'
      $name = 'AllowOnlineID'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\pku2u'
    $name = 'AllowOnlineID'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\pku2u'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowOnlineID' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-pku2u-authentication-requests-to-this-computer-to-use-online-identities

notes:
  pl: |
    Mechanizm zaprojektowano dla komputerów domowych i dla łączenia się
    między urządzeniami jednej osoby. Na serwerze należącym do domeny
    nie jest używany do niczego.

    Zachowałem klasę wymagającą sprawdzenia mimo braku kosztu na
    typowym serwerze. Powodem są wdrożenia mieszane, w których
    zarządzanie opiera się na usłudze katalogowej dostawcy — tam droga
    ta bywa częścią uwierzytelniania.

    Punkt zamyka drogę wejścia omijającą zasady haseł, blokady
    i wykazy praw logowania. Właśnie to, a nie sam mechanizm, jest
    tutaj przedmiotem oceny.
  en: |
    The mechanism was designed for home computers and for the connecting of one person's devices
    to each other. On a server belonging to a domain it is put to no use.

    I kept the class taking a check despite the want of cost on a typical server. The reason is
    mixed rollouts, where the management rests on the maker's directory service - there the road
    is at times part of the authentication.

    The item shuts a road in that goes round the password rules, the lockouts and the lists of
    sign-in rights. It is that, and not the mechanism itself, that is here the subject of the
    rating.
