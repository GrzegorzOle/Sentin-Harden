id: win2025-uac-secure-uiaccess-paths

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Programy dostępności wyłącznie z katalogów chronionych
    en: Accessibility programs only from protected directories
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby program żądający dostępu do interfejsu
    innych aplikacji leżał w katalogu chronionym przez system —
    to znaczy takim, do którego pisać może wyłącznie administrator.

    Uprawnienie, o które tu chodzi, jest rzadkie i mocniejsze, niż
    wygląda. Program, który je otrzyma, może czytać zawartość okien
    należących do innych programów i wysyłać do nich zdarzenia
    wejściowe — również do okien pracujących na wyższym poziomie
    uprawnień. Powstało ono dla narzędzi dostępności: czytników ekranu,
    lup i klawiatur ekranowych, które bez tego nie mogłyby wykonywać
    swojej pracy.

    Bez wymagania katalogu chronionego ograniczenie to jest pozorne.
    Program umieszczony w dowolnym katalogu zapisywalnym przez
    użytkownika może zadeklarować to uprawnienie i je dostać — a wtedy
    dostaje wgląd w okna, których nie powinien widzieć, i możliwość
    klikania w nie za użytkownika.

    Na serwerze uprawnienie to jest właściwie niepotrzebne, bo narzędzia
    dostępności nie mają tu czego obsługiwać. Tym łatwiej je domknąć:
    zamyka się drogę, z której i tak nikt nie korzysta.

    Wyjątkiem są serwery terminali. Tam sesje użytkowników są prawdziwe
    i narzędzia dostępności bywają realnie potrzebne — ale nadal powinny
    leżeć tam, gdzie zapisu nie ma nikt poza administratorem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podłożenia programu w katalogu zapisywalnym dla użytkownika i sięgania
    przez niego do okien pracujących z wyższymi uprawnieniami.
  en: |
    The setting takes that a program asking for access to other applications' interface lie
    in a directory protected by the system - that is, one only an administrator may write to.

    The right at stake here is rare and stronger than it looks. A program granted it can read
    the content of windows belonging to other programs and send input events to them -
    including to windows working at a higher level of rights. It came about for accessibility
    tools: screen readers, magnifiers and on-screen keyboards, which without it could not do
    their work.

    Without the requirement of a protected directory that limit is a seeming one. A program
    placed in any directory a user may write to can declare the right and get it - and then
    gets sight of windows it ought not to see, and the means of clicking in them for the
    user.

    On a server the right is in effect needless, since accessibility tools have nothing here
    to serve. The easier, then, to close it off: a road nobody uses anyway is being shut.

    Terminal servers are the exception. There users' sessions are real and accessibility tools
    are at times truly taken - but they ought still to lie where nobody but an administrator
    has write.

    What an attacker gains while the item goes unmet: the means of planting a program in a
    directory a user may write to and reaching through it into windows working with higher
    rights.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie przestaje działać i nikt niczego nie zauważy. Narzędzia
    dostępności dostarczone z systemem leżą w katalogu chronionym
    z założenia, więc działają dalej bez zmiany.

    Na serwerze bez sesji interaktywnych skutek jest zerowy — nie ma
    programu, którego to dotyczy.

    Skutek pojawia się wyłącznie na serwerze terminali, na którym ktoś
    zainstalował narzędzie dostępności poza katalogami systemowymi —
    na przykład w katalogu profilu użytkownika. Narzędzie takie straci
    dostęp do okien innych programów. Nie przestanie się uruchamiać;
    przestanie być użyteczne, co jest objawem trudniejszym do powiązania
    z przyczyną.

    Rozwiązaniem nie jest cofnięcie ustawienia, tylko przeniesienie
    programu do katalogu chronionego. Ustawienie stawia wymaganie co do
    miejsca, a nie co do samego programu.
  en: |
    The change has no known side effects and takes no break.

    Nothing stops working and nobody notices anything. Accessibility tools delivered with the
    system lie in a protected directory by design, so they go on working unchanged.

    On a server with no interactive sessions the effect is nil - there is no program it
    concerns.

    The effect appears only on a terminal server on which somebody installed an accessibility
    tool outside the system directories - in a user profile's directory, for instance. Such a
    tool will lose access to other programs' windows. It will not stop starting; it will stop
    being of use, which is a symptom harder to tie to its cause.

    The answer is not undoing the setting but moving the program to a protected directory.
    The setting sets a requirement as to place rather than as to the program itself.

implementation_consequences:
  impact_areas:
    - user-interface
    - legacy-applications
    - remote-desktop
  what_breaks:
    pl:
      - Narzędzie dostępności zainstalowane poza katalogami systemowymi straci dostęp do okien
      - Objaw jest trudny do powiązania z przyczyną — program działa, ale przestaje być użyteczny
      - Narzędzia dostarczone z systemem leżą w katalogu chronionym i działają bez zmiany
      - Na serwerze bez sesji interaktywnych skutek jest zerowy
    en:
      - An accessibility tool installed outside the system directories will lose access to windows
      - The symptom is hard to tie to its cause - the program works but stops being of use
      - Tools delivered with the system lie in a protected directory and work unchanged
      - On a server with no interactive sessions the effect is nil
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer terminali obsługuje narzędzie dostępności zainstalowane poza katalogami systemowymi
    en:
      - A terminal server serves an accessibility tool installed outside the system directories
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableSecureUIAPaths'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'EnableSecureUIAPaths' -ErrorAction SilentlyContinue).'EnableSecureUIAPaths'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableSecureUIAPaths'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableSecureUIAPaths' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-only-elevate-uiaccess-applications-that-are-installed-in-secure-locations

notes:
  pl: |
    Za katalogi chronione system uznaje te, do których pisać może
    wyłącznie administrator — w praktyce katalog systemowy i katalogi
    programów. Ustawienie nie wymienia ich z nazwy, tylko sprawdza
    uprawnienia do zapisu.

    Wymaganie dotyczy miejsca, a nie programu. Narzędzie zablokowane tą
    zasadą odzyskuje pełne działanie po przeniesieniu do katalogu
    chronionego i nie trzeba w tym celu cofać ustawienia.

    Punkt czyta się razem z pozostałymi ustawieniami kontroli konta
    użytkownika, w szczególności z tym, które przesądza o zachowaniu
    programów dostępności wobec bezpiecznego pulpitu.
  en: |
    For protected directories the system holds those only an administrator may write to - in
    practice the system directory and the program directories. The setting does not name them
    but checks the rights of writing.

    The requirement concerns place rather than program. A tool blocked by this rule regains
    full working once moved to a protected directory, and undoing the setting is not needed
    for that.

    The item is read together with the remaining settings of user account control, in
    particular with the one settling how accessibility programs behave towards the secure
    desktop.
