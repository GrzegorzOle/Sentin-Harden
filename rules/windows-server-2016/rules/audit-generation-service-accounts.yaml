id: win2016-audit-generation-service-accounts

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Generowanie wpisów audytu tylko dla kont usługowych
    en: Generating audit entries restricted to service accounts
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do generowania wpisów w dzienniku
    zabezpieczeń do usługi lokalnej i usługi sieciowej.

    Dziennik zabezpieczeń jest tym miejscem, do którego sięga się po fakty:
    kto się zalogował, kiedy, skąd, co zmienił. Jego wartość bierze się stąd,
    że wpisy pochodzą z systemu, a nie od kogokolwiek. Uprawnienie opisane tym
    punktem pozwala wpisywać do niego z zewnątrz.

    Skutek nie polega na podrobieniu pojedynczego zdarzenia, choć i to jest
    możliwe. Polega na zalaniu dziennika. Dziennik ma skończony rozmiar i przy
    domyślnym ustawieniu nadpisuje najstarsze wpisy — kto może pisać, ten może
    wypchnąć z niego wszystko, co było wcześniej, nie kasując niczego wprost.
    Kasowanie zostawia ślad, przepełnienie wygląda jak zwykła praca.

    Kategoria średnia: samo uprawnienie nie otwiera drogi do systemu, ale
    zmniejsza wykrywalność wszystkiego, co przez niego przejdzie później.

    Na serwerze 2016 uprawnienie domyślnie należy do usługi lokalnej i usługi
    sieciowej. Administratorów na tej liście nie ma i być nie powinno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wypchnięcia z dziennika zabezpieczeń zapisu własnych działań, bez
    kasowania, które byłoby widoczne.
  en: |
    The item limits the right to generate entries in the security log to the local
    service and the network service.

    The security log is the place one turns to for facts: who signed in, when, from
    where, what they changed. Its worth comes of the entries arising from the
    system, not from just anybody. The right this item describes allows writing into
    it from outside.

    The effect is not the forging of a single event, though that too is possible. It
    is the flooding of the log. The log has a finite size and by default overwrites
    the oldest entries - whoever may write may push out of it everything that came
    before, without deleting anything outright. Deletion leaves a trace; overflow
    looks like ordinary work.

    The category is medium: the right by itself opens no road into the system, but
    it lowers the detectability of everything that passes through afterwards.

    On Server 2016 the right belongs by default to the local service and the network
    service. The administrators are not on that list and should not be.

    What an attacker gains while the item goes unmet: the ability to push the record
    of their own doings out of the security log, without a deletion that would be
    seen.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Domyślna lista obejmuje dokładnie te dwa konta
    usługowe i praktycznie nic więcej tego uprawnienia nie potrzebuje.

    Wpis spoza tej pary bierze się zwykle z aplikacji, która chce pisać własne
    zdarzenia do dziennika zabezpieczeń zamiast do dziennika aplikacji.
    Rozwiązaniem jest skierowanie jej do właściwego dziennika, a nie nadanie
    uprawnienia — dziennik zabezpieczeń nie jest miejscem na zdarzenia
    aplikacyjne i traci wartość, kiedy nim się staje.

    Czego to nie psuje: rejestrowania zdarzeń przez system, zasad audytu,
    przekazywania dzienników do zbieracza, odczytu dziennika ani zapisu do
    dzienników aplikacji i systemu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The default list covers exactly those two service
    accounts and practically nothing else needs this right.

    An entry outside that pair usually comes of an application wanting to write
    events of its own into the security log rather than into the application log.
    The answer is to point it at the proper log, not to grant the right - the
    security log is no place for application events and loses its worth when it
    becomes one.

    What this does not break: the recording of events by the system, audit policy,
    the forwarding of logs to a collector, reading the log, or writing into the
    application and system logs.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - legacy-applications
  what_breaks:
    pl:
      - Aplikacja pisząca własne zdarzenia wprost do dziennika zabezpieczeń przestaje to robić i zgłasza odmowę
      - Agent zbierający dane, który wstawiał własne znaczniki do dziennika zabezpieczeń, traci tę możliwość
      - Rejestrowanie zdarzeń przez system, zasady audytu i przekazywanie dzienników działają bez zmian
      - Odczyt dziennika oraz zapis do dzienników aplikacji i systemu pozostają nietknięte
    en:
      - An application writing events of its own straight into the security log stops doing so and reports a refusal
      - A collecting agent that put markers of its own into the security log loses that ability
      - The recording of events by the system, audit policy and log forwarding work unchanged
      - Reading the log, and writing into the application and system logs, stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja, której producent wymaga zapisu wprost do dziennika zabezpieczeń i nie da się jej skierować do dziennika aplikacji
    en:
      - An application whose vendor requires writing straight into the security log runs on the machine and cannot be pointed at the application log
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeAuditPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The log overwrites its oldest entries, so whoever may write may push out
    # everything earlier without a deletion that would leave a trace.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeAuditPrivilege = *S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeAuditPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/generate-security-audits

notes:
  pl: |
    Regułę warto czytać razem z punktem o zarządzaniu dziennikiem zabezpieczeń.
    Tamten mówi, kto może dziennik wyczyścić, ten — kto może go zapełnić.
    Pierwsze zostawia zdarzenie, drugie nie zostawia niczego.

    Ustawienie rozmiaru dziennika i zachowania przy przepełnieniu jest osobnym
    punktem i osobną regułą. Ta ogranicza źródło zapisu, tamta pojemność.

    Administratorzy nie potrzebują tego uprawnienia i nie powinni go mieć.
    Ich obecność na liście jest ustaleniem, a nie stanem domyślnym.
  en: |
    The rule is worth reading together with the item on managing the security log.
    That one says who may clear the log, this one who may fill it. The first leaves
    an event behind, the second leaves nothing.

    Setting the log's size and its behaviour on overflow is a separate item and a
    separate rule. This one limits the source of writing, that one the capacity.

    Administrators do not need this right and should not hold it. Their presence on
    the list is a finding, not a default state.
