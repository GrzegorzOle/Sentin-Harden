id: debian-13
nazwa: Debian 13 (trixie)
rodzina: linux
powloka: bash
profil: server

benchmark:
  nazwa: CIS Debian Linux Benchmark
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    . /etc/os-release
    printf '%s|%s\n' "$ID" "$VERSION_ID"
  dopasowanie: '^debian\|13$'

uwagi: |
  UWAGA: cel zapisany pierwotnie jako "Debian 24" — taka wersja nie istnieje.
  Numeracja Debiana to 11 (bullseye), 12 (bookworm), 13 (trixie, sierpień 2025).
  Przyjęto 13. Jeśli chodziło o 12, zmień nazwę katalogu i wartość dopasowania.

  Kontrola dostępu: Debian używa AppArmor, nie SELinuksa — reguły dotyczące
  SELinuksa należą wyłącznie do paczki Fedory i nie mają tu odpowiednika.
  Menedżer pakietów: apt.
