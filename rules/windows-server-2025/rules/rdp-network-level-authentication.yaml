id: win2025-rdp-network-level-authentication

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services
  title:
    pl: Uwierzytelnianie na poziomie sieci wymagane dla pulpitu zdalnego
    en: Network Level Authentication required for Remote Desktop
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe serwerowi uwierzytelnić łączącego się, zanim
    w ogóle zestawi dla niego sesję.

    Bez tego wymagania kolejność jest odwrotna i to jest sedno sprawy.
    Serwer najpierw tworzy sesję, uruchamia w niej obsługę pulpitu
    i wyświetla ekran logowania — a dopiero potem pyta, kim jest gość.
    Cała ta praca zostaje wykonana na żądanie kogoś, kto nie podał
    jeszcze żadnego poświadczenia.

    Wynikają z tego dwie rzeczy. Pierwsza: każdy, kto dosięgnie portu,
    zmusza serwer do przydzielenia sobie zasobów. Druga, ważniejsza:
    kod obsługujący sesję wykonuje się przed uwierzytelnieniem, więc
    błąd w tym kodzie jest błędem osiągalnym dla nieuwierzytelnionego.
    Najpoważniejsze znane luki w pulpicie zdalnym leżały dokładnie tam
    i były wykorzystywane zdalnie, bez żadnego konta.

    Uwierzytelnianie na poziomie sieci przenosi tę granicę przed sesję.
    Do kodu obsługi pulpitu dociera wyłącznie ten, kto przedstawił
    ważne poświadczenie.

    Kategorię podniosłem tu względem paczki stanowiska roboczego
    i powód jest prosty. Stanowisko robocze zwykle nie przyjmuje
    połączeń zdalnych. Serwer przyjmuje je z założenia — pulpit zdalny
    jest jego drzwiami wejściowymi, często jedynymi i nierzadko
    osiągalnymi z szerszej sieci, niż ktokolwiek planował.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    do kodu obsługi sesji serwera bez podawania jakiegokolwiek
    poświadczenia.
  en: |
    The setting bids the server authenticate the one connecting before it sets up a session for
    them at all.

    Without that call the order is the reverse, and therein lies the heart of the matter. The
    server first makes a session, starts the tending of the desktop within it and shows the
    sign-in screen - and only then asks who the guest is. All that work is done at the bidding of
    somebody who has given no credential yet.

    Two things follow. The first: anyone who reaches the port makes the server set aside means for
    them. The second, and the weightier: the code tending the session runs before the
    authentication, so a fault in that code is a fault reachable by the unauthenticated. The
    gravest known holes in remote desktop lay exactly there and were used from afar, with no
    account at all.

    Authentication at the network level moves that boundary before the session. Only the one who
    has shown a good credential reaches the code that tends the desktop.

    I raised the category here against the working station's pack and the reason is plain. A
    working station usually takes no remote connections. A server takes them by assumption -
    remote desktop is its front door, often the only one and not seldom reachable from a wider
    network than anyone planned.

    What an attacker gains while the item goes unmet: access to the code that tends the server's
    sessions without giving any credential at all.

disruption_description:
  pl: |
    Sprawdzenia wymagają dwie rzeczy i jedna z nich nie dotyczy tej
    zmiany, tylko sposobu, w jaki wolno ją na serwerze wprowadzać.

    Pierwsza to klienci. Uwierzytelnianie na poziomie sieci obsługują
    wszystkie współczesne wersje klienta pulpitu zdalnego, także na
    systemach innych niż Windows. Nie obsługują go terminale cienkiego
    klienta z zamrożonym oprogramowaniem wewnętrznym oraz narzędzia
    dostawców zestawiające sesję własną, starą biblioteką. Po zmianie
    takie połączenie nie dojdzie do skutku i objawem będzie odmowa
    zaraz po podaniu adresu, przed pokazaniem czegokolwiek.

    Na serwerze przypadki te są rzadsze niż w paczce stanowiska
    roboczego — do serwerów łączą się zwykle administratorzy
    ze stanowisk aktualnych. Wyjątkiem jest serwer terminali obsługujący
    park cienkich klientów w hali albo w punktach obsługi, gdzie
    urządzenia miewają po dziesięć lat.

    Druga rzecz jest ważniejsza i dotyczy każdej zmiany w drzwiach
    wejściowych serwera. Zanim zmienisz sposób łączenia się z maszyną,
    upewnij się, że masz do niej drogę inną niż ta, którą właśnie
    zmieniasz — konsolę karty zarządzającej albo konsolę hosta
    wirtualizacji. Pulpit zdalny bywa jedyną drogą do serwera stojącego
    w innej lokalizacji, a pomyłka zamyka ją natychmiast.

    Sama zmiana wchodzi w życie od razu i nie wymaga ponownego
    uruchomienia ani usługi, ani maszyny. Sesje już nawiązane pracują
    dalej — to dobrze, bo sesja, z której wprowadzasz zmianę, nie zostanie
    przerwana. Warunek sprawdza się dopiero przy następnym połączeniu.

    Cofnięcie jest natychmiastowe, ale wymaga dostępu do maszyny — i to
    jest właśnie powód, dla którego droga zapasowa ma być znana wcześniej.
  en: |
    Two things need checking, and one of them bears not on this change but on the way it may be
    brought in on a server.

    The first is the clients. Authentication at the network level is served by every present-day
    version of the remote desktop client, on systems other than Windows too. It is not served by
    thin client terminals with frozen inner software, nor by vendors' tools that set up a session
    with an old library of their own. After the change such a connection will not come about, and
    the symptom will be a refusal straight after the address is given, before anything is shown.

    On a server those cases are rarer than in the working station's pack - it is usually
    administrators from up-to-date stations who connect to servers. The exception is a terminal
    server serving a stock of thin clients in a hall or at service points, where the devices are
    at times ten years old.

    The second thing weighs more and bears on every change to a server's front door. Before you
    change how the machine is connected to, make sure you hold a road to it other than the one you
    are changing - the console of the management card or the console of the virtualisation host.
    Remote desktop is at times the only road to a server standing in another place, and a slip
    shuts it at once.

    The change itself comes into force straight away and takes no fresh start of the service nor
    of the machine. Sessions already opened work on - which is well, the session you make the
    change from not being broken. The condition is checked only at the next connecting.

    The undoing is at once, but it takes access to the machine - and that is just why the spare
    road is to be known beforehand.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Terminal cienkiego klienta z zamrożonym oprogramowaniem wewnętrznym nie połączy się z serwerem
      - Narzędzie dostawcy zestawiające sesję własną starą biblioteką przestanie działać
      - Objawem jest odmowa zaraz po podaniu adresu, przed pokazaniem ekranu logowania
      - Sesje już nawiązane pracują dalej, warunek sprawdza się przy następnym połączeniu
      - Zmiana działa od razu, bez restartu usługi ani maszyny
    en:
      - A thin client terminal with frozen inner software will not connect to the server
      - A vendor's tool setting up a session with an old library of its own will stop working
      - The symptom is a refusal straight after the address is given, before the sign-in screen is shown
      - Sessions already opened work on, the condition being checked at the next connecting
      - The change works straight away, with no restart of the service nor of the machine
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do serwera łączą się terminale, dla których producent nie wydaje już aktualizacji oprogramowania
      - Nie ma innej drogi do tej maszyny niż pulpit zdalny, bez konsoli karty zarządzającej ani konsoli hosta
    en:
      - Terminals connect to the server for which the maker no longer ships software updates
      - There is no road to this machine other than remote desktop, with no management card console nor host console
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $ts = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $deny = (Get-ItemProperty -Path $ts -Name 'fDenyTSConnections' -ErrorAction Stop).fDenyTSConnections
      if ($deny -eq 1) {
        # Remote Desktop is switched off, so there is no session layer to guard.
        'NOT_APPLICABLE'
      } else {
        $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        $name = 'UserAuthentication'
        if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
        else {
          $item = Get-ItemProperty -Path $path -ErrorAction Stop
          if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    $name = 'UserAuthentication'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sessions already opened are not broken. The condition is checked at the
    # next connecting, so the session this is run from stays.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
      -Name 'UserAuthentication' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Bez tego wymagania serwer najpierw tworzy sesję i uruchamia w niej
    obsługę pulpitu, a dopiero potem pyta, kim jest gość. Kod obsługi
    sesji wykonuje się więc przed uwierzytelnieniem — i tam leżały
    najpoważniejsze znane luki.

    Kategorię podniosłem względem paczki stanowiska roboczego, bo
    stanowisko zwykle nie przyjmuje połączeń zdalnych, a serwer przyjmuje
    je z założenia.

    Przed zmianą drzwi wejściowych serwera upewnij się, że masz do niego
    drogę inną niż ta, którą właśnie zmieniasz. Sesje już nawiązane nie
    są przerywane.
  en: |
    Without that call the server first makes a session and starts the tending of the desktop
    within it, and only then asks who the guest is. The code tending the session therefore runs
    before the authentication - and there lay the gravest known holes.

    I raised the category against the working station's pack, a station usually taking no remote
    connections and a server taking them by assumption.

    Before changing a server's front door make sure you hold a road to it other than the one you
    are changing. Sessions already opened are not broken.
