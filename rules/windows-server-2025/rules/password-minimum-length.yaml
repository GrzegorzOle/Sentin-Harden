id: win2025-password-minimum-length

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Najmniejsza dopuszczalna długość hasła
    en: The least admissible length of a password
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, ile znaków musi mieć hasło, i wymaga co najmniej
    czternastu.

    Długość hasła jest jedyną jego cechą, która naprawdę przekłada się na
    koszt złamania. Zbiór znaków i wymagania co do ich rodzajów dokładają
    niewiele w porównaniu z każdym kolejnym znakiem — dlatego ten punkt jest
    w całej grupie haseł najważniejszy.

    Na serwerze waży dodatkowo to, przeciw czemu hasło stoi. Skrót hasła
    zdjęty z maszyny łamie się bez kontaktu z siecią, bez ograniczenia
    liczby prób i bez żadnego śladu. Jedyne, co ogranicza napastnika, to
    czas — a czas rośnie z długością hasła wykładniczo. Konto
    administracyjne na serwerze z hasłem ośmioznakowym jest kontem, którego
    hasło da się odtworzyć w rozsądnym czasie niezależnie od tego, jak
    wygląda.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: realną
    możliwość odtworzenia haseł kont z tej maszyny po jednorazowym dostępie
    do ich skrótów. Przy hasłach krótkich jest to kwestia sprzętu,
    a nie umiejętności.

    Czternaście znaków jest progiem dolnym benchmarku, nie celem. Hasła
    kont uprzywilejowanych i usługowych powinny być dłuższe, bo nikt ich nie
    wpisuje z pamięci.
  en: |
    The setting settles how many characters a password has to have, and takes at least
    fourteen.

    A password's length is its one trait that truly bears on the cost of breaking it. The
    set of characters and the demands as to their kinds add little beside each further
    character - which is why this item is the weightiest of the whole password group.

    On a server what it stands against weighs besides. A password digest taken off a
    machine breaks with no contact with the network, no limit on the number of tries and no
    trace at all. The one thing limiting an attacker is time - and time grows with a
    password's length exponentially. An administrative account on a server with an
    eight-character password is an account whose password can be recovered in a reasonable
    time whatever it looks like.

    What an attacker gains while the item goes unmet: a real means of recovering the
    passwords of this machine's accounts after a single access to their digests. With short
    passwords it is a matter of hardware rather than of skill.

    Fourteen characters is the benchmark's lower threshold rather than a target. The
    passwords of privileged and service accounts ought to be longer, since nobody types
    them from memory.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to dlatego, że hasła krótsze niż nowy próg
    nie są unieważniane, ale nie dają się już odtworzyć — a to rozróżnienie
    decyduje o przebiegu wdrożenia.

    Hasła bieżące działają dalej i w dniu wdrożenia nic nie przestaje
    działać. Skutek pojawia się przy pierwszej zmianie hasła: krótsze nie
    zostanie przyjęte. Na kontach ludzi kończy się to zgłoszeniem, na
    kontach usługowych — zatrzymaną procedurą zmiany.

    Sprawdzenia wymagają aplikacje, które hasłem operują. Zdarzają się
    systemy przyjmujące hasła krótsze, pola wejściowe przycinające hasło do
    ustalonej długości i integracje przekazujące hasło dalej z ograniczeniem
    własnym. Każde z tych miejsc ujawni się dopiero przy zmianie hasła,
    a więc rozłożone w czasie.

    Osobnego rozważenia wymaga przypadek, w którym hasła są wpisywane przy
    starcie maszyny — na przykład przy odblokowaniu woluminu. Tam każdy
    dodatkowy znak jest kosztem realnym, ponoszonym przez człowieka.

    Na serwerze członkowskim zasada obejmuje konta lokalne. Na kontrolerze
    domeny obejmuje wszystkie konta w domenie i jest wtedy zmianą dotykającą
    całej organizacji.

    Zmiana nie wymaga restartu.
  en: |
    A knowing rollout is needed because passwords shorter than the new threshold are not
    voided but can no longer be set afresh - and that distinction settles the course of the
    rollout.

    Current passwords go on working and on the day of the rollout nothing stops working.
    The effect appears at the first password change: a shorter one will not be taken. On
    people's accounts that ends in a case being raised, on service accounts in a halted
    change procedure.

    Applications that handle passwords need checking. There are systems taking shorter
    passwords, input fields cutting a password to a settled length, and integrations
    passing a password on with a limit of their own. Each of those places will come to
    light only at a password change, and so spread out over time.

    The case in which passwords are typed at the machine's start - for instance at the
    unlocking of a volume - takes weighing apart. There every further character is a real
    cost borne by a person.

    On a member server the policy takes in local accounts. On a domain controller it takes
    in every account in the domain and is then a change touching the whole organisation.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Ustawienie hasła krótszego niż próg zostaje odrzucone przy najbliższej zmianie
      - Aplikacje przycinające hasło do ustalonej długości przestają przyjmować logowanie
      - Hasła bieżące nie są unieważniane i działają do czasu zmiany
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
    en:
      - Setting a password shorter than the threshold is refused at the next change
      - Applications cutting a password to a settled length stop taking the sign-in
      - Current passwords are not voided and work until they are changed
      - On a domain controller the change takes in every account in the domain at once
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze pracują aplikacje nieprzyjmujące haseł dłuższych niż ustalony limit
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - Applications not taking passwords longer than a settled limit work on the server
      - The server is a domain controller and a change of the domain's policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '14'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MinimumPasswordLength'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordLength = 14',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordLength = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-length

notes:
  pl: |
    Porównanie jest „nie mniej niż", więc próg wyższy niż czternaście
    spełnia punkt tak samo. Polecenie naprawcze zapisuje wartość progową
    jako najmniejszą zmianę prowadzącą do zgodności.

    Warto zauważyć, że benchmark stawia tutaj czternaście, a przy hasłach
    losowanych maszynowo dla lokalnego administratora — piętnaście. Różnica
    nie jest przypadkiem: piętnaście jest granicą, powyżej której przestaje
    powstawać skrót wyliczany mechanizmem sprzed lat. Hasło wpisywane przez
    człowieka jest kompromisem, hasło losowane maszynowo nim być nie musi.

    Zakres zasady zależy od roli serwera i na kontrolerze domeny obejmuje
    całą domenę. Jest to najpoważniejsza zmiana z całej grupy haseł
    i na tej roli wymaga uzgodnienia poza zespołem technicznym.
  en: |
    The comparison is "not less than", so a threshold higher than fourteen meets the item
    just as well. The remedy command writes the threshold value as the smallest change
    leading to compliance.

    It is worth noting that the benchmark sets fourteen here, and fifteen for the
    machine-chosen passwords of the local administrator. The difference is no chance:
    fifteen is the boundary above which the digest reckoned by a mechanism from years ago
    stops being made. A password typed by a person is a compromise; a machine-chosen one
    need not be.

    The policy's reach depends on the server's role and on a domain controller it takes in
    the whole domain. It is the weightiest change of the whole password group and on that
    role takes agreement beyond the technical team.
