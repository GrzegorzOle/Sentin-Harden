id: win10-audit-security-group-management

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Account Management
  title:
    pl: Inspekcja zarządzania grupami zabezpieczeń
    en: The audit of the handling of guarding groups
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zmiany w składzie grup zabezpieczeń: dopisanie konta
    do grupy, usunięcie z niej oraz utworzenie i skasowanie samej grupy.

    Dopisanie konta do grupy administratorów jest czynnością jednego
    polecenia i skutkiem nieodwracalnym w tym sensie, że od tej chwili
    konto może wszystko — łącznie z zatarciem śladu po tym, jak to
    uzyskało. Kolejność ma tu znaczenie: zapis o dopisaniu powstaje, zanim
    nowe uprawnienia zaczną działać.

    Jest to droga tańsza niż utworzenie konta własnego, bo nie wprowadza
    do systemu niczego nowego. Konto już istnieje, jest znane, ma historię
    i nie wzbudza pytań. Zmienia się wyłącznie jeden wiersz w składzie
    grupy — i bez tego zapisu nie wiadomo, kiedy się zmienił.

    Odnotowuję, że podkategoria obejmuje również usunięcie z grupy. Bywa to
    ślad po czynności odwrotnej: napastnik ograniczający dostęp innym albo
    zacierający własne wcześniejsze dopisanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uprawnienia
    administratora na koncie istniejącym, uzyskane bez tworzenia czegokolwiek
    nowego i bez śladu w czasie.
  en: |
    The setting writes down changes in the make-up of guarding groups: the writing of an account into a group,
    its taking out, and the making and the striking out of the group itself.

    The writing of an account into the administrators' group is an act of one command and a consequence past
    recall in this sense, that from that hour the account may do everything - the covering of the trace of how
    it came by that among the rest. Order matters here: the entry about the writing in comes about before the
    new rights begin to work.

    It is a road cheaper than the making of an account of one's own, bringing nothing new into the system. The
    account already is, is known, has a history and raises no questions. One line alone in a group's make-up
    changes - and without this record there is no knowing when it changed.

    I set down that the subcategory takes in the taking out of a group as well. That is at times the trace of the
    opposite act: an attacker bounding others' reach, or covering their own earlier writing in.

    What an attacker gains while the item goes unmet: an administrator's rights upon an account that already is,
    come by without making anything new and without a trace in time.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia składu żadnej grupy i nie wpływa na to, kto może
    go zmieniać. Zapisuje wyłącznie fakt zmiany.

    Liczba wpisów jest w normalnej pracy bliska zeru. Skład grup
    zabezpieczeń na stanowisku roboczym ustala się raz i zmienia rzadko.

    Odnotowuję źródło wpisów przy wdrożeniu: narzędzia do zarządzania
    stanowiskami dopisują konta do grup przy pierwszej konfiguracji,
    a niektóre powtarzają to przy każdym odświeżeniu zasad. Wpisy takie są
    powtarzalne i dotyczą tych samych par konto-grupa.

    Zapisywany jest wyłącznie wynik udany. Odrzucona próba dopisania się do
    grupy nie jest zmianą składu, a jej ślad leży w inspekcji użycia
    uprawnień.

    Czego to nie psuje: składu grup, dopisywania do nich, uprawnień,
    logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes the make-up of no group and bears not upon who may change it. It writes down the fact of
    a change alone.

    The number of entries is in ordinary work near nought. The make-up of guarding groups upon a working station
    is settled once and changed seldom.

    I set down a source of entries at a rolling out: tools for the handling of workstations write accounts into
    groups at the first setting up, and some repeat it at every refreshing of the rules. Such entries repeat and
    touch the same pairings of account and group.

    Only the successful outcome is written. A refused attempt at writing oneself into a group is no change of
    make-up, and its trace lies in the audit of the use of rights.

    What this does not break: the make-up of groups, the writing into them, rights, logging on, file shares, or
    printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Narzędzia do zarządzania stanowiskami dopisują konta do grup przy konfiguracji, a niektóre powtarzają to przy każdym odświeżeniu zasad
      - Wpisy takie są powtarzalne i dotyczą tych samych par konto-grupa, więc łatwo je odsiać
      - Zapisywany jest wyłącznie wynik udany, bo odrzucona próba dopisania się nie jest zmianą składu
      - Ustawienie nie zmienia składu żadnej grupy i nie wpływa na to, kto może go zmieniać
      - Uprawnienia, logowanie, konta domenowe, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Tools for the handling of workstations write accounts into groups at the setting up, and some repeat it at every refreshing of the rules
      - Such entries repeat and touch the same pairings of account and group, so they are easy to sift out
      - Only the successful outcome is written, a refused attempt at writing oneself in being no change of make-up
      - The setting changes the make-up of no group and bears not upon who may change it
      - Rights, logging on, domain accounts, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto porównać składu grup ze stanem sprzed wdrożenia
    en:
      - The record is not gathered away from the machine and there is nobody to set the groups make-up against the state before the rolling out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9237-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9237-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9237-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. A refused attempt at joining a group
    # is not a change of membership, and its trace lies in the use of rights.
    auditpol /set /subcategory:"{0CCE9237-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9237-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-security-group-management

notes:
  pl: |
    Reguła jest w tym bloku parą dla inspekcji zarządzania kontami i razem
    z nią obejmuje całą drogę: konto i jego uprawnienia. Warto, żeby
    aplikacja pokazywała je obok siebie, bo napastnik wybiera jedną
    z dwóch — i wyłączenie którejkolwiek zostawia połowę drogi bez zapisu.

    Argument wart zachowania dotyczy kolejności. Zapis o dopisaniu do grupy
    administratorów powstaje, zanim nowe uprawnienia zaczną działać. Jest to
    jedyny moment, w którym system jeszcze zapisuje, a konto jeszcze nie
    może zapisu wyłączyć.

    Odnotowuję, że dopisanie do grupy jest drogą tańszą niż utworzenie
    konta, a przez to częstszą. Konto istniejące nie wzbudza pytań, ma
    historię i wygląda naturalnie. Aplikacja opisująca ten punkt jako
    „zarządzanie grupami" nie oddaje tego, co on faktycznie widzi.
  en: |
    The rule is in this block the mate of the audit of the handling of accounts, and together with it takes in
    the whole road: the account and its rights. It is well that the application show them side by side, an
    attacker choosing one of the two - and the switching off of either leaves half the road unrecorded.

    The argument worth keeping touches order. The entry about a writing into the administrators' group comes
    about before the new rights begin to work. It is the one moment in which the system still writes and the
    account cannot yet switch the writing off.

    I set down that a writing into a group is a road cheaper than the making of an account, and for that the
    commoner. An account that already is raises no questions, has a history and looks natural. An application
    setting this item out as "the handling of groups" does not render what it in fact sees.
