id: iis
name:
  pl: IIS
  en: IIS
family: windows
shell: powershell
profile: application

# OVERLAY, not a standalone target.
# IIS is always audited together with the system it runs on. The host pack
# (windows-server-2016 or windows-server-2025) applies in full, and this pack
# adds the application items on top. The report must show both sets together.
type: overlay
requires_host:
  - windows-server-2016
  - windows-server-2025

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD

detection:
  command: |
    if (Get-Service -Name W3SVC -ErrorAction SilentlyContinue) {
      $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\InetStp' -ErrorAction SilentlyContinue).VersionString
      'PRESENT|{0}' -f $v
    } else {
      'ABSENT'
    }
  match: '^PRESENT'

notes:
  pl: |
    Zakres zmian bywa szerszy niż sam serwer: część ustawień działa na poziomie
    całego serwera, część na poziomie pojedynczej witryny lub puli aplikacji.
    Reguła musi jasno mówić, który poziom modyfikuje — inaczej kopia zapasowa
    obejmie niewłaściwy zakres, a wycofanie nie przywróci stanu.

    Kopia konfiguracji IIS to nie plik do skopiowania ręcznie — służy do tego
    wbudowany mechanizm kopii konfiguracji serwera i reguły mają z niego
    korzystać zamiast kopiować applicationHost.config na boku.
  en: |
    The scope of a change is often wider than the server itself: some settings
    act at server level, others at site or application pool level. A rule must
    state which level it modifies - otherwise the backup covers the wrong scope
    and the rollback does not restore the previous state.

    An IIS configuration backup is not a file to copy by hand - the server has
    a built-in configuration backup mechanism and rules are expected to use it
    rather than copying applicationHost.config on the side.
