id: win2016-kerberos-encryption-types

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Dozwolone typy szyfrowania dla protokołu biletowego
    en: Permitted encryption types for the ticket protocol
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zawęża listę mechanizmów szyfrowania, jakie maszyna dopuszcza
    w protokole biletowym używanym do uwierzytelniania w domenie, do tych
    dzisiejszych.

    Protokół ten jest głównym mechanizmem uwierzytelniania w domenie i wszystko,
    co w nim krąży, jest zaszyfrowane kluczem wyprowadzonym z hasła konta.
    Mechanizmów szyfrowania jest kilka — od bardzo starych, obecnych wyłącznie
    dla zgodności wstecznej, po dzisiejsze. Bez tego punktu maszyna dopuszcza
    wszystkie.

    Znaczenie ma tu jedna właściwość, o której łatwo zapomnieć. Bilet wydany
    w słabym mechanizmie można wziąć i odtworzyć z niego hasło konta,
    pracując poza siecią ofiary, bez pośpiechu i bez śladu. Konta usług
    w domenie są celem szczególnie wdzięcznym, bo ich hasła bywają wieloletnie,
    a uprawnienia szerokie.

    Napastnik nie musi przy tym czekać, aż słaby mechanizm zostanie użyty.
    Może o niego poprosić — jeżeli maszyna go dopuszcza, dostanie bilet
    w takiej postaci, jakiej zażądał. Dopuszczenie słabego mechanizmu jest
    więc równoznaczne z jego użyciem.

    Wartość wymagana jest sumą bitów opisujących dopuszczone mechanizmy;
    zawiera dzisiejsze i pomija te wycofane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zażądania biletu w słabym mechanizmie i odtworzenia z niego hasła konta
    usługi poza siecią ofiary.
  en: |
    The setting narrows the list of encryption mechanisms the machine allows in the
    ticket protocol used to authenticate in the domain, down to the present-day
    ones.

    That protocol is the chief mechanism of authentication in a domain, and
    everything circulating in it is encrypted with a key derived from an account's
    password. There are several encryption mechanisms - from very old ones, present
    for backward compatibility alone, to present-day ones. Without this item the
    machine allows them all.

    One property matters here, and it is easily forgotten. A ticket issued under a
    weak mechanism can be taken and the account's password recovered from it,
    working away from the victim's network, without haste and without a trace.
    Service accounts in a domain are a particularly rewarding target, since their
    passwords are at times years old and their privileges wide.

    The attacker need not wait for the weak mechanism to be used. They can ask for
    it - if the machine allows it, they will get a ticket in the form they demanded.
    Allowing a weak mechanism is therefore the same as using it.

    The required value is a sum of bits describing the mechanisms allowed; it holds
    the present-day ones and leaves out those withdrawn.

    What an attacker gains while the item goes unmet: the means of demanding a
    ticket under a weak mechanism and recovering a service account's password from
    it away from the victim's network.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia". Zmiana dotyczy uwierzytelniania
    domenowego, czyli rzeczy, bez której maszyna przestaje być użyteczna —
    a skutek pojawia się natychmiast i obejmuje wszystkich naraz.

    Wdrożenia nie da się rozpatrywać w oderwaniu od reszty domeny i to jest tu
    najważniejsze. Uwierzytelnienie wymaga zgody obu stron oraz kontrolera
    domeny co do mechanizmu. Zawężenie listy na jednej maszynie, gdy kontrolery
    albo konta usług nadal są skonfigurowane pod mechanizm starszy, kończy się
    odmową wydania biletu.

    Trzy miejsca wymagają sprawdzenia wcześniej. Pierwsze: konta usług
    w katalogu, oznaczone jako wymagające starszego mechanizmu — takie
    oznaczenia bywają odziedziczone i nikt ich nie zdejmuje. Drugie: relacje
    zaufania z innymi domenami, gdzie mechanizm uzgadnia się osobno. Trzecie:
    urządzenia i aplikacje uwierzytelniające się do domeny własną biblioteką,
    zwykle uboższą niż systemowa.

    Objaw jest jednoznaczny, ale mylący w opisie: użytkownik widzi odmowę
    dostępu do usługi, a nie komunikat o mechanizmie szyfrowania. Powiązanie
    tego z tą zmianą bywa trudne, jeśli nikt nie pamięta, że ją wprowadzono.

    Czego to nie psuje: logowania kontami lokalnymi, pracy usług
    nieuwierzytelniających się do domeny ani dostępu do zasobów lokalnych.

    Bez restartu, natychmiast odwracalne — ale skutek jest natychmiastowy.
  en: |
    The class is "needs a planned rollout". The change concerns domain
    authentication, that is the thing without which the machine ceases to be useful
    - and the effect appears at once and takes in everybody together.

    The rollout cannot be weighed apart from the rest of the domain, and that is the
    chief thing here. Authentication calls for agreement between both sides and the
    domain controller as to the mechanism. Narrowing the list on one machine while
    the controllers or the service accounts are still configured for an older
    mechanism ends in a refusal to issue a ticket.

    Three places call for a check beforehand. First: service accounts in the
    directory marked as needing the older mechanism - such marks are at times
    inherited and nobody takes them off. Second: trust relationships with other
    domains, where the mechanism is settled separately. Third: devices and
    applications authenticating to the domain with a library of their own, as a rule
    poorer than the system's.

    The symptom is unambiguous but misleading in its wording: the user sees a
    service access denied, not a message about an encryption mechanism. Tying that
    to this change can be hard if nobody remembers it was made.

    What this does not break: signing in with local accounts, the working of
    services that do not authenticate to the domain, or access to local resources.

    No restart, undone immediately - but the effect is immediate.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Konto usługi oznaczone w katalogu jako wymagające starszego mechanizmu przestaje dostawać bilet i usługa traci dostęp
      - Relacja zaufania z domeną uzgadniającą mechanizm osobno przestaje przyznawać dostęp
      - Urządzenia i aplikacje uwierzytelniające się do domeny własną biblioteką tracą możliwość zalogowania
      - Logowanie kontami lokalnymi i dostęp do zasobów lokalnych pozostają bez zmian
    en:
      - A service account marked in the directory as needing the older mechanism stops getting a ticket and the service loses access
      - A trust relationship with a domain that settles the mechanism separately stops granting access
      - Devices and applications authenticating to the domain with a library of their own lose the means of signing in
      - Signing in with local accounts and access to local resources stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przejrzano kont usług w katalogu pod kątem oznaczeń wymagających starszego mechanizmu
      - Istnieją relacje zaufania z domenami, w których mechanizm uzgadnia się osobno i nic o nim nie wiadomo
      - Do domeny uwierzytelniają się urządzenia albo aplikacje korzystające z własnej biblioteki
    en:
      - The service accounts in the directory have not been reviewed for marks demanding the older mechanism
      - Trust relationships exist with domains where the mechanism is settled separately and nothing is known of it
      - Devices or applications using a library of their own authenticate to the domain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
      $name = 'SupportedEncryptionTypes'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2147483640'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
    $name = 'SupportedEncryptionTypes'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is a sum of bits describing the mechanisms allowed. It holds the
    # present-day ones and the room left for future ones, and leaves out those
    # withdrawn - a ticket issued under one of those can be turned back into the
    # account password away from the network.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SupportedEncryptionTypes' -Value 2147483640 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-configure-encryption-types-allowed-for-kerberos

notes:
  pl: |
    Wartość jest sumą bitów, w której zawarto także miejsce na mechanizmy
    przyszłe. Jest to celowe: lista ma zawężać się od dołu, a nie zamykać od
    góry, żeby nowszy mechanizm nie został przy okazji zablokowany.

    Punkt jest jedną z niewielu reguł w tym zestawie, których wdrożenie wymaga
    uzgodnienia poza maszyną. Konta usług i kontrolery domeny muszą być gotowe
    wcześniej, bo inaczej maszyna odmówi uwierzytelnienia, a przyczyna będzie
    leżeć gdzie indziej. Aplikacja powinna to mówić wprost, zamiast traktować
    punkt jak każdą inną zmianę rejestru.

    W macierzy ryzyka i uciążliwości reguła trafia w pole, w którym opis
    skutków ma być najlepszy w całej aplikacji: zysk realny, koszt realny,
    a pomyłka kosztuje dostęp do domeny.
  en: |
    The value is a sum of bits in which room has also been left for future
    mechanisms. That is deliberate: the list is to narrow from below rather than
    close from above, so that a newer mechanism is not blocked along the way.

    The item is one of the few rules in this set whose rollout calls for agreement
    beyond the machine. Service accounts and domain controllers have to be ready
    beforehand, or the machine will refuse authentication and the cause will lie
    elsewhere. The application should say so outright rather than treating the item
    as any other registry change.

    In the risk-and-disruption matrix the rule falls in the square where the
    description of consequences is to be the best in the whole application: a real
    gain, a real cost, and a mistake costing access to the domain.
