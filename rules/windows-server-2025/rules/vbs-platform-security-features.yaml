id: win2025-vbs-platform-security-features

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Wymagane zabezpieczenia platformy dla wirtualizacji
    en: Required platform security features for virtualization
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby warstwa wirtualizacji uruchamiała się wyłącznie
    wtedy, gdy platforma zapewnia bezpieczny rozruch oraz ochronę pamięci
    przed bezpośrednim dostępem urządzeń.

    Zostawiam kategorię wysoką i chcę nazwać, czym ten punkt różni się od
    punktu włączającego samą warstwę, bo z nazwy wyglądają na to samo.

    Tamten mówi „ma działać". Ten mówi „ma działać na uczciwym
    fundamencie". Bez niego warstwa wirtualizacji uruchomi się także tam,
    gdzie platforma nie daje pełnych gwarancji, i będzie działać
    w trybie ograniczonym — co w raporcie wygląda dokładnie tak samo jak
    tryb pełny, bo mechanizm jest włączony i działa.

    Rzecz w tym, czego brak zmienia. Bez bezpiecznego rozruchu można
    podmienić to, co wykonuje się przed systemem, a wtedy warstwa
    chroniąca system uruchamia się już w środowisku przygotowanym przez
    kogoś innego. Bez ochrony pamięci przed bezpośrednim dostępem
    urządzeń można sięgnąć do pamięci z pominięciem procesora — a więc
    z pominięciem wszystkiego, co procesor egzekwuje. W obu wypadkach
    granica, której ma pilnować hipernadzorca, jest omijana od spodu,
    a nie przełamywana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: warstwę
    zabezpieczeń, która działa, ale stoi na fundamencie, którego nikt nie
    sprawdził — i której obejście nie wymaga jej łamania.
  en: |
    The item requires the virtualisation layer to start only where the platform
    provides secure boot and protection of memory against direct device access.

    I keep the category high, and I want to name how this item differs from the one
    that switches the layer itself on, because by their names they look the same.

    That one says "it must work". This one says "it must work on an honest
    foundation". Without it the virtualisation layer will start even where the
    platform gives no full guarantees, and will run in a reduced mode - which in a
    report looks exactly like the full mode, because the mechanism is switched on
    and running.

    The point is what the absence changes. Without secure boot, what runs before
    the system can be substituted, and then the layer protecting the system starts
    in an environment prepared by somebody else. Without protection of memory
    against direct device access, memory can be reached bypassing the processor -
    and therefore bypassing everything the processor enforces. In both cases the
    boundary the hypervisor is meant to guard is gone around from below rather than
    broken through.

    What an attacker gains while the item goes unmet: a security layer that works
    but stands on a foundation nobody checked - and getting around it requires no
    breaking of it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i odnotowuję, że jest
    to w tej grupie punkt, przy którym najczęściej okaże się, że zmiana
    jest niewykonalna na tej maszynie — a to jest inny rodzaj kłopotu
    niż zmiana groźna.

    Wymagania dotyczą platformy, nie systemu. Bezpieczny rozruch jest
    ustawieniem oprogramowania układowego i na starszych serwerach bywa
    niedostępny albo wyłączony, a jego włączenie na maszynie
    zainstalowanej w trybie zgodności ze starszym rozruchem oznacza
    przeinstalowanie systemu, nie przestawienie opcji. Ochrona pamięci
    przed bezpośrednim dostępem urządzeń wymaga sprzętu, który ją
    obsługuje, i na maszynie wirtualnej zwykle nie jest dostępna wcale.

    Skutek jest taki, że po tej zmianie warstwa, która przedtem działała
    połowicznie, przestanie uruchamiać się w ogóle. Objaw jest mylący,
    bo wygląda na regres: było włączone, teraz nie ma. W rzeczywistości
    nie zepsuło się nic — po prostu przestał obowiązywać kompromis,
    o którym nikt nie wiedział.

    Dlatego właściwą kolejnością jest najpierw sprawdzić stan platformy:
    czy maszyna rusza w trybie bezpiecznego rozruchu i czy ochrona
    pamięci jest zgłaszana jako obecna. Punkt stosuje się po tym
    sprawdzeniu, a nie przed nim. Tam, gdzie platforma wymagań nie
    spełnia, właściwym wynikiem pracy jest zapisany wyjątek z datą
    przeglądu wskazującą moment wymiany sprzętu.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I keep the class "needs a planned rollout" and note that this is the item in
    the group where it will most often turn out that the change is not feasible on
    this machine - and that is a different kind of trouble than a dangerous change.

    The requirements are on the platform, not on the system. Secure boot is a
    firmware setting and on older servers is sometimes unavailable or switched off,
    and switching it on for a machine installed in legacy boot mode means
    reinstalling the system, not flipping an option. Protection of memory against
    direct device access requires hardware that supports it, and on a virtual
    machine is usually not available at all.

    The effect is that after this change the layer which previously ran by halves
    will stop starting altogether. The symptom misleads, because it looks like a
    regression: it was on, now it is gone. In reality nothing broke - a compromise
    nobody knew about simply stopped applying.

    So the right order is to check the state of the platform first: whether the
    machine boots in secure boot mode and whether memory protection is reported as
    present. The item is applied after that check, not before it. Where the
    platform does not meet the requirements, the right result of the work is a
    recorded exception with a review date pointing at the hardware replacement.

    The change binds after a restart and is undone after another one.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - boot-and-firmware
    - drivers-and-devices
  what_breaks:
    pl:
      - Warstwa wirtualizacji, która przedtem działała w trybie ograniczonym, przestaje uruchamiać się w ogóle
      - Objaw wygląda na regres, choć nie zepsuło się nic — przestał obowiązywać kompromis, o którym nikt nie wiedział
      - Bezpieczny rozruch bywa niedostępny na starszych serwerach, a na maszynie z rozruchem starszego typu wymaga przeinstalowania systemu
      - Ochrona pamięci przed bezpośrednim dostępem urządzeń na maszynie wirtualnej zwykle nie jest dostępna wcale
      - Tam, gdzie platforma wymagań nie spełnia, właściwym wynikiem jest zapisany wyjątek z datą wymiany sprzętu
    en:
      - The virtualisation layer that previously ran in a reduced mode stops starting altogether
      - The symptom looks like a regression, though nothing broke - a compromise nobody knew about stopped applying
      - Secure boot is sometimes unavailable on older servers, and on a machine using legacy boot it requires reinstalling the system
      - Protection of memory against direct device access is usually not available at all on a virtual machine
      - Where the platform does not meet the requirements, the right result is a recorded exception with a hardware replacement date
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie sprawdzono, czy maszyna rusza w trybie bezpiecznego rozruchu i czy ochrona pamięci jest zgłaszana jako obecna
      - Maszyna jest zainstalowana w trybie zgodności ze starszym rozruchem, a przeinstalowanie systemu nie jest zaplanowane
      - Serwer jest maszyną wirtualną bez dostępnej ochrony pamięci przed bezpośrednim dostępem urządzeń
    en:
      - It has not been checked whether the machine boots in secure boot mode and whether memory protection is reported as present
      - The machine is installed in legacy boot compatibility mode and no reinstall is planned
      - The server is a virtual machine with no protection of memory against direct device access available
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      $name = 'RequirePlatformSecurityFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    $name = 'RequirePlatformSecurityFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Check the platform first: whether the machine boots with secure boot and
    # whether DMA protection is reported as present. Where it is not, the layer
    # that ran in reduced mode will stop starting at all - that looks like a
    # regression but is the hidden compromise ending.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequirePlatformSecurityFeatures' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Różnica wobec punktu włączającego samą warstwę: tamten mówi „ma
    działać", ten „ma działać na uczciwym fundamencie". Bez niego warstwa
    uruchomi się także tam, gdzie platforma nie daje pełnych gwarancji,
    i będzie działać w trybie ograniczonym — co w raporcie wygląda
    identycznie jak tryb pełny.

    Bez bezpiecznego rozruchu i bez ochrony pamięci przed bezpośrednim
    dostępem urządzeń granica pilnowana przez hipernadzorcę jest omijana
    od spodu, a nie przełamywana.

    Punkt, przy którym najczęściej okaże się, że zmiana jest na tej
    maszynie niewykonalna — a to inny rodzaj kłopotu niż zmiana groźna.
    Właściwym wynikiem jest wtedy wyjątek z datą wymiany sprzętu.
  en: |
    The difference from the item that switches the layer itself on: that one says
    "it must work", this one "it must work on an honest foundation". Without it the
    layer will start even where the platform gives no full guarantees, and will run
    in a reduced mode - which in a report looks identical to the full mode.

    Without secure boot and without protection of memory against direct device
    access, the boundary guarded by the hypervisor is gone around from below rather
    than broken through.

    The item where it will most often turn out that the change is not feasible on
    this machine - and that is a different kind of trouble than a dangerous change.
    The right result is then an exception with a hardware replacement date.
