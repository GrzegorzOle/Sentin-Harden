id: win10-restore-files-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odtwarzanie plików zastrzeżone dla administratorów
    en: The restoring of files reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo odtwarzania plików dla administratorów
    lokalnych.

    Jest to odpowiednik prawa do tworzenia kopii, ale z wektorem
    odwróconym — i właśnie dlatego jest groźniejsze. Prawo do kopii
    pozwala czytać wszystko z pominięciem uprawnień; prawo do odtwarzania
    pozwala wszystko zapisywać.

    Zapis z pominięciem uprawnień oznacza możliwość podmiany plików,
    do których konto nie ma dostępu: bibliotek systemowych, programów
    uruchamianych z podniesionymi uprawnieniami, zadań i skryptów
    startowych. Prawo to pozwala dodatkowo zmienić właściciela obiektu,
    co zamyka całość.

    Skutek jest taki, że konto z tym prawem może podłożyć własny kod
    w miejsce cudzego i doczekać, aż ktoś uprawniony go uruchomi.
    Nie jest to nawet podniesienie uprawnień — jest to uzyskanie ich
    cudzymi rękami, przy okazji następnego uruchomienia systemu.

    Podobnie jak przy kopii, uprawnienia plików pozostają przy tym
    nietknięte. Droga jest przewidziana i legalna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapis do
    dowolnego pliku na maszynie, z podmianą właściciela włącznie.
  en: |
    The setting reserves the right of restoring files to the local administrators.

    It is the counterpart of the right of backing up, but with its direction turned about - and for that very
    reason it is the graver. The right of backing up lets everything be read with rights passed over; the right of
    restoring lets everything be written.

    Writing with rights passed over means the changing out of files an account has no way into: the system's
    libraries, programs run with raised rights, tasks and scripts of the start. That right besides lets an
    object's owner be changed, which closes the whole.

    The upshot is that an account with this right may lay its own code in the place of another's and wait for
    somebody with the right to run it. It is not even a raising of rights - it is the getting of them by another's
    hands, at the next starting of the system.

    As with the backing up, files' rights stay untouched by this. The road is foreseen and lawful.

    What an attacker gains while the item goes unmet: the writing to any file at all upon the machine, the
    changing of its owner included.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest
    oprogramowanie odtwarzające dane.

    Miejscem najczęstszym jest ten sam agent kopii zapasowych, który
    pojawia się przy prawie do odczytu. Wiele takich programów potrzebuje
    obu praw: jednego do wykonania kopii, drugiego do jej przywrócenia.
    Warto przeczytać oba wykazy razem, bo odebranie jednego z nich zatrzyma
    połowę pracy agenta.

    Miejscem drugim jest grupa operatorów kopii zapasowych, ta sama co
    poprzednio. Jest ona w tym wykazie z założenia.

    Odnotowuję, że skutek odebrania jest tu mniej widoczny niż przy
    odczycie. Kopia, która się nie wykonała, rzuca się w oczy od razu;
    odtwarzanie, które przestało działać, wychodzi na jaw dopiero
    wtedy, gdy ktoś go potrzebuje — czyli w najgorszym możliwym momencie.
    Jest to argument za sprawdzeniem przed zmianą, a nie po.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.
    Zadanie odtwarzania w toku dokończy się normalnie.

    Czego to nie psuje: zapisu plików w ramach własnych uprawnień,
    logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is the software that restores data.

    The commonest place is that same agent of backing up that shows at the right of reading. Many such programs
    need both rights: one for the making of a copy, the other for the setting of it back. It is worth reading both
    lists together, the taking away of one of them holding half the agent's work.

    The second place is the group of backup operators, the same as before. It stands in this list by design.

    I set down that the upshot of the taking away is here less plain than at the reading. A copy that was not made
    catches the eye at once; a restoring that has ceased to work comes to light only when somebody needs it -
    which is to say at the worst possible hour. It is an argument for a review before the change and not after.

    The consequence shows at the next signing in of an account that loses the right. A task of restoring under way
    will finish in the ordinary manner.

    What this does not break: the writing of files within one's own rights, logging on, file shares, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Agent kopii zapasowych straci możliwość przywracania danych, choć samo tworzenie kopii może działać dalej
      - Konta w grupie operatorów kopii zapasowych stracą zapis plików z pominięciem uprawnień
      - Skutek wychodzi na jaw dopiero wtedy, gdy ktoś potrzebuje odtworzenia, czyli w najgorszym momencie
      - Warto przeczytać wykazy prawa do kopii i do odtwarzania razem, bo agent zwykle potrzebuje obu
      - Zapis plików w ramach własnych uprawnień, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - An agent of backing up will lose the setting back of data, though the making of copies may work on
      - Accounts in the group of backup operators will lose the writing of files with rights passed over
      - The consequence comes to light only when somebody needs a restoring, which is to say at the worst hour
      - It is worth reading the lists of the right of copying and of restoring together, an agent commonly needing both
      - The writing of files within one s own rights, logging on, file shares and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje agent kopii zapasowych, którego konto usługowe wymaga tego prawa do przywracania danych
      - W grupie operatorów kopii zapasowych są osoby odtwarzające dane w ramach swoich obowiązków
    en:
      - Upon the machine works an agent of backing up whose service account calls for this right to set data back
      - In the group of backup operators stand people who restore data as part of their duties
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRestorePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRestorePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRestorePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/restore-files-and-directories

notes:
  pl: |
    Reguła jest parą do punktu o tworzeniu kopii i warto, żeby aplikacja
    pokazała je razem oraz wyjaśniła, dlaczego ta jest oceniona wyżej.
    Odczyt wszystkiego jest utratą poufności; zapis wszystkiego jest
    utratą kontroli nad maszyną.

    Argument wart zachowania dotyczy tego, że zapis nie wymaga
    natychmiastowego wykorzystania. Napastnik nie musi niczego uruchamiać
    — podkłada plik i czeka. Uruchomi go system przy starcie albo
    administrator, który nic nie podejrzewa. Jest to różnica między
    atakiem a zastawieniem pułapki, i to druga postać jest trudniejsza do
    wykrycia.

    Odnotowuję skutek uboczny sprawdzenia. Odtwarzanie, które przestało
    działać, ujawnia się wtedy, gdy jest potrzebne — czyli podczas awarii,
    kiedy nikt nie ma czasu na diagnozę uprawnień. Aplikacja powinna
    wymienić to wprost jako powód, dla którego ten punkt sprawdza się
    przed wdrożeniem, a nie po.
  en: |
    The rule is the pair of the item about the making of copies, and it is well that the application show them
    together and set out why this one is graded the higher. The reading of everything is a loss of secrecy; the
    writing of everything is a loss of hold upon the machine.

    The argument worth keeping touches this, that a writing calls for no using at once. The attacker need start
    nothing - they lay a file down and wait. The system will run it at the start, or an administrator suspecting
    nothing. It is the difference between an attack and the setting of a snare, and the second shape is the harder
    to find.

    I set down a side consequence of the review. A restoring that has ceased to work shows itself when it is
    needed - which is to say during a failure, when nobody has time to look into rights. The application ought to
    name that outright as the ground for reviewing this item before the rollout and not after.
