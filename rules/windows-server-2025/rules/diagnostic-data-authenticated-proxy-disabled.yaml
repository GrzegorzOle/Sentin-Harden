id: win2025-diagnostic-data-authenticated-proxy-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Uwierzytelnianie usługi diagnostycznej na pośredniku zablokowane
    en: Authentication of the diagnostic service at a proxy blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania usłudze wysyłającej dane diagnostyczne uwierzytelniania
    się na pośredniku sieciowym poświadczeniami zalogowanego użytkownika.
    Wartość jeden oznacza zakaz.

    Kategoria średnia, a treść punktu jest inna, niż sugeruje nazwa, więc
    chcę ją postawić wprost. To nie jest punkt o danych diagnostycznych —
    pozostałe reguły w tym wątku mówią o tym, co wychodzi. Ten mówi o tym,
    czym maszyna się przy tym posługuje.

    Usługa wysyłająca dane pracuje w tle, bez udziału człowieka. Żeby
    przejść przez pośrednika wymagającego uwierzytelnienia, musi wziąć
    czyjeś poświadczenia. Bierze poświadczenia konta, w którego kontekście
    działa — a na serwerze bywa to konto usługi albo konto komputera. Nie
    ma tu pytania, zgody ani śladu w sposób, w jaki myślimy o logowaniu:
    jest cicha próba uwierzytelnienia wykonywana regularnie, w tle, przez
    proces, który nikogo o nic nie pyta.

    To osłabia jedną z ważniejszych zasad utrzymywanych na serwerze:
    poświadczenia mają być używane tam, gdzie widać, po co. Tutaj są
    używane po to, żeby wysłać sprawozdanie techniczne — cel nieproporcjonalny
    do środka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: regularny,
    przewidywalny ruch uwierzytelniający z serwera do pośrednika, w którym
    jego własna próba nie rzuca się w oczy — a przy pośredniku podstawionym
    także samą próbę uwierzytelnienia.
  en: |
    The item forbids the service that sends diagnostic data to authenticate
    at a network proxy with the signed-in user's credentials. A value of one
    means the ban.

    The category is medium, and the substance of the item is other than its
    name suggests, so I want to state it plainly. This is not an item about
    diagnostic data - the other rules in this vein speak of what goes out.
    This one speaks of what the machine uses to do it.

    The service that sends the data works in the background, with no person
    involved. To get through a proxy that requires authentication it has to
    take somebody's credentials. It takes the credentials of the account it
    runs in the context of - and on a server that is sometimes a service
    account or the computer account. There is no question here, no consent,
    and no trace in the way we think about signing in: there is a quiet
    authentication attempt made regularly, in the background, by a process
    that asks nobody anything.

    This weakens one of the more important principles kept on a server:
    credentials are to be used where it can be seen what for. Here they are
    used in order to send a technical report - an end out of proportion to
    the means.

    What an attacker gains while the item goes unmet: regular, predictable
    authentication traffic from the server to the proxy, in which their own
    attempt does not stand out - and, with a substituted proxy, the
    authentication attempt itself.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", bo ta reguła ma jeden skutek
    pewny i trzeba go rozumieć przed zmianą, a nie po.

    Skutek jest taki: tam, gdzie wyjście na zewnątrz prowadzi wyłącznie
    przez pośrednika wymagającego uwierzytelnienia, dane diagnostyczne
    przestaną wychodzić. Nie „będzie ich mniej" — przestaną, bo usługa nie
    będzie miała czym się przedstawić. To bywa dokładnie tym, czego się
    chce, i wtedy reguła robi za darmo to, co inne reguły w tym wątku robią
    z rozmysłem.

    Bywa też odwrotnie i to jest właśnie rzecz do sprawdzenia. Jeżeli
    w chmurze producenta prowadzone jest sprawozdanie o stanie łatania tej
    maszyny albo działa tam narzędzie ochrony przekazujące sygnały, to po
    tej zmianie maszyna po prostu przestanie się w nich odzywać. Zniknięcie
    będzie wyglądało na awarię łączności i tak zostanie zdiagnozowane —
    a powodem będzie ustawienie wprowadzone tygodnie wcześniej, w innym
    celu, przez kogoś innego. Warto zapisać tę zmianę tam, gdzie zagląda
    się przy takich objawach.

    Czego to nie psuje: pośrednik działa dalej dla całej reszty ruchu tej
    maszyny. Aktualizacje, usługi, ruch aplikacji — nic z tego nie zmienia
    sposobu przechodzenia przez pośrednika. Dotyczy to wyłącznie usługi
    diagnostycznej.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", because this rule has one certain
    effect and it has to be understood before the change rather than after.

    The effect is this: where the way out leads solely through a proxy that
    requires authentication, diagnostic data will stop going out. Not "there
    will be less of it" - it will stop, because the service will have
    nothing to introduce itself with. That is sometimes exactly what is
    wanted, and then the rule does for free what the other rules in this
    vein do on purpose.

    Sometimes it is the other way round, and that is precisely the thing to
    check. If a report on this machine's patching state is kept in the
    maker's cloud, or a protective tool passing signals runs there, then
    after this change the machine will simply stop speaking up in them. The
    disappearance will look like a connectivity failure and will be
    diagnosed as one - while the cause will be a setting made weeks earlier,
    for another purpose, by somebody else. It is worth recording this change
    where people look when such symptoms appear.

    What this does not break: the proxy goes on working for all the rest of
    this machine's traffic. Updates, services, application traffic - none of
    them change how they get through the proxy. This concerns the diagnostic
    service alone.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - network-and-firewall
    - accounts-and-passwords
  what_breaks:
    pl:
      - Gdzie wyjście prowadzi wyłącznie przez pośrednika wymagającego uwierzytelnienia, dane diagnostyczne przestaną wychodzić całkiem
      - Sprawozdanie o stanie łatania w chmurze producenta oraz narzędzie ochrony przekazujące sygnały przestaną dostawać od tej maszyny cokolwiek
      - Zniknięcie maszyny będzie wyglądało na awarię łączności i tak zostanie zdiagnozowane, a powodem będzie ta zmiana sprzed tygodni
      - Pośrednik działa dalej dla całej reszty ruchu — aktualizacji, usług, ruchu aplikacji
    en:
      - Where the way out leads solely through a proxy requiring authentication, diagnostic data stops going out entirely
      - A patching-state report in the maker's cloud and a protective tool passing signals stop receiving anything from this machine
      - The machine's disappearance will look like a connectivity failure and be diagnosed as one, while the cause is this change from weeks before
      - The proxy goes on working for all the rest of the traffic - updates, services, application traffic
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stan łatania tej maszyny jest prowadzony w chmurze producenta, a wyjście na zewnątrz prowadzi przez pośrednika z uwierzytelnianiem
      - Na maszynie pracuje narzędzie ochrony przekazujące sygnały na zewnątrz tą samą drogą
    en:
      - This machine's patching state is kept in the maker's cloud and the way out leads through a proxy with authentication
      - A protective tool runs on the machine passing signals outwards by the same route
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One here means the service may not authenticate at the proxy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableEnterpriseAuthProxy'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'DisableEnterpriseAuthProxy' -ErrorAction SilentlyContinue).'DisableEnterpriseAuthProxy'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableEnterpriseAuthProxy'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the way out leads solely through a proxy requiring authentication,
    # this stops the diagnostic data outright. Record the change where people
    # look for connectivity faults - otherwise the machine's disappearance from
    # a cloud report weeks later will be diagnosed as a network problem.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEnterpriseAuthProxy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Treść punktu jest inna, niż sugeruje nazwa: to nie punkt o danych
    diagnostycznych, tylko o tym, czym maszyna się przy ich wysyłaniu
    posługuje. Usługa pracuje w tle i bierze poświadczenia konta, w którego
    kontekście działa — na serwerze bywa to konto usługi albo konto
    komputera.

    Osłabia to zasadę, że poświadczenia mają być używane tam, gdzie widać,
    po co. Tutaj są używane po to, żeby wysłać sprawozdanie techniczne.

    Skutek pewny: gdzie wyjście prowadzi tylko przez pośrednika
    z uwierzytelnianiem, dane przestaną wychodzić całkiem. Zniknięcie
    maszyny ze sprawozdania w chmurze będzie wyglądało na awarię łączności
    i tak zostanie zdiagnozowane — zapisz tę zmianę tam, gdzie zagląda się
    przy takich objawach.
  en: |
    The substance of the item is other than its name suggests: this is not
    an item about diagnostic data but about what the machine uses to send
    it. The service works in the background and takes the credentials of the
    account it runs in the context of - on a server sometimes a service
    account or the computer account.

    This weakens the principle that credentials are to be used where it can
    be seen what for. Here they are used in order to send a technical
    report.

    The certain effect: where the way out leads only through a proxy with
    authentication, the data stops going out entirely. The machine's
    disappearance from a cloud report will look like a connectivity failure
    and be diagnosed as one - record this change where people look when such
    symptoms appear.
