id: win11-machine-account-lockout-threshold

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Próg nieudanych logowań kończący się wejściem w tryb odzyskiwania ustawiony
    en: A failed sign-in threshold ending in the recovery mode set
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Zwykła blokada konta po nieudanych logowaniach chroni konto, ale nie chroni
    maszyny. Kto ma do niej fizyczny dostęp, ten może próbować dalej: na innym
    koncie, po ponownym uruchomieniu, przez tyle godzin, ile zostawi mu
    okazja.

    Ten punkt działa na innym poziomie. Licznik jest wspólny dla całej maszyny,
    a po przekroczeniu progu maszyna nie blokuje konta, tylko uruchamia się
    ponownie i żąda klucza odzyskiwania szyfrowania dysku. Od tej chwili
    zgadywanie hasła nie prowadzi już nigdzie — bez klucza nie ma czego
    odblokować, bo dysk pozostaje zaszyfrowany.

    Jest to zabezpieczenie pomyślane pod jeden scenariusz: maszyna, która
    wyszła spod kontroli właściciela. Skradziony komputer przenośny, sprzęt
    zostawiony w hotelu, stanowisko w miejscu publicznym. We wszystkich tych
    przypadkach napastnik ma czas i ma klawiaturę, a to jest dokładnie ta
    sytuacja, w której zwykła blokada konta nie wystarcza.

    Punkt wymaga progu ustawionego i nie wyższego niż dziesięć prób. Zero
    znaczy brak progu i nie jest zgodnością.
  en: |
    An ordinary account lockout after failed sign-ins protects the account, but not
    the machine. Whoever has physical access to it can carry on trying: on another
    account, after a restart, for as many hours as the opportunity leaves them.

    This item works at another level. The counter is shared by the whole machine, and
    once the threshold is passed the machine does not lock an account - it restarts
    and demands the drive encryption recovery key. From that moment guessing a
    password leads nowhere: with no key there is nothing to unlock, because the drive
    stays encrypted.

    It is a safeguard meant for one scenario: a machine that has left its owner's
    control. A stolen portable computer, equipment left in a hotel, a station in a
    public place. In every one of those the attacker has time and has a keyboard, and
    that is exactly the situation an ordinary account lockout does not cover.

    The item requires a threshold that is set and no higher than ten attempts. Zero
    means no threshold and is not compliance.

disruption_description:
  pl: |
    Jest to jedna z niewielu zmian w tej paczce, która przy zwykłym błędzie
    użytkownika potrafi unieruchomić maszynę do czasu odnalezienia klucza.
    Wymaga świadomego wdrożenia i przygotowania, które trzeba wykonać przed nią,
    a nie po.

    Skutek po przekroczeniu progu jest jednoznaczny: maszyna uruchamia się
    ponownie i prosi o klucz odzyskiwania. Nie o hasło, nie o kod — o długi
    klucz, którego nikt nie pamięta. Jeżeli klucz nie jest zapisany w miejscu
    osiągalnym dla obsługi, maszyna jest nie do odzyskania, a dane na niej
    razem z nią.

    Warunek wstępny jest więc jeden i twardy: klucze odzyskiwania muszą być
    zapisane w centralnym magazynie albo w usłudze katalogowej, a obsługa musi
    umieć je wydać. Bez tego punkt zamienia ryzyko kradzieży na ryzyko utraty
    danych przez pomyłkę własnego użytkownika.

    Prób wystarczy dziesięć i nie trzeba do tego złej woli. Klawiatura
    z innym układem, wciśnięty klawisz przełączający wielkość liter, hasło
    zmienione przez kogoś innego, dziecko przy laptopie służbowym — to są
    realne przyczyny, nie teoretyczne.

    Na maszynie z dyskiem nieszyfrowanym punkt nie zmienia nic. Ustawienie
    działa wyłącznie tam, gdzie szyfrowanie dysku jest włączone.

    Nie ma restartu przy wdrożeniu; restart przychodzi dopiero po przekroczeniu
    progu.
  en: |
    This is one of the few changes in this pack that can, on an ordinary user's
    mistake, put the machine out of use until a key is found. It calls for a
    deliberate rollout and for preparation to be done before it, not after.

    The effect once the threshold is passed is unambiguous: the machine restarts and
    asks for the recovery key. Not a password, not a code - a long key nobody
    remembers. If the key is not kept where support can reach it, the machine is
    beyond recovery and the data on it with it.

    So there is one hard precondition: recovery keys must be kept in a central store
    or in the directory service, and support must be able to hand them out. Without
    that, the item trades the risk of theft for the risk of losing data to one's own
    user's slip.

    Ten attempts are enough and no ill will is needed. A keyboard with another layout,
    a pressed key switching letter case, a password changed by somebody else, a child
    at a work laptop - these are real causes, not theoretical ones.

    On a machine with an unencrypted drive the item changes nothing. The setting works
    only where drive encryption is on.

    There is no restart at the rollout; the restart comes only once the threshold is
    passed.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - encryption-and-tls
    - boot-and-firmware
  what_breaks:
    pl:
      - Po dziesięciu nieudanych próbach maszyna uruchamia się ponownie i żąda klucza odzyskiwania
      - Bez dostępu do klucza maszyna i dane na niej są nie do odzyskania
      - Obsługa zgłoszeń musi umieć wydać klucz odzyskiwania, zanim punkt zostanie wdrożony
      - Na maszynie z dyskiem nieszyfrowanym nie zmienia się nic
    en:
      - After ten failed attempts the machine restarts and demands the recovery key
      - With no access to the key the machine and the data on it are beyond recovery
      - The service desk must be able to hand out a recovery key before the item is applied
      - On a machine with an unencrypted drive nothing changes
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Klucze odzyskiwania nie są zapisywane w centralnym magazynie ani w usłudze katalogowej
      - Maszyna pracuje bez obsługi na miejscu i jej unieruchomienie zatrzymuje pracę innych
    en:
      - Recovery keys are not kept in a central store or in the directory service
      - The machine works with no support on site and putting it out of use halts other people's work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero switches the threshold off altogether. It must not pass an upper
      # bound comparison as if it were the smallest allowed number of attempts.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'MaxDevicePasswordFailedAttempts'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      elseif ([int]$value -eq 0) { 'NEVER' }
      else { [string][int]$value }
    } catch {
      'CHECK_ERROR'
    }
  expected: '10'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'MaxDevicePasswordFailedAttempts'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'MaxDevicePasswordFailedAttempts' -Value 10 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-machine-account-lockout-threshold

notes:
  pl: |
    Punkt ma sens wyłącznie na maszynie z zaszyfrowanym dyskiem systemowym.
    Bez szyfrowania próg nie ma czego chronić — ponowne uruchomienie nie zatrzyma
    nikogo, kto może wyjąć dysk. Wdrażanie tego punktu przed włączeniem
    szyfrowania jest kolejnością odwrotną do właściwej.

    Licznik jest wspólny dla maszyny, a nie dla konta, i nie zeruje się po
    zalogowaniu na innym koncie. Jest to różnica względem zwykłej blokady konta
    i właśnie z niej bierze się skuteczność punktu — oraz jego koszt.

    Zero jest raportowane osobno od wartości liczbowej, bo znaczy „nigdy",
    a nie „zero prób". Bez tego rozróżnienia brak progu przechodziłby
    porównanie górnego ograniczenia jako wartość najniższa z możliwych.

    Wartość niższa niż dziesięć jest zgodnością. Schodzenie znacznie niżej nie
    jest zalecane: różnica w bezpieczeństwie jest niewielka, a liczba wejść
    w tryb odzyskiwania rośnie szybko.

    Gałąź zasad systemowych jest wspólna z kilkudziesięcioma innymi
    ustawieniami, więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The item makes sense only on a machine with an encrypted system drive. Without
    encryption the threshold has nothing to protect - a restart will not stop anyone
    who can take the drive out. Applying this item before switching encryption on is
    the reverse of the right order.

    The counter is shared by the machine rather than by an account, and it is not
    cleared by signing in on another account. That is the difference from an ordinary
    account lockout, and it is where the item's effectiveness comes from - along with
    its cost.

    Zero is reported apart from a number, because it means "never" rather than "zero
    attempts". Without that distinction a missing threshold would pass an upper bound
    comparison as the lowest possible value.

    A value lower than ten is compliance. Going much lower is not advised: the
    difference in security is small and the number of trips into recovery mode grows
    quickly.

    The system policies key is shared with several dozen other settings, so rollback
    removes the entry alone.
