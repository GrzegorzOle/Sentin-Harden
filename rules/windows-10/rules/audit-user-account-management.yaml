id: win10-audit-user-account-management

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Account Management
  title:
    pl: Inspekcja zarządzania kontami użytkowników
    en: The audit of the handling of user accounts
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje czynności na kontach użytkowników tej maszyny:
    utworzenie, usunięcie, zmianę hasła, włączenie, wyłączenie
    i odblokowanie.

    Konto utworzone przez napastnika jest najstarszym i wciąż najczęstszym
    sposobem na trwałość. Nie wymaga żadnego narzędzia, przeżywa restart,
    przeżywa aktualizację i wygląda w systemie dokładnie tak samo jak konto
    prawidłowe. Odróżnia je wyłącznie to, kiedy powstało i czyją ręką —
    a jedno i drugie jest wyłącznie w tym zapisie.

    Zmiana hasła cudzego konta jest wpisem drugim co do wagi. Jest to
    czynność, której w normalnej pracy nie wykonuje nikt poza obsługą, a po
    stronie napastnika jest sposobem na przejęcie konta bez poznania hasła
    dotychczasowego.

    Zapisywane są oba wyniki. Próba utworzenia konta odrzucona z braku
    uprawnień mówi, że ktoś sięgnął po tę drogę, zanim znalazł inną.

    Odnotowuję zasięg: podkategoria opisuje konta lokalne tej maszyny.
    Konta domenowe mają swój zapis na kontrolerze i tam trzeba go szukać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: konto własne
    na tej maszynie, przeżywające restart i nieodróżnialne od kont
    prawidłowych.
  en: |
    The setting writes down the acts upon this machine's user accounts: the making, the taking away, the change
    of a password, the switching on, the switching off and the unlocking.

    An account made by an attacker is the oldest and still the commonest means of lastingness. It calls for no
    tool, outlasts a restart, outlasts an update, and looks in the system exactly like a proper account. It is
    parted from them by when it came about and by whose hand - and both the one and the other are in this record
    alone.

    The change of somebody else's password is the entry second in weight. It is an act nobody but the support
    carries out in ordinary work, and upon an attacker's side it is a means of taking an account over without
    learning the password it had.

    Both outcomes are written. An attempt at making an account refused for want of rights says somebody reached
    for that road before they found another.

    I set down the reach: the subcategory describes this machine's local accounts. Domain accounts have their
    record upon the controller, and there it has to be sought.

    What an attacker gains while the item goes unmet: an account of their own upon this machine, outlasting a
    restart and not to be told from the proper ones.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie niczego nie zabrania i nie wpływa na to, kto może zakładać
    konta i zmieniać hasła. Zapisuje wyłącznie fakt czynności.

    Liczba wpisów jest w normalnej pracy bliska zeru. Konta na stanowisku
    roboczym zakłada się przy wdrożeniu i praktycznie nigdy potem.

    Odnotowuję źródło wpisów, które bywa zaskoczeniem: system sam zarządza
    kilkoma kontami pomocniczymi i tworzy je w tle, zwłaszcza po
    aktualizacji. Wpisy te dotyczą kont o nazwach systemowych i są
    powtarzalne.

    Zmiana hasła własnego przez użytkownika również daje tu wpis. Jest to
    zapis prawidłowy i zwykle najliczniejszy ze wszystkich w tej
    podkategorii.

    Czego to nie psuje: zakładania kont, zmieniania haseł, odblokowywania
    kont, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting forbids nothing and bears not upon who may set up accounts and change passwords. It writes down
    the fact of an act alone.

    The number of entries is in ordinary work near nought. Accounts upon a working station are set up at the
    rolling out and next to never after.

    I set down a source of entries that comes at times as a surprise: the system handles a few helper accounts
    of its own and makes them in the background, above all after an update. Those entries touch accounts with
    the system's own names and they repeat.

    A user's change of their own password gives an entry here as well. It is a proper record and as a rule the
    most numerous of all in this subcategory.

    What this does not break: the setting up of accounts, the changing of passwords, the unlocking of accounts,
    logging on, file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - System sam tworzy w tle konta pomocnicze, zwłaszcza po aktualizacji, i daje wpisy o nazwach systemowych
      - Zmiana hasła własnego przez użytkownika daje wpis i jest zwykle najliczniejszym zapisem w tej podkategorii
      - Podkategoria opisuje konta lokalne tej maszyny, a konta domenowe mają swój zapis na kontrolerze
      - Ustawienie nie wpływa na to, kto może zakładać konta i zmieniać hasła
      - Zakładanie kont, odblokowywanie kont, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - The system makes helper accounts of its own in the background, above all after an update, giving entries with the system s names
      - A user s change of their own password gives an entry and is as a rule the most numerous record in this subcategory
      - The subcategory describes this machine s local accounts, domain accounts having their record upon the controller
      - The setting bears not upon who may set up accounts and change passwords
      - The setting up of accounts, the unlocking of accounts, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto zauważyć konta utworzonego poza wdrożeniem
    en:
      - The record is not gathered away from the machine and there is nobody to notice an account made outside a rolling out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9235-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9235-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9235-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. A refused attempt at making an account or at
    # changing somebody else's password says as much as one that came through.
    auditpol /set /subcategory:"{0CCE9235-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9235-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-user-account-management

notes:
  pl: |
    Reguła otwiera blok i jest w nim najwyżej oceniona razem z inspekcją
    zarządzania grupami. Obie opisują to samo zjawisko z dwóch stron: konto
    i jego uprawnienia.

    Argument wart postawienia wprost dotyczy tego, jak wygląda konto
    napastnika po fakcie. Nie różni się niczym od pozostałych — ma nazwę,
    hasło, profil i historię logowań. Jedyną cechą odróżniającą jest data
    utworzenia, a ta bez tego zapisu nie istnieje w żadnym miejscu
    dostępnym po fakcie.

    Odnotowuję zasięg, bo prowadzi do błędnego wniosku w domenie.
    Podkategoria opisuje konta lokalne tej maszyny; konto domenowe
    utworzone przez napastnika zostawi wpis na kontrolerze, a tu nie
    zostawi nic. Aplikacja powinna to powiedzieć, zamiast pozwalać
    użytkownikowi wierzyć, że punkt obejmuje wszystko.
  en: |
    The rule opens the block and is weighed the highest in it together with the audit of the handling of groups.
    Both describe the same matter from two sides: the account and its rights.

    The argument worth putting outright touches how an attacker's account looks after the fact. It differs in
    nothing from the rest - it has a name, a password, a profile and a history of logging on. Its one parting
    mark is the date of its making, and that without this record is nowhere to be had after the fact.

    I set down the reach, it leading to a wrong conclusion in a domain. The subcategory describes this machine's
    local accounts; a domain account made by an attacker will leave an entry upon the controller and none here.
    The application ought to say so, rather than let a user believe the item takes in everything.
