id: win11-bitlocker-smart-card-fixed-drives

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Karta wymagana do odblokowania dysków stałych
    en: A card required to unlock fixed drives
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt jest drugą połową rozstrzygnięcia o haśle: skoro hasło na dyskach
    stałych przestaje być dopuszczone, trzeba powiedzieć, co je zastępuje.
    Odpowiedzią jest karta z certyfikatem — przedmiot, który trzeba mieć, a nie
    rzecz, którą trzeba wiedzieć.

    Różnica jest zasadnicza dla napastnika z dyskiem w ręku. Hasła można
    szukać bez ograniczeń i bez śladu; karty nie da się zgadnąć, a jej brak
    zatrzymuje pracę na wejściu. Klucz prywatny nie opuszcza układu na karcie,
    więc skopiowanie go z maszyny, nawet przejętej, nie jest możliwe.

    Dodatkowa wartość bierze się z powiązania z tożsamością. Karta jest
    wydawana osobie i da się ją unieważnić w jednym miejscu — po odejściu
    pracownika albo po zgubieniu. Hasła zapisanego na dysku odwołać się nie da
    bez odszyfrowania i ponownego zaszyfrowania nośnika.
  en: |
    The item is the second half of the ruling about passwords: since a password on
    fixed drives stops being admissible, what replaces it has to be said. The answer
    is a card with a certificate - an object one has to hold, not a thing one has to
    know.

    The difference is fundamental for an attacker with the drive in hand. A password
    can be searched for without limit and without trace; a card cannot be guessed,
    and its absence stops the work at the door. The private key does not leave the
    circuit on the card, so copying it off the machine, even a machine taken over,
    is not possible.

    Further worth comes from the tie to an identity. A card is issued to a person
    and can be revoked in one place - when an employee leaves or when it is lost. A
    password written onto a drive cannot be revoked without decrypting and
    encrypting the medium again.

disruption_description:
  pl: |
    Jest to zmiana zależna od infrastruktury, której na wielu stanowiskach po
    prostu nie ma, i dlatego wymaga świadomego wdrożenia.

    Warunkiem działania jest wydany certyfikat, czytnik przy stanowisku i urząd
    certyfikacji, który karty wydaje i unieważnia. Bez tego zaszyfrowanie dysku
    stałego przestanie być możliwe w ogóle — użytkownik zobaczy kreator, który
    żąda karty, a karty nie ma i nie będzie.

    Skutek uboczny dotyczy dostępu awaryjnego. Zgubiona albo zapomniana karta
    oznacza dysk otwierany wyłącznie kluczem odzyskiwania, więc wdrożenie bez
    ustalonego miejsca przechowywania kluczy prowadzi do utraty danych.

    Na stanowiskach bez zaszyfrowanych dysków stałych — czyli na maszynie
    z jednym dyskiem — punkt nie ma skutku praktycznego i przechodzi
    niezauważony.

    Nie ma restartu. Zmiana obowiązuje przy następnym włączeniu szyfrowania.
  en: |
    This is a change depending on infrastructure that many stations simply do not
    have, and so it calls for a deliberate rollout.

    The condition for it to work is an issued certificate, a reader at the station,
    and an authority that issues and revokes cards. Without that, encrypting a fixed
    drive stops being possible at all - the user sees a wizard demanding a card, and
    there is no card and will be none.

    The side effect concerns emergency access. A lost or forgotten card means a
    drive opened only with the recovery key, so a rollout without a settled place to
    keep keys leads to lost data.

    At stations without encrypted fixed drives - that is, on a machine with one disk
    - the item has no practical effect and passes unnoticed.

    There is no restart. The change takes effect the next time encryption is
    switched on.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - drivers-and-devices
  what_breaks:
    pl:
      - Zaszyfrowanie dysku stałego przestanie być możliwe bez wydanej karty i czytnika przy stanowisku
      - Zgubiona albo zapomniana karta zostawia dysk otwierany wyłącznie kluczem odzyskiwania
      - Stanowiska bez czytnika stracą możliwość założenia szyfrowania na dysku z danymi
    en:
      - Encrypting a fixed drive stops being possible without an issued card and a reader at the station
      - A lost or forgotten card leaves the drive opened only with the recovery key
      - Stations without a reader lose the ability to set up encryption on a data disk
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na stanowiskach nie ma czytników kart ani urzędu wydającego certyfikaty
      - Nie ustalono, gdzie trafiają klucze odzyskiwania na wypadek zgubienia karty
    en:
      - There are no card readers at the stations and no authority issuing certificates
      - It has not been settled where recovery keys go in case a card is lost
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes
      # it required - admitted without required leaves the choice open and is
      # reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'FDVAllowUserCert'
        $enforce = $item.'FDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'FDVAllowUserCert'
      allow_existed   = ($null -ne $item.'FDVAllowUserCert')
      enforce         = $item.'FDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'FDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'FDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.key_existed) {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    } else {
      if ($b.allow_existed) {
        Set-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -Value $b.allow -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -ErrorAction SilentlyContinue
      }
      if ($b.enforce_existed) {
        Set-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -Value $b.enforce -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła czyta dwie wartości, bo dopuszczenie karty bez wymagania jej
    zostawia użytkownikowi wybór — a wtedy punkt nie osiąga tego, po co
    powstał. Stan pośredni zgłaszam osobno, żeby odróżnić maszynę ustawioną
    połowicznie od maszyny bez żadnego ustawienia.

    Punkt nie zmienia zabezpieczeń dysków już zaszyfrowanych. Dysk stały
    otwierany dotąd hasłem otworzy się nim dalej — zmiana dotyczy zakładania
    nowego zabezpieczenia.

    Punkt tworzy trójkę z odebraniem hasła i z bliźniaczym ustawieniem dla
    nośników wymiennych. Wdrożenie samego odebrania hasła, bez tego punktu,
    zostawia maszynę, na której dysku stałego nie da się zaszyfrować niczym.
  en: |
    The rule reads two values, because admitting the card without requiring it
    leaves the user a choice - and then the item does not achieve what it was made
    for. I report the in-between state apart, so a machine set halfway can be told
    from one with no setting at all.

    The item does not change the protectors of drives already encrypted. A fixed
    drive opened with a password until now will keep opening with it - the change
    concerns setting up a new protector.

    The item forms a trio with taking passwords away and with the twin setting for
    removable media. Applying the removal of passwords alone, without this item,
    leaves a machine whose fixed drive cannot be encrypted by anything.
