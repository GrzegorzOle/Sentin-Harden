id: win11-bitlocker-smart-card-removable-drives

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Karta wymagana do odblokowania nośników wymiennych
    en: A card required to unlock removable media
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt jest bliźniaczy wobec wymagania karty na dyskach stałych, ale dotyczy
    nośników, które opuszczają budynek — i z tego bierze się cała różnica
    w jego wadze.

    Dysk stały zostaje w komputerze i napastnik musi go najpierw zdobyć. Nośnik
    wymienny ginie sam: w pociągu, w taksówce, w sali konferencyjnej. Zgubiony
    nośnik zaszyfrowany hasłem jest wart tyle, ile to hasło, a hasło do pamięci
    przenośnej bywa krótkie, bo wpisuje się je często i na cudzych komputerach.

    Wymaganie karty zmienia rachunek. Nośnik bez karty nie otworzy się nikomu,
    również temu, kto go zgubił — a więc znalazca dostaje kawałek metalu z danymi
    nie do odczytania, niezależnie od tego, ile ma czasu.

    Ceną jest to, że nośnik przestaje być samowystarczalny: nie otworzy się tam,
    gdzie nie ma czytnika i właściwej karty. Jest to ta sama właściwość widziana
    z dwóch stron.
  en: |
    The item is a twin of the requirement for a card on fixed drives, but concerns
    media that leave the building - and that is where the whole difference in its
    weight comes from.

    A fixed drive stays in the computer and an attacker has to obtain it first.
    Removable media get lost by themselves: on a train, in a taxi, in a meeting
    room. A lost medium encrypted with a password is worth as much as that password,
    and a password for a portable drive tends to be short, being typed often and on
    other people's computers.

    Requiring a card changes the arithmetic. A medium without the card will open for
    nobody, including whoever lost it - so the finder gets a piece of metal with
    data that cannot be read, however much time they have.

    The price is that the medium stops being self-sufficient: it will not open where
    there is no reader and no matching card. That is the same trait seen from two
    sides.

disruption_description:
  pl: |
    Jest to zmiana, która odcina najczęstszy sposób przekazywania danych na
    nośniku, i wymaga rozstrzygnięcia przed wdrożeniem.

    Zaszyfrowanie nośnika wymiennego przestanie być możliwe bez wydanej karty.
    Co ważniejsze, nośnik zaszyfrowany w ten sposób otworzy się wyłącznie tam,
    gdzie jest czytnik i właściwa karta — czyli w praktyce wyłącznie wewnątrz
    firmy. Przekazanie danych klientowi, drukarni albo biegłemu na nośniku
    przestaje działać i trzeba je zastąpić inną drogą.

    Użytkownicy odczują to pierwszego dnia, bo pamięć przenośna jest narzędziem
    codziennym. Objawem jest kreator szyfrowania bez możliwości ustawienia
    hasła oraz nośnik, którego nie da się otworzyć na komputerze bez czytnika.

    Nośniki zaszyfrowane wcześniej otwierają się dotychczasowym zabezpieczeniem.
    Punkt dotyczy zakładania nowego.

    Nie ma restartu. Zmiana obowiązuje przy następnym włączeniu szyfrowania.
  en: |
    This is a change that cuts off the commonest way of passing data on a medium,
    and it calls for settling before the rollout.

    Encrypting a removable medium stops being possible without an issued card. More
    importantly, a medium encrypted this way will open only where there is a reader
    and the matching card - in practice, only inside the company. Passing data to a
    client, a print shop or an expert on a medium stops working and has to be
    replaced by another route.

    Users will feel it on the first day, because a portable drive is an everyday
    tool. The symptom is an encryption wizard with no way to set a password, and a
    medium that cannot be opened on a computer without a reader.

    Media encrypted earlier open with their existing protector. The item concerns
    setting up a new one.

    There is no restart. The change takes effect the next time encryption is
    switched on.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Zaszyfrowanie nośnika wymiennego przestanie być możliwe bez wydanej karty i czytnika
      - Nośnik zaszyfrowany w ten sposób nie otworzy się poza firmą, więc przekazanie danych klientowi wymaga innej drogi
      - Zgubiona karta zostawia nośnik otwierany wyłącznie kluczem odzyskiwania
    en:
      - Encrypting a removable medium stops being possible without an issued card and a reader
      - A medium encrypted this way will not open outside the company, so passing data to a client needs another route
      - A lost card leaves the medium opened only with the recovery key
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Przekazywanie danych na nośnikach poza firmę jest częścią przyjętego sposobu pracy
      - Na stanowiskach nie ma czytników kart ani urzędu wydającego certyfikaty
    en:
      - Passing data on media outside the company is part of the accepted way of working
      - There are no card readers at the stations and no authority issuing certificates
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes
      # it required - admitted without required leaves the choice open and is
      # reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'RDVAllowUserCert'
        $enforce = $item.'RDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'RDVAllowUserCert'
      allow_existed   = ($null -ne $item.'RDVAllowUserCert')
      enforce         = $item.'RDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'RDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -ErrorAction SilentlyContinue
    }
    if ($b.enforce_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -Value $b.enforce -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest w tej grupie najbardziej odczuwalny, bo dotyczy nośnika, którego
    sens polega na otwieraniu się gdzie indziej. Zestawienie go z zakazem
    zapisu na nośnikach niezaszyfrowanych daje układ szczelny, ale też taki,
    w którym dane na nośniku nie wychodzą poza firmę w żadnej postaci. Jest to
    decyzja organizacyjna, a nie techniczna, i warto ją podjąć świadomie.

    Reguła nie sprawdza obecności czytnika ani wydanej karty. Wynik „spełniony"
    mówi wyłącznie, że wymaganie jest zapisane — nie, że da się je na tej
    maszynie spełnić.
  en: |
    The item is the most keenly felt in this group, because it concerns media whose
    point is opening elsewhere. Putting it beside the ban on writing to unencrypted
    media gives a tight arrangement, but also one in which data on a medium does not
    leave the company in any form. That is an organisational decision rather than a
    technical one, and it is worth taking deliberately.

    The rule does not check for a reader or an issued card. A result of "met" says
    only that the requirement is written down - not that it can be satisfied on this
    machine.
