id: win2016-winrm-client-digest-auth-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Client
  title:
    pl: Uwierzytelnianie skrótem w kliencie zarządzania zdalnego wyłączone
    en: Digest authentication in the remote management client switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi zarządzania zdalnego posługiwać się
    uwierzytelnianiem skrótem.

    Sposób ten był odpowiedzią na kłopot z uwierzytelnianiem podstawowym:
    zamiast hasła wędruje skrót wyliczony z hasła i z wartości podanej przez
    serwer. Serwer nie dostaje hasła, więc postęp jest rzeczywisty.

    Postęp ten jest jednak połowiczny i warto powiedzieć, na czym się
    kończy. Serwer wciąż wskazuje wartość, z której skrót ma powstać, więc
    serwer podstawiony wybiera ją tak, żeby wynik dało się porównać
    z wcześniej przygotowanym zestawem. Uwierzytelnienie nie sprawdza też
    w żaden sposób, czy serwer jest tym, za kogo się podaje — potwierdza
    klienta serwerowi, nigdy odwrotnie.

    Skutkiem jest droga do hasła wolniejsza niż przy uwierzytelnianiu
    podstawowym, ale prowadząca w to samo miejsce. Napastnik nie dostaje
    hasła od razu; dostaje materiał, z którego hasło daje się odtworzyć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: materiał do
    odtworzenia hasła, zebrany przez podstawienie się pod maszynę docelową.
  en: |
    The setting forbids the remote management client to use digest authentication.

    That way was an answer to the trouble with basic authentication: instead of the
    password there travels a digest reckoned from the password and from a value the
    server gives. The server does not get the password, so the advance is a real
    one.

    That advance is half done, though, and it is worth saying where it ends. The
    server still names the value the digest is to be made from, so a substituted
    server picks it so that the result can be compared against a set prepared
    beforehand. Nor does the authentication check in any way whether the server is
    what it claims to be - it confirms the client to the server, never the other way
    about.

    The upshot is a road to the password slower than at basic authentication but
    leading to the same place. The attacker does not get the password at once; they
    get the material from which a password can be reconstructed.

    What an attacker gains while the item goes unmet: the material for
    reconstructing a password, gathered by standing in for the target machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to ocena pewna.

    Sposób ten jest w praktyce nieużywany. Powstał dla protokołu
    przesyłania stron i tam ma swoją historię; w zarządzaniu zdalnym pojawił
    się jako możliwość, po którą prawie nikt nie sięgnął. Narzędzia domenowe
    go nie używają, narzędzia spoza domeny wybierają zwykle podstawowe albo
    certyfikat.

    Znaczy to, że wdrożenie punktu na maszynie typowej nie zmienia nic
    i zapisuje decyzję, która i tak obowiązywała.

    Rzecz jedyna warta sprawdzenia dotyczy starszych integracji łączących
    się z urządzeniami, których producent wybrał ten sposób jako domyślny.
    Jest to sytuacja rzadka i dotyczy raczej sprzętu niż systemów.

    Czego to nie psuje: połączeń domenowych, połączeń uwierzytelnianych
    podstawowo tam, gdzie te są dopuszczone, przyjmowania połączeń przez tę
    maszynę, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", and that judgement is a sure one.

    That way is in practice unused. It came about for the protocol of sending pages
    and there it has its history; in remote management it appeared as a possibility
    almost nobody reached for. Domain tools do not use it, and tools outside the
    domain pick as a rule basic authentication or a certificate.

    That means rolling the item out on a typical machine changes nothing and writes
    down a decision that held anyway.

    The one thing worth checking concerns older integrations connecting to devices
    whose maker picked that way as the default. That is a rare case and concerns
    hardware rather than systems.

    What this does not break: domain connections, connections authenticated basically
    where those are admitted, the accepting of connections by this machine, services,
    or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Starsza integracja łącząca się z urządzeniem, którego producent wybrał ten sposób jako domyślny, przestaje się uwierzytelniać
      - Na maszynie typowej nie zmienia się nic, bo sposób ten jest w praktyce nieużywany
      - Połączenia domenowe i przyjmowanie połączeń przez tę maszynę pozostają bez zmian
      - Usługi, logowanie i pulpit zdalny pozostają bez zmian
    en:
      - An older integration connecting to a device whose maker picked that way as the default stops authenticating
      - On a typical machine nothing changes, that way being in practice unused
      - Domain connections and the accepting of connections by this machine stay unchanged
      - Services, signing in and the remote desktop stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tej maszyny łączy się ze sprzętem, którego producent dopuszcza wyłącznie uwierzytelnianie skrótem
    en:
      - Hardware whose maker admits digest authentication alone is connected to from this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      $name = 'AllowDigest'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowDigest'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDigest' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Punkt jest w bloku najtańszy i warto to powiedzieć, bo inaczej tonie
    w sąsiedztwie reguł kosztowniejszych. Zysk niewielki, koszt żaden —
    miejsce w macierzy jednoznaczne i kandydat do trybu zbiorczego.

    Wartość opisu leży tu raczej w wyjaśnieniu, dlaczego sposób pośredni
    nie jest rozwiązaniem. Skrót zamiast hasła wygląda na postęp
    wystarczający i bywa tak traktowany. Nie jest, bo serwer nadal
    kieruje przebiegiem, a klient nadal nie ma sposobu sprawdzenia, z kim
    rozmawia.

    Reguła dotyczy wyłącznie klienta. Odpowiednika po stronie usługi nie ma,
    bo usługa tego sposobu nie oferuje — i warto to napisać, żeby brak
    bliźniaczej reguły nie wyglądał na przeoczenie.
  en: |
    The item is the cheapest in the block, and that is worth saying, since otherwise
    it sinks among costlier neighbours. The gain small, the cost none - the place in
    the matrix is unambiguous and it is a candidate for bulk mode.

    The description's value lies here rather in explaining why a middle way is no
    answer. A digest in place of a password looks a sufficient advance and is at
    times treated so. It is not, the server still steering the course and the client
    still having no way of checking whom it speaks with.

    The rule concerns the client alone. There is no counterpart on the service's
    side, the service not offering that way - and that had better be written down,
    so that the absence of a twin rule does not look like an oversight.
