id: win10-ntlm-incoming-traffic-audited

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przychodzący ruch starszego mechanizmu uwierzytelniania rejestrowany
    en: Incoming traffic of the older authentication mechanism recorded
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna odnotowuje każde przyjęcie
    uwierzytelnienia starszym mechanizmem — czyli wtedy, gdy ktoś sięga po
    jej zasoby.

    Punkt jest bliźniaczy wobec poprzedniego i ma ten sam cel: zbudować
    wykaz, na którym da się oprzeć decyzję. Różni się kierunkiem, a przez to
    tym, czego wykaz dotyczy. Tamten mówi, po co sięga ta maszyna; ten mówi,
    kto sięga po nią.

    Wykaz przychodzący bywa na stanowisku roboczym krótszy i przez to
    łatwiejszy do przejrzenia. Zwykle jest na nim kilka pozycji: urządzenie
    odkładające pliki, narzędzie inwentaryzacyjne, kolega z zespołu.
    Pozycja, której nikt nie umie wytłumaczyć, jest tu informacją samą
    w sobie.

    Wartość wymagana rejestruje wszystkie konta, nie tylko spoza domeny.
    Ograniczenie do kont obcych wygląda na oszczędność, a gubi przypadek
    najciekawszy: użycie konta domenowego przez kogoś, kto je przejął.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sięganie po
    zasoby tej maszyny starszym mechanizmem bez śladu do przejrzenia.
  en: |
    The setting makes the machine set down every taking in of an authentication by the older mechanism - which
    is to say whenever somebody reaches for its resources.

    The item is twin to the foregoing one and has the same aim: to build a roll upon which a decision can be
    grounded. It parts by direction, and thereby in what the roll is about. That one says what this machine
    reaches for; this says who reaches for it.

    The incoming roll is at a workplace as a rule the shorter, and thereby the easier to look over. There are
    usually a few entries upon it: a device laying files down, an inventory tool, a colleague. An entry nobody
    can account for is here a piece of information in itself.

    The value called for records every account, not those from outside the domain alone. Holding it to strange
    accounts looks a thrift, and loses the most interesting case: the use of a domain account by somebody who
    has taken it over.

    What an attacker gains while the item goes unmet: a reaching for this machine's resources by the older
    mechanism without a trace to be looked over.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie niczego nie odmawia i nie zmienia warunków żadnego
    połączenia. Zmienia wyłącznie to, co trafia do dziennika.

    Objętość, która przy regule poprzedniej wymagała uwagi, jest tu
    mniejsza, bo stanowisko robocze przyjmuje połączeń znacznie mniej, niż
    samo nawiązuje. Na maszynie nieudostępniającej niczego wpisów nie
    będzie wcale.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: dostępu do zasobów tej maszyny, uprawnień,
    logowania, kont domenowych, udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting refuses nothing and changes the terms of no connection. It changes only what goes into the log.

    The bulk, which at the foregoing rule called for attention, is here the smaller, a workplace taking in far
    fewer connections than it sets up. Upon a machine sharing nothing there will be no entries at all.

    There are no known regressions for everyday work.

    What this does not break: the reach to this machine's resources, the rights upon them, logging on, domain
    accounts, file shares, printing, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - legacy-authentication
  what_breaks:
    pl:
      - Dziennik operacyjny przyjmuje dodatkowe wpisy przy każdym uwierzytelnieniu przychodzącym
      - Na maszynie nieudostępniającej niczego wpisów nie będzie wcale i zmiana nie zrobi nic
      - Ustawienie niczego nie odmawia i nie zmienia warunków żadnego połączenia
      - Dostęp do zasobów tej maszyny, uprawnienia i logowanie pozostają bez zmian
      - Konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - The operational log takes further entries at every incoming authentication
      - Upon a machine sharing nothing there will be no entries at all and the change does nothing
      - The setting refuses nothing and changes the terms of no connection
      - The reach to this machines resources, the rights upon them and logging on stay unchanged
      - Domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ma kto przejrzeć powstającego wykazu, więc rejestrowanie zajmie miejsce w dzienniku bez żadnego zysku
    en:
      - There is nobody to look the roll over, so the recording will take room in the log for no gain at all
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero records nothing, one records
      # accounts from outside the domain, two records every account.
      # The key belongs to the authentication package and is always there, so its
      # absence is a fault rather than a state worth reporting apart.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'AuditReceivingNTLMTraffic'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'AuditReceivingNTLMTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Every account is recorded, not those from outside the domain alone. Holding
    # it to strange accounts loses the case worth most - a domain account used by
    # somebody who has taken it over.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AuditReceivingNTLMTraffic' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-audit-incoming-ntlm-traffic

notes:
  pl: |
    Reguła jest parą do poprzedniej i warto je pokazywać razem, bo osobno
    każda daje pół obrazu. Wykaz wychodzący mówi, co trzeba naprawić u nas;
    wykaz przychodzący mówi, co trzeba naprawić u innych.

    Argument wart postawienia wprost dotyczy zakresu. Wartość ograniczona
    do kont spoza domeny wygląda na rozsądny kompromis, a gubi przypadek,
    dla którego to rejestrowanie w ogóle warto włączać — użycie konta
    domenowego przez kogoś, kto je przejął. Konto obce jest podejrzane
    z definicji; konto własne używane nietypowo jest informacją.

    Odnotowuję, że ta reguła jest tańsza od poprzedniej, bo stanowisko
    robocze przyjmuje mniej połączeń, niż nawiązuje. Jeśli z tej pary ma
    być wykonana tylko jedna, warto zacząć od tej.
  en: |
    The rule is the pair to the foregoing one, and it is well to show them together, apart each giving half a
    picture. The outgoing roll says what has to be mended here; the incoming roll says what has to be mended
    elsewhere.

    The argument worth putting outright touches the reach. A value held to accounts from outside the domain
    looks a sensible middle way, and loses the case for which this recording is worth switching on at all - the
    use of a domain account by somebody who has taken it over. A strange account is suspect by definition; one's
    own account used unusually is information.

    I set down that this rule comes cheaper than the foregoing, a workplace taking in fewer connections than it
    sets up. Where only one of the pair is to be carried out, it is well to begin with this.
