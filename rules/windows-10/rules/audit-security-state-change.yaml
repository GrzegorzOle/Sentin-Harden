id: win10-audit-security-state-change

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > System
  title:
    pl: Inspekcja zmiany stanu zabezpieczeń
    en: The audit of a change in the guarding state
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zmiany stanu, w którym pracuje sam system
    zabezpieczeń: start systemu, jego zamknięcie i zmianę czasu.

    Zbiór jest mały i na pierwszy rzut oka ubogi. Jego wartość polega na
    tym, że wyznacza ramy dla wszystkich pozostałych zapisów. Każdy zapis
    z dziennika ma znaczenie wyłącznie wtedy, gdy wiadomo, w którym
    uruchomieniu maszyny powstał i według jakiego czasu został opatrzony
    godziną.

    Zmiana czasu jest tu wpisem najważniejszym i najmniej oczywistym.
    Przesunięcie zegara jest najtańszym znanym sposobem na uczynienie
    dziennika bezużytecznym: zapisy nadal powstają, nadal są kompletne
    i nadal mają godziny, tyle że godziny te nie układają się w żadną
    kolejność. Dochodzenie opiera się na kolejności zdarzeń, a nie na ich
    treści.

    Odnotowuję zamknięcie systemu. Restart wykonany w środku zdarzenia jest
    sam w sobie informacją — a bez tej podkategorii dziennik pokazuje
    wyłącznie przerwę, nie mówiąc, czy maszyna została wyłączona, czy
    straciła zasilanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przesunięcie
    zegara unieważniające kolejność wszystkich zapisów i niepozostawiające
    śladu.
  en: |
    The setting writes down changes in the state in which the guarding system itself works: the start of the
    system, its shutting down, and a change of the time.

    The set is a small one and at first glance poor. Its value lies in this, that it sets the frame for all the
    other records. Every record in the log has meaning only where it is known in which running of the machine it
    came about, and by what time it was given its hour.

    A change of the time is here the weightiest entry and the least plain. The shifting of a clock is the
    cheapest known means of making a log useless: the records still come about, are still complete and still
    carry hours, only those hours fall into no order. An inquiry rests upon the order of events and not upon
    their substance.

    I set down the shutting down of the system. A restart carried out in the middle of a happening is word in
    itself - and without this subcategory the log shows a break alone, saying not whether the machine was
    switched off or lost its power.

    What an attacker gains while the item goes unmet: a shifting of the clock undoing the order of every record
    and leaving no trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia czasu, nie wpływa na start ani zamknięcie
    systemu i nie ogranicza nikomu prawa do zmiany zegara. Zapisuje
    wyłącznie fakt zmiany.

    Liczba wpisów odpowiada liczbie uruchomień maszyny, czyli w praktyce
    kilku dziennie. Jest to najmniejszy zbiór w całym bloku.

    Odnotowuję źródło wpisów o zmianie czasu, które bywa brane za sygnał:
    maszyna synchronizująca zegar z siecią zapisuje tu drobne korekty.
    Korekta o sekundy wygląda w dzienniku tak samo jak przesunięcie
    o godziny — różni się wyłącznie wartością i po nią trzeba sięgnąć.

    Zapisywany jest wyłącznie wynik udany, bo podkategoria opisuje stany,
    w które maszyna weszła.

    Czego to nie psuje: startu systemu, zamykania, synchronizacji czasu,
    logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no time, bears not upon the system's start nor its shutting down, and bounds nobody's
    right to change the clock. It writes down the fact of a change alone.

    The number of entries answers to the number of the machine's runnings - in practice a few a day. It is the
    smallest set in the whole block.

    I set down a source of entries about a change of time at times taken for a sign: a machine keeping its clock
    in step with the network writes small corrections here. A correction of seconds looks in the log just like a
    shifting of hours - it differs by its value alone, and that value has to be reached for.

    Only the successful outcome is written, the subcategory describing states the machine has passed into.

    What this does not break: the system's start, its shutting down, the keeping of time in step, logging on,
    file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Maszyna synchronizująca zegar z siecią zapisuje tu drobne korekty czasu, brane niekiedy za sygnał
      - Korekta o sekundy wygląda w dzienniku tak samo jak przesunięcie o godziny i różni się wyłącznie wartością
      - Zapisywany jest wyłącznie wynik udany, bo podkategoria opisuje stany, w które maszyna weszła
      - Ustawienie nie zmienia czasu i nie ogranicza nikomu prawa do zmiany zegara
      - Start systemu, zamykanie, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A machine keeping its clock in step with the network writes small corrections of time here, at times taken for a sign
      - A correction of seconds looks in the log just like a shifting of hours, differing by its value alone
      - Only the successful outcome is written, the subcategory describing states the machine has passed into
      - The setting changes no time and bounds nobody s right to change the clock
      - The system s start, its shutting down, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto odróżnić korekty zegara od przesunięcia wykonanego celowo
    en:
      - The record is not gathered away from the machine and there is nobody to part a correction of the clock from a shifting made on purpose
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9210-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9210-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9210-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. This subcategory writes down states
    # the machine has passed into; a state it did not pass into is nothing to note.
    auditpol /set /subcategory:"{0CCE9210-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9210-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-security-state-change

notes:
  pl: |
    Reguła wygląda w tym bloku najskromniej i jest jedną z tych, przy
    których opis decyduje o tym, czy użytkownik ją włączy. Zbiór trzech
    zdarzeń przy dwustu innych regułach przegrywa każdą listę sortowaną
    objętością.

    Argument wart postawienia wprost dotyczy czasu. Wszystkie pozostałe
    zapisy w całej paczce są opatrzone godziną, a godzina jest wiarygodna
    tylko o tyle, o ile wiadomo, że zegar nie był przesuwany. Jest to
    reguła, która nie chroni maszyny, tylko wiarygodność wszystkiego,
    co o maszynie zapisano.

    Odnotowuję korekty synchronizacji, bo generują fałszywe alarmy i bywają
    powodem wyłączenia podkategorii. Różnica między korektą a przesunięciem
    leży w wartości wpisu, nie w jego rodzaju — i aplikacja powinna umieć
    tę wartość pokazać, zamiast zostawiać użytkownika z samym faktem zmiany.
  en: |
    The rule looks in this block the humblest and is one of those at which the description settles whether a
    user switches it on. A set of three events, beside two hundred other rules, loses every list sorted by bulk.

    The argument worth putting outright touches time. Every other record in the whole pack carries an hour, and
    an hour is trustworthy only so far as it is known that the clock was not shifted. It is a rule that guards
    not the machine but the trustworthiness of everything written down about the machine.

    I set down the corrections of keeping in step, they raising false alarms and being at times the reason for
    switching the subcategory off. The difference between a correction and a shifting lies in the entry's value
    and not in its kind - and the application ought to be able to show that value, rather than leave the user
    with the bare fact of a change.
