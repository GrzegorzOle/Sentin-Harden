id: ubuntu2404-rsyslog-no-remote-input

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.1.3.7
  section: Logging and Auditing > System Logging > Configure rsyslog
  title:
    pl: rsyslog nie przyjmuje dzienników z innych komputerów
    en: Ensure rsyslog is not configured to receive logs from a remote client
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Moduły imtcp i imudp otwierają port 514, na który inne komputery mogą
    wysyłać dzienniki. Na serwerze, który nie zbiera dzienników, to
    niepotrzebnie otwarta usługa sieciowa, a każdy w sieci może zapełniać
    dysk albo wstawiać fałszywe wpisy do dzienników.

    Punkt wymaga, żeby konfiguracja rsysloga nie wczytywała imtcp ani imudp
    i nie uruchamiała ich nasłuchu.
  en: |
    The imtcp and imudp modules open port 514, to which other computers can
    send logs. On a server that does not collect logs it is a needlessly
    open network service, and anyone on the network can fill the disk or
    insert false entries into the logs.

    The item requires the rsyslog configuration not to load imtcp or imudp
    and not to start their listeners.

disruption_description:
  pl: |
    Klasa wymaga przeglądu tylko wtedy, gdy ten komputer zbiera dzienniki
    z innych maszyn: po naprawie przestają one docierać. Ubuntu ma te wiersze
    domyślnie wykomentowane, więc na zwykłym serwerze nikt tego nie zauważy.
  en: |
    The class needs review only when this computer collects logs from other
    machines: after the remediation they stop arriving. Ubuntu has these
    lines commented out by default, so on a normal server nobody will
    notice.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Urządzenia i komputery wysyłające dzienniki na port 514 tego komputera przestają być słyszane
    en:
      - Devices and computers sending logs to port 514 of this computer are no longer received
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Komputer, który jest serwerem dzienników dla innych maszyn albo urządzeń sieciowych
    en:
      - A computer that is the log server for other machines or network devices
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
    if ! in_use rsyslog; then echo NOT_APPLICABLE; exit 0; fi
    export LC_ALL=C
    # rs_files: the main rsyslog file and the drop-ins it includes by default
    rs_files() {
      local f
      [ -f /etc/rsyslog.conf ] && echo /etc/rsyslog.conf
      for f in /etc/rsyslog.d/*.conf; do [ -f "$f" ] && echo "$f"; done
      return 0
    }
    mark='# Sentin-Harden: ubuntu2404-rsyslog-no-remote-input: '
    # remote_awk: with m=list prints FILE:LINE of active lines that load or start
    # imtcp or imudp; with m=fix comments them out (a statement in parentheses up
    # to its closing line) with the mark
    remote_awk() {
      awk -v m="$1" -v mk="$mark" '
        function hit() { if (m == "list") print FILENAME ":" FNR; else print mk $0 }
        { l = tolower($0) }
        c { hit(); if (index($0, ")")) c = 0; next }
        l ~ /^[ \t]*#/ { if (m == "fix") print; next }
        l ~ /^[ \t]*\$modload[ \t]+(imtcp|imudp)([ \t]|$)/ || l ~ /^[ \t]*\$(inputtcpserverrun|udpserverrun|inputudpserverrun)([ \t]|$)/ {
          hit(); next }
        l ~ /(^|[ \t;])(module|input)[ \t]*\(/ && l ~ /(load|type)[ \t]*=[ \t]*"?(imtcp|imudp)/ {
          hit(); if (!index(substr($0, index($0, "(")), ")")) c = 1; next }
        { if (m == "fix") print }
      ' "$2"
    }
    evaluate() {
      local f h=""
      for f in $(rs_files); do
        [ -r "$f" ] || { echo "NOT_OK:needs-root"; return; }
        h="$h${h:+,}$(remote_awk list "$f" | paste -sd, -)"
        h=${h%,}
      done
      if [ -n "$h" ]; then echo "NOT_OK:$h"; else echo "OK:no-remote-input"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      echo format=rsremote-1 > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
      if ! in_use rsyslog; then
        echo "rsyslog is switched off, so this item does not apply; nothing to change"; exit 0
      fi
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=rsremote-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    # rs_files: the main rsyslog file and the drop-ins it includes by default
    rs_files() {
      local f
      [ -f /etc/rsyslog.conf ] && echo /etc/rsyslog.conf
      for f in /etc/rsyslog.d/*.conf; do [ -f "$f" ] && echo "$f"; done
      return 0
    }
    mark='# Sentin-Harden: ubuntu2404-rsyslog-no-remote-input: '
    # remote_awk: with m=list prints FILE:LINE of active lines that load or start
    # imtcp or imudp; with m=fix comments them out (a statement in parentheses up
    # to its closing line) with the mark
    remote_awk() {
      awk -v m="$1" -v mk="$mark" '
        function hit() { if (m == "list") print FILENAME ":" FNR; else print mk $0 }
        { l = tolower($0) }
        c { hit(); if (index($0, ")")) c = 0; next }
        l ~ /^[ \t]*#/ { if (m == "fix") print; next }
        l ~ /^[ \t]*\$modload[ \t]+(imtcp|imudp)([ \t]|$)/ || l ~ /^[ \t]*\$(inputtcpserverrun|udpserverrun|inputudpserverrun)([ \t]|$)/ {
          hit(); next }
        l ~ /(^|[ \t;])(module|input)[ \t]*\(/ && l ~ /(load|type)[ \t]*=[ \t]*"?(imtcp|imudp)/ {
          hit(); if (!index(substr($0, index($0, "(")), ")")) c = 1; next }
        { if (m == "fix") print }
      ' "$2"
    }
    evaluate() {
      local f h=""
      for f in $(rs_files); do
        [ -r "$f" ] || { echo "NOT_OK:needs-root"; return; }
        h="$h${h:+,}$(remote_awk list "$f" | paste -sd, -)"
        h=${h%,}
      done
      if [ -n "$h" ]; then echo "NOT_OK:$h"; else echo "OK:no-remote-input"; fi
    }
    unmark() {
      local t
      t=$(mktemp "$1.sentin-harden.XXXXXX")
      awk -v mk="$mark" 'index($0, mk) == 1 { print substr($0, length(mk) + 1); next } { print }' "$1" > "$t"
      chmod --reference="$1" "$t"; chown --reference="$1" "$t"; mv -f "$t" "$1"
    }
    undo() {
      local f
      for f in $(rs_files); do if grep -qF "$mark" "$f"; then unmark "$f"; fi; done
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "Already meets the item, nothing to change"; exit 0 ;;
        *needs-root*) echo "Cannot read the rsyslog configuration; run as root" >&2; exit 1 ;;
      esac
      for f in $(rs_files); do
        [ -n "$(remote_awk list "$f")" ] || continue
        t=$(mktemp "$f.sentin-harden.XXXXXX")
        remote_awk fix "$f" > "$t"
        chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
        echo "Commented out remote input in $f"
      done
      if command -v rsyslogd >/dev/null 2>&1 && ! rsyslogd -N1 >/dev/null 2>&1; then
        undo; echo "rsyslogd -N1 rejects the configuration; restored the previous state" >&2; exit 1
      fi
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) undo; echo "The item is not met after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
      if [ -d /run/systemd/system ]; then
        systemctl reset-failed rsyslog.service >/dev/null 2>&1 || true
        systemctl try-restart rsyslog.service
        echo "Restarted rsyslog if it was running"
      fi
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=rsremote-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    # rs_files: the main rsyslog file and the drop-ins it includes by default
    rs_files() {
      local f
      [ -f /etc/rsyslog.conf ] && echo /etc/rsyslog.conf
      for f in /etc/rsyslog.d/*.conf; do [ -f "$f" ] && echo "$f"; done
      return 0
    }
    mark='# Sentin-Harden: ubuntu2404-rsyslog-no-remote-input: '
    # remote_awk: with m=list prints FILE:LINE of active lines that load or start
    # imtcp or imudp; with m=fix comments them out (a statement in parentheses up
    # to its closing line) with the mark
    remote_awk() {
      awk -v m="$1" -v mk="$mark" '
        function hit() { if (m == "list") print FILENAME ":" FNR; else print mk $0 }
        { l = tolower($0) }
        c { hit(); if (index($0, ")")) c = 0; next }
        l ~ /^[ \t]*#/ { if (m == "fix") print; next }
        l ~ /^[ \t]*\$modload[ \t]+(imtcp|imudp)([ \t]|$)/ || l ~ /^[ \t]*\$(inputtcpserverrun|udpserverrun|inputudpserverrun)([ \t]|$)/ {
          hit(); next }
        l ~ /(^|[ \t;])(module|input)[ \t]*\(/ && l ~ /(load|type)[ \t]*=[ \t]*"?(imtcp|imudp)/ {
          hit(); if (!index(substr($0, index($0, "(")), ")")) c = 1; next }
        { if (m == "fix") print }
      ' "$2"
    }
    evaluate() {
      local f h=""
      for f in $(rs_files); do
        [ -r "$f" ] || { echo "NOT_OK:needs-root"; return; }
        h="$h${h:+,}$(remote_awk list "$f" | paste -sd, -)"
        h=${h%,}
      done
      if [ -n "$h" ]; then echo "NOT_OK:$h"; else echo "OK:no-remote-input"; fi
    }
    unmark() {
      local t
      t=$(mktemp "$1.sentin-harden.XXXXXX")
      awk -v mk="$mark" 'index($0, mk) == 1 { print substr($0, length(mk) + 1); next } { print }' "$1" > "$t"
      chmod --reference="$1" "$t"; chown --reference="$1" "$t"; mv -f "$t" "$1"
    }
    undo() {
      local f
      for f in $(rs_files); do if grep -qF "$mark" "$f"; then unmark "$f"; fi; done
    }
      n=0
      for f in $(rs_files); do if grep -qF "$mark" "$f"; then unmark "$f"; n=$((n + 1)); echo "Restored the lines of this rule in $f"; fi; done
      if [ "$n" = 0 ]; then echo "No lines of this rule found, nothing to restore"; exit 0; fi
      if [ -d /run/systemd/system ]; then
        systemctl reset-failed rsyslog.service >/dev/null 2>&1 || true
        systemctl try-restart rsyslog.service
        echo "Restarted rsyslog if it was running"
      fi
    )

privileges: root
runnable: true

sources:
  - https://www.rsyslog.com/doc/configuration/modules/imtcp.html
  - https://www.rsyslog.com/doc/configuration/modules/imudp.html
  - https://man7.org/linux/man-pages/man8/rsyslogd.8.html

notes:
  pl: |
    Sprawdzenie szuka w /etc/rsyslog.conf i /etc/rsyslog.d/*.conf aktywnych
    wierszy module(load="imtcp") i module(load="imudp"), input(type=...) tych
    modułów oraz starych dyrektyw $ModLoad, $InputTCPServerRun,
    $UDPServerRun i $InputUDPServerRun. Wynik NOT_OK podaje plik i numer
    wiersza. Instrukcja, w której nazwa modułu jest dopiero w kolejnym
    wierszu po nawiasie, nie zostanie rozpoznana.

    Naprawa poprzedza te wiersze komentarzem ze znacznikiem Sentin-Harden,
    a instrukcję w nawiasach komentuje do wiersza z nawiasem zamykającym.
    Sprawdza nową konfigurację poleceniem rsyslogd -N1 i cofa zmianę, gdy
    zostanie odrzucona. Wycofanie usuwa znacznik i przywraca wiersze
    w niezmienionej postaci.

    rsyslog nie wczytuje konfiguracji ponownie po sygnale, więc naprawa
    i wycofanie restartują usługę, jeśli działa. Komunikaty wysłane w tym
    czasie nie giną, bo gniazdo sysloga (syslog.socket) należy do systemd
    i czekają w nim na ponowne uruchomienie rsysloga.

    Punkty 6.1.3 dotyczą komputerów, na których dzienniki prowadzi rsyslog.
    Uznaję go za używany, gdy jest włączony albo działa (tak samo rozstrzyga
    punkt 6.1.1.4); w przeciwnym razie wynik to NOT_APPLICABLE, naprawa
    niczego nie zmienia i obowiązują punkty 6.1.2.
  en: |
    The check looks in /etc/rsyslog.conf and /etc/rsyslog.d/*.conf for
    active module(load="imtcp") and module(load="imudp") lines,
    input(type=...) of these modules and the old $ModLoad,
    $InputTCPServerRun, $UDPServerRun and $InputUDPServerRun directives. The
    NOT_OK result gives the file and line number. A statement where the
    module name only follows on the line after the parenthesis is not
    recognized.

    The remediation prefixes these lines with a comment with the
    Sentin-Harden mark, and comments out a statement in parentheses up to
    the line with the closing parenthesis. It checks the new configuration
    with rsyslogd -N1 and undoes the change when it is rejected. Rollback
    removes the mark and restores the lines unchanged.

    rsyslog does not reread its configuration on a signal, so the
    remediation and rollback restart the service if it runs. Messages sent
    in the meantime are not lost, because the syslog socket (syslog.socket)
    belongs to systemd and they wait in it until rsyslog starts again.

    Items 6.1.3 apply to computers where rsyslog keeps the logs. It counts
    as used when it is enabled or running (item 6.1.1.4 decides the same
    way); otherwise the result is NOT_APPLICABLE, the remediation changes
    nothing and items 6.1.2 apply.
