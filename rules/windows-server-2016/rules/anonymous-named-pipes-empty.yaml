id: win2016-anonymous-named-pipes-empty

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista nazwanych potoków dostępnych anonimowo pusta
    en: The list of named pipes reachable anonymously empty
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby lista nazwanych potoków osiągalnych bez uwierzytelnienia
    była pusta.

    Nazwany potok jest kanałem, którym program na jednej maszynie rozmawia
    z programem na drugiej. Idzie tym samym portem co udostępnianie plików
    i dlatego jest dostępny wszędzie tam, gdzie widać udziały — a to znaczy
    w praktyce w całej sieci lokalnej.

    Wpisy na tej liście są zwolnieniem z uwierzytelnienia. Potok, którego nazwa
    tu figuruje, odpowiada każdemu, kto zapyta, bez pytania kim jest. Pierwotny
    powód takich zwolnień był konkretny: starsze mechanizmy przeglądania sieci
    i zdalnego zarządzania rejestrem wymagały odpowiedzi przed zalogowaniem.
    Te mechanizmy odeszły; zwolnienia zostały.

    Cena za nie jest wysoka, bo potok dostępny anonimowo jest punktem, w którym
    napastnik zaczyna rozpoznanie. Nie musi mieć żadnego konta. Pyta maszynę
    o to, co ona sama o sobie powie, i dostaje odpowiedź — a im więcej potoków
    odpowiada, tym pełniejszy obraz z tego składa.

    W roczniku 2016 ta lista bywa niepusta po aktualizacji ze starszego systemu
    albo po odziedziczeniu zasad grupy przygotowanych lata wcześniej. Jest to
    jedna z tych wartości, które przeżywają kolejne migracje, bo nikt ich nie
    ogląda.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał do
    rozmowy z maszyną bez żadnego konta, a przez to punkt startowy rozpoznania
    prowadzonego z dowolnego miejsca w sieci lokalnej.
  en: |
    The item requires that the list of named pipes reachable without authentication
    be empty.

    A named pipe is a channel by which a program on one machine talks to a program
    on another. It travels the same port as file sharing and is therefore reachable
    everywhere shares are visible - which in practice means across the whole local
    network.

    The entries on this list are exemptions from authentication. A pipe whose name
    figures here answers anybody who asks, without asking who they are. The original
    reason for such exemptions was a definite one: older mechanisms for browsing the
    network and managing the registry from afar needed an answer before signing in.
    Those mechanisms have gone; the exemptions have stayed.

    The price for them is high, because a pipe reachable anonymously is the point
    where an attacker begins reconnaissance. They need no account at all. They ask
    the machine what it will say about itself and get an answer - and the more pipes
    answer, the fuller the picture they assemble from it.

    In the 2016 vintage this list is at times not empty after an upgrade from an
    older system or after inheriting group policy prepared years before. It is one
    of those values that survive migration after migration, because nobody looks at
    them.

    What an attacker gains while the item goes unmet: a channel for talking to the
    machine with no account at all, and thereby a starting point for reconnaissance
    carried on from anywhere in the local network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Pusta lista jest stanem domyślnym nowszych
    instalacji, więc na maszynie postawionej od zera zmiana zwykle nie robi
    nic. Kłopot zaczyna się tam, gdzie lista jest niepusta — bo wtedy ktoś
    kiedyś coś na nią wpisał i warto wiedzieć co.

    Sprawdzenie polega na przeczytaniu tego, co reguła zgłasza w wyniku
    audytu. Audyt nie mówi tylko „niezgodne", tylko wypisuje nazwy wpisów.
    To one są treścią decyzji, a nie sam fakt niezgodności.

    Dwie nazwy warto rozpoznać. Wpisy związane z przeglądaniem otoczenia
    sieciowego są pozostałością po mechanizmie, który już nie działa — te da
    się usunąć bez namysłu. Wpisy związane ze zdalnym rejestrem i kolejką
    wydruku bywają natomiast używane przez systemy monitorujące i starsze
    serwery wydruku, i te trzeba sprawdzić, zanim znikną.

    Trzeci przypadek to wpisy dodane przez oprogramowanie własne albo
    branżowe. Ich nazwy nic nie mówią osobie z zewnątrz i jedyną drogą jest
    pytanie do dostawcy. Do tego czasu reguła zostaje niespełniona
    i to jest poprawny wynik, a nie zaniedbanie.

    Czego to nie psuje: udostępniania plików po uwierzytelnieniu, zarządzania
    zdalnego z kontem, zasad grupy, uwierzytelniania domenowego ani pracy
    usług lokalnych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". An empty list is the default state of newer
    installations, so on a machine stood up from nothing the change usually does
    nothing. The trouble begins where the list is not empty - because then somebody
    once wrote something onto it and it is worth knowing what.

    The review comes down to reading what the rule reports as the audit's result.
    The audit does not say merely "non-compliant" but writes out the entries' names.
    Those are the substance of the decision, not the bare fact of non-compliance.

    Two names are worth recognising. Entries tied to browsing the network
    neighbourhood are a remnant of a mechanism that no longer works - those can go
    without a second thought. Entries tied to the remote registry and to the print
    queue, on the other hand, are at times used by monitoring systems and older
    print servers, and those have to be checked before they vanish.

    The third case is entries added by in-house or trade software. Their names say
    nothing to an outsider and the only road is a question to the supplier. Until
    then the rule stays unmet, and that is a correct result rather than neglect.

    What this does not break: file sharing after authentication, remote management
    with an account, group policy, domain authentication, or the working of local
    services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - remote-management
    - printing
  what_breaks:
    pl:
      - System monitorujący sięgający do zdalnego rejestru bez konta traci dostęp i zgłasza maszynę jako nieosiągalną
      - Starszy serwer wydruku odpytujący kolejkę anonimowo przestaje widzieć jej stan
      - Oprogramowanie branżowe z własnym wpisem na tej liście przestaje działać w sposób trudny do powiązania ze zmianą
      - Udostępnianie plików po uwierzytelnieniu, zasady grupy i zarządzanie zdalne z kontem pozostają bez zmian
    en:
      - A monitoring system reaching the remote registry without an account loses access and reports the machine as unreachable
      - An older print server querying the queue anonymously stops seeing its state
      - Trade software with its own entry on this list stops working in a way hard to tie back to the change
      - File sharing after authentication, group policy and remote management with an account stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Audyt zgłasza wpisy, których pochodzenia nie ustalono, i nie zapytano dostawcy oprogramowania, do czego służą
      - Maszynę odpytuje system monitorujący, o którym nie wiadomo, czy uwierzytelnia się przed odczytem
    en:
      - The audit reports entries whose origin has not been established, and the software supplier has not been asked what they serve
      - The machine is queried by a monitoring system of which it is not known whether it authenticates before reading
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a list
      # with nothing on it mean the same thing here - no pipe is reachable
      # anonymously - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'NullSessionPipes'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'EMPTY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'NullSessionPipes'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # An empty list rather than a removed value - the removed value means the same
    # thing, but an empty list records the decision instead of leaving the state to
    # a default.
    Set-ItemProperty -Path $path -Name 'NullSessionPipes' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type MultiString
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-named-pipes-that-can-be-accessed-anonymously

notes:
  pl: |
    Audyt wypisuje nazwy wpisów, a nie sam werdykt. Jest to celowe: usunięcie
    tej listy bez przeczytania jej zawartości jest dokładnie tą operacją,
    po której coś przestaje działać bez widocznego powodu.

    Brak wartości i lista pusta są tu tym samym i tak są zgłaszane. Reguła
    wpisuje jednak listę pustą, a nie usuwa wartości — pusty wpis zapisuje
    decyzję, podczas gdy brak wpisu zostawia stan domyślnemu zachowaniu,
    które może się zmienić przy aktualizacji.

    Punkt czyta się razem z regułą o liście udziałów dostępnych anonimowo.
    Obie opisują to samo zwolnienie z uwierzytelnienia, tylko dla innego
    rodzaju zasobu, i obie mają sens wyłącznie razem.
  en: |
    The audit writes out the entries' names, not the bare verdict. That is
    deliberate: clearing this list without reading what is on it is exactly the
    operation after which something stops working for no visible reason.

    A missing value and an empty list are the same thing here and are reported as
    such. The rule nonetheless writes an empty list rather than removing the value -
    an empty entry records the decision, while a missing entry leaves the state to a
    default behaviour that may change at an upgrade.

    The item reads together with the rule on the list of shares reachable
    anonymously. Both describe the same exemption from authentication, only for a
    different kind of resource, and both make sense only together.
