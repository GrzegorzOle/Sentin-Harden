id: win2016-uac-deny-elevation-standard-users

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podnoszenie uprawnień przez zwykłych użytkowników odrzucane
    en: Elevation of rights by ordinary users refused
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że użytkownik bez uprawnień administracyjnych dostaje
    odmowę zamiast pytania o poświadczenia administratora.

    Różnica między odmową a pytaniem wydaje się kosmetyczna, a nie jest.
    Pytanie o poświadczenia jest polem, w które ktoś może je wpisać — i to
    jest dokładnie ten moment, na który liczy napastnik. Program uruchomiony
    na koncie zwykłym wywołuje pytanie, użytkownik widzi je w kontekście
    czynności, którą sam wykonywał, i wpisuje hasło administratora, jeżeli
    je zna albo jeśli ma je pod ręką z innej sesji.

    Odmowa usuwa to pole. Czynność wymagająca uprawnień po prostu się nie
    powiedzie, a jej wykonanie wymaga świadomego przejścia na konto
    administracyjne — czyli kroku, który zostawia ślad i jest decyzją, a nie
    odruchem.

    Na serwerze punkt ma sens, choć kont zwykłych bywa tu mniej. Serwer
    z rolą sesji zdalnych, serwer aplikacyjny z interfejsem użytkownika
    i maszyna, na którą loguje się zespół nietechniczny, to dokładnie te
    przypadki, w których pole na hasło administratora jest czymś zbędnym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okazję do
    wyłudzenia poświadczeń administracyjnych w oknie, które wygląda jak
    okno systemu, bo nim jest.
  en: |
    The item makes a user without administrative rights receive a refusal
    instead of a request for an administrator's credentials.

    The difference between a refusal and a request looks cosmetic and is not. A
    request for credentials is a field somebody can type them into - and that is
    exactly the moment an attacker counts on. A program started under an
    ordinary account raises the request, the user sees it in the context of
    something they were doing themselves, and types the administrator's password
    if they know it or have it to hand from another session.

    A refusal takes that field away. An action needing rights simply fails, and
    carrying it out requires a deliberate move to an administrative account -
    a step that leaves a trace and is a decision rather than a reflex.

    On a server the item has a point, though ordinary accounts are fewer here. A
    server with the remote sessions role, an application server with a user
    interface, and a machine that a non-technical team signs in to are exactly
    the cases where a field for the administrator's password is something
    unnecessary.

    What an attacker gains while the item goes unmet: an opportunity to extract
    administrative credentials in a window that looks like a system window,
    because it is one.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czy na tej
    maszynie pracują ludzie bez uprawnień administracyjnych i co robią.

    Po zmianie przestanie działać rozwiązywanie problemów w sposób, w którym
    administrator podchodzi do sesji użytkownika i wpisuje swoje hasło
    w pytaniu. Sposób ten jest wygodny i powszechny, więc zmiana zostanie
    zauważona przez zespół wsparcia szybciej niż przez kogokolwiek innego.

    Zamiennik istnieje i warto go mieć gotowy przed zmianą: uruchomienie
    narzędzia jako administrator z osobnej sesji albo połączenie na konto
    administracyjne. Różnica polega na tym, że decyzja o podniesieniu
    uprawnień przestaje zapadać w oknie wywołanym przez cudzy program.

    Na serwerze 2016 warto sprawdzić osobno rolę sesji zdalnych. Jeżeli na
    maszynie pracuje wielu użytkowników jednocześnie, zmiana dotknie ich
    wszystkich naraz, a każdy z nich zobaczy ją jako komunikat o odmowie bez
    wyjaśnienia.

    Czego to nie psuje: pracy użytkowników na ich własnych uprawnieniach,
    kont administracyjnych, usług ani zadań harmonogramu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about whether people without
    administrative rights work on this machine and what they do.

    After the change, the way of fixing problems in which an administrator walks
    up to a user's session and types their own password into the request will
    stop working. That way is convenient and common, so the change will be
    noticed by the support team sooner than by anybody else.

    A replacement exists and is worth having ready before the change: running
    the tool as an administrator from a separate session, or connecting under an
    administrative account. The difference is that the decision to elevate stops
    being made in a window raised by somebody else's program.

    On Server 2016 the remote sessions role is worth checking separately. If
    many users work on the machine at once, the change touches all of them
    together, and each will see it as a refusal message with no explanation.

    What this does not break: users working with their own rights,
    administrative accounts, services, or scheduled tasks.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - updates-and-servicing
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownik bez uprawnień administracyjnych dostaje odmowę zamiast pytania o poświadczenia
      - Rozwiązywanie problemów przez wpisanie hasła administratora w sesji użytkownika przestaje działać
      - Przy roli sesji zdalnych zmiana dotyka wszystkich zalogowanych naraz
      - Praca użytkowników na własnych uprawnieniach, konta administracyjne i zadania harmonogramu działają bez zmian
    en:
      - A user without administrative rights gets a refusal instead of a request for credentials
      - Fixing problems by typing the administrator's password in a user's session stops working
      - With the remote sessions role the change touches everybody signed in at once
      - Users working with their own rights, administrative accounts and scheduled tasks go on unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Wsparcie techniczne pracuje wyłącznie przez wpisywanie poświadczeń administratora w sesji użytkownika i nie ma innej drogi
    en:
      - Support works solely by typing administrator credentials into a user's session and there is no other route
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'ConsentPromptBehaviorUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'ConsentPromptBehaviorUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero means a refusal rather than a request for credentials. The field into
    # which an administrator's password can be typed is what disappears - and
    # that field is what an attacker counts on.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConsentPromptBehaviorUser' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-behavior-of-the-elevation-prompt-for-standard-users

notes:
  pl: |
    Wartość zero oznacza tu odmowę, a nie brak ustawienia. To jest jeden
    z tych wpisów, przy których zero jest wartością docelową, a intuicja
    podpowiada coś przeciwnego.

    Wpis dotyczy wyłącznie kont bez uprawnień administracyjnych. Zachowanie
    kont administracyjnych opisuje osobna wartość pod tym samym kluczem
    i osobna reguła — te dwie rzeczy bywają mylone, bo nazwy różnią się
    jednym członem.

    Kategoria średnia, bo punkt nie zamyka drogi wejścia. Odbiera natomiast
    wygodne miejsce, w którym poświadczenia administracyjne bywają wpisywane
    na żądanie cudzego programu.
  en: |
    The value zero means a refusal here rather than an absent setting. This is
    one of those entries where zero is the target value while intuition suggests
    the opposite.

    The entry concerns accounts without administrative rights alone. The
    behaviour of administrative accounts is described by a separate value under
    the same key and a separate rule - the two get confused, because the names
    differ by one part.

    The category is medium, because the item closes no way in. What it takes
    away is a convenient place where administrative credentials get typed at the
    request of somebody else's program.
