id: win2025-firewall-public-local-ipsec-rules-ignored

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Lokalne reguły zabezpieczeń połączeń pomijane w profilu publicznym
    en: Local connection security rules passed over in the public profile
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie jest odpowiednikiem punktu o regułach zapory, ale dotyczy
    drugiego, mniej znanego zbioru: reguł zabezpieczeń połączeń, czyli
    tych, które przesądzają o szyfrowaniu i uwierzytelnianiu ruchu
    między maszynami.

    Różnica między tymi dwoma zbiorami jest istotna. Reguła zapory mówi,
    czy połączenie wolno nawiązać. Reguła zabezpieczeń połączeń mówi,
    na jakich warunkach — czy ma być uwierzytelnione, czy szyfrowane
    i jakim mechanizmem. Reguła lokalna w tym drugim zbiorze potrafi więc
    nie otworzyć niczego nowego, a mimo to obniżyć wymagania stawiane
    ruchowi, który i tak przechodzi.

    Jest to skutek trudniejszy do zauważenia niż otwarty port. Port
    otwarty widać w wykazie nasłuchu. Wyjątek obniżający wymaganie
    uwierzytelnienia nie widać nigdzie poza samą regułą, a połączenie
    działa dalej i niczego nie zgłasza.

    Na serwerze reguły tego rodzaju bywają tworzone przy rozwiązywaniu
    problemów z łącznością. Wyjątek dopisany po to, żeby coś wreszcie
    zadziałało, zostaje na stałe i nikt do niego nie wraca.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    korzystania z wyjątku obniżającego wymagania wobec ruchu, w profilu
    sieciowym, w którym maszyna jest najbardziej odsłonięta.
  en: |
    The setting is the counterpart of the item about firewall rules, but concerns a second,
    less known set: connection security rules, that is, those that settle the encrypting and
    authenticating of traffic between machines.

    The difference between the two sets matters. A firewall rule says whether a connection
    may be made. A connection security rule says on what terms - whether it is to be
    authenticated, whether encrypted, and by what mechanism. A local rule in the second set
    can thus open nothing new and yet lower the requirements set on traffic that passes
    anyway.

    It is an effect harder to notice than an open port. An open port shows in the list of
    what listens. An exception lowering the requirement of authentication shows nowhere
    beyond the rule itself, while the connection goes on working and reports nothing.

    On a server rules of this kind are at times made while solving problems with
    connectivity. An exception written so that something would finally work stays for good
    and nobody returns to it.

    What an attacker gains while the item goes unmet: the means of using an exception that
    lowers the requirements set on traffic, in the network profile in which the machine is
    most exposed.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Powód, dla którego ocena jest tu łagodniejsza niż przy regułach
    zapory, jest praktyczny: reguł zabezpieczeń połączeń tworzonych
    lokalnie prawie nie ma. Instalatory ich nie dopisują, a okno
    „zezwól na dostęp" ich nie tworzy. Powstają wyłącznie wtedy, gdy ktoś
    świadomie sięgnie po konsolę zapory albo po odpowiednie polecenie.

    Na zdecydowanej większości serwerów zbiór ten jest pusty i zmiana
    nie ma na czym zadziałać.

    Tam, gdzie pusty nie jest, skutek dotyczy wyłącznie profilu
    publicznego i wyłącznie warunków połączenia, nie samej możliwości
    jego nawiązania. Połączenie, które dotąd przechodziło bez
    uwierzytelnienia dzięki wyjątkowi lokalnemu, zacznie podlegać
    wymaganiu z zasad — co zwykle znaczy, że albo zostanie
    uwierzytelnione, albo nie dojdzie do skutku.

    Zmiana nie kasuje reguł lokalnych. Wracają do działania w pozostałych
    profilach i po cofnięciu ustawienia.
  en: |
    The change has no known side effects and takes no break.

    The reason the judgement is milder here than at the firewall rules is practical:
    connection security rules made locally hardly exist. Installers do not write them, and
    the "allow access" window does not make them. They come about only when somebody
    knowingly reaches for the firewall console or for the matching command.

    On the great majority of servers that set is empty and the change has nothing to work on.

    Where it is not empty, the effect concerns the public profile alone and the terms of a
    connection alone, not the very possibility of making it. A connection that until now
    passed without authentication thanks to a local exception will start falling under the
    requirement from the policies - which usually means it will either be authenticated or
    not come about.

    The change deletes no local rules. They return to working in the remaining profiles and
    once the setting is undone.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - encryption-and-tls
    - remote-management
  what_breaks:
    pl:
      - Na zdecydowanej większości serwerów zbiór reguł lokalnych tego rodzaju jest pusty
      - Połączenie przechodzące dzięki lokalnemu wyjątkowi zacznie podlegać wymaganiu z zasad
      - Skutek dotyczy warunków połączenia, a nie samej możliwości jego nawiązania
      - Reguły lokalne nie są kasowane i wracają po cofnięciu ustawienia
    en:
      - On the great majority of servers the set of local rules of this kind is empty
      - A connection passing thanks to a local exception will start falling under the policy requirement
      - The effect concerns the terms of a connection rather than the possibility of making it
      - Local rules are not deleted and return once the setting is undone
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ktoś utworzył na tym serwerze lokalną regułę zabezpieczeń połączeń i opiera się na niej łączność poza domeną
    en:
      - Somebody made a local connection security rule on this server and connectivity outside the domain rests on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' } else { [string]$public.AllowLocalIPsecRules }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'False'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public |
      Select-Object -Property Name, AllowLocalIPsecRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules $b.AllowLocalIPsecRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt jest bliźniaczy wobec reguł zapory w profilu publicznym, ale
    dotyczy innego zbioru i spełnienie jednego nie mówi nic o drugim.
    Konsola zapory pokazuje oba zbiory osobno i tak też należy je czytać.

    Ocena uciążliwości jest tu łagodniejsza z powodu praktycznego:
    reguły zabezpieczeń połączeń nie powstają samoczynnie przy instalacji
    programów, więc zbiór lokalny bywa pusty.

    Sprawdzenie zwraca wartość logiczną zamiast nazwy stanu, bo w tym
    ustawieniu nie ma trzeciego wariantu do rozróżnienia.
  en: |
    The item is twin to that of firewall rules in the public profile, but concerns another
    set, and meeting one says nothing about the other. The firewall console shows both sets
    apart and that is how they are to be read.

    The judgement of disruption is milder here for a practical reason: connection security
    rules do not come about of themselves at the installation of programs, so the local set
    is at times empty.

    The check returns a logical value rather than the name of a state, since in this setting
    there is no third variant to tell apart.
