id: win2016-network-logon-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dostęp z sieci ograniczony do administratorów i użytkowników uwierzytelnionych
    en: Access from the network restricted to administrators and authenticated users
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zawęża listę kont uprawnionych do sięgania po tę maszynę przez sieć do
    administratorów, użytkowników uwierzytelnionych i kontrolerów domeny.

    To jest dodatnia strona tej samej monety co reguła o odmowie dostępu dla
    gości. Tamta mówi, komu się odmawia; ta mówi, komu się pozwala — i to ona
    rozstrzyga, gdy na liście znajdzie się grupa szersza, niż ktokolwiek zamierzał.

    Najczęstszym wpisem, który tu nie powinien być, jest grupa obejmująca
    każdego, również bez uwierzytelnienia. Trafia ona na listę na maszynach
    starszych, gdzie była stanem domyślnym, i przeżywa na nich kolejne migracje,
    bo nikt jej nie usuwa świadomie.

    Kategoria wysoka, bo dostęp z sieci jest drogą, którą przychodzi się do
    serwera plików, do udziałów administracyjnych i do zarządzania zdalnego.
    Zawężenie tej listy działa na wszystkie te kanały naraz.

    Na serwerze 2016 rzecz waży więcej niż gdzie indziej, bo maszyny tego
    rocznika pełnią zwykle rolę serwera plików i mają listę uprawnionych
    narosłą przez lata.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do zasobów
    sieciowych maszyny z konta lub z pozycji szerszej, niż ktokolwiek świadomie
    przyznał.
  en: |
    The item narrows the list of accounts permitted to reach this machine over the
    network to the administrators, authenticated users and domain controllers.

    This is the positive side of the same coin as the rule refusing access to
    guests. That one says who is refused; this one says who is permitted - and it
    is this one that decides where a group wider than anybody intended finds its
    way onto the list.

    The commonest entry that should not be here is the group covering everybody,
    authenticated or not. It reaches the list on older machines, where it was the
    default state, and survives migration after migration there, because nobody
    removes it deliberately.

    The category is high, because access from the network is the road by which one
    comes to a file server, to administrative shares and to remote management.
    Narrowing this list acts on all those channels at once.

    On Server 2016 this weighs more than elsewhere, because machines of this
    vintage usually serve as a file server and have a list of the permitted grown
    over years.

    What an attacker gains while the item goes unmet: a road to the machine's
    network resources from an account, or a position, wider than anybody
    deliberately granted.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo lista ta bywa rozszerzona o grupy
    potrzebne konkretnym rozwiązaniom, a ich usunięcie odcina te rozwiązania od
    maszyny.

    Sprawdzić trzeba, co na liście jest ponad zestaw docelowy. Typowe wpisy to
    grupa operatorów kopii zapasowych przy oprogramowaniu kopii sięgającym po
    udziały, konta systemów drukowania, grupy dla starszych aplikacji
    korzystających z udziałów oraz wpisy pozostałe po migracji z wcześniejszego
    systemu.

    Skutek zawężenia listy jest natychmiastowy i widoczny: połączenie kończy się
    odmową dostępu. Nie ma tu opóźnienia ani cichego niepowodzenia, więc błąd
    wyjdzie od razu — ale wyjdzie na produkcji, jeżeli zmianę zastosowano bez
    przeglądu.

    Osobno warto sprawdzić drukowanie sieciowe. Na serwerach z czasów wdrożenia
    kolejki drukowania bywają udostępniane kontom, których na liście docelowej
    nie ma.

    Czego to nie psuje: pracy przy konsoli, pulpitu zdalnego, kont domenowych
    należących do użytkowników uwierzytelnionych ani zarządzania z konta
    administratora.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs planned rollout", because this list is sometimes widened by
    groups that particular solutions need, and removing them cuts those solutions
    off from the machine.

    What has to be checked is what stands on the list beyond the target set. The
    usual entries are the backup operators group where backup software reaches for
    shares, printing systems' accounts, groups for older applications using shares,
    and entries left over from a migration from an earlier system.

    The effect of narrowing the list is immediate and visible: the connection ends
    in an access refusal. There is no delay and no silent failure here, so an error
    comes out at once - but it comes out in production if the change was applied
    without a review.

    Network printing is worth checking separately. On servers from the time of
    deployment, print queues are sometimes shared with accounts that the target
    list does not hold.

    What this does not break: work at the console, remote desktop, domain accounts
    belonging to authenticated users, or management from an administrator account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - remote-management
    - network-and-firewall
    - legacy-applications
    - printing
  what_breaks:
    pl:
      - Oprogramowanie kopii zapasowych sięgające po udziały z konta spoza listy docelowej dostaje odmowę dostępu
      - Kolejki drukowania udostępnione kontom spoza tej listy przestają być osiągalne z sieci
      - Starsze aplikacje korzystające z udziałów na grupach własnych tracą połączenie
      - Praca przy konsoli, pulpit zdalny i konta domenowe użytkowników uwierzytelnionych działają bez zmian
    en:
      - Backup software reaching for shares under an account outside the target list gets an access refusal
      - Print queues shared with accounts outside this list stop being reachable from the network
      - Older applications using shares under their own groups lose the connection
      - Work at the console, remote desktop and domain accounts of authenticated users work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na liście są grupy potrzebne oprogramowaniu kopii zapasowych, drukowaniu sieciowemu albo aplikacji branżowej i nie ustalono, które da się usunąć
      - Maszyna pełni rolę serwera plików, a listy uprawnionych nie przejrzano od czasu migracji z wcześniejszego systemu
    en:
      - The list holds groups needed by backup software, network printing or a line-of-business application and it has not been established which can be removed
      - The machine serves as a file server and the list of the permitted has not been reviewed since the migration from an earlier system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeNetworkLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-11,S-1-5-32-544,S-1-5-9|S-1-5-11,S-1-5-32-544|S-1-5-32-544,S-1-5-9|S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeNetworkLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeNetworkLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list is replaced wholesale rather than trimmed, so review it first. A
    # refusal here shows at once - but it shows in production if nobody looked.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeNetworkLogonRight = *S-1-5-32-544,*S-1-5-11,*S-1-5-9',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeNetworkLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/access-this-computer-from-the-network

notes:
  pl: |
    Oczekiwana lista obejmuje administratorów lokalnych, użytkowników
    uwierzytelnionych i kontrolery domeny. Wariant bez kontrolerów jest
    poprawny na serwerze członkowskim spoza domeny i audyt uznaje go za zgodny.

    Grupa użytkowników uwierzytelnionych jest tu obecna celowo i nie należy jej
    mylić z grupą obejmującą każdego. Pierwsza wymaga zalogowania, druga nie —
    i to jest cała różnica, o którą w tym punkcie chodzi.

    Punkt warto czytać razem z regułą o odmowie dostępu z sieci dla gości.
    Odmowa jest silniejsza od zgody, więc tamta reguła działa nawet wtedy, gdy
    lista z tej reguły zostanie kiedyś poszerzona.
  en: |
    The expected list covers the local administrators, authenticated users and
    domain controllers. The variant without the controllers is correct on a member
    server outside a domain and the audit counts it as compliant.

    The authenticated users group is present here deliberately and should not be
    confused with the group covering everybody. The first requires a sign-in, the
    second does not - and that is the whole difference this item is about.

    The item is worth reading together with the rule refusing network access to
    guests. A refusal is stronger than a permission, so that rule works even where
    the list in this one is widened some day.
