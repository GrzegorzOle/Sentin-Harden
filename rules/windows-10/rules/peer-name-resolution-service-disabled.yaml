id: win10-peer-name-resolution-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa rozwiązywania nazw w sieci równorzędnej wyłączona
    en: The service resolving names in a network of peers switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę zamieniającą nazwy na adresy w sieci
    równorzędnej, czyli poza zwykłym systemem nazw domenowych.

    Mechanizm ten pozwala maszynom odnajdywać się nawzajem bez serwera
    pośredniczącego. Nazwa nie jest rejestrowana w żadnym miejscu
    centralnym — krąży między uczestnikami, którzy przekazują ją dalej.

    Zagrożenie płynie stąd, że taka droga omija wszystko, co zbudowano
    wokół nazw domenowych. Nie ma zapisu zapytań, nie ma miejsca, w którym
    dałoby się nazwę zablokować, nie ma nadzoru nad tym, kto ogłasza się
    pod jaką nazwą.

    Dla napastnika jest to kanał komunikacji obok kanału obserwowanego.
    Maszyna może odnaleźć inną maszynę i nawiązać z nią połączenie
    w sieci, w której pilnuje się rozpoznawania nazw domenowych — bo tą
    drogą nazwa nie przechodzi przez żaden serwer.

    Odnotowuję, że mechanizm jest używany rzadko. Zbudowano na nim
    grupę domową i część narzędzi współpracy, a obie te rzeczy zostały
    wycofane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    odnajdywania maszyn omijającą nadzór nad nazwami domenowymi.
  en: |
    The setting switches off the service turning names into addresses in a network of peers, which is to say
    outside the ordinary settlement of names of domains.

    That mechanism lets machines find one another without a server between. A name is set down in no middle place
    - it goes about among those taking part, who hand it on further.

    The danger flows from this, that such a road goes about everything built around names of domains. There is no
    record of the askings, no place where a name might be shut out, no watch over who gives themselves out under
    which name.

    For an attacker it is a way of speaking beside the way that is watched. A machine may find another machine and
    make a joining with it in a network where the knowing of names of domains is kept an eye upon - for by this
    road the name goes through no server at all.

    I set down that the mechanism is used seldom. The home group and some tools of working together were built
    upon it, and both of those have been drawn back.

    What an attacker gains while the item goes unmet: a road of finding machines that goes about the watch over
    names of domains.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    na maszynie działa narzędzie zbudowane na tej drodze.

    Miejscem wartym uwagi są starsze narzędzia współpracy i zdalnej
    pomocy, które odnajdują drugą stronę bez serwera. Część z nich potrafi
    przejść na inną drogę, część zgłasza wyłącznie brak połączenia.

    Miejscem drugim są własne rozwiązania branżowe budowane lata temu,
    gdy mechanizm ten był promowany jako sposób na sieć bez infrastruktury.
    Zdarzają się rzadko, ale są trudne do zastąpienia.

    Odnotowuję, że trzy usługi sieci równorzędnej zależą od siebie
    nawzajem. Wyłączenie tej pociąga za sobą skutki dla publikowania nazw
    i dla grupowania, więc warto rozpatrywać je razem.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: rozpoznawania nazw domenowych, dostępu do
    udziałów, przeglądania stron, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether there works upon the machine a tool built
    upon that road.

    The place worth notice is older tools of working together and of help from afar that find the other side
    without a server. Some of them can go over to another road, some report no more than a want of a joining.

    The second place is answers of a trade of one's own built years ago, when that mechanism was put forward as a
    way to a network without works beneath it. They are met with seldom but are hard to set another in the place
    of.

    I set down that three services of the network of peers hang upon one another. The switching off of this one
    draws after it consequences for the putting out of names and for the grouping, so they are best weighed
    together.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the knowing of names of domains, the reach of shares, the looking over of pages,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Starsze narzędzia współpracy i zdalnej pomocy odnajdujące drugą stronę bez serwera przestaną ją znajdować
      - Część z nich przejdzie na inną drogę, część zgłosi wyłącznie brak połączenia bez wskazania przyczyny
      - Własne rozwiązania branżowe budowane na tym mechanizmie są rzadkie, ale trudne do zastąpienia
      - Trzy usługi sieci równorzędnej zależą od siebie, więc warto rozpatrywać je razem
      - Rozpoznawanie nazw domenowych, dostęp do udziałów, przeglądanie stron, logowanie i drukowanie pozostają bez zmian
    en:
      - Older tools of working together and of help from afar that find the other side without a server will cease to find it
      - Some of them will go over to another road, some will report no more than a want of a joining, giving no cause
      - Answers of a trade of one s own built upon that mechanism are seldom met but hard to set another in the place of
      - Three services of the network of peers hang upon one another, so they are best weighed together
      - The knowing of names of domains, the reach of shares, the looking over of pages, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa rozwiązanie branżowe odnajdujące partnerów wyłącznie przez nazwy sieci równorzędnej
    en:
      - Upon the machine works an answer of a trade that finds its partners solely by names of the network of peers
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'PNRPsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PNRPsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

notes:
  pl: |
    Reguła jest środkiem trójki usług sieci równorzędnej i warto, żeby
    aplikacja pokazała całą trójkę razem. Publikowanie nazwy, rozwiązywanie
    nazw i grupowanie tworzą jeden mechanizm, a wyłączenie jednej części
    zostawia dwie pozostałe w stanie, w którym działają, ale do niczego
    nie prowadzą.

    Argument wart postawienia wprost dotyczy tego, czego ten kanał omija.
    Nie chodzi o to, że sam w sobie jest groźny. Chodzi o to, że nazwa nie
    przechodzi przez żaden serwer, więc wszystko, co zbudowano wokół
    nadzoru nad nazwami domenowymi, po prostu go nie widzi.

    Odnotowuję, że mechanizm jest wycofywany razem z rzeczami, dla których
    powstał. Warto to powiedzieć, bo obniża to koszt punktu i zmienia
    rachunek na jego korzyść.
  en: |
    The rule is the middle of the three services of the network of peers, and it is well that the application show
    all three together. The putting out of a name, the settling of names and the grouping make one mechanism, and
    the switching off of one part leaves the other two working but leading nowhere.

    The argument worth putting outright touches what this way of speaking goes about. What is at stake is not that
    it is dangerous of itself. It is that the name goes through no server, so everything built around the watch
    over names of domains simply does not see it.

    I set down that the mechanism is being drawn back together with the things it came about for. It is worth
    saying, that lowering the item's cost and turning the reckoning in its favour.
