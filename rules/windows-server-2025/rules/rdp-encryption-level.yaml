id: win2025-rdp-encryption-level

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services
  title:
    pl: Wysoki poziom szyfrowania połączeń pulpitu zdalnego
    en: High encryption level for Remote Desktop connections
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa najniższą siłę szyfrowania, na jaką serwer
    zgodzi się przy zestawianiu sesji pulpitu zdalnego.

    Wartość niższa od wymaganej oznacza zgodę na szyfrowanie słabsze
    albo na szyfrowanie tylko w jedną stronę — od klienta do serwera,
    z zawartością ekranu odsyłaną w postaci, którą da się odczytać.
    Wybiera ją nie serwer, tylko klient, więc serwer ustawiony nisko
    godzi się z góry na to, co przyniesie najsłabszy z łączących się.

    Skutkiem jest podsłuch bierny. Kto widzi ruch po drodze, ten widzi
    obraz sesji, a w sesji administracyjnej na serwerze widzi zwykle
    konsole zarządzania, konfigurację i to, co w nich wpisywane.

    Na serwerze rzecz waży dwojako. Sesja zdalna do serwera niesie
    poświadczenia o większej wadze, a droga do serwera przechodzi przez
    więcej odcinków sieci — bywa, że przez łącze między lokalizacjami,
    którego nikt z zespołu nie kontroluje.

    Trzeba jednak powiedzieć uczciwie, ile ten punkt wnosi obok punktu
    o warstwie zabezpieczeń. Gdy warstwą zabezpieczeń jest protokół
    warstwy transportowej, to on odpowiada za szyfrowanie sesji,
    a ta wartość przestaje być tym, co rozstrzyga. Punkt ma wtedy
    znaczenie zabezpieczenia na wypadek, gdyby tamto ustawienie zostało
    cofnięte albo obeszła je negocjacja.

    Dlatego zostawiam tu kategorię średnią, mimo że temat brzmi poważnie.
    Sam w sobie punkt nie blokuje ataku — domyka drogę, którą zamyka
    ustawienie sąsiednie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odczytania obrazu sesji zdalnej z ruchu sieciowego tam,
    gdzie sesja nie idzie przez protokół warstwy transportowej.
  en: |
    The setting names the least strength of encryption the server will agree to at the setting up
    of a remote desktop session.

    A value lower than the one called for means a consent to weaker encryption, or to encryption
    one way only - from the client to the server, with the screen's contents sent back in a form
    that can be read. It is chosen not by the server but by the client, so a server set low agrees
    beforehand to whatever the weakest of those connecting brings.

    The effect is idle listening. Whoever sees the traffic along the way sees the session's
    picture, and in an administrative session on a server they usually see consoles of management,
    settings, and what is typed into them.

    On a server the matter weighs twofold. A remote session to a server carries credentials of
    greater weight, and the road to a server goes through more stretches of network - at times
    through a link between places that nobody on the team governs.

    It must be said honestly, though, how much this item brings beside the item about the security
    layer. Where the security layer is the transport layer's protocol, it is that which answers
    for the session's encryption, and this value stops being what settles the matter. The item has
    then the meaning of a guard in case that setting were undone or negotiation went round it.

    For that reason I leave the category at middling here, though the subject sounds grave. Of
    itself the item blocks no attack - it closes off a road that the neighbouring setting shuts.

    What an attacker gains while the item goes unmet: the means of reading a remote session's
    picture out of the network traffic where the session does not go by the transport layer's
    protocol.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy do serwera łączy się klient, który
    wymaganej siły szyfrowania nie obsługuje.

    Współczesne klienty obsługują ją od lat i dla nich zmiana jest
    niewidoczna. Nie obsługują jej terminale cienkiego klienta sprzed
    dekady i stare narzędzia dostawców — czyli dokładnie te same
    urządzenia, które wypadają przy punkcie o uwierzytelnianiu na
    poziomie sieci i przy punkcie o warstwie zabezpieczeń.

    Jest to obserwacja praktyczna, którą warto wykorzystać: te trzy
    punkty wdraża się razem, bo rozpoznanie jest dla nich wspólne.
    Wystarczy raz ustalić, co łączy się z tym serwerem i jak stare jest
    najstarsze z tych urządzeń. Wdrażanie ich osobno oznacza trzykrotne
    zadawanie tego samego pytania i trzy osobne okazje do zerwania
    komuś połączenia.

    Objawem po zmianie jest odmowa przy nawiązywaniu sesji, a nie
    pogorszenie jej jakości. Klient, który nie umie, nie łączy się wcale.

    Zmiana wchodzi w życie od razu. Sesje już nawiązane pracują dalej,
    więc sesja, z której wprowadzasz zmianę, nie zostanie przerwana —
    warunek sprawdza się przy następnym połączeniu.

    Droga zapasowa do maszyny ma być znana przed zmianą. Powtarzam to
    przy każdym punkcie dotyczącym drzwi wejściowych serwera, bo jest to
    jedyny błąd w tej grupie, którego nie da się naprawić zdalnie.
  en: |
    One thing needs checking: whether a client connects to the server that does not serve the
    strength of encryption called for.

    Present-day clients have served it for years and for them the change is unseen. It is not
    served by thin client terminals from a decade ago and by old tools of vendors - that is by
    exactly the same devices that fall out at the item about authentication at the network level
    and at the item about the security layer.

    It is a practical observation worth using: these three items are rolled out together, the
    reconnaissance being common to them. It is enough to settle once what connects to this server
    and how old the oldest of those devices is. Rolling them out apart means asking the same
    question three times over and three separate chances of severing somebody's connection.

    The symptom after the change is a refusal at the opening of a session and not a worsening of
    its quality. A client that cannot does not connect at all.

    The change comes into force straight away. Sessions already opened work on, so the session you
    make the change from will not be broken - the condition is checked at the next connecting.

    The spare road to the machine is to be known before the change. I repeat it at every item
    about a server's front door, that being the one mistake in this group which cannot be mended
    from afar.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-authentication
  what_breaks:
    pl:
      - Terminal cienkiego klienta sprzed dekady nie nawiąże sesji z serwerem
      - Stare narzędzie dostawcy zestawiające sesję zdalną przestanie działać
      - Objawem jest odmowa przy nawiązywaniu sesji, a nie pogorszenie jej jakości
      - Sesje już nawiązane pracują dalej, warunek sprawdza się przy następnym połączeniu
    en:
      - A thin client terminal from a decade ago will not open a session with the server
      - An old tool of a vendor setting up a remote session will stop working
      - The symptom is a refusal at the opening of a session and not a worsening of its quality
      - Sessions already opened work on, the condition being checked at the next connecting
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do serwera łączą się terminale, dla których producent nie wydaje już aktualizacji
      - Nie ma innej drogi do tej maszyny niż pulpit zdalny, a klient po drugiej stronie jest przestarzały
    en:
      - Terminals connect to the server for which the maker no longer ships updates
      - There is no road to this machine other than remote desktop and the client on the other end is outdated
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $ts = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $deny = (Get-ItemProperty -Path $ts -Name 'fDenyTSConnections' -ErrorAction Stop).fDenyTSConnections
      if ($deny -eq 1) {
        # Remote Desktop is switched off, so there is no session to encrypt.
        'NOT_APPLICABLE'
      } else {
        $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        $name = 'MinEncryptionLevel'
        if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
        else {
          $item = Get-ItemProperty -Path $path -ErrorAction Stop
          if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    $name = 'MinEncryptionLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sessions already opened are not broken. The condition is checked at the
    # next connecting, so the session this is run from stays.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
      -Name 'MinEncryptionLevel' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Siłę szyfrowania wybiera klient, więc serwer ustawiony nisko godzi
    się z góry na to, co przyniesie najsłabszy z łączących się.

    Obok punktu o warstwie zabezpieczeń ta wartość przestaje być tym,
    co rozstrzyga — gdy sesja idzie przez protokół warstwy
    transportowej, to on odpowiada za szyfrowanie. Punkt zostaje jako
    zabezpieczenie na wypadek cofnięcia tamtego ustawienia. Dlatego
    kategoria jest średnia, mimo że temat brzmi poważnie.

    Ten punkt, warstwę zabezpieczeń i uwierzytelnianie na poziomie sieci
    wdraża się razem — wypadają przy nich te same urządzenia, więc
    rozpoznanie jest wspólne.
  en: |
    The strength of encryption is chosen by the client, so a server set low agrees beforehand to
    whatever the weakest of those connecting brings.

    Beside the item about the security layer this value stops being what settles the matter -
    where the session goes by the transport layer's protocol, it is that which answers for the
    encryption. The item stays as a guard in case that setting were undone. Hence the category is
    middling, though the subject sounds grave.

    This item, the security layer and authentication at the network level are rolled out together
    - the same devices fall out at all of them, so the reconnaissance is common.
