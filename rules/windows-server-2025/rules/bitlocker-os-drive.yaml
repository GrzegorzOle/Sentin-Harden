id: win2025-bitlocker-os-drive

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Szyfrowanie dysku systemowego włączone
    en: System drive encryption enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy dysk systemowy jest zaszyfrowany i czy ochrona
    jest włączona.

    Zostawiam kategorię wysoką, ale chcę od razu zawęzić obietnicę, bo
    szyfrowanie dysku bywa rozumiane szerzej, niż działa. Dysk pracującego
    serwera jest odblokowany. Napastnik, który dostał się do systemu,
    czyta pliki tak samo jak przedtem — szyfrowanie nie stoi mu na drodze
    ani o krok. Ten punkt broni dysku w spoczynku, czyli wtedy, gdy nośnik
    znajdzie się poza maszyną.

    I właśnie dlatego na serwerze waży więcej, niż się wydaje. Zagrożeniem
    nie jest tu kradzież serwera — to zdarza się rzadko. Zagrożeniem jest
    to, co dzieje się z dyskami serwera rutynowo: dysk, który zgłosił błąd
    i wraca do producenta w ramach gwarancji, macierz przekazywana do
    utylizacji, maszyna zwracana po zakończeniu umowy leasingu, nośnik
    wymieniany przez serwisanta przy okazji innej naprawy. W każdym z tych
    przypadków nośnik z danymi produkcyjnymi opuszcza budynek w procedurze,
    której nikt nie nazywa wyciekiem, bo formalnie jest to obsługa
    gwarancji albo utylizacja sprzętu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    całej zawartości dysku bez uwierzytelniania, wszędzie tam, gdzie
    nośnik znajdzie się poza pracującą maszyną — a nośniki serwera
    opuszczają maszynę regularnie i planowo.
  en: |
    The item checks whether the system drive is encrypted and whether
    protection is switched on.

    I keep the category high, but I want to narrow the promise straight
    away, because disk encryption is often understood more broadly than it
    works. The drive of a running server is unlocked. An attacker who has
    reached the system reads files exactly as before - encryption does not
    stand in their way by so much as a step. This item defends the drive at
    rest, that is, when the medium finds itself outside the machine.

    And that is precisely why it weighs more on a server than it seems. The
    threat here is not server theft - that happens rarely. The threat is
    what happens to a server's drives routinely: a disk that reported an
    error and goes back to the manufacturer under warranty, an array handed
    over for disposal, a machine returned at the end of a lease, a medium
    swapped by an engineer in the course of another repair. In every one of
    those cases a medium holding production data leaves the building under
    a procedure nobody calls a leak, because formally it is a warranty
    claim or hardware disposal.

    What an attacker gains while the item goes unmet: access to the entire
    contents of the drive without authentication, anywhere the medium ends
    up outside the running machine - and a server's media leave the machine
    regularly and by plan.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać cenę,
    którą na serwerze płaci się inaczej niż na stacji roboczej.

    Pierwsza rzecz to klucz odzyskiwania. Bez niego zmiana konfiguracji
    rozruchu — aktualizacja oprogramowania układowego, przestawienie
    kolejności rozruchu, wymiana płyty — kończy się maszyną, która prosi
    o klucz, i danymi, do których nie ma drogi. Na serwerze jest to
    groźniejsze, bo o klucz poprosi konsola w innym mieście, o trzeciej
    w nocy, a osoba, która go nie ma, nie może po prostu sięgnąć do
    szuflady. Klucz zapisuje się poza tą maszyną, zanim cokolwiek zacznie
    się szyfrować, i sprawdza się, że da się go odczytać.

    Druga rzecz to samo szyfrowanie. Pierwsze zaszyfrowanie dużego wolumenu
    trwa i obciąża podsystem dyskowy. Na maszynie obsługującej bazę albo
    plik wymiany robi to różnicę mierzalną, a przerwanie procesu zasilaniem
    zostawia wolumen w stanie pośrednim. Robi się to w oknie, a nie
    w przerwie między zadaniami.

    Trzecia rzecz dotyczy maszyn wirtualnych i warto ją rozstrzygnąć przed,
    a nie po. Serwer wirtualny leży jako plik na dysku hosta. Szyfrowanie
    wewnątrz maszyny nie chroni tego pliku przed nikim, kto ma dostęp do
    magazynu hosta, a jednocześnie odbiera hostowi możliwość sensownej
    deduplikacji i utrudnia kopie na poziomie migawki. Bywa, że właściwą
    odpowiedzią na maszynie wirtualnej jest szyfrowanie po stronie
    magazynu i zapisany wyjątek tutaj — z uzasadnieniem, a nie po cichu.

    Reguła nie ma przycisku uruchomienia. Nie dlatego, że brakuje kopii
    zapasowej, tylko dlatego, że nie ma z czego zrobić wycofania:
    odszyfrowanie wolumenu jest osobną, długotrwałą operacją, a nie
    cofnięciem wpisu.
  en: |
    I keep the class "needs a planned rollout" and want to name the price,
    which on a server is paid differently than on a workstation.

    The first thing is the recovery key. Without it a change to the boot
    configuration - a firmware update, a change of boot order, a mainboard
    replacement - ends with a machine asking for the key and data there is
    no route to. On a server this is more dangerous, because the console
    asking for it is in another city, at three in the morning, and the
    person who does not have it cannot simply open a drawer. The key is
    stored off this machine before anything starts being encrypted, and it
    is verified that it can be read.

    The second thing is the encryption itself. The first encryption of a
    large volume takes time and loads the disk subsystem. On a machine
    serving a database or a paging file that makes a measurable difference,
    and interrupting the process with a power event leaves the volume in an
    intermediate state. This is done in a window, not in a gap between
    jobs.

    The third thing concerns virtual machines and is worth settling before
    rather than after. A virtual server sits as a file on the host's
    storage. Encryption inside the machine does not protect that file from
    anybody with access to the host's storage, and at the same time it
    deprives the host of meaningful deduplication and complicates
    snapshot-level backups. Sometimes the right answer on a virtual machine
    is encryption on the storage side and a recorded exception here - with
    a justification, not quietly.

    The rule has no run button. Not because a backup is missing, but
    because there is nothing to build a rollback from: decrypting a volume
    is a separate, long-running operation, not the undoing of an entry.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - updates-and-servicing
    - drivers-and-devices
  what_breaks:
    pl:
      - Zmiana konfiguracji rozruchu kończy się maszyną proszącą o klucz odzyskiwania z konsoli w innym mieście
      - Pierwsze zaszyfrowanie dużego wolumenu trwa i obciąża podsystem dyskowy w sposób mierzalny
      - Przerwanie szyfrowania zasilaniem zostawia wolumen w stanie pośrednim
      - Na maszynie wirtualnej szyfrowanie wewnątrz nie chroni pliku dysku na hoście, a odbiera deduplikację i utrudnia migawki
      - Odszyfrowanie jest osobną długotrwałą operacją, a nie cofnięciem wpisu w rejestrze
    en:
      - A change to the boot configuration ends with the machine asking for the recovery key from a console in another city
      - The first encryption of a large volume takes time and loads the disk subsystem measurably
      - Interrupting encryption with a power event leaves the volume in an intermediate state
      - On a virtual machine, encryption inside does not protect the disk file on the host, and it removes deduplication and complicates snapshots
      - Decryption is a separate long-running operation, not the undoing of a registry entry
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Klucz odzyskiwania nie został zapisany poza tą maszyną i odczytany na próbę
      - Serwer jest maszyną wirtualną, a szyfrowanie realizuje magazyn hosta
      - Nie ma okna, w którym da się przeprowadzić pierwsze szyfrowanie bez ryzyka przerwania
      - Maszyna nie ma modułu sprzętowego, a wdrożenie nie przewiduje innego sposobu przechowania klucza
    en:
      - The recovery key has not been stored off this machine and read back as a test
      - The server is a virtual machine and encryption is provided by the host's storage
      - There is no window in which the first encryption can be run without risk of interruption
      - The machine has no hardware module and the rollout provides no other way of holding the key
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $volume = Get-BitLockerVolume -MountPoint $env:SystemDrive -ErrorAction Stop
      if ($null -eq $volume) { 'CHECK_ERROR' } else { [string]$volume.ProtectionStatus }
    } catch {
      # Reading BitLocker state needs elevation, and the feature is absent from
      # some installations. Neither case may be reported as an encrypted drive.
      'CHECK_ERROR'
    }
  expected: 'On'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $volume = Get-BitLockerVolume -MountPoint $env:SystemDrive
    [pscustomobject]@{
      mount_point       = $volume.MountPoint
      protection_status = [string]$volume.ProtectionStatus
      volume_status     = [string]$volume.VolumeStatus
      key_protectors    = @($volume.KeyProtector | ForEach-Object { [string]$_.KeyProtectorType })
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Store the recovery key somewhere off this machine BEFORE going further,
    # and read it back to confirm it is readable. On a server the console that
    # asks for it is remote, and nobody can open a drawer at three in the
    # morning. Run this in a window: the first encryption of a large volume
    # loads the disk subsystem and must not be interrupted.
    $drive = $env:SystemDrive
    Add-BitLockerKeyProtector -MountPoint $drive -RecoveryPasswordProtector
    (Get-BitLockerVolume -MountPoint $drive).KeyProtector |
      Where-Object { $_.KeyProtectorType -eq 'RecoveryPassword' } |
      Select-Object -Property KeyProtectorId, RecoveryPassword |
      Format-List
    Enable-BitLocker -MountPoint $drive -TpmProtector -SkipHardwareTest

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Obietnica jest węższa, niż się wydaje: dysk pracującego serwera jest
    odblokowany, więc napastnik, który dostał się do systemu, czyta pliki
    tak samo jak przedtem. Punkt broni dysku w spoczynku.

    Na serwerze zagrożeniem nie jest kradzież, tylko to, co dzieje się
    z dyskami rutynowo: zwrot gwarancyjny, utylizacja macierzy, koniec
    leasingu, wymiana nośnika przez serwisanta. Nośnik z danymi
    produkcyjnymi opuszcza budynek w procedurze, której nikt nie nazywa
    wyciekiem.

    Brak przycisku uruchomienia nie wynika z braku kopii zapasowej, tylko
    z braku wycofania: odszyfrowanie wolumenu jest osobną długotrwałą
    operacją.
  en: |
    The promise is narrower than it seems: the drive of a running server is
    unlocked, so an attacker who has reached the system reads files exactly
    as before. The item defends the drive at rest.

    On a server the threat is not theft but what happens to drives
    routinely: a warranty return, array disposal, the end of a lease, a
    medium swapped by an engineer. A medium holding production data leaves
    the building under a procedure nobody calls a leak.

    The absence of a run button does not follow from a missing backup but
    from a missing rollback: decrypting a volume is a separate long-running
    operation.
