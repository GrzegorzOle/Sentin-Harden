id: win2025-feature-updates-deferred

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Aktualizacje funkcji opóźnione o co najmniej 180 dni
    en: Feature updates put off by at least 180 days
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt opóźnia aktualizacje funkcji — czyli przejścia na nową wersję
    systemu — o co najmniej sto osiemdziesiąt dni. Dwie wartości:
    przełącznik i liczba dni; sam przełącznik bez odpowiednio długiej
    zwłoki audyt raportuje osobno.

    Kategoria niska i chcę być tu szczery co do powodu. Ten punkt nie
    zamyka żadnej drogi wejścia. On zabezpiecza przed czymś innym: przed
    tym, że maszyna zmieni wersję systemu wtedy, gdy nikt tego nie
    planował.

    Czytany osobno wygląda wręcz odwrotnie do reszty grupy — bo każe
    czekać, podczas gdy sąsiedni punkt każe nie czekać ani dnia. Razem
    mówią jednak rzecz spójną i to jest myśl warta zapamiętania: poprawka
    ma iść natychmiast, zmiana wersji systemu ma poczekać pół roku. Chcę
    naprawy, nie chcę innego systemu.

    Sto osiemdziesiąt dni to czas, w którym nowa wersja zdąży zebrać swoje
    własne poprawki i swoje własne wykazy znanych usterek. Serwer nie jest
    dobrym miejscem na sprawdzanie, które z nich dotyczą akurat tej roli.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: właściwie
    nic bezpośrednio — ale maszyna, która zmieniła wersję bez planu, bywa
    maszyną, na której coś przestało działać, i to jest stan, w którym
    wyłącza się zabezpieczenia, żeby usługa wróciła.
  en: |
    The item puts off feature updates - that is, moves to a new system
    version - by at least one hundred and eighty days. Two values: the
    switch and the number of days; the switch alone without a long enough
    delay is reported separately by the audit.

    The category is low, and I want to be honest about the reason. This
    item closes no way in. It guards against something else: against the
    machine changing its system version at a moment nobody planned.

    Read on its own it looks like the opposite of the rest of the group -
    it calls for waiting, while the neighbouring item calls for not waiting
    a single day. Together, though, they say something coherent, and that
    is the thought worth remembering: a fix is to go at once, a change of
    system version is to wait half a year. I want the repair, I do not want
    a different system.

    One hundred and eighty days is the time in which a new version manages
    to gather its own fixes and its own lists of known faults. A server is
    not a good place to find out which of them touch this particular role.

    What an attacker gains while the item goes unmet: nothing directly,
    really - but a machine that changed version without a plan is often a
    machine where something stopped working, and that is the state in which
    protections get switched off so the service comes back.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę zacząć od rzeczy, którą
    trzeba ustalić przed zmianą, bo od niej zależy, czy ta reguła w ogóle
    coś robi.

    Serwer bywa wydawany w odmianie, w której aktualizacji funkcji nie ma
    wcale — wersja jest ustalona na cały okres wsparcia i zmienia się przez
    osobną instalację, a nie przez aktualizację. Na takiej maszynie ten
    wpis istnieje i nie ma na co działać. Będzie wyglądał na spełniony
    i będzie bez znaczenia. Warto to wiedzieć, zamiast zapisywać
    w sprawozdaniu zabezpieczenie, którego nie ma.

    Tam, gdzie aktualizacje funkcji rzeczywiście przychodzą, skutek jest
    jeden i odwrotny do tego, czego ludzie się obawiają: nie przyjdzie coś,
    co miało przyjść. Maszyna zostanie na wersji, którą ma, o pół roku
    dłużej. Problem pojawia się wtedy, gdy ta wersja zbliża się do końca
    wsparcia — wtedy zwłoka przestaje być ostrożnością i zaczyna być
    zwlekaniem. Warto więc zapisać, kiedy wersja tej maszyny przestaje być
    wspierana, i traktować tę datę jako termin, a nie jako ciekawostkę.

    Druga rzecz: zwłoka liczy się od udostępnienia wersji, a nie od dnia
    wpisania zasady. Włączenie jej na maszynie, na której nowa wersja już
    czeka od roku, nie zatrzyma niczego.

    Zmiana nie wymaga przerwy, nikt jej nie zauważy i cofa się
    natychmiast.
  en: |
    I keep the class "needs review", and I want to start from something
    that has to be settled before the change, because whether this rule
    does anything at all depends on it.

    A server is sometimes released in a variant where feature updates do
    not exist at all - the version is fixed for the whole support period
    and changes through a separate installation rather than through an
    update. On such a machine this entry exists and has nothing to act on.
    It will look met and will mean nothing. Worth knowing, rather than
    writing into a report a protection that is not there.

    Where feature updates do arrive, the effect is single and the opposite
    of what people fear: something that was going to come will not come.
    The machine will stay on the version it has for half a year longer. The
    problem appears when that version approaches the end of its support -
    then the delay stops being caution and starts being procrastination. So
    it is worth recording when this machine's version stops being
    supported, and treating that date as a deadline rather than as a piece
    of trivia.

    The second thing: the delay is counted from the version's release, not
    from the day the policy was written. Turning it on where a new version
    has already been waiting for a year will hold nothing back.

    The change needs no outage, nobody will notice it, and it is undone
    immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Nic nie przestaje działać — nie przychodzi coś, co miało przyjść, i maszyna zostaje na swojej wersji o pół roku dłużej
      - W odmianie serwera bez aktualizacji funkcji wpis istnieje, wygląda na spełniony i nie ma na co działać
      - Gdy wersja maszyny zbliża się do końca wsparcia, zwłoka przestaje być ostrożnością i staje się zwlekaniem
      - Zwłoka liczy się od udostępnienia wersji, więc włączenie jej przy wersji czekającej od roku nie zatrzyma niczego
    en:
      - Nothing stops working - something that was going to come does not, and the machine stays on its version half a year longer
      - On a server variant without feature updates the entry exists, looks met, and has nothing to act on
      - When the machine's version approaches the end of support, the delay stops being caution and becomes procrastination
      - The delay is counted from the version's release, so turning it on where a version has waited a year holds nothing back
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wersja systemu na tej maszynie zbliża się do końca wsparcia i dalsza zwłoka oznacza pozostanie bez poprawek
      - Maszyna pracuje w odmianie bez aktualizacji funkcji, więc ten wpis nie ma na co działać
    en:
      - This machine's system version is approaching the end of support and further delay means being left without fixes
      - The machine runs a variant without feature updates, so this entry has nothing to act on
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch and the number of days. The
      # switch set without a long enough delay is reported apart, because it is
      # the number that settles the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      $minimum = 180
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DeferFeatureUpdates'
        $days = $item.'DeferFeatureUpdatesPeriodInDays'
        if ($null -eq $switch -or $null -eq $days) { 'MISSING' }
        elseif ([int]$switch -ne 1) { 'NOT_SET' }
        elseif ([int]$days -lt $minimum) { 'BELOW_MINIMUM ' + [int]$days }
        else { 'AT_OR_ABOVE_MINIMUM' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AT_OR_ABOVE_MINIMUM
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path           = $path
      switch         = $item.'DeferFeatureUpdates'
      switch_existed = ($null -ne $item.'DeferFeatureUpdates')
      days           = $item.'DeferFeatureUpdatesPeriodInDays'
      days_existed   = ($null -ne $item.'DeferFeatureUpdatesPeriodInDays')
      key_existed    = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This holds back the change of system version, not the security fixes -
    # those are the neighbouring item's business and go without delay. Record
    # when this machine's version leaves support and treat it as a deadline.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdates' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdatesPeriodInDays' -Value 180 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -ErrorAction SilentlyContinue
    }
    if ($b.days_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -Value $b.days -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Czytany osobno wygląda odwrotnie do reszty grupy — każe czekać, podczas
    gdy sąsiedni punkt każe nie czekać ani dnia. Razem mówią rzecz spójną:
    poprawka natychmiast, zmiana wersji systemu za pół roku. Chcę naprawy,
    nie chcę innego systemu.

    Do ustalenia przed zmianą: w odmianie serwera bez aktualizacji funkcji
    ten wpis nie ma na co działać. Będzie wyglądał na spełniony i będzie
    bez znaczenia.

    Granica przydatności tej reguły: gdy wersja maszyny zbliża się do końca
    wsparcia, zwłoka przestaje być ostrożnością i staje się zwlekaniem.
  en: |
    Read on its own it looks like the opposite of the rest of the group -
    it calls for waiting while the neighbouring item calls for not waiting
    a single day. Together they say something coherent: the fix at once,
    the change of system version in half a year. I want the repair, I do
    not want a different system.

    To settle before the change: on a server variant without feature
    updates this entry has nothing to act on. It will look met and will
    mean nothing.

    The limit of this rule's usefulness: when the machine's version
    approaches the end of support, the delay stops being caution and
    becomes procrastination.
