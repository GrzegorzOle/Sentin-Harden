id: win2025-hypervisor-code-integrity-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Wymuszanie integralności kodu przez hipernadzorcę włączone
    en: Hypervisor-enforced code integrity enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza sprawdzanie integralności kodu jądra przez warstwę
    wirtualizacji. Kod, który ma zostać wykonany z uprawnieniami jądra,
    musi być podpisany i zgodny z regułami, a decyzję podejmuje warstwa
    leżąca poza samym jądrem.

    Zostawiam kategorię wysoką. Jest to mechanizm, który zamyka drogę
    wykorzystywaną od lat: napastnik, który zdobył dość uprawnień, ładuje
    do jądra własny sterownik albo sterownik cudzy, podpisany i znany
    jako podatny, i od tego momentu działa poniżej wszystkiego, co go
    mogło zobaczyć. Sprawdzanie prowadzone spoza jądra znaczy, że sam
    fakt zdobycia jądra nie pozwala tego sprawdzania obejść.

    Na serwerze wartość jest większa niż na stacji roboczej o tyle,
    o ile więcej na serwerze stoi oprogramowania pracującego w jądrze:
    agenty kopii zapasowych, filtry ochrony, sterowniki kontrolerów
    dyskowych, agenty monitorowania sprzętu producenta maszyny. Każdy
    z nich jest kodem w jądrze, a więc każdy jest drogą, jeżeli okaże się
    podatny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    załadowania do jądra własnego kodu po zdobyciu odpowiednich
    uprawnień, a więc zejścia poniżej poziomu, na którym cokolwiek na tej
    maszynie mogłoby go jeszcze zauważyć.
  en: |
    The item switches on verification of the integrity of kernel code by
    the virtualisation layer. Code that is to run with kernel privileges
    must be signed and compliant with the rules, and the decision is made
    by a layer sitting outside the kernel itself.

    I keep the category high. This is a mechanism that closes a route used
    for years: an attacker who has gained sufficient privileges loads a
    driver of their own into the kernel, or somebody else's driver, signed
    and known to be vulnerable, and from that moment works below
    everything that might have seen them. Verification run from outside
    the kernel means that merely winning the kernel does not let that
    verification be bypassed.

    On a server the value is greater than on a workstation by as much as
    there is more kernel-mode software on a server: backup agents,
    security filters, disk controller drivers, agents monitoring the
    vendor's hardware. Each of them is code inside the kernel, and
    therefore each is a route, should it prove vulnerable.

    What an attacker gains while the item goes unmet: the ability to load
    their own code into the kernel once they have sufficient privileges,
    and thereby to go below the level at which anything on that machine
    might still notice them.
disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i mówię wprost, że
    jest to najgroźniejszy punkt w tej grupie, a prawdopodobnie
    najgroźniejszy w całej dotychczasowej paczce. Nie dlatego, że coś
    psuje, tylko dlatego, że to, co może zepsuć, uniemożliwia start
    maszyny.

    Mechanizm ten odmawia załadowania sterownika, który nie spełnia
    wymagań. Na stacji roboczej odmowa dotyczy zwykle sterownika drukarki
    i objawia się tym, że nie da się drukować. Na serwerze ten sam
    mechanizm może odmówić sterownikowi kontrolera dyskowego, karcie
    magistrali pamięci masowej albo filtrowi systemu plików należącemu do
    agenta kopii zapasowych. Odmowa sterownikowi, przez który maszyna
    widzi swój dysk, znaczy maszynę, która się nie uruchamia.

    Dlatego kolejność przy tym punkcie jest inna niż przy wszystkich
    pozostałych. Nie wystarczy podgląd skutków ani okno serwisowe.
    Właściwym sposobem jest sprawdzenie na maszynie tego samego modelu,
    z tym samym zestawem sterowników i tym samym oprogramowaniem
    pracującym w jądrze. Sprawdzenie na innej maszynie nie odpowiada na
    zadane pytanie, bo pytanie brzmi o konkretne sterowniki tej maszyny.

    Producent systemu udostępnia tryb, w którym mechanizm nie blokuje,
    tylko zapisuje, co by zablokował. Na serwerze produkcyjnym jest to
    właściwy pierwszy krok i wprost zalecam wykonanie go przed samą
    zmianą: kilka dni w trybie zapisu daje listę sterowników, które
    trzeba wymienić albo uaktualnić, i robi to bez ryzyka.

    Zmiana wiąże się po restarcie i cofa się po kolejnym, ale przy
    maszynie, która nie wstała, cofnięcie wykonuje się z konsoli albo ze
    środowiska naprawczego — a nie z sesji zdalnej, bo tej nie będzie.
  en: |
    I keep the class "needs a planned rollout" and say outright that this
    is the most dangerous item in the group, and probably the most
    dangerous in the whole pack so far. Not because it breaks something,
    but because what it may break prevents the machine from starting.

    The mechanism refuses to load a driver that does not meet the
    requirements. On a workstation the refusal usually touches a printer
    driver and shows itself as an inability to print. On a server the same
    mechanism may refuse the disk controller driver, a host bus adapter,
    or a filesystem filter belonging to a backup agent. A refusal of the
    driver through which the machine sees its own disk means a machine
    that does not start.

    So the order at this item differs from all the rest. Neither a preview
    of the effects nor a service window is enough. The right way is a test
    on a machine of the same model, with the same set of drivers and the
    same kernel-mode software. A test on another machine does not answer
    the question being asked, because the question is about this machine's
    specific drivers.

    The system vendor provides a mode in which the mechanism does not
    block but records what it would have blocked. On a server in
    production that is the right first step, and I recommend outright that
    it be taken before the change itself: a few days in audit mode gives
    the list of drivers that need replacing or updating, and gives it
    without risk.

    The change binds after a restart and is undone after another one, but
    at a machine that did not come up the rollback is done from the
    console or from the recovery environment - not from a remote session,
    because there is none.
implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - virtualization-and-containers
    - printing
  what_breaks:
    pl:
      - Sterownik niespełniający wymagań nie zostaje załadowany, a na serwerze bywa to sterownik kontrolera dyskowego
      - Odmowa sterownikowi, przez który maszyna widzi swój dysk, znaczy maszynę, która się nie uruchamia
      - Filtry systemu plików agentów kopii zapasowych i ochrony przestają się ładować, jeżeli nie spełniają wymagań
      - Sprawdzenie na innej maszynie nie odpowiada na zadane pytanie, bo pytanie dotyczy sterowników tej maszyny
      - Przy maszynie, która nie wstała, cofnięcie wykonuje się z konsoli albo ze środowiska naprawczego, nie z sesji zdalnej
    en:
      - A driver that does not meet the requirements is not loaded, and on a server that is sometimes the disk controller driver
      - A refusal of the driver through which the machine sees its own disk means a machine that does not start
      - Filesystem filters belonging to backup and security agents stop loading if they do not meet the requirements
      - A test on another machine does not answer the question being asked, because the question is about this machine's drivers
      - At a machine that did not come up the rollback is done from the console or recovery environment, not from a remote session
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sprawdzono maszyny tego samego modelu z tym samym zestawem sterowników i oprogramowaniem pracującym w jądrze
      - Nie uruchomiono wcześniej trybu, w którym mechanizm tylko zapisuje, co by zablokował
      - Nie ma dostępu do konsoli maszyny ani do środowiska naprawczego na wypadek, gdyby po restarcie nie wstała
    en:
      - No machine of the same model with the same set of drivers and kernel-mode software has been tested
      - The mode in which the mechanism only records what it would have blocked was not run beforehand
      - There is no access to the machine console or to the recovery environment in case it does not come up
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
      $name = 'Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
    $name = 'Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The most dangerous item in this group. A driver that fails the check is
    # not loaded - on a server that can be the storage controller, and then the
    # machine does not boot. Run the audit-only mode for a few days first and
    # test on a machine of the same model with the same drivers.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Enabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Najgroźniejszy punkt w tej grupie i prawdopodobnie w całej paczce —
    nie dlatego, że coś psuje, tylko dlatego, że to, co może zepsuć,
    uniemożliwia start maszyny.

    Na stacji roboczej odmowa dotyczy sterownika drukarki. Na serwerze
    może dotyczyć kontrolera dyskowego, karty magistrali pamięci masowej
    albo filtru systemu plików agenta kopii zapasowych.

    Kolejność inna niż przy pozostałych punktach: nie wystarczy podgląd
    skutków ani okno serwisowe. Najpierw kilka dni w trybie, w którym
    mechanizm tylko zapisuje, co by zablokował, potem sprawdzenie na
    maszynie tego samego modelu z tym samym zestawem sterowników. Przy
    maszynie, która nie wstała, cofnięcie idzie z konsoli, nie z sesji
    zdalnej.
  en: |
    The most dangerous item in the group and probably in the whole pack -
    not because it breaks something, but because what it may break
    prevents the machine from starting.

    On a workstation the refusal touches a printer driver. On a server it
    may touch the disk controller, a host bus adapter, or the filesystem
    filter of a backup agent.

    An order different from the rest: neither a preview of the effects nor
    a service window is enough. First a few days in the mode where the
    mechanism only records what it would have blocked, then a test on a
    machine of the same model with the same set of drivers. At a machine
    that did not come up the rollback goes from the console, not from a
    remote session.
