id: win10-special-admin-console-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konsoli ratunkowej dostępnej poza systemem wyłączona
    en: The service of the console of rescue reachable outside the system switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę udostępniającą konsolę ratunkową — wiersz
    poleceń dostępny przez łącze szeregowe, pomyślany na wypadek, gdy
    maszyna przestaje odpowiadać normalną drogą.

    Zastrzeżenie wynika wprost z przeznaczenia. Konsola ta ma działać
    wtedy, gdy nic innego nie działa, więc jest celowo odcięta od
    zwykłych mechanizmów: nie wymaga zalogowania w normalnym rozumieniu
    i nie przechodzi przez warstwę, która pilnuje uprawnień.

    Zagrożenie leży w drodze dostępu. Na maszynie fizycznej jest to port
    szeregowy, ale na maszynie wirtualnej łącze szeregowe bywa wyprowadzone
    do gniazda sieciowego albo pliku na hoście. Kto ma dostęp do hosta,
    ma wtedy wiersz poleceń maszyny z pominięciem jej własnych
    zabezpieczeń.

    Drugim zastrzeżeniem jest ślad. Działania w tej konsoli nie
    zostawiają takiego zapisu jak zwykłe logowanie, więc dostęp bywa
    niewidoczny w dziennikach.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wiersz
    poleceń dostępny poza systemem i poza jego kontrolą uprawnień.
  en: |
    The setting switches off the service giving out the console of rescue - a line of orders to be reached over a
    link in series, thought out against the hour when the machine ceases to answer by the common road.

    The reservation flows straight from its purpose. That console is to work when nothing else works, so it is of
    set purpose cut off from the common mechanisms: it calls for no logging on in the usual sense and passes not
    through the layer that keeps watch over rights.

    The danger lies in the road of reach. Upon a bodily machine it is a door in series, but upon a feigned machine
    the link in series is at times led out to a socket of the network or a file upon the host. Whoever has a reach
    of the host has then the machine's line of orders with its own guards passed by.

    The second reservation is the trace. Doings in that console leave no such writing as common logging on, so the
    reach is at times unseen among the records.

    What an attacker gains while the item goes unmet: a line of orders to be reached outside the system and
    outside its watch over rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czy ktokolwiek
    przewiduje tę konsolę jako drogę ratunkową.

    Miejscem pierwszym są maszyny wirtualne obsługiwane przez konsolę
    hosta. Tam konsola ratunkowa bywa jedyną drogą wejścia, gdy system
    przestaje odpowiadać, a odebranie jej oznacza, że w takiej sytuacji
    zostaje wyłącznie ponowne uruchomienie.

    Miejscem drugim są procedury utrzymaniowe opisane na piśmie
    i odwołujące się do tej konsoli. Trzeba je poprawić razem ze zmianą,
    bo inaczej ktoś sięgnie po nią w najgorszym momencie.

    Odnotowuję, że na stanowisku roboczym konsola ta zwykle nie jest
    uruchomiona i punkt jest bezkosztowy.

    Zastrzegam, że wyłączenie konsoli nie zmienia niczego w zwykłej
    pracy maszyny. Skutek widać dopiero wtedy, gdy coś pójdzie źle.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pracy programów, sieci, logowania, drukowania,
    zdalnego zarządzania zwykłą drogą.
  en: |
    The class is "needs review", and the review touches whether anybody looks to that console as a road of rescue.

    The first place is feigned machines served through the host's console. There the console of rescue is at times
    the one road in when the system ceases to answer, and its taking away means that in such a case there is left
    the setting going anew alone.

    The second place is ways of upkeep set down in writing and calling upon that console. They must be mended
    together with the change, else somebody will reach for it at the worst hour.

    I set down that upon a station of work that console is commonly not set going and the item is without cost.

    I set down that the switching off of the console changes nothing in the machine's common work. The upshot is
    seen only when something goes amiss.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the work of programs, the network, logging on, printing, or the ordering from afar
    by the common road.

implementation_consequences:
  impact_areas:
    - remote-management
    - boot-and-firmware
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie wirtualnej zniknie droga wejścia używana wtedy, gdy system przestaje odpowiadać
      - W takiej sytuacji zostaje wyłącznie ponowne uruchomienie maszyny
      - Procedury utrzymaniowe odwołujące się do tej konsoli trzeba poprawić razem ze zmianą
      - Skutek nie jest widoczny w zwykłej pracy i ujawnia się dopiero wtedy, gdy coś pójdzie źle
      - Praca programów, sieć, logowanie, drukowanie i zdalne zarządzanie zwykłą drogą pozostają bez zmian
    en:
      - Upon a feigned machine there will go the road in used when the system ceases to answer
      - In such a case there is left the setting going anew of the machine alone
      - Ways of upkeep calling upon that console must be mended together with the change
      - The upshot is unseen in the common work and comes to light only when something goes amiss
      - The work of programs, the network, logging on, printing and the ordering from afar by the common road stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna wirtualna obsługiwana jest przez konsolę hosta i to jest przewidziana droga ratunkowa
    en:
      - The feigned machine is served through the host s console and that is the road of rescue looked to
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'sacsvr' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'sacsvr' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'sacsvr' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/sac

notes:
  pl: |
    Reguła dotyczy mechanizmu, który na stanowisku roboczym prawie nigdy
    nie jest potrzebny, a na maszynie wirtualnej bywa jedyną drogą
    ratunkową. Warto, żeby aplikacja rozdzieliła te dwa przypadki
    wprost, bo decyzja jest w nich zupełnie inna.

    Argument wart postawienia dotyczy tego, gdzie kończy się łącze
    szeregowe. Na maszynie wirtualnej bywa wyprowadzone do gniazda
    sieciowego albo pliku na hoście, więc dostęp do hosta daje wiersz
    poleceń maszyny z pominięciem jej zabezpieczeń.

    Odnotowuję brak śladu jako drugie zastrzeżenie. Działania w tej
    konsoli nie zostawiają zapisu porównywalnego ze zwykłym logowaniem.
  en: |
    The rule touches a mechanism that upon a station of work is next to never needed, and upon a feigned machine
    is at times the one road of rescue. It is well that the application part those two cases outright, the
    decision in them being wholly other.

    The argument worth putting touches where the link in series ends. Upon a feigned machine it is at times led
    out to a socket of the network or a file upon the host, so a reach of the host gives the machine's line of
    orders with its guards passed by.

    I set down the want of a trace as the second reservation. Doings in that console leave no writing to match
    common logging on.
