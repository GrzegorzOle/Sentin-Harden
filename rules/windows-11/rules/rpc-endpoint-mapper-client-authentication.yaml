id: win11-rpc-endpoint-mapper-client-authentication

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Procedure Call
  title:
    pl: Uwierzytelnianie klienta wobec mapera punktów końcowych wymagane
    en: Client authentication towards the endpoint mapper required
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza, żeby maszyna uwierzytelniała się przy odpytywaniu
    mapera punktów końcowych na serwerze zdalnym.

    Maper punktów końcowych jest książką telefoniczną zdalnych wywołań.
    Zanim klient połączy się z usługą, pyta maper: „pod którym portem
    odpowiada ta usługa?". Dopiero potem następuje połączenie właściwe —
    i to ono bywa uwierzytelnione, podczas gdy samo zapytanie o adres
    zwykle nie jest.

    Rzecz w tym, co można zrobić z odpowiedzią na nieuwierzytelnione
    zapytanie. Skoro pytający nie musi się wykazać, maper odpowiada każdemu,
    a odpowiedź to spis usług wystawionych przez maszynę wraz z portami.
    W drugą stronę działa to jeszcze gorzej: klient, który nie uwierzytelnia
    swojego rozmówcy, przyjmie odpowiedź od dowolnej maszyny podszywającej
    się pod maper i zostanie skierowany tam, gdzie zechce podszywający.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozpoznanie
    usług na maszynach w sieci bez żadnego konta, a w wariancie czynnym —
    możliwość skierowania połączenia zdalnego wywołania pod własny adres
    i odebrania uwierzytelnienia, które klient przedstawi już w połączeniu
    właściwym.

    Punkt jest w benchmarku na poziomie drugim i nie bez powodu: chroni
    przed rozpoznaniem i przekierowaniem, a nie przed przejęciem wprost,
    a przy tym bywa zauważalny w eksploatacji.
  en: |
    The setting forces the machine to authenticate when questioning the endpoint mapper on
    a remote server.

    The endpoint mapper is the telephone book of remote calls. Before a client connects to
    a service it asks the mapper: "at which port does this service answer?". Only then
    comes the connection proper - and it is that one which is sometimes authenticated,
    while the question about the address usually is not.

    The thing is what can be done with the answer to an unauthenticated question. Since the
    asker need not show itself, the mapper answers everyone, and the answer is a list of
    the services the machine offers along with their ports. The other way round it works
    worse still: a client that does not authenticate the one it speaks with will take an
    answer from any machine passing itself off as the mapper, and will be directed where
    the impostor wishes.

    What an attacker gains while the item goes unmet: reconnaissance of the services on
    machines in the network with no account at all, and in the active variant the means of
    directing a remote call connection to their own address and taking the authentication
    the client will present in the connection proper.

    The item stands at the second level in the benchmark, and not without reason: it guards
    against reconnaissance and redirection rather than against outright seizure, and at
    that it is sometimes noticeable in running.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to dlatego, że dotyka mechanizmu, na którym
    stoi komunikacja wielu składników systemu, a skutki ujawniają się
    nierównomiernie.

    Sprawdzenia wymagają przede wszystkim rozmówcy spoza domeny. Połączenie
    uwierzytelnione wymaga, żeby obie strony potrafiły się wykazać wspólnym
    mechanizmem. Serwery poza domeną, urządzenia z własnym systemem,
    rozwiązania kopii zapasowych, oprogramowanie do zarządzania sprzętem
    i starsze systemy wbudowane potrafią przestać odpowiadać.

    Objaw bywa mylący, bo nie wygląda na problem uwierzytelnienia. Aplikacja
    zgłasza, że nie może połączyć się z usługą, albo zawiesza się na
    oczekiwaniu — i dopiero dziennik pokazuje, że nie udało się odpytać
    mapera.

    Zmiana wymaga restartu maszyny. Wycofanie także zaczyna obowiązywać
    dopiero po restarcie, więc powrót do stanu sprzed zmiany nie jest
    natychmiastowy — i to jest główny powód, dla którego reguła nie nadaje
    się do trybu zbiorczego.

    Warto ją wdrażać na pojedynczej maszynie i obserwować przez kilka dni
    pracy, zanim obejmie się nią więcej stanowisk.
  en: |
    A knowing rollout is needed because it touches a mechanism on which the communication of
    many of the system's components stands, and the effects show themselves unevenly.

    What needs checking above all are the parties outside the domain. An authenticated
    connection takes both sides being able to show themselves by a shared mechanism.
    Servers outside the domain, devices with their own system, backup solutions, hardware
    management software and older embedded systems can stop answering.

    The symptom is sometimes misleading, since it does not look like a trouble of
    authentication. An application reports that it cannot connect to a service, or hangs
    waiting - and only the log shows that questioning the mapper failed.

    The change takes a restart of the machine. The rollback too binds only after a restart,
    so the return to the state before the change is not immediate - and that is the chief
    reason the rule does not suit the bulk mode.

    It is worth applying at a single machine and watching over some days of work before
    more stations are taken in.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Połączenia zdalnego wywołania do serwerów spoza domeny mogą przestać się nawiązywać
      - Oprogramowanie do zarządzania sprzętem i kopii zapasowych bywa pierwsze, które przestaje odpowiadać
      - Objaw wygląda na niedostępność usługi, a nie na odmowę uwierzytelnienia
      - Wycofanie zmiany zaczyna obowiązywać dopiero po restarcie maszyny
    en:
      - Remote call connections to servers outside the domain may stop being made
      - Hardware management and backup software is sometimes the first to stop answering
      - The symptom looks like an unavailable service rather than a refused authentication
      - Rolling the change back binds only after a restart of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna łączy się z usługami na serwerach spoza domeny albo na urządzeniach z własnym systemem
      - W sieci pracują systemy wbudowane nieobsługujące uwierzytelnienia przy odpytywaniu mapera
    en:
      - The machine connects to services on servers outside the domain or on devices with their own system
      - Embedded systems not supporting authentication when questioning the mapper work on the network
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The key spells the last element as Rpc, not RPC as in the printing rules.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableAuthEpResolution'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    $current = (Get-ItemProperty -Path $path -Name 'EnableAuthEpResolution' -ErrorAction SilentlyContinue).'EnableAuthEpResolution'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableAuthEpResolution'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableAuthEpResolution' -Value 1 -Type DWord
    # The setting binds after a restart of the machine.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    # The former state returns after a restart of the machine.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/the-endpoint-mapper

notes:
  pl: |
    Ostatni człon klucza zapisany jest trzema literami z jedną wielką, a nie
    wielkimi literami jak w kluczu podsystemu druku. Rejestr nie rozróżnia
    wielkości liter, ale przy porównywaniu ścieżek w dokumentacji różnica
    bywa myląca.

    Reguła dotyczy tej maszyny jako klienta, czyli jej zapytań kierowanych na
    zewnątrz. Odpowiadanie na zapytania cudze sterowane jest osobnym
    ustawieniem, ograniczającym klientów zdalnych.

    Poziom drugi w benchmarku i klasa wymagająca świadomego wdrożenia idą tu
    w parze, ale z różnych powodów: poziom bierze się z tego, ile reguła
    wnosi, klasa — z tego, ile kosztuje wycofanie. Wycofanie po restarcie
    jest tutaj czynnikiem rozstrzygającym.

    Brak wartości nie jest stanem zgodnym, bo domyślnie zapytanie idzie bez
    uwierzytelnienia.
  en: |
    The key's last element is written in three letters with one capital rather than in
    capitals as in the printing subsystem's key. The registry does not tell case apart, but
    when paths are compared in documentation the difference is sometimes misleading.

    The rule concerns this machine as a client, that is, its questions directed outward.
    Answering others' questions is steered by a separate setting limiting remote clients.

    The second level in the benchmark and the class taking a knowing rollout go together
    here, but for different reasons: the level comes from how much the rule brings, the
    class from how much the rollback costs. A rollback after a restart is the deciding
    factor here.

    A missing value is not a compliant state, since by default the question goes with no
    authentication.
