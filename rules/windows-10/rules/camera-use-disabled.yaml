id: win10-camera-use-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Camera
  title:
    pl: Korzystanie z kamery zablokowane
    en: Use of the camera blocked
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Kamera jest jedynym urządzeniem w maszynie, które rejestruje to, co dzieje się
    w pomieszczeniu. Program, który raz uzyska do niej dostęp, korzysta z niej bez
    dalszego pytania.

    Znaczenie tego punktu zależy od miejsca, w którym maszyna stoi. Na stanowisku
    w otwartej przestrzeni biurowej kamera pokazuje ludzi przy sąsiednich biurkach.
    W pomieszczeniu, gdzie omawia się sprawy poufne, rejestruje tablicę i dokumenty
    leżące na stole. Dioda sygnalizacyjna jest sterowana sterownikiem, więc nie
    jest dowodem na to, że kamera nie pracuje.

    Zablokowanie kamery na poziomie zasad odbiera dostęp wszystkim programom naraz,
    niezależnie od uprawnień przyznanych wcześniej.
  en: |
    The camera is the one device in the machine that records what happens in the
    room. A program that once gains access to it uses it without asking further.

    The weight of this item depends on where the machine stands. At a station in an
    open-plan office the camera shows the people at the neighbouring desks. In a
    room where confidential matters are discussed it records the board and the
    documents lying on the table. The indicator light is governed by the driver, so
    it is no proof that the camera is not working.

    Blocking the camera at the policy level takes access away from every program at
    once, whatever permissions were granted earlier.

disruption_description:
  pl: |
    To jest zmiana wymagająca świadomego wdrożenia, bo odcina spotkania
    wideo — a te są dziś dla części ludzi podstawową formą kontaktu.

    Wdrożenie ma sens na stanowiskach o określonej roli: maszyny w pomieszczeniach
    o podwyższonych wymaganiach, stanowiska produkcyjne, sprzęt w miejscu
    publicznym. Na zwykłym stanowisku biurowym koszt przewyższa zysk i punkt jest
    kandydatem do świadomego odpuszczenia.

    Osobno trzeba pamiętać o logowaniu twarzą. Tam, gdzie jest ono podstawową drogą
    logowania, zablokowanie kamery zmusza ludzi do powrotu do hasła — więc hasło
    musi być znane i sprawne, zanim zmiana wejdzie.
  en: |
    This is a change calling for a planned rollout, since it cuts off video
    meetings - and for some people those are today the main form of contact.

    The rollout makes sense on stations with a defined role - machines in rooms of
    raised requirements, production stations, hardware in a public place. On an
    ordinary office station the cost outweighs the gain and the item is a candidate
    for being deliberately let go.

    Signing in by face needs separate thought. Where it is the main road to signing
    in, blocking the camera forces people back to a password - so the password has
    to be known and working before the change goes in.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Spotkania wideo przestaną działać we wszystkich aplikacjach naraz, niezależnie od przyznanych wcześniej uprawnień
      - Logowanie twarzą przestanie być możliwe, a użytkownik będzie musiał wrócić do hasła albo kodu
      - Skanowanie dokumentów i kodów kreskowych kamerą przestanie działać
      - Objaw wygląda jak awaria sprzętu, bo kamera znika z listy urządzeń dostępnych aplikacjom
      - Mikrofon, dźwięk w spotkaniach, udostępnianie ekranu i praca użytkownika pozostają bez zmian
    en:
      - Video meetings stop working in every application at once, whatever permissions were granted earlier
      - Signing in by face stops being possible and the user has to fall back to a password or a code
      - Scanning documents and barcodes with the camera stops working
      - The symptom looks like a hardware fault, since the camera vanishes from the list of devices available to applications
      - The microphone, sound in meetings, screen sharing and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska, na których spotkania wideo są podstawową formą kontaktu z klientem albo zespołem
      - Maszyny z logowaniem twarzą jako główną drogą logowania, dopóki hasło nie zostanie sprawdzone
      - Stanowiska skanujące dokumenty albo kody kreskowe kamerą
    en:
      - Stations where video meetings are the main form of contact with a client or a team
      - Machines with face sign-in as the main road in, until the password has been checked
      - Stations scanning documents or barcodes with the camera
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowCamera'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    $name = 'AllowCamera'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCamera' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-camera

notes:
  pl: |
    Zasada działa ponad uprawnieniami przyznanymi poszczególnym aplikacjom i
    odbiera dostęp wszystkim naraz. Punkt jest poziomu drugiego i ma sens na
    stanowiskach o określonej roli, a nie na całym zestawie maszyn biurowych.
  en: |
    The rule works above the permissions granted to individual applications and
    takes access away from all of them at once. The item is of the second level and
    makes sense on stations with a defined role rather than across a whole set of
    office machines.
