id: fedora44-shadowed-passwords

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 7.2.1
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Konta w /etc/passwd korzystają z haseł w /etc/shadow
    en: Ensure accounts in /etc/passwd use shadowed passwords
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    /etc/passwd musi być czytelny dla każdego programu. Skrót hasła zapisany
    w drugim polu tego pliku zamiast w /etc/shadow może więc przeczytać
    każdy użytkownik i łamać go poza systemem.

    Punkt wymaga, żeby każde konto miało w drugim polu /etc/passwd znak x,
    czyli żeby jego hasło było przechowywane w /etc/shadow.
  en: |
    /etc/passwd must be readable by every program. A password hash stored
    in the second field of this file instead of /etc/shadow can therefore
    be read by any user and cracked offline.

    The item requires every account to have x in the second field of
    /etc/passwd, so that its password is kept in /etc/shadow.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/passwd.
  en: |
    Nobody will notice: the check only reads /etc/passwd.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd"; exit 0; }
    o=$(awk -F: '$2 != "x" { printf "%s%s", s, $1; s = "," }' /etc/passwd)
    if [ -n "$o" ]; then echo "NOT_OK:$o"; else echo "OK:all-shadowed"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/passwd.5.html
  - https://man7.org/linux/man-pages/man5/shadow.5.html
  - https://man7.org/linux/man-pages/man8/pwconv.8.html
  - https://man7.org/linux/man-pages/man8/pwck.8.html

notes:
  pl: |
    Wynik NOT_OK podaje nazwy kont, które nie mają x w polu hasła. Poprawia
    się je poleceniem pwconv, które przenosi skróty do /etc/shadow, a potem
    sprawdza spójność plików poleceniem pwck -r. Test czyta tylko
    /etc/passwd, więc działa także bez roota. Reguła tylko sprawdza stan.
  en: |
    The NOT_OK result gives the names of the accounts without x in the
    password field. They are fixed with pwconv, which moves the hashes to
    /etc/shadow, and the files are then checked with pwck -r. The test only
    reads /etc/passwd, so it also works without root. The rule only checks
    the state.
