description:
  pl: |
    Mechanizm przenosi poświadczenia używane przez system do obszaru
    odgrodzonego przez nadzorcę wirtualizacji. Proces logowania działa
    dalej tak samo, ale to, czym płaci za dostęp, przestaje być dostępne
    z poziomu systemu — nawet dla kodu mającego najwyższe uprawnienia.

    Podnoszę kategorię do krytycznej wobec oceny dla stacji roboczej
    i jest to ta sama decyzja, którą podjąłem przy blokadzie kradzieży
    poświadczeń z procesu logowania. Powód też jest ten sam, a tu jeszcze
    mocniejszy. W pamięci serwera leżą poświadczenia, których na stacji
    roboczej nie ma: konta usług mające uprawnienia na wielu maszynach,
    konta zadań łączących się do baz i udziałów, oraz — przede wszystkim
    — poświadczenia administratora, który właśnie się zalogował, żeby coś
    naprawić.

    Ten ostatni przypadek jest sednem. Maszyna, na którą administrator
    właśnie wszedł z pełnymi prawami, jest w tej chwili najcenniejszym
    celem w sieci, a napastnik, który już na niej siedzi, czeka dokładnie
    na to wejście. Mechanizm odbiera mu żniwo.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    poświadczeń wszystkiego, co przez ten serwer przechodzi, w zamian za
    jedno uprawnienie administracyjne na jednej maszynie.
  en: |
    The working bears the tokens of leave the system uses into a reach fenced off by the overseer of
    virtualisation. The process of signing in works on the same, but what it pays for reach with
    stops being come-at-able from within the system - even for code of the highest rights.

    I raise the category to critical against the reckoning for a workstation, and it is the same
    deciding I made at the blocking of the stealing of tokens of leave out of the process of signing
    in. The ground is the same too, and here stronger still. In a server's memory lie tokens of
    leave a workstation has not - the accounts of services holding rights on many machines, the
    accounts of tasks binding to bases and shares, and above all the tokens of leave of the
    administrator who has just signed in to mend something.

    That last case is the heart of it. The machine an administrator has just come onto with full
    rights is at that moment the worthiest target in the net, and an attacker already sitting upon
    it waits for just that coming. The working takes their harvest away.

    What an attacker gains while the item goes unmet - reach to the tokens of leave of all that
    passes through that server, in return for one right of an administrator on one machine.

disruption_description:
  pl: |
    Jest to zmiana najgłębsza z dotychczasowych w tej paczce i dotyka
    warstwy, na której system stoi. Wymienię po kolei, co trzeba
    sprawdzić, bo każda z tych rzeczy potrafi osobno zatrzymać wdrożenie.

    Po pierwsze, wirtualizacja. Mechanizm opiera się na nadzorcy
    wirtualizacji, więc włączenie go na serwerze pełniącym rolę hosta
    maszyn wirtualnych wchodzi wprost w drogę tej roli. Gość
    wymagający wirtualizacji zagnieżdżonej może przestać się uruchamiać,
    a na starszym sprzęcie strata wydajności bywa odczuwalna dla
    wszystkich gości naraz. Na hoście wirtualizacji to nie jest zmiana
    do zrobienia bez próby na maszynie bliźniaczej.

    Po drugie, sterowniki. Odgrodzenie wymusza ostrzejsze wymagania na
    sterowniki jądra. Na serwerze pochodzą one od producenta sprzętu:
    kontroler macierzy, karta sieciowa o dużej przepustowości, agent
    monitorowania. Sterownik odrzucony przy rozruchu daje objaw opisany
    przy zasadzie ładowania sterowników rozruchowych — maszyna, która
    się nie podniosła.

    Po trzecie, uwierzytelnianie starszym mechanizmem. Po włączeniu
    przestają działać sposoby logowania oddające hasło w postaci
    umożliwiającej jego dalsze użycie. Na serwerze bywają one ukryte
    w miejscach, o których nikt nie pamięta: w połączeniach do starego
    systemu dziedziczonego, w skrypcie przechodzącym na kolejną maszynę,
    w narzędziu do kopii zapasowych sprzed lat.

    Po czwarte, powrót. Włączenie z blokadą w oprogramowaniu układowym
    zostawia stan, z którego nie wraca się poleceniem — i dlatego ten
    punkt nie ma przycisku „Uruchom".

    Restart jest wymagany, a na serwerze restart jest zdarzeniem
    planowanym.
  en: |
    It is the deepest change hitherto in this pack and it touches the layer the system stands upon.
    I shall name one by one what must be checked, every one of those things being able by itself to
    stop a rolling out.

    First, virtualisation. The working rests upon the overseer of virtualisation, so its switching
    on upon a server bearing the role of a host of machines made by reckoning goes straight athwart
    that role. A guest taking a nested virtualisation may stop running, and on older gear the loss
    of doing can be marked by all the guests at once. On a host of virtualisation this is no change
    to be made without a trial on a twin machine.

    Second, the drivers. The fencing off forces sharper bonds upon the drivers of the kernel. On a
    server they come of the maker of the gear - the warder of the array, a card of the net of great
    throughput, an agent of watching. A driver cast off at the raising up gives the symptom set
    forth at the policy of the loading of drivers of the raising up - a machine that did not come
    up.

    Third, the proving of self by an older working. After the switching on, those ways of signing in
    stop working that hand over the password in a shape that lets it be used further. On a server
    they are at times hidden in places nobody remembers - in bindings to an old inherited system, in
    a script passing on to the next machine, in a tool for keepings of copies from years back.

    Fourth, the way back. The switching on with a lock in the software of the frame leaves a state
    that is not come back from by a command - and therefore this item has no button "Run".

    A restart is taken, and on a server a restart is a planned happening.

