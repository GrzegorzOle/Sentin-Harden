id: ubuntu2404-gdm-automount-locked

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.7.7
  section: Initial Setup > Configure GNOME Display Manager
  title:
    pl: Użytkownik nie może włączyć automatycznego montowania nośników
    en: Ensure GDM disabling automatic mounting of removable media is not overridden
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Wyłączenie automatycznego montowania z punktu 1.7.6 jest tylko
    ustawieniem domyślnym, które każdy użytkownik może zmienić, np. przez
    dconf-editor albo gsettings. Blokada w dconf sprawia, że obowiązuje
    wartość systemowa.

    Punkt wymaga zablokowania kluczy automount i automount-open. Domyślnie
    nie są zablokowane.
  en: |
    Turning off automatic mounting in item 1.7.6 is only a default setting
    that every user can change, for example with dconf-editor or gsettings. A
    lock in dconf makes the system value apply.

    The item requires locking the automount and automount-open keys. By
    default they are not locked.

disruption_description:
  pl: |
    Nikt tego nie zauważy poza użytkownikami, którzy sami włączyli
    automatyczne montowanie: ich ustawienie przestanie działać. Zmiana
    działa od następnego zalogowania.
  en: |
    Nobody will notice except users who turned automatic mounting on
    themselves: their setting stops working. The change takes effect from the
    next sign-in.

implementation_consequences:
  impact_areas:
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Użytkownicy nie mogą sami włączyć automatycznego montowania nośników
    en:
      - Users cannot turn on automatic mounting of media themselves
  interruption: logoff
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if [ ! -x /usr/sbin/gdm3 ]; then echo GDM_ABSENT; exit 0; fi
    if ! command -v gsettings >/dev/null 2>&1; then echo GDM_ABSENT; exit 0; fi
    d=$(mktemp -d) || { echo CHECK_ERROR; exit 0; }
    trap 'rm -rf "$d"' EXIT
    g() { env -i PATH=/usr/bin:/bin HOME="$d" XDG_CONFIG_HOME="$d" XDG_RUNTIME_DIR="$d" GSETTINGS_BACKEND=dconf gsettings "$@" 2>/dev/null; }
    if ! g list-schemas | grep -qx org.gnome.login-screen; then echo GDM_ABSENT; exit 0; fi
    state() {
      n=""
      for sk in "org.gnome.desktop.media-handling automount" "org.gnome.desktop.media-handling automount-open"; do
        w=$(g writable $sk) || { echo CHECK_ERROR; return; }
        if [ "$w" != false ]; then n="$n,${sk#* }"; fi
      done
      if [ -z "$n" ]; then echo LOCKED; else echo "NOT_LOCKED:${n#,}"; fi
    }
    state
  expected: '^(LOCKED|GDM_ABSENT)$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/locks/sentin-harden-automount
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=dconf-1
        m=""
        p=$(dirname "$f")
        while [ "$p" != /etc/dconf/db ]; do
          if [ ! -d "$p" ]; then m="$m $p"; fi
          p=$(dirname "$p")
        done
        echo "missing=${m# }"
        if [ -e /etc/dconf/db/local ]; then echo db=1; else echo db=0; fi
        if [ -f "$f" ]; then echo file=1; else echo file=0; fi
        echo ---
        if [ -f "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/locks/sentin-harden-automount
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      d=$(mktemp -d) || exit 1
      trap 'rm -rf "$d"' EXIT
      g() { env -i PATH=/usr/bin:/bin HOME="$d" XDG_CONFIG_HOME="$d" XDG_RUNTIME_DIR="$d" GSETTINGS_BACKEND=dconf gsettings "$@" 2>/dev/null; }
      if ! command -v gsettings >/dev/null 2>&1 || ! g list-schemas | grep -qx org.gnome.login-screen; then
        echo "GDM is not installed, nothing to change"; exit 0
      fi
      if [ ! -d "$D" ] && [ -e /etc/dconf/db/local ]; then
        echo "/etc/dconf/db/local is not built from keyfiles in $D, not changing it" >&2; exit 1
      fi
      # Without system-db:local in the profile the keyfile has no effect.
      P=/etc/dconf/profile/user
      if [ -e "$P" ]; then
        if ! grep -Eq '^[[:space:]]*system-db:local[[:space:]]*$' "$P"; then
          echo "$P does not read the local database (system-db:local); add it by hand. Nothing changed" >&2; exit 1
        fi
      else
        base=$(echo user-db:user) || { echo "Could not read the default user profile" >&2; exit 1; }
        mkdir -p /etc/dconf/profile
        {
          echo '# Sentin-Harden: reads /etc/dconf/db/local; removed with the last keyfile there'
          printf '%s\n' "$base" | awk '!d && NF && !/^[[:space:]]*user-db:/ { print "system-db:local"; d = 1 } NF { print } END { if (!d) print "system-db:local" }'
        } > "$P.tmp"
        chmod 0644 "$P.tmp"
        mv -f "$P.tmp" "$P"
      fi
      state() {
        n=""
        for sk in "org.gnome.desktop.media-handling automount" "org.gnome.desktop.media-handling automount-open"; do
          w=$(g writable $sk) || { echo CHECK_ERROR; return; }
          if [ "$w" != false ]; then n="$n,${sk#* }"; fi
        done
        if [ -z "$n" ]; then echo LOCKED; else echo "NOT_LOCKED:${n#,}"; fi
      }
      body() {
        printf '%s\n' '/org/gnome/desktop/media-handling/automount' '/org/gnome/desktop/media-handling/automount-open'
      }
      mkdir -p "$(dirname "$f")"
      tmp=$(mktemp "$f.XXXXXX")
      { echo '# Sentin-Harden: ubuntu2404-gdm-automount-locked'; body; } > "$tmp"
      chmod 0644 "$tmp"
      mv -f "$tmp" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      dconf update
      s=$(state)
      if ! printf '%s\n' "$s" | grep -Eq '^(LOCKED)$'; then
        echo "The setting is still not in effect ($s): another dconf database or file overrides it" >&2; exit 1
      fi
      echo "Wrote $f and updated the dconf databases ($s)"
    )

  rollback_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/locks/sentin-harden-automount
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=dconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      m=$(sed -n '2s/^missing=//p' "$b")
      db=$(sed -n '3s/^db=//p' "$b")
      fl=$(sed -n '4s/^file=//p' "$b")
      case "$db$fl" in [01][01]) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ "$fl" = 1 ]; then
        tmp=$(mktemp "$f.XXXXXX")
        sed '1,/^---$/d' "$b" > "$tmp"
        chmod 0644 "$tmp"
        mv -f "$tmp" "$f"
        if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      else
        rm -f "$f"
      fi
      for p in $m; do rmdir "$p" 2>/dev/null || true; done
      if command -v dconf >/dev/null 2>&1; then dconf update; fi
      if [ "$db" = 0 ] && [ ! -d "$D" ]; then rm -f /etc/dconf/db/local; fi
      # The profile we created goes once no keyfile in local.d needs it.
      P=/etc/dconf/profile/user
      if [ -f "$P" ] && head -n 1 "$P" | grep -q '^# Sentin-Harden:' &&
         [ -z "$(find /etc/dconf/db/local.d -type f 2>/dev/null | head -n 1)" ]; then
        rm -f "$P"
        rmdir /etc/dconf/profile 2>/dev/null || true
      fi
      echo "Restored the previous state of $f and updated the dconf databases"
    )

privileges: root
runnable: true

sources:
  - https://help.gnome.org/admin/system-admin-guide/stable/dconf-lockdown.html.en
  - https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/blob/master/schemas/org.gnome.desktop.media-handling.gschema.xml.in

notes:
  pl: |
    Blokada obejmuje klucze automount, automount-open. Zablokowany klucz ma wartość z baz
    systemowych albo, jeśli żadna jej nie ustawia, wartość domyślną ze
    schematu. Własne ustawienia użytkowników przestają działać i wracają, gdy
    blokada zostanie zdjęta.

    Sprawdzenie pyta gsettings writable, czy użytkownik sesji może zmienić
    klucz; wynik NOT_LOCKED wymienia klucze bez blokady. Czyta skompilowane bazy, więc plik zapisany w katalogu .d bez
    uruchomienia dconf update nie spełnia punktu. Jeśli GDM nie jest
    zainstalowany, co jest domyślne na Ubuntu Server, wynik GDM_ABSENT
    oznacza, że punkt nie dotyczy systemu.

    Ubuntu nie dostarcza profilu /etc/dconf/profile/user, więc sesje
    użytkowników czytają tylko ich własne ustawienia. Naprawa tworzy ten
    profil z wierszami user-db:user i system-db:local, oznaczony komentarzem
    Sentin-Harden. Jeśli profil już istnieje bez wiersza system-db:local,
    naprawa kończy się błędem bez zmian. Potem zapisuje własny plik /etc/dconf/db/local.d/locks/sentin-harden-automount,
    uruchamia dconf update i sprawdza blokady ponownie; kończy się błędem,
    jeśli któryś klucz nadal można zmienić. Wycofanie przywraca poprzedni stan pliku, uruchamia dconf
    update i usuwa utworzony profil, gdy w /etc/dconf/db/local.d, razem
    z katalogiem locks, nie zostaje już żaden plik.
  en: |
    The lock covers the automount, automount-open keys. A locked key takes its value from the
    system databases or, if none sets it, the default from the schema. Users'
    own settings stop working and come back when the lock is removed.

    The check asks gsettings writable whether a session user can change the
    key; the NOT_LOCKED result lists the keys without a lock. It reads the compiled databases, so a file written to a .d
    directory without running dconf update does not meet the item. If GDM is
    not installed, which is the default on Ubuntu Server, the GDM_ABSENT
    result means the item does not apply to the system.

    Ubuntu ships no /etc/dconf/profile/user profile, so user sessions read
    only their own settings. The remediation creates that profile with the
    user-db:user and system-db:local lines, marked with a Sentin-Harden
    comment. If the profile already exists without the system-db:local line,
    the remediation ends with an error without changes. It then writes its own
    /etc/dconf/db/local.d/locks/sentin-harden-automount file, runs dconf update and checks the locks again; it fails if
    any key can still be changed. Rollback restores the previous state of the file, runs dconf
    update and removes the created profile when no file is left in
    /etc/dconf/db/local.d, including its locks directory.
