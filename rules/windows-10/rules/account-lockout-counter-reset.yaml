id: win10-account-lockout-counter-reset

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Czas, po którym licznik nieudanych prób się zeruje
    en: The span after which the counter of failed tries clears
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, po ilu minutach od ostatniej nieudanej próby licznik
    tych prób wraca do zera.

    Jest to trzecia i ostatnia nastawa blokady konta, a zarazem ta, którą
    najłatwiej ustawić tak, że cała konstrukcja przestaje działać. Próg pięciu
    prób znaczy coś dopiero wtedy, gdy próby te muszą się zdarzyć blisko
    siebie w czasie. Przy zerowaniu po minucie napastnik czeka po każdych
    czterech próbach sześćdziesiąt sekund i zgaduje dalej bez końca, nie
    uruchamiając blokady ani razu.

    Zerowanie kwadransowe zamyka tę drogę, bo wymusza cztery próby na
    kwadrans, czyli kilkanaście prób na godzinę. Przy takim tempie zgadywanie
    przestaje mieć sens, a licznik wciąż zeruje się na tyle szybko, że
    pomyłki człowieka rozłożone w ciągu dnia nie sumują się do blokady.

    Reguła ta nie ma sensu bez progu i bez czasu blokady, tak jak one nie mają
    sensu bez niej. Trzy punkty tworzą jedną nastawę opisaną trzema liczbami.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zgadywania hasła bez końca przez rozłożenie prób w czasie tak, by próg
    nie został osiągnięty.
  en: |
    The setting says after how many minutes from the last failed try the counter of those tries returns to
    nought.

    It is the third and last setting of the account lock, and at the same time the one most easily set so that
    the whole structure ceases working. A threshold of five tries means something only where those tries have to
    fall close together in time. At a clearing after a minute an attacker waits sixty seconds after every four
    tries and guesses on without end, never once setting the lock off.

    A quarter-hour clearing closes that road, forcing four tries a quarter of an hour, which is some tens an
    hour. At such a pace guessing ceases to make sense, while the counter still clears quickly enough that a
    person's slips spread over a day do not add up to a lock.

    The rule makes no sense without the threshold and without the lock's span, as they make none without it. The
    three items make one setting described by three numbers.

    What an attacker gains while the item goes unmet: the means of guessing a password without end, by spreading
    the tries in time so that the threshold is never reached.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia niczego, co widzi człowiek. Nie zamyka kont
    wcześniej ani nie trzyma ich zamkniętych dłużej — zmienia wyłącznie to,
    jak długo pamiętana jest próba nieudana.

    Skutek, jeśli w ogóle wystąpi, idzie w stronę większej liczby blokad,
    i to tylko u kogoś, kto myli hasło wielokrotnie w ciągu kwadransa.
    Przy pięciu dopuszczalnych próbach jest to przypadek rzadki.

    Odnotowuję jedno ograniczenie wynikające z samego systemu: wartość
    zerowania nie może przekraczać czasu blokady. Ustawienie obu na kwadrans
    tę zgodność zachowuje i dlatego wartości są tu jednakowe.

    Nie ma znanych regresji.

    Czego to nie psuje: logowania, haseł, kont domenowych, usług systemowych,
    sieci, aplikacji, drukowania, profili.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes nothing a person sees. It shuts no account sooner and holds none shut longer - it
    changes only how long a failed try is remembered.

    The consequence, should any arise at all, goes toward a greater number of locks, and that only for somebody
    mistaking their password several times within a quarter of an hour. At five tries allowed that is a rare
    case.

    I set down one bound following from the system itself: the clearing's value may not pass the lock's span.
    Setting both to a quarter of an hour keeps that agreement, and for that the values here are alike.

    There are no known regressions.

    What this does not break: logging on, passwords, domain accounts, system services, the network,
    applications, printing, or profiles.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoba myląca hasło kilka razy w ciągu kwadransa częściej dochodzi do progu, bo próby nie zerują się między nimi
      - Wartość zerowania nie może przekraczać czasu blokady, więc ustawienie ich rozbieżnie zostaje odrzucone
      - Licznik i tak zeruje się na tyle szybko, że pomyłki rozłożone w ciągu dnia nie sumują się do blokady
      - Logowanie, hasła, konta domenowe oraz praca usług systemowych pozostają bez zmian
      - Praca sieci, aplikacje, drukowanie i profile użytkowników pozostają bez zmian
    en:
      - Somebody mistaking their password several times within a quarter of an hour reaches the threshold oftener, the tries not clearing between
      - The clearings value may not pass the locks span, so setting them at odds gets refused
      - The counter still clears quickly enough that slips spread over a day do not add up to a lock
      - Logging on, passwords, domain accounts and the work of system services stay unchanged
      - The work of the network, applications, printing and users profiles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Czas blokady konta ustawiono krócej niż kwadrans i nie zamierza się go wydłużać, więc wartości byłyby niezgodne
    en:
      - The accounts lock span is set shorter than a quarter of an hour and is not to be lengthened, so the values would disagree
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ResetLockoutCount\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^ResetLockoutCount\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'ResetLockoutCount'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The clearing's value may not pass the lock's span. Where the lock is set
    # shorter than a quarter of an hour, lengthen it first - the entry will
    # otherwise be refused.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ResetLockoutCount = 15',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ResetLockoutCount = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/reset-account-lockout-counter-after

notes:
  pl: |
    Reguła zamyka trójkę blokady konta i jest z nich tą, przy której
    niezgodność najłatwiej przeoczyć. Próg i czas blokady widać w zachowaniu
    maszyny; zerowanie licznika nie objawia się niczym, dopóki ktoś nie
    zacznie zgadywać.

    Warto, żeby aplikacja pokazywała te trzy punkty jako jedną nastawę
    opisaną trzema liczbami, a nie jako trzy zabezpieczenia. Raport, w którym
    próg świeci na zielono, a zerowanie na czerwono, opisuje maszynę bez
    blokady, choć wygląda na opisujący maszynę prawie zgodną.

    Odnotowuję zależność, którą narzuca system: zerowanie nie może być
    dłuższe niż czas blokady. Aplikacja powinna o tym mówić przy symulacji,
    bo próba wykonania samej tej reguły na maszynie z blokadą krótszą
    zakończy się odmową, a komunikat systemowy nie powie, dlaczego.
  en: |
    The rule closes the three about the account lock and is the one of them whose mismatch is most easily
    overlooked. The threshold and the lock's span are seen in the machine's behaviour; the clearing of the
    counter shows itself in nothing until somebody begins guessing.

    It is well that the application show the three items as one setting described by three numbers rather than
    as three safeguards. A report in which the threshold shines green and the clearing red describes a machine
    without a lock, while it looks to describe one nearly compliant.

    I set down the dependence the system lays down: the clearing may not be longer than the lock's span. The
    application ought to say so at the simulation, an attempt at carrying out this rule alone on a machine with
    a shorter lock ending in a refusal whose system message will not say why.
