id: win2025-uac-admin-approval-builtin-account

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora objęte kontrolą uprawnień
    en: The built-in administrator account taken in by the control of rights
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozciąga mechanizm kontroli uprawnień na wbudowane konto
    administratora, które domyślnie jest z niego wyłączone.

    Jest to wyjątek, o którym wie mało kto poza tymi, którzy z niego
    korzystają. Na maszynie z włączoną kontrolą uprawnień wszystkie konta
    administracyjne pracują z uprawnieniami ograniczonymi — wszystkie poza
    tym jednym. Program uruchomiony na koncie wbudowanego administratora
    dostaje uprawnienia pełne natychmiast, bez pytania i bez śladu.

    Na serwerze konto to jest w użyciu częściej, niż przewiduje projekt
    systemu. Bywa kontem, na którym wykonuje się prace wdrożeniowe, kontem
    zapasowym po awarii i kontem, na którym pracował ten, kto maszynę
    stawiał. Jeżeli mechanizm kontroli uprawnień włączono na tej maszynie
    dla bezpieczeństwa, a ten punkt pozostał niespełniony, ochrona omija
    dokładnie to konto, które ma uprawnienia najszersze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne
    uprawnienia bez podnoszenia ich, o ile trafi na sesję tego konta.
    Wszystko, co uruchomi, działa od razu z uprawnieniami systemu —
    a mechanizm, który w raporcie wygląda na włączony, nie zadziała ani
    razu.
  en: |
    The setting stretches the rights-control mechanism over the built-in administrator
    account, which is by default left out of it.

    It is an exception few know of beyond those who make use of it. On a machine with the
    control of rights switched on every administrative account works with bounded rights -
    every one but this. A program started on the built-in administrator's account gets full
    rights at once, without asking and without a trace.

    On a server that account is in use more often than the system's design foresees. It is
    at times the account deployment work is done on, the spare account after a fault, and
    the account whoever set the machine up worked on. If the rights-control mechanism was
    switched on for safety on this machine and this item stayed unmet, the protection goes
    round exactly the account with the widest rights.

    What an attacker gains while the item goes unmet: full rights without raising them, so
    far as they come upon that account's session. Everything they start runs at once with
    the system's rights - and a mechanism that in the report looks switched on will not fire
    once.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że zmiana dotyka konta używanego
    zwykle wtedy, gdy coś już poszło nie tak — a więc w chwili najgorszej
    z możliwych do odkrywania niespodzianek.

    Po zmianie praca na tym koncie wygląda tak samo jak na każdym innym
    koncie administracyjnym: czynności administracyjne wymagają
    potwierdzenia. Przy konsoli jest to koszt kilku sekund.

    Kłopot zaczyna się tam, gdzie konta tego używa się bez udziału
    człowieka. Zadania harmonogramu uruchamiane na tym koncie, skrypty
    wdrożeniowe logujące się na nie zdalnie i procedury awaryjne wywoływane
    automatycznie tracą uprawnienia pełne — i nie mają jak o nie poprosić.
    Zatrzymują się bez komunikatu wskazującego przyczynę.

    Skutek trzeci jest subtelniejszy i wart uwagi: część narzędzi
    zarządzania zdalnego wywołuje czynności administracyjne w sesji
    sieciowej, w której potwierdzenia pokazać nie da się w ogóle. Po zmianie
    czynność taka po prostu się nie uda, choć dokładnie ta sama czynność
    wykonana przy konsoli uda się po kliknięciu.

    Zmiana wymaga restartu systemu.
  en: |
    A knowing rollout is needed because the change touches an account usually used when
    something has already gone wrong - and so at the worst possible moment for discovering
    surprises.

    After the change work on that account looks the same as on any other administrative
    account: administrative doings take a confirmation. At the console that is a cost of a
    few seconds.

    The trouble starts where that account is used without a person's part. Scheduler tasks
    run on it, deployment scripts signing in to it remotely and emergency procedures called
    automatically lose full rights - and have no way of asking for them. They halt with no
    message showing the cause.

    The third effect is subtler and worth notice: some remote management tools call
    administrative doings in a network session in which a confirmation cannot be shown at
    all. After the change such a doing will simply not succeed, though that very same doing
    carried out at the console will succeed after a click.

    The change takes a restart of the system.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
    - updates-and-servicing
  what_breaks:
    pl:
      - Zadania harmonogramu na tym koncie tracą pełne uprawnienia i zatrzymują się
      - Skrypty wdrożeniowe logujące się zdalnie na to konto nie kończą się powodzeniem
      - Czynności administracyjne w sesji sieciowej nie udają się, bo potwierdzenia nie da się pokazać
      - Praca przy konsoli wymaga potwierdzania, tak jak na każdym innym koncie administracyjnym
    en:
      - Scheduler tasks on that account lose full rights and halt
      - Deployment scripts signing in to that account remotely do not end in success
      - Administrative doings in a network session do not succeed, since a confirmation cannot be shown
      - Work at the console takes confirming, as on any other administrative account
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na wbudowanym koncie administratora pracują zadania uruchamiane bez udziału człowieka
      - Procedura awaryjna serwera opiera się na tym koncie i nie została przepisana
    en:
      - Tasks run without a person's part work on the built-in administrator account
      - The server's emergency procedure rests on that account and has not been rewritten
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'FilterAdministratorToken'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'FilterAdministratorToken' -ErrorAction SilentlyContinue).'FilterAdministratorToken'
    [pscustomobject]@{
      path        = $path
      name        = 'FilterAdministratorToken'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FilterAdministratorToken' -Value 1 -Type DWord
    "Takes effect after a restart of the system."

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-admin-approval-mode-for-the-built-in-administrator-account

notes:
  pl: |
    Punkt ma sens wyłącznie przy włączonej kontroli uprawnień. Przy
    wyłączonej opisuje wyjątek od mechanizmu, którego nie ma, i jego wynik
    nie znaczy nic. W raporcie oba punkty należy czytać razem, w tej
    kolejności.

    Konto wbudowanego administratora bywa na serwerze wyłączone — i jest to
    stan lepszy niż spełnienie tego punktu. Reguła sprawdza ustawienie,
    a nie to, czy konto jest czynne, więc punkt spełniony przy koncie
    wyłączonym nie wnosi nic. Warto zestawiać go z punktem o stanie tego
    konta.

    Zmiana obowiązuje dopiero po restarcie i wycofanie także wymaga
    restartu.
  en: |
    The item makes sense only with the control of rights switched on. With it off it
    describes an exception to a mechanism that is not there, and its result means nothing.
    In the report the two items are to be read together, in that order.

    The built-in administrator account is at times switched off on a server - and that is a
    better state than a meeting of this item. The rule checks the setting rather than
    whether the account is live, so the item met with the account switched off brings
    nothing. It is worth setting it beside the item on that account's state.

    The change binds only after a restart and a rollback takes a restart as well.
