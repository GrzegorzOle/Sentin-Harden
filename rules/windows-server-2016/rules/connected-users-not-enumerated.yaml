id: win2016-connected-users-not-enumerated

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Ekran logowania nie wylicza kont połączonych z usługą sieciową
    en: The sign-in screen does not list accounts bound to a network service
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania ekranowi logowania wypisywać konta powiązane
    z usługą sieciową producenta systemu.

    Punkt jest bliźniaczy wobec poprzedniego i dotyczy innej kategorii
    kont. Tamten odnosił się do kont lokalnych maszyny, ten do kont
    powiązanych z tożsamością sieciową.

    Wartość jest taka sama i sprowadza się do jednego: ekran logowania nie
    ma być źródłem informacji dla kogoś, kto jeszcze się nie przedstawił.
    Nazwa konta powiązanego z usługą sieciową niesie przy tym więcej niż
    nazwa konta lokalnego — bywa nią adres poczty, a więc tożsamość
    rozpoznawalna poza tą maszyną i poza tą organizacją.

    Waga tego punktu na serwerze jest niewielka i trzeba to powiedzieć
    wprost. Konta powiązane z usługą sieciową rzadko trafiają na serwer;
    jest to raczej zjawisko stanowiska roboczego. Kategoria niska opisuje
    to uczciwie: punkt porządkuje i domyka, a nie odpiera konkretne
    zagrożenie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tożsamość
    rozpoznawalną poza tą maszyną, widoczną bez logowania — jeżeli takie
    konto na tej maszynie w ogóle jest.
  en: |
    The setting forbids the sign-in screen to write out accounts bound to the system
    maker's network service.

    The item is a twin of the previous one and concerns another kind of account. That
    one bore on the machine's local accounts, this one on accounts bound to a network
    identity.

    The worth is the same and comes down to one thing: the sign-in screen is not to be
    a source of information for somebody who has not yet presented themselves. The
    name of an account bound to a network service carries besides more than a local
    account's name - it is at times an email address, and so an identity recognisable
    beyond this machine and beyond this organisation.

    This item's weight on a server is slight and that has to be said outright.
    Accounts bound to a network service seldom reach a server; it is rather a
    phenomenon of a workstation. The low category states that honestly: the item tidies
    and shuts, rather than turning away a particular threat.

    What an attacker gains while the item goes unmet: an identity recognisable beyond
    this machine, visible without signing in - if such an account is on this machine at
    all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Punkt dotyczy wyłącznie tego, co widać na ekranie logowania. Konta nie
    są usuwane, odłączane ani blokowane — przestają być wypisywane.

    Na serwerze skutek jest zwykle żaden, bo nie ma czego wypisywać.
    Tam, gdzie takie konto jest, zalogowanie się na nie wymaga wpisania
    nazwy ręcznie zamiast wybrania jej z listy.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi.

    Czego to nie psuje: logowania jakimikolwiek kontami, usług, sieci,
    pracy użytkowników. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    The item concerns only what is seen on the sign-in screen. Accounts are not
    removed, unbound or blocked - they stop being written out.

    On a server the consequence is as a rule none, there being nothing to write out.
    Where such an account is, signing in to it calls for the name to be typed by hand
    rather than picked from a list.

    No restart, sign-out or stopping of a service goes with it.

    What this does not break: signing in with any accounts, services, the network, or
    users' work. There are no known regressions.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Konto powiązane z usługą sieciową trzeba wpisać ręcznie zamiast wybrać je z listy
      - Konta nie są usuwane, odłączane ani blokowane - przestają być tylko wypisywane
      - Na serwerze skutek jest zwykle żaden, bo takich kont zwykle tam nie ma
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
    en:
      - An account bound to a network service has to be typed by hand rather than picked from a list
      - Accounts are not removed, unbound or blocked - they only stop being written out
      - On a server the consequence is as a rule none, such accounts as a rule not being there
      - No restart, no sign-out, no stopping of a service
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa maszyny loguje się kontem powiązanym z usługą sieciową, wybierając je z listy, i nie zna jego pełnej nazwy
    en:
      - The machine is attended by people signing in with an account bound to a network service picked from the list, who do not know its full name
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'DontEnumerateConnectedUsers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'DontEnumerateConnectedUsers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontEnumerateConnectedUsers' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Punkt jest drugim z trzech o zawartości ekranu logowania i najsłabszym
    z nich na serwerze. Warto to powiedzieć wprost, zamiast przedstawiać
    go jako równorzędny sąsiadom.

    Wdrożenie mimo niskiej wagi ma uzasadnienie w tym, że koszt jest zerowy,
    a stan konta na maszynie może się zmienić. Punkt utrzymuje zasłonę
    także wtedy, gdy takie konto pojawi się później — a wtedy nikt nie
    będzie wracał do zasad ekranu logowania.

    Trzy reguły o ekranie logowania odpowiadają na to samo pytanie w trzech
    miejscach: konta lokalne, konta powiązane z usługą sieciową, dane konta
    ostatnio używanego. Wdrożone razem dają ekran, który nie mówi nic;
    wdrożone osobno zostawiają szczelinę, przez którą widać resztę.
  en: |
    The item is the second of three about the sign-in screen's contents and the
    weakest of them on a server. That is worth saying outright rather than setting it
    out as the equal of its neighbours.

    Rolling it out despite its slight weight is warranted in that the cost is nil and
    the state of accounts on a machine can change. The item keeps the curtain drawn
    also where such an account appears later - and nobody will then be returning to the
    sign-in screen's policies.

    The three rules about the sign-in screen answer the same question in three places:
    local accounts, accounts bound to a network service, the details of the last
    account used. Rolled out together they give a screen that says nothing; rolled out
    apart they leave a chink through which the rest is seen.
