id: win2016-network-credential-storage-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie poświadczeń do uwierzytelniania sieciowego wyłączone
    en: Storage of credentials for network authentication disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania systemowi zapamiętywać poświadczenia używane do
    uwierzytelniania wobec innych maszyn w sieci.

    Magazyn poświadczeń jest wygodą, której koszt rzadko bywa policzony.
    Zapisane tam hasło do udziału, do serwera bazy albo do maszyny
    zarządzanej zostaje związane z profilem konta i podawane samo, gdy
    system uzna to za potrzebne. Osoba korzystająca nie widzi, ile tych
    poświadczeń ma i do czego prowadzą — bo cała rzecz polega na tym, żeby
    nie musieć o nich pamiętać.

    Dla napastnika, który przejął konto na tej maszynie, jest to mapa.
    Zawartość magazynu można odczytać, działając jako właściciel profilu,
    i wynika z niej nie tylko co jest zapisane, ale też dokąd to konto
    zwykło sięgać. Ruch boczny przestaje wymagać rozpoznania.

    Punkt należy do poziomu drugiego, bo jest to ograniczenie wygody, a nie
    zamknięcie błędu. Na maszynie, z której nikt nie łączy się dalej,
    kosztuje zero; na maszynie zarządzającej kosztuje zmianę sposobu pracy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zbiór
    zapisanych poświadczeń do innych maszyn wraz z listą tego, dokąd
    przejęte konto zwykło sięgać.
  en: |
    The setting forbids the system to remember credentials used to authenticate to
    other machines on the network.

    The credential store is a convenience whose cost is rarely counted. A password
    stored there to a share, to a database server or to a managed machine is bound
    to the account's profile and offered by itself whenever the system judges it
    needed. The person using it does not see how many such credentials they have or
    where they lead - since the whole point is not to have to remember them.

    For an attacker who has taken over an account on this machine it is a map. The
    store's contents can be read while acting as the profile's owner, and from them
    follows not only what is stored but where this account was in the habit of
    reaching. Lateral movement ceases to call for reconnaissance.

    The item belongs to the second level, since it is a limiting of convenience
    rather than the shutting of a fault. On a machine nobody connects onward from it
    costs nothing; on a management machine it costs a change in the way of working.

    What an attacker gains while the item goes unmet: a set of stored credentials to
    other machines, along with a list of where the taken-over account was in the
    habit of reaching.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy tego, co z tej maszyny
    łączy się dalej bez udziału człowieka.

    Dla ludzi zmiana jest odczuwalna, ale nieblokująca: hasło do zasobu
    sieciowego trzeba wpisać przy każdym połączeniu zamiast raz na zawsze.
    Osoby pracujące na serwerze zauważą to natychmiast i warto je uprzedzić.

    Gorzej z automatami. Skrypty sięgające po udział sieciowy z zapisanym
    poświadczeniem, zadania harmonogramu łączące się do innej maszyny,
    narzędzia kopii zapasowych odkładające dane na zasób zdalny — wszystkie
    one po zmianie stają przed pytaniem o hasło, na które nie ma komu
    odpowiedzieć. Skutek bywa opóźniony do najbliższego uruchomienia, więc
    zadanie miesięczne ujawni problem za miesiąc.

    Zastrzeżenie, które trzeba znać przed zmianą: ustawienie zabrania
    zapisywania nowych poświadczeń, a tych już zapisanych nie usuwa.
    Magazyn trzeba wyczyścić osobno, inaczej reguła daje zgodność
    w raporcie i nie daje skutku na maszynie.

    Czego to nie psuje: logowania na tę maszynę, uwierzytelniania
    domenowego biletem, dostępu do zasobów, do których konto ma prawo bez
    osobnego poświadczenia, usług działających na koncie systemowym.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the checking concerns what connects onward from
    this machine without a person's part in it.

    For people the change is felt but not blocking: the password to a network
    resource has to be typed at each connection rather than once and for all. Those
    working on the server will notice at once and are worth warning.

    It is worse with automatic jobs. Scripts reaching for a network share with a
    stored credential, scheduled tasks connecting to another machine, backup tools
    laying data on a remote resource - after the change all of them face a password
    prompt with nobody to answer it. The effect is at times delayed until the next
    run, so a monthly task will show the problem in a month.

    A reservation to know before the change: the setting forbids new credentials to
    be stored and does not remove those already stored. The store has to be cleared
    apart, or else the rule gives compliance in the report and no effect on the
    machine.

    What this does not break: signing in to this machine, domain authentication by
    ticket, access to resources the account has a right to without a separate
    credential, or services running on the system account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypty sięgające po udział sieciowy z zapisanym poświadczeniem stają przed pytaniem o hasło, na które nie ma komu odpowiedzieć
      - Zadania harmonogramu łączące się do innej maszyny i narzędzia kopii zapasowych odkładające dane na zasób zdalny przestają działać
      - Hasło do zasobu sieciowego trzeba wpisywać przy każdym połączeniu zamiast raz na zawsze
      - Poświadczenia zapisane wcześniej zostają w magazynie i wymagają osobnego wyczyszczenia, bo reguła ich nie usuwa
    en:
      - Scripts reaching for a network share with a stored credential face a password prompt with nobody to answer it
      - Scheduled tasks connecting to another machine and backup tools laying data on a remote resource stop working
      - The password to a network resource has to be typed at each connection rather than once and for all
      - Credentials stored earlier stay in the store and call for a separate clearing, since the rule does not remove them
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z tej maszyny łączą się do innych zadania automatyczne opierające się na zapisanym poświadczeniu i nie przeniesiono ich na konto usługi
      - Nie wyliczono zadań uruchamianych rzadziej niż raz w tygodniu, które sięgają po zasoby sieciowe
    en:
      - Automatic jobs resting on a stored credential connect from this machine to others and have not been moved to a service account
      - Tasks running less often than weekly that reach for network resources have not been enumerated
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'DisableDomainCreds'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'DisableDomainCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableDomainCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-storage-of-passwords-and-credentials-for-network-authentication

notes:
  pl: |
    Reguła bywa mylona z zakazem zapisywania haseł w kliencie pulpitu
    zdalnego, bo obie dotyczą magazynu poświadczeń. Różnica jest w zakresie:
    tamta dotyczy jednego programu, ta — wszystkiego, co uwierzytelnia się
    w sieci z tej maszyny. Ta jest szersza i dlatego kosztowniejsza.

    Zastrzeżenie o poświadczeniach zapisanych wcześniej powinno stać
    w interfejsie przy punkcie, tak samo jak przy regule o kliencie pulpitu
    zdalnego. Reguła działa wyłącznie w przód, więc zgodność w raporcie
    znaczy mniej, niż czytelnik zakłada.

    Poziom drugi jest tu właściwy. Punkt nie zamyka błędu ani drogi ataku
    wykorzystywanej wprost — ogranicza materiał, który napastnik zastaje po
    przejęciu konta. Na maszynie zarządzającej warto go wdrożyć mimo kosztu;
    na maszynie, z której nikt nie łączy się dalej, jest niemal darmowy.
  en: |
    The rule is at times confused with the ban on saving passwords in the remote
    desktop client, since both concern the credential store. The difference is one
    of scope: that one concerns a single program, this one everything authenticating
    on the network from this machine. This one is wider and therefore costlier.

    The reservation about credentials stored earlier should stand in the interface
    at the item, just as at the rule on the remote desktop client. The rule works
    forward alone, so compliance in the report means less than the reader assumes.

    The second level is right here. The item shuts no fault and no road of attack
    used outright - it limits the material an attacker finds once an account has
    been taken over. On a management machine it is worth rolling out despite the
    cost; on a machine nobody connects onward from it is all but free.
