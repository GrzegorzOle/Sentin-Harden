id: win2025-system-log-retention

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > System
  title:
    pl: Zachowanie dziennika systemu po zapełnieniu
    en: Behaviour of the system log once it fills up
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, co dzieje się z dziennikiem systemowym po jego
    zapełnieniu: najstarsze zapisy mają być nadpisywane nowymi.

    Zostawiam kategorię niską — niższą niż przy tym samym ustawieniu dla
    dziennika zabezpieczeń — bo dziennik systemowy nie ma wariantu,
    w którym zapełnienie zatrzymuje maszynę. Tamten punkt zapobiega
    unieruchomieniu serwera; ten zapobiega czemuś łagodniejszemu.

    Warto natomiast nazwać, czemu dokładnie. Zakaz nadpisywania nie
    zachowuje dziennika w stanie użytecznym. Odwraca kierunek utraty:
    zamiast tracić zapisy najstarsze, przestaje się przyjmować nowe.
    Dziennik zamarza w chwili zapełnienia i od tego momentu nie zapisuje
    już niczego — czyli traci się dokładnie te zdarzenia, które właśnie
    zachodzą, a zachowuje te, które zaszły dawno i nikogo już nie
    obchodzą. Dla maszyny, którą będzie się badać po jakimś zdarzeniu,
    jest to najgorszy możliwy wybór, bo zamiast krótkiej historii
    świeżej dostaje się długą historię nieaktualną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przy
    zakazie nadpisywania — dziennik systemowy zamrożony na dawnej dacie,
    w którym własne działania nie zostawią żadnego zapisu, bo nic już się
    do niego nie zapisze.
  en: |
    The item sets what befalls the system log once it is full - the oldest writings are to be written
    over by new ones.

    I leave the category low - lower than at the same setting for the security log - the system log
    having no shape wherein the filling up stops the machine. That item wards off the stilling of a
    server; this one wards off something milder.

    It is worth naming, for all that, what exactly. A forbidding of the writing over keeps not the log
    in a state of use. It turns about the way of the loss - instead of losing the oldest writings, the
    new ones stop being taken in. The log freezes at the hour of its filling and from that moment
    writes nothing more down - that is, one loses just those happenings that are befalling now and
    keeps those that befell long ago and trouble nobody any more. For a machine that will be looked
    into after some happening it is the worst choosing there may be, for instead of a short and fresh
    tale one is given a long and outworn one.

    What an attacker gains while the item goes unmet - at a forbidding of the writing over, a system log
    frozen at an old date, wherein their own doings will leave no writing at all, nothing being written
    into it any more.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zmiana zapisuje wartość
    w polityce, niczego nie zatrzymuje i nie wymaga restartu.

    Trzy punkty o zachowaniu dzienników po zapełnieniu — zabezpieczeń,
    systemu i aplikacji — są jedną decyzją i nie ma powodu rozważać ich
    osobno. Różnią się tym, jak dotkliwy jest wariant przeciwny,
    a nie tym, co należy ustawić.

    To samo zastrzeżenie co przy dzienniku zabezpieczeń: jeżeli na
    maszynie ustawiono wcześniej zakaz nadpisywania i dziennik jest
    pełny, po tej zmianie najstarsze zapisy zaczną znikać. Kopię robi
    się przed, nie po.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease". The change writes a worth into the rule, stops nothing and takes no
    starting anew.

    The three items upon the behaviour of logs once full - of security, of the system and of
    applications - are one deciding and there is no ground to weigh them apart. They are unlike in how
    heavy the other shape is, and not in what ought to be set.

    The same saving as at the security log - if upon the machine a forbidding of the writing over was
    set before and the log be full, after that change the oldest writings will begin to go away. The
    copy is made before and not after.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie z zakazem nadpisywania dziennik zacznie się nadpisywać i najstarsze zapisy zaczną znikać
      - Przestaje działać oczekiwanie, że pełny dziennik zamarza i czeka nietknięty
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Trzy punkty o zachowaniu dzienników po zapełnieniu są jedną decyzją i idą razem
    en:
      - Upon a machine with a forbidding of the writing over the log will begin to write itself over and the oldest writings will go away
      - The looking for a full log to freeze and wait untouched stops holding
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - The three items upon the behaviour of logs once full are one deciding and go together
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie ustawiono zakaz nadpisywania świadomie i nie zrobiono jeszcze kopii zebranych zapisów
    en:
      - Upon the machine a forbidding of the writing over was set wittingly and no copy of the gathered writings has yet been made
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is kept as text, not a number, so it is compared as text.
      # Reading it numerically would turn an absent value into a zero and
      # report a machine with no policy at all as satisfying the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
      $name = 'Retention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Forbidding overwrite does not preserve the log: it freezes it, so what is
    # lost is the events happening now rather than the ones from long ago.
    # Take a copy first where the log is already full.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Kategoria niższa niż przy dzienniku zabezpieczeń, bo dziennik
    systemowy nie ma wariantu, w którym zapełnienie zatrzymuje maszynę.

    Zakaz nadpisywania nie zachowuje dziennika w stanie użytecznym —
    odwraca kierunek utraty. Dziennik zamarza w chwili zapełnienia,
    więc traci się dokładnie te zdarzenia, które właśnie zachodzą,
    a zachowuje te, które zaszły dawno.

    Dla maszyny badanej po jakimś zdarzeniu jest to najgorszy możliwy
    wybór: zamiast krótkiej historii świeżej dostaje się długą historię
    nieaktualną.
  en: |
    A lower category than at the security log, the system log having no shape wherein the filling up
    stops the machine.

    A forbidding of the writing over keeps not the log in a state of use - it turns about the way of
    the loss. The log freezes at the hour of its filling, so one loses just those happenings that are
    befalling now and keeps those that befell long ago.

    For a machine looked into after some happening it is the worst choosing there may be - instead of a
    short and fresh tale one is given a long and outworn one.
