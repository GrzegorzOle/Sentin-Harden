id: win10-bitlocker-removable-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Szyfrowanie całego nośnika wymiennego wymuszone
    en: Full encryption of removable media enforced
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza zaszyfrowanie całego nośnika wymiennego, a nie
    samego obszaru zajętego w chwili rozpoczęcia.

    Rozumowanie jest znane z dysków stałych, ale nośnik wymienny jest
    przypadkiem najgorszym z możliwych. Pamięć przenośna to nośnik, na
    który przez lata wgrywa się i z którego kasuje się pliki bez żadnego
    porządku: raz dokumenty, raz zdjęcia, raz zrzut bazy, raz cudzą
    prezentację. Po każdym skasowaniu zawartość zostaje, a miejsce jest
    zgłaszane jako wolne.

    Zaszyfrowanie samego obszaru zajętego zostawia całą tę warstwę
    czytelną. Nośnik, na którym leży jeden plik, może nieść w obszarze
    wolnym kilkadziesiąt poprzednich — i wszystkie one wyjdą z budynku
    razem z nim, bez ochrony.

    Odnotowuję, że użytkownik widzi tę zmianę. Szyfrowanie całości trwa
    dłużej i przy pamięci przenośnej różnica jest odczuwalna od razu,
    bo nośniki te są zwykle wolne przy zapisie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: historię
    nośnika wyniesionego poza budynek, zapisaną w jego obszarze wolnym.
  en: |
    The setting enforces the enciphering of the whole removable medium, and not of the space taken up at the hour
    of beginning.

    The reasoning is known from fixed drives, but a removable medium is the worst possible case. A travelling
    memory is a thing onto which over years files are put and off which they are struck with no order at all: now
    documents, now pictures, now a dump of a base, now somebody else's presentation. After every striking out the
    contents remain and the room is given out as free.

    The enciphering of the taken space alone leaves that whole layer readable. A medium upon which one file lies
    may carry some tens of earlier ones in its free space - and all of those will leave the building with it,
    unguarded.

    I set down that the user sees this change. The enciphering of the whole takes longer, and with a travelling
    memory the difference is felt at once, such media commonly being slow at writing.

    What an attacker gains while the item goes unmet: the history of a medium carried outside the building,
    written in its free space.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest cierpliwość
    ludzi wobec czasu szyfrowania.

    Pamięci przenośne bywają wolne — znacznie wolniejsze od dysków stałych
    — więc szyfrowanie całości potrafi trwać na nich nieproporcjonalnie
    długo. Nośnik o pojemności 128 GB przy niskiej prędkości zapisu zajmuje
    tym kilkadziesiąt minut, podczas których jest zablokowany.

    Skutkiem praktycznym jest to, że ludzie będą szyfrować nośniki
    w ostatniej chwili, przed wyjściem, i okaże się, że nie zdążą.
    Warto o tym uprzedzić, bo alternatywą jest obejście: skopiowanie
    danych na nośnik nieobjęty zasadą.

    Odnotowuję, że zasada dotyczy szyfrowania zakładanego po jej
    wprowadzeniu. Nośnik zaszyfrowany wcześniej wariantem szybszym
    pozostaje taki, a punkt pokaże się jako spełniony.

    Odnotowuję też, że zmiana nie dotyczy nośników niezaszyfrowanych.
    Te działają jak dotychczas, dopóki nie wdroży się osobno zakazu zapisu.

    Czego to nie psuje: odczytu z nośników, pracy na dyskach stałych,
    logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is people's patience with the time of enciphering.

    Travelling memories are at times slow - far slower than fixed drives - so the enciphering of the whole can
    take upon them a time out of all proportion. A medium of 128 GB at a low speed of writing takes some tens of
    minutes at it, through which it is held fast.

    The practical consequence is that people will encipher media at the last hour, before going out, and will find
    they do not finish in time. It is worth warning of, the other road being a way round: the copying of the data
    onto a medium the policy does not take in.

    I set down that the policy touches enciphering laid on after it was brought in. A medium enciphered earlier by
    the quicker variant stays so, and the item will show as met.

    I set down likewise that the change does not touch unenciphered media. Those work as they did, until the
    forbidding of writing is rolled out apart.

    What this does not break: reading from media, work upon fixed drives, logging on, file shares, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Szyfrowanie całości nośnika o pojemności 128 GB przy niskiej prędkości zapisu trwa kilkadziesiąt minut
      - Przez ten czas nośnik jest zablokowany, więc szyfrowanie w ostatniej chwili przed wyjściem się nie uda
      - Alternatywą wybieraną przez ludzi bywa skopiowanie danych na nośnik nieobjęty zasadą
      - Nośnik zaszyfrowany wcześniej wariantem szybszym pozostaje taki, a punkt pokaże się jako spełniony
      - Odczyt z nośników, praca na dyskach stałych, logowanie i drukowanie pozostają bez zmian
    en:
      - The enciphering of a whole medium of 128 GB at a low speed of writing takes some tens of minutes
      - Through that time the medium is held fast, so an enciphering at the last hour before going out will not come through
      - The road people at times choose instead is the copying of the data onto a medium the policy does not take in
      - A medium enciphered earlier by the quicker variant stays so, and the item will show as met
      - Reading from media, work upon fixed drives, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki są szyfrowane doraźnie przed wyjściem i czas szyfrowania całości nie mieści się w tym trybie pracy
    en:
      - The media are enciphered as need arises before going out and the time of enciphering the whole does not fit that way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FULL'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVEncryptionType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One means the whole medium, two means the used space alone. Upon a travelling
    # memory the difference weighs most, such a thing being written over endlessly.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła powtarza decyzję znaną z dysków stałych, ale warto, żeby
    aplikacja pokazała, dlaczego przy nośnikach wymiennych waży więcej.
    Dysk stały ma jedno przeznaczenie i jedną historię. Pamięć przenośna
    ma ich tyle, ile razy ktoś ją wykorzystał, a wykorzystuje się ją do
    wszystkiego.

    Argument wart zachowania dotyczy tego, co ten nośnik pamięta.
    Użytkownik widzi na nim jeden plik i tak go ocenia. W obszarze wolnym
    leży natomiast wszystko, co było wcześniej — i to właśnie ten zbiór,
    a nie widoczny plik, wychodzi z budynku bez ochrony.

    Odnotowuję związek z czasem szyfrowania, bo jest to jedyna reguła
    w tym bloku, w której koszt wdrożenia mierzy się cierpliwością
    człowieka stojącego przy maszynie. Aplikacja powinna powiedzieć wprost,
    że nośnik trzeba przygotować wcześniej, a nie w drzwiach.
  en: |
    The rule repeats the decision known from fixed drives, but it is well that the application show why it weighs
    the more with removable media. A fixed drive has one purpose and one history. A travelling memory has as many
    as the times somebody has put it to use, and it is put to every use.

    The argument worth keeping touches what that medium remembers. The user sees one file upon it and judges it
    by that. In the free space lies instead everything that was there before - and it is that gathering, and not
    the file in sight, that leaves the building unguarded.

    I set down the tie to the time of enciphering, this being the one rule of the block whose cost of rollout is
    measured by the patience of a person standing at the machine. The application ought to say outright that the
    medium has to be made ready beforehand and not in the doorway.
