id: win2016-search-assistant-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Asystent wyszukiwania wyłączony
    en: The search assistant switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza asystenta wyszukiwania.

    Rzecz, o którą tu chodzi, dotyczy tego, dokąd trafia wpisywany tekst.
    Asystent nie ogranicza się do przeszukania maszyny — wysyła pytanie na
    zewnątrz, żeby odpowiedzieć również na to, czego na maszynie nie ma.
    Znaczy to, że treść wpisana w pole wyszukiwania opuszcza maszynę.

    Na serwerze jest to kanał szczególnie nie na miejscu, bo tekst wpisywany
    w pole wyszukiwania na serwerze bywa nazwą pliku, nazwą udziału albo
    nazwą konta. Wysyłanie takich ciągów na zewnątrz jest wynoszeniem
    informacji o wnętrzu maszyny, i to informacji wybranej przez tego, kto
    akurat czegoś szukał.

    Rzecz druga dotyczy powierzchni. Asystent jest składnikiem obszernym,
    pracującym w tle, nasłuchującym na zdarzenia i łączącym się na zewnątrz.
    Na maszynie, która go nie potrzebuje, jest to kod utrzymywany bez
    powodu.

    Punkt nie wyłącza wyszukiwania. Przeszukiwanie maszyny działa dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    wynoszący na zewnątrz nazwy szukane na tej maszynie oraz działający
    składnik łączący się w tle.
  en: |
    The setting switches off the search assistant.

    The matter here concerns where the typed text goes. The assistant does not keep to searching the
    machine - it sends the question outward, so as to answer also what is not on the machine. That means
    the content typed into the search box leaves the machine.

    On a server it is a channel particularly out of place, the text typed into a search box on a server
    being at times the name of a file, the name of a share or the name of an account. Sending such strings
    outward is a carrying out of word about the machine's inside, and word chosen by whoever happened to
    be looking for something.

    The second matter concerns surface. The assistant is a broad component, working in the background,
    listening for events and connecting outward. On a machine that does not need it, it is code kept up
    without cause.

    The item does not switch searching off. The searching of the machine works on.

    What an attacker gains while the item goes unmet: a channel carrying outward the names searched for on
    this machine, and a working component connecting in the background.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, jak ludzie na
    tej maszynie szukają.

    Rozróżnienie zasadnicze: wyszukiwanie w obrębie maszyny działa dalej.
    Pliki, ustawienia i aplikacje dają się znaleźć tak jak dotąd. Znika
    asystent i znikają odpowiedzi pochodzące spoza maszyny.

    Objaw widoczny dotyczy pola wyszukiwania. Zmienia się jego zachowanie
    i wygląd podpowiedzi, a osoby przyzwyczajone do wpisywania tam poleceń
    zauważą różnicę od razu. Nie jest to awaria, ale jest to zmiana
    odczuwalna i warto ją zapowiedzieć, bo inaczej zostanie zgłoszona jako
    usterka.

    Rzecz druga dotyczy maszyn wydanych komuś do pracy. Tam asystent bywa
    używany świadomie i punkt trzeba rozważyć, a nie wykonać odruchowo.

    Trzecia: część narzędzi uruchamianych z pola wyszukiwania korzysta
    z tej samej drogi. Uruchomienie ich innym sposobem pozostaje możliwe,
    ale przyzwyczajenie trzeba zmienić.

    Czego to nie psuje: wyszukiwania plików i ustawień, indeksowania,
    menu startowego, aplikacji, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns how people search on this machine.

    The cardinal distinction: searching within the machine works on. Files, settings and applications can
    be found as before. What goes is the assistant, and with it the answers coming from outside the
    machine.

    The visible symptom concerns the search box. Its behaviour and the look of its suggestions change, and
    people used to typing commands there will notice the difference at once. It is no fault, but it is a
    change that is felt and worth announcing, else it will be reported as a defect.

    The second matter concerns machines handed to somebody for work. There the assistant is at times used
    knowingly and the item has to be weighed rather than carried out by reflex.

    The third: some tools started from the search box use that same road. Starting them another way stays
    possible, but the habit has to change.

    What this does not break: the searching of files and settings, indexing, the start menu, applications,
    services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Pole wyszukiwania zmienia zachowanie i wygląd podpowiedzi, a osoby przyzwyczajone zauważą różnicę od razu
      - Odpowiedzi pochodzące spoza maszyny przestają się pojawiać, a wyszukiwanie plików i ustawień działa dalej
      - Narzędzia uruchamiane z pola wyszukiwania trzeba uruchamiać innym sposobem
      - Na maszynie wydanej komuś do pracy asystent bywa używany świadomie i zmiana jest tam odczuwalna
      - Indeksowanie, menu startowe, aplikacje, usługi i sieć pozostają bez zmian
    en:
      - The search box changes its behaviour and the look of its suggestions, and people used to it will notice the difference at once
      - Answers coming from outside the machine cease to appear, and the searching of files and settings works on
      - Tools started from the search box have to be started another way
      - On a machine handed to somebody for work the assistant is at times used knowingly and the change is felt there
      - Indexing, the start menu, applications, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest wydana komuś do pracy i asystent wyszukiwania jest na niej używany świadomie
      - Obsługa uruchamia narzędzia wyłącznie z pola wyszukiwania i nie ustalono innej drogi
    en:
      - The machine is handed to somebody for work and the search assistant is used on it knowingly
      - The attendance starts tools solely from the search box and no other road has been established
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowCortana'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowCortana'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Searching within the machine goes on working. What goes away is the
    # assistant and the sending of what is typed in the search box outward.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCortana' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Punkt jest bliźniakiem reguły o asystencie przy zablokowanym ekranie,
    ale dotyczy innej rzeczy i warto tego nie mylić. Tamta zamyka drogę
    przed granicą uwierzytelnienia i nic nie kosztuje; ta zamyka składnik
    w całości i zmienia sposób pracy.

    Zestawienie obu jest dobrym przykładem tego, po co są dwie osie.
    Tamta ma kategorię wyższą i koszt zerowy; ta kategorię niższą i koszt
    odczuwalny. Kolejność wynika z macierzy, nie z tego, która wygląda
    poważniej.

    Warto, żeby aplikacja postawiła rozróżnienie między asystentem
    a wyszukiwaniem na pierwszym miejscu opisu. Obawa, że maszyna przestanie
    znajdować pliki, jest przy tym punkcie częsta i prowadzi do
    odpuszczania go bez powodu.

    Odnotowuję, że zmiana jest widoczna gołym okiem. Jest to jedna
    z niewielu reguł w zestawie, przy której ktoś zauważy różnicę tego
    samego dnia — i dlatego zapowiedzenie jej jest częścią wdrożenia,
    a nie uprzejmością.
  en: |
    The item is the twin of the rule about the assistant at a locked screen, but concerns another thing and
    that is worth not confusing. That one shuts a road before the boundary of authentication and costs
    nothing; this one shuts a component whole and changes a way of working.

    Setting the two side by side is a good example of what the two axes are for. That one holds a higher
    category and nil cost; this one a lower category and a cost that is felt. The order follows from the
    matrix and not from which looks graver.

    It is well that the application put the distinction between the assistant and searching first in the
    description. The fear that the machine will cease to find files is at this item a common one and leads
    to its being let go without cause.

    Worth noting that the change is visible to the naked eye. It is one of the few rules in the set at
    which somebody will notice a difference the same day - and therefore announcing it is part of the
    rollout and not a courtesy.
