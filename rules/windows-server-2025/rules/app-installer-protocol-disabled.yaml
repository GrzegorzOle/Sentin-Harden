id: win2025-app-installer-protocol-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Instalowanie pakietu z odsyłacza w przeglądarce zablokowane
    en: Installing a package from a link in a browser blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza obsługę odsyłacza uruchamiającego instalator pakietu.
    Odsyłacz taki wygląda jak zwykły adres, a kliknięcie w niego prowadzi
    wprost do instalacji — z pominięciem pobrania pliku, zobaczenia go
    i podjęcia osobnej decyzji o uruchomieniu.

    Obniżam kategorię do średniej wobec oceny dla stacji roboczej
    i powód jest ten sam, który podawałem przy punktach pochodzących ze
    świata przeglądarki: żeby kliknąć w odsyłacz, trzeba mieć przeglądarkę
    i trzeba przy maszynie siedzieć. Na serwerze zwykle nie ma ani
    jednego, ani drugiego.

    Nie obniżam jednak niżej i chcę powiedzieć, dlaczego. Obsługa
    odsyłacza jest zarejestrowana w systemie, nie w przeglądarce. Odsyłacz
    otwarty z dokumentu, z klienta poczty, z konsoli zarządzania albo
    z pliku skrótu zadziała tak samo. Na serwerze jest to więc nie tyle
    droga z przeglądarki, ile droga z czegokolwiek, co potrafi otworzyć
    adres — a takich rzeczy jest na serwerze więcej, niż się wydaje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    uruchomioną jednym kliknięciem w adres, z pominięciem momentu,
    w którym ktokolwiek widzi pobierany plik.
  en: |
    The item switches off the handling of a link that runs the installer of a package. Such a link
    looks like an everyday whereabouts, and a clicking upon it leads straight to an installing -
    passing over the fetching of the file, the seeing of it and the making of a sundered deciding
    about the running.

    I lower the category to middling against the reckoning for a workstation, and the ground is the
    one I gave at items coming out of the world of the browser - to click upon a link one must have a
    browser and must sit at the machine. On a server there is mostly neither the one nor the other.

    I lower it no further, though, and mean to say why. The handling of the link is written down in
    the system and not in the browser. A link opened out of a document, out of a client of mail, out
    of a board of ruling or out of a file of shortcut will work the same. On a server it is therefore
    not so much a road out of a browser as a road out of anything able to open a whereabouts - and
    such things are upon a server more numerous than it seems.

    What an attacker gains while the item goes unmet - an installing run by one clicking upon a
    whereabouts, passing over the moment wherein anybody sees the file being fetched.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" wobec oceny dla stacji roboczej.
    Tam ten punkt zabiera ludziom sposób instalowania, z którego
    korzystają. Tutaj zabiera sposób, z którego nikt nie korzysta, bo nie
    ma kto.

    Zmiana nie dotyka instalowania z wiersza poleceń ani ze skryptu. Nie
    dotyka też samego instalatora pakietów, który jest osobnym punktem
    w tej paczce i osobną decyzją. Wyłącza wyłącznie jedną drogę wejścia
    do niego: tę zaczynającą się od kliknięcia w adres.

    Odwracam ocenę widoczności wobec stacji roboczej. Tam skutkiem jest
    odsyłacz, który przestaje działać na oczach człowieka. Na serwerze nie
    ma komu tego zobaczyć, a jedyny możliwy przypadek to administrator
    próbujący założyć narzędzie z konsoli w trakcie serwisu. Wtedy
    pozostaje mu droga zwykła — pobranie pliku albo polecenie — i jest to
    droga, którą i tak wypada iść na maszynie produkcyjnej.

    Nie znam serwerowej roli ani konfiguracji, w której ta droga instalacji
    jest potrzebna.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I lower the class to "no disruption" against the reckoning for a workstation. There this item
    takes from people a way of installing they use. Here it takes a way nobody uses, there being
    nobody to.

    The change touches not the installing off the row of commands nor out of a script. Nor does it
    touch the installer of packages itself, which is an item of its own in this pack and a deciding
    of its own. It switches off one road of coming into it alone - the one beginning at a clicking
    upon a whereabouts.

    I turn about the reckoning of being seen against the workstation. There the outcome is a link
    that stops working before a person's eyes. On a server there is nobody to see it, and the one
    case there could be is an administrator trying to set a tool up off the board in the midst of
    service. There is then left them the everyday road - the fetching of a file or a command - and it
    is the road that is fitly gone anyway upon a machine of production.

    I know of no role of a server nor setting up wherein that road of installing is taken.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - email-and-attachments
    - legacy-applications
  what_breaks:
    pl:
      - Odsyłacz uruchamiający instalator pakietu przestaje działać
      - Zmiana nie dotyka instalowania z wiersza poleceń ani ze skryptu
      - Nie dotyka samego instalatora pakietów, który jest osobnym punktem i osobną decyzją
      - Administratorowi zostaje droga zwykła, czyli pobranie pliku albo polecenie
      - Brak serwerowej roli i konfiguracji, w której ta droga instalacji jest potrzebna
    en:
      - A link running the installer of a package stops working
      - The change touches not the installing off the row of commands nor out of a script
      - It touches not the installer of packages itself, which is an item of its own and a deciding of its own
      - There is left the administrator the everyday road, the fetching of a file or a command
      - No role of a server nor setting up wherein that road of installing is taken
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableMSAppInstallerProtocol'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableMSAppInstallerProtocol'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The handler is registered system-wide, not in a browser: a link opened
    # from a document, a mail client or a management console works the same.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMSAppInstallerProtocol' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/msix/app-installer/installing-windows10-apps-web

notes:
  pl: |
    Kategoria obniżona, bo żeby kliknąć w odsyłacz, trzeba mieć
    przeglądarkę i siedzieć przy maszynie — na serwerze zwykle nie ma
    ani jednego, ani drugiego.

    Nie obniżam niżej, bo obsługa odsyłacza jest zarejestrowana
    w systemie, nie w przeglądarce. Odsyłacz otwarty z dokumentu,
    z klienta poczty, z konsoli zarządzania albo z pliku skrótu zadziała
    tak samo — a takich rzeczy jest na serwerze więcej, niż się wydaje.

    Punkt wyłącza jedną drogę wejścia do instalatora pakietów, a nie sam
    instalator. Ten jest osobnym punktem i osobną decyzją.
  en: |
    The category is lowered, for to click upon a link one must have a browser and sit at the machine
    - on a server there is mostly neither the one nor the other.

    I lower it no further, the handling of the link being written down in the system and not in the
    browser. A link opened out of a document, out of a client of mail, out of a board of ruling or
    out of a file of shortcut will work the same - and such things are upon a server more numerous
    than it seems.

    The item switches off one road of coming into the installer of packages and not the installer
    itself. That is an item of its own and a deciding of its own.
