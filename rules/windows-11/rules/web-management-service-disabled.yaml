id: win11-web-management-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania serwerem sieciowym wyłączona
    en: The service for remote management of the web server disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa wystawia w sieci osobny port, przez który da się zdalnie zmieniać
    konfigurację serwera sieciowego zainstalowanego na maszynie: dodawać
    witryny, zmieniać katalogi, podmieniać ustawienia aplikacji sieciowych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, widać po tym,
    czego ta droga nie wymaga. Nie wymaga dostępu do pulpitu, nie wymaga
    zdalnego uruchamiania poleceń, nie wymaga nawet konta systemu Windows —
    usługa potrafi uwierzytelniać własnymi poświadczeniami zarządzania
    serwerem, zakładanymi osobno i zwykle pomijanymi przy przeglądzie kont.
    Zmiana konfiguracji serwera prowadzi zaś wprost do uruchomienia kodu:
    wystarczy wskazać katalog z własną zawartością albo zmienić ustawienia
    puli aplikacji.

    Na stacji roboczej rzecz jest prostsza, niż wygląda. Serwera sieciowego
    zwykle na niej nie ma, a wtedy nie ma też usługi i punkt nie ma czego
    dotyczyć. Jeżeli jednak serwer został zainstalowany — a bywa instalowany
    jako zależność narzędzi programistycznych, nie świadomie — to zdalne
    zarządzanie nim na stanowisku nie ma żadnego uzasadnienia.
  en: |
    The service puts out a port of its own on the network through which the
    configuration of a web server installed on the machine can be changed remotely:
    sites added, directories changed, the settings of web applications swapped.

    What an attacker gains while the item goes unmet shows in what this route does not
    require. It requires no access to the desktop, no remote running of commands, not
    even a Windows account - the service can authenticate with server management
    credentials of its own, set up separately and usually passed over when accounts are
    reviewed. And a change to the server's configuration leads straight to code being
    run: it is enough to point at a directory holding one's own content or to change an
    application pool's settings.

    On a workstation the matter is simpler than it looks. There is usually no web server
    on one, and then there is no service either and the item has nothing to concern. If
    a server has been installed, though - and it is sometimes installed as a dependency
    of programming tools rather than deliberately - then managing it remotely at a
    workstation has no justification whatever.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie stoi serwer sieciowy i czy ktoś
    zarządza nim zdalnie przez konsolę zarządzania z innej maszyny.

    Na stacji roboczej bez zainstalowanego serwera sieciowego usługi nie ma
    wcale i audyt zwróci wynik „nie dotyczy". To jest przypadek zdecydowanie
    najczęstszy i nie niesie żadnych skutków.

    Tam, gdzie serwer stoi, skutek jest wąski i dotyczy jednej drogi dostępu.
    Zdalne podłączenie konsolą zarządzania przestaje działać. Nie przestaje
    natomiast działać sam serwer: witryny są dalej obsługiwane, a ruch
    użytkowników nie zauważa niczego. Nie przestaje też działać zarządzanie
    z konsoli uruchomionej na tej maszynie ani zmiana konfiguracji przez pliki
    konfiguracyjne i polecenia lokalne.

    Osobno warto sprawdzić narzędzia wdrożeniowe. Część z nich wysyła zawartość
    witryny właśnie tą drogą — wtedy wdrożenie zakończy się błędem połączenia.
    Zamiennikiem jest wdrożenie przez zdalne uruchamianie poleceń albo przez
    kopiowanie plików na udział, a przy stanowisku programisty zwykle
    wystarczy wdrożenie lokalne.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether a web server stands on the machine and whether anybody
    manages it remotely with a management console from another machine.

    On a workstation with no web server installed the service is not there at all and the
    audit returns "not applicable". That is by far the commonest case and it carries no
    effects.

    Where a server does stand, the effect is narrow and concerns one way in. Connecting
    remotely with the management console stops working. What does not stop working is the
    server itself: sites are served on, and users' traffic notices nothing. Nor does
    management from a console run on this machine stop, nor changing the configuration
    through configuration files and local commands.

    Deployment tools are worth checking separately. Some of them send a site's content by
    exactly this route - the deployment will then end in a connection error. The
    replacement is deploying by running commands remotely or by copying files onto a
    share, and at a programmer's station a local deployment is usually enough.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Zdalne podłączenie konsolą zarządzania do serwera sieciowego przestaje być możliwe
      - Narzędzie wdrożeniowe wysyłające zawartość witryny tą drogą kończy się błędem połączenia
      - Sam serwer sieciowy obsługuje witryny dalej i ruch użytkowników nie zauważa zmiany
      - Na maszynie bez serwera sieciowego usługi nie ma i audyt zwraca wynik nie dotyczy
    en:
      - Connecting remotely with the management console to the web server stops being possible
      - A deployment tool sending a site's content by this route ends in a connection error
      - The web server itself serves sites on and users' traffic notices no change
      - On a machine with no web server the service is absent and the audit returns not applicable
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer sieciowy na tej maszynie jest zarządzany zdalnie konsolą z innej maszyny
      - Wdrożenia witryny idą przez zdalne zarządzanie serwerem i nie ma dla nich zamiennika
    en:
      - The web server on this machine is managed remotely with a console from another machine
      - Site deployments go through remote server management and there is no replacement for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'WMSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WMSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/manage/remote-administration/remote-administration-for-iis-manager

notes:
  pl: |
    Usługa jest instalowana razem ze składnikiem zdalnego zarządzania serwerem
    sieciowym i na maszynie bez tego składnika nie istnieje. Wynik „nie
    dotyczy" jest tu wynikiem prawidłowym, a nie brakiem sprawdzenia.

    Punkt dotyczy wyłącznie zdalnego zarządzania konfiguracją. Nie dotyczy
    samej usługi serwera sieciowego, obsługującej witryny — jej wyłączenie jest
    osobną decyzją o innych skutkach.

    Na maszynie, na której serwer sieciowy znalazł się przypadkiem, właściwym
    działaniem jest odinstalowanie roli, a nie wyłączenie pojedynczej usługi.
    Ta reguła rozwiązuje część problemu i nie udaje, że rozwiązuje całość.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa zatrzymana, ale z trybem uruchamiania innym niż
    wyłączony, jest niezgodna — wystarczy ponowne uruchomienie maszyny, żeby
    wróciła.
  en: |
    The service is installed together with the component for remote management of the web
    server and does not exist on a machine without that component. A "not applicable"
    result is a proper result here rather than a failure to check.

    The item concerns remote management of the configuration alone. It does not concern
    the web server service itself, the one serving sites - disabling that is a separate
    decision with different effects.

    On a machine where a web server has turned up by accident, the right thing to do is
    to uninstall the role rather than disable a single service. This rule solves part of
    the problem and does not pretend to solve the whole of it.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment. A stopped service with a startup mode other than disabled is
    deviating - restarting the machine is all it takes for it to come back.
