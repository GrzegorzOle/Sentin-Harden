id: win2025-convenience-pin-sign-in-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie kodem PIN do konta domenowego wyłączone
    en: Signing in to a domain account by a PIN switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza możliwość logowania się do konta domenowego krótkim
    kodem zamiast hasła. Wygoda polega na tym, że kod jest krótki. Na tym
    samym polega problem.

    Zostawiam kategorię wysoką i robię to świadomie, wbrew regule, którą
    stosowałem w tej paczce przy punktach pochodzących ze świata stacji
    roboczej. Tam obniżałem ocenę, bo dana funkcja wymaga
    zainstalowanego oprogramowania, którego na serwerze nie ma. Tutaj ten
    argument nie działa i to jest cała różnica.

    Logowanie kodem nie wymaga niczego doinstalowanego. Jest częścią
    systemu, obecną na każdej maszynie, w tym na serwerze. Włącza się je
    zasadą — a zasada pisana z myślą o stacjach roboczych trafia na
    serwer wtedy, gdy ktoś podpiął ją zbyt szeroko albo gdy serwer stoi
    w jednostce organizacyjnej, do której nikt nie zaglądał. Nikt tego
    nie zamierzał i właśnie dlatego nikt tego nie sprawdza.

    Skutek na serwerze jest cięższy niż na stacji: konta logujące się na
    serwer to konta administratorów, a krótki kod chroniący konto
    administratora domeny to krótki kod chroniący całą domenę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wejścia na konto administracyjne kilkucyfrowym kodem, jeżeli ktoś
    kiedyś taki kod na tej maszynie ustawił.
  en: |
    The item switches off the leave to sign in to a domain account by a short code in place of a
    password. The ease of it lies in the code being short. Therein lies the trouble as well.

    I leave the category high and do so wittingly, against the rule I have laid on in this pack at
    items coming out of the world of workstations. There I lowered the reckoning, the given feature
    taking software set alongside that a server has not. Here that ground holds not, and that is the
    whole of the difference.

    The signing in by a code takes nothing set alongside. It is a part of the system, at hand on
    every machine, a server among them. It is switched on by a policy - and a policy written with
    workstations in mind comes upon a server where somebody has bound it too broadly, or where the
    server stands in a share of the ordering nobody has looked into. Nobody meant it, and for that
    very reason nobody looks to it.

    The outcome on a server is heavier than on a workstation - the accounts signing in to a server
    are the accounts of administrators, and a short code guarding the account of an administrator of
    the domain is a short code guarding the whole domain.

    What an attacker gains while the item goes unmet - the leave to come onto an account of ruling by
    a code of a few figures, if ever anybody set such a code upon that machine.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i uważam, że na serwerze jest to
    ocena łatwa do uzasadnienia.

    Ustawienie nie dotyka haseł, kont ani żadnego sposobu logowania poza
    tym jednym. Logowanie hasłem, logowanie zdalne, konta usług i zadania
    zaplanowane działają bez zmian.

    Jedynym człowiekiem, którego ta zmiana może dotknąć, jest ktoś, kto
    faktycznie ustawił sobie kod na tej maszynie i loguje się nim
    z konsoli. Na serwerze zdarza się to rzadko i zwykle jest śladem
    czyjegoś przyzwyczajenia ze stacji roboczej, a nie decyzji. Taka
    osoba loguje się po zmianie hasłem, które i tak musi znać.

    Jedna rzecz warta uwagi przed zmianą: kod bywa jedynym sposobem
    logowania, jakiego ktoś używa na co dzień, i po latach hasło do tego
    konta pamięta już tylko katalog. Sprawdzenie, czy ktokolwiek loguje
    się na ten serwer kodem, zajmuje chwilę i oszczędza rozmowy przy
    najbliższym serwisie.

    Zmiana cofa się natychmiast i nie wymaga restartu. Sesje już otwarte
    nie są zrywane — warunek sprawdza się przy kolejnym logowaniu.
  en: |
    I leave the class "no disruption" and hold it on a server a reckoning easy to stand by.

    The setting touches neither passwords nor accounts nor any way of signing in but that one. The
    signing in by a password, the signing in from afar, the accounts of services and the tasks set
    for a time work unaltered.

    The one person this change may touch is somebody who has truly set themselves a code upon that
    machine and signs in by it from the board. On a server that happens seldom and is mostly a trace
    of somebody's wont off a workstation and no deciding. Such a person signs in after the change by
    the password they must know anyway.

    One thing worth heeding before the change - a code is at times the only way of signing in
    somebody uses day by day, and after years the password to that account is remembered by the
    catalogue alone. The looking into whether anybody signs in to that server by a code takes a
    moment and spares talk at the nearest service.

    The change is undone at once and takes no restart. Sittings already open are not broken off - the
    bond is looked to at the next signing in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Kto ustawił sobie kod na tej maszynie, loguje się po zmianie hasłem
      - Kod bywa jedynym sposobem logowania, jakiego ktoś używa, i hasło pamięta już tylko katalog
      - Ustawienie nie dotyka haseł, kont usług ani zadań zaplanowanych
      - Logowanie zdalne i logowanie hasłem działają bez zmian
      - Sesje już otwarte nie są zrywane, warunek sprawdza się przy kolejnym logowaniu
    en:
      - Whoever set themselves a code upon that machine signs in after the change by a password
      - A code is at times the only way of signing in somebody uses, the password being remembered by the catalogue alone
      - The setting touches neither passwords nor accounts of services nor tasks set for a time
      - The signing in from afar and the signing in by a password work unaltered
      - Sittings already open are not broken off, the bond is looked to at the next signing in
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sprawdzono, czy ktokolwiek loguje się na ten serwer kodem jako jedynym sposobem
    en:
      - It was not looked into whether anybody signs in to that server by a code as their only way
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'AllowDomainPINLogon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowDomainPINLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainPINLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Kategoria świadomie utrzymana, wbrew regule obniżania stosowanej
    w tej paczce przy punktach ze świata stacji roboczej. Tamte
    obniżałem, bo funkcja wymaga doinstalowanego oprogramowania.
    Logowanie kodem nie wymaga niczego — jest częścią systemu i trafia
    na serwer przez zasadę podpiętą zbyt szeroko albo przez jednostkę
    organizacyjną, do której nikt nie zaglądał.

    Nikt tego nie zamierzał i właśnie dlatego nikt tego nie sprawdza.

    Skutek jest cięższy niż na stacji: krótki kod chroniący konto
    administratora domeny to krótki kod chroniący całą domenę.
  en: |
    The category is wittingly held, against the rule of lowering laid on in this pack at items out of
    the world of workstations. Those I lowered, the feature taking software set alongside. The
    signing in by a code takes nothing - it is a part of the system and comes upon a server through a
    policy bound too broadly or through a share of the ordering nobody has looked into.

    Nobody meant it, and for that very reason nobody looks to it.

    The outcome is heavier than on a workstation - a short code guarding the account of an
    administrator of the domain is a short code guarding the whole domain.
