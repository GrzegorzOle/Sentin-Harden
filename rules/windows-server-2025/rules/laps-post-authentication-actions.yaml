id: win2025-laps-post-authentication-actions

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Sprzątanie po użyciu hasła lokalnego administratora włączone
    en: Clearing up after the local administrator password's use switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt każe maszynie posprzątać po tym, jak ktoś użył hasła lokalnego
    administratora: zmienić hasło i wylogować to konto. Zero zostawia
    wszystko tak, jak było.

    Kategoria wysoka, bo to jest punkt, który zamyka okno czasowe otwarte
    przez samo korzystanie z mechanizmu. Pozostałe reguły LAPS dbają o to,
    żeby hasło było dobre i żeby leżało w bezpiecznym miejscu. Żadna z nich
    nie mówi, co się dzieje po tym, jak hasło zostało odczytane i użyte —
    a właśnie wtedy zaczyna ono krążyć poza katalogiem.

    Po odczytaniu hasło istnieje w schowku, w oknie terminala, w historii
    polecenia, w pamięci narzędzia, przez które ktoś się łączył, i w głowie
    osoby, która je widziała. Okres ważności zamknie tę sprawę po
    trzydziestu dniach. Ta reguła zamyka ją po godzinach, licząc od użycia,
    a nie od zmiany.

    Na serwerze ma to dodatkowy wymiar. Sesji lokalnego administratora na
    serwerze nikt nie kończy, bo nikt przy nim nie siedzi — zostaje
    otwarta w konsoli poza systemem albo w sesji zdalnej do następnego
    razu, gdy ktoś tam zajrzy. Wylogowanie należące do tej reguły jest
    jedynym mechanizmem, który tę sesję zamknie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło ważne
    jeszcze przez tygodnie po tym, jak rozeszło się poza katalog, i otwartą
    sesję administratora, której nikt nie zamknął.
  en: |
    The item tells the machine to clear up after somebody has used the
    local administrator password: change the password and sign that account
    out. Zero leaves everything as it was.

    The category is high, because this item closes a window of time opened
    by the very use of the mechanism. The other LAPS rules see to it that
    the password is a good one and that it lies in a safe place. None of
    them says what happens after the password has been read and used - and
    that is exactly when it begins to circulate outside the directory.

    Once read, the password exists in a clipboard, in a terminal window, in
    a command history, in the memory of the tool somebody connected
    through, and in the head of the person who saw it. The term of validity
    will close the matter after thirty days. This rule closes it after
    hours, counted from the use rather than from the change.

    On a server this has a further dimension. Nobody ends a local
    administrator session on a server, because nobody is sitting at it - it
    stays open in the out-of-band console or in a remote session until the
    next time somebody looks in. The sign-out that belongs to this rule is
    the only mechanism that will close that session.

    What an attacker gains while the item goes unmet: a password still
    valid for weeks after it has spread beyond the directory, and an open
    administrator session nobody has closed.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać dokładnie to, co
    może zaboleć, bo przy złym doborze wariantu ta reguła potrafi przerwać
    pracę w toku.

    Sprzątanie obejmuje wylogowanie konta, a wariant ostrzejszy — również
    zamknięcie tego, co pod tym kontem działa. Na serwerze prace
    prowadzone przez lokalnego administratora bywają długie i nie zawsze
    wyglądają na sesję: odtwarzanie kopii, migracja, instalacja
    aktualizacji sterowników, zadanie uruchomione „na chwilę" i działające
    od trzech godzin. Wariant zamykający procesy przerwie je w połowie.
    Dlatego naprawa wpisuje wariant najłagodniejszy z dopuszczalnych:
    hasło zmienione, konto wylogowane, działające procesy nietknięte.

    Druga rzecz do sprawdzenia dotyczy automatyzacji. Jeżeli cokolwiek na
    tej maszynie loguje się kontem lokalnego administratora cyklicznie —
    stary skrypt, agent monitorujący, zadanie dostawcy — po tej zmianie
    będzie odczytywać hasło, które zaraz potem przestanie obowiązywać.
    Objaw to zadanie działające raz i padające za drugim razem, czyli
    najgorszy rodzaj usterki do zdiagnozowania. Takie użycia trzeba
    odszukać przed zmianą; są one same w sobie znaleziskiem.

    Reguła działa wyłącznie razem z włączonym mechanizmem hasła lokalnego
    administratora i razem ze zwłoką opisaną w osobnym punkcie — bez
    zwłoki sprzątanie nie następuje wcale.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to point out precisely what
    can hurt, because with the wrong variant this rule can interrupt work
    in progress.

    The clearing up includes signing the account out, and the harsher
    variant also closes whatever is running under that account. On a server
    work carried out by the local administrator is often long and does not
    always look like a session: a restore, a migration, a driver update, a
    task started "for a moment" and running for three hours. The variant
    that closes processes will cut them off halfway. That is why the
    remediation writes the mildest of the permitted variants: password
    changed, account signed out, running processes left alone.

    The second thing to check concerns automation. If anything on this
    machine signs in with the local administrator account on a schedule -
    an old script, a monitoring agent, a vendor's task - after this change
    it will read a password that stops being valid shortly afterwards. The
    symptom is a task that works once and fails the second time, the worst
    kind of fault to diagnose. Such uses have to be found before the
    change; they are a finding in themselves.

    The rule works only together with the local administrator password
    mechanism switched on and together with the delay described in a
    separate item - without the delay no clearing up happens at all.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Konto lokalnego administratora zostaje wylogowane po upływie zwłoki, także w trakcie dłuższych prac
      - Wariant ostrzejszy zamyka też działające procesy i przerwie odtwarzanie albo migrację w połowie
      - Zadanie logujące się cyklicznie tym kontem odczyta hasło, które zaraz potem przestanie obowiązywać
      - Objawem jest zadanie działające raz i padające za drugim razem, czyli najgorszy rodzaj usterki do zdiagnozowania
      - Bez zwłoki opisanej w osobnym punkcie sprzątanie nie następuje wcale
    en:
      - The local administrator account is signed out once the delay has passed, including during longer works
      - The harsher variant also closes running processes and will cut a restore or a migration off halfway
      - A task signing in with this account on a schedule will read a password that stops being valid shortly afterwards
      - The symptom is a task that works once and fails the second time, the worst kind of fault to diagnose
      - Without the delay described in a separate item, no clearing up happens at all
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa zadanie albo agent logujący się cyklicznie kontem lokalnego administratora i nie ma dla niego zamiennika
      - Trwają prace prowadzone tym kontem, dłuższe niż ustalona zwłoka, i nie da się ich wznowić po wylogowaniu
    en:
      - A task or agent signs in with the local administrator account on a schedule and there is no replacement for it
      - Work carried out under this account is under way, longer than the set delay, and cannot be resumed after a sign-out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three means the password is reset and the account signed out;
      # zero leaves everything as it was.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PostAuthenticationActions'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ^(3|5|11)$
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PostAuthenticationActions' -ErrorAction SilentlyContinue).'PostAuthenticationActions'
    [pscustomobject]@{
      path        = $path
      name        = 'PostAuthenticationActions'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Find anything that signs in with this account on a schedule before this.
    # Such a task works once and fails the second time, which is the worst kind
    # of fault to diagnose.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Three is the mildest of the compliant variants: the password is reset and
    # the account signed out, with running processes left alone.
    Set-ItemProperty -Path $path -Name 'PostAuthenticationActions' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Pozostałe reguły LAPS dbają o to, żeby hasło było dobre i leżało
    w bezpiecznym miejscu. Żadna nie mówi, co się dzieje po tym, jak hasło
    zostało odczytane i użyte — a właśnie wtedy zaczyna krążyć poza
    katalogiem: w schowku, w historii polecenia, w pamięci narzędzia.

    Wymiar serwerowy: sesji lokalnego administratora na serwerze nikt nie
    kończy, bo nikt przy nim nie siedzi. Wylogowanie z tej reguły jest
    jedynym mechanizmem, który tę sesję zamknie.

    Naprawa wpisuje wariant najłagodniejszy z dopuszczalnych, bo wariant
    zamykający procesy przerwałby odtwarzanie albo migrację w połowie.
  en: |
    The other LAPS rules see to it that the password is a good one and lies
    in a safe place. None of them says what happens after it has been read
    and used - and that is exactly when it begins to circulate outside the
    directory: in a clipboard, in a command history, in a tool's memory.

    The server dimension: nobody ends a local administrator session on a
    server, because nobody is sitting at it. The sign-out from this rule is
    the only mechanism that will close that session.

    The remediation writes the mildest of the permitted variants, because
    the one that closes processes would cut a restore or a migration off
    halfway.
