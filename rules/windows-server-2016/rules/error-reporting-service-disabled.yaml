id: win2016-error-reporting-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zgłaszania błędów wyłączona
    en: The error reporting service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zbiera dane o awariach programów i systemu, przygotowuje z nich
    raport i wysyła go do producenta.

    Rzecz do zrozumienia dotyczy tego, co się w takim raporcie znajduje.
    Nie jest to komunikat o błędzie ani numer, tylko obraz pamięci procesu
    w chwili awarii — czyli to, co program w danej chwili przetwarzał.
    Trafia tam wszystko, co proces miał u siebie: ścieżki, nazwy plików,
    fragmenty dokumentów, ciągi zapytań, czasem poświadczenia.

    Raport wychodzi poza organizację. Nie da się go przejrzeć przed
    wysłaniem i nie da się ustalić po fakcie, co dokładnie w nim było.
    Na stanowisku roboczym jest to kłopot; na serwerze przetwarzającym dane
    organizacji jest to wyciek, którego nikt nie rejestruje.

    Druga strona sprawy dotyczy tego, co raport mówi o maszynie. Zawiera
    wersje składników i nazwy modułów, a więc opis stanu maszyny na dzień
    awarii. Kto przechwyci taki raport po drodze, dostaje opis, którego
    w inny sposób musiałby szukać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    fragmentów pamięci procesów tej maszyny wysyłanych poza organizację
    oraz do opisu jej składników i ich wersji.
  en: |
    The service gathers data about failures of programs and of the system, prepares a report
    from it and sends it to the maker.

    What has to be grasped concerns what is in such a report. It is no error message and no
    number, but an image of the process's memory at the moment of the failure - which is to
    say what the program was working on just then. Everything the process had by it lands
    there: paths, file names, fragments of documents, query strings, at times credentials.

    The report leaves the organisation. It cannot be looked over before sending and it cannot
    be established afterwards what exactly was in it. At a workstation that is a trouble; on
    a server working with the organisation's data it is a leak nobody records.

    The other side of the matter concerns what the report says about the machine. It holds
    the versions of components and the names of modules, and so a description of the
    machine's state on the day of the failure. Whoever catches such a report on the way gets
    a description they would otherwise have to seek.

    What an attacker gains while the item goes unmet: access to fragments of this machine's
    process memory sent outside the organisation, and to a description of its components and
    their versions.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, co na tej maszynie
    czyta zapisy o awariach.

    Rzecz, która bywa zaskoczeniem: wyłączenie usługi zatrzymuje nie tylko
    wysyłanie, ale i tworzenie zapisu lokalnego. Znika zrzut pamięci
    odkładany na dysku przy awarii programu — ten sam, który służy do
    ustalenia, dlaczego program padł.

    Skutek dotyczy więc diagnostyki własnej, a nie tylko wysyłki na
    zewnątrz. Jeżeli w tej organizacji ktoś rozwiązuje problemy
    z aplikacjami na podstawie zrzutów, straci źródło, którego nie da się
    odtworzyć po fakcie. Awaria, która zdarzy się raz na miesiąc, przestanie
    zostawiać po sobie cokolwiek.

    Drugi przypadek dotyczy nadzoru zbierającego zdarzenia o awariach
    aplikacji. Zdarzenia w dzienniku pozostają, ale bez szczegółów, więc
    raport z nadzoru zrobi się uboższy, nie pusty.

    Rozwiązanie pośrednie istnieje i warto je nazwać: zapis lokalny da się
    zachować, a wysyłanie zablokować osobnym ustawieniem. Kto potrzebuje
    zrzutów, powinien wybrać tę drogę zamiast wyłączać usługę.

    Czego to nie psuje: dzienników zdarzeń, usług, sieci, uwierzytelniania,
    aktualizacji systemu.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whatever on this machine reads
    the records of failures.

    A thing that at times surprises: switching the service off stops not only the sending but
    the making of the local record. The memory dump laid down on disk at a program's failure
    goes away - the same one used to establish why the program fell over.

    The consequence therefore touches one's own diagnostics and not only the sending outward.
    If somebody in this organisation settles troubles with applications from dumps, they will
    lose a source that cannot be made again afterwards. A failure happening once a month will
    stop leaving anything behind it.

    The second case concerns monitoring gathering events about application failures. The
    events in the log remain but without their particulars, so the report from the monitoring
    will grow the poorer rather than empty.

    A middle solution exists and is worth naming: the local record can be kept and the sending
    blocked by a separate setting. Whoever needs dumps should take that road rather than
    switch the service off.

    What this does not break: event logs, services, the network, authentication, or system
    updates.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Zrzut pamięci odkładany na dysku przy awarii programu przestaje powstawać, a nie tylko przestaje być wysyłany
      - Kto rozwiązuje problemy z aplikacjami na podstawie zrzutów, traci źródło, którego nie da się odtworzyć po fakcie
      - Zdarzenia o awariach pozostają w dzienniku, ale bez szczegółów, więc raport z nadzoru robi się uboższy, a nie pusty
      - Dzienniki zdarzeń, usługi, sieć i aktualizacje systemu pozostają bez zmian
    en:
      - The memory dump laid down on disk at a program's failure stops being made, and not merely stops being sent
      - Whoever settles troubles with applications from dumps loses a source that cannot be made again afterwards
      - Events about failures remain in the log but without their particulars, so the report from the monitoring grows poorer rather than empty
      - Event logs, services, the network and system updates stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Problemy z aplikacjami na tej maszynie rozwiązuje się na podstawie zrzutów pamięci odkładanych przy awarii
      - Dostawca aplikacji wymaga zrzutu pamięci przy zgłaszaniu usterki i nie przyjmuje zgłoszeń bez niego
    en:
      - Troubles with applications on this machine are settled from memory dumps laid down at a failure
      - The application's supplier calls for a memory dump when a fault is reported and takes no report without one
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'WerSvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Local crash records stop being made as well, not only the sending. Check
    # what reads them before running.
    Stop-Service -Name 'WerSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WerSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'WerSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Punkt otwiera blok o tym, co maszyna zgłasza na zewnątrz przy usterce
    i komu. Wszystkie punkty bloku dotyczą tej samej rzeczy widzianej
    z różnych stron: dane opuszczają maszynę nie dlatego, że ktoś je
    wykradł, tylko dlatego, że system ma je wysyłać.

    Ten punkt jest w bloku jedyny, przy którym wdrożenie odbiera coś
    własnego, a nie tylko wstrzymuje wysyłkę. Warto to postawić wprost,
    bo domyślne odczytanie reguły brzmi „przestaniemy wysyłać dane na
    zewnątrz", a rzeczywiste znaczenie brzmi „przestaniemy też mieć własne
    zrzuty".

    Rozwiązanie pośrednie powinno trafić do interfejsu obok reguły, a nie
    tylko do opisu. Punkt, który da się wdrożyć w wariancie łagodniejszym,
    zasługuje na pokazanie tego wariantu — inaczej użytkownik wybiera
    między dwiema skrajnościami, z których żadnej nie chce.
  en: |
    The item opens the block about what the machine reports outward at a fault, and to whom.
    All the block's items concern the same thing seen from different sides: data leaves the
    machine not because somebody stole it but because the system is made to send it.

    This item is the only one in the block at which the rollout takes away something of one's
    own rather than merely holding back a sending. That is worth putting outright, the rule's
    default reading running "we will stop sending data outward" while its real meaning runs
    "we will also stop having our own dumps".

    The middle solution should reach the interface beside the rule and not the description
    alone. An item that can be rolled out in a milder variant deserves to have that variant
    shown - otherwise the user chooses between two extremes, neither of which they want.
