id: win10-create-symbolic-links-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie dowiązań symbolicznych tylko dla administratorów
    en: The making of symbolic links for administrators only
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo tworzenia dowiązań symbolicznych dla
    administratorów lokalnych.

    Dowiązanie symboliczne jest wpisem w systemie plików, który wygląda
    jak plik albo katalog, a w rzeczywistości wskazuje gdzie indziej.
    Program otwierający taki wpis dostaje zawartość miejsca docelowego
    i zwykle nie ma pojęcia, że został przekierowany.

    Na tym polega zagrożenie. Napastnik tworzy w katalogu zapisywalnym
    dowiązanie o nazwie, której spodziewa się program uprzywilejowany,
    i czeka, aż ten program do niego sięgnie. Zapis, który miał trafić do
    katalogu tymczasowego, trafia do pliku systemowego — a uprawnienia
    sprawdzane są dla programu, nie dla tego, kto dowiązanie założył.

    Rodzina ta nosi nazwę ataków na dowiązania i jest jednym z częstszych
    sposobów podniesienia uprawnień na maszynie, do której napastnik już
    wszedł jako zwykły użytkownik. Nie wymaga żadnej podatności w kodzie
    jądra — wystarczy program, który zapisuje do przewidywalnej ścieżki.

    Odnotowuję, że wykaz dopuszcza obok administratorów konto maszyn
    wirtualnych. Bez niego przestałaby działać obsługa kontenerów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    przekierowanie cudzego zapisu w miejsce przez siebie wybrane.
  en: |
    The setting reserves the right of making symbolic links to the local administrators.

    A symbolic link is an entry in the system of files that looks like a file or a folder and in truth points
    somewhere else. A program opening such an entry gets the contents of the place aimed at and commonly has no
    notion that it was turned aside.

    Therein lies the danger. An attacker makes, in a folder that may be written to, a link under a name a
    privileged program looks for, and waits for that program to reach for it. A writing that was to go to a folder
    of the passing hour goes to a file of the system - and the rights are checked for the program, not for whoever
    laid the link.

    That family goes by the name of attacks upon links and is among the commoner ways of raising rights upon a
    machine an attacker has already entered as an ordinary user. It calls for no weakness in the kernel's code - a
    program that writes to a road to be foretold is enough.

    I set down that the list lets in, beside the administrators, the account of virtual machines. Without it the
    serving of containers would cease to work.

    What an attacker gains while the item goes unmet: a way of turning another's writing aside into a place of
    their own choosing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest
    to, czy ktoś na maszynie tworzy dowiązania w ramach normalnej pracy.

    Miejscem najczęstszym są narzędzia programistyczne. Menedżery pakietów
    i systemy budowania tworzą dowiązania do katalogów z bibliotekami,
    żeby nie kopiować tych samych plików wielokrotnie. Po zmianie takie
    narzędzie zgłosi błąd uprawnień przy pierwszym dowiązaniu.

    Miejscem drugim jest obsługa kontenerów. Konto maszyn wirtualnych
    pozostaje w wykazie właśnie dlatego, a jego usunięcie zatrzymałoby
    uruchamianie obrazów.

    Odnotowuję, że domyślny wykaz na stanowisku roboczym zawiera już
    administratorów i konto maszyn wirtualnych. Zmiana jest wtedy zapisem
    stanu.

    Skutek pojawia się natychmiast, bez restartu i bez wylogowania.

    Czego to nie psuje: otwierania dowiązań już istniejących, pracy
    z plikami, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody upon the machine makes links in
    the ordinary course of work.

    The commonest place is the tools of programming. Managers of packages and systems of building make links to
    folders of libraries, so as not to copy the same files many times over. After the change such a tool will
    report a fault of rights at its first link.

    The second place is the serving of containers. The account of virtual machines stays in the list for just that
    reason, and the taking of it out would hold the running of images.

    I set down that the default list upon a working station already holds the administrators and the account of
    virtual machines. The change is then a setting down of a state.

    The consequence shows at once, with no restart and no signing out.

    What this does not break: the opening of links already standing, work with files, logging on, file shares, or
    printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Menedżery pakietów i systemy budowania zgłoszą błąd uprawnień przy pierwszym tworzonym dowiązaniu
      - Usunięcie z wykazu konta maszyn wirtualnych zatrzymałoby uruchamianie obrazów kontenerów
      - Domyślny wykaz na stanowisku roboczym zawiera już administratorów i konto maszyn wirtualnych
      - Skutek pojawia się natychmiast, bez restartu i bez wylogowania
      - Otwieranie dowiązań już istniejących, praca z plikami, logowanie i drukowanie pozostają bez zmian
    en:
      - Managers of packages and systems of building will report a fault of rights at the first link they make
      - The taking of the account of virtual machines out of the list would hold the running of images of containers
      - The default list upon a working station already holds the administrators and the account of virtual machines
      - The consequence shows at once, with no restart and no signing out
      - The opening of links already standing, work with files, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracują narzędzia programistyczne tworzące dowiązania z konta zwykłego użytkownika
      - Stanowisko służy do budowania obrazów kontenerów i wymaga dowiązań poza kontem administratora
    en:
      - Upon the machine work tools of programming that make links from an ordinary user s account
      - The station serves for the building of images of containers and calls for links beyond an administrator s account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-83-0)?|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreateSymbolicLinkPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeCreateSymbolicLinkPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateSymbolicLinkPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-symbolic-links

notes:
  pl: |
    Reguła bywa lekceważona, bo dowiązanie wygląda na drobiazg
    porządkowy. Warto, żeby aplikacja wyjaśniła, na czym polega tu
    przewaga napastnika: nie tworzy on niczego groźnego, tylko podstawia
    znak drogowy i pozwala, żeby to program uprzywilejowany pojechał
    w złą stronę.

    Argument wart postawienia wprost dotyczy tego, czyje uprawnienia są
    sprawdzane. System sprawdza uprawnienia programu, który plik otwiera,
    a nie tego, kto założył dowiązanie. Cała rodzina ataków opiera się na
    tej jednej właściwości i żadna łatka jej nie usunie, bo jest to
    zachowanie zamierzone.

    Odnotowuję konto maszyn wirtualnych w wykazie dopuszczalnym. Nie jest
    to ustępstwo, tylko warunek działania kontenerów — a wykaz zawężony
    do samych administratorów byłby w tym miejscu awarią, nie
    utwardzeniem.
  en: |
    The rule is at times made light of, a link looking like a small matter of tidiness. It is well that the
    application set out wherein the attacker's advantage lies here: they make nothing dangerous, only set up a
    sign upon the road and let the privileged program drive the wrong way.

    The argument worth putting outright touches whose rights are checked. The system checks the rights of the
    program that opens the file and not of whoever laid the link. The whole family of attacks rests upon that one
    property and no patch will take it away, it being behaviour that was meant.

    I set down the account of virtual machines in the list that is let in. It is no yielding but the condition of
    containers working - and a list narrowed to the administrators alone would in this place be a failure and no
    hardening.
