id: win2016-secure-boot-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Integrity > Boot
  title:
    pl: Bezpieczny rozruch włączony
    en: Secure boot switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy maszyna startuje z włączonym bezpiecznym rozruchem,
    czyli czy oprogramowanie układowe przyjmuje wyłącznie podpisany kod
    rozruchowy.

    Kolejność uruchamiania jest tu jedynym argumentem, jakiego trzeba.
    Oprogramowanie układowe ładuje program rozruchowy, ten ładuje jądro,
    jądro uruchamia wszystko pozostałe. Każdy z tych kroków ufa temu, co
    załadował, i nie ma sposobu, żeby krok późniejszy sprawdził krok
    wcześniejszy — bo ten wcześniejszy już się wykonał i mógł przygotować
    sobie widok, który zobaczy następny.

    Kod umieszczony przed jądrem jest więc poza zasięgiem wszystkiego, co
    system potrafi zrobić. Nie widzi go ochrona antywirusowa, nie widzą go
    mechanizmy kontroli sterowników, nie widzi go dziennik. Widzi go
    wyłącznie oprogramowanie układowe — i tylko wtedy, gdy zostało
    poproszone, żeby patrzeć.

    Bezpieczny rozruch jest tą prośbą. Oprogramowanie układowe sprawdza
    podpis każdego kolejnego elementu łańcucha, zanim odda mu sterowanie,
    i odmawia uruchomienia kodu, którego podpisu nie zna.

    Punkt jest sprawdzeniem stanu, nie ustawieniem. Bezpieczny rozruch
    włącza się w oprogramowaniu układowym maszyny, a nie z poziomu systemu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podmiany kodu rozruchowego tak, że wykona się przed jądrem i nie
    zostanie zauważony przez żaden mechanizm działający w systemie.
  en: |
    The item checks whether the machine starts with secure boot switched on, which is to
    say whether the firmware takes in only signed boot code.

    The order of starting is here the one argument needed. The firmware loads the boot
    program, that loads the kernel, the kernel starts all the rest. Each of those steps
    trusts what it loaded, and there is no way for a later step to check an earlier one -
    that earlier one having already run and been able to prepare for itself the view the
    next will see.

    Code placed before the kernel is therefore beyond the reach of everything the system
    can do. The antimalware guard does not see it, the mechanisms of driver control do not
    see it, the log does not see it. Only the firmware sees it - and only when it has been
    asked to look.

    Secure boot is that asking. The firmware checks the signature of each further element
    of the chain before handing control to it, and refuses to run code whose signature it
    does not know.

    The item is a check of state, not a setting. Secure boot is switched on in the
    machine's firmware and not from within the system.

    What an attacker gains while the item goes unmet: the chance to change the boot code so
    that it runs before the kernel and goes unnoticed by any mechanism working within the
    system.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powód jest nietypowy: rzecz
    rozstrzyga się poza systemem i bywa nieodwracalna bez ponownej
    instalacji.

    Warunek pierwszy dotyczy sposobu startu. Bezpieczny rozruch wymaga
    trybu rozruchowego z interfejsem układowym. Maszyna zainstalowana
    w trybie zgodności ze starszym rozruchem nie da się przełączyć samym
    ustawieniem — wymaga przekształcenia tablicy partycji, a w części
    przypadków ponownej instalacji systemu.

    Warunek drugi dotyczy tego, co maszyna ładuje. Włączenie bezpiecznego
    rozruchu na maszynie ze sterownikiem lub programem rozruchowym bez
    znanego podpisu kończy się tym, że maszyna nie wstaje. Dotyczy to
    zwłaszcza sterowników kontrolerów macierzowych sprzed lat, narzędzi
    obrazowania dysku i rozwiązań szyfrujących dysk spoza zestawu
    systemowego.

    Warunek trzeci dotyczy maszyn wirtualnych. Gość może korzystać
    z bezpiecznego rozruchu wyłącznie wtedy, gdy nadzorca to udostępnia
    i gdy maszynę utworzono w odpowiednim pokoleniu. Maszyna utworzona
    w pokoleniu starszym nie da się przełączyć — trzeba utworzyć nową.

    Wdrożenie wymaga dostępu do ustawień oprogramowania układowego, czyli
    konsoli fizycznej albo karty zarządzania. Jest to jedyny punkt w tym
    bloku, którego nie da się wykonać zdalnie z poziomu systemu.

    Czego to nie psuje: po udanym starcie nic w warstwie systemu nie
    zmienia się ani na jotę. Usługi, sieć, aplikacje i uwierzytelnianie
    pracują dokładnie tak jak wcześniej.

    Wymaga restartu; cofnięcie bywa trudne.
  en: |
    The class is "needs a planned rollout", and the reason is an unusual one: the matter is
    settled outside the system and is at times not to be undone without a reinstallation.

    The first condition concerns the manner of starting. Secure boot calls for a boot mode
    with the firmware interface. A machine installed in compatibility mode with the older
    boot cannot be switched over by a setting alone - it calls for the partition table to be
    converted, and in some cases for the system to be installed anew.

    The second condition concerns what the machine loads. Switching secure boot on where a
    driver or boot program has no known signature ends in the machine not coming up. That
    touches above all the drivers of array controllers of years past, tools for imaging a
    disk and disk encryption solutions from outside the system's own set.

    The third condition concerns virtual machines. A guest can use secure boot only where
    the supervisor makes it available and where the machine was created in a fitting
    generation. A machine created in an older generation cannot be switched over - a new one
    has to be made.

    The rollout calls for access to the firmware's settings, which is to say a physical
    console or a management card. It is the one item in this block that cannot be carried
    out remotely from within the system.

    What this does not break: after a successful start nothing in the system's layer changes
    by a jot. Services, the network, applications and authentication work exactly as before.

    Calls for a restart; the undoing is at times hard.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - drivers-and-devices
    - encryption-and-tls
  what_breaks:
    pl:
      - Maszyna zainstalowana w trybie zgodności ze starszym rozruchem nie da się przełączyć samym ustawieniem i wymaga przekształcenia tablicy partycji
      - Sterownik kontrolera macierzowego bez znanego podpisu sprawia, że maszyna nie wstaje po restarcie
      - Narzędzia obrazowania dysku i rozwiązania szyfrujące spoza zestawu systemowego mogą przestać się ładować
      - Gość utworzony w starszym pokoleniu maszyny wirtualnej nie da się przełączyć i trzeba utworzyć nowego
      - Po udanym starcie usługi, sieć, aplikacje i uwierzytelnianie pracują dokładnie tak jak wcześniej
    en:
      - A machine installed in compatibility mode with the older boot cannot be switched over by a setting alone and calls for the partition table to be converted
      - An array controller driver without a known signature makes the machine not come up after a restart
      - Tools for imaging a disk and encryption solutions from outside the system's own set may stop loading
      - A guest created in an older generation of virtual machine cannot be switched over and a new one has to be made
      - After a successful start services, the network, applications and authentication work exactly as before
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna startuje w trybie zgodności ze starszym rozruchem, a przekształcenie tablicy partycji nie zostało zaplanowane
      - Na maszynie pracuje sterownik rozruchowy lub narzędzie szyfrujące bez podpisu znanego oprogramowaniu układowemu
      - Nie ma dostępu do konsoli fizycznej ani do karty zarządzania, więc nieudany start zostawi maszynę bez drogi ratunku
    en:
      - The machine starts in compatibility mode with the older boot and no conversion of the partition table has been planned
      - A boot driver or an encryption tool without a signature known to the firmware works on the machine
      - There is no access to a physical console or to a management card, so a failed start will leave the machine with no road of rescue
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecureBoot\State'
      # The key exists only where the firmware knows the mechanism at all.
      # Its absence means a machine started the old way, and that is a finding
      # in itself rather than an inability to check.
      if (-not (Test-Path -Path $path)) { 'LEGACY_BOOT' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).UEFISecureBootEnabled
        if ($null -eq $value) { 'LEGACY_BOOT' }
        elseif ([int]$value -eq 1) { 'ENABLED' }
        else { 'DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

privileges: user
runnable: false

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/oem-secure-boot

notes:
  pl: |
    Punkt jest w całym zestawie wyjątkiem pod dwoma względami i oba warto
    w interfejsie pokazać.

    Pierwszy: nie ma polecenia naprawczego, bo nie ma czego wykonać
    z poziomu systemu. Bezpieczny rozruch włącza się w oprogramowaniu
    układowym, przy maszynie albo przez kartę zarządzania. Reguła jest
    wyłącznie do odczytu i nie ma przycisku uruchomienia — nie dlatego, że
    brakuje kopii zapasowej, tylko dlatego, że nie istnieje polecenie,
    które by to zrobiło. Rozróżnienie tych dwóch powodów jest warte
    pokazania użytkownikowi, bo znaczą co innego: w jednym przypadku regułę
    da się dopracować, w drugim nie.

    Drugi: wynik ma trzy stany, nie dwa. Maszyna może mieć bezpieczny
    rozruch włączony, mieć go wyłączony albo nie mieć go w ogóle, bo
    startuje starym sposobem. Trzeci stan jest najgorszy i wymaga
    najwięcej pracy, a przy zgłaszaniu dwustanowym zlewa się z drugim.
    Użytkownik, który przeczyta „wyłączone", pójdzie do ustawień płyty
    i będzie szukał przełącznika, którego tam nie ma.

    Kategoria krytyczna jest tu postawiona świadomie mimo wysokiego kosztu
    wdrożenia. Kryterium brzmi: co zyskuje napastnik, dopóki punkt
    pozostaje niespełniony — a zyskuje miejsce, którego nie ogląda żaden
    mechanizm działający w systemie. Koszt wdrożenia należy do drugiej osi
    i to ona ma powiedzieć, że rzecz wymaga planu.
  en: |
    The item is in the whole set an exception in two respects, and both are worth showing in
    the interface.

    The first: there is no remedial command, there being nothing to carry out from within
    the system. Secure boot is switched on in the firmware, at the machine or through a
    management card. The rule is read-only and has no run button - not for want of a backup
    but because no command that would do it exists. Telling those two reasons apart is worth
    showing the user, they meaning different things: in the one case the rule can be brought
    on, in the other it cannot.

    The second: the outcome has three states, not two. A machine may have secure boot
    switched on, have it switched off, or not have it at all, starting the old way. The third
    state is the worst and calls for the most work, and under a two-state reporting it runs
    together with the second. A user who reads "switched off" will go to the board's settings
    and look for a switch that is not there.

    The critical category is set here knowingly despite the rollout's high cost. The
    criterion runs: what an attacker gains while the item goes unmet - and they gain a place
    no mechanism working within the system looks at. The rollout's cost belongs to the second
    axis, and it is that which is to say the thing calls for a plan.
