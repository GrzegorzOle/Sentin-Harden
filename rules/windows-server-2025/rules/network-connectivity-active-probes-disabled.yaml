id: win2025-network-connectivity-active-probes-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Aktywne sprawdzanie dostępu do sieci wyłączone
    en: Active testing of network access switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza mechanizm, którym system co pewien czas sam sprawdza, czy
    ma dostęp do internetu — przez odpytanie ustalonego adresu zewnętrznego.

    Kategoria średnia, a chcę zacząć od tego, co ten mechanizm robi
    naprawdę, bo nazwa brzmi niewinnie. Maszyna cyklicznie łączy się
    z adresem poza organizacją i porównuje otrzymaną odpowiedź ze wzorcem.
    To jest stałe, przewidywalne, regularne połączenie wychodzące, zależne
    od tego, co odpowie strona zewnętrzna.

    Ważniejsza od samego ruchu jest konsekwencja tej zależności. Wynik
    sprawdzenia decyduje o tym, jak system zakwalifikuje sieć — a od
    kwalifikacji sieci zależy, który profil zapory zostanie zastosowany.
    Na serwerze to nie jest drobiazg: maszyna, która uzna sieć za inną niż
    jest, dostaje inny zestaw reguł zapory, niż przewidziano.

    Nie twierdzę, że da się tym sterować dowolnie. Twierdzę, że stan
    zabezpieczenia maszyny nie powinien zależeć od odpowiedzi, która
    przychodzi spoza organizacji, a serwer i tak nie potrzebuje wiedzieć,
    czy ma dostęp do internetu — on ma wykonywać swoje zadanie
    w przewidzianej sieci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: regularny,
    przewidywalny ruch wychodzący, a przy sprzyjających warunkach wpływ na
    to, jak maszyna zakwalifikuje swoją sieć.
  en: |
    The item switches off the mechanism by which the system periodically
    tests for itself whether it has internet access - by querying a fixed
    outside address.

    The category is medium, and I want to start with what this mechanism
    really does, because the name sounds innocent. The machine connects on a
    cycle to an address outside the organisation and compares the answer it
    gets against a pattern. That is a steady, predictable, regular outbound
    connection, dependent on what the outside party answers.

    More important than the traffic itself is the consequence of that
    dependence. The result of the test decides how the system classifies the
    network - and which firewall profile is applied depends on that
    classification. On a server this is no trifle: a machine that takes the
    network for something other than it is gets a different set of firewall
    rules than was intended.

    I am not claiming this can be steered at will. I claim that a machine's
    state of protection should not depend on an answer arriving from outside
    the organisation, and that a server does not need to know whether it has
    internet access anyway - it is there to do its job in the network it was
    put in.

    What an attacker gains while the item goes unmet: regular, predictable
    outbound traffic, and in favourable conditions a hand in how the machine
    classifies its network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i tym razem skutek jest widoczny gołym
    okiem, więc uprzedzenie ludzi jest tu ważniejsze niż samo wdrożenie.

    Wskaźnik sieci przestanie pokazywać stan dostępu do internetu.
    Zobaczysz oznaczenie mówiące o braku dostępu albo o dostępie
    nieokreślonym, mimo że sieć działa i wszystko przez nią przechodzi.
    To jest zmiana kosmetyczna, ale kosztowna w innym sensie: kto jej nie
    zna, zacznie diagnozować awarię, której nie ma. Dlatego ten punkt
    trzeba opisać w dokumentacji maszyny, a nie tylko zastosować.

    Skutek drugi jest poważniejszy i to on decyduje o klasie. Część
    oprogramowania pyta system o stan połączenia, zamiast próbować się
    połączyć. Takie programy uznają, że sieci nie ma, i nie wykonają swojej
    pracy — dotyczy to zwłaszcza klientów aktualizacji, narzędzi
    kopii zapasowych wysyłających dane na zewnątrz i agentów
    monitorujących. Trzeba to sprawdzić na tej konkretnej maszynie, bo
    zależy od tego, co na niej stoi.

    Czego to nie psuje: samej łączności. Nic nie traci dostępu do sieci —
    zmienia się wyłącznie to, czy system o tym dostępie wie i czy umie
    o nim powiedzieć.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and this time the effect is visible to the
    naked eye, so warning people matters more here than the rollout itself.

    The network indicator will stop showing the state of internet access. You
    will see a mark saying there is no access, or that access is
    indeterminate, even though the network works and everything passes
    through it. That is a cosmetic change but a costly one in another sense:
    anybody who does not know about it will start diagnosing a fault that
    does not exist. Which is why this item has to be written into the
    machine's documentation, not merely applied.

    The second effect is graver and it is what settles the class. Some
    software asks the system about the state of the connection instead of
    trying to connect. Such programs will take it that there is no network
    and will not do their work - this concerns update clients, backup tools
    that send data outside, and monitoring agents in particular. It has to be
    checked on this particular machine, because it depends on what stands on
    it.

    What this does not break: connectivity itself. Nothing loses access to
    the network - what changes is only whether the system knows about that
    access and can say so.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Wskaźnik sieci przestaje pokazywać stan dostępu do internetu, mimo że sieć działa i wszystko przez nią przechodzi
      - Kto tej zmiany nie zna, zacznie diagnozować awarię, której nie ma — punkt trzeba opisać w dokumentacji maszyny
      - Oprogramowanie pytające system o stan połączenia zamiast próbować się połączyć uzna, że sieci nie ma
      - Dotyczy to zwłaszcza klientów aktualizacji, narzędzi kopii zapasowych wysyłających dane na zewnątrz i agentów monitorujących
    en:
      - The network indicator stops showing the state of internet access, though the network works and everything passes through it
      - Anybody who does not know about the change will start diagnosing a fault that does not exist - write the item into the machine's documentation
      - Software that asks the system about the connection state instead of trying to connect will take it that there is no network
      - This concerns update clients, backup tools that send data outside, and monitoring agents in particular
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracują narzędzia kopii zapasowych, agenty monitorujące albo klienci aktualizacji pytające system o stan połączenia
    en:
      - Backup tools, monitoring agents or update clients on the machine ask the system about the connection state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
      $name = 'NoActiveProbe'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    $name = 'NoActiveProbe'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The test's result decides how the network is classified, and that decides
    # which firewall profile applies - a state of protection resting on an answer
    # from outside the organisation. Connectivity itself is untouched, but the
    # indicator will report no access and some software believes it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoActiveProbe' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Nazwa brzmi niewinnie, a maszyna cyklicznie łączy się z adresem poza
    organizacją i porównuje odpowiedź ze wzorcem. Stałe, przewidywalne
    połączenie wychodzące, zależne od tego, co odpowie strona zewnętrzna.

    Ważniejsza jest konsekwencja tej zależności: wynik sprawdzenia decyduje
    o tym, jak system zakwalifikuje sieć, a od kwalifikacji zależy, który
    profil zapory zostanie zastosowany. Stan zabezpieczenia maszyny nie
    powinien zależeć od odpowiedzi przychodzącej spoza organizacji.

    Skutek widoczny: wskaźnik sieci pokaże brak dostępu, mimo że sieć
    działa. Opisz to w dokumentacji maszyny, bo kto tego nie wie, zacznie
    diagnozować awarię, której nie ma.
  en: |
    The name sounds innocent, yet the machine connects on a cycle to an
    address outside the organisation and compares the answer against a
    pattern. A steady, predictable outbound connection, dependent on what the
    outside party answers.

    The consequence of that dependence matters more: the test's result
    decides how the system classifies the network, and the classification
    decides which firewall profile is applied. A machine's state of
    protection should not rest on an answer arriving from outside the
    organisation.

    The visible effect: the network indicator will show no access even though
    the network works. Write it into the machine's documentation, because
    anybody who does not know will start diagnosing a fault that does not
    exist.
