id: win2016-application-telemetry-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Wysyłanie danych o uruchamianych programach wyłączone
    en: Sending data about started programs switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wysyłanie danych o programach uruchamianych na tej
    maszynie.

    Mechanizm powstał po to, żeby producent systemu wiedział, jakie
    oprogramowanie ludzie uruchamiają i które z niego przestaje działać po
    aktualizacji. Zbiera nazwy uruchamianych programów, ich wersje i sposób,
    w jaki zostały uruchomione.

    Na stanowisku roboczym jest to informacja o tym, z czego ktoś korzysta.
    Na serwerze jest to coś innego: spis zadań, które ta maszyna wykonuje.
    Uruchamiane programy na serwerze to narzędzia administracyjne, skrypty
    obsługi, agenty kopii zapasowych, klienci baz danych — czyli opis roli
    maszyny, sporządzany na bieżąco.

    Rozróżnienie warte zapamiętania: punkt ten nie wyłącza mechanizmu
    zgodności, dzięki któremu starsze oprogramowanie uruchamia się na
    nowszym systemie. To dwie różne rzeczy pod jedną nazwą w interfejsie,
    i druga zostaje włączona.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: bieżący spis
    tego, co i czym się na tej maszynie robi.
  en: |
    The setting switches off the sending of data about the programs started on this machine.

    The mechanism came about so that the system's maker should know what software people start and
    which of it ceases to work after an update. It gathers the names of started programs, their
    versions and the manner of their starting.

    At a workplace that is word of what somebody uses. On a server it is something else: a register of
    the tasks this machine carries out. The programs started on a server are administrative tools,
    attendance scripts, backup agents, database clients - which is to say a description of the
    machine's role, drawn up as it goes.

    A distinction worth keeping in mind: this item does not switch off the compatibility mechanism by
    which older software runs on a newer system. They are two different things under one name in the
    interface, and the second stays on.

    What an attacker gains while the item goes unmet: a running register of what is done on this
    machine and with what.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm ten niczego nie robi dla maszyny, na której działa — zbiera
    dane dla producenta. Jego wyłączenie nie zmienia zachowania żadnego
    programu, żadnej usługi ani żadnej aktualizacji.

    Jedyna rzecz, o którą warto zapytać, dotyczy narzędzi analizy zgodności
    używanych przy migracjach. Część z nich czyta dane zebrane właśnie tym
    mechanizmem, żeby ocenić, co przestanie działać po zmianie wersji
    systemu. Na maszynie, na której taka analiza jest planowana, warto tę
    regułę wdrożyć po niej, a nie przed.

    Nie wiąże się z tym restart ani zatrzymanie usługi.

    Czego to nie psuje: uruchamiania programów, mechanizmu zgodności
    ze starszym oprogramowaniem, usług, sieci, aktualizacji. Nie ma znanych
    regresji.
  en: |
    The class is "no disruption".

    That mechanism does nothing for the machine it works on - it gathers data for the maker. Switching
    it off changes the behaviour of no program, no service and no update.

    The one thing worth asking about concerns tools of compatibility analysis used at migrations. Some
    of them read the data gathered by just that mechanism, so as to judge what will cease to work after
    a change of the system's version. On a machine where such an analysis is planned, this rule is worth
    rolling out after it rather than before.

    No restart or stopping of a service goes with it.

    What this does not break: the starting of programs, the compatibility mechanism for older software,
    services, the network, or updates. There are no known regressions.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia analizy zgodności używane przy migracjach tracą źródło danych o uruchamianych programach
      - Na maszynie, na której taka analiza jest planowana, regułę warto wdrożyć po niej, a nie przed
      - Mechanizm zgodności pozwalający uruchamiać starsze oprogramowanie pozostaje włączony
      - Uruchamianie programów, usługi, sieć i aktualizacje pozostają bez zmian
    en:
      - Tools of compatibility analysis used at migrations lose their source of data about started programs
      - On a machine where such an analysis is planned the rule is worth rolling out after it rather than before
      - The compatibility mechanism letting older software run stays switched on
      - The starting of programs, services, the network and updates stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie planowana jest analiza zgodności przed zmianą wersji systemu i korzysta ona z tych danych
    en:
      - An analysis of compatibility before a change of the system's version is planned on this machine and it uses those data
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is the reverse of the setting's name in the editor: zero means
      # the sending is switched off.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'AITEnable'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'AITEnable'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This switches off the watching of started programs, not the compatibility
    # mechanism that lets older software run on a newer system - those are
    # different things and the latter stays on.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AITEnable' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Punkt jest trzeci w bloku i pierwszy, który nie dotyczy kanału
    systemowego, tylko osobnego mechanizmu o własnej nazwie i własnej
    gałęzi rejestru. Warto to zauważyć, bo ktoś, kto wyłączył dane
    diagnostyczne, ma prawo sądzić, że wyłączył wszystko.

    Wartość tej reguły na serwerze jest inna niż na stanowisku roboczym
    i warto to powiedzieć wprost. Na stanowisku zbierany jest obraz
    przyzwyczajeń człowieka; na serwerze — obraz roli maszyny. Druga rzecz
    jest z punktu widzenia kogoś szukającego drogi wejścia warta więcej,
    bo mówi, co na tej maszynie stoi i czym się to obsługuje.

    Kategoria niska przy poziomie drugim odzwierciedla to, że kanał ten sam
    w sobie żadnej drogi nie otwiera. Nazwanie go w opisie spisem zadań,
    a nie ogólnie telemetrią, jest jedyną rzeczą, która pozwala użytkownikowi
    ocenić, czy to dla niego ma znaczenie.

    Odnotowuję rozróżnienie między dwoma mechanizmami noszącymi w interfejsie
    podobną nazwę. Pomylenie ich prowadzi do odpuszczenia tego punktu
    z obawy przed zepsuciem zgodności starszego oprogramowania — obawy
    całkowicie bezpodstawnej.
  en: |
    The item is the third in the block and the first that concerns not the system channel but a separate
    mechanism with a name of its own and a registry branch of its own. That is worth noticing, whoever
    switched the diagnostic data off having a right to hold that they switched everything off.

    This rule's value on a server is other than at a workplace and that is worth saying outright. At a
    workplace a picture of a person's habits is gathered; on a server - a picture of the machine's role.
    The second is, from the point of view of somebody looking for a road in, worth more, saying as it
    does what stands on this machine and what attends it.

    The low category at the second level reflects that the channel of itself opens no road. Naming it in
    the description a register of tasks rather than telemetry in general is the one thing that lets the
    user judge whether it matters to them.

    Worth noting the distinction between two mechanisms bearing a like name in the interface. Confusing
    them leads to this item being let go from a fear of breaking the compatibility of older software - a
    fear wholly groundless.
