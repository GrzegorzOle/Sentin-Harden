id: win2016-upnp-device-host-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Ogłaszanie maszyny jako urządzenia sieciowego wyłączone
    en: Announcing the machine as a network device switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę pozwalającą tej maszynie ogłaszać się w sieci
    lokalnej jako urządzenie i udostępniać w ten sposób swoje możliwości.

    Jest to druga połowa mechanizmu, którego pierwszą opisuje reguła
    poprzednia. Tamta dotyczyła słuchania cudzych ogłoszeń; ta dotyczy
    wysyłania własnych.

    Usługa rozgłasza w segmencie sieci opis maszyny i wystawia adres, pod
    którym można ten opis pobrać, a następnie wywołać wymienione
    w nim czynności. Wywołanie takie nie wymaga uwierzytelnienia, bo
    mechanizm powstał dla urządzeń domowych, w których uwierzytelnienia
    nie przewidziano.

    Waga tego punktu jest mniejsza niż poprzedniego i trzeba to powiedzieć
    wprost. Serwer nie wystawia przez ten mechanizm niczego wartościowego —
    usługa ogłasza to, co ma zgłoszone, a na serwerze zwykle nie ma
    zgłoszonego nic. Wartość punktu leży w usunięciu nasłuchującego
    interfejsu i w zaprzestaniu ogłaszania, że maszyna tu jest.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: darmowy
    spis maszyn w segmencie sieci wraz z ich opisem oraz nasłuchujący
    interfejs nieuwierzytelniony, którego na serwerze być nie powinno.
  en: |
    The setting switches off the service letting this machine announce itself on the
    local network as a device and share its abilities that way.

    It is the second half of the mechanism whose first half the previous rule
    describes. That one concerned listening to others' announcements; this one
    concerns sending one's own.

    The service broadcasts a description of the machine into the network segment and
    puts out an address at which that description can be fetched and the acts named in
    it then called. Such a call needs no authentication, the mechanism having been made
    for home devices where none was foreseen.

    This item's weight is less than the previous one's and that has to be said
    outright. A server puts out nothing of value by this mechanism - the service
    announces what it has registered, and on a server as a rule nothing is registered.
    The item's worth lies in removing a listening interface and in ceasing to announce
    that the machine is here.

    What an attacker gains while the item goes unmet: a free register of the machines
    in a network segment along with their descriptions, and an unauthenticated
    listening interface that should not be on a server.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Usługa na serwerze nie jest do niczego używana i na większości wydań
    serwerowych nie startuje sama. Nie zależy od niej żadna rola serwerowa,
    żaden mechanizm systemowy ani żadne uwierzytelnianie.

    Jedyne zastosowanie, jakie ta usługa ma na serwerze, to udostępnianie
    zawartości multimedialnej urządzeniom w sieci domowej — funkcja obecna
    w systemie, ale na serwerze niestosowana. Gdyby maszyna faktycznie
    pełniła taką rolę, punkt byłby do odpuszczenia; poza tym przypadkiem
    nie ma czego sprawdzać.

    Wyłączenie usługi wymaga jej zatrzymania, co trwa chwilę i niczego
    w tym czasie nie przerywa.

    Czego to nie psuje: sieci, dostępu do plików, logowania, usług
    serwerowych, drukowania.
  en: |
    The class is "no disruption".

    The service is used for nothing on a server and on most server releases does not
    start of itself. No server role depends on it, no system mechanism and no
    authentication.

    The one use this service has on a server is the sharing of media contents with
    devices on a home network - a function present in the system but not used on a
    server. Were the machine truly to fill such a role the item would be one to let
    go; beyond that case there is nothing to check.

    Switching the service off calls for it to be stopped, which takes a moment and
    breaks off nothing in that time.

    What this does not break: the network, access to files, signing in, server roles,
    or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Udostępnianie zawartości multimedialnej urządzeniom w sieci przestanie działać, ale na serwerze funkcja ta nie jest stosowana
      - Maszyna przestanie ogłaszać się w sieci lokalnej jako urządzenie
      - Zatrzymanie usługi trwa chwilę i niczego w tym czasie nie przerywa
      - Sieć, dostęp do plików, logowanie, role serwerowe i drukowanie pozostają bez zmian
    en:
      - The sharing of media contents with devices on the network will stop working, but on a server that function is not used
      - The machine will stop announcing itself on the local network as a device
      - Stopping the service takes a moment and breaks off nothing in that time
      - The network, access to files, signing in, server roles and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna faktycznie udostępnia zawartość multimedialną urządzeniom w sieci i jest to jej zamierzona rola
    en:
      - The machine truly shares media contents with devices on the network and that is its intended role
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'upnphost' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The machine stops announcing itself as a device on the local network.
    # Nothing on a server depends on this.
    Stop-Service -Name 'upnphost' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'upnphost' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'upnphost' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Punkt zamyka blok i jest w nim najsłabszy, co warto powiedzieć wprost.
    Kategoria niska opisuje rzeczywistą wagę: usługa nie wystawia na
    serwerze niczego, co napastnikowi by się przydało, a wartość leży
    w porządku — jeden nasłuchujący interfejs mniej i jedno ogłoszenie
    mniej.

    Wdrażać warto razem z regułą poprzednią. Obie są w klasie bez
    uciążliwości, obie dotyczą tego samego mechanizmu, a rozdzielenie ich
    nie daje nic poza dwoma zatrzymaniami usług zamiast jednego.

    Blok liczy sześć reguł i dzieli się wedle tego, co maszyna robi
    z siecią: dwie o przyjmowaniu zdalnych wywołań i pytaniu o drogę,
    jedna o pakietach niosących własną trasę, jedna o ruchu wysyłanym
    z własnej inicjatywy, dwie o mechanizmie ogłoszeń w segmencie. Trzy
    wymagają restartu albo świadomego wdrożenia, trzy idą hurtem.
  en: |
    The item shuts the block and is the weakest in it, which is worth saying outright.
    The low category describes the real weight: the service puts out nothing on a
    server an attacker would find useful, and the worth lies in tidiness - one
    listening interface fewer and one announcement fewer.

    It is worth rolling out together with the previous rule. Both are of the class no
    disruption, both concern the same mechanism, and parting them gives nothing beyond
    two stoppings of services instead of one.

    The block counts six rules and falls out by what the machine does with the
    network: two about taking in remote calls and asking the way, one about packets
    carrying their own route, one about traffic sent on its own initiative, two about
    the mechanism of announcements in a segment. Three call for a restart or a planned
    rollout, three go in bulk.
