id: win2025-removable-media-format-eject-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Formatowanie i wysuwanie nośników wymiennych zastrzeżone dla administratorów
    en: Formatting and ejecting removable media reserved for administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, kto na tej maszynie może sformatować
    i wysunąć nośnik wymienny sformatowany systemem plików obsługującym
    uprawnienia.

    Kategorię trzymam niską i nie podnoszę jej dlatego, że rzecz dzieje
    się na serwerze. Punkt nie broni przed wyniesieniem danych, bo
    skopiować plik nadal można. Broni przed zniszczeniem zawartości
    nośnika, na którym uprawnienia w ogóle coś znaczą, i przed
    obejściem tych uprawnień przez sformatowanie nośnika od nowa. To
    jest wartość porządkowa i tak ją nazywam.

    Na serwerze rzecz rozpada się na dwa zupełnie różne przypadki
    i warto je rozdzielić, zamiast pisać jedną ocenę na oba.

    Przypadek pierwszy to serwer bez interaktywnych użytkowników —
    maszyna w serwerowni, do której loguje się wyłącznie obsługa.
    Wszyscy, którzy tu siadają, i tak są administratorami, więc
    ustawienie nie odbiera nikomu niczego. Jest czystą formalnością,
    zamykającą punkt w raporcie i nic poza tym.

    Przypadek drugi to serwer terminalowy albo maszyna, na której
    pracują ludzie. Tam uprawnienia mają znaczenie i ten sam punkt
    przestaje być formalnością — ale dokładnie wtedy przestaje też być
    niewidoczny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele,
    i uczciwiej to napisać niż uzasadniać wyższą kategorię. Możliwość
    zniszczenia albo przeformatowania nośnika wymiennego z konta bez
    uprawnień administratora.
  en: |
    The setting settles who on this machine may format and put out a removable medium formatted
    with a system of files serving permissions.

    I keep the category low and do not raise it for the thing happening on a server. The item is no
    guard against the carrying out of data, a file being still copyable. It guards against the
    undoing of the contents of a medium whereon permissions mean anything at all, and against the
    going round of those permissions by the formatting of the medium anew. That is a worth of good
    order and so I name it.

    On a server the thing falls into two wholly unlike cases and it is worth parting them rather
    than writing one reckoning for both.

    The first case is a server with no interactive users - a machine in the server room whereto
    only the staff sign in. All who sit down here are administrators anyway, so the setting takes
    nothing from anybody. It is sheer formality, shutting an item in the report and nothing beyond.

    The second case is a terminal server, or a machine whereon people work. There permissions
    matter and the same item stops being a formality - but just then it stops being unseen as well.

    What an attacker gains while the item goes unmet: little, and it is honester to write so than
    to plead a higher category. The means of undoing or of formatting anew a removable medium from
    an account without an administrator's rights.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno pytanie i od odpowiedzi zależy wszystko:
    czy ktokolwiek bez praw administratora pracuje na tej maszynie
    z nośnikami wymiennymi.

    Na serwerze bez interaktywnych użytkowników odpowiedź brzmi nie
    i zmiana nie robi nic. Można ją wtedy zastosować bez namysłu —
    a i tak zostawiam ją poza trybem hurtowym, bo tryb hurtowy nie zna
    roli maszyny, a ta reguła bez niej nie daje się ocenić.

    Na serwerze terminalowym odpowiedź bywa inna. Użytkownik bez praw
    administratora przestanie móc sformatować nośnik z poziomu systemu.
    Objawem jest odmowa przy próbie formatowania, zwykle bez
    wyjaśnienia, którego by się spodziewać — komunikat mówi o braku
    dostępu, a nie o zasadzie.

    Jest jeszcze jeden przypadek, właściwy dla serwerów, o którym warto
    pamiętać: maszyny, na których przygotowuje się nośniki. Serwery
    kopii zapasowych z wymiennymi dyskami, stanowiska przygotowujące
    obrazy, miejsca, gdzie dyski czyści się przed przekazaniem albo
    utylizacją. Jeżeli robi to zadanie uruchamiane na koncie usługowym
    bez uprawnień administratora, przestanie działać — i przestanie
    cicho, bo zadanie zgłosi tylko błąd dostępu w swoim dzienniku.

    Zapis plików na nośnik, odczyt z niego i bezpieczne odłączanie
    działają bez zmian — punkt dotyczy formatowania, a nie korzystania.

    Nie ma restartu maszyny. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    One question needs asking and everything hangs upon the answer: whether anybody without an
    administrator's rights works on this machine with removable media.

    On a server with no interactive users the answer is no and the change does nothing. It may then
    be applied without thought - and I still leave it outside the bulk mode, the bulk mode knowing
    nothing of a machine's part, and this rule not being reckonable without it.

    On a terminal server the answer is at times otherwise. A user without an administrator's rights
    will stop being able to format a medium from within the system. The symptom is a refusal at the
    trying of formatting, mostly without the setting forth one would look for - the message speaks
    of access wanting and not of a rule.

    There is one more case, proper to servers, worth keeping in mind: machines whereon media are
    made ready. Servers of backups with removable disks, stations making images, places where disks
    are cleaned before being handed on or done away with. If a task run on a service account
    without an administrator's rights does it, it will stop working - and stop quietly, the task
    reporting but a fault of access in its own log.

    The writing of files to a medium, the reading from it and its safe unhooking work unaltered -
    the item bears on formatting and not on use.

    There is no restart of the machine. The change holds after signing in anew.

implementation_consequences:
  impact_areas:
    - removable-media
  what_breaks:
    pl:
      - Użytkownik bez praw administratora nie sformatuje nośnika wymiennego z poziomu systemu
      - Zadanie kopii zapasowej na koncie usługowym bez uprawnień przestanie przygotowywać nośniki wymienne
      - Czyszczenie dysków przenośnych przed przekazaniem będzie wymagać konta z uprawnieniami
      - Na serwerze bez interaktywnych użytkowników zmiana nie zmieni niczego, bo wszyscy są administratorami
    en:
      - A user without an administrator's rights will not format a removable medium from within the system
      - A task of backup on a service account without rights will stop making removable media ready
      - The cleaning of portable disks before their handing on will take an account with rights
      - On a server with no interactive users the change alters nothing, all being administrators
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze terminalowym ludzie przygotowują nośniki wymienne z kont bez praw administratora
      - Zadanie kopii zapasowej formatuje nośniki z konta usługowego bez uprawnień administratora
    en:
      - On a terminal server people make removable media ready from accounts without an administrator's rights
      - A task of backup formats media from a service account without an administrator's rights
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is kept as text, not a number, so it is compared as text.
      # Reading it numerically would turn an absent value into a zero and report
      # a machine with no setting at all as satisfying the item.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'AllocateDASD'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'AllocateDASD'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllocateDASD' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/devices-allowed-to-format-and-eject-removable-media

notes:
  pl: |
    Wartość jest przechowywana jako tekst, nie liczba. Zapisanie jej
    jako liczby sprawia, że system ustawienia nie widzi, a reguła
    zgłasza je jako spełnione — dlatego polecenie naprawcze i wycofanie
    wymuszają typ tekstowy, a odczyt porównuje tekstowo.

    Ocena tej reguły zależy od roli maszyny bardziej niż jakakolwiek
    inna w tej paczce. Na serwerze bez interaktywnych użytkowników jest
    to czysta formalność. Na serwerze terminalowym z kilkudziesięcioma
    osobami nie jest. Dlatego zostaje poza trybem hurtowym: tryb
    hurtowy roli maszyny nie zna.

    Zasięg punktu jest węższy, niż sugeruje jego tytuł: dotyczy
    nośników sformatowanych systemem plików obsługującym uprawnienia.
    Panowanie nad nośnikami wymiennymi wymaga osobnych zasad
    dotyczących urządzeń, a nie tego ustawienia.
  en: |
    The value is kept as text and not as a number. The writing of it as a number leaves the system
    blind to the setting while the rule reports it met - wherefore the mending and the undoing
    force the text kind, and the reading matches as text.

    The reckoning of this rule hangs upon the machine's part more than any other in this pack. On a
    server with no interactive users it is sheer formality. On a terminal server with a few dozen
    people it is not. Therefore it stays outside the bulk mode: the bulk mode knows nothing of a
    machine's part.

    The item's reach is narrower than its title gives out: it bears on media formatted with a
    system of files serving permissions. Command over removable media takes separate rules bearing
    on devices and not this setting.
