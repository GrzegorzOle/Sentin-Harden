id: win10-defender-asr-adobe-reader-child-processes

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania programów przez czytnik dokumentów PDF
    en: PDF reader blocked from launching programs
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania czytnikowi dokumentów PDF uruchamiania innych
    programów.

    Dokument PDF jest formatem, któremu ufa się bardziej niż arkuszowi
    z makrem. Użytkownik uprzedzony, żeby nie otwierać załączników
    z makrami, otworzy dokument PDF bez wahania — a format ten obsługuje
    zarówno własne skrypty, jak i odnośniki uruchamiające programy
    zewnętrzne.

    Droga ta jest przez to skuteczniejsza niż droga przez pakiet biurowy,
    mimo że technicznie jest tym samym: dokument uruchamia program,
    a robotę wykonuje już narzędzie systemowe.

    Odnotowuję, że reguła nie dotyczy samego otwierania dokumentów ani
    odnośników prowadzących do stron. Dotyczy wyłącznie uruchamiania
    programów z poziomu czytnika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    programu przez dokument, któremu odbiorca ufa bardziej niż arkuszowi.
  en: |
    The rule forbids the reader of PDF documents to start other programs.

    The PDF document is a format trusted more than a sheet with a macro. A user warned not to open attachments
    with macros will open a PDF document without hesitating - and that format handles both scripts of its own and
    links starting outside programs.

    That road is by this the more telling than the road through the office suite, though in the working of it the
    same: a document starts a program, and a system tool does the work from there.

    I set down that the rule touches neither the opening of documents itself nor links leading to pages. It
    touches the starting of programs from the reader alone.

    What an attacker gains while the item goes unmet: the starting of a program through a document the receiver
    trusts more than a sheet.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Uruchamianie programów przez czytnik dokumentów nie występuje
    w pracy prawidłowej. Dokument PDF ma być odczytany, wydrukowany
    i podpisany — żadna z tych czynności nie wymaga uruchomienia
    programu zewnętrznego.

    Odnotowuję jedyne miejsce, w którym bywa spotykane: formularze
    z podpisem elektronicznym wywołujące zewnętrzne narzędzie
    podpisujące. Rozwiązanie to spotyka się rzadko, bo czytniki mają
    własną obsługę podpisu — ale bywa w obiegu urzędowym.

    Odczytywanie, wypełnianie formularzy, drukowanie i podpisywanie
    mechanizmem wbudowanym działają dalej bez zmian.

    Użytkownik zwykle niczego nie zobaczy, bo nie ma czego zatrzymać
    w pracy zwykłej.

    Czego to nie psuje: otwierania dokumentów, wypełniania formularzy,
    drukowania, podpisu wbudowanego, logowania, udziałów plikowych.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The starting of programs by the reader of documents does not come up in proper work. A PDF document is to be
    read, printed and signed - none of those acts calls for the starting of an outside program.

    I set down the one place at which it is at times met with: forms with an electronic signature calling an
    outside signing tool. That arrangement is met with seldom, the readers having a handling of the signature of
    their own - but it is at times in the round of offices.

    Reading, the filling of forms, printing and signing by the built-in mechanism go on unchanged.

    The user will as a rule see nothing, there being nothing to stop in ordinary work.

    What this does not break: the opening of documents, the filling of forms, printing, the built-in signature,
    logging on, or file shares.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - email-and-attachments
  what_breaks:
    pl:
      - Formularze wywołujące zewnętrzne narzędzie podpisujące przestają działać, co bywa w obiegu urzędowym
      - Rozwiązanie to spotyka się rzadko, bo czytniki mają własną obsługę podpisu elektronicznego
      - Odczytywanie, wypełnianie formularzy, drukowanie i podpis wbudowany działają dalej bez zmian
      - Reguła nie dotyczy otwierania dokumentów ani odnośników prowadzących do stron
      - Otwieranie dokumentów, drukowanie, logowanie, udziały plikowe i konta domenowe pozostają bez zmian
    en:
      - Forms calling an outside signing tool cease to work, which is at times in the round of offices
      - That arrangement is met with seldom, the readers having a handling of the electronic signature of their own
      - Reading, the filling of forms, printing and the built-in signature go on unchanged
      - The rule touches neither the opening of documents nor links leading to pages
      - The opening of documents, printing, logging on, file shares and domain accounts stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W obiegu urzędowym używane są formularze wywołujące zewnętrzne narzędzie podpisujące i nie ma dla nich zastępstwa
    en:
      - Forms calling an outside signing tool are used in the round of offices and there is no stand-in for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła domyka trójkę o drodze pocztowej i jest w niej jedyną bez
    uciążliwości. Warto, żeby aplikacja umieściła ją wysoko — kategoria
    wysoka przy klasie bez uciążliwości nadaje się do trybu zbiorczego.

    Argument wart postawienia wprost dotyczy zaufania. Ta sama czynność
    wykonana przez arkusz budzi czujność, a wykonana przez dokument PDF
    nie budzi żadnej. Użytkownik uprzedzony o makrach nie jest uprzedzony
    o dokumentach — i napastnik z tego korzysta.

    Odnotowuję, że wdrożenie nie wymaga pytania ludzi, czego używają.
    Uruchamianie programów przez czytnik nie jest częścią żadnego
    normalnego obiegu dokumentów, więc odpowiedź „nie robimy tego" jest
    tu pewna, a nie przypuszczalna.
  en: |
    The rule closes the three about the road by post and is the only one in it without disruption. It is well that
    the application set it high - a high category beside the class "no disruption" fits the bulk mode.

    The argument worth putting outright touches trust. That same act done by a sheet wakes watchfulness; done by a
    PDF document it wakes none. A user warned about macros is not warned about documents - and the attacker makes
    use of it.

    I set down that the rollout calls for no asking of people what they use. The starting of programs by the
    reader is part of no ordinary round of documents, so the answer "we do not do that" is here a sure one and not
    a guess.
