id: win10-rdp-encryption-level

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services
  title:
    pl: Wysoki poziom szyfrowania połączeń pulpitu zdalnego
    en: A high level of enciphering of joinings of the desk from afar
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby połączenie pulpitu zdalnego było szyfrowane
    w obie strony najsilniejszym dostępnym mechanizmem.

    Poziomy niższe różnią się nie tylko siłą klucza. Najniższy szyfruje
    wyłącznie kierunek od klienta do maszyny, zostawiając otwartą drogę
    powrotną — czyli to, co widać na ekranie.

    Zagrożeniem jest właśnie ten kierunek powrotny. Treść ekranu to
    dokumenty, adresy, zawartość okien i wszystko, co użytkownik ogląda
    w trakcie pracy. Nieszyfrowana daje podglądającemu pełny obraz sesji.

    Drugim zastrzeżeniem jest wybór po stronie klienta. Przy niższym
    ustawieniu to klient decyduje, jak mocno ma być szyfrowane,
    a napastnik podstawiający się za klienta wybierze najmniej.

    Odnotowuję, że przy warstwie opartej na protokole szyfrującym
    poziom ten traci znaczenie, bo szyfrowanie zapewnia protokół.
    Wdrożenie obu punktów jest jednak właściwe: to ustawienie chroni
    także te połączenia, które z jakiegoś powodu poszły starą warstwą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podgląd
    zawartości ekranu sesji pulpitu zdalnego.
  en: |
    The setting calls for a joining of the desk from afar to be enciphered both ways by the strongest mechanism to
    be had.

    The lower levels differ not in the strength of the key alone. The lowest enciphers only the road from the
    client to the machine, leaving the road back open - which is to say what is seen upon the screen.

    The danger is that very road back. The content of the screen is papers, addresses, what stands in the windows
    and everything the user looks at in the course of their work. Unenciphered it gives whoever looks on a full
    sight of the session.

    The second reservation is the choice upon the client's side. At the lower setting it is the client that
    settles how strongly it shall be enciphered, and an attacker setting themselves in a client's place will
    choose the least.

    I set down that with the layer resting upon the enciphering protocol that level loses its weight, the
    protocol seeing to the enciphering. The rolling out of both items is right nonetheless: this setting guards
    also those joinings that for some cause went by the old layer.

    What an attacker gains while the item goes unmet: a sight of what stands upon the screen of a session of the
    desk from afar.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy klientów, które
    nie obsługują najsilniejszego mechanizmu.

    Miejscem pierwszym są bardzo stare klienty i urządzenia terminalowe.
    Po zmianie zostaną odrzucone przy nawiązywaniu połączenia,
    a komunikat nie wskaże poziomu szyfrowania wprost.

    Miejscem drugim są maszyny w trybie zgodności z wymaganiami
    kryptograficznymi, w których zestaw dostępnych mechanizmów bywa
    zawężony. Warto sprawdzić, czy zawężenie nie wyklucza tego, którego
    punkt wymaga.

    Odnotowuję, że klienty z ostatnich lat obsługują ten poziom
    domyślnie, a przy warstwie opartej na protokole szyfrującym
    zagadnienie i tak rozstrzyga protokół.

    Skutek nie jest widoczny dla użytkownika, dopóki połączenie się
    udaje.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: sesji już otwartych, pracy programów, sieci,
    logowania przy maszynie, drukowania.
  en: |
    The class is "needs review", and the review touches clients that back not the strongest mechanism.

    The first place is very old clients and things of the terminal. After the change they will be refused at the
    making of the joining, and the message will not point to the level of enciphering outright.

    The second place is machines in a manner of standing by rules of ciphering, in which the set of mechanisms to
    be had is at times narrowed. It is worth looking at whether the narrowing shuts out the one the item calls
    for.

    I set down that clients of the last years back that level by default, and with the layer resting upon the
    enciphering protocol the question is settled by the protocol anyway.

    The consequence is not plain to the user so long as the joining succeeds.

    The consequence shows at once, with no restart.

    What this does not break: sessions already open, the work of programs, the network, logging on at the machine,
    or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-authentication
  what_breaks:
    pl:
      - Bardzo stare klienty i urządzenia terminalowe zostaną odrzucone przy nawiązywaniu połączenia
      - Komunikat nie wskaże poziomu szyfrowania wprost, więc przyczyna nie będzie oczywista
      - W trybie zgodności z wymaganiami kryptograficznymi zestaw mechanizmów bywa zawężony i warto to sprawdzić
      - Przy warstwie opartej na protokole szyfrującym zagadnienie rozstrzyga protokół
      - Sesje już otwarte, praca programów, sieć, logowanie przy maszynie i drukowanie pozostają bez zmian
    en:
      - Very old clients and things of the terminal will be refused at the making of the joining
      - The message will not point to the level of enciphering outright, so the cause will not be plain
      - In a manner of standing by rules of ciphering the set of mechanisms is at times narrowed and that is worth looking at
      - With the layer resting upon the enciphering protocol the question is settled by the protocol
      - Sessions already open, the work of programs, the network, logging on at the machine and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do maszyny łączą się bardzo stare klienty albo urządzenia terminalowe bez najsilniejszego mechanizmu
    en:
      - To the machine join themselves very old clients or things of the terminal without the strongest mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $ts = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $deny = (Get-ItemProperty -Path $ts -Name 'fDenyTSConnections' -ErrorAction Stop).fDenyTSConnections
      if ($deny -eq 1) {
        # The desk from afar is switched off, so there is no layer of session to guard.
        'NOT_APPLICABLE'
      } else {
        $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        $name = 'MinEncryptionLevel'
        if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
        else {
          $item = Get-ItemProperty -Path $path -ErrorAction Stop
          if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    $name = 'MinEncryptionLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
      -Name 'MinEncryptionLevel' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła bywa uznawana za drobiazg techniczny, a warto pokazać ją od
    strony tego, co przestaje być widoczne. Najniższy poziom zostawia
    kierunek powrotny otwarty, czyli to, co użytkownik ma na ekranie.

    Argument wart postawienia dotyczy tego, kto wybiera. Przy niższym
    ustawieniu siłę szyfrowania wybiera klient, a napastnik podstawiający
    się za klienta wybierze najmniej.

    Odnotowuję zależność od warstwy zabezpieczeń. Przy protokole
    szyfrującym punkt ten jest w praktyce nadmiarowy, ale zostaje jako
    zabezpieczenie połączeń, które poszły starą warstwą — i tak trzeba
    go tłumaczyć.
  en: |
    The rule is at times held a small technical matter, and it is worth showing from the side of what ceases to be
    seen. The lowest level leaves the road back open, which is to say what the user has upon their screen.

    The argument worth putting touches who chooses. At the lower setting the strength of the enciphering is chosen
    by the client, and an attacker setting themselves in a client's place will choose the least.

    I set down the hanging upon the layer of guarding. With the enciphering protocol this item is in practice more
    than is needed, but it stays as a guard of those joinings that went by the old layer - and so it is to be
    explained.
