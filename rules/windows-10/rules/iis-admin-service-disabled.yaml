id: win10-iis-admin-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa administracyjna serwera sieciowego wyłączona
    en: The service of the keeping of the web server switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę administracyjną serwera sieciowego, czyli
    warstwę zarządzającą jego konfiguracją i uruchamiającą usługi od niej
    zależne.

    Serwer sieciowy na stanowisku roboczym jest rzadkością i zwykle
    znalazł się tam przypadkiem: przy instalowaniu narzędzia
    deweloperskiego, przy włączaniu składnika systemu albo przy
    instalacji roli w całości.

    Zagrożenie polega na tym, że serwer sieciowy pozostawiony bez opieki
    nie jest utrzymywany. Nikt nie patrzy na jego konfigurację, nikt nie
    czyta jego dzienników, nikt nie wie, jakie aplikacje są w nim
    zarejestrowane. Działa i przyjmuje połączenia.

    Usługa administracyjna zasługuje na osobny punkt, bo od niej zależą
    inne. Zatrzymanie jej zatrzymuje także serwer przesyłania plików
    starszym protokołem, więc jedno działanie zamyka dwie drogi naraz.

    Odnotowuję, że punkt nie dotyczy serwera sieciowego jako roli na
    maszynie do tego przeznaczonej. Tam usługa ta jest potrzebna
    i wyłączenie jej byłoby zatrzymaniem pracy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: serwer
    sieciowy działający bez opieki na stanowisku roboczym.
  en: |
    The setting switches off the service of the keeping of the web server, which is to say the layer governing its
    setting up and setting going the services that hang upon it.

    A web server upon a working station is a rarity and commonly came there by chance: at the laying on of a tool
    of development, at the turning on of a part of the system, or at the laying on of an office whole.

    The danger lies in this, that a web server left unlooked-after is not kept up. Nobody looks at its setting up,
    nobody reads its records, nobody knows what workings are set down within it. It works and takes joinings.

    The service of keeping deserves an item apart, others hanging upon it. The stopping of it stops the server for
    the carrying of files by the older way of speaking as well, so one doing shuts two roads at once.

    I set down that the item touches not the web server as an office upon a machine meant for it. There that
    service is needed and the switching off of it would be a stopping of the work.

    What an attacker gains while the item goes unmet: a web server working unlooked-after upon a working station.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    na stanowisku nie stoi narzędzie korzystające z serwera sieciowego
    miejscowo.

    Miejscem wartym uwagi są środowiska deweloperskie. Część narzędzi
    uruchamia aplikację pod miejscowym serwerem sieciowym, żeby dało się
    ją otworzyć w przeglądarce. Po zmianie takie uruchomienie przestanie
    działać.

    Miejscem drugim są starsze programy branżowe z częścią przeglądarkową,
    które instalują miejscowy serwer i rejestrują w nim swoją aplikację.
    Zdarza się to w oprogramowaniu księgowym i magazynowym.

    Odnotowuję zależność: zatrzymanie tej usługi zatrzymuje także serwer
    przesyłania plików starszym protokołem. Jeżeli oba punkty są
    wdrażane, wystarczy kolejność, w której ten idzie jako drugi.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: przeglądania stron w internecie, dostępu do
    udziałów, pracy programów niekorzystających z miejscowego serwera,
    logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether there stands upon the station a tool
    using a web server on the spot.

    The place worth notice is settings of development. Some tools set a working going under a web server on the
    spot so that it may be opened in a browser. After the change such a setting going will cease to work.

    The second place is older programs of a trade with a part meant for a browser, which lay on a server on the
    spot and set their working down within it. That is met with in software of accounts and of stores.

    I set down the hanging together: the stopping of this service stops the server for the carrying of files by
    the older way of speaking too. If both items are being rolled out, it suffices that this one go second in
    order.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the looking over of pages upon the internet, the reach of shares, the work of
    programs that use no server on the spot, logging on, or printing.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
  what_breaks:
    pl:
      - Narzędzia deweloperskie uruchamiające aplikację pod miejscowym serwerem sieciowym przestaną to robić
      - Starsze programy branżowe z częścią przeglądarkową, w tym księgowe i magazynowe, stracą swoją aplikację miejscową
      - Zatrzymanie tej usługi zatrzymuje także serwer przesyłania plików starszym protokołem
      - Jeżeli oba punkty są wdrażane, wystarczy kolejność, w której ten idzie jako drugi
      - Przeglądanie stron w internecie, dostęp do udziałów, logowanie, praca pozostałych programów i drukowanie pozostają bez zmian
    en:
      - Tools of development that set a working going under a web server on the spot will cease to do so
      - Older programs of a trade with a part meant for a browser, those of accounts and of stores among them, will lose their working on the spot
      - The stopping of this service stops the server for the carrying of files by the older way of speaking too
      - If both items are being rolled out, it suffices that this one go second in order
      - The looking over of pages upon the internet, the reach of shares, logging on, the work of other programs and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na stanowisku działa program branżowy z częścią przeglądarkową zarejestrowaną w miejscowym serwerze sieciowym
      - Maszyna służy pracy deweloperskiej, w której aplikacja uruchamiana jest pod miejscowym serwerem
    en:
      - Upon the station works a program of a trade with a part meant for a browser set down within a web server on the spot
      - The machine serves work of development in which a working is set going under a server on the spot
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping this service stops those hanging upon it too, the server for the
    # carrying of files by the older way of speaking among them.
    Stop-Service -Name 'IISADMIN' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'IISADMIN' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'IISADMIN' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

notes:
  pl: |
    Reguła jest o czymś, czego na stanowisku roboczym zwykle nie powinno
    być. Warto, żeby aplikacja postawiła pytanie wprost: skąd serwer
    sieciowy wziął się na tej maszynie. Odpowiedź zwykle wskazuje na
    instalację składnika lub roli w całości, bez wybierania.

    Argument wart zachowania dotyczy braku opieki. Serwer sieciowy na
    stanowisku roboczym nie jest utrzymywany: nikt nie czyta jego
    dzienników, nikt nie zna zarejestrowanych aplikacji, nikt nie
    aktualizuje konfiguracji. Działa i przyjmuje połączenia, a to
    wystarczy.

    Odnotowuję zależność usług. Zatrzymanie tej usługi zatrzymuje także
    serwer przesyłania plików starszym protokołem, więc przy wdrażaniu
    obu punktów kolejność upraszcza pracę.
  en: |
    The rule is about a thing that commonly ought not to stand upon a working station. It is well that the
    application put the question outright: whence the web server came upon this machine. The answer commonly
    points to the laying on of a part or an office whole, with nothing chosen.

    The argument worth keeping touches the want of looking-after. A web server upon a working station is not kept
    up: nobody reads its records, nobody knows the workings set down within it, nobody brings its setting up to
    date. It works and takes joinings, and that suffices.

    I set down the hanging together of the services. The stopping of this service stops the server for the
    carrying of files by the older way of speaking too, so at the rolling out of both items the order makes the
    work simpler.
