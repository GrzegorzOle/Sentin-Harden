id: win10-laps-password-age

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Okres ważności hasła lokalnego administratora najwyżej trzydzieści dni
    en: Term of the local administrator password validity at most thirty days
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Hasło losowane raz i zostawione na lata różni się od hasła wspólnego tylko
    tym, że nikt go nie zna z pamięci. Wartość całego mechanizmu bierze się
    z cyklicznej zmiany: hasło odczytane przez kogoś przy naprawie, zapisane
    w notatce albo przechwycone przy logowaniu przestaje być użyteczne po
    najbliższym losowaniu.

    Trzydzieści dni jest górną granicą, jaką przyjmuje ten punkt. Okres krótszy
    spełnia go tak samo i bywa uzasadniony tam, gdzie hasła są odczytywane często.

    Zdejmowane ryzyko to trwałość dostępu. Napastnik, który zdobył hasło, traci je
    wraz z upływem okresu, zamiast utrzymywać wejście bezterminowo.
  en: |
    A password picked once and left for years differs from a shared one only in
    that nobody knows it by heart. The value of the whole mechanism comes from the
    cyclical change - a password read by somebody during a repair, written into a
    note or captured at sign-in stops being useful after the next pick.

    Thirty days is the upper bound this item takes. A shorter term meets it just
    as well and makes sense where passwords are read often.

    The risk taken away is the persistence of access. An attacker who obtained the
    password loses it as the term runs out, rather than keeping a way in without
    limit.

disruption_description:
  pl: |
    Zmiana hasła przebiega bez udziału użytkownika i bez przerwy w pracy. Nowe
    hasło trafia do katalogu, stare przestaje działać — i to wszystko, co dzieje
    się na maszynie.

    Odczuje to jedynie ten, kto zapisał sobie hasło na później. Po zmianie musi
    odczytać je ponownie z katalogu, co jest zachowaniem prawidłowym, a bywa
    zgłaszane jako usterka.
  en: |
    The password changes with no user involvement and no break in work. The new
    one goes to the directory, the old stops working, and that is all that happens
    on the machine.

    The only person who feels it is whoever wrote the password down for later.
    After the change they have to read it from the directory again, which is
    correct behaviour and yet gets reported as a fault.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Hasło zapisane przez obsługę na później przestanie działać po upływie okresu i trzeba będzie odczytać je ponownie
      - Skrypty odczytujące hasło raz i przechowujące je u siebie zaczną zawodzić po każdej zmianie
      - Narzędzia automatyzujące naprawy muszą sięgać po hasło przy każdym użyciu, a nie raz na początku
      - Praca użytkownika, logowanie kontem domenowym, usługi i zadania harmonogramu pozostają bez zmian
    en:
      - A password noted down by support for later stops working once the term runs out and has to be read again
      - Scripts that read the password once and keep it start failing after every change
      - Tools automating repairs have to fetch the password at each use rather than once at the start
      - User work, signing in with domain accounts, services and scheduled tasks are all unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowiska, w których hasło lokalnego administratora jest wpisywane na stałe w narzędziach obsługi
      - Maszyny łączące się z katalogiem rzadko, gdzie zmiana hasła może nie zdążyć trafić do katalogu przed kolejnym losowaniem
    en:
      - Environments where the local administrator password is hardcoded into support tooling
      - Machines that reach the directory rarely, where a changed password may not get filed before the next pick
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordAgeDays'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '30'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $name = 'PasswordAgeDays'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Thirty is the upper bound the item takes; a shorter term meets it too.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordAgeDays' -Value 30 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Porównanie jest na górną granicę, więc okres krótszy spełnia punkt. Zasada
    działa tylko wtedy, gdy wskazano miejsce przechowywania hasła; bez tego nie ma
    czego zmieniać cyklicznie.
  en: |
    The comparison is an upper bound, so a shorter term meets the item. The rule
    works only where the place of keeping has been named; without it there is
    nothing to change on a cycle.
