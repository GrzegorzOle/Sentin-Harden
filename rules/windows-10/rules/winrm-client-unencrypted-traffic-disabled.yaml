id: win10-winrm-client-unencrypted-traffic-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Client
  title:
    pl: Nieszyfrowany ruch klienta zarządzania zdalnego zabroniony
    en: Traffic not enciphered from the client of ordering from afar refused
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania tej maszynie nawiązywania połączeń zdalnego
    zarządzania, w których treść nie jest zaszyfrowana.

    Jest to dopełnienie punktu o usłudze, po stronie wychodzącej.
    Maszyna przestaje godzić się na rozmowę otwartym tekstem nawet wtedy,
    gdy druga strona taką proponuje.

    Zagrożeniem jest tutaj kierunek, o którym łatwo zapomnieć. Ochrona
    własnej usługi nie pomaga, gdy ta sama maszyna łączy się gdzie
    indziej i wysyła tamtędy polecenia, wyniki i poświadczenia otwartym
    tekstem.

    Drugim zastrzeżeniem jest to, że decyzję o szyfrowaniu podejmuje tu
    strona nawiązująca. Zostawiając tę zgodę otwartą, oddaje się wybór
    maszynie zdalnej — także takiej, która akurat nie jest tą, za którą
    się podaje.

    Odnotowuję, że komplet czterech punktów — usługa i klient, sposób
    uwierzytelniania i szyfrowanie — tworzy jedną całość. Wdrożenie
    połowy zostawia drogę otwartą z drugiej strony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: polecenia
    i poświadczenia wysyłane z tej maszyny otwartym tekstem.
  en: |
    The setting forbids this machine to make joinings of ordering from afar whose content is not enciphered.

    It is the filling out of the item about the service, upon the side going out. The machine ceases to assent to
    speech in open writing even where the other side offers it.

    The danger here is a road easily forgotten. The guarding of one's own service helps not where that same
    machine joins itself elsewhere and sends by that road orders, outcomes and warrants in open writing.

    The second reservation is that the decision about enciphering is here taken by the side that makes the
    joining. Leaving that assent open hands the choice to the far machine - one among them that happens not to be
    what it gives itself out to be.

    I set down that the full four items - service and client, the manner of warranting and the enciphering - make
    one whole. The rolling out of half leaves the road open upon the other side.

    What an attacker gains while the item goes unmet: orders and warrants sent from this machine in open writing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są te same
    skrypty co przy punkcie o uwierzytelnianiu klienta.

    Miejscem pierwszym są połączenia do maszyn spoza domeny, w których
    szyfrowanie nigdy nie zostało skonfigurowane. Po zmianie zostaną
    odrzucone po stronie tej maszyny, jeszcze przed wysłaniem czegokolwiek.

    Miejscem drugim są starsze urządzenia przyjmujące polecenia tą drogą
    i nieobsługujące szyfrowania w ogóle. Tam zmiana oznacza koniec
    zarządzania nimi z tego stanowiska i trzeba to rozstrzygnąć przed
    wdrożeniem.

    Odnotowuję, że połączenia uwierzytelniane domenowo działają dalej
    bez żadnej zmiany, bo treść jest w nich szyfrowana protokołem.

    Zastrzegam, że punkt ma sens wyłącznie razem z trzema pozostałymi
    z tej rodziny. Wdrożony sam zostawia drogę otwartą po stronie usługi.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: połączeń uwierzytelnianych domenowo, połączeń
    przychodzących, pracy programów, sieci, logowania.
  en: |
    The class is "needs review", and the object of the review is those same scripts as at the item about the
    client's warranting.

    The first place is joinings to machines beyond the domain where enciphering was never set up. After the change
    they will be refused upon this machine's side, before anything at all is sent.

    The second place is older gear taking in orders by that road and backing enciphering not at all. There the
    change means the end of the ordering of them from this station and it must be settled before the rollout.

    I set down that joinings warranted by the domain work on with no change at all, the content in them being
    enciphered by the protocol.

    I set down that the item has its sense solely together with the other three of its kindred. Rolled out alone
    it leaves the road open upon the service's side.

    The consequence shows at once, with no restart.

    What this does not break: joinings warranted by the domain, joinings coming in, the work of programs, the
    network, or logging on.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - encryption-and-tls
  what_breaks:
    pl:
      - Połączenia do maszyn spoza domeny bez skonfigurowanego szyfrowania zostaną odrzucone po stronie tej maszyny
      - Odrzucenie następuje przed wysłaniem czegokolwiek, więc druga strona nawet się o nim nie dowie
      - Starsze urządzenia nieobsługujące szyfrowania przestaną dać się zarządzać z tego stanowiska
      - Połączenia uwierzytelniane domenowo działają dalej, bo treść jest w nich szyfrowana protokołem
      - Połączenia przychodzące, praca programów, sieć, drukowanie i logowanie pozostają bez zmian
    en:
      - Joinings to machines beyond the domain with no enciphering set up will be refused upon this machine s side
      - The refusal comes before anything at all is sent, so the far side will not even learn of it
      - Older gear backing no enciphering will cease to be orderable from this station
      - Joinings warranted by the domain work on, the content in them being enciphered by the protocol
      - Joinings coming in, the work of programs, the network, printing and logging on stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ze stanowiska zarządza się starszym urządzeniem, które nie obsługuje szyfrowania tej drogi w ogóle
    en:
      - From the station is ordered older gear that backs no enciphering of that road at all
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowUnencryptedTraffic'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowUnencryptedTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowUnencryptedTraffic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

notes:
  pl: |
    Reguła domyka rodzinę czterech punktów i warto, żeby aplikacja
    pokazała je jako całość: usługa i klient, sposób uwierzytelniania
    i szyfrowanie. Wdrożenie połowy zostawia drogę otwartą z drugiej
    strony i daje fałszywe poczucie zamknięcia sprawy.

    Argument wart postawienia dotyczy tego, kto decyduje. Zostawiając
    zgodę na ruch nieszyfrowany, oddaje się wybór maszynie zdalnej —
    także takiej, która nie jest tą, za którą się podaje.

    Odnotowuję, że odrzucenie następuje przed wysłaniem czegokolwiek.
    To jest właściwa kolejność i warto ją nazwać: poświadczenia nie
    opuszczają maszyny nawet na próbę.
  en: |
    The rule closes the kindred of four items, and it is well that the application show them as one whole: service
    and client, the manner of warranting and the enciphering. The rolling out of half leaves the road open upon
    the other side and gives a false feeling that the matter is shut.

    The argument worth putting touches who decides. Leaving the assent to traffic not enciphered hands the choice
    to the far machine - one that is not what it gives itself out to be among them.

    I set down that the refusal comes before anything at all is sent. That is the right order of things and is
    worth naming: the warrants leave the machine not even for a try.
