id: win2016-rdp-clipboard-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie schowka w sesji pulpitu zdalnego wyłączone
    en: Clipboard redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina wspólny schowek między stanowiskiem a sesją zdalną.
    Tekst skopiowany na serwerze nie da się wkleić u siebie i odwrotnie.

    Schowek wygląda na drobiazg i jest najczęściej używanym kanałem
    przenoszenia treści z serwera i na serwer. To właśnie przez niego
    przechodzą rzeczy najmniejsze objętościowo i najcięższe co do wagi:
    hasła wklejane z menedżera, klucze, fragmenty konfiguracji, wyniki
    zapytań do bazy.

    Droga działa w obie strony i obie są warte nazwania. Na zewnątrz: treść
    z serwera trafia na stanowisko jednym skrótem klawiszowym, bez
    przechodzenia przez cokolwiek, co takie przeniesienie zapisuje. Do
    środka: polecenie przygotowane u siebie trafia do konsoli na serwerze
    równie łatwo, co jest najkrótszą drogą wniesienia obcego kodu na
    maszynę — nie w postaci pliku, który coś mogłoby sprawdzić, tylko
    w postaci tekstu wklejonego do powłoki.

    Warto też powiedzieć rzecz mniej oczywistą. Schowek jest w sesji zdalnej
    wspólny dla wszystkich programów, więc treść skopiowana na chwilę bywa
    odczytana przez coś, co akurat schowek śledzi. Menedżery haseł czyszczą
    go po chwili u siebie, ale przekierowanie przenosi kopię na drugą
    stronę, gdzie tego czyszczenia już nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    przenoszenia tekstu w obie strony, którym przechodzą hasła i klucze,
    i którego żaden mechanizm kontroli treści nie widzi.
  en: |
    The setting cuts off the shared clipboard between the workstation and the remote
    session. Text copied on the server cannot be pasted at home, and the other way
    round.

    The clipboard looks like a trifle and is the most used channel for carrying
    content off a server and onto it. Through it pass the things smallest in volume
    and heaviest in weight: passwords pasted from a manager, keys, fragments of
    configuration, the results of queries against a database.

    The road works both ways and both are worth naming. Outward: content from the
    server lands on the workstation with one keystroke, passing through nothing that
    records such a carrying. Inward: a command prepared at home lands in the console
    on the server just as easily, which is the shortest road for bringing foreign
    code onto the machine - not as a file that something might check, but as text
    pasted into a shell.

    A less obvious thing is worth saying too. The clipboard in a remote session is
    shared by every program, so content copied for a moment is at times read by
    whatever happens to be watching the clipboard. Password managers clear it after
    a moment at home, but the redirection carries a copy to the other side, where
    that clearing no longer happens.

    What an attacker gains while the item goes unmet: a channel for carrying text
    both ways, through which passwords and keys pass, and which no content control
    mechanism sees.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i tym razem powodem są ludzie, a nie
    automaty.

    Schowek jest najgłębiej zakorzenionym odruchem w pracy z sesją zdalną
    i jego odcięcie zauważą wszyscy, tego samego dnia. Kopiowanie polecenia
    z dokumentacji do konsoli na serwerze, przenoszenie komunikatu błędu do
    zgłoszenia, wklejanie hasła z menedżera trzymanego na stanowisku — każda
    z tych czynności przestaje działać naraz.

    Ostatnia z nich zasługuje na osobną uwagę, bo skutek bywa odwrotny do
    zamierzonego. Kto nie może wkleić hasła z menedżera, zacznie je
    przepisywać ręcznie — a hasła przepisywane ręcznie bywają skracane,
    upraszczane i zapamiętywane w miejscach gorszych niż menedżer. Zmianę
    trzeba więc wprowadzać razem z drogą zastępczą, zwykle menedżerem haseł
    dostępnym z poziomu samej sesji.

    Objaw jest natychmiastowy i nie ma komunikatu wyjaśniającego: wklejanie
    po prostu nie działa. Pierwszą reakcją bywa zgłoszenie awarii, więc
    uprzedzenie ludzi jest tu częścią wdrożenia, a nie uprzejmością.

    Czego to nie psuje: samej sesji zdalnej, drukowania, dostępu do zasobów
    sieciowych, schowka wewnątrz sesji — kopiowanie między programami na
    serwerze działa dalej.

    Bez restartu, natychmiast odwracalne — ale skutek widać przy pierwszym
    kolejnym połączeniu.
  en: |
    The class is "needs a planned rollout", and this time the reason is people
    rather than machines.

    The clipboard is the most deeply rooted reflex in working with a remote session,
    and everybody will notice its cutting off, the same day. Copying a command from
    documentation into the console on the server, carrying an error message into a
    ticket, pasting a password from a manager kept on the workstation - each of
    these stops working at once.

    The last deserves a note of its own, since the effect is at times the opposite
    of the one intended. Whoever cannot paste a password from a manager will start
    typing it out by hand - and passwords typed out by hand are at times shortened,
    simplified and remembered in places worse than a manager. The change must
    therefore be brought in together with a substitute road, as a rule a password
    manager reachable from inside the session itself.

    The symptom is immediate and there is no message explaining it: pasting simply
    does not work. The first reaction is at times a fault report, so warning people
    is here part of the rollout rather than a courtesy.

    What this does not break: the remote session itself, printing, access to network
    resources, or the clipboard inside the session - copying between programs on the
    server works on.

    No restart, undone immediately - but the effect is seen at the first further
    connection.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Kopiowanie polecenia z dokumentacji na stanowisku do konsoli na serwerze przestaje działać, bez komunikatu wyjaśniającego
      - Przenoszenie komunikatu błędu z sesji do zgłoszenia wymaga zrzutu ekranu albo przepisania
      - Wklejanie hasła z menedżera trzymanego na stanowisku przestaje działać, co bez drogi zastępczej popycha ludzi ku przepisywaniu haseł ręcznie
      - Sama sesja zdalna, drukowanie i kopiowanie między programami wewnątrz sesji pozostają bez zmian
    en:
      - Copying a command from documentation on the workstation into the console on the server stops working, with no message explaining why
      - Carrying an error message from the session into a ticket calls for a screenshot or for typing it out
      - Pasting a password from a manager kept on the workstation stops working, which without a substitute road pushes people towards typing passwords by hand
      - The remote session itself, printing and copying between programs inside the session stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Osoby pracujące na tej maszynie korzystają z menedżera haseł trzymanego na stanowisku i nie ma menedżera dostępnego z poziomu samej sesji
      - Nie uprzedzono nikogo o zmianie, a pulpit zdalny jest podstawowym narzędziem codziennej pracy na tej maszynie
    en:
      - The people working on this machine use a password manager kept on the workstation and there is no manager reachable from inside the session
      - Nobody has been warned of the change and the remote desktop is the chief tool of daily work on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableClip'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableClip'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableClip' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Reguła jest drugą co do ciężaru w grupie przekierowań, zaraz po dyskach,
    i pierwszą co do odczuwalności. Dyski przenoszą więcej, ale schowka
    używa się częściej i odruchowo, więc to jego odcięcie wywoła rozmowę.

    Zestawienie z regułą o dyskach jest tu pouczające i warto je pokazać
    w aplikacji razem. Obie zamykają ten sam rodzaj drogi — przenoszenie
    treści poza wszelką kontrolą — tylko jedna dotyczy plików, a druga
    tekstu. Zamknięcie jednej bez drugiej zostawia kanał otwarty, bo plik
    da się wkleić jako tekst, a tekst zapisać do pliku.

    Odpuszczenie tego punktu bywa decyzją poprawną i aplikacja ma pozwolić
    ją zapisać. Na maszynie, gdzie sesja zdalna jest jedynym narzędziem
    pracy zespołu i nie ma menedżera haseł po stronie serwera, koszt bywa
    wyższy niż zysk — ale to ma być wybór zapisany z uzasadnieniem, nie
    cicha zwłoka.
  en: |
    The rule is the second heaviest in the redirection group, right after the
    drives, and the first in how much it is felt. The drives carry more, but the
    clipboard is used more often and by reflex, so it is its cutting off that will
    start the conversation.

    The comparison with the rule on drives is instructive here and worth showing in
    the application together. Both shut the same kind of road - the carrying of
    content beyond all control - only one concerns files and the other text. Closing
    one without the other leaves the channel open, since a file can be pasted as
    text and text written to a file.

    Letting this item go is at times the right decision, and the application is to
    allow it to be recorded. On a machine where the remote session is the team's
    only tool of work and there is no password manager on the server's side, the
    cost is at times higher than the gain - but that is to be a choice recorded with
    its reasons, not a quiet delay.
