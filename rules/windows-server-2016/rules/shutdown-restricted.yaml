id: win2016-shutdown-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zamykanie systemu zastrzeżone dla administratorów
    en: Shutting the system down restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zawęża listę kont uprawnionych do zamknięcia lub ponownego uruchomienia
    maszyny do grupy administratorów lokalnych.

    Na stanowisku zamknięcie systemu jest czynnością codzienną. Na serwerze jest
    zdarzeniem — kończy pracę usług, przerywa połączenia i bywa widoczne dla
    całej organizacji. Uprawnienie do jego wywołania powinno więc leżeć tam,
    gdzie leży odpowiedzialność za dostępność maszyny.

    Ryzyko nie polega na tym, że ktoś złośliwie wyłączy serwer. Polega na tym,
    że ktoś zrobi to przez pomyłkę, z sesji, o której zapomniał, albo że zrobi
    to napastnik, żeby wymusić ponowne uruchomienie w wybranym przez siebie
    momencie — na przykład po to, żeby weszła w życie zmiana, którą właśnie
    zapisał.

    Kategoria średnia i warto to nazwać uczciwie. Punkt chroni dostępność, a nie
    dane ani poświadczenia. Nie zamyka żadnej drogi wejścia.

    Na serwerze 2016 lista bywa szersza, niż należy, bo maszyny tego rocznika
    pełniły czasem podwójną rolę i zostały po tym grupy użytkowników
    z uprawnieniem nadanym dla wygody.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wybrania momentu ponownego uruchomienia maszyny, a przy okazji przerwania
    pracy usług.
  en: |
    The item narrows the list of accounts permitted to shut the machine down or
    restart it to the local administrators group.

    On a workstation shutting down is a daily action. On a server it is an event -
    it ends services' work, cuts connections and is sometimes visible to the whole
    organisation. The right to bring it about should therefore sit where
    responsibility for the machine's availability sits.

    The risk is not that somebody will maliciously switch the server off. It is
    that somebody will do it by mistake, from a session they had forgotten, or that
    an attacker will do it to force a restart at a moment of their own choosing -
    so that a change they have just written takes effect, for instance.

    The category is medium and that is worth stating honestly. The item protects
    availability, not data or credentials. It closes no way in.

    On Server 2016 the list is sometimes wider than it should be, because machines
    of this vintage occasionally served a double role and user groups were left
    behind with the right granted for convenience.

    What an attacker gains while the item goes unmet: the choice of the moment of a
    restart, and with it the interruption of services' work.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo zawężenie listy bywa odczuwalne dla ludzi,
    którzy na maszynie pracują.

    Sprawdzić trzeba, czy maszyna pełni rolę sesji zdalnych. Użytkownik
    kończący sesję zdalną nie zamyka systemu i ten punkt go nie dotyczy, ale
    pozycja zamykania widoczna w menu bywa źródłem pomyłek — i właśnie dlatego
    jej zniknięcie bywa zauważane jako zmiana, choć zmianą na gorsze nie jest.

    Drugi przypadek to konta operatorów obsługujące maszynę bez pełnych
    uprawnień administracyjnych. Jeżeli do ich zadań należy planowe ponowne
    uruchamianie serwera, zawężenie listy odbierze im tę możliwość i trzeba
    rozstrzygnąć, czy przenieść to zadanie, czy zostawić uprawnienie.

    Na kontrolerze domeny stan domyślny jest szerszy i obejmuje operatorów.
    Wynik niezgodny na takiej maszynie jest wynikiem prawdziwym.

    Czego to nie psuje: zamykania systemu przez administratora, zdalnego
    ponownego uruchamiania opisanego osobną regułą, usług ani zadań
    harmonogramu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because narrowing the list can be felt by the
    people who work on the machine.

    What has to be checked is whether the machine serves the remote sessions role.
    A user ending a remote session does not shut the system down and this item does
    not touch them, but the shutdown entry visible in the menu is a source of
    mistakes - and that is exactly why its disappearance gets noticed as a change,
    though it is no change for the worse.

    The second case is operator accounts serving the machine without full
    administrative rights. If planned restarts of the server are among their
    duties, narrowing the list takes that ability from them and it has to be
    settled whether to move the duty or to leave the right.

    On a domain controller the default state is wider and covers the operators. A
    non-compliant result on such a machine is a true result.

    What this does not break: an administrator shutting the system down, the remote
    restart described by a separate rule, services, or scheduled tasks.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Operatorzy obsługujący maszynę bez pełnych uprawnień tracą możliwość planowego ponownego uruchomienia
      - Pozycja zamykania systemu znika z menu użytkownikom na maszynie z rolą sesji zdalnych
      - Na kontrolerze domeny zmiana odbiera to uprawnienie operatorom zgodnie ze stanem domyślnym
      - Zamykanie przez administratora, usługi i zadania harmonogramu działają bez zmian
    en:
      - Operators serving the machine without full rights lose the ability to carry out a planned restart
      - The shutdown entry disappears from the menu for users on a machine with the remote sessions role
      - On a domain controller the change takes this right from the operators in accordance with the default state
      - Shutting down by an administrator, services and scheduled tasks work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Do zadań operatorów bez pełnych uprawnień administracyjnych należy planowe ponowne uruchamianie tej maszyny
    en:
      - Planned restarts of this machine are among the duties of operators without full administrative rights
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeShutdownPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeShutdownPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeShutdownPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The item protects availability, not data. Check whether operators without
    # full rights carry out the planned restarts before taking the ability away.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeShutdownPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeShutdownPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/shut-down-the-system

notes:
  pl: |
    Zdalne wymuszenie zamknięcia systemu jest osobnym uprawnieniem i opisuje je
    osobna reguła. Ta dotyczy zamknięcia wywołanego z sesji na maszynie;
    tamta — polecenia przychodzącego z sieci.

    Lista pusta uchodzi tu za zgodną, ale w praktyce oznacza maszynę, której
    nie da się zamknąć z jej własnej sesji. Bywa to stan zamierzony przy
    serwerach zarządzanych wyłącznie przez panel wirtualizacji.

    Kategoria średnia oddaje wprost zakres punktu: chroni dostępność maszyny,
    nie jej dane. To jest dobry kandydat do świadomego odpuszczenia tam, gdzie
    uprawnienie faktycznie komuś służy.
  en: |
    Forcing a shutdown remotely is a separate right and a separate rule describes
    it. This one bears on a shutdown raised from a session on the machine; that
    one, on a command arriving over the network.

    An empty list counts as compliant here, but in practice means a machine that
    cannot be shut down from its own session. That is sometimes intended on servers
    managed solely through the virtualisation panel.

    The medium category states the item's scope outright: it protects the machine's
    availability, not its data. It is a good candidate for a deliberate acceptance
    where the right genuinely serves somebody.
