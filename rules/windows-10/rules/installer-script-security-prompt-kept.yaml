id: win10-installer-script-security-prompt-kept

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Ostrzeżenie przy instalacji sterowanej skryptem zachowane
    en: The warning at an installation driven by a script kept
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zachowuje ostrzeżenie pojawiające się wtedy, gdy instalację
    pakietu uruchamia nie człowiek, lecz skrypt działający w przeglądarce
    albo w innym programie osadzającym mechanizm skryptowy.

    Nazwa wpisu opisuje zdjęcie ostrzeżenia, więc wartością wymaganą jest
    zero — ostrzeżenie zachowane. Jest to jeden z tych wpisów, przy których
    odczyt intuicyjny prowadzi w złą stronę, i audyt musi to uwzględniać.

    Mechanizm, o który chodzi, pozwala wywołać instalator z poziomu skryptu
    przez obiekt automatyzacji. Możliwość ta istnieje od dawna i służyła
    stronom wewnętrznym rozprowadzającym oprogramowanie. Ostrzeżenie jest
    jedyną rzeczą stojącą między takim wywołaniem a rozpoczęciem instalacji.

    Bez ostrzeżenia strona otwarta w przeglądarce może rozpocząć instalację
    bez żadnego śladu w oknie. Nie jest to przy tym uprawnienie, które
    skrypt zdobywa — jest to uprawnienie, które mu się daje przez zdjęcie
    jedynego pytania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozpoczęcie
    instalacji pakietu ze skryptu w przeglądarce bez pytania widocznego dla
    człowieka.
  en: |
    The setting keeps the warning that appears where an installation is started not by a person but by a script
    running in a browser or in another program hosting a scripting engine.

    The entry's name describes the doing away with the warning, so the value called for is nought - the warning
    kept. It is one of those entries at which an intuitive reading leads the wrong way, and the audit has to
    allow for that.

    The mechanism at issue lets the installer be called from a script through an automation object. The
    possibility has been there a long while and served internal pages handing out software. The warning is the
    only thing standing between such a call and the installing beginning.

    Without the warning a page opened in a browser may begin an installation with no trace at all in the window.
    It is at the same time no right the script wins - it is a right given to it by the doing away with the one
    question.

    What an attacker gains while the item goes unmet: the beginning of a package's installation from a script in
    a browser, without a question visible to a person.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślną. Tam, gdzie ostrzeżenie zdjęto, zrobiono
    to dla strony wewnętrznej rozprowadzającej oprogramowanie, a takich
    stron praktycznie już nie ma — mechanizm skryptowy, na którym stały,
    został z przeglądarek usunięty.

    Skutek zmiany jest więc zwykle żaden. Tam, gdzie takie rozwiązanie
    jeszcze działa, po zmianie pojawi się ostrzeżenie wymagające
    potwierdzenia, a nie błąd. Instalacja pozostaje możliwa.

    Odnotowuję, że wdrożenia prowadzone przez narzędzie zarządzające
    i instalacje uruchamiane z wiersza polecenia nie idą przez ten
    mechanizm i zmiana ich nie dotyczy.

    Nie ma znanych regresji.

    Czego to nie psuje: instalacji z wiersza polecenia, wdrożeń z konta
    usługi, aktualizacji systemowych, programów już zainstalowanych,
    sieci, profili.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The value called for is the default one. Where the warning has been done away with, that was done for an
    internal page handing out software, and such pages are by now as good as gone - the scripting engine they
    rested on has been taken out of the browsers.

    The change's consequence is therefore as a rule none at all. Where such an arrangement still works, after
    the change a warning calling for a confirmation will appear, not an error. The installation stays possible.

    Worth noting that rollouts led by a management tool and installations started from the command line do not
    go through this mechanism and the change does not touch them.

    There are no known regressions.

    What this does not break: installing from the command line, rollouts under a service account, system
    updates, programs already installed, the network, or profiles.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - updates-and-servicing
  what_breaks:
    pl:
      - Strona wewnętrzna rozprowadzająca oprogramowanie przez skrypt zaczyna pokazywać ostrzeżenie wymagające potwierdzenia
      - Instalacja wywoływana ze skryptu nie zostaje zablokowana, tylko poprzedzona pytaniem, więc dalej jest możliwa
      - Instalacje z wiersza polecenia i wdrożenia z konta usługi nie idą przez ten mechanizm i pozostają bez zmian
      - Programy już zainstalowane, aktualizacje systemowe oraz praca codzienna pozostają bez zmian
      - Praca sieci, profile użytkowników i drukowanie pozostają bez zmian
    en:
      - An internal page handing out software by a script begins showing a warning calling for a confirmation
      - An installation called from a script is not blocked but preceded by a question, so it stays possible
      - Installations from the command line and rollouts under a service account do not go through this mechanism and stay unchanged
      - Programs already installed, system updates and everyday work stay unchanged
      - The work of the network, users profiles and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie rozprowadza się w tej sieci stroną wewnętrzną wywołującą instalator skryptem i nikogo nie ma przy ekranie
    en:
      - Software gets handed out in this network by an internal page calling the installer from a script, with nobody at the screen
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'SafeForScripting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'SafeForScripting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry's name describes the doing away with the warning, so nought means
    # the warning kept. An installation from a script is not blocked - it gets a
    # question before it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SafeForScripting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-portal

notes:
  pl: |
    Reguła jest w tej rodzinie najbardziej historyczna i opis powinien to
    przyznać. Mechanizm, którego dotyczy, wychodzi z użycia, więc realne
    ryzyko jest dziś mniejsze niż w chwili powstania punktu.

    Kategoria wysoka utrzymuje się mimo to z jednego powodu: skutkiem
    niezgodności jest instalacja rozpoczęta bez pytania, a to jest zdarzenie
    tej samej wagi niezależnie od tego, jak rzadko mechanizm bywa dostępny.

    Warto, żeby aplikacja odnotowała pułapkę w nazwie wpisu. Wartość
    wymagana to zero, mimo że reguła mówi o zachowaniu ostrzeżenia. Ktoś
    czytający samą nazwę wpisu w kopii zapasowej odczyta ją odwrotnie
    i dlatego komentarz w poleceniu naprawczym mówi o tym wprost.
  en: |
    The rule is the most historical in this family and the description ought to own that. The mechanism it
    touches is falling out of use, so the real risk is today smaller than it was when the item came about.

    The high category holds all the same for one reason: the consequence of a mismatch is an installation begun
    without a question, and that is an event of the same weight however seldom the mechanism may be to be had.

    It is well that the application note the trap in the entry's name. The value called for is nought, though
    the rule speaks of keeping the warning. Somebody reading the entry's name alone in the backup will read it
    the other way round, and for that reason the comment in the remedy command says so outright.
