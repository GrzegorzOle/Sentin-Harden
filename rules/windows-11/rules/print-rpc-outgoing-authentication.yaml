id: win11-print-rpc-outgoing-authentication

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Uwierzytelnianie połączeń wychodzących podsystemu druku wymagane
    en: Authentication of outgoing connections of the printing subsystem required
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy podsystem druku ma uwierzytelniać się przy
    połączeniach wychodzących do serwerów druku, czy może łączyć się bez
    przedstawiania się.

    Sens punktu bierze się z tego, że uwierzytelnienie działa w obie strony.
    Zwykle myśli się o nim jako o dowodzie, że to my — i to jest jego strona
    oczywista. Druga strona jest tutaj ważniejsza: przy uwierzytelnieniu
    także druga strona musi się wykazać, a więc maszyna dowiaduje się, czy
    rozmawia z serwerem, z którym chciała rozmawiać.

    Połączenie nieuwierzytelnione nie daje tej wiedzy. Maszyna wysyła zadanie
    druku tam, dokąd doprowadziło ją rozwiązanie nazwy, i nie ma sposobu
    sprawdzić, czy po drugiej stronie jest serwer druku, czy ktokolwiek inny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przyjęcia zadania druku skierowanego do cudzego serwera. Zawartość
    zadania to dokument — umowa, wyciąg, lista płac, wydruk z systemu
    kadrowego. Materiał trafia do napastnika w całości i w postaci gotowej
    do odczytania, bez żadnego włamania na maszynę.

    Dochodzi do tego druga droga: serwer, który przyjmuje połączenie
    drukarskie, odpowiada maszynie, a odpowiedź bywa przetwarzana przez
    podsystem druku — czyli składnik pracujący z wysokimi uprawnieniami.
  en: |
    The setting settles whether the printing subsystem is to authenticate on outgoing
    connections to print servers, or may connect without presenting itself.

    The item's sense comes from authentication working both ways. It is usually thought of
    as proof that it is us - and that is its obvious side. The other side matters more
    here: under authentication the other side too has to show itself, and so the machine
    learns whether it is speaking with the server it meant to speak with.

    An unauthenticated connection does not give that knowledge. The machine sends the
    print job where name resolution led it, and has no way to check whether on the other
    side is a print server or anybody else.

    What an attacker gains while the item goes unmet: the means of taking a print job
    directed at somebody else's server. The job's content is a document - a contract, a
    statement, a payroll, a printout from a personnel system. The material reaches the
    attacker whole and in a form ready to read, with no break-in to the machine at all.

    To this is added a second route: a server taking a printing connection answers the
    machine, and the answer is sometimes handled by the printing subsystem - that is, by a
    component working with high rights.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy serwery druku w sieci potrafią się
    uwierzytelnić — a te starsze i wbudowane w urządzenia często nie potrafią.

    Serwery druku na systemach wspieranych i rozwiązania kolejkowania wydania
    współczesnego obsługują uwierzytelnienie i zmiana ich nie dotyczy.

    Skutek pojawia się przy drukarkach udostępnianych przez urządzenia
    wielofunkcyjne, serwery wydruku sprzed lat i rozwiązania, które celowo
    przyjmują połączenia anonimowe, żeby uprościć konfigurację na
    stanowiskach. Po zmianie takie drukarki przestaną przyjmować zadania,
    a próba ich dodania zakończy się odmową.

    Objaw jest natychmiastowy i zostanie zgłoszony jako niedziałająca
    drukarka, bez związku ze zmianą ustawienia. Warto sprawdzić to na jednym
    stanowisku przed wdrożeniem szerszym.

    Drukowanie na drukarce podłączonej bezpośrednio do maszyny działa bez
    zmiany — punkt dotyczy wyłącznie połączeń przez sieć.

    Zmiana wymaga zatrzymania i uruchomienia usługi bufora wydruku albo
    restartu maszyny.
  en: |
    What needs checking is whether the print servers on the network can authenticate - and
    older ones, and those built into devices, often cannot.

    Print servers on supported systems and queueing solutions of modern issue support
    authentication and the change does not concern them.

    The effect appears with printers shared by multifunction devices, print servers from
    years ago, and solutions that deliberately take anonymous connections so as to
    simplify setup at the stations. After the change such printers will stop taking work,
    and an attempt to add them will end in refusal.

    The symptom is immediate and will be reported as a printer that does not work, with no
    bearing on a changed setting. It is worth checking at one station before a wider
    rollout.

    Printing on a printer connected directly to the machine works unchanged - the item
    concerns connections over the network alone.

    The change takes stopping and starting the print spooler service, or a restart of the
    machine.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Drukarka przyjmująca wyłącznie połączenia anonimowe przestaje przyjmować zadania
      - Dodanie takiej drukarki kończy się odmową połączenia
      - Urządzenia wielofunkcyjne udostępniające druk bez uwierzytelnienia przestają odpowiadać
      - Drukowanie na drukarce podłączonej bezpośrednio do maszyny działa bez zmiany
    en:
      - A printer taking anonymous connections alone stops taking work
      - Adding such a printer ends in a refused connection
      - Multifunction devices sharing printing without authentication stop responding
      - Printing on a printer connected directly to the machine works unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Drukarki w sieci są udostępniane bez uwierzytelnienia i nie da się tego zmienić
      - Drukowanie odbywa się przez urządzenie wielofunkcyjne przyjmujące połączenia anonimowe
    en:
      - Printers on the network are shared without authentication and it cannot be changed
      - Printing goes through a multifunction device taking anonymous connections
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero is the default handling, in which authentication is used;
      # two switches it off outright.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcAuthentication'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $current = (Get-ItemProperty -Path $path -Name 'RpcAuthentication' -ErrorAction SilentlyContinue).'RpcAuthentication'
    [pscustomobject]@{
      path        = $path
      name        = 'RpcAuthentication'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcAuthentication' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/printdocs/printer-connections

notes:
  pl: |
    Wartość oczekiwana to zero, czyli obsługa domyślna, i warto wiedzieć,
    dlaczego nie jedynka. Jedynka wymusza uwierzytelnienie zawsze, również
    tam, gdzie obsługa domyślna i tak je stosuje, a przy tym odcina przypadki,
    w których system dobiera zachowanie sam. Zero jest stanem, w którym
    uwierzytelnienie obowiązuje, a dwójka — jedynym, w którym go nie ma.

    Brak wartości nie jest tym samym co zero, choć zachowanie bywa takie
    samo. Bez ustawienia decyduje konfiguracja lokalna; przy zapisanym zerze
    decyduje zasada.

    Reguła tworzy parę z tą, która ustala sposób połączenia wychodzącego.
    Osobno każda zostawia drugą połowę problemu: sposób bez uwierzytelnienia
    albo uwierzytelnienie na drodze podatnej na przekierowanie.
  en: |
    The expected value is zero, that is, the default handling, and it is worth knowing why
    not one. A one forces authentication always, including where the default handling
    applies it anyway, and at that cuts off the cases where the system chooses its
    behaviour itself. Zero is the state in which authentication binds, and two the only
    one in which it is absent.

    A missing value is not the same as zero, though the behaviour is sometimes the same.
    With no setting the local configuration decides; with a written zero the policy
    decides.

    The rule forms a pair with the one fixing the means of the outgoing connection. Apart,
    each leaves the other half of the problem: a means without authentication, or
    authentication on a road liable to redirection.
