id: ubuntu2404-print-server-not-in-use

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 2.1.11
  section: Services > Configure Server Services
  title:
    pl: Serwer wydruku CUPS nie jest używany
    en: Ensure print server services are not in use
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    CUPS przyjmuje zadania drukowania i przekazuje je do drukarek, a może
    też udostępniać drukarki innym komputerom. Usługa cups-browsed sama
    dodaje drukarki ogłaszane w sieci. W 2024 roku opisano łańcuch błędów,
    w którym fałszywa drukarka ogłoszona w sieci prowadziła do uruchomienia
    polecenia na komputerze w chwili drukowania. Na serwerze, który nie
    drukuje, te usługi nie są potrzebne.

    Punkt wymaga, żeby CUPS nie był zainstalowany albo żeby jego usługi nie
    były włączone ani uruchomione. Na Ubuntu Server pakiet domyślnie nie
    jest zainstalowany, a na Ubuntu Desktop jest i działa.
  en: |
    CUPS accepts print jobs and passes them to printers, and it can also
    share printers with other computers. The cups-browsed service adds
    printers announced on the network by itself. In 2024 a chain of bugs was
    described in which a fake printer announced on the network led to a
    command being run on the computer at print time. A server that does not
    print does not need these services.

    The item requires that CUPS is not installed or that its services are
    neither enabled nor running. On Ubuntu Server the package is not
    installed by default, and on Ubuntu Desktop it is installed and running.

disruption_description:
  pl: |
    Na komputerze, z którego nikt nie drukuje, nikt tego nie zauważy.
    W przeciwnym razie drukowanie przestanie działać, a drukarki udostępnione
    z tego komputera znikną dla innych komputerów.
  en: |
    Nobody will notice on a computer that nobody prints from. Otherwise
    printing stops working, and printers shared from this computer disappear
    for other computers.

implementation_consequences:
  impact_areas:
    - printing
  what_breaks:
    pl:
      - Programy na tym komputerze nie drukują, także do drukarek sieciowych
      - Drukarki udostępnione z tego komputera są niedostępne dla innych komputerów
      - Drukarki ogłaszane w sieci nie są dodawane automatycznie
    en:
      - Programs on this computer do not print, also to network printers
      - Printers shared from this computer are unavailable to other computers
      - Printers announced on the network are not added automatically
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || ! command -v dpkg-query >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then
      echo CHECK_ERROR; exit 0
    fi
    state() {
      inst=""
      for p in cups-daemon cups-browsed; do if [ "$(dpkg-query -W -f='${db:Status-Status}' "$p" 2>/dev/null)" = installed ]; then inst="$inst,$p"; fi; done
      bad=""
      for u in cups.path cups.socket cups.service cups-browsed.service; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        a=$(systemctl is-active "$u" 2>/dev/null) || true
        case "$a" in
          active|activating|reloading) ;;
          *)
            [ -n "$inst" ] || continue
            case "$e" in enabled|enabled-runtime|linked|linked-runtime) ;; *) continue ;; esac ;;
        esac
        bad="$bad,$u=${e:-none}/${a:-unknown}"
      done
      if [ -n "$bad" ]; then echo "IN_USE:${bad#,}"
      elif [ -z "$inst" ]; then echo NOT_INSTALLED
      else echo "NOT_IN_USE:${inst#,}"; fi
    }
    state
  expected: '^(NOT_INSTALLED$|NOT_IN_USE:)'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=units-1
        for u in cups.path cups.socket cups.service cups-browsed.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          echo "$u ${e:--} ${a:--}"
        done
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /run/systemd/system ] || { echo "systemd is not running" >&2; exit 1; }
      state() {
        inst=""
        for p in cups-daemon cups-browsed; do if [ "$(dpkg-query -W -f='${db:Status-Status}' "$p" 2>/dev/null)" = installed ]; then inst="$inst,$p"; fi; done
        bad=""
        for u in cups.path cups.socket cups.service cups-browsed.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          case "$a" in
            active|activating|reloading) ;;
            *)
              [ -n "$inst" ] || continue
              case "$e" in enabled|enabled-runtime|linked|linked-runtime) ;; *) continue ;; esac ;;
          esac
          bad="$bad,$u=${e:-none}/${a:-unknown}"
        done
        if [ -n "$bad" ]; then echo "IN_USE:${bad#,}"
        elif [ -z "$inst" ]; then echo NOT_INSTALLED
        else echo "NOT_IN_USE:${inst#,}"; fi
      }
      m=""
      for u in cups.path cups.socket cups.service cups-browsed.service; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        case "$e" in ""|not-found) continue ;; esac
        l=/etc/systemd/system/$u
        if { [ -e "$l" ] || [ -L "$l" ]; } && [ "$(readlink "$l")" != /dev/null ]; then
          echo "$l is a unit file or link of its own, not masking $u" >&2; exit 1
        fi
        m="$m $u"
      done
      if [ -z "$m" ]; then
        s=$(state)
        case "$s" in IN_USE:*) echo "Running without a unit file, stop the processes by hand ($s)" >&2; exit 1 ;; esac
        echo "None of the units is installed, nothing to change"; exit 0
      fi
      systemctl mask --now $m
      s=$(state)
      case "$s" in IN_USE:*) echo "The units are still in use ($s)" >&2; exit 1 ;; esac
      echo "Stopped and masked:$m ($s)"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=units-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      lines=$(tail -n +2 "$b")
      [ -n "$lines" ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      while read -r u e a x; do
        case " cups.path cups.socket cups.service cups-browsed.service " in *" $u "*) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        case "$e$a" in *[!a-z-]*|"") echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        if [ -z "$a" ] || [ -n "$x" ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      done <<< "$lines"
      start=""
      while read -r u e a; do
        case "$e" in
          -|not-found|masked) continue ;;
          masked-runtime) systemctl unmask "$u"; systemctl mask --runtime "$u"; continue ;;
        esac
        systemctl unmask "$u"
        case "$e" in
          enabled) systemctl enable "$u" ;;
          enabled-runtime) systemctl enable --runtime "$u" ;;
          linked|linked-runtime) echo "Could not link $u again; link its unit file by hand" >&2 ;;
        esac
        case "$a" in active|activating|reloading) start="$start $u" ;; esac
      done <<< "$lines"
      if [ -n "$start" ]; then systemctl start $start; fi
      echo "Restored the previous state of the units"
    )

privileges: root
runnable: true

sources:
  - https://openprinting.github.io/cups/doc/man-cupsd.html
  - https://github.com/OpenPrinting/cups-browsed
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html

notes:
  pl: |
    Punkt jest spełniony, gdy pakiet nie jest zainstalowany albo gdy żadna
    z jednostek cups.path, cups.socket, cups.service, cups-browsed.service nie jest włączona ani uruchomiona. Wynik IN_USE
    wymienia jednostki w użyciu razem ze stanem z systemctl is-enabled
    i is-active, a NOT_IN_USE pakiety, które są zainstalowane, ale nie
    działają. Pakiet usunięty bez --purge, z pozostawionymi plikami
    konfiguracyjnymi, liczy się jako niezainstalowany. Gdy żaden z pakietów
    nie jest zainstalowany, wynik IN_USE daje tylko jednostka, która nadal
    działa.

    Naprawa nie usuwa pakietów, bo mogą od nich zależeć inne programy.
    Zatrzymuje i maskuje jednostki poleceniem systemctl mask --now, więc nie
    da się ich uruchomić ręcznie, przez gniazdo ani jako zależność.
    Aktualizacja pakietu przez apt nie zdejmuje maski. Kopia zapisuje stan
    każdej jednostki, a wycofanie zdejmuje maskę, włącza jednostki, które
    były włączone, i uruchamia te, które działały. Jednostki zamaskowane
    wcześniej zostają zamaskowane. Naprawa odmawia, gdy w /etc/systemd/system
    leży własny plik jednostki o tej samej nazwie.

    Jeśli usługa ma zniknąć całkiem, można usunąć pakiet przez apt purge po
    sprawdzeniu, co jeszcze zostałoby usunięte.

    Sprawdzam demona CUPS razem z gniazdem i jednostką cups.path, które
    uruchamiają go na żądanie, oraz cups-browsed. Po zamaskowaniu programy
    na tym komputerze nie drukują, także do drukarek sieciowych, bo
    zadania przechodzą przez lokalny CUPS. Jeśli komputer musi drukować,
    lepiej zostawić CUPS słuchający tylko na localhost, jak w domyślnym
    /etc/cups/cupsd.conf, wyłączyć cups-browsed i opisać odstępstwo od tego
    punktu.
  en: |
    The item is met when the package is not installed or when none of the
    cups.path, cups.socket, cups.service, cups-browsed.service units is enabled or running. The IN_USE result lists the units in
    use with their state from systemctl is-enabled and is-active, and
    NOT_IN_USE lists the packages that are installed but not running. A
    package removed without --purge, with its configuration files left,
    counts as not installed. When none of the packages is installed, only a
    unit that is still running gives the IN_USE result.

    The remediation does not remove packages, because other programs may
    depend on them. It stops and masks the units with systemctl mask --now,
    so they cannot be started by hand, through a socket or as a dependency.
    A package upgrade through apt does not remove the mask. The backup
    records the state of every unit, and rollback removes the mask, enables
    the units that were enabled and starts the ones that were running. Units
    that were masked before stay masked. The remediation refuses when
    /etc/systemd/system holds a unit file of its own with the same name.

    If the service should be gone completely, the package can be removed with
    apt purge after checking what else would be removed.

    I check the CUPS daemon together with its socket and the cups.path unit,
    which start it on demand, and cups-browsed. Once they are masked,
    programs on this computer do not print, also to network printers,
    because jobs go through the local CUPS. If the computer has to print, it
    is better to keep CUPS listening on localhost only, as in the default
    /etc/cups/cupsd.conf, disable cups-browsed and document an exception to
    this item.
