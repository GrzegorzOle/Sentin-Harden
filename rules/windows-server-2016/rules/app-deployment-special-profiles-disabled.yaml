id: win2016-app-deployment-special-profiles-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji w profilach specjalnych zablokowane
    en: The installing of application packages in special profiles blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania instalowania pakietów aplikacji w profilach
    specjalnych.

    Profil specjalny nie należy do człowieka. Są to profile kont
    wbudowanych, profile obowiązkowe i profile tymczasowe — miejsca,
    w których system pracuje sam, bez nikogo przy klawiaturze.

    Stąd bierze się waga punktu. Pakiet zainstalowany w takim profilu nie
    pojawia się na niczyjej liście aplikacji, bo nie ma osoby, która by tę
    listę oglądała. Nie znaczy to, że pakietu nie ma: jest w systemie
    i może działać w kontekście o szerokich uprawnieniach, którego nikt
    nie ogląda.

    Jest to więc miejsce dobrane pod jedno kryterium: żeby to, co
    zainstalowane, było jak najdalej od oczu. Nie ma powodu, dla którego
    instalacja miałaby tam trafiać w toku normalnej pracy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce na
    zainstalowanie pakietu poza wszelką listą, w kontekście o szerokich
    uprawnieniach i bez nikogo, kto by go zobaczył.
  en: |
    The setting forbids application packages to be installed in special profiles.

    A special profile belongs to no person. They are the profiles of built-in accounts, mandatory profiles and
    temporary ones - places where the system works by itself, with nobody at the keyboard.

    Hence the item's weight. A package installed in such a profile appears on nobody's list of applications, there
    being no person to look at that list. That does not mean the package is not there: it is in the system and may
    work in a context with broad rights that nobody looks at.

    It is therefore a place chosen by one criterion: that what is installed should be as far from eyes as may be.
    There is no reason for an installation to land there in the course of ordinary work.

    What an attacker gains while the item goes unmet: a place for installing a package outside every list, in a
    context with broad rights and with nobody to see it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy sposobu
    przygotowywania maszyn.

    Bywa, że obraz maszyny albo skrypt przygotowania instaluje pakiety
    właśnie w profilu obowiązkowym, żeby każdy nowy użytkownik dostał je
    gotowe. Jest to rozwiązanie spotykane tam, gdzie stanowiska
    wystawia się z jednego wzorca.

    Jeżeli tak jest na tej maszynie, po zmianie taka instalacja przestanie
    się powieść. Objaw pojawi się przy następnym przygotowaniu obrazu, a
    nie zaraz po zmianie, więc związek przyczynowy bywa gubiony.

    Na maszynie przygotowywanej ręcznie i użytkowanej przez kilka osób
    zmiana nie robi nic.

    Rzecz warta rozdzielenia: instalowanie pakietów w profilach zwykłych
    zostaje bez zmian. Punkt dotyczy wyłącznie profili specjalnych.

    Czego to nie psuje: instalowania aplikacji w profilach zwykłych,
    aplikacji już zainstalowanych, ról serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established concerns the way machines are made ready.

    It happens that a machine's image or a script of preparation installs packages in just the mandatory profile,
    so that every new user should get them ready made. It is an arrangement met with where workplaces are set out
    from one pattern.

    If it is so on this machine, after the change such an installation will cease to succeed. The symptom will
    appear at the next making ready of an image and not straight after the change, so the tie of cause is at times
    lost.

    On a machine made ready by hand and used by a few people the change does nothing.

    A thing worth parting out: the installing of packages in ordinary profiles stays unchanged. The item concerns
    solely special profiles.

    What this does not break: the installing of applications in ordinary profiles, applications already installed,
    the server's roles, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Skrypt przygotowania maszyny instalujący pakiety w profilu obowiązkowym przestaje się powieść
      - Objaw pojawia się przy następnym przygotowaniu obrazu, a nie zaraz po zmianie, więc związek bywa gubiony
      - Instalowanie pakietów w profilach zwykłych pozostaje bez zmian
      - Aplikacje już zainstalowane, role serwera i usługi systemowe pozostają bez zmian
    en:
      - A script for making a machine ready that installs packages in the mandatory profile ceases to succeed
      - The symptom appears at the next making ready of an image and not straight after the change, so the tie is at times lost
      - The installing of packages in ordinary profiles stays unchanged
      - Applications already installed, the server roles and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Obraz albo skrypt przygotowania tej maszyny instaluje pakiety w profilu obowiązkowym
      - Nie ustalono, czy przygotowanie stanowisk opiera się na pakietach w profilu wzorcowym
    en:
      - The image or the script for making this machine ready installs packages in the mandatory profile
      - It has not been established whether the making ready of workplaces rests on packages in a pattern profile
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name is affirmative, so the desired state is written with a
      # zero: zero means "do not allow".
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      $name = 'AllowDeploymentInSpecialProfiles'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowDeploymentInSpecialProfiles'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is correct here: the entry's name is affirmative, so "do not allow"
    # is written as a zero and not as a one.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDeploymentInSpecialProfiles' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-applicationmanagement

notes:
  pl: |
    Punkt jest drugi w bloku i dotyczy miejsca, a nie treści: gdzie wolno
    wnieść pakiet.

    Argument wart zachowania sprowadza się do jednego zdania: jest to
    miejsce dobrane pod kryterium niewidoczności. Pakiet tam zainstalowany
    nie pojawia się na niczyjej liście, bo nie ma osoby, która by tę listę
    oglądała. Nie ma powodu, dla którego zwykła instalacja miałaby tam
    trafiać.

    Pułapka warta wyróżnienia dotyczy odczytu. Nazwa wartości jest
    twierdząca, więc stanowi pożądanemu odpowiada zero, a nie jedynka.
    Jest to druga taka pozycja w zestawie i przy ręcznym sprawdzaniu obie
    prowadzą do ustawienia odwrotności.

    Warunek do sprawdzenia jest tu nietypowy, bo dotyczy nie tej maszyny,
    lecz sposobu jej przygotowywania. Objaw wychodzi na jaw przy
    następnym obrazie, więc aplikacja warto, żeby zapytała o to wprost —
    inwentaryzacja tego nie pokaże.
  en: |
    The item is the second in the block and concerns a place rather than a content: where a package may be brought
    in.

    The argument worth keeping comes to one sentence: it is a place chosen by the criterion of invisibility. A
    package installed there appears on nobody's list, there being no person to look at that list. There is no
    reason for an ordinary installation to land there.

    A trap worth setting apart concerns the reading. The value's name is affirmative, so the wanted state answers
    to a zero and not a one. It is the second such entry in the set, and at a checking by hand both lead to the
    setting of the opposite.

    The condition to be checked is here an unusual one, concerning not this machine but the way it is made ready.
    The symptom comes out at the next image, so it is well that the application ask after it outright - the
    inventory will not show it.
