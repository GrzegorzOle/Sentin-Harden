id: win11-vbs-memory-attributes-table-required

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Tablica atrybutów pamięci oprogramowania układowego wymagana
    en: The firmware memory attributes table required
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby ochrona spójności kodu oparta na wirtualizacji
    włączała się wyłącznie na maszynach, których oprogramowanie układowe
    opisuje swoją pamięć w ustalony sposób.

    Punkt jest dopełnieniem reguły o samej ochronie spójności kodu
    i osobno nie ma sensu. Tamta włącza mechanizm; ta stawia warunek,
    bez którego mechanizm bywa włączony tylko z nazwy.

    Rzecz dotyczy pamięci należącej do oprogramowania układowego. Mechanizm
    ochrony musi wiedzieć, które obszary tej pamięci zawierają kod, a które
    dane, żeby jednym odmówić prawa zapisu, a drugim prawa wykonania.
    Wiedzę tę bierze z tablicy dostarczanej przez samo oprogramowanie
    układowe. Gdy tablicy nie ma, mechanizm nie potrafi rozdzielić obszarów
    i zostawia je z uprawnieniami szerszymi, niż powinny mieć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obszar
    pamięci zapisywalny i wykonywalny naraz, należący do warstwy pracującej
    poniżej systemu. Kod umieszczony w takim miejscu przeżywa restart
    i jest poza zasięgiem wszystkiego, co działa w systemie — łącznie
    z ochroną przed złośliwym oprogramowaniem.

    Wymaganie tablicy sprawia, że mechanizm albo daje ochronę pełną, albo
    nie włącza się wcale. Stan pośredni, w którym raport pokazuje ochronę
    włączoną, a luka pozostaje otwarta, przestaje być możliwy.
  en: |
    The setting takes that the protection of code integrity resting on virtualisation
    switch itself on only on machines whose firmware describes its memory in a settled way.

    The item is a completion of the rule about the protection of code integrity itself and
    apart makes no sense. That one switches the mechanism on; this one sets the condition
    without which the mechanism is sometimes switched on in name alone.

    The matter concerns memory belonging to the firmware. The protecting mechanism has to
    know which areas of that memory hold code and which data, so as to deny the one the
    right of writing and the other the right of running. It takes that knowledge from a
    table delivered by the firmware itself. Where there is no table, the mechanism cannot
    part the areas and leaves them with wider rights than they should have.

    What an attacker gains while the item goes unmet: an area of memory writable and
    runnable at once, belonging to a layer working below the system. Code placed in such a
    spot survives a restart and is beyond the reach of everything working in the system -
    the protection against malicious software included.

    Taking the table makes the mechanism either give full protection or not switch on at
    all. The middle state, in which the report shows the protection switched on while the
    gap stays open, stops being possible.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to dlatego, że na części sprzętu ochrona
    spójności kodu po tej zmianie przestanie się włączać.

    Jest to skutek zamierzony i właśnie na tym polega treść punktu, ale
    w raporcie wygląda na regres: maszyna, która wcześniej pokazywała
    ochronę jako działającą, zacznie pokazywać ją jako wyłączoną. W istocie
    dopiero teraz raport mówi prawdę.

    Sprawdzenia wymaga oprogramowanie układowe. Maszyny starsze
    i konstrukcje przemysłowe często tablicy nie dostarczają, a jej
    pojawienie się wymaga aktualizacji oprogramowania układowego, o ile
    producent taką wydał.

    Zmiana wymaga restartu maszyny. Wycofanie także zaczyna obowiązywać
    dopiero po restarcie.

    Warto ją wdrażać po jednym modelu sprzętu, a nie po jednej maszynie:
    zachowanie jest cechą modelu i wynik z jednego egzemplarza przenosi się
    na wszystkie takie same.
  en: |
    A knowing rollout is needed because on some hardware the protection of code integrity
    will stop switching on after this change.

    That is the intended effect and is exactly the item's content, but in the report it
    looks like a regression: a machine that showed the protection as working before will
    start showing it as switched off. In truth the report only now tells the truth.

    The firmware needs checking. Older machines and industrial builds often deliver no
    table, and its appearance takes an update of the firmware, so far as the maker has
    issued one.

    The change takes a restart of the machine. The rollback too binds only after a restart.

    It is worth applying by one model of hardware rather than by one machine: the behaviour
    is a trait of the model and the result from one specimen carries over to all the same.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Na sprzęcie bez tablicy atrybutów ochrona spójności kodu przestaje się włączać
      - Raport pokaże taką maszynę jako pozbawioną ochrony, choć wcześniej pokazywał inaczej
      - Przywrócenie ochrony wymaga aktualizacji oprogramowania układowego
      - Wycofanie zmiany zaczyna obowiązywać dopiero po restarcie maszyny
    en:
      - On hardware with no attributes table the protection of code integrity stops switching on
      - The report will show such a machine as lacking protection, though before it showed otherwise
      - Restoring the protection takes an update of the firmware
      - Rolling the change back binds only after a restart of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Sprzęt nie dostarcza tablicy atrybutów pamięci i producent nie wydał aktualizacji
      - Maszyna jest konstrukcją przemysłową bez wsparcia dla oprogramowania układowego
    en:
      - The hardware delivers no memory attributes table and the maker has issued no update
      - The machine is an industrial build with no support for its firmware
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'HVCIMATRequired'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    $current = (Get-ItemProperty -Path $path -Name 'HVCIMATRequired' -ErrorAction SilentlyContinue).'HVCIMATRequired'
    [pscustomobject]@{
      path        = $path
      name        = 'HVCIMATRequired'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'HVCIMATRequired' -Value 1 -Type DWord
    # The setting binds after a restart of the machine.

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    # The former state returns after a restart of the machine.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Wartość leży w kluczu wspólnym z pozostałymi ustawieniami ochrony opartej
    na wirtualizacji, więc wycofanie tej jednej nie rusza samego mechanizmu
    ani poziomu zabezpieczenia platformy.

    Reguła ma sens wyłącznie tam, gdzie ochrona spójności kodu jest
    włączona. Na maszynie bez niej wartość jest zapisana i nic nie robi, co
    nie szkodzi — ale też nie daje żadnej korzyści, dopóki mechanizm nie
    zostanie włączony.

    Wynik tej reguły warto czytać razem z regułą o samej ochronie spójności
    kodu. Para „ochrona włączona, tablica niewymagana" jest stanem
    najgorszym z możliwych do pomylenia: wygląda na spełniony, a opisuje
    ochronę niepełną.

    Brak wartości nie jest stanem zgodnym, bo domyślnie tablica nie jest
    wymagana.
  en: |
    The value lies in a key shared with the remaining settings of the protection resting on
    virtualisation, so rolling this one back disturbs neither the mechanism itself nor the
    platform's security level.

    The rule makes sense only where the protection of code integrity is switched on. On a
    machine without it the value is recorded and does nothing, which does no harm - but
    gives no benefit either until the mechanism is switched on.

    This rule's result is worth reading together with the rule about the protection of code
    integrity itself. The pair "protection on, table not required" is the worst state to
    mistake for another: it looks met and describes incomplete protection.

    A missing value is not a compliant state, since by default the table is not required.
