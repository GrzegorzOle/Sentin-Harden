id: win2025-create-token-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie obiektu tokenu nieprzyznane nikomu
    en: Create a token object granted to no one
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Token dostępu jest przepustką, którą proces okazuje przy każdym
    sięgnięciu po zasób. Zawiera tożsamość konta, przynależność do grup
    i wykaz posiadanych praw. System wystawia go przy logowaniu, po
    sprawdzeniu poświadczeń, i to sprawdzenie jest jedynym miejscem,
    w którym cokolwiek jest weryfikowane.

    Prawo omawiane tutaj pozwala pominąć ten moment i zbudować token
    samodzielnie. Proces, który je ma, wpisuje w przepustkę dowolną
    tożsamość i dowolne grupy — w tym te, do których należą
    administratorzy domeny — i system przyjmuje ją bez pytania, bo
    przepustka wygląda poprawnie.

    Jest to prawo bliźniacze wobec działania jako część systemu
    operacyjnego i tak samo nieproporcjonalne. Różnica jest techniczna:
    tamto pozwala podszyć się przy wykonywaniu czynności, to pozwala
    wytworzyć samą podstawę takiego podszycia.

    Na serwerze waga jest największa tam, gdzie tokeny mają zasięg poza
    maszynę. Przynależność do grup domenowych wpisana we własnoręcznie
    zbudowany token otwiera drogę do zasobów całej domeny, a nie tylko
    tej jednej maszyny.

    W systemie działającym prawidłowo wykaz ten jest pusty. Nawet
    mechanizmy tworzące tokeny — usługa logowania i lokalny urząd
    zabezpieczeń — nie potrzebują tego prawa, bo działają z innego
    tytułu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wystawienia sobie przepustki z dowolnymi uprawnieniami, bez łamania
    jakiegokolwiek hasła i bez pozostawienia zdarzenia logowania,
    które ktoś mógłby zauważyć.
  en: |
    A token of access is the pass a process shows at every reaching for a resource. It holds
    an account's identity, its belonging to groups and the list of rights held. The system
    issues it at a signing in, after credentials have been checked, and that checking is the
    one place at which anything is verified.

    The right spoken of here allows that moment to be passed over and the token to be built
    oneself. A process holding it writes into the pass any identity and any groups whatever -
    among them those the domain's administrators belong to - and the system takes it without
    asking, since the pass looks right.

    It is a right twin to acting as part of the operating system and just as out of
    proportion. The difference is technical: that one allows a false face at the doing of a
    thing, this one allows the very ground of such a false face to be made.

    On a server the weight is greatest where tokens reach past the machine. A belonging to
    domain groups written into a hand-built token opens the road to a whole domain's
    resources, not merely this one machine's.

    In a system working rightly this list is empty. Even the mechanisms that make tokens - the
    sign-in service and the local security authority - do not take this right, since they work
    on another title.

    What an attacker gains while the item goes unmet: the means of issuing themselves a pass
    with any rights whatever, without breaking any password and without leaving a sign-in
    event anybody might notice.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć.
    Na serwerze pracującym normalnie jest to stan spotykany praktycznie
    zawsze.

    Niepusty wykaz jest ustaleniem poważnym i warto go wyjaśnić przed
    zastosowaniem naprawy — nie dlatego, że naprawa jest ryzykowna, tylko
    dlatego, że sam wpis wymaga odpowiedzi na pytanie, skąd się wziął.

    Oprogramowanie, które faktycznie z tego prawa korzysta, praktycznie
    nie występuje. Jeżeli jednak występuje, przestanie działać
    natychmiast i z błędem uprawnień, a nie po cichu.

    Brak przerwy w działaniu należy rozumieć dosłownie: prawo jest
    odczytywane przy tworzeniu tokenu, więc zmiana obowiązuje od
    następnego takiego zdarzenia. Proces już działający zachowuje token
    wystawiony wcześniej, co znaczy, że pełny skutek pojawia się dopiero
    po ponownym uruchomieniu usługi.
  en: |
    The change has no known side effects and takes no break.

    In the default state the list is empty and the mending has nothing to remove. On a server
    working normally that is the state met in effect always.

    A list that is not empty is a grave finding and worth explaining before the mending is
    applied - not because the mending is risky, but because the entry itself takes an answer
    to the question where it came from.

    Software that in fact uses this right in effect does not occur. Should it occur, though,
    it will stop working at once and with a rights error rather than in silence.

    The want of a break is to be taken literally: the right is read at the making of a token,
    so the change holds from the next such event. A process already working keeps the token
    issued earlier, which means the full effect appears only after the service is started
    again.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - logging-and-audit
  what_breaks:
    pl:
      - W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć
      - Oprogramowanie korzystające z tego prawa praktycznie nie występuje
      - Zmiana obowiązuje od następnego tworzenia tokenu, nie wstecz
      - Proces już działający zachowuje token wystawiony przed zmianą
      - Niepusty wykaz wymaga wyjaśnienia, skąd wziął się wpis
    en:
      - In the default state the list is empty and the mending has nothing to remove
      - Software using this right in effect does not occur
      - The change holds from the next making of a token, not backwards
      - A process already working keeps the token issued before the change
      - A list that is not empty takes explaining where the entry came from
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Potwierdzono, że prawa używa oprogramowanie krytyczne, a wymiany nie da się przeprowadzić natychmiast
    en:
      - It is confirmed that critical software uses the right and a replacement cannot be carried out at once
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreateTokenPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreateTokenPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreateTokenPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeCreateTokenPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateTokenPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-a-token-object

notes:
  pl: |
    Prawo bywa mylone z możliwością podszycia się pod innego
    użytkownika, którą mają usługi sieciowe. Tamta opiera się na
    poświadczeniach przyniesionych przez klienta i jest ograniczona
    tym, co klient faktycznie przedstawił. Ta pozwala zbudować
    przepustkę od zera i nie jest ograniczona niczym.

    Sprawdzenie przyjmuje wykaz pusty i brak wpisu jako stany
    równoważne. Wykaz jest porządkowany przed porównaniem, a konta
    wskazywane identyfikatorami.

    Punkt czyta się razem z działaniem jako część systemu operacyjnego
    i z podszywaniem się pod klienta po uwierzytelnieniu. Trzy prawa
    dotyczą tego samego zagadnienia z różnych stron.
  en: |
    The right is at times mistaken for the power of taking on another user's face that network
    services have. That one rests on credentials brought by the client and is bounded by what
    the client in fact presented. This one lets a pass be built from nothing and is bounded by
    nothing.

    The check takes an empty list and no entry as equivalent states. The list is put in order
    before the comparison, and accounts are pointed to by identifier.

    The item is read together with acting as part of the operating system and with taking on a
    client's face after authentication. Three rights bear on the same matter from different
    sides.
