id: win2025-shutdown-without-logon-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyłączenie maszyny bez zalogowania zabronione
    en: Shutting the machine down without signing in forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z ekranu logowania możliwość wyłączenia maszyny,
    czyli żąda zalogowania się przed jej zatrzymaniem.

    Zagrożeniem jest tu odmowa usługi, a nie przejęcie. Nikt nie wejdzie
    na maszynę przez ten przycisk. Może natomiast ją zatrzymać, nie
    podając żadnych poświadczeń i nie zostawiając śladu wskazującego
    osobę — bo w dzienniku nie ma konta, które by to zrobiło.

    Na stanowisku roboczym byłoby to drobne. Na serwerze nie jest,
    i dlatego oceniam ten punkt wyżej niż w paczce stanowiska.

    Powód pierwszy: serwer zatrzymany nie wraca sam. Stanowisko robocze
    włącza rano jego użytkownik. Serwer stojący w szafie, wyłączony
    wieczorem, pozostaje wyłączony do czasu, aż ktoś pojedzie i naciśnie
    przycisk — a usługi, które na nim stały, są w tym czasie niedostępne
    dla wszystkich.

    Powód drugi, ważniejszy: konsola serwera nie jest miejscem
    fizycznym. Prowadzi do niej karta zarządzająca i konsola gospodarza
    wirtualizacji, obie osiągalne po sieci. Kto ma dostęp do którejkolwiek
    z nich, widzi ekran logowania serwera — a wraz z nim ten przycisk.
    Zamiana „dostępu fizycznego" na „dostęp do sieci zarządzania" zmienia
    wagę tego punktu zupełnie.

    Warto wiedzieć, że system serwerowy ustawia to domyślnie po
    bezpiecznej stronie. Niezgodność w tym punkcie zwykle nie wynika
    z zaniedbania, lecz ze zmiany wprowadzonej świadomie — i właśnie
    dlatego warto ją zobaczyć, bo ktoś kiedyś miał powód, a powód mógł
    już wygasnąć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zatrzymania serwera z ekranu logowania, bez poświadczeń
    i bez śladu wskazującego osobę.
  en: |
    The setting takes from the sign-in screen the means of shutting the machine down, that is, it
    demands a signing in before its halting.

    The threat here is a denial of service and not a taking. Nobody will come onto the machine
    through that button. They can, however, halt it, giving no credentials and leaving no trace
    naming a person - there being in the log no account that did it.

    At a working station that would be a small matter. On a server it is not, and hence I rate
    this item higher than in the station's pack.

    The first reason: a halted server does not come back of itself. A working station is switched
    on in the morning by whoever uses it. A server standing in a rack, switched off in the
    evening, stays switched off until somebody drives over and presses a button - and the
    services that stood upon it are in that time out of everyone's reach.

    The second reason, and the weightier: a server's console is no place in space. A management
    card leads to it, and the virtualisation host's console, both reachable over the network.
    Whoever holds either of them sees the server's sign-in screen - and with it that button. The
    exchange of "access in body" for "access to the management network" changes this item's
    weight wholly.

    It is worth knowing that the server system sets this on the safe side by default.
    Non-compliance at this item usually comes not from neglect but from a change made knowingly -
    and for just that reason it is worth seeing, somebody once having had a reason, and the
    reason may since have lapsed.

    What an attacker gains while the item goes unmet: the means of halting the server from the
    sign-in screen, with no credentials and no trace naming a person.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, kto i w jaki sposób zatrzymuje dziś ten
    serwer, bo po zmianie będzie do tego potrzebne konto.

    Na serwerze pozostawionym przy ustawieniach domyślnych zmiana nie ma
    żadnego skutku, bo stan już jest zgodny. Sprawdzenie ma wtedy
    charakter potwierdzenia.

    Skutek pojawia się tam, gdzie ktoś ten stan zmienił — i wtedy warto
    zapytać dlaczego. Zwykły powód jest jeden: technik obsługujący
    pomieszczenie serwerowe zatrzymuje maszyny przy pracach zasilaniowych
    i nie ma na nie konta. Po zmianie nie będzie mógł tego zrobić
    z ekranu logowania.

    Właściwym rozwiązaniem nie jest odpuszczenie punktu, tylko nadanie
    technikowi konta z prawem wyłączania maszyny. Prawo to jest osobnym
    punktem tej paczki i można je nadać bez nadawania czegokolwiek
    więcej. Zysk jest podwójny: pozostaje ślad w dzienniku wskazujący
    osobę.

    Przypadkiem drugim są maszyny wirtualne zatrzymywane poleceniem
    gospodarza. Warto rozwiać obawę: zmiana ich nie dotyczy. Zatrzymanie
    wydane z poziomu gospodarza wirtualizacji nie przechodzi przez ekran
    logowania gościa i działa po zmianie bez różnicy.

    Zmiana nie dotyczy też wyłączania z poziomu sesji zalogowanej,
    zatrzymania zdalnego ani zasilacza awaryjnego, który zgłasza
    wyłączenie przez usługę.

    Zmiana nie wymaga przerwy i wchodzi w życie natychmiast.
  en: |
    What needs checking is who halts this server today and in what way, since after the change an
    account will be wanted for it.

    On a server left at the default settings the change has no effect at all, the state being
    already compliant. The check is then of the nature of a confirmation.

    An effect shows up where somebody changed that state - and then it is worth asking why. The
    usual reason is one: the technician tending the server room halts the machines at works upon
    the power and holds no account on them. After the change they will not be able to do it from
    the sign-in screen.

    The right answer is not the letting go of the item but the giving of an account with the
    right to shut the machine down. That right is an item of its own in this pack and may be
    given without the giving of anything further. The gain is twofold: a trace naming a person
    stays in the log.

    The second case is virtual machines halted by a command of the host. A worry is worth
    clearing: the change does not bear on them. A halting given from the virtualisation host does
    not pass through the guest's sign-in screen and works after the change with no difference.

    Neither does the change bear on a shutting down from within a signed-in session, on a remote
    halting, or on an uninterruptible power supply that calls for a shutdown through a service.

    The change takes no break and comes into force at once.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Technik bez konta na tej maszynie nie zatrzyma jej z ekranu logowania przy pracach zasilaniowych
      - Zatrzymanie maszyny wirtualnej wydane z poziomu gospodarza działa po zmianie bez różnicy
      - Wyłączanie z sesji zalogowanej i zatrzymanie zdalne działają bez zmiany
      - Zasilacz awaryjny zgłaszający wyłączenie przez usługę nie jest tym punktem dotknięty
    en:
      - A technician without an account on this machine will not halt it from the sign-in screen at works upon the power
      - A halting of a virtual machine given from the host works after the change with no difference
      - Shutting down from a signed-in session and a remote halting work unchanged
      - An uninterruptible power supply calling for a shutdown through a service is untouched by this item
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer zatrzymuje przy pracach zasilaniowych technik, który nie ma na nim konta, i nie przygotowano mu konta zastępczego
    en:
      - The server is halted at works upon the power by a technician holding no account on it, and no account was made ready for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'ShutdownWithoutLogon'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'ShutdownWithoutLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'ShutdownWithoutLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/shutdown-allow-system-to-be-shut-down-without-having-to-log-on

notes:
  pl: |
    Punkt podniosłem względem paczki stanowiska roboczego z kategorii
    niskiej do średniej. Powodem jest to, że konsola serwera prowadzi
    przez kartę zarządzającą i gospodarza wirtualizacji, czyli po sieci,
    a serwer zatrzymany nie wraca sam.

    System serwerowy ustawia to domyślnie po bezpiecznej stronie.
    Niezgodność zwykle oznacza zmianę wprowadzoną świadomie — warto
    ustalić jej powód, zanim się ją cofnie.

    Zatrzymanie maszyny wirtualnej wydane z poziomu gospodarza nie
    przechodzi przez ekran logowania gościa i temu punktowi nie podlega.
  en: |
    I raised the item against the working station's pack from the low category to the medium.
    The reason is that a server's console is reached through a management card and the
    virtualisation host, that is over the network, and that a halted server does not come back of
    itself.

    The server system sets this on the safe side by default. Non-compliance usually means a
    change made knowingly - it is worth settling its reason before undoing it.

    A halting of a virtual machine given from the host does not pass through the guest's sign-in
    screen and does not fall under this item.
