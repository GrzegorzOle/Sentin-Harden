id: win2016-anonymous-share-enumeration-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Anonimowe wyliczanie kont i udziałów zablokowane
    en: Anonymous enumeration of accounts and shares blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania połączeniu nieuwierzytelnionemu wylistować zarówno konta,
    jak i udziały tej maszyny.

    Jest to szerszy z dwóch punktów o wyliczaniu i dopiero on zamyka sprawę.
    Sąsiedni obejmuje konta; ten dokłada udziały — czyli to, co na serwerze
    plików bywa informacją cenniejszą niż lista kont.

    Warto nazwać, co wynika z listy udziałów. Nazwy udziałów opisują strukturę
    organizacji: działy, projekty, systemy, archiwa. Napastnik, który jej nie
    ma, musi zgadywać, gdzie leżą rzeczy warte zabrania. Napastnik, który ją
    dostał, wie to od razu i wie również, które udziały zostały założone
    dawno i mogą mieć uprawnienia z tamtych czasów.

    Kategoria wysoka z tego samego powodu co przy sąsiedzie: to jest wiedza
    dostępna bez logowania, bez hasła i bez pozostawienia śladu, który
    ktokolwiek przeczyta.

    Na serwerze 2016 waży to szczególnie, bo maszyny tego rocznika bywają
    archiwami — miejscami, gdzie trafiło to, czego nie przeniesiono dalej.
    Lista udziałów takiej maszyny jest spisem treści.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: lista kont
    i udziałów tej maszyny naraz, czyli gotowy plan, od czego zacząć.
  en: |
    The item forbids an unauthenticated connection to list both the accounts and
    the shares of this machine.

    It is the broader of the two items about enumeration, and only it closes the
    matter. The neighbouring one covers accounts; this one adds shares - which
    on a file server is often more valuable information than a list of accounts.

    It is worth naming what a list of shares reveals. Share names describe the
    organisation's structure: departments, projects, systems, archives. An
    attacker without it has to guess where the things worth taking lie. An
    attacker given it knows at once, and also knows which shares were created
    long ago and may carry permissions from those days.

    The category is high for the same reason as its neighbour: this is knowledge
    available with no sign-in, no password and no trace anybody will read.

    On Server 2016 it weighs particularly, because machines of this vintage tend
    to be archives - the places where whatever was not moved on ended up. The
    list of such a machine's shares is a table of contents.

    What an attacker gains while the item goes unmet: the list of this machine's
    accounts and shares at once, that is, a ready plan of where to begin.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i jest tu trochę więcej do sprawdzenia niż przy
    sąsiedzie, bo dochodzą udziały.

    Po zmianie przestanie działać przeglądanie udziałów tej maszyny bez
    podania poświadczeń. Dotyczy to starszych urządzeń szukających udziału po
    nazwie maszyny, niektórych narzędzi inwentaryzacyjnych oraz sposobu pracy,
    w którym użytkownik wchodzi na serwer i ogląda, co jest dostępne, zamiast
    sięgać po ścieżkę, którą zna.

    Ten ostatni przypadek bywa zaskoczeniem, więc warto go wskazać wprost.
    Po zmianie użytkownik uwierzytelniony nadal zobaczy udziały; niezalogowany
    nie zobaczy nic. Różnica ujawnia się tam, gdzie połączenie do tej pory
    szło anonimowo, choć nikt tego tak nie planował.

    Rzecz do zapamiętania: to ustawienie nie zmienia uprawnień do udziałów.
    Udział nadal ma te same uprawnienia co wcześniej — zmienia się tylko to,
    czy da się go zobaczyć na liście bez logowania.

    Czego to nie psuje: dostępu do udziału po pełnej ścieżce z poświadczeniami,
    pracy domeny, drukowania z uwierzytelnieniem ani logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and there is a little more to review than with
    its neighbour, because shares come into it.

    After the change, browsing this machine's shares without supplying
    credentials will stop working. That concerns older devices looking for a
    share by the machine's name, some inventory tools, and the working habit in
    which a user goes to the server and looks at what is available rather than
    reaching for a path they know.

    That last case tends to be a surprise, so it is worth pointing out plainly.
    After the change an authenticated user still sees the shares; one not signed
    in sees nothing. The difference shows up where a connection had until now
    gone anonymously, although nobody planned it that way.

    Something to remember: this setting does not change permissions on the
    shares. A share still carries the same permissions as before - what changes
    is only whether it can be seen in a list without signing in.

    What this does not break: reaching a share by its full path with
    credentials, the domain's work, printing with authentication, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Przeglądanie udziałów tej maszyny bez podania poświadczeń przestaje działać
      - Starsze urządzenia szukające udziału po nazwie maszyny przestają go znajdować
      - Ustawienie nie zmienia uprawnień do udziałów, a tylko widoczność listy bez logowania
      - Dostęp po pełnej ścieżce z poświadczeniami i praca domeny działają bez zmian
    en:
      - Browsing this machine's shares without supplying credentials stops working
      - Older devices looking for a share by the machine's name stop finding it
      - The setting does not change permissions on the shares, only whether the list is visible without signing in
      - Access by full path with credentials and the domain's work go on unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z maszyny korzystają urządzenia odnajdujące udział przez przeglądanie listy bez poświadczeń
    en:
      - Devices that find a share by browsing the list without credentials use the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictAnonymous'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'RestrictAnonymous' -ErrorAction SilentlyContinue).'RestrictAnonymous'
    [pscustomobject]@{
      path        = $path
      name        = 'RestrictAnonymous'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The broader of the two enumeration items: accounts and shares together.
    # It changes no permission on any share - only whether the list can be seen
    # without signing in.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictAnonymous' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts-and-shares

notes:
  pl: |
    Nazwa tego wpisu jest krótsza od nazwy sąsiada, a zakres szerszy — to
    właśnie odwrotnie, niż podpowiada odruch. Warto przy sprawdzaniu ręcznym
    patrzeć na wartość, a nie na to, który wpis wygląda na ważniejszy.

    Oba wpisy leżą pod tym samym kluczem i warto ustawiać je razem. Sam
    węższy zostawia listę udziałów otwartą, a na serwerze plików to jest
    właśnie ta lista, na której napastnikowi zależy.

    Reguła nie dotyczy uprawnień. Udział niewidoczny na liście wciąż jest
    osiągalny po pełnej ścieżce, jeśli uprawnienia na to pozwalają — ukrycie
    nie jest zabezpieczeniem i nie należy go tak przedstawiać.
  en: |
    This entry's name is shorter than its neighbour's while its reach is broader
    - the reverse of what instinct suggests. When checking by hand it is worth
    looking at the value rather than at which entry looks more important.

    Both entries lie under the same key and are worth setting together. The
    narrower alone leaves the list of shares open, and on a file server that is
    precisely the list an attacker is after.

    The rule does not concern permissions. A share invisible in the list is
    still reachable by its full path if the permissions allow it - hiding is not
    a safeguard and should not be presented as one.
