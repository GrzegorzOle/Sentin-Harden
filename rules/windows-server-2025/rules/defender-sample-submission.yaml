description:
  pl: |
    Punkt ustala, co się dzieje, gdy sama informacja o pliku nie
    wystarcza do rozstrzygnięcia: czy plik zostaje wysłany do zbadania
    automatycznie, czy mechanizm pyta o zgodę, czy nie wysyła nic.
    Wartość zgodna oznacza wysyłanie bez pytania tych plików, które są
    uznane za niezawierające danych osobistych.

    Obniżam kategorię do niskiej i jest to obniżenie o dwa powody
    naraz. Pierwszy: dla tej maszyny punkt nie zdejmuje ryzyka prawie
    wcale — korzyść z wysłanej próbki trafia do wszystkich innych
    maszyn na świecie, nie do tej. Drugi: na serwerze nie ma nikogo, kto
    odpowiedziałby na pytanie o zgodę, więc wariant pośredni i tak nie
    działa. Zostaje wysyłanie albo niewysyłanie.

    Warto to powiedzieć wprost, bo zmienia charakter decyzji. Ten punkt
    jest w mniejszym stopniu zabezpieczeniem tej maszyny, a w większym
    udziałem w mechanizmie, z którego korzystają wszyscy. Jest to
    powód dobry, ale inny niż przy pozostałych punktach tej grupy,
    i nie należy go przedstawiać jako ochrony serwera.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    niewiele na tej maszynie — nieco dłuższe życie swojego narzędzia
    wszędzie indziej.
  en: |
    The item settles what happens where the tiding about a file is not enough for a settling -
    whether the file is sent to be looked into of itself, whether the working asks for leave, or
    whether it sends nothing. The meeting worth stands for the sending without asking of those files
    held to bear no data of a person.

    I lower the category to low, and it is a lowering of two grounds at once. The first - for this
    machine the item takes hardly any risk away, the good of a sent sample going to all the other
    machines in the world and not to this one. The second - on a server there is nobody to answer a
    question about leave, so the middle way works not anyway. There is left the sending or the not
    sending.

    It is worth saying outright, it altering the kind of the deciding. This item is in a lesser
    measure a guarding of this machine and in a greater a share in a working all make use of. It is
    a good ground, but another than at the rest of this group's items, and it ought not be set forth
    as a guarding of the server.

    What an attacker gains while the item goes unmet - little on that machine, a somewhat longer
    life for their tool everywhere else.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia i chcę od razu powiedzieć,
    że planowanie oznacza tu coś innego niż zwykle. Nie chodzi o okno
    serwisowe ani o restart. Chodzi o uzgodnienie — i jest to rodzaj
    planowania, który łatwiej pominąć, bo nie widać go w kalendarzu.

    Rzecz jest w tym, co wychodzi z maszyny. Wychodzi plik z serwera.
    Automatyczne wysyłanie obejmuje tylko te pliki, które mechanizm
    uznaje za niezawierające danych osobistych, i w praktyce działa to
    dobrze. Ale kryterium pochodzi od producenta oprogramowania, a nie
    od organizacji, i nie zna ani jej umów, ani przepisów, którym
    podlega.

    Na serwerze ma to inny ciężar niż na stacji roboczej. Plikiem
    nierozpoznanym, czyli tym właśnie kandydującym do wysłania, jest tu
    zwykle program napisany na miejscu albo narzędzie kupione u małego
    dostawcy. W pierwszym przypadku na zewnątrz idzie własny kod.
    W drugim — cudzy, którego licencja niekoniecznie na to pozwala.

    Dlatego decyzja przy tym punkcie nie należy do osoby, która
    uruchamia audyt. Należy do tego, kto odpowiada za dane i za umowy,
    i właśnie to trzeba przed zmianą załatwić. Na maszynie przetwarzającej
    dane objęte przepisami zapisany wyjątek bywa tu wynikiem
    prawidłowym, a nie odpuszczeniem.

    Od strony technicznej zmiana nie psuje niczego: nie blokuje,
    nie opóźnia i nie zmienia sposobu pracy maszyny.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I raise the class to a witting rolling out, and mean to say at once that the planning stands
    here for something other than is usual. It is not about a window for service nor about a
    restart. It is about an agreeing - and that is a kind of planning the lighter to pass over, it
    not being seen in a calendar.

    The matter is what goes out of the machine. What goes out is a file off the server. The sending
    of itself takes in only those files the working holds to bear no data of a person, and in
    practice that works well. But the measure comes of the maker of the software and not of the
    body, and knows neither its covenants nor the rules it stands under.

    On a server that has another weight than on a workstation. The unknown file, that is the very
    one standing for the sending, is here mostly a program written on the spot or a tool bought of a
    small seller. In the first case one's own code goes out. In the second another's, whose leave
    does not needs allow it.

    Therefore the deciding at this item belongs not to the person who runs the audit. It belongs to
    whoever answers for data and for covenants, and that is just what must be settled before the
    change. On a machine working through data standing under rules a written exception is here at
    times the right outcome and no letting go.

    From the side of the workings the change spoils nothing - it blocks not, delays not and alters
    not the machine's way of working.

    The change is undone at once and takes no restart.

