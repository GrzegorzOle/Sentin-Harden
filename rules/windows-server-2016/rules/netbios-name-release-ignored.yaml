id: win2016-netbios-name-release-ignored

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Żądania zwolnienia nazwy starszego mechanizmu ignorowane
    en: Name release demands of the older net mechanism ignored
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe maszynie nie porzucać własnej nazwy sieciowej na żądanie
    przysłane z sieci.

    Starszy mechanizm nazw przewiduje komunikat, którym jedna maszyna każe
    drugiej nazwę zwolnić. Pomyślano go dla serwera nazw porządkującego
    ewidencję, na przykład wtedy, gdy nazwa została przypisana dwa razy.
    Domyślnie maszyna takie żądanie wykonuje.

    Nie towarzyszy mu żadne uwierzytelnienie. Wystarczy wysłać komunikat
    z dowolnego urządzenia, żeby maszyna wypisała się z ewidencji nazw
    i przestała odpowiadać na pytania o siebie.

    Skutkiem jest zniknięcie maszyny z sieci przy pozostawieniu jej całkowicie
    sprawnej. Nic się nie zatrzymuje, nic nie zgłasza błędu, usługi działają
    — po prostu nikt nie potrafi jej odnaleźć po nazwie. Rozpoznanie takiej
    awarii bywa długie, bo szuka się usterki tam, gdzie jej nie ma.

    Dla napastnika jest to jednak coś więcej niż zakłócenie. Nazwa zwolniona
    przez prawowitego właściciela staje się nazwą wolną, a wolną nazwę można
    zająć. Napastnik, który najpierw usuwa maszynę z ewidencji, a potem
    ogłasza się pod jej nazwą, przejmuje ruch kierowany do niej — wraz
    z próbami uwierzytelnienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    usunięcia maszyny z ewidencji nazw jednym nieuwierzytelnionym
    komunikatem i zajęcia zwolnionej nazwy dla siebie.
  en: |
    The setting has the machine not give up its own network name at a demand sent in
    from the network.

    The older name mechanism provides for a message by which one machine bids
    another release a name. It was thought up for a name server tidying its records,
    where a name has been given out twice, say. By default a machine carries such a
    demand out.

    No authentication goes with it. It is enough to send the message from any device
    for the machine to strike itself off the name records and stop answering
    questions about itself.

    The upshot is the machine's disappearance from the network while it is left
    wholly sound. Nothing halts, nothing reports an error, the services run - only
    nobody can find it by name. Diagnosing such a fault is at times long, since the
    trouble is looked for where it is not.

    For an attacker, though, this is more than a disturbance. A name released by its
    rightful owner becomes a free name, and a free name can be taken. An attacker
    who first removes the machine from the records and then announces themselves
    under its name takes over the traffic directed at it - attempts at
    authentication included.

    What an attacker gains while the item goes unmet: the means of removing the
    machine from the name records with one unauthenticated message and of taking the
    released name for themselves.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć skutek odczuwalny jest tu rzadkością,
    a powód klasy leży gdzie indziej niż zwykle.

    Sama zmiana niczego nie odbiera. Maszyna przestaje wykonywać żądanie,
    którego w zdrowej sieci nikt do niej nie wysyła. Nie ma restartu usług,
    nie ma zmiany widocznej dla nikogo, nie ma nowego zachowania poza jednym
    komunikatem, który zostaje bez odpowiedzi.

    Klasa wynika z wymogu ponownego uruchomienia maszyny. Zmiana nie
    obowiązuje wcześniej, więc trzeba ją zaplanować, nawet jeśli sama
    w sobie jest niewidoczna.

    Sprawdzić warto jedno: czy w sieci pracuje serwer nazw starszego
    mechanizmu, który porządkuje ewidencję właśnie tym komunikatem. Jest to
    dziś rzadkie, ale tam, gdzie taki serwer stoi, po zmianie zacznie
    zgłaszać w dzienniku konflikty nazw, których nie potrafi rozwiązać.
    Nie jest to awaria, tylko szum w dzienniku — ale warto wiedzieć,
    skąd się bierze.

    Czego to nie psuje: rozwiązywania nazw, udziałów sieciowych, logowania,
    usług, łączności.

    Wymaga ponownego uruchomienia maszyny.
  en: |
    The class is "needs review", though an effect anybody feels is rare here and the
    reason for the class lies elsewhere than usual.

    The change itself takes nothing away. The machine stops carrying out a demand
    nobody sends it on a healthy network. There is no service restart, no change
    visible to anybody, no new behaviour but one message left unanswered.

    The class follows from the call for the machine to be started again. The change
    does not hold before that, so it has to be planned, even though in itself it is
    invisible.

    One thing is worth checking: whether a name server of the older mechanism works
    on the network and tidies its records by just that message. That is rare today,
    but where such a server stands it will, after the change, begin reporting in its
    log name conflicts it cannot resolve. That is no breakdown but noise in a log -
    worth knowing where it comes from, all the same.

    What this does not break: name resolution, network shares, signing in, services,
    or connectivity.

    Calls for the machine to be started again.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Serwer nazw starszego mechanizmu porządkujący ewidencję tym komunikatem zaczyna zgłaszać w dzienniku konflikty nazw, których nie rozwiąże
      - Zmiana nie obowiązuje przed ponownym uruchomieniem maszyny, więc audyt po samym wykonaniu pokaże stan niezgodny z rzeczywistym
      - Rozwiązywanie nazw, udziały sieciowe, logowanie i usługi pozostają bez zmian
      - Dla użytkowników zmiana jest całkowicie niewidoczna
    en:
      - A name server of the older mechanism that tidies its records by this message begins reporting in its log name conflicts it will not resolve
      - The change does not hold before the machine is started again, so an audit straight after execution will show a state at odds with the real one
      - Name resolution, network shares, signing in and services stay unchanged
      - For users the change is wholly invisible
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - W sieci pracuje serwer nazw starszego mechanizmu porządkujący ewidencję tym komunikatem i nie przewidziano szumu w jego dzienniku
      - Nie ma okna serwisowego na ponowne uruchomienie maszyny, a zmiana bez niego nie obowiązuje
    en:
      - A name server of the older mechanism that tidies its records by this message works on the network and no allowance has been made for noise in its log
      - There is no maintenance window for starting the machine again, and without one the change does not hold
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
      $name = 'NoNameReleaseOnDemand'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
    $name = 'NoNameReleaseOnDemand'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoNameReleaseOnDemand' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Punkt jest przykładem reguły, której uciążliwość nie bierze się ze
    skutku, tylko z drogi wdrożenia. Sama zmiana jest niewidoczna; ciężar
    leży w tym, że wymaga restartu. Aplikacja powinna tę różnicę umieć
    pokazać, bo inaczej użytkownik czyta klasę jako ostrzeżenie przed
    skutkiem, którego nie ma.

    Wynika stąd rzecz praktyczna: ponowny audyt tuż po wykonaniu pokaże wpis
    ustawiony, a zachowanie maszyny stare. Jest to jeden z punktów, przy
    których dowód z ponownego audytu jest niepełny do czasu restartu
    i warto, żeby raport to odnotował, zamiast ogłaszać naprawę zakończoną.

    Reguła należy do bloku starszego mechanizmu nazw i wdrażana razem
    z trybem punkt-punkt nie kosztuje osobnego okna serwisowego. Oba wymagają
    restartu, więc naturalnie idą jednym zabiegiem.
  en: |
    The item is an example of a rule whose disruption comes not of its effect but of
    the road of rollout. The change itself is invisible; the weight lies in its
    calling for a restart. The application should be able to show that difference,
    since otherwise the user reads the class as a warning against an effect that is
    not there.

    From that follows something practical: a fresh audit straight after execution
    will show the entry set and the machine's behaviour old. It is one of those
    items where the proof from a fresh audit is incomplete until the restart, and
    the report had better note that instead of declaring the repair finished.

    The rule belongs to the block of the older name mechanism, and rolled out
    together with point-to-point mode it costs no separate maintenance window. Both
    call for a restart, so they naturally go as one operation.
