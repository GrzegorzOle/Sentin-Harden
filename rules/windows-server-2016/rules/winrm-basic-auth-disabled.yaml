id: win2016-winrm-basic-auth-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service
  title:
    pl: Uwierzytelnianie podstawowe usługi zarządzania zdalnego wyłączone
    en: Basic authentication at the remote management service switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zarządzania zdalnego przyjmować
    uwierzytelnianie podstawowe, czyli takie, w którym nazwa i hasło
    wędrują do serwera w postaci dającej się odczytać.

    Sposób ten jest najprostszy z możliwych i na tym polega jego kłopot.
    Klient przesyła nazwę i hasło, serwer je sprawdza. Nie ma tu żadnego
    wyzwania, żadnego skrótu, żadnego dowodu znajomości hasła zamiast
    samego hasła — jest hasło.

    Szyfrowanie warstwy transportowej zakrywa to przed podsłuchem, ale
    niczego nie zmienia po stronie serwera. Serwer otrzymuje hasło
    w postaci jawnej i ma je w pamięci. Każdy, kto potrafi stanąć w miejscu
    serwera — przez podszycie się pod jego nazwę, przez przejęcie połączenia
    albo po prostu przez posiadanie tej maszyny — dostaje hasło, a nie
    dowód.

    Kategoria krytyczna bierze się z tego, że droga ta prowadzi wprost do
    poświadczeń, jest dostępna zdalnie i nie wymaga niczego po stronie
    użytkownika. Nie trzeba łamać hasła ani odtwarzać go ze skrótu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    w postaci nadającej się do natychmiastowego użycia gdziekolwiek indziej,
    zebrane przez samo skłonienie klienta do połączenia.
  en: |
    The setting forbids the remote management service to accept basic
    authentication, which is to say the kind where a name and a password travel to
    the server in a readable form.

    That way is the simplest there is, and therein lies its trouble. The client
    sends a name and a password, the server checks them. There is no challenge here,
    no digest, no proof of knowing the password in place of the password itself -
    there is the password.

    Encryption of the transport layer covers this from eavesdropping but changes
    nothing on the server's side. The server receives the password in the clear and
    holds it in memory. Anybody able to stand in the server's place - by taking on
    its name, by seizing the connection, or simply by owning that machine - gets a
    password rather than a proof.

    The critical category comes from this road leading straight to credentials,
    being reachable remotely, and calling for nothing on the user's side. No
    password has to be broken and none reconstructed from a digest.

    What an attacker gains while the item goes unmet: a password in a form fit for
    immediate use anywhere else, gathered by merely inducing a client to connect.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, co się z tą maszyną
    łączy i czym się przy tym przedstawia.

    Sposób ten bywa używany w dwóch sytuacjach i obie są wąskie. Pierwsza
    to połączenia z maszyn spoza domeny, które nie mają wspólnego
    mechanizmu uwierzytelniania i sięgają po ten najprostszy. Druga to
    narzędzia i biblioteki napisane pod inne systemy, w których sposób ten
    jest domyślny.

    Objaw przy wdrożeniu jest wyraźny: połączenie zostaje odrzucone,
    a komunikat mówi o niepowodzeniu uwierzytelniania. Prowadzi to ku
    sprawdzaniu hasła zamiast ku zasadzie, więc rozpoznanie przyczyny bywa
    dłuższe, niż wynikałoby z jasności objawu.

    Rzecz warta wymienienia: wyłączenie po stronie usługi nie wyłącza
    sposobu po stronie klienta na tej samej maszynie. To osobna reguła
    i osobny wpis, mimo że nazwa wartości jest taka sama.

    Czego to nie psuje: połączeń uwierzytelnianych mechanizmem domenowym,
    uwierzytelniania certyfikatem, pulpitu zdalnego, usług, logowania
    lokalnego.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is what connects to this
    machine and how it presents itself in doing so.

    That way is used in two situations, and both are narrow. The first is
    connections from machines outside the domain, which have no shared mechanism of
    authentication and reach for the simplest one. The second is tools and libraries
    written for other systems, where that way is the default.

    The symptom at rollout is plain: the connection is refused and the message
    speaks of a failure to authenticate. That leads towards checking the password
    rather than towards a policy, so establishing the cause takes longer than the
    plainness of the symptom would suggest.

    Worth naming: switching it off on the service's side does not switch the way off
    on the client's side on the same machine. That is a separate rule and a separate
    entry, though the value bears the same name.

    What this does not break: connections authenticated by the domain mechanism,
    authentication by certificate, the remote desktop, services, or signing in
    locally.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - Połączenia z maszyn spoza domeny sięgające po ten najprostszy sposób zostają odrzucone
      - Narzędzia i biblioteki napisane pod inne systemy, w których sposób ten jest domyślny, przestają się łączyć
      - Komunikat mówi o niepowodzeniu uwierzytelniania, więc rozpoznanie prowadzi ku sprawdzaniu hasła zamiast ku zasadzie
      - Połączenia uwierzytelniane mechanizmem domenowym, uwierzytelnianie certyfikatem i pulpit zdalny pozostają bez zmian
    en:
      - Connections from machines outside the domain reaching for that simplest way are refused
      - Tools and libraries written for other systems, where that way is the default, stop connecting
      - The message speaks of a failure to authenticate, so the search leads towards checking the password rather than towards a policy
      - Connections authenticated by the domain mechanism, authentication by certificate and the remote desktop stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyną zarządza się z hostów spoza domeny, które nie mają wspólnego mechanizmu uwierzytelniania
      - Narzędzie automatyzacji łączące się z tą maszyną obsługuje wyłącznie uwierzytelnianie podstawowe
    en:
      - The machine is managed from hosts outside the domain which have no shared mechanism of authentication
      - An automation tool connecting to this machine supports basic authentication alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'AllowBasic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowBasic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBasic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Punkt otwiera blok sześciu reguł o zarządzaniu zdalnym i jest w nim
    jedynym o kategorii krytycznej. Warto tę różnicę zaznaczyć, bo pozostałe
    pięć czyta się podobnie i lista bez wyróżnienia zlewa się w jedno.

    Podział na stronę usługi i stronę klienta jest w tym bloku kluczowy
    i łatwy do przeoczenia, bo nazwy wartości powtarzają się po obu
    stronach. Strona usługi mówi, czego maszyna nie przyjmie. Strona
    klienta mówi, czego maszyna nie wyśle. Są to dwie różne decyzje i jedna
    nie wynika z drugiej.

    Częste nieporozumienie dotyczy szyfrowania transportu. Połączenie
    zaszyfrowane nie czyni uwierzytelniania podstawowego bezpiecznym,
    bo problemem nie jest podsłuch po drodze, tylko postać, w jakiej hasło
    dociera na drugi koniec. Aplikacja powinna to mówić wprost, bo jest to
    najczęstszy argument za pozostawieniem tego sposobu włączonego.
  en: |
    The item opens a block of six rules about remote management and is the only one
    in it of a critical category. That difference is worth marking, the other five
    reading much alike and a list without a distinction running into one.

    The division into the service's side and the client's side is central in this
    block and easy to overlook, the values' names repeating on both sides. The
    service's side says what the machine will not accept. The client's side says
    what the machine will not send. Those are two different decisions and neither
    follows from the other.

    A common misunderstanding concerns the encryption of the transport. An encrypted
    connection does not make basic authentication safe, the trouble being not
    eavesdropping along the way but the form in which the password arrives at the
    far end. The application should say so outright, that being the commonest
    argument for leaving this way switched on.
