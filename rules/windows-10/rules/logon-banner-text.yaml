id: win10-logon-banner-text

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Treść komunikatu wyświetlanego przed zalogowaniem ustawiona
    en: The body of the message shown before signing in set
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Komunikat wyświetlany przed zalogowaniem nie jest zabezpieczeniem technicznym
    i nie powstrzyma nikogo przed wpisaniem hasła. Jego wartość leży gdzie
    indziej: zdejmuje z korzystającego możliwość powiedzenia, że nie wiedział,
    czyj to sprzęt, na jakich zasadach z niego korzysta i że praca na nim jest
    rejestrowana.

    W postępowaniu dyscyplinarnym albo sądowym to bywa różnica między sprawą do
    wygrania a sprawą przegraną. Dlatego punkt istnieje w każdym benchmarku, choć
    żadnej drogi wejścia nie zamyka — i dlatego jego kategoria ryzyka jest niska,
    a nie zerowa.

    Sprawdzenie pyta wyłącznie o to, czy treść jest ustawiona i niepusta. O tym,
    co ma w niej stać, decyduje dział prawny organizacji, a nie benchmark.
  en: |
    A message shown before sign-in is no technical safeguard and will stop nobody
    from typing a password. Its value lies elsewhere - it takes away from the user
    any claim that they did not know whose hardware this is, on what terms they
    use it and that work on it is recorded.

    In a disciplinary or a court case that is sometimes the difference between a
    winnable matter and a lost one. Hence the item appears in every benchmark
    though it closes no way in - and hence its risk rating is low rather than
    nil.

    The check asks only whether the text is set and not empty. What ought to stand
    in it is for the organisation s legal department to decide, not for a
    benchmark.

disruption_description:
  pl: |
    Sama zmiana niczego nie psuje, ale dokłada jedno kliknięcie do każdego
    logowania i dlatego wymaga świadomego wdrożenia. Ludzie muszą wiedzieć, skąd
    wzięło się okno, które nagle stanęło im na drodze.

    Poważniejsza sprawa jest inna: wszystko, co loguje się automatycznie, zaczyna
    się o ten komunikat zatrzymywać. Dotyczy to stanowisk kioskowych, maszyn
    startujących bez udziału człowieka i narzędzi łączących się pulpitem zdalnym
    w tle. Każde z nich trzeba sprawdzić osobno przed wdrożeniem.

    Treść trzeba uzgodnić z działem prawnym. Polecenie naprawcze wpisuje
    brzmienie przykładowe i jest ono punktem wyjścia, a nie gotowym tekstem
    do wdrożenia w organizacji.
  en: |
    The change itself breaks nothing, but it adds a click to every sign-in and so
    calls for a planned rollout. People have to know where the window that
    suddenly stands in their way came from.

    The graver matter is another one - everything that signs in by itself starts
    stopping at this message. That covers kiosk stations, machines starting with
    no person present and tools connecting over remote desktop in the background.
    Each of them has to be checked separately before the rollout.

    The wording has to be agreed with the legal department. The remediation
    command writes a sample text, and that is a starting point rather than
    finished wording to deploy in an organisation.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Każde logowanie interaktywne wymaga potwierdzenia komunikatu, co dokłada jedno kliknięcie do codziennego odruchu
      - Stanowiska kioskowe i maszyny startujące bez udziału człowieka zatrzymają się na komunikacie i nie dokończą logowania
      - Narzędzia łączące się pulpitem zdalnym w tle mogą nie poradzić sobie z oknem stojącym przed pulpitem
      - Skrypty i zadania uruchamiane w sesji użytkownika przy starcie nie wystartują, dopóki nikt nie potwierdzi komunikatu
      - Logowanie kontem usługi, zadania harmonogramu, dostęp do udziałów i praca po zalogowaniu pozostają bez zmian
    en:
      - Every interactive sign-in calls for acknowledging the message, adding a click to a daily reflex
      - Kiosk stations and machines starting with nobody present stop at the message and never finish signing in
      - Tools connecting over remote desktop in the background may not cope with a window standing in front of the desktop
      - Scripts and tasks started in a user session at boot do not run until somebody acknowledges the message
      - Service account sign-in, scheduled tasks, access to shares and work after signing in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska kioskowe i maszyny logujące się automatycznie, dopóki nie zostanie dla nich przewidziany wyjątek
      - Maszyny startujące bez udziału człowieka, na których nikt nie potwierdzi komunikatu
      - Środowiska bez uzgodnionej treści komunikatu — wpisanie brzmienia przykładowego jest gorsze niż jego brak
    en:
      - Kiosk stations and machines signing in automatically, until an exception is made for them
      - Machines starting with nobody present, where no one will acknowledge the message
      - Environments with no agreed wording - writing in the sample text is worse than having none
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is kept as text, but a policy set earlier can leave it as a
      # list of lines. Both forms are joined before the emptiness check.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'legalnoticetext'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      else {
        $joined = if ($value -is [array]) { [string]::Join(' ', $value) } else { [string]$value }
        if ($joined.Trim() -eq '') { 'EMPTY' } else { 'SET' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'SET'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'legalnoticetext'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording below is a starting point, not a requirement of the item.
    # Agree the organisation s own wording before rolling this out widely.
    $message = 'This system is for the use of authorised people only. ' +
      'Use of it is recorded, and the records belong to the organisation ' +
      'that owns this machine.'
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'legalnoticetext' -Value $message -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-text-for-users-attempting-to-log-on

notes:
  pl: |
    Sprawdzenie rozróżnia trzy stany: brak wpisu, wpis pusty i wpis ustawiony.
    Wpis pusty jest zgłaszany osobno, bo wygląda jak spełnienie punktu, a
    komunikat i tak się nie pojawia. Punkt działa wyłącznie w parze z tytułem
    komunikatu — sama treść bez tytułu nie wystarcza, żeby okno się wyświetliło.
  en: |
    The check tells three states apart - no entry, an empty entry and one that is
    set. An empty entry is reported separately, because it looks like the item
    being met while no message appears at all. The item works only in a pair with
    the message title - the body alone is not enough for the window to show.
