id: win2016-deny-batch-logon-guests

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa logowania w trybie wsadowym dla grupy Goście
    en: Batch job sign-in refused to the Guests group
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wpisuje grupę Goście na listę kont, którym odmawia się logowania
    w trybie wsadowym.

    Tryb wsadowy to sposób, w jaki loguje się zadanie harmonogramu. Nikt przy
    tym nie siedzi, nikt nie wpisuje hasła i nikt nie widzi, że logowanie
    nastąpiło — poza dziennikiem, do którego trzeba zajrzeć.

    Właśnie ta cichość czyni z tego trybu wygodne miejsce na trwałe zagnieżdżenie
    się w maszynie. Zadanie uruchamiane co godzinę na koncie o niskich
    uprawnieniach przeżywa restarty, nie rzuca się w oczy na liście procesów
    i wygląda na element konfiguracji.

    Kategoria średnia. Punkt sam nie blokuje ataku — blokuje jeden z wygodnych
    sposobów jego utrwalenia, i to tylko dla jednej grupy.

    Na serwerze 2016 warto to ustawić razem z pozostałymi odmowami, bo na
    maszynie z długą historią zadania harmonogramu narastały latami i nikt ich
    nie przeglądał. Ten punkt zapewnia, że przynajmniej konto gościa nigdy się
    wśród nich nie znajdzie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    utrwalenia się na maszynie przez zadanie uruchamiane na koncie, którego nikt
    nie kojarzy z pracą.
  en: |
    The item puts the Guests group onto the list of accounts refused sign-in as a
    batch job.

    The batch mode is how a scheduled task signs in. Nobody sits over it, nobody
    types a password and nobody sees the sign-in happen - beyond the log, which has
    to be looked at.

    That quietness is exactly what makes this mode a convenient place to settle
    permanently on a machine. A task run every hour under a low-privilege account
    survives restarts, does not stand out in the process list and looks like part
    of the configuration.

    The category is medium. The item blocks no attack by itself - it blocks one of
    the convenient ways of making an attack permanent, and only for one group.

    On Server 2016 it is worth setting together with the other refusals, because on
    a machine with a long history the scheduled tasks accumulated over years and
    nobody has reviewed them. This item makes sure that at least the guest account
    will never be among them.

    What an attacker gains while the item goes unmet: the means of settling
    permanently on the machine through a task run under an account nobody connects
    with work.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Żadne zadanie harmonogramu nie działa na koncie
    gościa, bo konto to jest domyślnie wyłączone i nie ma hasła nadającego się
    do zapisania w zadaniu.

    Zmiana jest więc w praktyce zabezpieczeniem na przyszłość, a nie naprawą
    stanu bieżącego. Warto ją zastosować właśnie dlatego, że nic nie kosztuje,
    a zamyka drogę, którą trudno zauważyć po fakcie.

    Czego to nie psuje: zadań harmonogramu działających na kontach usługowych,
    na koncie systemowym ani na kontach użytkowników.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". No scheduled task runs under the guest account,
    because that account is disabled by default and has no password worth recording
    in a task.

    The change is therefore in practice a safeguard for the future rather than a
    repair of the present state. It is worth applying precisely because it costs
    nothing and closes a road that is hard to notice after the event.

    What this does not break: scheduled tasks running under service accounts, under
    the system account, or under users' accounts.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zadanie harmonogramu ustawione na koncie gościa przestaje się uruchamiać
      - Odmowa obowiązuje także po ewentualnym włączeniu konta gościa i nadaniu mu hasła
      - Zadania działające na kontach usługowych i na koncie systemowym działają bez zmian
      - Zadania uruchamiane na kontach użytkowników pozostają nietknięte
    en:
      - A scheduled task set to run under the guest account stops starting
      - The refusal holds even after the guest account is switched on and given a password
      - Tasks running under service accounts and under the system account work unchanged
      - Tasks run under users' accounts stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie działa zadanie harmonogramu ustawione na konto gościa i nie ustalono, co je uruchamia
    en:
      - A scheduled task set to run under the guest account runs on this machine and it has not been established what starts it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyBatchLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'S-1-5-32-546'
  comparison: contains

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyBatchLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyBatchLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyBatchLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    if (-not ($members -contains '*S-1-5-32-546')) { $members += '*S-1-5-32-546' }

    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyBatchLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyBatchLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-log-on-as-a-batch-job

notes:
  pl: |
    Punkt jest z natury zapobiegawczy: chroni przed stanem, który dziś nie
    zachodzi. To jest dobry przykład reguły o niskim koszcie i odległym zysku,
    i tak też należy ją czytać w raporcie.

    Polecenie naprawcze dopisuje grupę do listy, zamiast listę zastępować,
    żeby nie zdjąć odmowy nadanej wcześniej komuś innemu.

    Tryb wsadowy jest osobny od trybu usługi, opisanego sąsiednią regułą.
    Zadanie harmonogramu loguje się wsadowo, usługa systemowa — jako usługa;
    odmowa w jednym trybie nie obejmuje drugiego.
  en: |
    The item is preventive by nature: it guards against a state that does not
    obtain today. It is a good example of a rule with a low cost and a distant
    gain, and that is how it should be read in the report.

    The remedy adds the group to the list rather than replacing the list, so as not
    to lift a refusal granted earlier against somebody else.

    The batch mode is separate from the service mode, described by the neighbouring
    rule. A scheduled task signs in as a batch job, a system service as a service;
    a refusal in one mode does not cover the other.
