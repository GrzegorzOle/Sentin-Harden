id: win2016-password-history-size

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Liczba pamiętanych poprzednich haseł
    en: Number of previous passwords remembered
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby system pamiętał dwadzieścia cztery poprzednie hasła
    konta i nie pozwalał ustawić żadnego z nich ponownie.

    Bez pamięci poprzednich haseł wymuszona zmiana jest pozorna: konto
    ustawia to samo hasło, które właśnie wygasło, i wszystko wraca do punktu
    wyjścia. Materiał, który wyciekł, znów jest aktualny, a data zmiany
    w raporcie sugeruje coś, co się nie wydarzyło.

    Na serwerze rzecz dotyczy przede wszystkim kont, które nie należą do
    nikogo: kont usługowych, serwisowych i używanych przez zadania
    uruchamiane harmonogramem. To właśnie przy nich zmiana hasła bywa
    czynnością formalną — trzeba coś wpisać, więc wpisuje się to, co było,
    albo to, co było, z doklejoną cyfrą.

    Na maszynie tego rocznika ten wzorzec ma po prostu więcej czasu za sobą.
    Serwer 2016 pracuje w niektórych instalacjach od wdrożenia, a konto
    usługowe założone wtedy przeszło już kilkanaście wymuszonych zmian. Jeśli
    historia jest pusta, wszystkie te zmiany mogły prowadzić do tego samego
    hasła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło zdobyte
    kiedykolwiek w przeszłości pozostaje kandydatem na hasło bieżące.
    Ponieważ listy haseł wyciekłych są trwałe, a konta usługowe żyją latami,
    jest to droga tania i cierpliwa.

    Historia haseł nie jest zabezpieczeniem samodzielnym i dlatego kategoria
    jest niska. Ma sens wyłącznie razem z wygasaniem haseł, któremu służy —
    bez niego wygasanie jest kosztem bez efektu.
  en: |
    The item requires the system to remember an account's twenty-four previous
    passwords and to refuse any of them being set again.

    Without a memory of previous passwords a forced change is only apparent:
    the account sets the same password that has just expired, and everything
    goes back to where it started. The material that leaked is current again,
    and the date of change in the report suggests something that did not
    happen.

    On a server the matter concerns above all accounts that belong to nobody:
    service accounts, maintenance accounts and accounts used by scheduled
    tasks. It is with those that a password change tends to be a formality -
    something has to be typed, so what was there is typed, or what was there
    with a digit stuck on.

    On a machine of this vintage that pattern simply has more time behind it.
    In some installations Server 2016 has been running since deployment, and a
    service account created back then has been through a dozen or more forced
    changes. If the history is empty, all of those changes may have led to the
    same password.

    What an attacker gains while the item goes unmet: a password obtained at
    any time in the past stays a candidate for the current one. Since lists of
    leaked passwords are permanent and service accounts live for years, that
    is a cheap and patient road.

    A password history is no safeguard on its own, and that is why the
    category is low. It makes sense only together with password expiry, which
    it serves - without that, expiry is a cost with no effect.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czy na serwerze
    istnieją konta lokalne, których hasła zmienia człowiek.

    Na serwerze członkowskim zasada obejmuje wyłącznie konta lokalne. Konta
    domenowe podlegają zasadzie domeny i ta zmiana ich nie dotyczy — jest to
    najczęstsze nieporozumienie przy tym punkcie i warto je rozstrzygnąć przed
    wdrożeniem.

    Na kontrolerze domeny rzecz ma się odwrotnie: zasada lokalna jest zasadą
    domeny, więc zmiana obejmuje wszystkie konta w domenie naraz. Na tej roli
    punkt nie jest drobiazgiem i wymaga takiego samego przygotowania jak każda
    zmiana obejmująca wszystkich użytkowników.

    Skutek pojawia się przy najbliższej zmianie hasła: poprzednie hasła
    przestają być przyjmowane. Hasła bieżące nie są unieważniane, więc w dniu
    wdrożenia nic nie przestaje działać.

    Osobno warto pomyśleć o kontach usługowych, których hasło jest zapisane
    w kilku miejscach — w pliku konfiguracyjnym usługi, w definicji zadania,
    w dokumentacji zespołu. Historia haseł nie psuje tego układu, ale sprawia,
    że przy zmianie nie da się już wrócić do wartości, którą te miejsca znają.

    Zmiana nie wymaga restartu.
  en: |
    The class is "needs review", and the review is about whether local accounts
    whose passwords a person changes exist on the server at all.

    On a member server the policy covers local accounts only. Domain accounts
    fall under the domain policy and this change does not concern them - that
    is the commonest misunderstanding with this item and is worth settling
    before the rollout.

    On a domain controller it is the other way round: the local policy is the
    domain policy, so the change covers every account in the domain at once. On
    that role the item is no trifle and needs the same preparation as any
    change that reaches every user.

    The effect shows up at the next password change: previous passwords stop
    being accepted. Current passwords are not voided, so on the day of the
    rollout nothing stops working.

    Service accounts whose password is written down in several places deserve a
    separate thought - in a service configuration file, in a task definition,
    in the team's documentation. A password history does not break that
    arrangement, but it does mean that at a change there is no going back to
    the value those places know.

    The change needs no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Przy zmianie hasła poprzednie hasła przestają być przyjmowane
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
      - Konta usługowe z hasłem zapisanym w kilku miejscach wymagają zmiany wszędzie naraz
      - Hasła bieżące nie są tą zmianą unieważniane
    en:
      - At a password change previous passwords stop being accepted
      - On a domain controller the change covers every account in the domain at once
      - Service accounts with a password written down in several places need changing everywhere at once
      - Current passwords are not voided by this change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - The server is a domain controller and a change to the domain policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordHistorySize\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '24'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^PasswordHistorySize\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'PasswordHistorySize'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The history has a point only alongside password expiry. Alone it changes
    # nothing, because nothing forces a change in the first place.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordHistorySize = 24',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordHistorySize = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enforce-password-history

notes:
  pl: |
    Zakres zasady zależy od roli serwera i jest to rzecz do sprawdzenia przed
    wdrożeniem, a nie po. Na serwerze członkowskim obejmuje konta lokalne;
    na kontrolerze domeny — wszystkie konta w domenie.

    Reguła nie deklaruje roli w polu platform, bo punkt dotyczy obu, ale waga
    skutku jest na nich zupełnie inna. Ta sama wartość liczbowa oznacza na
    jednej roli drobiazg, a na drugiej zmianę dotykającą całej organizacji.

    Kategoria ryzyka jest niska, bo sam punkt niczego nie zamyka. Podnosi
    natomiast skuteczność wygasania haseł, z którym tworzy parę.
  en: |
    The policy's reach depends on the server's role and that is a thing to
    check before the rollout, not after. On a member server it covers local
    accounts; on a domain controller every account in the domain.

    The rule declares no role in the platform field, since the item concerns
    both, but the weight of the effect differs entirely between them. The same
    number means a trifle on one role and a change touching the whole
    organisation on the other.

    The risk category is low, because the item closes nothing on its own. What
    it does is make password expiry effective, with which it forms a pair.
