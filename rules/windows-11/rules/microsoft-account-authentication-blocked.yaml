id: win11-microsoft-account-authentication-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft account
  title:
    pl: Uwierzytelnianie kontem konsumenckim zablokowane
    en: Authentication with a consumer account blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Windows pozwala zalogować się i uwierzytelnić kontem konsumenckim — tym
    samym, którym ludzie posługują się prywatnie w sklepie z aplikacjami,
    w poczcie i w usłudze przechowywania plików. Na stanowisku firmowym oznacza
    to drugą tożsamość obok firmowej, o której nikt w firmie nie rozstrzyga.

    Skutek jest podwójny. Po stronie kontroli dostępu konto konsumenckie leży
    poza zasięgiem administratora: jego hasła nie da się zresetować, drugiego
    składnika wymusić, a przy odejściu pracownika — odebrać. Po stronie danych
    jest to gotowa droga wyprowadzenia pliku ze stanowiska do prywatnej
    przestrzeni, bez żadnego narzędzia i bez śladu w systemach firmowych.

    Napastnik, który przejął konto prywatne pracownika — a te chroni się zwykle
    gorzej niż firmowe — dostaje przy takim układzie punkt zaczepienia na
    maszynie firmowej. Zablokowanie uwierzytelniania zamyka tę drogę.
  en: |
    Windows allows signing in and authenticating with a consumer account - the same
    one people use privately in the application store, in mail and in a file storage
    service. On a company station this means a second identity alongside the company
    one, which nobody in the company settles anything about.

    The effect is twofold. On the access control side a consumer account lies beyond
    an administrator's reach: its password cannot be reset, a second factor cannot
    be required, and when an employee leaves it cannot be taken away. On the data
    side it is a ready road for a file to leave the station for a private space,
    with no tooling and no trace in company systems.

    An attacker who has taken over an employee's private account - and those are
    usually guarded worse than company ones - gets a foothold on the company machine
    under such an arrangement. Blocking the authentication closes that road.

disruption_description:
  pl: |
    Jest to zmiana odczuwalna i wymaga uprzedzenia ludzi, a nie tylko wdrożenia.

    Przestaną działać wszystkie mechanizmy oparte na koncie konsumenckim: sklep
    z aplikacjami dla tego konta, synchronizacja ustawień między urządzeniami
    prywatnymi, prywatna przestrzeń dyskowa podpięta w eksploratorze oraz
    logowanie do usług, które pracownik dopiął pod konto prywatne.

    Kłopotliwy jest przypadek pośredni: maszyna, na której konto lokalne zostało
    kiedyś powiązane z kontem konsumenckim. Po zmianie powiązanie przestaje
    działać i logowanie wymaga hasła lokalnego, którego użytkownik może nie znać,
    bo od lat loguje się kodem albo odciskiem palca. Sprawdzenie tego przed
    wdrożeniem jest warunkiem, a nie ostrożnością — inaczej kończy się to
    stanowiskiem, do którego nikt nie wejdzie.

    Zmiana obowiązuje po ponownym zalogowaniu i nie wymaga restartu maszyny.
  en: |
    This is a change people feel, and it calls for warning them rather than merely
    applying it.

    Everything resting on a consumer account stops working: the application store
    for that account, settings synchronised between private devices, private disk
    space hooked into the explorer, and signing in to services the employee attached
    to their private account.

    The awkward case is the middle one: a machine whose local account was once tied
    to a consumer account. After the change the tie stops working and signing in
    needs the local password, which the user may not know, having signed in with a
    code or a fingerprint for years. Checking this before the rollout is a condition,
    not a precaution - otherwise it ends with a station nobody can get into.

    The change takes effect at the next sign-in and needs no machine restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Logowanie kontem konsumenckim przestanie działać, a powiązane konto lokalne będzie wymagało hasła lokalnego
      - Sklep z aplikacjami oraz synchronizacja ustawień oparte na koncie prywatnym przestaną działać
      - Prywatna przestrzeń dyskowa podpięta pod konto konsumenckie zniknie z eksploratora
    en:
      - Signing in with a consumer account stops working, and a tied local account will need its local password
      - The application store and settings synchronisation resting on a private account stop working
      - Private disk space hooked up under a consumer account disappears from the explorer
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracują konta lokalne powiązane z kontem konsumenckim, a hasła lokalne nie zostały ustalone i przekazane
      - Stanowisko korzysta z narzędzia rozprowadzanego wyłącznie przez sklep z aplikacjami dla konta konsumenckiego
    en:
      - The machine runs local accounts tied to a consumer account, and local passwords have not been set and handed over
      - The station uses a tool distributed only through the application store for a consumer account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
      $name = 'DisableUserAuth'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    $name = 'DisableUserAuth'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableUserAuth' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-accounts

notes:
  pl: |
    Punkt dotyczy wyłącznie kont konsumenckich. Konta firmowe i szkolne
    prowadzone w usłudze katalogowej w chmurze nie są nim objęte i logowanie
    nimi działa dalej — mimo podobnego wyglądu okna logowania są to odrębne
    rodzaje tożsamości.

    Reguła sprawdza zakaz uwierzytelniania, a nie obecność powiązań, które
    powstały wcześniej. Wynik „spełniony" nie mówi, że na maszynie nie ma konta
    powiązanego z kontem konsumenckim — mówi, że nowe uwierzytelnienie nie
    dojdzie do skutku. Przegląd istniejących powiązań jest osobną czynnością
    i należy go wykonać przed wdrożeniem, nie po.
  en: |
    The item concerns consumer accounts only. Company and school accounts kept in a
    directory service in the cloud are not covered and signing in with them keeps
    working - despite the similar look of the sign-in window these are separate
    kinds of identity.

    The rule checks the ban on authenticating, not the presence of ties made
    earlier. A result of "met" does not say there is no account tied to a consumer
    one on the machine - it says a new authentication will not come about. Reviewing
    existing ties is a separate task and is to be done before the rollout, not
    after.
