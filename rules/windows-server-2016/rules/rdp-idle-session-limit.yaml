id: win2016-rdp-idle-session-limit

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits
  title:
    pl: Bezczynna sesja pulpitu zdalnego kończona po kwadransie
    en: An idle remote desktop session ended after a quarter of an hour
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyznacza czas, po jakim serwer kończy sesję zdalną, w której
    nikt nic nie robi — mimo że połączenie trwa i okno jest otwarte.

    Sesja bezczynna różni się od rozłączonej jednym: ona wciąż jest komuś
    wyświetlana. I właśnie to jest jej słabością. Otwarte okno sesji stoi na
    stanowisku, nad którym zespół utrzymujący serwer nie ma władzy —
    w pokoju, przez który przechodzą inni, na laptopie zostawionym na czas
    spotkania, na maszynie, z której korzysta więcej niż jedna osoba.

    Kto usiądzie przy takim stanowisku, nie musi niczego łamać. Zastaje
    otwartą sesję zalogowaną kontem o uprawnieniach serwerowych, zwykle
    z konsolą zarządzania w środku. Nie zostawia przy tym śladu logowania,
    bo nikt się nie logował — działa jako osoba, która sesję otworzyła, i tak
    zostanie zapisany w dzienniku.

    Do tego dochodzi to samo, co przy sesji rozłączonej: poświadczenie
    zalogowanego konta leży w pamięci maszyny tak długo, jak długo sesja
    trwa.

    Punkt jest lżejszy od limitu rozłączenia, bo wymaga od napastnika
    obecności przy cudzym stanowisku. Jest jednak drogą realną i wyjątkowo
    tanią, a dziennik po niej nie odróżnia sprawcy od właściciela konta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową,
    zalogowaną sesję przy każdym stanowisku zostawionym bez opieki — i to
    bez śladu w dzienniku wskazującego na kogokolwiek innego.
  en: |
    The setting marks the time after which the server ends a remote session in which
    nobody does anything - even though the connection holds and the window is open.

    An idle session differs from a disconnected one in one thing: it is still being
    shown to somebody. And that is exactly its weakness. An open session window
    stands at a workstation the team keeping the server has no power over - in a
    room others pass through, on a laptop left for the length of a meeting, on a
    machine more than one person uses.

    Whoever sits down at such a workstation need break nothing. They find an open
    session signed in with an account holding server privileges, as a rule with a
    management console inside. They leave no sign-in trace while doing so, since
    nobody signed in - they act as the person who opened the session, and so they
    will be recorded in the log.

    To this is added the same as with a disconnected session: the signed-in
    account's credential lies in the machine's memory for as long as the session
    lasts.

    The item is lighter than the disconnection limit, since it calls for the
    attacker to be present at somebody else's workstation. It is a real road though,
    and an exceptionally cheap one, and the log left by it does not tell the doer
    from the owner of the account.

    What an attacker gains while the item goes unmet: a ready, signed-in session at
    every workstation left unattended - and that with no trace in the log pointing
    at anybody else.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", choć kwadrans jest czasem na tyle
    długim, że dla większości pracy zmiana przejdzie niezauważona.

    Kłopot leży w definicji bezczynności i to jest tu rzecz najważniejsza.
    Bezczynność liczy się od ostatniego ruchu myszy albo naciśnięcia
    klawisza, a nie od ostatniej pracy wykonanej przez maszynę. Sesja,
    w której trwa długi import, kompilacja albo kopiowanie, jest z punktu
    widzenia tego licznika bezczynna — człowiek patrzy na pasek postępu
    i niczego nie dotyka.

    Skutek jest dotkliwy właśnie dlatego, że przeczy intuicji: przerwane
    zostaje to, co akurat najbardziej wymagało dokończenia. Zadania długie
    trzeba więc przenieść poza sesję, do harmonogramu albo usługi, zanim
    reguła wejdzie.

    Druga grupa to narzędzia nadzoru wyświetlające wykresy albo dzienniki
    w oknie sesji. Człowiek na nie patrzy, ale nie dotyka klawiatury, więc
    licznik biegnie.

    Objaw jest widoczny i przewidywalny: sesja kończy się sama, a przy
    ponownym połączeniu pulpit jest czysty. Uprzedzenie ludzi jest tu
    częścią wdrożenia.

    Czego to nie psuje: sesji, w których ktoś pracuje; konsoli lokalnej;
    zadań harmonogramu; usług działających poza sesją.

    Bez restartu, natychmiast odwracalne — ale skutek dotyka każdej sesji
    otwartej po zmianie.
  en: |
    The class is "needs a planned rollout", though a quarter of an hour is long
    enough that for most work the change will pass unnoticed.

    The trouble lies in the definition of idleness, and that is the chief thing
    here. Idleness is counted from the last movement of a mouse or press of a key,
    not from the last work the machine did. A session in which a long import, a
    build or a copying is running is, from this counter's point of view, idle - the
    person watches a progress bar and touches nothing.

    The effect is painful precisely because it runs against intuition: what gets
    broken off is what most needed finishing. Long jobs must therefore be moved
    outside the session, to a scheduler or a service, before the rule goes in.

    The second group is monitoring tools showing charts or logs in the session
    window. A person watches them but does not touch the keyboard, so the counter
    runs.

    The symptom is visible and foreseeable: the session ends by itself, and on
    reconnecting the desktop is clean. Warning people is here part of the rollout.

    What this does not break: sessions somebody is working in, the local console,
    scheduled tasks, or services running outside a session.

    No restart, undone immediately - but the effect touches every session opened
    after the change.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Sesja, w której trwa długi import albo kopiowanie, liczy się jako bezczynna i zostaje zamknięta w trakcie pracy maszyny
      - Narzędzia nadzoru wyświetlające wykresy albo dzienniki w oknie sesji kończą się razem z nią, bo nikt nie dotyka klawiatury
      - Powrót do pracy po przerwie dłuższej niż kwadrans wymaga zalogowania od nowa i zastania czystego pulpitu
      - Sesje, w których ktoś pracuje, konsola lokalna i zadania harmonogramu pozostają bez zmian
    en:
      - A session in which a long import or copying is running counts as idle and is closed while the machine is still working
      - Monitoring tools showing charts or logs in a session window end along with it, since nobody touches the keyboard
      - Coming back to work after a break longer than a quarter of an hour calls for signing in afresh and finding a clean desktop
      - Sessions somebody is working in, the local console and scheduled tasks stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z sesji zdalnych uruchamiane są długie zadania, przy których człowiek nie dotyka klawiatury, a nie przeniesiono ich poza sesję
      - Sesje zdalne na tej maszynie służą do stałego podglądu wykresów albo dzienników i przerwanie ich odbiera nadzór
    en:
      - Long jobs during which a person touches no keyboard are started from remote sessions and have not been moved outside the session
      - Remote sessions on this machine serve to keep watch on charts or logs and breaking them off takes that watch away
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it is the absence of a limit, not the
      # shortest one. Reported apart, so a report cannot read it as a very strict
      # setting.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'MaxIdleTime'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_LIMIT' }
        elseif ([int]$value -le 900000) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'MaxIdleTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxIdleTime' -Value 900000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Rozróżnienie bezczynności człowieka od bezczynności maszyny powinno być
    widoczne w aplikacji przy tym punkcie, a nie schowane w opisie. Jest to
    jedyne nieporozumienie, jakie ta reguła regularnie wywołuje, i kosztuje
    przerwane zadania.

    Tak jak przy limicie rozłączenia, audyt podaje zero jako osobny stan
    „brak limitu", a wartość przekroczoną razem z liczbą. Zero jest tu
    przeciwieństwem zamierzenia, nie jego skrajną postacią.

    Kategoria ryzyka jest niższa niż przy sesji rozłączonej i wynika to
    z kryterium, nie z wygody. Sesja rozłączona wisi w pamięci maszyny
    i jest dostępna każdemu, kto uzyska na serwerze uprawnienia wysokie.
    Sesja bezczynna wymaga obecności przy cudzym stanowisku — droga realna,
    ale węższa.
  en: |
    The telling apart of a person's idleness from a machine's should be visible in
    the application at this item rather than hidden in the description. It is the
    one misunderstanding this rule regularly raises, and it costs broken jobs.

    As at the disconnection limit, the audit gives zero as a separate state "no
    limit", and an exceeded value with its number. Zero is here the opposite of the
    intention rather than its extreme form.

    The risk category is lower than at a disconnected session, and that follows from
    the criterion rather than from convenience. A disconnected session hangs in the
    machine's memory and is open to anybody gaining high privileges on the server.
    An idle session calls for presence at somebody else's workstation - a real road,
    but a narrower one.
