id: win2025-store-apps-account-optional

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App runtime
  title:
    pl: Aplikacje ze sklepu nie mogą wymagać konta konsumenckiego
    en: Store applications may not require a consumer account
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera aplikacjom ze sklepu możliwość wymagania konta
    konsumenckiego — po zmianie aplikacja może o nie poprosić, ale nie może
    uzależnić od niego swojego działania.

    Kategoria średnia i chcę wyjaśnić, czemu ten punkt istnieje obok
    zablokowania uwierzytelniania takim kontem, skoro dotyczą tej samej
    rzeczy. Tamten zamyka drogę na poziomie systemu. Ten odbiera aplikacji
    argument, którym ludzie są do tej drogi popychani. Różnica jest
    praktyczna: człowiek, któremu aplikacja mówi „zaloguj się, żeby
    kontynuować", zakłada konto, bo chce dokończyć pracę.

    To jest właściwa treść punktu. Dobrą zasadę omija się najczęściej nie
    dlatego, że ktoś jej nie rozumie, tylko dlatego, że stanęła w poprzek
    zadania do wykonania. Reguła zdejmuje ten nacisk, zamiast liczyć na to,
    że ludzie wytrwają.

    Na serwerze aplikacji ze sklepu jest niewiele, więc punkt jest przede
    wszystkim zabezpieczeniem na przyszłość — dotyczy tego, co ktoś
    zainstaluje później, a nie tego, co stoi dziś.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost,
    ale organizacja traci na tym, że użytkownicy są popychani ku kontom
    spoza jej kontroli przez zwykłą chęć dokończenia zadania.
  en: |
    The item takes from store applications the ability to require a consumer
    account - after the change an application may ask for one, but may not
    make its working depend on it.

    The category is medium, and I want to explain why this item exists
    alongside the blocking of authentication with such an account, given that
    both concern the same thing. That one closes the road at the level of the
    system. This one takes from the application the argument by which people
    are pushed down that road. The difference is a practical one: a person
    told by an application "sign in to continue" sets up an account, because
    they want to finish their work.

    That is the real substance of the item. A good rule is most often got
    round not because somebody fails to understand it, but because it stood
    across a task that had to be done. The rule lifts that pressure instead
    of counting on people to hold out.

    On a server there are few store applications, so the item is above all a
    protection for the future - it concerns what somebody installs later
    rather than what stands there today.

    What an attacker gains while the item goes unmet: nothing directly, but
    the organisation loses by its users being pushed towards accounts outside
    its control by the plain wish to finish a task.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie widzę tu nic do stracenia.
    Aplikacji, których to dotyczy, na wydaniu serwerowym praktycznie nie ma.

    Skutek, gdyby taka aplikacja była: jej okno logowania przestanie być
    warunkiem dalszej pracy. Część funkcji, które rzeczywiście wymagają
    konta po stronie dostawcy, nadal nie zadziała — bo nie da się użyć
    usługi zewnętrznej bez tożsamości u tego dostawcy. Reguła nie obiecuje
    tu cudu, odbiera tylko wymuszenie.

    Uczciwe rozróżnienie: to nie jest reguła, która sprawia, że aplikacje
    zaczynają działać bez konta. To reguła, która sprawia, że aplikacja nie
    może blokować całej siebie na pytaniu o konto.

    Czego to nie psuje: aplikacji nieproszących o konto, aplikacji
    korzystających z konta domenowego, klasycznych programów, ról serwera
    ani niczego poza sklepem.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption" and on a server I see nothing to lose. The
    applications concerned are practically absent from the server edition.

    The effect, were such an application present: its sign-in window stops
    being a condition of further work. Some functions that genuinely require
    an account on the provider's side will still not work - because an
    outside service cannot be used without an identity with that provider.
    The rule promises no miracle here; it removes only the compulsion.

    An honest distinction: this is not a rule that makes applications start
    working without an account. It is a rule that stops an application from
    blocking the whole of itself on a question about an account.

    What this does not break: applications that do not ask for an account,
    applications using a domain account, classic programs, server roles, or
    anything outside the store.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Okno logowania aplikacji ze sklepu przestanie być warunkiem dalszej pracy z nią
      - Funkcje wymagające konta po stronie dostawcy nadal nie zadziałają — reguła odbiera wymuszenie, a nie brak tożsamości
      - To nie reguła sprawiająca, że aplikacje działają bez konta, tylko taka, która nie pozwala im blokować całej siebie
      - Aplikacje nieproszące o konto, aplikacje na koncie domenowym i klasyczne programy działają bez zmian
    en:
      - A store application's sign-in window stops being a condition of further work with it
      - Functions needing an account on the provider's side still will not work - the rule removes compulsion, not the lack of an identity
      - This is not a rule making applications work without an account but one stopping them blocking the whole of themselves
      - Applications that do not ask for an account, applications on a domain account and classic programs work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja ze sklepu, której obsługa konta konsumenckiego jest uzgodnionym sposobem pracy
    en:
      - The machine runs a store application whose use of a consumer account is an agreed way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key sits outside the Policies\Microsoft branch, in the shell policy
      # branch, together with rules of an entirely different subject.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'MSAOptional'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'MSAOptional'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A good rule is most often got round because it stood across a task that had
    # to be done. This lifts the pressure instead of counting on people to hold
    # out: an application may ask for a consumer account but may not make its
    # working depend on one.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MSAOptional' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-appxruntime

notes:
  pl: |
    Punkt istnieje obok zablokowania uwierzytelniania kontem konsumenckim,
    bo tamten zamyka drogę na poziomie systemu, a ten odbiera aplikacji
    argument, którym ludzie są do tej drogi popychani.

    Dobrą zasadę omija się najczęściej nie z niezrozumienia, tylko dlatego,
    że stanęła w poprzek zadania do wykonania. Reguła zdejmuje nacisk,
    zamiast liczyć na to, że ludzie wytrwają.

    Uczciwe rozróżnienie: to nie reguła sprawiająca, że aplikacje działają
    bez konta, tylko taka, która nie pozwala im blokować całej siebie na
    pytaniu o konto.
  en: |
    The item exists alongside the blocking of authentication with a consumer
    account, because that one closes the road at the level of the system,
    while this one takes from the application the argument by which people
    are pushed down it.

    A good rule is most often got round not out of misunderstanding but
    because it stood across a task that had to be done. The rule lifts the
    pressure instead of counting on people to hold out.

    An honest distinction: this is not a rule making applications work
    without an account, but one stopping them from blocking the whole of
    themselves on a question about an account.
