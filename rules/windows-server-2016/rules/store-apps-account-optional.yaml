id: win2016-store-apps-account-optional

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App runtime
  title:
    pl: Aplikacje ze sklepu nie mogą wymagać konta konsumenckiego
    en: Applications from the store may not call for a consumer account
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania aplikacjom ze sklepu uzależniać swoje działanie od
    zalogowania kontem konsumenckim.

    Punkt wygląda na drobiazg administracyjny, a jest regułą o tym, jak
    naprawdę łamią się zasady. Dobra zasada bywa obchodzona najczęściej
    nie dlatego, że ktoś chciał ją obejść, tylko dlatego, że stanęła
    w poprzek zadania, które trzeba było wykonać.

    Jeżeli aplikacja potrzebna do pracy odmawia działania bez konta
    konsumenckiego, człowiek to konto założy. Założy je na tej maszynie,
    poda w nim własne dane i zacznie go używać obok konta służbowego.
    Od tej chwili część pracy odbywa się poza tożsamością, którą
    organizacja zna i którą potrafi odebrać.

    Punkt zdejmuje ten nacisk, zamiast liczyć na to, że ludzie wytrzymają.
    Aplikacja nadal może o konto poprosić; nie może od niego uzależnić
    swojego działania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tożsamość
    używaną na tej maszynie, której organizacja nie zna i której nie
    potrafi odebrać.
  en: |
    The setting forbids applications from the store to make their working hang on a logon by a consumer account.

    The item looks a trifle of administration and is a rule about how policies truly break. A good policy is got
    round most often not because somebody wished to get round it, but because it stood across a task that had to
    be done.

    If an application needed for the work refuses to run without a consumer account, a person will make that
    account. They will make it on this machine, give their own particulars in it and begin using it beside the
    work account. From that moment part of the work happens outside the identity the organisation knows and can
    take away.

    The item lifts that pressure instead of counting on people to hold out. The application may still ask for an
    account; it may not make its working hang on one.

    What an attacker gains while the item goes unmet: an identity used on this machine that the organisation does
    not know and cannot take away.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Aplikacje ze sklepu nadal działają. Znika wyłącznie możliwość
    uzależnienia ich działania od konta konsumenckiego, a to, co wymaga
    takiego konta z natury rzeczy, i tak na serwerze nie jest używane.

    Rzecz warta odnotowania: ustawienie nie blokuje zakładania ani
    używania kont konsumenckich jako takich. Zdejmuje tylko przymus po
    stronie aplikacji.

    Nie ma znanych regresji.

    Czego to nie psuje: aplikacji ze sklepu, sklepu, logowania kontem
    domenowym i lokalnym, ról serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    Applications from the store still work. What goes is solely the possibility of their working being made to hang
    on a consumer account, and what calls for such an account by its very nature is not used on a server anyway.

    Worth noting: the setting does not block the making or the using of consumer accounts as such. It lifts only
    the compulsion on the application's side.

    There are no known regressions.

    What this does not break: applications from the store, the store, logging on by a domain account and by a local
    one, the server's roles, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Aplikacja ze sklepu przestaje móc uzależnić swoje działanie od zalogowania kontem konsumenckim
      - Funkcja aplikacji wymagająca takiego konta z natury rzeczy może pozostać niedostępna
      - Zakładanie i używanie kont konsumenckich jako takich nie jest blokowane
      - Sklep, logowanie kontem domenowym i lokalnym oraz role serwera pozostają bez zmian
    en:
      - An application from the store ceases to be able to make its working hang on a logon by a consumer account
      - A function of an application that calls for such an account by its nature may stay out of reach
      - The making and using of consumer accounts as such is not blocked
      - The store, logging on by a domain account and by a local one, and the server roles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja niezbędna do pracy na tej maszynie działa wyłącznie po zalogowaniu kontem konsumenckim
    en:
      - An application needed for the work on this machine runs solely after a logon by a consumer account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key sits outside the Policies\Microsoft branch, in the shell policy
      # branch, together with rules of an entirely different subject.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'MSAOptional'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'MSAOptional'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The application may still ask for a consumer account. What it may not do
    # is make its working depend on one.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MSAOptional' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-appxruntime

notes:
  pl: |
    Punkt jest czwarty w bloku i najciekawszy z punktu widzenia
    rozumowania, a nie techniki.

    Zdanie warte postawienia wprost: dobra zasada bywa obchodzona
    najczęściej dlatego, że stanęła w poprzek zadania, które trzeba było
    wykonać. Ten punkt zdejmuje nacisk, zamiast liczyć na wytrzymałość
    ludzi — i to jest jego cała treść.

    Warto, żeby aplikacja pokazała go razem z regułami o kontach, a nie
    razem z regułami o sklepie. Przedmiotem jest tożsamość używana na
    maszynie, a nie sposób instalowania programów.

    Odnotowuję położenie wpisu. Wartość siedzi w gałęzi powłoki, obok
    ustawień o zupełnie innym przeznaczeniu, tak samo jak przy pierwszej
    regule tego bloku. Przy ręcznym szukaniu w gałęzi zasad producenta nie
    znajdzie się jej wcale.
  en: |
    The item is the fourth in the block and the most interesting from the side of the reasoning rather than of the
    technique.

    A sentence worth setting down outright: a good policy is got round most often because it stood across a task
    that had to be done. This item lifts the pressure instead of counting on people's endurance - and that is its
    whole substance.

    It is well that the application show it along with the rules about accounts and not along with the rules about
    the store. The subject is the identity used on the machine and not the way programs are installed.

    Worth noting the entry's place. The value sits in the shell branch, beside settings of a wholly different
    purpose, just as at this block's first rule. At a searching by hand in the maker's policy branch it will not be
    found at all.
