id: win11-audit-mpssvc-rule-level-policy-change

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja zmian reguł zapory
    en: Audit MPSSVC rule-level policy change
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje każdą zmianę w regułach zapory: dodanie, usunięcie,
    modyfikację, a także wyłączenie samej zapory w profilu. Bez niej reguła
    dopisana w nocy wygląda dokładnie tak samo jak reguła istniejąca od roku.

    Dopisanie sobie zezwolenia to standardowy krok po przejęciu maszyny —
    otwarcie drogi powrotnej, zanim ktoś zauważy pierwsze wejście. Zapis zmian
    odpowiada na pytanie, którego stan bieżący zapory nie da: kiedy ta reguła
    powstała i w czyim procesie.
  en: |
    The subcategory records every change to firewall rules: addition, removal,
    modification, and also the firewall itself being switched off in a profile.
    Without it, a rule added at night looks exactly like a rule that has existed
    for a year.

    Adding oneself a permission is a standard step after taking over a machine -
    opening a way back in before anybody notices the first entry. A record of
    changes answers a question the firewall's current state cannot: when this
    rule came into being, and in whose process.

disruption_description:
  pl: |
    Nic nie przestaje działać i nikt niczego nie zauważy. Zmiana dotyczy
    wyłącznie zapisu do dziennika zabezpieczeń.

    Objętość zależy od tego, jak często zmieniają się reguły. Na zwykłej stacji
    to kilka wpisów w tygodniu. Wyjątkiem jest maszyna, na której polityka jest
    odświeżana często i za każdym razem nadpisuje reguły — wtedy wpisów robi się
    dużo, a wszystkie mówią to samo i wartość zapisu spada.
  en: |
    Nothing stops working and nobody notices anything. The change concerns
    writing to the security log only.

    The volume depends on how often the rules change. On an ordinary workstation
    that is a few entries a week. The exception is a machine where policy is
    refreshed frequently and overwrites the rules each time - then the entries
    become numerous, all saying the same thing, and the value of the record
    drops.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Dziennik zabezpieczeń przyrasta o wpis przy każdej zmianie reguły zapory
      - Na maszynie z często odświeżaną polityką zapory wpisy powtarzają się przy każdym odświeżeniu
    en:
      - The security log grows by one entry at each firewall rule change
      - On a machine with frequently refreshed firewall policy the entries repeat at every refresh
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Polityka zapory jest odświeżana w krótkich odstępach i nadpisuje reguły przy każdym cyklu
    en:
      - The firewall policy is refreshed at short intervals and overwrites the rules at every cycle
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $null = auditpol /backup /file:$csv
      if (-not (Test-Path -Path $csv)) { 'CHECK_ERROR' }
      else {
        $rows = Get-Content -Path $csv -ErrorAction Stop
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
        $line = $rows | Where-Object { $_ -match '0CCE9232-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
        if (-not $line) { 'CHECK_ERROR' }
        else {
          $value = ($line -split ',')[-1].Trim()
          if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9232-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9232-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -match '^\d+$')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9232-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9232-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-mpssvc-rule-level-policy-change

notes:
  pl: |
    Wymagany jest komplet: powodzenia i niepowodzenia. Nieudana próba zmiany
    reguły zapory jest tu sygnałem samym w sobie — oznacza, że ktoś próbował
    i nie miał uprawnień, a to informacja cenniejsza niż wiele udanych zmian.

    Punkt uzupełnia rodzinę reguł zapory z tej samej paczki. Tamte ustawiają
    stan, ten pilnuje, żeby zmiana stanu nie przeszła niezauważona — bez niego
    wyłączenie zapory jest odwracalne, ale nierozliczalne.
  en: |
    The full pair is required: successes and failures. A failed attempt to change
    a firewall rule is a signal in itself - it means somebody tried and lacked
    the privileges, and that is more valuable information than many successful
    changes.

    The item complements the firewall rule family in the same pack. Those set
    the state; this one ensures a change of state does not pass unnoticed -
    without it, switching the firewall off is reversible but unaccountable.
