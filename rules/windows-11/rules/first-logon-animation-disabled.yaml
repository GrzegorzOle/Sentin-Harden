id: win11-first-logon-animation-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Animacja przy pierwszym logowaniu wyłączona
    en: The animation at the first sign-in switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza sekwencję powitalną pokazywaną przy pierwszym
    logowaniu nowego użytkownika na maszynie.

    Animacja jest sama w sobie nieszkodliwa i nie ma sensu udawać, że jest
    inaczej. Znaczenie punktu leży w tym, co jej towarzyszy: sekwencja
    powitalna prowadzi przez ekrany zachęcające do połączenia konta
    z usługami producenta, do włączenia synchronizacji i do zgody na
    dodatkowe zbieranie danych. Część z tych ekranów ma przycisk
    zatwierdzający wyróżniony, a odmowę schowaną w drobnym odsyłaczu.

    Na stanowisku roboczym są to decyzje, które powinny wynikać z zasady
    organizacji, a nie z tego, w co użytkownik kliknie w pierwszej minucie
    pracy na nowej maszynie — w pośpiechu i bez kontekstu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Wartość reguły leży w spójności: stan maszyny po
    przygotowaniu ma być taki sam niezależnie od tego, kto się na niej
    logował pierwszy i co wybrał na ekranie powitalnym.

    Skutkiem ubocznym, ale nie nieistotnym, jest czas. Pierwsze logowanie
    na przygotowanej maszynie staje się krótsze o całą sekwencję, co przy
    przygotowywaniu wielu stanowisk naraz jest różnicą odczuwalną.
  en: |
    The setting switches off the welcome sequence shown at the first sign-in of a new user
    on the machine.

    The animation is harmless in itself and there is no sense in pretending otherwise. The
    item's weight lies in what goes with it: the welcome sequence leads through screens
    urging that the account be joined to the maker's services, that synchronisation be
    switched on, and that further collection of data be consented to. Some of those screens
    have the approving button set off and the refusal hidden in a small link.

    At a working station those are decisions that ought to follow from the organisation's
    policy rather than from what the user clicks in the first minute of work on a new
    machine - in haste and with no context.

    What an attacker gains while the item goes unmet: nothing directly. The rule's value
    lies in consistency: the machine's state after preparation is to be the same whoever
    signed in on it first and whatever they chose on the welcome screen.

    A side effect, though not an unimportant one, is time. The first sign-in on a prepared
    machine becomes shorter by the whole sequence, which when many stations are being
    prepared at once is a noticeable difference.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji i nie zmienia sposobu pracy.

    Dotyczy wyłącznie pierwszego logowania nowego użytkownika. Logowania
    kolejne wyglądają tak samo jak dotąd, bo sekwencja powitalna i tak się
    przy nich nie pojawia.

    Użytkownik zamiast sekwencji zobaczy pulpit. Nic z tego, co sekwencja
    proponowała, nie jest mu odbierane — te same ustawienia pozostają
    dostępne w ustawieniach systemu, tylko przestają być podsuwane
    w pierwszej minucie.

    Zmiana nie wymaga restartu i cofa się natychmiast.
  en: |
    The change takes away no function and alters no way of working.

    It concerns the first sign-in of a new user alone. Later sign-ins look just as until
    now, since the welcome sequence does not appear at them anyway.

    The user will see the desktop instead of the sequence. Nothing the sequence proposed is
    taken from them - the same settings stay available in the system settings, they merely
    stop being put forward in the first minute.

    The change takes no restart and reverses at once.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Sekwencja powitalna przy pierwszym logowaniu przestaje się pokazywać
      - Ekrany zachęcające do połączenia konta z usługami producenta znikają
      - Te same ustawienia pozostają dostępne w ustawieniach systemu
      - Logowania kolejne wyglądają tak samo jak dotąd
    en:
      - The welcome sequence at the first sign-in stops being shown
      - The screens urging the account be joined to the maker's services vanish
      - The same settings stay available in the system settings
      - Later sign-ins of the same user look just as until now
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych konfiguracji, na których ta zmiana byłaby błędem
    en:
      - There are no known configurations on which this change would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This key sits outside the Policies\Microsoft branch.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableFirstLogonAnimation'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'EnableFirstLogonAnimation' -ErrorAction SilentlyContinue).'EnableFirstLogonAnimation'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableFirstLogonAnimation'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFirstLogonAnimation' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/

notes:
  pl: |
    Klucz jest ten sam, w którym leżą inne ustawienia logowania — między
    innymi to o powiadomieniach dostawców sieciowych i to o dostępie
    aplikacji hostowanych. Wycofanie usuwa wyłącznie tę jedną wartość.

    Reguła należy do klasy bez uciążliwości i nadaje się do trybu zbiorczego.
    Kategoria ryzyka jest niska i taka ma pozostać — wartość leży
    w przewidywalności stanu maszyny po przygotowaniu, nie w odparciu ataku.

    Punkt bywa lekceważony jako kosmetyczny. Warto go czytać razem
    z regułami wyłączającymi treść dostarczaną z sieci w innych miejscach
    systemu: same w sobie są drobiazgami, razem opisują decyzję, że
    stanowisko robocze nie namawia użytkownika na nic.

    Brak wartości nie jest stanem zgodnym, bo domyślnie sekwencja jest
    pokazywana.
  en: |
    The key is the same one in which other sign-in settings lie - among them the one about
    network providers' notices and the one about hosted applications' access. A rollback
    removes that one value alone.

    The rule belongs to the class without disruption and suits the bulk mode. The risk
    category is low and is to stay so - the value lies in the foreseeability of the
    machine's state after preparation rather than in warding off an attack.

    The item is sometimes slighted as cosmetic. It is worth reading together with the rules
    switching off content delivered from the network in other places of the system: trifles
    on their own, together they describe the decision that a working station urges nothing
    on the user.

    A missing value is not a compliant state, since by default the sequence is shown.
