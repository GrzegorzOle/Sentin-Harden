id: win2025-app-installer-hash-override-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Pomijanie sprawdzenia skrótu pakietu zablokowane
    en: Skipping the check of a package digest blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera możliwość pominięcia sprawdzenia skrótu pobranego
    pakietu. Skrót jest jedyną rzeczą wiążącą plik, który przyszedł,
    z plikiem, który miał przyjść — bez niego zostaje sama nazwa
    i adres.

    Wartość tego punktu polega na tym, czego nie widać. Gdy skrót się nie
    zgadza, powodów są dwa i z zewnątrz wyglądają tak samo: albo producent
    wydał plik na nowo i nie poprawiono zapisu, albo pobrano co innego,
    niż zamierzano. Możliwość pominięcia sprawdzenia sprawia, że oba
    przypadki kończą się identycznie — instalacją.

    Zostawiam kategorię wysoką i chcę dodać powód serwerowy. Na serwerze
    instalacje robi się rzadko i zwykle w pośpiechu, przy zestawianiu
    maszyny albo przy naprawie. Jest to dokładnie ta sytuacja, w której
    człowiek napotykający przeszkodę szuka sposobu jej ominięcia zamiast
    jej zrozumienia — a ten punkt odbiera mu sposób i zostawia pytanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    podmienionego pliku, która kończy się powodzeniem mimo niezgodnego
    skrótu, bo ktoś w pośpiechu pominął sprawdzenie.
  en: |
    The item takes away the leave to pass over the looking to the digest of a fetched package. The
    digest is the one thing binding the file that came with the file that was to come - without it
    there is left the name and the whereabouts alone.

    The worth of this item lies in what is not seen. Where the digest tallies not, the grounds are
    two and from without they look the same - either the maker gave the file out anew and the writing
    was not set right, or something other than was meant has been fetched. The leave to pass the
    looking over makes both cases end alike - in an installing.

    I leave the category high and would add a ground of the server. On a server installings are done
    seldom and mostly in haste, at the setting up of a machine or at a mending. It is just the case
    wherein a person meeting a hindrance seeks a way round it in place of an understanding of it -
    and this item takes the way from them and leaves the question.

    What an attacker gains while the item goes unmet - the installing of a swapped file, ending in
    success for all the untallying digest, somebody in haste having passed the looking over.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i powód jest konkretny,
    a dotyczy tych instalacji, które na serwerze są najczęstsze.

    Organizacja utrzymująca własne źródło pakietów zapisuje w nim skrót
    każdego instalatora. Gdy producent wyda ten sam plik na nowo — przy
    poprawce, przy zmianie podpisu, przy przepakowaniu — skrót w zapisie
    przestaje pasować, chociaż nic złego się nie stało. Dotąd dawało się
    to ominąć jednym przełącznikiem. Po zmianie trzeba poprawić zapis.

    I to jest cały koszt: obowiązek utrzymania własnego źródła
    w zgodzie z rzeczywistością. Nie jest to koszt duży, ale jest to
    koszt cudzy — ponosi go zespół utrzymujący źródło, a decyzję
    podejmuje ktoś inny. Warto ich uprzedzić, zanim zestawianie maszyny
    stanie w połowie.

    Poza tym jednym przypadkiem nie znam zastosowania, w którym pominięcie
    sprawdzenia skrótu byłoby czynnością prawidłową. Nie jest to
    ustawienie wydajnościowe ani zgodnościowe — jest to wyłącznie
    przełącznik do omijania przeszkody.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "needs a checking", and the ground is a set one bearing on those installings
    that upon a server are the commonest.

    An ordering that keeps a wellspring of packages of its own writes therein the digest of every
    installer. Where the maker gives the same file out anew - at a mending, at an altering of the
    sign, at a repacking - the digest in the writing stops tallying, though nothing ill has befallen.
    Hitherto that could be gone round by one switch. After the change the writing must be set right.

    And that is the whole of the cost - the bond of keeping one's own wellspring at one with what is.
    It is no great cost, but it is another's cost - it is borne by the band keeping the wellspring,
    and the deciding is made by somebody else. It is worth forewarning them before the setting up of
    a machine stands still halfway.

    Beyond that one case I know of no use wherein the passing over of the looking to the digest would
    be a right doing. It is no setting of doing well nor of being at one - it is only a switch for
    the going round of a hindrance.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - We własnym źródle pakietów skrót przestaje pasować, gdy producent wyda ten sam plik na nowo
      - Zestawianie maszyny staje w połowie, dopóki zapis w źródle nie zostanie poprawiony
      - Koszt ponosi zespół utrzymujący źródło pakietów, a decyzję podejmuje kto inny
      - Nie jest to ustawienie wydajnościowe ani zgodnościowe, tylko przełącznik do omijania przeszkody
      - Poza własnym źródłem pakietów nie ma zastosowania, w którym pominięcie sprawdzenia jest prawidłowe
    en:
      - In one's own wellspring of packages the digest stops tallying where the maker gives the same file out anew
      - The setting up of a machine stands still halfway until the writing in the wellspring is set right
      - The cost is borne by the band keeping the wellspring of packages and the deciding is made by somebody else
      - It is no setting of doing well nor of being at one, only a switch for the going round of a hindrance
      - Beyond one's own wellspring of packages there is no use wherein the passing over is right
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja utrzymuje własne źródło pakietów i nie uprzedzono zespołu, który za nie odpowiada
    en:
      - The ordering keeps a wellspring of packages of its own and the band answering for it was not forewarned
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableHashOverride'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableHashOverride'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where an in-house package source is kept, warn the team that owns it:
    # a re-published vendor file now stops a build until the manifest digest
    # is corrected.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableHashOverride' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

