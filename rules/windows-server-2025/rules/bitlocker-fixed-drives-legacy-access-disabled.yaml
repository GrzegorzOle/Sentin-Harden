id: win2025-bitlocker-fixed-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Odczyt chronionego dysku stałego w starszych wersjach systemu wyłączony
    en: Reading a protected fixed data drive on earlier system versions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza zapisywanie na chronionym wolumenie dodatkowego,
    niezaszyfrowanego obszaru, z którego starsze systemy uruchamiają
    program do odczytu zawartości.

    Zostawiam kategorię średnią i chcę nazwać, na czym polega tu problem,
    bo z opisu wygląda on na zgodnościowy, a jest inny.

    Ten mechanizm nie tylko otwiera furtkę dla starszych systemów. On
    zapisuje na wolumenie z danymi niezaszyfrowany obszar zawierający
    program wykonywalny — umieszczony tam przez sam system operacyjny,
    poza jakąkolwiek instalacją. Taki plik nie pojawia się w inwentaryzacji
    oprogramowania, bo nikt go nie instalował. Nie obejmują go listy
    dozwolonych aplikacji zbudowane na ścieżkach instalacyjnych. Leży na
    nośniku danych, do którego zapis ma zwykle więcej kont niż do katalogów
    systemowych.

    Na serwerze wartość drugiej strony tego mechanizmu jest zerowa.
    Program do odczytu istnieje po to, żeby ktoś podłączył nośnik do
    obcej maszyny i kliknął. Do serwera nikt nie podchodzi i nikt nie
    klika. Zostaje więc sam koszt: niezaszyfrowany obszar z plikiem
    wykonywalnym na nośniku, który miał być zaszyfrowany w całości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce na
    wolumenie danych, które jest niezaszyfrowane z założenia i w którym
    plik wykonywalny nie budzi podejrzeń, bo ma tam prawo być.
  en: |
    The item switches off writing an additional, unencrypted area onto a
    protected volume, from which earlier systems run a program for reading
    the contents.

    I keep the category medium, and I want to name what the problem
    actually is here, because from the description it looks like a
    compatibility matter and it is something else.

    This mechanism does not only open a door for earlier systems. It writes
    onto the data volume an unencrypted area containing an executable -
    placed there by the operating system itself, outside any installation.
    Such a file does not appear in the software inventory, because nobody
    installed it. It is not covered by application allow-lists built on
    installation paths. It sits on a data medium that usually more accounts
    can write to than to the system directories.

    On a server the value of the other side of this mechanism is zero. The
    reader program exists so that somebody can attach the medium to an
    unfamiliar machine and click. Nobody walks up to a server and nobody
    clicks. What remains is the cost alone: an unencrypted area with an
    executable on a medium that was meant to be encrypted in full.

    What an attacker gains while the item goes unmet: a place on the data
    volume that is unencrypted by design and where an executable raises no
    suspicion, because it has every right to be there.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", chociaż na serwerze skutek jest
    bliski zera, i chcę podać powód, zamiast zbyć to stwierdzeniem, że
    „warto sprawdzić".

    Skutek dotyczy jednego, dającego się nazwać przypadku: nośnika, który
    ma zostać odczytany poza tą maszyną, na systemie starszym niż ten.
    Zdarza się to rzadko, ale zdarza — przy przekazywaniu danych do
    podmiotu, który pracuje na starszym sprzęcie, przy odtwarzaniu
    archiwum na maszynie przygotowanej lata temu i przy dochodzeniu
    prowadzonym cudzymi narzędziami. W żadnym z tych przypadków blokada nie
    niszczy danych; po prostu tamta maszyna ich nie otworzy i trzeba będzie
    znaleźć inną drogę.

    Druga rzecz jest techniczna i warto o niej wiedzieć, żeby nie szukać
    błędu tam, gdzie go nie ma: wartość tej reguły jest tekstem, a nie
    liczbą. Wyłączenie zapisuje słowo, a nie zero, więc wpis wygląda
    inaczej niż sąsiednie i nie należy go „poprawiać" na liczbę.

    Zmiana dotyczy wolumenów szyfrowanych po niej. Na nośniku, który już
    ma ten obszar zapisany, obszar zostanie tam, gdzie jest — a wpis będzie
    zgodny. To samo zastrzeżenie co przy trybie szyfrowania, tylko że tu
    da się je zamknąć wyłącznie przez ponowne zaszyfrowanie nośnika.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", although on a server the effect is
    close to zero, and I want to give the reason rather than fob it off
    with "worth checking".

    The effect concerns one nameable case: a medium meant to be read
    outside this machine, on a system older than this one. That happens
    rarely, but it happens - when handing data to a party working on older
    hardware, when restoring an archive on a machine prepared years ago,
    and in an investigation conducted with somebody else's tools. In none
    of those cases does the block destroy data; that machine simply will
    not open it and another route will have to be found.

    The second thing is technical and worth knowing so that nobody looks
    for a fault where there is none: this rule's value is text, not a
    number. Switching it off writes a word, not a zero, so the entry looks
    unlike its neighbours and should not be "corrected" into a number.

    The change concerns volumes encrypted after it. On a medium that
    already has this area written, the area will stay where it is - and the
    entry will be compliant. The same caveat as at the encryption mode,
    except that here it can only be closed by encrypting the medium afresh.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Nośnik przekazany poza tę maszynę nie otworzy się na systemie starszym niż ten
      - Dotyczy to przekazania danych podmiotowi na starszym sprzęcie, odtworzenia archiwum i dochodzeń cudzymi narzędziami
      - Blokada nie niszczy danych, tylko zamyka jedną drogę odczytu poza maszyną
      - Na nośniku, który już ma ten obszar zapisany, obszar zostanie, a wpis i tak będzie zgodny
    en:
      - A medium handed outside this machine will not open on a system older than this one
      - This covers handing data to a party on older hardware, restoring an archive, and investigations with somebody else's tools
      - The block destroys no data; it closes one route to reading outside the machine
      - On a medium that already has this area written, the area stays and the entry is compliant anyway
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nośniki z tej maszyny bywają odczytywane na systemach starszych niż ten i nie ma innej drogi przekazania danych
      - Odtworzenie archiwum przewiduje podłączenie nośnika do maszyny przygotowanej lata temu
    en:
      - Media from this machine are sometimes read on systems older than this one and there is no other way of handing the data over
      - The archive restore procedure involves attaching the medium to a machine prepared years ago
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the
      # word <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '<none>'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'FDVDiscoveryVolumeType' -ErrorAction SilentlyContinue).'FDVDiscoveryVolumeType'
    [pscustomobject]@{
      path        = $path
      name        = 'FDVDiscoveryVolumeType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value here is a word, not a number, and that is deliberate - do not
    # "correct" it to a zero to match the neighbouring entries.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Z opisu wygląda to na sprawę zgodnościową, a jest inna. Mechanizm
    zapisuje na wolumenie danych niezaszyfrowany obszar z programem
    wykonywalnym, umieszczonym tam przez system, poza jakąkolwiek
    instalacją — więc poza inwentaryzacją oprogramowania i poza listami
    dozwolonych aplikacji budowanymi na ścieżkach.

    Na serwerze druga strona tego mechanizmu jest warta zero: program do
    odczytu istnieje po to, żeby ktoś podłączył nośnik do obcej maszyny
    i kliknął, a do serwera nikt nie podchodzi.

    Szczegół techniczny, żeby nie szukać błędu tam, gdzie go nie ma:
    wartość tej reguły jest tekstem, nie liczbą.
  en: |
    From the description this looks like a compatibility matter and it is
    something else. The mechanism writes onto the data volume an
    unencrypted area with an executable, placed there by the system outside
    any installation - so outside the software inventory and outside
    application allow-lists built on paths.

    On a server the other side of this mechanism is worth nothing: the
    reader program exists so that somebody can attach the medium to an
    unfamiliar machine and click, and nobody walks up to a server.

    A technical detail, so that nobody looks for a fault where there is
    none: this rule's value is text, not a number.
