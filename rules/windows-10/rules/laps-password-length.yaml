id: win10-laps-password-length

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Długość losowanego hasła lokalnego administratora co najmniej piętnaście znaków
    en: Length of the randomly chosen local administrator password at least fifteen characters
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Hasło losowane dla lokalnego administratora nie jest przez nikogo wpisywane
    z pamięci, więc jego długość nie kosztuje wygody. Można je ustawić tak długie,
    żeby odgadywanie przestało być drogą wartą rozważenia.

    Piętnaście znaków ma jeszcze jedno znaczenie na maszynie z systemem Windows:
    poniżej tej granicy system przechowuje dodatkowo skrót w starszym, słabym
    formacie. Hasło krótsze zostawia więc w pamięci maszyny ślad, który daje się
    złamać znacznie łatwiej niż samo hasło.

    Zasada ustala dolną granicę. Dłuższe hasło spełnia ją tak samo i nie ma powodu
    zatrzymywać się dokładnie na piętnastu.
  en: |
    A password picked at random for the local administrator is typed from memory
    by nobody, so its length costs no convenience. It can be set long enough that
    guessing stops being a road worth considering.

    Fifteen characters carry a second meaning on a Windows machine. Below that
    mark the system additionally keeps a hash in an older, weak format. A shorter
    password therefore leaves a trace in the memory of the machine that breaks far
    more easily than the password itself.

    The rule sets a lower bound. A longer password meets it just as well and there
    is no reason to stop at exactly fifteen.

disruption_description:
  pl: |
    Nikt tego hasła nie wpisuje inaczej niż kopiując je z katalogu, więc długość
    jest niewidoczna w pracy. Zmiana nie wymaga przerwy ani ponownego logowania.

    Jedyne, co może zaboleć, to narzędzie przyjmujące hasło o ograniczonej
    długości — spotykane w starszych konsolach zarządzania sprzętem i w prostych
    skryptach łączących się do maszyny. To jest wyjątek rzadki i łatwy do
    sprawdzenia.
  en: |
    Nobody enters this password other than by copying it from the directory, so
    its length is invisible in daily work. The change calls for no interruption
    and no signing in again.

    The one thing that can bite is a tool that takes a password of limited length -
    seen in older hardware management consoles and in simple scripts connecting to
    the machine. That is a rare exception and an easy one to check.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia przyjmujące hasło krótsze niż ustawione, spotykane w starszych konsolach zarządzania sprzętem, nie przyjmą go w całości
      - Skrypty przepisujące hasło do pola o stałej długości obetną je po cichu i uwierzytelnienie się nie powiedzie
      - Zmiana obowiązuje dopiero przy następnym losowaniu hasła, więc do tego czasu w katalogu leży hasło poprzedniej długości
      - Logowanie kontem lokalnego administratora, odczyt hasła z katalogu i pozostałe ustawienia tego mechanizmu działają bez zmian
    en:
      - Tools that accept a shorter password than the one set, seen in older hardware management consoles, will not take it whole
      - Scripts copying the password into a fixed-length field truncate it silently and authentication then fails
      - The change applies from the next time the password is picked, so until then the directory holds one of the previous length
      - Signing in as the local administrator, reading the password from the directory and the other settings of this mechanism are unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny obsługiwane narzędziem, które przyjmuje hasło o ograniczonej długości, dopóki nie zostanie ono wymienione
      - Środowiska, w których hasło lokalnego administratora bywa przepisywane ręcznie przez obsługę i długość ma wtedy realną cenę
    en:
      - Machines served by a tool that takes a password of limited length, until that tool is replaced
      - Environments where the local administrator password is sometimes retyped by hand, where length then has a real price
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordLength'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $name = 'PasswordLength'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Fifteen is the lower bound the item takes; a longer password meets it too.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordLength' -Value 15 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Porównanie jest na dolną granicę, więc hasło dłuższe spełnia punkt. Zasada ma
    sens dopiero razem ze wskazaniem miejsca przechowywania — bez niego mechanizm
    nie losuje żadnego hasła i długość nie ma do czego się odnieść.
  en: |
    The comparison is a lower bound, so a longer password meets the item. The rule
    makes sense only together with naming the place of keeping - without it the
    mechanism picks no password at all and the length has nothing to apply to.
