id: win2025-rdp-rpc-traffic-encrypted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Kanał zarządzania pulpitem zdalnym zawsze szyfrowany
    en: The remote desktop management channel always encrypted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Obok samej sesji pulpit zdalny ma drugi kanał — służący do
    zarządzania sesjami, a nie do przenoszenia obrazu. Ustawienie każe
    szyfrować i uwierzytelniać także ten kanał.

    Kanał ten jest łatwo przeoczyć właśnie dlatego, że nie widać go
    w pracy. Idą nim rzeczy, które robi się o sesji, a nie w sesji:
    wyliczenie sesji na maszynie, odłączenie sesji, wylogowanie
    użytkownika, przejęcie sesji cudzej, wysłanie komunikatu, podejrzenie
    kto jest zalogowany.

    Bez szyfrowania i uwierzytelnienia polecenia te da się podsłuchać,
    a także wysłać z zewnątrz. Nie jest to więc wyłącznie kwestia
    poufności — jest to kwestia tego, kto może odłączyć albo przejąć
    czyjąś sesję.

    Na serwerze to rozróżnienie waży najwięcej i jest to powód, dla
    którego kanał ten w ogóle istnieje. Na stanowisku roboczym sesja
    jest jedna i należy do właściciela maszyny. Na serwerze sesji bywa
    kilkadziesiąt, należą do różnych osób, a możliwość przejęcia cudzej
    sesji jest równoznaczna z pracą na cudzych uprawnieniach — bez
    żadnego hasła, bo sesja jest już uwierzytelniona.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podsłuchania i wydawania poleceń zarządzania sesjami
    serwera, w tym przejęcia sesji już zalogowanej osoby.
  en: |
    Beside the session itself remote desktop has a second channel - one for the managing of
    sessions and not for the carrying of the picture. The setting bids that channel be encrypted
    and authenticated too.

    That channel is easy to overlook for just the reason that it is not seen in the work. By it go
    the things done about a session and not within it: the listing of sessions on the machine, the
    disconnecting of a session, the signing off of a user, the taking over of another's session,
    the sending of a message, the seeing of who is signed in.

    Without encryption and authentication those orders can be listened to, and sent from outside
    besides. It is therefore not a matter of privacy alone - it is a matter of who may disconnect
    or take over somebody's session.

    On a server that difference weighs most, and it is the reason this channel is there at all. At
    a working station there is one session and it belongs to the machine's owner. On a server
    there are at times dozens of sessions, they belong to differing people, and the means of
    taking over another's session is the same as working with another's rights - with no password
    at all, the session being authenticated already.

    What an attacker gains while the item goes unmet: the means of listening to and issuing orders
    of session management on the server, the taking over of an already signed-in person's session
    included.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno i zaliczam ten punkt do klasy wyższej niż
    w paczce stanowiska roboczego właśnie z tego powodu.

    Szyfrowania tego kanału nie obsługują cienkie klienty z zamrożonym
    oprogramowaniem wewnętrznym oraz narzędzia dostawców zarządzające
    sesjami po swojemu. Na stanowisku roboczym takich narzędzi zwykle
    nie ma. Na serwerze bywają i to właśnie one rozstrzygają, czy zmiana
    przejdzie gładko.

    Chodzi zwłaszcza o oprogramowanie do zdalnej pomocy technicznej
    oraz o konsole zarządzania serwerem terminali, które wyliczają
    i odłączają sesje. Jeżeli któreś z nich rozmawia tym kanałem po
    staremu, po zmianie przestanie widzieć sesje na tej maszynie.

    Objaw jest mylący: narzędzie nie zgłasza problemu z szyfrowaniem,
    tylko pokazuje pustą listę sesji albo błąd dostępu. Wygląda to na
    problem z uprawnieniami, a nie na skutek tej zmiany.

    Sama sesja pulpitu zdalnego nie jest tym punktem dotknięta. Ludzie
    pracujący na serwerze nie zauważą niczego — zmiana dotyczy wyłącznie
    kanału, którym się sesjami zarządza.

    Zmiana wchodzi w życie od razu, bez restartu usługi ani maszyny,
    i cofa się natychmiast.
  en: |
    One thing needs checking, and I reckon this item to a higher class than in the working
    station's pack for just that reason.

    The encrypting of this channel is not served by thin clients with frozen inner software nor by
    vendors' tools that manage sessions in their own way. At a working station there are usually
    no such tools. On a server there are at times, and it is they that settle whether the change
    will go through smoothly.

    It is above all about software for remote technical help and about consoles for the managing
    of a terminal server, which list and disconnect sessions. Where one of them speaks by this
    channel in the old way, after the change it will stop seeing the sessions on this machine.

    The symptom misleads: the tool reports no trouble with encryption but shows an empty list of
    sessions or a fault of access. It looks like a trouble with rights and not like the effect of
    this change.

    The remote desktop session itself is untouched by this item. People working on the server will
    notice nothing - the change bears on the channel by which sessions are managed alone.

    The change comes into force straight away, with no restart of the service nor of the machine,
    and is undone at once.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzie zdalnej pomocy technicznej rozmawiające tym kanałem po staremu przestanie widzieć sesje
      - Konsola zarządzania serwerem terminali może pokazać pustą listę sesji albo błąd dostępu
      - Objaw wygląda na problem z uprawnieniami, a nie na skutek tej zmiany
      - Sama sesja pulpitu zdalnego nie jest dotknięta i ludzie nie zauważą niczego
    en:
      - A tool of remote technical help speaking by this channel in the old way will stop seeing sessions
      - A console for the managing of a terminal server may show an empty list of sessions or a fault of access
      - The symptom looks like a trouble with rights and not like the effect of this change
      - The remote desktop session itself is untouched and people will notice nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Sesjami na tym serwerze zarządza narzędzie dostawcy, którego nie da się zaktualizować
      - Do serwera łączą się cienkie klienty z zamrożonym oprogramowaniem wewnętrznym
    en:
      - The sessions on this server are managed by a vendor's tool that cannot be updated
      - Thin clients with frozen inner software connect to the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fEncryptRPCTraffic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fEncryptRPCTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fEncryptRPCTraffic' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Kanał zarządzania służy do rzeczy robionych o sesji, a nie w sesji:
    wyliczenia sesji, odłączenia, wylogowania, przejęcia cudzej sesji.
    Nie chodzi więc wyłącznie o poufność, tylko o to, kto może czyjąś
    sesję przejąć.

    Na serwerze sesji bywa kilkadziesiąt i należą do różnych osób, więc
    przejęcie sesji jest pracą na cudzych uprawnieniach bez żadnego
    hasła.

    Klasę podniosłem względem paczki stanowiska roboczego, bo to na
    serwerze pracują narzędzia zarządzające sesjami po swojemu — i to
    one rozstrzygają, czy zmiana przejdzie gładko.
  en: |
    The management channel serves for things done about a session and not within it: the listing
    of sessions, the disconnecting, the signing off, the taking over of another's session. It is
    therefore not about privacy alone but about who may take somebody's session over.

    On a server there are at times dozens of sessions belonging to differing people, so the taking
    over of a session is working with another's rights with no password at all.

    I raised the class against the working station's pack, it being on a server that tools
    managing sessions in their own way work - and it is they that settle whether the change will
    go through smoothly.
