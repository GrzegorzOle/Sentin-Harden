id: win2025-defender-cloud-check-timeout

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MpEngine
  title:
    pl: Wydłużony czas oczekiwania na odpowiedź usługi chmurowej
    en: Extended wait for the cloud service response
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wydłuża czas, przez który mechanizm trzyma nieznany plik,
    czekając na odpowiedź usługi zewnętrznej. Domyślne oczekiwanie jest
    krótkie i przy wolnym łączu kończy się przed odpowiedzią — plik idzie
    wtedy dalej bez rozstrzygnięcia.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej i robię
    to świadomie, bo ten punkt sam z siebie nie zdejmuje żadnego ryzyka.
    Nie blokuje, nie wykrywa i niczego nie zamyka. Sprawia jedynie, że
    odpowiedź na pytanie zadane przez inny mechanizm ma szansę dojść na
    czas.

    Jest to więc punkt służebny wobec blokowania przy pierwszym
    napotkaniu i bez niego pozbawiony treści. Wartość ma wyłącznie tam,
    gdzie odpytania naprawdę wychodzą i naprawdę bywają wolne, czyli na
    maszynie z łączem obciążonym albo idącym przez pośrednika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: te
    przypadki, w których odpowiedź o jego narzędziu przyszłaby, gdyby
    mechanizm poczekał chwilę dłużej.
  en: |
    The item lengthens the time the working holds an unknown file, waiting for an answer from the
    outward service. The waiting set by default is short and on a slow line runs out before the
    answer - the file then goes on with no settling.

    I lower the category to low against the reckoning for a workstation, and do it wittingly, this
    item taking of itself no risk away. It blocks not, it finds nothing out and it shuts nothing. It
    only makes it so that the answer to a question put by another working stands a chance of
    arriving in time.

    It is therefore an item serving the blocking at first sight and void of substance without it. It
    has worth only where the askings truly go out and truly are at whiles slow, that is on a machine
    with a laden line or one going by a go-between.

    What an attacker gains while the item goes unmet - those cases wherein the answer about their
    tool would have come, had the working waited a moment longer.

disruption_description:
  pl: |
    Podnoszę klasę do „wymaga sprawdzenia", choć dla stacji roboczej ta
    reguła idzie hurtem, i chcę powiedzieć wprost, dlaczego. Ustawienie
    brzmi niegroźnie, bo „tylko czeka dłużej". Rzecz w tym, kto czeka.

    Czeka proces, który chciał ten plik otworzyć. Na stacji roboczej
    czeka człowiek i widzi, że coś trwa. Na serwerze czeka zadanie,
    usługa albo przebieg wdrożeniowy — i nie ma nikogo, kto by to
    zauważył, dopóki czekanie nie zamieni się w przekroczony termin.

    Skutek sumuje się z poprzednią regułą i tylko razem z nią ma sens
    liczony. Przy wdrożeniu zapisującym setki nowych plików wydłużone
    oczekiwanie mnoży się przez ich liczbę. W najgorszym przypadku —
    maszyna bez wyjścia na zewnątrz — każde pojedyncze oczekiwanie
    trwa pełne wydłużenie, bo odpowiedź nie przyjdzie nigdy.

    To właśnie ten przypadek jest powodem, dla którego punkt zostaje
    poza trybem zbiorczym. W segmencie bez wyjścia zmiana nie dokłada
    ochrony, a dokłada zwłoki, i jest to jedyny układ, w którym działa
    wyłącznie na szkodę.

    Sprawdzenie sprowadza się więc do jednego pytania: czy odpytania
    z tej maszyny w ogóle dochodzą. Jeżeli nie, rozstrzygnij najpierw
    poprzednie punkty tej grupy, a ten zostaw na koniec.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I raise the class to "needs checking", though for a workstation this rule goes in bulk, and I
    mean to say outright why. The setting sounds harmless, it "only waiting longer". The matter is
    who waits.

    What waits is the process that meant to open that file. On a workstation a person waits and sees
    that something is taking time. On a server a task waits, or a service, or a running of a rolling
    out - and there is nobody to mark it until the waiting turns into a term overrun.

    The outcome sums with the rule before and is worth reckoning only together with it. At a rolling
    out writing hundreds of new files the lengthened waiting is multiplied by their number. In the
    worst case - a machine with no way out - every single waiting lasts the full lengthening, the
    answer never coming.

    That case is just the ground for which the item stays outside the bulk mode. In a reach with no
    way out the change adds no guard and adds tarrying, and it is the only setting wherein it works
    to harm alone.

    The checking comes therefore to one question - do askings from that machine arrive at all. If
    not, settle first the items before this one in the group and leave this one for the end.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - W segmencie bez wyjścia na zewnątrz zmiana nie dokłada ochrony, a dokłada pełną zwłokę przy każdym pliku
      - Przy wdrożeniu zapisującym setki nowych plików wydłużone oczekiwanie mnoży się przez ich liczbę
      - Czeka zadanie albo usługa, a nie człowiek, więc nikt tego nie zauważy do przekroczenia terminu
      - Bez blokowania przy pierwszym napotkaniu punkt jest pozbawiony treści i nie robi nic
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy
    en:
      - In a reach with no way out the change adds no guard and adds the full tarrying at every file
      - At a rolling out writing hundreds of new files the lengthened waiting is multiplied by their number
      - A task or a service waits and no person, so nobody will mark it until a term is overrun
      - Without the blocking at first sight the item is void of substance and does nothing
      - Where a guarding product of another maker rules, the audit reports the state does not apply
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Odpytania z tej maszyny nie dochodzą, więc zmiana działa wyłącznie na szkodę
      - Przebieg wdrożeniowy zapisuje setki nowych plików i nie ma zapasu czasu w oknie
    en:
      - Askings from that machine do not arrive, so the change works to harm alone
      - A running of a rolling out writes hundreds of new files and has no spare of time in its window
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else { [string][int](Get-MpPreference -ErrorAction Stop).CloudExtendedTimeout }
    } catch {
      'CHECK_ERROR'
    }
  expected: '50'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    $name = 'MpBafsExtendedTimeout'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is a count of seconds added to the default wait. On a machine
    # whose askings never arrive this adds the wait and none of the guard.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MpBafsExtendedTimeout' -Value 50 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-cloud-block-timeout-period-microsoft-defender-antivirus

notes:
  pl: |
    Kategoria obniżona, bo punkt sam z siebie nie zdejmuje żadnego
    ryzyka: nie blokuje, nie wykrywa, nie zamyka. Sprawia jedynie, że
    odpowiedź na pytanie zadane przez inny mechanizm ma szansę dojść
    na czas.

    Klasa podniesiona, bo ustawienie brzmi niegroźnie — „tylko czeka
    dłużej" — a czeka proces, nie człowiek. Na serwerze nikt tego nie
    zauważy do przekroczenia terminu.

    Jedyny układ, w którym zmiana działa wyłącznie na szkodę: segment
    bez wyjścia na zewnątrz, gdzie odpowiedź nie przyjdzie nigdy,
    a pełne wydłużenie odczeka się przy każdym pliku.
  en: |
    The category is lowered, the item taking of itself no risk away - it blocks not, finds nothing
    out, shuts nothing. It only makes it so that the answer to a question put by another working
    stands a chance of arriving in time.

    The class is raised, the setting sounding harmless - it "only waits longer" - and what waits is
    a process and no person. On a server nobody will mark it until a term is overrun.

    The only setting wherein the change works to harm alone - a reach with no way out, where the
    answer never comes and the full lengthening is waited out at every file.
