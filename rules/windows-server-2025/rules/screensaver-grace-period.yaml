id: win2025-screensaver-grace-period

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Okres karencji przed zablokowaniem wygaszacza ekranu
    en: Grace period before the screen saver locks
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Po uruchomieniu wygaszacza ekran nie blokuje się natychmiast. System
    zostawia krótką chwilę, w której ruch myszą wraca do pulpitu bez
    podania hasła.

    Na stanowisku roboczym chwila ta ma sens: nie karze kogoś, kto
    sięgnął po kubek i wrócił. Na serwerze uzasadnienia tego nie ma,
    bo nikt przy nim nie siedzi.

    Za to okno, które ono otwiera, na serwerze kosztuje więcej.
    Pulpit serwera bywa wyświetlany w konsoli karty zarządzającej albo
    w podglądzie konsoli maszyny wirtualnej — czyli w oknie przeglądarki
    otwartym na czyimś stanowisku, przez godziny, po tym jak człowiek
    zakończył już swoją pracę. Sesja zdalna porzucona bez wylogowania
    zachowuje się tak samo.

    Kto ma w tej chwili dostęp do tej konsoli, ten przez okres karencji
    wchodzi na pulpit administratora domeny bez podawania czegokolwiek.
    Nie trzeba do tego przechodzić obok biurka — wystarczy zakładka
    zostawiona w przeglądarce albo dostęp do karty zarządzającej.

    Punkt ma sens wyłącznie razem z ustawionym czasem do wygaszenia
    i z blokadą sesji po czasie bez działania. Sam skraca okno, którego
    otwarcie ustala co innego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: chwilę,
    w której porzucona konsola serwera wpuszcza bez hasła każdego, kto
    do niej sięgnie.
  en: |
    After the screen saver starts the screen does not lock at once. The system leaves a short
    while in which a stir of the mouse comes back to the desktop with no password given.

    At a working station that while makes sense: it does not punish someone who reached for a cup
    and came back. On a server there is no such ground, nobody sitting at it.

    The window it opens costs more on a server, though. A server's desktop is at times shown in
    the console of a management card or in the console view of a virtual machine - that is, in a
    browser window open at somebody's station, for hours, after the person has already ended their
    work. A remote session left without a signing off behaves the same.

    Whoever has access to that console at such a moment enters, for the length of the grace
    period, a domain administrator's desktop with nothing given. No walking past a desk is needed
    for it - a tab left in a browser or access to the management card is enough.

    The item makes sense only together with a set time to the screen saver and with the locking of
    a session after a time without doing. Alone it shortens a window whose opening something else
    settles.

    What an attacker gains while the item goes unmet: a while in which an abandoned server console
    admits without a password anyone who reaches for it.

disruption_description:
  pl: |
    Skutek zmiany jest żaden i nie o niego tu chodzi.

    Karencja domyślna wynosi pięć sekund i tyle właśnie wymaga punkt,
    więc na serwerze pozostawionym w stanie domyślnym reguła jest już
    spełniona. Niezgodność oznacza wpis wprowadzony ręcznie, czyli
    świadome wydłużenie — i warto ustalić, kto i po co je wprowadził,
    zanim się je cofnie.

    Klasę podniosłem względem paczki stanowiska roboczego z jednego
    powodu: cofnięcie tej wartości zaczyna działać dopiero po ponownym
    uruchomieniu maszyny. Na stanowisku restart jest zdarzeniem
    codziennym, na serwerze planowanym. Zmiana, której nie da się cofnąć
    od razu, nie należy do klasy bez uciążliwości, niezależnie od tego,
    jak niewinna jest sama w sobie.

    Kogo to zaboli w praktyce: nikogo, kto pracuje na serwerze zdalnie
    przez sesję pulpitu, bo tam blokada wygląda inaczej. Zaboli to
    osobę pracującą przy konsoli maszyny przez dłuższy czas z przerwami
    — będzie podawać hasło częściej.

    Punkt sam z siebie nie powoduje blokowania ekranu. Jeżeli czas do
    wygaszenia nie jest ustawiony, zmiana nie zrobi nic, a raport i tak
    pokaże ją jako spełnioną. Jest to ograniczenie warte zapamiętania.
  en: |
    The effect of the change is none and that is not what this is about.

    The default grace period runs to five seconds and that is just what the item calls for, so on
    a server left in its default state the rule is met already. Non-compliance means an entry made
    by hand, that is a knowing lengthening - and it is worth settling who made it and what for
    before it is undone.

    I raised the class against the working station's pack for one reason: the undoing of this
    value begins working only after a fresh start of the machine. At a station a restart is a
    daily happening, on a server a planned one. A change that cannot be undone at once does not
    belong to the class without disruption, however harmless it is in itself.

    Whom it will hurt in practice: nobody working on the server from afar through a desktop
    session, the locking looking otherwise there. It will hurt a person working at the machine's
    console for a longer time with breaks - they will give their password oftener.

    The item does not of itself bring any locking of the screen about. Where the time to the
    screen saver is not set, the change will do nothing, and the report will show it met all the
    same. It is a bound worth keeping in mind.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoba pracująca przy konsoli maszyny z przerwami będzie podawać hasło częściej
      - Sesja pulpitu zdalnego nie jest tym punktem dotknięta, bo blokada wygląda tam inaczej
      - Bez ustawionego czasu do wygaszenia zmiana nie robi nic, choć raport pokaże ją jako spełnioną
      - Cofnięcie wartości zaczyna działać dopiero po ponownym uruchomieniu maszyny
    en:
      - A person working at the machine's console with breaks will give their password oftener
      - A remote desktop session is untouched by this item, the locking looking otherwise there
      - Without a set time to the screen saver the change does nothing, though the report will show it met
      - The undoing of the value begins working only after a fresh start of the machine
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Karencję wydłużono świadomie na maszynie obsługiwanej z konsoli przy pracy wymagającej częstych przerw
      - Nie ustalono, kto i po co wprowadził obecny wpis
    en:
      - The grace period was lengthened knowingly on a machine served from its console at work calling for frequent breaks
      - It was not settled who made the present entry and what for
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'ScreenSaverGracePeriod'
      $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
      # Absence means the system default of five seconds. The report describes
      # the machine, so the effective value is what gets reported.
      if ($null -eq $current) { '5' }
      elseif ([string]$current -match '^\d+$') { [string]$current }
      else { 'CHECK_ERROR' }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'ScreenSaverGracePeriod'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is text despite looking like a number.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    Set-ItemProperty -Path $path -Name 'ScreenSaverGracePeriod' -Value '5' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-machine-inactivity-limit

notes:
  pl: |
    Na serwerze konsola nie jest miejscem, tylko oknem przeglądarki
    otwartym na czyimś stanowisku — w karcie zarządzającej albo
    w podglądzie konsoli maszyny wirtualnej. Okno karencji dotyczy
    właśnie tego.

    Brak wpisu oznacza domyślne pięć sekund, czyli stan zgodny.
    Niezgodność jest zawsze wynikiem świadomego wydłużenia.

    Klasę podniosłem z powodu odwracalności, nie skutku — cofnięcie
    wartości działa dopiero po restarcie.

    Punkt sam nie blokuje ekranu. Bez ustawionego czasu do wygaszenia
    nie robi nic, choć raport pokaże go jako spełniony.
  en: |
    On a server the console is not a place but a browser window open at somebody's station - in
    the management card or in the console view of a virtual machine. The grace window bears on
    just that.

    A want of the entry means the default five seconds, that is a compliant state. Non-compliance
    is always the outcome of a knowing lengthening.

    I raised the class by reason of reversibility and not of effect - the undoing of the value
    works only after a restart.

    The item alone does not lock the screen. Without a set time to the screen saver it does
    nothing, though the report will show it met.
