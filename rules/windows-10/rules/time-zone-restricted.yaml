id: win10-time-zone-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana strefy czasowej ograniczona do administratorów, usługi lokalnej i użytkowników
    en: The changing of the zone of time bounded to administrators, the local service and users
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo zmiany strefy czasowej do administratorów,
    konta usługi lokalnej i grupy użytkowników.

    Strefa czasowa rozstrzyga, jak zegar maszyny jest przeliczany na czas
    pokazywany człowiekowi. Sam czas maszyny, ten liczony wewnętrznie
    i zapisywany w dzienniku zdarzeń, pozostaje przy tym nietknięty.

    Na tej różnicy opiera się cała ocena tego punktu. Zmiana strefy nie
    unieważnia biletów dostępowych ani certyfikatów, bo te opierają się na
    czasie wewnętrznym. Nie rozsypuje też kolejności zapisów w dzienniku
    z tego samego powodu.

    Skutkiem realnym jest zamieszanie po stronie człowieka. Zdarzenie
    zapisane o właściwej godzinie zostanie pokazane o innej, więc osoba
    zestawiająca zapisy z relacją użytkownika dostanie przesunięcie
    i będzie szukać przyczyny nie tam, gdzie trzeba.

    Odnotowuję, że grupa użytkowników pozostaje w wykazie celowo. Zmiana
    strefy jest czynnością zwykłą — dotyczy każdego, kto wyjechał
    z maszyną przenośną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przesunięcie
    godzin pokazywanych człowiekowi, utrudniające zestawienie relacji
    z zapisem.
  en: |
    The setting bounds the right of changing the zone of time to the administrators, to the account of the local
    service and to the group of the users.

    The zone of time settles how a machine's clock is reckoned into the time shown to a person. The machine's time
    itself, that counted within and written into the journal of events, stays by this untouched.

    Upon that difference the whole grading of this item rests. The changing of the zone undoes neither tickets of
    access nor certificates, those resting upon the inward time. Neither does it scatter the order of the records
    in the journal, for the same reason.

    The real upshot is a confusion upon the person's side. A happening written at the right hour will be shown at
    another, so whoever sets the records beside a user's account of things will get a shifting and will seek the
    cause where it is not.

    I set down that the group of the users stays in the list on purpose. The changing of the zone is an ordinary
    doing - it touches everybody who has travelled with a machine to be carried.

    What an attacker gains while the item goes unmet: a shifting of the hours shown to a person, hindering the
    setting of an account of things beside a record.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz odpowiada już wymaganiu i na stanowisku roboczym zmiana
    jest zapisem stanu.

    Odnotowuję, że usunięcie z wykazu grupy użytkowników byłoby uciążliwe
    bez wyraźnego zysku. Osoba podróżująca z maszyną przenośną musiałaby
    przy każdej zmianie strefy prosić o pomoc, a punkt ten i tak nie broni
    niczego istotnego.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: czasu zapisywanego w dzienniku, ważności biletów
    i certyfikatów, synchronizacji czasu przez sieć, logowania, drukowania.
  en: |
    The class is "no disruption".

    The default list already answers the requirement, and upon a working station the change is a setting down of a
    state.

    I set down that the taking of the group of the users out of the list would be troublesome without a plain
    gain. Somebody travelling with a machine to be carried would have to ask for help at every change of zone, and
    this item guards nothing of weight in any case.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the time written into the journal, the standing of tickets and certificates, the
    keeping of time in step over the network, logging on, or printing.

implementation_consequences:
  impact_areas:
    - user-interface
    - logging-and-audit
  what_breaks:
    pl:
      - Konto spoza wymaganego zbioru straci możliwość zmiany strefy czasowej na tej maszynie
      - Usunięcie z wykazu grupy użytkowników utrudniłoby pracę osobom podróżującym z maszyną przenośną
      - Domyślny wykaz odpowiada już wymaganiu, więc na stanowisku roboczym zmiana jest zapisem stanu
      - Czas zapisywany w dzienniku i ważność biletów oraz certyfikatów nie zależą od strefy i pozostają bez zmian
      - Synchronizacja czasu przez sieć, logowanie, praca z plikami i drukowanie pozostają bez zmian
    en:
      - An account outside the called-for set will lose the changing of the zone of time upon this machine
      - The taking of the group of the users out of the list would hinder people travelling with a machine to be carried
      - The default list already answers the requirement, so upon a working station the change is a setting down of a state
      - The time written into the journal and the standing of tickets and certificates do not hang upon the zone and stay unchanged
      - The keeping of time in step over the network, logging on, work with files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest przenośna i osoba z niej korzystająca zmienia strefę czasową podczas podróży
    en:
      - The machine is one to be carried and whoever uses it changes the zone of time while travelling
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTimeZonePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-32-544,S-1-5-32-545|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTimeZonePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTimeZonePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators, to the local service and to the
    # users. The zone shifts what is shown, not the time written into the journal.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTimeZonePrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-32-545',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTimeZonePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/change-the-time-zone

notes:
  pl: |
    Reguła jest oceniona nisko i warto, żeby aplikacja to uzasadniła
    wprost, bo z nazwy wygląda podobnie do punktu o czasie systemowym.
    Podobieństwo jest pozorne: tamten dotyczy czasu, na którym opiera się
    uwierzytelnianie, ten wyłącznie sposobu pokazywania go człowiekowi.

    Argument wart zachowania dotyczy dziennika zdarzeń. Zapis w dzienniku
    niesie czas wewnętrzny, więc zmiana strefy nie rusza ani jego
    wartości, ani kolejności zapisów. Rozsypać kolejność potrafi wyłącznie
    przesunięcie zegara — czyli punkt sąsiedni, oceniony znacznie wyżej.

    Odnotowuję, że grupa użytkowników jest tu w wykazie celowo i nie jest
    to ustępstwo wobec wygody kosztem bezpieczeństwa. Zawężenie wykazu
    kosztowałoby realną uciążliwość przy podróżach i nie dałoby w zamian
    niczego, co da się nazwać.
  en: |
    The rule is graded low, and it is well that the application set out the ground outright, it looking by its
    name much like the item about the system time. The likeness is seeming: that one touches the time upon which
    the proving of names rests, this solely the manner of showing it to a person.

    The argument worth keeping touches the journal of events. A record in the journal bears the inward time, so
    the changing of the zone touches neither its value nor the order of the records. The order may be scattered
    only by a shifting of the clock - which is to say by the neighbouring item, graded far higher.

    I set down that the group of the users stands here in the list on purpose and that it is no yielding of safety
    to ease. The narrowing of the list would cost a real trouble at travelling and would give in return nothing
    that may be named.
