id: win2016-non-domain-networks-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connection Manager
  title:
    pl: Zakaz łączenia z siecią spoza domeny przy podłączonej sieci domenowej
    en: Connecting to a network outside the domain forbidden while on a domain network
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania maszynie utrzymywać jednocześnie połączenia z siecią
    domenową i z siecią spoza niej.

    Maszyna podłączona do obu sieci naraz jest przejściem między nimi. Nie
    musi nic przekierowywać ani niczego udostępniać — wystarczy, że jest
    osiągalna z obu stron, a jej system przejmują ci, którzy potrafią wejść
    przez stronę słabiej pilnowaną. Stamtąd droga prowadzi do sieci
    domenowej i nie przechodzi przez żaden punkt styku, bo maszyna jest
    w obu równocześnie.

    Jest to mechanizm nazywany zwykle dwoma drogami naraz i uznawany za
    jedno z najprostszych obejść podziału sieci. Nie wymaga żadnego
    narzędzia ani żadnej luki — wymaga tylko maszyny z dwiema drogami.

    Zasada rozstrzyga tę sytuację w sposób jednoznaczny: przy podłączonej
    sieci domenowej połączenia spoza niej są odrzucane. Kolejność ma
    znaczenie — sieć domenowa ma pierwszeństwo, a nie odwrotnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę
    osiągalną jednocześnie z sieci pilnowanej i niepilnowanej, czyli drogę
    do wnętrza omijającą styk obu sieci.
  en: |
    The setting forbids the machine to hold a connection to a domain network and to
    a network outside it at the same time.

    A machine attached to both networks at once is a passage between them. It need
    forward nothing and share nothing - it is enough that it is reachable from both
    sides, and its system is taken by those who can get in through the less watched
    one. From there the road leads to the domain network and passes through no point
    of contact, since the machine is in both at the same time.

    This is a mechanism usually called two roads at once and reckoned one of the
    simplest ways round the division of a network. It calls for no tool and no flaw
    - it calls only for a machine with two roads.

    The policy settles the situation unambiguously: with a domain network attached,
    connections outside it are rejected. The order matters - the domain network has
    precedence, and not the other way about.

    What an attacker gains while the item goes unmet: a machine reachable at once
    from a watched network and an unwatched one, which is to say a road inside going
    round the contact between the two.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo na serwerze z kilkoma kartami rzecz nie
    jest oczywista.

    Zasada wygląda na przeznaczoną dla stanowisk przenośnych i rzeczywiście
    stamtąd pochodzi. Na serwerze jednak także bywa maszyn z drugą kartą
    w innej sieci: karta zarządzająca, karta kopii zapasowych, karta
    w strefie wystawionej, karta do sieci pamięci masowej.

    Rozstrzyga to, jak system rozpoznaje sieć po drugiej karcie. Sieć, w której
    maszyna odnajduje kontroler domeny, jest domenowa i zasada jej nie
    dotyczy. Sieć bez kontrolera bywa rozpoznana jako prywatna albo
    publiczna — i to właśnie takie połączenie zostanie odrzucone.

    Skutek jest wtedy ostry: druga karta przestaje działać. Jeżeli prowadzi
    przez nią dostęp zarządzający, kopie zapasowe albo ruch do pamięci
    masowej, przerwa jest natychmiastowa i zauważalna.

    Sprawdzenie sprowadza się do jednego pytania: czy każda sieć, w której
    ta maszyna ma działać, jest rozpoznawana jako domenowa. Jeżeli tak,
    zmiana nie robi nic. Jeżeli nie, trzeba albo sieć tak skonfigurować, albo
    punkt świadomie odpuścić.

    Czego to nie psuje: połączeń w obrębie sieci domenowej, usług, logowania,
    maszyn z jedną kartą.

    Wymaga zrestartowania usługi zarządzającej połączeniami.
  en: |
    The class is "needs review", since on a server with several cards the matter is
    not obvious.

    The policy looks meant for portable workstations and indeed comes from there. On
    a server, though, machines with a second card on another network happen too: a
    management card, a backup card, a card in an exposed zone, a card to a storage
    network.

    What settles it is how the system recognises the network on the second card. A
    network in which the machine finds a domain controller is a domain network and
    the policy does not concern it. A network with no controller is at times
    recognised as private or public - and it is just such a connection that will be
    rejected.

    The consequence is then sharp: the second card stops working. If management
    access, backups or traffic to storage runs through it, the break is immediate
    and noticeable.

    The check comes down to one question: is every network this machine is to work
    on recognised as a domain network. If so, the change does nothing. If not,
    either the network has to be configured so, or the item deliberately let go.

    What this does not break: connections within the domain network, services,
    signing in, or machines with one card.

    Calls for the service managing connections to be restarted.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Druga karta prowadząca do sieci bez kontrolera domeny przestaje działać, a wraz z nią dostęp zarządzający, kopie zapasowe albo ruch do pamięci masowej
      - Karta w strefie wystawionej rozpoznanej jako publiczna zostaje odrzucona przy podłączonej sieci domenowej
      - Objaw jest natychmiastowy i wygląda na awarię karty, a nie na skutek zasady
      - Połączenia w obrębie sieci domenowej, usługi i maszyny z jedną kartą pozostają bez zmian
    en:
      - A second card leading to a network with no domain controller stops working, and with it management access, backups, or traffic to storage
      - A card in an exposed zone recognised as public is rejected while a domain network is attached
      - The symptom is immediate and looks like a card failure rather than the upshot of a policy
      - Connections within the domain network, services and machines with one card stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna ma drugą kartę w sieci bez kontrolera domeny i przechodzi przez nią ruch potrzebny do pracy
      - Nie ustalono, jak system rozpoznaje sieć po każdej z kart maszyny
      - Dostęp zarządzający do maszyny prowadzi przez kartę w sieci nierozpoznanej jako domenowa
    en:
      - The machine has a second card on a network with no domain controller and traffic needed for work passes through it
      - It has not been established how the system recognises the network on each of the machine's cards
      - Management access to the machine runs through a card on a network not recognised as a domain one
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
      $name = 'fBlockNonDomain'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    $name = 'fBlockNonDomain'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fBlockNonDomain' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/

notes:
  pl: |
    Punkt jest przykładem reguły przeniesionej z zestawu stanowiskowego,
    która na serwerze wymaga innego czytania. Na stanowisku przenośnym jest
    oczywista i tania; na serwerze z kilkoma kartami bywa kosztowna,
    a bywa bez znaczenia — i rozstrzyga o tym rzecz spoza samej maszyny, czyli
    sposób rozpoznawania sieci.

    Aplikacja powinna przy tym punkcie wprost zachęcać do sprawdzenia kart
    maszyny przed wykonaniem, a nie tylko ostrzegać ogólnie. Inwentaryzacja
    kart i rozpoznanych dla nich sieci jest tu dokładnie tą informacją, która
    zamienia ostrzeżenie ogólne w trafione.

    Odpuszczenie punktu jest na maszynie wielokartowej wynikiem prawidłowym
    i warto to powiedzieć. Zysk jest realny, ale dotyczy zagrożenia
    wymagającego zbiegu okoliczności, a koszt bywa natychmiastowy
    i eksploatacyjny.
  en: |
    The item is an example of a rule carried over from the workstation set which on
    a server calls for another reading. On a portable workstation it is obvious and
    cheap; on a server with several cards it can be costly, and can be of no
    consequence - and what settles that lies outside the machine itself, namely how
    networks are recognised.

    At this item the application should outright encourage the machine's cards to be
    checked before execution, rather than warn in general terms alone. An inventory
    of the cards and of the networks recognised for them is here exactly the
    knowledge that turns a general warning into a well-aimed one.

    Letting the item go is a proper outcome on a multi-card machine and that is
    worth saying. The gain is real, but concerns a threat calling for a coincidence,
    while the cost can be immediate and operational.
