id: win2025-problem-reports-control-panel-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi panelu zgłoszeń o problemach wyłączona
    en: The service backing the problem reports panel disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę obsługującą panel, w którym ogląda się listę
    zgłoszeń o problemach zebranych na tej maszynie.

    Zostawiam kategorię niską i chcę wyraźnie oddzielić ten punkt od
    sąsiedniego, bo obydwa noszą w nazwie zgłoszenia o problemach,
    a dotyczą dwóch różnych rzeczy. Tamten dotyczy samych zgłoszeń: co
    jest zbierane i dokąd wychodzi. Ten dotyczy okna, w którym się te
    zgłoszenia ogląda.

    Różnica jest zasadnicza i przekłada się na obie oceny. Zgłoszenie
    jest rzeczą, okno jest widokiem na rzecz. Wyłączenie widoku nie
    zmienia niczego w tym, co jest zbierane ani dokąd wysyłane — dlatego
    ryzyko jest tu niskie, a przy sąsiednim punkcie średnie.

    Zostaje wartość porządkowa, tak jak przy lokalizatorze punktów
    końcowych: składnik obsługujący element interfejsu, którego na
    serwerze nikt nie otwiera, jest kodem uruchomionym bez powodu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    uruchomiony składnik obsługi interfejsu, na maszynie, na której ten
    interfejs nie jest oglądany.
  en: |
    The item switches off the service that backs the panel wherein the list of words given of troubles
    gathered upon that machine is looked upon.

    I leave the category low and would plainly sunder this item from the neighbouring one, both
    bearing words given of troubles in their names and bearing on two sundry things. That one bears on
    the words themselves - what is gathered and whither it goes. This one bears on the window wherein
    those words are looked upon.

    The difference is a root one and tells upon both reckonings. A word given is a thing, a window is
    a sight of a thing. The switching off of the sight alters nothing in what is gathered nor in
    whither it is sent - and therefore the hazard is here low and at the neighbouring item middling.

    What is left is a worth of order, as at the locator of the ends of callings - a piece that backs a
    part of the face of the system that nobody upon a server opens is code running without ground.

    What an attacker gains while the item goes unmet - little; a running piece of the backing of a
    face, upon a machine whereon that face is not looked upon.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i jest to rozstrzygnięcie, które
    warto uzasadnić, bo można by argumentować odwrotnie: panel po zmianie
    będzie pusty, a ktoś kiedyś mógłby chcieć do niego zajrzeć.

    Odpowiadam na to tak. Na serwerze nikt do tego panelu nie zagląda,
    bo nie jest to miejsce, w którym szuka się przyczyn awarii na
    maszynie bez człowieka przy ekranie. Dane o awariach czyta się
    z dziennika zdarzeń i ze zrzutów zapisanych na dysku, a obie te rzeczy
    po tej zmianie działają dokładnie tak jak przedtem. Znika widok,
    nie znika informacja.

    To jest właśnie granica między klasami. „Wymaga sprawdzenia" znaczy,
    że coś przestanie działać komuś, kto z tego korzysta. Tutaj nic nie
    przestaje działać — przestaje być rysowane okno, którego nikt nie
    otwiera, a jego zawartość pozostaje dostępna tam, gdzie się jej
    faktycznie szuka.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem. Sąsiedni punkt o zgłaszaniu błędów nie nadaje
    się i nie należy ich stosować razem tylko dlatego, że brzmią
    podobnie.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease", and it is a settling worth standing by, one being able to argue
    the other way - the panel will after the change be empty, and somebody might one day wish to look
    into it.

    I answer thus. Upon a server nobody looks into that panel, it being no stead wherein the grounds
    of faults are sought upon a machine with no person at the screen. Data of faults are read out of
    the day-book of happenings and out of the castings written upon the disk, and both of those things
    after that change work just as before. The sight goes away, the tiding does not.

    That is just the bound between the classes. "Needs a checking" means that something will stop
    working for somebody who draws upon it. Here nothing stops working - there stops being drawn a
    window nobody opens, and what is in it stays to be had where it is truly sought.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk. The neighbouring item on
    the giving of word of faults is not, and they are not to be laid on together merely because they
    sound alike.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Panel ze spisem zgłoszeń o problemach przestaje pokazywać cokolwiek
      - Dane o awariach czytane z dziennika zdarzeń działają dokładnie tak jak przedtem
      - Zrzuty awaryjne zapisane na dysku pozostają dostępne bez zmiany
      - Znika widok, a nie informacja, więc nic nie przestaje działać komuś, kto z tego korzysta
      - Punktu nie należy stosować razem z sąsiednim o zgłaszaniu błędów tylko dlatego, że brzmią podobnie
    en:
      - The panel with the list of words given of troubles stops showing anything at all
      - Data of faults read out of the day-book of happenings work just as before
      - The castings of a fault written upon the disk stay to be had unaltered
      - The sight goes away and not the tiding, so nothing stops working for anybody who draws upon it
      - The item is not to be laid on along with the neighbouring one on the giving of word of faults merely because they sound alike
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Przyczyn awarii na tej maszynie szuka się w panelu zgłoszeń, a nie w dzienniku zdarzeń i zrzutach
    en:
      - The grounds of faults upon that machine are sought in the panel of words given and not in the day-book of happenings and the castings
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\wercplsupport'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\wercplsupport'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This closes a window, not a source of data: the event log and the crash
    # dumps on disk stay exactly as they were. It is not the same rule as the
    # neighbouring one on error reporting, despite the similar name.
    Stop-Service -Name 'wercplsupport' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'wercplsupport' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'wercplsupport' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Oddzielenie od sąsiedniego punktu jest tu najważniejsze: tamten
    dotyczy samych zgłoszeń — co jest zbierane i dokąd wychodzi. Ten
    dotyczy okna, w którym się je ogląda. Zgłoszenie jest rzeczą, okno
    jest widokiem na rzecz.

    Granica między klasami: „wymaga sprawdzenia" znaczy, że coś
    przestanie działać komuś, kto z tego korzysta. Tutaj nic nie
    przestaje działać — przestaje być rysowane okno, którego nikt nie
    otwiera, a jego zawartość pozostaje tam, gdzie się jej faktycznie
    szuka.

    Nie stosuj tego punktu razem z sąsiednim tylko dlatego, że brzmią
    podobnie: tamten nie nadaje się do trybu zbiorczego.
  en: |
    The sundering from the neighbouring item weighs here the most - that one bears on the words
    themselves, what is gathered and whither it goes. This one bears on the window wherein they are
    looked upon. A word given is a thing, a window is a sight of a thing.

    The bound between the classes - "needs a checking" means that something will stop working for
    somebody who draws upon it. Here nothing stops working; there stops being drawn a window nobody
    opens, and what is in it stays where it is truly sought.

    Lay not this item on along with the neighbouring one merely because they sound alike - that one is
    not fit for the bulk mode.
