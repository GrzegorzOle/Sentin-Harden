id: win2016-media-player-network-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania biblioteki multimediów w sieci wyłączona
    en: The media library network sharing service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia zawartość biblioteki multimediów tej maszyny
    urządzeniom w sieci i ogłasza ją jako źródło do odtwarzania.

    Na serwerze nie ma biblioteki multimediów i nie ma czego udostępniać.
    Usługa istnieje w systemie, bo pochodzi ze wspólnego jądra, a nie
    dlatego, że ktoś przewidział dla niej zastosowanie serwerowe.

    Rzecz warta uwagi dotyczy nie zawartości, tylko samego ogłaszania się.
    Usługa rozgłasza obecność maszyny w segmencie i odpowiada na pytania
    o to, co ma do zaoferowania. Jest to kolejne źródło danych o maszynie
    podawanych bez pytania — po sieci równorzędnej, po spisie maszyn
    i po odwzorowaniu topologii czwarte w tym samym zestawie.

    Wartość punktu leży zatem w porządku i w zmniejszeniu tego, co maszyna
    mówi o sobie sama z siebie. Nie ma tu zagrożenia, które dałoby się
    nazwać z imienia, i kategoria niska to odzwierciedla.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kolejne
    ogłoszenie obecności maszyny w segmencie i punkt nasłuchu, którego nikt
    nie obserwuje, bo z założenia nie jest używany.
  en: |
    The service shares the contents of this machine's media library with devices on the
    network and announces it as a source to play from.

    On a server there is no media library and nothing to share. The service is in the
    system because it comes from a shared kernel, not because anybody foresaw a server use
    for it.

    The matter worth attention concerns not the contents but the announcing itself. The
    service broadcasts the machine's presence in the segment and answers questions about
    what it has to offer. It is another source of data about the machine given unasked -
    after peer networking, after the register of machines and after the mapping of
    topology, the fourth in the same set.

    The item's worth therefore lies in good order and in lessening what the machine says of
    itself of its own accord. There is here no threat that could be named outright, and the
    low category reflects that.

    What an attacker gains while the item goes unmet: another announcement of the machine's
    presence in the segment, and a listening point nobody watches, being by assumption
    unused.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Nic na serwerze z tej usługi nie korzysta. Nie ma biblioteki, nie ma
    odtwarzacza w użyciu i nie ma urządzeń sięgających po zawartość.

    Usługa bywa przy tym nieobecna, bo składnik odtwarzacza jest na części
    wydań serwerowych funkcją opcjonalną. Audyt zwraca wtedy stan „nie
    dotyczy" i jest to wynik prawidłowy.

    Skutek uboczny wart odnotowania: wraz z usługą znika wpis w zaporze,
    który tę usługę przepuszczał. Nie trzeba go usuwać osobno i nie ma
    potrzeby o nim pamiętać, ale warto wiedzieć, że przegląd reguł zapory
    po wdrożeniu pokaże pozycję nieaktywną, a nie usuniętą.

    Nie ma znanych regresji.

    Czego to nie psuje: udziałów sieciowych, odtwarzania plików lokalnie,
    usług, sieci, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "no disruption".

    Nothing on a server uses that service. There is no library, no player in use and no
    devices reaching for the contents.

    The service is besides at times absent, the player component being on some server
    editions an optional feature. The audit then returns the state "not applicable" and
    that is a proper outcome.

    A side consequence worth noting: along with the service the firewall entry letting it
    through goes quiet. It need not be removed apart and there is no need to remember it,
    but it is worth knowing that a review of the firewall rules after the rollout will show
    an entry inactive rather than removed.

    There are no known regressions.

    What this does not break: network shares, the playing of files locally, services, the
    network, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - Nic na serwerze z tej usługi nie korzysta, więc wyłączenie nie odbiera żadnej funkcji
      - Na części wydań serwerowych składnik odtwarzacza jest opcjonalny i usługi nie ma - audyt zwraca wtedy stan nie dotyczy
      - Wpis w zaporze przepuszczający tę usługę pozostaje na liście jako nieaktywny, a nie znika z niej
      - Udziały sieciowe, odtwarzanie plików lokalnie i usługi pozostają bez zmian
    en:
      - Nothing on a server uses that service, so switching it off takes away no feature
      - On some server editions the player component is optional and the service is not there - the audit then returns the state not applicable
      - The firewall entry letting this service through stays on the list as inactive rather than vanishing from it
      - Network shares, the playing of files locally and services stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna świadomie pełni rolę źródła multimediów dla urządzeń w sieci
    en:
      - The machine knowingly fills the role of a media source for devices on the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'WMPNetworkSvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The machine stops announcing itself as a media source. Nothing on a server
    # reads from that source anyway.
    Stop-Service -Name 'WMPNetworkSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMPNetworkSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'WMPNetworkSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wmp/windows-media-player-sdk

notes:
  pl: |
    Punkt jest czwartym w całym zestawie, który dotyczy ogłaszania obecności
    maszyny w segmencie, i warto pokazywać go razem z trzema poprzednimi.
    Osobno każdy z nich wygląda na drobiazg; razem układają się w obraz
    maszyny, która mówi o sobie czterema kanałami naraz, z czego żadnym
    celowo.

    Jest to zresztą dobry przykład na to, po co istnieje widok odwrotny.
    Użytkownik pytający, co maszyna rozgłasza w sieci, powinien dostać te
    cztery punkty razem, a nie szukać ich po numerach w czterech miejscach
    listy.

    Uwaga o wpisie w zaporze jest drobna, ale warto ją zachować. Przegląd
    reguł zapory po wdrożeniu benchmarku pokazuje pozycje, które wyglądają
    na zapomniane, a są tylko nieaktywne. Bez tego zdania ktoś zacznie je
    kasować ręcznie i przy okazji usunie coś potrzebnego.
  en: |
    The item is the fourth in the whole set concerning the announcing of the machine's
    presence in the segment, and it is worth showing together with the three before it.
    Apart each of them looks a trifle; together they make up a picture of a machine that
    speaks of itself by four channels at once, none of them on purpose.

    It is besides a good example of what the reverse view exists for. A user asking what the
    machine broadcasts on the network should get those four items together rather than seek
    them by number in four places on the list.

    The note about the firewall entry is a small one but worth keeping. A review of the
    firewall rules after the benchmark's rollout shows entries that look forgotten and are
    merely inactive. Without that sentence somebody will begin deleting them by hand and
    will remove something needed along the way.
