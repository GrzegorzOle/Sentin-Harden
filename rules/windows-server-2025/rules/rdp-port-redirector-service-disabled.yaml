id: win2025-rdp-port-redirector-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa przekierowania portów dla sesji zdalnych wyłączona
    en: The port redirector service for remote sessions disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przenoszącą do sesji zdalnej urządzenia maszyny,
    z której ktoś się łączy: dyski, drukarki, porty i karty inteligentne.

    Zostawiam kategorię średnią i chcę wskazać, co w niej siedzi, bo
    przekierowanie urządzeń brzmi jak wygoda, a jest kanałem.

    Dysk przeniesiony do sesji jest połączeniem plikowym między maszyną
    łączącego się a serwerem, zestawionym wewnątrz protokołu sesji
    i niewidocznym dla niczego, co ogląda udziały sieciowe. Idzie nim to,
    co ktoś ma u siebie, i wraca nim to, co weźmie z serwera. Na maszynie
    obsługującej wiele sesji jest to tyle takich kanałów, ile sesji —
    z maszyn, nad którymi administrator serwera nie ma żadnej władzy.

    Kierunek wyjścia bywa tu ważniejszy od kierunku wejścia. Zawartość
    kopiowana z serwera na dysk łączącego się nie przechodzi przez żaden
    udział, nie zostawia wpisu w dziennikach dostępu do plików
    sieciowych i nie daje się ograniczyć uprawnieniami do udziału,
    bo żadnego udziału w tym nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    plikowy w obie strony między serwerem a maszyną łączącego się,
    poprowadzony wewnątrz sesji i poza tym, co obserwuje wymianę plików.
  en: |
    The item switches off the service that bears into a far-off sitting the devices of the machine
    somebody binds from - disks, printers, gates and cards of knowing.

    I leave the category middling and would name what sits within it, the bearing over of devices
    sounding like an ease and being a channel.

    A disk borne into a sitting is a binding of files between the machine of the one who binds and the
    server, set up within the reckoning of the sitting and unseen by anything that looks upon the
    shares of the net. By it there goes what somebody has at their own, and by it there comes back
    what they take off the server. Upon a machine serving many sittings there are as many such
    channels as sittings - off machines whereover the ruler of the server has no might at all.

    The way out weighs here at times more than the way in. Matter copied off the server onto the disk
    of the one who binds goes through no share, leaves no entry in the day-books of the reach to files
    of the net and may not be bounded by the leaves to a share, there being no share in it at all.

    What an attacker gains while the item goes unmet - a channel of files both ways between the server
    and the machine of the one who binds, led within the sitting and outside what watches the trading
    of files.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia wobec oceny dla stacji
    roboczej i powód jest wprost serwerowy: liczba ludzi po drugiej
    stronie.

    Na stacji roboczej przekierowanie urządzeń dotyczy jednej osoby,
    która sama się łączy. Na serwerze obsługującym sesje dotyczy
    wszystkich, którzy się na nim logują, naraz i tego samego dnia.
    Drukowanie do drukarki przy własnym biurku, otwieranie pliku
    z własnego dysku, zapisywanie wyniku pracy na swój komputer — to
    są czynności codzienne, a nie wyjątkowe, i po zmianie przestają być
    możliwe dla wszystkich jednocześnie.

    Objaw jest tu wyjątkowo mylący. Sesja zestawia się normalnie,
    logowanie działa, aplikacje działają — nie ma niczego, co wyglądałoby
    na awarię. Znika za to drukarka, której ktoś używał wczoraj,
    i nie ma dysku, z którego brał dane. Zgłoszenie przyjdzie jako
    „przestała działać drukarka", a nie jako „zmieniono coś na serwerze".

    Na maszynie bez roli serwera sesji, na którą wchodzi się wyłącznie
    dla administrowania, sprawa wygląda odwrotnie i zmiana jest tania.
    Administrator nie potrzebuje w sesji swojej drukarki, a przenoszenie
    plików w obie strony przez sesję jest raczej rzeczą, którą warto
    ograniczyć, niż udogodnieniem, które warto zachować.

    Zmiana cofa się natychmiast, ale odzyskanie przekierowanych urządzeń
    wymaga ponownego zalogowania — sesje już otwarte ich nie zobaczą.
  en: |
    I raise the class to a witting rolling out against the reckoning for a workstation, and the ground
    is outright of the server - the tale of the people on the other side.

    Upon a workstation the bearing over of devices touches one person who binds themselves. Upon a
    server serving sittings it touches all who sign in upon it, at once and on the same day. The
    printing to the printer at one's own desk, the opening of a file off one's own disk, the writing
    down of the fruit of one's work onto one's own reckoner - those are doings of every day and not
    out of the common, and after the change they stop being open to all at the same hour.

    The symptom is here misleading beyond the wont. The sitting is set up as always, the signing in
    works, the applications work - there is nothing that would look like a fault. There goes away, for
    all that, the printer somebody used yesterday, and there is no disk whence they took their data.
    The word will come as "the printer stopped working" and not as "something was altered upon the
    server".

    Upon a machine with no role of a server of sittings, whereonto one comes for the ruling alone, the
    matter looks the other way and the change is cheap. A ruler needs not their own printer within a
    sitting, and the bearing of files both ways through a sitting is rather a thing worth bounding
    than an ease worth keeping.

    The change is undone at once, but the winning back of the borne-over devices takes a signing in
    anew - sittings already open will not see them.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Drukowanie z sesji zdalnej na drukarkę przy własnym biurku przestaje być możliwe
      - Otwieranie plików z własnego dysku wewnątrz sesji przestaje działać
      - Zapisywanie wyniku pracy na własny komputer przez sesję przestaje działać
      - Sesja zestawia się normalnie, więc nic nie wygląda na awarię, a zgłoszenie przychodzi jako problem z drukarką
      - Sesje już otwarte nie odzyskają przekierowanych urządzeń bez ponownego zalogowania
    en:
      - The printing out of a far-off sitting to the printer at one's own desk stops being open to anybody
      - The opening of files off one's own disk within a sitting stops working
      - The writing down of the fruit of one's work onto one's own reckoner through a sitting stops working
      - The sitting is set up as always, so nothing looks like a fault, and the word comes as a trouble with the printer
      - Sittings already open will not win the borne-over devices back without a signing in anew
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna obsługuje sesje robocze użytkowników, którzy drukują albo przenoszą pliki przez sesję
    en:
      - The machine serves the working sittings of people who print or bear files through the sitting
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a machine that serves working sessions this takes printers and drives
    # away from everyone at once. The session still opens normally, so the
    # report arrives as a printer problem, not as a server change.
    Stop-Service -Name 'UmRdpService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'UmRdpService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'UmRdpService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Przekierowanie urządzeń brzmi jak wygoda, a jest kanałem. Dysk
    przeniesiony do sesji to połączenie plikowe zestawione wewnątrz
    protokołu sesji, niewidoczne dla niczego, co ogląda udziały sieciowe.

    Kierunek wyjścia bywa ważniejszy od wejścia: zawartość kopiowana
    z serwera na dysk łączącego się nie przechodzi przez żaden udział
    i nie daje się ograniczyć uprawnieniami do udziału, bo żadnego
    udziału w tym nie ma.

    Klasa podniesiona wprost z powodu serwerowego — liczby ludzi po
    drugiej stronie. Objaw jest mylący: sesja zestawia się normalnie,
    znika tylko drukarka i dysk, więc zgłoszenie przychodzi jako problem
    z drukarką.
  en: |
    The bearing over of devices sounds like an ease and is a channel. A disk borne into a sitting is a
    binding of files set up within the reckoning of the sitting, unseen by anything that looks upon
    the shares of the net.

    The way out weighs at times more than the way in - matter copied off the server onto the disk of
    the one who binds goes through no share and may not be bounded by the leaves to a share, there
    being no share in it at all.

    The class is raised outright of a ground of the server - the tale of the people on the other side.
    The symptom misleads - the sitting is set up as always, only the printer and the disk go away, so
    the word comes as a trouble with the printer.
