id: win11-find-my-device-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Find My Device
  title:
    pl: Odnajdywanie urządzenia przez konto producenta wyłączone
    en: Locating the device through the maker's account disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Mechanizm odnajdywania urządzenia odkłada u producenta systemu położenie
    maszyny i pozwala odczytać je przez stronę internetową po zalogowaniu się na
    konto, z którym maszyna jest powiązana. Położenie jest zapisywane okresowo,
    niezależnie od tego, czy ktoś kiedykolwiek z tej możliwości skorzysta.

    Wynikają z tego dwie rzeczy, obie warte powiedzenia wprost.

    Pierwsza: powstaje zapis tego, gdzie maszyna bywała, przechowywany poza
    organizacją i osiągalny przez konto, którego organizacja często nie
    nadzoruje. Przejęcie takiego konta daje wgląd w miejsca pobytu osoby
    używającej maszyny — informację, której zwykle nie zalicza się do danych
    firmowych, a która bywa wrażliwsza niż zawartość dysku.

    Druga: przez to samo konto da się maszynę zablokować zdalnie. Możliwość
    pomyślana jako obrona przed kradzieżą jest jednocześnie możliwością
    unieruchomienia sprzętu przez kogoś, kto zdobył poświadczenia do konta —
    bez dostępu do sieci organizacji i bez dotykania samej maszyny.

    Wyłączenie mechanizmu odbiera obie te możliwości razem.
  en: |
    The device locating mechanism lodges the machine's whereabouts with the system's
    maker and allows them to be read through a web page after signing in to the account
    the machine is tied to. The whereabouts are recorded from time to time, whether or
    not anybody ever makes use of it.

    Two things follow, both worth saying outright.

    The first: a record comes into being of where the machine has been, kept outside the
    organisation and reachable through an account the organisation often does not
    oversee. Taking over such an account gives a view of the whereabouts of the person
    using the machine - something not usually counted among company data, and sometimes
    more delicate than the contents of the disk.

    The second: through that same account the machine can be locked remotely. A
    capability meant as a defence against theft is at the same time a means of
    immobilising equipment for somebody who has got hold of the account's credentials -
    with no access to the organisation's network and without touching the machine
    itself.

    Switching the mechanism off takes both capabilities away together.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek liczy na tę możliwość w razie
    zgubienia albo kradzieży sprzętu.

    Trzeba to postawić uczciwie, bo jest to jeden z nielicznych punktów, w
    których zabezpieczenie odbiera inne zabezpieczenie. Po wyłączeniu zgubiony
    komputer przestaje dawać się odnaleźć i zdalnie zablokować tą drogą.
    Dla maszyny przenośnej, wynoszonej poza biuro, jest to realna strata i nie
    należy jej pomniejszać.

    Strata jest jednak mniejsza, niż się wydaje, jeżeli dysk jest szyfrowany.
    Szyfrowanie chroni dane niezależnie od tego, gdzie sprzęt się znajduje,
    i robi to lepiej niż zdalna blokada, która wymaga, żeby maszyna nawiązała
    połączenie. Na maszynie szyfrowanej ten punkt odbiera więc możliwość
    odzyskania sprzętu, a nie ochrony danych — i tak właśnie warto zestawić
    koszt z zyskiem.

    Na stanowisku stacjonarnym strata nie występuje w ogóle.

    Poza tym nic się nie zmienia: pozycjonowanie dla map, pogody i innych
    programów działa dalej, bo rozstrzyga o nim osobne ustawienie.

    Nie ma restartu.
  en: |
    What needs checking is whether anybody counts on this capability should equipment be
    lost or stolen.

    This has to be put honestly, since it is one of the few items where one safeguard
    takes another away. Once it is off, a lost computer stops being findable and
    remotely lockable by this route. For a portable machine carried outside the office
    that is a real loss and should not be played down.

    The loss is smaller than it seems, though, where the disk is encrypted. Encryption
    guards the data wherever the equipment happens to be, and does so better than a
    remote lock, which takes the machine making a connection. On an encrypted machine
    this item therefore takes away the chance of recovering the equipment rather than of
    guarding the data - and that is how the cost is worth setting against the gain.

    At a stationary workstation there is no loss at all.

    Beyond that nothing changes: positioning for maps, weather and other programs carries
    on working, being settled by a separate setting.

    There is no restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zgubiona maszyna przenośna przestaje dawać się odnaleźć przez stronę producenta
      - Zdalne zablokowanie skradzionego komputera tą drogą przestaje być możliwe
      - Położenie maszyny przestaje być odkładane u producenta systemu
      - Pozycjonowanie dla map i innych programów działa dalej bez zmian
    en:
      - A lost portable machine stops being findable through the maker's page
      - Remotely locking a stolen computer by this route stops being possible
      - The machine's whereabouts stop being lodged with the system's maker
      - Positioning for maps and other programs carries on working unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna przenośna nie jest szyfrowana, a odnalezienie sprzętu jest jedynym zabezpieczeniem przed utratą danych
      - Organizacja opiera odzyskiwanie zgubionego sprzętu na tej możliwości i nie ma innej
    en:
      - The portable machine is not encrypted and finding the equipment is the only guard against losing data
      - The organisation rests the recovery of lost equipment on this capability and has no other
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice'
      $name = 'AllowFindMyDevice'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice'
    $name = 'AllowFindMyDevice'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowFindMyDevice' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt nie dotyczy usług pozycjonowania jako takich. Programy korzystające
    z położenia działają dalej, a o ich dostępie rozstrzyga osobne ustawienie,
    opisane inną regułą tej paczki.

    Jest to jedna z reguł, przy których świadome odpuszczenie bywa decyzją
    poprawną, i warto ją tak przedstawić. Na nieszyfrowanym sprzęcie
    przenośnym możliwość odnalezienia maszyny ma wartość, której ten punkt nie
    zastępuje niczym. Właściwą kolejnością jest wtedy najpierw szyfrowanie,
    potem ten punkt — nie odwrotnie.

    Wyłączenie działa po stronie maszyny. Zapisy położenia odłożone wcześniej
    pozostają u producenta i ten punkt ich nie usuwa; do tego służą ustawienia
    konta.
  en: |
    The item does not concern positioning services as such. Programs using whereabouts
    carry on working, and their access is settled by a separate setting, described by
    another rule in this pack.

    It is one of the rules where a deliberate acceptance is sometimes the right
    decision, and it is worth presenting that way. On unencrypted portable equipment the
    chance of finding the machine has a worth this item replaces with nothing. The right
    order there is encryption first, this item after - not the other way about.

    Switching it off works on the machine's side. Records of whereabouts lodged earlier
    stay with the maker and this item does not remove them; the account's settings are
    what that is for.
