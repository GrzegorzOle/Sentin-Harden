id: win2016-kms-online-validation-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Software Protection Platform
  title:
    pl: Sprawdzanie licencji w sieci przez klienta serwera aktywacji wyłączone
    en: The checking of a licence over the network by the activation server's client switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza dodatkowe sprawdzanie licencji przez sieć
    producenta, wykonywane przez klienta serwera aktywacji.

    Punkt jest porządkowy i warto to powiedzieć na początku. Chodzi
    o jedno połączenie wychodzące mniej — takie, którego nikt nie zamawiał
    i o którym mało kto wie, bo zestawia się samo.

    Wartość reguły sprowadza się do dwóch rzeczy. Pierwsza: maszyna
    w sieci zamkniętej nie powinna próbować połączeń, które i tak nie
    dojdą. Próby takie zaśmiecają dzienniki zapory i utrudniają
    odróżnienie ruchu nieoczekiwanego od zwykłego szumu — a to jest koszt
    realny, choć niewidoczny na pierwszy rzut oka. Druga: każde
    zapytanie wychodzące mówi coś o maszynie temu, kto je widzi.

    Aktywacja z serwera wewnętrznego od tego sprawdzania nie zależy
    i działa tak samo. Na maszynie aktywowanej inaczej wpis nie ma na czym
    zadziałać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — wartość reguły leży w usunięciu ruchu wychodzącego,
    który zaciemnia obraz w dziennikach zapory.
  en: |
    The setting switches off the additional checking of a licence over the maker's network, carried out by the
    activation server's client.

    The item is one of order and that is worth saying at the outset. It is a matter of one outbound connection
    fewer - one nobody ordered and of which few know, being set up of itself.

    The rule's value comes to two things. The first: a machine on a closed network ought not to attempt
    connections that will not arrive anyway. Such attempts litter the firewall's logs and make it harder to tell
    unexpected traffic from ordinary noise - and that is a real cost, though invisible at first glance. The
    second: every outbound query says something about the machine to whoever sees it.

    Activation from an internal server does not hang on that checking and works the same. On a machine activated
    otherwise the entry has nothing to act on.

    What an attacker gains while the item goes unmet: nothing directly - the rule's value lies in the removal of
    outbound traffic that clouds the picture in the firewall's logs.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Aktywacja z serwera wewnętrznego działa tak jak dotąd. Znika
    wyłącznie dodatkowe sprawdzanie w sieci producenta.

    Na maszynie aktywowanej kluczem wielokrotnym albo obrazem
    z przygotowaną aktywacją zmiana nie robi nic.

    Nie ma znanych regresji.

    Czego to nie psuje: aktywacji, stanu licencji, aktualizacji, ról
    serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    Activation from an internal server works just as before. What goes is solely the additional check over the
    maker's network.

    On a machine activated by a multiple key or by an image with the activation made ready, the change does
    nothing.

    There are no known regressions.

    What this does not break: the activation, the state of the licence, updates, the server's roles, services, or
    applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
  what_breaks:
    pl:
      - Dodatkowe sprawdzanie licencji w sieci producenta przestaje być wykonywane
      - Aktywacja z serwera wewnętrznego i stan licencji pozostają bez zmian
      - Na maszynie aktywowanej kluczem wielokrotnym albo obrazem zmiana nie robi nic
      - Aktualizacje, role serwera, usługi systemowe i aplikacje pozostają bez zmian
    en:
      - The additional checking of a licence over the maker's network ceases to be carried out
      - Activation from an internal server and the state of the licence stay unchanged
      - On a machine activated by a multiple key or by an image the change does nothing
      - Updates, the server roles, system services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aktywacja tej maszyny opiera się na sprawdzaniu licencji wprost w sieci producenta
    en:
      - The activation of this machine rests on the licence being checked straight over the maker's network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key name holds a space - quoting the whole path is required.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'NoGenTicket'
        if ($null -eq $value) { 'MISSING' } else { ([string]$value).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
    $name = 'NoGenTicket'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Activation from an internal server does not depend on this. On a machine
    # activated otherwise this entry has nothing to act on.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoGenTicket' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/get-started/kms-activation-planning

notes:
  pl: |
    Punkt zamyka blok i jest w nim najlżejszy. Warto opisywać go skromnie
    i nie dorabiać mu wagi, bo cały zestaw traci wiarygodność, gdy
    drobiazg opisuje się jak obronę.

    Argument wart zachowania jest nieoczywisty i dotyczy dzienników.
    Połączenie, które i tak nie dojdzie, zostawia wpis w dzienniku zapory
    i dokłada się do szumu. Wartością reguły jest czystszy obraz ruchu
    wychodzącego, a nie zamknięcie drogi ataku — i tak należy o tym mówić.

    Pułapka warta wyróżnienia dotyczy ścieżki. Nazwa klucza zawiera
    spację, więc przy ręcznym sprawdzaniu trzeba objąć całą ścieżkę
    cudzysłowem. Jest to częsta przyczyna wniosku, że ustawienia nie ma.

    Odnotowuję, że na maszynie aktywowanej inaczej niż przez serwer
    aktywacji wpis nie ma na czym zadziałać. Audyt zgłosi wtedy
    niezgodność, choć praktycznego skutku nie ma żadnego — i jest to
    przykład miejsca, w którym raport wart jest zdania wyjaśniającego.
  en: |
    The item shuts the block and is the lightest in it. It is worth describing modestly and getting up no weight for
    it, the whole set losing credit where a trifle is described as a defence.

    The argument worth keeping is not an obvious one and concerns the logs. A connection that will not arrive
    anyway leaves an entry in the firewall's log and adds to the noise. The rule's value is a cleaner picture of
    outbound traffic and not the shutting of a road for an attack - and so it ought to be spoken of.

    A trap worth setting apart concerns the path. The key's name holds a space, so at a checking by hand the whole
    path has to be taken in quotation marks. It is a common cause of the conclusion that the setting is not there.

    Worth noting that on a machine activated otherwise than by an activation server the entry has nothing to act
    on. The audit will then report a non-compliance, though of practical consequence there is none - and it is an
    example of a place where the report is worth an explaining sentence.
