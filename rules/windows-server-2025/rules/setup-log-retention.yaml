id: win2025-setup-log-retention

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Setup
  title:
    pl: Zachowanie dziennika instalacji po zapełnieniu
    en: Behaviour of the setup log once it fills up
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, co dzieje się z dziennikiem instalacji po jego
    zapełnieniu: najstarsze zapisy mają być nadpisywane nowymi.

    Zostawiam kategorię niską. Jest to czwarty i ostatni z punktów o tym
    samym ustawieniu i rozstrzyga tę samą sprawę co trzy poprzednie.

    Warto jednak powiedzieć, co ten dziennik zawiera, bo na serwerze jest
    to treść inna niż na stacji roboczej i mało kto do niego zagląda.
    Zapisuje się w nim dodawanie i usuwanie ról oraz składników,
    instalowanie poprawek i przebieg uaktualnień systemu. Jest to więc
    zapis odpowiadający na pytanie, którego przy audycie nie da się
    ominąć: kiedy ta maszyna stała się tym, czym jest. Kiedy dodano do
    niej rolę serwera sieciowego, kiedy pojawił się podsystem obcego
    systemu, kiedy ktoś doinstalował składnik, którego nie ma
    w dokumentacji.

    Dziennik ten zapełnia się najwolniej ze wszystkich czterech, więc
    nadpisywanie dotknie go najpóźniej. Nie zmienia to jednak tego, że
    ustawienie przeciwne zamroziłoby go tak samo jak pozostałe, i że
    zamrożony przestałby przyjmować zapis o następnej zmianie
    w maszynie — czyli o dokładnie tej, o którą ktoś kiedyś zapyta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio; przy zakazie nadpisywania — brak zapisu o składniku
    dodanym do maszyny po zamrożeniu dziennika.
  en: |
    The item sets what befalls the setup log once it is full - the oldest writings are to be written
    over by new ones.

    I leave the category low. It is the fourth and last of the items upon the same setting and it
    settles the same matter as the three before.

    It is worth saying, for all that, what is in that log, it being upon a server another substance
    than upon a workstation and few folk looking into it. There is written down in it the adding and
    the doing away of roles and of pieces, the setting on of mendings and the run of the makings anew
    of the system. It is therefore the writing that answers the question that at an looking-over may
    not be gone about - when did that machine become what it is. When was the role of a server of the
    web added to it, when did the under-system of a foreign system come forth, when did somebody set
    on a piece that stands in no writ of record.

    That log fills the slowest of all four, so the writing over will touch it the latest. It alters
    not for all that that the setting the other way would freeze it as it would the rest, and that
    frozen it would stop taking in the writing upon the next change within the machine - that is, upon
    just the one somebody will some day ask after.

    What an attacker gains while the item goes unmet - little straightway; at a forbidding of the
    writing over, a want of any writing upon a piece added to the machine after the freezing of the log.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zmiana zapisuje wartość
    w polityce, niczego nie zatrzymuje i nie wymaga restartu.

    Cztery punkty o zachowaniu dzienników po zapełnieniu — zabezpieczeń,
    systemu, aplikacji i instalacji — są jedną decyzją i idą razem.
    Ten jest z nich najmniej sporny, bo dziennik instalacji rośnie tak
    wolno, że u większości maszyn nadpisywanie nigdy się nie zacznie.

    To samo zastrzeżenie co przy pozostałych trzech: jeżeli na maszynie
    ustawiono wcześniej zakaz nadpisywania i dziennik jest pełny, po tej
    zmianie najstarsze zapisy zaczną znikać. Przy tym dzienniku warto
    zrobić kopię nawet wtedy, gdy przy tamtych się jej odpuściło —
    zawiera historię, której nie da się odtworzyć z niczego innego.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease". The change writes a worth into the rule, stops nothing and takes no
    starting anew.

    The four items upon the behaviour of logs once full - of security, of the system, of applications
    and of setup - are one deciding and go together. This is of them the least to be striven over, the
    setup log growing so slowly that upon most machines the writing over will never begin.

    The same saving as at the three others - if upon the machine a forbidding of the writing over was
    set before and the log be full, after that change the oldest writings will begin to go away. At
    that log it is worth making a copy even where at the others one let it be - it holds a tale that
    may be made again out of nothing else.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie z zakazem nadpisywania dziennik zacznie się nadpisywać i najstarsze zapisy zaczną znikać
      - Dziennik instalacji rośnie tak wolno, że u większości maszyn nadpisywanie nigdy się nie zacznie
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Historii dodawania ról i składników nie da się odtworzyć z niczego innego, więc kopia ma tu większą wagę
    en:
      - Upon a machine with a forbidding of the writing over the log will begin to write itself over and the oldest writings will go away
      - The setup log grows so slowly that upon most machines the writing over will never begin
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - The tale of the adding of roles and pieces may be made again out of nothing else, so a copy has here the greater weight
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie ustawiono zakaz nadpisywania świadomie i nie zrobiono jeszcze kopii zebranych zapisów
    en:
      - Upon the machine a forbidding of the writing over was set wittingly and no copy of the gathered writings has yet been made
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is kept as text, not a number, so it is compared as text.
      # Reading it numerically would turn an absent value into a zero and
      # report a machine with no policy at all as satisfying the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
      $name = 'Retention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This log answers when the machine became what it is: roles added,
    # components installed, updates applied. Where overwriting was forbidden
    # and the log is full, take a copy first - this history has no other source.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Czwarty i ostatni punkt o tym samym ustawieniu. Warto powiedzieć, co
    ten dziennik zawiera, bo mało kto do niego zagląda: dodawanie
    i usuwanie ról oraz składników, poprawki, przebieg uaktualnień.

    Jest to zapis odpowiadający na pytanie, którego przy audycie nie da
    się ominąć — kiedy ta maszyna stała się tym, czym jest. Kiedy dodano
    rolę serwera sieciowego, kiedy pojawił się podsystem obcego systemu,
    kiedy doinstalowano składnik spoza dokumentacji.

    Kopia ma tu większą wagę niż przy pozostałych trzech: tej historii
    nie da się odtworzyć z niczego innego.
  en: |
    The fourth and last item upon the same setting. It is worth saying what is in that log, few folk
    looking into it - the adding and doing away of roles and pieces, the mendings, the run of the
    makings anew.

    It is the writing that answers the question that at a looking-over may not be gone about - when did
    that machine become what it is. When was the role of a server of the web added, when did the
    under-system of a foreign system come forth, when was a piece set on that stands in no writ of
    record.

    A copy has here the greater weight than at the three others - that tale may be made again out of
    nothing else.
