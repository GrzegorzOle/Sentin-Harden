id: win2016-defender-routine-remediation

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus
  title:
    pl: Samoczynne usuwanie wykrytych zagrożeń włączone
    en: Automatic removal of detected threats switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe ochronie usuwać wykryte zagrożenie samodzielnie, zamiast
    poprzestawać na zgłoszeniu i czekać na decyzję człowieka.

    Wykrycie bez działania jest półśrodkiem, którego koszt ujawnia się
    dopiero w czasie. Zagrożenie zostaje tam, gdzie było, i dalej działa —
    a wpis w dzienniku czeka, aż ktoś go przeczyta. Na stanowisku roboczym
    ktoś zwykle czyta, bo pojawia się okno. Na serwerze nie pojawia się nic
    i nie siedzi przy nim nikt.

    Czas jest tu całą stawką. Oprogramowanie szyfrujące dane robi swoje
    w minutach; narzędzie zbierające poświadczenia potrzebuje sekund.
    Decyzja podjęta następnego dnia rano dotyczy maszyny, na której wszystko
    już się wydarzyło.

    Drugi powód jest ilościowy. Serwer wykrywający zagrożenia regularnie
    generuje zgłoszenia szybciej, niż ktokolwiek zdąży je rozpatrzyć.
    Kolejka niezałatwionych wykryć rośnie, a jej wartość maleje do zera
    w chwili, gdy nikt już nie wierzy, że da się ją przejrzeć.

    Ustawienie to bywa zmieniane celowo, żeby ochrona „niczego nie ruszała"
    na maszynie wrażliwej. Jest to decyzja zrozumiała i prawie zawsze
    kosztowniejsza, niż wygląda — właściwą odpowiedzią na wrażliwość roli są
    wyłączenia, a nie zdjęcie ochronie prawa do działania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czas.
    Wykrycie odnotowane i niezałatwione nie przeszkadza w niczym, a na
    serwerze może czekać na przeczytanie tygodniami.
  en: |
    The setting has the protection remove a detected threat itself, instead of
    stopping at a report and waiting for a person's decision.

    Detection without action is a half measure whose cost shows only with time. The
    threat stays where it was and goes on working - while an entry in a log waits
    for somebody to read it. On a workstation somebody as a rule reads it, a window
    appearing. On a server nothing appears and nobody sits there.

    Time is the whole stake here. Software encrypting data does its work in minutes;
    a tool gathering credentials needs seconds. A decision taken the next morning
    concerns a machine on which everything has already happened.

    The second reason is one of quantity. A server detecting threats regularly
    raises reports faster than anybody can weigh them. A queue of unsettled
    detections grows, and its worth falls to nothing the moment nobody believes any
    longer that it can be got through.

    This setting is at times changed deliberately so that the protection "touches
    nothing" on a sensitive machine. That is an understandable decision and nearly
    always costlier than it looks - the proper answer to a role's sensitivity is
    exclusions, not taking the protection's right to act away.

    What an attacker gains while the item goes unmet: time. A detection noted and
    unsettled hinders nothing, and on a server it can wait weeks to be read.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo samoczynne działanie znaczy także
    samoczynne usunięcie pliku, który okazał się potrzebny.

    Przypadek, którego trzeba szukać, jest zawsze ten sam: plik roli
    rozpoznany błędnie. Zdarza się to najczęściej starszym programom
    narzędziowym, oprogramowaniu przemysłowemu, plikom bez podpisu
    i narzędziom administracyjnym o podwójnym zastosowaniu — tym samym,
    których używa napastnik. Usunięcie takiego pliku zatrzymuje rolę,
    a objaw wygląda na uszkodzenie instalacji.

    Skutek jest odwracalny, bo usunięte pliki trafiają do kwarantanny
    i da się je stamtąd przywrócić. Trzeba jednak wiedzieć, że tam są —
    a to wymaga, żeby ktoś powiązał awarię z ochroną. Bez tego powiązania
    zgłoszenie brzmi „program przestał działać po aktualizacji".

    Sprawdzenie polega na przejrzeniu dotychczasowych wykryć na tej
    maszynie. Jeżeli wykrycia się zdarzały i dotyczyły plików roli, zmiana
    zacznie je usuwać — i wtedy najpierw trzeba dodać wyłączenia.

    Czego to nie psuje: usług, logowania, łączności, plików objętych
    wyłączeniami.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", since acting on its own also means removing on its
    own a file that has turned out to be needed.

    The case to look for is always the same: a file of the role wrongly recognised.
    That happens most often to older utility programs, to industrial software, to
    unsigned files, and to administrative tools of double use - the very ones an
    attacker uses. Removing such a file halts the role, and the symptom looks like a
    damaged installation.

    The consequence can be undone, removed files going to quarantine and being
    restorable from there. One has to know they are there, though - and that calls
    for somebody to tie the breakdown to the protection. Without that tie the report
    reads "the program stopped working after an update".

    The check consists in looking through the detections made on this machine so
    far. If detections have happened and concerned files of the role, the change
    will begin removing them - and then exclusions have to be added first.

    What this does not break: services, signing in, connectivity, or files covered
    by exclusions.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Pliki roli rozpoznane błędnie zostają usunięte, co zatrzymuje rolę, a objaw wygląda na uszkodzenie instalacji
      - Dotyczy to najczęściej starszych programów narzędziowych, oprogramowania przemysłowego i narzędzi administracyjnych o podwójnym zastosowaniu
      - Usunięte pliki trafiają do kwarantanny i da się je przywrócić, ale trzeba najpierw powiązać awarię z ochroną
      - Usługi, logowanie, łączność i pliki objęte wyłączeniami pozostają bez zmian
    en:
      - Files of the role wrongly recognised are removed, which halts the role, and the symptom looks like a damaged installation
      - That concerns most often older utility programs, industrial software and administrative tools of double use
      - Removed files go to quarantine and can be restored, but the breakdown has first to be tied to the protection
      - Services, signing in, connectivity and files covered by exclusions stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dotychczasowe wykrycia na tej maszynie dotyczyły plików roli i nie dodano dla nich wyłączeń
      - Rola maszyny opiera się na narzędziach o podwójnym zastosowaniu, rozpoznawanych jako zagrożenie
    en:
      - The detections made on this machine so far concerned files of the role and no exclusions have been added for them
      - The machine's role rests on tools of double use, recognised as a threat
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name describes a switching off - zero means the protection acts
      # on its own, one means it only reports and waits for a decision.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableRoutinelyTakingAction'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableRoutinelyTakingAction'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRoutinelyTakingAction' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-windows

notes:
  pl: |
    Punkt jest wart pokazania jako decyzja o tym, kto działa: ochrona czy
    człowiek. Na stanowisku roboczym wybór ten ma sens, bo człowiek jest
    obecny. Na serwerze nie jest — i dlatego zostawienie ochrony przy samym
    zgłaszaniu znaczy w praktyce, że nie robi nic.

    Warto zapisać, czym różni się właściwa odpowiedź na wrażliwość roli.
    Zdjęcie ochronie prawa do działania dotyczy wszystkich plików na
    maszynie; wyłączenie dotyczy wskazanych. Pierwsze jest wygodniejsze
    i znacznie droższe.

    Kwarantanna jest tu istotnym szczegółem i powinna być widoczna przy
    punkcie. Zmienia ona ocenę skutku z nieodwracalnego na odwracalny,
    a różnica ta bywa rozstrzygająca przy podejmowaniu decyzji.
  en: |
    The item is worth showing as a decision about who acts: the protection or a
    person. On a workstation that choice makes sense, a person being present. On a
    server they are not - and so leaving the protection at reporting alone means in
    practice that it does nothing.

    It is worth writing down how the proper answer to a role's sensitivity differs.
    Taking the protection's right to act away concerns every file on the machine; an
    exclusion concerns named ones. The first is more convenient and a good deal
    dearer.

    Quarantine is an important detail here and should be visible at the item. It
    changes the judgement of the consequence from irreversible to reversible, and
    that difference can settle a decision.
