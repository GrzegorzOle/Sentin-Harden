id: win2025-debug-privilege-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Debugowanie programów tylko dla administratorów
    en: Debug programs restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala otworzyć dowolny proces w systemie i sięgnąć po jego
    pamięć — także proces cudzy i taki, który pracuje na koncie
    systemowym.

    Nazwa sugeruje narzędzie programisty i tak to prawo powstało. Skutek
    jest jednak inny, niż nazwa zapowiada. W pamięci procesów usługi
    logowania i lokalnego urzędu zabezpieczeń znajduje się materiał
    poświadczeń: skróty haseł, bilety uwierzytelniające i klucze sesji.
    Prawo to daje do niego dostęp bez łamania czegokolwiek i bez
    zdarzenia logowania.

    Na serwerze konsekwencja rozciąga się poza maszynę. Serwer
    przechowuje w pamięci poświadczenia kont usługowych o uprawnieniach
    domenowych, a przy tym trzyma je tam długo, bo pracuje miesiącami bez
    restartu. Na kontrolerze domeny wachlarz jest najszerszy z możliwych.

    Jest to prawo najczęściej wykorzystywane w praktyce spośród
    wszystkich opisanych w tej grupie — narzędzia do wydobywania
    poświadczeń opierają się właśnie na nim. Kategoria krytyczna nie jest
    tu oceną potencjału, tylko opisem stanu faktycznego.

    Punkt nie każe prawa usunąć. Administrator ma je zachować, bo bez
    niego przestaje działać zbieranie zrzutów pamięci i część narzędzi
    diagnostycznych. Każe je zawęzić do administratorów, czyli odebrać
    wszystkim pozostałym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    poświadczeń wszystkich kont używanych na tej maszynie od ostatniego
    restartu, bez podnoszenia uprawnień i bez śladu w dzienniku logowań.
  en: |
    The right allows any process in the system to be opened and its memory reached for -
    including another's process and one working under the system account.

    The name suggests a programmer's tool and that is how the right came about. The effect,
    though, is other than the name foretells. In the memory of the sign-in service's and the
    local security authority's processes lies credential matter: the digests of passwords,
    authenticating tickets and session keys. This right gives access to it without breaking
    anything and without a sign-in event.

    On a server the consequence stretches past the machine. A server holds in memory the
    credentials of service accounts with domain rights, and holds them there long at that,
    since it works for months without a restart. On a domain controller the spread is the
    widest there is.

    It is the right most often used in practice of all described in this group - the tools for
    drawing credentials out rest on it. The critical category is here no judgement of what
    might be, but a description of what is.

    The item does not bid the right be removed. The administrator is to keep it, since without
    it the gathering of memory dumps and some diagnostic tools stop working. It bids the right
    be narrowed to administrators, that is, taken from all the rest.

    What an attacker gains while the item goes unmet: access to the credentials of every
    account used on this machine since the last restart, without raising their rights and with
    no trace in the log of sign-ins.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc na
    większości serwerów naprawa nie zmienia niczego.

    Administratorzy zachowują prawo, więc zbieranie zrzutów pamięci,
    podłączanie debuggera i narzędzia diagnostyczne działają dalej bez
    zmiany. Jest to istotne, bo obawa o diagnostykę jest najczęstszym
    powodem odpuszczania tego punktu, a w tym kształcie nie ma podstaw.

    Skutek dotyczy wyłącznie kont spoza grupy administratorów, którym
    prawo nadano dodatkowo. Na serwerze bywają to konta usługowe
    oprogramowania monitorującego i agentów zbierających dane
    o wydajności procesów.

    Takie narzędzie po zmianie przestanie odczytywać dane z procesów
    cudzych. Objaw bywa częściowy i przez to mylący: agent działa dalej,
    zgłasza własne dane poprawnie, a znika mu część wskaźników
    dotyczących innych usług.

    Warto więc przed zmianą sprawdzić, komu prawo nadano ponad stan
    domyślny — samo zawężenie jest bezpieczne, ale wykaz mówi, gdzie
    szukać skutku.
  en: |
    The change has no known side effects and takes no break.

    In the default state only administrators hold the right, so on most servers the mending
    changes nothing.

    Administrators keep the right, so the gathering of memory dumps, the attaching of a
    debugger and diagnostic tools go on working unchanged. That matters, since fear for
    diagnostics is the commonest reason this item is let go, and in this shape it has no
    ground.

    The effect concerns only accounts outside the administrators' group that were granted the
    right besides. On a server those are at times the service accounts of monitoring software
    and of agents gathering data about processes' performance.

    Such a tool will after the change stop reading data from others' processes. The symptom is
    at times partial and thereby misleading: the agent goes on working, reports its own data
    rightly, and loses some of the measures concerning other services.

    It is worth checking before the change, then, who was granted the right above the default
    state - the narrowing itself is safe, but the list says where to look for the effect.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Administratorzy zachowują prawo, więc zrzuty pamięci i debugger działają bez zmiany
      - Konto usługowe agenta monitorującego przestanie odczytywać dane z procesów cudzych
      - Objaw bywa częściowy — agent działa, a znika mu część wskaźników
      - W stanie domyślnym prawo mają wyłącznie administratorzy i zmiana nie robi nic
    en:
      - Administrators keep the right, so memory dumps and the debugger work unchanged
      - A monitoring agent's service account will stop reading data from others' processes
      - The symptom is at times partial - the agent works and loses some of its measures
      - In the default state only administrators hold the right and the change does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Agent monitorujący działa na koncie spoza grupy administratorów i odczytuje dane z procesów cudzych
    en:
      - A monitoring agent works under an account outside the administrators' group and reads data from others' processes
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDebugPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDebugPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDebugPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeDebugPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDebugPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/debug-programs

notes:
  pl: |
    Punkt zawęża prawo, a nie usuwa je. Administratorzy mają je
    zachować, bo bez niego przestaje działać zbieranie zrzutów pamięci
    i część narzędzi diagnostycznych.

    Sprawdzenie przyjmuje trzy stany zgodne: wyłącznie grupę
    administratorów, wykaz pusty i brak wpisu. Dwa ostatnie są węższe
    niż wymaganie i dlatego również zgodne.

    Grupa wskazywana jest identyfikatorem, bo nazwa grupy wbudowanej
    jest tłumaczona razem z systemem i na serwerze w innej wersji
    językowej porównanie po nazwie dałoby wynik fałszywy.
  en: |
    The item narrows the right rather than removing it. Administrators are to keep it, since
    without it the gathering of memory dumps and some diagnostic tools stop working.

    The check accepts three compliant states: the administrators' group alone, an empty list
    and no entry. The last two are narrower than what is asked and hence compliant as well.

    The group is pointed to by identifier, since a built-in group's name is translated along
    with the system, and on a server in another language a comparison by name would give a
    false result.
