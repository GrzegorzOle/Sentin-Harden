id: win2016-audit-credential-validation

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Account Logon
  title:
    pl: Inspekcja sprawdzania poświadczeń
    en: Audit credential validation
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje każde sprawdzenie poświadczeń wykonane przez tę
    maszynę, niezależnie od tego, czy zakończyło się zalogowaniem.

    Waga punktu zależy od roli i różnica jest ogromna. Na serwerze członkowskim
    zdarzenia dotyczą kont lokalnych i jest ich mało. Na kontrolerze domeny ta
    sama podkategoria zapisuje sprawdzenie poświadczeń dla całej domeny, bo to
    kontroler jest miejscem, w którym hasło zostaje porównane. Wykaz nieudanych
    prób logowania w domenie powstaje właśnie tutaj i nigdzie indziej.

    Wartość bierze się stąd, że zdarzenie powstaje także wtedy, gdy próba idzie
    z sieci i kończy się odmową. Taka próba nie zostawia śladu w żadnym innym
    miejscu — sesja nie powstaje, profil się nie ładuje, żaden program się nie
    uruchamia. Bez tej inspekcji zgadywanie haseł jest na tej maszynie
    zdarzeniem niewidocznym.

    Rejestrowanie niepowodzeń pokazuje próbę, rejestrowanie powodzeń pokazuje,
    że się udała. Dopiero obie rzeczy razem odpowiadają na pytanie, czy ktoś się
    dostał i kiedy — samo niepowodzenie mówi tylko, że próbowano.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    sprawdzania haseł w tempie dowolnym i bez ryzyka, że ktokolwiek to zauważy.
  en: |
    The subcategory records every check of credentials carried out by this machine,
    whatever came of it, a sign-in or not.

    The item's weight hangs on the role, and the difference is vast. On a member
    server the events concern local accounts and there are few of them. On a domain
    controller the same subcategory records the checking of credentials for the
    whole domain, since the controller is the place at which a password is compared.
    The list of failed sign-in attempts in the domain arises exactly here and
    nowhere else.

    The worth comes of an event arising also where the attempt comes from the
    network and ends in a refusal. Such an attempt leaves a trace in no other place
    - no session arises, no profile loads, no program starts. Without this auditing
    the guessing of passwords is on this machine an invisible event.

    Recording failures shows the attempt; recording successes shows that it worked.
    Only the two together answer the question whether somebody got in and when - a
    failure alone says only that somebody tried.

    What an attacker gains while the item goes unmet: the means of trying passwords
    at any pace they like, with no risk of anybody noticing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" ze względu na objętość, a nie na regresję.
    Nic nie przestaje działać i nikt niczego nie zauważy — koszt jest w całości
    kosztem miejsca i przepustowości.

    Rząd wielkości zależy od roli. Serwer członkowski dopisze dziennie niewiele
    zdarzeń. Kontroler domeny zapisuje sprawdzenie poświadczeń dla każdego
    logowania w domenie, a więc tyle zdarzeń, ile razy ktokolwiek gdziekolwiek
    się zalogował. Przy domyślnym rozmiarze dziennika zabezpieczeń zapis obraca
    się wtedy w ciągu godzin.

    Dlatego punkt czyta się razem z rozmiarem dziennika i z tym, dokąd zdarzenia
    są wysyłane. Inspekcja bez miejsca na jej wynik daje złudzenie zapisu, który
    w chwili dochodzenia okaże się nadpisany.

    Na serwerze 2016 rzecz waży dodatkowo, bo maszyny tego rocznika bywają
    kontrolerami pozostawionymi w domenie na potrzeby zgodności — czyli dokładnie
    tymi, na które nikt nie patrzy, a przez które nadal idą wszystkie logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review" on account of volume, not of regression. Nothing
    stops working and nobody notices anything - the cost is wholly one of space and
    of throughput.

    The order of size hangs on the role. A member server will add few events a day.
    A domain controller records the checking of credentials for every sign-in in the
    domain, and so as many events as there were times anybody anywhere signed in. At
    the security log's default size the record then turns over within hours.

    Hence the item is read together with the log's size and with where the events
    are sent. Auditing with no room for its outcome gives the illusion of a record
    which, at the moment of an inquiry, turns out to have been overwritten.

    On Server 2016 the matter weighs the more, because machines of this vintage are
    at times controllers left in the domain for compatibility's sake - which is to
    say exactly those nobody looks at, and through which all sign-ins still pass.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — rośnie wyłącznie objętość dziennika zabezpieczeń
      - Na kontrolerze domeny przybywa tyle zdarzeń, ile logowań w całej domenie
      - Przy domyślnym rozmiarze dziennika zapis obraca się w ciągu godzin i najstarsze wpisy znikają
      - System zbierający zdarzenia dostanie wyraźnie większy strumień z tej maszyny
    en:
      - No regression in the working - only the security log's volume grows
      - On a domain controller as many events accrue as there are sign-ins in the whole domain
      - At the log's default size the record turns over within hours and the oldest entries vanish
      - The event-gathering system will get a markedly larger stream from this machine
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma domyślny rozmiar i nie ma go jak powiększyć
      - Zdarzenia z tej maszyny są rozliczane objętościowo w systemie zbierającym
    en:
      - The security log is at its default size and there is no way of enlarging it
      - Events from this machine are billed by volume in the gathering system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE923F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE923F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE923F-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE923F-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE923F-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-credential-validation

notes:
  pl: |
    Podkategoria jest wskazywana identyfikatorem, a nie nazwą. Nazwy są
    tłumaczone razem z systemem, więc reguła oparta na nazwie działałaby
    wyłącznie na jednej wersji językowej, a raport ma być porównywalny
    niezależnie od języka maszyny.

    Odczyt idzie przez kopię polityki inspekcji, bo tylko ona podaje ustawienie
    liczbą. Zwykły odczyt zwraca tekst w języku systemu, którego nie da się
    porównać w sposób pewny.

    Punkt jest na serwerze ważniejszy niż na stanowisku roboczym. Powodem jest
    rola kontrolera domeny — tam ta podkategoria jest jedynym miejscem, w którym
    widać zgadywanie haseł w całej domenie.
  en: |
    The subcategory is pointed to by identifier rather than by name. Names are
    translated along with the system, so a rule built on the name would work on one
    language version alone, and the report is meant to be comparable whatever the
    machine's language.

    The reading goes through a backup of the audit policy, since only that gives the
    setting as a number. An ordinary read returns text in the system's language,
    which cannot be compared with any certainty.

    The item matters more on a server than at a working station. The reason is the
    domain controller's role - there this subcategory is the one place at which the
    guessing of passwords across the whole domain is visible.
