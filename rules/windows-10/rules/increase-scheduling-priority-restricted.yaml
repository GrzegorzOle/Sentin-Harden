id: win10-increase-scheduling-priority-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zwiększanie priorytetu planowania ograniczone do administratorów i menedżera okien
    en: The raising of the priority of scheduling bounded to administrators and the manager of windows
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo zwiększania priorytetu planowania do
    administratorów i konta menedżera okien.

    Priorytet rozstrzyga, który proces dostaje czas procesora wcześniej.
    Mechanizm ten pracuje bez przerwy i zwykle nikt go nie zauważa,
    bo system rozdziela czas tak, żeby wszystko szło do przodu.

    Prawo opisane tu pozwala tę kolejność zmienić. Konto, które je ma,
    może podnieść priorytet własnego procesu ponad procesy systemowe —
    także ponad te, które odpowiadają za dzienniki zdarzeń i za ochronę
    przed złośliwym kodem.

    Skutkiem jest maszyna, która działa, ale przestaje nadążać
    z wszystkim poza jednym programem. Nie jest to przejęcie uprawnień,
    tylko odebranie systemowi możliwości reagowania — a to bywa dla
    napastnika wystarczające.

    Odnotowuję, że konto menedżera okien pozostaje w wykazie
    z konieczności. Bez niego rysowanie pulpitu traci pierwszeństwo przed
    zwykłą pracą i obsługa staje się szarpana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    wypchnięcie procesów nadzorujących na koniec kolejki.
  en: |
    The setting bounds the right of raising the priority of scheduling to the administrators and to the account of
    the manager of windows.

    Priority settles which process gets the time of the processor the sooner. That mechanism works without pause
    and commonly nobody marks it, the system parting out the time so that everything shall go forward.

    The right set out here lets that order be changed. An account holding it may raise the priority of a process
    of its own above the system's processes - above those too that answer for the journals of events and for the
    guarding against harmful code.

    The upshot is a machine that works but ceases to keep up with everything but one program. It is no taking of
    rights but the taking from the system of its means of answering - and that is at times enough for an attacker.

    I set down that the account of the manager of windows stays in the list of necessity. Without it the drawing
    of the desktop loses its precedence over ordinary work and the handling turns jerky.

    What an attacker gains while the item goes unmet: a way of pushing the processes that watch to the end of the
    queue.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz odpowiada już wymaganiu i na maszynie utrzymywanej
    normalnie zmiana jest zapisem stanu.

    Odnotowuję jedyne miejsce warte spojrzenia: oprogramowanie do obróbki
    dźwięku albo obrazu w czasie rzeczywistym, które podnosi sobie
    priorytet, żeby nie gubić danych. Część takich programów robi to
    z konta użytkownika. Po zmianie program wystartuje, ale zacznie gubić
    próbki przy obciążonej maszynie.

    Usunięcie z wykazu konta menedżera okien byłoby błędem — obsługa
    pulpitu stałaby się szarpana przy każdym cięższym zadaniu.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: pracy programów użytkowych, wydajności ogólnej,
    logowania, dostępu do plików, drukowania.
  en: |
    The class is "no disruption".

    The default list already answers the requirement, and upon a machine kept in the ordinary way the change is a
    setting down of a state.

    I set down the one place worth a look: software for the working of sound or of picture in the running hour,
    which raises its own priority so as not to lose data. Some such programs do so from a user's account. After
    the change the program will start but will begin to lose samples upon a machine under load.

    The taking of the account of the manager of windows out of the list would be a fault - the handling of the
    desktop would turn jerky at every heavier task.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the work of programs of use, speed at large, logging on, the way to files, or
    printing.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Programy do obróbki dźwięku albo obrazu w czasie rzeczywistym zaczną gubić próbki przy obciążonej maszynie
      - Usunięcie z wykazu konta menedżera okien sprawiłoby, że obsługa pulpitu stałaby się szarpana
      - Domyślny wykaz odpowiada już wymaganiu, więc na większości maszyn zmiana jest zapisem stanu
      - Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo
      - Praca programów użytkowych, wydajność ogólna, logowanie, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - Programs for the working of sound or of picture in the running hour will begin to lose samples upon a machine under load
      - The taking of the account of the manager of windows out of the list would make the handling of the desktop turn jerky
      - The default list already answers the requirement, so upon most machines the change is a setting down of a state
      - The consequence shows at the next signing in of an account that loses the right
      - The work of programs of use, speed at large, logging on, the way to files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje oprogramowanie do obróbki dźwięku albo obrazu w czasie rzeczywistym, podnoszące sobie priorytet
    en:
      - Upon the machine works software for the working of sound or of picture in the running hour, raising its own priority
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-90-0)?|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeIncreaseBasePriorityPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators and to the window manager. Without the
    # second the drawing of the desktop loses its precedence over ordinary work.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeIncreaseBasePriorityPrivilege = *S-1-5-32-544,*S-1-5-90-0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeIncreaseBasePriorityPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/increase-scheduling-priority

notes:
  pl: |
    Reguła należy do rodziny punktów dotyczących dostępności, obok
    blokowania stron w pamięci i przydziału pamięci procesu. Warto, żeby
    aplikacja pokazała je razem, bo wszystkie trzy bronią tego samego:
    zdolności maszyny do dalszej pracy.

    Argument wart postawienia wprost dotyczy tego, co napastnik wypycha
    z kolejki. Podniesienie priorytetu własnego procesu samo w sobie nic
    nie daje — daje dopiero wtedy, gdy spycha się przy tym usługi
    nadzorujące. Dziennik zdarzeń, który nie nadąża z zapisem, gubi wpisy;
    ochrona, która nie nadąża ze skanowaniem, przepuszcza pliki.

    Odnotowuję konto menedżera okien w wykazie dopuszczalnym. Nie jest to
    ustępstwo, tylko warunek płynnej obsługi pulpitu — a wykaz zawężony
    do samych administratorów byłby tu pogorszeniem pracy, nie
    utwardzeniem.
  en: |
    The rule belongs to the family of items touching availability, beside the locking of pages in memory and the
    quota of a process's memory. It is well that the application show them together, all three guarding the same:
    the machine's power of working on.

    The argument worth putting outright touches what the attacker pushes out of the queue. The raising of the
    priority of a process of one's own gives of itself nothing - it gives only where the services that watch are
    thereby pushed down. A journal of events that cannot keep up with its writing loses entries; a guarding that
    cannot keep up with its scanning lets files through.

    I set down the account of the manager of windows in the list that is let in. It is no yielding but the
    condition of a smooth handling of the desktop - and a list narrowed to the administrators alone would here
    worsen the work and not harden it.
