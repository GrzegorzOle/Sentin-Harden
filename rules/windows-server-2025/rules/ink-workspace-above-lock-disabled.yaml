id: win2025-ink-workspace-above-lock-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Ink Workspace
  title:
    pl: Obszar roboczy pisma odręcznego niedostępny z ekranu blokady
    en: Ink workspace unavailable from the lock screen
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera obszarowi roboczemu pisma odręcznego dostęp sponad
    zablokowanego ekranu.

    Kategoria średnia i chcę powiedzieć, dlaczego nie wyższa, skoro
    poprzednie punkty o tej samej granicy dostały wysoką. Różnica jest
    w tym, co przez tę szparę przechodzi. Asystent wyszukiwania odpowiada
    danymi z maszyny; obszar pisma odręcznego daje powierzchnię do
    rysowania i notatkę. Granica jest ta sama, ale zdobycz mniejsza.

    Mniejsza nie znaczy żadna. To nadal jest aplikacja uruchomiona przed
    podaniem hasła, z własnym oknem, własnym zapisem na dysku i własną
    listą ostatnich rzeczy. Notatka zapisana nad ekranem blokady zostaje
    w profilu, a w drugą stronę: to, co ktoś zapisał wcześniej, bywa
    widoczne w podglądzie bez logowania.

    Na serwerze rzecz jest w zasadzie teoretyczna, bo obszar pisma
    odręcznego jest składnikiem stanowiskowym. Zostawiam punkt mimo to,
    bo wyjątki robione „bo to i tak nieobecne" są dokładnie tym, przez co
    lista wyjątków przestaje być znana.

    Ustawienie przyjmuje wartości ze zbioru: zero wyłącza obszar zupełnie,
    jeden pozostawia go w sesji, ale odbiera sponad blokady, dwa otwiera go
    także nad blokadą. Reguła uznaje za spełnione zarówno zero, jak
    i jeden — wybór między nimi należy do właściciela maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomioną
    aplikację przed uwierzytelnieniem i wgląd w to, co zapisano w niej
    wcześniej.
  en: |
    The item takes away from the ink workspace its access from above a locked
    screen.

    The category is medium, and I want to say why it is not higher, given
    that the previous items about the same boundary were rated high. The
    difference lies in what passes through the gap. The search assistant
    answers with data from the machine; the ink workspace gives a surface to
    draw on and a note. The boundary is the same, but the prize is smaller.

    Smaller does not mean none. It is still an application started before a
    password is given, with its own window, its own writing to disk and its
    own list of recent things. A note written above the lock screen stays in
    the profile, and the other way round: what somebody wrote earlier is
    sometimes visible in a preview without signing in.

    On a server the matter is essentially theoretical, because the ink
    workspace is a workstation component. I keep the item nonetheless,
    because exceptions made "since it is absent anyway" are exactly what
    stops a list of exceptions from being known.

    The setting takes values from a set: zero switches the workspace off
    entirely, one leaves it inside a session but takes it away from above the
    lock, two opens it above the lock as well. The rule treats both zero and
    one as met - the choice between them belongs to the machine's owner.

    What an attacker gains while the item goes unmet: an application started
    before authentication and a view of what was written in it earlier.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie widzę tu nic do stracenia.
    Składnik jest stanowiskowy, a na serwerze najczęściej go po prostu nie
    ma.

    Skutek, gdyby był używany: z zablokowanego ekranu nie da się otworzyć
    obszaru pisma odręcznego. W sesji, po zalogowaniu, działa dalej — o ile
    wybrano wartość jeden, a nie zero.

    Warto tę różnicę mieć przed oczami przy wyborze. Zero wyłącza składnik
    zupełnie i jest właściwe na serwerze, gdzie nikt tego nie używa.
    Jedynka zostawia go ludziom i odbiera wyłącznie dostęp sponad blokady —
    i to jest wybór właściwy tam, gdzie do maszyny podłączone jest pióro.
    Audyt uznaje obie wartości, bo obie realizują cel punktu.

    Czego to nie psuje: ekranu dotykowego, pióra jako urządzenia, pisma
    odręcznego w aplikacjach, które mają własną obsługę, ani niczego, co
    dzieje się po zalogowaniu.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption" and on a server I see nothing to lose. The
    component belongs to a workstation, and on a server it is most often
    simply not there.

    The effect, were it in use: the ink workspace cannot be opened from a
    locked screen. Within a session, after signing in, it still works -
    provided the value chosen was one rather than zero.

    It is worth keeping that difference in view when choosing. Zero switches
    the component off entirely and is right on a server, where nobody uses
    it. One leaves it to people and takes away only the access from above the
    lock - and that is the right choice where a pen is attached to the
    machine. The audit accepts both values, because both carry out the item's
    purpose.

    What this does not break: the touch screen, the pen as a device,
    handwriting in applications that support it themselves, or anything that
    happens after signing in.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Z zablokowanego ekranu nie da się otworzyć obszaru pisma odręcznego
      - Przy wartości zero składnik jest wyłączony zupełnie, także w sesji po zalogowaniu
      - Przy wartości jeden zostaje w sesji, a odebrany jest wyłącznie dostęp sponad blokady
      - Ekran dotykowy, pióro jako urządzenie i pismo odręczne w aplikacjach z własną obsługą działają bez zmian
    en:
      - The ink workspace cannot be opened from a locked screen
      - At the value zero the component is switched off entirely, including within a session after signing in
      - At the value one it stays within the session and only the access from above the lock is taken away
      - The touch screen, the pen as a device and handwriting in applications that support it themselves work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Do maszyny podłączone jest pióro, a notatki sponad ekranu blokady są sposobem pracy uzgodnionym z użytkownikiem
    en:
      - A pen is attached to the machine and notes from above the lock screen are a way of working agreed with the user
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is a choice out of three: zero switches the workspace off
      # entirely, one leaves it inside a session, two opens it above the lock.
      # Both zero and one carry out the item's purpose.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
      $name = 'AllowWindowsInkWorkspace'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[01]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    $name = 'AllowWindowsInkWorkspace'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An application started before a password is given, with its own writing to
    # disk and its own list of recent things. One leaves the workspace inside a
    # session and takes away only the access from above the lock; zero switches
    # it off entirely and suits a server, where nobody uses it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowWindowsInkWorkspace' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowsinkworkspace

notes:
  pl: |
    Kategoria niższa niż przy pozostałych punktach o tej samej granicy, bo
    zdobycz jest mniejsza: nie dane z maszyny, tylko powierzchnia do
    rysowania i notatka. Mniejsza nie znaczy żadna — to nadal aplikacja
    uruchomiona przed podaniem hasła.

    Ustawienie przyjmuje wartości ze zbioru. Zero wyłącza składnik zupełnie
    i jest właściwe na serwerze; jedynka zostawia go w sesji i odbiera
    wyłącznie dostęp sponad blokady. Audyt uznaje obie.

    Punkt zostaje mimo znikomej obecności składnika na serwerze: wyjątki
    robione „bo to i tak nieobecne" są tym, przez co lista wyjątków
    przestaje być znana.
  en: |
    A lower category than the other items about the same boundary, because
    the prize is smaller: not data from the machine but a surface to draw on
    and a note. Smaller does not mean none - it is still an application
    started before a password is given.

    The setting takes values from a set. Zero switches the component off
    entirely and suits a server; one leaves it inside a session and takes
    away only the access from above the lock. The audit accepts both.

    The item stays despite the component's slight presence on a server:
    exceptions made "since it is absent anyway" are what stops a list of
    exceptions from being known.
