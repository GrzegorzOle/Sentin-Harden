id: win2016-account-lockout-threshold

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Próg blokady konta po nieudanych próbach logowania
    en: Account lockout threshold after failed sign-in attempts
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby konto blokowało się po ustalonej liczbie nieudanych
    prób logowania, i żeby liczba ta nie była większa niż dziesięć.

    Bez progu blokady zgadywanie hasła nie ma żadnego kosztu. Napastnik może
    próbować bez końca, a jedynym ograniczeniem jest przepustowość łącza.
    Przy haśle typowym oznacza to, że wejście jest kwestią czasu liczonego
    w godzinach, nie w latach — i to niezależnie od tego, jak dobrze hasło
    zostało zbudowane.

    Próg zamienia atak nieograniczony w atak ograniczony do kilku prób na
    okno czasowe. Nie czyni zgadywania niemożliwym, ale przenosi je z pola,
    na którym wygrywa sprzęt, na pole, na którym wygrywa cierpliwość — a ta
    zostawia ślady w dzienniku.

    Na serwerze ten punkt broni przede wszystkim kont lokalnych, do których
    da się dobijać z sieci: przez udział plikowy, przez pulpit zdalny, przez
    zdalne zarządzanie. Serwer 2016 często pełni właśnie taką rolę
    w instalacjach, które przy tej maszynie zostały.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zgadywania haseł bez ograniczenia liczby prób, z dowolnego miejsca, które
    dosięga tej maszyny.
  en: |
    The item requires an account to lock after a set number of failed sign-in
    attempts, and that number to be no greater than ten.

    Without a lockout threshold, guessing a password costs nothing. An attacker
    can try endlessly, and the only limit is the bandwidth of the link. With a
    typical password that means getting in is a matter of hours rather than
    years - regardless of how well the password was built.

    The threshold turns an unlimited attack into one limited to a few attempts
    per window of time. It does not make guessing impossible, but it moves it
    off the ground where hardware wins and onto the ground where patience wins
    - and patience leaves traces in the log.

    On a server this item defends above all the local accounts that can be
    hammered at from the network: through a file share, through remote desktop,
    through remote management. Server 2016 often plays exactly that part in the
    installations that stayed with this machine.

    What an attacker gains while the item goes unmet: the ability to guess
    passwords with no limit on attempts, from anywhere that can reach this
    machine.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód jest jeden, za to poważny:
    próg blokady jest jedynym ustawieniem z tej grupy, którym da się wyłączyć
    sobie dostęp do maszyny.

    Blokadę wywołuje nie tylko człowiek myjący się z hasłem. Wywołuje ją
    każde miejsce, w którym stare hasło zostało zapisane i jest podawane
    automatycznie: zmapowany dysk sieciowy, zadanie harmonogramu, usługa,
    pula aplikacji, kopia zapasowa łącząca się na konto. Takie miejsce
    próbuje w kółko i wyczerpuje próg w kilka sekund, bez udziału
    kogokolwiek.

    To jest ta sytuacja, przez którą punkt wymaga przygotowania. Konto,
    którego hasło zmieniono, a którego stare hasło siedzi w trzech miejscach,
    będzie blokowane raz za razem i nikt nie będzie wiedział dlaczego.

    Osobna rzecz, poważniejsza na tej roli: na serwerze 2016 wbudowane konto
    administratora nie podlega tej blokadzie przy logowaniu lokalnym, ale
    konta administracyjne utworzone ręcznie — już tak. Jeżeli dostęp
    do maszyny opiera się wyłącznie na takim koncie i na sesji zdalnej,
    zablokowanie go odcina wejście całkowicie. Trzeba mieć drugą drogę,
    zanim reguła zostanie zastosowana.

    Przed wdrożeniem warto przejrzeć dziennik pod kątem nieudanych logowań.
    Jeżeli już teraz jest ich stale kilkanaście dziennie, próg zadziała
    pierwszego dnia i zadziała na kimś swoim.

    Zmiana nie wymaga restartu.
  en: |
    The class is "needs planned rollout", and the reason is single but serious:
    the lockout threshold is the one setting in this group that can shut you
    out of your own machine.

    A lockout is not triggered only by a person fumbling a password. It is
    triggered by every place where an old password was saved and is supplied
    automatically: a mapped network drive, a scheduled task, a service, an
    application pool, a backup job connecting under an account. Such a place
    tries over and over and uses the threshold up in seconds, with nobody
    involved.

    That is the situation which makes this item need preparation. An account
    whose password was changed while the old one sits in three places will be
    locked again and again, and nobody will know why.

    A separate matter, weightier on this role: on Server 2016 the built-in
    administrator account is not subject to this lockout for a local sign-in,
    but administrative accounts created by hand are. If access to the machine
    rests solely on such an account and on a remote session, locking it cuts
    the way in entirely. There has to be a second route before the rule is
    applied.

    Before the rollout it is worth looking through the log for failed sign-ins.
    If there are already a dozen or more every day, the threshold will act on
    the first day, and it will act on one of your own.

    The change needs no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Zmapowane dyski, zadania harmonogramu i usługi z zapisanym starym hasłem blokują konto w kilka sekund
      - Konto administracyjne utworzone ręcznie da się zablokować, więc potrzebna jest druga droga wejścia na maszynę
      - Nieudane logowania obecne już dziś sprawią, że próg zadziała pierwszego dnia
      - Zablokowane konto wraca po upływie czasu blokady albo po odblokowaniu przez administratora
    en:
      - Mapped drives, scheduled tasks and services holding an old password lock the account in seconds
      - An administrative account created by hand can be locked, so a second way into the machine is needed
      - Failed sign-ins already present today mean the threshold will act on the first day
      - A locked account returns after the lockout time passes or once an administrator unlocks it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dostęp do maszyny opiera się na jednym koncie administracyjnym i nie ma drugiej drogi wejścia
      - Na maszynie pracują usługi z zapisanym hasłem, o którym nie wiadomo, czy jest aktualne
    en:
      - Access to the machine rests on a single administrative account and there is no second way in
      - Services run on the machine with a saved password that may or may not be current
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LockoutBadCount\s*=\s*(\d+)') {
          # Zero means "never lock out" - it must not pass a comparison against
          # an upper bound as if it were a very low threshold.
          if ([int]$Matches[1] -eq 0) { 'NEVER' } else { $Matches[1] }
        } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '10'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^LockoutBadCount\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'LockoutBadCount'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A lockout is triggered by saved old passwords as readily as by a person:
    # a mapped drive, a scheduled task or a service retrying uses the threshold
    # up in seconds. Make sure a second way into the machine exists first.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LockoutBadCount = 10',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('LockoutBadCount = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/account-lockout-threshold

notes:
  pl: |
    Pułapka odczytu: zero znaczy „konto nie blokuje się nigdy", a przy
    porównaniu „nie więcej niż" wyglądałoby na próg najostrzejszy z możliwych.
    Polecenie audytu zwraca wtedy słowo zamiast liczby, żeby raport nie
    pokazał zgodności tam, gdzie blokady nie ma w ogóle.

    Próg dziesięciu prób jest granicą górną tego benchmarku. Wartość niższa
    spełnia punkt tak samo — nowsze wydania benchmarków schodzą tu do pięciu
    i jeżeli maszyna to wytrzyma, warto ustawić mniej.

    Punkt działa w trójce: próg, czas trwania blokady i czas, po którym licznik
    nieudanych prób wraca do zera. Sam próg bez dwóch pozostałych daje
    ustawienie, które albo blokuje na zawsze, albo zeruje się tak szybko, że
    zgadywanie prawie nie zwalnia.
  en: |
    A reading trap: zero means "the account never locks", and under a "not
    greater than" comparison it would look like the strictest possible
    threshold. The audit command returns a word instead of a number in that
    case, so the report does not show compliance where there is no lockout at
    all.

    A threshold of ten attempts is this benchmark's upper bound. A lower value
    meets the item just as well - newer benchmark releases come down to five
    here, and if the machine can take it, less is worth setting.

    The item works as one of three: the threshold, how long the lockout lasts,
    and how long before the count of failed attempts returns to zero. The
    threshold alone, without the other two, gives a setting that either locks
    forever or resets so quickly that guessing barely slows down.
