id: win2025-remote-desktop-services-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa pulpitu zdalnego wyłączona
    en: The Remote Desktop service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przyjmującą połączenia pulpitu zdalnego. Usługa
    ta nasłuchuje stale i przyjmuje próby logowania z sieci — również te,
    których nikt nie zamierzał wykonać.

    Zanim opiszę wartość, muszę powiedzieć rzecz, która dotyczy całej tej
    grupy reguł i którą piszę tutaj raz, żeby nie powtarzać jej przy
    każdej usłudze z osobna.

    Na stacji roboczej usługa systemowa jest dodatkiem. Na serwerze bywa
    rolą — czyli powodem, dla którego ta maszyna w ogóle stoi. Ta sama
    reguła jest więc na jednej maszynie oczywistym utwardzeniem, a na
    drugiej poleceniem wyłączenia tego, po co serwer kupiono. Reguła
    zostaje w paczce w postaci przepisanej z benchmarku, bo tak brzmi
    punkt. Prawidłowym wynikiem pracy z nią na maszynie pełniącej tę rolę
    jest zapisany wyjątek z uzasadnieniem — nie naprawa i nie cisza.

    Wartość samego punktu jest realna i chcę ją nazwać. Pulpit zdalny to
    usługa wystawiona, przyjmująca poświadczenia i historycznie jedno
    z najczęściej atakowanych wejść do serwera. Wyłączona na maszynie,
    która jej nie potrzebuje, zdejmuje całą tę powierzchnię naraz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: stale
    dostępne wejście przyjmujące poświadczenia, na maszynie, na której
    nikt tego wejścia nie używa i nikt go nie obserwuje.
  en: |
    The item switches off the service taking the bindings of the far-off board. That service listens
    without cease and takes tryings of signing in off the net - those too that nobody meant to make.

    Before I set forth the worth, I must say a thing that bears on this whole group of rules and
    which I write here once, that it be not said again at every service by itself.

    On a workstation a service of the system is a thing set alongside. On a server it is at times the
    role - that is, the ground the machine stands at all for. The same rule is therefore upon the one
    machine a plain hardening and upon the other a bidding to switch off that for which the server
    was bought. The rule stays in the pack in the shape written out of the benchmark, that being how
    the item reads. The right outcome of working with it upon a machine bearing that role is a
    written exception with a standing by it - no mending and no silence.

    The worth of the item itself is true and I would name it. The far-off board is a service set
    forth, taking tokens of leave, and of old one of the most beset ways into a server. Switched off
    upon a machine that takes it not, it takes that whole face away at one stroke.

    What an attacker gains while the item goes unmet - a way in ever come-at-able, taking tokens of
    leave, upon a machine whereon nobody uses that way and nobody watches it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę powiedzieć
    najmocniej, jak potrafię, dlaczego akurat przy tej regule nie wolno
    tego zlekceważyć.

    Na bardzo wielu serwerach pulpit zdalny jest jedyną drogą, którą ktoś
    na tę maszynę wchodzi. Nie jedną z dróg — jedyną. Wyłączenie tej
    usługi jest wtedy zamknięciem sobie drzwi od środka, a ponieważ
    polecenie wykonuje się zwykle właśnie przez pulpit zdalny, zamknięcie
    następuje w trakcie wykonywania polecenia. Sesja, w której to robisz,
    zostaje zerwana natychmiast.

    Jest to, moim zdaniem, najprostszy sposób na trwałą utratę dostępu do
    serwera spośród wszystkich zmian w tej paczce. Dlatego zasada jest tu
    ta sama, którą zapisałem przy zasadach rozruchu i przy usłudze
    obsługi łączności bliskiego zasięgu, tylko ostrzejsza: droga wejścia
    poza pulpitem zdalnym musi być sprawdzona i przetestowana zanim
    ruszysz. Nie opisana w dokumentacji — sprawdzona, przez faktyczne
    zalogowanie się tą drogą.

    Drugi przypadek jest inny i groźniejszy w skutkach dla ludzi. Serwer
    terminali obsługuje tą usługą wszystkich swoich użytkowników. Tam nie
    chodzi o utratę dostępu przez jednego administratora, tylko o
    odcięcie od pracy wszystkich naraz, bez uprzedzenia. Na takiej
    maszynie to jest punkt do zapisania jako wyjątek, a nie do wdrożenia.

    Zmiana cofa się natychmiast, o ile ma się dostęp do maszyny, żeby ją
    cofnąć. To zastrzeżenie jest tu istotą rzeczy.
  en: |
    I leave the class "needs a witting rolling out" and would say as strongly as I can why at this
    rule above all it may not be made light of.

    Upon very many servers the far-off board is the only road whereby anybody comes onto that
    machine. Not one of the roads - the only one. The switching off of that service is then the
    shutting of the door upon oneself from within, and since the command is mostly carried out
    through the far-off board itself, the shutting befalls in the midst of the carrying out. The
    sitting wherein you do it is broken off at once.

    It is, to my mind, the plainest way to a lasting loss of reach to a server among all the changes
    in this pack. Therefore the rule here is the one I wrote at the rules of the raising up and at
    the service of the handling of the binding of short reach, only sharper - the way in beside the
    far-off board must be looked to and tried before you stir. Not set forth in the writings - looked
    to, by a true signing in along that road.

    The second case is other and worse in its outcome for people. A server of terminals serves by
    that service all its users. There it is not about the loss of reach by one administrator but
    about the cutting of all from their work at once, without a forewarning. Upon such a machine this
    is an item to be written down as an exception and not to be rolled out.

    The change is undone at once, so long as one has a reach to the machine to undo it. That reserve
    is here the heart of the matter.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Sesja pulpitu zdalnego, w której wykonuje się to polecenie, zostaje zerwana natychmiast
      - Na maszynie, gdzie pulpit zdalny jest jedyną drogą wejścia, następuje trwała utrata dostępu
      - Na serwerze terminali odcięci zostają wszyscy użytkownicy naraz i bez uprzedzenia
      - Droga wejścia poza pulpitem zdalnym musi być sprawdzona faktycznym zalogowaniem, nie opisem w dokumentacji
      - Cofnięcie jest natychmiastowe, o ile ma się dostęp do maszyny, żeby je wykonać
    en:
      - The sitting of the far-off board wherein the command is carried out is broken off at once
      - Upon a machine where the far-off board is the only road in, there follows a lasting loss of reach
      - Upon a server of terminals all the users are cut off at once and without a forewarning
      - The way in beside the far-off board must be looked to by a true signing in and not by a setting forth in the writings
      - The undoing is at once, so long as one has a reach to the machine to do it
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali i ta usługa obsługuje pracę jej użytkowników
      - Pulpit zdalny jest jedyną drogą wejścia na tę maszynę i nie sprawdzono innej przez faktyczne zalogowanie
    en:
      - The machine is a server of terminals and that service bears the work of its users
      - The far-off board is the only road onto that machine and no other was looked to by a true signing in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This breaks off every open session, including the one this command is
    # running in. Sign in by the out-of-band route first and confirm it works,
    # or you will not get back onto this machine.
    Stop-Service -Name 'TermService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'TermService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'TermService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Rzecz dotycząca całej grupy reguł o usługach, zapisana tu raz: na
    stacji roboczej usługa systemowa jest dodatkiem, na serwerze bywa
    rolą — czyli powodem, dla którego ta maszyna w ogóle stoi. Reguła
    zostaje w paczce w postaci przepisanej z benchmarku, ale prawidłowym
    wynikiem pracy z nią na maszynie pełniącej tę rolę jest zapisany
    wyjątek z uzasadnieniem, nie naprawa i nie cisza.

    Przy tej konkretnej regule: to jest najprostszy sposób na trwałą
    utratę dostępu do serwera spośród wszystkich zmian w tej paczce.
    Droga wejścia poza pulpitem zdalnym ma być sprawdzona faktycznym
    zalogowaniem, nie opisem w dokumentacji.
  en: |
    A thing bearing on the whole group of rules about services, written here once - on a workstation
    a service of the system is a thing set alongside, on a server it is at times the role, that is
    the ground the machine stands at all for. The rule stays in the pack in the shape written out of
    the benchmark, but the right outcome of working with it upon a machine bearing that role is a
    written exception with a standing by it, no mending and no silence.

    At this one rule - it is the plainest way to a lasting loss of reach to a server among all the
    changes in this pack. The way in beside the far-off board is to be looked to by a true signing
    in, not by a setting forth in the writings.
