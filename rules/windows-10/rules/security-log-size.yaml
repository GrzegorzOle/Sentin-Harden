id: win10-security-log-size

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Security
  title:
    pl: Maksymalny rozmiar dziennika zabezpieczeń
    en: The greatest size of the security log
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie powiększa dziennik zabezpieczeń do rozmiaru mieszczącego
    zapis z okresu, w którym zdarzenie ma szansę zostać zauważone.

    Punkt ten jest warunkiem wszystkich reguł inspekcji z tej paczki.
    Każda z nich kończy się tym samym zastrzeżeniem: zapis powstaje, ale
    mieści się tylko tak długo, jak pozwala dziennik. Rozmiar domyślny
    mieści zapis z inspekcji podstawowej przez kilka dni, a z inspekcją
    tworzenia procesów — przez kilkanaście godzin.

    Skutek zbyt małego dziennika jest gorszy niż brak zapisu, bo jest
    niewidoczny. Wpisy powstają, raport pokazuje inspekcję włączoną,
    a odpowiedzi na pytanie sprzed tygodnia już nie ma — wypadła jako
    najstarsza. Maszyna wygląda na zabezpieczoną i taka nie jest.

    Odnotowuję, czym ten punkt nie jest. Nie zastępuje zbierania zdarzeń
    poza maszynę: dziennik lokalny, choćby największy, na maszynie
    opanowanej zostanie wyczyszczony. Powiększenie go kupuje czas, nie
    odporność.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    ślad po jego czynnościach zniknie sam, bez żadnego działania z jego
    strony.
  en: |
    The setting enlarges the security log to a size holding a record from a span in which a happening stands a
    chance of being noticed.

    This item is the condition of every audit rule in this pack. Each of them ends in the same caveat: the
    record comes about, but it fits only so long as the log allows. The default size holds the record of a basic
    audit for a few days, and with the audit of the making of processes - for a dozen hours or so.

    The consequence of too small a log is worse than the want of a record, being unseen. The entries come about,
    the report shows the audit switched on, and the answer to a question from a week past is gone - it fell out
    as the oldest. The machine looks guarded and is not.

    I set down what this item is not. It does not stand in place of gathering events away from the machine: a
    local log, however great, upon a machine in somebody's hands will be emptied. The enlarging of it buys time,
    not hardiness.

    What an attacker gains while the item goes unmet: the surety that the trace of their acts will vanish of
    itself, without any doing on their part.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie zajmuje miejsce na dysku i nic poza tym. Zapisywanie
    zdarzeń nie zwalnia wraz z rozmiarem dziennika, a odczyt pojedynczego
    wpisu również nie.

    Jedyny koszt wymierny to miejsce: dziennik o wymaganym rozmiarze zajmuje
    około dwustu megabajtów. Na maszynie z dyskiem zapełnionym bywa to
    rozmowa, ale nie jest to rozmowa o bezpieczeństwie.

    Odnotowuję skutek uboczny widoczny przy pracy: otwarcie tak dużego
    dziennika w przeglądarce zdarzeń trwa dłużej niż otwarcie domyślnego.
    Nie jest to awaria, tylko czas oczekiwania rzędu kilku sekund.

    Sprawdzenie odczytuje najpierw zasadę, a gdy jej nie ma — rzeczywisty
    rozmiar używany przez usługę dzienników. Dzięki temu liczba w raporcie
    opisuje maszynę, a nie zasadę, której na niej nie ustawiono.

    Czego to nie psuje: zapisywania zdarzeń, ich odczytu, wydajności
    maszyny, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting takes up room upon the disk and nothing besides. The writing down of events does not slow with
    the log's size, nor does the reading of a single entry.

    The one measurable cost is room: a log of the size called for takes up some two hundred megabytes. Upon a
    machine with a full disk that is at times a conversation, but it is not a conversation about safety.

    I set down a side consequence seen at work: the opening of so great a log in the viewer of events takes
    longer than the opening of the default one. It is no fault but a waiting of some few seconds.

    The check reads the policy first, and where there is none - the size the log service is in fact using. By
    that the number in the report describes the machine and not a policy that was never set upon it.

    What this does not break: the writing down of events, their reading, the machine's speed, logging on, file
    shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Dziennik o wymaganym rozmiarze zajmuje około dwustu megabajtów miejsca na dysku
      - Otwarcie tak dużego dziennika w przeglądarce zdarzeń trwa dłużej niż otwarcie domyślnego, rzędu kilku sekund
      - Zapisywanie zdarzeń nie zwalnia wraz z rozmiarem dziennika i odczyt pojedynczego wpisu również nie
      - Powiększenie dziennika kupuje czas, nie odporność, bo dziennik lokalny na maszynie opanowanej zostanie wyczyszczony
      - Odczyt zdarzeń, wydajność maszyny, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A log of the size called for takes up some two hundred megabytes of room upon the disk
      - The opening of so great a log in the viewer of events takes longer than the default one, by some few seconds
      - The writing down of events does not slow with the log s size, nor does the reading of a single entry
      - The enlarging of the log buys time and not hardiness, a local log upon a machine in somebody s hands being emptied
      - The reading of events, the machine s speed, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie brakuje miejsca na dysku i dwieście megabajtów jest kosztem realnym
    en:
      - There is a want of room upon the machine s disk and two hundred megabytes is a real cost
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog Security -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '196608'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is in kilobytes. A larger log costs disk space and nothing else -
    # the writing itself does not grow slower with the size.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 196608 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/view-the-security-event-log

notes:
  pl: |
    Reguła jest warunkiem praktycznym wszystkich reguł inspekcji w tej
    paczce i warto, żeby aplikacja pokazywała ją przy każdej z nich —
    tak samo jak punkt o pierwszeństwie szczegółowych zasad inspekcji.
    Tamten sprawia, że zapis powstaje; ten sprawia, że się mieści.

    Odnotowuję, dlaczego sprawdzenie sięga po rozmiar rzeczywisty przy
    braku zasady. Maszyna bez ustawionej zasady nie jest maszyną bez
    dziennika — ma rozmiar domyślny i to on decyduje o tym, ile się
    zmieści. Odczyt samej zasady dawałby raport mówiący o zamiarze,
    a nie o stanie.

    Argument wart postawienia wprost dotyczy granicy tej reguły.
    Powiększenie dziennika kupuje czas między zdarzeniem a jego
    zauważeniem. Nie kupuje odporności na wyczyszczenie — a to jest
    osobne pytanie, na które odpowiada zbieranie zdarzeń poza maszynę.
  en: |
    The rule is the practical condition of every audit rule in this pack, and it is well that the application
    show it at each of them - just as it does the item about the precedence of the detailed audit rules. That one
    makes the record come about; this makes it fit.

    I set down why the check reaches for the real size where there is no policy. A machine without a policy set
    is no machine without a log - it has the default size, and it is that which settles how much fits. A reading
    of the policy alone would give a report speaking of an intent and not of a state.

    The argument worth putting outright touches this rule's bound. The enlarging of the log buys time between a
    happening and its being noticed. It does not buy hardiness against an emptying - and that is a question
    apart, answered by the gathering of events away from the machine.
