id: fedora44-pass-max-days

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.4.1.1
  section: Access Control > User Accounts and Environment > Configure shadow password suite parameters
  title:
    pl: Maksymalny wiek hasła jest skonfigurowany
    en: Ensure password expiration is configured
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Hasło, które nigdy nie wygasa, działa bez końca także po wycieku, o którym
    nikt nie wie. PASS_MAX_DAYS w /etc/login.defs mówi, po ilu dniach nowe
    konta muszą zmienić hasło, a pole w /etc/shadow ustala to samo dla
    istniejących kont.

    Punkt wymaga, żeby PASS_MAX_DAYS i to pole kont z hasłem wynosiły od 1
    do 365 dni.
  en: |
    A password that never expires keeps working forever, also after a leak
    nobody knows about. PASS_MAX_DAYS in /etc/login.defs sets after how many
    days new accounts have to change the password, and a field in
    /etc/shadow sets the same for existing accounts.

    The item requires PASS_MAX_DAYS and this field of accounts with a
    password to be between 1 and 365 days.

disruption_description:
  pl: |
    Fedora domyślnie ustawia 99999 dni, czyli hasła nie wygasają. Naprawa
    ustawia 365 dni w login.defs i kontom z hasłem. Konto, którego hasło
    zmieniono ponad rok temu, musi je zmienić przy najbliższym logowaniu,
    a przez tydzień przed terminem użytkownik widzi ostrzeżenie.
  en: |
    Fedora uses 99999 days by default, so passwords do not expire. The
    remediation sets 365 days in login.defs and for accounts with a
    password. An account whose password was changed over a year ago has to
    change it at the next login, and for a week before the date the user
    sees a warning.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownicy muszą zmieniać hasło co rok; konto z hasłem starszym niż rok musi je zmienić przy najbliższym logowaniu
      - "Konta z hasłem używane przez skrypty bez interakcji, np. przez su albo ssh z hasłem: po wygaśnięciu hasła logowanie się nie uda"
    en:
      - Users have to change the password every year; an account with a password older than a year has to change it at the next login
      - "Accounts with a password used by scripts without interaction, for example through su or ssh with a password: after the password expires the login fails"
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konta usługowe z hasłem, którego nikt nie zmienia; lepiej przejść na klucze i zablokować im hasło
    en:
      - Service accounts with a password that nobody changes; it is better to move them to keys and lock the password
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !((v ~ /^(0|[1-9][0-9]*)$/) && v + 0 >= 1 && v + 0 <= 365) }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld=5 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 >= 1 && v + 0 <= 365)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(defs_get PASS_MAX_DAYS); then
        v=${r#* }; s="PASS_MAX_DAYS=$v"
        [ "${r%% *}" = /etc/login.defs ] || s="$s(${r%% *})"
      else
        v=""; s="PASS_MAX_DAYS=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "5" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld=5 '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "365" ] && [ "$v" != "365" ]; then chage -M "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=shadowdefs-1
        if [ -e /etc/login.defs ]; then echo existed=1; else echo existed=0; fi
        if [ -n "5" ]; then awk -F: -v fld=5 '$2 ~ /^\$.+\$/ { print "user", $1, $fld }' /etc/shadow; fi
      } > "$b"
      chmod 600 "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/login.defs
      mark='# Sentin-Harden: fedora44-pass-max-days'
      line='PASS_MAX_DAYS 365'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowdefs-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !((v ~ /^(0|[1-9][0-9]*)$/) && v + 0 >= 1 && v + 0 <= 365) }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld=5 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 >= 1 && v + 0 <= 365)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(defs_get PASS_MAX_DAYS); then
        v=${r#* }; s="PASS_MAX_DAYS=$v"
        [ "${r%% *}" = /etc/login.defs ] || s="$s(${r%% *})"
      else
        v=""; s="PASS_MAX_DAYS=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "5" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld=5 '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "365" ] && [ "$v" != "365" ]; then chage -M "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "Already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        *shadow-unreadable*) echo "Cannot read /etc/shadow; run as root" >&2; exit 1 ;;
      esac
      fix=0
      if g=$(defs_get PASS_MAX_DAYS); then
        if ! ok "${g#* }"; then
          [ "${g%% *}" = "$f" ] || { echo "PASS_MAX_DAYS is set in ${g%% *}, which overrides $f; change it there by hand" >&2; exit 1; }
          fix=1
        fi
      else
        fix=1
      fi
      users=""
      if [ -n "5" ]; then
        users=$(awk -F: -v fld=5 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 >= 1 && v + 0 <= 365)) print $1 }' /etc/shadow)
        lock=$(awk -F: -v fld=5 -v nv=365 -v today=$today '
          function lk(l, m, i) { return l ~ /^[0-9]+$/ && l + 0 > 0 && m ~ /^[0-9]+$/ && i ~ /^[0-9]+$/ && today - l > m + 0 && today - l - m > i + 0 }
          $2 ~ /^\$.+\$/ { v = $fld; if (v ~ /^[0-9]+$/ && v + 0 >= 1 && v + 0 <= 365) next; was = lk($3, $5, $7); $fld = nv
            if (!was && lk($3, $5, $7)) { printf "%s%s", s, $1; s = "," } }' /etc/shadow)
        if [ -n "$lock" ]; then
          echo "These accounts would be locked right away because their password is too old: $lock; set them a new password first, nothing changed" >&2; exit 1
        fi
      fi
      d=$(dirname "$f")
      old=$(mktemp "$d/.sentin-harden-old.XXXXXX")
      t=$(mktemp "$d/.sentin-harden.XXXXXX")
      trap 'rm -f "$old" "$t"' EXIT
      if [ -e "$f" ]; then had=1; cat "$f" > "$old"; else had=0; fi
      undo() {
        if [ "$fix" = 1 ]; then if [ "$had" = 1 ]; then cat "$old" > "$f"; else rm -f "$f"; fi; fi
        if [ -n "5" ]; then restore_users >/dev/null; fi
      }
      if [ "$fix" = 1 ]; then
        { if [ "$had" = 1 ]; then awk -v mark="$mark" -v line="$line" -v k=PASS_MAX_DAYS '
            skip { skip = 0; if ($0 == line) next }
            $0 == mark { skip = 1; next }
            !done { x = $0; sub(/#.*/, "", x); split(x, w, " "); if (w[1] == k) { print mark; print line; done = 1 } }
            { print }
            END { if (!done) { print mark; print line } }' "$f"
          else echo "$mark"; echo "$line"; fi; } > "$t"
        if [ "$had" = 1 ]; then chmod --reference="$f" "$t"; chown --reference="$f" "$t"; else chmod 644 "$t"; chown root:root "$t"; fi
        mv -f "$t" "$f"
        if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
        echo "Set $line in $f"
      fi
      for u in $users; do
        chage -M 365 "$u" || { undo; echo "chage failed for $u; restored the previous state" >&2; exit 1; }
        echo "Set the maximum password age 365 for $u"
      done
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) undo; echo "The item is not met after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/login.defs
      mark='# Sentin-Harden: fedora44-pass-max-days'
      line='PASS_MAX_DAYS 365'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowdefs-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      e=$(sed -n '2s/^existed=//p' "$b")
      case "$e" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !((v ~ /^(0|[1-9][0-9]*)$/) && v + 0 >= 1 && v + 0 <= 365) }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld=5 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 >= 1 && v + 0 <= 365)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(defs_get PASS_MAX_DAYS); then
        v=${r#* }; s="PASS_MAX_DAYS=$v"
        [ "${r%% *}" = /etc/login.defs ] || s="$s(${r%% *})"
      else
        v=""; s="PASS_MAX_DAYS=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "5" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld=5 '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "365" ] && [ "$v" != "365" ]; then chage -M "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
      if [ -n "5" ]; then restore_users; fi
      if [ ! -f "$f" ] || ! grep -qxF "$mark" "$f"; then echo "The line of this rule is not in $f, nothing to restore there"; exit 0; fi
      t=$(mktemp "$(dirname "$f")/.sentin-harden.XXXXXX")
      trap 'rm -f "$t"' EXIT
      # Only the marked line of this rule goes; the rest of the file stays as it is now.
      awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f" > "$t"
      if grep -A 1 -xF "$mark" "$f" | grep -qxF "$line"; then kept=0; else kept=1; fi
      if [ "$e" = 0 ] && ! grep -q '[^[:space:]]' "$t"; then
        rm -f "$f"; echo "Removed $f, which this rule created"; exit 0
      fi
      chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if [ "$kept" = 1 ]; then
        echo "Removed the comment of this rule from $f; the line under it was changed by hand and stays"
      else
        echo "Removed the PASS_MAX_DAYS line of this rule from $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/login.defs.5.html
  - https://man7.org/linux/man-pages/man5/shadow.5.html
  - https://man7.org/linux/man-pages/man1/chage.1.html

notes:
  pl: |
    Sprawdzenie odtwarza sposób, w jaki shadow-utils i pam_unix na Fedorze
    44 czytają ustawienia: najpierw /etc/login.defs, potem pliki *.defs
    w /etc/login.defs.d w kolejności nazw, i wygrywa ostatni plik, który ma
    ten klucz. W jednym pliku wygrywa pierwszy wpis, także z niepoprawną
    wartością. Wartość stoi po nazwie oddzielona spacją albo tabulatorem;
    zapis KEY=wartość jest nieznaną nazwą. Sprawdziłem to w kontenerze.
    Wartość liczbowa musi być zapisana dziesiętnie bez zera na początku, bo
    shadow-utils czyta 010 jako 8.

    Naprawa wstawia wiersz tej reguły pod komentarzem Sentin-Harden tuż
    przed pierwszym wpisem tego klucza w /etc/login.defs, żeby wygrał.
    Gdy klucz ustawia plik w /etc/login.defs.d, naprawa niczego nie zmienia
    i trzeba poprawić ten plik ręcznie. Wycofanie usuwa tylko te dwa
    wiersze.

    Ustawienie w /etc/login.defs dotyczy tylko kont tworzonych później,
    więc sprawdzenie obejmuje też odpowiednie pole w /etc/shadow kont, które
    mają skrót hasła (konta zablokowane i bez hasła pomija, tak jak CIS).
    Naprawa ustawia to pole poleceniem chage kontom, które nie spełniają
    punktu, a stare wartości zapisuje w kopii zapasowej. Wycofanie przywraca
    je kontom, które nadal mają wartość ustawioną przez regułę. Sprawdzenie
    wymaga odczytu /etc/shadow, więc bez uprawnień roota daje wynik NOT_OK
    z dopiskiem shadow-unreadable.

    Naprawa odmawia, gdy nowe wartości zablokowałyby któreś konto od razu,
    czyli gdy jego hasło wygasłoby dawniej niż liczba dni z pola nieaktywności
    (INACTIVE). Wtedy trzeba najpierw nadać temu kontu nowe hasło.
    Sprawdziłem w kontenerze, że konto z wygasłym hasłem musi je zmienić
    przy logowaniu, a po okresie nieaktywności jest odrzucane.

    Konto root na Fedorze ma zwykle zablokowane hasło, więc go to nie
    dotyczy. Wartość 0 w PASS_MAX_DAYS wymusza zmianę przy każdym logowaniu
    i też nie spełnia punktu.
  en: |
    The check follows how shadow-utils and pam_unix on Fedora 44 read the
    settings: first /etc/login.defs, then the *.defs files in
    /etc/login.defs.d in name order, and the last file that has the key
    wins. Within a file the first entry wins, even one with a wrong value.
    The value follows the name after a space or tab; KEY=value is an unknown
    name. This was checked in a container. A number has to be written in
    decimal without a leading zero, because shadow-utils reads 010 as 8.

    The remediation inserts the line of this rule under a Sentin-Harden
    comment right before the first entry of the key in /etc/login.defs, so
    that it wins. When a file in /etc/login.defs.d sets the key, the
    remediation changes nothing and that file has to be fixed by hand.
    Rollback removes only these two lines.

    The setting in /etc/login.defs only applies to accounts created later,
    so the check also covers the matching field in /etc/shadow of accounts
    that have a password hash (it skips locked accounts and accounts without
    a password, as CIS does). The remediation sets this field with chage for
    accounts that do not meet the item and saves the old values in the
    backup. Rollback gives them back to accounts that still have the value
    set by the rule. The check needs to read /etc/shadow, so without root
    privileges it gives the NOT_OK result with a shadow-unreadable note.

    The remediation refuses when the new values would lock an account at
    once, that is when its password would have expired longer ago than the
    number of days in the inactivity field (INACTIVE). Then give that
    account a new password first. A container showed that an account with
    an expired password has to change it at login, and after the inactivity
    period it is rejected.

    The root account on Fedora usually has a locked password, so this does
    not apply to it. The value 0 in PASS_MAX_DAYS forces a change at every
    login and does not meet the item either.
