id: fedora44-home-separate-partition

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.1.2.3.1
  section: Initial Setup > Filesystem > Configure Filesystem Partitions > Configure /home
  title:
    pl: Katalog /home jest osobną partycją
    en: Ensure separate partition exists for /home
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    W /home leżą dane wszystkich użytkowników. Jeśli dzieli system plików
    z resztą systemu, jeden użytkownik, który zapełni dysk, zatrzymuje usługi,
    dzienniki i aktualizacje. Osobne montowanie pozwala też nadać katalogom
    domowym opcje nodev i nosuid bez wpływu na resztę systemu.

    Domyślna instalacja Fedory Workstation tworzy na btrfs osobny podwolumin
    home zamontowany w /home, więc punkt jest spełniony od razu. Taki
    podwolumin dzieli jednak miejsce z resztą systemu i przed zapełnieniem
    dysku chroni dopiero przy włączonych limitach btrfs.

    Punkt należy do poziomu 2, bo na maszynie, która go nie spełnia, zmiana
    wymaga przeniesienia danych.
  en: |
    /home holds the data of all users. If it shares a file system with the rest
    of the system, one user who fills the disk stops services, logs and updates.
    A separate mount also lets the home directories get the nodev and nosuid
    options without affecting the rest of the system.

    A default Fedora Workstation installation creates a separate home subvolume
    on btrfs mounted at /home, so the item is met from the start. Such a
    subvolume shares space with the rest of the system, though, and protects
    against a full disk only with btrfs quotas enabled.

    The item belongs to level 2 because on a machine that does not meet it, the
    change needs data to be moved.

disruption_description:
  pl: |
    Zmiana wymaga planowanego wdrożenia, bo przenosi dane systemu na nowe
    miejsce i wymaga pracy przy zatrzymanym systemie. Program nie wykonuje jej
    sam; opis mówi, co trzeba zaplanować.

    Trzeba przewidzieć miejsce na dane użytkowników, przenieść je w trybie
    ratunkowym z zachowaniem właścicieli, uprawnień i etykiet SELinux, a przed
    tym zrobić ich pełną kopię. Użytkownicy nie mogą być zalogowani.
  en: |
    The change needs a planned rollout because it moves system data to a new
    place and needs work while the system is stopped. The program does not
    perform it; the description says what has to be planned.

    Space for user data has to be planned, the data moved in rescue mode keeping
    owners, permissions and SELinux labels, and a full copy taken first. Users
    cannot be signed in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - updates-and-servicing
  what_breaks:
    pl:
      - Przeniesienie /home na nowe miejsce wymaga przerwy w pracy wszystkich użytkowników stacji i kopii danych przed zmianą
      - Pominięcie etykiet SELinux przy kopiowaniu danych do nowego /home blokuje logowanie w środowisku graficznym do czasu ich odtworzenia
    en:
      - Moving /home to a new place needs a break in the work of all users of the workstation and a copy of the data before the change
      - Skipping SELinux labels when copying data to the new /home blocks signing in to the desktop until they are restored
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Dysk nie ma wolnego miejsca na osobny wolumin, a zmiana układu partycji nie była zaplanowana
    en:
      - The disk has no free space for a separate volume and no change to the partition layout has been planned
  reversibility: difficult

audit:
  shell: bash
  test_command: |
    t=/home
    if [ ! -r /proc/self/mountinfo ] || ! command -v findmnt >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if findmnt -kn --mountpoint "$t" >/dev/null 2>&1; then echo SEPARATE; else echo NOT_SEPARATE; fi
  expected: '^SEPARATE$'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/fstab.5.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.mount.html
  - https://www.freedesktop.org/software/systemd/man/latest/file-hierarchy.html

notes:
  pl: |
    Sprawdzenie uznaje punkt za spełniony, gdy /home jest osobnym punktem
    montowania, bez względu na to, czy jest to partycja, wolumin logiczny czy
    podwolumin btrfs.

    Punkt nie ma naprawy uruchamianej z programu. Wydzielenie katalogu wymaga
    przeniesienia jego zawartości na nowe miejsce, gdy nic z niej nie korzysta,
    czyli w trybie ratunkowym albo przy instalacji, i nie da się go bezpiecznie
    cofnąć jednym poleceniem.

    Na Fedorze z domyślnym btrfs najprostszą drogą jest osobny podwolumin
    zamontowany w /home wpisem w /etc/fstab. Daje on osobny punkt montowania
    i własne opcje, ale dzieli miejsce z resztą systemu, więc przed zapełnieniem
    dysku chroni dopiero przy włączonych limitach (quota) btrfs. Pełną ochronę
    daje osobna partycja lub wolumin logiczny.
  en: |
    The check considers the item met when /home is a separate mount point, whether
    it is a partition, a logical volume or a btrfs subvolume.

    The item has no remediation that the program runs. Separating the directory
    means moving its contents to the new place while nothing uses them, that is,
    in rescue mode or during installation, and it cannot be safely undone with
    one command.

    On Fedora with the default btrfs the simplest way is a separate subvolume
    mounted at /home by an entry in /etc/fstab. It gives a separate mount point and
    its own options, but shares space with the rest of the system, so it protects
    against a full disk only with btrfs quotas enabled. Full protection comes from
    a separate partition or logical volume.
