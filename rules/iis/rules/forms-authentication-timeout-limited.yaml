id: iis-forms-authentication-timeout-limited

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Przepustka logowania wygasa po krótkim czasie bezczynności
    en: The sign-in pass expires after a short idle period

platform:
  system: iis

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ciasteczko wystawione przy logowaniu ma swoją datę ważności i to ona
    rozstrzyga, jak długo po odejściu od komputera przepustka nadal działa.
    Domyślnie jest to pół godziny liczone od ostatniego żądania.

    Co to odbiera atakującemu: okno, w którym cudza przepustka jeszcze żyje.
    Ciasteczko da się przechwycić — z niezaszyfrowanego połączenia,
    z pozostawionej otwartej przeglądarki, z kopii zapasowej profilu, ze
    śladów w dzienniku serwera pośredniczącego. Wartość takiego łupu jest
    wprost proporcjonalna do tego, jak długo pozostaje ważny. Skrócenie czasu
    nie zapobiega kradzieży, ale sprawia, że skradzione ciasteczko trzeba
    wykorzystać od razu, a nie kiedyś.

    Krótszy czas działa też w sytuacji, o której łatwiej zapomnieć: komputer
    w otwartej przestrzeni, pozostawiony na chwilę bez blokady. Przepustka,
    która wygasa szybciej, ogranicza to, co da się zrobić z cudzej sesji przy
    nieobecności właściciela.
  en: |
    The cookie issued at sign-in has an expiry, and that is what decides how long
    after stepping away from the computer the pass still works. By default it is
    half an hour counted from the last request.

    What it takes away from an attacker - the window in which somebody else's
    pass is still alive. A cookie can be captured - from an unencrypted
    connection, from a browser left open, from a backup of a profile, from traces
    in an intermediary server's log. The worth of such loot is directly
    proportional to how long it stays valid. Shortening the time does not prevent
    the theft, but it means a stolen cookie has to be used at once rather than
    sometime.

    A shorter time also works in a situation that is easier to forget - a
    computer in an open space, left for a moment without being locked. A pass
    that expires sooner limits what can be done with somebody else's session
    while the owner is away.

disruption_description:
  pl: |
    To jest zmiana, którą użytkownicy zauważą na pewno, i dlatego wymaga
    świadomego wdrożenia mimo braku restartu czegokolwiek. Skrócenie czasu
    bezczynności znaczy, że osoba, która odeszła od biurka na kwadrans, wraca
    do ekranu logowania.

    Boli to najbardziej tam, gdzie praca polega na wypełnianiu długich
    formularzy. Wypełnianie nie generuje żądań do serwera, więc z punktu
    widzenia licznika jest bezczynnością — użytkownik pisze przez dwadzieścia
    minut, klika „zapisz" i trafia na logowanie, po czym w najgorszym wariancie
    traci to, co napisał. Jeśli w aplikacji są takie formularze, sprawdź, czy
    strona odświeża sesję w tle, zanim skrócisz czas.

    Druga rzecz to zadania długotrwałe uruchamiane z przeglądarki: raport
    liczony kilkanaście minut, import pliku, wydruk zbiorczy. Po ich
    zakończeniu przeglądarka wraca do aplikacji, która zdążyła już wygasnąć.

    Ustawienie działa na wszystkie aplikacje na serwerze naraz, bo zapisuje się
    w konfiguracji głównej środowiska. Jeśli na jednej maszynie stoi aplikacja
    dla pracowników i aplikacja dla klientów, dostaną ten sam czas — a rzadko
    powinny.
  en: |
    This is a change users will certainly notice, which is why it calls for a
    planned rollout despite nothing being restarted. Shortening the idle period
    means somebody who stepped away from the desk for a quarter of an hour comes
    back to the sign-in screen.

    It hurts most where the work consists of filling in long forms. Filling in
    generates no requests to the server, so from the counter's point of view it
    is idleness - a user types for twenty minutes, clicks save and lands on the
    sign-in page, at worst losing what they wrote. If the application has such
    forms, check whether the page refreshes the session in the background before
    shortening the time.

    The second thing is long-running jobs started from the browser - a report
    that takes a quarter of an hour, a file import, a batch print. Once they
    finish the browser returns to an application that has meanwhile expired.

    The setting applies to every application on the server at once, because it is
    written in the runtime's root configuration. Where one machine hosts an
    application for staff and an application for customers, they get the same
    time - and they rarely should.

implementation_consequences:
  impact_areas:
    - web-server-services
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Użytkownik wypełniający długi formularz trafia przy zapisie na ekran logowania, bo pisanie nie liczy się jako aktywność
      - Zadania długotrwałe uruchamiane z przeglądarki kończą się w sesji, która zdążyła wygasnąć
      - Osoby wracające do komputera po krótkiej przerwie logują się ponownie kilka razy dziennie
      - Wszystkie aplikacje na serwerze dostają ten sam czas, także te, dla których jest on stanowczo za krótki
      - Ciasteczka wystawione wcześniej przestają obowiązywać, więc zalogowani użytkownicy są wylogowywani w chwili zapisu
    en:
      - A user filling in a long form lands on the sign-in screen when saving, because typing does not count as activity
      - Long-running jobs started from the browser finish in a session that has meanwhile expired
      - People returning to the computer after a short break sign in again several times a day
      - Every application on the server gets the same time, including those for which it is firmly too short
      - Cookies issued earlier stop applying, so signed-in users are signed out at the moment of the write
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Aplikacje, w których praca polega na wypełnianiu długich formularzy bez kontaktu z serwerem
      - Serwery goszczące jednocześnie aplikacje o skrajnie różnych wymaganiach co do długości sesji
      - Aplikacje uruchamiające z przeglądarki zadania trwające dłużej niż ustawiony czas
    en:
      - Applications where the work consists of filling in long forms without contacting the server
      - Servers hosting applications with radically different session-length requirements side by side
      - Applications starting jobs from the browser that run longer than the time set
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
            -Filter 'system.web/authentication/forms' -Name 'timeout' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          else {
            # A time span comes back in one of three shapes depending on how it
            # was read - an object, text such as 00:30:00, or a count of ticks.
            # Casting straight to a number throws on the first of them, so all
            # three are brought to minutes here rather than assumed away.
            $span = $null
            if ($value -is [TimeSpan]) { $span = $value }
            elseif ($value -is [string]) {
              $parsed = [TimeSpan]::Zero
              if ([TimeSpan]::TryParse($value, [ref]$parsed)) { $span = $parsed }
            }
            if ($null -eq $span) {
              try { $span = [TimeSpan]::FromTicks([int64]$value) } catch { }
            }
            if ($null -eq $span) { 'CHECK_ERROR' }
            else { [string][int][Math]::Round($span.TotalMinutes) }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # The framework root configuration again, which the server's own backup
    # does not cover. Both variants of the file are copied, because a 32-bit
    # application pool reads a different one than a 64-bit pool does.
    $files = @()
    foreach ($base in @('Framework', 'Framework64')) {
      $source = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\web.config')
      if (Test-Path $source) {
        $copy = '{{backup_file}}' + '.' + $base + '.web.config'
        Copy-Item -Path $source -Destination $copy -Force
        $files += [pscustomobject]@{ source = $source; copy = $copy }
      }
    }
    if ($files.Count -eq 0) {
      throw 'The framework root configuration was not found, so nothing was secured and nothing may be changed.'
    }
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/authentication/forms' -Name 'timeout' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'framework-root'
      filter  = 'system.web/authentication/forms'
      name    = 'timeout'
      value   = [string]$value
      existed = ($null -ne $value)
      files   = $files
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and copied the framework root configuration"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Written as a time span rather than a bare number, which is what the
    # attribute holds. Fifteen minutes is our own threshold, not a value read
    # out of the benchmark.
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/authentication/forms' -Name 'timeout' `
      -Value ([TimeSpan]::FromMinutes(15))

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($f in $b.files) {
      if (-not (Test-Path $f.copy)) {
        throw 'A copy recorded in the backup file is missing, so nothing was restored.'
      }
    }
    foreach ($f in $b.files) {
      Copy-Item -Path $f.copy -Destination $f.source -Force
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.formsauthenticationconfiguration.timeout
  - https://learn.microsoft.com/dotnet/api/system.web.security.formsauthentication

notes:
  pl: |
    Piętnaście minut to nasz wybór, nie wartość przepisana z benchmarku.
    Sprawdzenie przechodzi przy każdej wartości nie większej, więc instalacja
    z czasem krótszym wychodzi spełniona i nie jest wydłużana.

    Licznik mierzy czas od ostatniego żądania do serwera, a nie od ostatniego
    dotknięcia klawiatury. To rozróżnienie decyduje o całej uciążliwości tej
    reguły: wypełnianie formularza bez zapisu jest z punktu widzenia serwera
    bezczynnością.

    Ustawienie dotyczy wyłącznie aplikacji logujących użytkownika własnym
    formularzem. Zapis w konfiguracji głównej środowiska uruchomieniowego
    ustawia wartość domyślną dla wszystkich aplikacji na serwerze — aplikacja
    z własnym wpisem nadpisuje ją u siebie, co przy skrajnie różnych
    wymaganiach jest właściwym miejscem na korektę.
  en: |
    Fifteen minutes is our choice, not a value transcribed from the benchmark.
    The check passes on any value no greater, so an installation with a shorter
    time comes out met and is not lengthened.

    The counter measures the time since the last request to the server, not since
    the keyboard was last touched. That distinction decides the whole disruption
    of this rule - filling in a form without saving is, from the server's point
    of view, idleness.

    The setting concerns only applications signing a user in with a form of their
    own. A write to the runtime's root configuration sets the default for every
    application on the server - an application with an entry of its own overrides
    it there, which is the right place for a correction where requirements differ
    sharply.
