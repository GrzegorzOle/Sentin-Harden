id: win11-bitlocker-removable-drives-write-protected

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na niezaszyfrowanych nośnikach wymiennych zabroniony
    en: Writing to unencrypted removable media forbidden
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Nośnik wymienny wychodzi poza budynek i gubi się — to jego główna
    właściwość z punktu widzenia bezpieczeństwa. Zgubiona pamięć przenośna
    z niezaszyfrowanymi plikami wydaje całą swoją zawartość każdemu, kto ją
    podniesie, bez żadnego warunku poza wpięciem do gniazda.

    Ten punkt nie wymaga szyfrowania nośników — wymaga, żeby na nośnik
    niezaszyfrowany nie dało się nic zapisać. Różnica jest istotna: odczyt
    pozostaje możliwy, więc pamięć przyniesiona przez kogoś z zewnątrz da się
    otworzyć. Blokowane jest wyłącznie wyniesienie danych z maszyny na nośnik,
    którego nikt potem nie obroni.

    Dla napastnika o fizycznym dostępie do stanowiska — a także dla pracownika
    wynoszącego dane świadomie — jest to zamknięcie najprostszej drogi na
    zewnątrz. Nie zastępuje ono kontroli nad samymi nośnikami, ale sprawia, że
    plik, który opuszcza maszynę, opuszcza ją zaszyfrowany.
  en: |
    Removable media leave the building and get lost - that is their main trait from
    a security standpoint. A lost portable drive with unencrypted files gives up its
    whole contents to whoever picks it up, on no condition beyond plugging it into a
    socket.

    This item does not require media to be encrypted - it requires that nothing can
    be written to unencrypted media. The difference matters: reading stays possible,
    so a drive brought in by somebody from outside can be opened. Only carrying data
    off the machine onto a medium nobody will later defend is blocked.

    For an attacker with physical access to the station - and for an employee
    carrying data out deliberately - this closes the simplest road out. It does not
    replace control over the media themselves, but it means a file leaving the
    machine leaves it encrypted.

disruption_description:
  pl: |
    Jest to zmiana, którą ludzie zauważą pierwszego dnia, i wymaga uprzedzenia
    oraz przygotowania.

    Każda dotychczasowa pamięć przenośna stanie się tylko do odczytu, dopóki nie
    zostanie zaszyfrowana. Dotyczy to również nośników używanych do rzeczy,
    o których nikt nie myśli jako o wynoszeniu danych: pamięci z materiałami na
    prezentację, nośnika przekazywanego drukarni, pamięci serwisowej
    z narzędziami.

    Zaszyfrowanie nośnika jest czynnością jednorazową, ale wymaga czasu
    i miejsca na klucz odzyskiwania. Przy pamięciach przekazywanych na zewnątrz
    pojawia się dodatkowy problem: nośnik zaszyfrowany otworzy się wyłącznie
    tam, gdzie ktoś zna hasło, więc przekazanie pliku klientowi albo drukarni
    trzeba załatwić inaczej.

    Objawem jest odmowa zapisu z komunikatem o ochronie przed zapisem, brana
    zwykle za uszkodzenie nośnika.

    Nie ma restartu maszyny. Zmiana obowiązuje po ponownym wpięciu nośnika albo
    po zalogowaniu.
  en: |
    This is a change people notice on the first day, and it calls for warning and
    preparation.

    Every portable drive used so far becomes read-only until it is encrypted. This
    covers media used for things nobody thinks of as carrying data out: a drive with
    material for a presentation, a medium handed to a print shop, a service drive
    with tools.

    Encrypting a medium is a one-off task, but it takes time and a place to keep the
    recovery key. With drives handed outside a further problem appears: an encrypted
    medium will open only where somebody knows the password, so passing a file to a
    client or a print shop has to be arranged another way.

    The symptom is a refused write with a message about write protection, usually
    taken for a damaged medium.

    There is no machine restart. The change takes effect the next time the medium is
    plugged in, or after signing in.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Zapis na dotychczasowych pamięciach przenośnych przestanie być możliwy do czasu ich zaszyfrowania
      - Przekazanie pliku na nośniku komuś spoza firmy wymaga innej drogi, bo nośnik zaszyfrowany otworzy się tylko ze znanym hasłem
      - Nośniki serwisowe z narzędziami przestaną przyjmować zapis, co utrudnia pracę zespołom wsparcia
    en:
      - Writing to portable drives used so far stops being possible until they are encrypted
      - Passing a file on a medium to somebody outside the company needs another route, as an encrypted medium opens only with a known password
      - Service media with tools stop taking writes, which hampers support teams
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Przekazywanie danych na nośnikach poza firmę jest częścią przyjętego sposobu pracy i nie przygotowano dla niego zamiennika
      - Nie ustalono, gdzie trafiają klucze odzyskiwania do szyfrowanych nośników
    en:
      - Passing data on media outside the company is part of the accepted way of working and no replacement has been prepared
      - It has not been settled where recovery keys for encrypted media are kept
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
      $name = 'RDVDenyWriteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    $name = 'RDVDenyWriteAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyWriteAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Wpis leży w gałęzi zasad szyfrowania wspólnej dla dysku systemowego, dysków
    stałych i nośników wymiennych. Polecenie wycofania zdejmuje pojedynczą
    wartość i usuwa gałąź wyłącznie wtedy, gdy przed zmianą jej nie było — inaczej
    zdjęłoby przy okazji ustawienia szyfrowania dysku systemowego.

    Punkt nie szyfruje niczego i nie należy go z tym mylić. Rozstrzyga wyłącznie
    o tym, czy na nośnik niezaszyfrowany wolno pisać. Szyfrowanie samych nośników
    jest czynnością wykonywaną przez użytkownika albo osobnym mechanizmem.

    Reguła sprawdza wpis, a nie stan podłączonych nośników. Wynik „spełniony"
    nie mówi, że na maszynie nie ma niezaszyfrowanej pamięci przenośnej — mówi,
    że nie da się na nią nic zapisać.
  en: |
    The entry sits in the encryption policy key shared by the system drive, fixed
    drives and removable media. The rollback command lifts a single value and
    removes the key only if it was not there before the change - otherwise it would
    take the system drive's encryption settings down with it.

    The item encrypts nothing and should not be confused with that. It settles only
    whether unencrypted media may be written to. Encrypting the media themselves is
    a task for the user or for a separate mechanism.

    The rule checks the entry, not the state of attached media. A result of "met"
    does not say there is no unencrypted portable drive on the machine - it says
    nothing can be written to it.
