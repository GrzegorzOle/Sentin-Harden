id: win2025-credentials-delegation-non-exportable

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Credentials Delegation
  title:
    pl: Delegowanie poświadczeń w postaci uniemożliwiającej ich wyniesienie
    en: Credentials delegated in a form that cannot be carried away
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że poświadczenia przekazywane przy łączeniu się do
    innej maszyny idą w postaci chronionej — takiej, której maszyna
    odbierająca nie może zachować ani użyć później na własną rękę.

    Jest to punkt o stronie nadawczej, i właśnie dlatego na serwerze
    bywa pomijany. Serwer myśli się jako maszynę, do której ktoś się
    łączy. Tymczasem serwer jest również stroną łączącą się dalej:
    z maszyny pośredniczącej, z maszyny zarządzającej, z konsoli, przy
    której administrator przeskakuje na kolejny host, żeby coś
    sprawdzić.

    Chodzi więc o to, co ten serwer zostawia u sąsiada. Bez ochrony
    poświadczenie oddane maszynie docelowej zostaje w jej pamięci
    i może zostać stamtąd użyte do połączenia gdzie indziej. Tak
    właśnie porusza się napastnik między maszynami: nie łamiąc haseł,
    tylko zbierając to, co ktoś przed chwilą u niego zostawił.

    Zostawiam kategorię średnią. Mechanizm ogranicza ruch boczny, ale
    działa tylko wtedy, gdy obie strony go rozumieją, więc nie zamyka
    drogi — zawęża ją.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    poświadczenia pozostawione przez ten serwer na każdej maszynie,
    z którą się łączył.
  en: |
    The item makes it so that the tokens of leave handed over at the binding to another machine go
    in a guarded shape - such a one as the taking machine can neither keep nor use later on its own
    account.

    It is an item about the giving side, and for that very reason it is at times passed over on a
    server. A server is thought of as a machine somebody binds to. Yet a server is also the side
    that binds on further - off a machine that goes between, off a machine of ruling, off the board
    whereat an administrator leaps to the next host to look at something.

    It is therefore about what that server leaves at its neighbour's. Without the guard a token of
    leave given to the machine meant stays in its memory and may be used thence to bind elsewhere.
    Just so an attacker moves between machines - not by breaking passwords but by gathering what
    somebody left at their place a moment since.

    I leave the category middling. The working narrows the moving sideways, but works only where
    both sides understand it, so it shuts no road - it narrows one.

    What an attacker gains while the item goes unmet - the tokens of leave that server left on every
    machine it bound to.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i uważam, że jest to ocena
    bezpieczna, a nie wygodna.

    Ustawienie nie zabrania łączenia się z niczym. Nie odrzuca żadnego
    połączenia i nie zmienia sposobu logowania. Mówi wyłącznie, w jakiej
    postaci przekazać poświadczenie, jeżeli obie strony umieją to zrobić
    inaczej niż dotąd.

    Gdy strona odbierająca tego nie obsługuje, połączenie dochodzi do
    skutku po staremu. Nie ma odmowy, nie ma komunikatu i nie ma nic do
    naprawiania — po prostu na tym konkretnym połączeniu ochrona nie
    zadziała. Dlatego na serwerze pracującym ze starszymi maszynami to
    ustawienie można włączyć bez badania, z czym ten serwer rozmawia.

    Jedyną rzeczą, jakiej się po tej zmianie nie zobaczy, jest
    potwierdzenie, że coś zadziałało. Ochrona działająca po cichu i brak
    ochrony wyglądają z zewnątrz identycznie, i warto o tym pamiętać,
    zanim ktoś uzna zielony wiersz za dowód.

    Zmiana cofa się natychmiast i nie wymaga restartu. Sesje już otwarte
    nie są zrywane — warunek sprawdza się przy kolejnym połączeniu.
  en: |
    I leave the class "no disruption" and hold it a reckoning that is safe and not merely handy.

    The setting forbids the binding to nothing. It casts off no binding and alters not the way of
    signing in. It says only in what shape to hand over the token of leave, where both sides can do
    it otherwise than hitherto.

    Where the taking side handles that not, the binding comes about in the old way. There is no
    refusal, no word given and nothing to mend - only on that one binding the guard will not work.
    Therefore on a server working with older machines this setting may be switched on without a
    looking into what that server speaks with.

    The one thing that will not be seen after this change is a witness that something worked. A
    guard working in silence and a want of guard look from without the same, and it is worth bearing
    in mind before somebody takes a green line for a proof.

    The change is undone at once and takes no restart. Sittings already open are not broken off -
    the bond is looked to at the next binding.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Gdy strona odbierająca tego nie obsługuje, połączenie dochodzi do skutku po staremu
      - Nie ma odmowy ani komunikatu, tylko na tym połączeniu ochrona nie zadziała
      - Ochrona działająca po cichu i brak ochrony wyglądają z zewnątrz identycznie
      - Ustawienie nie zabrania łączenia się z niczym i nie zmienia sposobu logowania
      - Sesje już otwarte nie są zrywane, warunek sprawdza się przy kolejnym połączeniu
    en:
      - Where the taking side handles it not, the binding comes about in the old way
      - There is no refusal nor word given, only on that binding the guard will not work
      - A guard working in silence and a want of guard look from without the same
      - The setting forbids the binding to nothing and alters not the way of signing in
      - Sittings already open are not broken off, the bond is looked to at the next binding
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
      $name = 'AllowProtectedCreds'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    $name = 'AllowProtectedCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowProtectedCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/remote-credential-guard

