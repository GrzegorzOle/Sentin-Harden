id: win2016-autorun-commands-not-executed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Polecenia z pliku startowego nośnika nigdy nie wykonywane
    en: Commands from a medium's startup file never carried out
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że polecenie zapisane w pliku startowym nośnika
    nigdy nie zostaje wykonane.

    Plik taki leży w katalogu głównym nośnika i jest zwykłym plikiem
    tekstowym. Mówi systemowi, co uruchomić, jaką ikonę pokazać i jak
    nazwać nośnik. System, dopóki ten punkt nie zadziała, to polecenie
    honoruje.

    Różnica wobec reguły poprzedniej jest tu istotna i warto ją postawić
    wprost, bo obie bywają mylone. Tamta wyłącza okno propozycji, czyli to,
    co widać. Ta wyłącza wykonanie polecenia, czyli to, czego nie widać.
    Nośnik z plikiem startowym potrafi uruchomić program również wtedy, gdy
    okno propozycji jest wyłączone — wystarczy, że ktoś otworzy nośnik
    w oknie folderów albo kliknie jego literę.

    Dlatego kategoria jest tu wyższa niż przy regule poprzedniej. Tamta
    zdejmuje wygodę, ta zdejmuje wykonanie kodu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    własnego programu w chwili, gdy ktokolwiek otworzy podłączony nośnik,
    bez żadnego pytania i bez żadnego śladu decyzji.
  en: |
    The setting has it that a command written in a medium's startup file is never
    carried out.

    Such a file lies in the medium's root directory and is a plain text file. It
    tells the system what to start, what icon to show and what to call the medium.
    The system, until this item takes effect, honours that command.

    The difference from the previous rule matters here and is worth putting
    outright, both being at times confused. That one switches off the proposal
    window, which is to say what is seen. This one switches off the carrying out of
    the command, which is to say what is not seen. A medium with a startup file can
    start a program even where the proposal window is off - it is enough for
    somebody to open the medium in a folder window or click its letter.

    That is why the category is higher here than at the previous rule. That one
    takes away a convenience; this one takes away the running of code.

    What an attacker gains while the item goes unmet: the running of their own
    program the moment anybody opens an attached medium, with no question asked and
    no trace of a decision.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", z jednym zastrzeżeniem wartym wymienienia.

    Skutkiem jest to, że nośnik przestaje sam uruchamiać cokolwiek. Nie
    zmienia się nic poza tym: nośnik się podłącza, otwiera, daje czytać
    i zapisywać.

    Zastrzeżenie dotyczy nośników przygotowanych jako narzędzie. Zdarzają
    się nośniki serwisowe i instalacyjne, które zakładają, że po podłączeniu
    same coś uruchomią — narzędzie diagnostyczne, instalator sterownika
    macierzy, program odtwarzający kopię. Po wdrożeniu punktu trzeba je
    uruchomić z katalogu ręcznie. Jest to zmiana nawyku, nie utrata funkcji,
    i dlatego klasa pozostaje najniższa.

    Rzecz druga, mniej znana: ustawienie to zmienia również sposób, w jaki
    system traktuje pliki startowe na udziałach sieciowych. Jeżeli w tej
    organizacji udział instalacyjny opiera się na takim pliku, jego
    uruchamianie przestanie działać samo.

    Czego to nie psuje: dostępu do nośników, odczytu i zapisu, liter
    napędów, montowania obrazów, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", with one reservation worth naming.

    The consequence is that a medium stops starting anything by itself. Nothing else
    changes: the medium attaches, opens, and can be read and written.

    The reservation concerns media prepared as a tool. There are service and
    installation media that assume they will start something themselves once plugged
    in - a diagnostic tool, an installer for an array driver, a program restoring a
    backup. Once the item is rolled out these have to be started from the directory
    by hand. That is a change of habit rather than a loss of function, and so the
    class stays the lowest.

    The second thing, less known: this setting also changes how the system treats
    startup files on network shares. If an installation share in this organisation
    rests on such a file, its starting will stop happening by itself.

    What this does not break: access to media, reading and writing, drive letters,
    the mounting of images, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - removable-media
    - scripting-and-automation
  what_breaks:
    pl:
      - Nośniki serwisowe i instalacyjne zakładające samoczynne uruchomienie narzędzia wymagają odtąd uruchomienia go z katalogu ręcznie
      - Udział instalacyjny oparty na pliku startowym przestaje uruchamiać się sam po otwarciu
      - Nośnik nadal się podłącza, otwiera oraz daje czytać i zapisywać
      - Litery napędów, montowanie obrazów, usługi i logowanie pozostają bez zmian
    en:
      - Service and installation media assuming a tool starts itself now call for it to be started from the directory by hand
      - An installation share resting on a startup file stops starting itself on being opened
      - The medium still attaches, opens, and can be read and written
      - Drive letters, the mounting of images, services and signing in stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedura serwisowa tej maszyny opiera się na nośniku uruchamiającym narzędzie samoczynnie i nie opisano wariantu ręcznego
    en:
      - This machine's service procedure rests on a medium starting a tool by itself and no variant by hand has been described
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'NoAutorun'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoAutorun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutorun' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/shell/autoplay

notes:
  pl: |
    Punkt jest w tej trójce jedynym, który zdejmuje wykonanie kodu, a nie
    wygodę — i dlatego stoi w macierzy wyżej niż pozostałe dwa. Warto
    pokazywać wszystkie trzy razem, bo osobno każdy wygląda na niepełny.

    Rzecz do powiedzenia wprost w interfejsie: wdrożenie samej reguły
    o autoodtwarzaniu, bez tej, daje raport, w którym droga przez nośnik
    wygląda na zamkniętą, a nie jest. Jest to dokładnie ten rodzaj
    pozornej zgodności, który aplikacja ma wychwytywać.

    Nazwa mechanizmu bywa myląca, bo w języku codziennym oba punkty nazywa
    się tak samo. Tytuły obu reguł celowo opisują skutek, a nie nazwę
    ustawienia, żeby różnica była widoczna bez zaglądania w rejestr.
  en: |
    The item is the only one of the three taking away the running of code rather
    than a convenience - and so it stands higher in the matrix than the other two.
    All three are worth showing together, since apart each looks incomplete.

    A thing to say outright in the interface: rolling out the rule about automatic
    playing alone, without this one, gives a report in which the road through a
    medium looks shut and is not. That is exactly the kind of compliance in
    appearance the application is to catch.

    The mechanism's name is at times misleading, everyday speech calling both items
    the same thing. Both rules' titles describe the consequence rather than the
    setting's name on purpose, so that the difference shows without a look into the
    registry.
