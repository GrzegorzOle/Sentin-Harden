id: win2025-print-queue-specific-files-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Pliki właściwe dla kolejki wydruku ograniczone do katalogu sterowników
    en: Queue-specific files restricted to the driver folder
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Sterownik drukarki może przynieść ze sobą pliki pomocnicze
    przypisane do konkretnej kolejki — profile kolorów, pliki ustawień,
    biblioteki dodatkowe. Ustawienie każe systemowi przyjmować je
    wyłącznie do katalogu sterowników wydruku.

    Bez tego ograniczenia miejsce zapisu wskazuje strona przysyłająca
    sterownik. Plik trafia tam, gdzie każe serwer wydruku, a zapisu
    dokonuje bufor wydruku, czyli proces o uprawnieniach systemu.

    Jest to zapis dowolnego pliku w dowolnym miejscu, wykonany
    uprawnieniami, których osoba po drugiej stronie nie ma. Wystarczy
    umieścić bibliotekę tam, skąd jakaś usługa ładuje swoje biblioteki,
    i poczekać — albo nadpisać plik, który system wykonuje sam.

    Ograniczenie do katalogu sterowników nie czyni tego katalogu
    bezpiecznym. Odbiera natomiast możliwość wyboru miejsca, a wraz z nią
    całą wartość tej drogi: plik w katalogu sterowników nie jest przez
    nikogo ładowany przypadkiem.

    Na serwerze punkt waży więcej niż na stanowisku roboczym z dwóch
    powodów. Serwer bywa podłączony do kolejek wydruku, których nie
    kontroluje — na przykład do serwera wydruku w innej lokalizacji.
    I serwer ma znacznie więcej miejsc, w których podrzucona biblioteka
    zostanie wcześniej czy później załadowana przez usługę pracującą
    stale.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapis
    własnego pliku w dowolnym miejscu na dysku serwera, wykonany
    uprawnieniami systemu.
  en: |
    A printer driver may bring with it helper files belonging to a particular queue - colour
    profiles, files of settings, further libraries. The setting bids the system take them into the
    folder of print drivers alone.

    Without that bound the place of writing is named by the side sending the driver. The file goes
    where the print server bids, and the writing is done by the print spooler, that is by a
    process with the system's rights.

    It is the writing of any file in any place, done with rights the person on the other side does
    not hold. It is enough to lay a library where some service loads its libraries from and wait -
    or to overwrite a file the system runs itself.

    The bounding to the folder of drivers does not make that folder safe. It takes away, though,
    the choosing of the place, and with it the whole worth of that road: a file in the folder of
    drivers is loaded by nobody by chance.

    On a server the item weighs more than at a working station for two reasons. A server is at
    times connected to print queues it does not govern - to a print server in another place, for
    instance. And a server has far more places in which a library slipped in will sooner or later
    be loaded by a service working at all times.

    What an attacker gains while the item goes unmet: the writing of a file of their own in any
    place on the server's disk, done with the system's rights.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedna rzecz: czy na tym serwerze pracuje
    rozwiązanie wydruku, które z plików pomocniczych poza katalogiem
    sterowników korzysta.

    Podniosłem klasę względem paczki stanowiska roboczego, bo
    prawdopodobieństwo takiego rozwiązania jest na serwerze nieporównanie
    wyższe. Chodzi o systemy wydruku podążającego za użytkownikiem,
    o rozliczanie kosztów wydruku, o oprogramowanie drukarek
    wielofunkcyjnych i o rozwiązania wydruku produkcyjnego. Wszystkie
    one dokładają do kolejki własne pliki i część z nich robi to poza
    katalogiem sterowników.

    Objawem po zmianie nie jest komunikat o błędzie. Objawem jest wydruk,
    który wychodzi inaczej niż powinien: bez znaku wodnego, bez
    przypisania do konta rozliczeniowego, z niewłaściwym profilem koloru
    albo z pominięciem opcji wykończenia. Rzecz wygląda na usterkę
    drukarki, nie na skutek zmiany w systemie — i to jest tutaj
    najtrudniejsze.

    Tam, gdzie takiego rozwiązania nie ma, zmiana jest niewidoczna.
    Zwykłe drukowanie ze sterownika producenta nie korzysta z tej
    możliwości i nie odczuje niczego.

    Rozpoznanie idzie po liście oprogramowania zainstalowanego na tym
    serwerze i po tym, skąd pochodzą kolejki wydruku. Serwer podłączony
    do zewnętrznego serwera wydruku wymaga uzgodnienia z jego właścicielem.

    Zmiana wymaga ponownego uruchomienia bufora wydruku, czyli przerwania
    zadań w toku.
  en: |
    One thing needs checking: whether a printing solution using helper files outside the folder of
    drivers works on this server.

    I raised the class against the working station's pack, the likelihood of such a solution being
    on a server beyond comparison higher. It is about systems of printing that follows the user,
    about the reckoning of printing costs, about the software of multi-purpose printers and about
    solutions of production printing. All of these add files of their own to a queue and some of
    them do it outside the folder of drivers.

    The symptom after the change is not a message of a fault. The symptom is a printout coming out
    otherwise than it should: without a watermark, without a marking to a billing account, with a
    wrong colour profile or with an option of finishing passed over. The matter looks like a fault
    of the printer and not like an effect of a change in the system - and that is here the
    hardest part.

    Where there is no such solution the change is unseen. Ordinary printing from a maker's driver
    does not use that means and will feel nothing.

    The reconnaissance goes by the list of software installed on this server and by where the
    print queues come from. A server connected to an outside print server takes an agreement with
    its owner.

    The change takes a fresh start of the print spooler, that is the breaking of jobs under way.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Rozwiązanie wydruku podążającego za użytkownikiem albo rozliczania kosztów może stracić swoje pliki pomocnicze
      - Objawem jest wydruk wychodzący inaczej niż powinien, a nie komunikat o błędzie
      - Rzecz wygląda na usterkę drukarki, więc bywa wiązana ze sprzętem, a nie ze zmianą w systemie
      - Zwykłe drukowanie ze sterownika producenta nie odczuje niczego
      - Ponowne uruchomienie bufora przerywa zadania w toku
    en:
      - A solution of printing that follows the user or of the reckoning of costs may lose its helper files
      - The symptom is a printout coming out otherwise than it should and not a message of a fault
      - The matter looks like a fault of the printer and so is at times tied to the hardware and not to the change
      - Ordinary printing from a maker's driver will feel nothing
      - A fresh start of the spooler breaks jobs under way
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze działa rozwiązanie wydruku produkcyjnego z własnym mechanizmem plików pomocniczych
      - Serwer korzysta z kolejek wydruku należących do innego zespołu i zmiany nie uzgodniono z jego właścicielem
    en:
      - A solution of production printing with its own mechanism of helper files works on the server
      - The server uses print queues belonging to another team and the change was not agreed with its owner
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'CopyFilesPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'CopyFilesPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'CopyFilesPolicy' -Value 1 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/print-spooler-service-security-hardening

notes:
  pl: |
    Bez tego ograniczenia miejsce zapisu pliku pomocniczego wskazuje
    strona przysyłająca sterownik, a zapisu dokonuje bufor wydruku,
    czyli proces o uprawnieniach systemu.

    Ograniczenie do katalogu sterowników nie czyni tego katalogu
    bezpiecznym. Odbiera możliwość wyboru miejsca, a w tym leżała cała
    wartość tej drogi.

    Klasę podniosłem względem paczki stanowiska roboczego, bo na
    serwerze prawdopodobieństwo rozwiązania korzystającego z plików
    pomocniczych jest nieporównanie wyższe, a objawem jest wydruk
    wychodzący inaczej, nie komunikat o błędzie.
  en: |
    Without this bound the place of writing of a helper file is named by the side sending the
    driver, and the writing is done by the print spooler, that is by a process with the system's
    rights.

    The bounding to the folder of drivers does not make that folder safe. It takes away the
    choosing of the place, and therein lay the whole worth of that road.

    I raised the class against the working station's pack, the likelihood of a solution using
    helper files being on a server beyond comparison higher, and the symptom being a printout
    coming out otherwise and not a message of a fault.
