id: win2025-defender-scan-email

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan
  title:
    pl: Skanowanie zawartości skrzynek pocztowych
    en: Mailbox contents scanned
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt każe zaglądać do plików skrzynek pocztowych leżących na dysku
    tej maszyny i oglądać wiadomości oraz załączniki w środku, zamiast
    widzieć jeden wielki plik.

    Powtarzam tu sprostowanie, które postawiłem przy regule blokującej
    uruchamianie plików wykonywalnych z poczty, bo przy tym punkcie myli
    się jeszcze łatwiej. Chodzi o pliki skrzynek stojące na tej maszynie
    — takie, jakie zakłada klient poczty. Nie chodzi o pocztę, którą
    serwer pocztowy przyjmuje, przechowuje i wydaje. Tamtej ten punkt
    nie dotyczy i nie należy go w raporcie pokazywać jako ochrony
    skrzynek użytkowników.

    Obniżam kategorię do niskiej, bo plik skrzynki na serwerze jest
    rzadkością. Tam, gdzie się zdarza, zwykle jest pozostałością:
    archiwum przeniesione przy migracji, skrzynka konta serwisowego,
    eksport zrobiony na potrzeby zgłoszenia i nigdy nieusunięty. Rzeczy
    te leżą latami i nikt do nich nie zagląda — co jest jednocześnie
    powodem, dla którego punkt ma tu jakąkolwiek wartość.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: stary
    plik skrzynki na serwerze pozostaje dla skanowania jednym plikiem,
    a nie zbiorem załączników.
  en: |
    The item bids the looking into the files of boxes of post lying on that machine's disk, and the
    looking at the messages and attachments within, rather than the seeing of one great file.

    I set right here again what I set right at the rule blocking the running of files to be carried
    out from post, at this item being mistaken the lighter still. What is meant are the files of
    boxes standing on this machine - such as a client of post lays down. What is not meant is the
    post a server of post takes in, holds and gives out. That one this item bears not upon, and it
    ought not be shown in a report as a guarding of the users' boxes.

    I lower the category to low, a file of a box on a server being a rarity. Where it does happen it
    is mostly a leaving - a store borne over at a moving, the box of an account for service, a
    sending out made for the needs of a report and never taken away. Such things lie for years and
    nobody looks into them - which is at the same time the ground for which the item has here any
    worth at all.

    What an attacker gains while the item goes unmet - an old file of a box on the server stays to
    the searching one file and no gathering of attachments.

disruption_description:
  pl: |
    Na maszynie bez plików skrzynek zmiana nie robi nic. Zostaje mimo to
    poza trybem zbiorczym, bo istnieje rola serwera, na której jest
    wprost przeciwskazana, i lepiej ją tu wymienić, niż liczyć, że
    nikt nie kliknie.

    Rolą tą jest serwer pocztowy. Składnica, w której trzyma on
    wiadomości, wygląda z zewnątrz jak zbiór plików pocztowych i bywa
    przez mechanizm potraktowana jak one. Producenci serwerów pocztowych
    wprost wskazują te katalogi jako wymagające wyłączenia ze skanowania,
    bo zaglądanie do nich powoduje blokady plików i uszkodzenia
    składnicy. Jest to jeden z niewielu punktów w całej paczce, przy
    którym włączenie zabezpieczenia potrafi zaszkodzić bardziej niż jego
    brak.

    Drugim przypadkiem, tym razem łagodnym, jest serwer trzymający stare
    archiwa pocztowe przeniesione przy migracji. Skanowanie pełne będzie
    musiało przejść przez ich zawartość, a bywają to pliki wielkości
    dziesiątków gigabajtów. Skutkiem jest dłuższe skanowanie, nie awaria.

    Sprawdzenie jest więc krótkie: ustal, czy maszyna jest serwerem
    pocztowym albo czy leżą na niej duże archiwa pocztowe. Jeżeli nie,
    zmiana jest pusta i nieszkodliwa.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    On a machine with no files of boxes the change does nothing. It stays outside the bulk mode for
    all that, there being a role of a server whereon it is outright against the case, and it is
    better to name it here than to reckon that nobody will click.

    That role is the server of post. The storehouse wherein it keeps its messages looks from without
    like a gathering of files of post and is at times taken by the working for such. The makers of
    servers of post point outright at those folders as taking a leaving-out from the searching, the
    looking into them bringing on lockings of files and harm to the storehouse. It is one of the few
    items in the whole pack whereat the switching on of a guard can harm more than its want.

    The second case, this one mild, is a server holding old stores of post borne over at a moving.
    The full searching will have to go through what is in them, and those are at times files of tens
    of gigabytes. The outcome is a longer searching and no fault.

    The checking is therefore short - settle whether the machine is a server of post or whether
    great stores of post lie upon it. If not, the change is empty and harmless.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - file-sharing
  what_breaks:
    pl:
      - Na serwerze pocztowym zaglądanie do składnicy wiadomości powoduje blokady plików i uszkodzenia
      - Producenci serwerów pocztowych wprost wskazują te katalogi jako wymagające wyłączenia ze skanowania
      - Stare archiwa pocztowe wielkości dziesiątków gigabajtów wydłużają skanowanie pełne
      - Punkt nie dotyczy poczty, którą serwer pocztowy przyjmuje i wydaje, tylko plików skrzynek na dysku
      - Na maszynie bez plików skrzynek zmiana nie robi zupełnie nic
    en:
      - On a server of post the looking into the storehouse of messages brings on lockings of files and harm
      - The makers of servers of post point outright at those folders as taking a leaving-out from the searching
      - Old stores of post of tens of gigabytes lengthen the full searching
      - The item bears not on the post a server of post takes in and gives out, only on files of boxes on the disk
      - On a machine with no files of boxes the change does nothing at all
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem pocztowym i nie ustalono wyłączeń dla składnicy wiadomości
      - Na serwerze leżą duże archiwa pocztowe, a skanowanie pełne nie ma zapasu czasu w oknie
    en:
      - The machine is a server of post and no leavings-out were settled for the storehouse of messages
      - Great stores of post lie on the server and the full searching has no spare of time in its window
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableEmailScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableEmailScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a machine running a mail server the store folders must carry an
    # exclusion first: reading them locks files and damages the store.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEmailScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

