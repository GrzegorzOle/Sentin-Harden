id: win11-driver-additional-software-report-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Zgłaszanie prośby sterownika o dodatkowe oprogramowanie wyłączone
    en: Reporting a driver's request for additional software switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Część sterowników przy instalacji zgłasza, że do pełnej obsługi urządzenia
    potrzebne jest jeszcze osobne oprogramowanie: panel sterowania producenta,
    narzędzie kalibracyjne, sterownik pomocniczy. System wysyła wtedy
    producentowi zgłoszenie opisujące urządzenie i to, czego zabrakło.

    Jest to strumień bliźniaczy wobec zgłoszenia o braku sterownika, ale niesie
    inną informację. Tamten mówi, jaki sprzęt jest na stanowisku. Ten mówi,
    jakie oprogramowanie towarzyszące jest albo powinno być na nim
    zainstalowane — czyli opisuje nie tylko wyposażenie, ale też sposób jego
    użycia.

    Różnica jest niewielka i żaden z tych dwóch punktów sam z siebie nie
    zmienia obrazu bezpieczeństwa. Liczą się razem i razem z kilkunastoma
    innymi ustawieniami zawężającymi to, co maszyna opowiada o sobie na
    zewnątrz bez pytania.

    Punkt zatrzymuje wysyłkę. Instalacja sterownika przebiega tak samo, a to,
    czy oprogramowanie towarzyszące zostanie doinstalowane, zależy dalej od
    decyzji podjętych na miejscu.
  en: |
    Some drivers report at installation that separate software is still needed for
    the device to be fully handled: the maker's control panel, a calibration tool, a
    helper driver. The system then sends the maker a report describing the device and
    what was lacking.

    It is a stream twinned with the report about a missing driver, but it carries
    different information. That one says what hardware is at a station. This one says
    what accompanying software is, or ought to be, installed on it - describing not
    just the equipment but the way it is used.

    The difference is small and neither of the two items changes the security picture
    on its own. They count together, and together with a dozen other settings that
    narrow what the machine tells about itself outwards without being asked.

    The item stops the sending. The driver's installation goes exactly as before, and
    whether the accompanying software gets installed still depends on decisions taken
    on the spot.

disruption_description:
  pl: |
    Nic nie przestaje działać. Sterowniki instalują się tak samo, urządzenia
    działają tak samo; znika wyłącznie zgłoszenie wysyłane w tle.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego, nie ma programu ani urządzenia, które zachowa się po
    wdrożeniu inaczej.

    Punkt nie blokuje pobierania oprogramowania towarzyszącego i nie zmienia
    tego, czy system je zaproponuje. Dotyczy wyłącznie wysyłki opisującej, że
    sterownik o nie poprosił — a to są dwie różne rzeczy, łatwe do pomylenia
    przy czytaniu nazwy ustawienia.

    Nie ma restartu.
  en: |
    Nothing stops working. Drivers install as before, devices work as before; only
    the report sent in the background disappears.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no program or device behaving differently after the
    rollout.

    The item does not block the downloading of accompanying software and does not
    change whether the system will offer it. It concerns only the sending that
    describes a driver having asked for it - two different things, easy to confuse
    when reading the setting's name.

    There is no restart.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Nic nie przestaje działać; instalacja sterownika i urządzenia przebiega bez zmian
      - Producent przestaje dostawać z tej maszyny informację o brakującym oprogramowaniu towarzyszącym
    en:
      - Nothing stops working; the driver's and the device's installation goes on unchanged
      - The maker stops receiving word from this machine about missing accompanying software
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Trwa uzgadnianie z producentem obsługi sprzętu wymagającego oprogramowania towarzyszącego
    en:
      - Support for hardware needing accompanying software is being agreed with the maker
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
      $name = 'DisableSendRequestAdditionalSoftwareToWER'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    $name = 'DisableSendRequestAdditionalSoftwareToWER'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSendRequestAdditionalSoftwareToWER' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-overview

notes:
  pl: |
    Reguła jest drugą z pary i celowo powtarza kształt pierwszej. Wartości są
    różne, ale mechanizm, gałąź i skutki są te same, więc rozjeżdżanie się
    opisów byłoby mylące przy czytaniu ich obok siebie w raporcie.

    Nazwa wpisu jest długa i łatwo pomylić ją z sąsiednią, różniącą się
    środkowym członem. Rozstrzyga pełna nazwa — przy pomyłce reguła czyta
    wartość drugiego punktu i zgłasza jego stan zamiast własnego.

    Gałąź jest wspólna z pozostałymi ustawieniami instalacji urządzeń, więc
    wycofanie obejmuje wyłącznie tę jedną wartość.
  en: |
    The rule is the second of the pair and deliberately repeats the shape of the
    first. The values differ, but the mechanism, the key and the effects are the
    same, so letting the descriptions drift apart would mislead when they are read
    side by side in a report.

    The entry's name is long and easy to mistake for its neighbour, which differs in
    the middle part. The full name is what settles it - with a slip the rule reads
    the other item's value and reports its state instead of its own.

    The key is shared with the remaining device installation settings, so the
    rollback covers this one value only.
