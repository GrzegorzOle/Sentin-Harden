id: fedora44-audit-conf-owner

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 6.3.4.6
  section: Logging and Auditing > System Accounting (auditd) > Configure auditd File Access
  title:
    pl: Właścicielem plików konfiguracji audytu jest root
    en: Ensure audit configuration files owner is configured
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Właściciel pliku konfiguracji audytu może go zmienić, na przykład usunąć
    reguły obserwujące jego działania albo wyłączyć zapis dziennika. Takie
    pliki powinny należeć wyłącznie do roota.

    Punkt wymaga, żeby właścicielem plików konfiguracji audytu był root.
  en: |
    The owner of an audit configuration file can change it, for example
    remove the rules that watch its actions or turn off logging. Such files
    should belong to root only.

    The item requires the audit configuration files to be owned by root.

disruption_description:
  pl: |
    Nikt tego nie zauważy: konfigurację audytu czytają auditd, augenrules
    i auditctl uruchamiane jako root.
  en: |
    Nobody will notice: the audit configuration is read by auditd,
    augenrules and auditctl running as root.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    plist() {
      [ -d /etc/audit ] || { echo audit-not-installed; return 1; }
      { [ -r /etc/audit ] && [ -x /etc/audit ]; } || { echo needs-root; return 1; }
      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) | sort
    }
    pok() { [ "$2" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    plist() {
      [ -d /etc/audit ] || { echo audit-not-installed; return 1; }
      { [ -r /etc/audit ] && [ -x /etc/audit ]; } || { echo needs-root; return 1; }
      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) | sort
    }
    pok() { [ "$2" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      {
        echo format=perms-1
        printf '%s\n' "$l" | while IFS= read -r f; do
          [ -n "$f" ] && [ -e "$f" ] || continue
          printf '%s %s\n' "$(stat -c '%a %u %g' -- "$f")" "$f"
        done
      } > "$b.tmp"
      mv "$b.tmp" "$b"
      echo "Saved the owner and mode of $(( $(wc -l < "$b") - 1 )) paths"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    plist() {
      [ -d /etc/audit ] || { echo audit-not-installed; return 1; }
      { [ -r /etc/audit ] && [ -x /etc/audit ]; } || { echo needs-root; return 1; }
      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) | sort
    }
    pok() { [ "$2" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      n=0
      while IFS= read -r f; do
        [ -n "$f" ] && [ -e "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f")"
        ! pok "$m" "$o" "$g" || continue
        [ "$o" = root ] || chown root -- "$f"
        chmod "$(printf '0%04o' $(( 0$m )))" -- "$f"
        n=$((n + 1))
      done <<< "$l"
      echo "Corrected $n paths"
      r=$(evaluate)
      case "$r" in OK:*) ;; *) echo "Paths still not as required ($r)" >&2; exit 1 ;; esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      if tail -n +2 "$b" | grep -qvE '^[0-7]+ [0-9]+ [0-9]+ /'; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      n=0
      while read -r m u g f; do
        [ -e "$f" ] || { echo "Skipped $f: it no longer exists"; continue; }
        read -r cm cu cg <<< "$(stat -c '%a %u %g' -- "$f")"
        k=0
        [ "$cu" = "$u" ] || { chown "$u" -- "$f"; k=1; }
        [ "$k" = 1 ] || continue
        chmod "$(printf '0%04o' $(( 0$cm )))" -- "$f"
        echo "Restored $f"; n=$((n + 1))
      done < <(tail -n +2 "$b")
      [ "$n" -gt 0 ] || echo "Nothing to restore"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/auditd.conf.5.html
  - https://man7.org/linux/man-pages/man8/auditd.8.html
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/auditing-the-system_security-hardening

notes:
  pl: |
    Punkt obejmuje pliki *.conf i *.rules w /etc/audit i jego podkatalogach
    (rules.d, plugins.d). Inne pliki oraz dowiązania symboliczne test pomija.
    Naprawa zmienia tylko właściciela na root; tryb i grupa pozostają bez
    zmian.
    Wycofanie przywraca tylko to, czym reguła zarządza (tryb, właściciela
    albo grupę), i tylko dla ścieżek, które nadal istnieją, więc reguły
    trybu, właściciela i grupy tych samych plików można wycofywać osobno.
    Katalog /etc/audit i auditd.conf są dostępne tylko dla roota, więc bez
    tych uprawnień wynik to NOT_OK:needs-root.
  en: |
    The item covers the *.conf and *.rules files in /etc/audit and its
    subdirectories (rules.d, plugins.d). The test skips other files and
    symbolic links.
    The remediation only changes the owner to root; the mode and group stay
    unchanged.
    Rollback restores only what the rule manages (mode, owner or group),
    and only for the paths that still exist, so the mode, owner and group
    rules for the same files can be rolled back separately. The /etc/audit
    directory and auditd.conf are only accessible to root, so without these
    privileges the result is NOT_OK:needs-root.
