id: win2016-icmp-redirect-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Przyjmowanie przekierowań sterujących wyłączone
    en: Acceptance of control redirects disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe maszynie nie zmieniać własnych tras na podstawie
    komunikatów sterujących przychodzących z sieci.

    Komunikat taki mówi: „do tego adresu idź inną drogą". Pomyślano go jako
    uprzejmość routera, który widzi, że maszyna wysyła ruch okrężnie i chce
    jej podpowiedzieć krótszą trasę. Maszyna, która go przyjmuje, dopisuje
    sobie trasę do tablicy i zaczyna kierować ruch tam, gdzie wskazano.

    Słabością jest to, że komunikatu nikt nie uwierzytelnia. Pochodzi
    z adresu, który da się podać dowolnie, i nie niesie żadnego dowodu, że
    nadawca jest routerem. Kto potrafi taki komunikat wysłać, przestawia
    trasę maszyny — a przestawiona trasa znaczy, że ruch do wskazanego
    adresu zaczyna iść przez urządzenie napastnika.

    Skutkiem jest wejście w środek rozmowy bez dotykania czegokolwiek na
    maszynie. Napastnik nie loguje się, nie uruchamia niczego i nie zostawia
    śladu w systemie — przestawia tylko drogę, a resztę robi ruch, który
    i tak by nastąpił.

    Zmiana ma jeszcze jedną zaletę, widoczną dopiero w dzienniku: trasy
    maszyny przestają zmieniać się same, więc tablica tras staje się
    przewidywalna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przestawienia trasy maszyny nieuwierzytelnionym komunikatem i skierowania
    jej ruchu przez własne urządzenie.
  en: |
    The setting has the machine not change its own routes on the strength of control
    messages arriving from the network.

    Such a message says: "to this address go by another road". It was thought up as
    a courtesy from a router seeing that a machine sends traffic the long way round
    and wishing to point out a shorter route. A machine accepting it writes the
    route into its table and begins directing traffic where it was told.

    The weakness is that nobody authenticates the message. It comes from an address
    that can be given at will, and carries no proof that the sender is a router.
    Whoever can send such a message resets the machine's route - and a reset route
    means the traffic to the named address begins going through the attacker's
    device.

    The upshot is a stepping into the middle of a conversation without touching
    anything on the machine. The attacker does not sign in, starts nothing, and
    leaves no trace in the system - they reset the road alone, and the rest is done
    by traffic that would have happened anyway.

    The change has one more merit, visible only in the log: the machine's routes
    stop changing by themselves, so the route table becomes foreseeable.

    What an attacker gains while the item goes unmet: the means of resetting the
    machine's route with an unauthenticated message and directing its traffic
    through a device of their own.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na maszynie serwerowej zmiana jest
    w ogromnej większości przypadków bez skutku.

    Powód jest prosty: serwer ma zwykle jedną bramę i jedną drogę na
    zewnątrz, więc nie ma czego optymalizować. Komunikaty te pojawiają się
    w sieciach, gdzie w jednym segmencie stoi więcej niż jeden router,
    a maszyny domyślnie kierują ruch do niewłaściwego z nich.

    Właśnie taką sieć trzeba sprawdzić przed zmianą. Jeżeli układ jest
    nietypowy i któreś połączenia działają dziś dzięki przekierowaniu, po
    zmianie zaczną chodzić drogą okrężną — wolniej, ale nadal. Rzadziej
    zdarza się, że przestają działać zupełnie; dzieje się tak tam, gdzie
    droga domyślna nie prowadzi do celu w ogóle.

    Objaw jest więc zwykle wydajnościowy, a nie funkcjonalny, i to jest
    tutaj rzecz najważniejsza do wiedzenia. Zgłoszenie brzmi „wolniej działa
    połączenie z tamtą siecią", a nie „nie działa" — i dlatego bywa wiązane
    z czym innym.

    Zamiast polegać na przekierowaniach, właściwym rozwiązaniem jest wpisanie
    trasy na stałe. Jest to zmiana po stronie sieci, nie maszyny, i warto ją
    przygotować wcześniej.

    Czego to nie psuje: normalnej łączności, tras wpisanych na stałe,
    trasowania wyznaczanego przez routery, usług, połączeń przychodzących.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though on a server machine the change is in the
    vast majority of cases of no effect.

    The reason is plain: a server as a rule has one gateway and one road out, so
    there is nothing to optimise. These messages appear in networks where more than
    one router stands in a single segment and machines direct traffic by default to
    the wrong one.

    It is just such a network that has to be checked before the change. If the
    arrangement is unusual and some connections work today thanks to a redirect,
    after the change they will begin going the long way round - more slowly, but
    still going. More rarely they stop working altogether; that happens where the
    default road does not lead to the target at all.

    The symptom is therefore as a rule one of performance rather than of function,
    and that is the chief thing to know here. The ticket reads "the connection to
    that network is slower", not "it does not work" - and is for that reason at
    times tied to something else.

    Instead of relying on redirects, the right answer is to write the route in
    permanently. That is a change on the network's side rather than the machine's,
    and is worth preparing beforehand.

    What this does not break: ordinary connectivity, routes written in permanently,
    routing marked out by routers, services, or incoming connections.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Połączenia działające dziś dzięki przekierowaniu zaczynają chodzić drogą okrężną, więc zgłoszenie brzmi wolniej, a nie nie działa
      - W sieci, gdzie w jednym segmencie stoi więcej niż jeden router, ruch przestaje sam trafiać do właściwego z nich
      - Tam gdzie droga domyślna nie prowadzi do celu w ogóle, połączenie przestaje działać i wymaga trasy wpisanej na stałe
      - Normalna łączność, trasy wpisane na stałe i trasowanie wyznaczane przez routery pozostają bez zmian
    en:
      - Connections working today thanks to a redirect begin going the long way round, so the ticket reads slower rather than broken
      - In a network where more than one router stands in a single segment, traffic stops finding the right one by itself
      - Where the default road does not lead to the target at all, the connection stops working and calls for a route written in permanently
      - Ordinary connectivity, routes written in permanently and routing marked out by routers stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W segmencie sieci stoi więcej niż jeden router, a maszyna dociera do części sieci dzięki przekierowaniom i nie wpisano tras na stałe
      - Nie sprawdzono tablicy tras maszyny pod kątem wpisów powstałych z przekierowań
    en:
      - More than one router stands in the network segment and the machine reaches part of the network thanks to redirects, with no routes written in permanently
      - The machine's route table has not been checked for entries arising from redirects
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'EnableICMPRedirect'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'EnableICMPRedirect'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableICMPRedirect' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Reguła jest przykładem punktu, w którym objaw wdrożeniowy jest cichy
    i mylący. Nic nie przestaje działać, ale coś zaczyna działać wolniej —
    a to jest ten rodzaj zmiany, którego nikt nie wiąże z ustawieniem
    zabezpieczeń. Uwagę o tym warto pokazać przy punkcie, bo oszczędza
    szukania przyczyny w niewłaściwym miejscu.

    Punkt stoi blisko reguły o samoczynnym wyszukiwaniu bramy i obie warto
    rozpatrywać razem. Ta zamyka zmianę trasy do konkretnego adresu; tamta
    zmianę bramy domyślnej. Mechanizm nadużycia jest w obu ten sam:
    nieuwierzytelniony komunikat z sieci przestawia to, czym maszyna kieruje
    się przy wyborze drogi.

    Zalecenie zastępcze — trasa wpisana na stałe — leży poza zakresem
    aplikacji, bo dotyczy sieci, a nie maszyny. Warto je jednak wymienić
    w opisie, żeby odpuszczenie punktu nie było jedynym wyjściem, jakie
    czytelnik zobaczy.
  en: |
    The rule is an example of an item whose rollout symptom is quiet and misleading.
    Nothing stops working, but something begins working more slowly - and that is
    the kind of change nobody ties to a security setting. A remark about it is worth
    showing at the item, since it saves looking for the cause in the wrong place.

    The item stands close to the rule on automatic searching for a gateway, and both
    are worth weighing together. This one shuts the changing of a route to a
    particular address; that one the changing of the default gateway. The mechanism
    of abuse is the same in both: an unauthenticated message from the network resets
    what the machine goes by in choosing a road.

    The substitute recommendation - a route written in permanently - lies outside
    the application's scope, since it concerns the network rather than the machine.
    It is worth naming in the description all the same, so that letting the item go
    is not the only way out the reader sees.
