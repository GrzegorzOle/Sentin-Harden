# Controlled vocabularies.
#
# Rules use ONLY the identifiers listed here. Free text in these fields means
# the interface cannot filter or sort by them, and reports stop being
# comparable across systems.
#
# Every value carries a bilingual label and description. The interface renders
# the label for the active language - it must never display the raw identifier,
# and it must never hardcode a translation of its own.

risk_category:
  meaning:
    pl: Ile daje wdrożenie punktu, czyli co zyskuje atakujący, gdy pozostaje niespełniony. Ocena własna, niezależna od poziomu L1/L2.
    en: How much implementing the item buys - what the attacker gains while it stays unmet. Own assessment, independent of the L1/L2 level.
  values:
    - id: critical
      label: { pl: Krytyczne, en: Critical }
      description:
        pl: Otwarta droga do przejęcia systemu lub poświadczeń, nadużywana w praktyce.
        en: Open path to system or credential takeover, abused in practice.
    - id: high
      label: { pl: Wysokie, en: High }
      description:
        pl: Istotne utrudnienie eskalacji uprawnień, ruchu bocznego lub utrzymania dostępu.
        en: Materially hinders privilege escalation, lateral movement or persistence.
    - id: medium
      label: { pl: Średnie, en: Medium }
      description:
        pl: Utwardzenie zawężające pole manewru albo zwiększające wykrywalność.
        en: Hardening that narrows the attacker's options or improves detection.
    - id: low
      label: { pl: Niskie, en: Low }
      description:
        pl: Porządek i spójność konfiguracji.
        en: Tidiness and configuration consistency.

disruption:
  meaning:
    pl: Rozstrzyga, czy zmianę wolno zastosować zbiorczo, bez decyzji o każdym punkcie osobno.
    en: Decides whether the change may be applied in bulk, without a per-item decision.
  values:
    - id: none
      label: { pl: Bez uciążliwości, en: No disruption }
      description:
        pl: Nikt tego nie zauważy. Jedyna klasa dopuszczona do trybu zbiorczego.
        en: Nobody will notice. The only class allowed in bulk mode.
    - id: needs-review
      label: { pl: Wymaga sprawdzenia, en: Needs review }
      description:
        pl: Uderza w dające się wskazać scenariusze. Zwykle przechodzi, ale trzeba spojrzeć.
        en: Hits identifiable scenarios. Usually fine, but worth checking first.
    - id: needs-planned-rollout
      label: { pl: Wymaga świadomego wdrożenia, en: Needs planned rollout }
      description:
        pl: Zmienia sposób pracy, wymaga okna serwisowego albo uprzedzenia użytkowników.
        en: Changes how people work, needs a maintenance window or user notice.

assessment_state:
  meaning:
    pl: Pusta lista skutków nie może udawać bezpieczeństwa. To są trzy różne stany.
    en: An empty impact list must never pose as safety. These are three distinct states.
  values:
    - id: assessed-no-impact
      label: { pl: Ocenione — brak wpływu, en: Assessed - no impact }
      description:
        pl: Sprawdzono i nie znaleziono skutków eksploatacyjnych.
        en: Checked, and no operational consequences were found.
    - id: assessed-impact-described
      label: { pl: Ocenione — wpływ opisany, en: Assessed - impact described }
      description:
        pl: Skutki zidentyfikowane i opisane konkretnie.
        en: Consequences identified and described concretely.
    - id: not-assessed
      label: { pl: Nieocenione, en: Not assessed }
      description:
        pl: Wpływu jeszcze nie badano. Reguła nie trafia do trybu zbiorczego.
        en: Impact not studied yet. The rule does not enter bulk mode.

interruption:
  meaning:
    pl: Czy wdrożenie wymaga przerwy w pracy.
    en: Whether applying the change requires an interruption.
  values:
    - id: none
      label: { pl: Bez przerwy, en: No interruption }
    - id: logoff
      label: { pl: Wymaga wylogowania, en: Requires sign-out }
    - id: service-restart
      label: { pl: Restart usługi, en: Service restart }
    - id: system-restart
      label: { pl: Restart systemu, en: System restart }

reversibility:
  meaning:
    pl: Jak łatwo cofnąć zmianę.
    en: How easily the change can be undone.
  values:
    - id: immediate
      label: { pl: Natychmiastowa, en: Immediate }
    - id: after-restart
      label: { pl: Po restarcie, en: After restart }
    - id: difficult
      label: { pl: Trudna, en: Difficult }

privileges:
  meaning:
    pl: Poziom uprawnień wymagany do wykonania polecenia.
    en: Privilege level required to run the command.
  values:
    - id: user
      label: { pl: Użytkownik, en: User }
    - id: administrator
      label: { pl: Administrator, en: Administrator }
    - id: root
      label: { pl: Root, en: Root }

shell:
  meaning:
    pl: Powłoka, w której wykonywane są polecenia reguły.
    en: Shell used to run the rule commands.
  values:
    - id: powershell
      label: { pl: PowerShell, en: PowerShell }
    - id: bash
      label: { pl: Bash, en: Bash }

comparison:
  meaning:
    pl: Sposób porównania wyniku testu z wartością oczekiwaną.
    en: How the test result is compared against the expected value.
  values:
    - id: equals
      label: { pl: Równe, en: Equals }
    - id: regex
      label: { pl: Wyrażenie regularne, en: Regular expression }
    - id: not-less-than
      label: { pl: Nie mniejsze niż, en: Not less than }
    - id: not-greater-than
      label: { pl: Nie większe niż, en: Not greater than }
    - id: contains
      label: { pl: Zawiera, en: Contains }

audit_result:
  meaning:
    pl: Wynik pojedynczego sprawdzenia. Niemożność sprawdzenia to ERROR albo NOT_APPLICABLE, nigdy FAIL.
    en: Result of a single check. Inability to check is ERROR or NOT_APPLICABLE, never FAIL.
  values:
    - id: PASS
      label: { pl: Spełnione, en: Pass }
    - id: FAIL
      label: { pl: Niespełnione, en: Fail }
    - id: ERROR
      label: { pl: Błąd sprawdzenia, en: Check error }
    - id: NOT_APPLICABLE
      label: { pl: Nie dotyczy, en: Not applicable }

item_status:
  meaning:
    pl: Status punktu w raporcie. Trzeci stan odróżnia świadomą decyzję od zaniedbania.
    en: Item status in the report. The third state separates a deliberate decision from neglect.
  values:
    - id: compliant
      label: { pl: Spełnione, en: Compliant }
    - id: non-compliant
      label: { pl: Niespełnione, en: Non-compliant }
    - id: risk-accepted
      label: { pl: Ryzyko zaakceptowane, en: Risk accepted }
