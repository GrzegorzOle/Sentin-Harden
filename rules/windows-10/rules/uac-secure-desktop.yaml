id: win10-uac-secure-desktop

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Monit o podniesienie uprawnień na bezpiecznym pulpicie
    en: The elevation prompt on the secure desktop
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza dwie rzeczy naraz: żeby podniesienie uprawnień
    w ogóle wymagało potwierdzenia, i żeby pytanie o to potwierdzenie
    pojawiało się na bezpiecznym pulpicie.

    Bezpieczny pulpit to osobna powierzchnia, na której nie działają
    programy użytkownika. Nie da się na niej narysować okna, przechwycić
    naciśnięć klawiszy ani kliknąć za człowieka. Monit wyświetlony tam jest
    jedynym monitem, o którym wiadomo, że pochodzi od systemu.

    Gdy monit pojawia się na pulpicie zwykłym, traci tę własność. Program
    działający na koncie użytkownika może wtedy narysować okno wyglądające
    jak monit i odebrać to, co człowiek w nie wpisze. Może też poczekać na
    monit prawdziwy i potwierdzić go za człowieka.

    Druga część reguły dotyczy wartości mówiącej, co ma się stać przy
    podniesieniu na koncie administratora. Wartość zerowa znaczy, że
    podniesienie następuje bez pytania — wtedy bezpieczny pulpit nie ma
    czego chronić, bo nie ma monitu. Dlatego audyt sprawdza obie wartości
    razem i uznaje punkt za spełniony tylko wtedy, gdy monit istnieje
    i pojawia się we właściwym miejscu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podrobienia monitu albo potwierdzenia go za człowieka programem
    działającym na jego koncie.
  en: |
    The setting forces two things at once: that elevation should call for a confirmation at all, and that the
    question asking for it should appear on the secure desktop.

    The secure desktop is a separate surface on which a user's programs do not run. No window can be drawn on
    it, no keystrokes caught, no clicking done for a person. A prompt shown there is the only prompt known to
    come from the system.

    Where the prompt appears on the ordinary desktop, it loses that property. A program running on the user's
    account may then draw a window looking like the prompt and take what the person types into it. It may also
    wait for the true prompt and confirm it for them.

    The rule's second part touches the value saying what is to happen at an elevation on an administrator's
    account. A value of nought means the elevation follows without a question - and then the secure desktop has
    nothing to guard, there being no prompt. That is why the audit checks both values together and holds the
    item met only where a prompt exists and appears in the right place.

    What an attacker gains while the item goes unmet: the chance to forge the prompt, or to confirm it for the
    person by a program running on their account.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czym ktoś patrzy
    na ekran tej maszyny.

    Bezpieczny pulpit jest powierzchnią osobną i część oprogramowania do
    pracy zdalnej go nie przekazuje. Operator widzi wtedy ekran zamarły,
    a monit czeka niewidoczny po drugiej stronie. Pulpit zdalny systemu
    radzi sobie z tym poprawnie; narzędzia obce bywają różne i trzeba to
    sprawdzić na tym, którego się używa.

    Drugi przypadek to narzędzia do zarządzania, które klikają za człowieka
    albo czytają zawartość ekranu. Te przestaną działać na monitach i jest
    to skutek zamierzony, bo dokładnie tę czynność reguła blokuje.

    Trzeci, najmniej groźny: na maszynach wolnych przełączenie na bezpieczny
    pulpit widać jako przyciemnienie i chwilę zwłoki. Bywa to mylone
    z zawieszeniem.

    Zmiana wchodzi bez restartu i cofa się natychmiast.

    Czego to nie psuje: logowania, pracy aplikacji, sieci, drukowania,
    udziałów plikowych ani samego podniesienia uprawnień, które dalej jest
    możliwe.
  en: |
    The class is "needs review", and the review touches what somebody looks at this machine's screen with.

    The secure desktop is a separate surface and part of the software for remote work does not pass it on. The
    operator then sees a frozen screen while the prompt waits unseen on the other side. The system's own remote
    desktop handles this rightly; outside tools differ and it has to be checked on the one in use.

    The second case is management tools that click for a person or read the screen's contents. Those will cease
    working at the prompts, and that is a meant consequence, the rule blocking exactly that act.

    The third and least grave: on slow machines the switch to the secure desktop shows as a dimming and a
    moment's delay. That gets mistaken at times for a hang.

    The change takes hold without a restart and undoes itself at once.

    What this does not break: logging on, the work of applications, the network, printing, file shares, or
    elevation itself, which stays possible.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Oprogramowanie do pracy zdalnej, które nie przekazuje bezpiecznego pulpitu, pokazuje operatorowi ekran zamarły
      - Narzędzia klikające za człowieka albo czytające zawartość ekranu przestają działać na monitach o podniesienie
      - Na maszynach wolnych przełączenie na bezpieczny pulpit widać jako przyciemnienie i chwilę zwłoki
      - Podniesienie uprawnień na koncie administratora zaczyna wymagać potwierdzenia, o ile wcześniej następowało bez pytania
      - Logowanie, praca aplikacji, sieć, drukowanie i udziały plikowe pozostają bez zmian
    en:
      - Software for remote work that does not pass the secure desktop on shows the operator a frozen screen
      - Tools clicking for a person or reading the screens contents cease working at the elevation prompts
      - On slow machines the switch to the secure desktop shows as a dimming and a moments delay
      - Elevation on an administrators account begins calling for a confirmation, so far as it followed without a question before
      - Logging on, the work of applications, the network, printing and file shares stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana wyłącznie narzędziem zdalnym, które nie przekazuje bezpiecznego pulpitu
      - Wdrożenia na tej maszynie prowadzi narzędzie klikające za człowieka i nie ma dla niego zamiennika
    en:
      - The machine is handled solely by a remote tool that does not pass the secure desktop on
      - Rollouts on this machine are led by a tool that clicks for a person and there is no substitute for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $secure = $item.PromptOnSecureDesktop
      $behaviour = $item.ConsentPromptBehaviorAdmin
      if ($null -eq $secure -or $null -eq $behaviour) { 'MISSING' }
      elseif ([int]$secure -eq 1 -and [int]$behaviour -ne 0) { 'PROMPT_ON_SECURE_DESKTOP' }
      else { 'SECURE=' + $secure + ' BEHAVIOUR=' + $behaviour }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'PROMPT_ON_SECURE_DESKTOP'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      secure            = $item.PromptOnSecureDesktop
      secure_existed    = ($null -ne $item.PromptOnSecureDesktop)
      behaviour         = $item.ConsentPromptBehaviorAdmin
      behaviour_existed = ($null -ne $item.ConsentPromptBehaviorAdmin)
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two values, because one without the other settles nothing - the prompt has
    # to appear and has to appear on the secure desktop. Where the screen is
    # handled by software that does not show that desktop, check first how an
    # operator will get an elevation through.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PromptOnSecureDesktop' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'ConsentPromptBehaviorAdmin' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.secure_existed) {
      Set-ItemProperty -Path $b.path -Name 'PromptOnSecureDesktop' -Value $b.secure -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'PromptOnSecureDesktop' -ErrorAction SilentlyContinue
    }
    if ($b.behaviour_existed) {
      Set-ItemProperty -Path $b.path -Name 'ConsentPromptBehaviorAdmin' -Value $b.behaviour -Type DWord
    } else {
      # Only the values are removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name 'ConsentPromptBehaviorAdmin' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/user-account-control/settings-and-configuration

notes:
  pl: |
    Reguła jest jedyną w tym bloku czytającą dwie wartości naraz i warto,
    żeby aplikacja to pokazała. Sam bezpieczny pulpit przy podniesieniu bez
    pytania nie chroni niczego, więc rozdzielenie tych wartości na dwa punkty
    dałoby raport, w którym jedna połowa świeci na zielono bez żadnego
    skutku.

    Wynik pośredni jest tu czytelny z samego odczytu. Wartość zwracana przy
    niezgodności podaje obie liczby, więc widać od razu, czy zabrakło
    bezpiecznego pulpitu, czy samego monitu.

    Odnotowuję, że reguła nie rozstrzyga między potwierdzeniem kliknięciem
    a potwierdzeniem hasłem. Obie postacie przechodzą, bo obie zachowują
    bezpieczny pulpit. Wybór między nimi jest osobną decyzją i nie należy
    go wiązać z tym punktem.
  en: |
    The rule is the only one in this block reading two values at once, and it is well that the application show
    that. The secure desktop alone, at an elevation without a question, guards nothing, so splitting those
    values into two items would give a report in which one half shines green to no effect.

    The middle result is here legible from the reading itself. The value returned at a mismatch gives both
    numbers, so it is seen at once whether the secure desktop was wanting or the prompt itself.

    Worth noting that the rule does not settle between a confirmation by click and a confirmation by password.
    Both forms pass, both keeping the secure desktop. The choice between them is a separate decision and ought
    not be tied to this item.
