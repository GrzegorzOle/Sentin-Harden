id: fedora-44
nazwa: Fedora 44
rodzina: linux
powloka: bash
profil: workstation

benchmark:
  nazwa: CIS Fedora Linux Benchmark
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    . /etc/os-release
    printf '%s|%s\n' "$ID" "$VERSION_ID"
  dopasowanie: '^fedora\|44$'

uwagi: |
  Najdalej odbiegający od pozostałych celów linuksowych:
    - kontrola dostępu to SELinux, nie AppArmor,
    - menedżer pakietów to dnf, nie apt,
    - zapora to firewalld,
    - krótki cykl życia wydania (około 13 miesięcy wsparcia).

  Krótki cykl ma praktyczną konsekwencję dla paczki: wersja benchmarku
  dezaktualizuje się tu szybciej niż przy systemach LTS, więc przegląd reguł
  i zapisanych wyjątków wypada częściej.
