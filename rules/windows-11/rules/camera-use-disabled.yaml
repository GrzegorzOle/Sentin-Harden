id: win11-camera-use-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Camera
  title:
    pl: Korzystanie z kamery zablokowane
    en: Use of the camera blocked
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Kamera jest urządzeniem, które widzi pomieszczenie i wszystko, co w nim
    leży — łącznie z zapisanym hasłem, dokumentem na biurku i tym, kto akurat
    wchodzi. Program, który uzyskał do niej dostęp, ma ten obraz do dyspozycji
    bez żadnego dalszego warunku.

    Wyłączenie kamery na poziomie systemu odbiera tę możliwość wszystkim
    programom naraz, niezależnie od tego, co który z nich ma zapisane
    w uprawnieniach. Jest to zabezpieczenie na poziomie urządzenia, a nie zgody —
    napastnik, który przejął program mający wcześniej dostęp, również go traci.

    Punkt należy do profilu wyższego i nie bez powodu: odcina funkcję, która
    w części środowisk jest podstawowym narzędziem pracy. Sens ma tam, gdzie
    stanowiska stoją w pomieszczeniach, których nie powinno być widać —
    serwerownia, pomieszczenie z dokumentami, stanowisko w strefie o ograniczonym
    dostępie.
  en: |
    A camera is a device that sees the room and everything in it - including a
    written-down password, a document on the desk, and whoever happens to walk in. A
    program that has gained access to it has that image at its disposal with no
    further condition.

    Switching the camera off at the system level takes that ability from every
    program at once, whatever any of them has written in its permissions. It is a
    safeguard at the device level rather than at the consent level - an attacker who
    has taken over a program that had access before loses it too.

    The item belongs to the higher profile, and not without reason: it cuts off a
    function that in some environments is a basic working tool. It makes sense where
    stations stand in rooms that should not be seen - a server room, a room with
    documents, a station in a restricted area.

disruption_description:
  pl: |
    Jest to zmiana, która na zwykłym stanowisku biurowym zatrzymuje pracę, i tak
    ją klasyfikuję. Wymaga rozstrzygnięcia przed wdrożeniem, a nie po pierwszym
    zgłoszeniu.

    Przestaną działać wszystkie spotkania z obrazem — narzędzia konferencyjne
    pokażą uczestnika bez kamery i nie zaproponują żadnego obejścia. Przestanie
    działać logowanie twarzą, bo opiera się na tym samym urządzeniu. Przestanie
    działać skanowanie kodów, fotografowanie dokumentów i wszystko, co korzysta
    z obrazu na żywo.

    Objaw jest ostry i jednoznaczny: kamera nie pojawia się na liście urządzeń
    w programie, jakby jej w komputerze nie było. Użytkownik nie dostaje
    komunikatu tłumaczącego powód i zgłasza awarię sprzętu.

    Wdrożenie ma sens wyłącznie na stanowiskach wybranych świadomie, ze względu
    na miejsce, w którym stoją. Zastosowanie go do wszystkich stanowisk jest
    błędem, a nie utwardzeniem.

    Nie ma restartu maszyny. Zmiana obowiązuje po ponownym uruchomieniu programu
    korzystającego z kamery.
  en: |
    This is a change that halts work at an ordinary office station, and I classify
    it as such. It calls for settling before the rollout, not after the first
    report.

    Every meeting with a picture stops working - conferencing tools will show the
    participant without a camera and offer no way around it. Face sign-in stops
    working, because it rests on the same device. Scanning codes, photographing
    documents and everything using a live picture stops working.

    The symptom is sharp and unambiguous: the camera does not appear on the device
    list in a program, as though the computer had none. The user gets no message
    explaining why and reports a hardware fault.

    Applying it makes sense only at stations chosen deliberately, for the sake of
    where they stand. Applying it to every station is a mistake rather than a
    hardening.

    There is no machine restart. The change takes effect the next time a program
    using the camera starts.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Spotkania z obrazem przestaną działać i kamera zniknie z listy urządzeń w programach konferencyjnych
      - Logowanie twarzą przestanie być dostępne, bo opiera się na tym samym urządzeniu
      - Skanowanie kodów i fotografowanie dokumentów z poziomu komputera przestanie być możliwe
    en:
      - Meetings with a picture stop working and the camera disappears from the device list in conferencing programs
      - Face sign-in stops being available, because it rests on the same device
      - Scanning codes and photographing documents from the computer stops being possible
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko służy do spotkań z obrazem albo do pracy zdalnej wymagającej kamery
      - Na stanowisku wdrożono logowanie twarzą jako sposób wejścia do systemu
    en:
      - The station is used for meetings with a picture or for remote work needing a camera
      - Face sign-in has been rolled out at the station as the way into the system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
      $name = 'AllowCamera'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    $name = 'AllowCamera'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCamera' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-camera

notes:
  pl: |
    Punkt obejmuje kamerę jako urządzenie systemowe. Kamera podpięta przez
    narzędzie wirtualizujące obraz — używane przez część programów
    konferencyjnych — bywa widziana inaczej i wdrożenie punktu nie zawsze ją
    obejmuje. Reguła tego nie sprawdza i nie należy jej czytać jako
    potwierdzenia, że żaden obraz nie opuszcza maszyny.

    Punkt jest wart rozważenia razem z regułą wymagającą wzmocnionej ochrony
    przed podszyciem przy rozpoznawaniu twarzy — wdrożone razem na tej samej
    maszynie znoszą się w praktyce, bo pierwsze odcina urządzenie, którego
    dotyczy drugie. Nie jest to sprzeczność w benchmarku, tylko skutek
    zestawienia dwóch profili twardości.
  en: |
    The item covers the camera as a system device. A camera hooked up through a tool
    that virtualises the picture - used by some conferencing programs - is sometimes
    seen differently, and applying the item does not always cover it. The rule does
    not check this and should not be read as confirming that no picture leaves the
    machine.

    The item is worth weighing together with the rule requiring strengthened
    protection against spoofing in face recognition - applied together on the same
    machine they cancel out in practice, because the first cuts off the device the
    second concerns. That is not a contradiction in the benchmark but a consequence
    of putting two hardness profiles side by side.
