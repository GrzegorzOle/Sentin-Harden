id: fedora44-bluetooth-not-in-use

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 3.1.3
  section: Network > Configure Network Devices
  title:
    pl: Usługa Bluetooth nie jest używana
    en: Ensure bluetooth services are not in use
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa bluetooth uruchamia demona BlueZ, który obsługuje adapter
    Bluetooth: parowanie, połączenia z klawiaturami, myszami, słuchawkami
    i telefonami oraz przesyłanie plików. Dopóki działa, komputer przyjmuje
    pakiety radiowe od każdego urządzenia w zasięgu, a w stosie Bluetooth
    znajdowano błędy pozwalające przejąć system bez parowania.

    Punkt wymaga, żeby pakiet bluez nie był zainstalowany albo żeby usługa
    bluetooth nie była włączona ani uruchomiona. Na Fedorze Workstation
    usługa jest domyślnie włączona.
  en: |
    The bluetooth service starts the BlueZ daemon, which handles the
    Bluetooth adapter: pairing, connections to keyboards, mice, headsets and
    phones, and file transfer. While it runs, the computer accepts radio
    packets from every device in range, and bugs that allowed taking over
    the system without pairing have been found in the Bluetooth stack.

    The item requires that the bluez package is not installed or that the
    bluetooth service is neither enabled nor running. On Fedora Workstation
    the service is enabled by default.

disruption_description:
  pl: |
    Połączone urządzenia Bluetooth rozłączają się od razu, a w ustawieniach
    GNOME Bluetooth przestaje być dostępny. Użytkownicy laptopów
    z bezprzewodową klawiaturą, myszą albo słuchawkami zauważą to
    natychmiast.
  en: |
    Connected Bluetooth devices disconnect at once, and Bluetooth is no
    longer available in the GNOME settings. Laptop users with a wireless
    keyboard, mouse or headset will notice at once.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Klawiatury, myszy, słuchawki i głośniki Bluetooth rozłączają się i nie można ich ponownie połączyć
      - Przesyłanie plików przez Bluetooth i udostępnianie internetu z telefonu przez Bluetooth nie działa
      - Panel Bluetooth w ustawieniach GNOME nie pokazuje adaptera
    en:
      - Bluetooth keyboards, mice, headsets and speakers disconnect and cannot be connected again
      - File transfer over Bluetooth and internet sharing from a phone over Bluetooth do not work
      - The Bluetooth panel in the GNOME settings does not show the adapter
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Jedyna klawiatura albo mysz komputera łączy się przez Bluetooth; przed naprawą trzeba podłączyć urządzenie przewodowe
    en:
      - The only keyboard or mouse of the computer connects over Bluetooth; a wired device has to be connected before the remediation
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || ! command -v rpm >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then
      echo CHECK_ERROR; exit 0
    fi
    state() {
      bad=""
      for u in bluetooth.service; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        a=$(systemctl is-active "$u" 2>/dev/null) || true
        case "$e" in
          enabled|enabled-runtime|linked|linked-runtime) ;;
          *) case "$a" in active|activating|reloading) ;; *) continue ;; esac ;;
        esac
        bad="$bad,$u=${e:-none}/${a:-unknown}"
      done
      inst=""
      for p in bluez; do if rpm -q --quiet "$p"; then inst="$inst,$p"; fi; done
      if [ -n "$bad" ]; then echo "IN_USE:${bad#,}"
      elif [ -z "$inst" ]; then echo NOT_INSTALLED
      else echo "NOT_IN_USE:${inst#,}"; fi
    }
    state
  expected: '^(NOT_INSTALLED$|NOT_IN_USE:)'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=units-1
        for u in bluetooth.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          echo "$u ${e:--} ${a:--}"
        done
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /run/systemd/system ] || { echo "systemd is not running" >&2; exit 1; }
      state() {
        bad=""
        for u in bluetooth.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          case "$e" in
            enabled|enabled-runtime|linked|linked-runtime) ;;
            *) case "$a" in active|activating|reloading) ;; *) continue ;; esac ;;
          esac
          bad="$bad,$u=${e:-none}/${a:-unknown}"
        done
        inst=""
        for p in bluez; do if rpm -q --quiet "$p"; then inst="$inst,$p"; fi; done
        if [ -n "$bad" ]; then echo "IN_USE:${bad#,}"
        elif [ -z "$inst" ]; then echo NOT_INSTALLED
        else echo "NOT_IN_USE:${inst#,}"; fi
      }
      m=""
      for u in bluetooth.service; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        case "$e" in ""|not-found) continue ;; esac
        l=/etc/systemd/system/$u
        if { [ -e "$l" ] || [ -L "$l" ]; } && [ "$(readlink "$l")" != /dev/null ]; then
          echo "$l is a unit file or link of its own, not masking $u" >&2; exit 1
        fi
        m="$m $u"
      done
      if [ -z "$m" ]; then echo "None of the units is installed, nothing to change"; exit 0; fi
      systemctl mask --now $m
      s=$(state)
      case "$s" in IN_USE:*) echo "The units are still in use ($s)" >&2; exit 1 ;; esac
      echo "Stopped and masked:$m ($s)"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=units-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      lines=$(tail -n +2 "$b")
      [ -n "$lines" ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      while read -r u e a x; do
        case " bluetooth.service " in *" $u "*) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        case "$e$a" in *[!a-z-]*|"") echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        if [ -z "$a" ] || [ -n "$x" ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      done <<< "$lines"
      start=""
      while read -r u e a; do
        case "$e" in
          -|not-found|masked) continue ;;
          masked-runtime) systemctl unmask "$u"; systemctl mask --runtime "$u"; continue ;;
        esac
        systemctl unmask "$u"
        case "$e" in
          enabled) systemctl enable "$u" ;;
          enabled-runtime) systemctl enable --runtime "$u" ;;
          linked|linked-runtime) echo "Could not link $u again; link its unit file by hand" >&2 ;;
        esac
        case "$a" in active|activating|reloading) start="$start $u" ;; esac
      done <<< "$lines"
      if [ -n "$start" ]; then systemctl start $start; fi
      echo "Restored the previous state of the units"
    )

privileges: root
runnable: true

sources:
  - https://www.bluez.org/
  - https://nvd.nist.gov/vuln/detail/CVE-2020-12351
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html

notes:
  pl: |
    Naprawa maskuje usługę bluetooth.service zamiast usuwać pakiet bluez, bo
    zależą od niego m.in. gnome-bluetooth i NetworkManager-bluetooth.
    Zamaskowana usługa nie uruchomi się także przez D-Bus ani po
    podłączeniu adaptera. Moduły jądra obsługujące adapter zostają
    załadowane, ale bez demona nie da się sparować ani połączyć urządzenia.

    Wynik IN_USE podaje stan włączenia i działania usługi, NOT_IN_USE
    zainstalowany pakiet, a NOT_INSTALLED brak pakietu bluez. Wycofanie
    zdejmuje maskę, a usługę włącza i uruchamia tylko wtedy, gdy była
    włączona albo działała przed naprawą.
  en: |
    The remediation masks bluetooth.service instead of removing the bluez
    package, because gnome-bluetooth and NetworkManager-bluetooth, among
    others, depend on it. A masked service does not start through D-Bus or
    when an adapter is plugged in either. The kernel modules for the adapter
    stay loaded, but without the daemon no device can be paired or
    connected.

    The IN_USE result gives the enabled and running state of the service,
    NOT_IN_USE the installed package, and NOT_INSTALLED that bluez is not
    installed. Rollback removes the mask, and enables and starts the service
    only if it was enabled or running before the remediation.
