id: win11-peer-name-publication-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Publikowanie nazwy maszyny w sieci równorzędnej wyłączone
    en: Publishing the machine's name in peer networking disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa ogłasza nazwę maszyny w rozproszonym spisie nazw używanym przez
    łączność równorzędną. Robi to sama, bez polecenia, i utrzymuje ten wpis tak
    długo, jak długo działa.

    Kierunek jest tu odwrotny niż przy pozostałych składnikach tej rodziny
    i na tym polega odrębność punktu. Pozostałe pozwalają maszynie odnaleźć
    innych albo połączyć się z nimi. Ta sprawia, że inni odnajdują maszynę —
    bez żadnej decyzji po jej stronie i bez wiedzy osoby przy niej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, jest skromne
    i nie ma powodu tego wyolbrzymiać. Zyskuje informację: że maszyna istnieje,
    jak się nazywa i jakim adresem da się ją osiągnąć. Jest to materiał do
    rozpoznania, a nie droga wejścia.

    Wartość punktu polega na czym innym. Maszyna nie powinna rozgłaszać
    o sobie niczego, czego nikt od niej nie potrzebuje, a przy łączności
    równorzędnej nieużywanej w organizacji nie potrzebuje tego nikt. Punkt
    domyka rodzinę: pozostałe trzy reguły zdejmują możliwość korzystania
    z mechanizmu, ta zdejmuje ślad, który maszyna po sobie zostawia.
  en: |
    The service announces the machine's name in the scattered register of names used by
    peer connectivity. It does so of its own accord, with no order given, and keeps that
    entry up as long as it runs.

    The direction here is the reverse of the family's other components, and that is what
    sets the item apart. The others let the machine find others or join them. This one
    makes others find the machine - with no decision on its side and without the
    knowledge of the person at it.

    What an attacker gains while the item goes unmet is modest and there is no reason to
    blow it up. They gain information: that the machine exists, what it is called and at
    what address it can be reached. That is material for reconnaissance, not a way in.

    The item's worth lies elsewhere. A machine should broadcast nothing about itself that
    nobody needs from it, and where peer connectivity is not used in an organisation
    nobody needs this. The item closes the family: the other three rules take away the
    means of using the mechanism, this one takes away the trace the machine leaves
    behind.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek łączy się z tą maszyną po nazwie
    ogłaszanej w sieci równorzędnej.

    W praktyce jest to zastosowanie bardzo rzadkie i na stanowisku biurowym
    zmiana zwykle nie robi nic. Maszyna dalej odnajduje inne maszyny i dalej
    się z nimi łączy — punkt dotyczy wyłącznie kierunku przeciwnego.

    Skutek pojawia się tam, gdzie maszyna ma być osiągalna z inicjatywy drugiej
    strony bez pośrednictwa serwera nazw. Dotyczy to pomocy zdalnej zestawianej
    krótkim hasłem, gdy to ta maszyna jest stroną oczekującą na połączenie,
    oraz programów branżowych odnajdujących stanowiska po nazwie w sieci
    równorzędnej.

    Rozgłaszanie nazwy maszyny w sieci lokalnej innymi mechanizmami — tymi,
    z których korzysta odnajdywanie maszyn i udziałów — działa dalej bez
    zmiany. To one obsługują zwykłe odnajdywanie w sieci biurowej i one są
    przedmiotem innych reguł tej paczki.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anybody reaches this machine by the name announced in
    peer networking.

    In practice that is a very rare use and at an office station the change usually does
    nothing. The machine still finds other machines and still joins them - the item
    concerns the opposite direction alone.

    The effect appears where the machine is to be reachable on the other side's
    initiative with no name server in between. That covers remote help set up with a
    short password where this machine is the side awaiting a connection, and
    line-of-business programs finding stations by name in peer networking.

    Broadcasting the machine's name on the local network by other mechanisms - those used
    by the finding of machines and shares - carries on unchanged. It is they that handle
    ordinary finding on an office network and they that other rules in this pack address.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Maszyna przestaje ogłaszać swoją nazwę w spisie nazw sieci równorzędnej
      - Pomoc zdalna z tą maszyną jako stroną oczekującą na połączenie nie zostanie zestawiona
      - Program branżowy odnajdujący stanowiska po nazwie w sieci równorzędnej nie znajdzie tej maszyny
      - Odnajdywanie innych maszyn z tej maszyny działa dalej bez żadnej zmiany
    en:
      - The machine stops announcing its name in the peer networking register of names
      - Remote help with this machine as the side awaiting a connection will not be set up
      - A line-of-business program finding stations by name in peer networking will not find this one
      - Finding other machines from this machine carries on with no change at all
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna ma być osiągalna po nazwie z inicjatywy drugiej strony bez serwera nazw
      - Pomoc zdalna prowadzona jest wariantem z krótkim hasłem, a ta maszyna oczekuje na połączenie
    en:
      - The machine is to be reachable by name on the other side's initiative with no name server
      - Remote help is given in the short password variant and this machine awaits the connection
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'PNRPAutoReg' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPAutoReg' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PNRPAutoReg' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

notes:
  pl: |
    Reguła domyka czwórkę opisującą łączność równorzędną. Jej waga jest
    najniższa z całej rodziny i nie ma powodu tego ukrywać — samo ogłaszanie
    nazwy nie otwiera drogi wejścia. Punkt ma wartość jako uzupełnienie
    pozostałych trzech, a nie jako zmiana samodzielna.

    Usługa zależy od rozwiązywania nazw w sieci równorzędnej i bez niego nie ma
    gdzie ogłaszać nazwy. Wyłączenie tamtej reguły czyni tę bezprzedmiotową
    w skutkach, ale nie w zapisie: usługa pozostaje ustawiona na uruchamianie
    i wróci razem z tamtą.

    Na maszynie bez zainstalowanego składnika łączności równorzędnej usługi
    nie ma i audyt zwróci wynik „nie dotyczy".

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The rule closes the quartet describing peer connectivity. Its weight is the lowest in
    the family and there is no reason to hide it - announcing a name opens no way in on
    its own. The item has worth as a completion of the other three rather than as a
    change standing alone.

    The service depends on the resolving of names in peer networking and without it has
    nowhere to announce a name. Disabling that rule makes this one moot in its effects
    but not in what is recorded: the service stays set to start and will come back
    together with that one.

    On a machine with no peer connectivity component installed the service is absent and
    the audit returns "not applicable".

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
