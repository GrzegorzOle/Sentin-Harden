id: win11-installer-vendor-signed-updates-restricted

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Stosowanie poprawek podpisanych przez wydawcę zastrzeżone dla administratorów
    en: Applying patches signed by the vendor reserved for administrators
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Instalator systemowy potrafi nałożyć poprawkę na już zainstalowany program
    bez pytania o uprawnienia, jeżeli poprawka jest podpisana tym samym
    certyfikatem co pierwotny pakiet. Pomysł jest rozsądny: skoro program
    pochodzi od tego wydawcy, to i jego poprawka może.

    Rozumowanie zawodzi w jednym miejscu. Podpis mówi, kto poprawkę wydał, ale
    nie mówi, co ona robi. Poprawka wykonuje działania z uprawnieniami usługi
    instalatora, czyli najwyższymi na maszynie, a użytkownik bez uprawnień
    administratora może ją nałożyć sam — bez okna, bez pytania i bez śladu
    decyzji.

    Wystarczy więc, żeby napastnik zdobył klucz podpisujący któregokolwiek
    wydawcy, którego program jest na maszynie zainstalowany — albo żeby wydawca
    ten sam został przejęty. Jest to droga wykorzystywana w atakach na łańcuch
    dostaw i jej siła polega na tym, że maszyna zachowuje się zgodnie
    z projektem: wszystko jest podpisane i wszystko się zgadza.

    Punkt zastrzega nakładanie poprawek dla administratorów. Zwykły użytkownik
    przestaje móc to zrobić, więc podpis przestaje wystarczać za decyzję.
  en: |
    The system installer can apply a patch to an already installed program without
    asking about privileges, if the patch is signed with the same certificate as the
    original package. The idea is sensible: since the program comes from this vendor,
    so may its patch.

    The reasoning fails in one place. A signature says who issued the patch, but not
    what it does. A patch carries out actions with the installer service's privileges
    - the highest on the machine - and a user without administrator rights can apply
    it themselves: no window, no question, no trace of a decision.

    So it is enough for an attacker to obtain the signing key of any vendor whose
    program is installed on the machine - or for that vendor to be taken over
    themselves. It is a route used in supply chain attacks, and its strength lies in
    the machine behaving exactly as designed: everything is signed and everything
    checks out.

    The item reserves the applying of patches for administrators. An ordinary user
    can no longer do it, so a signature stops standing in for a decision.

disruption_description:
  pl: |
    Nic nie przestaje działać tam, gdzie oprogramowanie aktualizuje się przez
    narzędzie zarządzania albo przez własny mechanizm z uprawnieniami usługi.
    A tak dzieje się w zdecydowanej większości przypadków.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego i żaden program nie zmienia zachowania w chwili wdrożenia.

    Odczuwalne jest to wyłącznie tam, gdzie użytkownik bez uprawnień
    administratora nakładał poprawki sam — zwykle przez pobranie pliku poprawki
    ze strony producenta i uruchomienie go dwuklikiem. Po wdrożeniu zobaczy
    pytanie o dane administratora albo komunikat o braku uprawnień.

    Jest to sposób pracy spotykany przy oprogramowaniu branżowym rozprowadzanym
    poza centralnym narzędziem. Warto sprawdzić, czy takie oprogramowanie jest
    w organizacji, zanim się wdroży — objaw po stronie użytkownika wygląda jak
    zepsuta aktualizacja, a nie jak zadziałanie zasady.

    Nie ma restartu.
  en: |
    Nothing stops working where software updates through a management tool or through
    a mechanism of its own with a service's privileges. And that is what happens in
    the great majority of cases.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no program changing behaviour at the moment of the
    rollout.

    It is felt only where a user without administrator rights applied patches
    themselves - usually by downloading a patch file from the maker's page and
    double-clicking it. After the rollout they see a request for administrator
    details or a message about lacking privileges.

    It is a way of working met with trade software distributed outside a central
    tool. Worth checking whether the organisation has such software before applying -
    the symptom on the user's side looks like a broken update rather than a policy
    taking effect.

    There is no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Użytkownik bez uprawnień administratora przestanie móc nałożyć poprawkę pobraną ze strony producenta
      - Oprogramowanie branżowe aktualizowane ręcznie przez użytkownika zacznie wymagać uprawnień
      - Aktualizacje przez narzędzie zarządzania i własne mechanizmy programów działają bez zmian
    en:
      - A user without administrator rights can no longer apply a patch downloaded from the maker's page
      - Trade software updated by hand by the user starts requiring privileges
      - Updates through a management tool and through programs' own mechanisms work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Użytkownicy bez uprawnień administratora aktualizują oprogramowanie branżowe samodzielnie
    en:
      - Users without administrator rights update trade software themselves
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'DisableLUAPatching'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'DisableLUAPatching'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLUAPatching' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/patching

notes:
  pl: |
    Punkt należy do rodziny ustawień instalatora, obok zakazu podnoszenia
    uprawnień przy instalacji i zachowania ostrzeżenia przy wywołaniu ze
    skryptu. Każde z nich zamyka inną drogę do wykonania kodu z uprawnieniami
    usługi instalatora, a wdrożenie tylko części zostawia pozostałe otwarte.

    Nazwa wpisu odwołuje się do wewnętrznej nazwy mechanizmu kontroli konta
    użytkownika. Nie ma związku z ustawieniami kontroli konta widocznymi
    w panelu i nie należy ich ze sobą mylić.

    Wycofanie nie usuwa gałęzi — jest wspólna z pozostałymi punktami rodziny.
  en: |
    The item belongs to the family of installer settings, beside the ban on raising
    privileges during an install and the keeping of the warning on a call from a
    script. Each closes a different route to running code with the installer
    service's privileges, and applying only some leaves the others open.

    The entry's name refers to the internal name of the user account control
    mechanism. It has no connection with the account control settings visible in the
    panel and the two should not be confused.

    Rollback does not remove the key - it is shared with the family's remaining
    items.
