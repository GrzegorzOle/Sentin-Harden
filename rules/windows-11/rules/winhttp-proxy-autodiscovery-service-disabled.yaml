id: win11-winhttp-proxy-autodiscovery-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa samoczynnego wyszukiwania pośrednika sieciowego wyłączona
    en: The service automatically searching for a network proxy disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa odpowiada za samoczynne odnalezienie pośrednika sieciowego. Gdy
    aplikacja ma połączyć się ze światem, a w ustawieniach nie wpisano,
    którędy, usługa pyta sieć lokalną, kto pełni tę rolę, i stosuje odpowiedź.

    Sposób pytania jest tym, co czyni punkt istotnym. Maszyna rozsyła zapytanie
    o nazwę pośrednika mechanizmami rozgłoszeniowymi sieci lokalnej, a więc
    pyta wszystkich obecnych, nie wskazanego serwera. Odpowiedzieć może
    dowolne urządzenie w tej samej sieci i zwykle wygrywa to, które odpowie
    pierwsze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zgłoszenia się jako pośrednik dla całego ruchu tej maszyny. Nie jest to
    zdobycie uprawnień ani włamanie — jest to udzielenie odpowiedzi na pytanie,
    które maszyna sama zadała. Po niej ruch aplikacji przechodzi przez
    urządzenie napastnika: może być odczytany, opóźniony, przekierowany albo
    podmieniony.

    Droga ta jest wykorzystywana w praktyce i nie wymaga ani poświadczeń, ani
    niczego wcześniej zainstalowanego po stronie maszyny. Wystarczy obecność
    w tej samej sieci — kawiarnia, hotel, sieć bezprzewodowa klienta.

    Ta sama usługa odpowiada za pobranie i wykonanie skryptu konfiguracyjnego
    wskazanego w odpowiedzi, co dokłada do sprawy wykonanie kodu z miejsca
    wskazanego przez tego, kto odpowiedział.
  en: |
    The service is responsible for automatically finding a network proxy. When an
    application is to connect to the world and the settings do not say by which way, the
    service asks the local network who holds that role and applies the answer.

    The manner of asking is what makes the item weighty. The machine sends out a query for
    the proxy's name by the local network's broadcast mechanisms, and so asks everybody
    present rather than a named server. Any device on the same network may answer, and
    usually the one that answers first wins.

    What an attacker gains while the item goes unmet: the means of presenting themselves
    as the proxy for all this machine's traffic. It is not a gaining of rights nor a
    break-in - it is the giving of an answer to a question the machine asked itself. After
    it the applications' traffic passes through the attacker's device: it may be read,
    delayed, redirected or substituted.

    That route is used in practice and takes neither credentials nor anything installed
    beforehand on the machine's side. Presence on the same network is enough - a cafe, a
    hotel, a customer's wireless network.

    The same service is responsible for fetching and running the configuration script
    named in the answer, which adds to the matter the running of code from a place named
    by whoever answered.

disruption_description:
  pl: |
    Świadomego wdrożenia wymaga tu ustalenie, czy cokolwiek w sieci opiera
    dostęp do świata na samoczynnie wyszukiwanym pośredniku — bo jeżeli tak,
    wyłączenie usługi odcina dostęp do sieci, a nie tylko jedną jego drogę.

    W sieci, w której wyjście na zewnątrz prowadzi wyłącznie przez pośrednika
    wskazywanego tym mechanizmem, po zmianie przestaną działać przeglądarki,
    aktualizacje systemu, sklep, pobieranie definicji ochrony i wszystko inne,
    co wychodzi na zewnątrz. Objaw będzie wyglądał jak awaria łącza, a nie jak
    skutek zmiany ustawienia, więc rozpoznanie przyczyny bywa długie.

    W sieci bez pośrednika albo z pośrednikiem wpisanym w ustawieniach zmiana
    nie zmienia niczego.

    Usługa jest zależnością składnika odpowiadającego za pobieranie
    aktualizacji z innych maszyn w sieci lokalnej. Tam, gdzie ten mechanizm
    jest używany do oszczędzania łącza, jego działanie może się pogorszyć.

    Sprawdzić trzeba osobno komputery przenośne, bo one bywają w kilku sieciach
    na przemian — biurowej, domowej i klienta — i wystarczy, że jedna z nich
    opiera się na tym mechanizmie.

    Przed wdrożeniem właściwą drogą jest wpisanie pośrednika w ustawieniach
    na stałe, jeżeli jest potrzebny. Wtedy zmiana jest niewidoczna, a zdobywa
    się to, o co w punkcie chodzi.

    Zmiana wymaga zatrzymania usługi.
  en: |
    A conscious rollout takes here establishing whether anything on the network rests its
    access to the world on an automatically found proxy - because if so, disabling the
    service cuts off access to the network rather than one route to it.

    On a network where the way out leads only through a proxy named by this mechanism,
    after the change browsers, system updates, the store, the fetching of protection
    definitions and everything else that goes outward will stop working. The symptom will
    look like a line failure rather than the effect of a changed setting, so recognising
    the cause is sometimes slow.

    On a network with no proxy, or with a proxy written into the settings, the change
    changes nothing.

    The service is a dependency of the component responsible for fetching updates from
    other machines on the local network. Where that mechanism is used to spare the line,
    its working may worsen.

    Portable computers have to be checked apart, since they are sometimes on several
    networks by turns - office, home and customer's - and it is enough for one of them to
    rest on this mechanism.

    The right course before a rollout is to write the proxy into the settings for good, if
    one is needed. The change is then invisible, while what the item is about is gained.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
    - legacy-applications
  what_breaks:
    pl:
      - W sieci opartej na samoczynnie wyszukiwanym pośredniku ustaje cały ruch wychodzący
      - Przeglądarki, aktualizacje, sklep i pobieranie definicji ochrony przestają wychodzić na zewnątrz
      - Pobieranie aktualizacji z innych maszyn w sieci lokalnej może działać gorzej
      - Pośrednik wpisany w ustawieniach na stałe działa dalej bez zmiany
    en:
      - On a network resting on an automatically found proxy all outgoing traffic ceases
      - Browsers, updates, the store and the fetching of protection definitions stop going outward
      - Fetching updates from other machines on the local network may work worse
      - A proxy written into the settings for good carries on working unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Wyjście na zewnątrz prowadzi przez pośrednika wskazywanego tym mechanizmem
      - Komputer przenośny pracuje w sieciach, z których choć jedna opiera się na tym mechanizmie
      - Pośrednik nie został wpisany w ustawieniach na stałe
    en:
      - The way out leads through a proxy named by this mechanism
      - A portable computer works on networks of which at least one rests on this mechanism
      - No proxy has been written into the settings for good
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the way out of the network leads through an automatically found
    # proxy, this stops all outgoing traffic - not one route to it.
    Stop-Service -Name 'WinHttpAutoProxySvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinHttpAutoProxySvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WinHttpAutoProxySvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winhttp/winhttp-autoproxy-api

notes:
  pl: |
    Jest to reguła, przy której kolejność działań ma większe znaczenie niż
    przy pozostałych usługach w tej paczce. Wyłączenie usługi bez uprzedniego
    wpisania pośrednika na stałe potrafi odciąć maszynę od sieci na tyle
    skutecznie, że cofnięcie zmiany zdalnie przestaje być możliwe.

    Skutek jest zauważalny natychmiast, ale nie kojarzy się z przyczyną.
    Użytkownik zgłosi brak internetu, a nie zmianę ustawienia usługi.

    Innym niż ta usługa reguły w tej paczce ograniczają mechanizmy
    rozgłoszeniowe sieci lokalnej od strony samego protokołu rozwiązywania
    nazw. Te dwie drogi warto czytać razem, bo zamykają tę samą klasę ataku
    z dwóch stron.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    This is a rule where the order of actions matters more than with the other services in
    this pack. Disabling the service without first writing the proxy in for good can cut
    the machine off from the network effectively enough that undoing the change remotely
    stops being possible.

    The effect is noticeable at once but is not connected with its cause. The user will
    report no internet, not a changed service setting.

    Rules in this pack other than this one limit the local network's broadcast mechanisms
    from the side of the name resolution protocol itself. Those two routes are worth
    reading together, since they close the same class of attack from two sides.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
