id: fedora44-no-duplicate-gids

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 7.2.5
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Żaden GID nie powtarza się w /etc/group
    en: Ensure no duplicate GIDs exist
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Uprawnienia plików zapisują GID, a nie nazwę grupy. Dwie grupy z tym
    samym GID dają swoim członkom te same prawa, więc dodanie kogoś do
    niewinnie wyglądającej grupy może dać mu dostęp do plików innej.

    Punkt wymaga, żeby każda grupa w /etc/group miała własny GID.
  en: |
    File permissions store the GID, not the group name. Two groups with the
    same GID give their members the same rights, so adding someone to an
    innocent-looking group can give them access to the files of another.

    The item requires every group in /etc/group to have its own GID.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/group.
  en: |
    Nobody will notice: the check only reads /etc/group.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/group ] || { echo "NOT_OK:no-/etc/group"; exit 0; }
    o=$(awk -F: '$1 != "" { n[$3]++; w[$3] = w[$3] (w[$3] == "" ? "" : "+") $1 }
      END { for (k in n) if (n[k] > 1) print k "=" w[k] }' /etc/group | sort -n | paste -sd, -)
    if [ -n "$o" ]; then echo "NOT_OK:gid-$o"; else echo "OK:no-duplicate-gids"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/group.5.html
  - https://man7.org/linux/man-pages/man8/grpck.8.html

notes:
  pl: |
    Wynik NOT_OK podaje każdy powtórzony GID z nazwami grup, na przykład
    gid-1001=dev+ops. Grupa dostaje nowy GID ręcznie poleceniem groupmod -g,
    a jej pliki trzeba potem przepisać poleceniem chgrp. Test działa bez
    roota. Reguła tylko sprawdza stan.
  en: |
    The NOT_OK result gives each repeated GID with the group names, for
    example gid-1001=dev+ops. A group gets a new GID by hand with
    groupmod -g, and its files then need chgrp. The test works without
    root. The rule only checks the state.
