id: win10-builtin-guest-renamed

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto gościa przemianowane
    en: The built-in guest account renamed
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zmienia nazwę wbudowanego konta gościa na inną niż domyślna.

    Jest to najsłabsza reguła w tym bloku i opis powinien to przyznać wprost.
    Konto gościa, jeśli jest wyłączone regułą sąsiednią, nie daje się użyć
    niezależnie od tego, jak się nazywa. Wartość tego punktu polega więc na
    czymś innym niż ochrona sama w sobie.

    Polega na dwóch rzeczach. Pierwsza to wypadnięcie z narzędzi
    próbujących logowania masowo — tak jak przy koncie administratora, nazwa
    domyślna jest w nich wpisana na sztywno. Druga jest ważniejsza i rzadziej
    nazywana: konto o nazwie zmienionej nie zostanie włączone przez pomyłkę.
    Włączanie gościa zdarza się przy rozwiązywaniu kłopotów z udostępnianiem
    plików, bo bywa najszybszą drogą do tego, żeby coś zaczęło działać.
    Konto o nazwie nietypowej tej drogi nie podsuwa.

    Reguła jest więc porządkiem i zabezpieczeniem przed własną pomyłką,
    a nie zamknięciem drogi wejścia. Stąd kategoria niska i stąd miejsce
    w kolejności — robi się ją przy okazji, po wyłączeniu konta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwę konta
    gościa znaną bez rozpoznania, gotową do użycia w chwili, gdy konto to
    zostanie na maszynie włączone.
  en: |
    The setting changes the built-in guest account's name to one other than the default.

    It is the weakest rule in this block and the description ought to own that outright. The guest account, if
    switched off by the neighbouring rule, cannot be used whatever it may be called. This item's value rests
    therefore on something other than protection in itself.

    It rests on two things. The first is falling out of tools trying logons wholesale - as at the administrator
    account, the default name is written into them fast. The second is the weightier and the less often named: a
    account whose name has been changed will not be switched on by mistake. The switching on of the guest
    happens while trouble with file sharing is being settled, it being at times the quickest road to making
    something work. An account of an unusual name does not suggest that road.

    The rule is therefore an ordering, and a safeguard against one's own slip, rather than the closing of a road
    in. Hence the low category and hence its place in the order - it gets done in passing, after the account has
    been switched off.

    What an attacker gains while the item goes unmet: the guest account's name known without reconnaissance,
    ready for use the moment that account gets switched on upon the machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na maszynie z kontem gościa wyłączonym
    zmiana nie robi zupełnie nic.

    Sprawdzenie dotyczy przypadku, w którym konto to jednak działa — a więc
    maszyny udostępniającej coś bez poświadczeń. Tam zmiana nazwy odetnie
    wszystko, co loguje się jako gość podając nazwę. Urządzenia łączące się
    bez podawania czegokolwiek zmiany nie zauważą, bo one nazwy nie podają.

    Odnotowuję, że sprawdzenie rozpoznaje nazwy domyślne z kilku wersji
    językowych. Maszyna zainstalowana w języku innym niż angielski ma tu
    nazwę własną i reguła musi ją rozpoznać jako domyślną, a nie jako
    zmienioną. Wzorzec zapisany jest bez znaków spoza alfabetu podstawowego,
    żeby wynik nie zależał od kodowania.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: kont własnych, kont domenowych, logowania, usług
    systemowych, sieci, aplikacji, drukowania.
  en: |
    The class is "needs review", though on a machine with the guest account switched off the change does nothing
    whatever.

    The review touches the case in which that account does work - which is to say a machine sharing something
    without credentials. There the renaming will cut off everything logging in as a guest while giving the name.
    Devices joining without giving anything at all will not notice the change, they giving no name.

    Worth noting that the check recognises the default names of several language versions. A machine installed
    in a language other than English has here a name of its own, and the rule must recognise it as the default
    rather than as changed. The pattern is written without letters outside the basic alphabet, that the outcome
    should not hang on the encoding.

    The change takes hold at once and undoes itself at once.

    What this does not break: one's own accounts, domain accounts, logging on, system services, the network,
    applications, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Wszystko, co loguje się jako gość podając nazwę, przestaje działać w chwili zmiany
      - Urządzenia łączące się bez podawania czegokolwiek zmiany nie zauważają, bo nazwy nie podają
      - Na maszynie z kontem gościa wyłączonym zmiana nie robi nic i pozostaje porządkiem na przyszłość
      - Konto zachowuje identyfikator, uprawnienia i stan włączenia, więc zmienia się wyłącznie nazwa
      - Konta własne, konta domenowe, logowanie oraz praca usług systemowych i sieci pozostają bez zmian
    en:
      - Everything logging in as a guest while giving the name ceases working the moment it is changed
      - Devices joining without giving anything at all do not notice the change, they giving no name
      - On a machine with the guest account switched off the change does nothing and stays an ordering for later
      - The account keeps its identifier, its rights and its switched state, so only the name changes
      - Ones own accounts, domain accounts, logging on and the work of system services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Konto gościa jest na tej maszynie używane i coś loguje się nim podając nazwę wprost
    en:
      - The guest account is in use on this machine and something logs in by it while giving the name outright
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The built-in account is found by the ending of its identifier, not by
      # name. The default names below stand for the commonest language
      # versions; a dot takes the place of a letter outside the basic alphabet,
      # so that the check does not depend on the encoding in which the command
      # reaches the shell.
      $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
      if ($null -eq $account) { 'CHECK_ERROR' }
      elseif ($account.Name -match '^(guest|gast|go.{1,2}|invit.|invitado|convidado|ospite)$') { 'DEFAULT_NAME' }
      else { 'RENAMED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'RENAMED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
    [pscustomobject]@{
      sid   = (($account.SID.Value) -join '')
      name  = (($account.Name) -join '')
      found = ($null -ne $account)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The name below is a starting point. Pick one of the organisation's own, and
    # do not give every machine the same one. The renaming does not switch the
    # account off - that is a separate rule and the weightier of the two.
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
    if ($null -eq $account) { throw 'The built-in guest account was not found.' }
    Rename-LocalUser -SID $account.SID -NewName 'usr-local'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.found) { throw 'Backup holds no built-in guest account - nothing to restore.' }
    Rename-LocalUser -SID $b.sid -NewName $b.name

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-rename-guest-account

notes:
  pl: |
    Reguła jest najsłabsza w bloku i warto, żeby aplikacja pokazywała ją
    bezpośrednio pod regułą o wyłączeniu konta gościa. Osobno wygląda na
    zabezpieczenie; w parze widać, że jest dopełnieniem.

    Argument wart zachowania jest ten rzadziej wymieniany: konto o nazwie
    nietypowej nie zostanie włączone odruchowo przy rozwiązywaniu kłopotu
    z udostępnianiem. Jest to obrona przed własną pomyłką, nie przed
    napastnikiem, i właśnie dlatego reguła ma sens także tam, gdzie konto
    już jest wyłączone.

    Odnotowuję, że wzorzec nazw domyślnych obejmuje kilka wersji językowych
    i używa kropki w miejsce znaku spoza alfabetu podstawowego. Bez tego
    maszyna zainstalowana w języku innym niż angielski pokazywałaby zgodność
    z samego powodu nierozpoznania nazwy.
  en: |
    The rule is the weakest in the block and it is well that the application show it directly under the rule
    about switching the guest account off. Apart it looks a safeguard; in the pair it is seen to be a rounding
    out.

    The argument worth keeping is the less often named: an account of an unusual name will not be switched on by
    reflex while trouble with sharing is being settled. It is a defence against one's own slip and not against
    an attacker, and for just that the rule makes sense also where the account is already off.

    Worth noting that the pattern of default names covers several language versions and uses a dot in place of a
    letter outside the basic alphabet. Without that a machine installed in a language other than English would
    show compliance for the mere reason that its name went unrecognised.
