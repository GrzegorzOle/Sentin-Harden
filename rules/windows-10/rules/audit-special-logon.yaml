id: win10-audit-special-logon

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja logowania z uprawnieniami szczególnymi
    en: The audit of logging on with singular rights
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyodrębnia ze strumienia wszystkich logowań te, przy których
    konto weszło do systemu z uprawnieniami szczególnymi — czyli takimi,
    które pozwalają zmienić maszynę, a nie tylko na niej pracować.

    Różnica wobec inspekcji logowania jest różnicą ilości przechodzącą
    w jakość. Wejść na maszynę bywa dziennie kilkaset. Wejść z uprawnieniami
    administracyjnymi bywa kilka i to właśnie one interesują osobę badającą
    zdarzenie. Podkategoria ta oddziela garstkę od tła, zamiast kazać ją
    z tła wyławiać.

    Rzecz warta odnotowania: uprawnienia zapisywane są w chwili wejścia, a nie
    w chwili użycia. Napastnik, który zdobył konto administracyjne,
    zostawia wpis natychmiast — zanim czegokolwiek użyje i niezależnie od
    tego, czy użyje.

    Podkategoria mówi też o czymś, o czym sama nazwa nie mówi: o kontach,
    które uprawnienia szczególne mają, a nie powinny. Wpis pojawiający się
    przy koncie zwykłym jest wtedy odpowiedzią na pytanie, którego nikt nie
    zadał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście na
    konto administracyjne ginące w tle kilkuset wejść zwykłych.
  en: |
    The setting sets apart, out of the stream of all logging on, those entries at which an account came into the
    system with singular rights - such, that is, as allow the machine to be changed and not merely worked upon.

    The difference from the audit of logging on is a difference of number passing into one of kind. Entries upon
    a machine run to some hundreds a day. Entries with administrative rights run to a few, and it is just those
    that hold the interest of a person looking into a happening. This subcategory parts the handful from the
    background, instead of bidding it be fished out of the background.

    A thing worth noting: the rights are written down at the moment of entry and not at the moment of use. An
    attacker who has gained an administrative account leaves an entry at once - before using anything, and
    whether or not they use it.

    The subcategory speaks too of something its name does not: of accounts that hold singular rights and ought
    not to. An entry coming up beside an ordinary account is then the answer to a question nobody put.

    What an attacker gains while the item goes unmet: an entry upon an administrative account lost in the
    background of some hundreds of ordinary ones.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie niczego nie zabrania i nie dotyka żadnego logowania —
    zapisuje wyłącznie to, co i tak się dzieje.

    Liczba wpisów jest niewielka i to odróżnia tę regułę od inspekcji
    logowania. Wejść z uprawnieniami szczególnymi bywa dziennie kilka, więc
    dziennika nie zapełnia.

    Odnotowuję, że zapisywany jest wyłącznie wynik udany. Wejście, które
    nie doszło do skutku, nie ma uprawnień do wypisania, a jego ślad leży
    w inspekcji logowania. Brak połowy wyniku nie jest tu więc luką, tylko
    konsekwencją tego, co podkategoria opisuje.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: logowania, uwierzytelniania, uprawnień kont,
    udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting forbids nothing and touches no logging on - it writes down only what happens anyway.

    The number of entries is small, and that parts this rule from the audit of logging on. Entries with singular
    rights run to a few a day, so it does not fill the log.

    I set down that only the successful outcome is written. An entry that did not come about has no rights to be
    set out, and its trace lies in the audit of logging on. The want of half the outcome is here therefore no gap
    but a consequence of what the subcategory describes.

    There are no known regressions for everyday work.

    What this does not break: logging on, authentication, accounts' rights, file shares, printing, or
    applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Zapisywany jest wyłącznie wynik udany, bo wejście nieudane nie ma uprawnień do wypisania
      - Ślad wejścia nieudanego leży w inspekcji logowania i bez niej ta reguła pokazuje mniej
      - Liczba wpisów jest niewielka, więc dziennika zabezpieczeń ta podkategoria nie zapełnia
      - Ustawienie niczego nie zabrania i nie dotyka żadnego logowania
      - Uwierzytelnianie, uprawnienia kont, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Only the successful outcome is written, an entry that failed having no rights to set out
      - The trace of a failed entry lies in the audit of logging on, and without that this rule shows less
      - The number of entries is small, so this subcategory does not fill the security log
      - The setting forbids nothing and touches no logging on
      - Authentication, accounts rights, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Inspekcja logowania jest wyłączona i wpisy z uprawnieniami szczególnymi nie mają czego uzupełniać
    en:
      - The audit of logging on is switched off and the entries with singular rights have nothing to fill out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE921B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE921B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE921B-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. A session with singular rights that
    # did not come about leaves its trace in the audit of logging on.
    auditpol /set /subcategory:"{0CCE921B-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE921B-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-special-logon

notes:
  pl: |
    Reguła jest w tym bloku najlepszym stosunkiem zysku do kosztu: kategoria
    wysoka przy klasie bez uciążliwości i przy liczbie wpisów liczonej
    w sztukach, nie w setkach.

    Argument wart postawienia wprost dotyczy tego, po co się to czyta.
    Inspekcja logowania odpowiada na pytanie „kto wszedł". Ta odpowiada na
    pytanie „kto wszedł jako ktoś, kto może tu wszystko" — a to jest
    pytanie, od którego zaczyna się badanie zdarzenia, nie na którym się
    kończy.

    Odnotowuję zastosowanie uboczne, warte pokazania w aplikacji. Wpisy tej
    podkategorii przy kontach, które administratorami być nie miały, są
    odpowiedzią na pytanie o nadmiarowe uprawnienia — zadawane zwykle
    osobno i zwykle trudniej.
  en: |
    The rule bears in this block the best ratio of gain to cost: a high category beside the class "no
    disruption", and beside a count of entries reckoned in single figures and not in hundreds.

    The argument worth putting outright touches what it is read for. The audit of logging on answers the
    question "who came in". This answers the question "who came in as somebody who may do anything here" - and
    that is the question at which the looking into a happening begins, not the one at which it ends.

    I set down a use to the side, worth showing in the application. This subcategory's entries beside accounts
    that were not to be administrators are the answer to the question about rights in excess - a question put as
    a rule apart, and as a rule with more trouble.
