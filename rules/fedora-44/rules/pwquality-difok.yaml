id: fedora44-pwquality-difok

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.3.3.2.1
  section: Access Control > Pluggable Authentication Modules > Configure pluggable module arguments > Configure pam_pwquality module
  title:
    pl: Liczba zmienionych znaków w nowym haśle jest skonfigurowana
    en: Ensure password number of changed characters is configured
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Parametr difok mówi, ile znaków nowego hasła nie może występować
    w starym. Przy wartości 1 wystarczy zmienić jeden znak, np. dopisać
    cyfrę na końcu, i hasło znane atakującemu prawie się nie zmienia.

    Punkt wymaga, żeby difok wynosił co najmniej 2.
  en: |
    The difok parameter sets how many characters of the new password must
    not be present in the old one. With the value 1 it is enough to change
    one character, for example add a digit at the end, and a password known
    to an attacker hardly changes.

    The item requires difok to be at least 2.

disruption_description:
  pl: |
    Fedora domyślnie ustawia difok=1. Naprawa ustawia 2, więc przy zmianie
    hasła trzeba zmienić co najmniej dwa znaki.
  en: |
    Fedora uses difok=1 by default. The remediation sets 2, so a password
    change has to change at least two characters.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownicy, którzy przy zmianie hasła zmieniają tylko jeden znak
    en:
      - Users who change only one character when they change the password
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konta, których hasła zmienia automatyzacja wybierająca hasła według własnych, słabszych zasad
    en:
      - Accounts whose passwords are changed by automation that picks passwords by its own, weaker rules
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    # conf_get KEY FILE...: value of the last entry in the files read in this order.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name != k || name == "" { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*/, "", v)
          if (v ~ /^=/) sub(/^=[ \t]*/, "", v); else v = ""
          sub(/[ \t]+$/, "", v); val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value and conf=... on active lines of a module, one
    # "file:KEY=value" item each.
    pam_args() {
      local f
      for f in system-auth password-auth; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if (index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 2) }'; }
    evaluate() {
      local v s a bad=""
      if v=$(conf_get difok /etc/security/pwquality.conf.d/*.conf /etc/security/pwquality.conf); then s="difok=$v"; else v='1'; s="difok=$v(default)"; fi
      for a in $(pam_args pam_pwquality.so difok); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          *) ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if [ -n "$bad" ]; then echo "NOT_OK:$s,by-hand:${bad#,}"
      elif ok "$v"; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=secconf-1
        if [ -e /etc/security/pwquality.conf ]; then echo existed=1; else echo existed=0; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/pwquality.conf
      mark='# Sentin-Harden: fedora44-pwquality-difok'
      line='difok = 2'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    # conf_get KEY FILE...: value of the last entry in the files read in this order.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name != k || name == "" { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*/, "", v)
          if (v ~ /^=/) sub(/^=[ \t]*/, "", v); else v = ""
          sub(/[ \t]+$/, "", v); val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value and conf=... on active lines of a module, one
    # "file:KEY=value" item each.
    pam_args() {
      local f
      for f in system-auth password-auth; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if (index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 2) }'; }
    evaluate() {
      local v s a bad=""
      if v=$(conf_get difok /etc/security/pwquality.conf.d/*.conf /etc/security/pwquality.conf); then s="difok=$v"; else v='1'; s="difok=$v(default)"; fi
      for a in $(pam_args pam_pwquality.so difok); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          *) ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if [ -n "$bad" ]; then echo "NOT_OK:$s,by-hand:${bad#,}"
      elif ok "$v"; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "$f already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        *by-hand:*) echo "The pam_pwquality lines in the PAM files have arguments that decide it instead of $f (${r##*by-hand:}); change the authselect profile by hand" >&2; exit 1 ;;
      esac
      d=$(dirname "$f")
      old=$(mktemp "$d/.sentin-harden-old.XXXXXX")
      t=$(mktemp "$d/.sentin-harden.XXXXXX")
      trap 'rm -f "$old" "$t"' EXIT
      if [ -e "$f" ]; then had=1; cat "$f" > "$old"; else had=0; fi
      # The last entry wins, so the line of this rule goes at the end; an older
      # copy of it is removed.
      { if [ "$had" = 1 ]; then awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f"; fi
        echo "$mark"; echo "$line"; } > "$t"
      if [ "$had" = 1 ]; then chmod --reference="$f" "$t"; chown --reference="$f" "$t"; else chmod 644 "$t"; chown root:root "$t"; fi
      mv -f "$t" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) if [ "$had" = 1 ]; then cat "$old" > "$f"; else rm -f "$f"; fi
           echo "$f does not meet the item after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
      echo "Set $line in $f"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/pwquality.conf
      mark='# Sentin-Harden: fedora44-pwquality-difok'
      line='difok = 2'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      e=$(sed -n '2s/^existed=//p' "$b")
      case "$e" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ ! -f "$f" ] || ! grep -qxF "$mark" "$f"; then echo "The line of this rule is not in $f, nothing to restore"; exit 0; fi
      t=$(mktemp "$(dirname "$f")/.sentin-harden.XXXXXX")
      trap 'rm -f "$t"' EXIT
      # Only the marked line of this rule goes; the rest of the file stays as it is now.
      awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f" > "$t"
      if grep -A 1 -xF "$mark" "$f" | grep -qxF "$line"; then kept=0; else kept=1; fi
      if [ "$e" = 0 ] && ! grep -q '[^[:space:]]' "$t"; then
        rm -f "$f"; echo "Removed $f, which this rule created"; exit 0
      fi
      chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if [ "$kept" = 1 ]; then
        echo "Removed the comment of this rule from $f; the line under it was changed by hand and stays"
      else
        echo "Removed the difok line of this rule from $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://github.com/libpwquality/libpwquality

notes:
  pl: |
    pam_pwquality czyta najpierw pliki /etc/security/pwquality.conf.d/*.conf
    w kolejności alfabetycznej, potem /etc/security/pwquality.conf, a na
    końcu argumenty ze swojego wiersza w /etc/pam.d/system-auth
    i password-auth. Wygrywa ostatni wpis, więc argument w pliku PAM wygrywa
    ze wszystkimi plikami. Sprawdziłem to na Fedorze 44. Sprawdzenie bierze
    ostatni wpis z tych plików, a gdy go nie ma, wartość domyślną modułu.
    Argument w wierszu pam_pwquality z niepoprawną wartością daje wynik
    NOT_OK z dopiskiem by-hand; naprawa wtedy niczego nie zmienia, bo ten
    wiersz pochodzi z szablonu profilu authselect.

    Naprawa dopisuje wiersz tej reguły na końcu pwquality.conf pod
    komentarzem Sentin-Harden, bo ten plik jest czytany po katalogu
    pwquality.conf.d. Wycofanie usuwa tylko te dwa wiersze. Zasady
    obowiązują przy każdej zmianie hasła przez użytkownika, np. passwd albo
    okno zmiany hasła w GNOME; obecne hasła zostają ważne. Hasła ustawiane
    przez roota nie są sprawdzane, dopóki nie włączy się enforce_for_root
    (punkt 5.3.3.2.7).

    difok jest sprawdzane tylko wtedy, gdy użytkownik podaje stare hasło,
    czyli nie przy haśle ustawianym przez roota.
  en: |
    pam_pwquality reads the /etc/security/pwquality.conf.d/*.conf files in
    alphabetical order first, then /etc/security/pwquality.conf, and last
    the arguments on its line in /etc/pam.d/system-auth and password-auth.
    The last entry wins, so an argument in the PAM file wins over all files.
    This was checked on Fedora 44. The check takes the last entry in these
    files and, when there is none, the default of the module. An argument on
    the pam_pwquality line with a wrong value gives the NOT_OK result with a
    by-hand note; the remediation then changes nothing, because this line
    comes from the authselect profile template.

    The remediation appends the line of this rule at the end of
    pwquality.conf under a Sentin-Harden comment, because this file is read
    after the pwquality.conf.d directory. Rollback removes only these two
    lines. The rules apply to every password change by a user, for example
    passwd or the GNOME password dialog; current passwords stay valid.
    Passwords that root sets are not checked unless enforce_for_root is
    turned on (item 5.3.3.2.7).

    difok is only checked when the user gives the old password, so not for
    a password that root sets.
