id: win2025-smartscreen-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Filtr SmartScreen dla aplikacji i plików włączony
    en: SmartScreen for applications and files enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza filtr reputacyjny sprawdzający pliki i programy
    uruchamiane na maszynie.

    Kategoria średnia i chcę nazwać, czym ten mechanizm jest, bo bywa mylony
    z programem antywirusowym. Antywirus pyta, czy plik zawiera coś znanego
    jako szkodliwe. Filtr reputacyjny pyta o coś innego: czy ten plik jest
    znany w ogóle, kto go podpisał i czy widziano go wcześniej. To jest
    pytanie o pochodzenie, nie o zawartość — i dlatego trafia w rzeczy,
    których sygnatura jeszcze nie opisuje.

    To jest właściwa treść punktu. Program złożony pod jedną kampanię jest
    nowy z definicji i żadna baza sygnatur o nim nie wie. Reputacja wie
    o nim jedno: że nikt go wcześniej nie widział — i to wystarcza, żeby
    człowiek dostał ostrzeżenie w miejscu, w którym inaczej nie dostałby
    żadnego.

    Na serwerze punkt ma sens węższy niż na stanowisku, ale nie żaden.
    Serwer uruchamia mniej pobranych plików, za to uruchamia je z prawami
    administratora — a to jest właśnie ten kontekst, w którym pojedyncze
    otwarcie waży najwięcej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: brak
    ostrzeżenia przy uruchomieniu programu, którego nikt wcześniej nie
    widział, w sesji o najszerszych uprawnieniach na tej maszynie.
  en: |
    The item enables the reputation filter which checks files and programs
    started on the machine.

    The category is medium, and I want to name what this mechanism is,
    because it is confused with an antivirus. An antivirus asks whether a
    file contains something known to be harmful. A reputation filter asks
    something else: whether this file is known at all, who signed it, and
    whether it has been seen before. That is a question about provenance, not
    about contents - and so it catches things no signature yet describes.

    That is the real substance of the item. A program put together for a
    single campaign is new by definition and no signature database knows of
    it. Reputation knows one thing about it: that nobody has seen it before -
    and that is enough for a person to be warned where otherwise they would
    be warned not at all.

    On a server the item has a narrower point than on a workstation, but not
    none. A server starts fewer downloaded files, but it starts them with an
    administrator's rights - and that is precisely the context where a single
    opening weighs most.

    What an attacker gains while the item goes unmet: no warning when a
    program nobody has seen before is started, in the session with the widest
    rights on this machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy dwóch rzeczy, obu
    dających się wskazać.

    Pierwsza to łączność. Sprawdzenie reputacji wymaga zapytania na zewnątrz.
    Na maszynie odciętej od sieci mechanizm nie poda odpowiedzi, a program
    uruchomi się z opóźnieniem albo z ostrzeżeniem o niemożności
    sprawdzenia. W sieci wydzielonej, bez wyjścia na zewnątrz, warto to
    sprawdzić przed zastosowaniem.

    Druga to narzędzia własne. Skrypt albo program zbudowany w organizacji
    i niepodpisany jest z punktu widzenia reputacji dokładnie tym samym, co
    program nieznany — czyli dostanie ostrzeżenie. Jeżeli takie narzędzia są
    na tej maszynie uruchamiane regularnie, ludzie nauczą się klikać przez
    ostrzeżenie, a to jest gorsze niż brak ostrzeżenia. Właściwą odpowiedzią
    jest podpisanie własnych narzędzi, nie wyłączenie filtra.

    Czego to nie psuje: usług, zadań zaplanowanych, ról serwera, programów
    już zainstalowanych ani niczego, co jest uruchamiane bez udziału
    powłoki.

    Rzecz do zapamiętania: ten punkt włącza filtr, a osobny punkt decyduje,
    czy ostrzeżenie da się pominąć. Pierwszy bez drugiego daje ostrzeżenie,
    które jest sugestią.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns two things, both of
    which can be named.

    The first is connectivity. Checking reputation requires a question sent
    outwards. On a machine cut off from the network the mechanism will give
    no answer, and a program will start with a delay or with a warning that
    it could not be checked. On a segregated network with no way out, this is
    worth checking before applying.

    The second is one's own tools. A script or a program built in the
    organisation and left unsigned is, from reputation's point of view,
    exactly the same as an unknown program - so it will draw a warning. If
    such tools are started on this machine regularly, people will learn to
    click through the warning, and that is worse than having no warning. The
    proper answer is to sign one's own tools, not to switch the filter off.

    What this does not break: services, scheduled tasks, server roles,
    programs already installed, or anything started without the shell.

    Something to remember: this item turns the filter on, and a separate item
    decides whether its warning can be got past. The first without the second
    gives a warning that is a suggestion.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Na maszynie odciętej od sieci program uruchomi się z opóźnieniem albo z ostrzeżeniem o niemożności sprawdzenia
      - Własne, niepodpisane narzędzia organizacji dostaną ostrzeżenie tak samo jak program nieznany
      - Ludzie nauczą się wtedy klikać przez ostrzeżenie — właściwą odpowiedzią jest podpisanie narzędzi, nie wyłączenie filtra
      - Usługi, zadania zaplanowane, role serwera i programy już zainstalowane działają bez zmian
    en:
      - On a machine cut off from the network a program starts with a delay or with a warning that it could not be checked
      - The organisation's own unsigned tools draw a warning exactly as an unknown program does
      - People then learn to click through the warning - the proper answer is to sign the tools, not to switch the filter off
      - Services, scheduled tasks, server roles and programs already installed work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje w sieci wydzielonej bez wyjścia na zewnątrz, a uruchamiane na niej narzędzia własne nie są podpisane
    en:
      - The machine works on a segregated network with no way out and the own tools started on it are not signed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnableSmartScreen'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnableSmartScreen'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A reputation filter asks about provenance, not contents: whether the file
    # is known at all, who signed it, whether it has been seen before. A program
    # built for a single campaign is new by definition, so no signature knows it.
    # On a server what is started is started with an administrator's rights.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableSmartScreen' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/

notes:
  pl: |
    Mechanizm bywa mylony z antywirusem. Antywirus pyta, czy plik zawiera
    coś znanego jako szkodliwe; filtr reputacyjny pyta, czy ten plik jest
    znany w ogóle, kto go podpisał i czy widziano go wcześniej.

    Program złożony pod jedną kampanię jest nowy z definicji i żadna baza
    sygnatur o nim nie wie. Reputacja wie o nim jedno: że nikt go wcześniej
    nie widział.

    Na serwerze punkt ma sens węższy, ale nie żaden: uruchamia się tu mniej
    pobranych plików, za to z prawami administratora. Ten punkt włącza filtr,
    a osobny decyduje, czy ostrzeżenie da się pominąć.
  en: |
    The mechanism is confused with an antivirus. An antivirus asks whether a
    file contains something known to be harmful; a reputation filter asks
    whether the file is known at all, who signed it, whether it has been seen
    before.

    A program put together for a single campaign is new by definition and no
    signature database knows of it. Reputation knows one thing: that nobody
    has seen it before.

    On a server the point is narrower but not absent: fewer downloaded files
    are started here, but they are started with an administrator's rights.
    This item turns the filter on; a separate one decides whether its warning
    can be got past.
