id: win2025-system-objects-case-insensitivity

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nazwy obiektów systemowych rozpatrywane bez rozróżniania wielkości liter
    en: System object names treated without distinguishing letter case
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe jądru rozpatrywać nazwy obiektów systemowych bez
    rozróżniania wielkości liter, niezależnie od tego, który podsystem
    o nie pyta.

    Obiekty, o których mowa, to wewnętrzne byty systemu: zdarzenia,
    muteksy, sekcje pamięci dzielonej, potoki. Programy posługują się
    nimi po nazwie i na nazwie opierają sprawdzenie, czy coś już
    istnieje.

    Niebezpieczeństwo bierze się z rozjazdu między dwoma sposobami
    patrzenia na tę samą nazwę. Program pyta o obiekt pisany jednym
    sposobem, sprawdzenie uprawnień albo sprawdzenie obecności idzie
    drugim, a napastnik zakłada wcześniej obiekt o nazwie różniącej się
    wyłącznie wielkością liter. Program, który sądzi, że tworzy swój
    obiekt, dostaje cudzy — i od tej chwili rozmawia z napastnikiem
    zamiast sam ze sobą.

    Punkt zamyka tę możliwość u źródła: skoro nazwy nie różnią się
    wielkością liter dla nikogo, to i podstawić się w ten sposób nie da.

    Na serwerze przestrzeń nazw obiektów jest ruchliwsza niż na
    stanowisku roboczym, bo pracuje w niej wiele usług naraz, często
    kilka wersji tej samej aplikacji, a przy roli serwera terminali —
    sesje wielu osób jednocześnie. Im więcej jest w tej przestrzeni
    uczestników, tym więcej okazji, żeby jeden podszył się pod
    drugiego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podstawienia własnego obiektu w miejsce obiektu usługi,
    z pomocą nazwy różniącej się wyłącznie wielkością liter.
  en: |
    The setting bids the kernel treat the names of system objects without distinguishing letter
    case, whichever subsystem asks after them.

    The objects spoken of are the system's inward beings: events, mutexes, sections of shared
    memory, pipes. Programs handle them by name and rest upon the name their check of whether
    something already is.

    The danger comes of a parting between two ways of looking at the same name. A program asks
    after an object written one way, the check of rights or the check of presence goes another
    way, and an attacker has beforehand made an object whose name differs in letter case alone.
    The program, holding that it makes its own object, gets another's - and from that moment
    speaks with the attacker instead of with itself.

    The item shuts that means at its source: names differing in case not differing for anyone,
    there is no putting oneself in the way by that road.

    On a server the namespace of objects is busier than at a working station, many services
    working in it at once, often several versions of the same application, and under the part of
    a terminal server - the sessions of many people at the same time. The more takers there are
    in that space, the more occasions for one to creep under another.

    What an attacker gains while the item goes unmet: the means of putting an object of their own
    in the place of a service's object, by a name differing in letter case alone.

disruption_description:
  pl: |
    Sprawdzenia wymaga tu jedna rzecz i nie jest nią skutek samej
    zmiany: zmiana wchodzi w życie dopiero po ponownym uruchomieniu
    maszyny.

    Podniosłem klasę względem paczki stanowiska roboczego wyłącznie
    z tego powodu. Stanowisko restartuje się samo, co kilka dni. Serwer
    pracuje miesiącami i jego restart jest zdarzeniem planowanym,
    uzgadnianym z ludźmi korzystającymi z usług. Zmiana, która bez
    restartu nie działa, nie należy więc na serwerze do trybu
    zbiorczego — nie dlatego, że coś psuje, tylko dlatego, że jej
    zastosowanie i jej zadziałanie to dwa różne momenty.

    Skutek samej zmiany jest natomiast żaden. Stan zgodny jest
    jednocześnie stanem domyślnym, a programy pracujące pod tym systemem
    nazw obiektów rozróżniających wielkością liter nie stosują.

    Zmiana nie dotyczy plików ani katalogów. Jest to nieporozumienie
    warte rozwiania, bo nazwa punktu sugeruje coś szerszego: mowa
    wyłącznie o obiektach jądra, a nie o systemie plików. Katalog
    oznaczony jako rozróżniający wielkość liter zachowuje się tak samo
    przed zmianą i po niej.

    Nie dotyczy też nazw kont, nazw udziałów, wpisów rejestru ani
    niczego, co widać w interfejsie.

    Jedyny przypadek, w którym miałoby to znaczenie, wiąże się
    z podsystemem zgodności z innym rodzajem systemów — tym samym,
    którego dotyczy punkt o pustej liście podsystemów opcjonalnych.
    Podsystem taki rozróżnia wielkość liter z natury i tam ustawienie
    to coś odbiera. Ponieważ jednak punkt siostrzany każe ten podsystem
    usunąć, przypadek ten w praktyce nie występuje.

    Zmiana wymaga ponownego uruchomienia maszyny, bo wartość czyta jądro
    przy starcie. Na serwerze znaczy to zaplanowanie restartu — samej
    zmiany nie trzeba jednak planować, bo do czasu restartu nic się nie
    dzieje.

    Wycofanie działa tak samo: wartość wraca od razu, zachowanie systemu
    dopiero po ponownym uruchomieniu.
  en: |
    One thing needs checking here and it is not the effect of the change itself: the change comes
    into force only after a fresh start of the machine.

    I raised the class against the working station's pack for that reason alone. A station
    restarts of itself, every few days. A server works for months and its restart is a planned
    happening, settled with the people using its services. A change that does not work without a
    restart does not, then, belong on a server in the bulk mode - not because it breaks anything
    but because its applying and its working are two different moments.

    The effect of the change itself is none. The compliant state is at once the default one, and
    the programs working under this system do not use object names distinguished by case.

    The change does not bear on files or catalogues. That misunderstanding is worth clearing, the
    item's name suggesting something wider: what is spoken of are kernel objects alone and not
    the file system. A catalogue marked as distinguishing case behaves the same before the change
    and after it.

    Neither does it bear on account names, share names, registry entries or anything seen in the
    interface.

    The one case where it would matter is bound up with the subsystem of likeness to another kind
    of system - the same the item on an empty list of optional subsystems bears upon. Such a
    subsystem distinguishes case by nature and there this setting takes something away. Since,
    however, the sister item bids that subsystem be removed, the case does not arise in practice.

    The change takes a fresh start of the machine, the kernel reading the value at its starting.
    On a server that means a restart to be planned - the change itself needs no planning, though,
    nothing happening until the restart.

    The undoing works the same: the value comes back at once, the system's behaviour only after a
    fresh start.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Pliki, katalogi, nazwy kont i wpisy rejestru nie są tym punktem dotknięte
      - Podsystem zgodności rozróżniający wielkość liter straciłby to rozróżnienie, ale punkt siostrzany każe go usunąć
      - Wartość czyta jądro przy starcie, więc do ponownego uruchomienia nic się nie zmienia
      - Stan zgodny jest jednocześnie stanem domyślnym
    en:
      - Files, catalogues, account names and registry entries are untouched by this item
      - A likeness subsystem distinguishing case would lose that distinction, but the sister item bids it be removed
      - The kernel reads the value at its starting, so nothing changes until a fresh start
      - The compliant state is at once the default one
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie celowo utrzymywany jest podsystem zgodności rozróżniający wielkość liter w nazwach obiektów
    en:
      - A likeness subsystem distinguishing letter case in object names is knowingly kept on the machine
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
      $name = 'ObCaseInsensitive'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
    $name = 'ObCaseInsensitive'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ObCaseInsensitive' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/system-objects-require-case-insensitivity-for-non-windows-subsystems

notes:
  pl: |
    Punkt dotyczy obiektów jądra — zdarzeń, muteksów, sekcji pamięci
    dzielonej — a nie systemu plików. Nazwa sugeruje coś szerszego
    i warto to rozwiać przy czytaniu raportu.

    Na serwerze przestrzeń nazw obiektów jest ruchliwsza, bo pracuje
    w niej wiele usług naraz, a przy roli serwera terminali — sesje
    wielu osób jednocześnie. Im więcej uczestników, tym więcej okazji
    do podszycia.

    Klasę podniosłem względem paczki stanowiska roboczego z powodu
    restartu, a nie skutku. Na serwerze zmiana wchodząca w życie
    dopiero po ponownym uruchomieniu nie należy do trybu zbiorczego.

    Czytaj razem z punktem o pustej liście podsystemów opcjonalnych.
    Tamten usuwa jedyny przypadek, w którym to ustawienie mogłoby
    komukolwiek przeszkadzać.
  en: |
    The item bears on kernel objects - events, mutexes, sections of shared memory - and not on
    the file system. The name suggests something wider and that is worth clearing at the reading
    of a report.

    On a server the namespace of objects is busier, many services working in it at once, and
    under the part of a terminal server - the sessions of many people at the same time. The more
    takers, the more occasions for creeping under another.

    I raised the class against the working station's pack by reason of the restart and not of
    the effect. On a server a change coming into force only after a fresh start does not belong
    in the bulk mode.

    Read together with the item on an empty list of optional subsystems. That one removes the
    only case where this setting could stand in anybody's way.
