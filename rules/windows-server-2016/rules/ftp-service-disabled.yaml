id: win2016-ftp-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera przesyłania plików starszym protokołem wyłączona
    en: The server service for transferring files by the older protocol disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przyjmuje połączenia protokołu przesyłania plików, powstałego
    w czasach, gdy sieć uznawano za miejsce zaufane, i pozwala pobierać
    z tej maszyny pliki oraz wgrywać je na nią.

    Kłopot z tym protokołem w jego postaci podstawowej jest znany i prosty:
    nazwa użytkownika i hasło idą przez sieć jawnie. Nie są zaszyfrowane,
    nie są nawet zasłonięte — kto słucha ruchu po drodze, ten je ma. Jest
    to własność konstrukcyjna, nie usterka, i nie da się jej wyłączyć
    ustawieniem.

    Rzecz druga jest mniej znana, a równie ważna. Konto używane do
    przesyłania plików bywa kontem domenowym, bo tak było wygodniej przy
    zakładaniu. Hasło przechwycone z takiego połączenia nie otwiera
    wtedy katalogu na serwerze, tylko konto w organizacji.

    Trzecia rzecz dotyczy kierunku. Serwer przyjmujący pliki jest miejscem,
    w którym ktoś z zewnątrz może zostawić plik na dysku maszyny. Gdy
    katalog przyjmujący pokrywa się z katalogiem witryny — a bywa, że
    pokrywa — droga od wgrania pliku do jego wykonania jest krótka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poświadczenia
    odczytane wprost z ruchu sieciowego oraz miejsce, w którym może zostawić
    własny plik na dysku maszyny.
  en: |
    The service takes in connections of the file transfer protocol, born in times when the
    network was held to be a trusted place, and allows files to be fetched from this
    machine and put onto it.

    The trouble with that protocol in its basic form is known and simple: the user name
    and the password go over the network in the clear. They are not encrypted, not even
    veiled - whoever listens to the traffic on the way has them. It is a property of its
    construction rather than a fault, and it cannot be switched off by a setting.

    The second matter is less known and as important. The account used for transferring
    files is at times a domain account, that having been the more convenient at the
    setting up. A password caught from such a connection then opens not a directory on the
    server but an account in the organisation.

    The third matter concerns direction. A server taking in files is a place where
    somebody from outside may leave a file on the machine's disk. Where the receiving
    directory overlaps a site's directory - and at times it does - the road from putting a
    file up to running it is a short one.

    What an attacker gains while the item goes unmet: credentials read straight off the
    network traffic, and a place where they may leave their own file on the machine's
    disk.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo przesyłanie plików tą drogą
    zwykle obsługuje wymianę z kimś z zewnątrz, a wymiany takiej nie
    przenosi się z dnia na dzień.

    Typowy układ wygląda tak: kontrahent, urządzenie pomiarowe, skaner
    albo system księgowy odkłada pliki na tym serwerze według harmonogramu
    ustalonego lata temu. Po wyłączeniu usługi odkładanie przestaje działać,
    a druga strona zwykle nie zgłasza tego natychmiast, bo po jej stronie
    też jest to zadanie nocne.

    Objaw jest więc opóźniony i niepełny: brakuje plików, których nikt nie
    liczy codziennie. Odkrywa się to przy zamknięciu okresu albo przy
    pytaniu, dlaczego czegoś nie ma.

    Druga strona sprawy jest taka, że przeniesienie tej wymiany na drogę
    szyfrowaną jest zwykle możliwe i warte zachodu niezależnie od tej
    reguły. Hasło idące jawnie przez sieć to koszt, który ponosi się
    codziennie, a nie ryzyko odległe.

    Warto sprawdzić przed wykonaniem dwie rzeczy: czy na maszynie istnieją
    konta założone wyłącznie do przesyłania plików i czy któreś z nich jest
    kontem domenowym. Drugie pytanie bywa ważniejsze niż samo wyłączenie
    usługi.

    Czego to nie psuje: udziałów sieciowych, obsługi witryn, poczty,
    uwierzytelniania, zarządzania zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", file transfer by this road as a rule serving an
    exchange with somebody outside, and such an exchange is not moved from one day to the
    next.

    The typical arrangement looks thus: a contractor, a measuring device, a scanner or an
    accounting system lays files down on this server by a schedule settled years ago. Once
    the service is off the laying down stops working, and the other side as a rule does
    not report it at once, it being a nightly task at their end too.

    The symptom is therefore put off and incomplete: files are missing that nobody counts
    daily. It is found at the closing of a period, or at the question why something is not
    there.

    The other side of the matter is that moving that exchange onto an encrypted road is as
    a rule possible and worth the trouble whatever this rule says. A password going in the
    clear over the network is a cost borne daily rather than a distant risk.

    Two things are worth checking before execution: whether accounts made solely for
    transferring files exist on the machine, and whether any of them is a domain account.
    The second question is at times weightier than the switching off of the service
    itself.

    What this does not break: network shares, the serving of sites, mail, authentication,
    or remote management.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Kontrahenci, skanery i systemy odkładające pliki na tym serwerze przestaną to robić, każdy według swojego harmonogramu
      - Druga strona zwykle nie zgłasza tego natychmiast, bo u niej też jest to zadanie nocne - brak plików odkrywa się przy zamknięciu okresu
      - Zadania pobierające pliki z tego serwera kończą się błędem połączenia przy najbliższym uruchomieniu
      - Udziały sieciowe, obsługa witryn, poczta i uwierzytelnianie pozostają bez zmian
    en:
      - Contractors, scanners and systems laying files down on this server will stop doing so, each by their own schedule
      - The other side as a rule does not report it at once, it being a nightly task at their end too - the missing files are found at the closing of a period
      - Tasks fetching files from this server end in a connection error at their next run
      - Network shares, the serving of sites, mail and authentication stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Wymiana plików z kontrahentami albo z urządzeniami odbywa się przez tę usługę i nie przygotowano drogi szyfrowanej
      - Na maszynie pracują konta założone wyłącznie do przesyłania plików i nie ustalono, co z nimi zrobić
    en:
      - File exchange with contractors or with devices goes through this service and no encrypted road has been prepared
      - Accounts made solely for transferring files work on the machine and it has not been settled what to do with them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'FTPSVC' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Transfers carried on by this protocol stop. Their credentials travel in
    # the clear, so a move to another road is worth making anyway.
    Stop-Service -Name 'FTPSVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'FTPSVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'FTPSVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/whats-new-in-iis-8/iis-80-ftp-logon-attempt-restrictions

notes:
  pl: |
    Punkt jest w bloku jedyny, przy którym argument za wdrożeniem nie
    opiera się na możliwym ataku, tylko na koszcie ponoszonym codziennie.
    Hasło idące jawnie nie jest ryzykiem warunkowym — jest stratą, która
    zachodzi za każdym połączeniem.

    Warto to pokazać inaczej niż pozostałe punkty. Pytanie nie brzmi „czy
    ktoś to wykorzysta", tylko „ile razy dziennie to hasło przechodzi przez
    sieć i kto po drodze ma do niego dostęp". Tak postawione pytanie
    rozstrzyga szybciej niż opis zagrożenia.

    Rzecz o kontach domenowych warto podnieść do poziomu osobnego
    ostrzeżenia. Reguła dotyczy usługi, ale największa szkoda przy tej
    usłudze bierze się z decyzji podjętej gdzie indziej — z tego, jakim
    kontem ktoś kiedyś tę wymianę skonfigurował. Aplikacja, która potrafi
    wypisać konta używane do przesyłania plików, powinna to zrobić obok
    tej reguły.
  en: |
    The item is the only one in the block at which the argument for rolling out rests not
    on a possible attack but on a cost borne daily. A password going in the clear is no
    conditional risk - it is a loss occurring at every connection.

    That is worth showing otherwise than the rest of the items. The question is not
    "will anybody use this" but "how many times a day does this password cross the network
    and who along the way has it". Put so, the question settles matters faster than any
    description of a threat.

    The matter of domain accounts is worth raising to a warning of its own. The rule
    concerns a service, but the greatest harm at this service comes of a decision taken
    elsewhere - of the account with which somebody once set that exchange up. An
    application able to list the accounts used for transferring files should do so beside
    this rule.
