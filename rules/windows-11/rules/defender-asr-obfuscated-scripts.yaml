id: win11-defender-asr-obfuscated-scripts

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wykonywania skryptów o zaciemnionej treści
    en: Obfuscated scripts blocked from running
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Skrypt jest tekstem i daje się przeczytać — dlatego atakujący go zaciemniają:
    kodują treść, składają polecenia ze znaków liczonych w locie, rozbijają nazwy
    na fragmenty sklejane przy uruchomieniu. Cel jest jeden: żeby to, co skrypt
    naprawdę robi, nie dało się zobaczyć ani przy przeglądaniu pliku, ani przy
    dopasowaniu do znanego wzorca.

    Ta reguła rozstrzyga nie po tym, co skrypt robi, lecz po tym, że został
    ukryty. Przesłanka jest słabsza niż przy pozostałych regułach z tej grupy
    — zaciemnienie samo w sobie nie jest atakiem — ale za to niezależna od
    znajomości konkretnego zagrożenia.
  en: |
    A script is text and can be read - which is why attackers obscure it: they
    encode the content, assemble commands from characters computed on the fly,
    break names into fragments joined at run time. The aim is one: that what the
    script really does cannot be seen either by looking at the file or by matching
    it against a known pattern.

    This rule decides not by what a script does, but by the fact that it has been
    hidden. The premise is weaker than in the other rules of this group -
    obfuscation is not in itself an attack - but in exchange it is independent of
    any knowledge of a specific threat.

disruption_description:
  pl: |
    Z całej grupy ta reguła najczęściej zatrzymuje coś, co jest w porządku,
    i trzeba to powiedzieć wprost. Kryterium jest z natury nieostre: „wygląda na
    ukryte" to ocena, a nie fakt.

    Zaciemnianie stosuje legalne oprogramowanie, i to z powodów, które nie mają
    nic wspólnego z ukrywaniem się. Skrypty instalacyjne spakowane i zakodowane
    przez producenta, żeby przeszły jednym plikiem. Skrypty z osadzoną
    zawartością binarną. Narzędzia komercyjne chroniące w ten sposób własny kod.
    Wszystkie one wyglądają tak samo jak to, co reguła ma blokować.

    Skutek widać wtedy przy instalacji albo aktualizacji konkretnego programu —
    w tym samym miejscu za każdym razem — a nie w codziennej pracy. Przed
    włączeniem warto przejść własne skrypty utrzymaniowe: kodowane polecenia
    trafiają się w nich częściej, niż się pamięta.
  en: |
    Of the whole group this rule most often stops something that is fine, and that
    should be said outright. The criterion is inherently fuzzy: "looks hidden" is
    a judgement, not a fact.

    Legitimate software obfuscates too, for reasons that have nothing to do with
    hiding. Installation scripts packed and encoded by the vendor so they travel
    as one file. Scripts with embedded binary content. Commercial tools protecting
    their own code this way. All of them look exactly like what the rule is meant
    to block.

    The effect then shows at the installation or update of one particular program
    - in the same place every time - rather than in daily work. Before turning it
    on it is worth going through one's own maintenance scripts: encoded commands
    turn up in them more often than one remembers.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
  what_breaks:
    pl:
      - Skrypty instalacyjne spakowane i zakodowane przez producenta mogą zostać zatrzymane
      - Własne skrypty utrzymaniowe używające kodowanych poleceń przestaną się wykonywać
      - Blokada trafia w to samo miejsce za każdym razem, więc objawia się przy aktualizacji jednego programu
    en:
      - Installation scripts packed and encoded by the vendor may be stopped
      - In-house maintenance scripts using encoded commands stop running
      - The block lands in the same place every time, so it surfaces at one program's update
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Używane oprogramowanie instaluje się skryptem spakowanym przez producenta
      - Własne skrypty utrzymaniowe korzystają z poleceń przekazywanych w postaci zakodowanej
    en:
      - Software in use installs itself with a script packed by the vendor
      - In-house maintenance scripts rely on commands passed in encoded form
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '5beb7efe-fd9a-4556-801d-275e5ffc04cc'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '5beb7efe-fd9a-4556-801d-275e5ffc04cc'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '5beb7efe-fd9a-4556-801d-275e5ffc04cc' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Kategoria ryzyka jest tu niższa niż w pozostałych regułach z grupy i to nie
    jest niedopatrzenie. Zaciemnienie jest cechą formy, nie czynności: skrypt
    zaciemniony i tak musi coś zrobić, a to coś blokują reguły oceniające
    zachowanie. Ten punkt dokłada warstwę, zamiast zamykać samodzielną drogę.

    To zarazem najlepszy kandydat z tej grupy do trybu zgłaszania na dłużej:
    kilka tygodni obserwacji pokazuje, ile legalnych rzeczy wpada tu na tej
    konkretnej maszynie, a odpowiedź bywa różna w zależności od zestawu
    zainstalowanego oprogramowania.
  en: |
    The risk category here is lower than in the rest of the group, and that is not
    an oversight. Obfuscation is a property of form, not of action: an obfuscated
    script still has to do something, and that something is blocked by the rules
    that judge behaviour. This item adds a layer rather than closing a route of
    its own.

    It is at the same time the best candidate in the group for a longer spell in
    reporting mode: a few weeks of observation show how many legitimate things
    land here on this particular machine, and the answer varies with the set of
    software installed.
