id: win2025-app-deployment-special-profiles-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji w profilach specjalnych zablokowane
    en: Installing of application packages in special profiles blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje instalowanie pakietów aplikacji w profilach specjalnych —
    tych, które nie należą do żadnego człowieka, tylko do samego systemu.

    Kategoria średnia i chcę nazwać, czym są profile specjalne, bo nazwa
    niczego nie tłumaczy. To profile kont wbudowanych oraz profile
    obowiązkowe i tymczasowe: miejsca, w których system trzyma stan sesji
    nieprzypisanych do konkretnej osoby. Nikt do nich nie zagląda, bo nie
    są niczyje.

    To jest właściwa treść punktu. Pakiet zainstalowany w takim profilu nie
    pojawi się na liście aplikacji żadnego użytkownika, a przegląd
    zainstalowanego oprogramowania prowadzony z konta administratora go nie
    pokaże. Jednocześnie pakiet jest w systemie, ma swoje wpisy i może
    zostać uruchomiony w kontekście, w którym nikt go nie szuka.

    Na serwerze osobno waży to, kto tych profili używa. Profile specjalne
    obsługują sesje usługowe i konta systemowe, a więc konteksty o szerokich
    uprawnieniach i bez nadzoru człowieka. To dokładnie to miejsce, w którym
    napastnik chce coś zostawić.

    Uwaga na wartość: nazwa wpisu jest twierdząca, więc stan pożądany jest
    zapisany zerem — zero oznacza „nie pozwalaj".

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce na
    pakiet, którego nie widać w przeglądzie zainstalowanego oprogramowania
    i które należy do kontekstu bez właściciela.
  en: |
    The item blocks the installing of application packages in special
    profiles - those which belong to no person but to the system itself.

    The category is medium, and I want to name what special profiles are,
    because the name explains nothing. They are the profiles of built-in
    accounts along with mandatory and temporary profiles: the places where
    the system keeps the state of sessions not assigned to any particular
    person. Nobody looks into them, because they are nobody's.

    That is the real substance of the item. A package installed in such a
    profile will not appear on any user's list of applications, and a review
    of installed software carried out from an administrator's account will
    not show it. At the same time the package is in the system, has its
    entries and can be started in a context where nobody is looking for it.

    On a server it weighs separately who uses those profiles. Special
    profiles serve service sessions and system accounts, and so contexts with
    broad rights and no human watching. That is exactly the place where an
    attacker wants to leave something.

    Mind the value: the entry's name is affirmative, so the desired state is
    written with a zero - zero means "do not allow".

    What an attacker gains while the item goes unmet: a place for a package
    invisible in a review of installed software, belonging to a context with
    no owner.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze rzadko jest co
    sprawdzać: pakietów aplikacji instaluje się tu niewiele, a w profilach
    specjalnych praktycznie wcale.

    Sprawdzenie dotyczy dwóch sytuacji. Pierwsza to maszyny z profilami
    obowiązkowymi — wtedy, gdy sesje użytkowników są stawiane z jednego
    wzorca, a nie z profilu osobistego. Jeżeli do takiego wzorca ktoś
    dokłada pakiet, ta droga się zamknie. Druga to stawianie maszyny
    z obrazu, w którym pakiety są instalowane w profilu domyślnym przed
    pierwszym logowaniem człowieka.

    W obu przypadkach objawem jest błąd instalacji pakietu, nie błąd jego
    działania — czyli awaria widoczna w trakcie przygotowania maszyny,
    a nie później u użytkownika. To jest dobre miejsce na awarię.

    Czego to nie psuje: pakietów już zainstalowanych, instalacji w zwykłym
    profilu użytkownika, instalacji dla całej maszyny, klasycznych
    instalatorów ani ról serwera.

    Bez restartu, niewidoczne, natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server there is rarely much to
    review: few application packages are installed here, and in special
    profiles practically none.

    The review concerns two situations. The first is machines with mandatory
    profiles - where user sessions are built from a single template rather
    than from a personal profile. If somebody adds a package to such a
    template, that road closes. The second is building a machine from an
    image in which packages are installed into the default profile before any
    person first signs in.

    In both cases the symptom is a failure to install the package, not a
    failure of it to work - a failure visible while the machine is being
    prepared rather than later at the user's desk. That is a good place for a
    failure.

    What this does not break: packages already installed, installing into an
    ordinary user profile, installing for the whole machine, classic
    installers, or server roles.

    No restart, invisible, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Dokładanie pakietu aplikacji do profilu obowiązkowego, z którego stawiane są sesje użytkowników, przestanie działać
      - Stawianie maszyny z obrazu, w którym pakiety trafiają do profilu domyślnego przed pierwszym logowaniem, wymaga zmiany kolejności
      - Objawem jest błąd instalacji pakietu, a nie błąd jego działania — awaria pojawi się przy przygotowaniu maszyny, nie u użytkownika
      - Pakiety już zainstalowane, instalacja w zwykłym profilu, instalacja dla całej maszyny i klasyczne instalatory działają bez zmian
    en:
      - Adding an application package to a mandatory profile from which user sessions are built stops working
      - Building a machine from an image in which packages go into the default profile before the first sign-in needs its order changed
      - The symptom is a failure to install the package, not a failure of it to work - it shows while the machine is prepared, not at the user's desk
      - Packages already installed, installing into an ordinary profile, installing for the whole machine and classic installers work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Sesje użytkowników są stawiane z profilu obowiązkowego, do którego dokłada się pakiety aplikacji, i nie ma dla tego innej drogi
    en:
      - User sessions are built from a mandatory profile to which application packages are added, and there is no other route for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name is affirmative, so the desired state is written with a
      # zero: zero means "do not allow".
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      $name = 'AllowDeploymentInSpecialProfiles'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowDeploymentInSpecialProfiles'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Special profiles belong to no person: built-in accounts, mandatory and
    # temporary profiles. A package installed there appears on nobody's list of
    # applications, yet it is in the system and can run in a context with broad
    # rights and no human watching.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDeploymentInSpecialProfiles' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-applicationmanagement

notes:
  pl: |
    Profile specjalne to profile kont wbudowanych oraz profile obowiązkowe
    i tymczasowe — miejsca, w których system trzyma stan sesji
    nieprzypisanych do konkretnej osoby. Nikt do nich nie zagląda, bo nie są
    niczyje.

    Pakiet zainstalowany w takim profilu nie pojawi się na liście aplikacji
    żadnego użytkownika, a przegląd zainstalowanego oprogramowania go nie
    pokaże. Jednocześnie jest w systemie i da się go uruchomić.

    Na serwerze waży to, że profile specjalne obsługują sesje usługowe
    i konta systemowe: szerokie uprawnienia, brak nadzoru człowieka.
  en: |
    Special profiles are the profiles of built-in accounts along with
    mandatory and temporary profiles - the places where the system keeps the
    state of sessions not assigned to any particular person. Nobody looks
    into them, because they are nobody's.

    A package installed in such a profile appears on no user's list of
    applications, and a review of installed software will not show it. At the
    same time it is in the system and can be started.

    On a server what weighs is that special profiles serve service sessions
    and system accounts: broad rights, no human watching.
