id: win11-standby-states-disabled-when-sleeping

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Power Management > Sleep Settings
  title:
    pl: Sen z zawartością pamięci wyłączony na rzecz hibernacji
    en: Sleep holding memory contents turned off in favour of hibernation
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Uśpienie występuje w dwóch postaciach. W jednej zawartość pamięci zostaje
    w układach pamięci, podtrzymywana prądem. W drugiej — w hibernacji — zostaje
    zapisana na dysk, a maszyna wyłącza się całkowicie.

    Różnica jest zasadnicza, gdy maszyna wpadnie w cudze ręce. Pamięć
    podtrzymywana prądem zawiera klucze szyfrowania dysku w postaci gotowej do
    użycia, bo sesja ma trwać dalej po wybudzeniu. Istnieją sposoby odczytania
    jej zawartości z pominięciem systemu, a więc i z pominięciem hasła, którego
    system żąda po wybudzeniu. Wymaga to dostępu do sprzętu i pewnej pracy, ale
    nie wymaga znajomości hasła ani żadnej luki w oprogramowaniu.

    Po zapisaniu stanu na dysk i wyłączeniu maszyny w pamięci nie zostaje nic,
    a zapisany stan leży na dysku zaszyfrowanym. Napastnik zastaje wtedy sprzęt
    wyłączony, czyli ten sam punkt wyjścia co przy zwykłym zamknięciu systemu.
  en: |
    Sleep comes in two forms. In one, the contents of memory stay in the memory
    chips, held there by power. In the other - hibernation - they are written to
    disk and the machine switches off entirely.

    The difference is fundamental once the machine falls into someone else's
    hands. Memory held by power contains the disk encryption keys ready for use,
    because the session is meant to carry on after waking. There are ways of
    reading its contents while bypassing the system, and so bypassing the password
    the system demands on waking. This takes access to the hardware and some
    work, but it takes no knowledge of the password and no software flaw.

    Once the state is written to disk and the machine switched off, nothing is
    left in memory, and the saved state lies on an encrypted disk. An attacker
    then finds the hardware switched off - the same starting point as after an
    ordinary shutdown.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak długo trwa na tej maszynie wybudzenie
    z hibernacji, bo tu leży cały koszt tego punktu.

    Maszyna przestaje zasypiać płytko i przechodzi od razu do hibernacji.
    Wybudzenie trwa wtedy nie sekundę, lecz kilkanaście — na starszym sprzęcie
    z dyskiem talerzowym nawet dłużej. Osoba, która zamyka pokrywę między
    spotkaniami kilkanaście razy dziennie, odczuje to natychmiast i dotkliwie.
    Na maszynie z dyskiem półprzewodnikowym różnica bywa na tyle mała, że nikt
    jej nie zgłasza.

    Osobna rzecz do sprawdzenia to miejsce na dysku. Zapisany stan zajmuje tyle,
    ile wynosi znaczna część pamięci maszyny — na komputerze z dużą pamięcią
    i małym dyskiem bywa to kilkadziesiąt gigabajtów.

    Wreszcie hibernacja przerywa połączenia sieciowe, bo maszyna faktycznie się
    wyłącza. Programy utrzymujące stałe połączenie odtworzą je po wybudzeniu,
    ale nie wszystkie robią to czysto — komunikatory i połączenia zdalne
    potrafią wymagać ponownego zalogowania.
  en: |
    What needs checking is how long waking from hibernation takes on this machine,
    because that is where the whole cost of the item lies.

    The machine stops sleeping shallowly and goes straight to hibernation. Waking
    then takes not a second but a dozen or so - on older hardware with a spinning
    disk, longer still. Somebody who closes the lid between meetings a dozen times
    a day will feel it at once and keenly. On a machine with a solid-state disk
    the difference is often small enough that nobody reports it.

    A separate thing to check is disk space. The saved state takes up as much as a
    good part of the machine's memory - on a computer with plenty of memory and a
    small disk that can be tens of gigabytes.

    Finally, hibernation breaks network connections, because the machine really
    does switch off. Programs holding a permanent connection will rebuild it on
    waking, but not all do so cleanly - messaging apps and remote connections can
    demand a fresh sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
    - boot-and-firmware
    - network-and-firewall
  what_breaks:
    pl:
      - Wybudzenie potrwa kilkanaście sekund zamiast jednej, a na dysku talerzowym dłużej
      - Na dysku ubędzie miejsca odpowiadającego znacznej części pamięci maszyny
      - Połączenia sieciowe zostaną przerwane, a komunikatory i połączenia zdalne mogą wymagać ponownego zalogowania
    en:
      - Waking takes a dozen or so seconds instead of one, and longer on a spinning disk
      - Disk space is consumed matching a good part of the machine's memory
      - Network connections are broken, and messaging apps and remote connections may demand a fresh sign-in
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna ma dysk talerzowy i jest usypiana wielokrotnie w ciągu dnia
      - Na dysku brakuje miejsca na zapisanie stanu pamięci
      - Stanowisko utrzymuje połączenia, których przerwanie jest kosztowne
    en:
      - The machine has a spinning disk and is put to sleep many times a day
      - There is not enough disk space to save the memory state
      - The station holds connections whose breaking is costly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One setting in two power variants. The report gives the weaker of them,
      # because a portable machine moves between the two by itself and is
      # protected only as far as the worse variant protects it.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $ac = $item.ACSettingIndex
        $dc = $item.DCSettingIndex
        if ($null -eq $ac -or $null -eq $dc) { 'MISSING' }
        elseif ([int]$ac -eq 0 -and [int]$dc -eq 0) { 'HIBERNATE_ONLY' }
        else { 'AC=' + $ac + ' DC=' + $dc }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: HIBERNATE_ONLY
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      ac          = $item.ACSettingIndex
      dc          = $item.DCSettingIndex
      ac_existed  = ($null -ne $item.ACSettingIndex)
      dc_existed  = ($null -ne $item.DCSettingIndex)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ACSettingIndex' -Value 0 -Type DWord
    Set-ItemProperty -Path $path -Name 'DCSettingIndex' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.ac_existed) {
      Set-ItemProperty -Path $b.path -Name 'ACSettingIndex' -Value $b.ac -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ACSettingIndex' -ErrorAction SilentlyContinue
    }
    if ($b.dc_existed) {
      Set-ItemProperty -Path $b.path -Name 'DCSettingIndex' -Value $b.dc -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DCSettingIndex' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby

notes:
  pl: |
    Punkt zakłada, że dysk jest szyfrowany. Bez szyfrowania hibernacja przenosi
    zawartość pamięci z układów pamięci na dysk czytelny dla każdego, kto ten
    dysk wymontuje — czyli pogarsza sytuację, zamiast ją poprawiać. Reguła nie
    potrafi tego sprawdzić sama i jest to jej znane ograniczenie, które trzeba
    czytać razem z regułami dotyczącymi szyfrowania dysku.

    Na części nowszych maszyn przenośnych ustawienie nie zmienia zachowania,
    bo sprzęt korzysta z nowoczesnego trybu czuwania, który zachowuje się
    inaczej niż klasyczne usypianie. Wartość zostanie wtedy zapisana i punkt
    będzie spełniony, choć maszyna dalej zasypia płytko. Jest to dokładnie ten
    przypadek, w którym raport mówi prawdę o zasadzie i nieprawdę o maszynie —
    i dlatego zostaje tu zapisany, zamiast być przemilczany.
  en: |
    The item assumes the disk is encrypted. Without encryption, hibernation moves
    the contents of memory from the memory chips onto a disk readable by anybody
    who removes it - that is, it makes things worse rather than better. The rule
    cannot check this itself and that is a known limitation of it, to be read
    together with the rules about disk encryption.

    On some newer portable machines the setting does not change behaviour, because
    the hardware uses a modern standby mode that behaves differently from classic
    sleep. The value will then be written and the item satisfied, though the
    machine still sleeps shallowly. This is precisely the case where the report
    tells the truth about the policy and an untruth about the machine - and so it
    is written down here rather than passed over in silence.
