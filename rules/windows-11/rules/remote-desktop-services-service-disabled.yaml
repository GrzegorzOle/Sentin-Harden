id: win11-remote-desktop-services-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa pulpitu zdalnego wyłączona
    en: The Remote Desktop service disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przyjmuje połączenia pulpitem zdalnym: uwierzytelnia je, zestawia
    sesję i wystawia w sieci port, na którym nasłuchuje. Dopóki działa, maszyna
    jest osiągalna przez sieć dla każdego, kto zna adres i ma poświadczenia.

    Jest to najczęściej wykorzystywana droga wejścia na maszyny z systemem
    Windows i nie jest to opinia — wynika to z tego, jak ta droga wygląda
    z zewnątrz. Nie trzeba uruchamiać żadnego kodu, nie trzeba niczego
    dostarczać na maszynę, nie trzeba omijać ochrony antywirusowej. Wystarczy
    nazwa konta i hasło, a jedno i drugie da się kupić albo zgadnąć.

    Zgadywanie jest tu zresztą realną metodą, a nie teorią. Usługa wystawiona
    do sieci przyjmuje próby logowania bez ograniczenia tempa po stronie
    protokołu, a blokada konta — jeśli w ogóle jest ustawiona — zatrzymuje
    tylko atak na jedno konto, nie na listę kont.

    Reszta reguł tej paczki dotyczących pulpitu zdalnego utwardza tę drogę:
    szyfrowanie, uwierzytelnianie przed zestawieniem sesji, ograniczenie
    przekierowań, limity czasu. Ten punkt mówi co innego — że na stacji
    roboczej tej drogi może nie być wcale.
  en: |
    The service takes Remote Desktop connections: it authenticates them, sets up a
    session and puts out a port on the network to listen on. While it runs, the machine
    is reachable over the network by anybody who knows the address and holds credentials.

    It is the most used way into Windows machines, and that is not an opinion - it
    follows from what the route looks like from outside. No code has to be run, nothing
    has to be delivered to the machine, no antivirus protection has to be got round. A
    account name and a password are enough, and both can be bought or guessed.

    Guessing is, at that, a real method here rather than a theory. A service put out to
    the network takes sign-in attempts with no limit on their pace on the protocol's
    part, and locking an account - if it is set at all - stops an attack on one account
    alone, not on a list of them.

    The rest of this pack's Remote Desktop rules harden that route: encryption,
    authentication before the session is set up, limits on redirection, limits on time.
    This item says something else - that on a workstation the route need not be there at
    all.

disruption_description:
  pl: |
    To jest zmiana, którą trzeba uzgodnić, a nie wdrożyć i obserwować.

    Po wyłączeniu usługi maszyna przestaje przyjmować jakiekolwiek połączenia
    pulpitem zdalnym. Dotyczy to wszystkich naraz: serwisu zdalnego działu
    informatycznego, pracy z domu przez tę maszynę, dostępu do niej
    z komputera przenośnego, narzędzi pomocy zdalnej opartych na tym
    mechanizmie.

    Najdotkliwszy jest przypadek maszyny, do której ktoś łączy się z zewnątrz
    jako do własnego stanowiska. Wyłączenie usługi odcina tę osobę od jej
    pracy w sposób natychmiastowy i nieodwracalny zdalnie — żeby cofnąć
    zmianę, trzeba mieć do maszyny dostęp inną drogą. Jest to powód, dla
    którego punkt nie nadaje się do trybu zbiorczego pod żadnym warunkiem.

    Osobno warto sprawdzić, czy dział informatyczny nie prowadzi serwisu
    właśnie tą drogą. Wyłączenie usługi na maszynie zdalnej bez przygotowanego
    zastępstwa oznacza wyjazd do niej.

    Zamiennikiem dla serwisu jest zdalne zarządzanie oparte na poleceniach albo
    narzędzie pomocy zdalnej działające niezależnie od tej usługi. Zamiennika
    dla pracy zdalnej na tej maszynie zwykle nie ma — wtedy właściwym wynikiem
    jest świadome odpuszczenie punktu, zapisane z uzasadnieniem.

    Zmiana wymaga zatrzymania usługi, więc sesje otwarte zostaną zerwane.
  en: |
    This is a change to be agreed, not applied and watched.

    Once the service is off the machine stops taking Remote Desktop connections of any
    kind. That covers all of them at once: the computing department's remote support,
    working from home through this machine, reaching it from a portable computer, remote
    help tools resting on this mechanism.

    The most severe case is a machine somebody connects to from outside as to their own
    workstation. Disabling the service cuts that person off from their work at once and
    in a way that cannot be undone remotely - to undo the change one has to reach the
    machine by another route. That is why the item does not suit bulk mode on any terms.

    Whether the computing department runs its support by exactly this route is worth
    checking separately. Disabling the service on a remote machine with no replacement
    ready means travelling to it.

    The replacement for support is remote management resting on commands, or a remote
    help tool working independently of this service. For remote work on this machine
    there is usually no replacement - and then the right outcome is a deliberate
    acceptance of the item, written down with a reason.

    The change takes stopping the service, so open sessions will be broken off.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Maszyna przestaje przyjmować jakiekolwiek połączenia pulpitem zdalnym
      - Sesje otwarte w chwili zmiany zostają zerwane wraz z zatrzymaniem usługi
      - Serwis zdalny prowadzony tą drogą wymaga dostępu do maszyny na miejscu
      - Połączenia wychodzące z tej maszyny do innych działają dalej bez zmian
    en:
      - The machine stops taking Remote Desktop connections of any kind
      - Sessions open at the moment of the change are broken off as the service stops
      - Remote support run by this route takes reaching the machine in person
      - Connections going out from this machine to others carry on working unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktokolwiek pracuje na tej maszynie zdalnie i nie ma innej drogi dostępu
      - Serwis zdalny działu informatycznego opiera się na pulpicie zdalnym do tej maszyny
      - Maszyna stoi w miejscu, do którego dojazd jest kosztowny albo niemożliwy w krótkim czasie
    en:
      - Anybody works on this machine remotely and has no other way in
      - The computing department's remote support rests on Remote Desktop to this machine
      - The machine stands in a place costly or impossible to reach quickly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off any session open at this moment, including
    # a session this command is being run from.
    Stop-Service -Name 'TermService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'TermService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'TermService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Punkt jest pierwszym w tej paczce, przy którym trzeba powiedzieć wprost:
    uruchomienie go z poziomu aplikacji przez sesję pulpitu zdalnego przerywa
    tę właśnie sesję. Polecenie wykona się do końca, ale wynik ponownego audytu
    nie wróci do aplikacji. Wdrażać należy z konsoli na miejscu albo inną drogą
    zdalną.

    Wyłączenie usługi jest szersze niż zablokowanie połączeń zasadą, która
    w tej paczce nie ma osobnej reguły. Zasada zostawia usługę uruchomioną
    i nasłuchującą; ten punkt zdejmuje ją z maszyny wraz z portem.

    Dwie usługi towarzyszące — konfiguracja pulpitu zdalnego i przekierowanie
    portów — mają w tej paczce własne reguły. Wyłączenie samej usługi głównej
    nie wyłącza tamtych i nie zwalnia z ich ustawienia.

    Punkt nie dotyczy połączeń wychodzących. Klient pulpitu zdalnego na tej
    maszynie działa dalej i dalej łączy się do innych maszyn.
  en: |
    The item is the first in this pack where it has to be said outright: running it from
    the application through a Remote Desktop session breaks off that very session. The
    command will run to the end, but the result of the re-audit will not come back to
    the application. It should be applied from a console in person or by another remote
    route.

    Disabling the service reaches further than blocking connections by a policy, which
    has no rule of its own in this pack. The policy leaves the service running and
    listening; this item takes it off the machine along with the port.

    Two accompanying services - Remote Desktop configuration and port redirection - have
    rules of their own in this pack. Disabling the main service alone does not disable
    those and does not excuse leaving them unset.

    The item does not concern outgoing connections. The Remote Desktop client on this
    machine carries on working and carries on connecting to other machines.
