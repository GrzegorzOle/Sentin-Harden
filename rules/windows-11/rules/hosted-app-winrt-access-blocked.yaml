id: win11-hosted-app-winrt-access-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App runtime
  title:
    pl: Uruchamianie aplikacji z dostępem do systemu z treści zdalnej zablokowane
    en: Launching applications with system access from remote content blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy aplikacja, której zawartość pochodzi ze zdalnego
    adresu, może zostać uruchomiona z dostępem do systemowego zestawu
    interfejsów programowych.

    Warto rozpisać, o jaką konstrukcję chodzi, bo nie jest ona powszechnie
    znana. Aplikacja tego rodzaju wygląda jak zainstalowany program — ma
    ikonę, nazwę i uprawnienia — ale jej treść nie leży na maszynie. Jest
    pobierana przy każdym uruchomieniu spod adresu wpisanego w jej opisie.
    Program jest więc powłoką; tym, co się wykonuje, jest to, co akurat pod
    tym adresem leży.

    Rozstrzygające jest to, że taka aplikacja ma dostęp do systemowego
    zestawu interfejsów, czyli do plików, urządzeń, poświadczeń i sieci
    w zakresie przyznanym jej przy instalacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zmiany tego, co maszyna wykonuje, bez dotykania maszyny. Wystarczy
    podmienić treść pod adresem — na serwerze, który przejął, albo przez
    przechwycenie połączenia — a przy następnym uruchomieniu aplikacja
    wykona nowy kod z dotychczasowymi uprawnieniami.

    Mechanizmy sprawdzające, co jest na maszynie, nie mają tu czego znaleźć.
    Aplikacja jest ta sama, podpis jest ten sam, plik się nie zmienił.
    Zmieniło się to, co aplikacja pobiera — a tego nie widzi ani kontrola
    zainstalowanego oprogramowania, ani sprawdzenie plików na dysku.
  en: |
    The setting settles whether an application whose content comes from a remote address
    may be started with access to the system's set of programming interfaces.

    It is worth setting out what construction this concerns, since it is not widely known.
    An application of this kind looks like an installed program - it has an icon, a name
    and rights - but its content does not lie on the machine. It is fetched at every start
    from the address written into its description. The program is therefore a shell; what
    runs is whatever lies at that address at the time.

    What settles the matter is that such an application has access to the system's set of
    interfaces, that is, to files, devices, credentials and the network within the range
    granted it at installation.

    What an attacker gains while the item goes unmet: the means of changing what the
    machine runs without touching the machine. It is enough to substitute the content at
    the address - on a server they have taken over, or by intercepting the connection -
    and at the next start the application will run new code with the rights it had.

    Mechanisms checking what is on the machine have here nothing to find. The application
    is the same, the signature is the same, the file has not changed. What changed is what
    the application fetches - and that is seen neither by a check of installed software
    nor by a check of the files on the disk.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie stoi aplikacja tej konstrukcji —
    a jest to konstrukcja rzadka i rzadko rozpoznawana.

    Zwykłe aplikacje ze sklepu i programy instalowane klasycznie nie są jej
    przedmiotem i zmiana ich nie dotyczy. Konstrukcja ta bywa natomiast
    używana w aplikacjach wewnętrznych, przygotowywanych na zamówienie: jest
    wygodnym sposobem wydania aplikacji, której treść aktualizuje się bez
    ponownej instalacji.

    Po zmianie taka aplikacja nie uruchomi się. Komunikat wskaże zasadę, ale
    nie powie, czego dotyczy, więc rozpoznanie przyczyny bywa długie, jeżeli
    nikt nie wie, że aplikacja jest tak zbudowana.

    To jest właśnie rzecz warta sprawdzenia przed wdrożeniem: dostawca
    aplikacji wewnętrznej nie zawsze o tym mówi, bo z jego punktu widzenia
    jest to szczegół wydania, a nie cecha aplikacji.

    Zmiana nie wymaga restartu. Aplikacje pozostałe działają bez zmiany.
  en: |
    What needs checking is whether an application of this construction stands on the
    machine - and it is a rare construction, rarely recognised.

    Ordinary applications from the store and programs installed in the classical way are
    not its subject and the change does not concern them. The construction is, however,
    sometimes used in in-house applications made to order: it is a convenient way of
    issuing an application whose content is updated without a fresh installation.

    After the change such an application will not start. The message will point to a
    policy but will not say what it concerns, so recognising the cause is sometimes slow
    if nobody knows the application is built that way.

    That is exactly the thing worth checking before a rollout: the supplier of an in-house
    application does not always say so, since from their point of view it is a detail of
    issuing rather than a feature of the application.

    The change takes no restart. The remaining applications work unchanged.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - network-and-firewall
  what_breaks:
    pl:
      - Aplikacja pobierająca swoją treść ze zdalnego adresu nie uruchomi się
      - Aplikacje wewnętrzne wydane w ten sposób wymagają przebudowania przez dostawcę
      - Komunikat wskazuje zasadę, ale nie mówi, czego dotyczy
      - Aplikacje ze sklepu i programy instalowane klasycznie działają bez zmiany
    en:
      - An application fetching its content from a remote address will not start
      - In-house applications issued this way take rebuilding by their supplier
      - The message points to a policy but does not say what it concerns
      - Store applications and classically installed programs work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja wewnętrzna pobierająca swoją treść ze zdalnego adresu
      - Dostawca aplikacji nie potwierdził, w jaki sposób jest ona wydawana
    en:
      - An in-house application fetching its content from a remote address stands on the machine
      - The application's supplier has not confirmed how it is issued
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BlockHostedAppAccessWinRT'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'BlockHostedAppAccessWinRT' -ErrorAction SilentlyContinue).'BlockHostedAppAccessWinRT'
    [pscustomobject]@{
      path        = $path
      name        = 'BlockHostedAppAccessWinRT'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockHostedAppAccessWinRT' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/uwp/xaml-platform/

notes:
  pl: |
    Reguła jest w tej paczce jedną z niewielu, które odnoszą się do kodu
    nieobecnego na maszynie. Warto to mieć na uwadze przy czytaniu raportu:
    inwentaryzacja oprogramowania nie pomoże tu ocenić, czy zmiana kogoś
    zaboli, bo aplikacja tej konstrukcji wygląda w spisie tak samo jak każda
    inna.

    Ustalenie, czy maszyna ma taką aplikację, wymaga obejrzenia opisów
    zainstalowanych pakietów pod kątem wskazanego w nich adresu zdalnego.
    Bez tego kroku ocena uciążliwości jest zgadywaniem.

    Brak wartości nie jest stanem zgodnym, bo domyślnie uruchomienie bywa
    dozwolone.

    Klucz jest wspólny z kilkunastoma innymi regułami w tej paczce, więc
    wycofanie usuwa wyłącznie tę jedną wartość.
  en: |
    The rule is one of the few in this pack that bear on code not present on the machine.
    Worth bearing in mind when reading the report: an inventory of software will not help
    judge whether the change will hurt anybody, since an application of this construction
    looks in the list just like any other.

    Establishing whether the machine has such an application takes looking over the
    descriptions of the installed packages for a remote address named in them. Without
    that step the judgement of disruption is guesswork.

    A missing value is not a compliant state, since by default the starting is sometimes
    allowed.

    The key is shared with more than a dozen other rules in this pack, so undoing removes
    that one value alone.
