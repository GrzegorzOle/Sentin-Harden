id: win10-guest-account-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konto gościa wyłączone
    en: The guest account switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wbudowane konto gościa — konto bez hasła, o stałym
    identyfikatorze kończącym się na 501.

    Wartość tej reguły nie polega na tym, że ktoś zaloguje się jako gość przy
    ekranie. To bywa zablokowane osobnymi regułami i rzadko jest drogą
    rzeczywistą. Polega na tym, czym konto gościa jest dla usług sieciowych
    maszyny.

    Gdy konto gościa działa, połączenie przychodzące, które nie poda
    poświadczeń rozpoznawanych przez maszynę, może zostać przypisane do
    gościa zamiast zostać odrzucone. Znaczy to, że zasoby udostępnione
    wszystkim stają się dostępne dla każdego, kto dosięgnie maszyny po sieci —
    bez konta, bez hasła i bez śladu w dzienniku mówiącego, kim był.

    Ostatnia część jest najważniejsza. Zdarzenia zapisane dla konta gościa
    nie wskazują człowieka ani maszyny, więc po fakcie nie da się ustalić,
    kto czytał. Wyłączenie konta zamienia ten stan na czysty błąd odmowy
    dostępu, który w dzienniku wygląda jednoznacznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    zasobów udostępnionych wszystkim, bez konta i bez śladu pozwalającego go
    później wskazać.
  en: |
    The setting switches off the built-in guest account - an account without a password, with a fixed identifier
    ending in 501.

    This rule's value does not rest on somebody logging in as a guest at the screen. That is at times blocked by
    separate rules and is seldom a real road. It rests on what the guest account is to the machine's network
    services.

    Where the guest account works, an incoming connection that gives no credentials the machine knows may be
    assigned to the guest rather than refused. That means resources shared to everybody become reachable by
    anybody who can get at the machine over the network - without an account, without a password and without a
    trace in the log saying who they were.

    That last part is the weightiest. Events written for the guest account point to no person and no machine, so
    after the fact it cannot be settled who read what. Switching the account off turns that state into a clean
    access-denied error, which in the log looks unambiguous.

    What an attacker gains while the item goes unmet: access to resources shared to everybody, without an
    account and without a trace by which they might later be named.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czy coś na tej
    maszynie udostępnia się bez poświadczeń.

    Przypadek pierwszy to udział plikowy, z którego korzysta się bez podawania
    hasła. Bywa tak przy udziałach roboczych zakładanych doraźnie i przy
    katalogach dla urządzeń, które hasła podać nie umieją. Po zmianie dostęp
    do nich wymaga konta.

    Przypadek drugi to drukarki udostępnione z tej maszyny. Klient, który
    łączy się bez poświadczeń, po zmianie zacznie dostawać odmowę.
    Objawia się to jako drukarka niedostępna, a nie jako błąd logowania,
    więc rozpoznanie bywa mylące.

    Przypadek trzeci, najczęstszy i najłatwiejszy: skanery i urządzenia
    wielofunkcyjne odkładające pliki do katalogu na maszynie. Te niemal
    zawsze korzystają z konta bez hasła i niemal zawsze działają dalej
    po założeniu im konta własnego.

    Na maszynie, która niczego nie udostępnia, zmiana nie robi nic.

    Czego to nie psuje: logowania kont własnych, kont domenowych, aplikacji,
    usług systemowych, połączenia z zasobami cudzymi, drukowania na
    drukarkach cudzych.
  en: |
    The class is "needs review", and the review touches whether anything on this machine gets shared without
    credentials.

    The first case is a file share used without a password being given. That happens with working shares set up
    for the occasion and with directories for devices that cannot give a password. After the change reaching
    them calls for an account.

    The second case is printers shared from this machine. A client joining without credentials will after the
    change begin getting a refusal. It shows itself as a printer unreachable rather than as a logon error, so
    the recognising misleads at times.

    The third case, the commonest and the easiest: scanners and multifunction devices laying files into a
    directory on the machine. Those nearly always use an account without a password and nearly always work on
    once an account of their own has been made for them.

    On a machine that shares nothing the change does nothing.

    What this does not break: logging on by one's own accounts, domain accounts, applications, system services,
    joining to somebody else's resources, or printing on somebody else's printers.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - printing
  what_breaks:
    pl:
      - Udział plikowy, z którego korzystano bez podawania hasła, zaczyna wymagać konta i hasła
      - Drukarka udostępniona z tej maszyny przestaje być dostępna dla klientów łączących się bez poświadczeń
      - Skaner lub urządzenie wielofunkcyjne odkładające pliki na tę maszynę przestaje to robić, dopóki nie dostanie konta własnego
      - Objaw przy drukarce wygląda na jej niedostępność, a nie na błąd logowania, więc rozpoznanie bywa mylące
      - Logowanie kont własnych, konta domenowe, aplikacje i usługi systemowe pozostają bez zmian
    en:
      - A file share used without a password being given begins calling for an account and a password
      - A printer shared from this machine ceases to be reachable by clients joining without credentials
      - A scanner or multifunction device laying files onto this machine ceases to do so until it is given an account of its own
      - The symptom at a printer looks like its being unreachable rather than a logon error, so the recognising misleads
      - Logging on by ones own accounts, domain accounts, applications and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tej maszyny korzystają urządzenia, które poświadczeń podać nie umieją, a konta własnego jeszcze im nie założono
      - Udział roboczy bez hasła jest jedyną drogą wymiany plików z maszynami spoza domeny
    en:
      - Devices unable to give credentials use this machine and no account of their own has yet been made for them
      - A working share without a password is the only road of exchanging files with machines outside the domain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $guest = Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-501' }
      if ($null -eq $guest) {
        # No built-in guest account in this edition - nothing to assess.
        'NOT_APPLICABLE'
      } elseif ($guest.Enabled) { 'ENABLED' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $guest = Get-LocalUser | Where-Object { $_.SID.Value -like '*-501' }
    [pscustomobject]@{
      sid     = (($guest.SID.Value) -join '')
      name    = (($guest.Name) -join '')
      enabled = [bool]($guest.Enabled)
      found   = ($null -ne $guest)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The account is switched off, not removed. Sharing to a name without a
    # password ceases to work - check that no share and no printer rests on it.
    $guest = Get-LocalUser | Where-Object { $_.SID.Value -like '*-501' }
    if ($null -eq $guest) { throw 'The built-in guest account was not found.' }
    Disable-LocalUser -SID $guest.SID

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.found) { throw 'Backup holds no guest account - nothing to restore.' }
    if ($b.enabled) { Enable-LocalUser -SID $b.sid } else { Disable-LocalUser -SID $b.sid }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-guest-account-status

notes:
  pl: |
    Reguła bywa oceniana po jej części najmniej ważnej — logowaniu jako gość
    przy ekranie — i opis świadomie tego unika. Rzecz dzieje się po sieci,
    a nie przy klawiaturze.

    Warto, żeby aplikacja postawiła argument o dzienniku równie wyraźnie co
    argument o dostępie. Dostęp bez hasła bywa świadomym wyborem i czasem ma
    sens; dostęp bez śladu, kto to był, nie ma go nigdy. Jest to ta część,
    o którą pyta audyt.

    Odnotowuję, że sprawdzenie zwraca „NOT_APPLICABLE", gdy konta gościa
    w danym wydaniu systemu nie ma. Jest to stan osobny, nie zgodność, i tak
    powinien być pokazywany — maszyna bez tego konta nie została utwardzona,
    tylko nie ma czego utwardzać.
  en: |
    The rule gets judged at times by its least important part - logging in as a guest at the screen - and the
    description avoids that knowingly. The matter happens over the network, not at the keyboard.

    It is well that the application put the argument about the log as plainly as the argument about access.
    Access without a password is at times a knowing choice and now and then makes sense; access without a trace
    of who it was never does. It is that part the audit asks about.

    Worth noting that the check returns "NOT_APPLICABLE" where the guest account does not exist in the edition
    at hand. It is a state apart, not compliance, and ought to be shown so - a machine without that account has
    not been hardened, it simply has nothing to harden.
