id: win2016-point-and-print-driver-installation-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Instalacja sterowników z serwera wydruku zastrzeżona dla administratorów
    en: The installing of drivers from a print server reserved for administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania użytkownikom bez uprawnień administratora
    instalować i aktualizować sterowniki pobierane z serwera wydruku.

    Mechanizm, o który tu chodzi, miał usunąć uciążliwość: użytkownik
    wskazuje drukarkę udostępnioną w sieci, a sterownik przychodzi z serwera
    i instaluje się sam. Nikt nie szuka płyty, nikt nie woła administratora.

    Cena tej wygody jest taka, że instalacja sterownika — a więc wykonanie
    kodu w przestrzeni jądra — zostaje wywołana przez wskazanie adresu
    sieciowego. Adres ten wskazuje użytkownik, a maszyna po drugiej stronie
    nie musi być serwerem wydruku tej organizacji. Wystarczy, że udaje
    serwer wydruku.

    Jest to droga krótsza niż poprzednia, bo nie wymaga nawet dostępu do
    tej maszyny z bliska. Wystarczy skłonić kogoś do wskazania drukarki
    albo podstawić nazwę w rozwiązywaniu nazw.

    Ustawienie to wprowadzono po serii luk, które ten wzorzec wykorzystały,
    i na wielu systemach jest dziś zachowaniem domyślnym. Nie znaczy to,
    że wpis jest zbędny — znaczy, że domyślność bywa przestawiana, a wpis
    tego pilnuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    kodu w przestrzeni jądra tej maszyny przez podstawienie się pod serwer
    wydruku, bez dostępu do niej z bliska.
  en: |
    The setting forbids users without administrator rights to install and update
    drivers fetched from a print server.

    The mechanism in question was to do away with a nuisance: a user names a printer
    shared on the network, and the driver comes from the server and installs itself.
    Nobody looks for a disc and nobody calls an administrator.

    The price of that convenience is that the installing of a driver - which is to
    say the running of code in the kernel's space - is set going by the naming of a
    network address. That address is named by the user, and the machine at the other
    end need not be the organisation's print server. It is enough that it pretends
    to be one.

    That road is shorter than the previous one, calling for no close access to this
    machine at all. It is enough to induce somebody to name a printer, or to
    substitute a name in name resolution.

    This setting was brought in after a run of gaps that used the pattern, and on
    many systems it is today the default behaviour. That does not make the entry
    needless - it means defaults are at times moved, and the entry sees to it.

    What an attacker gains while the item goes unmet: the running of code in this
    machine's kernel space by standing in for a print server, with no close access
    to it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy drukarki sieciowe
    są tu dodawane przez użytkowników.

    Na serwerze bez sesji interaktywnych wdrożenie nie zmienia nic. Na
    serwerze terminali zmienia sporo i jest to przypadek, o którym warto
    mówić osobno.

    Użytkownik sesji zdalnej, który dotąd wskazywał drukarkę
    udostępnioną w sieci i dostawał ją po kilku sekundach, teraz zobaczy
    prośbę o poświadczenia administratora. Nie mając ich, drukarki nie doda.

    To samo dotyczy aktualizacji sterownika na serwerze wydruku. Zmiana
    sterownika po stronie serwera nie rozejdzie się już sama na maszyny
    klienckie — każda z nich będzie czekać na administratora.

    Skutek jest przy tym opóźniony i to bywa mylące. Drukarki zainstalowane
    wcześniej pracują dalej, więc po wdrożeniu nic się nie psuje. Kłopot
    pojawia się przy pierwszej nowej drukarce albo pierwszej aktualizacji
    sterownika, czyli czasem wiele tygodni później.

    Odpowiedzią jest rozsyłanie drukarek i sterowników zasadami grupy albo
    narzędziem wdrożeniowym, a nie odpuszczenie punktu.

    Czego to nie psuje: drukowania na drukarkach już zainstalowanych,
    kolejek udostępnianych, usług, logowania.

    Wymaga zatrzymania usługi wydruku; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether network
    printers are added here by users.

    On a server with no interactive sessions the rollout changes nothing. On a
    terminal server it changes a good deal, and that is a case worth speaking of
    apart.

    A user of a remote session who until now named a printer shared on the network
    and had it within seconds will now see a request for an administrator's
    credentials. Not having them, they will not add the printer.

    The same holds for updating a driver on a print server. A change of driver on
    the server's side will no longer spread of itself to the client machines - each
    of them will wait for an administrator.

    The consequence is besides put off, and that is at times misleading. Printers
    installed earlier go on working, so nothing breaks after the rollout. The
    trouble appears at the first new printer or the first driver update, which is to
    say at times many weeks later.

    The answer is to send printers and drivers out by group policy or a deployment
    tool rather than to let the item go.

    What this does not break: printing on printers already installed, shared queues,
    services, or signing in.

    Calls for the print service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
    - remote-desktop
  what_breaks:
    pl:
      - Użytkownik sesji zdalnej wskazujący drukarkę udostępnioną w sieci zobaczy prośbę o poświadczenia administratora i drukarki nie doda
      - Zmiana sterownika na serwerze wydruku nie rozejdzie się już sama na maszyny klienckie
      - Skutek jest opóźniony - drukarki zainstalowane wcześniej pracują dalej, a kłopot pojawia się przy pierwszej nowej drukarce
      - Drukowanie na drukarkach już zainstalowanych i kolejki udostępniane pozostają bez zmian
    en:
      - A user of a remote session naming a printer shared on the network will see a request for an administrator's credentials and will not add it
      - A change of driver on a print server will no longer spread of itself to the client machines
      - The consequence is put off - printers installed earlier go on working, and the trouble appears at the first new printer
      - Printing on printers already installed and shared queues stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, a użytkownicy dodają sobie drukarki sieciowe i nie rozsyła się ich zasadami grupy
      - Sterowniki na serwerze wydruku są aktualizowane często, a maszyny klienckie nie mają innej drogi ich otrzymania
    en:
      - The machine is a terminal server where users add network printers themselves and these are not sent out by group policy
      - Drivers on the print server are updated often and the client machines have no other road of receiving them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
      $name = 'RestrictDriverInstallationToAdministrators'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    $name = 'RestrictDriverInstallationToAdministrators'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictDriverInstallationToAdministrators' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/point-and-print-default-behavior-change

notes:
  pl: |
    Punkt jest najmocniejszy z czterech ograniczających mechanizm
    pobierania sterowników z serwera i warto zaznaczyć, że dwie następne
    reguły są wobec niego wtórne. Tamte pilnują, żeby ostrzeżenie się
    pojawiło. Ten sprawia, że bez administratora instalacja nie następuje
    w ogóle — a więc ostrzeżenie przestaje mieć znaczenie.

    Warto powiedzieć, dlaczego mimo to wdraża się wszystkie trzy. Wpisy
    ostrzegawcze bronią w sytuacji, w której ten punkt zostanie
    przestawiony albo nie zadziała w danym scenariuszu. Jest to obrona
    warstwowa, a nie powtórzenie.

    Rzecz do postawienia w interfejsie: opóźniony charakter skutku. Reguła,
    która nic nie psuje w dniu wdrożenia i psuje coś po sześciu tygodniach,
    jest trudniejsza w utrzymaniu niż reguła psująca od razu. Warto to
    zapowiedzieć, bo inaczej przyczyna zostanie odnaleziona późno albo
    wcale.
  en: |
    The item is the strongest of the four limiting the mechanism of fetching drivers
    from a server, and it is worth marking that the next two rules are secondary to
    it. Those see to it that a warning appears. This one has it that without an
    administrator the installing does not happen at all - so the warning ceases to
    matter.

    Worth saying why all three are rolled out all the same. The warning entries
    guard in the case where this item is moved or does not take effect in a given
    scenario. It is a defence in layers rather than a repetition.

    A thing to put in the interface: the put-off nature of the consequence. A rule
    breaking nothing on the day of its rollout and breaking something six weeks
    later is harder to keep than a rule that breaks at once. That is worth
    foretelling, since otherwise the cause will be found late or not at all.
