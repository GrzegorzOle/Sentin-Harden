id: win2016-security-log-retention

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Security
  title:
    pl: Zachowanie dziennika zabezpieczeń po zapełnieniu
    en: Behaviour of the security log once it fills up
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, co dziennik zabezpieczeń robi po zapełnieniu: ma nadpisywać
    najstarsze wpisy, a nie zatrzymywać zapisu.

    Rozstrzygnięcie wygląda na ustępstwo i warto wytłumaczyć, dlaczego nim nie
    jest. Alternatywą jest ustawienie, przy którym dziennik po zapełnieniu
    przestaje przyjmować nowe wpisy do czasu ręcznego wyczyszczenia. Brzmi to
    bezpieczniej — nic nie przepada — ale skutek jest odwrotny od zamierzonego.

    Dziennik, który przestał przyjmować wpisy, jest dziennikiem, który przestał
    obserwować. Od tej chwili na maszynie nie powstaje żaden zapis zdarzeń
    zabezpieczeń, a stan taki trwa, dopóki ktoś tego nie zauważy i nie zareaguje.
    Napastnik potrzebujący ciszy nie musi wtedy wyłączać inspekcji — wystarczy,
    że zapełni dziennik.

    Nadpisywanie najstarszych wpisów oznacza natomiast, że obserwacja trwa
    zawsze, a traci się wyłącznie najdawniejszą historię. Jest to wybór między
    utratą przeszłości a utratą teraźniejszości i przeszłość przegrywa.

    Kategoria średnia: punkt nie zamyka drogi, lecz usuwa sposób na wyciszenie
    maszyny przez samo zapełnienie dziennika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania rejestrowania zdarzeń przez wygenerowanie ruchu, bez żadnych
    uprawnień administracyjnych.
  en: |
    The item settles what the security log does once it fills: it is to overwrite
    the oldest entries rather than stop writing.

    The decision looks like a concession and it is worth explaining why it is not
    one. The alternative is a setting under which the log, once full, stops taking
    new entries until cleared by hand. That sounds safer - nothing is lost - but the
    effect is the opposite of what was meant.

    A log that has stopped taking entries is a log that has stopped watching. From
    that moment no record of security events arises on the machine at all, and that
    state lasts until somebody notices and acts. An attacker needing silence then
    does not have to switch auditing off - it is enough to fill the log.

    Overwriting the oldest entries means, by contrast, that the watching never stops
    and only the most distant history is lost. It is a choice between losing the
    past and losing the present, and the past loses.

    The category is medium: the item closes no road, but it removes a way of
    quieting the machine by merely filling the log.

    What an attacker gains while the item goes unmet: the means of stopping the
    recording of events by generating traffic, with no administrative rights at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana dotyczy zachowania po zapełnieniu, więc na
    maszynie z dziennikiem, który się nie zapełnia, nie zmienia niczego.

    Tam, gdzie dziennik się zapełnia, zmiana jest odczuwalna w jednym miejscu:
    przestaje pojawiać się ostrzeżenie o pełnym dzienniku, bo dziennik nigdy
    pełny nie będzie. Organizacja, która na tym ostrzeżeniu opierała procedurę
    archiwizacji, musi ją oprzeć na czymś innym — na przykład na przekazywaniu
    zdarzeń do zbieracza.

    To jedyny realny koszt tej reguły i warto go nazwać wprost, bo bywa
    zaskoczeniem.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, archiwizacji
    prowadzonej harmonogramem ani przekazywania zdarzeń poza maszynę.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The change bears on behaviour once the log fills,
    so on a machine whose log does not fill it alters nothing.

    Where the log does fill, the change is felt in one place: the warning about a
    full log stops appearing, the log never being full. An organisation that rested
    its archiving procedure on that warning has to rest it on something else - on
    the forwarding of events to a collector, for instance.

    That is the rule's only real cost, and it is worth naming outright, because it
    comes as a surprise.

    What this does not break: the writing of events, the reading of the log,
    archiving driven by a schedule, or the forwarding of events off the machine.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — na maszynie z dziennikiem, który się nie zapełnia, nic się nie zmienia
      - Przestaje pojawiać się ostrzeżenie o pełnym dzienniku, bo dziennik nigdy pełny nie będzie
      - Procedura archiwizacji oparta na tym ostrzeżeniu wymaga oparcia na czymś innym
      - Najstarsze wpisy są nadpisywane, więc historia dalej wstecz niż pojemność dziennika przepada
    en:
      - No regression in the working - on a machine whose log does not fill nothing alters
      - The warning about a full log stops appearing, the log never being full
      - An archiving procedure resting on that warning has to be rested on something else
      - The oldest entries are overwritten, so history further back than the log's capacity is lost
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedura archiwizacji dzienników na tej maszynie jest wyzwalana ostrzeżeniem o pełnym dzienniku i nie ma innego wyzwalacza
    en:
      - The log archiving procedure on this machine is triggered by the full log warning and has no other trigger
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
      $name = 'Retention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A log that stops taking entries has stopped watching. Losing the oldest
    # history is the lesser harm.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/view-the-security-event-log

notes:
  pl: |
    Reguła jest przykładem punktu, w którym pozornie ostrzejsze ustawienie jest
    gorsze. Warto to w raporcie napisać wprost, bo administrator sprawdzający
    konfigurację może uznać zatrzymanie zapisu za wariant bezpieczniejszy
    i cofnąć zmianę.

    Punkt czyta się razem z rozmiarem dziennika. Nadpisywanie ma sens wtedy,
    gdy pojemność jest wystarczająca, żeby nadpisywana historia była naprawdę
    stara. Przy dzienniku o domyślnym rozmiarze nadpisywana jest historia
    sprzed kilku godzin i to jest problem tamtego punktu, nie tego.

    Trzecim elementem tej samej układanki jest przekazywanie zdarzeń poza
    maszynę. Dopiero ono sprawia, że nadpisywanie przestaje oznaczać utratę.
  en: |
    The rule is an example of an item where the seemingly stricter setting is the
    worse one. That is worth writing outright in the report, because an
    administrator checking the configuration may take the stopping of writing for
    the safer variant and undo the change.

    The item is read together with the log's size. Overwriting makes sense where the
    capacity suffices for the overwritten history to be truly old. With a log of the
    default size the history overwritten is a few hours old, and that is the other
    item's problem, not this one's.

    The third piece of the same puzzle is the forwarding of events off the machine.
    Only that makes overwriting cease to mean loss.
