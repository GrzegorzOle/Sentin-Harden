id: win11-enable-delegation-none

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Włączanie delegowania nieprzyznane nikomu
    en: Enabling delegation granted to no one
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Delegowanie to zgoda na to, żeby usługa działała wobec kolejnej usługi
    w imieniu użytkownika, który się do niej zgłosił. Serwer aplikacji sięga
    wtedy do bazy danych jako ten użytkownik, a nie jako on sam.

    Uprawnienie pozwala tę zgodę nadać — czyli oznaczyć konto komputera lub
    konto usługi jako zaufane do delegowania. Konto, które to potrafi, może
    przygotować sobie usługę zbierającą tożsamości wszystkich, którzy się do niej
    połączą, i używać ich dalej. To technika stosowana przeciwko całym domenom,
    a nie pojedynczym maszynom — i dlatego na stacji roboczej uprawnienie nie ma
    być przyznane nikomu.
  en: |
    Delegation is permission for a service to act towards a further service on
    behalf of the user who came to it. An application server then reaches the
    database as that user rather than as itself.

    The right allows that permission to be granted - that is, to mark a computer
    or service account as trusted for delegation. An account able to do so can
    prepare a service that collects the identities of everybody who connects to
    it and go on using them. This is a technique aimed at whole domains rather
    than single machines - which is why on a workstation the right is to be
    granted to nobody.

disruption_description:
  pl: |
    Nic. Uprawnienie ma znaczenie wyłącznie na kontrolerze domeny, bo tylko tam
    da się oznaczyć konto jako zaufane do delegowania. Na stacji roboczej jest
    puste z definicji i nie korzysta z niego nic.

    Punkt jest w praktyce sprawdzeniem, czy ktoś tej listy nie wypełnił — bo na
    tej maszynie nie miałby po temu żadnego powodu. Niepusta lista nie psuje
    niczego dzisiaj, ale znaczy, że maszyna była konfigurowana pod coś innego,
    niż wygląda, i warto ustalić pod co.
  en: |
    Nothing. The right matters only on a domain controller, because only there
    can an account be marked as trusted for delegation. On a workstation it is
    empty by definition and nothing uses it.

    In practice the item is a check on whether somebody has filled that list -
    because on this machine there would be no reason to. A non-empty list breaks
    nothing today, but means the machine was configured for something other than
    it appears, and it is worth establishing what.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
  what_breaks:
    pl:
      - Na stacji roboczej nie przestaje działać nic, bo uprawnienie nie ma tu zastosowania
      - Konta dopisane do listy ręcznie stracą to uprawnienie po zmianie
    en:
      - On a workstation nothing stops working, because the right has no application here
      - Accounts added to the list by hand lose the right after the change
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę kontrolera domeny albo jest do tej roli przygotowywana
    en:
      - The machine acts as a domain controller or is being prepared for that role
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeEnableDelegationPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeEnableDelegationPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeEnableDelegationPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enable-computer-and-user-accounts-to-be-trusted-for-delegation

notes:
  pl: |
    To punkt, którego wartość leży w wykryciu, a nie w naprawie. Na stacji
    roboczej lista jest pusta i punkt przechodzi bez żadnego działania; jeśli
    nie przechodzi, znalezisko jest ciekawsze niż sama poprawka i zasługuje na
    wyjaśnienie, zanim się je wyczyści.

    W paczce serwerowej ta reguła nie przenosi się wprost. Na kontrolerze domeny
    delegowanie bywa potrzebne i lista nie musi być pusta — wymagany zestaw jest
    tam inny, więc punkt wymaga własnej oceny, a nie skopiowania.
  en: |
    This is an item whose value lies in detection rather than in the fix. On a
    workstation the list is empty and the item passes with no action taken; if it
    does not pass, the finding is more interesting than the correction and
    deserves explaining before being cleared.

    In a server pack this rule does not carry over directly. On a domain
    controller delegation is sometimes needed and the list need not be empty - the
    required set there is different, so the item calls for its own assessment
    rather than a copy.
