id: win11-bitlocker-standard-user-pin-change-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Zmiana kodu startowego zastrzeżona dla administratorów
    en: Changing the startup code reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Kod odblokowujący dysk jest zabezpieczeniem przed napastnikiem, który
    komputer zabrał. Pozwolenie na jego zmianę użytkownikowi bez uprawnień
    administratora otwiera dwie drogi, z których żadna nie jest odległa.

    Pierwsza jest zwyczajna: użytkownik ustawia kod krótki i łatwy, bo wpisuje
    go codziennie i nikt nad tym nie stoi. Wymagana długość ogranicza szkodę,
    ale nie zmienia tego, że o jakości kodu rozstrzyga ten, komu najbardziej
    przeszkadza.

    Druga jest istotniejsza. Napastnik, który zdobył sesję użytkownika —
    przez złośliwy program albo przez odblokowany komputer — może kod zmienić na
    własny. Nie odbiera to dostępu właścicielowi od razu, ale przy następnym
    uruchomieniu maszyna należy do tego, kto zna nowy kod. Dla wymuszenia okupu
    albo dla utrudnienia reakcji jest to ruch tani i skuteczny.

    Zastrzeżenie zmiany dla administratorów zamyka obie drogi, zostawiając
    ścieżkę odzyskiwania tam, gdzie powinna być.
  en: |
    The code unlocking the disk is a safeguard against an attacker who has taken the
    computer. Letting a user without administrator rights change it opens two roads,
    neither of them far off.

    The first is ordinary: the user sets a short, easy code, because they type it
    daily and nobody stands over them. A required length limits the harm but does
    not change the fact that the code's quality is settled by whoever it inconveniences
    most.

    The second matters more. An attacker who has gained the user's session - through
    a malicious program or through an unlocked computer - can change the code to one
    of their own. That does not take access from the owner at once, but at the next
    start the machine belongs to whoever knows the new code. For extorting a ransom
    or for hampering a response it is a cheap and effective move.

    Reserving the change to administrators closes both roads, leaving the recovery
    path where it belongs.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak na stanowiskach obsługuje się zapomniany kod.

    Po zmianie użytkownik nie ustawi nowego kodu samodzielnie. Każda taka
    czynność — zapomniany kod, kod podejrzany o podpatrzenie, kod wymagający
    zmiany po zmianie stanowiska — wymaga obsługi przez kogoś z uprawnieniami.

    Ma to dwa skutki. Zgłoszenia trafiają do zespołu wsparcia, a nie kończą się
    same, więc ich liczba rośnie. I, co ważniejsze, użytkownik, który podejrzewa,
    że ktoś widział jego kod, nie może zareagować natychmiast — a szybka
    reakcja jest tu wartością samą w sobie.

    Oba skutki są do zniesienia przy działającym zespole wsparcia, natomiast na
    stanowiskach pracujących zdalnie i bez kontaktu z obsługą punkt wymaga
    rozważenia: użytkownik odcięty od pomocy i od możliwości zmiany kodu bywa
    odcięty również od pracy.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    What needs checking is how a forgotten code is handled at the stations.

    After the change a user cannot set a new code themselves. Every such task - a
    forgotten code, a code suspected of having been watched, a code needing a change
    after a move between stations - needs attending to by somebody with rights.

    This has two effects. Reports reach the support team rather than ending by
    themselves, so their number rises. And, more importantly, a user who suspects
    somebody saw their code cannot react at once - and a quick reaction is a worth
    in itself here.

    Both effects are bearable with a working support team, but at stations working
    remotely and out of contact with support the item calls for weighing: a user cut
    off from help and from the ability to change their code is sometimes cut off
    from work as well.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - boot-and-firmware
  what_breaks:
    pl:
      - Użytkownik bez uprawnień administratora nie zmieni kodu startowego samodzielnie
      - Zapomniany albo podpatrzony kod wymaga obsługi przez kogoś z uprawnieniami, co wydłuża reakcję
      - Stanowiska pracujące zdalnie bez kontaktu z obsługą mogą zostać bez drogi zmiany kodu
    en:
      - A user without administrator rights cannot change the startup code themselves
      - A forgotten or overlooked code needs attending to by somebody with rights, which lengthens the response
      - Stations working remotely out of contact with support may be left with no way to change the code
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska pracują zdalnie bez dostępu do obsługi mogącej ustawić nowy kod
    en:
      - The stations work remotely with no access to support able to set a new code
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'DisallowStandardUserPINReset'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'DisallowStandardUserPINReset'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisallowStandardUserPINReset' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt dotyczy zmiany kodu, a nie odzyskiwania dostępu. Klucz odzyskiwania
    działa niezależnie od tego ustawienia i maszyna z zapomnianym kodem daje się
    otworzyć tak samo jak wcześniej — pod warunkiem, że klucz jest gdzie trzeba.

    Ograniczenie ma sens dopiero na maszynie, na której użytkownicy nie są
    administratorami. Tam, gdzie każdy pracuje z pełnymi uprawnieniami, wpis
    istnieje, ale nie zmienia niczego — reguła zgłosi go jako spełniony
    i będzie to prawda formalna, nie faktyczna.
  en: |
    The item concerns changing the code, not recovering access. The recovery key
    works independently of this setting and a machine with a forgotten code can be
    opened just as before - provided the key is where it should be.

    The limit makes sense only on a machine where users are not administrators.
    Where everyone works with full rights the entry exists but changes nothing - the
    rule will report it as met, and that will be true formally rather than in fact.
