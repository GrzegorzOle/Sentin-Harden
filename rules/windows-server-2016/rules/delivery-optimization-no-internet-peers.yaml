id: win2016-delivery-optimization-no-internet-peers

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Delivery Optimization
  title:
    pl: Pobieranie aktualizacji od obcych maszyn w internecie wyłączone
    en: The fetching of updates from strange machines on the internet switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania pobierania części aktualizacji od obcych maszyn
    w internecie.

    Mechanizm powstał z powodu rachunku łącza: zamiast ściągać ten sam
    plik osobno na każdą maszynę, maszyny podają go sobie między sobą.
    W obrębie własnej sieci jest to rozwiązanie rozsądne i warte
    zachowania.

    Kłopot zaczyna się przy wariancie sięgającym poza własną sieć. Wtedy
    maszyna przyjmuje części plików od urządzeń, o których nie wie nic,
    i sama je rozdaje. Kryptografia broni przed podmianą treści —
    podpisy są sprawdzane i podrobiony fragment zostanie odrzucony.
    Nie broni jednak przed resztą.

    Reszta to dwie rzeczy. Pierwsza: maszyna nawiązuje połączenia
    z obcymi adresami i sama przyjmuje połączenia z zewnątrz, co na
    serwerze jest zachowaniem niepożądanym niezależnie od treści. Druga:
    to, czego maszyna szuka, mówi obserwatorowi, jakie ma wydanie
    i czego jej brakuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: widok na
    to, jakich aktualizacji maszyna szuka, oraz zestaw połączeń z nią
    i od niej poza obrębem organizacji.
  en: |
    The setting forbids parts of updates to be fetched from strange machines on the internet.

    The mechanism came about from the reckoning of a link: instead of the same file being drawn down separately
    onto every machine, the machines pass it among themselves. Within one's own network it is a sensible
    arrangement and worth keeping.

    The trouble begins at the variant reaching beyond one's own network. The machine then takes parts of files
    from devices it knows nothing about, and gives them out itself. Cryptography guards against a swapping of the
    content - signatures are checked and a counterfeit fragment will be thrown out. It does not guard against the
    rest.

    The rest is two things. The first: the machine makes connections to strange addresses and takes connections
    from outside itself, which on a server is unwanted behaviour whatever the content. The second: what the
    machine looks for tells an onlooker what release it holds and what it wants.

    What an attacker gains while the item goes unmet: a view of what updates the machine looks for, and a set of
    connections to it and from it outside the bounds of the organisation.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy rachunku łącza.

    Rzecz do ustalenia: czy aktualizacje rozchodzą się po serwerowni
    między sąsiednimi maszynami. Jeżeli tak, wartość jedynki jest
    właściwa — zostawia pobieranie w obrębie własnej sieci i odcina
    wyłącznie obce maszyny w internecie. Zwężenie mocniejsze zawróci
    cały ruch na łącze wychodzące, a przy kilkudziesięciu maszynach
    i aktualizacji liczonej w gigabajtach jest to różnica widoczna
    w rachunku.

    Objaw zwężenia zbyt mocnego jest przy tym mylący: aktualizacje nadal
    się instalują, tylko wolniej i z obciążeniem łącza. Nikt nie zgłosi
    awarii, bo awarii nie ma.

    Audyt przyjmuje kilka wartości, bo punkt spełnia każdy wariant
    nieobejmujący obcych maszyn w internecie. Wybór między nimi należy do
    organizacji i zależy od tego, jak rozprowadza aktualizacje.

    Czego to nie psuje: instalowania aktualizacji, ich źródła, zasad
    instalacji, ról serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the reckoning of the link.

    The thing to be established: whether updates spread about the server room between neighbouring machines. If
    they do, the value one is the right one - it leaves the fetching within one's own network and cuts off solely
    strange machines on the internet. A narrowing stronger than that will turn all the traffic back onto the
    outbound link, and at some dozens of machines and an update reckoned in gigabytes that is a difference visible
    in the bill.

    The symptom of too strong a narrowing is at that misleading: updates still install, only slower and with a
    load on the link. Nobody will report a fault, there being no fault.

    The audit accepts several values, the item being met by every variant that does not take in strange machines
    on the internet. The choice among them belongs to the organisation and hangs on how it spreads updates.

    What this does not break: the installing of updates, their source, the policies of installation, the server's
    roles, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna przestaje pobierać części aktualizacji od obcych urządzeń w internecie i sama im ich nie podaje
      - Przy zwężeniu mocniejszym niż konieczne cały ruch aktualizacji wraca na łącze wychodzące
      - Objaw zwężenia zbyt mocnego jest mylący, bo aktualizacje nadal się instalują, tylko wolniej
      - Pobieranie od sąsiednich maszyn w tej samej sieci zostaje zachowane przy wartości jeden
      - Instalowanie aktualizacji, ich źródło, role serwera i usługi systemowe pozostają bez zmian
    en:
      - The machine ceases to fetch parts of updates from strange devices on the internet and does not give them out to them
      - At a narrowing stronger than needed all the update traffic returns to the outbound link
      - The symptom of too strong a narrowing is misleading, updates still installing, only slower
      - The fetching from neighbouring machines on the same network is kept at the value one
      - The installing of updates, their source, the server roles and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aktualizacje docierają do tej maszyny wyłącznie przez mechanizm sięgający poza własną sieć
      - Nie ustalono, jak organizacja rozprowadza aktualizacje między maszynami
    en:
      - Updates reach this machine solely through the mechanism reaching beyond its own network
      - It has not been established how the organisation spreads updates between machines
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
      $name = 'DODownloadMode'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|1|2|99|100)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    $name = 'DODownloadMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Value 1 leaves the fetching from machines on the same network in place
    # and cuts off only strange ones on the internet. Where updates are spread
    # across the server room by neighbouring machines, do not narrow this
    # further - the traffic would all return to the outbound link.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DODownloadMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/do/waas-delivery-optimization-reference

notes:
  pl: |
    Punkt jest czwarty w bloku i jedyny, przy którym kanał ma dobre
    uzasadnienie techniczne. Warto to przyznać, zamiast opisywać
    mechanizm jako wadę — wadą jest wariant sięgający poza własną sieć,
    a nie samo podawanie sobie plików.

    Rzecz warta wyróżnienia w interfejsie dotyczy odczytu. Punkt spełnia
    kilka wartości, więc audyt porównuje wzorcem, a nie równością. Raport
    nie powinien pokazywać wartości zgodnej innej niż zalecana jako
    niezgodności, bo wybór między nimi należy do organizacji.

    Argument wart zachowania dotyczy granic kryptografii. Podpisy bronią
    treści i podrobiony fragment zostanie odrzucony; nie bronią przed
    tym, że maszyna nawiązuje i przyjmuje połączenia z obcymi adresami,
    ani przed tym, że jej zapytania mówią o wydaniu i brakach. Jest to
    przykład zabezpieczenia skutecznego w swoim zakresie i mylonego
    z zabezpieczeniem całości.

    Odnotowuję, że koszt ma tu postać rachunku za łącze, a nie awarii.
    Aplikacja powinna o tym mówić, bo koszt niewidoczny w zgłoszeniach
    bywa odkrywany dopiero przy fakturze.
  en: |
    The item is the fourth in the block and the only one at which the channel has a good technical warrant. That is
    worth owning rather than describing the mechanism as a flaw - the flaw is the variant reaching beyond one's own
    network, not the passing of files as such.

    A thing worth setting apart in the interface concerns the reading. Several values meet the item, so the audit
    compares by a pattern rather than by equality. The report ought not show a compliant value other than the
    recommended one as a non-compliance, the choice among them belonging to the organisation.

    The argument worth keeping concerns the bounds of cryptography. Signatures guard the content and a counterfeit
    fragment will be thrown out; they do not guard against the machine making and taking connections to strange
    addresses, nor against its queries telling of its release and its wants. It is an example of a safeguard
    effective within its scope and confused with a safeguard of the whole.

    Worth noting that the cost here takes the shape of a bill for a link and not of a fault. The application ought
    to say so, a cost invisible in the reports being at times discovered only at the invoice.
