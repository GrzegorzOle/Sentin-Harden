id: win2025-delivery-optimization-no-internet-peers

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Delivery Optimization
  title:
    pl: Pobieranie aktualizacji od obcych maszyn w internecie wyłączone
    en: Fetching updates from strange machines on the internet turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania maszynie pobierania części aktualizacji od nieznanych
    maszyn w internecie. Dopuszczone pozostają tryby, w których źródłem
    jest producent albo maszyny w tej samej sieci lokalnej.

    Kategoria średnia i chcę od razu powiedzieć, czego ten punkt nie
    dotyczy, bo pierwsze wrażenie bywa mocniejsze niż rzeczywistość.
    Pobrane w ten sposób fragmenty są sprawdzane podpisem — obca maszyna
    nie podstawi podmienionej poprawki, bo podpis się nie zgodzi. To nie
    jest droga do wstrzyknięcia kodu.

    Treścią punktu jest co innego, a przy serwerze jest to ważniejsze niż
    sam sposób pobierania. Po włączeniu tego mechanizmu maszyna nawiązuje
    połączenia z nieokreśloną z góry liczbą obcych adresów w internecie,
    w obie strony, i sama staje się źródłem dla innych. Serwer zaczyna więc
    zachowywać się w sieci jak coś, czym nie jest, i robi to na porcie,
    którego nikt w regułach zapory nie szukał. Dla pracy z dziennikami
    ruchu oznacza to szum nie do odróżnienia od nieprawidłowości.

    Jest też rzecz prostsza: to ruch wychodzący i przychodzący, którego
    właściciel serwera nie planował, i który w segmencie sieci
    przeznaczonym wyłącznie dla usług po prostu nie powinien występować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tło,
    w którym połączenia serwera z przypadkowymi adresami są normą, więc
    jedno połączenie więcej nie zwraca niczyjej uwagi.
  en: |
    The item forbids the machine to fetch parts of updates from unknown
    machines on the internet. The modes left permitted are those where the
    source is the maker or machines on the same local network.

    The category is medium, and I want to say straight away what this item
    is not about, because the first impression tends to be stronger than the
    reality. Fragments fetched this way are checked by signature - a strange
    machine will not slip in a substituted fix, because the signature will
    not match. This is not a road to injecting code.

    The substance of the item is something else, and on a server it matters
    more than the manner of fetching. Once this mechanism is on, the machine
    opens connections to an unbounded number of strange addresses on the
    internet, in both directions, and becomes a source for others itself. So
    a server starts behaving on the network like something it is not, and
    does so on a port nobody was looking for in the firewall rules. For work
    with traffic logs this means noise indistinguishable from irregularity.

    There is a simpler matter too: this is outbound and inbound traffic the
    server's owner did not plan, and which in a network segment meant solely
    for services simply should not occur.

    What an attacker gains while the item goes unmet: a background in which
    the server's connections to arbitrary addresses are the norm, so one
    connection more draws nobody's attention.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę nazwać, w czym ryzyko tej
    zmiany naprawdę leży, bo nie leży tam, gdzie się go szuka.

    Ta reguła dopuszcza kilka trybów, nie jeden. Jeżeli wpiszesz tryb
    wyłączający także pobieranie od maszyn w tej samej sieci lokalnej,
    a organizacja opiera na nim rozprowadzanie aktualizacji po
    serwerowni — cały ruch wróci do łącza wyjściowego. Przy kilkudziesięciu
    maszynach pobierających to samo tego samego dnia jest to różnica
    odczuwalna dla wszystkich innych usług korzystających z tego łącza.
    Dlatego audyt tej reguły przyjmuje kilka wartości: właściwa zależy od
    tego, jak rozprowadzane są u ciebie aktualizacje.

    Druga rzecz do sprawdzenia dotyczy maszyn odciętych od sieci
    producenta. Tam, gdzie serwer nie ma wyjścia na zewnątrz i pobiera
    poprawki wyłącznie od sąsiadów, zbyt wąski tryb oznacza maszynę, która
    przestaje dostawać poprawki w ogóle — a to jest dokładnie odwrotność
    zamiaru.

    Co się nie zepsuje: zainstalowane aktualizacje, ich kolejność, ich
    harmonogram. Zmienia się wyłącznie to, skąd maszyna bierze pliki.
    Pobranie z wolniejszego źródła bywa dłuższe, ale kończy się tak samo.

    Zmiana nie wymaga przerwy, jest niewidoczna w codziennej pracy i cofa
    się natychmiast.
  en: |
    I keep the class "needs review", and I want to name where the risk of
    this change really lies, because it does not lie where people look for
    it.

    This rule permits several modes, not one. If you write a mode that also
    switches off fetching from machines on the same local network, while the
    organisation rests its distribution of updates across the server room on
    exactly that - all the traffic returns to the outbound link. With a few
    dozen machines fetching the same thing on the same day, that is a
    difference felt by every other service using that link. This is why the
    audit for this rule accepts several values: the right one depends on how
    updates are distributed in your estate.

    The second thing to check concerns machines cut off from the maker's
    network. Where a server has no way out and fetches fixes solely from its
    neighbours, too narrow a mode means a machine that stops receiving fixes
    at all - which is precisely the opposite of the intent.

    What will not break: the installed updates, their order, their schedule.
    All that changes is where the machine takes the files from. Fetching
    from a slower source sometimes takes longer but ends the same way.

    The change needs no outage, is invisible in daily work, and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Zbyt wąski tryb wyłącza także pobieranie od maszyn w tej samej sieci i cały ruch wraca do łącza wyjściowego
      - Przy kilkudziesięciu maszynach pobierających to samo tego samego dnia odczują to inne usługi korzystające z tego łącza
      - Serwer odcięty od sieci producenta, pobierający poprawki tylko od sąsiadów, przestanie je dostawać w ogóle
      - Nie zmienia się nic w samych aktualizacjach ani ich harmonogramie — zmienia się wyłącznie źródło plików
    en:
      - Too narrow a mode also switches off fetching from machines on the same network and all the traffic returns to the outbound link
      - With a few dozen machines fetching the same thing on the same day, other services on that link will feel it
      - A server cut off from the maker's network, fetching fixes only from its neighbours, stops receiving them at all
      - Nothing changes in the updates themselves or their schedule - only the source of the files changes
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja rozprowadza aktualizacje po serwerowni przez maszyny sąsiednie i wybrany tryb to wyłącza
      - Serwer nie ma wyjścia na zewnątrz i pobiera poprawki wyłącznie od maszyn w swojej sieci
    en:
      - The organisation distributes updates across the server room through neighbouring machines and the chosen mode switches that off
      - The server has no way out and fetches fixes solely from machines on its own network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
      $name = 'DODownloadMode'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|1|2|99|100)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    $name = 'DODownloadMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Value 1 leaves fetching from machines on the same network in place and
    # cuts off only strange ones on the internet. Where updates are distributed
    # across the server room by neighbouring machines, do not narrow this
    # further - the traffic would all return to the outbound link.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DODownloadMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/do/waas-delivery-optimization-reference

notes:
  pl: |
    Czego ten punkt nie dotyczy: pobrane fragmenty są sprawdzane podpisem,
    więc obca maszyna nie podstawi podmienionej poprawki. To nie jest droga
    do wstrzyknięcia kodu.

    Treścią jest co innego: serwer nawiązuje połączenia z nieokreśloną
    z góry liczbą obcych adresów, w obie strony, na porcie, którego nikt
    w regułach zapory nie szukał. Dla pracy z dziennikami ruchu to szum
    nie do odróżnienia od nieprawidłowości.

    Ryzyko zmiany nie leży tam, gdzie się go szuka: zbyt wąski tryb
    wyłącza też pobieranie od sąsiadów. Dlatego audyt przyjmuje kilka
    wartości — właściwa zależy od tego, jak rozprowadzane są aktualizacje.
  en: |
    What this item is not about: the fragments fetched are checked by
    signature, so a strange machine will not slip in a substituted fix. This
    is not a road to injecting code.

    The substance is something else: the server opens connections to an
    unbounded number of strange addresses, in both directions, on a port
    nobody was looking for in the firewall rules. For work with traffic logs
    that is noise indistinguishable from irregularity.

    The risk of the change does not lie where people look for it: too narrow
    a mode also switches off fetching from neighbours. This is why the audit
    accepts several values - the right one depends on how updates are
    distributed.
