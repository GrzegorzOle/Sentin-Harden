notes:
  pl: |
    Ten punkt nie ma przycisku „Uruchom" i nie jest to przeoczenie.
    Włączenie z blokadą oprogramowania układowego zostawia stan,
    z którego nie da się wrócić poleceniem — przywrócenie wartości
    w rejestrze nie wyłączy funkcji, bo decyzja jest zapisana poza
    systemem. Zgodnie z zasadą projektu punkt bez wiarygodnego
    wycofania można wyłącznie skopiować i wykonać świadomie,
    z dostępem do maszyny.

    Kopia zapasowa jest mimo to dołączona: zapisuje stan obu kluczy
    przed zmianą, żeby było wiadomo, od czego się zaczęło.

    Kategoria podniesiona do krytycznej tą samą decyzją, co przy
    blokadzie kradzieży poświadczeń z procesu logowania. Sednem jest
    administrator, który właśnie zalogował się, żeby coś naprawić:
    maszyna jest w tej chwili najcenniejszym celem w sieci, a napastnik
    siedzący już na niej czeka dokładnie na to wejście.
  en: |
    This item has no button "Run" and that is no oversight. The switching on with a lock in the
    software of the frame leaves a state not to be come back from by a command - the setting back of
    the worth in the registry will not switch the feature off, the deciding being written outside
    the system. By the project's rule, an item with no trustworthy way back may only be copied and
    carried out wittingly, with a reach to the machine.

    The keeping of a copy is for all that set alongside - it writes down the state of both keys
    before the change, that it be known whence it began.

    The category is raised to critical by the same deciding as at the blocking of the stealing of
    tokens of leave out of the process of signing in. The heart of it is the administrator who has
    just signed in to mend something - the machine is at that moment the worthiest target in the
    net, and an attacker already sitting upon it waits for just that coming.
