id: iis-global-authorization-rule-restricted

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Configure Authentication and Authorization
  title:
    pl: Reguła dostępu wskazuje uprawnionych zamiast wpuszczać wszystkich
    en: The access rule names who is entitled instead of admitting everybody

  level: 1
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer ma jedną regułę nadrzędną, obowiązującą wszędzie tam, gdzie nikt nie
    ustalił własnej. Domyślnie mówi ona: wpuszczaj wszystkich. Sensowna
    alternatywa brzmi odwrotnie — wpuszczaj wskazanych, a resztę odrzucaj —
    i pozwala ustawić wyjątek tam, gdzie zawartość ma być publiczna.

    Co to odbiera atakującemu: dostęp do rzeczy, których nikt nie miał zamiaru
    udostępniać. Katalog wgrany na serwer „na chwilę", aplikacja postawiona do
    testów, kopia serwisu zostawiona obok właściwej — żadna z nich nie ma
    własnej reguły dostępu, więc dziedziczy tę nadrzędną. Przy regule
    wpuszczającej wszystkich każde takie miejsce jest publiczne od momentu,
    w którym pojawi się na dysku, i pozostaje takie, dopóki ktoś nie zauważy.

    Po zmianie domyślną odpowiedzią jest odmowa, a udostępnienie czegokolwiek
    wymaga decyzji. To odwrócenie kierunku, w którym działa zapomnienie.
  en: |
    The server has one overriding rule, holding wherever nobody has settled one of
    their own. By default it says - admit everybody. The sensible alternative says
    the opposite - admit those named and refuse the rest - and allows an exception
    where the contents are meant to be public.

    What it takes away from an attacker - access to things nobody meant to publish.
    A directory uploaded to the server "for a moment", an application stood up for
    testing, a copy of the site left beside the real one - none of them has an
    access rule of its own, so each inherits the overriding one. With a rule
    admitting everybody, every such place is public from the moment it appears on
    disk and stays so until somebody notices.

    After the change the default answer is a refusal, and publishing anything calls
    for a decision. That reverses the direction in which forgetting works.

disruption_description:
  pl: |
    To jest zmiana o największym potencjale zepsucia wszystkiego naraz w całym
    tym zestawie. Reguła nadrzędna obowiązuje wszędzie, gdzie nie ustalono
    inaczej — więc na serwisie publicznym bez własnych reguł dostępu
    przestawienie jej oznacza, że serwis przestaje być dostępny dla
    kogokolwiek. Nie za pół godziny, tylko przy pierwszym żądaniu.

    Dlatego kolejność jest odwrotna niż przy większości punktów: najpierw
    trzeba ustalić reguły wpuszczające tam, gdzie zawartość ma pozostać
    publiczna, sprawdzić, że działają, i dopiero potem zamykać regułę
    nadrzędną. Zrobione w tej kolejności zamknięcie jest niewidoczne dla
    użytkowników.

    Miejsca, o których najłatwiej zapomnieć, to nie strony, tylko to, co strony
    ładują: pliki stylów, obrazy, skrypty, czcionki oraz punkty końcowe
    wywoływane w tle. Strona, która się załaduje, ale wygląda jak tekst bez
    formatowania, to zwykle właśnie ten przypadek — reguła wpuszcza użytkownika
    na dokument, a odrzuca jego zasoby.

    Ta reguła niczego nie ustawia sama, bo lista uprawnionych jest zawsze
    lokalna. Aplikacja nie wie, które konta, grupy ani role mają tu dostęp.
  en: |
    This is the change with the greatest potential to break everything at once in
    this whole set. The overriding rule holds wherever nothing else has been
    settled, so on a public site with no access rules of its own, switching it over
    means the site stops being available to anybody. Not in half an hour - at the
    first request.

    This is why the order is the reverse of most items - rules admitting people
    have to be settled first wherever the contents are to stay public, checked to
    work, and only then the overriding rule closed. Done in that order the closing
    is invisible to users.

    The places easiest to forget are not pages but what pages load - style files,
    images, scripts, fonts and endpoints called in the background. A page that
    loads but looks like text without formatting is usually exactly this case - the
    rule admits the user to the document and refuses its resources.

    The rule sets nothing by itself, because the list of the entitled is always
    local. The application does not know which accounts, groups or roles have
    access here.

implementation_consequences:
  impact_areas:
    - web-server-services
    - accounts-and-passwords
    - network-and-firewall
  what_breaks:
    pl:
      - Serwis publiczny bez własnych reguł dostępu przestaje być dostępny dla kogokolwiek przy pierwszym żądaniu
      - Strony ładują się bez stylów, obrazów i skryptów, jeśli reguła wpuszczająca objęła dokumenty, a nie objęła zasobów
      - Punkty końcowe wywoływane w tle przez stronę zaczynają zwracać odmowę, co wygląda na awarię aplikacji
      - Integracje i monitoring odpytujące serwis anonimowo przestają działać
      - Katalogi i aplikacje bez własnych reguł przestają być dostępne, także te, o których nikt nie pamiętał
    en:
      - A public site with no access rules of its own stops being available to anybody at the first request
      - Pages load without styles, images and scripts, where the admitting rule covered documents and not resources
      - Endpoints called in the background by a page start returning refusals, which looks like an application fault
      - Integrations and monitoring polling the site anonymously stop working
      - Directories and applications with no rules of their own stop being available, including those nobody remembered
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwery goszczące zawartość publiczną, dopóki nie ustalono reguł wpuszczających dla tej zawartości
      - Maszyny, na których nie wiadomo, które aplikacje mają być dostępne anonimowo
    en:
      - Servers hosting public content, until admitting rules for that content have been settled
      - Machines where it is not known which applications are to be reachable anonymously
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $rules = Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/security/authorization' -ErrorAction Stop
          if ($null -eq $rules) { 'NOT_INSTALLED' }
          else {
            $open = @()
            foreach ($entry in @($rules.Collection)) {
              # Only an entry that admits is of interest. A refusal naming
              # everybody is the opposite of the problem and needs no report.
              if ([string]$entry.accessType -ne 'Allow') { continue }
              $users = [string]$entry.users
              $roles = [string]$entry.roles
              # The wildcard in the user field is the default entry - it admits
              # anybody, signed in or not. A question mark means the anonymous
              # user alone, which is the same thing said differently.
              if ($users -eq '*' -or $users -eq '?') {
                $open += ('users=' + $users)
              }
              elseif ([string]::IsNullOrWhiteSpace($users) -and [string]::IsNullOrWhiteSpace($roles)) {
                $open += 'users=<empty>'
              }
            }
            if ($open.Count -eq 0) { 'AS_REQUIRED' }
            else { 'OPEN ' + ($open -join ',') }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  change_command: |
    # Prepared for copying, not for running. The order below is the point: the
    # admitting rules for content that is to stay public come first, and the
    # overriding rule is closed last. The reverse order takes every site on this
    # machine offline at the first request.
    Import-Module WebAdministration -ErrorAction Stop

    $public = 'Default Web Site'
    $entitled = 'DOMAIN\Site Users'

    # First - say what is to remain reachable by anybody. Remember the
    # resources a page loads, not only its documents.
    Add-WebConfigurationProperty -PSPath ('MACHINE/WEBROOT/APPHOST/' + $public) `
      -Filter 'system.webServer/security/authorization' -Name '.' `
      -Value @{ accessType = 'Allow'; users = '*' }

    # Then - check that the public content still loads, with its styles,
    # scripts and background calls, before going further.

    # Only then - replace the overriding rule with one naming the entitled.
    Remove-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/authorization' -Name '.' `
      -AtElement @{ users = '*' }
    Add-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/authorization' -Name '.' `
      -Value @{ accessType = 'Allow'; roles = $entitled }

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/security/authorization/
  - https://learn.microsoft.com/iis/manage/configuring-security/understanding-iis-url-authorization

notes:
  pl: |
    Reguła jest wyłącznie do skopiowania i to jest tu decyzja najostrożniejsza
    z możliwych. Lista uprawnionych nie występuje nigdzie w konfiguracji —
    zależy od tego, kto w tej organizacji ma mieć dostęp — a zamknięcie reguły
    nadrzędnej bez wcześniejszego otwarcia zawartości publicznej odcina
    wszystkie serwisy na maszynie przy pierwszym żądaniu. To jedyny punkt w tym
    zestawie, w którym pomyłka w kolejności daje natychmiastową, całkowitą
    niedostępność.

    Sprawdzenie szuka wpisów wpuszczających i wymienia sposób, w jaki wpuszczają:
    gwiazdką, znakiem zapytania albo pustym polem. Wpis odmawiający jest
    pomijany, bo jest przeciwieństwem problemu.

    Brak sekcji zgłaszany jest osobno. Autoryzacja adresów to usługa roli,
    której nie musi być w instalacji — a wtedy nie ma reguły ani otwartej, ani
    zamkniętej, tylko nie ma jej wcale.
  en: |
    The rule is for copying only, and here that is the most cautious decision
    available. The list of the entitled appears nowhere in the configuration - it
    depends on who in this organisation is to have access - and closing the
    overriding rule without first opening up the public content cuts off every site
    on the machine at the first request. It is the one item in this set where a
    mistake in the order gives immediate and total unavailability.

    The check looks for admitting entries and names the way in which they admit -
    by wildcard, by question mark or by an empty field. A refusing entry is passed
    over, being the opposite of the problem.

    An absent section is reported separately. Address authorisation is a role
    service that need not be in the installation - and then there is no rule either
    open or closed, there is simply none.
