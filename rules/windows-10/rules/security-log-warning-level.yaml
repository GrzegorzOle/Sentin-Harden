id: win10-security-log-warning-level

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Ostrzeżenie o zapełnieniu dziennika zabezpieczeń przy dziewięćdziesięciu procentach
    en: A warning of the journal of security filling up at ninety in the hundred
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że system zapisuje ostrzeżenie, gdy dziennik
    zabezpieczeń zapełni się w dziewięćdziesięciu procentach.

    Dziennik zabezpieczeń ma rozmiar ustalony z góry. Po jego zapełnieniu
    system albo zaczyna nadpisywać najstarsze wpisy, albo przestaje
    zapisywać nowe — zależnie od innego ustawienia. W obu przypadkach
    zapis traci ciągłość i nikt się o tym nie dowiaduje.

    Ostrzeżenie zamyka tę lukę. Wpis pojawia się jeszcze zanim dziennik
    się zapełni, więc jest czas na zareagowanie: zwiększenie rozmiaru,
    przeniesienie zawartości albo sprawdzenie, dlaczego zdarzeń nagle
    przybyło.

    Ostatnia możliwość jest tu najważniejsza. Gwałtowny przyrost zdarzeń
    bywa objawem ataku — na przykład próby zgadywania haseł — a bywa też
    sposobem na wypchnięcie z dziennika wpisów starszych. Napastnik, który
    wie, że dziennik jest mały, może zalać go zdarzeniami nieistotnymi
    i w ten sposób usunąć ślad swojego wejścia bez kasowania czegokolwiek.

    Odnotowuję, że sprawdzenie przyjmuje wartości niższe niż
    dziewięćdziesiąt. Ostrzeżenie wcześniejsze spełnia ten punkt tak samo.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    cichego wypchnięcia starszych wpisów przez zalanie dziennika.
  en: |
    The setting brings it about that the system writes a warning when the journal of security has filled up to
    ninety in the hundred.

    The journal of security has a size settled beforehand. Once it is full the system either begins to write over
    the oldest entries or ceases to write new ones - according to another setting. In both cases the record loses
    its unbrokenness and nobody learns of it.

    The warning shuts that gap. The entry shows before ever the journal is full, so there is time to answer: the
    raising of the size, the carrying over of the content, or a looking into why the happenings have of a sudden
    grown so many.

    That last is here the weightiest. A sharp growth of happenings is at times the mark of an attack - of an
    attempt at the guessing of passwords, say - and is at times a way of pushing the older entries out of the
    journal. An attacker who knows the journal is small may flood it with happenings of no weight and so take away
    the trace of their coming in without the deleting of anything at all.

    I set down that the check takes values lower than ninety. An earlier warning meets this item just as well.

    What an attacker gains while the item goes unmet: the quiet pushing out of the older entries by a flooding of
    the journal.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" ze względu na restart. Ustawienie
    jest czytane przez usługę dziennika przy starcie systemu, więc
    wartość zapisana zaczyna obowiązywać dopiero po ponownym uruchomieniu.

    Miejscem wartym uwagi jest system zbierający dzienniki. Ostrzeżenie
    jest zwykłym zdarzeniem i trafi do niego razem z resztą, więc na
    maszynie z małym dziennikiem będzie pojawiać się regularnie. Warto
    uprzedzić o tym obsługę, bo inaczej zostanie odebrane jako alarm
    fałszywy i wyciszone — a wtedy punkt przestaje cokolwiek dawać.

    Odnotowuję, że ostrzeżenie samo w sobie nie zmienia zachowania
    dziennika. Nie zwiększa rozmiaru, nie przenosi wpisów i nie
    powstrzymuje nadpisywania. Mówi tylko, że zbliża się granica.

    Skutek pojawia się po restarcie maszyny. Wycofanie także wymaga
    restartu.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, pracy
    programów, logowania, drukowania.
  en: |
    The class is "needs planned rollout" for the sake of the restart. The setting is read by the service of the
    journal at the system's start, so a value written begins to hold good only after a starting anew.

    The place worth notice is the system that gathers journals. The warning is an ordinary happening and will come
    to it with the rest, so upon a machine with a small journal it will show regularly. It is worth forewarning
    the keepers of it, else it will be taken for a false alarm and hushed - and then the item gives nothing any
    more.

    I set down that the warning of itself changes nothing in the journal's behaviour. It does not raise the size,
    does not carry entries over and does not hold back the writing over. It says only that the bound draws near.

    The consequence shows after the machine's restart. The going back calls for a restart too.

    What this does not break: the writing of happenings, the reading of the journal, the work of programs, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie z małym dziennikiem ostrzeżenie będzie pojawiać się regularnie w systemie zbierającym dzienniki
      - Obsługa bez uprzedzenia odbierze je jako alarm fałszywy i wyciszy, a wtedy punkt przestaje cokolwiek dawać
      - Ostrzeżenie nie zwiększa rozmiaru dziennika i nie powstrzymuje nadpisywania, mówi tylko o zbliżającej się granicy
      - Skutek pojawia się dopiero po restarcie maszyny, bo usługa dziennika czyta to ustawienie przy starcie
      - Zapisywanie zdarzeń, odczyt dziennika, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - Upon a machine with a small journal the warning will show regularly in the system that gathers journals
      - The keepers, unforewarned, will take it for a false alarm and hush it, and then the item gives nothing any more
      - The warning does not raise the journal s size and does not hold back the writing over, it says only that the bound draws near
      - The consequence shows only after the machine s restart, the service of the journal reading this setting at the start
      - The writing of happenings, the reading of the journal, the work of programs, logging on and printing stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń jest mały i nie da się go powiększyć, więc ostrzeżenie będzie stałym szumem
      - System zbierający dzienniki nie rozróżnia rodzajów zdarzeń i każdy nowy rodzaj wywołuje u obsługi alarm
    en:
      - The journal of security is small and cannot be made greater, so the warning will be a standing noise
      - The system gathering journals does not tell the kinds of happening apart and every new kind raises an alarm with its keepers
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value is a percentage of fill. Ninety is what the item calls for and
      # anything lower warns sooner, so it meets the item as well.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'WarningLevel'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '90'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
    $name = 'WarningLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'WarningLevel' -Value 90 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/basic-security-audit-policy-settings

notes:
  pl: |
    Reguła ma sens wyłącznie razem z ustawieniem rozmiaru dziennika
    i warto, żeby aplikacja pokazała je obok siebie. Ostrzeżenie przy
    dzienniku zbyt małym będzie się odzywać bez przerwy i zostanie
    wyciszone; przy dzienniku właściwie dobranym odezwie się wtedy, gdy
    naprawdę coś się dzieje.

    Argument wart postawienia wprost dotyczy zalewania dziennika.
    Napastnik nie musi kasować wpisów, żeby usunąć ślad — wystarczy, że
    wygeneruje dość zdarzeń nieistotnych, a dziennik sam wypchnie
    starsze. Ostrzeżenie jest jedynym momentem, w którym da się to
    zauważyć zanim ślad zniknie.

    Odnotowuję, że sam punkt niczemu nie zapobiega. Jest to wykrywanie,
    a nie ochrona, i aplikacja nie powinna obiecywać więcej. Wartość
    zależy tu w całości od tego, czy ktoś na ostrzeżenie zareaguje.
  en: |
    The rule has sense only together with the setting of the journal's size, and it is well that the application
    show them beside each other. A warning upon a journal too small will sound without pause and will be hushed;
    upon a journal rightly chosen it will sound when something is truly afoot.

    The argument worth putting outright touches the flooding of the journal. An attacker need delete no entries to
    take a trace away - it is enough that they raise happenings of no weight in number, and the journal will push
    the older ones out of itself. The warning is the one hour at which that may be marked before the trace is
    gone.

    I set down that the item of itself hinders nothing. It is a finding out and no guarding, and the application
    ought to promise no more. The worth hangs here wholly upon whether anybody answers the warning.
