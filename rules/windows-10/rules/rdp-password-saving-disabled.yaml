id: win10-rdp-password-saving-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Connection Client
  title:
    pl: Zapisywanie haseł w kliencie pulpitu zdalnego zablokowane
    en: The writing of passwords in the client of the desk from afar shut
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zapisywania haseł w kliencie pulpitu zdalnego,
    czyli wygodnego zapamiętywania poświadczeń do maszyn, z którymi
    użytkownik się łączy.

    Zastrzeżenie dotyczy tego, jakie to są hasła. Człowiek łączący się
    pulpitem zdalnym robi to zwykle do serwerów i maszyn, którymi
    zarządza, więc zapamiętywane poświadczenia są poświadczeniami
    o szerokich uprawnieniach.

    Zagrożenie pierwsze to skupienie. Jedna przejęta maszyna użytkownika
    daje dostęp do wszystkich maszyn, do których miał zapisane hasła,
    bez potrzeby zdobywania czegokolwiek więcej.

    Zagrożenie drugie to postać zapisu. Hasła są chronione mechanizmem
    związanym z kontem użytkownika, więc program uruchomiony jako ten
    użytkownik odczytuje je bez żadnej przeszkody.

    Zagrożenie trzecie to plik połączenia. Zapisane poświadczenia
    wędrują razem z plikiem opisującym połączenie, a taki plik bywa
    przesyłany i kopiowany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: komplet
    poświadczeń do maszyn zarządzanych przez użytkownika.
  en: |
    The setting forbids the writing of passwords in the client of the desk from afar - the handy holding in memory
    of the warrants to the machines a user joins themselves to.

    The reservation touches what manner of passwords these are. Whoever joins themselves by the desk from afar
    does it commonly to servers and machines they order, so the warrants held in memory are warrants of broad
    rights.

    The first danger is the drawing together. One taken machine of a user gives a reach of every machine to which
    they had passwords written, with no need of winning anything further.

    The second danger is the shape of the writing. The passwords are guarded by a mechanism bound to the user's
    reckoning, so a program set going as that user reads them with no hindrance at all.

    The third danger is the file of the joining. Written warrants travel together with the file setting out the
    joining, and such a file is at times sent on and copied.

    What an attacker gains while the item goes unmet: the full set of warrants to the machines the user orders.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest sposób
    pracy osób zarządzających maszynami.

    Miejscem pierwszym są osoby łączące się z wieloma maszynami w ciągu
    dnia. Po zmianie będą wpisywać hasło przy każdym połączeniu, co jest
    odczuwalne i bywa zgłaszane jako utrudnienie.

    Miejscem drugim są skrypty i skróty uruchamiające połączenie
    z zapisanymi poświadczeniami. Przestaną działać bez interwencji.

    Odnotowuję rozwiązanie właściwe: menedżer haseł zamiast klienta
    pulpitu zdalnego. Nie znosi wygody, a przenosi przechowywanie do
    narzędzia do tego przeznaczonego.

    Zastrzegam, że zapisane wcześniej hasła nie znikają same. Zasada
    blokuje zapisywanie nowych, a stare trzeba usunąć osobno — i o tym
    trzeba pamiętać, bo inaczej punkt wygląda na wdrożony, a dostęp
    pozostaje.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: samych połączeń pulpitu zdalnego, pracy
    programów, sieci, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is the manner of work of those who order machines.

    The first place is people joining themselves to many machines in the course of a day. After the change they
    will write the password at every joining, which is keenly felt and is at times reported as a hindrance.

    The second place is scripts and short ways setting going a joining with written warrants. They will cease to
    work without a hand being put to it.

    I set down the right answer: a keeper of passwords in the place of the client of the desk from afar. It takes
    not away the ease and moves the holding to a tool made for it.

    I set down that passwords written earlier go not of themselves. The policy shuts the writing of new ones, and
    the old must be taken away apart - and that must be remembered, else the item looks rolled out while the reach
    stays.

    The consequence shows at once, with no restart.

    What this does not break: the joinings of the desk from afar themselves, the work of programs, the network,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoby łączące się z wieloma maszynami będą wpisywać hasło przy każdym połączeniu
      - Skrypty i skróty uruchamiające połączenie z zapisanymi poświadczeniami przestaną działać
      - Rozwiązaniem właściwym jest menedżer haseł zamiast klienta pulpitu zdalnego
      - Zapisane wcześniej hasła nie znikają same i trzeba usunąć je osobno
      - Same połączenia pulpitu zdalnego, praca programów, sieć, logowanie i drukowanie pozostają bez zmian
    en:
      - People joining themselves to many machines will write the password at every joining
      - Scripts and short ways setting going a joining with written warrants will cease to work
      - The right answer is a keeper of passwords in the place of the client of the desk from afar
      - Passwords written earlier go not of themselves and must be taken away apart
      - The joinings of the desk from afar themselves, the work of programs, the network, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca opiera się na skryptach uruchamiających połączenia pulpitu zdalnego z zapisanymi poświadczeniami
    en:
      - The work rests upon scripts setting going joinings of the desk from afar with written warrants
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisablePasswordSaving'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'DisablePasswordSaving'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordSaving' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-client-access

notes:
  pl: |
    Reguła wymaga kroku, o którym łatwo zapomnieć: zasada blokuje
    zapisywanie nowych haseł, ale nie usuwa zapisanych wcześniej.
    Aplikacja powinna to powiedzieć wprost, bo bez tego punkt wygląda na
    wdrożony, a dostęp pozostaje.

    Argument wart postawienia dotyczy tego, jakie to hasła. Pulpitem
    zdalnym łączy się zwykle do serwerów, więc zapamiętywane
    poświadczenia mają szerokie uprawnienia, a jedna przejęta maszyna
    użytkownika daje dostęp do wszystkich.

    Odnotowuję rozwiązanie zastępcze: menedżer haseł. Warto je wskazać,
    bo punkt bywa odrzucany jako utrudnienie, a utrudnienia da się
    uniknąć bez rezygnacji z zysku.
  en: |
    The rule calls for a step easily forgotten: the policy shuts the writing of new passwords but takes not away
    those written earlier. The application ought to say it outright, for without that the item looks rolled out
    while the reach stays.

    The argument worth putting touches what manner of passwords these are. By the desk from afar one joins oneself
    commonly to servers, so the warrants held in memory bear broad rights, and one taken machine of a user gives a
    reach of them all.

    I set down the answer that stands in its stead: a keeper of passwords. It is worth pointing out, the item
    being at times cast aside as a hindrance, and the hindrance being avoidable with no giving up of the gain.
