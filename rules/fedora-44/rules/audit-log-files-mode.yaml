id: fedora44-audit-log-files-mode

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 6.3.4.2
  section: Logging and Auditing > System Accounting (auditd) > Configure auditd File Access
  title:
    pl: Pliki dziennika audytu mają ograniczone uprawnienia
    en: Ensure audit log files mode is configured
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Dziennik audytu zawiera wiersze poleceń, nazwy plików i dane logowania
    użytkowników, a jego odczyt pokazuje, co i kiedy robił każdy z nich.

    Punkt wymaga, żeby każdy plik w katalogu dzienników audytu miał tryb 640
    lub bardziej restrykcyjny. auditd tworzy nowe pliki z trybem 600 (albo
    640, gdy log_group wskazuje inną grupę niż root), ale pliki skopiowane
    lub odtworzone ręcznie mogą mieć szersze uprawnienia.
  en: |
    The audit log contains command lines, file names and login data of the
    users, and reading it shows what each of them did and when.

    The item requires every file in the audit log directory to have mode
    640 or stricter. auditd creates new files with mode 600 (or 640 when
    log_group names a group other than root), but files copied or restored
    by hand may have wider permissions.

disruption_description:
  pl: |
    Nikt tego nie zauważy: dzienniki zapisuje auditd działający jako root,
    a ausearch i aureport uruchamia administrator.
  en: |
    Nobody will notice: the logs are written by auditd running as root, and
    ausearch and aureport are run by the administrator.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    conf=/etc/audit/auditd.conf
    # logdir: the directory of log_file from auditd.conf, or a reason and 1
    logdir() {
      local f
      if [ ! -r "$conf" ]; then
        if [ -e "$conf" ] || { [ -d /etc/audit ] && [ ! -x /etc/audit ]; }; then echo needs-root; else echo audit-not-installed; fi
        return 1
      fi
      f=$(awk -F= '$1 ~ /^[[:space:]]*log_file[[:space:]]*$/ { v = $2 } END { print v }' "$conf" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
      dirname -- "${f:-/var/log/audit/audit.log}"
    }
    plist() {
      local l
      l=$(logdir) || { echo "$l"; return 1; }
      [ -d "$l" ] || return 0
      { [ -r "$l" ] && [ -x "$l" ]; } || { echo needs-root; return 1; }
      find "$l/" -type f | sort
    }
    pok() { [ $(( 0$1 & 07137 )) -eq 0 ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    conf=/etc/audit/auditd.conf
    # logdir: the directory of log_file from auditd.conf, or a reason and 1
    logdir() {
      local f
      if [ ! -r "$conf" ]; then
        if [ -e "$conf" ] || { [ -d /etc/audit ] && [ ! -x /etc/audit ]; }; then echo needs-root; else echo audit-not-installed; fi
        return 1
      fi
      f=$(awk -F= '$1 ~ /^[[:space:]]*log_file[[:space:]]*$/ { v = $2 } END { print v }' "$conf" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
      dirname -- "${f:-/var/log/audit/audit.log}"
    }
    plist() {
      local l
      l=$(logdir) || { echo "$l"; return 1; }
      [ -d "$l" ] || return 0
      { [ -r "$l" ] && [ -x "$l" ]; } || { echo needs-root; return 1; }
      find "$l/" -type f | sort
    }
    pok() { [ $(( 0$1 & 07137 )) -eq 0 ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      {
        echo format=perms-1
        printf '%s\n' "$l" | while IFS= read -r f; do
          [ -n "$f" ] && [ -e "$f" ] || continue
          printf '%s %s\n' "$(stat -c '%a %u %g' -- "$f")" "$f"
        done
      } > "$b.tmp"
      mv "$b.tmp" "$b"
      echo "Saved the owner and mode of $(( $(wc -l < "$b") - 1 )) paths"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    conf=/etc/audit/auditd.conf
    # logdir: the directory of log_file from auditd.conf, or a reason and 1
    logdir() {
      local f
      if [ ! -r "$conf" ]; then
        if [ -e "$conf" ] || { [ -d /etc/audit ] && [ ! -x /etc/audit ]; }; then echo needs-root; else echo audit-not-installed; fi
        return 1
      fi
      f=$(awk -F= '$1 ~ /^[[:space:]]*log_file[[:space:]]*$/ { v = $2 } END { print v }' "$conf" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
      dirname -- "${f:-/var/log/audit/audit.log}"
    }
    plist() {
      local l
      l=$(logdir) || { echo "$l"; return 1; }
      [ -d "$l" ] || return 0
      { [ -r "$l" ] && [ -x "$l" ]; } || { echo needs-root; return 1; }
      find "$l/" -type f | sort
    }
    pok() { [ $(( 0$1 & 07137 )) -eq 0 ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      n=0
      while IFS= read -r f; do
        [ -n "$f" ] && [ -e "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f")"
        ! pok "$m" "$o" "$g" || continue
        chmod "$(printf '0%04o' $(( 0$m & 0640 )))" -- "$f"
        n=$((n + 1))
      done <<< "$l"
      echo "Corrected $n paths"
      r=$(evaluate)
      case "$r" in OK:*) ;; *) echo "Paths still not as required ($r)" >&2; exit 1 ;; esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      if tail -n +2 "$b" | grep -qvE '^[0-7]+ [0-9]+ [0-9]+ /'; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      n=0
      while read -r m u g f; do
        [ -e "$f" ] || { echo "Skipped $f: it no longer exists"; continue; }
        [ "$(stat -c '%a %u %g' -- "$f")" != "$m $u $g" ] || continue
        chown "$u:$g" -- "$f"
        chmod "$(printf '0%04o' $(( 0$m )))" -- "$f"
        echo "Restored the owner and mode of $f"; n=$((n + 1))
      done < <(tail -n +2 "$b")
      [ "$n" -gt 0 ] || echo "Nothing to restore"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/auditd.conf.5.html
  - https://man7.org/linux/man-pages/man8/auditd.8.html
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/auditing-the-system_security-hardening

notes:
  pl: |
    Naprawa odbiera tylko nadmiarowe bity (tryb i 640) i nie zmienia
    właściciela. Pliki, które powstały po zapisaniu kopii (na przykład przy
    rotacji), wycofanie zostawia bez zmian.
    Wycofanie przywraca zapisany tryb, właściciela i grupę tych ścieżek,
    które nadal istnieją. auditd.conf jest dostępny tylko dla roota, więc
    bez tych uprawnień wynik to NOT_OK:needs-root.
  en: |
    The remediation only removes the excess bits (mode and 640) and does not
    change the owner. Files created after the backup (for example by
    rotation) are left unchanged by the rollback.
    Rollback restores the saved mode, owner and group of the paths that
    still exist. auditd.conf is only accessible to root, so without these
    privileges the result is NOT_OK:needs-root.
