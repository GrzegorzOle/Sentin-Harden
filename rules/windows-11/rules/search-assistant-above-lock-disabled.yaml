id: win11-search-assistant-above-lock-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Asystent wyszukiwania nad ekranem blokady wyłączony
    en: The search assistant above the lock screen switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ekran blokady istnieje po to, żeby maszyna zostawiona bez opieki nie
    odpowiadała nikomu poza osobą, która zna hasło. Asystent wyszukiwania
    dostępny nad tym ekranem tę zasadę nadwyręża: część poleceń da się wydać
    przed zalogowaniem.

    Zakres tego, co przechodzi, zmieniał się w kolejnych wydaniach systemu
    i właśnie to jest najsłabszym punktem takiego rozwiązania. Zabezpieczenie
    opiera się na liście poleceń uznanych za niegroźne, a lista ta jest
    ustalana poza organizacją i bywa zmieniana przy aktualizacji. Kto
    przechodzi obok zablokowanej maszyny, może zapytać, co z niej wyciągnie —
    i odpowiedź nie jest ta sama co pół roku wcześniej.

    Osobno liczy się to, że asystent nad ekranem blokady zwykle korzysta
    z mikrofonu. Maszyna zablokowana, a mimo to nasłuchująca, jest czymś innym
    niż maszyna zablokowana.

    Punkt zostawia asystenta dostępnego po zalogowaniu, o ile w ogóle jest
    włączony. Zamyka wyłącznie dostęp sprzed uwierzytelnienia.
  en: |
    A lock screen exists so that a machine left unattended answers to nobody but the
    person who knows the password. A search assistant reachable above that screen
    strains the principle: some commands can be issued before signing in.

    The range of what gets through has changed from one release of the system to the
    next, and that is exactly the weakest point of such an arrangement. The safeguard
    rests on a list of commands deemed harmless, and that list is settled outside the
    organisation and gets changed at an update. Whoever walks past a locked machine
    may ask what they can draw from it - and the answer is not the same as it was six
    months earlier.

    Separately it counts that an assistant above the lock screen usually uses the
    microphone. A machine that is locked and listening all the same is a different
    thing from a machine that is locked.

    The item leaves the assistant reachable after signing in, if it is switched on at
    all. It closes only the access from before authentication.

disruption_description:
  pl: |
    Nic nie przestaje działać po zalogowaniu. Wyszukiwanie, asystent i wszystkie
    polecenia działają tak samo jak wcześniej — zmienia się wyłącznie to, że
    nie odpowiadają przed zalogowaniem.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego, a sposób pracy po odblokowaniu maszyny pozostaje ten sam.

    Odczuwalne jest to wyłącznie tam, gdzie ktoś wydawał polecenia głosowe do
    zablokowanej maszyny — na przykład sterował odtwarzaniem albo pytał
    o kalendarz, przechodząc obok. Jest to sposób pracy rzadki na stanowisku
    biurowym i spotykany raczej przy maszynach wspólnych.

    Nie ma restartu.
  en: |
    Nothing stops working after signing in. Search, the assistant and every command
    work as before - all that changes is that they do not answer before signing in.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and the way of working after unlocking the machine stays the
    same.

    It is felt only where somebody issued voice commands to a locked machine - for
    instance controlling playback or asking about a calendar while walking past. That
    is a rare way of working at an office station and is met rather at shared
    machines.

    There is no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Polecenia wydawane asystentowi przed zalogowaniem przestaną być obsługiwane
      - Sterowanie maszyną głosem przy zablokowanym ekranie przestanie działać
      - Asystent i wyszukiwanie po zalogowaniu działają bez zmian
    en:
      - Commands issued to the assistant before signing in stop being handled
      - Controlling the machine by voice with the screen locked stops working
      - The assistant and search after signing in work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna wspólna jest obsługiwana głosem bez logowania, na przykład w sali konferencyjnej
    en:
      - A shared machine is operated by voice without signing in, for instance in a meeting room
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowCortanaAboveLock'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowCortanaAboveLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCortanaAboveLock' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt jest węższy od ustawienia wyłączającego asystenta w całości i oba
    występują w benchmarku osobno. Wdrożenie szerszego czyni ten
    bezprzedmiotowym, ale nie odwrotnie — dlatego reguły są dwie i sprawdzają
    różne wpisy.

    Nazwa wpisu odwołuje się do nazwy asystenta z wcześniejszych wydań systemu.
    Nazwa w interfejsie zmieniła się od tego czasu kilkakrotnie, wpis nie.

    Reguła tworzy rodzinę z pozostałymi ustawieniami ekranu blokady: aparatem,
    pokazem slajdów i aktywacją głosową. Każde z nich zamyka inną drogę do
    maszyny sprzed zalogowania, a ich wartość polega na tym, że razem
    przywracają ekranowi blokady znaczenie, które powinien mieć.
  en: |
    The item is narrower than the setting that switches the assistant off entirely,
    and both appear in the benchmark separately. Applying the wider one makes this
    one moot, but not the other way round - which is why there are two rules checking
    different entries.

    The entry's name refers to the assistant's name from earlier releases of the
    system. The name in the interface has changed several times since; the entry has
    not.

    The rule forms a family with the remaining lock screen settings: the camera, the
    slideshow and voice activation. Each closes a different route into the machine
    from before signing in, and their worth lies in together giving the lock screen
    back the meaning it ought to have.
