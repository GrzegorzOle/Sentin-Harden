id: win2025-winrm-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania poleceniami wyłączona
    en: The service for remote management by commands disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przyjmującą zdalne polecenia zarządzające.
    Usługa ta pozwala wykonać na tej maszynie polecenie wydane z innej —
    i jest to wykonanie pełnoprawne, z uprawnieniami konta, które się
    uwierzytelniło.

    Zostawiam kategorię wysoką. Z punktu widzenia napastnika jest to
    usługa o wyjątkowo dobrym stosunku zysku do wysiłku: nie trzeba
    wnosić narzędzi ani zakładać sesji graficznej, wystarczy jedno
    poświadczenie i polecenia wykonują się zdalnie, wyglądając w dzienniku
    dokładnie tak, jak wygląda praca administratora. To jest kanał, którym
    porusza się między maszynami ktoś, kto już zdobył poświadczenia
    opisane przy regułach o Credential Guard.

    Powiem też, czego ten punkt nie robi, żeby nie obiecywał za dużo.
    Wyłączenie usługi zamyka drogę na tę maszynę, ale nie zmienia tego,
    że poświadczenia zostały zdobyte i działają gdzie indziej. Jest to
    utrudnienie ruchu bocznego, nie usunięcie jego przyczyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zdalne
    wykonywanie poleceń na tym serwerze przy pomocy samego poświadczenia,
    bez wnoszenia czegokolwiek na maszynę.
  en: |
    The item switches off the service taking far-off commands of ruling. That service lets a command
    given off another machine be carried out upon this one - and it is a full carrying out, with the
    rights of the account that has proved itself.

    I leave the category high. From an attacker's side it is a service of a rarely good worth against
    labour - no tools need be brought in nor a drawn sitting set up, one token of leave is enough and
    the commands are carried out from afar, looking in the day-book just as the work of an
    administrator looks. It is the channel whereby one moves between machines who has already won the
    tokens of leave set forth at the rules about the guarding of tokens.

    I shall say also what this item does not, that it promise not too much. The switching off of the
    service shuts the road onto that machine but alters not that the tokens of leave have been won
    and work elsewhere. It is a hindering of the moving sideways and no doing away with its ground.

    What an attacker gains while the item goes unmet - the carrying out of commands from afar upon
    that server by a token of leave alone, without the bringing of anything onto the machine.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia", ale z powodu zupełnie
    innego niż przy pulpicie zdalnym — i to rozróżnienie jest tu
    najważniejsze.

    Pulpit zdalny jest drogą człowieka. Ta usługa jest drogą maszyny.
    Na serwerze korzysta z niej nie administrator siedzący przy
    klawiaturze, tylko system zarządzania konfiguracją, agent
    inwentaryzacji, zbieranie danych do monitorowania, narzędzie
    wdrożeniowe i mechanizm zbierania stanu na potrzeby audytu. Żadne
    z nich nie zgłosi problemu, bo żadne z nich nie ma głosu.

    Skutkiem wyłączenia nie jest więc awaria, tylko zniknięcie. Maszyna
    przestaje odpowiadać systemowi zarządzania i wypada z wszystkiego, co
    ten system robi: z raportów, z list, z automatycznego łatania,
    z wykrywania niezgodności. Serwer, który zniknął z systemu
    zarządzania, jest serwerem, którego nikt nie łata — i to jest gorsze
    niż większość rzeczy, przed którymi ta reguła broni.

    Dlatego kolejność jest taka: najpierw ustal, co się z tą maszyną
    łączy tym kanałem, potem przestaw to na inny sposób albo zapisz
    wyjątek, i dopiero na końcu wyłączaj.

    Jest też skutek natychmiastowy, o którym trzeba wiedzieć: jeżeli
    polecenie wykonuje się zdalnie właśnie tym kanałem, zatrzymanie
    usługi zrywa tę sesję w trakcie.

    Zmiana cofa się natychmiast, ale cofnięcie wymaga dostępu do maszyny
    inną drogą niż ta, którą się właśnie zamknęło.
  en: |
    I leave the class "needs a witting rolling out", but of a ground wholly other than at the far-off
    board - and that telling apart is here the weightiest thing.

    The far-off board is a road of a person. This service is a road of a machine. On a server it is
    used not by an administrator sitting at the board of keys but by the system of the ruling of
    settings, an agent of the taking of stock, the gathering of data for watching, a tool of rolling
    out and the working that gathers state for the needs of the audit. None of them will give word of
    a trouble, none of them having a voice.

    The outcome of the switching off is therefore no fault but a vanishing. The machine stops
    answering the system of ruling and falls out of all that system does - out of the reports, out of
    the lists, out of the mending that goes of itself, out of the finding of things not at one. A
    server that has vanished from the system of ruling is a server nobody mends - and that is worse
    than most of the things this rule wards against.

    Therefore the order is this - first settle what binds to that machine by that channel, then set
    it over onto another way or write an exception down, and only at the end switch off.

    There is also an outcome at once that must be known - if the command is being carried out from
    afar by that very channel, the stopping of the service breaks that sitting off in the midst.

    The change is undone at once, but the undoing takes a reach to the machine by another road than
    the one just shut.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - System zarządzania konfiguracją, agent inwentaryzacji i zbieranie danych do monitorowania przestają odpowiadać
      - Maszyna wypada z raportów, list, automatycznego łatania i wykrywania niezgodności
      - Żadne z tych narzędzi nie zgłosi problemu, bo żadne z nich nie ma głosu
      - Serwer, który zniknął z systemu zarządzania, jest serwerem, którego nikt nie łata
      - Polecenie wykonywane zdalnie tym kanałem zrywa własną sesję w trakcie zatrzymywania usługi
    en:
      - The system of the ruling of settings, the agent of the taking of stock and the gathering of data for watching stop answering
      - The machine falls out of the reports, the lists, the mending that goes of itself and the finding of things not at one
      - None of those tools will give word of a trouble, none of them having a voice
      - A server that has vanished from the system of ruling is a server nobody mends
      - A command carried out from afar by that channel breaks its own sitting off in the midst of the stopping of the service
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest zarządzana zdalnie przez system konfiguracji, monitorowania albo inwentaryzacji korzystający z tego kanału
      - Nie ustalono, co łączy się z tą maszyną tym kanałem, i nie przestawiono tego na inny sposób
    en:
      - The machine is ruled from afar by a system of settings, of watching or of the taking of stock that uses that channel
      - It was not settled what binds to that machine by that channel nor was it set over onto another way
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Nothing here will complain: management, inventory and monitoring lose the
    # machine silently. Settle what uses this channel first. If this command is
    # itself running over it, the session ends mid-run.
    Stop-Service -Name 'WinRM' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinRM' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WinRM' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/portal

