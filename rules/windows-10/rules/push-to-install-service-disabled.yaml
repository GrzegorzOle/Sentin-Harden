id: win10-push-to-install-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa instalowania programów zleconego z innego urządzenia wyłączona
    en: The service laying on programs ordered from another device switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przyjmującą zlecenia instalacji wydane
    z innego urządzenia zalogowanego na to samo konto.

    Mechanizm działa tak, że użytkownik wybiera program na telefonie
    albo na stronie sklepu i wskazuje, na której swojej maszynie ma się
    zainstalować. Maszyna dostaje zlecenie z sieci i instaluje program
    sama, bez udziału osoby przy niej siedzącej.

    Zagrożenie leży w tej ostatniej części. Instalacja zaczyna się bez
    żadnej czynności przy maszynie, więc nikt przy niej nie musi być,
    nikt nie musi się zgodzić i nikt nie musi tego zauważyć. Wystarczy
    dostęp do konta z dowolnego innego urządzenia.

    Skutkiem jest to, że przejęcie konta przestaje być sprawą wyłącznie
    danych w chmurze. Staje się drogą do umieszczenia oprogramowania na
    maszynach fizycznych, do których napastnik nigdy nie miał dostępu.

    Odnotowuję, że instalowane są wyłącznie programy ze sklepu, co
    zawęża zagrożenie — ale nie usuwa go, bo sklep zawiera także programy
    zdalnego dostępu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    programu na maszynie zleconą z innego urządzenia przez to samo konto.
  en: |
    The setting switches off the service taking in orders of laying on given from another device logged on to that
    same reckoning.

    The mechanism works so that the user chooses a program upon a telephone or upon the store's page and points
    out which of their machines it is to be laid on. The machine gets the order out of the network and lays the
    program on itself, with no part taken by whoever sits at it.

    The danger lies in that last part. The laying on begins with no doing at the machine, so nobody need be at it,
    nobody need assent and nobody need mark it. A reach of the reckoning from any other device suffices.

    The upshot is that the taking over of a reckoning ceases to be a matter of data in the cloud alone. It becomes
    a road for the putting of software upon bodily machines the attacker never had a reach of.

    I set down that only programs out of the store are laid on, which narrows the danger - but takes it not away,
    the store holding also programs of reach from afar.

    What an attacker gains while the item goes unmet: the laying on of a program upon the machine, ordered from
    another device through that same reckoning.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktokolwiek instaluje programy tą drogą.

    Miejscem wartym uwagi są stanowiska używane przez osoby korzystające
    ze sklepu na telefonie. Zdarza się, że program wybiera się tam,
    a instaluje na maszynie, bo tak jest wygodniej. Po zmianie trzeba
    będzie zainstalować go przy maszynie.

    Odnotowuję, że instalowanie ze sklepu przy samej maszynie działa
    dalej. Traci się zlecanie z innego urządzenia, a nie dostęp do
    sklepu.

    Zastrzegam, że na stanowisku, na którym nikt nie loguje się kontem
    producenta, usługa nie ma czego przyjmować i zmiana nie robi nic.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: instalowania programów przy maszynie, sklepu
    systemowego, aktualizowania, logowania, drukowania, dostępu do sieci.
  en: |
    The class is "needs review", and the object of the review is whether anybody at all lays programs on by that
    road.

    The place worth notice is stations used by people who use the store upon a telephone. It happens that a
    program is chosen there and laid on upon the machine, that being handier. After the change it will have to be
    laid on at the machine.

    I set down that the laying on out of the store at the machine itself works on. What is lost is the ordering
    from another device and not the reach of the store.

    I set down that upon a station where nobody logs on with a reckoning of the maker the service has nothing to
    take in and the change does nothing.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the laying on of programs at the machine, the system's store, the bringing up to
    date, logging on, printing, or the reach of the network.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Program wybrany na telefonie przestanie instalować się na tej maszynie i trzeba będzie zrobić to przy niej
      - Instalowanie ze sklepu przy samej maszynie działa dalej, więc traci się zlecanie, a nie dostęp do sklepu
      - Na stanowisku, na którym nikt nie loguje się kontem producenta, zmiana nie robi nic
      - Programy zainstalowane wcześniej tą drogą działają dalej i nie są usuwane
      - Aktualizowanie, logowanie, drukowanie, dostęp do sieci i praca programów pozostają bez zmian
    en:
      - A program chosen upon a telephone will cease to be laid on upon this machine and it will have to be done at it
      - The laying on out of the store at the machine itself works on, so the ordering is lost and not the reach of the store
      - Upon a station where nobody logs on with a reckoning of the maker the change does nothing
      - Programs laid on earlier by that road work on and are not taken away
      - The bringing up to date, logging on, printing, the reach of the network and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Użytkownik instaluje programy na tej maszynie, wybierając je na telefonie, i jest to przyjęty sposób pracy
    en:
      - The user lays programs on upon this machine by choosing them upon a telephone, and that is a settled manner of work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PushToInstall'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PushToInstall'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'PushToInstall' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PushToInstall' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PushToInstall' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-pushtoinstall

notes:
  pl: |
    Reguła opisuje drogę, o której mało kto pamięta, że istnieje. Warto,
    żeby aplikacja postawiła ją jednym zdaniem: instalacja zaczyna się
    bez żadnej czynności przy maszynie.

    Argument wart postawienia wprost dotyczy skutków przejęcia konta.
    Dopóki ta droga jest otwarta, przejęte konto producenta nie jest
    sprawą danych w chmurze — jest drogą do umieszczenia oprogramowania
    na maszynach fizycznych, do których napastnik nie ma dostępu.

    Odnotowuję zawężenie: instalowane są wyłącznie programy ze sklepu.
    Warto to powiedzieć uczciwie, bo obniża ocenę — i warto od razu
    dodać, że sklep zawiera również programy zdalnego dostępu, więc
    zawężenie nie zamyka sprawy.
  en: |
    The rule sets out a road few remember to be there at all. It is well that the application put it in one
    sentence: the laying on begins with no doing at the machine.

    The argument worth putting outright touches what follows from the taking over of a reckoning. While this road
    stands open, a taken reckoning of the maker is no matter of data in the cloud - it is a road for the putting
    of software upon bodily machines the attacker has no reach of.

    I set down the narrowing: only programs out of the store are laid on. It is worth saying honestly, it lowering
    the grading - and worth adding at once that the store holds also programs of reach from afar, so the narrowing
    settles not the matter.
