id: win11-logon-banner-title

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Tytuł komunikatu wyświetlanego przed zalogowaniem ustawiony
    en: The title of the message shown before signing in set
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Przed ekranem logowania system potrafi wyświetlić komunikat, który
    użytkownik musi potwierdzić. Składa się on z dwóch części: tytułu
    i treści. Punkt dotyczy tytułu.

    Sam w sobie komunikat nie zatrzymuje nikogo. Nie jest zabezpieczeniem
    technicznym i nie należy go za takie uważać — kto ma poświadczenia, ten
    kliknie i wejdzie. Jego wartość jest inna i leży poza techniką.

    Po pierwsze, odbiera argument. Osoba, która dostała się do maszyny bez
    uprawnienia, nie może później twierdzić, że nie wiedziała, iż wchodzi na
    system objęty ograniczeniami. W wielu porządkach prawnych to rozróżnienie
    rozstrzyga o tym, czy da się cokolwiek z tym zrobić.

    Po drugie, jest oświadczeniem. Komunikat mówi wprost, że korzystanie
    z maszyny jest rejestrowane i że dostęp mają wyłącznie osoby upoważnione.
    Bez tego zdania zapis z dziennika bywa podważany jako obserwowanie ludzi
    bez ich wiedzy.

    Punkt wymaga, żeby tytuł był ustawiony i niepusty. Jego treść jest decyzją
    organizacji, a nie benchmarku.
  en: |
    Before the sign-in screen the system can show a message the user has to confirm.
    It has two parts: a title and a body. The item concerns the title.

    The message stops nobody in itself. It is not a technical safeguard and should not
    be taken for one - whoever has the credentials will click and go in. Its worth is
    of another kind and lies outside technique.

    First, it takes away an argument. Somebody who reached the machine without
    permission cannot claim afterwards that they did not know they were entering a
    system under restrictions. In many legal orders that distinction settles whether
    anything can be done about it.

    Second, it is a declaration. The message says outright that use of the machine is
    recorded and that only authorised people have access. Without that sentence a log
    record gets challenged as watching people without their knowledge.

    The item requires the title to be set and not empty. Its wording is the
    organisation's decision, not the benchmark's.

disruption_description:
  pl: |
    Zmiana dokłada wszystkim ekran do potwierdzenia przed logowaniem, więc
    wymaga świadomego wdrożenia i uprzedzenia ludzi.

    Skutek widzi każdy użytkownik przy każdym logowaniu: dodatkowe okno
    i dodatkowe kliknięcie. Na stanowisku używanym raz dziennie jest to koszt
    znikomy; tam, gdzie ludzie logują się kilkanaście razy na zmianę, bywa
    odczuwalny i warto uprzedzić, zanim zacznie być zgłaszany jako awaria.

    Drugi skutek jest poważniejszy i dotyczy logowania bez człowieka.
    Automatyczne zalogowanie przy starcie, stanowiska kioskowe, maszyny
    testowe wstające same po restarcie i część narzędzi łączących się pulpitem
    zdalnym zatrzymają się na tym oknie. Objawem jest maszyna, która wstała,
    ale do niczego się nie zalogowała.

    Trzeci dotyczy pulpitu zdalnego. Klient pokazuje komunikat przed sesją,
    więc automatyczne uruchamianie sesji z narzędzia albo ze skryptu może
    wymagać dodatkowego potwierdzenia.

    Punkt działa w parze z treścią komunikatu, opisaną osobną regułą. Sam tytuł
    bez treści nie wyświetla się w ogóle — wdrożenie połowy nie daje ani
    komunikatu, ani zgodności.

    Nie ma restartu, ale skutek widać dopiero przy następnym logowaniu.
  en: |
    The change adds a screen to confirm before signing in for everybody, so it calls
    for a deliberate rollout and for telling people beforehand.

    Every user sees the effect at every sign-in: an added window and an added click.
    At a station used once a day the cost is slight; where people sign in a dozen
    times a shift it can be felt and is worth forewarning before it gets reported as a
    fault.

    The second effect is graver and concerns signing in with no person present.
    Automatic sign-in at start, kiosk stations, test machines coming up by themselves
    after a restart and some tools connecting by remote desktop will stop at this
    window. The symptom is a machine that has come up but signed in to nothing.

    The third concerns remote desktop. The client shows the message before the
    session, so starting a session automatically from a tool or a script may need an
    added confirmation.

    The item works in a pair with the message's body, described by a rule of its own.
    A title without a body is not shown at all - applying half gives neither the
    message nor compliance.

    There is no restart, but the effect shows only at the next sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Każdy użytkownik zobaczy dodatkowe okno do potwierdzenia przy każdym logowaniu
      - Automatyczne zalogowanie przy starcie zatrzyma się na tym oknie
      - Stanowiska kioskowe i maszyny wstające same po restarcie nie zalogują się bez człowieka
      - Uruchamianie sesji pulpitu zdalnego ze skryptu może wymagać dodatkowego potwierdzenia
    en:
      - Every user sees an added window to confirm at every sign-in
      - Automatic sign-in at start stops at this window
      - Kiosk stations and machines coming up by themselves after a restart do not sign in without a person
      - Starting a remote desktop session from a script may need an added confirmation
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna loguje się sama przy starcie i pracuje bez obsługi
      - Stanowisko pracuje w trybie kioskowym albo jako maszyna testowa wstająca po restarcie
    en:
      - The machine signs in by itself at start and works unattended
      - The station works in kiosk mode or as a test machine coming up after a restart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # An entry present but empty shows no message at all, so it is reported
      # apart from one that is missing entirely.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'legalnoticecaption'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      elseif (([string]$value).Trim() -eq '') { 'EMPTY' }
      else { 'SET' }
    } catch {
      'CHECK_ERROR'
    }
  expected: SET
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'legalnoticecaption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording below is a starting point, not a requirement of the item.
    # Replace it with the organisation's own before rolling this out widely.
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'legalnoticecaption' -Value 'Authorised access only' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-title-for-users-attempting-to-log-on

notes:
  pl: |
    Reguła sprawdza wyłącznie to, czy tytuł jest ustawiony i niepusty. Treści
    nie ocenia i ocenić nie może — brzmienie komunikatu zależy od prawa
    miejscowego i od tego, co organizacja chce oświadczyć, a to nie jest rzecz
    do rozstrzygnięcia w regule technicznej.

    Wpis wstawiany przez naprawę jest punktem wyjścia, a nie wymaganiem punktu.
    Przed wdrożeniem na wielu stanowiskach należy zastąpić go brzmieniem
    uzgodnionym w organizacji.

    Wpis pusty jest raportowany osobno od brakującego, bo objaw jest ten sam —
    komunikat się nie pokazuje — a przyczyna i naprawa inne.

    Gałąź zasad systemowych jest wspólna z kilkudziesięcioma innymi
    ustawieniami, więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The rule checks only whether the title is set and not empty. It does not judge the
    wording and cannot - how the message reads depends on local law and on what the
    organisation wishes to declare, and that is not a matter for a technical rule to
    settle.

    The entry the remediation writes is a starting point, not a requirement of the
    item. Before rolling it out across many stations it should be replaced with the
    wording agreed in the organisation.

    An empty entry is reported apart from a missing one, because the symptom is the
    same - no message appears - while the cause and the fix differ.

    The system policies key is shared with several dozen other settings, so rollback
    removes the entry alone.
