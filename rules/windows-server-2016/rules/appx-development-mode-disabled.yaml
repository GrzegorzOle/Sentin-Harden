id: win2016-appx-development-mode-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Tryb wytwarzania aplikacji pakowanych zablokowany
    en: The development mode for packaged applications blocked
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje tryb, w którym system uruchamia aplikację pakowaną
    wprost z katalogu plików, bez zbudowania i podpisania pakietu.

    Tryb ten powstał po to, żeby piszący oprogramowanie mógł uruchomić
    swoją pracę bez przechodzenia przez pełną procedurę wydania. Skutkiem
    jest jednak to, że katalog z plikami staje się uruchamianą aplikacją —
    bez pakietu, bez podpisu i bez niczego, co dałoby się sprawdzić przed
    uruchomieniem.

    Jest to ustawienie szersze niż poprzednie i warto tę kolejność
    zapamiętać. Tamto dopuszczało pakiet podpisany, choć spoza sklepu;
    to dopuszcza zbiór plików, pod którym nie stoi nikt. Napastnik
    z dostępem do maszyny zyskuje sposób uruchomienia własnego kodu
    w postaci, której nie da się powiązać z żadnym wydawcą.

    Na serwerze tryb ten nie ma zastosowania, chyba że maszyna służy do
    wytwarzania oprogramowania. Wtedy punkt jest niewykonalny i trzeba to
    zapisać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    uruchomienia własnego kodu jako aplikacji, bez pakietu i bez podpisu,
    którego nie da się przypisać żadnemu wydawcy.
  en: |
    The setting blocks the mode in which the system starts a packaged application straight from a
    directory of files, without a package having been built and signed.

    That mode came about so that whoever writes software could run their work without going through the
    full procedure of a release. The upshot, though, is that a directory of files becomes a started
    application - with no package, no signature and nothing that could be checked before the starting.

    It is a wider setting than the one before, and that order is worth keeping in mind. That one admitted
    a signed package, though from outside the store; this one admits a set of files behind which stands
    nobody. An attacker with access to the machine gains a way of running their own code in a form that
    cannot be tied to any publisher.

    On a server that mode is of no use unless the machine serves for making software. Then the item is
    not feasible and that has to be written down.

    What an attacker gains while the item goes unmet: a way of running their own code as an application,
    with no package and no signature, that cannot be set down to any publisher.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie sprowadza się do jednego
    pytania: czy ktoś na tej maszynie pisze oprogramowanie.

    Jeżeli tak, wykonanie punktu zatrzymuje tę pracę. Uruchomienie aplikacji
    z katalogu przestaje być możliwe, a jedyną drogą zostaje zbudowanie
    i podpisanie pakietu — co wydłuża każdy obieg o kroki, które dotąd były
    pomijane. Nie jest to regresja techniczna, tylko zmiana sposobu pracy
    konkretnej osoby, i tak należy o niej mówić.

    Jeżeli nie, wykonanie nie zmienia nic. Na serwerze bez wytwarzania
    oprogramowania tryb ten nie jest przez nic używany.

    Rzecz warta rozróżnienia dotyczy zależności między tym punktem
    a poprzednim. Ustawienia są osobne i nie wynikają jedno z drugiego,
    ale zakresy się nakładają. Wykonanie samego tego punktu zostawia
    otwartą drogę przez pakiet podpisany; wykonanie samego poprzedniego
    zostawia otwartą drogę przez katalog. Domknięcie wymaga obu.

    Czego to nie psuje: aplikacji już zainstalowanych, aplikacji ze sklepu,
    instalatorów klasycznych, ról, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review comes down to one question: does anybody write software on
    this machine.

    If so, carrying the item out stops that work. Starting an application from a directory ceases to be
    possible, and the one road left is the building and signing of a package - which lengthens every round
    by steps that until now were passed over. It is no technical regression but a change in a particular
    person's way of working, and so it ought to be spoken of.

    If not, the carrying out changes nothing. On a server without the making of software that mode is used
    by nothing.

    A thing worth telling apart concerns the bearing between this item and the one before. The settings are
    separate and do not follow one from another, but their reaches overlap. Carrying out this item alone
    leaves the road through a signed package open; carrying out the one before alone leaves the road
    through a directory open. The shutting calls for both.

    What this does not break: applications already installed, applications from the store, classic
    installers, roles, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Uruchamianie aplikacji pakowanej wprost z katalogu plików przestaje być możliwe
      - Piszący oprogramowanie musi zbudować i podpisać pakiet przy każdym obiegu, co wydłuża pracę
      - Wykonanie samego tego punktu zostawia otwartą drogę przez pakiet podpisany spoza sklepu
      - Aplikacje już zainstalowane i pobierane ze sklepu działają dalej
      - Instalatory klasyczne, role, usługi i sieć pozostają bez zmian
    en:
      - Starting a packaged application straight from a directory of files ceases to be possible
      - Whoever writes software has to build and sign a package at every round, which lengthens the work
      - Carrying out this item alone leaves the road through a signed package from outside the store open
      - Applications already installed and fetched from the store work on
      - Classic installers, roles, services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna służy do wytwarzania oprogramowania i ktoś uruchamia na niej aplikacje wprost z katalogu plików
      - Narzędzie diagnostyczne producenta sprzętu jest uruchamiane na tej maszynie w tym trybie
    en:
      - The machine serves for making software and somebody starts applications on it straight from a directory of files
      - A diagnostic tool of the hardware's maker is started on this machine in that mode
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      $name = 'AllowDevelopmentWithoutDevLicense'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowDevelopmentWithoutDevLicense'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the wider of the two settings about packages - it lets a directory
    # of loose files be started as an application. Where somebody writes software
    # on this machine, that work stops.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDevelopmentWithoutDevLicense' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/get-started/enable-your-device-for-development

notes:
  pl: |
    Punkt zamyka blok i tworzy z poprzednim parę, której nie warto
    rozdzielać. Obie reguły dotyczą tego, skąd bierze się kod uruchamiany
    jako aplikacja pakowana, i obie zostawiają lukę wykonane osobno.

    Aplikacja powinna tę zależność pokazać wprost, bo jest to jedno
    z niewielu miejsc w zestawie, gdzie dwie reguły trzeba rozstrzygnąć
    razem albo nie rozstrzygać wcale. Wykonanie jednej z nich daje
    poczucie domknięcia, którego nie ma.

    Warto też nazwać rodzaj uciążliwości. Nie jest to awaria ani regresja —
    jest to wydłużenie pracy konkretnej osoby o kroki, które dotąd
    pomijała. Opis, który mówi „przestanie działać", będzie w tym miejscu
    nieprawdziwy i zostanie odrzucony przez każdego, kto tę pracę zna.

    Kategoria wysoka przy poziomie drugim jest postawiona zgodnie
    z kryterium. Napastnik musi mieć już dostęp do maszyny, ale wtedy zyskuje
    uruchomienie kodu w postaci niepowiązanej z żadnym wydawcą — czyli
    dokładnie to, czego szuka się po wejściu.
  en: |
    The item shuts the block and makes with the one before a pair not worth parting. Both rules concern
    where the code started as a packaged application comes from, and both leave a gap when carried out
    alone.

    The application ought to show that bearing outright, it being one of the few places in the set where
    two rules have to be settled together or not settled at all. Carrying one of them out gives a sense of
    a shutting that is not there.

    Worth naming too is the kind of disruption. It is no fault and no regression - it is the lengthening
    of a particular person's work by steps they until now passed over. A description saying "will cease to
    work" would in this place be untrue and would be dismissed by anybody who knows that work.

    The high category at the second level is set in keeping with the criterion. The attacker must already
    have access to the machine, but then they gain the running of code in a form tied to no publisher -
    which is to say exactly what is looked for after an entry.
