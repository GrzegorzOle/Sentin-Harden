id: win2025-password-minimum-age

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Najkrótszy okres, przez jaki hasło musi obowiązywać
    en: The shortest term a password has to bind for
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby od ustawienia hasła do jego następnej zmiany
    upłynął co najmniej jeden dzień.

    Brzmi to jak utrudnienie bez powodu i takim jest, dopóki nie zestawi się
    go z historią haseł. Historia pamięta kilkanaście czy kilkadziesiąt
    poprzednich haseł po to, żeby nie dało się wrócić do starego. Bez
    minimalnego okresu ważności całą tę historię można przewinąć w kilka
    minut: zmienić hasło tyle razy, ile wynosi długość historii, i na końcu
    ustawić z powrotem to, które właśnie wygasło.

    Punkt istnieje więc wyłącznie po to, żeby dwa pozostałe ustawienia tej
    trójki dało się wyegzekwować. Osobno nie chroni przed niczym i dlatego
    ma kategorię niską.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — ale historia haseł przestaje działać, a wraz z nią
    wygasanie. Trzy punkty, z których dwa są wdrożone, dają w tym układzie
    tyle, co zero.

    Na serwerze dotyczy to przede wszystkim kont administracyjnych
    i usługowych, przy których zmiana hasła bywa wykonywana ręcznie,
    w pośpiechu, przez osobę znającą to ograniczenie i potrafiącą je obejść.
  en: |
    The setting takes that at least one day pass between a password being set and its next
    change.

    It sounds an obstacle without reason and is one until it is set beside the password
    history. The history remembers a dozen or a few dozen former passwords so that a return
    to an old one is impossible. Without a minimum term of validity that whole history can
    be wound through in a few minutes: change the password as many times as the history is
    long, and at the end set back the one that has just expired.

    The item therefore exists solely so that the other two of this trio can be enforced.
    Apart, it guards against nothing and so carries a low category.

    What an attacker gains while the item goes unmet: nothing directly - but the password
    history stops working, and with it the expiry. Three items of which two are rolled out
    give, in that arrangement, as much as none.

    On a server that concerns above all administrative and service accounts, at which a
    password change is sometimes done by hand, in haste, by someone who knows that limit
    and can get round it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na serwerze istnieje procedura zakładania
    kont, w której hasło jest ustawiane dwa razy tego samego dnia.

    Jest to przypadek zdarzający się częściej, niż wynikałoby z założeń:
    administrator zakłada konto z hasłem tymczasowym, przekazuje je, a
    właściciel konta zmienia je od razu. Przy minimalnym okresie ważności
    druga zmiana zostanie odrzucona.

    Mechanizm ma tutaj furtkę i warto o niej wiedzieć: zmiana hasła
    dokonana przez administratora nie podlega temu ograniczeniu. Dotyczy ono
    wyłącznie zmiany dokonywanej przez samego właściciela konta. Procedura
    z hasłem tymczasowym działa więc dalej, o ile pierwsze hasło ustawia
    administrator, a nie skrypt pracujący na koncie zwykłym.

    Na serwerze członkowskim zasada obejmuje konta lokalne. Na kontrolerze
    domeny obejmuje wszystkie konta w domenie.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether a procedure for setting up accounts exists on the server
    in which a password is set twice on the same day.

    It is a case happening more often than assumptions would suggest: an administrator sets
    up an account with a temporary password, hands it over, and the account's owner changes
    it at once. With a minimum term of validity the second change will be refused.

    The mechanism has a door here and it is worth knowing of it: a password change made by
    an administrator is not subject to that limit. It concerns a change made by the
    account's owner themselves alone. A procedure with a temporary password thus goes on
    working, so far as the first password is set by an administrator rather than by a
    script working on an ordinary account.

    On a member server the policy takes in local accounts. On a domain controller it takes
    in every account in the domain.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Zmiana hasła dokonana przez właściciela konta dwa razy tego samego dnia zostaje odrzucona
      - Skrypty zakładające konta i od razu zmieniające hasło mogą przestać działać
      - Zmiana hasła dokonana przez administratora nie podlega temu ograniczeniu
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
    en:
      - A password change made by the account's owner twice the same day is refused
      - Scripts setting up accounts and changing the password at once may stop working
      - A password change made by an administrator is not subject to that limit
      - On a domain controller the change takes in every account in the domain at once
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zakładanie kont opiera się na skrypcie zmieniającym hasło zaraz po utworzeniu konta
    en:
      - Setting up accounts rests on a script changing the password right after the account is made
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MinimumPasswordAge'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordAge = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-age

notes:
  pl: |
    Zero nie jest tutaj wartością neutralną, tylko wyłączeniem historii
    haseł tylnymi drzwiami. Warto o tym pamiętać przy czytaniu raportu,
    w którym historia bywa pokazana jako spełniona obok tego punktu
    niespełnionego — taki zestaw opisuje ochronę pozorną.

    Punkt zamyka trójkę wraz z okresem ważności i historią. Wdrożenie dwóch
    z trzech nie daje dwóch trzecich ochrony; daje zero, bo brakujący punkt
    znosi pozostałe.

    Zakres zasady zależy od roli serwera: na członkowskim obejmuje konta
    lokalne, na kontrolerze domeny — całą domenę.
  en: |
    Zero is not a neutral value here but a switching off of the password history by the
    back door. It is worth keeping in mind when reading a report in which the history is
    sometimes shown as met beside this item unmet - such a pair describes apparent
    protection.

    The item closes the trio along with the term of validity and the history. Rolling out
    two of three does not give two thirds of the protection; it gives none, since the
    missing item undoes the rest.

    The policy's reach depends on the server's role: on a member server it takes in local
    accounts, on a domain controller the whole domain.
