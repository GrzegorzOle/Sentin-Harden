id: win2016-machine-account-password-age-limited

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Okres ważności hasła konta maszyny ograniczony do 30 dni
    en: Machine account password validity limited to 30 days
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza okres, po którym maszyna zmienia hasło swojego konta
    w domenie, do trzydziestu dni.

    Konto maszyny jest kontem jak każde inne i ma hasło, którego nie zna żaden
    człowiek. Maszyna ustala je sama przy przyłączeniu do domeny i sama zmienia
    co jakiś czas. Na tym haśle opiera się kanał między maszyną a kontrolerem
    domeny — ten sam, którym idą zasady grupy, uwierzytelnienie i informacja
    o przynależności do grup.

    Hasło konta maszyny ma jedną cechę, która czyni je cennym: nikt go nie
    wpisuje, więc jego przejęcie nie zostawia śladu w postaci nieudanych
    logowań. Napastnik, który odczyta je z pamięci albo z kopii stanu maszyny,
    dostaje tożsamość samej maszyny — a więc możliwość podszycia się pod nią
    wobec kontrolera domeny.

    Znaczenie tego punktu polega na czasie. Krótszy okres ważności oznacza
    krótsze okno, w którym odczytane hasło jest jeszcze coś warte. Na
    trzydziestu dniach kopia stanu maszyny sprzed kwartału jest bezużyteczna;
    przy haśle niewygasającym jest ważna tak długo, jak długo maszyna istnieje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tożsamość
    maszyny w domenie, odczytaną raz i ważną bez końca.
  en: |
    The setting limits the period after which the machine changes the password of
    its account in the domain to thirty days.

    A machine account is an account like any other and has a password no person
    knows. The machine settles it itself on joining the domain and changes it itself
    from time to time. On that password rests the channel between the machine and
    the domain controller - the same one that carries group policy, authentication,
    and word of group membership.

    The machine account password has one trait that makes it valuable: nobody types
    it, so taking it over leaves no trace in the shape of failed sign-ins. An
    attacker who reads it out of memory or out of a copy of the machine's state gets
    the machine's own identity - and thereby the means of passing for it before the
    domain controller.

    This item's significance rests on time. A shorter validity period means a
    shorter window in which a password once read is still worth anything. At thirty
    days a copy of the machine's state from a quarter ago is useless; with a password
    that never expires it is good for as long as the machine exists.

    What an attacker gains while the item goes unmet: the machine's identity in the
    domain, read once and valid without end.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana hasła konta maszyny jest operacją, której
    nikt nie widzi: maszyna uzgadnia je z kontrolerem domeny sama, bez udziału
    człowieka i bez przerwy w pracy.

    Jest jednak jeden scenariusz, który trzeba znać, bo jest realny i myli
    ludzi od lat. Maszyna wyłączona na dłużej niż okres ważności — odłożona
    maszyna wirtualna, serwer zapasowy uruchamiany raz na kwartał, obraz
    przywrócony z kopii sprzed kilku miesięcy — wraca do sieci z hasłem
    nieaktualnym i traci zaufany kanał do domeny. Objawia się to komunikatem
    o zerwanej relacji zaufania przy logowaniu.

    Nie jest to jednak skutek tej zmiany, tylko sposobu obchodzenia się
    z kopiami maszyn. Skrócenie okresu jedynie przybliża moment, w którym
    problem się ujawni. Warto to rozróżnić, zamiast obwiniać regułę.

    Czego to nie psuje: pracy maszyny w domenie, logowania użytkowników, zasad
    grupy, kont usług ani niczego, co widać w codziennej pracy.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Changing the machine account password is an
    operation nobody sees: the machine settles it with the domain controller itself,
    without a person's part in it and without a break in the working.

    There is one scenario to know of, though, since it is real and has been
    misleading people for years. A machine switched off for longer than the validity
    period - a virtual machine set aside, a standby server started once a quarter,
    an image restored from a copy some months old - returns to the network with a
    password out of date and loses its trusted channel to the domain. It shows
    itself as a message about a broken trust relationship at sign-in.

    That is not an effect of this change, though, but of the way copies of machines
    are handled. Shortening the period only brings nearer the moment the problem
    comes to light. Worth telling apart rather than blaming the rule.

    What this does not break: the machine's working in the domain, users' sign-ins,
    group policy, service accounts, or anything visible in daily work.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Maszyna wyłączona dłużej niż okres ważności wraca do sieci z nieaktualnym hasłem i traci zaufany kanał do domeny
      - Obraz przywrócony z kopii sprzed kilku miesięcy zgłasza zerwaną relację zaufania przy logowaniu
      - Serwer zapasowy uruchamiany raz na kwartał wymaga ponownego przyłączenia do domeny częściej niż dotąd
      - Praca maszyny w domenie, logowanie użytkowników i zasady grupy pozostają bez zmian
    en:
      - A machine switched off longer than the validity period returns with an out-of-date password and loses its trusted channel to the domain
      - An image restored from a copy some months old reports a broken trust relationship at sign-in
      - A standby server started once a quarter calls for rejoining the domain more often than before
      - The machine working in the domain, users signing in and group policy stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest zapasowa i bywa wyłączona dłużej niż ustawiany okres ważności
      - Maszyna bywa przywracana z obrazów starszych niż ustawiany okres ważności
    en:
      - The machine is a standby one and is at times switched off longer than the validity period set
      - The machine is at times restored from images older than the validity period set
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it stands for a password that never
      # expires, not for the shortest possible period. Reported apart, so a report
      # cannot read it as the strictest setting in the range.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'MaximumPasswordAge'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_EXPIRY' }
        elseif ([int]$value -le 30) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'MaximumPasswordAge'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Thirty days shortens the window in which a password read out of memory is
    # still worth anything. The machine settles the change with the controller
    # itself - no restart and no break in the working.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaximumPasswordAge' -Value 30 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-maximum-machine-account-password-age

notes:
  pl: |
    Audyt zgłasza zero jako osobny stan. Zero nie oznacza tutaj najkrótszego
    okresu, tylko hasło niewygasające — czyli dokładne przeciwieństwo tego,
    o co chodzi w tym punkcie. Przy porównaniu liczbowym przeszłoby jako
    wartość najostrzejsza.

    Reguła dotyczy wyłącznie maszyn przyłączonych do domeny. Na maszynie
    w grupie roboczej nie ma konta maszyny i ustawienie nie ma skutku — wynik
    zgodny nie mówi wtedy nic o bezpieczeństwie.

    Punkt czyta się razem z regułą o wyłączeniu zmian hasła konta maszyny.
    Tamta rozstrzyga, czy hasło w ogóle się zmienia; ta — jak często. Tamta
    niespełniona czyni tę bezprzedmiotową, więc kolejność naprawy jest ustalona.
  en: |
    The audit reports zero as a state apart. Zero does not mean the shortest period
    here but a password that never expires - the exact opposite of what this item is
    about. Under a numeric comparison it would pass as the strictest value.

    The rule concerns machines joined to a domain alone. On a machine in a workgroup
    there is no machine account and the setting has no effect - a compliant result
    then says nothing about safety.

    The item reads together with the rule on switching off machine account password
    changes. That one settles whether the password changes at all; this one, how
    often. That one unmet makes this one beside the point, so the order of the mend
    is settled.
