id: fedora44-root-only-group-gid0

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.4.2.3
  section: Access Control > User Accounts and Environment > Configure root and system accounts and environment
  title:
    pl: Tylko grupa root ma GID 0
    en: Ensure group root is the only GID 0 group
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Druga grupa o GID 0 to ta sama grupa root pod inną nazwą. Dodanie do niej
    użytkownika daje mu dostęp do plików grupy root, a w /etc/group nie
    wygląda to jak dodanie do grupy root.

    Punkt wymaga, żeby w /etc/group tylko grupa root miała GID 0.
  en: |
    A second group with GID 0 is the same root group under another name.
    Adding a user to it gives them access to the files of the root group,
    and in /etc/group it does not look like adding them to the root group.

    The item requires that only the root group has GID 0 in /etc/group.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/group.
  en: |
    Nobody will notice: the check only reads /etc/group.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/group ] || { echo "NOT_OK:no-/etc/group"; exit 0; }
    r=$(awk -F: '$1 == "root" { print $3; exit }' /etc/group)
    o=$(awk -F: '$1 != "root" && $3 ~ /^[0-9]+$/ && $3 + 0 == 0 { printf "%s%s", s, $1; s = "," }' /etc/group)
    if [ "$r" != 0 ]; then echo "NOT_OK:root-group-gid=${r:-none}${o:+,gid0=$o}"
    elif [ -n "$o" ]; then echo "NOT_OK:gid0=$o"
    else echo "OK:root-only"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/group.5.html

notes:
  pl: |
    Wynik NOT_OK podaje nazwy innych grup z GID 0 albo inny GID grupy root.
    Taką grupę usuwa się ręcznie poleceniem groupdel albo nadaje jej inny
    GID poleceniem groupmod -g, a potem poprawia grupę jej plików. Reguła
    tylko sprawdza stan.
  en: |
    The NOT_OK result gives the names of other groups with GID 0 or another
    GID of the root group. Such a group is removed by hand with groupdel or
    given another GID with groupmod -g, and then the group of its files is
    fixed. The rule only checks the state.
