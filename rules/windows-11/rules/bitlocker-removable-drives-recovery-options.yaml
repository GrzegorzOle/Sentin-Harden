id: win11-bitlocker-removable-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do nośników wymiennych ustalony
    en: The way of recovering access to removable media settled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Nośnik wymienny gubi się częściej niż jakikolwiek inny nośnik i częściej niż
    jakikolwiek inny bywa szyfrowany doraźnie, przez osobę, która robi to raz na
    pół roku. Klucz odzyskiwania powstaje wtedy przy okazji, zapisuje się go
    tam, gdzie akurat wygodnie, i przy następnym użyciu nikt nie wie gdzie.

    Punkt odbiera tę decyzję osobie szyfrującej. Klucz ma powstać, ma trafić do
    usługi katalogowej, szyfrowanie ma nie ruszyć, dopóki tam nie trafi,
    a kreator ma nie pokazywać opcji pozwalających to ominąć.

    Skutek widać dopiero przy zgubionym nośniku. Nośnik zaszyfrowany kartą albo
    hasłem, którego nikt nie pamięta, jest bez klucza odzyskiwania stracony
    razem z zawartością — a zawartość nośnika wymiennego to zwykle kopia czegoś,
    co komuś było w danej chwili potrzebne poza biurem.

    Jak w punktach bliźniaczych, zamknięta zostaje też droga pełnomocnika
    odzyskiwania danych.
  en: |
    A removable medium is lost more often than any other and more often than any
    other is encrypted ad hoc, by someone who does it once in six months. The
    recovery key then comes into being in passing, is saved wherever is convenient at
    the time, and by the next use nobody knows where.

    The item takes that decision away from whoever is encrypting. The key is to come
    into being, to go to the directory service; encryption is not to start until it
    does, and the wizard is not to show options letting that be bypassed.

    The effect shows only when a medium is lost. A medium encrypted with a card, or
    with a password nobody remembers, is - without the recovery key - lost along with
    its contents, and the contents of a removable medium are usually a copy of
    something somebody needed outside the office at that moment.

    As in the twin items, the data recovery agent's route is closed off too.

disruption_description:
  pl: |
    Na maszynie spoza domeny punkt zatrzymuje szyfrowanie nośników wymiennych,
    i trzeba to rozstrzygnąć przed wdrożeniem.

    Warunek zapisania klucza w usłudze katalogowej przed rozpoczęciem
    szyfrowania jest bezwzględny. Bez domeny albo bez łączności z nią kreator
    kończy się błędem. Jest to odczuwalne bardziej niż przy dyskach stałych,
    bo nośnik szyfruje się zwykle w pośpiechu, przed wyjściem, i komunikat
    trafia w najgorszy możliwy moment.

    Zestawienie z zakazem zapisu na nośnikach niezaszyfrowanych daje układ,
    w którym maszyna spoza domeny nie zapisze na nośniku niczego: zapis bez
    szyfrowania jest zabroniony, a szyfrowania nie da się założyć. Jest to
    kombinacja, którą trzeba sprawdzić przed wdrożeniem obu punktów naraz.

    Nośniki zaszyfrowane wcześniej otwierają się bez zmian.

    Nie ma restartu. Zmiana obowiązuje przy następnym włączeniu szyfrowania.
  en: |
    On a machine outside a domain the item halts the encryption of removable media,
    and that has to be settled before the rollout.

    The condition to write the key into the directory service before encryption
    starts is absolute. Without a domain, or without a connection to it, the wizard
    ends with an error. It is felt more keenly than with fixed drives, because a
    medium is usually encrypted in a hurry, on the way out, and the message lands at
    the worst possible moment.

    Put beside the ban on writing to unencrypted media, it gives an arrangement in
    which a machine outside a domain will write nothing to a medium at all: writing
    without encryption is forbidden, and encryption cannot be set up. That is a
    combination to check before rolling out both items together.

    Media encrypted earlier open unchanged.

    There is no restart. The change takes effect the next time encryption is switched
    on.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na maszynie spoza domeny zaszyfrowanie nośnika wymiennego nie ruszy, bo klucza nie ma gdzie zapisać
      - Razem z zakazem zapisu na nośnikach niezaszyfrowanych maszyna spoza domeny nie zapisze na nośniku niczego
      - Użytkownik przestaje wybierać w kreatorze, gdzie zapisać klucz odzyskiwania
      - Certyfikat pełnomocnika odzyskiwania danych przestaje otwierać nośniki szyfrowane po wdrożeniu
    en:
      - On a machine outside a domain, encrypting a removable medium will not start, as there is nowhere to write the key
      - Together with the ban on writing to unencrypted media, a machine outside a domain will write nothing to a medium at all
      - The user stops choosing in the wizard where to save the recovery key
      - The data recovery agent's certificate stops opening media encrypted after the rollout
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny nie należą do domeny albo usługa katalogowa nie przyjmuje informacji odzyskiwania
      - Nośniki szyfruje się na maszynach pracujących poza zasięgiem sieci firmowej
    en:
      - The machines do not belong to a domain, or the directory service does not accept recovery information
      - Media are encrypted on machines working out of reach of the company network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        RDVRecovery                     = 1
        RDVManageDRA                    = 0
        RDVRecoveryPassword             = 2
        RDVRecoveryKey                  = 2
        RDVHideRecoveryPage             = 1
        RDVActiveDirectoryBackup        = 1
        RDVActiveDirectoryInfoToStore   = 1
        RDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'RDVRecovery', 'RDVManageDRA', 'RDVRecoveryPassword', 'RDVRecoveryKey',
      'RDVHideRecoveryPage', 'RDVActiveDirectoryBackup',
      'RDVActiveDirectoryInfoToStore', 'RDVRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      RDVRecovery                     = 1
      RDVManageDRA                    = 0
      RDVRecoveryPassword             = 2
      RDVRecoveryKey                  = 2
      RDVHideRecoveryPage             = 1
      RDVActiveDirectoryBackup        = 1
      RDVActiveDirectoryInfoToStore   = 1
      RDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.key_existed) {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    } else {
      foreach ($entry in @($b.values)) {
        if ($entry.existed) {
          Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
        } else {
          Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest trzecią z rodziny i czyta osiem wartości naraz z tego samego
    powodu co dwie poprzednie: maszyna ustawiona w połowie przechodziłaby jako
    ustawiona.

    Warto czytać ten punkt razem z wymaganiem karty na nośnikach wymiennych
    i z zakazem zapisu na nośnikach niezaszyfrowanych. Trzy punkty razem
    domykają nośnik szczelnie, ale wymagają naraz domeny, czytnika i urzędu
    certyfikacji. Wdrożenie części z nich zostawia stany niewygodne, opisane
    w regułach osobno.

    Wartości leżą w tej samej gałęzi co bliźniacze wpisy dla dysku systemowego
    i dysków stałych. Reguły są osobne, bo osobne są punkty benchmarku, ale
    kopia zapasowa każdej z nich obejmuje wyłącznie własne osiem wartości —
    wycofanie jednej nie cofa pozostałych.
  en: |
    The rule is the third of the family and reads eight values at once for the same
    reason as the previous two: a machine set halfway would pass as set.

    The item is worth reading together with the requirement for a card on removable
    media and the ban on writing to unencrypted media. The three together seal a
    medium tightly, but call at once for a domain, a reader and a certification
    authority. Rolling out some of them leaves awkward states, described in the rules
    separately.

    The values sit in the same key as the twin entries for the system drive and fixed
    drives. The rules are separate because the benchmark's items are separate, but
    each one's backup covers only its own eight values - rolling one back does not
    undo the others.
