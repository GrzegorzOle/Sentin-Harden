id: win2025-ftp-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera przesyłania plików starszym protokołem wyłączona
    en: The server service for transferring files by the older protocol disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę serwera przesyłania plików starszym protokołem.
    Usługa ta nasłuchuje na połączenia i pozwala zdalnym stronom pobierać
    pliki z tej maszyny oraz wgrywać je na nią.

    Zostawiam kategorię wysoką i powód jest inny niż przy pozostałych
    usługach sieciowych w tej grupie. Tam chodziło o to, co usługa
    udostępnia. Tutaj chodzi o to, czym płaci się za dostęp: protokół ten
    w swojej podstawowej postaci przesyła nazwę użytkownika i hasło
    otwartym tekstem. Każdy, kto widzi ruch po drodze, widzi
    poświadczenia — a poświadczenia te są zwykle poświadczeniami konta
    w tej samej domenie, co reszta.

    Do tego dochodzi drugi składnik. Serwer ten przyjmuje pliki. Katalog,
    do którego przyjmuje, leży na dysku serwera i bywa jednocześnie
    katalogiem widocznym przez inną usługę — najczęściej serwer sieciowy
    stojący na tej samej maszynie. Wgranie pliku i wywołanie go przez
    stronę to dwa kroki, z których każdy z osobna wygląda niewinnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    poświadczenia czytelne w ruchu sieciowym oraz sposób umieszczenia
    własnego pliku na dysku serwera.
  en: |
    The item switches off the server service for the bearing of files by the older reckoning. That
    service listens for bindings and lets far-off sides draw files off that machine and load them
    onto it.

    I leave the category high, and the ground is other than at the rest of the services of the net in
    this group. There it went to what the service deals out. Here it goes to what is paid for the
    reach - that reckoning in its plain shape bears the name of the user and the word of passing in
    open writing. Whoever sees the traffic on the way sees the tokens - and those tokens are mostly
    the tokens of a standing in the same holding as the rest.

    To that there comes a second piece. That server takes files. The fold it takes them into lies
    upon the server's disk and is at times at once a fold seen through another service - most often
    the server of the net standing upon that same machine. The loading of a file and the calling of
    it through a page are two steps, each of which alone looks harmless.

    What an attacker gains while the item goes unmet - tokens plain to read in the traffic of the net,
    and a way of setting a file of their own upon the server's disk.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia wobec oceny dla stacji
    roboczej i powód leży w tym, do czego ten protokół na serwerach
    faktycznie służy.

    Na stacji roboczej przesyłanie plików tą drogą jest czynnością
    człowieka. Na serwerze bywa kanałem wymiany, który działa sam:
    kontrahent zostawia nocną paczkę, urządzenie wielofunkcyjne odkłada
    skany, starsza aplikacja odbiera plik z danymi, z którego rano robi
    import. Żadna z tych stron nie ma głosu i żadna się nie poskarży.

    Objaw jest odroczony i pojawia się gdzie indziej niż zmiana. Nie
    zobaczysz błędu połączenia — zobaczysz, że w poniedziałek brakuje
    danych, których nikt nie wgrał w piątek. Droga od jednego do drugiego
    prowadzi przez osobę, która o zmianie nie wiedziała.

    Chcę też nazwać rzecz uczciwie, bo ona zmienia sposób planowania.
    Ten protokół nie jest tylko zbędny — on jest zły, bo przesyła hasło
    otwartym tekstem. Właściwym rozwiązaniem nie jest samo wyłączenie,
    tylko zastąpienie go kanałem szyfrowanym. Wyłączenie bez zastąpienia
    kończy się zwykle tym, że pod presją braku danych ktoś włącza usługę
    z powrotem w pośpiechu i bez żadnego ograniczenia — a wtedy stan jest
    gorszy niż przed zmianą.

    Zależność warta odnotowania: usługa ta zatrzymuje się również wtedy,
    gdy zatrzyma się usługa administracyjna serwera sieciowego, opisana
    osobnym punktem.

    Zmiana cofa się natychmiast i wymaga uruchomienia usługi z powrotem.
  en: |
    I raise the class to a witting rolling out against the reckoning for a workstation, and the ground
    lies in what that reckoning upon servers truly serves.

    Upon a workstation the bearing of files by that road is a person's doing. Upon a server it is at
    times a channel of trading that works of itself - a dealing side leaves a nightly bundle, a
    many-workinged device sets scans down, an older application takes a file of data whereof it makes
    a bringing in at morning. None of those sides has a voice and none will complain.

    The symptom is put off and comes forth elsewhere than the change. You will see no fault of a
    binding - you will see that on Monday there want data nobody loaded on Friday. The road from the
    one to the other leads through a person who knew nothing of the change.

    I would name a thing plainly too, it altering the way of the planning. That reckoning is not
    merely needless - it is bad, bearing the word of passing in open writing. The right settling is
    not the switching off alone but the setting of a hidden channel in its stead. A switching off
    without a setting in its stead ends mostly in this, that under the press of wanting data somebody
    switches the service back on in haste and with no bound at all - and then the state is worse than
    before the change.

    A hanging worth marking - that service stops also when the service of ruling of the server of the
    net stops, which is set forth in an item of its own.

    The change is undone at once and takes the starting of the service again.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Kontrahent zostawiający nocną paczkę plików przestaje mieć gdzie ją zostawić
      - Urządzenie wielofunkcyjne odkładające skany przestaje je odkładać i nie zgłasza tego nikomu
      - Starsza aplikacja odbierająca tą drogą plik z danymi nie wykona porannego importu
      - Objaw pojawia się jako brak danych w poniedziałek, a nie jako błąd połączenia w piątek
      - Wyłączenie bez zastąpienia kanałem szyfrowanym kończy się zwykle pośpiesznym włączeniem z powrotem
    en:
      - The dealing side that leaves a nightly bundle of files has nowhere left to leave it
      - The many-workinged device that sets scans down stops setting them down and gives word of it to nobody
      - An older application taking a file of data by that road will not make its morning bringing in
      - The symptom comes forth as data wanting on Monday and not as a fault of a binding on Friday
      - A switching off without the setting of a hidden channel in its stead ends mostly in a hasty switching back on
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Tą drogą odbywa się wymiana plików z kontrahentem, urządzeniem albo starszą aplikacją
      - Nie przygotowano kanału szyfrowanego, który przejmie tę wymianę
    en:
      - A trading of files with a dealing side, a device or an older application goes by that road
      - No hidden channel was made ready to take that trading over
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Unattended exchanges run over this: a partner drop, a scanner, a nightly
    # import. None of them complains - the loss shows up as missing data days
    # later, so name the replacement channel before switching this off.
    Stop-Service -Name 'FTPSVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'FTPSVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'FTPSVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/whats-new-in-iis-8/iis-80-ftp-logon-attempt-restrictions

