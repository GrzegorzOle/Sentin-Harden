id: win11-advertising-id-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > User Profiles
  title:
    pl: Identyfikator reklamowy wyłączony
    en: The advertising identifier disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System nadaje każdemu profilowi użytkownika trwały identyfikator, który
    aplikacje mogą odczytać i dołączyć do wysyłanych przez siebie danych.
    Służy on do rozpoznania, że to ten sam człowiek na tej samej maszynie —
    także wtedy, gdy nie zalogował się nigdzie i niczego o sobie nie podał.

    Identyfikator nie jest wyciekiem sam w sobie i dlatego kategoria ryzyka
    jest niska. Warto jednak powiedzieć, co dokładnie odbiera jego wyłączenie,
    bo jest to coś innego niż zwykłe ograniczenie zbierania danych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nić łączącą ze
    sobą zdarzenia pochodzące z różnych aplikacji na tej samej maszynie. Dane
    z osobnych źródeł, zestawione po wspólnym identyfikatorze, składają się
    w obraz wyraźniejszy niż każde z nich z osobna — a taki obraz jest
    materiałem do ataku wymierzonego w konkretną osobę, nie w przypadkową
    maszynę.

    Wyłączenie identyfikatora zeruje go i odcina aplikacjom dostęp do niego.
    Nie powstrzymuje zbierania danych innymi drogami — odbiera wspólny klucz,
    po którym dało się je łączyć.
  en: |
    The system gives each user profile a lasting identifier that applications may read and
    attach to the data they send. It serves to recognise that this is the same person on
    the same machine - even where they have logged in nowhere and given nothing about
    themselves.

    The identifier is not itself a leak, and that is why the risk category is low. It is
    worth saying, though, what exactly switching it off takes away, since it is something
    other than an ordinary limiting of data gathering.

    What an attacker gains while the item goes unmet: a thread tying together events
    coming from different applications on the same machine. Data from separate sources,
    set side by side on a shared identifier, compose into a picture clearer than each of
    them apart - and such a picture is material for an attack aimed at a particular person
    rather than at a chance machine.

    Switching the identifier off zeroes it and cuts applications off from it. It does not
    hold back the gathering of data by other routes - it takes away the common key by
    which they could be joined.

disruption_description:
  pl: |
    Nie ma znanych regresji. Zmiana nie wymaga restartu, nie dotyka żadnej
    funkcji systemu i odwraca się natychmiast.

    Aplikacje odczytujące identyfikator dostaną ciąg pusty zamiast wartości.
    Żadna nie przestaje przez to działać — mechanizm przewiduje ten stan
    i jest on tym samym, co odmowa udzielona przez użytkownika w ustawieniach
    prywatności.

    Jedynym odczuwalnym skutkiem bywa to, że reklamy w aplikacjach przestają
    być dobierane do wcześniejszego użycia i zaczynają być przypadkowe. Nie
    znikają.

    Ustawienie dotyczy identyfikatora nadawanego profilowi i obejmuje
    wszystkich użytkowników maszyny.
  en: |
    There are no known regressions. The change takes no restart, touches no function of
    the system and is undone at once.

    Applications reading the identifier will get an empty string instead of a value. None
    stops working by that - the mechanism provides for that state, and it is the same as a
    refusal given by the user in the privacy settings.

    The only effect sometimes felt is that advertisements in applications stop being
    chosen to match earlier use and begin to be random. They do not disappear.

    The setting concerns the identifier given to a profile and covers all the machine's
    users.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Aplikacje odczytujące identyfikator reklamowy dostają ciąg pusty
      - Reklamy w aplikacjach przestają być dobierane do wcześniejszego użycia
      - Żadna funkcja systemu ani aplikacja nie przestaje przez to działać
    en:
      - Applications reading the advertising identifier get an empty string
      - Advertisements in applications stop being chosen to match earlier use
      - No function of the system and no application stops working by that
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja wewnętrzna rozlicza licencje po identyfikatorze reklamowym profilu
    en:
      - An in-house application accounts for licences by the profile's advertising identifier
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisabledByGroupPolicy'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
    $current = (Get-ItemProperty -Path $path -Name 'DisabledByGroupPolicy' -ErrorAction SilentlyContinue).'DisabledByGroupPolicy'
    [pscustomobject]@{
      path        = $path
      name        = 'DisabledByGroupPolicy'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisabledByGroupPolicy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Reguła należy do nielicznych w tej paczce zaliczonych do klasy bez
    uciążliwości. Podstawa jest taka, że nie da się wskazać żadnego
    scenariusza, w którym zmiana komuś przeszkadza: mechanizm z założenia
    przewiduje odmowę i obsługuje ją tak samo, jakby użytkownik odmówił sam.

    Ustawienie jest odpowiednikiem przełącznika dostępnego użytkownikowi
    w ustawieniach prywatności, z tą różnicą, że użytkownik nie może go
    cofnąć.

    Identyfikator wyłączony zasadą jest zerowany. Po cofnięciu zmiany system
    nada nowy, a nie przywróci poprzedniego — powiązania zbudowane wcześniej
    na starej wartości przestają więc działać trwale.
  en: |
    The rule is among the few in this pack counted in the class without disruption. The
    ground for that is that no scenario can be named in which the change hinders anybody:
    the mechanism provides for a refusal by design and handles it just as if the user had
    refused themselves.

    The setting is the counterpart of a switch available to the user in the privacy
    settings, with the difference that the user cannot undo it.

    An identifier switched off by policy is zeroed. Once the change is undone the system
    will give a new one rather than restore the former - so links built earlier on the old
    value stop working for good.
