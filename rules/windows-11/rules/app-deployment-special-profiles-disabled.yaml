id: win11-app-deployment-special-profiles-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji w profilach specjalnych zablokowane
    en: Installing of application packages in special profiles blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy pakiety aplikacji mogą być instalowane
    i rejestrowane w profilach specjalnych — czyli takich, które nie należą
    do żadnego człowieka pracującego na maszynie.

    Profil specjalny to profil konta usługowego, profil tymczasowy tworzony
    przy nieudanym załadowaniu właściwego, profil obowiązkowy i profile kont
    systemowych. Łączy je jedno: nikt ich nie ogląda. Nie ma pulpitu, który
    ktoś przegląda, ani listy zainstalowanych aplikacji, do której ktoś
    zagląda.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce na
    zainstalowanie aplikacji poza zasięgiem wzroku. Pakiet zarejestrowany
    w profilu specjalnym nie pojawi się na liście aplikacji żadnego
    użytkownika, a bywa uruchamiany razem z kontem, w którego profilu leży.

    Dochodzi do tego przypadek profilu tymczasowego, wart osobnej uwagi.
    Profil taki powstaje po nieudanym załadowaniu profilu właściwego i znika
    po wylogowaniu. Instalacja w nim jest z definicji czynnością bez śladu:
    po zakończeniu sesji nie ma czego badać, a to, co się wykonało, już się
    wykonało.

    Zablokowanie instalacji w tych profilach nie ogranicza pracy — ogranicza
    miejsca, w których można coś umieścić tak, żeby nikt tego nie zobaczył.
  en: |
    The setting settles whether application packages may be installed and registered in
    special profiles - that is, ones belonging to no person working on the machine.

    A special profile is a service account's profile, a temporary profile made when the
    proper one fails to load, a mandatory profile and the profiles of system accounts. One
    thing joins them: nobody looks at them. There is no desktop anybody looks over, nor a
    list of installed applications anybody consults.

    What an attacker gains while the item goes unmet: a place to install an application
    out of sight. A package registered in a special profile will not appear on any user's
    list of applications, and is sometimes started together with the account in whose
    profile it lies.

    To this is added the case of the temporary profile, worth separate attention. Such a
    profile arises after the proper one fails to load and disappears at logoff. An
    installation in it is by definition an act without trace: once the session has ended
    there is nothing to examine, and what ran has already run.

    Blocking installation in these profiles does not limit work - it limits the places
    where something may be put so that nobody sees it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie jest rozwiązanie instalujące
    aplikacje w kontekście konta usługowego — a na stanowisku jest to rzadkie.

    Instalacje wykonywane przez zwykłego użytkownika i przez administratora
    działają bez zmiany. Zmiana dotyczy wyłącznie profili, o których mowa
    wyżej.

    Skutek pojawia się przy rozwiązaniach do zarządzania stanowiskami, które
    przygotowują aplikacje na koncie usługowym, oraz przy obrazach
    przygotowywanych do wdrożenia masowego, gdzie aplikacje rejestruje się
    w profilu wzorcowym. Po zmianie taka rejestracja się nie powiedzie,
    a narzędzie zgłosi błąd wdrożenia.

    Osobnym przypadkiem są stanowiska z profilami obowiązkowymi — zwykle
    w salach szkoleniowych i na stanowiskach współdzielonych. Tam warto
    sprawdzić, czy aplikacje nie są przypisywane właśnie tą drogą.

    Zmiana nie wymaga restartu. U użytkownika, którego profil ładuje się
    normalnie, jest niewidoczna.
  en: |
    What needs checking is whether a solution installing applications in the context of a
    service account is on the machine - and at a station that is rare.

    Installations done by an ordinary user and by an administrator work unchanged. The
    change concerns only the profiles spoken of above.

    The effect appears with station management solutions that prepare applications under a
    service account, and with images prepared for a mass rollout, where applications are
    registered in a master profile. After the change such a registration will fail and the
    tool will report a deployment error.

    A separate case are stations with mandatory profiles - usually in training rooms and
    at shared stations. There it is worth checking whether applications are not assigned
    by that very route.

    The change takes no restart. For a user whose profile loads normally it is invisible.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Rejestracja pakietu aplikacji w profilu konta usługowego przestaje się udawać
      - Przygotowanie obrazu z aplikacjami w profilu wzorcowym zgłasza błąd wdrożenia
      - Stanowiska z profilami obowiązkowymi mogą nie otrzymać przypisanych aplikacji
      - Instalacje wykonywane przez zwykłego użytkownika i administratora działają bez zmiany
    en:
      - Registering an application package in a service account's profile stops succeeding
      - Preparing an image with applications in a master profile reports a deployment error
      - Stations with mandatory profiles may not receive their assigned applications
      - Installations done by an ordinary user and an administrator work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacje są przypisywane stanowiskom przez profil obowiązkowy albo wzorcowy
      - Rozwiązanie do zarządzania stanowiskami instaluje aplikacje na koncie usługowym
    en:
      - Applications are assigned to stations through a mandatory or master profile
      - A station management solution installs applications under a service account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDeploymentInSpecialProfiles'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $current = (Get-ItemProperty -Path $path -Name 'AllowDeploymentInSpecialProfiles' -ErrorAction SilentlyContinue).'AllowDeploymentInSpecialProfiles'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowDeploymentInSpecialProfiles'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDeploymentInSpecialProfiles' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-applicationmanagement

notes:
  pl: |
    Punkt jest jednym z tych, których wartość polega na odebraniu miejsca do
    ukrycia się, a nie na zablokowaniu konkretnej czynności. Warto go czytać
    razem z regułami dotyczącymi instalowania aplikacji w ogóle: te mówią,
    komu wolno instalować, ten mówi, gdzie instalacja nie ma prawa się
    odbywać.

    Sprawdzenie stanu przed wdrożeniem warto uzupełnić o spis pakietów
    zarejestrowanych na kontach innych niż konta ludzi. Niepusty wynik jest
    ustaleniem samym w sobie i zasługuje na wyjaśnienie niezależnie od tego,
    czy reguła zostanie wdrożona.

    Brak wartości nie jest stanem zgodnym, bo domyślnie instalacja bywa
    dozwolona.
  en: |
    The item is one of those whose worth lies in taking away a place to hide rather than
    in blocking a particular act. It is worth reading together with the rules about
    installing applications at all: those say who may install, this says where an
    installation has no leave to happen.

    The check of the state before a rollout is worth completing with a list of packages
    registered under accounts other than people's. A non-empty result is a finding in
    itself and deserves explaining whether or not the rule is applied.

    A missing value is not a compliant state, since by default the installation is
    sometimes allowed.
