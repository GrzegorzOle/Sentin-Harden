id: win2025-continue-experiences-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Group Policy
  title:
    pl: Przenoszenie pracy między urządzeniami wyłączone
    en: Continuing work across devices turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza mechanizm pozwalający zacząć pracę na jednym urządzeniu
    i podjąć ją na drugim — wspólną platformę urządzeń.

    Kategoria średnia i chcę nazwać, czym ten mechanizm jest technicznie,
    bo nazwa opisuje wygodę, a nie działanie. Żeby jedno urządzenie
    wiedziało, co robiło drugie, musi istnieć kanał, którym opis czynności
    opuszcza maszynę, oraz kanał, którym z zewnątrz przychodzi polecenie
    otwarcia czegoś tutaj. To jest dwustronne połączenie z usługą poza
    organizacją, utrzymywane w tle.

    Na serwerze obie strony są niepożądane z osobnych powodów. Wychodzący
    strumień to opis czynności administratora: co otwierał, czym się
    zajmował, w jakiej kolejności. Strona przychodząca jest poważniejsza —
    to mechanizm, w którym urządzenie zewnętrzne, powiązane z kontem, może
    doprowadzić do otwarcia zasobu na tym serwerze. Zakres jest ograniczony,
    ale sam kierunek zasługuje na uwagę: to jest wpływ z zewnątrz do środka.

    Punkt jest też wart uwagi z powodu miejsca, w którym leży. Nie ma go
    w gałęzi z treściami z chmury ani w gałęzi wyszukiwania, gdzie
    prowadziłby go temat. Leży w gałęzi systemowej, razem z ustawieniami
    o zupełnie innym charakterze — przy ręcznym przeglądzie łatwo go
    pominąć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    prowadzący do wnętrza serwera, którego uruchomienie wymaga przejęcia
    konta, a nie dostępu do samej maszyny.
  en: |
    The item turns off the mechanism that lets work begun on one device be
    taken up on another - the shared device platform.

    The category is medium, and I want to name what this mechanism is
    technically, because its name describes a convenience rather than a
    behaviour. For one device to know what another was doing, there has to be
    a channel by which a description of activity leaves the machine, and a
    channel by which an instruction to open something here arrives from
    outside. That is a two-way connection to a service outside the
    organisation, kept up in the background.

    On a server both sides are unwanted, for separate reasons. The outgoing
    stream is a description of an administrator's activity: what they opened,
    what they were busy with, in what order. The incoming side is the graver
    one - a mechanism in which an outside device tied to the account can lead
    to a resource being opened on this server. The scope is limited, but the
    direction alone deserves attention: this is influence from outside
    inwards.

    The item is also worth attention because of where it lies. It is not in
    the branch with cloud content, nor in the search branch, where its
    subject would lead one to look. It lies in the system branch, among
    settings of an entirely different character - easy to pass over in a
    manual review.

    What an attacker gains while the item goes unmet: a channel leading into
    the server, the use of which needs the account to be taken over rather
    than access to the machine itself.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na zwykłym serwerze ta zmiana nie
    zrobi nic — mechanizm jest tam z zasady nieużywany.

    Sprawdzenia wymaga serwer terminali i tam skutek jest realny. Ludzie,
    którzy zaczynają dokument na jednym urządzeniu i wracają do niego
    w sesji zdalnej, stracą dokładnie to przejście. Warto nazwać, co dokładnie
    znika, żeby nikt nie szukał zguby gdzie indziej: znika podpowiedź
    „wróć do tego, co robiłeś" i możliwość przerzucenia otwartego zadania
    z jednego urządzenia na drugie. Plik jest na miejscu, sesja zdalna
    działa, schowek działa, przekierowanie zasobów działa — tego punkt nie
    dotyczy w ogóle.

    Druga rzecz, którą trzeba nazwać, to lista ostatnio używanych plików.
    Bywa mylona z tym mechanizmem, bo wygląda podobnie i pojawia się w tym
    samym miejscu. Ta lista pozostaje: jest lokalna i ten punkt jej nie
    rusza.

    Zmiana nie wymaga przerwy, ale zadziała przy kolejnym zalogowaniu —
    kto jest zalogowany w tej chwili, nie zobaczy różnicy od razu.

    Natychmiast odwracalne, poza trybem zbiorczym.
  en: |
    The class is "needs review", although on an ordinary server this change
    will do nothing - the mechanism is unused there as a matter of course.

    A terminal server is what needs the review, and there the effect is real.
    People who begin a document on one device and come back to it in a remote
    session will lose exactly that handover. It is worth naming what
    disappears so nobody looks for the loss elsewhere: the prompt to pick up
    what you were doing goes, and so does moving an open task from one device
    to another. The file is in place, the remote session works, the clipboard
    works, resource redirection works - the item does not touch any of that.

    The second thing to name is the list of recently used files. It gets
    confused with this mechanism, because it looks similar and shows up in
    the same place. That list stays: it is local and this item does not
    disturb it.

    The change needs no outage, but it takes effect at the next sign-in -
    whoever is signed in at that moment will not see a difference straight
    away.

    Undone immediately, outside the bulk mode.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Na serwerze terminali znika przejście między urządzeniami — podpowiedź powrotu do przerwanej pracy i przerzucenie otwartego zadania
      - Plik jest na miejscu, sesja zdalna, schowek i przekierowanie zasobów działają bez zmian
      - Lista ostatnio używanych plików pozostaje — jest lokalna i ten punkt jej nie dotyczy
      - Zmiana zadziała przy kolejnym zalogowaniu, więc osoby zalogowane w tej chwili nie zobaczą różnicy od razu
    en:
      - On a terminal server the handover between devices goes - the prompt to resume interrupted work and moving an open task across
      - The file is in place, and the remote session, the clipboard and resource redirection work unchanged
      - The list of recently used files stays - it is local and this item does not touch it
      - The change takes effect at the next sign-in, so people signed in at that moment will not see a difference straight away
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym przenoszenie pracy między urządzeniem osobistym a sesją zdalną jest przyjętym sposobem pracy
    en:
      - The machine is a terminal server where moving work between a personal device and the remote session is an accepted way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This item lies in the system branch, not with the cloud content or the
      # search settings its subject would suggest.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnableCdp'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnableCdp'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A two-way background connection to a service outside the organisation: a
    # description of activity leaves, and an instruction to open something here
    # can arrive. The local list of recently used files is untouched. Takes
    # effect at the next sign-in.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableCdp' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Nazwa opisuje wygodę, nie działanie. Żeby jedno urządzenie wiedziało, co
    robiło drugie, musi istnieć kanał wychodzący z opisem czynności i kanał
    przychodzący z poleceniem otwarcia czegoś tutaj — dwustronne połączenie
    z usługą poza organizacją, utrzymywane w tle.

    Strona przychodząca jest poważniejsza: urządzenie zewnętrzne powiązane
    z kontem może doprowadzić do otwarcia zasobu na tym serwerze. Zakres
    ograniczony, ale kierunek zasługuje na uwagę.

    Miejsce w rejestrze jest myląco dobrane: punkt leży w gałęzi systemowej,
    nie przy treściach z chmury ani przy wyszukiwaniu, gdzie prowadziłby
    temat.
  en: |
    The name describes a convenience, not a behaviour. For one device to know
    what another was doing, there has to be an outgoing channel with a
    description of activity and an incoming one with an instruction to open
    something here - a two-way connection to a service outside the
    organisation, kept up in the background.

    The incoming side is the graver one: an outside device tied to the
    account can lead to a resource being opened on this server. The scope is
    limited, but the direction deserves attention.

    The place in the registry is misleadingly chosen: the item lies in the
    system branch, not with the cloud content or the search settings its
    subject would lead one to.
