id: win2025-pnp-remote-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Zdalny dostęp do interfejsu instalacji urządzeń wyłączony
    en: Remote access to the device installation interface switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zamyka zdalny dostęp do interfejsu odpowiedzialnego za instalację
    urządzeń.

    Kategoria wysoka i sprawa jest tu prosta do nazwania, chociaż nazwa
    punktu brzmi technicznie. Chodzi o to, że mechanizm instalujący
    urządzenia i ich sterowniki — a więc uruchamiający kod pracujący
    w jądrze systemu — przyjmuje wywołania po sieci. Nie od użytkownika przy
    maszynie, tylko z innej maszyny.

    To jest właściwa treść punktu. Instalacja sterownika jest jedną
    z najpoważniejszych rzeczy, jakie mogą się systemowi przytrafić, bo jej
    wynikiem jest kod wykonywany na najniższym poziomie. Udostępnienie tej
    drogi po sieci powiększa powierzchnię ataku dokładnie w tym miejscu,
    w którym jest ona najbardziej kosztowna.

    Na serwerze nie ma dla tego zastosowania, które dałoby się obronić.
    Urządzenia instaluje się na serwerze rzadko i robi to człowiek
    zalogowany do tej maszyny albo pracujący w sesji zdalnej, a sesja
    zdalna nie potrzebuje tego interfejsu — ona jest już na tej maszynie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zdalnie
    osiągalny interfejs prowadzący do mechanizmu, którego zadaniem jest
    uruchamianie kodu w jądrze.
  en: |
    The item closes remote access to the interface responsible for installing
    devices.

    The category is high, and the matter is simple to name here, even though
    the item's name sounds technical. The point is that the mechanism which
    installs devices and their drivers - and so starts code running in the
    system's kernel - accepts calls over the network. Not from a user at the
    machine, but from another machine.

    That is the real substance of the item. Installing a driver is one of the
    graver things that can happen to a system, because its outcome is code
    executed at the lowest level. Opening that road over the network enlarges
    the attack surface exactly where it is most expensive.

    On a server there is no use for it that could be defended. Devices are
    installed on a server rarely, and it is done by a person signed in to
    that machine or working in a remote session - and a remote session does
    not need this interface, it is already on the machine.

    What an attacker gains while the item goes unmet: a remotely reachable
    interface leading to the mechanism whose job is to start code in the
    kernel.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i mam tu nietypowo mocne uzasadnienie: droga,
    którą ten punkt zamyka, jest w normalnej pracy nieużywana, a to, co
    ludzie biorą za jej użycie, idzie zupełnie inną drogą.

    Chcę to rozróżnienie postawić wyraźnie, bo jest źródłem nieporozumień.
    Instalowanie sterownika w sesji zdalnej działa bez zmian — sesja zdalna
    jest sesją na tej maszynie, nie wywołaniem z zewnątrz. Zdalne zarządzanie
    urządzeniami przez konsolę zarządzania, przez usługę zarządzania
    konfiguracją albo przez polecenia wykonywane zdalnie również działa, bo
    te narzędzia nie chodzą tędy.

    Dotknięte jest wyłącznie to, co wywołuje ten konkretny interfejs po
    sieci. W praktyce jest to starsze oprogramowanie inwentaryzacyjne
    i starsze narzędzia zdalnego zarządzania sprzętem, które rzeczywiście
    z tej drogi korzystały. Jeżeli takie narzędzie na tej maszynie jest,
    zobaczy błąd dostępu, nie brak urządzeń — i to jest komunikat, po którym
    da się to rozpoznać.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption" and I have an unusually strong justification
    here: the road this item closes is unused in normal work, and what people
    take for its use goes by an entirely different one.

    I want to set the distinction out clearly, because it is a source of
    misunderstanding. Installing a driver in a remote session works unchanged
    - a remote session is a session on that machine, not a call from outside.
    Managing devices remotely through a management console, through a
    configuration management service or through commands executed remotely
    also works, because those tools do not go this way.

    What is touched is only what calls this particular interface over the
    network. In practice that means older stock-taking software and older
    remote hardware management tools which genuinely used this road. If such
    a tool is on the machine it will show an access error, not an absence of
    devices - and that is the message by which it can be recognised.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - remote-management
  what_breaks:
    pl:
      - Starsze oprogramowanie inwentaryzacyjne i starsze narzędzia zdalnego zarządzania sprzętem stracą tę drogę
      - Takie narzędzie zobaczy błąd dostępu, a nie brak urządzeń — po tym komunikacie da się to rozpoznać
      - Instalowanie sterownika w sesji zdalnej działa bez zmian, bo sesja zdalna jest sesją na tej maszynie
      - Konsola zarządzania, usługa zarządzania konfiguracją i polecenia wykonywane zdalnie nie chodzą tą drogą
    en:
      - Older stock-taking software and older remote hardware management tools lose this route
      - Such a tool will show an access error, not an absence of devices - that message is how it can be recognised
      - Installing a driver in a remote session works unchanged, because a remote session is a session on that machine
      - A management console, a configuration management service and remotely executed commands do not go this way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie pracuje starsze narzędzie inwentaryzacyjne albo zarządzania sprzętem, które korzysta z tego interfejsu po sieci
    en:
      - An older stock-taking or hardware management tool on this machine uses this interface over the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
      $name = 'AllowRemoteRPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    $name = 'AllowRemoteRPC'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The mechanism that installs devices and drivers - and so starts code
    # running in the kernel - accepts calls over the network. A remote session
    # does not need this interface: it is already on the machine. Only callers
    # of this particular interface are affected.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowRemoteRPC' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-overview

notes:
  pl: |
    Nazwa brzmi technicznie, a rzecz jest prosta: mechanizm instalujący
    urządzenia i sterowniki — czyli uruchamiający kod pracujący w jądrze —
    przyjmuje wywołania po sieci, z innej maszyny.

    Rozróżnienie warte postawienia, bo jest źródłem nieporozumień:
    instalowanie sterownika w sesji zdalnej działa dalej, bo sesja zdalna
    jest sesją na tej maszynie, nie wywołaniem z zewnątrz. Konsola
    zarządzania i polecenia wykonywane zdalnie też nie chodzą tędy.

    Dotknięte są starsze narzędzia inwentaryzacyjne i zarządzania sprzętem.
    Rozpoznasz to po komunikacie: błąd dostępu, a nie brak urządzeń.
  en: |
    The name sounds technical, yet the matter is simple: the mechanism that
    installs devices and drivers - and so starts code running in the kernel -
    accepts calls over the network, from another machine.

    A distinction worth setting out, because it causes misunderstanding:
    installing a driver in a remote session still works, because a remote
    session is a session on that machine, not a call from outside. A
    management console and remotely executed commands do not go this way
    either.

    What is touched are older stock-taking and hardware management tools. You
    will recognise it by the message: an access error, not an absence of
    devices.
