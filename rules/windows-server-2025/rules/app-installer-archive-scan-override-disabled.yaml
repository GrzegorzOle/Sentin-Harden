id: win2025-app-installer-archive-scan-override-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Pomijanie badania archiwum przed instalacją zablokowane
    en: Skipping the scan of an archive before installation blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera możliwość pominięcia badania archiwum przed
    rozpakowaniem go i zainstalowaniem. Archiwum jest tu opakowaniem,
    a badanie jedyną chwilą, w której ktokolwiek zagląda do środka przed
    otwarciem.

    Jest to reguła bliźniacza wobec zakazu pomijania sprawdzenia skrótu
    i obie leżą w tym samym kluczu, ale odpowiadają na różne pytania.
    Skrót mówi, czy przyszło to, co miało przyjść. Badanie archiwum mówi,
    czy to, co przyszło, jest tym, za co się podaje. Plik może mieć
    prawidłowy skrót i mimo to zawierać rzecz szkodliwą — jeżeli źródło,
    z którego pochodzi, zostało podmienione u siebie.

    Zostawiam kategorię wysoką. Droga jest tu krótka i cała mieści się
    w jednej instalacji: pakiet pobrany z zewnątrz, opakowany, otwarty na
    serwerze bez zaglądania do środka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozpakowanie
    przygotowanego archiwum na serwerze z pominięciem jedynego momentu,
    w którym ktokolwiek sprawdzał jego zawartość.
  en: |
    The item takes away the leave to pass over the scanning of an archive before its unpacking and
    installing. The archive is here a wrapping, and the scanning the one moment wherein anybody looks
    inside before the opening.

    It is a twin rule to the forbidding of the passing over of the looking to the digest, and both
    lie in the same key, yet they answer sundry questions. The digest says whether what was to come
    has come. The scanning of the archive says whether what has come is that for which it gives
    itself out. A file may bear a right digest and hold a harmful thing for all that - if the
    wellspring it comes of has been swapped at its own place.

    I leave the category high. The road is here short and lies whole within one installing - a
    package fetched from without, wrapped, opened upon the server with no looking inside.

    What an attacker gains while the item goes unmet - the unpacking of a made-ready archive upon the
    server, passing over the one moment wherein anybody looked to what was in it.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" wobec oceny dla stacji roboczej
    i chcę powiedzieć wprost, na czym ta ocena stoi, bo tu akurat warto
    rozróżnić dwie rzeczy.

    Ustawienie nie włącza żadnego badania. Odbiera jedynie możliwość
    pominięcia badania, które i tak miało się odbyć. Na maszynie bez
    tego przełącznika zmiana nie zmienia zachowania niczego — zapisuje
    jawne zero w miejsce braku.

    Nie znam instalacji serwerowej, w której pominięcie badania archiwum
    byłoby czynnością prawidłową. Nie jest to ustawienie przyspieszające
    pracę ani rozwiązujące problem zgodności — jest to przełącznik do
    omijania przeszkody, tak samo jak przy skrócie.

    Jest natomiast granica, o której trzeba powiedzieć, żeby ten punkt
    nie obiecywał więcej, niż daje. Badanie wykonuje mechanizm ochrony
    obecny w systemie. Tam, gdzie za ochronę odpowiada produkt innego
    producenta, mechanizm systemowy bywa odstawiony — i wtedy ten punkt
    pilnuje wpisu, a nie czynności. Wartość pozostaje, bo wpis nie leży
    gotowy zadziałać, gdy ochrona wróci na miejsce. Ale samo zielone
    światło przy tym punkcie nie jest dowodem, że cokolwiek zostało
    zbadane.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I lower the class to "no disruption" against the reckoning for a workstation, and mean to say
    outright whereon that reckoning stands, it being here worth telling two things apart.

    The setting switches on no scanning. It takes away only the leave to pass over a scanning that
    was to be had anyway. On a machine without that switch the change alters the bearing of nothing -
    it writes an outright nought in the place of a want.

    I know of no setting up of a server wherein the passing over of the scanning of an archive would
    be a right doing. It is no setting that quickens the work nor one that undoes a trouble of being
    at one - it is a switch for the going round of a hindrance, even as at the digest.

    There is, though, a bound that must be spoken of, that this item promise not more than it gives.
    The scanning is done by the working of guarding that is in the system. Where the guarding is
    answered for by a product of another maker, the working of the system is at times stood aside -
    and then this item watches an entry and not a doing. The worth stays, the entry not lying ready
    to work when the guarding comes back to its place. But a green light at this item is of itself no
    proof that anything at all has been scanned.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - removable-media
  what_breaks:
    pl:
      - Ustawienie nie włącza żadnego badania, odbiera tylko możliwość jego pominięcia
      - Na maszynie bez tego przełącznika zmiana nie zmienia zachowania niczego
      - Tam, gdzie za ochronę odpowiada produkt innego producenta, punkt pilnuje wpisu, a nie czynności
      - Zielone światło przy tym punkcie nie jest dowodem, że cokolwiek zostało zbadane
      - Nie ma instalacji serwerowej, w której pominięcie badania archiwum jest czynnością prawidłową
    en:
      - The setting switches on no scanning, it takes away only the leave to pass it over
      - On a machine without that switch the change alters the bearing of nothing
      - Where the guarding is answered for by a product of another maker, the item watches an entry and not a doing
      - A green light at this item is no proof that anything at all has been scanned
      - There is no setting up of a server wherein the passing over of the scanning of an archive is right
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableLocalArchiveMalwareScanOverride'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableLocalArchiveMalwareScanOverride'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This switches no scanning on: it only removes the way to skip one. Where
    # another vendor's product is in charge of protection, the entry is guarded
    # but no scan need be happening.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableLocalArchiveMalwareScanOverride' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Reguła bliźniacza wobec zakazu pomijania sprawdzenia skrótu, ale
    odpowiada na inne pytanie. Skrót mówi, czy przyszło to, co miało
    przyjść. Badanie archiwum mówi, czy to, co przyszło, jest tym, za co
    się podaje — plik może mieć prawidłowy skrót i mimo to zawierać rzecz
    szkodliwą, jeżeli źródło podmieniono u siebie.

    Granica, o której trzeba powiedzieć, żeby punkt nie obiecywał więcej,
    niż daje: tam, gdzie za ochronę odpowiada produkt innego producenta,
    mechanizm systemowy bywa odstawiony, więc punkt pilnuje wpisu, a nie
    czynności. Zielone światło nie jest tu dowodem, że cokolwiek zbadano.
  en: |
    A twin rule to the forbidding of the passing over of the looking to the digest, yet it answers
    another question. The digest says whether what was to come has come. The scanning of the archive
    says whether what has come is that for which it gives itself out - a file may bear a right digest
    and hold a harmful thing for all that, if the wellspring was swapped at its own place.

    The bound that must be spoken of, that the item promise not more than it gives - where the
    guarding is answered for by a product of another maker, the working of the system is at times
    stood aside, so the item watches an entry and not a doing. A green light is here no proof that
    anything was scanned.
