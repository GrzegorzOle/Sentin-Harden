id: win2016-load-driver-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Ładowanie sterowników tylko dla administratorów
    en: Loading drivers restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do ładowania i usuwania sterowników urządzeń
    do grupy administratorów lokalnych.

    Sterownik nie jest zwykłym programem. Działa w jądrze systemu, czyli
    w tej samej warstwie co mechanizmy, które miałyby go pilnować. Kod
    załadowany jako sterownik może więc ukryć proces przed listą procesów,
    ukryć plik przed programem antywirusowym, odczytać pamięć dowolnego
    procesu i zmienić decyzję dowolnego zabezpieczenia — nie omijając go,
    tylko przepisując.

    Kategoria krytyczna, bo to jest granica między maszyną, którą da się
    zbadać, a maszyną, której raportom nie można ufać. Po załadowaniu
    złośliwego sterownika wynik każdego kolejnego sprawdzenia pochodzi
    z systemu, nad którym napastnik ma kontrolę.

    Na serwerze 2016 warto dodać jedno zastrzeżenie. To wydanie nie wymaga
    jeszcze podpisanych sterowników tak rygorystycznie jak wydania
    późniejsze, a mechanizmy chroniące jądro są tu słabsze. Ograniczenie tej
    listy waży więc tutaj więcej niż na maszynie nowszej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kod działający
    w jądrze, a wraz z nim możliwość unieważnienia każdego zabezpieczenia
    i każdego raportu z tej maszyny.
  en: |
    The item limits the right to load and unload device drivers to the local
    administrators group.

    A driver is not an ordinary program. It runs in the system's kernel - the
    same layer as the mechanisms that would be watching it. Code loaded as a
    driver can therefore hide a process from the process list, hide a file from
    antivirus software, read any process's memory and change any safeguard's
    decision - not by evading it but by rewriting it.

    The critical category applies because this is the boundary between a machine
    that can be examined and a machine whose reports cannot be trusted. Once a
    malicious driver is loaded, the result of every further check comes from a
    system the attacker controls.

    On Server 2016 one qualification is worth adding. This release does not yet
    demand signed drivers as strictly as later ones, and the mechanisms
    protecting the kernel are weaker here. Limiting this list therefore weighs
    more here than on a newer machine.

    What an attacker gains while the item goes unmet: code running in the kernel,
    and with it the ability to annul every safeguard and every report from this
    machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", mimo że domyślnie uprawnienie ma wyłącznie
    grupa administratorów. Powodem jest to, co na serwerach tego rocznika
    bywa dopisane do tej listy.

    Typowe przypadki to oprogramowanie kopii zapasowych ładujące własny
    sterownik migawek, narzędzia wirtualizacji, oprogramowanie szyfrujące
    dyski, sterowniki drukarek instalowane zdalnie oraz część agentów
    monitorujących. Wszystkie one mogą mieć konto usługowe spoza grupy
    administratorów, któremu uprawnienie nadano przy instalacji.

    Skutek odebrania go bywa mylący. Usługa zwykle wstaje i zgłasza się jako
    działająca, a zawodzi dopiero ta jej część, która sterownika potrzebuje
    — czyli kopia zapasowa wykonana nocą albo pierwszy wydruk po restarcie.
    Dlatego to jest punkt do sprawdzenia przed zmianą, a nie do naprawiania
    hurtem.

    Sprawdzenie sprowadza się do przejrzenia listy i ustalenia, czym jest
    każdy wpis spoza grupy administratorów. Wpis bez znanego właściciela
    jest ustaleniem audytu, a nie drobiazgiem.

    Czego to nie psuje: sterowników już załadowanych, urządzeń
    rozpoznawanych przy starcie ani instalacji sterowników przez
    administratora.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", although by default the right belongs to the
    administrators group alone. The reason is what tends to be added to this list
    on servers of this vintage.

    The usual cases are backup software loading its own snapshot driver,
    virtualisation tools, disk encryption software, printer drivers installed
    remotely and some monitoring agents. All of these may have a service account
    outside the administrators group that was granted the right at installation.

    The effect of taking it away can mislead. The service usually starts and
    reports itself as running, and only the part of it that needs the driver
    fails - that is, the backup run at night or the first print job after a
    restart. This is therefore an item to check before the change rather than to
    remedy in bulk.

    The check comes down to going through the list and establishing what each
    entry outside the administrators group is. An entry with no known owner is a
    finding of the audit, not a detail.

    What this does not break: drivers already loaded, devices recognised at
    startup, or driver installation by an administrator.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - Oprogramowanie kopii zapasowych ładujące własny sterownik migawek na koncie usługowym przestaje wykonywać kopie
      - Sterowniki drukarek instalowane zdalnie przez konto spoza grupy administratorów nie zostają załadowane
      - Narzędzia wirtualizacji i szyfrowania dysków z osobnym kontem usługowym tracą możliwość załadowania sterownika
      - Sterowniki już załadowane, urządzenia rozpoznawane przy starcie i instalacja przez administratora działają bez zmian
    en:
      - Backup software loading its own snapshot driver under a service account stops making backups
      - Printer drivers installed remotely by an account outside the administrators group are not loaded
      - Virtualisation and disk encryption tools with a separate service account lose the ability to load a driver
      - Drivers already loaded, devices recognised at startup and installation by an administrator work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na liście jest konto usługowe oprogramowania kopii zapasowych, wirtualizacji lub szyfrowania i nie sprawdzono, czy sterownik jest mu potrzebny
    en:
      - The list holds a service account of backup, virtualisation or encryption software and it has not been checked whether the driver is needed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeLoadDriverPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeLoadDriverPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeLoadDriverPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Check the list before running this. A service account taken off it usually
    # keeps starting and fails only where the driver is needed - at night, in the
    # backup run.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeLoadDriverPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeLoadDriverPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/load-and-unload-device-drivers

notes:
  pl: |
    Ta reguła jest jedyną w tej szóstce z klasą „wymaga sprawdzenia" i powód
    jest praktyczny: to jedyne z tych uprawnień, które oprogramowanie trzecie
    rzeczywiście bywa zmuszone mieć.

    Domyślnie na serwerze uprawnienie ma wyłącznie grupa administratorów
    lokalnych, natomiast na kontrolerze domeny stan domyślny bywa szerszy.
    Wynik niezgodny na kontrolerze warto więc obejrzeć, zanim zostanie
    naprawiony.

    Ograniczenie tej listy nie zastępuje wymogu podpisanych sterowników,
    a na tym wydaniu systemu jest tym ważniejsze, że sam wymóg podpisu jest
    tu słabszy.
  en: |
    This rule is the only one of the six with the class "needs review", and the
    reason is practical: it is the only one of these rights that third-party
    software is genuinely sometimes obliged to hold.

    By default on a server the right belongs to the local administrators group
    alone, whereas on a domain controller the default state is sometimes wider. A
    non-compliant result on a controller is therefore worth looking at before it
    is remedied.

    Limiting this list is no substitute for requiring signed drivers, and on this
    release of the system it matters the more because the signing requirement
    itself is weaker here.
