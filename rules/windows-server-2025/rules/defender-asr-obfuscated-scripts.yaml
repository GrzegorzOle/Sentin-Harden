id: win2025-defender-asr-obfuscated-scripts

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wykonywania skryptów o zaciemnionej treści
    en: Obfuscated scripts blocked from running
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła blokuje wykonanie skryptu, którego treść została celowo
    utrudniona do odczytania: zakodowana, sklejona z kawałków,
    rozłożona na działania niemające sensu poza samym ukryciem.

    Zaciemnianie jest zachowaniem, nie treścią, i na tym polega siła
    oraz słabość tego punktu. Siła: narzędzie napastnika prawie zawsze
    jest zaciemnione, bo inaczej pierwszy lepszy podgląd zdradziłby,
    co robi. Słabość: zaciemnienie ocenia się z wyglądu, a nie
    z zamiaru, więc skrypt prawidłowy o podobnym wyglądzie zostanie
    potraktowany tak samo.

    Kategorię trzymam średnią i podaję powód. Reguła nie zamyka drogi
    wejścia ani nie broni poświadczeń — utrudnia napastnikowi
    posłużenie się przygotowanym narzędziem i zmusza go do pisania
    rzeczy czytelnych, a więc łatwiejszych do zauważenia. Jest to
    zwiększenie kosztu ataku i wykrywalności, a nie blokada.

    Na serwerze jest tu jedna rzecz warta nazwania. Serwer wykonuje
    skrypty bez udziału człowieka, z harmonogramu, całymi tygodniami.
    Skrypt napastnika uruchomiony tą drogą nie jest przez nikogo
    oglądany, więc zaciemnienie nie jest mu nawet potrzebne do
    ukrycia się przed wzrokiem — jest potrzebne do ukrycia się przed
    mechanizmami. I dokładnie tym mechanizmem jest ta reguła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość uruchomienia na serwerze gotowego, zaciemnionego
    narzędzia zamiast pisania go od nowa w postaci czytelnej.
  en: |
    The rule blocks the carrying out of a script whose substance was of set purpose made hard to
    read - encoded, glued of pieces, broken into doings having no sense beyond the hiding itself.

    The making obscure is a behaviour and not a substance, and therein lie this item's strength and
    weakness. The strength - an attacker's tool is all but always made obscure, else the first
    looking would give away what it does. The weakness - obscurity is reckoned by look and not by
    intent, so a right script of a like look will be dealt with the same way.

    I keep the category middling and give the reason. The rule shuts no road in and guards no
    credentials - it makes the attacker's use of a made-ready tool harder and drives them to write
    things readable, and so easier to mark. It is a raising of an attack's cost and of its
    findability, and not a blocking.

    On a server there is here one thing worth naming. A server carries out scripts with no person's
    part in it, out of a timetable, for weeks together. An attacker's script run by that road is
    looked at by nobody, so obscurity is not even needed to hide it from sight - it is needed to
    hide it from mechanisms. And this rule is just such a mechanism.

    What an attacker gains while the item goes unmet: the means of running on the server a
    made-ready, obscured tool instead of writing it anew in a readable shape.

disruption_description:
  pl: |
    Podnoszę tu klasę do świadomego wdrożenia i uważam, że na serwerze
    jest to uczciwsze niż przeniesienie oceny ze stanowiska.

    Powód leży w sposobie, w jaki na serwerze wykonuje się skrypty.
    Narzędzia zarządzania przekazują polecenia zakodowane — nie po to,
    żeby coś ukryć, tylko dlatego, że tak najprościej przekazać
    wielowierszowy skrypt jednym wywołaniem. Wygląda to dokładnie tak
    jak zaciemnienie, bo jest tą samą techniką użytą w innym celu.

    Dotyczy to systemów dystrybucji oprogramowania, narzędzi
    inwentaryzacji, części instalatorów i wielu skryptów wdrożeniowych
    pisanych latami przez różne osoby.

    Objaw jest gorszy niż sama blokada. Zadanie uruchamiane
    z harmonogramu przestaje kończyć się powodzeniem, ale nie zgłasza
    powodu — zgłasza błąd wykonania. Nikt przy tym nie siedzi, więc
    o wszystkim dowiadujemy się z tego, co nie zostało zrobione: kopia,
    która się nie wykonała, paczka, która nie doszła, raport, który nie
    przyszedł.

    Dlatego kolejność jest tu jedyną rzeczą, która ma znaczenie.
    Najpierw tryb obserwacji — mechanizm zapisuje trafienia, ale nie
    blokuje — i przegląd dziennika przez pełen cykl zadań, czyli przez
    tydzień albo miesiąc, zależnie od tego, co na tej maszynie chodzi.
    Dopiero potem blokada.

    Pominięcie tego kroku nie objawi się od razu. Objawi się przy
    zadaniu miesięcznym, w miesiąc po zmianie, gdy nikt już nie łączy
    tych dwóch rzeczy.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    I raise the class here to a knowing rollout and hold it on a server honester than the carrying
    over of the station's reckoning.

    The ground lies in the way scripts are carried out on a server. Tools of management hand over
    orders encoded - not to hide anything but because it is the simplest way to hand over a
    many-lined script in one calling. It looks exactly like a making obscure, being the same craft
    used to another end.

    It touches systems of the dealing out of software, tools of taking stock, some installers and
    many scripts of rolling out written over years by sundry people.

    The symptom is worse than the blocking itself. A task run out of a timetable stops ending in
    success but reports no ground - it reports a fault of the carrying out. Nobody sits by it, so
    all is learnt from what was not done - a backup that did not run, a bundle that did not come, a
    report that did not arrive.

    Therefore the order is here the one thing that matters. First the mode of watching - the
    mechanism writes strikings down but blocks not - and a looking through of the log over a full
    round of tasks, that is over a week or a month, after what runs on this machine. Only then the
    blocking.

    The leaving out of that step will not show at once. It will show at the monthly task, a month
    after the change, when nobody joins those two things any more.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
  what_breaks:
    pl:
      - Narzędzia zarządzania przekazujące polecenia zakodowane mogą zostać potraktowane jak zaciemnione
      - Skrypty wdrożeniowe i instalatory pakujące treść w jedno wywołanie mogą przestać się wykonywać
      - Zadanie z harmonogramu zgłasza błąd wykonania, a nie powód, bo nikt przy nim nie siedzi
      - Objaw przy zadaniu miesięcznym pojawi się miesiąc po zmianie, gdy nikt już nie łączy tych rzeczy
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - Tools of management handing over encoded orders may be dealt with as made obscure
      - Scripts of rolling out and installers packing their substance into one calling may stop working
      - A task out of a timetable reports a fault of carrying out and not a ground, nobody sitting by it
      - At a monthly task the symptom will show a month after the change, when nobody joins those things
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przeszedł jeszcze pełen cykl zadań w trybie obserwacji, z przeglądem dziennika trafień
      - Systemy dystrybucji oprogramowania na tej maszynie przekazują polecenia w postaci zakodowanej
    en:
      - A full round of tasks in the mode of watching, with a looking through of the log, has not yet passed
      - Systems of the dealing out of software on this machine hand over orders in an encoded shape
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '5beb7efe-fd9a-4556-801d-275e5ffc04cc'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '5beb7efe-fd9a-4556-801d-275e5ffc04cc'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two is the mode of watching - strikings are written down and nothing is
    # blocked. Run a full round of tasks at two before setting one here.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '5beb7efe-fd9a-4556-801d-275e5ffc04cc' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Zaciemnienie ocenia się z wyglądu, a nie z zamiaru — i stąd bierze
    się cała uciążliwość tej reguły. Narzędzia zarządzania przekazują
    polecenia zakodowane nie po to, żeby coś ukryć, tylko dlatego, że
    tak najprościej przekazać wielowierszowy skrypt jednym wywołaniem.

    Podniosłem klasę do świadomego wdrożenia, bo na serwerze skrypty
    wykonują się bez udziału człowieka, a objawem trafienia jest
    zadanie, które przestało się udawać — nie komunikat.

    Kolejność jest tu jedyną rzeczą, która ma znaczenie: najpierw tryb
    obserwacji przez pełen cykl zadań, potem blokada. Pominięcie tego
    kroku objawi się przy zadaniu miesięcznym, miesiąc po zmianie.
  en: |
    Obscurity is reckoned by look and not by intent - and thence comes this rule's whole
    disruption. Tools of management hand over encoded orders not to hide anything but because it is
    the simplest way to hand over a many-lined script in one calling.

    I raised the class to a knowing rollout, scripts on a server being carried out with no person's
    part in it, and the symptom of a striking being a task that has stopped succeeding - not a
    word.

    The order is here the one thing that matters - first the mode of watching over a full round of
    tasks, then the blocking. The leaving out of that step will show at the monthly task, a month
    after the change.
