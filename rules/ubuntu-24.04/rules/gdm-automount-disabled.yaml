id: ubuntu2404-gdm-automount-disabled

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.7.6
  section: Initial Setup > Configure GNOME Display Manager
  title:
    pl: GNOME nie montuje automatycznie nośników wymiennych
    en: Ensure GDM automatic mounting of removable media is disabled
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Po podłączeniu pendrive'a lub dysku USB GNOME od razu go montuje
    i otwiera okno z jego zawartością. System plików na nośniku jest wtedy
    odczytywany przez jądro bez żadnej decyzji użytkownika, a spreparowany
    obraz systemu plików może wykorzystać błąd w sterowniku. Automatyczne
    otwarcie okna sprzyja też uruchamianiu nieznanych plików.

    Punkt wymaga wyłączenia automatycznego montowania (automount)
    i otwierania okna (automount-open). Domyślnie oba są włączone. Nośnik
    nadal da się zamontować jednym kliknięciem w menedżerze plików.
  en: |
    When a USB stick or disk is plugged in, GNOME mounts it right away and
    opens a window with its content. The file system on the medium is then
    read by the kernel without any decision by the user, and a crafted file
    system image can exploit a flaw in the driver. Opening the window
    automatically also encourages running unknown files.

    The item requires turning off automatic mounting (automount) and opening
    of the window (automount-open). By default both are on. The medium can
    still be mounted with a single click in the file manager.

disruption_description:
  pl: |
    Użytkownicy zauważą, że po podłączeniu pendrive'a nic się nie dzieje:
    trzeba otworzyć menedżer plików i kliknąć urządzenie na pasku bocznym.
    Zmiana działa od następnego zalogowania. Użytkownik może ją cofnąć
    w swoich ustawieniach, dopóki nie zostanie zablokowana (punkt 1.7.7).
  en: |
    Users will notice that nothing happens when a USB stick is plugged in:
    they have to open the file manager and click the device in the sidebar.
    The change takes effect from the next sign-in. The user can undo it in
    their own settings until it is locked (item 1.7.7).

implementation_consequences:
  impact_areas:
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Pendrive'y, dyski USB i karty pamięci nie pojawiają się same; trzeba je zamontować w menedżerze plików
      - Programy, które oczekują, że nośnik będzie zamontowany od razu po podłączeniu, np. do importu zdjęć, go nie widzą
    en:
      - USB sticks, USB disks and memory cards do not appear on their own; they have to be mounted in the file manager
      - Programs that expect a medium to be mounted right after it is plugged in, for example to import photos, do not see it
  interruption: logoff
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if [ ! -x /usr/sbin/gdm3 ]; then echo GDM_ABSENT; exit 0; fi
    if ! command -v gsettings >/dev/null 2>&1; then echo GDM_ABSENT; exit 0; fi
    d=$(mktemp -d) || { echo CHECK_ERROR; exit 0; }
    trap 'rm -rf "$d"' EXIT
    g() { env -i PATH=/usr/bin:/bin HOME="$d" XDG_CONFIG_HOME="$d" XDG_RUNTIME_DIR="$d" GSETTINGS_BACKEND=dconf gsettings "$@" 2>/dev/null; }
    if ! g list-schemas | grep -qx org.gnome.login-screen; then echo GDM_ABSENT; exit 0; fi
    state() {
      a=$(g get org.gnome.desktop.media-handling automount) && o=$(g get org.gnome.desktop.media-handling automount-open) || { echo CHECK_ERROR; return; }
      if [ "$a" = false ] && [ "$o" = false ]; then echo AUTOMOUNT_OFF; else echo "AUTOMOUNT_ON:automount=$a,open=$o"; fi
    }
    state
  expected: '^(AUTOMOUNT_OFF|GDM_ABSENT)$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/sentin-harden-automount
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=dconf-1
        m=""
        p=$(dirname "$f")
        while [ "$p" != /etc/dconf/db ]; do
          if [ ! -d "$p" ]; then m="$m $p"; fi
          p=$(dirname "$p")
        done
        echo "missing=${m# }"
        if [ -e /etc/dconf/db/local ]; then echo db=1; else echo db=0; fi
        if [ -f "$f" ]; then echo file=1; else echo file=0; fi
        echo ---
        if [ -f "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/sentin-harden-automount
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      d=$(mktemp -d) || exit 1
      trap 'rm -rf "$d"' EXIT
      g() { env -i PATH=/usr/bin:/bin HOME="$d" XDG_CONFIG_HOME="$d" XDG_RUNTIME_DIR="$d" GSETTINGS_BACKEND=dconf gsettings "$@" 2>/dev/null; }
      if ! command -v gsettings >/dev/null 2>&1 || ! g list-schemas | grep -qx org.gnome.login-screen; then
        echo "GDM is not installed, nothing to change"; exit 0
      fi
      if [ ! -d "$D" ] && [ -e /etc/dconf/db/local ]; then
        echo "/etc/dconf/db/local is not built from keyfiles in $D, not changing it" >&2; exit 1
      fi
      # Without system-db:local in the profile the keyfile has no effect.
      P=/etc/dconf/profile/user
      if [ -e "$P" ]; then
        if ! grep -Eq '^[[:space:]]*system-db:local[[:space:]]*$' "$P"; then
          echo "$P does not read the local database (system-db:local); add it by hand. Nothing changed" >&2; exit 1
        fi
      else
        base=$(echo user-db:user) || { echo "Could not read the default user profile" >&2; exit 1; }
        mkdir -p /etc/dconf/profile
        {
          echo '# Sentin-Harden: reads /etc/dconf/db/local; removed with the last keyfile there'
          printf '%s\n' "$base" | awk '!d && NF && !/^[[:space:]]*user-db:/ { print "system-db:local"; d = 1 } NF { print } END { if (!d) print "system-db:local" }'
        } > "$P.tmp"
        chmod 0644 "$P.tmp"
        mv -f "$P.tmp" "$P"
      fi
      state() {
        a=$(g get org.gnome.desktop.media-handling automount) && o=$(g get org.gnome.desktop.media-handling automount-open) || { echo CHECK_ERROR; return; }
        if [ "$a" = false ] && [ "$o" = false ]; then echo AUTOMOUNT_OFF; else echo "AUTOMOUNT_ON:automount=$a,open=$o"; fi
      }
      body() {
        printf '%s\n' '[org/gnome/desktop/media-handling]' 'automount=false' 'automount-open=false'
      }
      mkdir -p "$(dirname "$f")"
      tmp=$(mktemp "$f.XXXXXX")
      { echo '# Sentin-Harden: ubuntu2404-gdm-automount-disabled'; body; } > "$tmp"
      chmod 0644 "$tmp"
      mv -f "$tmp" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      dconf update
      s=$(state)
      if ! printf '%s\n' "$s" | grep -Eq '^(AUTOMOUNT_OFF)$'; then
        echo "The setting is still not in effect ($s): another dconf database or file overrides it" >&2; exit 1
      fi
      echo "Wrote $f and updated the dconf databases ($s)"
    )

  rollback_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/sentin-harden-automount
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=dconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      m=$(sed -n '2s/^missing=//p' "$b")
      db=$(sed -n '3s/^db=//p' "$b")
      fl=$(sed -n '4s/^file=//p' "$b")
      case "$db$fl" in [01][01]) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ "$fl" = 1 ]; then
        tmp=$(mktemp "$f.XXXXXX")
        sed '1,/^---$/d' "$b" > "$tmp"
        chmod 0644 "$tmp"
        mv -f "$tmp" "$f"
        if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      else
        rm -f "$f"
      fi
      for p in $m; do rmdir "$p" 2>/dev/null || true; done
      if command -v dconf >/dev/null 2>&1; then dconf update; fi
      if [ "$db" = 0 ] && [ ! -d "$D" ]; then rm -f /etc/dconf/db/local; fi
      # The profile we created goes once no keyfile in local.d needs it.
      P=/etc/dconf/profile/user
      if [ -f "$P" ] && head -n 1 "$P" | grep -q '^# Sentin-Harden:' &&
         [ -z "$(find /etc/dconf/db/local.d -type f 2>/dev/null | head -n 1)" ]; then
        rm -f "$P"
        rmdir /etc/dconf/profile 2>/dev/null || true
      fi
      echo "Restored the previous state of $f and updated the dconf databases"
    )

privileges: root
runnable: true

sources:
  - https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/blob/master/schemas/org.gnome.desktop.media-handling.gschema.xml.in
  - https://help.gnome.org/admin/system-admin-guide/stable/dconf-profiles.html.en

notes:
  pl: |
    Sprawdzenie odczytuje ustawienia przez gsettings z pustym katalogiem
    domowym i z tym profilem dconf, którego używa sesja (user, a bez niego
    domyślnym), czyli tak, jak zobaczy je nowy użytkownik bez własnych
    ustawień. Czyta skompilowane bazy, więc plik zapisany w katalogu .d bez
    uruchomienia dconf update nie spełnia punktu. Jeśli GDM nie jest
    zainstalowany, co jest domyślne na Ubuntu Server, wynik GDM_ABSENT
    oznacza, że punkt nie dotyczy systemu.

    Ubuntu nie dostarcza profilu /etc/dconf/profile/user, więc sesje
    użytkowników czytają tylko ich własne ustawienia. Naprawa tworzy ten
    profil z wierszami user-db:user i system-db:local, oznaczony komentarzem
    Sentin-Harden. Jeśli profil już istnieje bez wiersza system-db:local,
    naprawa kończy się błędem bez zmian. Potem zapisuje własny plik /etc/dconf/db/local.d/sentin-harden-automount,
    uruchamia dconf update i sprawdza ustawienie ponownie; kończy się błędem,
    jeśli inny plik je nadpisuje. Wycofanie przywraca poprzedni stan pliku, uruchamia dconf
    update i usuwa utworzony profil, gdy w /etc/dconf/db/local.d, razem
    z katalogiem locks, nie zostaje już żaden plik.
  en: |
    The check reads the settings with gsettings with an empty home directory
    and the dconf profile a session uses (user, or the default one without
    it), that is as a new user without own settings sees them. It reads the compiled databases, so a file written to a .d
    directory without running dconf update does not meet the item. If GDM is
    not installed, which is the default on Ubuntu Server, the GDM_ABSENT
    result means the item does not apply to the system.

    Ubuntu ships no /etc/dconf/profile/user profile, so user sessions read
    only their own settings. The remediation creates that profile with the
    user-db:user and system-db:local lines, marked with a Sentin-Harden
    comment. If the profile already exists without the system-db:local line,
    the remediation ends with an error without changes. It then writes its own
    /etc/dconf/db/local.d/sentin-harden-automount file, runs dconf update and checks the setting again; it fails if
    another file overrides it. Rollback restores the previous state of the file, runs dconf
    update and removes the created profile when no file is left in
    /etc/dconf/db/local.d, including its locks directory.
