id: win11-search-highlights-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Treść pobierana do okna wyszukiwania wyłączona
    en: Content fetched into the search window switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Okno wyszukiwania pokazuje treść, o którą nikt nie prosił: obrazki,
    ciekawostki, odnośniki do stron, informacje o dniu. Treść ta nie jest
    wbudowana w system — jest pobierana z sieci przy każdym otwarciu okna
    i zmienia się w ciągu dnia.

    Dla bezpieczeństwa liczą się dwie rzeczy. Pierwsza to samo połączenie
    wychodzące, nawiązywane przy każdym kliknięciu w pole wyszukiwania, czyli
    kilkadziesiąt razy dziennie na stanowisku roboczym. Druga, poważniejsza,
    to odnośniki: użytkownik dostaje w oknie systemowym odsyłacze do stron,
    których nie szukał i których nikt w organizacji nie zatwierdzał.

    Okno wyszukiwania jest przy tym miejscem, któremu użytkownik ufa
    bezwarunkowo — jest częścią systemu, otwiera się jednym klawiszem
    i zwykle zawiera własne pliki. Odnośnik do strony zewnętrznej, podany
    w tym samym oknie i w tym samym stylu, dziedziczy to zaufanie.

    Punkt zostawia wyszukiwanie nietknięte. Znika wyłącznie treść pobierana
    z zewnątrz.
  en: |
    The search window shows content nobody asked for: pictures, curiosities, links to
    pages, notes about the day. That content is not built into the system - it is
    fetched from the network every time the window opens and changes through the day.

    Two things matter for security. The first is the outgoing connection itself, made
    at every click into the search box - several dozen times a day at a working
    station. The second, more serious, is the links: the user is given, in a system
    window, pointers to pages they did not look for and that nobody in the
    organisation approved.

    The search window is meanwhile a place the user trusts unconditionally - it is
    part of the system, opens with a single key and usually holds their own files. A
    link to an outside page, offered in that same window and in that same style,
    inherits that trust.

    The item leaves search untouched. Only the content fetched from outside
    disappears.

disruption_description:
  pl: |
    Nic nie przestaje działać. Wyszukiwanie plików, programów i ustawień działa
    tak samo; znika wyłącznie treść, która pojawiała się w oknie sama.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego i nie ma sposobu pracy, który przestanie być możliwy.

    Zmiana jest widoczna — okno wyszukiwania wygląda po wdrożeniu inaczej,
    jest puste zamiast wypełnione obrazkami. Część użytkowników zauważy to
    i zapyta, czy coś się zepsuło. Jest to jedyny skutek, do którego warto
    się przygotować, i załatwia go jedno zdanie wyjaśnienia.

    Nie ma restartu. Zmiana obowiązuje od następnego otwarcia okna.
  en: |
    Nothing stops working. Searching for files, programs and settings works the same;
    only the content that appeared in the window by itself disappears.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no way of working that stops being possible.

    The change is visible - after the rollout the search window looks different,
    empty instead of filled with pictures. Some users will notice and ask whether
    something has broken. That is the only effect worth preparing for, and a single
    sentence of explanation settles it.

    There is no restart. The change takes effect the next time the window is opened.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Obrazki, ciekawostki i odnośniki przestaną pojawiać się w oknie wyszukiwania
      - Okno wyszukiwania wygląda po wdrożeniu inaczej i część użytkowników o to zapyta
      - Wyszukiwanie plików, programów i ustawień działa bez zmian
    en:
      - Pictures, curiosities and links stop appearing in the search window
      - The search window looks different after the rollout and some users will ask about it
      - Searching for files, programs and settings works unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko pokazowe ma wyglądać dokładnie tak jak system w ustawieniach fabrycznych
    en:
      - A demonstration station is meant to look exactly like the system in its factory settings
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name refers to the window's internal name and does not
      # resemble the setting's name in the editor.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'EnableDynamicContentInWSB'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'EnableDynamicContentInWSB'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableDynamicContentInWSB' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Nazwa wpisu odwołuje się do wewnętrznej nazwy okna wyszukiwania i nie
    przypomina nazwy ustawienia w edytorze zasad. Jest to najczęstszy powód
    pomyłki przy ręcznym sprawdzaniu tego punktu.

    Punkt jest jednym z kilku ograniczających treść pobieraną do powłoki —
    obok porad w ustawieniach, treści na ekranie blokady i propozycji w menu
    start. Każdy z nich zamyka inny kanał, a wdrożenie ich pojedynczo zostawia
    pozostałe otwarte.

    Wartość jest umiarkowana i polega głównie na odebraniu odnośnikom
    zewnętrznym oprawy okna systemowego. Nie jest to punkt zamykający drogę
    wejścia.
  en: |
    The entry's name refers to the search window's internal name and does not
    resemble the setting's name in the policy editor. That is the commonest cause of
    a slip when checking this item by hand.

    The item is one of several limiting the content fetched into the shell - beside
    the tips in the settings, the content on the lock screen and the suggestions in
    the start menu. Each closes a different channel, and applying them one at a time
    leaves the others open.

    The worth is moderate and lies mainly in taking a system window's framing away
    from outside links. It is not an item closing a way in.
