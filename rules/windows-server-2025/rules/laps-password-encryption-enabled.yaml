id: win2025-laps-password-encryption-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Szyfrowanie hasła lokalnego administratora w katalogu włączone
    en: Encryption of the local administrator's password in the directory switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że hasło lokalnego administratora trafia do katalogu
    zaszyfrowane, a nie jawnym tekstem w atrybucie obiektu maszyny.

    Kategoria wysoka i warto powiedzieć, dlaczego to jest inny rodzaj
    punktu niż długość czy złożoność. Tamte opisują samo hasło. Ten
    rozstrzyga, ile jest warte jego zdobycie z drugiej strony — nie
    z maszyny, tylko z katalogu.

    Bez szyfrowania jedynym zabezpieczeniem hasła w katalogu jest lista
    uprawnień do odczytu atrybutu. Listy uprawnień w katalogu mają to do
    siebie, że rosną: przez lata dokładane są konta usług, zespoły
    utrzymania, narzędzia inwentaryzacyjne i integracje, a usuwane bywają
    rzadko. Do tego dochodzi każdy, kto ma prawo czytać całość — a takich
    kont jest w katalogu więcej, niż wynika ze spisu administratorów.

    Po włączeniu szyfrowania samo prawo do odczytu atrybutu już nie
    wystarcza. Potrzebna jest jeszcze przynależność do grupy wskazanej jako
    uprawniona do odszyfrowania. Zdobycie hasła wymaga więc dwóch rzeczy
    zamiast jednej.

    Dla serwera znaczy to tyle: hasło konta, które działa wtedy, gdy nie
    działa nic innego, przestaje być czytelne dla każdego, kto przez lata
    dostał w katalogu prawo odczytu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła
    lokalnych administratorów wszystkich maszyn objętych mechanizmem,
    odczytane z jednego miejsca, bez dotykania którejkolwiek z tych maszyn.
  en: |
    The item makes the local administrator's password reach the directory
    encrypted rather than in plain text in an attribute of the machine
    object.

    The category is high, and it is worth saying why this is a different
    kind of item from length or complexity. Those describe the password
    itself. This one settles what obtaining it from the other side is worth
    - not from the machine but from the directory.

    Without encryption the only protection of the password in the directory
    is the list of permissions to read the attribute. Permission lists in a
    directory have a way of growing: over the years service accounts,
    maintenance teams, inventory tools and integrations get added, and are
    rarely removed. On top of that comes everybody with the right to read
    everything - and there are more such accounts in a directory than the
    roll of administrators suggests.

    Once encryption is on, the right to read the attribute is no longer
    enough by itself. Membership of the group named as entitled to decrypt
    is needed as well. Obtaining the password therefore takes two things
    instead of one.

    For a server this means: the password of the account that works when
    nothing else does stops being readable by everybody who has been
    granted read rights in the directory over the years.

    What an attacker gains while the item goes unmet: the local
    administrator passwords of every machine covered by the mechanism, read
    from one place, without touching any of those machines.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać, na czym polega
    ryzyko, bo ono nie jest w tym, co użytkownik zobaczy, tylko w tym,
    czego nie zobaczy nikt.

    Szyfrowanie wymaga odpowiedniego poziomu funkcjonalności katalogu.
    Tam, gdzie katalog jest starszy, maszyna nie tylko nie zaszyfruje
    hasła — ona go w ogóle nie odłoży. Skutkiem jest maszyna bez hasła
    zapisanego nigdzie, wyglądająca w raporcie zgodnie. Dowiadujemy się
    o tym dopiero przy próbie odczytu, czyli w trakcie awarii. Dlatego
    sprawdzenie poziomu katalogu należy do wdrożenia, a nie do listy
    życzeń.

    Druga rzecz do ustalenia przed zmianą: kto ma być uprawniony do
    odszyfrowania. Domyślnie jest to wąska grupa i to jest właściwe, ale
    jeżeli obsługa maszyn siedzi poza nią — dyżurni, dostawca utrzymania,
    zespół bazy danych — po tej zmianie odczytają atrybut i nic z niego nie
    wyciągną. Nie jest to awaria, tylko brak uprawnienia, ale w trakcie
    incydentu wygląda tak samo.

    Trzecia uwaga: zmiana dotyczy haseł odkładanych po niej. Hasła już
    leżące w katalogu jawnie pozostają jawne aż do najbliższej zmiany.
    Jeżeli ta ma nastąpić dopiero za miesiąc, to przez miesiąc zgodność
    i faktyczny stan katalogu są dwiema różnymi rzeczami.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to point out where the risk
    lies, because it is not in what the user will see but in what nobody
    will see.

    Encryption requires a suitable directory functional level. Where the
    directory is older, the machine will not merely fail to encrypt the
    password - it will not deposit it at all. The result is a machine with
    its password recorded nowhere, looking compliant in the report. We
    learn about it only when trying to read it, that is, during a failure.
    So checking the directory's level belongs to the rollout rather than to
    a wish list.

    The second thing to settle before the change: who is to be entitled to
    decrypt. By default this is a narrow group, and rightly so, but if the
    people who run the machines sit outside it - the on-call rota, the
    maintenance vendor, the database team - after this change they will
    read the attribute and get nothing out of it. This is not a failure but
    a missing entitlement, though during an incident it looks the same.

    A third note: the change concerns passwords deposited after it.
    Passwords already lying in the directory in the clear stay in the clear
    until the next change. If that is a month away, then for a month
    compliance and the directory's actual state are two different things.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - encryption-and-tls
    - scripting-and-automation
  what_breaks:
    pl:
      - Na starszym katalogu maszyna nie odłoży hasła w ogóle, a raport i tak pokaże punkt jako spełniony
      - Dowiadujemy się o tym dopiero przy próbie odczytu hasła, czyli w trakcie awarii
      - Obsługa spoza grupy uprawnionej do odszyfrowania odczyta atrybut i nic z niego nie wyciągnie
      - W trakcie incydentu brak uprawnienia wygląda tak samo jak awaria mechanizmu
      - Hasła już leżące w katalogu jawnie pozostają jawne aż do najbliższej zmiany
    en:
      - On an older directory the machine will not deposit the password at all, and the report still shows the item as met
      - We learn about it only when trying to read the password, that is, during a failure
      - Operators outside the group entitled to decrypt will read the attribute and get nothing out of it
      - During an incident a missing entitlement looks exactly like a failure of the mechanism
      - Passwords already lying in the directory in the clear stay in the clear until the next change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie potwierdzono, że katalog pracuje na poziomie funkcjonalności wymaganym przez szyfrowanie
      - Nie ustalono, kto ma należeć do grupy uprawnionej do odszyfrowania hasła
      - Obsługa maszyn w razie awarii pracuje na kontach spoza tej grupy i nie przewidziano dla nich drogi odczytu
    en:
      - It has not been confirmed that the directory runs at the functional level encryption requires
      - It has not been settled who is to belong to the group entitled to decrypt the password
      - The people who handle failures work from accounts outside that group and no route to read it has been provided for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ADPasswordEncryptionEnabled'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'ADPasswordEncryptionEnabled' -ErrorAction SilentlyContinue).'ADPasswordEncryptionEnabled'
    [pscustomobject]@{
      path        = $path
      name        = 'ADPasswordEncryptionEnabled'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Confirm the directory's functional level first. On an older directory the
    # machine stops depositing the password altogether while the report still
    # reads as met, and that is discovered during a failure.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ADPasswordEncryptionEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-concepts-overview

notes:
  pl: |
    Inny rodzaj punktu niż długość czy złożoność: tamte opisują hasło, ten
    rozstrzyga, ile jest warte jego zdobycie z drugiej strony — z katalogu,
    a nie z maszyny.

    Bez szyfrowania jedynym zabezpieczeniem jest lista uprawnień do odczytu
    atrybutu, a listy uprawnień w katalogu rosną przez lata i rzadko się
    kurczą.

    Ryzyko nie leży w tym, co użytkownik zobaczy, tylko w tym, czego nie
    zobaczy nikt: na starszym katalogu maszyna nie odłoży hasła w ogóle,
    a raport pokaże punkt jako spełniony.
  en: |
    A different kind of item from length or complexity: those describe the
    password, this one settles what obtaining it from the other side is
    worth - from the directory rather than from the machine.

    Without encryption the only protection is the list of permissions to
    read the attribute, and permission lists in a directory grow over the
    years and rarely shrink.

    The risk lies not in what the user will see but in what nobody will
    see: on an older directory the machine will not deposit the password at
    all, and the report shows the item as met.
