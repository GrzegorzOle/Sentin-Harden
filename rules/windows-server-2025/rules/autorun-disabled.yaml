id: win2025-autorun-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Autoodtwarzanie wyłączone dla wszystkich napędów
    en: AutoPlay disabled for all drives
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza autoodtwarzanie dla wszystkich rodzajów napędów.
    Autoodtwarzanie to mechanizm, w którym samo pojawienie się nośnika
    w systemie wystarcza, żeby coś zostało wykonane bez decyzji człowieka.

    Jest to najstarsza droga, jaką program dostaje się na maszynę
    z zewnątrz, i zestawiam ją tu z drogą najnowszą — instalatorem
    sięgającym po pakiet do sieci. Obie odpowiadają na to samo pytanie:
    co się dzieje, gdy program przychodzi spoza maszyny. Różni je tylko
    to, że jedna zaczyna się od polecenia, a druga od podłączenia.

    Zostawiam kategorię średnią i chcę uzasadnić, dlaczego na serwerze
    nie obniżam jej niżej, mimo że nikt tu nośników nie wkłada. Napęd
    pojawiający się w systemie serwera to najczęściej nie pendrive, tylko
    dysk kopii zapasowych podłączony na stałe albo obraz zamontowany
    z poziomu hipernadzorcy. To drugie jest tu istotne: obraz montuje się
    przez konsolę zarządzania, a więc zdalnie, przez kogoś, kto fizycznie
    przy maszynie nie stoi. Droga wygląda na fizyczną, a fizyczna nie
    jest.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    kodu na serwerze przez samo zamontowanie obrazu z poziomu
    hipernadzorcy, bez logowania się na tę maszynę.
  en: |
    The item switches off the self-playing for all kinds of drives. The self-playing is a working
    wherein the mere coming forth of a bearer in the system is enough for something to be carried out
    without a person's deciding.

    It is the oldest road whereby a program comes onto a machine from without, and I set it here
    beside the newest - the installer reaching into the net for a package. Both answer the same
    question - what befalls when a program comes from beyond the machine. They differ only in that
    the one begins at a command and the other at a plugging in.

    I leave the category middling and would stand by my not lowering it further on a server, though
    nobody here puts bearers in. A drive coming forth in a server's system is most often no hand-held
    stick but a disk of keepings of copies bound on for good, or an image mounted from within an
    overseer. That second is here weighty - an image is mounted through a board of ruling, that is
    from afar, by somebody who stands not bodily at the machine. The road looks bodily and bodily it
    is not.

    What an attacker gains while the item goes unmet - the carrying out of code upon the server by
    the mere mounting of an image from within the overseer, without a signing in to that machine.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" wobec oceny dla stacji roboczej
    i powód jest po prostu taki, że skutek tej zmiany widać tylko tam,
    gdzie ktoś patrzy.

    Na stacji roboczej autoodtwarzanie jest wygodą: nośnik się pojawia,
    okno się otwiera, użytkownik wybiera, co zrobić. Po wyłączeniu ta
    wygoda znika i ludzie to zauważają. Na serwerze nikt tego okna nie
    ogląda, bo nikt przy maszynie nie siedzi, a nośnik podłącza się po to,
    żeby coś z niego świadomie odczytać.

    Zmiana nie dotyczy dostępności napędu. Dysk podłączony jest dalej
    widoczny, litera jest przypisana, pliki dają się odczytać, kopia
    zapasowa zapisuje się tak samo. Wyłączone zostaje wyłącznie
    uruchamianie czegokolwiek bez pytania w chwili pojawienia się
    nośnika.

    Nie znam serwerowego zastosowania opierającego się na tym, że nośnik
    po podłączeniu sam coś uruchamia. Gdyby takie było, byłoby to
    zastosowanie warte przepisania niezależnie od tego punktu.

    Zmiana cofa się natychmiast i nie wymaga restartu. Napędy już
    podłączone pozostają dostępne.
  en: |
    I lower the class to "no disruption" against the reckoning for a workstation, and the ground is
    simply that the outcome of this change is seen only where somebody looks.

    On a workstation the self-playing is an ease - the bearer comes forth, the window opens, the user
    picks what to do. After the switching off that ease goes and people mark it. On a server nobody
    looks upon that window, nobody sitting at the machine, and a bearer is bound on that something
    may be wittingly read off it.

    The change bears not on the come-at-ableness of the drive. A bound-on disk is seen still, the
    letter is dealt to it, the files may be read, a keeping of a copy writes itself the same. What is
    switched off is the running of anything without an asking at the hour of the bearer's coming
    forth alone.

    I know of no use on a server that leans upon a bearer's running something of itself after the
    binding on. Were there such a one, it would be a use worth writing anew whatever this item said.

    The change is undone at once and takes no restart. Drives already bound on stay come-at-able.

implementation_consequences:
  impact_areas:
    - removable-media
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Nośnik pojawiający się w systemie nie uruchamia już niczego bez pytania
      - Dysk podłączony jest dalej widoczny, litera jest przypisana, pliki dają się odczytać
      - Kopia zapasowa na dysk podłączony na stałe zapisuje się tak samo
      - Na serwerze nikt nie ogląda okna autoodtwarzania, bo nikt przy maszynie nie siedzi
      - Brak serwerowego zastosowania opierającego się na tym, że nośnik sam coś uruchamia
    en:
      - A bearer coming forth in the system runs no longer anything without an asking
      - A bound-on disk is seen still, the letter is dealt to it, the files may be read
      - A keeping of a copy onto a disk bound on for good writes itself the same
      - On a server nobody looks upon the window of self-playing, nobody sitting at the machine
      - No use on a server that leans upon a bearer's running something of itself
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'NoDriveTypeAutoRun'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '255'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoDriveTypeAutoRun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # 255 covers every drive type. Attached disks stay readable: only the
    # running of something at the moment a drive appears is switched off.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoDriveTypeAutoRun' -Value 255 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-autoplay

notes:
  pl: |
    Najstarsza droga, jaką program dostaje się na maszynę z zewnątrz,
    warta zestawienia z najnowszą — instalatorem sięgającym po pakiet do
    sieci. Obie odpowiadają na to samo pytanie, a różni je tylko to, że
    jedna zaczyna się od polecenia, a druga od podłączenia.

    Kategoria nieobniżona mimo tego, że na serwerze nikt nośników nie
    wkłada. Napęd pojawiający się w systemie serwera to najczęściej dysk
    kopii zapasowych podłączony na stałe albo obraz zamontowany z poziomu
    hipernadzorcy — a ten drugi montuje ktoś zdalnie, przez konsolę
    zarządzania. Droga wygląda na fizyczną, a fizyczna nie jest.
  en: |
    The oldest road whereby a program comes onto a machine from without, worth setting beside the
    newest - the installer reaching into the net for a package. Both answer the same question, and
    they differ only in that the one begins at a command and the other at a plugging in.

    The category is not lowered though nobody puts bearers into a server. A drive coming forth in a
    server's system is most often a disk of keepings of copies bound on for good, or an image mounted
    from within an overseer - and that second is mounted by somebody from afar, through a board of
    ruling. The road looks bodily and bodily it is not.
