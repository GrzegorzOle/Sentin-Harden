id: win2016-bitlocker-os-drive-recovery-options

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysku systemowego ustalony
    en: The way of recovering access to the system drive settled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, skąd bierze się dostęp do zaszyfrowanego dysku systemowego,
    gdy zwykła droga zawiedzie, i gdzie ten dostęp jest przechowywany.

    Ze wszystkich trzech reguł o odzyskiwaniu ta jest najważniejsza,
    bo przedmiotem jest maszyna, która się nie uruchamia. Dysk z danymi
    nieodblokowany oznacza brak dostępu do plików; dysk systemowy
    nieodblokowany oznacza maszynę stojącą przy pytaniu, do której nie ma
    żadnej innej drogi — ani sieciowej, ani zdalnej, bo żadna z nich jeszcze
    nie wstała.

    Decyzja rozpada się na osiem wartości i warto powiedzieć, co niesie
    każda grupa. Hasło odzyskiwania ma być wymagane, bo jest to jedyna
    postać klucza, którą da się podyktować przez telefon człowiekowi
    stojącemu przy konsoli. Klucz w postaci pliku na nośniku jest z tego
    samego powodu wykluczony: trzeba go włożyć do maszyny, która jeszcze nie
    pracuje.

    Zapis do katalogu ma być włączony i obowiązkowy, bo klucz do dysku
    systemowego przechowywany na tym dysku nie jest kluczem. Agent
    odzyskiwania danych ma być wyłączony, bo jest osobną drogą wejścia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę wejścia
    przez agenta odzyskiwania. Co traci właściciel maszyny: możliwość
    uruchomienia jej, gdy coś w łańcuchu rozruchowym się zmieni.
  en: |
    The item settles where access to an encrypted system drive comes from when the ordinary road fails,
    and where that access is kept.

    Of all three rules about recovering this is the weightiest, the subject being a machine that does
    not start. A data drive left unlocked means a want of access to files; a system drive left unlocked
    means a machine standing at a question, to which there is no other road at all - neither over the
    network nor remote, none of them having come up yet.

    The decision falls into eight values and it is worth saying what each group carries. The recovery
    password is to be required, it being the one form of key that can be dictated down a telephone to
    somebody standing at the console. A key in the form of a file on a medium is for the same reason
    shut out: it has to be put into a machine that is not yet working.

    Writing to the directory is to be switched on and obligatory, a key to a system drive kept on that
    drive being no key. The data recovery agent is to be switched off, being a road in of its own.

    What an attacker gains while the item goes unmet: a road in through the recovery agent. What the
    machine's owner loses: the possibility of starting it when something in the boot chain changes.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powodów jest dwa.

    Pierwszy jest ten sam co przy pozostałych regułach o odzyskiwaniu:
    obowiązkowy zapis do katalogu wiąże pierwsze zaszyfrowanie dysku
    systemowego z łącznością z katalogiem. Trafia to w moment, w którym
    maszynę się stawia — a więc często zanim wejdzie do domeny albo zanim
    sieć zostanie doprowadzona. Szyfrowanie po prostu się nie uda,
    a komunikat będzie mówił o zasadzie.

    Drugi jest osobliwy dla dysku systemowego i wart osobnego zdania.
    Ukrycie strony podpowiadającej znaczy, że ekran proszący o klucz
    odzyskiwania przestaje podawać identyfikator, po którym ten klucz się
    odnajduje. Człowiek stojący przy konsoli widzi prośbę o klucz i nie wie,
    o który klucz chodzi. Jest to zabezpieczenie sensowne — identyfikator
    podpowiada także obcemu — ale wymaga, żeby druga strona telefonu umiała
    ten klucz odnaleźć po nazwie maszyny.

    Wdrożenie nie dotyczy dysków już zaszyfrowanych. Klucz dysku
    zaszyfrowanego wcześniej jest tam, gdzie trafił przy szyfrowaniu,
    i zgodny wpis nie mówi o nim nic. Sprawdzenie, czy klucz maszyny
    faktycznie jest w katalogu, jest czynnością osobną i warto ją wykonać,
    zanim ktokolwiek uzna sprawę za zamkniętą.

    Czego to nie psuje: pracy systemu, usług, sieci, dostępu do danych,
    codziennego odblokowywania dysku.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs a planned rollout", and the reasons are two.

    The first is the same as at the other rules about recovering: obligatory writing to the directory
    binds the first encryption of the system drive to connectivity with the directory. That strikes the
    moment a machine is being set up - which is to say often before it enters the domain or before the
    network is brought to it. The encryption will simply not succeed, and the message will speak of a
    policy.

    The second is peculiar to the system drive and worth a sentence of its own. Hiding the prompting
    page means the screen asking for the recovery key ceases to give the identifier by which that key is
    found. Somebody standing at the console sees a request for a key and does not know which key is
    meant. It is a sensible safeguard - the identifier prompts a stranger too - but it calls for the
    other end of the telephone to be able to find that key by the machine's name.

    The rollout does not concern drives already encrypted. The key of a drive encrypted earlier is where
    it landed at encryption, and a compliant entry says nothing about it. Checking whether a machine's
    key really is in the directory is an act of its own and is worth carrying out before anybody holds
    the matter shut.

    What this does not break: the system's working, services, the network, access to data, or the
    everyday unlocking of the drive.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Pierwsze zaszyfrowanie dysku systemowego nie uda się bez łączności z katalogiem, a moment ten przypada na stawianie maszyny
      - Ekran proszący o klucz odzyskiwania przestaje podawać identyfikator, po którym ten klucz się odnajduje
      - Człowiek przy konsoli nie wie, o który klucz chodzi, więc druga strona telefonu musi umieć odnaleźć go po nazwie maszyny
      - Klucz dysku zaszyfrowanego przed zmianą zostaje tam, gdzie trafił, a zgodny wpis nie mówi o nim nic
      - Praca systemu, usługi, sieć i codzienne odblokowywanie dysku pozostają bez zmian
    en:
      - The first encryption of the system drive will not succeed without connectivity to the directory, and that moment falls at the machine's setting up
      - The screen asking for the recovery key ceases to give the identifier by which that key is found
      - Somebody at the console does not know which key is meant, so the other end of the telephone must be able to find it by the machine's name
      - The key of a drive encrypted before the change stays where it landed, and a compliant entry says nothing about it
      - The system's working, services, the network and the everyday unlocking of the drive stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje w grupie roboczej i zapisu klucza do katalogu nie ma dokąd wykonać
      - Obsługa nie ma sposobu odnalezienia klucza po nazwie maszyny, a identyfikator przestanie być pokazywany
      - Maszyna jest stawiana przed wejściem do domeny i dysk systemowy ma zostać zaszyfrowany od razu
    en:
      - The machine works in a workgroup and there is nowhere to write the key to a directory
      - The attendance has no way of finding the key by the machine's name, and the identifier will cease to be shown
      - The machine is being set up before it enters the domain and the system drive is to be encrypted at once
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result. Reading them
      # apart would let a machine set halfway pass as set.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        OSRecovery                     = 1
        OSManageDRA                    = 0
        OSRecoveryPassword             = 1
        OSRecoveryKey                  = 0
        OSHideRecoveryPage             = 1
        OSActiveDirectoryBackup        = 1
        OSActiveDirectoryInfoToStore   = 1
        OSRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @(
      'OSRecovery', 'OSManageDRA', 'OSRecoveryPassword', 'OSRecoveryKey',
      'OSHideRecoveryPage', 'OSActiveDirectoryBackup',
      'OSActiveDirectoryInfoToStore', 'OSRequireActiveDirectoryBackup'
    )) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The recovery password is required and the key on a medium shut out: a key
    # file has to be put into a machine that does not yet run, so on a server
    # it is of no use. The obligatory writing to the directory binds the first
    # encryption to connectivity with it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      OSRecovery                     = 1
      OSManageDRA                    = 0
      OSRecoveryPassword             = 1
      OSRecoveryKey                  = 0
      OSHideRecoveryPage             = 1
      OSActiveDirectoryBackup        = 1
      OSActiveDirectoryInfoToStore   = 1
      OSRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt zamyka cały zestaw o szyfrowaniu dysków i jest w nim ostatnią
    z trzech reguł o odzyskiwaniu. Warto je pokazywać razem, bo różnią się
    nie konstrukcją, tylko ceną pomyłki.

    Przy nośniku wymiennym pomyłka kosztuje zawartość nośnika. Przy dysku
    z danymi — zawartość woluminu. Przy dysku systemowym kosztuje maszynę,
    i to maszynę, do której nie ma żadnej drogi poza konsolą. To jest
    różnica, która uzasadnia kategorię wysoką mimo wysokiego kosztu
    wdrożenia.

    Ukrycie strony podpowiadającej jest jedyną rzeczą w tej regule, która
    wygląda na drobiazg, a nim nie jest. Decyduje o tym, czy człowiek
    stojący nocą przy konsoli ma szansę cokolwiek zrobić. Aplikacja powinna
    przy tym punkcie zadać jedno pytanie: czy obsługa umie odnaleźć klucz po
    nazwie maszyny. Odpowiedź „nie" znaczy, że wdrożenie tego punktu zamieni
    awarię jednogodzinną w całonocną.

    Odnotowuję, że klucz w postaci pliku na nośniku jest tu wykluczony
    świadomie, a nie przez zapomnienie. Powód jest prosty i warto go
    powtórzyć w opisie: plik trzeba włożyć do maszyny, która jeszcze nie
    pracuje, a maszyna serwerowa nie ma przy sobie nikogo, kto by to zrobił.
  en: |
    The item shuts the whole set about drive encryption and is in it the last of the three rules about
    recovering. They are worth showing together, differing not in construction but in the price of a
    mistake.

    At a removable medium a mistake costs the medium's contents. At a data drive - the volume's
    contents. At the system drive it costs the machine, and a machine to which there is no road but the
    console. That is the difference that warrants the high category despite the rollout's high cost.

    Hiding the prompting page is the one thing in this rule that looks like a trifle and is not. It
    decides whether somebody standing at a console at night has any chance of doing anything. The
    application should at this item ask one question: can the attendance find a key by the machine's
    name. An answer of "no" means this item's rollout will turn a one-hour fault into an all-night one.

    Worth noting that a key in the form of a file on a medium is here shut out knowingly and not through
    forgetfulness. The reason is a simple one and worth repeating in the description: the file has to be
    put into a machine that is not yet working, and a server machine has nobody by it to do that.
