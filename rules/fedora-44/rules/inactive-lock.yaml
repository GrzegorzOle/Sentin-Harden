id: fedora44-inactive-lock

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.4.1.5
  section: Access Control > User Accounts and Environment > Configure shadow password suite parameters
  title:
    pl: Blokada kont z nieużywanym wygasłym hasłem jest skonfigurowana
    en: Ensure inactive password lock is configured
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Konto, którego hasło wygasło i nikt go nie zmienił, zwykle jest
    porzucone, a nadal da się na nie zalogować po zmianie hasła. Parametr
    INACTIVE mówi, ile dni po wygaśnięciu hasła konto zostaje zablokowane.

    Punkt wymaga, żeby INACTIVE w /etc/default/useradd i to pole
    w /etc/shadow kont z hasłem wynosiły od 0 do 45 dni.
  en: |
    An account whose password expired and nobody changed it is usually
    abandoned, and it can still be logged in to after a password change.
    The INACTIVE parameter sets how many days after the password expires
    the account is locked.

    The item requires INACTIVE in /etc/default/useradd and this field in
    /etc/shadow of accounts with a password to be between 0 and 45 days.

disruption_description:
  pl: |
    Fedora domyślnie ustawia -1, czyli bez blokady. Naprawa ustawia 45 dni
    dla nowych kont i kont z hasłem. Konto, które nie zmieni wygasłego
    hasła przez 45 dni, zostaje zablokowane i odblokować je może tylko
    administrator. Działa to tylko razem z wygasaniem haseł (punkt
    5.4.1.1).
  en: |
    Fedora uses -1 by default, which means no lock. The remediation sets 45
    days for new accounts and accounts with a password. An account that
    does not change its expired password within 45 days is locked, and only
    an administrator can unlock it. This only works together with password
    expiry (item 5.4.1.1).

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownicy, którzy nie logują się dłużej niż półtora miesiąca po wygaśnięciu hasła, np. po urlopie; konto odblokowuje administrator
      - Jedyne konto administratora z dawno wygasłym hasłem; naprawa odmawia, gdy blokada objęłaby konto od razu
    en:
      - Users who do not log in for more than six weeks after the password expires, for example after a leave; an administrator unlocks the account
      - The only administrator account with a long expired password; the remediation refuses when the lock would apply to an account at once
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Komputer używany rzadko przez jedną osobę, bez innego administratora, który odblokuje konto
    en:
      - A computer used rarely by one person, without another administrator who could unlock the account
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !((v ~ /^(0|[1-9][0-9]*)$/) && v + 0 <= 45) }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld=7 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 <= 45)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(ua_get INACTIVE); then
        v=${r#* }; s="INACTIVE=$v"
        [ "${r%% *}" = /etc/default/useradd ] || s="$s(${r%% *})"
      else
        v=""; s="INACTIVE=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "7" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld=7 '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "45" ] && [ "$v" != "45" ]; then chage -I "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=shadowdefs-1
        if [ -e /etc/default/useradd ]; then echo existed=1; else echo existed=0; fi
        if [ -n "7" ]; then awk -F: -v fld=7 '$2 ~ /^\$.+\$/ { print "user", $1, $fld }' /etc/shadow; fi
      } > "$b"
      chmod 600 "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/default/useradd
      mark='# Sentin-Harden: fedora44-inactive-lock'
      line='INACTIVE=45'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowdefs-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !((v ~ /^(0|[1-9][0-9]*)$/) && v + 0 <= 45) }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld=7 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 <= 45)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(ua_get INACTIVE); then
        v=${r#* }; s="INACTIVE=$v"
        [ "${r%% *}" = /etc/default/useradd ] || s="$s(${r%% *})"
      else
        v=""; s="INACTIVE=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "7" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld=7 '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "45" ] && [ "$v" != "45" ]; then chage -I "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "Already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        *shadow-unreadable*) echo "Cannot read /etc/shadow; run as root" >&2; exit 1 ;;
      esac
      fix=0
      if g=$(ua_get INACTIVE); then
        if ! ok "${g#* }"; then
          [ "${g%% *}" = "$f" ] || { echo "INACTIVE is set in ${g%% *}, which overrides $f; change it there by hand" >&2; exit 1; }
          fix=1
        fi
      else
        fix=1
      fi
      users=""
      if [ -n "7" ]; then
        users=$(awk -F: -v fld=7 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 <= 45)) print $1 }' /etc/shadow)
        lock=$(awk -F: -v fld=7 -v nv=45 -v today=$today '
          function lk(l, m, i) { return l ~ /^[0-9]+$/ && l + 0 > 0 && m ~ /^[0-9]+$/ && i ~ /^[0-9]+$/ && today - l > m + 0 && today - l - m > i + 0 }
          $2 ~ /^\$.+\$/ { v = $fld; if (v ~ /^[0-9]+$/ && v + 0 <= 45) next; was = lk($3, $5, $7); $fld = nv
            if (!was && lk($3, $5, $7)) { printf "%s%s", s, $1; s = "," } }' /etc/shadow)
        if [ -n "$lock" ]; then
          echo "These accounts would be locked right away because their password is too old: $lock; set them a new password first, nothing changed" >&2; exit 1
        fi
      fi
      d=$(dirname "$f")
      old=$(mktemp "$d/.sentin-harden-old.XXXXXX")
      t=$(mktemp "$d/.sentin-harden.XXXXXX")
      trap 'rm -f "$old" "$t"' EXIT
      if [ -e "$f" ]; then had=1; cat "$f" > "$old"; else had=0; fi
      undo() {
        if [ "$fix" = 1 ]; then if [ "$had" = 1 ]; then cat "$old" > "$f"; else rm -f "$f"; fi; fi
        if [ -n "7" ]; then restore_users >/dev/null; fi
      }
      if [ "$fix" = 1 ]; then
        { if [ "$had" = 1 ]; then awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f"; fi
          echo "$mark"; echo "$line"; } > "$t"
        if [ "$had" = 1 ]; then chmod --reference="$f" "$t"; chown --reference="$f" "$t"; else chmod 644 "$t"; chown root:root "$t"; fi
        mv -f "$t" "$f"
        if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
        echo "Set $line in $f"
      fi
      for u in $users; do
        chage -I 45 "$u" || { undo; echo "chage failed for $u; restored the previous state" >&2; exit 1; }
        echo "Set the password inactivity period 45 for $u"
      done
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) undo; echo "The item is not met after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/default/useradd
      mark='# Sentin-Harden: fedora44-inactive-lock'
      line='INACTIVE=45'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowdefs-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      e=$(sed -n '2s/^existed=//p' "$b")
      case "$e" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
    export LC_ALL=C
    today=$(( $(date +%s) / 86400 ))
    # defs_get KEY: "file value" of the entry that the readers of login.defs use
    defs_get() {
      local f v r=""
      for f in /etc/login.defs /etc/login.defs.d/*.defs; do
        [ -f "$f" ] || continue
        v=$(awk -v k="$1" '
          { sub(/#.*/, "") }
          $1 == k { x = $0; sub(/^[ \t]*[^ \t]+[ \t]*/, "", x); sub(/[ \t]+$/, "", x)
                    if (x == "") { b = 1; if (n) e = 1; next }
                    n++; if (n == 1) v = x }
          END { if (!n && !b) exit 1; if (e || !n) v = ""; if (v ~ /^".*"$/) v = substr(v, 2, length(v) - 2); print v }' "$f") && r="$f $v"
      done
      [ -n "$r" ] && printf '%s\n' "$r"
    }
    # ua_get KEY: "file value" of the last KEY=value line in /etc/default/useradd
    ua_get() {
      [ -f /etc/default/useradd ] || return 1
      awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2); n = 1 }
        END { if (!n) exit 1; print "/etc/default/useradd " v }' /etc/default/useradd
    }
    ok() { awk -v v="$1" 'BEGIN { exit !((v ~ /^(0|[1-9][0-9]*)$/) && v + 0 <= 45) }'; }
    # shadow_bad: name=value of accounts with a password hash whose field does not meet the item
    shadow_bad() {
      awk -F: -v fld=7 '$2 ~ /^\$.+\$/ { v = $fld; if (!(v ~ /^[0-9]+$/ && v + 0 <= 45)) { printf "%s%s=%s", s, $1, v; s = "," } }' /etc/shadow
    }
    evaluate() {
      local r v s bad="" u=""
      if r=$(ua_get INACTIVE); then
        v=${r#* }; s="INACTIVE=$v"
        [ "${r%% *}" = /etc/default/useradd ] || s="$s(${r%% *})"
      else
        v=""; s="INACTIVE=not-set"
      fi
      ok "$v" || bad=1
      if [ -n "7" ]; then
        if [ ! -r /etc/shadow ]; then echo "NOT_OK:$s,shadow-unreadable"; return; fi
        u=$(shadow_bad)
      fi
      if [ -z "$bad" ] && [ -z "$u" ]; then echo "OK:$s"; else echo "NOT_OK:$s${u:+,users=$u}"; fi
    }
    # restore_users: accounts that still have the value of this rule get the saved value back
    restore_users() {
      local tag n v cur
      while read -r tag n v; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" -v fld=7 '$1 == n { print $fld; exit }' /etc/shadow)
        if [ "$cur" = "45" ] && [ "$v" != "45" ]; then chage -I "${v:--1}" "$n"; echo "Restored the previous value for $n"; fi
      done < "$b"
    }
      if [ -n "7" ]; then restore_users; fi
      if [ ! -f "$f" ] || ! grep -qxF "$mark" "$f"; then echo "The line of this rule is not in $f, nothing to restore there"; exit 0; fi
      t=$(mktemp "$(dirname "$f")/.sentin-harden.XXXXXX")
      trap 'rm -f "$t"' EXIT
      # Only the marked line of this rule goes; the rest of the file stays as it is now.
      awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f" > "$t"
      if grep -A 1 -xF "$mark" "$f" | grep -qxF "$line"; then kept=0; else kept=1; fi
      if [ "$e" = 0 ] && ! grep -q '[^[:space:]]' "$t"; then
        rm -f "$f"; echo "Removed $f, which this rule created"; exit 0
      fi
      chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if [ "$kept" = 1 ]; then
        echo "Removed the comment of this rule from $f; the line under it was changed by hand and stays"
      else
        echo "Removed the INACTIVE line of this rule from $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man8/useradd.8.html
  - https://man7.org/linux/man-pages/man5/shadow.5.html
  - https://man7.org/linux/man-pages/man1/chage.1.html

notes:
  pl: |
    useradd czyta INACTIVE z /etc/default/useradd, gdzie liczy się tylko
    zapis INACTIVE=wartość na początku wiersza, bez spacji i komentarza na
    końcu, a wygrywa ostatni wpis. Sprawdziłem to w kontenerze Fedora 44.
    Naprawa dopisuje wiersz tej reguły na końcu pliku pod komentarzem
    Sentin-Harden, a wycofanie usuwa tylko te dwa wiersze. Polecenie
    useradd -D -f zmienia wiersz INACTIVE w miejscu.

    Ustawienie w /etc/default/useradd dotyczy tylko kont tworzonych później,
    więc sprawdzenie obejmuje też odpowiednie pole w /etc/shadow kont, które
    mają skrót hasła (konta zablokowane i bez hasła pomija, tak jak CIS).
    Naprawa ustawia to pole poleceniem chage kontom, które nie spełniają
    punktu, a stare wartości zapisuje w kopii zapasowej. Wycofanie przywraca
    je kontom, które nadal mają wartość ustawioną przez regułę. Sprawdzenie
    wymaga odczytu /etc/shadow, więc bez uprawnień roota daje wynik NOT_OK
    z dopiskiem shadow-unreadable.

    Naprawa odmawia, gdy nowe wartości zablokowałyby któreś konto od razu,
    czyli gdy jego hasło wygasłoby dawniej niż liczba dni z pola nieaktywności
    (INACTIVE). Wtedy trzeba najpierw nadać temu kontu nowe hasło.
    Sprawdziłem w kontenerze, że konto z wygasłym hasłem musi je zmienić
    przy logowaniu, a po okresie nieaktywności jest odrzucane.

    Zablokowane w ten sposób konto odblokowuje root, nadając nowe hasło albo
    zmieniając pole poleceniem chage.
  en: |
    useradd reads INACTIVE from /etc/default/useradd, where only
    INACTIVE=value at the start of a line counts, without spaces or a
    comment at the end, and the last entry wins. This was checked in a
    Fedora 44 container. The remediation appends the line of this rule at
    the end of the file under a Sentin-Harden comment, and rollback removes
    only these two lines. The command useradd -D -f changes the INACTIVE
    line in place.

    The setting in /etc/default/useradd only applies to accounts created later,
    so the check also covers the matching field in /etc/shadow of accounts
    that have a password hash (it skips locked accounts and accounts without
    a password, as CIS does). The remediation sets this field with chage for
    accounts that do not meet the item and saves the old values in the
    backup. Rollback gives them back to accounts that still have the value
    set by the rule. The check needs to read /etc/shadow, so without root
    privileges it gives the NOT_OK result with a shadow-unreadable note.

    The remediation refuses when the new values would lock an account at
    once, that is when its password would have expired longer ago than the
    number of days in the inactivity field (INACTIVE). Then give that
    account a new password first. A container showed that an account with
    an expired password has to change it at login, and after the inactivity
    period it is rejected.

    root unlocks an account locked this way by setting a new password or
    changing the field with chage.
