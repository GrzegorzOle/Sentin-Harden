id: win11-password-reversible-encryption-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Przechowywanie haseł z szyfrowaniem odwracalnym wyłączone
    en: Storing passwords using reversible encryption disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Normalnie system nie przechowuje haseł, tylko ich skróty — odtworzenie hasła
    wymaga zgadywania. To ustawienie, włączone, każe zapisywać hasła w postaci,
    którą da się rozszyfrować kluczem obecnym na maszynie. Efekt jest praktycznie
    taki, jakby leżały tekstem.

    Napastnik z dostępem do bazy kont nie musi wtedy niczego łamać: odczytuje
    hasła użytkowników takimi, jakie są, wraz z wszystkim, do czego ci ludzie
    używają ich gdzie indziej. Nie ma stopniowania tego ryzyka — albo hasła są
    nieodwracalne, albo nie ma ich wcale.
  en: |
    Normally the system stores not passwords but their hashes - recovering a
    password requires guessing. This setting, when on, makes it store passwords
    in a form decryptable with a key present on the machine. The effect is
    practically the same as keeping them in plain text.

    An attacker with access to the account database then has nothing to crack:
    they read the users' passwords as they are, together with everything those
    people use them for elsewhere. There is no gradation of this risk - either
    the passwords are irreversible or they are not protected at all.

disruption_description:
  pl: |
    Na zdecydowanej większości maszyn ustawienie jest już wyłączone i wdrożenie
    niczego nie zmieni. Włącza się je wyłącznie świadomie, pod konkretne,
    rzadkie mechanizmy uwierzytelniania wymagające znajomości hasła po stronie
    serwera.

    Jeśli na maszynie było włączone, wyłączenie nie kasuje kopii już zapisanych —
    znikają dopiero przy następnej zmianie hasła każdego konta. Do tego czasu
    stan pozostaje taki sam, mimo że raport pokaże zgodność.
  en: |
    On the vast majority of machines the setting is already off and the rollout
    changes nothing. It is enabled only deliberately, for specific, rare
    authentication mechanisms that need to know the password on the server side.

    If it was enabled on this machine, switching it off does not delete the
    copies already stored - they disappear only at the next password change of
    each account. Until then the state is unchanged, even though the report
    shows compliance.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
  what_breaks:
    pl:
      - Uwierzytelnianie wymagające znajomości hasła po stronie serwera przestanie działać dla kont lokalnych
      - Starsze mechanizmy dostępu zdalnego oparte na tej postaci hasła zaczną odrzucać logowanie
    en:
      - Authentication requiring knowledge of the password on the server side stops working for local accounts
      - Older remote access mechanisms relying on that password form start refusing sign-ins
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa usługa wymagająca hasła w postaci odwracalnej i nie ma dla niej zamiennika
    en:
      - The machine runs a service requiring the password in reversible form and has no replacement for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ClearTextPassword\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^ClearTextPassword\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'ClearTextPassword'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ClearTextPassword = 0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ClearTextPassword = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption

notes:
  pl: |
    Punkt dostaje kategorię krytyczną mimo tego, że prawie zawsze jest już
    spełniony. Kategoria opisuje, co atakujący zyskuje przy braku wdrożenia,
    a nie jak często brak się zdarza — a zyskuje tu komplet haseł w postaci
    gotowej do użycia.

    Wyłączenie ustawienia nie unieważnia haseł zapisanych wcześniej w tej
    postaci. Jeśli maszyna miała je włączone, dopiero wymuszenie zmiany haseł
    faktycznie zamyka sprawę.
  en: |
    The item is rated critical even though it is almost always already met. The
    category describes what an attacker gains while it is unmet, not how often
    it is unmet - and what they gain here is the full set of passwords in
    ready-to-use form.

    Switching the setting off does not invalidate passwords already stored that
    way. If the machine had it on, only forcing a password change actually
    closes the matter.
