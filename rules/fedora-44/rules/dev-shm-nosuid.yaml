id: fedora44-dev-shm-nosuid

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.1.2.2.3
  section: Initial Setup > Filesystem > Configure Filesystem Partitions > Configure /dev/shm
  title:
    pl: Opcja nosuid ustawiona dla /dev/shm
    en: Ensure nosuid option set on /dev/shm partition
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Bit setuid lub setgid każe uruchomić program z uprawnieniami jego
    właściciela, zwykle roota, a nie osoby, która go uruchamia; podobnie działają
    uprawnienia plików (file capabilities). Opcja nosuid sprawia, że jądro
    ignoruje jedno i drugie dla plików w /dev/shm: program działa, ale z uprawnieniami
    uruchamiającego. Kopia powłoki z ustawionym bitem, zostawiona tam przez
    kogoś, kto na chwilę miał uprawnienia roota, nie staje się trwałym wejściem.

    Pamięć współdzielona nie jest miejscem na programy, a skoro każdy może do
    niej pisać, program z bitem setuid w niej to niemal zawsze ślad włamania.
    Kategoria jest niska, bo systemd montuje /dev/shm z tą opcją domyślnie.
  en: |
    The setuid or setgid bit makes a program run with the privileges of its
    owner, usually root, rather than those of the person starting it; file
    capabilities work in a similar way. The nosuid option makes the kernel
    ignore both for files in /dev/shm: the program runs, but with the privileges of
    whoever started it. A copy of a shell with the bit set, left there by
    somebody who briefly had root privileges, does not become a lasting way in.

    Shared memory is not a place for programs, and since everybody can write to
    it, a program with the setuid bit there is almost always a trace of a break-in.
    The category is low because systemd mounts /dev/shm with this option by
    default.

disruption_description:
  pl: |
    Nic nie przestaje działać. Żaden program nie korzysta z bitu setuid w
    pamięci współdzielonej, a na Fedorze opcja jest ustawiona domyślnie.

    Zmiana nie wymaga restartu ani wylogowania.
  en: |
    Nothing stops working. No program relies on the setuid bit in shared memory,
    and on Fedora the option is set by default.

    The change needs no restart and no sign-out.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    t=/dev/shm
    o=nosuid
    if [ ! -r /proc/self/mountinfo ] || ! command -v findmnt >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    live=$(findmnt -kn --mountpoint "$t" -o OPTIONS 2>/dev/null | tail -n 1)
    if [ -z "$live" ]; then echo NOT_APPLICABLE; exit 0; fi
    case ",$live," in *",$o,"*) ;; *) echo MISSING; exit 0 ;; esac
    if [ -e /etc/fstab ] && [ ! -r /etc/fstab ]; then echo CHECK_ERROR; exit 0; fi
    conf=$(findmnt -sn --mountpoint "$t" -o OPTIONS 2>/dev/null | tail -n 1)
    if [ -z "$conf" ] && [ -d /run/systemd/system ] && command -v systemd-escape >/dev/null 2>&1; then
      unit=$(systemd-escape -p --suffix=mount "$t")
      conf=$(systemctl cat "$unit" 2>/dev/null | sed -n 's/^Options=//p' | tail -n 1)
    fi
    if [ -n "$conf" ]; then
      case ",$conf," in *",$o,"*) ;; *) echo NOT_PERSISTENT; exit 0 ;; esac
    fi
    echo SET
  expected: '^SET$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      t=/dev/shm
      o=nosuid
      f=/etc/fstab
      mkdir -p "$(dirname '{{backup_file}}')"
      n=$(awk -v t="$t" '$1 !~ /^#/ && $2 == t' "$f" | wc -l)
      opts=$(awk -v t="$t" '$1 !~ /^#/ && $2 == t { print $4 }' "$f" | head -n 1)
      live=$(findmnt -kn --mountpoint "$t" -o OPTIONS | tail -n 1)
      {
        echo "entry=$n"
        case ",$opts," in *",$o,"*) echo option=1 ;; *) echo option=0 ;; esac
        case ",$live," in *",$o,"*) echo live=1 ;; *) echo live=0 ;; esac
        echo ---
        cat "$f"
      } > '{{backup_file}}'
      echo "Saved previous state to {{backup_file}}"
    )

  change_command: |
    (
      set -e
      t=/dev/shm
      o=nosuid
      f=/etc/fstab
      n=$(awk -v t="$t" '$1 !~ /^#/ && $2 == t' "$f" | wc -l)
      new=$(mktemp "$f.sentin.XXXXXX")
      trap 'rm -f "$new"' EXIT
      if [ "$n" -gt 1 ]; then
        echo "$f has more than one entry for $t; add $o there by hand" >&2; exit 1
      elif [ "$n" -eq 1 ]; then
        awk -v t="$t" -v o="$o" '
          $1 !~ /^#/ && $2 == t {
            lead = substr($0, 1, match($0, /[^ \t]/) - 1)
            k = split(substr($0, length(lead) + 1), p, /[ \t]+/, sep)
            if (k < 4) { for (i = k + 1; i <= 4; i++) { sep[i - 1] = " "; p[i] = "defaults" } k = 4 }
            if (index("," p[4] ",", "," o ",") == 0) p[4] = p[4] "," o
            line = lead
            for (i = 1; i <= k; i++) line = line p[i] sep[i]
            print line; next
          }
          { print }' "$f" > "$new"
      else
        opts=defaults,nosuid,nodev
        case ",$opts," in *",$o,"*) ;; *) opts="$opts,$o" ;; esac
        line="tmpfs /dev/shm tmpfs $opts 0 0"
        { cat "$f"; echo "# Sentin-Harden: $t"; printf '%s\n' "$line"; } > "$new"
      fi
      got=$(findmnt -sn --tab-file "$new" --mountpoint "$t" -o OPTIONS)
      case ",$got," in *",$o,"*) ;; *) echo "The new $f does not parse as expected; nothing was changed" >&2; exit 1 ;; esac
      chmod --reference="$f" "$new"
      chown --reference="$f" "$new"
      mv -f "$new" "$f"
      trap - EXIT
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if [ -d /run/systemd/system ]; then systemctl daemon-reload; fi
      vfs=$(findmnt -kn --mountpoint "$t" -o VFS-OPTIONS | tail -n 1)
      mount --options-mode ignore -o "remount,$vfs,$o" "$t"
      echo "Added $o to $t in $f and remounted $t"
    )

  rollback_command: |
    (
      set -e
      t=/dev/shm
      o=nosuid
      f=/etc/fstab
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      entry=$(sed -n 's/^entry=//p' "$b" | head -n 1)
      option=$(sed -n 's/^option=//p' "$b" | head -n 1)
      live=$(sed -n 's/^live=//p' "$b" | head -n 1)
      case "$entry:$option:$live" in
        [01]:[01]:[01]) ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      new=$(mktemp "$f.sentin.XXXXXX")
      trap 'rm -f "$new"' EXIT
      if [ "$entry" = 0 ]; then
        grep -qx "# Sentin-Harden: $t" "$f" || { echo "The entry for $t added earlier is no longer in $f" >&2; exit 1; }
        awk -v m="# Sentin-Harden: $t" -v t="$t" '
          skip && $2 == t { skip = 0; next }
          { skip = 0 }
          $0 == m { skip = 1; next }
          { print }' "$f" > "$new"
      elif [ "$option" = 0 ]; then
        awk -v t="$t" -v o="$o" '
          $1 !~ /^#/ && $2 == t {
            lead = substr($0, 1, match($0, /[^ \t]/) - 1)
            k = split(substr($0, length(lead) + 1), p, /[ \t]+/, sep)
            n = split(p[4], a, ","); s = ""
            for (i = 1; i <= n; i++) if (a[i] != o) s = s (s == "" ? "" : ",") a[i]
            p[4] = (s == "" ? "defaults" : s)
            line = lead
            for (i = 1; i <= k; i++) line = line p[i] sep[i]
            print line; next
          }
          { print }' "$f" > "$new"
      else
        rm -f "$new"; trap - EXIT
        echo "$o was already in $f before the change; nothing to restore"; exit 0
      fi
      chmod --reference="$f" "$new"
      chown --reference="$f" "$new"
      mv -f "$new" "$f"
      trap - EXIT
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if [ -d /run/systemd/system ]; then systemctl daemon-reload; fi
      if [ "$live" = 0 ]; then
        vfs=$(findmnt -kn --mountpoint "$t" -o VFS-OPTIONS | tail -n 1)
        mount --options-mode ignore -o "remount,$vfs,suid" "$t"
      fi
      echo "Removed $o from $t in $f"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/fstab.5.html
  - https://man7.org/linux/man-pages/man8/mount.8.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd-remount-fs.service.html
  - https://docs.kernel.org/filesystems/tmpfs.html

notes:
  pl: |
    Sprawdzenie patrzy w dwa miejsca. Najpierw na bieżące montowanie, bo tylko
    ono działa teraz, a potem na zapis, z którego montowanie powstanie przy
    następnym starcie: wpis w /etc/fstab, a jeśli go nie ma, jednostkę systemd
    montującą ten katalog. Opcja obecna tylko w bieżącym montowaniu daje wynik
    niespełniony, bo zniknie po restarcie.

    Gdy /dev/shm nie jest osobnym punktem montowania, wynik to nie dotyczy: opcji nie
    ma gdzie ustawić, a brak osobnej partycji zgłasza punkt o partycji.

    Naprawa dopisuje opcję do wpisu w /etc/fstab i od razu montuje katalog
    ponownie z nową opcją. Zmieniony plik jest najpierw zapisywany obok
    i czytany przez findmnt; jeśli nie daje oczekiwanego wyniku, oryginał
    zostaje nietknięty. Wycofanie usuwa tylko tę jedną opcję, a nie przywraca
    całego pliku, więc nie cofa zmian w innych wpisach wprowadzonych w
    międzyczasie.

    Jeśli /etc/fstab nie ma wpisu dla /dev/shm, naprawa dodaje go, poprzedzony
    komentarzem „# Sentin-Harden: /dev/shm”, z opcjami, z jakimi system montuje ten
    katalog domyślnie, i z dodaną opcją. Wycofanie tej reguły usuwa cały dodany
    wpis razem z opcjami dopisanymi do niego później przez inne reguły, dlatego
    reguły tego katalogu należy wycofywać w odwrotnej kolejności niż
    stosowanie.
  en: |
    The check looks in two places. First at the current mount, because only that
    is in effect now, then at the record the mount will come from at the next
    start: the entry in /etc/fstab, or, if there is none, the systemd unit that
    mounts the directory. An option present only in the current mount gives a
    non-compliant result, because it will disappear after a restart.

    When /dev/shm is not a separate mount point, the result is not applicable: there
    is nowhere to set the option, and the missing partition is reported by the
    partition item.

    The remediation adds the option to the entry in /etc/fstab and at once
    remounts the directory with the new option. The changed file is first
    written next to the original and read back with findmnt; if that does not
    give the expected result, the original stays untouched. Rollback removes only
    this one option rather than restoring the whole file, so it does not undo
    changes to other entries made in the meantime.

    If /etc/fstab has no entry for /dev/shm, the remediation adds one, preceded by the
    comment "# Sentin-Harden: /dev/shm", with the options the system mounts the
    directory with by default, plus the new option. Rolling back this rule
    removes the whole added entry together with options added to it later by
    other rules, so the rules for this directory should be rolled back in the
    reverse order of applying them.
