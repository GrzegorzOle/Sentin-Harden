id: win2016-uac-uiaccess-secure-desktop

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Programy dostępności nie wyłączają chronionego pulpitu
    en: Accessibility programs do not switch the protected desktop off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera programom dostępności możliwość przeniesienia pytania
    o uprawnienia z chronionego pulpitu na zwykły.

    Bez tego ograniczenia powstaje furtka omijająca zabezpieczenie opisane
    osobną regułą. Chroniony pulpit ma sens dlatego, że programy działające
    w sesji użytkownika nie mogą go dotknąć. Program z uprawnieniem do
    cudzych okien mógłby jednak poprosić o wyświetlenie pytania na pulpicie
    zwykłym — i wtedy pytanie znowu leży tam, gdzie ktoś może na nie
    odpowiedzieć za człowieka.

    Furtka istnieje z powodu rzeczywistego: czytnik ekranu nie widzi
    chronionego pulpitu, więc osoba niewidoma nie usłyszy treści pytania
    o zgodę. To jest realny problem dostępności i to on stoi za istnieniem
    tego przełącznika. Rozwiązaniem nie jest jednak przeniesienie pytania,
    tylko narzędzie, które potrafi czytać chroniony pulpit.

    Na serwerze 2016 wybór jest łatwy, bo problem dostępności w tej postaci
    tu nie występuje. Zamknięcie furtki nie kosztuje nic.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    sprowadzenie pytania o uprawnienia z pulpitu, na który nie ma dostępu,
    na pulpit, na którym działa.
  en: |
    The item takes from accessibility programs the ability to move the question
    about rights off the protected desktop onto the ordinary one.

    Without this restriction a back door opens round the safeguard described by a
    separate rule. The protected desktop has a point because programs running in
    the user's session cannot touch it. A program holding the privilege of
    reaching other windows could, however, ask for the question to be shown on
    the ordinary desktop - and then the question lies again where somebody can
    answer it on a person's behalf.

    The back door exists for a real reason: a screen reader cannot see the
    protected desktop, so a blind person will not hear what the consent question
    says. That is a genuine accessibility problem and it is what lies behind this
    switch. The answer, though, is not to move the question but a tool that can
    read the protected desktop.

    On Server 2016 the choice is easy, because the accessibility problem in this
    form does not arise here. Closing the back door costs nothing.

    What an attacker gains while the item goes unmet: a way to bring the question
    about rights from a desktop they cannot reach onto one where they operate.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Aby ten przełącznik miał jakikolwiek skutek,
    na maszynie musi działać program z uprawnieniem do cudzych okien, który
    z niego świadomie korzysta. Na serwerze taki program to rzadkość.

    Jedyny przypadek wymagający uwagi to maszyna obsługiwana przez osobę
    korzystającą z czytnika ekranu. Tam zmiana oznacza, że treść pytania
    o zgodę nie zostanie odczytana — i wtedy nie jest to punkt do zastosowania
    hurtem, tylko rozmowa o narzędziu potrafiącym czytać chroniony pulpit.

    Warto odnotować, że wartością docelową jest zero. To jeden z tych wpisów,
    przy których zero oznacza zakaz, a nie brak ustawienia.

    Czego to nie psuje: pracy programów dostępności poza tą jedną
    możliwością, pytania o zgodę ani niczego w sesji zdalnej.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". For this switch to have any effect at all, a
    program holding the privilege of reaching other windows must be running on
    the machine and deliberately using it. On a server such a program is rare.

    The one case needing attention is a machine operated by somebody using a
    screen reader. There the change means the consent question will not be read
    out - and then this is not an item to apply in bulk but a conversation about
    a tool that can read the protected desktop.

    It is worth noting that the target value is zero. This is one of those
    entries where zero means a prohibition rather than an absent setting.

    What this does not break: accessibility programs' work beyond this one
    ability, the consent question itself, or anything in a remote session.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - legacy-applications
  what_breaks:
    pl:
      - Czytnik ekranu nie odczyta treści pytania o zgodę, bo pozostaje ono na chronionym pulpicie
      - Program z uprawnieniem do cudzych okien nie przeniesie już pytania na pulpit zwykły
      - Na maszynie bez programów dostępności zmiana nie ma żadnego widocznego skutku
      - Praca programów dostępności poza tą jedną możliwością pozostaje bez zmian
    en:
      - A screen reader will not read out the consent question, because it stays on the protected desktop
      - A program holding the privilege of reaching other windows can no longer move the question to the ordinary desktop
      - On a machine with no accessibility programs the change has no visible effect at all
      - Accessibility programs' work beyond this one ability stays unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyną zarządza osoba korzystająca z czytnika ekranu, a narzędzie nie potrafi czytać chronionego pulpitu
    en:
      - The machine is administered by somebody using a screen reader and the tool cannot read the protected desktop
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero is the compliant value here - it denies accessibility programs the
      # ability to move the elevation prompt off the protected desktop.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableUIADesktopToggle'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableUIADesktopToggle'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero closes the back door round the protected desktop. Where a screen
    # reader is in use, the answer is a tool that can read that desktop rather
    # than moving the question off it.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableUIADesktopToggle' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-allow-uiaccess-applications-to-prompt-for-elevation-without-using-the-secure-desktop

notes:
  pl: |
    Reguła ta broni reguły o chronionym pulpicie i osobno nie znaczy wiele.
    Warto czytać obie razem: pierwsza wynosi pytanie poza zasięg programów
    w sesji, ta pilnuje, żeby nie dało się go sprowadzić z powrotem.

    Wartość docelowa wynosi zero, więc brak wpisu nie jest tu stanem
    zgodnym. Domyślnie przełącznik pozostaje pusty, a zachowanie systemu
    zależy wtedy od tego, czy jakikolwiek program o przeniesienie poprosi.

    Wartość leży w kluczu wspólnym dla całej grupy kontroli uprawnień.
    Przy cofaniu usuwana jest wyłącznie ta jedna wartość.
  en: |
    This rule defends the rule about the protected desktop and on its own means
    little. The two are worth reading together: the first lifts the question
    beyond the reach of programs in the session, this one sees to it that it
    cannot be brought back down.

    The target value is zero, so an absent entry is not a compliant state here.
    By default the switch stays empty, and the system's behaviour then depends on
    whether any program asks for the move.

    The value lies in a key shared by the whole rights-control group. Undoing
    removes this one value alone.
