id: win2016-audit-special-logon

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja logowania specjalnego
    en: Audit special logon
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje zalogowanie sesji, która otrzymała uprawnienia
    uznawane za wrażliwe — administracyjne albo równoważne.

    Jest to najkrótsza droga do odpowiedzi na pytanie „kto tu był
    administratorem i kiedy". Zwykłe zdarzenie logowania mówi, że ktoś się
    zalogował; to mówi, że zalogowała się sesja z uprawnieniami, które pozwalają
    zrobić z maszyną wszystko. Różnica jest w praktyce ogromna, bo pierwszych
    zdarzeń są tysiące, a tych — kilka dziennie.

    Stąd bierze się nieoczywista zaleta tej podkategorii: jest tania i czytelna
    naraz. Nie trzeba filtrować ani korelować, żeby zobaczyć wzorzec. Lista
    zdarzeń logowania specjalnego z jednej doby mieści się na ekranie i każdy
    wpis, którego nie da się przypisać do znanej osoby albo znanego zadania,
    jest wart pytania.

    Zdarzenie powstaje także wtedy, gdy uprawnienia administracyjne otrzymuje
    sesja usługi albo zadania w harmonogramie. To jest ta część, o której łatwo
    zapomnieć i która w dochodzeniu bywa najciekawsza.

    Rejestruje się powodzenia, bo tylko sesja faktycznie utworzona może
    otrzymać uprawnienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: korzystanie
    z uprawnień administracyjnych na tej maszynie bez osobnego, krótkiego
    i łatwego do przejrzenia śladu.
  en: |
    The subcategory records the signing in of a session that received rights held to
    be sensitive - administrative or equivalent.

    It is the shortest road to answering the question "who was administrator here
    and when". An ordinary sign-in event says somebody signed in; this one says a
    session signed in with rights allowing anything at all to be done with the
    machine. The difference is vast in practice, because there are thousands of the
    first kind of event and a handful a day of this one.

    Hence this subcategory's unobvious merit: it is cheap and legible at once. No
    filtering or correlating is needed to see the pattern. A day's list of special
    logon events fits on a screen, and every entry that cannot be matched to a known
    person or a known task is worth a question.

    The event arises also where administrative rights go to a service's session or a
    scheduled task's. That is the part easily forgotten, and the part that in an
    inquiry is often the most interesting.

    Successes are recorded, since only a session actually created can receive
    rights.

    What an attacker gains while the item goes unmet: the use of administrative
    rights on this machine without a separate, short and easily reviewed trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zdarzeń jest mało z samej definicji podkategorii
    i ich liczba nie rośnie z obciążeniem maszyny, tylko z liczbą sesji
    uprzywilejowanych.

    Jest to punkt o najlepszym stosunku zysku do kosztu w całym bloku inspekcji
    i tak warto go przedstawić. Na serwerze, gdzie objętość dziennika jest
    realnym ograniczeniem, ten punkt wdraża się bez wahania i przed tymi,
    które generują tysiące zdarzeń.

    Jedyna uwaga dotyczy maszyn, na których usługi działają na kontach
    uprzywilejowanych. Tam każdy start usługi dopisuje zdarzenie, więc serwer
    z kilkudziesięcioma takimi usługami i częstymi restartami dopisze ich
    więcej, niż sugeruje nazwa podkategorii.

    Czego to nie psuje: niczego. Zdarzenie powstaje obok tworzenia sesji
    i nie wpływa na jej przebieg ani na czas logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". There are few events by the subcategory's very
    definition, and their count grows not with the machine's load but with the
    number of privileged sessions.

    It is the item with the best ratio of gain to cost in the whole audit block, and
    it is worth presenting as such. On a server where the log's volume is a real
    constraint this item goes in without hesitation, and before those generating
    thousands of events.

    The one remark concerns machines whose services run under privileged accounts.
    There every start of a service adds an event, so a server with some dozens of
    such services and frequent restarts will add more of them than the
    subcategory's name suggests.

    What this does not break: nothing. The event arises alongside the creation of
    the session and bears neither on its course nor on the time taken to sign in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — liczba zdarzeń idzie za liczbą sesji uprzywilejowanych, a nie za obciążeniem
      - Na maszynie z wieloma usługami na kontach uprzywilejowanych każdy start usługi dopisuje zdarzenie
      - Czas logowania i przebieg sesji pozostają nietknięte
      - Przyrost strumienia do systemu zbierającego jest niewielki i przewidywalny
    en:
      - No regression in the working - the count of events follows the number of privileged sessions, not the load
      - On a machine with many services under privileged accounts every start of a service adds an event
      - The time taken to sign in and the course of the session stay untouched
      - The growth of the stream to the gathering system is small and predictable
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — punkt wdraża się także tam, gdzie objętość dziennika jest ograniczeniem
    en:
      - No known contraindication - the item goes in even where the log's volume is a constraint
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE921B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE921B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE921B-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE921B-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE921B-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-special-logon

notes:
  pl: |
    Punkt warto czytać razem z inspekcją logowania i sprawdzania poświadczeń.
    Tamte mówią, kto wszedł; ten mówi, kto wszedł z uprawnieniami pozwalającymi
    zmienić wszystko, łącznie z samą konfiguracją inspekcji.

    Ostatnia uwaga nie jest teoretyczna. Sesja uprzywilejowana jest jedyną,
    z której da się wyłączyć rejestrowanie — więc zdarzenie logowania
    specjalnego bywa ostatnim wpisem przed ciszą i właśnie dlatego jest tyle
    warte.

    Definicja uprawnień „wrażliwych" jest cechą systemu, a nie tej reguły.
    Obejmuje ona uprawnienia administracyjne oraz kilka innych, dających
    równoważną władzę nad maszyną.
  en: |
    The item is worth reading together with the auditing of sign-ins and of
    credential validation. Those say who came in; this one says who came in with
    rights allowing everything to be changed, the audit configuration itself
    included.

    That last remark is not theoretical. A privileged session is the only one from
    which recording can be switched off - so a special logon event is at times the
    last entry before silence, and that is exactly why it is worth so much.

    The definition of "sensitive" rights is a property of the system, not of this
    rule. It covers the administrative rights and a few others granting equivalent
    power over the machine.
