id: win2025-smb-server-signing-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podpisywanie pakietów wymagane po stronie serwera udostępniania plików
    en: Packet signing required on the file-sharing server's side
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby serwer udostępniania plików podpisywał każdy
    pakiet i przyjmował wyłącznie połączenia od klientów, którzy robią to
    samo.

    Podpis nie szyfruje treści — potwierdza, że pakiet pochodzi od strony,
    która nawiązała sesję, i że po drodze nikt go nie zmienił. Bez tego
    połączenie do udziału można przejąć w locie: napastnik ustawiony między
    klientem a serwerem przepuszcza uwierzytelnienie, a potem podmienia
    treść żądań, korzystając z sesji, którą uwierzytelnił ktoś inny.

    Jest to punkt, w którym rola serwera zmienia wagę oceny. Na stanowisku
    roboczym podpisywanie po stronie serwera dotyczy udziałów, których
    zwykle nie ma. Na serwerze plików dotyczy głównego powodu, dla którego
    ta maszyna stoi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wejścia w środek sesji plikowej cudzym kosztem. Nie musi znać hasła —
    wykorzystuje uwierzytelnienie przeprowadzone przez uprawnionego
    użytkownika i działa dalej z jego uprawnieniami, także wtedy, gdy są to
    uprawnienia administracyjne.

    Oddzielnie warto zauważyć, czego punkt nie robi: nie chroni treści
    plików przed odczytaniem po drodze. Do tego służy szyfrowanie, będące
    osobnym ustawieniem.
  en: |
    The setting takes that the file-sharing server sign every packet and take connections
    from clients doing the same alone.

    A signature does not encrypt the contents - it confirms that a packet comes from the
    party that set up the session and that nobody changed it on the way. Without that a
    connection to a share can be seized in flight: an attacker placed between client and
    server lets the authentication through and then swaps the contents of the requests,
    making use of a session somebody else authenticated.

    It is an item at which the machine's role changes the weight of the assessment. At a
    working station signing on the server's side concerns shares that are usually not there.
    On a file server it concerns the main reason that machine stands at all.

    What an attacker gains while the item goes unmet: the means of stepping into the middle
    of a file session at another's cost. They need not know the password - they make use of
    an authentication carried out by an entitled user and go on with that user's rights,
    including where those are administrative rights.

    It is worth noting apart what the item does not do: it does not guard the files'
    contents against being read on the way. That is the business of encryption, a separate
    setting.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że wymóg po stronie serwera odcina
    klientów, którzy podpisywać nie potrafią — i robi to natychmiast,
    bez okresu przejściowego.

    Różnica wobec ustawienia klienckiego jest tu zasadnicza i to ona
    przesądza o klasie. Wymóg po stronie klienta psuje połączenia tej jednej
    maszyny. Wymóg po stronie serwera psuje połączenia wszystkich maszyn,
    które do niego sięgają — a na serwerze plików jest ich tyle, ilu jest
    użytkowników.

    Klienci nieumiejący podpisywać to przede wszystkim urządzenia, nie
    komputery: skanery i kopiarki zapisujące skany na udział, kamery,
    sterowniki maszyn, rejestratory. Ich oprogramowanie bywa starsze od
    samego serwera i nie da się go zaktualizować. Drugą grupą są systemy
    wbudowane i starsze warianty systemów spoza rodziny Windows,
    w konfiguracjach, gdzie podpisywanie wyłączono dla wydajności.

    Objawem jest odmowa dostępu przy połączeniu, bez wskazania przyczyny.
    Komunikat po stronie urządzenia mówi zwykle o błędzie sieci.

    Przed wdrożeniem trzeba przejrzeć, co łączy się z udziałami tego
    serwera. Dziennik połączeń sesji plikowych pokazuje to wprost i jest
    tańszy niż zgłoszenia po zmianie.

    Zmiana wymaga restartu usługi udostępniania, co zrywa otwarte sesje.
  en: |
    A knowing rollout is needed because the demand on the server's side cuts off clients
    that cannot sign - and does so at once, with no period of transition.

    The difference from the client setting is fundamental here and it is what settles the
    class. The demand on the client's side breaks that one machine's connections. The demand
    on the server's side breaks the connections of every machine reaching it - and on a file
    server there are as many of those as there are users.

    Clients unable to sign are above all devices rather than computers: scanners and copiers
    recording scans onto a share, cameras, machine controllers, recorders. Their software is
    at times older than the server itself and cannot be updated. The second group is
    embedded systems and older variants of systems outside the Windows family, in
    configurations where signing was switched off for speed.

    The symptom is access being denied at a connection, with no cause shown. The message on
    the device's side usually speaks of a network error.

    Before the rollout one has to look over what connects to this server's shares. The log
    of file session connections shows it outright and is cheaper than cases raised after the
    change.

    The change takes a restart of the sharing service, which breaks open sessions.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - legacy-applications
    - printing
  what_breaks:
    pl:
      - Skanery i kopiarki zapisujące pliki na udział przestają się łączyć
      - Starsze systemy wbudowane i urządzenia sieciowe dostają odmowę dostępu
      - Komunikat po stronie urządzenia mówi o błędzie sieci, nie o podpisywaniu
      - Restart usługi udostępniania zrywa sesje otwarte w chwili zmiany
    en:
      - Scanners and copiers recording files onto a share stop connecting
      - Older embedded systems and network devices get access denied
      - The message on the device's side speaks of a network error rather than of signing
      - The restart of the sharing service breaks sessions open at the moment of the change
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Z udziałów tego serwera korzystają urządzenia nieumiejące podpisywać pakietów
      - Nie przejrzano, co faktycznie łączy się z udziałami tej maszyny
    en:
      - Devices unable to sign packets use this server's shares
      - What actually connects to this machine's shares has not been looked over
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'RequireSecuritySignature'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $current = (Get-ItemProperty -Path $path -Name 'RequireSecuritySignature' -ErrorAction SilentlyContinue).'RequireSecuritySignature'
    [pscustomobject]@{
      path        = $path
      name        = 'RequireSecuritySignature'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSecuritySignature' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-server-digitally-sign-communications-always

notes:
  pl: |
    Punkt ma bliźniaka po stronie klienckiej, w gałęzi usługi stacji
    roboczej. Oba są potrzebne i oceniane osobno: ten chroni sesje
    przychodzące do tej maszyny, tamten — sesje, które ta maszyna nawiązuje
    do innych. Na serwerze plików ten waży więcej, ale tamtego nie
    zastępuje.

    W nowszych wersjach systemu podpisywanie po stronie serwera bywa
    włączone domyślnie. Audyt mimo to nie uznaje braku wartości za
    spełnienie: zgodność ma wynikać z zapisu, bo domyślna wartość jest
    cechą wersji systemu, a nie decyzją administratora.

    Podpisywanie kosztuje wydajność, zauważalną przy dużym ruchu plikowym.
    Na sprzęcie z ostatnich lat koszt ten jest niewielki, ale na serwerze
    obsługującym wiele jednoczesnych sesji warto po wdrożeniu spojrzeć
    na obciążenie.
  en: |
    The item has a twin on the client's side, in the workstation service's branch. Both are
    needed and are assessed apart: this one guards sessions coming into this machine, that
    one the sessions this machine sets up to others. On a file server this one weighs more,
    but it does not stand in for that one.

    In newer versions of the system signing on the server's side is at times switched on by
    default. The audit all the same does not hold an absent value a meeting of the item:
    compliance is to follow from a record, since a default value is a trait of the system's
    version rather than an administrator's decision.

    Signing costs speed, noticeable at heavy file traffic. On hardware of the last few years
    that cost is small, but on a server handling many sessions at once it is worth looking
    at the load after the rollout.
