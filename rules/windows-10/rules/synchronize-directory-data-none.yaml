id: win10-synchronize-directory-data-none

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Synchronizowanie danych usługi katalogowej nieprzyznane nikomu
    en: The keeping in step of a directory service data granted to nobody
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera wszystkim prawo do synchronizowania danych usługi
    katalogowej.

    Prawo to pozwala odczytać całą zawartość katalogu z pominięciem
    uprawnień ustawionych na poszczególnych obiektach. Powstało po to,
    żeby usługi przenoszące dane między katalogami mogły czytać wszystko
    bez nadawania im członkostwa w grupach najwyższych.

    Zawartość katalogu to nie tylko nazwy kont. To także skróty haseł
    wszystkich użytkowników, klucze kont maszyn i materiał, z którego
    wyprowadza się bilety dostępowe. Konto z tym prawem nie musi łamać
    haseł — odczytuje ich postać przechowywaną i używa jej wprost.

    Jest to więc prawo równoważne przejęciu całej organizacji, a nie
    jednej maszyny. Napastnik, który je uzyska, wychodzi poza maszynę,
    na której stoi, i dostaje poświadczenia wszystkich.

    Odnotowuję, że na stanowisku roboczym prawo to nie ma zastosowania,
    bo nie ma tu katalogu do odczytania. Zapisanie wykazu pustym jest
    zabezpieczeniem na wypadek zmiany roli maszyny i utrudnieniem dla
    kogoś, kto próbowałby je nadać po cichu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    całego katalogu wraz z materiałem poświadczeń wszystkich kont.
  en: |
    The setting takes from everybody the right of keeping the data of a directory service in step.

    That right lets the whole content of a directory be read with the rights set upon particular objects passed
    over. It came about that services carrying data between directories might read everything without being given
    membership of the highest groups.

    A directory's content is not names of accounts alone. It is also the stored forms of every user's password,
    the keys of machines' accounts and the matter from which tickets of access are drawn. An account with this
    right need break no password - it reads their stored form and uses it outright.

    It is therefore a right the same as the taking of a whole body and not of one machine. An attacker who wins it
    comes out beyond the machine they stand upon and gets the credentials of all.

    I set down that upon a working station the right does not bear, there being here no directory to read. The
    writing of the list empty is a guarding against an hour when the machine's part should change, and a hindrance
    to anybody who would grant it quietly.

    What an attacker gains while the item goes unmet: the reading of a whole directory together with the
    credential matter of every account.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wykaz jest pusty na stanowisku roboczym i praktycznie na każdej
    maszynie, która nie jest kontrolerem katalogu. Nie ma czego odbierać.

    Odnotowuję, że wpis w tym wykazie na stanowisku roboczym byłby sam
    w sobie sygnałem poważnym, a nie tylko wartym zbadania. Nie istnieje
    scenariusz pracy, w którym zwykła maszyna potrzebuje tego prawa.

    Skutek pojawia się przy następnym zalogowaniu.

    Czego to nie psuje: logowania domenowego, dostępu do zasobów
    sieciowych, usług, pracy z plikami, drukowania.
  en: |
    The class is "no disruption".

    The list stands empty upon a working station and practically upon every machine that is no controller of a
    directory. There is nothing to take away.

    I set down that an entry in this list upon a working station would itself be a grave sign and not merely one
    worth looking into. There is no course of work in which an ordinary machine needs this right.

    The consequence shows at the next signing in.

    What this does not break: the domain signing in, the way to resources upon the network, services, work with
    files, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Konto usługi przenoszącej dane między katalogami straci prawo odczytu całej zawartości katalogu
      - Na stanowisku roboczym wykaz jest pusty, więc zmiana jest tam wyłącznie zapisem stanu
      - Wpis w tym wykazie na zwykłej maszynie jest sygnałem poważnym, a nie tylko wartym zbadania
      - Skutek pojawia się przy następnym zalogowaniu, a sesja trwająca zachowuje uprawnienia
      - Logowanie domenowe, dostęp do zasobów sieciowych, usługi, praca z plikami i drukowanie pozostają bez zmian
    en:
      - The account of a service carrying data between directories will lose the reading of a directory s whole content
      - Upon a working station the list stands empty, so there the change is solely a setting down of a state
      - An entry in this list upon an ordinary machine is a grave sign and not merely one worth looking into
      - The consequence shows at the next signing in, and a session at work keeps its rights
      - The domain signing in, the way to resources upon the network, services, work with files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę kontrolera katalogu i działa na niej usługa przenosząca dane między katalogami
    en:
      - The machine bears the part of a controller of a directory and upon it works a service carrying data between directories
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSyncAgentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right goes to nobody at all, so the line is written empty. An empty line
    # is the setting; leaving the line out would keep whatever stood there before.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSyncAgentPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSyncAgentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/synchronize-directory-service-data

notes:
  pl: |
    Reguła jest oceniona najwyżej w całym bloku przywilejów, mimo że na
    stanowisku roboczym nie ma zastosowania. Warto, żeby aplikacja
    wyjaśniła tę pozorną sprzeczność: kategoria ryzyka mówi, co się
    stanie, jeśli punkt pozostanie niespełniony tam, gdzie ma znaczenie —
    a nie jak często ma znaczenie.

    Argument wart postawienia wprost dotyczy zasięgu. Wszystkie pozostałe
    punkty tego bloku dotyczą jednej maszyny. Ten wychodzi poza nią
    i sięga wszystkich kont w organizacji naraz, bo odczytuje materiał
    poświadczeń wprost z katalogu.

    Odnotowuję, że zapisanie wykazu pustym na maszynie roboczej ma sens
    mimo braku zastosowania. Maszyna bywa przenoszona do innej roli,
    a zasada zapisana przeżyje tę zmianę. Drugim powodem jest wykrywanie:
    punkt sprawdzany regularnie wyłapie wpis, który ktoś nadał po cichu.
  en: |
    The rule is graded the highest of the whole block of privileges, though upon a working station it does not
    bear. It is well that the application set out that seeming contradiction: the category of risk says what will
    come of the item going unmet where it does bear - and not how often it bears.

    The argument worth putting outright touches the reach. Every other item of this block touches one machine.
    This comes out beyond it and reaches every account in the body at once, reading the credential matter straight
    from the directory.

    I set down that the writing of the list empty upon a working machine has sense despite the want of bearing. A
    machine is at times carried over to another part, and a policy written down will outlive that change. The
    second ground is the finding out: an item checked regularly will catch an entry somebody granted quietly.
