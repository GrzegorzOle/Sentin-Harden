id: win2025-trusted-credential-manager-access-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dostęp do menedżera poświadczeń jako zaufany obiekt wywołujący nieprzyznany nikomu
    en: Trusted caller access to Credential Manager granted to no one
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Menedżer poświadczeń przechowuje zapamiętane hasła: do udziałów
    sieciowych, do stron, do połączeń pulpitu zdalnego. Przechowuje je
    w postaci, którą da się odtworzyć, bo inaczej nie mógłby ich podać
    programowi, który o nie prosi.

    Ochrona tego zbioru opiera się na jednym założeniu: poświadczenie
    wydaje się wyłącznie temu, komu ono przysługuje, i wyłącznie na
    potrzeby połączenia, do którego zostało zapisane. Prawo omawiane
    tutaj to założenie znosi. Proces, który je ma, zwraca się do
    menedżera jako obiekt zaufany i dostaje zawartość bez tych
    ograniczeń.

    Na serwerze zbiór ten bywa szczególnie wartościowy. Konta usługowe
    zapamiętują poświadczenia do zasobów, po które sięgają cyklicznie.
    Administratorzy łączący się przez pulpit zdalny zostawiają tam hasła
    do dalszych maszyn. Zawartość menedżera na serwerze zarządzającym
    innymi serwerami bywa więc wykazem drogi przez całe środowisko.

    Prawo to nie jest potrzebne żadnemu składnikowi systemu. Sam
    menedżer poświadczeń go nie używa — działa z innego tytułu. W
    systemie domyślnym wykaz jest pusty i taki ma pozostać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    haseł zapamiętanych na tej maszynie w postaci nadającej się do
    użycia, bez łamania czegokolwiek i bez zdarzenia logowania.
  en: |
    The Credential Manager holds remembered passwords: to network shares, to sites, to remote
    desktop connections. It holds them in a shape that can be restored, since otherwise it
    could not hand them to a program that asks for them.

    That store's guarding rests on one assumption: a credential is given out only to whom it
    belongs, and only for the connection it was recorded for. The right spoken of here undoes
    that assumption. A process holding it turns to the manager as a trusted caller and gets
    the contents without those bounds.

    On a server that store is at times of particular worth. Service accounts remember
    credentials to resources they reach for on a cycle. Administrators connecting by remote
    desktop leave passwords to further machines there. The manager's contents on a server that
    manages other servers is thus at times a list of the road through a whole environment.

    The right is needed by no part of the system. The Credential Manager itself does not use
    it - it works on another title. In the default system the list is empty and is to stay so.

    What an attacker gains while the item goes unmet: access to the passwords remembered on
    this machine in a shape fit for use, without breaking anything and without a sign-in
    event.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym wykaz jest pusty, więc naprawa nie ma czego
    usunąć. Na serwerze pracującym normalnie jest to stan spotykany
    zawsze.

    Korzystanie z menedżera poświadczeń nie zmienia się w żaden sposób.
    Zapamiętane hasła działają dalej, programy dostają je tak jak
    wcześniej, a połączenia odtwarzane z zapisanych poświadczeń
    przebiegają bez zmiany. Prawo to nie jest bowiem drogą, którą
    korzysta się z menedżera — jest drogą, którą się go omija.

    Niepusty wykaz jest ustaleniem poważnym. Nie ma znanego
    oprogramowania, które potrzebowałoby tego prawa do działania, więc
    wpis oznacza albo pomyłkę przy kopiowaniu zasad, albo coś, co
    wymaga wyjaśnienia przed naprawą, a nie po niej.
  en: |
    The change has no known side effects and takes no break.

    In the default state the list is empty, so the mending has nothing to remove. On a server
    working normally that is the state always met.

    The use of the Credential Manager does not change in any way. Remembered passwords go on
    working, programs get them as before, and connections restored from recorded credentials
    run unchanged. The right is not, after all, the road by which the manager is used - it is
    the road by which it is got round.

    A list that is not empty is a grave finding. There is no known software that would take
    this right to work, so an entry means either a slip at the copying of policies or
    something that takes explaining before the mending rather than after.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-desktop
    - file-sharing
  what_breaks:
    pl:
      - W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć
      - Zapamiętane hasła działają dalej, a programy dostają je tak jak wcześniej
      - Nie ma znanego oprogramowania, które potrzebowałoby tego prawa do działania
      - Niepusty wykaz wymaga wyjaśnienia przed naprawą, a nie po niej
    en:
      - In the default state the list is empty and the mending has nothing to remove
      - Remembered passwords go on working and programs get them as before
      - There is no known software that would take this right to work
      - A list that is not empty takes explaining before the mending rather than after
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których ten punkt byłby błędem
    en:
      - No known cases in which this item would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTrustedCredManAccessPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTrustedCredManAccessPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTrustedCredManAccessPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/access-credential-manager-as-a-trusted-caller

notes:
  pl: |
    Prawo to nie jest drogą korzystania z menedżera poświadczeń, tylko
    drogą jego ominięcia. Dlatego jego usunięcie nie wpływa na zwykłe
    korzystanie z zapamiętanych haseł.

    Sprawdzenie przyjmuje wykaz pusty i brak wpisu jako stany
    równoważne. Wykaz jest porządkowany przed porównaniem, a konta
    wskazywane identyfikatorami.

    Punkt czyta się razem z ustawieniami dotyczącymi zapamiętywania
    poświadczeń przy połączeniach zdalnych. Ograniczenie dostępu do
    zbioru ma mniejszy sens, gdy zbiór ten wolno dowolnie zapełniać.
  en: |
    The right is not the road of using the Credential Manager but the road of getting round
    it. Hence its removal does not bear on the ordinary use of remembered passwords.

    The check takes an empty list and no entry as equivalent states. The list is put in order
    before the comparison, and accounts are pointed to by identifier.

    The item is read together with the settings about the remembering of credentials at remote
    connections. Limiting access to the store makes less sense where the store may be filled
    at will.
