id: win2025-preview-builds-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Wersje zapoznawcze systemu niedostępne
    en: Preview builds of the system unavailable
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zamyka drugą drogę do wersji zapoznawczych: zapisanie maszyny do
    programu wydań testowych. Reguła sąsiednia blokuje pobieranie takich
    wydań przez mechanizm aktualizacji; ta odbiera możliwość zgłoszenia
    maszyny do programu w ogóle.

    Kategoria średnia. Warto trzymać te dwa punkty razem, bo każdy z nich
    osobno wygląda na wystarczający, a nie jest. Blokada po stronie
    aktualizacji nie przeszkadza zapisać maszyny do programu; zapisanie do
    programu bez blokady po stronie aktualizacji też nie wystarczy. Kto
    zastosuje tylko jeden, zostawia sobie wrażenie zamkniętych drzwi przy
    otwartym oknie.

    Na serwerze rzecz jest o tyle ostrzejsza, że zapisanie do programu
    robi się zwykle kilkoma kliknięciami w ustawieniach i nie wymaga
    niczyjej zgody poza uprawnieniami, które administrator i tak ma. Nie
    trzeba złej woli — wystarczy ciekawość podczas rozwiązywania problemu
    i chęć sprawdzenia, czy „w nowszej wersji to już działa".

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostępną na
    maszynie drogę do wymiany systemu na wersję spoza normalnego rytmu
    wsparcia — a przy okazji na taką, która wysyła o tej maszynie więcej
    niż wersja zwykła.
  en: |
    The item closes the second road to preview builds: enrolling the machine
    in the test-build programme. The neighbouring rule blocks the fetching
    of such builds through the update mechanism; this one takes away the
    ability to put the machine into the programme at all.

    The category is medium. It is worth keeping these two items together,
    because each of them alone looks sufficient and is not. A block on the
    update side does not prevent enrolling the machine in the programme;
    enrolment without a block on the update side is not enough either.
    Anybody applying only one leaves themselves with the impression of a
    closed door beside an open window.

    On a server the matter is sharper in that enrolment is usually done with
    a few clicks in the settings and needs nobody's consent beyond
    privileges an administrator has anyway. No ill will is required - mere
    curiosity while solving a problem is enough, and a wish to find out
    whether "in the newer version this already works".

    What an attacker gains while the item goes unmet: a road available on
    the machine to swap the system for a version outside the normal rhythm
    of support - and, incidentally, for one that sends more about this
    machine than the ordinary version does.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę zaznaczyć, że sprawdzenie
    jest tu krótkie, bo pytanie jest jedno: czy ktoś w tej organizacji
    używa tej maszyny do oglądania kolejnej wersji przed wdrożeniem.

    Na serwerze produkcyjnym odpowiedź brzmi nie i zmiana nie zmieni
    niczego w codziennej pracy — zniknie pozycja z ustawień, której nikt
    nie otwierał. Na maszynie, która w organizacji pełni właśnie rolę
    przedbiegu, odpowiedź brzmi tak i wtedy zapisany wyjątek jest
    właściwym wynikiem pracy z tą regułą, a nie porażką.

    Rzecz, którą trzeba wiedzieć przed zmianą: jeżeli maszyna jest już
    zapisana do programu, ta reguła jej z niego nie wypisze i nie sprowadzi
    z powrotem na wersję wspieraną. Ona zamyka drogę na przyszłość.
    Maszyna, która już chodzi na wersji zapoznawczej, wymaga osobnego
    planu, a ten plan bywa instalacją od nowa.

    Jeszcze jedno, warte zapisania przy maszynie: powiązanie z regułą
    o danych diagnostycznych. Program wydań zapoznawczych wymaga pełnego
    zakresu wysyłanych danych. Zastosowanie obu reguł naraz jest spójne,
    ale odwrotna kolejność decyzji — najpierw ograniczenie danych, potem
    próba zapisania maszyny do programu — kończy się komunikatem, którego
    powód nie jest oczywisty.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to note that the review here
    is short, because there is a single question: does anybody in this
    organisation use this machine to look at the next version before a
    rollout.

    On a production server the answer is no, and the change will alter
    nothing in daily work - an entry disappears from settings nobody opened.
    On a machine that serves in the organisation precisely as the advance
    run, the answer is yes, and then a recorded exception is the right
    result of working with this rule rather than a failure.

    Something to know before the change: if the machine is already enrolled
    in the programme, this rule will not remove it from there and will not
    bring it back to a supported version. It closes the road for the future.
    A machine already running a preview build needs a plan of its own, and
    that plan is sometimes an installation from scratch.

    One more thing worth recording at the machine: the tie to the rule on
    diagnostic data. The preview-build programme requires the full scope of
    data being sent. Applying both rules together is coherent, but the
    reverse order of decisions - first the data trimmed, then an attempt to
    enrol the machine - ends in a message whose reason is not obvious.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Z ustawień znika możliwość zapisania maszyny do programu wydań zapoznawczych
      - Maszyna pełniąca w organizacji rolę przedbiegu przestanie nadawać się do tego zadania
      - Maszyna już zapisana do programu nie zostanie przez tę zmianę z niego wypisana ani sprowadzona na wersję wspieraną
      - Program wydań zapoznawczych wymaga pełnego zakresu danych diagnostycznych, więc reguły te trzeba czytać razem
    en:
      - The ability to enrol the machine in the preview-build programme disappears from the settings
      - A machine serving in the organisation as the advance run stops being fit for that job
      - A machine already enrolled is not removed from the programme by this change, nor brought back to a supported version
      - The preview-build programme requires the full scope of diagnostic data, so these rules have to be read together
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni w organizacji rolę przedbiegu i na niej sprawdza się kolejną wersję przed wdrożeniem
      - Maszyna chodzi już na wersji zapoznawczej i najpierw trzeba zaplanować jej powrót na wersję wspieraną
    en:
      - The machine serves in the organisation as the advance run, where the next version is tried before a rollout
      - The machine already runs a preview build and its return to a supported version has to be planned first
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
      $name = 'AllowBuildPreview'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
    $name = 'AllowBuildPreview'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The second road to preview builds, beside the block on the update side -
    # each of them alone leaves the other open. A machine already enrolled is
    # not taken out of the programme by this and needs a plan of its own.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBuildPreview' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-insider/business/manage-builds

notes:
  pl: |
    Druga droga do wersji zapoznawczych, obok blokady po stronie
    aktualizacji. Każdy z tych punktów osobno wygląda na wystarczający
    i nie jest — kto zastosuje tylko jeden, zostawia sobie wrażenie
    zamkniętych drzwi przy otwartym oknie.

    Nie trzeba złej woli: zapisanie do programu robi się kilkoma
    kliknięciami i wystarczy ciekawość podczas rozwiązywania problemu.

    Powiązanie warte zapisania przy maszynie: program wymaga pełnego
    zakresu danych diagnostycznych. Odwrotna kolejność decyzji — najpierw
    ograniczenie danych, potem próba zapisania do programu — kończy się
    komunikatem, którego powód nie jest oczywisty.
  en: |
    The second road to preview builds, beside the block on the update side.
    Each of these items alone looks sufficient and is not - anybody applying
    only one leaves themselves with the impression of a closed door beside
    an open window.

    No ill will is required: enrolment takes a few clicks, and curiosity
    while solving a problem is enough.

    A tie worth recording at the machine: the programme requires the full
    scope of diagnostic data. The reverse order of decisions - first the
    data trimmed, then an attempt to enrol - ends in a message whose reason
    is not obvious.
