id: win10-password-minimum-age

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Najkrótszy czas między zmianami hasła
    en: The shortest time between changes of a password
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, ile dni musi upłynąć od zmiany hasła, zanim będzie
    je można zmienić ponownie.

    Reguła wygląda na uciążliwość bez powodu i dopiero w zestawieniu
    z historią haseł widać, czemu służy. Historia pamięta dwadzieścia cztery
    hasła poprzednie. Bez odstępu między zmianami użytkownik, który chce
    wrócić do hasła ulubionego, zmienia je dwadzieścia cztery razy pod rząd
    w ciągu kilku minut, wypycha je z historii i ustawia z powrotem.

    Odstęp jednodniowy tę drogę zamyka, bo czyni ją niepraktyczną — powrót
    do hasła dawnego zająłby wtedy dwadzieścia cztery dni. Jest to więc
    trzeci element tej samej konstrukcji: wygasanie wymusza zmianę, historia
    zabrania powrotu, odstęp uniemożliwia obejście historii.

    Wartość ochronna tej reguły jest zatem, tak jak przy historii, pośrednia
    i stąd kategoria niska. Bez niej dwie reguły sąsiednie dają się obejść
    w kilka minut, bez żadnych uprawnień i bez żadnego narzędzia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    użytkownik może wrócić do hasła wcześniej wyniesionego, wypychając je
    z historii serią zmian.
  en: |
    The setting says how many days must pass from a change of password before it may be changed again.

    The rule looks a hindrance without a reason, and only set beside the history of passwords is it seen what it
    serves. The history remembers twenty-four former passwords. Without a span between changes a user wishing to
    return to a favourite password changes it twenty-four times in a row over some minutes, pushes it out of the
    history and sets it back.

    A span of one day closes that road by making it impractical - a return to an old password would then take
    twenty-four days. It is therefore the third part of the same structure: expiry forces the change, the
    history forbids the return, the span makes going round the history impossible.

    This rule's protective value is accordingly, as at the history, an indirect one, and hence the low category.
    Without it the two neighbouring rules can be gone round in some minutes, with no rights and no tool at all.

    What an attacker gains while the item goes unmet: the certainty that a user may return to a password carried
    off earlier, by pushing it out of the history with a run of changes.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest jedna i konkretna:
    czy obsługa zmienia komuś hasło dwa razy tego samego dnia.

    Układ, o który chodzi, jest codzienny. Ktoś zapomina hasła, obsługa
    ustawia mu hasło tymczasowe, użytkownik loguje się i ustawia własne.
    Przy odstępie jednodniowym ta druga zmiana się nie uda i użytkownik
    zostanie z hasłem tymczasowym do następnego dnia.

    Nie jest to przeszkoda nie do obejścia — konto ustawione z wymaganiem
    zmiany hasła przy następnym logowaniu odstęp pomija. Trzeba jednak
    o tym wiedzieć i tak ustawiać konta, bo inaczej pierwsze zgłoszenie po
    wykonaniu utknie na dobę.

    Drugi przypadek dotyczy wdrożeń, przy których hasło konta lokalnego jest
    ustawiane dwa razy w trakcie tej samej procedury — raz przy tworzeniu
    konta, raz przy jego konfiguracji.

    Czego to nie psuje: logowania, haseł już ustawionych, kont domenowych,
    zmiany hasła przez administratora bez zachowania odstępu, usług, sieci.
  en: |
    The class is "needs review", and there is one concrete thing to review: whether the attendance changes
    somebody's password twice on the same day.

    The arrangement at issue is an everyday one. Somebody forgets their password, the attendance sets them a
    temporary one, the user logs in and sets their own. At a span of one day that second change will not
    succeed and the user will be left with the temporary password until the next day.

    It is no obstacle that cannot be gone round - an account set with a demand that the password be changed at
    the next logon passes the span by. One has to know that, though, and set accounts so, else the first request
    after the carrying out will stick for a day.

    The second case touches rollouts at which a local account's password gets set twice in the course of the
    same procedure - once at the making of the account, once at its configuring.

    What this does not break: logging on, passwords already set, domain accounts, the changing of a password by
    an administrator without keeping the span, services, or the network.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownik, któremu obsługa ustawiła hasło tymczasowe, nie ustawi własnego tego samego dnia
      - Procedura wdrożeniowa ustawiająca hasło konta lokalnego dwa razy w trakcie jednego przebiegu kończy się błędem
      - Konto ustawione z wymaganiem zmiany hasła przy następnym logowaniu odstęp pomija i działa jak dotąd
      - Zmiana hasła przez administratora nie podlega odstępowi, więc droga naprawy konta pozostaje otwarta
      - Logowanie, hasła już ustawione, konta domenowe oraz praca usług i sieci pozostają bez zmian
    en:
      - A user whom the attendance has set a temporary password will not set their own the same day
      - A rollout procedure setting a local accounts password twice in one run ends in an error
      - An account set with a demand that the password be changed at the next logon passes the span by and works as before
      - A change of password by an administrator is not bound by the span, so the road to mending an account stays open
      - Logging on, passwords already set, domain accounts and the work of services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Procedura tworzenia kont lokalnych ustawia hasło dwa razy w jednym przebiegu i nie da się jej na razie poprawić
    en:
      - The procedure making local accounts sets the password twice in one run and cannot for now be mended
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^MinimumPasswordAge\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'MinimumPasswordAge'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An account set with a demand that the password be changed at the next logon
    # passes the span by. Set accounts so where the attendance hands out temporary
    # passwords, else the user will be stuck with one for a day.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordAge = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-age

notes:
  pl: |
    Reguła zamyka trójkę, którą tworzy razem z wygasaniem i historią, i jest
    z nich najmniej oczywista. Warto, żeby aplikacja pokazywała całą trójkę
    jako jedną konstrukcję, bo osobno ta reguła wygląda na utrudnienie
    wprowadzone bez powodu, a takie punkty użytkownik odpuszcza pierwsze.

    Rachunek warto postawić wprost, bo tłumaczy wszystko w jednym zdaniu:
    dwadzieścia cztery zmiany w kilka minut kontra dwadzieścia cztery dni.
    To jest cała różnica, jaką wnosi ta reguła.

    Odnotowuję, że zmiana hasła wykonana przez administratora odstępowi nie
    podlega. Jest to wyjątek wbudowany w system, nie luka, i opis powinien
    o nim mówić, bo bez tej wiedzy reguła wygląda na blokadę naprawy konta.
  en: |
    The rule closes the three it makes together with expiry and the history, and is the least obvious of them.
    It is well that the application show the whole three as one structure, apart this rule looking a hindrance
    brought in without a reason, and such items a user lets go of first.

    The reckoning is worth putting outright, explaining as it does everything in one sentence: twenty-four
    changes in some minutes against twenty-four days. That is the whole difference this rule brings.

    Worth noting that a change of password made by an administrator is not bound by the span. It is an exception
    built into the system, not a gap, and the description ought to speak of it, without that knowledge the rule
    looking like a block on the mending of an account.
