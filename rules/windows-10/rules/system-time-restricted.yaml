id: win10-system-time-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana czasu systemowego ograniczona do administratorów i usługi lokalnej
    en: The changing of the system time bounded to administrators and the local service
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo zmiany czasu systemowego do administratorów
    i konta usługi lokalnej.

    Czas na maszynie wygląda na ustawienie porządkowe, a jest warunkiem
    działania dwóch rzeczy, na których opiera się całe uwierzytelnianie
    w sieci. Pierwszą są bilety dostępowe, ważne przez określony czas
    i odrzucane, gdy zegary się rozjeżdżają. Drugą są certyfikaty,
    sprawdzane pod kątem daty ważności.

    Przesunięcie zegara pozwala więc unieważnić lub przywrócić ważność
    rzeczy, które od czasu zależą. Certyfikat wycofany albo wygasły znów
    staje się ważny, jeżeli maszynie wmówi się datę sprzed jego
    wygaśnięcia.

    Drugim skutkiem jest dziennik zdarzeń. Zapisy otrzymują czas
    z zegara maszyny, więc przesunięcie go rozsypuje kolejność zdarzeń
    i uniemożliwia zestawienie tego, co się działo, z zapisami z innych
    maszyn. Jest to sposób na utrudnienie dochodzenia bez kasowania
    czegokolwiek.

    Odnotowuję, że konto usługi lokalnej pozostaje w wykazie. Bez niego
    przestaje działać synchronizacja zegara przez sieć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wpływ na
    ważność biletów i certyfikatów oraz na kolejność zapisów w dzienniku.
  en: |
    The setting bounds the right of changing the system time to the administrators and to the account of the local
    service.

    The time upon a machine looks like a setting of mere order, and is the condition of two things upon which the
    whole proving of names in a network rests. The first is tickets of access, good for a set span and cast aside
    when clocks drift apart. The second is certificates, weighed against their date of standing.

    The shifting of the clock therefore lets the standing of things that hang upon time be undone or brought back.
    A certificate withdrawn or run out becomes good again if the machine is led to believe a date before its
    running out.

    The second upshot is the journal of events. Its records take their time from the machine's clock, so a
    shifting of it scatters the order of happenings and makes it not to be done to set what took place beside the
    records of other machines. It is a way of hindering an inquiry without the deleting of anything at all.

    I set down that the account of the local service stays in the list. Without it the keeping of the clock in
    step over the network ceases to work.

    What an attacker gains while the item goes unmet: a hold upon the standing of tickets and certificates and
    upon the order of the records in the journal.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś na maszynie zmienia czas w ramach normalnej pracy.

    Miejscem najczęstszym jest starsze oprogramowanie pomiarowe
    i przemysłowe, które ustawia zegar maszyny według własnego źródła
    czasu. Po zmianie takie narzędzie zgłosi błąd uprawnień, a zegar
    zostanie przy czasie z synchronizacji sieciowej.

    Miejscem drugim są maszyny odcięte od sieci, na których czas
    poprawia się ręcznie z konta użytkownika. Po zmianie poprawienie
    zegara będzie wymagało administratora.

    Skutek jest widoczny dla użytkownika: okno ustawień daty i godziny
    pokaże, że zmiana wymaga uprawnień administratora. Sama strefa
    czasowa pozostaje osobnym ustawieniem i nie jest tym punktem objęta.

    Odnotowuję, że usunięcie z wykazu konta usługi lokalnej zatrzymałoby
    synchronizację zegara przez sieć — a wtedy zegar zacznie się rozjeżdżać
    sam z siebie, co jest skutkiem odwrotnym do zamierzonego.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: synchronizacji czasu przez sieć, logowania,
    dostępu do zasobów sieciowych, pracy z plikami, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody upon the machine changes the time
    in the ordinary course of work.

    The commonest place is older software of measuring and of industry, which sets the machine's clock by a source
    of time of its own. After the change such a tool will report a fault of rights, and the clock will stay at the
    time from the keeping in step over the network.

    The second place is machines cut off from the network, upon which the time is put right by hand from a user's
    account. After the change the putting right of the clock will call for an administrator.

    The consequence is plain to the user: the window of the settings of date and hour will show that the change
    calls for an administrator's rights. The zone of time stays a setting apart and is not held by this item.

    I set down that the taking of the account of the local service out of the list would hold the keeping of the
    clock in step over the network - and then the clock would begin to drift of itself, which is the opposite of
    what was meant.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the keeping of time in step over the network, logging on, the way to resources upon
    the network, work with files, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Starsze oprogramowanie pomiarowe ustawiające zegar według własnego źródła zgłosi błąd uprawnień
      - Na maszynach odciętych od sieci ręczne poprawienie zegara będzie wymagało administratora
      - Okno ustawień daty i godziny pokaże użytkownikowi, że zmiana wymaga uprawnień administratora
      - Usunięcie z wykazu konta usługi lokalnej zatrzymałoby synchronizację zegara przez sieć
      - Synchronizacja czasu przez sieć, logowanie, dostęp do zasobów sieciowych i drukowanie pozostają bez zmian
    en:
      - Older software of measuring that sets the clock by a source of its own will report a fault of rights
      - Upon machines cut off from the network the putting right of the clock by hand will call for an administrator
      - The window of the settings of date and hour will show the user that the change calls for an administrator s rights
      - The taking of the account of the local service out of the list would hold the keeping of the clock in step over the network
      - The keeping of time in step over the network, logging on, the way to resources and printing stay unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje oprogramowanie pomiarowe ustawiające zegar według własnego źródła czasu
      - Maszyna jest odcięta od sieci i czas poprawia się na niej ręcznie z konta użytkownika
    en:
      - Upon the machine works software of measuring that sets the clock by a source of time of its own
      - The machine is cut off from the network and the time is put right upon it by hand from a user s account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemTimePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemTimePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemTimePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators and to the local service. Without the
    # second the keeping of the clock in step over the network stops.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSystemTimePrivilege = *S-1-5-32-544,*S-1-5-19',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemTimePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/change-the-system-time

notes:
  pl: |
    Reguła bywa lekceważona, bo zegar wygląda na ustawienie kosmetyczne.
    Warto, żeby aplikacja pokazała dwie rzeczy, które od niego zależą:
    ważność biletów dostępowych i ważność certyfikatów. Obie są
    mechanizmami uwierzytelniania, a nie wygody.

    Argument wart zachowania dotyczy dziennika zdarzeń. Przesunięcie
    zegara nie kasuje żadnego wpisu, a mimo to uniemożliwia zestawienie
    zapisów z tej maszyny z zapisami z pozostałych. Jest to sposób na
    utrudnienie dochodzenia, który nie wygląda na zacieranie śladów —
    i tym właśnie jest niebezpieczny.

    Odnotowuję rozdzielenie czasu i strefy czasowej. Są to dwa osobne
    ustawienia i dwa osobne prawa. Zmiana strefy przesuwa wyświetlany
    czas, ale nie rusza czasu zapisywanego w dzienniku, więc jej waga jest
    zupełnie inna. Aplikacja powinna trzymać te punkty rozdzielone.
  en: |
    The rule is at times made light of, a clock looking like a setting of cosmetics. It is well that the
    application show the two things that hang upon it: the standing of tickets of access and the standing of
    certificates. Both are mechanisms of the proving of names and no matter of ease.

    The argument worth keeping touches the journal of events. The shifting of the clock deletes no entry and none
    the less makes it not to be done to set this machine's records beside those of the rest. It is a way of
    hindering an inquiry that does not look like the wiping out of traces - and therein lies its danger.

    I set down the parting of time from the zone of time. They are two settings apart and two rights apart. The
    changing of the zone shifts the time shown but does not touch the time written into the journal, so its weight
    is wholly other. The application ought to keep those items parted.
