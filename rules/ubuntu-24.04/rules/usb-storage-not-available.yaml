id: ubuntu2404-usb-storage-not-available

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.1.1.9
  section: Initial Setup > Filesystem > Configure Filesystem Kernel Modules
  title:
    pl: Moduł jądra usb-storage niedostępny
    en: Ensure usb-storage kernel module is not available
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usb-storage to sterownik jądra dla pamięci masowych USB: pendrive'ów,
    dysków zewnętrznych i czytników kart. Sterownik uas, obsługujący szybsze
    dyski zewnętrzne, zależy od niego, więc blokada obejmuje oba. Z tego
    samego sterownika korzysta wirtualny nośnik kontrolera BMC (iDRAC, iLO,
    IPMI): obraz podłączony zdalnie z konsoli zarządzania widać w systemie
    jako dysk USB.

    Taki nośnik otwiera dwie drogi. Dane mogą wyjść z serwera bez śladu
    w usługach sieciowych, a nośnik przyniesiony z zewnątrz albo obraz
    podłączony przez BMC daje jądru do przeczytania tablicę partycji
    i system plików przygotowane przez kogoś innego. Jądro zaczyna je czytać
    zaraz po podłączeniu, zanim ktokolwiek cokolwiek zamontuje.

    Punkt zamyka obie: po podłączeniu urządzenia sterownik się nie ładuje,
    więc system w ogóle nie widzi dysku. Moduł jest w pakiecie
    linux-modules, więc ma go każde jądro Ubuntu.

    Kategoria jest średnia. Do portu USB potrzebny jest fizyczny dostęp do
    serwera, ale wirtualny nośnik BMC działa zdalnie dla każdego, kto ma
    dostęp do konsoli zarządzania.
  en: |
    Usb-storage is the kernel driver for USB mass storage: USB sticks,
    external drives and card readers. The uas driver, which handles faster
    external drives, depends on it, so the block covers both. The virtual
    media of a BMC controller (iDRAC, iLO, IPMI) uses the same driver: an
    image attached remotely from the management console shows up in the
    system as a USB disk.

    Such media open two paths. Data can leave the server without a trace in
    network services, and a medium brought in from outside, or an image
    attached through the BMC, hands the kernel a partition table and a file
    system prepared by somebody else. The kernel starts reading them right
    after the device appears, before anybody mounts anything.

    The item closes both: when a device is plugged in, the driver does not
    load, so the system does not see the drive at all. The module ships in
    the linux-modules package, so every Ubuntu kernel has it.

    The category is medium. A USB port needs physical access to the server,
    but BMC virtual media works remotely for anybody with access to the
    management console.

disruption_description:
  pl: |
    Klasa wymaga przeglądu, bo trzeba ustalić, czy ktoś korzysta z nośników
    USB przy obsłudze serwera: kopii zapasowych na dysk zewnętrzny,
    wirtualnego nośnika BMC do aktualizacji oprogramowania układowego albo
    pendrive'a z danymi dla cloud-init.

    Blokada nie dotyczy urządzeń USB innych klas: klawiatura, mysz, konsola
    szeregowa na USB i klucz sprzętowy działają dalej. Nie wpływa też na
    uruchamianie instalatora z pendrive'a lub z wirtualnego nośnika, bo tym
    zajmuje się oprogramowanie układowe, zanim wystartuje jądro systemu.

    Dysk podłączony w chwili zmiany działa do odłączenia. Naprawa odmawia
    zmiany, jeśli system, /boot lub inny podstawowy katalog leży na dysku
    USB, bo system przestałby się uruchamiać.

    Zmiana nie wymaga restartu ani wylogowania.
  en: |
    The class needs review because somebody has to find out whether USB
    media are used in running the server: backups to an external drive, BMC
    virtual media for firmware updates, or a stick with cloud-init data.

    The block does not affect USB devices of other classes: a keyboard,
    mouse, USB serial console and hardware key keep working. Nor does it
    affect booting an installer from a stick or from virtual media, because
    the firmware handles that before the system kernel starts.

    A drive connected at the time of the change keeps working until it is
    unplugged. The remediation refuses the change if the system, /boot or
    another core directory is on a USB drive, because the system would stop
    starting.

    The change needs no restart and no sign-out.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
    - remote-management
  what_breaks:
    pl:
      - Pendrive lub dysk zewnętrzny podłączony do serwera nie pojawia się w lsblk, więc nie da się go zamontować ani skopiować z niego plików
      - Kopia zapasowa robiona na dysk zewnętrzny USB kończy się błędem, bo dysk docelowy nie jest widoczny w systemie
      - Obraz ISO podłączony przez wirtualny nośnik iDRAC, iLO lub IPMI nie jest widoczny w działającym systemie, np. przy aktualizacji oprogramowania układowego
    en:
      - A USB stick or external drive connected to the server does not appear in lsblk, so it cannot be mounted and no files can be copied from it
      - A backup to an external USB drive fails, because the target drive is not visible in the system
      - An ISO image attached through iDRAC, iLO or IPMI virtual media is not visible in the running system, for example during a firmware update
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - System, /boot lub inny podstawowy katalog leży na dysku podłączonym przez USB; naprawa w tej sytuacji odmawia zmiany
      - Kopie zapasowe serwera trafiają na dysk zewnętrzny USB i nie ma dla nich innego miejsca
      - Aktualizacje oprogramowania układowego lub sterowników są dostarczane przez wirtualny nośnik BMC do działającego systemu
    en:
      - The system, /boot or another core directory is on a drive connected over USB; the remediation refuses the change in that case
      - The server's backups go to an external USB drive and there is no other place for them
      - Firmware or driver updates are delivered to the running system through BMC virtual media
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    m=usb-storage
    n=usb_storage
    mods=/usr/lib/modules
    if [ ! -d "$mods" ] || [ ! -r /proc/modules ] || ! command -v modprobe >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if grep -q "^$n " /proc/modules; then echo LOADED; exit 0; fi
    for list in "$mods"/*/modules.builtin; do
      [ -e "$list" ] || continue
      [ -r "$list" ] || { echo CHECK_ERROR; exit 0; }
      if grep -Eq "/$m\.ko$" "$list"; then echo BUILTIN; exit 0; fi
    done
    if ! found=$(find "$mods" -name "$m.ko*" -print -quit 2>/dev/null); then
      echo CHECK_ERROR; exit 0
    fi
    if [ -z "$found" ]; then echo NOT_PRESENT; exit 0; fi
    if ! config=$(modprobe --showconfig 2>/dev/null); then echo CHECK_ERROR; exit 0; fi
    blocked=no; listed=no
    if printf '%s\n' "$config" | grep -Eq "^install $n (/usr)?/bin/(false|true)$"; then blocked=yes; fi
    if printf '%s\n' "$config" | grep -qx "blacklist $n"; then listed=yes; fi
    case "$blocked$listed" in
      yesyes) echo BLOCKED ;;
      yesno)  echo NOT_BLACKLISTED ;;
      noyes)  echo LOADABLE_ON_REQUEST ;;
      *)      echo AVAILABLE ;;
    esac
  expected: '^(BLOCKED|NOT_PRESENT)$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      m=usb-storage
      n=usb_storage
      f=/etc/modprobe.d/sentin-harden-$m.conf
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        if grep -q "^$n " /proc/modules; then echo loaded=1; else echo loaded=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b.tmp"
      mv "$b.tmp" "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      m=usb-storage
      n=usb_storage
      f=/etc/modprobe.d/sentin-harden-$m.conf
      for list in /usr/lib/modules/*/modules.builtin; do
        if [ -e "$list" ] && grep -Eq "/$m\.ko$" "$list"; then
          echo "Module $m is built into the kernel and a configuration file cannot block it; record an exception instead" >&2
          exit 1
        fi
      done
      for mp in / /boot /boot/efi /usr /var /home; do
        src=$(findmnt -kn -v -o SOURCE --mountpoint "$mp" 2>/dev/null) || continue
        if lsblk -sno TRAN "$src" 2>/dev/null | grep -qx usb; then
          echo "$mp is on a USB disk; blocking usb-storage would leave the system unable to start" >&2
          exit 1
        fi
      done
      printf '%s\n' \
        '# Sentin-Harden: ubuntu2404-usb-storage-not-available' \
        "install $n /bin/false" \
        "blacklist $n" > "$f.tmp"
      chmod 0644 "$f.tmp"
      mv "$f.tmp" "$f"
      if grep -q "^$n " /proc/modules; then
        if ! modprobe -r "$n"; then
          echo "Module $m is in use and stays loaded until whatever uses it is stopped or the machine restarts" >&2
        fi
      fi
      echo "Wrote $f"
    )

  rollback_command: |
    (
      set -e
      m=usb-storage
      n=usb_storage
      f=/etc/modprobe.d/sentin-harden-$m.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      grep -qx -- --- "$b" || { echo "Backup file is damaged: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      loaded=$(sed -n 's/^loaded=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f.tmp"; chmod 0644 "$f.tmp"; mv "$f.tmp" "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      if [ "$loaded" = 1 ] && ! grep -q "^$n " /proc/modules; then modprobe "$n"; fi
      echo "Restored previous state of $f"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/modprobe.d.5.html
  - https://usbguard.github.io/documentation/rule-language.html
  - https://docs.kernel.org/usb/mass-storage.html

notes:
  pl: |
    Sprawdzenie czyta wynikową konfigurację modprobe, a nie jeden wybrany
    plik. Blokada zapisana wcześniej gdzie indziej, np. w
    /etc/modprobe.d/usb-storage.conf, także spełnia punkt, a naprawa jej nie
    dubluje, bo przy spełnionym punkcie nie jest uruchamiana. Naprawa
    zapisuje plik /etc/modprobe.d/sentin-harden-usb-storage.conf, a wycofanie
    przywraca go z kopii albo usuwa.

    Potrzebne są obie linie. Wpis blacklist powstrzymuje tylko ładowanie po
    aliasie, czyli wtedy, gdy jądro samo prosi o sterownik; modprobe
    wywołane z nazwą modułu go omija. Linia install zastępuje ładowanie
    uruchomieniem /bin/false, więc każda taka próba kończy się błędem.
    Obu mechanizmów nie zatrzymuje insmod z pełną ścieżką do pliku, ale to
    wymaga roota i świadomego działania.

    Test szuka modułu we wszystkich jądrach w /usr/lib/modules, także
    w plikach .ko.zst, w których Ubuntu je dostarcza. Punkt jest
    spełniony także wtedy, gdy żadne zainstalowane jądro nie zawiera
    modułu. Moduł załadowany w chwili sprawdzenia daje wynik niespełniony
    nawet przy obecnej blokadzie; naprawa próbuje go wyładować, a jeśli
    jest w użyciu, zostaje w pamięci do zakończenia tego, co go używa, albo
    do restartu. Sterownika wkompilowanego w jądro (wynik BUILTIN) plikiem
    konfiguracji nie da się zablokować i zostaje zapisanie wyjątku.

    W przypadku usb-storage żądanie ładowania nie przychodzi przy montowaniu,
    lecz przy podłączeniu urządzenia: udev ładuje sterownik po aliasie USB,
    który pasuje do klasy pamięci masowej. Ubuntu Server nie montuje sam
    podłączonych nośników, ale montowanie nie jest do tego potrzebne:
    sterownik ładuje się, a jądro czyta tablicę partycji, zanim ktokolwiek
    wyda polecenie mount.

    Gdy potrzebna jest zgoda na wybrane nośniki zamiast pełnej blokady,
    Ubuntu ma w repozytorium pakiet usbguard, który dopuszcza urządzenia
    z listy według identyfikatora i numeru seryjnego. Wtedy tej reguły nie
    należy stosować, bo zablokowany sterownik nie obsłuży także
    dopuszczonego nośnika.
  en: |
    The check reads the effective modprobe configuration rather than one
    chosen file. A block written earlier somewhere else, for example in
    /etc/modprobe.d/usb-storage.conf, also meets the item, and the remediation
    does not duplicate it, because it is not run when the item is met. The
    remediation writes /etc/modprobe.d/sentin-harden-usb-storage.conf, and
    rollback restores it from the backup or removes it.

    Both lines are needed. The blacklist entry only stops loading by alias,
    that is, when the kernel itself asks for the driver; running modprobe
    with the module name bypasses it. The install line replaces loading
    with running /bin/false, so every such attempt fails. Neither mechanism
    stops insmod with the full path to the file, but that needs root and a
    deliberate action.

    The test looks for the module in every kernel under /usr/lib/modules,
    including the .ko.zst files Ubuntu ships them as. The item is also met
    when no installed kernel contains the module. A module that is loaded
    at the time of the check gives a non-compliant result even when the
    block is in place; the remediation tries to unload it, and if it is in
    use it stays in memory until whatever uses it stops or the machine
    restarts. A driver compiled into the kernel (the BUILTIN result) cannot
    be blocked by a configuration file, and the remaining option is to
    record an exception.

    For usb-storage the load request does not come when mounting but when
    the device is plugged in: udev loads the driver by the USB alias that
    matches the mass storage class. Ubuntu Server does not mount attached
    media by itself, but no mount is needed for this: the driver loads and
    the kernel reads the partition table before anybody runs mount.

    When selected media should be allowed instead of a full block, Ubuntu
    has the usbguard package in its archive, which admits devices from a
    list by identifier and serial number. In that case this rule should not
    be applied, because a blocked driver cannot serve an allowed medium
    either.
