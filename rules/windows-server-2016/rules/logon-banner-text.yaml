id: win2016-logon-banner-text

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Treść komunikatu wyświetlanego przed zalogowaniem ustawiona
    en: The body of the message shown before signing in set
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby komunikat pokazywany przed zalogowaniem miał treść,
    a nie tylko nagłówek.

    Treść jest tu właściwym nośnikiem znaczenia, bo tytuł mieści jedno zdanie,
    a to za mało, żeby cokolwiek rozstrzygnąć. Dwie rzeczy powinny się w niej
    znaleźć: że dostęp przysługuje wyłącznie osobom upoważnionym i że praca na
    tej maszynie jest rejestrowana. Pierwsze zamyka linię obrony „myślałem, że
    mogę". Drugie jest w części porządków prawnych warunkiem, żeby z zapisu
    dziennika dało się w ogóle skorzystać.

    Podobnie jak tytuł, reguła ta nie zatrzymuje ataku. Jej wartość ujawnia się
    po zdarzeniu i dotyczy głównie zagrożenia wewnętrznego — osoby, która ma
    dostęp, ale wykracza poza to, do czego jej go dano.

    Jest jeszcze skutek uboczny wart odnotowania, bo bywa jedynym widocznym.
    Komunikat zmienia wygląd ekranu logowania na tyle, że automat próbujący
    zalogować się do maszyny z zewnątrz musi się do tej zmiany dostosować.
    Nie jest to zabezpieczenie i nie należy tak tego przedstawiać, ale bywa
    pierwszą rzeczą, która zwraca uwagę na nietypowe logowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    technicznego — organizacja traci natomiast podstawę do wyciągnięcia
    konsekwencji wobec kogoś, kto miał dostęp i go nadużył.
  en: |
    The item requires that the message shown before signing in have a body and not
    only a heading.

    The body is the proper carrier of meaning here, since the title holds one
    sentence and that is too little to settle anything. Two things should be in it:
    that access belongs to authorised people alone, and that work on this machine is
    recorded. The first closes off the "I thought I was allowed" line of defence.
    The second is, in some legal orders, the condition for the log's record being
    usable at all.

    Like the title, this rule stops no attack. Its worth shows itself after an event
    and concerns chiefly the threat from within - a person who has access but goes
    beyond what it was given for.

    There is a side effect worth noting too, since it is at times the only visible
    one. The message changes the look of the sign-in screen enough that an automaton
    trying to sign in to the machine from outside has to adjust to the change. It is
    no safeguard and should not be presented as one, but it is at times the first
    thing that draws attention to unusual sign-ins.

    What an attacker gains while the item goes unmet: nothing technical - what the
    organisation loses is the ground for drawing consequences against somebody who
    had access and misused it.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", z tego samego powodu co tytuł
    komunikatu, tylko mocniej. Treść jest dłuższa, więc więcej w niej miejsca
    na obietnicę, której organizacja nie dotrzyma.

    Wersja wpisywana przez regułę jest punktem wyjścia i niczym więcej.
    Wypuszczenie jej na maszyny bez przeczytania jest dokładnie tym błędem,
    przed którym ta reguła ma chronić: komunikat prawny, którego nikt
    odpowiedzialny nie widział, jest wart tyle, co jego brak, a czasem mniej.

    Skutek eksploatacyjny jest taki sam jak przy tytule i wynika z tego samego
    okna: dodatkowe kliknięcie przy każdym logowaniu, kłopot dla narzędzi
    logujących się skryptem, widoczna zmiana w sesji pulpitu zdalnego.

    Jest jedna rzecz dodatkowa. Bardzo długa treść potrafi nie zmieścić się na
    ekranie przy niskiej rozdzielczości konsoli — a konsola hipernadzorcy
    bywa ustawiona właśnie tak. Warto na to spojrzeć, jeśli komunikat ma być
    obszerny.

    Czego to nie psuje: uwierzytelniania, sesji już otwartych, kont usług,
    zadań zaplanowanych ani dostępu przez udziały sieciowe.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", for the same reason as the message's
    title, only more strongly. The body is longer, so there is more room in it for a
    promise the organisation will not keep.

    The version the rule writes is a starting point and nothing besides. Letting it
    onto machines unread is exactly the mistake this rule is meant to guard against:
    a legal message nobody answerable has seen is worth as much as its absence, and
    at times less.

    The operational effect is the same as with the title and comes from the same
    window: an extra click at every sign-in, trouble for tools signing in by script,
    a visible change in a remote desktop session.

    There is one further thing. A very long body can fail to fit the screen at a low
    console resolution - and a hypervisor's console is at times set exactly so.
    Worth a look if the message is to be a lengthy one.

    What this does not break: authentication, sessions already open, service
    accounts, scheduled tasks, or access through network shares.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia logujące się do maszyny skryptem trafiają na okno, którego nie przewidziano w ich scenariuszu
      - Bardzo długa treść potrafi nie zmieścić się na ekranie przy niskiej rozdzielczości konsoli hipernadzorcy
      - Każde logowanie do konsoli i do sesji zdalnej wymaga dodatkowego potwierdzenia
      - Uwierzytelnianie, konta usług, zadania zaplanowane i dostęp przez udziały sieciowe pozostają bez zmian
    en:
      - Tools signing in to the machine by script meet a window their scenario did not foresee
      - A very long body can fail to fit the screen at the low resolution of a hypervisor console
      - Every sign-in at the console and in a remote session calls for an extra confirmation
      - Authentication, service accounts, scheduled tasks and access through network shares stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Treść komunikatu nie została uzgodniona z osobą odpowiadającą za sprawy pracownicze albo prawne
      - Do maszyny logują się narzędzia sterowane skryptem, które nie poradzą sobie z dodatkowym oknem
    en:
      - The wording has not been agreed with somebody answerable for employment or legal matters
      - Script-driven tools sign in to the machine and will not cope with an extra window
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is kept as text, but a policy set earlier can leave it as a list
      # of lines. Both forms are joined before the emptiness check.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'legalnoticetext'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      else {
        $joined = if ($value -is [array]) { [string]::Join(' ', $value) } else { [string]$value }
        if ($joined.Trim() -eq '') { 'EMPTY' } else { 'SET' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'SET'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'legalnoticetext'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording below is a starting point, not a requirement of the item. Agree
    # the organisation's own wording before rolling this out widely.
    $message = 'This system is for the use of authorised people only. ' +
      'Use of it is recorded, and the records belong to the organisation ' +
      'that owns this machine.'
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'legalnoticetext' -Value $message -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-text-for-users-attempting-to-log-on

notes:
  pl: |
    Wpis bywa zapisany jako pojedynczy tekst albo jako lista wierszy —
    zależnie od tego, czym go ustawiono. Audyt scala obie postaci przed
    sprawdzeniem, czy jest pusty, żeby wynik nie zależał od narzędzia użytego
    wcześniej.

    Reguła nie ocenia treści i nie sprawdza jej długości. Sprawdza obecność.
    Ocena samego brzmienia jest pracą dla człowieka i nie da się jej zamknąć
    w regule.

    Punkt wdraża się razem z regułą o tytule komunikatu. Osobno żadna z nich
    nie daje pełnego okna, a niepełne okno jest gorsze od jego braku, bo
    wygląda na przeoczenie.
  en: |
    The entry is at times kept as a single text and at times as a list of lines -
    depending on what set it. The audit joins both forms before checking whether it
    is empty, so that the result does not depend on the tool used earlier.

    The rule does not judge the wording and does not check its length. It checks
    presence. Judging the phrasing itself is work for a person and cannot be shut
    inside a rule.

    The item is applied together with the rule on the message's title. Apart,
    neither gives a full window, and a partial window is worse than none, since it
    looks like an oversight.
