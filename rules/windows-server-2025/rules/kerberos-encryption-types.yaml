id: win2025-kerberos-encryption-types

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Dozwolone typy szyfrowania dla protokołu Kerberos
    en: Permitted encryption types for Kerberos
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wylicza szyfry, którymi wolno chronić bilety protokołu
    uwierzytelniania domenowego, i odrzuca wszystkie pozostałe.

    Odrzucany jest przede wszystkim szyfr strumieniowy sprzed dwóch
    pokoleń systemu. Jego wadą nie jest sama siła, lecz to, z czego
    wyprowadza się dla niego klucz: klucz bierze się wprost ze skrótu
    hasła, tego samego, który leży w bazie kont. Znaczy to, że kto
    zdobył skrót, ten nie musi znać hasła — ma wszystko, czego potrzeba,
    żeby wystawić sobie bilet.

    Druga wada jest praktyczniejsza. Bilet chroniony tym szyfrem daje
    się poprosić dla dowolnego konta usługowego, a następnie łamać
    spokojnie na własnej maszynie, bez żadnego ruchu w stronę domeny
    i bez żadnego śladu w dzienniku. Hasło konta usługowego, zwykle
    niezmieniane od lat, poddaje się temu szybciej, niż wygląda.

    Szyfry blokowe dopuszczone przez ten punkt obu tych wad nie mają.
    Klucz wyprowadza się dla nich inaczej, a odzyskanie hasła
    z przechwyconego biletu przestaje być zadaniem wykonalnym w
    rozsądnym czasie.

    Na serwerze punkt waży najwięcej na kontrolerze domeny, bo to on
    bilety wystawia. Na serwerze członkowskim rozstrzyga o tym, czego
    maszyna żąda dla siebie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: bilety
    dające się łamać poza domeną, bez śladu, oraz możliwość wystawienia
    sobie biletu na podstawie samego skrótu hasła.
  en: |
    The setting counts up the ciphers the domain authentication protocol's tickets may be
    guarded with, and turns every other away.

    What is turned away is above all a stream cipher two generations of the system old. Its flaw
    is not its strength but what its key is drawn from: the key is taken straight from the
    password's hash, the same that lies in the account base. That means whoever won the hash
    need not know the password - they have all that is wanted to issue themselves a ticket.

    The second flaw is more practical. A ticket guarded by that cipher can be asked for any
    service account and then broken at leisure on one's own machine, with no traffic towards the
    domain and no trace in the log. A service account's password, usually unchanged for years,
    yields to that quicker than it looks.

    The block ciphers this item allows bear neither flaw. Their key is drawn otherwise, and the
    recovering of a password from a caught ticket stops being a task doable in reasonable time.

    On a server the item weighs most on a domain controller, that being what issues the tickets.
    On a member server it settles what the machine demands for itself.

    What an attacker gains while the item goes unmet: tickets breakable outside the domain
    without trace, and the means of issuing themselves a ticket on the strength of a password
    hash alone.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy części systemów i wymaga okna
    serwisowego oraz rozpoznania przeprowadzonego wcześniej.

    Jest to punkt, przy którym różnica między serwerem a stanowiskiem
    roboczym jest największa w całej tej grupie, i dlatego podniosłem
    go do klasy wymagającej świadomego wdrożenia. Stanowisko robocze
    uwierzytelnia się wobec domeny i tyle. Serwer bywa stroną, wobec
    której uwierzytelniają się inni — a wśród nich systemy, które
    o szyfrach blokowych nigdy nie słyszały.

    Przypadkiem pierwszym są konta usługowe z kluczem wygenerowanym
    poza systemem Windows. Aplikacje pracujące na innych systemach
    uwierzytelniają się w domenie plikiem klucza, wygenerowanym raz,
    przy wdrożeniu. Jeżeli plik ten zawiera wyłącznie klucz dla szyfru
    odrzucanego, aplikacja przestanie się uwierzytelniać, a odtworzenie
    pliku wymaga zmiany hasła konta i wygenerowania go od nowa.

    Przypadkiem drugim są relacje zaufania między domenami. Zaufanie
    ustanowione dawno bywa oparte na szyfrze odrzucanym i zmiana
    potrafi je zerwać.

    Przypadkiem trzecim są urządzenia z oprogramowaniem wbudowanym
    dołączone do domeny — macierze, urządzenia zabezpieczające,
    terminale — których producent nie aktualizował od lat.

    Objaw jest gwałtowny i szeroki: uwierzytelnianie przestaje działać
    całkowicie, a nie pogarsza się stopniowo. W dzienniku widać
    niepowodzenie z powodu braku wspólnego typu szyfrowania — komunikat
    jest czytelny, co jest tu jedyną dobrą wiadomością.

    Rozpoznanie przeprowadź przed zmianą, zestawiając wykaz kont
    usługowych z typami szyfrowania, które każde z nich obsługuje.
    Zmiana nie wymaga restartu i wchodzi w życie przy następnym
    żądaniu biletu.
  en: |
    The change surely changes how some systems work and takes a service window and a
    reconnaissance made beforehand.

    It is the item where the difference between a server and a working station is greatest in
    this whole group, and hence I raised it to the class taking a knowing rollout. A working
    station authenticates itself towards the domain and no more. A server is at times the side
    others authenticate themselves towards - and among them systems that never heard of block
    ciphers.

    The first case is service accounts with a key made outside Windows. Applications working on
    other systems authenticate in the domain by a key file, made once, at their rollout. Where
    that file holds a key for the turned-away cipher alone, the application will stop
    authenticating, and the remaking of the file takes a change of the account's password and a
    making of it anew.

    The second case is trust relations between domains. A trust set up long ago is at times
    built on the turned-away cipher, and the change can break it.

    The third case is devices with built-in software joined to the domain - storage arrays,
    security appliances, terminals - whose maker has not updated them for years.

    The symptom is abrupt and wide: authentication stops working wholly rather than worsening by
    degrees. The log shows a failure for want of a shared encryption type - the message is
    plain, which is here the one good tiding.

    Make the reconnaissance before the change, setting the list of service accounts beside the
    encryption types each of them bears. The change takes no restart and comes into force at the
    next request for a ticket.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Konto usługowe z plikiem klucza wygenerowanym poza systemem Windows przestanie się uwierzytelniać
      - Relacja zaufania między domenami oparta na szyfrze odrzucanym może zostać zerwana
      - Urządzenia z oprogramowaniem wbudowanym dołączone do domeny mogą stracić możliwość uwierzytelnienia
      - Uwierzytelnianie przestaje działać całkowicie, a nie pogarsza się stopniowo
    en:
      - A service account with a key file made outside Windows will stop authenticating
      - A trust relation between domains built on the turned-away cipher may be broken
      - Devices with built-in software joined to the domain may lose the means of authenticating
      - Authentication stops working wholly rather than worsening by degrees
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W domenie pracują konta usługowe z plikiem klucza wygenerowanym poza systemem Windows
      - Utrzymywana jest relacja zaufania ustanowiona dawno, której typów szyfrowania nie sprawdzono
      - Nie zestawiono wykazu kont usługowych z typami szyfrowania, które każde z nich obsługuje
    en:
      - Service accounts with a key file made outside Windows work in the domain
      - A trust relation set up long ago is kept up and its encryption types were never checked
      - The list of service accounts was never set beside the encryption types each of them bears
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
      $name = 'SupportedEncryptionTypes'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2147483640'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
    $name = 'SupportedEncryptionTypes'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SupportedEncryptionTypes' -Value 2147483640 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-configure-encryption-types-allowed-for-kerberos

notes:
  pl: |
    Punkt podniosłem względem paczki stanowiska roboczego do klasy
    wymagającej świadomego wdrożenia. Powodem jest rola: serwer bywa
    stroną, wobec której uwierzytelniają się inne systemy, a wśród nich
    takie, które szyfrów blokowych nie obsługują.

    Wartość obejmuje szyfry blokowe oraz zakres zarezerwowany na
    przyszłe typy. Wykaz jest sumą bitów, więc każdy dopisany typ
    zmienia liczbę — sprawdzenie porównuje ją wprost i odmienną
    raportuje jako niezgodność.

    Na kontrolerze domeny punkt waży najwięcej, bo to on bilety
    wystawia. Rozpoznanie kont usługowych przeprowadź przed zmianą.
  en: |
    I raised the item to the class taking a knowing rollout against the working station's pack.
    The reason is the part: a server is at times the side other systems authenticate themselves
    towards, and among them such as bear no block ciphers.

    The value takes in the block ciphers and the range held back for future types. The list is a
    sum of bits, so every type written in changes the number - the check compares it outright
    and reports a differing one as non-compliance.

    On a domain controller the item weighs most, that being what issues the tickets. Make the
    reconnaissance of the service accounts before the change.
