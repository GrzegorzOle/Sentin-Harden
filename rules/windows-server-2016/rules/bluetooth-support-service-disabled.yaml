id: win2016-bluetooth-support-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi łączności bezprzewodowej bliskiego zasięgu wyłączona
    en: The support service for short range wireless connectivity disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obsługuje łączność bezprzewodową bliskiego zasięgu — parowanie
    urządzeń, utrzymywanie połączeń i wykrywanie sprzętu w pobliżu.

    Serwer nie ma powodu prowadzić takiej łączności i to jest punkt wyjścia.
    Nie chodzi o podatność konkretnego układu ani o konkretną wersję
    protokołu, tylko o to, że maszyna utrzymuje kanał radiowy, którego nikt
    nie zamawiał i którego zasięg nie kończy się na drzwiach serwerowni.

    Kanał ten jest inny od wszystkich pozostałych opisanych dotąd, bo nie
    prowadzi przez sieć. Zapora go nie widzi, podział na strefy go nie
    dotyczy, nadzór ruchu sieciowego nie zapisuje niczego. Kto chce się nim
    posłużyć, nie musi być w sieci organizacji — musi być w pobliżu.

    Wartość punktu jest więc w usunięciu powierzchni, której żadne inne
    zabezpieczenie nie obejmuje. Kategoria niska opisuje przy tym uczciwie
    prawdopodobieństwo: napastnik w zasięgu radiowym serwerowni ma zwykle
    łatwiejsze drogi niż ta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał do
    maszyny nieobjęty zaporą ani podziałem sieci, dostępny każdemu, kto
    znajdzie się w zasięgu.
  en: |
    The service serves short range wireless connectivity - the pairing of devices, the
    keeping up of connections and the discovery of hardware nearby.

    A server has no reason to carry on such connectivity, and that is the starting point.
    It is not a matter of a weakness in a particular chip or a particular version of the
    protocol, but of the machine keeping up a radio channel nobody ordered and whose reach
    does not end at the server room door.

    That channel is unlike all the others described so far, not leading as it does through
    the network. The firewall does not see it, the division into zones does not touch it,
    the monitoring of network traffic records nothing. Whoever would use it need not be on
    the organisation's network - they must be nearby.

    The item's worth therefore lies in removing a surface no other safeguard covers. The
    low category describes honestly the likelihood: an attacker within radio range of a
    server room has as a rule easier roads than this one.

    What an attacker gains while the item goes unmet: a channel to the machine covered
    neither by the firewall nor by the network's division, open to anyone who comes within
    range.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i powód jest praktyczny, nie
    techniczny.

    Jeżeli maszyna jest obsługiwana z konsoli, a klawiatura albo mysz są
    sparowane bezprzewodowo, wyłączenie usługi odbiera sterowanie. Nie jest
    to awaria, tylko utrata urządzeń wejściowych — i różnica ta przestaje
    być widoczna, gdy trzeba coś na tej maszynie zrobić.

    Jest to jedyny punkt w dotychczasowym zestawie, przy którym wykonujący
    może odciąć sam siebie od maszyny stojącej obok. Dlatego klasa stoi
    wyżej, niż wynikałoby z niskiej kategorii ryzyka: koszt pomyłki nie
    polega na niedostępności usługi, tylko na niemożności cofnięcia zmiany
    bez drugiego kompletu urządzeń.

    Sprawdzenie jest krótkie: jeżeli maszyna stoi w szafie, jest obsługiwana
    zdalnie i nie ma przy niej klawiatury, wdrożenie nie dotyka niczego.

    Drugi przypadek, rzadszy, to urządzenia pomiarowe albo czytniki
    łączące się tą drogą. Zdarza się to w zastosowaniach przemysłowych
    i warto o to zapytać, zanim się wykona.

    Czego to nie psuje: sieci przewodowej, urządzeń podłączonych kablem,
    usług, udziałów, uwierzytelniania, zarządzania zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and the reason is practical rather than
    technical.

    If the machine is attended at the console with a keyboard or mouse paired wirelessly,
    switching the service off takes the steering away. It is no failure but a loss of input
    devices - and that difference ceases to be visible when something has to be done on
    that machine.

    It is the only item in the set so far at which the one executing may cut themselves off
    from a machine standing beside them. For that the class stands higher than the low risk
    category would suggest: the cost of a mistake lies not in a service being unreachable
    but in the change being impossible to undo without a second set of devices.

    The review is a short one: if the machine stands in a cabinet, is attended from afar
    and has no keyboard by it, the rollout touches nothing.

    The second case, rarer, is measuring devices or readers joining by this road. That
    happens in industrial uses and is worth asking after before execution.

    What this does not break: the wired network, devices joined by cable, services, shares,
    authentication, or remote management.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Klawiatura i mysz sparowane bezprzewodowo przestają działać, a maszyna obsługiwana z konsoli traci sterowanie
      - Cofnięcie zmiany wymaga wtedy drugiego kompletu urządzeń podłączonych kablem
      - Urządzenia pomiarowe i czytniki łączące się tą drogą tracą połączenie, co zdarza się w zastosowaniach przemysłowych
      - Sieć przewodowa, urządzenia podłączone kablem, usługi i udziały pozostają bez zmian
    en:
      - A keyboard and mouse paired wirelessly stop working, and a machine attended at the console loses its steering
      - Undoing the change then calls for a second set of devices joined by cable
      - Measuring devices and readers joining by this road lose their connection, which happens in industrial uses
      - The wired network, devices joined by cable, services and shares stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana z konsoli, a klawiatura albo mysz są sparowane bezprzewodowo i nie ma zamiennika na kablu
      - Do maszyny łączą się tą drogą urządzenia pomiarowe albo czytniki używane w pracy
    en:
      - The machine is attended at the console with a keyboard or mouse paired wirelessly and there is no wired replacement
      - Measuring devices or readers used in the work join the machine by this road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'bthserv' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Keyboards and mice paired this way stop working. If the machine is
    # attended at the console, make sure a wired pair is at hand first.
    Stop-Service -Name 'bthserv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'bthserv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'bthserv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/bluetooth/

notes:
  pl: |
    Punkt otwiera blok o usługach stanowiska roboczego, które na serwerze
    nie mają zastosowania, a mimo to pracują, bo pochodzą ze wspólnego
    jądra. Jest to blok najlżejszy z dotychczasowych pod względem ryzyka
    i najcięższy pod względem liczby punktów — dlatego wart osobnego
    potraktowania w sortowaniu.

    Ten punkt jest w bloku wyjątkiem i warto to nazwać. Pozostałe idą hurtem
    i nic nie kosztują; ten jako jedyny może odciąć wykonującego od maszyny,
    przy której stoi. Zestawienie kategorii niskiej z klasą wymagającą
    świadomego wdrożenia wygląda niespójnie i takie nie jest: ryzyko mówi,
    ile zyskujemy, klasa mówi, czym ryzykujemy przy wykonaniu. Tutaj te dwie
    rzeczy rozchodzą się najdalej w całym zestawie.

    Kanał pozasieciowy warto pokazać jako właściwość wyróżniającą. Wszystkie
    inne powierzchnie opisane dotąd da się ograniczyć zaporą albo podziałem
    sieci. Tej nie da się — i to jest jedyny argument, jaki ten punkt ma,
    za to argument, którego nie ma żaden inny.
  en: |
    The item opens the block about workstation services that have no use on a server and
    work for all that, coming as they do from a shared kernel. It is the lightest block so
    far in risk and the heaviest in the number of items - and for that worth separate
    handling in the sorting.

    This item is the exception in the block and that is worth naming. The rest go in bulk
    and cost nothing; this one alone may cut the one executing off from a machine they
    stand beside. Pairing a low category with a class needing a planned rollout looks
    inconsistent and is not: the risk says how much we gain, the class says what we risk in
    the execution. Here those two part company furthest in the whole set.

    The channel outside the network is worth showing as a distinguishing property. All the
    other surfaces described so far can be limited by a firewall or by the network's
    division. This one cannot - and that is the only argument this item has, but an
    argument no other has.
