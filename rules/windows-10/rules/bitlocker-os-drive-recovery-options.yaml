id: win10-bitlocker-os-drive-recovery-options

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysku systemowego ustalony
    en: The way of recovering access to the system drive settled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, w jaki sposób odzyskuje się dostęp do
    zaszyfrowanego dysku systemowego i gdzie trafia klucz.

    Jest to punkt, bez którego całe szyfrowanie jest zakładem. Klucz
    odzyskiwania powstaje raz, w chwili włączenia szyfrowania, i jest
    jedynym sposobem dostania się do danych po zmianie w rozruchu albo po
    zapomnieniu kodu. Zapisany na kartce w szufladzie nie zabezpiecza
    niczego; zapisany na tym samym dysku nie istnieje w chwili, w której
    jest potrzebny.

    Wymaganie jest tu jednoznaczne: hasło odzyskiwania zapisywane
    w katalogu domenowym, a szyfrowanie nierozpoczynane, dopóki zapis się
    nie powiedzie. Jest to jedyny układ, w którym klucz jest osiągalny dla
    obsługi i nieosiągalny dla tego, kto zabrał maszynę.

    Odnotowuję, że punkt jest jedną decyzją zapisaną w ośmiu wartościach.
    Sprawdzenie czyta je razem i wymienia te, które odstają — bo maszyna
    ustawiona w połowie wygląda z zewnątrz tak samo jak ustawiona
    w całości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: klucz
    odzyskiwania przechowywany w miejscu przypadkowym albo nieprzechowywany
    wcale.
  en: |
    The setting settles in what manner the way into an enciphered system drive is recovered and where the key
    goes.

    It is the item without which the whole enciphering is a wager. The key of recovery comes about once, at the
    hour the enciphering is switched on, and is the only means of getting to the data after a change in the start
    or after a forgotten code. Written upon a slip in a drawer it secures nothing; written upon that same disk it
    is not there at the hour it is needed.

    The requirement is here plain: the password of recovery written into the domain directory, and the enciphering
    not begun until that writing has come through. It is the one arrangement in which the key is within the
    support's reach and outside the reach of whoever carried the machine off.

    I set down that the item is one decision written in eight values. The check reads them together and names
    those that differ - a machine set halfway looking from outside just like one set whole.

    What an attacker gains while the item goes unmet: a key of recovery kept in a chance place, or not kept at
    all.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo wymaga infrastruktury, której
    nie da się dorobić w dniu zmiany.

    Warunkiem jest katalog domenowy przygotowany do przechowywania kluczy
    oraz procedura po stronie obsługi: kto ma dostęp do klucza, jak go
    wydaje i jak sprawdza tożsamość proszącego. Bez tej drugiej części
    klucz jest osiągalny, ale nie ma komu go wydać.

    Po zmianie szyfrowanie nie rozpocznie się na maszynie, która nie
    zdoła zapisać klucza. Jest to zachowanie zamierzone i chroni przed
    najgorszym wariantem — dyskiem zaszyfrowanym, którego klucza nie ma
    nigdzie — ale w praktyce znaczy, że maszyna poza domeną nie zaszyfruje
    się wcale.

    Odnotowuję, że zmiana dotyczy szyfrowania zakładanego po jej
    wprowadzeniu. Dyski już zaszyfrowane zachowują dotychczasowe klucze
    i trzeba je zapisać osobno — inaczej raport pokaże stan zgodny przy
    maszynach, których klucza nikt nie ma.

    Czego to nie psuje: pracy z zaszyfrowanym dyskiem, logowania,
    wydajności, udziałów plikowych, drukowania.
  en: |
    The class is "needs a planned rollout", calling as it does for an estate that cannot be got up on the day of
    the change.

    The condition is a domain directory made ready to keep the keys, and a procedure upon the support's side: who
    has the way to a key, how they hand it out and how they prove the asker's name. Without that second part the
    key is within reach but there is nobody to hand it out.

    After the change the enciphering will not begin upon a machine that cannot write the key. It is meant
    behaviour and guards against the worst variant - an enciphered disk whose key is nowhere - but in practice it
    means a machine outside the domain will not encipher at all.

    I set down that the change touches enciphering laid on after it was brought in. Disks already enciphered keep
    the keys they had and those have to be written down apart - otherwise the report will show a compliant state
    upon machines whose key nobody holds.

    What this does not break: work with an enciphered disk, logging on, speed, file shares, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Maszyna poza domeną nie zaszyfruje się wcale, bo nie zdoła zapisać klucza do katalogu
      - Dyski już zaszyfrowane zachowują dotychczasowe klucze i wymagają zapisania ich osobno
      - Raport pokaże wtedy stan zgodny przy maszynach, których klucza nikt nie ma
      - Potrzebna jest procedura po stronie obsługi — kto wydaje klucz i jak sprawdza tożsamość proszącego
      - Praca z zaszyfrowanym dyskiem, logowanie, wydajność, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A machine outside the domain will not encipher at all, being unable to write the key into the directory
      - Disks already enciphered keep the keys they had and call for those to be written down apart
      - The report will then show a compliant state upon machines whose key nobody holds
      - A procedure upon the support s side is needed - who hands the key out and how they prove the asker s name
      - Work with an enciphered disk, logging on, speed, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny nie należą do domeny i nie ma katalogu, w którym klucze mogłyby zostać zapisane
      - Nie ma procedury wydawania klucza, więc zapisany klucz i tak nie trafi do proszącego
    en:
      - The machines do not belong to a domain and there is no directory in which the keys could be written
      - There is no procedure for the handing out of a key, so a written key will not reach the asker anyway
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are read
      # at once and whichever differs is named in the result. Reading them apart
      # would let a machine set halfway pass as set.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        OSRecovery                     = 1
        OSManageDRA                    = 0
        OSRecoveryPassword             = 1
        OSRecoveryKey                  = 0
        OSHideRecoveryPage             = 1
        OSActiveDirectoryBackup        = 1
        OSActiveDirectoryInfoToStore   = 1
        OSRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'OSRecovery', 'OSManageDRA', 'OSRecoveryPassword', 'OSRecoveryKey',
      'OSHideRecoveryPage', 'OSActiveDirectoryBackup',
      'OSActiveDirectoryInfoToStore', 'OSRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One decision written in several values, so they go in together. Setting a
    # part of them describes a way of recovery that is settled only halfway.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      OSRecovery                     = 1
      OSManageDRA                    = 0
      OSRecoveryPassword             = 1
      OSRecoveryKey                  = 0
      OSHideRecoveryPage             = 1
      OSActiveDirectoryBackup        = 1
      OSActiveDirectoryInfoToStore   = 1
      OSRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w tym bloku najważniejsza dla bezpieczeństwa danych,
    choć nie dotyczy samego szyfrowania. Rozstrzyga, czy dane da się
    odzyskać, gdy coś pójdzie nie tak — a przy szyfrowaniu idzie nie tak
    regularnie, bez żadnego udziału napastnika.

    Argument wart zachowania dotyczy tego, że klucz powstaje raz.
    Nie da się go odtworzyć później, nie da się go wyprowadzić z hasła
    użytkownika i nie da się go odzyskać z samego dysku. Miejsce jego
    zapisania rozstrzyga o wszystkim, a decyzję podejmuje się w jedynej
    chwili, w której w ogóle można.

    Odnotowuję, że punkt jest jedną decyzją w ośmiu wartościach i że
    sprawdzenie czyta je razem. Maszyna ustawiona w połowie wygląda
    z zewnątrz jak ustawiona — i to jest dokładnie ten przypadek,
    w którym raport czytający wartości osobno wprowadzałby w błąd.
  en: |
    The rule is in this block the weightiest for the safety of data, though it does not touch the enciphering
    itself. It settles whether the data may be won back when something goes awry - and with enciphering things go
    awry regularly, with no attacker's doing at all.

    The argument worth keeping touches this, that the key comes about once. It cannot be built again later, cannot
    be drawn out of a user's password and cannot be won back from the disk itself. The place of its writing
    settles everything, and the decision is taken in the one hour at which it may be taken at all.

    I set down that the item is one decision in eight values and that the check reads them together. A machine set
    halfway looks from outside like one set whole - and that is just the case in which a report reading the values
    apart would mislead.
