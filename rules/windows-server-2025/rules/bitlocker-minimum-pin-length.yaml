id: win2025-bitlocker-minimum-pin-length

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Minimalna długość kodu odblokowującego dysk systemowy
    en: The least length of the code unlocking the system drive
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala najkrótszy dopuszczalny kod wpisywany przy starcie, żeby
    odblokować dysk systemowy.

    Zostawiam kategorię wysoką, ale z zastrzeżeniem, które trzeba przeczytać
    razem z oceną: ta ocena jest warunkowa. Punkt ma wartość wyłącznie tam,
    gdzie kod startowy w ogóle jest używany. Na serwerze, na którym
    dodatkowe uwierzytelnienie przy starcie nie zostało wdrożone — a w tej
    paczce piszę wprost, że na wielu serwerach nie powinno być — ta reguła
    nie robi nic. Jeżeli tamten punkt trafia do wyjątku, ten powinien
    trafić tam razem z nim, a nie zostać na liście jako czerwony drobiazg,
    którego nikt nie umie wytłumaczyć.

    Tam, gdzie kod jest używany, jego długość jest całą siłą tego
    zabezpieczenia i nie ma nic w zapasie. Kod startowy nie podlega
    blokadzie konta po kilku próbach ani opóźnieniu między próbami
    w sposób, na którym da się polegać, bo mechanizm działa przed
    systemem. Napastnik, który ma maszynę przed sobą, może próbować
    długo. Krótki kod nie jest więc kodem trochę słabszym — jest kodem,
    który wystarczy przepisać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zbiór
    możliwych kodów na tyle mały, że przejście go w całości jest
    kwestią cierpliwości, a nie umiejętności.
  en: |
    The item sets the shortest permissible code typed at startup to unlock
    the system drive.

    I keep the category high, but with a caveat that has to be read
    together with the rating: this rating is conditional. The item has
    value only where a startup code is used at all. On a server where
    additional authentication at startup has not been rolled out - and in
    this pack I say outright that on many servers it should not be - this
    rule does nothing. If that item goes into an exception, this one should
    go with it rather than stay on the list as a red trifle nobody can
    explain.

    Where the code is used, its length is the entire strength of that
    protection and there is nothing held in reserve. The startup code is
    not subject to account lockout after a few attempts, nor to a delay
    between attempts that can be relied on, because the mechanism works
    before the system. An attacker with the machine in front of them can
    keep trying for a long time. A short code is therefore not a slightly
    weaker code - it is a code that only needs to be worked through.

    What an attacker gains while the item goes unmet: a set of possible
    codes small enough that going through all of it is a matter of
    patience rather than skill.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać skutek, który na
    serwerze wygląda inaczej niż na stacji roboczej.

    Kod startowy na serwerze nie jest wpisywany na klawiaturze przy
    maszynie, tylko zwykle przez zdalną konsolę karty zarządzania. Ta
    konsola przenosi naciśnięcia klawiszy przez sieć zarządzania i robi to
    z opóźnieniem, a przy dłuższym kodzie łatwiej o zgubiony znak.
    Praktyczna konsekwencja jest taka, że wydłużenie kodu podnosi liczbę
    nieudanych prób wpisania — nie dlatego, że ktoś go nie pamięta, tylko
    dlatego, że kanał jest kiepski. Warto to sprawdzić na tej konkretnej
    karcie, zanim kod stanie się dłuższy, bo od tego zależy, czy
    odzyskiwanie maszyny o trzeciej w nocy będzie trwało minutę czy
    kwadrans.

    Drugi skutek jest organizacyjny. Zmiana obowiązuje przy ustawianiu
    nowego kodu, a nie zmienia kodów już ustawionych. Maszyny
    skonfigurowane wcześniej zachowają krótkie kody i będą raportowane
    jako zgodne, bo zgodny jest wpis, a nie stan. To jest to samo
    ograniczenie co przy trybie szyfrowania i wolę je powtórzyć, niż
    pozwolić, żeby zgodność zastąpiła stan faktyczny.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review" and want to point out an effect that
    looks different on a server than on a workstation.

    On a server the startup code is not typed on a keyboard at the machine
    but usually through the remote console of the management card. That
    console carries keystrokes over the management network and does so with
    a delay, and with a longer code a dropped character is easier. The
    practical consequence is that lengthening the code raises the number of
    failed entry attempts - not because anybody forgets it, but because the
    channel is poor. It is worth checking this on that particular card
    before the code gets longer, because it decides whether recovering the
    machine at three in the morning takes a minute or a quarter of an hour.

    The second effect is organisational. The change applies when a new code
    is set and does not alter codes already set. Machines configured
    earlier will keep their short codes and will be reported as compliant,
    because what is compliant is the entry, not the state. This is the same
    limitation as at the encryption mode item, and I would rather repeat it
    than let compliance stand in for the actual state.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Dłuższy kod wpisywany przez zdalną konsolę karty zarządzania częściej kończy się zgubionym znakiem
      - Odzyskiwanie maszyny w nocy trwa dłużej, jeżeli kanał konsoli jest kiepski, a kod długi
      - Zmiana nie dotyczy kodów już ustawionych, więc stare maszyny zachowają krótkie kody i wypadną zgodnie
      - Punkt nie robi nic tam, gdzie dodatkowe uwierzytelnienie przy starcie nie zostało wdrożone
    en:
      - A longer code typed through the management card's remote console ends in a dropped character more often
      - Recovering the machine at night takes longer if the console channel is poor and the code long
      - The change does not touch codes already set, so older machines keep short codes and come out compliant
      - The item does nothing where additional authentication at startup has not been rolled out
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dodatkowe uwierzytelnienie przy starcie zostało na tej maszynie świadomie odpuszczone i zapisane jako wyjątek
      - Nie sprawdzono, jak zdalna konsola karty zarządzania radzi sobie z wpisywaniem dłuższego kodu
    en:
      - Additional authentication at startup was deliberately declined on this machine and recorded as an exception
      - It has not been checked how the management card's remote console copes with entering a longer code
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # A value below the required one is reported together with its length, so
      # a machine set too leniently can be told from one with no setting at all.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'MinimumPIN'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -lt 7) { 'BELOW_MINIMUM ' + [int]$value }
        else { 'AT_OR_ABOVE_MINIMUM' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AT_OR_ABOVE_MINIMUM
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'MinimumPIN'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This applies to codes set from now on and does not alter codes already in
    # use. Where startup authentication was declined on this machine, decline
    # this item with it rather than leaving it red and unexplained.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MinimumPIN' -Value 7 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Ocena jest warunkowa: punkt ma wartość wyłącznie tam, gdzie kod
    startowy w ogóle jest używany. Jeżeli dodatkowe uwierzytelnienie przy
    starcie trafia do wyjątku, ten punkt powinien trafić tam razem z nim.

    Tam, gdzie kod jest używany, jego długość jest całą siłą tego
    zabezpieczenia. Kod nie podlega blokadzie po kilku próbach, bo
    mechanizm działa przed systemem — napastnik z maszyną przed sobą może
    próbować długo.

    Skutek specyficzny dla serwera: kod wpisuje się zwykle przez zdalną
    konsolę karty zarządzania, więc dłuższy kod to więcej zgubionych
    znaków i dłuższe odzyskiwanie w nocy.
  en: |
    The rating is conditional: the item has value only where a startup code
    is used at all. If additional authentication at startup goes into an
    exception, this item should go with it.

    Where the code is used, its length is the entire strength of that
    protection. The code is not subject to lockout after a few attempts,
    because the mechanism works before the system - an attacker with the
    machine in front of them can keep trying for a long time.

    An effect specific to a server: the code is usually typed through the
    management card's remote console, so a longer code means more dropped
    characters and slower recovery at night.
