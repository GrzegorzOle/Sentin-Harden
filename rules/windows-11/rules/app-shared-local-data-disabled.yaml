id: win11-app-shared-local-data-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Wspólny katalog danych aplikacji dla wszystkich użytkowników wyłączony
    en: A shared application data directory for every user switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Aplikacje pakietowe mają własne, oddzielone katalogi danych — każdy
    użytkownik swój, bez wglądu w cudzy. Jest to jedna z podstaw izolacji
    takich aplikacji i to ona sprawia, że dane jednej osoby nie wyciekają do
    drugiej przez program zainstalowany dla wszystkich.

    Ustawienie, którego dotyczy punkt, robi w tej izolacji wyłom. Aplikacja
    dostaje katalog wspólny, widoczny dla wszystkich użytkowników maszyny
    i zapisywalny przez wszystkich.

    Skutki są dwa i oba są istotne. Pierwszy to wyciek: co jedna osoba zapisze,
    druga przeczyta — a program zwykle zapisuje tam to, co przetwarza, łącznie
    z plikami roboczymi i identyfikatorami sesji. Drugi, poważniejszy, to
    zapis: użytkownik bez uprawnień może podłożyć plik, który przeczyta
    aplikacja pracująca w sesji kogoś innego, również administratora. Jest to
    gotowy sposób na przejście z jednego konta na drugie.

    Punkt zamyka tę możliwość. Aplikacje wracają do katalogów oddzielonych.
  en: |
    Packaged applications have their own separated data directories - each user
    theirs, with no sight of anyone else's. It is one of the foundations of such
    applications' isolation and it is what keeps one person's data from leaking to
    another through a program installed for everyone.

    The setting this item concerns breaches that isolation. An application gets a
    shared directory, visible to every user of the machine and writable by all of
    them.

    There are two effects and both matter. The first is leakage: what one person
    writes, another reads - and a program usually writes there what it is working on,
    working files and session identifiers included. The second, more serious, is
    writing: a user without privileges can plant a file that will be read by the
    application running in somebody else's session, an administrator's included. It
    is a ready means of crossing from one account to another.

    The item closes that off. Applications go back to separated directories.

disruption_description:
  pl: |
    Nic nie przestaje działać. Wpisywana wartość jest tą, która obowiązuje
    domyślnie — katalog wspólny trzeba było włączyć świadomie, a robi się to
    rzadko.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego i żadna aplikacja nie zmienia zachowania w chwili
    wdrożenia.

    Odczuwalne jest to wyłącznie tam, gdzie aplikacja pakietowa została
    napisana z założeniem, że dane są wspólne — na przykład narzędzie
    stanowiskowe na maszynie używanej zmianowo, przechowujące konfigurację
    wspólną dla wszystkich obsługujących. Taka aplikacja po wdrożeniu przestanie
    widzieć dane zapisane przez poprzednią zmianę i zachowa się jak
    uruchomiona pierwszy raz.

    Dane zapisane wcześniej w katalogu wspólnym nie znikają. Przestają być
    czytane, więc odzyskanie ich jest możliwe, ale wymaga sięgnięcia do
    katalogu bezpośrednio.

    Nie ma restartu.
  en: |
    Nothing stops working. The value written is the one that holds by default - a
    shared directory had to be switched on deliberately, and that is rarely done.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no application changing behaviour at the moment of the
    rollout.

    It is felt only where a packaged application was written assuming the data is
    shared - for instance a station tool on a machine used in shifts, keeping a
    configuration common to everyone working it. After the rollout such an
    application stops seeing data written by the previous shift and behaves as though
    started for the first time.

    Data written earlier into the shared directory does not vanish. It stops being
    read, so recovering it is possible but takes reaching into the directory
    directly.

    There is no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Aplikacja pakietowa licząca na wspólne dane przestanie widzieć to, co zapisali inni użytkownicy
      - Narzędzie stanowiskowe na maszynie używanej zmianowo zachowa się jak uruchomione pierwszy raz
      - Dane zapisane wcześniej w katalogu wspólnym pozostają na dysku, ale przestają być czytane
    en:
      - A packaged application counting on shared data stops seeing what other users wrote
      - A station tool on a machine used in shifts behaves as though started for the first time
      - Data written earlier into the shared directory stays on the disk but stops being read
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja pakietowa na maszynie używanej zmianowo przechowuje konfigurację wspólną dla wszystkich
    en:
      - A packaged application on a machine used in shifts keeps a configuration common to everyone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
      $name = 'AllowSharedLocalAppData'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
    $name = 'AllowSharedLocalAppData'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSharedLocalAppData' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/msix/desktop/desktop-to-uwp-behind-the-scenes

notes:
  pl: |
    Ścieżka wpisu prowadzi przez gałąź zasad do składnika zarządzającego stanem
    aplikacji pakietowych. Jest to ścieżka głębsza niż w większości reguł tej
    paczki i przy ręcznym sprawdzaniu łatwo zatrzymać się o poziom za wcześnie.

    Punkt dotyczy wyłącznie aplikacji pakietowych. Programy instalowane
    klasycznie mają własny sposób przechowywania danych i tego ustawienia nie
    dotyczy nic z tego, co tu opisano.

    Poziom drugi bierze się z tego, że ustawienie jest domyślnie wyłączone.
    Waga samego ryzyka jest wyższa, niż sugeruje poziom: przejście z konta na
    konto przez podłożony plik jest drogą realną, a nie teoretyczną.
  en: |
    The entry's path runs through the policies key to the component managing packaged
    applications' state. It is a deeper path than in most of this pack's rules and
    when checking by hand it is easy to stop one level too early.

    The item concerns packaged applications only. Programs installed the classic way
    have their own means of keeping data and nothing described here touches that
    setting.

    The second level comes from the setting being off by default. The weight of the
    risk itself is higher than the level suggests: crossing from account to account
    through a planted file is a real route rather than a theoretical one.
