id: win2025-special-admin-console-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konsoli awaryjnej dostępnej poza systemem wyłączona
    en: The emergency console service reachable outside the system disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę konsoli awaryjnej, dostępnej kanałem
    niezależnym od systemu operacyjnego — łączem szeregowym maszyny albo
    jego odpowiednikiem udostępnianym przez hipernadzorcę lub kartę
    zarządzania.

    Zostawiam kategorię wysoką i powód jest prosty do wyłożenia. Konsola
    ta daje polecenia wykonywane z najwyższymi uprawnieniami, a droga do
    niej prowadzi obok wszystkiego, co zwykle stoi na wejściu: obok
    logowania, obok zapory, obok polityk sieciowych. Kto ma dostęp do
    kanału, ma dostęp do maszyny, i nie jest to dostęp, który kończy się
    na czymkolwiek, co dałoby się doprecyzować uprawnieniami.

    Rzecz trzeba jednak postawić uczciwie, bo ryzyko nie leży w samej
    usłudze. Leży w tym, kto sięga do kanału. Jeżeli łącze szeregowe
    maszyny jest wyprowadzone na przełącznik konsolowy w serwerowni, do
    którego dostęp ma ten sam krąg ludzi, co do samych serwerów,
    zagrożenie jest teoretyczne. Jeżeli konsola hipernadzorcy stoi otworem
    dla szerszego grona niż administratorzy tej maszyny — a bywa tak
    często, bo uprawnienia do wirtualizacji nadaje się zespołami —
    to usługa ta jest po prostu drugim, nienadzorowanym wejściem
    administracyjnym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wiersz
    poleceń z najwyższymi uprawnieniami, osiągany kanałem, który nie
    przechodzi przez logowanie ani przez sieć maszyny.
  en: |
    The item switches off the service of the console of need, to be reached by a channel unbound to
    the working system - by the machine's row-wise link or its like dealt out by the overseer of
    machines or by the card of ruling.

    I leave the category high, and the ground is plain to set out. That console gives commands carried
    out with the highest leaves, and the road to it goes beside everything that commonly stands at the
    way in - beside the signing in, beside the wall of fire, beside the rules of the net. Whoever has
    a reach to the channel has a reach to the machine, and it is no reach that ends at anything that
    might be narrowed by leaves.

    The thing must be set honestly for all that, the hazard lying not in the service itself. It lies
    in who reaches to the channel. If the machine's row-wise link be led out to a console switch in
    the server room whereto the same ring of people has a reach as to the servers themselves, the
    threat is one of thought only. If the board of the overseer of machines stand open to a wider ring
    than the rulers of that machine - and so it often is, leaves to the making of machines by
    reckoning being given out by whole bands - then that service is simply a second, unwatched way in
    for ruling.

    What an attacker gains while the item goes unmet - a row of commands with the highest leaves,
    come at by a channel that goes neither through a signing in nor through the machine's net.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia wobec oceny dla stacji
    roboczej i robię to z powodu, który jest w tej paczce wyjątkowy.
    Przy pulpicie zdalnym, zarządzaniu poleceniami, powłoce zdalnej
    i routingu napisałem to samo zdanie: znaj drogę awaryjną, zanim
    ruszysz front maszyny. Ta reguła każe wyłączyć usługę, która na
    części serwerów jest dokładnie tą drogą awaryjną.

    Jest to jedyny punkt w paczce, który może unieważnić warunek
    postawiony przy kilku innych. Zastosowany bez namysłu razem z nimi —
    a wszystkie leżą w tym samym dziale — zostawia maszynę, do której
    nie ma jak wejść w chwili, gdy sieć przestanie działać. Dokładnie
    wtedy, kiedy konsola awaryjna jest do czegoś potrzebna.

    Kolejność jest więc odwrotna niż zwykle. Najpierw ustal, czym
    wchodzisz na tę maszynę, gdy nie odpowiada ona po sieci. Jeżeli
    odpowiedzią jest ta konsola, punkt ten jest kandydatem do zapisanego
    wyjątku, a właściwą pracą jest zawężenie dostępu do kanału, nie
    wyłączenie usługi. Jeżeli odpowiedzią jest konsola graficzna
    hipernadzorcy albo karta zarządzania z własnym logowaniem, usługa
    jest nadmiarowa i można ją wyłączyć.

    Samo zatrzymanie nie przerywa niczyjej pracy i nie odczuje go nikt
    w codziennym działaniu maszyny. Cały ciężar tej reguły leży w tym
    jednym rozstrzygnięciu, a nie w jej skutkach bieżących.

    Zmiana cofa się natychmiast, ale cofnąć ją trzeba tą samą maszyną,
    do której właśnie zamknięto drogę zapasową.
  en: |
    I raise the class to a witting rolling out, and I do so of a ground that is in this pack one of a
    kind. At the far-off board, at the ruling by commands, at the far-off shell and at the routing I
    wrote the same sentence - know the road of need before you stir the machine's front. This rule
    bids a service be switched off that upon some servers is just that road of need.

    It is the one item in the pack that may undo a warrant set at several others. Laid on without
    thought along with them - and they all lie in the same part - it leaves a machine there is no way
    into at the hour the net stops working. Just then, when a console of need is good for anything.

    The order is therefore the other way about than commonly. First settle wherewith you come onto
    that machine when it answers not over the net. If the answer be that console, this item is a
    likely one for a written-down exception, and the right work is the narrowing of the reach to the
    channel and not the switching off of the service. If the answer be the drawn board of the overseer
    of machines or a card of ruling with a signing in of its own, the service is over and above and
    may be switched off.

    The stopping itself breaks off nobody's work and nobody will feel it in the everyday working of
    the machine. The whole weight of this rule lies in that one settling and not in its outcomes of
    the day.

    The change is undone at once, but it must be undone by the very machine whose spare road was just
    shut.

implementation_consequences:
  impact_areas:
    - remote-management
    - boot-and-firmware
    - logging-and-audit
  what_breaks:
    pl:
      - Znika droga wejścia na maszynę w chwili, gdy nie odpowiada ona po sieci
      - Reguła może unieważnić warunek postawiony przy pulpicie zdalnym, powłoce zdalnej i routingu
      - Zastosowana razem z nimi zostawia maszynę, do której nie ma jak wejść
      - Cofnięcie zmiany wymaga wejścia na maszynę, której drogę zapasową właśnie zamknięto
      - Samo zatrzymanie nie przerywa niczyjej pracy w codziennym działaniu maszyny
    en:
      - The road onto the machine goes away at the hour it answers not over the net
      - The rule may undo a warrant set at the far-off board, at the far-off shell and at the routing
      - Laid on along with them it leaves a machine there is no way into
      - The undoing of the change takes a coming onto the machine whose spare road was just shut
      - The stopping itself breaks off nobody's work in the everyday working of the machine
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Konsola ta jest drogą wejścia na maszynę w razie braku odpowiedzi po sieci
      - Nie ustalono, czym wchodzi się na tę maszynę, gdy nie odpowiada ona po sieci
    en:
      - That console is the road onto the machine when it answers not over the net
      - It was not settled wherewith one comes onto that machine when it answers not over the net
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle first how you reach this machine when it stops answering on the
    # network. On some servers this console is that route, and other rules in
    # this section assume such a route exists.
    Stop-Service -Name 'sacsvr' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'sacsvr' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'sacsvr' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/sac

notes:
  pl: |
    Ryzyko nie leży w samej usłudze, tylko w tym, kto sięga do kanału.
    Łącze szeregowe wyprowadzone na przełącznik konsolowy w serwerowni
    to zagrożenie teoretyczne. Konsola hipernadzorcy otwarta dla
    szerszego grona niż administratorzy tej maszyny — a tak bywa często,
    bo uprawnienia do wirtualizacji nadaje się zespołami — to drugie,
    nienadzorowane wejście administracyjne.

    Jedyny punkt w paczce, który może unieważnić warunek postawiony przy
    kilku innych. Przy pulpicie zdalnym, zarządzaniu poleceniami,
    powłoce zdalnej i routingu powtarzam: znaj drogę awaryjną, zanim
    ruszysz front maszyny. Ta reguła każe wyłączyć usługę, która na
    części serwerów jest dokładnie tą drogą.

    Kolejność odwrotna niż zwykle: najpierw ustal, czym wchodzisz na
    maszynę, gdy nie odpowiada po sieci. Jeżeli tą konsolą — właściwą
    pracą jest zawężenie dostępu do kanału, nie wyłączenie usługi.
  en: |
    The hazard lies not in the service itself but in who reaches to the channel. A row-wise link led
    out to a console switch in the server room is a threat of thought only. A board of the overseer of
    machines open to a wider ring than the rulers of that machine - and so it often is, leaves to the
    making of machines by reckoning being given out by whole bands - is a second, unwatched way in for
    ruling.

    The one item in the pack that may undo a warrant set at several others. At the far-off board, at
    the ruling by commands, at the far-off shell and at the routing I say over - know the road of need
    before you stir the machine's front. This rule bids a service be switched off that upon some
    servers is just that road.

    The order the other way about than commonly - first settle wherewith you come onto the machine
    when it answers not over the net. If by that console - the right work is the narrowing of the
    reach to the channel and not the switching off of the service.
