id: win2025-error-reporting-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zgłaszania błędów wyłączona
    en: The error reporting service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę zgłaszania błędów. Usługa ta zbiera dane
    o programach, które przestały działać, i odsyła je poza maszynę.

    Zostawiam kategorię średnią i chcę powiedzieć, dlaczego na serwerze
    nie jest to punkt o prywatności, choć na stacji roboczej bywa tak
    czytany.

    Zgłoszenie o przerwanym programie nie jest notatką z nazwą programu.
    Zawiera fragment pamięci procesu z chwili, w której się zatrzymał.
    Na stacji roboczej jest to pamięć przeglądarki albo edytora tekstu.
    Na serwerze jest to pamięć procesu, który w tej chwili obsługiwał
    pracę: łańcuch połączenia z wpisanym hasłem, żeton sesji, fragment
    zapytania z danymi, bufor z zawartością pliku. Te rzeczy opuszczają
    maszynę w chwili awarii i nie ma w tym momencie nikogo, kto by na to
    spojrzał.

    Nie jest to więc pytanie „czy zgadzam się wysyłać dane o użyciu",
    tylko pytanie „co dokładnie wychodzi z tej maszyny, kiedy coś się
    na niej psuje, i czy wiem, dokąd".

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał,
    którym fragmenty pamięci procesów tej maszyny opuszczają ją
    samoczynnie, zwykle w najgorszym możliwym momencie.
  en: |
    The item switches off the service of the giving of word of faults. That service gathers data of
    the programs that stopped working and sends them off the machine.

    I leave the category middling and would say why upon a server it is no item of privacy, though
    upon a workstation it is at times so read.

    A word given of a broken-off program is no note bearing the program's name. It holds a piece of
    the mind of the working from the hour wherein it stood still. Upon a workstation that is the mind
    of a browser or of a writer of text. Upon a server it is the mind of a working that at that hour
    was serving work - a chain of binding with a word of passing written into it, a token of a
    sitting, a piece of an asking with data in it, a holding with the matter of a file. Those things
    leave the machine at the hour of the fault, and there is at that hour nobody to look upon it.

    It is therefore not the question "do I agree to send data of my using" but the question "what
    exactly goes out of that machine when something upon it breaks, and do I know whither".

    What an attacker gains while the item goes unmet - a channel whereby pieces of the mind of that
    machine's workings leave it of themselves, mostly at the worst hour there could be.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i scenariusz, który każe ją
    utrzymać, jest jeden, ale częsty i trudny do przewidzenia w chwili
    zmiany.

    Producenci oprogramowania serwerowego opierają na tym mechanizmie
    obsługę zgłoszeń. Kiedy aplikacja przestaje działać w sposób
    powtarzalny, pierwszym pytaniem ze strony wsparcia bywa prośba
    o zgłoszenie z tej maszyny. Wyłączona usługa znaczy, że zgłoszenia
    nie ma i nie da się go wytworzyć wstecz dla awarii, która już
    wystąpiła. Cena tej zmiany jest więc płacona nie w chwili jej
    wprowadzenia, tylko podczas następnej poważnej awarii — i płaci ją
    ktoś, kto o zmianie nie wiedział.

    Chcę też oddzielić dwie rzeczy, bo bywają mylone. Ten punkt dotyczy
    odsyłania zgłoszeń poza maszynę. Nie dotyczy zapisywania zrzutów
    awaryjnych na dysku, które konfiguruje się osobno i które po tej
    zmianie działa dalej. Diagnostyka miejscowa zostaje; znika droga na
    zewnątrz.

    Rozstrzygnięcie zależy więc od tego, czy istnieje ustalony sposób
    zbierania danych o awariach na miejscu. Jeżeli tak — zmiana jest
    czysta i warto ją zrobić. Jeżeli nie — najpierw ustal ten sposób,
    potem wyłączaj.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a checking", and the happening that bids it be held is one, but a common
    one and hard to foresee at the hour of the change.

    Makers of software for servers rest upon that working their serving of askings for help. When an
    application stops working in a way that may be brought about again, the first asking from the side
    of the help is at times a bidding for a word given off that machine. A switched-off service means
    that word is not there and may not be made after the fact for a fault that already befell. The
    price of that change is therefore paid not at the hour of its making but during the next weighty
    fault - and it is paid by somebody who knew nothing of the change.

    I would sunder two things as well, they being at times mistaken one for the other. This item bears
    on the sending of words of fault off the machine. It bears not on the writing down of castings of
    a fault upon the disk, which is set apart and which after that change works on. The looking into
    faults where they befell stays; the road outwards goes away.

    The settling hangs therefore upon whether there be a set way of gathering data of faults where
    they befall. If so - the change is clean and worth making. If not - settle that way first, then
    switch off.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Wsparcie producenta prosi o zgłoszenie z maszyny, a zgłoszenia nie ma i nie da się go wytworzyć wstecz
      - Cena zmiany jest płacona podczas następnej poważnej awarii, przez kogoś, kto o zmianie nie wiedział
      - Zapisywanie zrzutów awaryjnych na dysku konfiguruje się osobno i działa dalej po tej zmianie
      - Diagnostyka miejscowa zostaje, znika tylko droga na zewnątrz
      - Bez ustalonego sposobu zbierania danych o awariach na miejscu zmiana zostawia lukę
    en:
      - The maker's help asks for a word given off the machine, and it is not there and may not be made after the fact
      - The price of the change is paid during the next weighty fault, by somebody who knew nothing of the change
      - The writing down of castings of a fault upon the disk is set apart and works on after that change
      - The looking into faults where they befell stays, only the road outwards goes away
      - With no set way of gathering data of faults where they befall the change leaves a gap
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono sposobu zbierania danych o awariach na miejscu, bez odsyłania ich poza maszynę
      - Producent oprogramowania stojącego na tej maszynie opiera obsługę zgłoszeń na tym mechanizmie
    en:
      - No way was settled of gathering data of faults where they befall, without a sending of them off the machine
      - The maker of the software standing upon that machine rests its serving of askings for help upon that working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WerSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This closes the route out, not local crash dumps - those are configured
    # separately and keep working. Make sure some local way of collecting
    # crash data exists before removing the vendor's.
    Stop-Service -Name 'WerSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WerSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WerSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

