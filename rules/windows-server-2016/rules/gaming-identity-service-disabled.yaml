id: win2016-gaming-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa tożsamości platformy rozrywkowej wyłączona
    en: The identity service of the entertainment platform disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę obsługującą logowanie do platformy rozrywkowej
    wbudowanej w system.

    Uzasadnienie nie dotyczy samej rozrywki, tylko tego, czym ta usługa
    jest na maszynie serwerowej. Jest to składnik zajmujący się tożsamością:
    przechowuje żetony, odnawia je i łączy się w tej sprawie na zewnątrz.
    Każdy składnik trzymający żetony i sięgający po nie do sieci jest
    miejscem wartym uwagi, niezależnie od tego, czemu służy.

    Rzecz druga dotyczy obecności. Usługa ta jest na serwerze włączona
    przez to, że system przynosi ją ze sobą, a nie przez to, że ktoś jej
    potrzebuje. Jest to kod utrzymywany, łatany i uruchamiany, któremu nikt
    nie zadał zadania. Wyłączenie go jest porządkiem, nie poświęceniem.

    Punkt jest pierwszym z trzech dotyczących tej samej platformy. Trzy
    usługi dzielą jej obsługę między siebie i wyłączenie jednej nie
    wyłącza pozostałych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działający
    składnik obsługujący żetony tożsamości i łączący się na zewnątrz tam,
    gdzie nikt go o to nie prosił.
  en: |
    The item switches off the service attending the signing in to the entertainment platform built into
    the system.

    The warrant concerns not the entertainment itself but what that service is on a server machine. It
    is a component busied with identity: it holds tokens, renews them and connects outward in that
    matter. Every component holding tokens and reaching for them over the network is a place worth
    attention, whatever it serves.

    The second matter concerns presence. That service is switched on upon a server because the system
    brings it along, not because anybody needs it. It is code kept up, patched and started, to which
    nobody has set a task. Switching it off is order and not a sacrifice.

    The item is the first of three concerning that same platform. Three services part its attendance
    between them, and switching one off does not switch the rest off.

    What an attacker gains while the item goes unmet: a working component attending identity tokens and
    connecting outward where nobody asked it to.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na serwerze usługa ta nie ma zadania. Nie korzysta z niej żadna rola,
    żadna aplikacja serwerowa i żaden mechanizm systemowy poza platformą,
    której na serwerze się nie używa.

    Jedyny przypadek warty wymienienia dotyczy maszyn używanych przez kogoś
    jak stanowisko robocze. Bywa to serwer terminalowy albo maszyna
    wirtualna wydana człowiekowi do pracy. Tam logowanie do platformy
    przestanie działać, a objawem będzie komunikat o niemożności
    zalogowania, nie o wyłączonej usłudze.

    Nie ma innych znanych regresji.

    Czego to nie psuje: logowania do systemu, kont domenowych, sieci,
    aplikacji serwerowych, ról, aktualizacji.

    Wymaga zatrzymania usługi; cofnięcie natychmiastowe.
  en: |
    The class is "no disruption".

    On a server that service has no task. No role, no server application and no mechanism of the system
    uses it beyond the platform that is not used on a server.

    The one case worth naming concerns machines somebody uses as a workstation. It may be a terminal
    server or a virtual machine handed to a person for work. There the signing in to the platform will
    cease to work, and the symptom will be a message about an inability to sign in rather than about a
    switched-off service.

    There are no other known regressions.

    What this does not break: logging on to the system, domain accounts, the network, server
    applications, roles, or updates.

    Calls for a service to be stopped; the undoing is immediate.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Na maszynie używanej przez kogoś jak stanowisko robocze logowanie do platformy rozrywkowej przestaje działać
      - Objawem jest komunikat o niemożności zalogowania, a nie o wyłączonej usłudze
      - Dwie pozostałe usługi tej samej platformy działają dalej, bo każda ma osobne ustawienie
      - Logowanie do systemu, konta domenowe, aplikacje serwerowe i role pozostają bez zmian
    en:
      - On a machine somebody uses as a workstation the signing in to the entertainment platform ceases to work
      - The symptom is a message about an inability to sign in rather than about a switched-off service
      - The two remaining services of that same platform work on, each having a setting of its own
      - Logging on to the system, domain accounts, server applications and roles stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest wydana komuś do pracy jak stanowisko robocze i platforma rozrywkowa jest na niej używana
    en:
      - The machine is handed to somebody for work as a workstation and the entertainment platform is used on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'XblAuthManager' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a server this service has no task at all. Where the machine is used as
    # a workstation by somebody, the entertainment platform stops signing in.
    Stop-Service -Name 'XblAuthManager' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XblAuthManager' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'XblAuthManager' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/svchost-service-refactoring

notes:
  pl: |
    Punkt otwiera blok o składnikach, które serwer przynosi ze sobą,
    a których nikt na nim nie zamawiał. Blok ten jest w całym zestawie
    najlżejszy we wdrożeniu i warto to powiedzieć wprost, zamiast
    udawać, że każda reguła waży tyle samo.

    Kategoria niska jest tu postawiona uczciwie. Napastnik nie zyskuje przy
    niespełnieniu tego punktu drogi wejścia; zyskuje obecność kodu, który
    mógłby być nieobecny. Wartość reguły leży w tym, że powierzchnia
    maszyny ma odpowiadać jej roli — i to jest cały argument, bez
    naciągania.

    Warto pokazać, że platforma ta jest obsługiwana przez kilka usług
    o osobnych ustawieniach. Użytkownik, który wyłączy jedną i zobaczy
    pozostałe nadal uruchomione, ma prawo sądzić, że zmiana nie zadziałała.

    Odnotowuję, że na tej wersji systemu nie ma usługi obsługującej
    akcesoria tej platformy — pojawiła się w wydaniach późniejszych.
    Zestaw dla tej platformy liczy tu trzy pozycje, nie cztery.
  en: |
    The item opens the block about components a server brings along and which nobody ordered upon it.
    That block is in the whole set the lightest in the rolling out, and that is worth saying outright
    rather than pretending every rule weighs the same.

    The low category is set here honestly. An attacker gains at this item's going unmet no road in; they
    gain the presence of code that might be absent. The rule's value lies in the machine's surface
    answering to its role - and that is the whole argument, with no straining.

    It is worth showing that the platform is attended by several services with settings of their own. A
    user who switches one off and sees the rest still running has a right to hold that the change did not
    take.

    Worth noting that on this version of the system there is no service attending that platform's
    accessories - it appeared in later releases. The set for that platform counts here three entries and
    not four.
