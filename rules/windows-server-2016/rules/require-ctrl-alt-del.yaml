id: win2016-require-ctrl-alt-del

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kombinacja klawiszy wymagana przed logowaniem
    en: Key combination required before signing in
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby przed pokazaniem pól logowania trzeba było nacisnąć
    ustaloną kombinację klawiszy.

    Mechanizm wygląda na relikt i bywa tak traktowany, ale broni przed czymś
    konkretnym i do dziś niczym niezastąpionym. Ta kombinacja jest przechwytywana
    przez jądro systemu i żaden zwykły program nie może jej przejąć. Naciśnięcie
    jej gwarantuje, że pola, które się pojawią, należą do systemu, a nie do
    programu, który tylko wygląda jak ekran logowania.

    Podstawiony ekran logowania jest atakiem starym i wciąż skutecznym, bo nie
    wymaga żadnej luki — wystarczy program uruchomiony w kontekście użytkownika,
    rysujący okno na pełnym ekranie. Bez wymuszonej kombinacji nie ma sposobu,
    żeby odróżnić go od prawdziwego ekranu. Hasło wpisane w takie okno jest
    hasłem oddanym.

    Na serwerze scenariusz jest węższy niż na stacji roboczej, ale nie znika.
    Dotyczy maszyn z konsolą dostępną fizycznie albo przez hipernadzorcę oraz
    serwerów, na których ktoś pozostawił otwartą sesję — podstawiony ekran
    blokady wygląda wtedy dokładnie tak, jak powinien.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zebrania hasła wprost od osoby, która wpisuje je w dobrej wierze, bez
    potrzeby łamania czegokolwiek.
  en: |
    The item requires that before the sign-in fields are shown a set key combination
    must be pressed.

    The mechanism looks like a relic and is at times treated as one, but it defends
    against something definite and to this day unreplaced. That combination is
    caught by the system's kernel and no ordinary program can take it over. Pressing
    it guarantees that the fields which appear belong to the system and not to a
    program that merely looks like a sign-in screen.

    A substituted sign-in screen is an old attack and still an effective one,
    because it calls for no flaw at all - a program running in the user's context
    and drawing a full-screen window suffices. Without the enforced combination
    there is no way to tell it from the real screen. A password typed into such a
    window is a password given away.

    On a server the scenario is narrower than on a workstation but does not
    disappear. It concerns machines with a console reachable physically or through
    the hypervisor, and servers where somebody has left a session open - a
    substituted lock screen looks then exactly as it should.

    What an attacker gains while the item goes unmet: the chance to collect a
    password straight from a person typing it in good faith, with no need to break
    anything.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Dla człowieka przy klawiaturze zmiana jest
    jednym dodatkowym naciśnięciem. Kłopot leży gdzie indziej — w dostępie
    zdalnym.

    Kombinacji tej nie da się po prostu nacisnąć w oknie sesji zdalnej, bo
    przechwytuje ją system, przy którym się siedzi. Klient pulpitu zdalnego
    udostępnia zastępczą kombinację i radzi sobie z tym bez problemu. Gorzej
    radzą sobie konsole zarządzania sprzętem i hipernadzorców: część z nich ma
    osobny przycisk do wysłania tej sekwencji, część ma go schowany w menu,
    a część nie ma go wcale.

    To jest właściwy scenariusz do sprawdzenia przed zmianą, i sprawdza się go
    raz — w konsoli, z której faktycznie korzysta zespół utrzymania. Odkrycie
    tego po zmianie, w trakcie awarii, przy maszynie bez działającej sieci, jest
    najgorszym możliwym momentem.

    Osobno trzeba spojrzeć na logowanie automatyczne, jeśli jest na maszynie
    skonfigurowane. Wymuszona kombinacja je przerywa i maszyna zatrzyma się na
    ekranie logowania po restarcie.

    Czego to nie psuje: logowania przez pulpit zdalny, sesji już otwartych,
    kont usług ani zadań zaplanowanych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". For a person at the keyboard the change is one
    extra press. The trouble lies elsewhere - in remote access.

    That combination cannot simply be pressed in a remote session window, because it
    is caught by the system one is sitting at. The remote desktop client offers a
    substitute combination and copes with this without trouble. Coping less well are
    the management consoles of hardware and of hypervisors: some have a separate
    button for sending the sequence, some have it hidden in a menu, and some do not
    have it at all.

    That is the proper scenario to check before the change, and it is checked once -
    in the console the maintenance team actually uses. Discovering it after the
    change, during a fault, at a machine with no working network, is the worst
    possible moment.

    Automatic sign-in, if configured on the machine, has to be looked at separately.
    The enforced combination interrupts it and the machine will stop at the sign-in
    screen after a restart.

    What this does not break: signing in over remote desktop, sessions already open,
    service accounts, or scheduled tasks.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-management
    - accounts-and-passwords
  what_breaks:
    pl:
      - Konsola zarządzania sprzętem albo hipernadzorcy może nie mieć sposobu na wysłanie tej sekwencji do maszyny
      - Logowanie automatyczne przestaje działać i maszyna zatrzymuje się na ekranie logowania po restarcie
      - Każde logowanie do konsoli wymaga jednego dodatkowego naciśnięcia klawiszy
      - Pulpit zdalny, sesje już otwarte, konta usług i zadania zaplanowane pozostają bez zmian
    en:
      - The management console of the hardware or the hypervisor may have no way of sending this sequence to the machine
      - Automatic sign-in stops working and the machine halts at the sign-in screen after a restart
      - Every sign-in at the console calls for one extra press of the keys
      - Remote desktop, sessions already open, service accounts and scheduled tasks stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie sprawdzono, czy konsola zarządzania używana przez zespół utrzymania potrafi wysłać tę sekwencję
      - Maszyna korzysta z logowania automatycznego, które po zmianie przestanie działać
    en:
      - It has not been checked whether the management console the maintenance team uses can send this sequence
      - The machine uses automatic sign-in, which will stop working after the change
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'DisableCAD'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'DisableCAD'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is the compliant value here: the name of the setting speaks of switching
    # the combination off, so requiring it means leaving that switch at nought.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableCAD' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-do-not-require-ctrl-alt-del

notes:
  pl: |
    Nazwa ustawienia w rejestrze mówi o wyłączeniu kombinacji, więc wartością
    zgodną jest zero, a nie jedynka. Jest to jedna z niewielu reguł w tym
    zestawie, w której zero oznacza stan pożądany — warto o tym pamiętać przy
    czytaniu wyniku audytu.

    Brak wartości w rejestrze oznacza zachowanie domyślne, a to zależy od roli
    maszyny i od tego, jak została przygotowana. Reguła zgłasza wtedy stan
    niespełniony i jest to celowe: ustawienie ma być zapisane wprost, żeby
    późniejsza zmiana wzorca instalacji go nie odwróciła.

    Punkt czyta się razem z regułą o ukryciu nazwy ostatniego użytkownika —
    obie dotyczą tego samego ekranu i obie mają sens głównie tam, gdzie do
    konsoli dociera ktoś spoza zespołu utrzymania.
  en: |
    The setting's name in the registry speaks of switching the combination off, so
    the compliant value is nought and not one. This is one of the few rules in this
    set where nought means the wanted state - worth keeping in mind when reading the
    audit's result.

    The absence of the value in the registry means the default behaviour, and that
    depends on the machine's role and on how it was prepared. The rule then reports
    the state as unmet, and that is deliberate: the setting is to be written
    outright, so that a later change of the installation pattern does not reverse
    it.

    The item reads together with the rule on hiding the last user's name - both
    concern the same screen, and both make sense chiefly where somebody from outside
    the maintenance team reaches the console.
