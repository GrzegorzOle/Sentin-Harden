id: win11-peer-networking-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania tożsamościami w sieci równorzędnej wyłączona
    en: The identity manager service for peer networking disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zakłada i przechowuje tożsamości używane w łączności równorzędnej.
    Tożsamość taka to para kluczy wytworzona na maszynie razem z nazwą, którą
    maszyna posługuje się wobec innych uczestników. Na niej opiera się
    członkostwo w grupach i na niej opiera się zaufanie między maszynami.

    Rzecz, którą trzeba tu powiedzieć wprost, dotyczy pochodzenia tego
    zaufania. Tożsamość powstaje na maszynie, na żądanie programu, bez udziału
    kogokolwiek, kto zarządza kontami w organizacji. Nie ma wystawcy, którego
    dałoby się cofnąć, nie ma listy, na której taka tożsamość figuruje, i nie
    ma miejsca, w którym administrator zobaczyłby, że powstała.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: równoległy
    system tożsamości, działający obok tego, którym organizacja się posługuje,
    i niewidoczny z żadnego z narzędzi, którymi organizacja go dogląda.
    Wyłączenie kont w katalogu nie odbiera dostępu do grup opartych na tych
    tożsamościach, bo te dwa światy nie mają ze sobą nic wspólnego.

    Usługa jest podstawą pozostałych składników łączności równorzędnej:
    bez tożsamości nie powstanie grupa. Jest to więc najniższy poziom tego
    mechanizmu i najskuteczniejsze miejsce, żeby go zamknąć.
  en: |
    The service sets up and keeps the identities used in peer connectivity. Such an
    identity is a pair of keys made on the machine together with the name the machine
    goes by among other participants. Membership of groups rests on it, and so does trust
    between machines.

    What has to be said outright here concerns where that trust comes from. An identity
    comes into being on the machine, at a program's request, with no involvement of
    anybody who manages accounts in the organisation. There is no issuer whose issue
    could be withdrawn, no list on which such an identity appears, and no place where an
    administrator would see that it had been made.

    What an attacker gains while the item goes unmet: a parallel system of identities,
    working alongside the one the organisation uses and invisible from any of the tools
    with which the organisation watches over it. Disabling accounts in the directory does
    not take away access to groups resting on these identities, because the two worlds
    have nothing to do with one another.

    The service is the foundation of the other peer connectivity components: with no
    identity, no group comes into being. So it is the lowest level of this mechanism and
    the most effective place at which to close it.

disruption_description:
  pl: |
    Sprawdzenia wymagają te same zastosowania, co przy pozostałych składnikach
    łączności równorzędnej, bo usługa jest ich podstawą.

    Skutek jest jednak szerszy niż przy tamtych i to jest różnica warta
    zauważenia. Wyłączenie rozwiązywania nazw zostawia grupy istniejące, tylko
    trudniej osiągalne. Wyłączenie tej usługi odbiera podstawę: bez tożsamości
    nie da się ani utworzyć grupy, ani do niej przystąpić, ani potwierdzić
    członkostwa w grupie utworzonej wcześniej.

    W praktyce oznacza to, że pomoc zdalna zestawiana krótkim hasłem i starsze
    narzędzia współpracy przestają działać niezależnie od stanu pozostałych
    usług tej rodziny. Jeżeli celem jest zamknięcie całego mechanizmu jednym
    ruchem, to właśnie ta reguła robi najwięcej.

    Tożsamości utworzone wcześniej zostają na maszynie i nie są usuwane.
    Po cofnięciu zmiany wracają razem z usługą, bez zakładania ich od nowa.

    Zmiana wymaga zatrzymania usługi.
  en: |
    The same uses need checking as with the other peer connectivity components, since the
    service is their foundation.

    The effect is wider than with those, though, and that is a difference worth noting.
    Disabling the resolving of names leaves groups in being, only harder to reach.
    Disabling this service takes away the foundation: with no identity a group can
    neither be made, nor joined, nor membership of one made earlier confirmed.

    In practice that means remote help set up with a short password and older
    collaboration tools stop working whatever the state of this family's other services.
    If the aim is to close the whole mechanism in one move, it is this rule that does
    most.

    Identities made earlier stay on the machine and are not removed. Once the change is
    undone they come back together with the service, with no setting up afresh.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Utworzenie grupy maszyn w sieci równorzędnej i przystąpienie do niej przestaje być możliwe
      - Pomoc zdalna zestawiana krótkim hasłem zamiast pliku zaproszenia przestaje działać
      - Program branżowy oparty na łączności równorzędnej traci podstawę członkostwa w grupie
      - Tożsamości utworzone wcześniej zostają na maszynie i wracają po cofnięciu zmiany
    en:
      - Making a group of machines in peer networking and joining one stops being possible
      - Remote help set up with a short password instead of an invitation file stops working
      - A line-of-business program resting on peer connectivity loses the basis of its group membership
      - Identities made earlier stay on the machine and come back once the change is undone
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Program branżowy opiera członkostwo w grupie na tożsamościach tego mechanizmu
      - Pomoc zdalna prowadzona jest wariantem z krótkim hasłem zamiast pliku zaproszenia
    en:
      - A line-of-business program rests group membership on this mechanism's identities
      - Remote help is given in the variant with a short password instead of an invitation file
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'p2pimsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2pimsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'p2pimsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-identity-manager

notes:
  pl: |
    Usługa jest podstawą pozostałych składników łączności równorzędnej.
    Jeżeli wdraża się tylko część czwórki, ta powinna być pierwsza — zdejmuje
    najwięcej i nie wymaga, by pozostałe zostały wyłączone wcześniej.

    Mimo to pozostałe trzy reguły pozostają potrzebne. Ich zapis w rejestrze
    trwa niezależnie od tej usługi i mechanizm wraca w całości, gdy ta
    zostanie kiedykolwiek włączona z powrotem.

    Na maszynie bez zainstalowanego składnika łączności równorzędnej usługi
    nie ma i audyt zwróci wynik „nie dotyczy".

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The service is the foundation of the other peer connectivity components. If only part
    of the quartet is applied, this should be the first - it takes away most and does not
    require the others to have been disabled first.

    The other three rules stay needed all the same. Their registry entries last whatever
    this service does, and the mechanism comes back whole should this one ever be
    switched on again.

    On a machine with no peer connectivity component installed the service is absent and
    the audit returns "not applicable".

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
