id: win2016-create-symbolic-links-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie dowiązań symbolicznych tylko dla administratorów
    en: Creating symbolic links restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do tworzenia dowiązań symbolicznych do grupy
    administratorów lokalnych.

    Dowiązanie symboliczne to wpis w systemie plików, który wskazuje na inną
    ścieżkę. Program otwierający dowiązanie trafia tam, gdzie ono prowadzi,
    i zwykle się o tym nie dowiaduje — na tym polega jego użyteczność i na tym
    polega problem.

    Atak wygląda tak: uprzywilejowany proces zapisuje plik do katalogu, w którym
    zwykły użytkownik może tworzyć wpisy — na przykład do katalogu tymczasowego.
    Napastnik podstawia tam wcześniej dowiązanie o spodziewanej nazwie,
    prowadzące do pliku systemowego. Proces, który działa z pełnymi
    uprawnieniami, zapisuje wtedy nie tam, gdzie zamierzał.

    Kategoria wysoka, bo to jest gotowa droga eskalacji uprawnień, wymagająca
    jednak dodatkowego warunku w postaci procesu piszącego w przewidywalne
    miejsce.

    Na serwerze 2016 uprawnienie domyślnie należy do administratorów, a przy
    włączonej roli Hyper-V również do konta maszyn wirtualnych. Drugi wpis jest
    prawidłowy i musi zostać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przekierowania zapisu wykonywanego przez cudzy, uprzywilejowany proces
    w miejsce przez siebie wybrane.
  en: |
    The item limits the right to create symbolic links to the local administrators
    group.

    A symbolic link is an entry in the file system pointing at another path. A
    program opening the link arrives where the link leads and usually never learns
    of it - that is where its usefulness lies and that is where the trouble lies.

    The attack looks like this: a privileged process writes a file into a directory
    where an ordinary user may create entries - a temporary directory, say. The
    attacker plants a link of the expected name there beforehand, leading to a
    system file. The process, running with full rights, then writes somewhere other
    than it meant to.

    The category is high, because this is a ready road to elevation, needing though
    the further condition of a process writing to a predictable place.

    On Server 2016 the right belongs by default to the administrators, and with the
    Hyper-V role on, to the virtual machines account as well. That second entry is
    correct and has to stay.

    What an attacker gains while the item goes unmet: the ability to redirect a
    write performed by somebody else's privileged process to a place of their own
    choosing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", z dwóch powodów.

    Pierwszy jest wirtualizacyjny. Przy włączonej roli Hyper-V uprawnienie ma
    także konto maszyn wirtualnych i usunięcie go stamtąd zatrzymuje maszyny
    korzystające z dysków różnicowych. Reguła jest napisana tak, żeby ten wpis
    zachować, jeżeli już istnieje — ale zestawienie warto przejrzeć przed
    zmianą, bo w środowiskach zarządzanych centralnie bywają tam wpisy dodane
    ręcznie.

    Drugi powód to narzędzia deweloperskie i skrypty wdrożeniowe. Część
    z nich tworzy dowiązania, żeby nie kopiować katalogów — mechanizm znany
    z systemów uniksowych, przeniesiony wprost. Skrypt taki uruchomiony na
    koncie usługowym po zmianie zgłosi odmowę przy tworzeniu dowiązania,
    zwykle bez wyraźnego komunikatu o uprawnieniach.

    Czego to nie psuje: odczytu i podążania za istniejącymi dowiązaniami,
    skrótów systemu Windows, zwykłego udostępniania plików ani pracy maszyn
    wirtualnych, o ile konto maszyn wirtualnych zostaje na liście.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", for two reasons.

    The first is to do with virtualisation. With the Hyper-V role on, the virtual
    machines account holds the right too, and taking it away from there stops
    machines using differencing disks. The rule is written so as to keep that entry
    where it already exists - but the list is worth looking over before the change,
    because in centrally managed estates entries added by hand sometimes sit there.

    The second reason is development tools and deployment scripts. Some of them
    create links so as not to copy directories - a mechanism familiar from Unix
    systems, carried over unchanged. Such a script run under a service account will,
    after the change, report a refusal when creating a link, usually without a clear
    message about rights.

    What this does not break: reading and following existing links, Windows
    shortcuts, ordinary file sharing, or the work of virtual machines, so long as
    the virtual machines account stays on the list.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - scripting-and-automation
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Skrypt wdrożeniowy tworzący dowiązania zamiast kopiować katalogi zgłasza odmowę, jeżeli działa na koncie spoza grupy administratorów
      - Maszyny wirtualne z dyskami różnicowymi przestają wstawać, jeżeli konto maszyn wirtualnych zniknie z listy
      - Narzędzia deweloperskie przeniesione z systemów uniksowych tracą możliwość budowania drzew katalogów przez dowiązania
      - Odczyt i podążanie za istniejącymi dowiązaniami oraz skróty systemu Windows działają bez zmian
    en:
      - A deployment script creating links instead of copying directories reports a refusal if it runs under an account outside the administrators group
      - Virtual machines with differencing disks stop starting if the virtual machines account disappears from the list
      - Development tools carried over from Unix systems lose the ability to build directory trees out of links
      - Reading and following existing links, and Windows shortcuts, work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działają skrypty wdrożeniowe albo narzędzia budujące, które tworzą dowiązania na koncie spoza grupy administratorów
      - Lista zawiera wpisy nadane ręcznie na potrzeby zarządzanego centralnie środowiska wirtualizacji
    en:
      - Deployment scripts or build tools that create links under an account outside the administrators group run on the machine
      - The list carries entries granted by hand for the needs of a centrally managed virtualisation estate
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-83-0)?|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreateSymbolicLinkPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The virtual machines account stays in the list where it is already
    # there, since removing it stops the virtualisation role from working.
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = '*S-1-5-32-544'
    if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') {
      if ($Matches[1] -match 'S-1-5-83-0') { $value = '*S-1-5-32-544,*S-1-5-83-0' }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateSymbolicLinkPrivilege = ' + $value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateSymbolicLinkPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-symbolic-links

notes:
  pl: |
    Polecenie naprawcze celowo nie jest prostym przypisaniem. Odczytuje stan
    bieżący i zachowuje konto maszyn wirtualnych, jeżeli już tam jest —
    usunięcie go byłoby awarią roli Hyper-V wywołaną przez regułę bezpieczeństwa,
    czyli dokładnie tym, czego ta aplikacja ma nie robić.

    Oczekiwanie dopuszcza zatem dwa poprawne stany: samych administratorów albo
    administratorów wraz z kontem maszyn wirtualnych. Oba są zgodne.

    Uprawnienie dotyczy wyłącznie tworzenia dowiązań. Podążanie za nimi jest
    sterowane osobnym ustawieniem systemu i ta reguła go nie zmienia.
  en: |
    The remediation command is deliberately not a plain assignment. It reads the
    present state and keeps the virtual machines account where it is already there -
    removing it would be a failure of the Hyper-V role brought on by a security
    rule, which is exactly what this application is not to do.

    The expectation therefore admits two correct states: the administrators alone,
    or the administrators together with the virtual machines account. Both are
    compliant.

    The right bears only on creating links. Following them is governed by a separate
    system setting and this rule does not change it.
