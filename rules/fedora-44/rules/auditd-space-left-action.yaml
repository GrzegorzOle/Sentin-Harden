id: fedora44-auditd-space-left-action

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 6.3.2.4
  section: Logging and Auditing > System Accounting (auditd) > Configure Data Retention
  title:
    pl: System ostrzega, gdy kończy się miejsce na dzienniki audytu
    en: Ensure system warns when audit logs are low on space
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Zanim dysk z dziennikami audytu się zapełni, auditd reaguje dwa razy:
    przy progu space_left (space_left_action) i przy niższym progu
    admin_space_left (admin_space_left_action). Fedora ma domyślnie SYSLOG
    i SUSPEND, więc po drugim progu audyt po cichu przestaje działać.

    Punkt wymaga ostrzeżenia przy pierwszym progu (email, exec, single albo
    halt) i zatrzymania systemu przy drugim (single albo halt). Naprawa
    ustawia space_left_action = email i admin_space_left_action = single.
  en: |
    Before the disk with the audit logs fills up, auditd reacts twice: at
    the space_left threshold (space_left_action) and at the lower
    admin_space_left threshold (admin_space_left_action). Fedora has SYSLOG
    and SUSPEND by default, so after the second threshold auditing silently
    stops.

    The item requires a warning at the first threshold (email, exec, single
    or halt) and stopping the system at the second one (single or halt).
    The remediation sets space_left_action = email and
    admin_space_left_action = single.

disruption_description:
  pl: |
    Klasa wymaga planowanego wdrożenia: gdy na systemie plików
    z /var/log/audit zostanie admin_space_left megabajtów (domyślnie 50),
    auditd przełącza komputer w tryb ratunkowy, co kończy sesje
    użytkowników i zatrzymuje usługi.
  en: |
    The class needs a planned rollout: when admin_space_left megabytes
    (50 by default) remain on the file system holding /var/log/audit,
    auditd switches the computer into rescue mode, which ends the user
    sessions and stops the services.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Gdy zostanie mało miejsca na dysku z /var/log/audit, komputer przechodzi w tryb ratunkowy i kończy sesje użytkowników
      - Ostrzeżenie e-mail do konta root wymaga serwera poczty, którego Fedora domyślnie nie ma
    en:
      - When little space is left on the disk holding /var/log/audit, the computer goes into rescue mode and ends the user sessions
      - The e-mail warning to the root account needs a mail server, which Fedora does not have by default
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "space_left_action" && (v == "email" || v == "exec" || v == "single" || v == "halt")) || (k == "admin_space_left_action" && (v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in space_left_action admin_space_left_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "space_left_action" && (v == "email" || v == "exec" || v == "single" || v == "halt")) || (k == "admin_space_left_action" && (v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in space_left_action admin_space_left_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
      [ -f "$c" ] || { echo "$c not found; install audit first" >&2; exit 1; }
      {
        echo format=auditd-conf-1
        for k in space_left_action admin_space_left_action; do
          l=$(aline "$k")
          if [ -n "$l" ]; then echo "$k present $(sed -n "${l}p" "$c")"; else echo "$k absent"; fi
        done
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=auditd-conf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "space_left_action" && (v == "email" || v == "exec" || v == "single" || v == "halt")) || (k == "admin_space_left_action" && (v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in space_left_action admin_space_left_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
      sets='space_left_action email
    admin_space_left_action single'
      lines=$(tail -n +2 "$b")
      if [ "$(printf '%s\n' "$lines" | cut -d' ' -f1 | tr '\n' ' ')" != "space_left_action admin_space_left_action " ]; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      while read -r k s rest; do
        case "$s" in
          absent) [ -z "$rest" ] || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          present) printf '%s\n' "$rest" | grep -qiE "^[[:space:]]*$k[[:space:]]*=" || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
        esac
      done <<< "$lines"
      # aset KEY LINE: LINE in place of the last active line of KEY, appended
      # when there is none; an empty LINE removes it
      aset() {
        local l t; l=$(aline "$1"); t=$(mktemp)
        if [ -n "$l" ]; then
          awk -v l="$l" -v s="$2" 'NR == l { if (s != "") print s; next } { print }' "$c" > "$t"
        else
          cat "$c" > "$t"; if [ -n "$2" ]; then printf '%s\n' "$2" >> "$t"; fi
        fi
        cat "$t" > "$c"; rm -f "$t"
      }
      restore() {
        local k s rest cur n=0
        while read -r k s rest; do
          l=$(aline "$k"); cur=""; [ -z "$l" ] || cur=$(sed -n "${l}p" "$c")
          want=$(printf '%s\n' "$sets" | awk -v k="$k" '$1 == k { sub(/^[^ ]+ /, ""); print }')
          if [ "$cur" = "$rest" ] && [ "$s" = present ]; then continue; fi
          if [ -z "$l" ] && [ "$s" = absent ]; then continue; fi
          if [ "$cur" != "$k = $want" ]; then echo "Kept $k: changed since the remediation (${cur:-none})"; continue; fi
          aset "$k" "$rest"; n=$((n + 1))
        done <<< "$lines"
        echo "Restored $n settings in $c"
      }
      [ -f "$c" ] || { echo "$c not found; install audit first" >&2; exit 1; }
      r=$(evaluate)
      case "$r" in OK*) echo "Already meets the item, nothing to change"; exit 0 ;; esac
      while read -r k v; do
        if ! aok "$k" "$(aval "$k")"; then aset "$k" "$k = $v"; echo "Set $k = $v in $c"; fi
      done <<< "$sets"
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) restore >/dev/null; echo "The item is not met after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
      if [ -d /run/systemd/system ] && systemctl is-active --quiet auditd.service; then
        auditctl --signal reload >/dev/null 2>&1 || kill -HUP "$(systemctl show -p MainPID --value auditd.service)"
        echo "auditd reloaded its configuration"
      fi
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=auditd-conf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "space_left_action" && (v == "email" || v == "exec" || v == "single" || v == "halt")) || (k == "admin_space_left_action" && (v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in space_left_action admin_space_left_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
      sets='space_left_action email
    admin_space_left_action single'
      lines=$(tail -n +2 "$b")
      if [ "$(printf '%s\n' "$lines" | cut -d' ' -f1 | tr '\n' ' ')" != "space_left_action admin_space_left_action " ]; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      while read -r k s rest; do
        case "$s" in
          absent) [ -z "$rest" ] || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          present) printf '%s\n' "$rest" | grep -qiE "^[[:space:]]*$k[[:space:]]*=" || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
        esac
      done <<< "$lines"
      # aset KEY LINE: LINE in place of the last active line of KEY, appended
      # when there is none; an empty LINE removes it
      aset() {
        local l t; l=$(aline "$1"); t=$(mktemp)
        if [ -n "$l" ]; then
          awk -v l="$l" -v s="$2" 'NR == l { if (s != "") print s; next } { print }' "$c" > "$t"
        else
          cat "$c" > "$t"; if [ -n "$2" ]; then printf '%s\n' "$2" >> "$t"; fi
        fi
        cat "$t" > "$c"; rm -f "$t"
      }
      restore() {
        local k s rest cur n=0
        while read -r k s rest; do
          l=$(aline "$k"); cur=""; [ -z "$l" ] || cur=$(sed -n "${l}p" "$c")
          want=$(printf '%s\n' "$sets" | awk -v k="$k" '$1 == k { sub(/^[^ ]+ /, ""); print }')
          if [ "$cur" = "$rest" ] && [ "$s" = present ]; then continue; fi
          if [ -z "$l" ] && [ "$s" = absent ]; then continue; fi
          if [ "$cur" != "$k = $want" ]; then echo "Kept $k: changed since the remediation (${cur:-none})"; continue; fi
          aset "$k" "$rest"; n=$((n + 1))
        done <<< "$lines"
        echo "Restored $n settings in $c"
      }
      [ -f "$c" ] || { echo "$c not found" >&2; exit 1; }
      restore
      if [ -d /run/systemd/system ] && systemctl is-active --quiet auditd.service; then
        auditctl --signal reload >/dev/null 2>&1 || kill -HUP "$(systemctl show -p MainPID --value auditd.service)"
        echo "auditd reloaded its configuration"
      fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/auditd.conf.5.html
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/auditing-the-system_security-hardening

notes:
  pl: |
    Akcja email wysyła wiadomość na konto z action_mail_acct (domyślnie
    root) przez /usr/sbin/sendmail i zawsze zapisuje ostrzeżenie w dzienniku
    systemowym. Bez serwera poczty auditd tylko zgłasza przy starcie, że
    sendmail nie jest dostępny, i działa dalej, więc ostrzeżenie zostaje
    w dzienniku. Wybieramy single zamiast halt z tego samego powodu co
    w 6.3.2.3. Ustawione wcześniej exec, single lub halt spełnia punkt
    i zostaje.

    Punkty 6.3.2.2, 6.3.2.3 i 6.3.2.4 działają razem: keep_logs sprawia, że
    dzienniki rosną bez końca, a akcje z 6.3.2.3 i 6.3.2.4 decydują, co się
    stanie, gdy zabraknie miejsca. Bez archiwizacji i usuwania starych
    dzienników przez administratora komputer w końcu przejdzie w tryb
    ratunkowy. Progi space_left (domyślnie 75 MB) i admin_space_left
    (domyślnie 50 MB) dotyczą systemu plików z /var/log/audit, czyli na
    zwykłej instalacji Fedory głównego systemu plików, więc zapełnić go może
    dowolny program.

    Naprawa zastępuje ostatni wiersz każdego ustawienia w
    /etc/audit/auditd.conf w miejscu albo dopisuje go na końcu, a potem
    każe działającemu auditd przeładować konfigurację. Wycofanie przywraca
    poprzednie wiersze tam, gdzie nadal jest wartość ustawiona przez
    naprawę. /etc/audit jest dostępny tylko dla roota, więc bez tych
    uprawnień wynik to NOT_OK:needs-root.
  en: |
    The email action sends a message to the action_mail_acct account (root
    by default) through /usr/sbin/sendmail and always writes the warning to
    the system log. Without a mail server auditd only reports at start that
    sendmail is not available and keeps running, so the warning stays in
    the log. We choose single rather than halt for the same reason as in
    6.3.2.3. exec, single or halt set earlier meets the item and stays.

    Items 6.3.2.2, 6.3.2.3 and 6.3.2.4 work together: keep_logs makes the
    logs grow without end, and the actions from 6.3.2.3 and 6.3.2.4 decide
    what happens when space runs out. Without the administrator archiving
    and removing old logs, the computer will eventually go into rescue
    mode. The space_left (75 MB by default) and admin_space_left (50 MB by
    default) thresholds apply to the file system holding /var/log/audit,
    which on a regular Fedora installation is the root file system, so any
    program can fill it.

    The remediation replaces the last line of each setting in
    /etc/audit/auditd.conf in place or appends it at the end, and then tells
    a running auditd to reload its configuration. Rollback restores the
    previous lines where the value set by the remediation is still there.
    /etc/audit is only accessible to root, so without these privileges the
    result is NOT_OK:needs-root.
