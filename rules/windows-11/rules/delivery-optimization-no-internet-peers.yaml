id: win11-delivery-optimization-no-internet-peers

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Delivery Optimization
  title:
    pl: Pobieranie aktualizacji od obcych maszyn w internecie wyłączone
    en: Fetching updates from strange machines on the internet turned off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Aktualizacje i pakiety ze sklepu system potrafi pobierać nie tylko od
    producenta, ale też kawałkami od innych maszyn, które mają je już u siebie.
    Ustawienie rozstrzyga, kto może być takim źródłem: tylko maszyny w tej samej
    sieci lokalnej, maszyny z tej samej grupy, czy dowolne maszyny w internecie.

    Sama treść jest sprawdzana skrótem kryptograficznym, więc obcy uczestnik nie
    podstawi zmienionej aktualizacji — i trzeba to powiedzieć wprost, bo to
    najczęstsze nieporozumienie wokół tego punktu. Problem leży gdzie indziej
    i jest dwojaki.

    Po pierwsze, maszyna nasłuchuje połączeń od nieznanych nadawców z internetu
    i odpowiada na nie. Jest to usługa sieciowa wystawiona na zewnątrz,
    z własnym kodem obsługującym ruch, i jako taka jest celem niezależnym od
    tego, co przez nią przechodzi. Po drugie, uczestnictwo w wymianie mówi
    obcym, których pakietów maszyna szuka — czyli jakie ma oprogramowanie
    i na jakim jest poziomie poprawek. To jest rozpoznanie podane samo z siebie.

    Ograniczenie źródeł do sieci lokalnej zostawia oszczędność łącza, a zabiera
    obie te rzeczy.
  en: |
    The system can fetch updates and store packages not only from the vendor but
    also, in pieces, from other machines that already hold them. The setting
    decides who may be such a source: only machines on the same local network,
    machines in the same group, or any machine on the internet.

    The content itself is verified by a cryptographic digest, so a stranger cannot
    substitute a modified update - and that has to be said plainly, because it is
    the commonest misunderstanding around this item. The problem lies elsewhere
    and is twofold.

    First, the machine listens for connections from unknown senders on the
    internet and answers them. This is a network service exposed outwards, with
    code of its own handling the traffic, and as such it is a target independent
    of what passes through it. Second, taking part in the exchange tells strangers
    which packages the machine is looking for - that is, what software it has and
    what patch level it is at. That is reconnaissance handed over unprompted.

    Restricting the sources to the local network keeps the saving on bandwidth and
    takes both of those away.

disruption_description:
  pl: |
    Sprawdzenia wymaga kształt sieci, a konkretnie to, czy maszyny mające sobie
    nawzajem podawać pakiety widzą się w sieci lokalnej.

    W biurze, gdzie stanowiska stoją w jednej sieci, nie zmienia się nic
    zauważalnego: wymiana nadal działa, tyle że tylko między swoimi.

    Kłopot pojawia się tam, gdzie maszyny są rozproszone — praca zdalna,
    oddziały bez wspólnej sieci, stanowiska u klientów. Takie maszyny przestają
    pobierać od siebie nawzajem i każda ściąga całość wprost od producenta.
    Ruch na łączu rośnie i przy wolnym łączu bywa to odczuwalne w dniu wydania
    większej aktualizacji, choć sama aktualizacja dojdzie do skutku.

    Dla osoby pracującej na maszynie zmiana jest niewidoczna poza tym jednym
    dniem, i nawet wtedy objawia się wolniejszym pobieraniem, a nie błędem.
  en: |
    What needs checking is the shape of the network - specifically, whether the
    machines meant to hand packages to one another can see each other on the local
    network.

    In an office where the stations sit on one network nothing noticeable changes:
    the exchange keeps working, only among their own.

    The trouble appears where the machines are scattered - remote work, branches
    with no common network, stations at clients' sites. Such machines stop
    fetching from one another and each pulls the whole thing straight from the
    vendor. Traffic on the link rises, and on a slow link this can be felt on the
    day a larger update ships, though the update itself will complete.

    For the person working on the machine the change is invisible outside that one
    day, and even then it shows as a slower download rather than an error.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyny rozproszone poza wspólną siecią przestaną pobierać pakiety od siebie nawzajem
      - Ruch na łączu do internetu wzrośnie w dniu wydania większej aktualizacji
      - Na wolnym łączu pobieranie aktualizacji potrwa dłużej niż dotąd
    en:
      - Machines scattered outside a common network stop fetching packages from one another
      - Traffic on the internet link rises on the day a larger update ships
      - On a slow link downloading updates takes longer than before
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny pracują zdalnie albo w oddziałach bez wspólnej sieci, a łącze do internetu jest wąskie
    en:
      - Machines work remotely or in branches with no common network and the internet link is narrow
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
      $name = 'DODownloadMode'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|1|2|99|100)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    $name = 'DODownloadMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DODownloadMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/do/waas-delivery-optimization-reference

notes:
  pl: |
    Sprawdzenie wymienia dozwolone wartości zamiast odrzucać jedną niedozwoloną,
    bo tylko tak wynik niesie informację. Odrzucanie samej jednej wartości
    kazałoby uznać za spełnioną każdą liczbę spoza zakresu, także wpisaną przez
    pomyłkę.

    Naprawa ustawia wymianę w obrębie sieci lokalnej, a nie jej całkowite
    wyłączenie. Wyłączenie też spełniłoby punkt, ale zdejmowałoby przy okazji
    oszczędność łącza, której ten punkt wcale nie kwestionuje — a zasadą paczki
    jest naprawiać dokładnie to, o co punkt pyta.

    Wynik „brak wartości" należy czytać ostrożnie i nie jest to to samo, co
    ustawienie niebezpieczne. System bez tej zasady zachowuje się domyślnie tak
    jak przy wymianie w sieci lokalnej, więc maszyna najpewniej nie rozmawia
    z obcymi już teraz. Punkt jest niespełniony dlatego, że nic tego nie
    utrwala — a nie dlatego, że stan bieżący jest zły.
  en: |
    The check lists the permitted values rather than rejecting the single
    forbidden one, because only that way does the result carry information.
    Rejecting one value alone would treat any number outside the range as
    satisfying the item, including one typed by mistake.

    Remediation sets the exchange to within the local network rather than turning
    it off entirely. Turning it off would satisfy the item too, but would take
    away the bandwidth saving the item does not question at all - and the pack's
    principle is to fix exactly what the item asks about.

    A result of "no value" should be read carefully and is not the same as an
    unsafe setting. Without this policy the system behaves by default as it does
    with exchange on the local network, so the machine most likely is not talking
    to strangers already. The item is unmet because nothing makes that permanent -
    not because the current state is wrong.
