id: win10-vendor-settings-auditing-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Rejestrowanie pobrań ze zdalnej usługi konfiguracyjnej włączone
    en: The recording of downloads from the configuration service afar turned on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza zapisywanie w dzienniku informacji o ustawieniach
    pobieranych przez system ze zdalnej usługi konfiguracyjnej.

    System pobiera część swoich ustawień z usługi prowadzonej przez
    producenta, poza mechanizmem zasad grupy i poza aktualizacjami.
    Dotyczy to między innymi zachowania składników diagnostycznych
    i częstotliwości wysyłania danych.

    Bez tego ustawienia pobrania odbywają się bez śladu. Maszyna zmienia
    zachowanie, a w dzienniku nie ma zapisu, kiedy i co się zmieniło.
    Osoba badająca późniejszą nieprawidłowość nie ma jak ustalić, czy
    zmiana pochodziła z zasad organizacji, czy przyszła tą drogą.

    Wartością jest więc rozliczalność, a nie ograniczenie. Punkt nie
    powstrzymuje pobierania ustawień ani go nie zawęża — sprawia tylko, że
    zostaje po nim zapis.

    Odnotowuję, że ilość zapisywanych zdarzeń jest niewielka i nie
    obciąża dziennika w sposób, który wymagałby zmiany jego rozmiaru.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zmianę
    zachowania maszyny tą drogą pozostającą poza zapisem.
  en: |
    The setting turns on the writing into the journal of word about the settings the system draws from a
    configuration service afar.

    The system draws a part of its settings from a service kept by the maker, outside the mechanism of the rules
    of groups and outside the servicing. That touches among other things the behaviour of the parts that make
    diagnoses and how often data are sent.

    Without this setting the drawings happen without a trace. The machine changes its behaviour and in the journal
    there stands no record of when and of what changed. Whoever looks into some later wrongness has no means of
    settling whether the change came from the body's own rules or came by that road.

    The worth is therefore one of being answerable and no bounding. The item holds back the drawing of settings
    not at all and narrows it not at all - it brings it about only that a record stays behind it.

    I set down that the number of happenings written is small and does not burden the journal in a manner that
    would call for its size to be changed.

    What an attacker gains while the item goes unmet: a change of the machine's behaviour by that road, standing
    outside the record.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie dokłada do dziennika zdarzenia nowego rodzaju i nic poza
    tym nie zmienia. Nie zmienia zakresu danych wysyłanych na zewnątrz,
    nie zmienia sposobu pobierania ustawień i nie wpływa na pracę
    programów.

    Odnotowuję jedyne miejsce warte uwagi: system zbierający dzienniki,
    który reaguje alarmem na każdy nieznany rodzaj zdarzenia. Po zmianie
    pojawią się tam zdarzenia, których wcześniej nie było. Jest to
    zastrzeżenie dotyczące narzędzia po stronie obsługi, a nie samej
    maszyny.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: pracy programów, aktualizacji, zakresu danych
    diagnostycznych, logowania, drukowania.
  en: |
    The class is "no disruption".

    The setting adds to the journal happenings of a new kind and changes nothing besides. It does not change the
    reach of the data sent outward, does not change the manner of the drawing of settings and bears not upon the
    work of programs.

    I set down the one place worth notice: a system gathering journals that answers with an alarm to every unknown
    kind of happening. After the change happenings will show there that were not there before. It is a
    reservation touching a tool upon the keepers' side and not the machine itself.

    The consequence shows at once, with no restart.

    What this does not break: the work of programs, the servicing, the reach of the data of diagnosis, logging on,
    or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - W systemie zbierającym dzienniki pojawią się zdarzenia rodzaju, którego wcześniej nie było
      - System reagujący alarmem na każdy nieznany rodzaj zdarzenia zgłosi je jako nowość wymagającą sprawdzenia
      - Zakres danych wysyłanych na zewnątrz i sposób pobierania ustawień nie zmieniają się wcale
      - Ilość zapisywanych zdarzeń jest niewielka i nie wymaga zmiany rozmiaru dziennika
      - Praca programów, aktualizacje, dane diagnostyczne, logowanie i drukowanie pozostają bez zmian
    en:
      - In the system that gathers journals happenings will show of a kind that was not there before
      - A system answering with an alarm to every unknown kind of happening will report them as a novelty to be looked into
      - The reach of the data sent outward and the manner of the drawing of settings do not change at all
      - The number of happenings written is small and calls for no change of the journal s size
      - The work of programs, the servicing, the data of diagnosis, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - System zbierający dzienniki nie pozwala dodać nowego rodzaju zdarzeń i każde takie zgłoszenie kończy się alarmem
    en:
      - The system gathering journals lets no new kind of happening be added and every such report ends in an alarm
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableOneSettingsAuditing'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'EnableOneSettingsAuditing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableOneSettingsAuditing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła jest oceniona nisko, bo niczego nie ogranicza. Warto, żeby
    aplikacja to powiedziała wprost: jest to punkt o rozliczalności,
    a nie o ochronie, i jego wartość ujawnia się dopiero wtedy, gdy ktoś
    bada, skąd wzięła się zmiana zachowania maszyny.

    Argument wart zachowania dotyczy drogi, która omija zasady
    organizacji. Ustawienia pobierane z usługi producenta nie przechodzą
    przez zasady grupy ani przez aktualizacje, więc nie zostawiają śladu
    w miejscach, w których szuka się go odruchowo. Punkt ten sprawia, że
    ślad w ogóle powstaje.

    Odnotowuję, że punkt nie zawęża pobierania ustawień. Kto chce je
    ograniczyć, musi sięgnąć po inne zasady — ta wyłącznie każe zapisać,
    co zostało pobrane.
  en: |
    The rule is graded low, bounding nothing. It is well that the application say so outright: it is an item of
    being answerable and no guarding, and its worth shows only where somebody looks into whence a change of the
    machine's behaviour came.

    The argument worth keeping touches the road that goes round the body's own rules. Settings drawn from the
    maker's service pass through neither the rules of groups nor the servicing, so they leave no trace in the
    places a trace is sought by habit. This item brings it about that a trace comes about at all.

    I set down that the item narrows not the drawing of settings. Whoever would bound it must reach for other
    rules - this bids only that what was drawn be written down.
