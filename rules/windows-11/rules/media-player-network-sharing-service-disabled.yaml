id: win11-media-player-network-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania biblioteki multimediów w sieci wyłączona
    en: The media library network sharing service disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia zawartość bibliotek multimediów tej maszyny innym
    urządzeniom w sieci: odtwarzaczom, telewizorom, konsolom. Po jej
    uruchomieniu maszyna ogłasza się w sieci jako serwer treści i wystawia
    spis plików, które znalazła w folderach objętych biblioteką.

    Ryzyko jest tu umiarkowane i warto je opisać dokładnie, zamiast podnosić
    ponad miarę. Udostępniane są pliki multimedialne, a nie cały dysk,
    a uprawnienia do odtwarzania nadaje się urządzeniom z osobna. Nie jest to
    otwarty udział sieciowy.

    Dwie rzeczy przemawiają jednak za wyłączeniem. Pierwsza: biblioteka
    obejmuje foldery użytkownika, a w folderach tych lądują pliki, których
    nikt nie zamierzał udostępniać — nagrania ze spotkań, materiały
    szkoleniowe, zrzuty ekranu zapisane jako obrazy. Spis takich plików wraz
    z nazwami wychodzi do sieci, zanim ktokolwiek zdecyduje o pojedynczym
    pliku.

    Druga: usługa wystawia kolejną nasłuchującą usługę sieciową na maszynie,
    która nie ma powodu być serwerem czegokolwiek. Wyłączenie jej jest
    zdejmowaniem rzeczy zbędnej, a nie odpieraniem konkretnego ataku, i tak
    należy ważyć jego wartość.
  en: |
    The service shares the contents of this machine's media libraries with other devices
    on the network: players, televisions, consoles. Once started, the machine announces
    itself on the network as a content server and puts out a list of the files it found
    in the folders the library covers.

    The risk here is moderate and worth describing exactly rather than raised beyond
    measure. What is shared is media files rather than the whole disk, and permission to
    play is granted to devices one by one. It is not an open network share.

    Two things speak for disabling it all the same. The first: the library covers the
    user's folders, and into those folders land files nobody meant to share - recordings
    of meetings, training material, screen captures saved as pictures. A list of such
    files, names and all, goes out to the network before anybody decides about a single
    file.

    The second: the service puts out one more listening network service on a machine
    that has no reason to be a server of anything. Disabling it is taking away something
    needless rather than fending off a particular attack, and its worth should be weighed
    that way.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z tej maszyny odtwarza się treści na
    urządzeniach w sieci.

    W pracy biurowej odpowiedź brzmi niemal zawsze „nie" i zmiana nie robi nic.
    Usługa bywa zatrzymana albo w ogóle nieuruchamiana.

    Tam, gdzie jest używana, skutek jest jednoznaczny: maszyna znika z list
    źródeł treści na telewizorach, odtwarzaczach i konsolach w tej samej sieci.
    Odtwarzanie tych samych plików na samej maszynie działa dalej bez zmian —
    punkt dotyczy wyłącznie udostępniania na zewnątrz.

    Warto rozdzielić dwie sytuacje, bo bywają mylone. Wysyłanie treści
    z maszyny na urządzenie — czyli maszyna decyduje, co ma zostać odtworzone —
    obsługuje inna usługa, opisana osobną regułą. Ta reguła dotyczy sytuacji
    odwrotnej: to urządzenie przegląda bibliotekę maszyny i samo wybiera plik.

    Zastosowanie w organizacji spotyka się w salach z odtwarzaczami treści
    szkoleniowych i w miejscach z ekranami informacyjnymi. Tam zamiennikiem
    jest udział sieciowy na serwerze plików.

    Nie ma restartu.
  en: |
    What needs checking is whether content is played from this machine on devices on the
    network.

    In office work the answer is almost always no and the change does nothing. The
    service is sometimes stopped or never started at all.

    Where it is used, the effect is plain: the machine disappears from the lists of
    content sources on televisions, players and consoles on the same network. Playing
    those same files on the machine itself carries on unchanged - the item concerns
    sharing outwards alone.

    Two situations are worth telling apart, since they are sometimes confused. Sending
    content from the machine to a device - that is, the machine deciding what is to be
    played - is handled by another service, described by a rule of its own. This rule
    concerns the opposite: the device browsing the machine's library and choosing a file
    itself.

    Use within an organisation is met in rooms with players of training content and in
    places with information screens. There the replacement is a network share on a file
    server.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - Maszyna znika z list źródeł treści na telewizorach i odtwarzaczach w sieci
      - Urządzenie w sali szkoleniowej przestaje widzieć bibliotekę tej maszyny
      - Spis plików multimedialnych przestaje wychodzić do sieci
      - Odtwarzanie tych samych plików na samej maszynie działa dalej bez zmian
    en:
      - The machine disappears from the lists of content sources on televisions and players
      - A device in a training room stops seeing this machine's library
      - The list of media files stops going out to the network
      - Playing those same files on the machine itself carries on unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Odtwarzacz w sali szkoleniowej pobiera materiały z biblioteki tej maszyny
      - Ekran informacyjny odtwarza treści udostępniane przez tę maszynę i nie ma zamiennika
    en:
      - A player in a training room takes material from this machine's library
      - An information screen plays content shared by this machine and there is no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'WMPNetworkSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMPNetworkSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WMPNetworkSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wmp/windows-media-player-sdk

notes:
  pl: |
    Usługa bywa nieobecna na nowszych instalacjach, z których odtwarzacz
    został usunięty. Brak klucza usługi raportuje wtedy jako nieistotny dla tej
    maszyny, a nie jako niezgodność — nie ma czego wyłączać.

    Wyłączenie usługi nie usuwa samego odtwarzacza ani nie zmienia odtwarzania
    plików na maszynie. Dotyczy wyłącznie udostępniania biblioteki innym
    urządzeniom.

    Jest to jedna z reguł o wyraźnie niższej wadze niż pozostałe w tej
    rodzinie, i warto to widzieć przy układaniu kolejności prac. Wdraża się ją
    przy okazji, nie w pierwszej kolejności.
  en: |
    The service is sometimes absent on newer installations from which the player has
    been removed. A missing service key is then reported as not applicable to this
    machine rather than as a deviation - there is nothing to disable.

    Disabling the service does not remove the player itself and does not change how
    files are played on the machine. It concerns sharing the library with other devices
    alone.

    It is one of the rules of plainly lower weight than the others in this family, and
    that is worth seeing when ordering the work. It is applied along the way rather than
    first.
