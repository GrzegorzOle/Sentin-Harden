id: iis-deployment-method-retail

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Serwer przełączony w tryb produkcyjny
    en: The server switched into production mode

  level: 1
  profile: application

platform:
  system: iis

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Środowisko uruchomieniowe ma jeden przełącznik, który jednym ruchem zamyka
    wszystkie ustawienia pomocne przy pisaniu kodu, a szkodliwe na serwerze
    udostępnionym ludziom z zewnątrz. Po jego włączeniu tryb diagnostyczny
    przestaje działać niezależnie od tego, co wpisano w pliku konfiguracyjnym
    aplikacji, szczegółowe opisy błędów przestają wychodzić poza maszynę,
    a śledzenie wykonania zostaje wyłączone.

    Co to odbiera atakującemu: rozpoznanie wykonane cudzymi rękami. Strona
    błędu z trybu diagnostycznego pokazuje ścieżkę do pliku na dysku, fragment
    kodu źródłowego z numerem linii, wersje bibliotek i nierzadko ciąg
    połączenia do bazy danych. To jest opis maszyny dokładniejszy niż większość
    tego, co da się zebrać skanerem — wystarczy wywołać błąd.

    Przewaga tego przełącznika nad ustawianiem każdej z tych rzeczy osobno jest
    taka, że działa ponad aplikacjami. Aplikacja, która we własnym pliku
    konfiguracyjnym włącza sobie tryb diagnostyczny, po tej zmianie i tak go nie
    dostanie. Nie trzeba pilnować każdej z osobna.
  en: |
    The runtime has a single switch that closes, in one move, every setting helpful
    while writing code and harmful on a server exposed to people outside. Once it
    is on, diagnostic mode stops working regardless of what an application's
    configuration file says, detailed error descriptions stop leaving the machine,
    and execution tracing is switched off.

    What it takes away from an attacker - reconnaissance carried out by somebody
    else's hands. An error page from diagnostic mode shows the path to a file on
    disk, a fragment of source code with a line number, library versions and not
    uncommonly the database connection string. That is a description of the machine
    more precise than most of what a scanner could gather - and it takes only
    causing an error.

    The advantage of this switch over setting each of those things separately is
    that it works above the applications. An application switching diagnostic mode
    on in its own configuration file will not get it after this change. There is no
    need to watch each of them separately.

disruption_description:
  pl: |
    Na serwerze produkcyjnym ta zmiana nie zabiera niczego, czego ktokolwiek
    używa świadomie. Zabiera natomiast wszystko, czym posługuje się osoba
    diagnozująca problem na żywo — i to jest cała rozmowa przy tym punkcie.

    Po zmianie przestają działać trzy rzeczy: podpięcie się debuggerem do
    procesu aplikacji, szczegółowa strona błędu ze zrzutem stosu wywołań oraz
    podgląd śledzenia wykonania. Jeżeli w tej organizacji przyjęło się
    diagnozować zgłoszenia wprost na produkcji, ten punkt tę praktykę zamyka —
    i to jest jego zamierzony skutek, ale warto powiedzieć o nim wprost, zanim
    ktoś odkryje to w środku awarii.

    Drugi skutek jest mniej oczywisty: aplikacje kompilowane w trybie
    diagnostycznym działają po tej zmianie wolniej niż dotąd, bo tracą
    optymalizacje, które tryb diagnostyczny wyłączał, a z których teraz
    korzystają. To zmiana na lepsze, ale zmiana — warto ją odnotować przy
    porównywaniu czasów odpowiedzi.

    Zmiana obowiązuje po przeładowaniu aplikacji, czyli w praktyce po restarcie
    puli. Obejmuje wszystkie aplikacje na maszynie naraz.
  en: |
    On a production server this change takes away nothing anybody uses knowingly.
    It does take away everything used by whoever diagnoses a problem live - and
    that is the whole conversation about this item.

    Three things stop working after the change - attaching a debugger to the
    application process, the detailed error page with a stack trace, and the view
    of execution tracing. If it has become the practice in this organisation to
    diagnose reports straight on production, this item closes that practice - which
    is its intended effect, but it is worth saying outright before somebody
    discovers it in the middle of an outage.

    The second effect is less obvious - applications compiled in diagnostic mode
    run faster after this change than they did, because they gain optimisations
    that diagnostic mode was switching off. That is a change for the better, but a
    change - worth noting when comparing response times.

    The change applies once the applications reload, which in practice means after
    the pool restarts. It covers every application on the machine at once.

implementation_consequences:
  impact_areas:
    - web-server-services
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Podpięcie debuggera do procesu aplikacji przestaje być możliwe na tej maszynie
      - Szczegółowa strona błędu ze zrzutem stosu wywołań przestaje się pojawiać, także dla osoby zalogowanej lokalnie
      - Podgląd śledzenia wykonania przestaje działać niezależnie od ustawień w pliku konfiguracyjnym aplikacji
      - Aplikacje kompilowane w trybie diagnostycznym zmieniają czasy odpowiedzi, bo odzyskują optymalizacje
      - Zmiana obejmuje wszystkie aplikacje na maszynie i nie da się jej obejść wpisem w pojedynczej aplikacji
    en:
      - Attaching a debugger to the application process stops being possible on this machine
      - The detailed error page with a stack trace stops appearing, including for somebody signed in locally
      - The view of execution tracing stops working regardless of the settings in an application's configuration file
      - Applications compiled in diagnostic mode change their response times, because they regain optimisations
      - The change covers every application on the machine and cannot be worked around by an entry in a single application
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny deweloperskie i testowe, na których diagnozowanie kodu jest celem pracy
      - Serwery, na których zespół diagnozuje zgłoszenia wprost na produkcji i nie ma jeszcze innej drogi
    en:
      - Development and test machines, where diagnosing code is the point of the work
      - Servers where the team diagnoses reports straight on production and has no other road yet
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        # This setting lives in the runtime's own machine configuration and not
        # in any file the web server manages. The server's configuration
        # interface does not know the section at all, so the file is read
        # directly - a reading through that interface would come back empty on
        # a machine where the switch is in fact on.
        $checked = @()
        $wrong = @()
        foreach ($base in @('Framework', 'Framework64')) {
          $path = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\machine.config')
          if (-not (Test-Path $path)) { continue }
          $checked += $base
          $xml = New-Object System.Xml.XmlDocument
          $xml.Load($path)
          $node = $xml.SelectSingleNode('/configuration/system.web/deployment')
          if ($null -eq $node) { $wrong += ($base + ':not-set') }
          else {
            $value = $node.GetAttribute('retail')
            if ([string]::IsNullOrWhiteSpace($value)) { $wrong += ($base + ':not-set') }
            elseif ($value -ne 'true') { $wrong += ($base + ':' + $value) }
          }
        }
        # A 32-bit pool reads one of these files and a 64-bit pool the other, so
        # both are judged. Finding neither means the runtime is not installed
        # and there is nothing here to answer for.
        if ($checked.Count -eq 0) { 'NOT_INSTALLED' }
        elseif ($wrong.Count -eq 0) { 'AS_REQUIRED' }
        else { 'OTHER ' + ($wrong -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(AS_REQUIRED|NOT_INSTALLED)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $files = @()
    foreach ($base in @('Framework', 'Framework64')) {
      $source = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\machine.config')
      if (Test-Path $source) {
        $copy = '{{backup_file}}' + '.' + $base + '.machine.config'
        Copy-Item -Path $source -Destination $copy -Force
        $files += [pscustomobject]@{ source = $source; copy = $copy }
      }
    }
    if ($files.Count -eq 0) {
      throw 'The runtime machine configuration was not found, so nothing was secured and nothing may be changed.'
    }
    [pscustomobject]@{
      scope = 'machine-config'
      node  = '/configuration/system.web/deployment'
      name  = 'retail'
      files = $files
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and copied the runtime machine configuration"

  change_command: |
    foreach ($base in @('Framework', 'Framework64')) {
      $path = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\machine.config')
      if (-not (Test-Path $path)) { continue }
      $xml = New-Object System.Xml.XmlDocument
      # Whitespace is preserved so that saving the file back does not reflow a
      # document nobody asked to reformat. A configuration file rewritten wholly
      # is unreadable in a later comparison against the copy.
      $xml.PreserveWhitespace = $true
      $xml.Load($path)
      $root = $xml.SelectSingleNode('/configuration/system.web')
      if ($null -eq $root) {
        $root = $xml.CreateElement('system.web')
        $xml.SelectSingleNode('/configuration').AppendChild($root) | Out-Null
      }
      $node = $root.SelectSingleNode('deployment')
      if ($null -eq $node) {
        $node = $xml.CreateElement('deployment')
        $root.AppendChild($node) | Out-Null
      }
      $node.SetAttribute('retail', 'true')
      $xml.Save($path)
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($f in $b.files) {
      if (-not (Test-Path $f.copy)) {
        throw 'A copy recorded in the backup file is missing, so nothing was restored.'
      }
    }
    # The whole file goes back rather than the attribute being rewritten. The
    # copy is the only complete record of what the machine configuration held,
    # and putting it back cannot leave the file half restored.
    foreach ($f in $b.files) {
      Copy-Item -Path $f.copy -Destination $f.source -Force
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.deploymentsection.retail
  - https://learn.microsoft.com/aspnet/whitepapers/aspnet4/breaking-changes

notes:
  pl: |
    Ustawienie nie leży w żadnym pliku zarządzanym przez serwer sieciowy, tylko
    w konfiguracji maszynowej samego środowiska uruchomieniowego. Interfejs
    konfiguracyjny serwera nie zna tej sekcji, więc odczyt i zapis idą wprost do
    pliku XML — czytanie przez tamten interfejs zwracałoby pustkę na maszynie,
    na której przełącznik jest włączony.

    Zmieniane są oba pliki, dla wersji 32- i 64-bitowej, bo pula aplikacji czyta
    jeden albo drugi zależnie od tego, w którym trybie została uruchomiona.
    Ustawienie tylko jednego daje stan, w którym połowa aplikacji na maszynie
    jest w trybie produkcyjnym, a połowa nie — i nic tego nie sygnalizuje.

    Ten punkt zachodzi na reguły wyłączające tryb diagnostyczny i śledzenie
    wykonania z osobna. Tamte działają na poziomie konfiguracji, którą aplikacja
    może nadpisać u siebie; ten przełącznik działa ponad nimi i nadpisać się nie
    da. Warto mieć oba: ten jako granicę twardą, tamte jako porządek
    w konfiguracji.
  en: |
    The setting lies in no file the web server manages, but in the machine
    configuration of the runtime itself. The server's configuration interface does
    not know the section, so reading and writing go straight to the XML file -
    reading through that interface would return nothing on a machine where the
    switch is on.

    Both files are changed, the thirty-two and the sixty-four bit one, because an
    application pool reads one or the other depending on the mode it was started
    in. Setting only one gives a state in which half the applications on the
    machine are in production mode and half are not, with nothing to signal it.

    This item overlaps the rules switching diagnostic mode and execution tracing
    off separately. Those work at the level of configuration an application can
    override for itself; this switch works above them and cannot be overridden. It
    is worth having both - this one as the hard boundary, those as order in the
    configuration.
