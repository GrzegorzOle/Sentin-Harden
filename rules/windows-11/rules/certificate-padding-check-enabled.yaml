id: win11-certificate-padding-check-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Ścisłe sprawdzanie wypełnienia podpisu pliku wykonywalnego włączone
    en: Strict checking of an executable signature's padding switched on
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podpis pliku wykonywalnego obejmuje jego treść, ale nie całą. W strukturze
    podpisu jest miejsce wypełniające, które przy sprawdzaniu było historycznie
    pomijane — wolno w nim było umieścić cokolwiek, a podpis pozostawał ważny.

    Wykorzystanie tego jest proste i było stosowane w praktyce. Napastnik bierze
    plik podpisany przez uznanego wydawcę, dokłada do miejsca wypełniającego
    własne dane i rozsyła tak przygotowany plik. System sprawdza podpis, widzi
    wydawcę, którego zna, i przepuszcza plik — razem z doklejoną zawartością.
    Wszystko, co opiera się na podpisie, zostaje ominięte bez łamania
    czegokolwiek: żaden klucz nie został zdobyty, żaden certyfikat nie został
    podrobiony.

    Skutek jest tym poważniejszy, że podpis jest w tym systemie podstawą
    zaufania na kilku poziomach naraz: ostrzeżenie przy uruchomieniu pobranego
    pliku, reguły dopuszczające programy po wydawcy, sterowniki, skrypty.
    Jedna luka w sprawdzaniu podpisu osłabia je wszystkie równocześnie.

    Punkt włącza ścisłe sprawdzanie. Plik z czymkolwiek doklejonym do miejsca
    wypełniającego przestaje być uznawany za poprawnie podpisany.
  en: |
    An executable's signature covers its content, but not all of it. The signature's
    structure holds a padding area which was historically passed over when checking -
    anything could be placed there and the signature stayed valid.

    Making use of that is simple and has been done in practice. The attacker takes a
    file signed by a recognised vendor, adds their own data to the padding area and
    sends the file out. The system checks the signature, sees a vendor it knows and
    lets the file through - together with the appended content. Everything resting on
    the signature is bypassed without breaking anything: no key has been obtained, no
    certificate forged.

    The effect is the graver because in this system a signature is the ground of trust
    at several levels at once: the warning when a downloaded file is started, rules
    admitting programs by vendor, drivers, scripts. One gap in signature checking
    weakens all of them at the same time.

    The item switches strict checking on. A file with anything appended to the padding
    area stops being counted as properly signed.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w organizacji nie rozprowadza się plików
    znakowanych po podpisaniu.

    Jest to sposób pracy spotykany u części producentów oprogramowania
    i w narzędziach do rozprowadzania programów: gotowy, podpisany instalator
    dostaje dopisany identyfikator klienta, kampanii albo stanowiska — dokładnie
    w to miejsce, którego punkt zaczyna pilnować. Po wdrożeniu taki plik traci
    ważny podpis.

    Objaw jest mylący i warto go znać wcześniej. Plik nadal się uruchomi, ale
    system zachowa się wobec niego jak wobec pliku niepodpisanego: ostrzeżenie
    przy otwarciu pobranego pliku, pytanie o uprawnienia bez nazwy wydawcy,
    a tam, gdzie działają reguły dopuszczające programy po wydawcy —
    zablokowanie.

    Oprogramowanie podpisane w sposób zwykły, czyli zdecydowana większość,
    nie zmienia zachowania w żaden sposób. Aktualizacje systemu i sterowniki
    również.

    Zmiana obowiązuje dla plików sprawdzanych po jej wprowadzeniu. Pliki już
    uruchomione działają dalej.

    Nie ma restartu.
  en: |
    What needs checking is whether the organisation distributes files marked after
    signing.

    It is a way of working met at some software makers and in tools for distributing
    programs: a finished, signed installer gets a customer, campaign or station
    identifier added - in exactly the place the item starts watching. After the
    rollout such a file loses its valid signature.

    The symptom is misleading and worth knowing in advance. The file will still start,
    but the system will treat it as an unsigned one: a warning when a downloaded file
    is opened, a request for privileges with no vendor name, and where rules admitting
    programs by vendor are in force - a block.

    Software signed the ordinary way, which is the great majority, does not change
    behaviour in any way. System updates and drivers likewise.

    The change holds for files checked after it is made. Files already running carry
    on.

    There is no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - updates-and-servicing
    - drivers-and-devices
  what_breaks:
    pl:
      - Instalator znakowany identyfikatorem po podpisaniu przestanie być uznawany za podpisany
      - Pytanie o uprawnienia dla takiego pliku przestanie pokazywać nazwę wydawcy
      - Reguły dopuszczające programy po wydawcy zablokują pliki znakowane po podpisaniu
      - Oprogramowanie podpisane w sposób zwykły, sterowniki i aktualizacje działają bez zmian
    en:
      - An installer marked with an identifier after signing stops being counted as signed
      - The request for privileges for such a file stops showing the vendor's name
      - Rules admitting programs by vendor block files marked after signing
      - Software signed the ordinary way, drivers and updates work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Organizacja rozprowadza instalatory znakowane identyfikatorem po podpisaniu
      - Producent oprogramowania branżowego dopisuje dane do gotowego, podpisanego pliku
    en:
      - The organisation distributes installers marked with an identifier after signing
      - The maker of trade software adds data to a finished, signed file
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is kept twice: once for programs built for this system and
      # once for those built for the older word length. Both have to be set,
      # because a program checks the signature in the view it runs in.
      $paths = [ordered]@{
        native  = 'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config'
        wow6432 = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
      }
      $name = 'EnableCertPaddingCheck'
      $missing = @()
      $other = @()
      foreach ($entry in $paths.GetEnumerator()) {
        $value = $null
        if (Test-Path -Path $entry.Value) {
          $value = (Get-ItemProperty -Path $entry.Value -ErrorAction Stop).$name
        }
        if ($null -eq $value) { $missing += $entry.Key }
        elseif (([string]$value).Trim() -ne '1') { $other += ($entry.Key + '=' + [string]$value) }
      }
      if ($missing.Count -gt 0) { 'MISSING ' + ($missing -join ',') }
      elseif ($other.Count -gt 0) { 'OTHER ' + ($other -join ',') }
      else { 'AS_REQUIRED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    $name = 'EnableCertPaddingCheck'
    $state = foreach ($path in $paths) {
      $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
      [pscustomobject]@{
        path        = $path
        name        = $name
        value       = $current
        existed     = ($null -ne $current)
        key_existed = (Test-Path -Path $path)
      }
    }
    $state | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Wintrust\Config'
    )
    foreach ($path in $paths) {
      if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
      Set-ItemProperty -Path $path -Name 'EnableCertPaddingCheck' -Value '1' -Type String
    }

  rollback_command: |
    $state = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($b in @($state)) {
      if ($b.existed) {
        Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
      } elseif ($b.key_existed) {
        Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      } else {
        Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/security-updates/securityadvisories/2014/2915720

notes:
  pl: |
    Ustawienie jest przechowywane dwa razy: raz dla programów zbudowanych dla
    tego systemu i raz dla zbudowanych dla starszej długości słowa. Program
    sprawdza podpis w tym widoku rejestru, w którym sam pracuje, więc ustawienie
    jednego wpisu zostawia drugą połowę programów przy starym zachowaniu.
    Reguła czyta oba wpisy i nazywa ten, którego brakuje — rozbicie tego na dwie
    reguły pozwoliłoby maszynie ustawionej w połowie przejść jako zgodna.

    Wpis jest tekstem, a nie liczbą, i tak też jest zapisywany przez naprawę.
    Wartość liczbowa bywa spotykana w gotowych przepisach krążących w sieci
    i nie zawsze jest odczytywana tak, jak się spodziewa piszący.

    Punkt dotyczy sprawdzania podpisu, a nie jego wymagania. Maszyna nadal
    uruchamia pliki niepodpisane — zmienia się to, czy plik z doklejoną
    zawartością uchodzi za podpisany.
  en: |
    The setting is kept twice: once for programs built for this system and once for
    those built for the older word length. A program checks a signature in the
    registry view it runs in, so setting one entry leaves the other half of programs
    at the old behaviour. The rule reads both entries and names the one that is
    missing - splitting this into two rules would let a half-set machine pass as
    compliant.

    The entry is a text rather than a number, and that is how the remediation writes
    it. A numeric value turns up in ready-made recipes circulating on the network and
    is not always read the way whoever writes it expects.

    The item concerns the checking of a signature, not the requiring of one. The
    machine still runs unsigned files - what changes is whether a file with appended
    content passes as signed.
