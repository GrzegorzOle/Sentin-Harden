id: win10-laps-password-complexity

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Złożoność losowanego hasła lokalnego administratora pełna
    en: Full complexity of the randomly chosen local administrator password
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Mechanizm losujący hasło ma kilka stopni złożoności: same małe litery, litery
    obu wielkości, litery z cyframi i wreszcie pełny zestaw razem ze znakami
    specjalnymi. Każdy niższy stopień zawęża zbiór, z którego hasło jest losowane,
    a więc skraca czas potrzebny na jego odgadnięcie.

    Ponieważ hasła nikt nie wpisuje, obniżanie złożoności nie kupuje żadnej
    wygody. Wybór stopnia niższego bywa pozostałością po narzędziu, które kiedyś
    nie radziło sobie ze znakami specjalnymi.

    Pełna złożoność jest tu ustawieniem domyślnym i jedynym rozsądnym. Zasada
    pilnuje, żeby nikt nie obniżył go po drodze, rozwiązując jakiś inny problem.
  en: |
    The mechanism picking the password has several degrees of complexity - lower
    case alone, both cases, letters with digits, and finally the full set
    including special characters. Each lower degree narrows the pool the password
    is drawn from and so shortens the time needed to guess it.

    Since nobody types the password, lowering complexity buys no convenience at
    all. Choosing a lower degree is usually a leftover from a tool that once could
    not cope with special characters.

    Full complexity is the default here and the only sensible setting. The rule
    guards against somebody lowering it along the way while solving some other
    problem.

disruption_description:
  pl: |
    Zmiana jest niewidoczna, bo hasło i tak trafia do katalogu, a stamtąd do
    schowka osoby, która je odczytuje. Nie wymaga przerwy ani ponownego
    uruchomienia.

    Ryzyko dotyczy wyłącznie narzędzi, które źle obchodzą się ze znakami
    specjalnymi — starsze konsole sprzętowe, skrypty przekazujące hasło w wierszu
    polecenia bez cudzysłowów. Tam problem ujawni się jako nieudane logowanie przy
    poprawnym haśle i bywa mylony z awarią mechanizmu.
  en: |
    The change is invisible, because the password goes to the directory anyway and
    from there to the clipboard of whoever reads it. It calls for no interruption
    and no restart.

    The risk concerns only tools that handle special characters badly - older
    hardware consoles, scripts passing the password on a command line without
    quoting. There the trouble shows as a failed sign-in with a correct password
    and is easily mistaken for a fault in the mechanism.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypty przekazujące hasło w wierszu polecenia bez cudzysłowów zaczną się mylić na znakach specjalnych i zgłoszą błędne hasło
      - Starsze konsole zarządzania sprzętem mogą nie przyjąć części znaków, co wygląda jak hasło niepoprawne, a jest ograniczeniem narzędzia
      - Zmiana obowiązuje przy następnym losowaniu, więc hasło obecne w katalogu pozostaje dotychczasowe
      - Odczyt hasła z katalogu, logowanie lokalne i pozostałe ustawienia tego mechanizmu działają bez zmian
    en:
      - Scripts passing the password on a command line without quoting start tripping over special characters and report a wrong password
      - Older hardware management consoles may refuse some characters, which looks like an incorrect password but is a limit of the tool
      - The change applies from the next pick, so the password currently in the directory stays as it is
      - Reading the password from the directory, local sign-in and the other settings of this mechanism are unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny obsługiwane narzędziem, które nie radzi sobie ze znakami specjalnymi w haśle
      - Środowiska ze skryptami przekazującymi hasło bez cudzysłowów, dopóki nie zostaną poprawione
    en:
      - Machines served by a tool that cannot cope with special characters in a password
      - Environments with scripts passing the password unquoted, until those scripts are corrected
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordComplexity'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $name = 'PasswordComplexity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordComplexity' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Czwórka oznacza pełny zestaw znaków i jest wartością domyślną mechanizmu.
    Wartość niższa nie jest błędem konfiguracji, tylko świadomym obniżeniem, więc
    przy niezgodności warto ustalić, kto i po co ją zapisał.
  en: |
    Four stands for the full character set and is the default of the mechanism. A
    lower value is not a configuration error but a deliberate lowering, so where
    the item is unmet it is worth establishing who wrote it and why.
