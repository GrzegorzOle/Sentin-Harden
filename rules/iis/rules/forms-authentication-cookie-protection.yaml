id: iis-forms-authentication-cookie-protection

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Ciasteczko logowania jednocześnie szyfrowane i opieczętowane
    en: The sign-in cookie is both encrypted and sealed
  level: 1
  profile: application

platform:
  system: iis

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy aplikacja loguje użytkownika własnym formularzem, tożsamość
    zalogowanego trafia do ciasteczka i wraca z każdym kolejnym żądaniem.
    To ciasteczko jest w praktyce przepustką — serwer nie pyta ponownie
    o hasło, tylko wierzy temu, co w nim zapisano. To ustawienie rozstrzyga,
    jak bardzo mu wierzyć.

    Są cztery możliwości i tylko jedna z nich jest sensowna. Ciasteczko może
    być zaszyfrowane i opieczętowane, może być tylko zaszyfrowane, może być
    tylko opieczętowane, albo może nie być chronione wcale. Wariant bez
    ochrony znaczy dokładnie to, co brzmi: nazwa użytkownika jedzie
    w ciasteczku otwartym tekstem i można ją podmienić w narzędziach
    przeglądarki. Wariant z samym szyfrowaniem jest gorszy, niż wygląda —
    szyfr bez pieczęci daje się podrabiać metodami, które są opisane od lat.

    Co to odbiera atakującemu: możliwość wystawienia sobie przepustki na
    cudze nazwisko. Po zmianie zawartość ciasteczka jest nieczytelna
    i jednocześnie każda jej modyfikacja zostaje wykryta, więc jedyną drogą
    do cudzej sesji jest kradzież całego ciasteczka, a nie jego przerobienie.
  en: |
    Where an application signs a user in with a form of its own, the identity of
    the signed-in user goes into a cookie and comes back with every subsequent
    request. That cookie is in practice a pass - the server does not ask for the
    password again, it trusts what is written there. This setting decides how far
    to trust it.

    There are four possibilities and only one of them makes sense. The cookie may
    be encrypted and sealed, may be only encrypted, may be only sealed, or may
    not be protected at all. The unprotected variant means exactly what it sounds
    like - the user name travels in the cookie in plain text and can be swapped
    in the browser's own tools. The encryption-only variant is worse than it
    looks - a cipher without a seal can be forged by methods that have been
    written up for years.

    What it takes away from an attacker - the ability to issue themselves a pass
    in somebody else's name. After the change the contents of the cookie are
    unreadable and at the same time any modification of them is detected, so the
    only road to somebody else's session is stealing the whole cookie rather than
    reworking it.

disruption_description:
  pl: |
    W przeciwieństwie do zmiany algorytmu, ta zmiana w większości instalacji
    nie robi nic — pełna ochrona jest ustawieniem domyślnym i wpis pojawia się
    zwykle dlatego, że ktoś go kiedyś świadomie osłabił. Dlatego klasa jest
    „wymaga sprawdzenia", a nie „świadome wdrożenie": pytanie brzmi, czy ktoś
    to osłabił i po co.

    Jeśli osłabił, powody bywają dwa. Pierwszy: aplikacja odczytuje ciasteczko
    sama, poza mechanizmem środowiska — na przykład skrypt po stronie
    przeglądarki albo osobna usługa zagląda do jego treści. Po włączeniu
    szyfrowania ta treść jest nieczytelna i taki odczyt przestaje działać;
    objawia się to nie błędem logowania, tylko pustą wartością tam, gdzie
    spodziewano się nazwy użytkownika. Drugi: ciasteczko jest wymieniane
    z inną aplikacją, która nie umie go rozszyfrować.

    Poza tym skutek jest taki sam jak przy każdej zmianie w tej okolicy:
    ciasteczka wystawione wcześniej przestają pasować, więc zalogowani
    użytkownicy zostają wylogowani. Nie jest to awaria, tylko ponowne
    zalogowanie, ale przy kilkuset osobach naraz warto zrobić to poza
    godzinami pracy.
  en: |
    Unlike a change of algorithm, this change does nothing in most installations
    - full protection is the default and the entry usually appears because
    somebody once deliberately weakened it. Hence the class is "needs a look"
    rather than "planned rollout" - the question is whether somebody weakened it
    and what for.

    Where they did, there tend to be two reasons. First - the application reads
    the cookie itself, outside the runtime's mechanism; a script on the browser
    side or a separate service looks into its contents, say. Once encryption is
    on those contents are unreadable and such a read stops working; it shows up
    not as a sign-in error but as an empty value where a user name was expected.
    Second - the cookie is exchanged with another application that cannot decrypt
    it.

    Beyond that the effect is the same as with any change in this area - cookies
    issued earlier stop matching, so signed-in users are signed out. It is not a
    failure, only a fresh sign-in, but with several hundred people at once it is
    worth doing outside working hours.

implementation_consequences:
  impact_areas:
    - web-server-services
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Skrypt po stronie przeglądarki odczytujący nazwę użytkownika wprost z ciasteczka dostaje treść nieczytelną i najczęściej wartość pustą, a nie błąd
      - Zewnętrzna usługa wymieniająca to ciasteczko z aplikacją przestaje je rozumieć, o ile nie zna klucza
      - Zalogowani użytkownicy zostają wylogowani w chwili zapisu, bo wcześniejsze ciasteczka przestają pasować
      - Narzędzia diagnostyczne pokazujące zawartość ciasteczka przestają być przydatne przy zgłoszeniach
    en:
      - A browser-side script reading the user name straight from the cookie gets unreadable contents and most often an empty value rather than an error
      - An external service exchanging this cookie with the application stops understanding it, unless it knows the key
      - Signed-in users are signed out at the moment of the write, because earlier cookies stop matching
      - Diagnostic tools showing the contents of the cookie stop being useful when handling reports
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Aplikacje celowo odczytujące zawartość tego ciasteczka poza mechanizmem środowiska, dopóki nie zostaną przerobione
      - Wymiana ciasteczka z usługą, która nie zna klucza tej aplikacji
    en:
      - Applications deliberately reading the contents of this cookie outside the runtime mechanism, until they have been reworked
      - Exchange of the cookie with a service that does not know this application's key
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
            -Filter 'system.web/authentication/forms' -Name 'protection' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          # The weaker settings are reported as they stand rather than folded
          # into one verdict. Which of them is in place decides how the fix is
          # judged - an unprotected cookie is a different conversation from one
          # that is merely unsealed.
          if ($null -eq $value) { 'MISSING' } else { [string]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'All'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # This section sits in the framework root configuration, which the server's
    # own backup does not reach. Both variants of the file are copied, because
    # a 32-bit application pool reads a different one than a 64-bit pool does.
    $files = @()
    foreach ($base in @('Framework', 'Framework64')) {
      $source = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\web.config')
      if (Test-Path $source) {
        $copy = '{{backup_file}}' + '.' + $base + '.web.config'
        Copy-Item -Path $source -Destination $copy -Force
        $files += [pscustomobject]@{ source = $source; copy = $copy }
      }
    }
    if ($files.Count -eq 0) {
      throw 'The framework root configuration was not found, so nothing was secured and nothing may be changed.'
    }
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/authentication/forms' -Name 'protection' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'framework-root'
      filter  = 'system.web/authentication/forms'
      name    = 'protection'
      value   = [string]$value
      existed = ($null -ne $value)
      files   = $files
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and copied the framework root configuration"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/authentication/forms' -Name 'protection' -Value 'All'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($f in $b.files) {
      if (-not (Test-Path $f.copy)) {
        throw 'A copy recorded in the backup file is missing, so nothing was restored.'
      }
    }
    foreach ($f in $b.files) {
      Copy-Item -Path $f.copy -Destination $f.source -Force
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.formsauthenticationconfiguration.protection
  - https://learn.microsoft.com/aspnet/core/security/authentication/cookie

notes:
  pl: |
    Pełna ochrona jest wartością domyślną, więc na większości maszyn ten punkt
    wyjdzie spełniony. Sprawdzenie zgłasza wtedy wartość dosłownie — także
    słabsze warianty, bo między ciasteczkiem bez ochrony a ciasteczkiem
    zaszyfrowanym bez pieczęci jest różnica warta zobaczenia przy podejmowaniu
    decyzji.

    Ustawienie działa tylko tam, gdzie aplikacja loguje użytkownika własnym
    formularzem. Aplikacja uwierzytelniająca inaczej — poświadczeniami systemu,
    zewnętrznym dostawcą tożsamości, certyfikatem — nie używa tego ciasteczka
    i zmiana nie ma dla niej znaczenia.

    Zapis idzie do konfiguracji głównej środowiska uruchomieniowego, czyli
    ustawia wartość domyślną dla wszystkich aplikacji na serwerze. Aplikacja
    z własnym wpisem w swoim pliku konfiguracyjnym nadpisuje tę wartość
    i wymaga poprawki u siebie.
  en: |
    Full protection is the default, so on most machines this item will come out
    met. The check then reports the value literally - the weaker variants too,
    because between an unprotected cookie and one encrypted but unsealed there is
    a difference worth seeing when taking a decision.

    The setting applies only where an application signs a user in with a form of
    its own. An application authenticating some other way - with system
    credentials, an external identity provider, a certificate - does not use this
    cookie and the change means nothing to it.

    The write goes to the framework root configuration, which means it sets the
    default for every application on the server. An application with an entry of
    its own in its configuration file overrides that value and calls for a
    correction there.
