id: win10-installer-user-control-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Ustawianie parametrów instalacji przez użytkownika wyłączone
    en: The setting of installation parameters by a user switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera użytkownikowi bez uprawnień możliwość podawania
    własnych parametrów przy instalacji pakietu wykonywanej z uprawnieniami
    wyższymi niż jego własne.

    Parametry instalacji to wartości sterujące tym, co pakiet robi: gdzie
    kopiuje pliki, jakie wpisy zakłada, jaki program uruchamia po
    zakończeniu. Gdy instalacja biegnie z uprawnieniami podwyższonymi,
    wartości te są wykonywane z tymi uprawnieniami.

    Bez tego ustawienia użytkownik może podać własną wartość parametru
    wskazującego na przykład katalog docelowy albo plik uruchamiany po
    instalacji. Nie zmienia to samego pakietu — pakiet może być podpisany
    i pochodzić z miejsca zaufanego — lecz zmienia to, co pakiet zrobi.

    Jest to atak wygodny właśnie dlatego, że obchodzi zaufanie do pakietu
    zamiast je łamać. Wszystko, na co patrzy się przy ocenie instalacji —
    podpis, pochodzenie, suma kontrolna — zostaje w porządku, a wykonane
    zostaje co innego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zmiany tego, co robi zaufany pakiet instalacyjny, z konta bez uprawnień.
  en: |
    The setting takes from a user without rights the means of giving parameters of their own at an installation
    carried out with rights higher than theirs.

    Installation parameters are values steering what a package does: where it copies files, what entries it
    lays down, what program it runs at the end. Where the installation runs with raised rights, those values
    are carried out with those rights.

    Without this setting a user may give a value of their own for a parameter pointing, say, at the target
    directory or at a file run after installing. That does not change the package itself - the package may be
    signed and come from a trusted place - but it changes what the package will do.

    It is an attack convenient for just this reason, that it goes round trust in the package rather than
    breaking it. Everything looked at while judging an installation - the signature, the provenance, the
    checksum - stays in order, while something else gets carried out.

    What an attacker gains while the item goes unmet: the means of changing what a trusted installation package
    does, from an account without rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czy ktoś tych
    parametrów u siebie używa.

    Ustawienie to jest domyślnie wyłączone, więc na maszynie nietykanej
    zmiana potwierdza stan zastany. Sprawdzenie ma sens tam, gdzie zostało
    włączone, bo włączano je z powodu.

    Powodów bywają dwa. Pierwszy to instalacje, w których użytkownik wskazuje
    katalog docelowy — najczęściej dlatego, że dysk systemowy jest mały.
    Po zmianie pakiet zainstaluje się w miejscu domyślnym i trzeba będzie
    albo to miejsce zmienić w samym pakiecie, albo instalować z konta
    administracyjnego.

    Drugi to skrypty wdrożeniowe uruchamiane na koncie użytkownika
    i przekazujące parametry w wierszu polecenia. Te przestaną działać,
    a objawi się to błędem instalacji, nie zawieszeniem.

    Instalacje bez parametrów, czyli zdecydowana większość, przechodzą bez
    zmiany.

    Czego to nie psuje: programów już zainstalowanych, aktualizacji
    systemowych, instalacji z konta administracyjnego, wdrożeń z konta
    usługi, sieci, profili.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "needs review", and the review touches whether anybody uses those parameters at their place.

    The setting is off by default, so on an untouched machine the change confirms the state found. The review
    makes sense where it has been switched on, that having been done for a reason.

    There are as a rule two reasons. The first is installations in which the user points at the target
    directory - most often because the system disk is small. After the change the package will install in the
    default place, and either that place will have to be changed in the package itself or the installing will
    have to be done from an administrative account.

    The second is rollout scripts run on a user's account and passing parameters on the command line. Those will
    cease working, and that will show itself as an installation error rather than a hang.

    Installations without parameters, which is the great majority, pass unchanged.

    What this does not break: programs already installed, system updates, installing from an administrative
    account, rollouts under a service account, the network, or profiles.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalacja, w której użytkownik wskazuje katalog docelowy, kładzie pliki w miejscu domyślnym albo kończy się błędem
      - Skrypt wdrożeniowy uruchamiany na koncie użytkownika i przekazujący parametry w wierszu polecenia przestaje działać
      - Instalacje bez parametrów, czyli zdecydowana większość, przechodzą dokładnie tak jak dotąd
      - Instalacja z konta administracyjnego i wdrożenia z konta usługi pozostają bez zmian
      - Programy już zainstalowane, aktualizacje systemowe, praca sieci i profile pozostają bez zmian
    en:
      - An installation in which the user points at the target directory lays its files in the default place or ends in an error
      - A rollout script run on a users account and passing parameters on the command line ceases working
      - Installations without parameters, which is the great majority, pass exactly as before
      - Installing from an administrative account and rollouts under a service account stay unchanged
      - Programs already installed, system updates, the work of the network and profiles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie instaluje się oprogramowanie poza dyskiem systemowym, wskazując katalog przy instalacji
      - Wdrożenia prowadzą skrypty uruchamiane na koncie użytkownika i przekazujące parametry pakietowi
    en:
      - Software gets installed on this machine outside the system disk by pointing at a directory while installing
      - Rollouts are led by scripts run on a users account and passing parameters to the package
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'EnableUserControl'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'EnableUserControl'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only parameters given by a user at a raised installation go. Where packages
    # get installed outside the system disk by pointing at a directory, settle
    # that road first - the installation will otherwise end in an error.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableUserControl' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/enableusercontrol

notes:
  pl: |
    Reguła otwiera rodzinę instalatora i jest w niej najtrudniejsza do
    wytłumaczenia, bo dotyczy nie pakietu, tylko tego, co się do pakietu
    przekazuje. Warto, żeby aplikacja postawiła tę różnicę wprost: podpis
    pakietu nic tu nie rozstrzyga.

    Zestawienie osi jest korzystne — kategoria wysoka przy koszcie dającym
    się wskazać i ograniczonym do jednego sposobu pracy. Jest to punkt,
    przy którym pytanie do użytkownika brzmi konkretnie: „czy ktoś u was
    wskazuje katalog przy instalacji".

    Odnotowuję, że reguła ta i reguła o podpisanych poprawkach dostawcy
    opisują ten sam mechanizm z dwóch stron — obie dotyczą tego, co wolno
    wykonać z uprawnieniami podwyższonymi w trakcie instalacji.
  en: |
    The rule opens the installer family and is the hardest in it to set out, touching not the package but what
    gets passed to the package. It is well that the application put that difference outright: the package's
    signature settles nothing here.

    The pairing of the axes is a favourable one - a high category at a cost to be pointed at and held to one way
    of working. It is an item at which the question to the user runs concretely: "does anybody at your place
    point at a directory while installing".

    Worth noting that this rule and the rule about a vendor's signed patches describe the same mechanism from
    two sides - both touch what may be carried out with raised rights in the course of installing.
