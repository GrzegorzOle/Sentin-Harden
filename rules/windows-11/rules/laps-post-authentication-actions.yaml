id: win11-laps-post-authentication-actions

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Sprzątanie po użyciu hasła lokalnego administratora włączone
    en: Clearing up after the local administrator password's use switched on
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, co maszyna robi po tym, jak ktoś zalogował się
    lokalnym kontem administratora: czy zmienia hasło i zamyka sesję, czy
    zostawia wszystko tak, jak było.

    Reguła zamyka lukę, której samo losowanie haseł nie zamyka, i warto ją
    zobaczyć osobno. Mechanizm losujący dba o to, żeby hasło było inne na
    każdej maszynie i żeby zmieniało się co jakiś czas. Nie dba o to, co się
    dzieje w chwili, gdy hasło zostaje użyte.

    A w tej chwili dzieje się rzecz istotna: hasło przestaje być tajemnicą.
    Zna je ten, kto je odczytał, zna je narzędzie, przez które przeszło, i zna
    je każdy, komu zostało przekazane „na czas naprawy". Termin następnej
    zmiany może być odległy o tygodnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno między
    użyciem hasła a jego planową zmianą. Jest to okno długie i łatwe do
    wykorzystania, bo hasło jest wtedy znane, ważne i prowadzi do konta
    z pełnymi uprawnieniami na maszynie.

    Dochodzi do tego druga rzecz: sesja pozostawiona po zalogowaniu.
    Zamknięcie jej wraz ze zmianą hasła odbiera możliwość powrotu do sesji
    porzuconej i niezablokowanej.
  en: |
    The setting settles what the machine does after somebody has signed in with the local
    administrator account: whether it changes the password and closes the session, or
    leaves everything as it was.

    The rule closes a gap that the choosing of passwords does not close on its own, and it
    is worth seeing apart. The choosing mechanism sees to the password being different on
    each machine and changing from time to time. It does not see to what happens at the
    moment the password is used.

    And at that moment something weighty happens: the password stops being a secret. It is
    known to whoever read it, known to the tool it passed through, and known to everyone it
    was handed to "for the time of the repair". The term of the next change may be weeks
    away.

    What an attacker gains while the item goes unmet: the window between the password's use
    and its scheduled change. It is a long window and easy to use, since the password is
    then known, valid, and leads to an account with full rights on the machine.

    To this is added a second thing: the session left behind after the sign-in. Closing it
    along with the password change takes away the means of returning to a session abandoned
    and unlocked.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak wygląda praca serwisowa na koncie lokalnego
    administratora — bo zmiana dotyka jej wprost.

    Skutek pojawia się po upływie zwłoki liczonej od zalogowania: sesja
    zostaje zamknięta, a hasło zmienione. Praca niezapisana w tej sesji
    przepada. Osoba, która potrzebuje wrócić, musi odczytać hasło z katalogu
    na nowo.

    Jest to odczuwalne przy naprawach długich — takich, gdzie technik loguje
    się rano i wraca do maszyny po południu. Zwłoka jest regulowana osobnym
    ustawieniem i to ona przesądza, czy zmiana jest uciążliwa, czy
    niezauważalna.

    Sprawdzenia wymagają też procedury automatyczne pracujące na tym koncie:
    instalacje, kopie, narzędzia inwentaryzacyjne. Jeżeli logują się lokalnym
    administratorem i zostawiają sesję otwartą, ich przebieg może zostać
    przerwany.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is what service work on the local administrator account looks like
    - since the change touches it directly.

    The effect appears after the delay counted from the sign-in has run out: the session is
    closed and the password changed. Work unsaved in that session is lost. Someone who
    needs to return has to read the password from the directory afresh.

    It is felt at long repairs - the kind where a technician signs in in the morning and
    comes back to the machine in the afternoon. The delay is governed by a separate setting
    and it is that which settles whether the change is a burden or goes unnoticed.

    Automatic procedures working on that account need checking too: installations, backups,
    inventory tools. If they sign in as the local administrator and leave the session open,
    their course may be broken off.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Sesja lokalnego administratora zostaje zamknięta po upływie zwłoki
      - Praca niezapisana w tej sesji przepada bez ostrzeżenia
      - Powrót do maszyny wymaga odczytania hasła z katalogu na nowo
      - Procedury automatyczne pracujące na tym koncie mogą zostać przerwane
    en:
      - The local administrator's session is closed once the delay has run out
      - Work unsaved in that session is lost with no warning
      - Returning to the machine takes reading the password from the directory afresh
      - Automatic procedures working on that account may be broken off
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedury serwisowe wymagają wielogodzinnej sesji lokalnego administratora bez przerwy
    en:
      - Service procedures take a local administrator session of many hours without a break
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three means the password is reset and the account signed out;
      # zero leaves everything as it was.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PostAuthenticationActions'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(3|5|11)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PostAuthenticationActions' -ErrorAction SilentlyContinue).'PostAuthenticationActions'
    [pscustomobject]@{
      path        = $path
      name        = 'PostAuthenticationActions'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Three is the mildest of the compliant variants: the password is reset and
    # the account signed out, with running processes left alone.
    Set-ItemProperty -Path $path -Name 'PostAuthenticationActions' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Reguła dopuszcza kilka wartości, bo warianty różnią się ostrością:
    od zmiany hasła z wylogowaniem po zmianę hasła z wylogowaniem
    i zakończeniem pozostałych procesów. Wszystkie one spełniają punkt;
    wariant zerowy, w którym nie dzieje się nic, nie spełnia.

    Polecenie naprawcze zapisuje wariant najłagodniejszy z dopuszczonych.
    Tam, gdzie po sesji serwisowej zostają procesy uruchomione na tym koncie,
    warto rozważyć wariant ostrzejszy — ale jest to decyzja osobna i reguły
    nie przesądza.

    Reguła tworzy parę z tą, która ustala zwłokę liczoną od zalogowania.
    Bez tamtej sprzątanie następuje w chwili, której nikt nie kontroluje.

    Brak wartości nie jest stanem zgodnym, bo domyślnie po użyciu hasła nie
    dzieje się nic.
  en: |
    The rule admits several values, since the variants differ in sharpness: from a password
    reset with a sign-out to a password reset with a sign-out and the ending of the
    remaining processes. All of them meet the item; the zero variant, in which nothing
    happens, does not.

    The remedy command writes the mildest of the admitted variants. Where processes started
    on that account are left after a service session, a sharper variant is worth weighing -
    but that is a separate decision and the rule does not settle it.

    The rule forms a pair with the one fixing the delay counted from the sign-in. Without
    that one the clearing up happens at a moment nobody controls.

    A missing value is not a compliant state, since by default nothing happens after the
    password's use.
