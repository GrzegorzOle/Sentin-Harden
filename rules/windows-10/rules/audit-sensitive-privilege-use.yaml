id: win10-audit-sensitive-privilege-use

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Privilege Use
  title:
    pl: Inspekcja użycia uprawnień wrażliwych
    en: The audit of the use of sensitive rights
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje użycie uprawnień, które pozwalają obejść zwykłe
    ograniczenia systemu: przejęcie własności zasobu, debugowanie cudzego
    procesu, ładowanie sterownika, działanie jako część systemu
    operacyjnego i tworzenie tokenów.

    Wszystkie pozostałe reguły bloku mówią o tym, kto co ma. Ta mówi
    o tym, kto czego użył — a to jest różnica między uprawnieniem
    nadanym a uprawnieniem wykorzystanym. Konto administracyjne ma te
    uprawnienia od zawsze i przez większość czasu z żadnego z nich nie
    korzysta.

    Najważniejszym wpisem jest debugowanie cudzego procesu. Jest to
    uprawnienie potrzebne, żeby czytać pamięć procesu odpowiadającego za
    logowanie, czyli żeby sięgnąć po poświadczenia. Narzędzie robiące to
    zostawia tu wpis, niezależnie od tego, jak się nazywa i skąd zostało
    uruchomione.

    Zapisywane są oba wyniki. Połowa nieudana pokazuje sięganie po
    uprawnienie, którego konto nie ma — czyli rozpoznawanie własnych
    możliwości, zwykle wcześniejsze niż cokolwiek innego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: użycie
    uprawnień obchodzących zabezpieczenia systemu bez śladu wskazującego,
    kiedy i przez kogo.
  en: |
    The setting writes down the use of the rights that allow the system's ordinary bounds to be gone round: the
    taking of ownership of a resource, the debugging of somebody else's process, the loading of a driver, the
    acting as part of the operating system, and the making of tokens.

    Every other rule in the block speaks of who holds what. This speaks of who used what - and that is the
    difference between a right granted and a right put to use. An administrative account has held those rights
    from the first and for most of the time uses none of them.

    The weightiest entry is the debugging of somebody else's process. It is the right needed to read the memory
    of the process answering for the signing in, which is to say to reach for credentials. A tool that does so
    leaves an entry here, whatever it is called and wherever it was started from.

    Both outcomes are written. The failed half shows a reaching for a right the account does not hold - which is
    to say a making out of one's own means, as a rule earlier than anything else.

    What an attacker gains while the item goes unmet: the use of the rights that go round the system's guards,
    with no trace naming when and by whom.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, co na
    tej maszynie z tych uprawnień korzysta.

    Ustawienie niczego nie zabrania i nie odbiera żadnego uprawnienia.
    Zapisuje wyłącznie ich użycie.

    Sprawdzić trzeba objętość, bo jest ona nierówna. Na maszynie bez
    narzędzi systemowych zapis jest cichy. Na maszynie z oprogramowaniem do
    kopii zapasowych, z agentem monitorującym albo ze środowiskiem
    programistycznym wpisy są liczne i regularne — bo właśnie te programy
    z uprawnień wrażliwych korzystają z natury swojej pracy.

    Skutek jest wtedy dwojaki: dziennik zapełnia się szybciej, a wpis
    istotny ginie wśród wpisów rutynowych. Jedno i drugie da się
    opanować odsianiem po nazwie programu, ale trzeba to zrobić od razu.

    Zapisywane są oba wyniki. Połowa nieudana jest tu cichsza i bardziej
    znacząca niż udana.

    Czego to nie psuje: samych uprawnień, narzędzi z nich korzystających,
    wydajności, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is what upon this machine uses those rights.

    The setting forbids nothing and takes no right away. It writes down their use alone.

    What has to be reviewed is the bulk, it being uneven. Upon a machine without system tools the record is
    quiet. Upon a machine with backup software, with a watching agent or with a programming environment the
    entries are many and regular - for it is just such programs that use sensitive rights by the nature of their
    work.

    The consequence is then twofold: the log fills the quicker, and a weighty entry is lost among the routine
    ones. Both may be mastered by sifting upon the program's name, but it has to be done at once.

    Both outcomes are written. The failed half is here the quieter and the more telling of the two.

    What this does not break: the rights themselves, the tools that use them, the speed of work, logging on,
    file shares, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - Oprogramowanie do kopii zapasowych, agent monitorujący i środowisko programistyczne dają wpisy liczne i regularne
      - Dziennik zapełnia się wtedy szybciej, a wpis istotny ginie wśród wpisów rutynowych
      - Odsianie po nazwie programu opanowuje jedno i drugie, ale trzeba je wykonać od razu po włączeniu
      - Ustawienie niczego nie zabrania i nie odbiera żadnego uprawnienia
      - Narzędzia korzystające z tych uprawnień, wydajność, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Backup software, a watching agent and a programming environment give entries many and regular
      - The log then fills the quicker, and a weighty entry is lost among the routine ones
      - A sifting upon the program s name masters both, but it has to be done at once after the switching on
      - The setting forbids nothing and takes no right away
      - The tools that use those rights, the speed of work, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje oprogramowanie korzystające z uprawnień wrażliwych stale i nie ma czym odsiać jego wpisów
      - Dziennik zabezpieczeń ma rozmiar domyślny, a zdarzenia nie są zbierane poza maszynę
    en:
      - Software using sensitive rights without cease works upon the machine and there is no means of sifting its entries out
      - The security log is of its default size and the events are not gathered away from the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9228-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9228-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9228-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. The failed half holds the reaching for a right the
    # account does not hold, which is the quieter and the more telling of the two.
    auditpol /set /subcategory:"{0CCE9228-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9228-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-sensitive-privilege-use

notes:
  pl: |
    Reguła jest w tym bloku jedyną opisującą użycie, a nie posiadanie.
    Warto, żeby aplikacja to nazwała, bo punkt postawiony obok reguł
    o przypisaniu uprawnień wygląda na ich powtórzenie, a jest ich
    dopełnieniem.

    Argument wart postawienia wprost dotyczy debugowania cudzego procesu.
    Jest to jedyne uprawnienie, którego użycie samo w sobie jest pytaniem —
    bo poza narzędziami programistycznymi i diagnostycznymi nie ma powodu,
    żeby jeden program czytał pamięć drugiego.

    Odnotowuję nierówność objętości, bo przesądza o tym, czy reguła jest
    tania. Ta sama podkategoria na stanowisku biurowym jest niemal pusta,
    a na maszynie z agentem monitorującym daje setki wpisów dziennie.
    Aplikacja korzystająca z inwentaryzacji z etapu audytu może o tym
    uprzedzić przed wykonaniem.
  en: |
    The rule is the only one in this block describing use and not holding. It is well that the application name
    that, the item set beside the rules about the granting of rights looking like a repeating of them while it
    is their rounding out.

    The argument worth putting outright touches the debugging of somebody else's process. It is the one right
    whose use is of itself a question - for outside the tools of programming and of diagnosis there is no reason
    for one program to read another's memory.

    I set down the unevenness of bulk, it settling whether the rule comes cheap. The same subcategory upon an
    office workstation is near empty, while upon a machine with a watching agent it gives hundreds of entries a
    day. An application drawing upon the taking of stock from the audit stage can give warning of that before
    the carrying out.
