id: win2016-defender-behavior-monitoring

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > Real-time Protection
  title:
    pl: Monitorowanie zachowania włączone
    en: Behaviour monitoring switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza obserwowanie tego, co programy na maszynie robią,
    zamiast wyłącznie sprawdzania, czym są.

    Pozostałe warstwy ochrony pytają o plik: czy jest znany, czy pasuje do
    wzorca, czy ktoś już go gdzieś widział. Pytanie to ma granicę
    oczywistą — rzecz zupełnie nowa nie jest znana nikomu i przechodzi.
    Obserwowanie zachowania pyta inaczej: nie czym to jest, tylko co robi.

    Ciągi czynności, po których rozpoznaje się atak, są przy tym zaskakująco
    stałe. Proces, który zaczyna czytać pamięć innego procesu; program
    pocztowy uruchamiający powłokę; narzędzie systemowe zapisujące plik
    wykonywalny w katalogu tymczasowym i natychmiast go uruchamiające.
    Żadna z tych czynności nie jest sama w sobie zakazana — zakazany jest
    ich ciąg.

    Na serwerze warstwa ta waży więcej niż na stanowisku roboczym i warto
    rozumieć dlaczego. Atak na serwer rzadko przychodzi jako plik, który ktoś
    otworzył. Przychodzi jako wykorzystanie usługi, która i tak nasłuchuje,
    i jako ciąg czynności wykonanych narzędziami stojącymi na maszynie
    legalnie. Sprawdzanie plików nie ma wtedy czego sprawdzać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: swobodę
    w posługiwaniu się narzędziami systemowymi i wykorzystywaniu
    nasłuchujących usług, czyli całą tę część ataku, w której nie ma
    żadnego pliku do rozpoznania.
  en: |
    The setting switches on the watching of what programs on the machine do, instead
    of the checking of what they are alone.

    The other layers of protection ask about a file: is it known, does it match a
    pattern, has anybody seen it somewhere already. That question has an obvious
    limit - a thing entirely new is known to nobody and passes. Watching behaviour
    asks otherwise: not what this is, but what it does.

    The strings of acts by which an attack is recognised are, at that, surprisingly
    constant. A process that begins reading another process's memory; a mail program
    starting a shell; a system tool writing an executable into a temporary directory
    and running it at once. None of those acts is forbidden in itself - what is
    forbidden is their string.

    On a server this layer weighs more than on a workstation, and it is worth
    grasping why. An attack on a server seldom comes as a file somebody opened. It
    comes as the using of a service that listens anyway, and as a string of acts
    done with tools standing on the machine lawfully. File checking then has nothing
    to check.

    What an attacker gains while the item goes unmet: freedom in wielding system
    tools and in using listening services, which is to say that whole part of an
    attack in which there is no file to recognise.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczą do sprawdzenia jest to, czy na
    maszynie działa oprogramowanie zachowujące się nietypowo.

    Brzmi to nieostro, więc warto podać przykłady. Nietypowo zachowują się:
    narzędzia wdrożeniowe uruchamiające kod z katalogów tymczasowych,
    systemy monitorujące czytające pamięć innych procesów, oprogramowanie
    przemysłowe wstrzykujące kod do procesów sterujących, starsze instalatory
    rozpakowujące się i uruchamiające w jednym kroku.

    Wszystkie te czynności są na maszynie prawowite i wszystkie wyglądają
    dokładnie tak jak atak. Zatrzymanie któregoś z tych programów jest
    głównym kosztem tej reguły.

    Postać pomyłki jest tu trudniejsza niż przy innych warstwach ochrony
    i to podnosi klasę. Proces zatrzymany przez monitorowanie zachowania nie
    daje komunikatu nikomu, bo przy serwerze nikt nie siedzi. Widać wyłącznie
    skutek — zadanie się nie wykonało, usługa się nie uruchomiła — a przyczyna
    leży w dzienniku ochrony, gdzie nikt jej nie szuka w pierwszej kolejności.

    Obciążenie jest drugorzędne i zauważalne tylko na maszynach bardzo
    obciążonych.

    Czego to nie psuje: usług, logowania, łączności, sprawdzania plików,
    pracy innego programu ochronnego.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check is whether software behaving
    unusually runs on the machine.

    That sounds vague, so examples are worth giving. Unusual behaviour belongs to:
    deployment tools running code from temporary directories, monitoring systems
    reading other processes' memory, industrial software injecting code into control
    processes, older installers unpacking and running in one step.

    All those acts are lawful on the machine and all look exactly like an attack.
    The halting of one of those programs is the chief cost of this rule.

    The shape of a mistake is harder here than at other layers of protection, and
    that raises the class. A process halted by behaviour monitoring gives no message
    to anybody, since nobody sits at the server. Only the effect is seen - the task
    did not run, the service did not start - while the cause lies in the
    protection's log, where nobody looks for it first.

    The load is secondary and noticeable only on very heavily burdened machines.

    What this does not break: services, signing in, connectivity, file checking, or
    the working of another protection program.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia wdrożeniowe uruchamiające kod z katalogów tymczasowych i starsze instalatory rozpakowujące się w jednym kroku bywają zatrzymywane
      - Systemy monitorujące czytające pamięć innych procesów oraz oprogramowanie przemysłowe wstrzykujące kod wyglądają dokładnie tak jak atak
      - Proces zatrzymany nie daje komunikatu nikomu, bo przy serwerze nikt nie siedzi, więc widać wyłącznie skutek, a przyczyna leży w dzienniku ochrony
      - Usługi, logowanie, łączność i sprawdzanie plików pozostają bez zmian
    en:
      - Deployment tools running code from temporary directories and older installers unpacking in one step are at times halted
      - Monitoring systems reading other processes' memory and industrial software injecting code look exactly like an attack
      - A halted process gives no message to anybody, since nobody sits at the server, so only the effect is seen while the cause lies in the protection's log
      - Services, signing in, connectivity and file checking stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa oprogramowanie przemysłowe albo monitorujące, którego sposób pracy nie został sprawdzony pod kątem tej warstwy
      - Nie ma nikogo, kto po wdrożeniu przejrzy dziennik ochrony, a zatrzymany proces nie zgłosi się sam
    en:
      - Industrial or monitoring software whose way of working has not been checked against this layer runs on the machine
      - There is nobody to look through the protection's log after rollout, while a halted process will not announce itself
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableBehaviorMonitoring) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableBehaviorMonitoring'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableBehaviorMonitoring' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Punkt jest jedynym w bloku, który ma szansę zadziałać wobec czegoś, czego
    nikt wcześniej nie widział. Wszystkie pozostałe warstwy opierają się na
    wiedzy o pliku; ta opiera się na sposobie postępowania. Warto pokazywać
    tę różnicę, bo tłumaczy, dlaczego punktu nie zastępuje żadna inna reguła
    bloku.

    Klasa jest podniesiona wobec stanowiska roboczego nie dlatego, że
    blokuje więcej, tylko przez postać pomyłki. Na stanowisku zatrzymany
    program zgłasza się natychmiast, bo ktoś przy nim siedzi. Na serwerze
    nie zgłasza się nikomu.

    Wynika stąd zalecenie praktyczne: po wdrożeniu warto przez kilka dni
    przejrzeć dziennik ochrony, zamiast czekać na zgłoszenie. Zgłoszenie
    przyjdzie znacznie później i pod inną postacią.
  en: |
    The item is the only one in the block standing a chance against something nobody
    has seen before. All the other layers rest on knowledge of a file; this one
    rests on a way of going about things. That difference is worth showing, since it
    explains why no other rule of the block stands in for this item.

    The class is raised against the workstation not because it blocks more, but on
    account of the shape of a mistake. On a workstation a halted program announces
    itself at once, somebody sitting at it. On a server it announces itself to
    nobody.

    From that follows a practical recommendation: after rollout it is worth looking
    through the protection's log for a few days rather than waiting for a report.
    The report will come much later and in another shape.
