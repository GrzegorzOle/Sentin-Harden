id: win2025-smb-insecure-guest-logons-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Lanman Workstation
  title:
    pl: Niezabezpieczone logowanie gościa do udziałów wyłączone
    en: Insecure guest logons to shares disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi udziałów sieciowych na tej maszynie
    łączyć się z serwerem plików w charakterze gościa, czyli bez
    uwierzytelnienia.

    Połączenie gościa wygląda niewinnie, bo nie ma w nim hasła do
    przechwycenia. Rzecz w tym, czego przy okazji nie ma. Sesja gościa
    nie jest podpisana ani uwierzytelniona w żadną stronę, a to znaczy,
    że klient nie wie, z kim rozmawia. Każdy, kto potrafi odpowiedzieć
    szybciej niż właściwy serwer, może się za niego podać i podłożyć
    własne pliki.

    Skutek jest poważniejszy, niż wynikałoby z braku hasła. Pliki
    pobrane z udziału bywają wykonywane: to skrypty, pliki konfiguracji,
    dokumenty, biblioteki. Podmiana pliku w drodze jest tu równoznaczna
    z wykonaniem cudzego kodu na tej maszynie, a maszyną tą jest serwer.

    Na serwerze przedmiotem są znów połączenia wychodzące. Typowy jest
    jeden przypadek i warto go nazwać: udział na urządzeniu sieciowym
    wystawiony bez uwierzytelnienia, używany jako miejsce na kopie
    zapasowe albo na pliki wymiany. Wygoda jest tu duża, a cena polega
    na tym, że serwer odbiera stamtąd dane, nie mając pewności, skąd
    pochodzą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podania się za serwer plików i podłożenia serwerowi
    dowolnych plików, bez łamania hasła, bo hasła w tej rozmowie nie ma.
  en: |
    The setting forbids the network-share client on this machine to connect with a file server as
    a guest, that is, without authenticating.

    A guest connection looks harmless, there being no password in it to catch. The matter is what
    else is not there. A guest session is neither signed nor authenticated in either direction,
    and that means the client does not know whom it is speaking with. Anyone able to answer
    quicker than the right server can give themselves out for it and lay files of their own.

    The effect is graver than the want of a password would suggest. Files fetched from a share
    are at times run: scripts, files of settings, documents, libraries. The swapping of a file on
    the way amounts here to the running of another's code on this machine, and that machine is a
    server.

    On a server the subject is again the outgoing connections. One case is common and worth
    naming: a share on a network device held out without authentication, used as a place for
    backups or for exchange files. The convenience is great, and the price is that the server
    takes data thence without surety of where it came from.

    What an attacker gains while the item goes unmet: the means of giving themselves out for a
    file server and laying any files before the server, with no password broken, there being no
    password in that conversation.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ten serwer łączy się dziś z jakimkolwiek
    udziałem wystawionym bez uwierzytelnienia — bo po zmianie przestanie
    tam wchodzić.

    Przypadkiem pierwszym i najczęstszym jest tani magazyn sieciowy
    używany jako cel kopii zapasowych. Udział taki bywa wystawiony
    gościowi, bo tak było najszybciej przy uruchomieniu, i nikt do tego
    nie wracał. Po zmianie zadanie kopii zgłosi brak dostępu, i zrobi to
    w nocy, do własnego dziennika.

    Przypadkiem drugim są urządzenia udostępniające wyniki swojej pracy
    — skanery, rejestratory, sterowniki maszyn. Serwer odbierający
    z nich pliki przestanie je widzieć.

    Objaw jest czytelny: odmowa dostępu przy próbie połączenia,
    z komunikatem mówiącym wprost o zabronionym logowaniu gościa. Nie
    jest to awaria trudna do prześledzenia i to jest tu dobra
    wiadomość.

    Właściwą odpowiedzią jest włączenie uwierzytelniania na udziale po
    drugiej stronie, a nie pozostawienie gościa. Większość urządzeń to
    potrafi, choć zwykle wymaga zalogowania się do ich panelu i założenia
    konta — jest to praca na kilkanaście minut, wykonywana raz.

    Zmiana nie dotyczy udziałów udostępnianych przez ten serwer ani
    połączeń uwierzytelnianych kontem. Mowa wyłącznie o połączeniach
    wychodzących w charakterze gościa.

    Zmiana nie wymaga przerwy i dotyczy połączeń nawiązywanych po niej.
  en: |
    What needs checking is whether this server connects today with any share held out without
    authentication - for after the change it will stop going there.

    The first and commonest case is a cheap network store used as the aim of backups. Such a
    share is at times held out to a guest, that having been the quickest way at its starting, and
    nobody came back to it. After the change the backup job will report no access, and will do so
    at night, to a log of its own.

    The second case is devices holding out the outcome of their work - scanners, recorders,
    machine controllers. A server taking files from them will stop seeing them.

    The symptom is plain: a refusal of access at the try to connect, with a message speaking
    outright of a forbidden guest sign-in. It is no breakdown hard to follow, and that is here
    the good tiding.

    The right answer is the switching on of authentication at the share on the other side rather
    than the leaving of the guest. Most devices manage it, though it usually takes a signing in
    to their panel and a making of an account - a work of a dozen minutes, done once.

    The change does not bear on the shares this server holds out, nor on connections
    authenticated by an account. What is spoken of are outgoing connections as a guest alone.

    The change takes no break and bears on connections opened after it.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - drivers-and-devices
  what_breaks:
    pl:
      - Zadanie kopii zapasowej zapisujące na udziale wystawionym gościowi zgłosi brak dostępu
      - Odbieranie plików z urządzeń udostępniających je bez uwierzytelnienia przestanie działać
      - Udziały udostępniane przez ten serwer i połączenia uwierzytelniane kontem pozostają bez zmiany
      - Objawem jest czytelna odmowa dostępu, a nie awaria trudna do prześledzenia
    en:
      - A backup job writing to a share held out to a guest will report no access
      - The taking of files from devices holding them out without authentication will stop working
      - The shares this server holds out and connections authenticated by an account stay unchanged
      - The symptom is a plain refusal of access rather than a breakdown hard to follow
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Kopie zapasowe tego serwera zapisują się na udziale wystawionym bez uwierzytelnienia i nie przygotowano tam konta
      - Serwer odbiera pliki z urządzeń udostępniających je wyłącznie gościowi
    en:
      - This server's backups write to a share held out without authentication and no account was made ready there
      - The server takes files from devices holding them out to a guest alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
      $name = 'AllowInsecureGuestAuth'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
    $name = 'AllowInsecureGuestAuth'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowInsecureGuestAuth' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/guest-access-in-smb2-is-disabled-by-default

notes:
  pl: |
    Sesja gościa nie jest podpisana ani uwierzytelniona w żadną stronę,
    więc klient nie wie, z kim rozmawia. Brak hasła nie jest tu zaletą,
    tylko brakiem dowodu tożsamości serwera.

    Punkt dotyczy połączeń wychodzących tego serwera, nie udziałów,
    które udostępnia. Najczęstszym przypadkiem jest tani magazyn sieciowy
    używany jako cel kopii zapasowych.

    Właściwą odpowiedzią na niezgodność jest włączenie uwierzytelniania
    na udziale po drugiej stronie, a nie pozostawienie gościa.
  en: |
    A guest session is neither signed nor authenticated in either direction, so the client does
    not know whom it is speaking with. The want of a password is here no merit but a want of
    proof of the server's identity.

    The item bears on this server's outgoing connections, not on the shares it holds out. The
    commonest case is a cheap network store used as the aim of backups.

    The right answer to non-compliance is the switching on of authentication at the share on the
    other side rather than the leaving of the guest.
