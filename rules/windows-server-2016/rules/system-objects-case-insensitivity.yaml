id: win2016-system-objects-case-insensitivity

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nazwy obiektów systemowych rozpatrywane bez rozróżniania wielkości liter
    en: The names of system objects treated without distinguishing letter case
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza rozpatrywanie nazw obiektów systemowych bez
    rozróżniania wielkości liter, także w podsystemach, które domyślnie je
    rozróżniają.

    Punkt dotyczy zgodności dwóch sposobów patrzenia na tę samą nazwę.
    Część systemu traktuje nazwy bez rozróżniania wielkości liter; inne
    podsystemy potrafią rozróżniać. Dopóki obie strony patrzą tak samo,
    nazwa oznacza jeden obiekt.

    Gdy patrzą różnie, jedna nazwa zapisana dwoma sposobami może wskazywać
    dwa obiekty. Otwiera to lukę, w której zabezpieczenie sprawdza jedną
    nazwę, a dostęp następuje do drugiej — sprawdzenie i dostęp dotyczą
    wtedy różnych rzeczy, choć nazwa wygląda na tę samą.

    Nie jest to zagrożenie teoretyczne, ale jest wąskie: wymaga obecności
    podsystemu rozróżniającego wielkość liter. Waga punktu rośnie tam,
    gdzie takie podsystemy działają, i maleje tam, gdzie ich nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozbieżność
    między nazwą sprawdzaną a nazwą, do której następuje dostęp.
  en: |
    The setting enforces the names of system objects to be treated without distinguishing letter case, also in the
    subsystems that distinguish it by default.

    The item concerns the agreement of two ways of looking at the same name. Part of the system treats names without
    distinguishing letter case; other subsystems can distinguish it. So long as both sides look the same way, a name
    means one object.

    Where they look differently, one name written two ways may point at two objects. That opens a gap in which a
    safeguard checks one name and the access happens to another - the check and the access then concern different
    things, though the name looks the same.

    It is no theoretical threat, but it is a narrow one: it calls for a subsystem that distinguishes letter case to be
    present. The item's weight grows where such subsystems work and falls where they are not.

    What an attacker gains while the item goes unmet: a divergence between the name checked and the name accessed.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, co na tej
    maszynie może polegać na rozróżnianiu wielkości liter.

    Rzecz pierwsza i najważniejsza: zmiana zaczyna obowiązywać po
    restarcie, bo ustawienie działa przy starcie systemu. Wycofanie
    również wymaga restartu. Punkt nie nadaje się więc do wykonania
    w trakcie dnia pracy i wymaga okna serwisowego jak każda zmiana
    działająca przy starcie.

    Rzecz druga dotyczy podsystemów i środowisk uruchomieniowych
    zbudowanych wokół innych konwencji nazewnictwa. Aplikacja, która
    świadomie używa dwóch nazw różniących się wyłącznie wielkością liter,
    przestanie je rozróżniać. Jest to przypadek rzadki, ale gdy wystąpi,
    objawia się jako kolizja nazw, a nie jako odmowa dostępu.

    Rzecz trzecia: na typowym serwerze bez takich podsystemów zmiana nie
    robi nic poza zapisaniem ustawienia.

    Czego to nie psuje: systemu plików, nazw plików i katalogów, udziałów
    sieciowych, ról serwera, usług, aplikacji napisanych pod ten system.

    Wymaga restartu maszyny.
  en: |
    The class is "needs review", and the review concerns what on this machine may rest on letter case being
    distinguished.

    The first and weightiest matter: the change begins to hold after a restart, the setting acting at the system's
    start. The undoing likewise calls for a restart. The item is therefore not fit for carrying out in the middle of a
    working day and calls for a service window like every change acting at the start.

    The second matter concerns subsystems and runtimes built about other conventions of naming. An application that
    knowingly uses two names differing solely in letter case will cease to tell them apart. It is a rare case, but
    where it arises it shows itself as a collision of names and not as a refusal of access.

    The third matter: on a typical server without such subsystems the change does nothing beyond the writing of the
    setting.

    What this does not break: the file system, the names of files and folders, network shares, the server's roles,
    services, or applications written for this system.

    Calls for a restart of the machine.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Zmiana zaczyna obowiązywać dopiero po restarcie maszyny, a wycofanie również restartu wymaga
      - Aplikacja używająca dwóch nazw różniących się wyłącznie wielkością liter przestaje je rozróżniać
      - Objaw takiej kolizji wygląda jak zajęta nazwa, a nie jak odmowa dostępu
      - Na maszynie bez podsystemów rozróżniających wielkość liter zmiana nie robi nic poza zapisaniem ustawienia
      - System plików, nazwy plików i katalogów oraz udziały sieciowe pozostają bez zmian
    en:
      - The change begins to hold only after a restart of the machine, and the undoing calls for one as well
      - An application using two names differing solely in letter case ceases to tell them apart
      - The symptom of such a collision looks like a name already taken rather than a refusal of access
      - On a machine without subsystems distinguishing letter case the change does nothing beyond writing the setting
      - The file system, the names of files and folders and network shares stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa środowisko uruchomieniowe polegające na rozróżnianiu wielkości liter w nazwach
      - Nie ma okna serwisowego, a zmiana i jej wycofanie wymagają restartu maszyny
    en:
      - A runtime works on the machine that rests on letter case being distinguished in names
      - There is no service window, and the change and its undoing call for a restart of the machine
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
      $name = 'ObCaseInsensitive'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
    $name = 'ObCaseInsensitive'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting acts at the start of the system, so the consequence shows
    # after a restart and not at once. Undoing it likewise calls for one.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ObCaseInsensitive' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/system-objects-require-case-insensitivity-for-non-windows-subsystems

notes:
  pl: |
    Punkt jest trzeci w bloku i jedyny w nim wymagający restartu. Warto,
    żeby aplikacja postawiła to na początku opisu, a nie w polu obok,
    bo restart przesądza o tym, kiedy punkt wolno wykonać.

    Argument wart zachowania dotyczy rozbieżności między sprawdzeniem
    a dostępem. Jest to wzorzec powtarzający się w wielu miejscach:
    zabezpieczenie sprawdza jedną rzecz, a działanie dotyczy drugiej, choć
    obie noszą tę samą nazwę. Opisanie go raz porządnie pomaga rozpoznać go
    gdzie indziej.

    Warto też przyznać wąskość punktu. Wymaga obecności podsystemu
    rozróżniającego wielkość liter, a na typowym serwerze takiego nie ma.
    Kategoria średnia oddaje to właściwie i podnoszenie jej byłoby
    nadużyciem.

    Odnotowuję, że wycofanie także wymaga restartu. Jest to rzadkie
    w tym zestawie i warto, żeby interfejs pokazywał odwracalność
    „po restarcie" jako coś innego niż odwracalność natychmiastową —
    przy planowaniu okna liczy się jedno i drugie.
  en: |
    The item is the third in the block and the only one in it calling for a restart. It is well that the application set
    that at the description's head and not in a field beside it, the restart settling as it does when the item may be
    carried out.

    The argument worth keeping concerns the divergence between the check and the access. It is a pattern repeating itself
    in many places: a safeguard checks one thing and the act concerns another, though both bear the same name. Describing
    it once properly helps in recognising it elsewhere.

    The item's narrowness is worth owning too. It calls for a subsystem distinguishing letter case to be present, and on
    a typical server there is none. The medium category renders that rightly and a raising of it would be an abuse.

    Worth noting that the undoing calls for a restart as well. That is rare in this set, and it is well that the interface
    show a reversibility "after a restart" as something other than an immediate one - in the planning of a window both
    count.
