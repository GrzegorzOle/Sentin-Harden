id: win10-audit-other-policy-change-events

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja pozostałych zmian zasad - niepowodzenia
    en: The audit of the remaining changes of rules - failures
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje niepowodzenia w zmianach zasad, które nie mieszczą
    się w podkategoriach pozostałych: w ustawieniach dostawców kryptografii,
    w zasadach zaufania do certyfikatów i w filtrach ruchu sieciowego
    poniżej warstwy reguł zapory.

    Podkategoria ta jest w całym bloku jedyną, przy której zapisuje się samo
    niepowodzenie. Powód jest praktyczny: połowa udana jest głośna
    i powtarzalna — system sam odświeża te ustawienia — a przy tym mówi
    niewiele. Połowa nieudana jest cicha i każdy jej wpis coś znaczy.

    Czym znaczy, widać po tym, co trafia do tego zbioru. Nieudana zmiana
    ustawień dostawcy kryptografii albo nieudana zmiana zaufania do
    certyfikatu to czynność, której nie wykonuje ani użytkownik, ani
    oprogramowanie użytkowe. Ktoś ją wykonał i mu się nie udało.

    Odnotowuję, że wpis nie mówi, co się nie udało zrobić — mówi, że ktoś
    sięgnął w to miejsce. Przy zdarzeniach z tej listy jest to informacja
    wystarczająca, żeby zacząć szukać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: próby
    sięgnięcia po ustawienia kryptografii i zaufania do certyfikatów
    niezostawiające śladu nawet wtedy, gdy zawiodły.
  en: |
    The setting writes down the failures in changes of rules which do not fall within the other subcategories:
    in the settings of cryptographic providers, in the rules of trust towards certificates, and in the filters
    of network traffic below the layer of firewall rules.

    This subcategory is the only one in the whole block at which the failure alone is written. The reason is a
    practical one: the successful half is loud and repeating - the system refreshes those settings of itself -
    and withal says little. The failed half is quiet, and every entry in it counts.

    What it counts for shows by what falls into that set. A failed change of a cryptographic provider's settings,
    or a failed change of trust towards a certificate, is an act carried out neither by a user nor by working
    software. Somebody carried it out and did not get through.

    I set down that the entry does not say what it was that failed to be done - it says that somebody reached
    into that place. At the happenings upon this list that is word enough to begin searching.

    What an attacker gains while the item goes unmet: attempts at reaching for the settings of cryptography and
    of trust towards certificates, leaving no trace even where they failed.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia żadnej zasady i nie dotyka ani kryptografii, ani
    certyfikatów, ani filtrów sieciowych. Zapisuje wyłącznie nieudane próby
    ich zmiany.

    Liczba wpisów jest w normalnej pracy bliska zeru i to jest tu
    zamierzone. Zakres zawężono do niepowodzeń właśnie po to, żeby zapis
    pozostał cichy.

    Odnotowuję, dlaczego nie włączam połowy udanej. System odświeża
    ustawienia z tej listy sam, przy odświeżaniu zasad i przy aktualizacji
    magazynu certyfikatów. Wpisy te byłyby liczne, powtarzalne i zagłuszyłyby
    tę garstkę, dla której podkategoria jest włączana.

    Maszyna zapisująca oba wyniki jest zgodna z tym punktem — zakres
    szerszy nie jest brakiem, tylko dodatkowym szumem, o którym warto
    wiedzieć.

    Czego to nie psuje: kryptografii, zaufania do certyfikatów, filtrów
    sieciowych, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no rule and touches neither cryptography, nor certificates, nor network filters. It
    writes down the failed attempts at changing them alone.

    The number of entries is in ordinary work near nought, and that is here meant. The reach was narrowed to
    failures for just this, that the record stay quiet.

    I set down why I do not switch on the successful half. The system refreshes the settings upon that list of
    itself, at the refreshing of rules and at the updating of the certificate store. Those entries would be many
    and repeating, and would drown the handful for whose sake the subcategory is switched on.

    A machine writing both outcomes is compliant with this item - a wider reach is no want but a further noise,
    worth knowing of.

    What this does not break: cryptography, trust towards certificates, network filters, logging on, file
    shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - encryption-and-tls
  what_breaks:
    pl:
      - Maszyna zapisująca oba wyniki jest zgodna z tym punktem, ale zbiera przy tym szum z odświeżania zasad i magazynu certyfikatów
      - Połowa udana byłaby liczna i powtarzalna, więc zagłuszyłaby tę garstkę wpisów, dla której podkategoria jest włączana
      - Wpis nie mówi, co się nie udało zrobić, tylko że ktoś sięgnął w to miejsce
      - Ustawienie nie dotyka ani kryptografii, ani certyfikatów, ani filtrów sieciowych
      - Logowanie, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A machine writing both outcomes is compliant with this item, but gathers withal the noise of refreshed rules and certificate store
      - The successful half would be many and repeating, and would drown the handful of entries for whose sake the subcategory is switched on
      - The entry does not say what it was that failed to be done, only that somebody reached into that place
      - The setting touches neither cryptography, nor certificates, nor network filters
      - Logging on, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto zauważyć pojedynczego wpisu w zbiorze, który zwykle jest pusty
    en:
      - The record is not gathered away from the machine and there is nobody to notice a single entry in a set that is as a rule empty
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9234-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[23]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9234-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9234-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the failed outcome is recorded. The successful half of this subcategory
    # is loud and says little; the failed half is quiet and every entry in it counts.
    auditpol /set /subcategory:"{0CCE9234-69AE-11D9-BED3-505054503030}" /success:disable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9234-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-other-policy-change-events

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną zawężoną do niepowodzeń. Warto,
    żeby aplikacja pokazała powód tego zawężenia, bo wygląda ono na
    niekompletność, a jest doborem.

    Argument wart zachowania dotyczy gęstości znaczenia. Zbiór, który
    w normalnej pracy jest pusty, nie wymaga przeglądania — wystarczy, żeby
    ktokolwiek zauważył w nim cokolwiek. Włączenie połowy udanej zamieniłoby
    go w zbiór, którego nikt nie przegląda, bo jest za duży.

    Odnotowuję, że nie karzę maszyny zapisującej oba wyniki. Zakres szerszy
    nie jest brakiem, tylko dodatkowym szumem — a raport pokazujący
    ustawienie ostrzejsze na czerwono uczy użytkownika nieufności wobec
    własnego raportu.
  en: |
    The rule closes the block and is the only one in it narrowed to failures. It is well that the application
    show the reason for that narrowing, it looking like incompleteness while being a choosing.

    The argument worth keeping touches the density of meaning. A set that in ordinary work is empty calls for no
    looking over - it suffices that anybody notice anything in it. Switching on the successful half would turn it
    into a set nobody looks over, it being too big.

    I set down that I do not punish a machine writing both outcomes. A wider reach is no want but a further
    noise - and a report showing the harder setting in red teaches a user mistrust towards their own report.
