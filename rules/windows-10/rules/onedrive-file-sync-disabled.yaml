id: win10-onedrive-file-sync-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > OneDrive
  title:
    pl: Synchronizacja plików z magazynem w chmurze wyłączona
    en: File synchronisation with cloud storage disabled
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Synchronizacja z magazynem w chmurze zakłada folder, którego zawartość wychodzi
    poza maszynę automatycznie. Nie ma tu momentu decyzji — plik przeniesiony do
    takiego folderu wyjeżdża, bo tak działa mechanizm.

    Znaczy to, że granica danych organizacji przestaje przebiegać po jej sieci, a
    zaczyna po ustawieniach konta, na które ktoś się zalogował. Konto prywatne
    podłączone do stanowiska służbowego przenosi dokumenty w miejsce, do którego
    organizacja nie ma dostępu ani wglądu. Działa to też w drugą stronę:
    oprogramowanie szyfrujące pliki na maszynie rozsyła szkody na wszystkie
    urządzenia podpięte do tego samego magazynu.

    Wyłączenie synchronizacji przywraca rozstrzyganie o tym, co wychodzi poza
    maszynę, drogą świadomą.
  en: |
    Synchronisation with cloud storage sets up a folder whose contents leave the
    machine automatically. There is no moment of decision here - a file moved into
    such a folder departs, because that is how the mechanism works.

    This means the boundary of the organisation s data stops running along its
    network and starts running along the settings of whichever account somebody
    signed in with. A private account attached to a work station carries documents
    to a place the organisation can neither reach nor see into. It works the other
    way round too - software encrypting files on the machine spreads the damage to
    every device attached to the same storage.

    Switching the synchronisation off gives back the deliberate road for settling
    what leaves the machine.

disruption_description:
  pl: |
    To jest zmiana wymagająca świadomego wdrożenia, bo dla części ludzi magazyn
    w chmurze jest miejscem pracy, a nie dodatkiem. Zaczyna obowiązywać po
    ponownym zalogowaniu.

    Przed wdrożeniem trzeba ustalić, gdzie faktycznie leżą dokumenty. Jeżeli
    w folderze synchronizowanym, to po zmianie zostaną na maszynie lokalnie i
    przestaną wracać na inne urządzenia tej samej osoby — a część ludzi
    przyzwyczaiła się, że komplet dokumentów jest wszędzie.

    Osobno trzeba sprawdzić przekierowanie folderów znanych. Tam, gdzie pulpit i
    dokumenty wskazują na folder synchronizowany, wyłączenie mechanizmu zmienia
    miejsce zapisu i wymaga przeniesienia danych, a nie samego ustawienia.

    Zamiennik — udział sieciowy, magazyn organizacji — musi stać przed zmianą, nie
    po niej.
  en: |
    This is a change calling for a planned rollout, since for some people the cloud
    storage is the place of work rather than an addition. It takes effect after
    signing in again.

    Before the rollout it has to be established where the documents actually lie.
    If they lie in a synchronised folder, then after the change they stay on the
    machine locally and stop returning to that person s other devices - and some
    people have grown used to the whole set of documents being everywhere.

    Known folder redirection needs a separate check. Where the desktop and
    documents point at a synchronised folder, switching the mechanism off changes
    where things are saved and calls for data to be moved rather than for a setting
    alone.

    The replacement - a network share, the organisation s storage - has to stand
    before the change rather than after it.

implementation_consequences:
  impact_areas:
    - file-sharing
    - virtualization-and-containers
  what_breaks:
    pl:
      - Pliki przestaną wracać na inne urządzenia tej samej osoby i zostaną wyłącznie na tej maszynie
      - Przekierowanie pulpitu i dokumentów do folderu synchronizowanego przestanie działać, a dane trzeba będzie przenieść ręcznie
      - Pliki dostępne dotąd na żądanie, bez pobrania na dysk, przestaną być widoczne jako zawartość folderu
      - Udostępnianie dokumentu odnośnikiem zamiast załącznikiem przestanie być możliwe tą drogą
      - Dostęp do udziałów sieciowych, poczta, drukowanie i praca użytkownika poza folderem synchronizowanym pozostają bez zmian
    en:
      - Files stop returning to that person s other devices and stay on this machine alone
      - Redirection of the desktop and documents to a synchronised folder stops working, and the data has to be moved by hand
      - Files available so far on demand, without being fetched to the disk, stop showing as the folder s contents
      - Sharing a document by a link instead of an attachment stops being possible by this road
      - Access to network shares, mail, printing and user work outside the synchronised folder are all unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Środowiska, w których magazyn w chmurze organizacji jest podstawowym miejscem przechowywania dokumentów
      - Stanowiska z przekierowanym pulpitem i folderem dokumentów, dopóki dane nie zostaną przeniesione
      - Maszyny w terenie bez dostępu do udziału sieciowego organizacji
    en:
      - Environments where the organisation s cloud storage is the main place documents are kept
      - Stations with a redirected desktop and documents folder, until the data has been moved
      - Machines in the field with no access to the organisation s network share
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableFileSyncNGSC'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
    $name = 'DisableFileSyncNGSC'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableFileSyncNGSC' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/sharepoint/use-group-policy

notes:
  pl: |
    Zasada wyłącza mechanizm synchronizacji, a nie usuwa danych już
    zsynchronizowanych — te zostają i na maszynie, i w magazynie. Punkt jest
    poziomu drugiego i ma sens wyłącznie tam, gdzie przygotowano inne miejsce
    przechowywania dokumentów.
  en: |
    The rule switches the synchronisation mechanism off rather than removing data
    already synchronised - that stays both on the machine and in the storage. The
    item is of the second level and makes sense only where another place for
    keeping documents has been prepared.
