id: win10-removable-device-installation-blocked

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Instalowanie urządzeń wymiennych zablokowane
    en: Installing removable devices blocked
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Urządzenie wymienne podłączone do maszyny nie jest tylko nośnikiem danych.
    Jest sprzętem, który przedstawia się systemowi wybraną przez siebie klasą, a
    system instaluje pod nią sterownik. Pamięć podająca się za klawiaturę wpisze
    polecenia szybciej, niż ktokolwiek zdąży spojrzeć na ekran.

    Drugą stroną jest wynoszenie danych. Nośnik wymienny jest najprostszą drogą
    skopiowania zawartości maszyny poza wszystkim, co widzi sieć: bez ruchu do
    zapamiętania, bez logu na zaporze, bez śladu w poczcie.

    Zablokowanie instalowania takich urządzeń zamyka obie drogi w jednym miejscu —
    zanim sterownik zostanie zainstalowany, czyli zanim urządzenie w ogóle
    zaistnieje dla systemu.
  en: |
    A removable device plugged into a machine is not merely a carrier of data. It
    is hardware that presents itself to the system as a class of its own choosing,
    and the system installs a driver for that class. A memory stick posing as a
    keyboard types commands faster than anybody can glance at the screen.

    The other side is data leaving. Removable media are the simplest way of
    copying the contents of a machine past everything the network sees - with no
    traffic to record, no entry on the firewall, no trace in the mail.

    Blocking the installation of such devices shuts both roads in one place -
    before a driver is installed, that is before the device exists for the system
    at all.

disruption_description:
  pl: |
    To jest zmiana wymagająca świadomego wdrożenia i uprzedzenia ludzi, bo dotyka
    czynności wykonywanej codziennie i wykonywanej z powodów zawodowych. Nie chodzi
    tu o ryzyko techniczne, tylko o to, że część pracy po prostu przestanie być
    możliwa.

    Przed wdrożeniem trzeba przejrzeć, co w organizacji podłącza się do gniazd.
    Klucze sprzętowe licencji, czytniki kart, drukarki etykiet, urządzenia
    pomiarowe i sprzęt serwisowy producenta bywają rozpoznawane jako wymienne.
    Każde z nich wymaga albo wyjątku po identyfikatorze sprzętowym, albo decyzji,
    że przestaje działać.

    Osobno trzeba zdecydować o nośnikach już zainstalowanych. Zasada dotyczy
    instalowania, więc urządzenie znane maszynie z wcześniejszego podłączenia
    będzie działać dalej — i o tym też trzeba wiedzieć, bo inaczej wynik wdrożenia
    wygląda na przypadkowy.
  en: |
    This is a change calling for a planned rollout and for warning people, since
    it touches an act performed daily and performed for professional reasons. It
    is not about technical risk, but about part of the work simply ceasing to be
    possible.

    Before the rollout it has to be reviewed what gets plugged into the sockets in
    the organisation. Licence dongles, card readers, label printers, measuring
    instruments and the vendor s service hardware are all sometimes recognised as
    removable. Each of them calls either for an exception by hardware identifier
    or for a decision that it stops working.

    Media already installed have to be decided on separately. The rule covers
    installing, so a device the machine knows from an earlier connection goes on
    working - and that too has to be known, since otherwise the outcome of the
    rollout looks arbitrary.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Nowe pamięci przenośne, dyski zewnętrzne i czytniki kart nie zostaną zainstalowane po podłączeniu
      - Klucze sprzętowe licencji i urządzenia pomiarowe rozpoznawane jako wymienne przestaną działać na nowych maszynach
      - Drukarki etykiet i sprzęt serwisowy producenta podłączany doraźnie nie uruchomi się w chwili, w której jest potrzebny
      - Urządzenia zainstalowane przed zmianą będą działać dalej, bo zasada dotyczy instalowania, a nie używania
      - Klawiatura, mysz, monitor, sieć i zainstalowane oprogramowanie pozostają bez zmian
    en:
      - New memory sticks, external disks and card readers are not installed once plugged in
      - Licence dongles and measuring instruments recognised as removable stop working on new machines
      - Label printers and the vendor s service hardware plugged in as needed do not start at the moment they are needed
      - Devices installed before the change go on working, since the rule covers installing rather than using
      - The keyboard, mouse, monitor, network and installed software are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska korzystające z klucza sprzętowego licencji albo czytnika kart rozpoznawanego jako urządzenie wymienne
      - Stanowiska serwisowe i laboratoryjne, na których sprzęt pomiarowy podłącza się doraźnie
      - Środowiska bez przygotowanej drogi wyjątku po identyfikatorze sprzętowym urządzenia
    en:
      - Stations relying on a licence dongle or a card reader recognised as a removable device
      - Service and laboratory stations, where measuring hardware is plugged in as needed
      - Environments with no exception route by hardware identifier prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DenyRemovableDevices'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $name = 'DenyRemovableDevices'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyRemovableDevices' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-restrictions

notes:
  pl: |
    Zasada dotyczy instalowania urządzenia, a nie korzystania z już
    zainstalowanego — sprzęt znany maszynie z wcześniejszego podłączenia będzie
    działać dalej. Wyjątki układa się po identyfikatorze sprzętowym w osobnych
    wpisach tej samej gałęzi, więc dopuszczenie pojedynczego modelu nie wymaga
    wyłączania całej zasady.
  en: |
    The rule covers installing a device rather than using one already installed -
    hardware the machine knows from an earlier connection goes on working.
    Exceptions are laid out by hardware identifier in separate entries of the same
    branch, so admitting a single model does not call for switching the whole rule
    off.
