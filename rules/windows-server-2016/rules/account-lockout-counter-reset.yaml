id: win2016-account-lockout-counter-reset

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Czas, po jakim licznik nieudanych logowań wraca do zera
    en: Time after which the failed sign-in counter returns to zero
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby licznik nieudanych logowań wracał do zera nie
    wcześniej niż po piętnastu minutach.

    To jest trzeci element trójki i najmniej oczywisty z nich. Próg mówi, ile
    nieudanych prób wywołuje blokadę; ten punkt mówi, w jakim oknie czasowym
    te próby są zliczane. Jeżeli licznik zeruje się po minucie, napastnikowi
    wystarczy próbować dziewięć razy, odczekać minutę i zacząć od nowa —
    blokada nie nastąpi nigdy, choć próg jest ustawiony.

    Dlatego właśnie ten punkt istnieje osobno i dlatego warto go czytać razem
    z progiem, a nie po nim. Trzy ustawienia opisują jeden mechanizm i żadne
    z nich nie działa samo.

    Kategoria niska, bo sam punkt niczego nie zamyka. Bez niego zamyka się
    jednak mniej, niż wynika z ustawionego progu, a raport pokazuje ochronę,
    której nie ma.

    Na serwerze rzecz dotyczy tych samych kont co próg blokady: lokalnych
    kont osiągalnych z sieci. Serwer 2016 stoi w instalacjach, w których
    udział plikowy albo pulpit zdalny bywa jedyną drogą do maszyny — i tą
    samą drogą idą próby zgadywania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    prowadzenia zgadywania w tempie poniżej progu, bez wywołania blokady
    i bez końca.
  en: |
    The item requires the failed sign-in counter to return to zero no sooner
    than after fifteen minutes.

    This is the third part of the trio and the least obvious of them. The
    threshold says how many failed attempts trigger a lockout; this item says
    within what window of time those attempts are counted. If the counter
    resets after a minute, an attacker need only try nine times, wait a minute
    and start again - the lockout never happens, although a threshold is set.

    That is why this item exists separately, and why it is worth reading
    alongside the threshold rather than after it. Three settings describe one
    mechanism and none of them works on its own.

    The category is low, because the item closes nothing by itself. Without it,
    though, less is closed than the set threshold suggests, and the report
    shows a protection that is not there.

    On a server the matter concerns the same accounts as the threshold does:
    local accounts reachable from the network. Server 2016 stands in
    installations where a file share or remote desktop is sometimes the only
    road to the machine - and guessing attempts travel that same road.

    What an attacker gains while the item goes unmet: the ability to keep
    guessing at a rate below the threshold, triggering no lockout and never
    stopping.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż w zwykłej pracy nie widać tego wcale.
    Sprawdzenie dotyczy tego, co na tej maszynie generuje nieudane logowania
    w sposób powtarzalny.

    Skutek jest taki, że nieudane próby sumują się w dłuższym oknie. Konto,
    które wcześniej mieściło się pod progiem, bo jego pomyłki rozkładały się
    w czasie, teraz może ten próg przekroczyć. Nie zmienia się liczba pomyłek
    — zmienia się to, jak długo są pamiętane.

    Dotyczy to przede wszystkim rzeczy powtarzających się cyklicznie: zadania
    harmonogramu próbującego co dziesięć minut, monitoringu logującego się do
    usługi, zmapowanego dysku odnawiającego połączenie. Takie miejsce, jeśli
    ma stare hasło, przy krótkim oknie zliczania nie wywoływało blokady,
    a przy dłuższym ją wywoła.

    Na serwerze 2016 warto tę listę przejrzeć osobno, bo cykliczne połączenia
    bywają tu starsze niż dokumentacja maszyny.

    Czego to nie psuje: logowania poprawnego, kont bez zapisanych haseł
    ani niczego, co uwierzytelnia się raz.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", although in ordinary work it is not visible at
    all. The review is about what on this machine produces failed sign-ins over
    and over.

    The effect is that failed attempts add up over a longer window. An account
    that previously stayed under the threshold because its mistakes were spread
    out in time may now cross it. The number of mistakes does not change - what
    changes is how long they are remembered.

    This concerns above all things that repeat on a cycle: a scheduled task
    trying every ten minutes, a monitoring system signing in to a service, a
    mapped drive renewing its connection. Such a place, if it holds an old
    password, triggered no lockout with a short counting window and will
    trigger one with a longer.

    On Server 2016 that list is worth going through separately, because cyclic
    connections here are sometimes older than the machine's documentation.

    What this does not break: successful sign-ins, accounts with no saved
    passwords, or anything that authenticates once.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Nieudane próby sumują się w dłuższym oknie, więc konto mieszczące się dotąd pod progiem może zacząć się blokować
      - Zadania cykliczne i monitoring ze starym hasłem wywołują blokadę, której przy krótkim oknie nie wywoływały
      - Liczba pomyłek się nie zmienia, zmienia się tylko to, jak długo są pamiętane
      - Logowanie poprawne i konta bez zapisanych haseł działają bez zmian
    en:
      - Failed attempts add up over a longer window, so an account that stayed under the threshold may start locking
      - Cyclic tasks and monitoring holding an old password trigger a lockout they did not trigger with a short window
      - The number of mistakes does not change, only how long they are remembered
      - Successful sign-ins and accounts with no saved passwords work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracują połączenia cykliczne ze starym hasłem, a nie wiadomo jeszcze, gdzie ono siedzi
    en:
      - Cyclic connections holding an old password run on the machine and it is not yet known where that password sits
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ResetLockoutCount\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^ResetLockoutCount\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'ResetLockoutCount'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # With a short counting window the threshold never fires: try nine times,
    # wait, start again. The value must not be greater than the lockout
    # duration, or the system will correct it in its own way.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ResetLockoutCount = 15',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ResetLockoutCount = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/reset-account-lockout-counter-after

notes:
  pl: |
    Najmniej oczywisty punkt z trójki blokady i najłatwiejszy do pominięcia,
    bo jego nazwa mówi o liczniku, a nie o ochronie. Tymczasem to on decyduje,
    czy ustawiony próg w ogóle kiedykolwiek zadziała.

    Wartość nie może być większa niż czas trwania blokady. System tego pilnuje
    i przy niezgodnym zestawie poprawia ustawienie sam, co bywa źródłem
    zaskoczenia przy porównywaniu raportu z tym, co widać w konsoli.

    Kategoria niska, bo punkt nie zamyka żadnej drogi. Bez niego zamyka się
    jednak mniej, niż wynika z progu, a to jest właśnie ten przypadek, w którym
    raport bywa zbyt optymistyczny.
  en: |
    The least obvious item of the lockout trio and the easiest to skip, because
    its name speaks of a counter rather than of protection. Yet it is the one
    that decides whether the threshold ever fires at all.

    The value must not be greater than the lockout duration. The system
    enforces that and, given an inconsistent set, corrects the setting itself -
    which can be a surprise when comparing the report with what the console
    shows.

    The category is low, because the item closes no road. Without it, though,
    less is closed than the threshold suggests, and this is exactly the case
    where a report turns out too optimistic.
