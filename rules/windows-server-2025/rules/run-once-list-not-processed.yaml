id: win2025-run-once-list-not-processed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Lista programów uruchamianych jednorazowo pomijana
    en: The list of programs started once passed over
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt nakazuje pomijać maszynową listę programów uruchamianych
    jednorazowo — tę, z której wpis znika po wykonaniu.

    Kategoria wysoka i chcę powiedzieć, czym ta lista różni się od zwykłej
    listy startowej, bo różnica jest tym, co czyni ją wygodną dla
    napastnika. Wpis jednorazowy wykonuje się raz i sam się kasuje. Po
    wykonaniu w rejestrze nie zostaje nic. Kto zagląda do rejestru później,
    nie znajdzie śladu tego, co się uruchomiło, bo śladu już nie ma.

    To jest właściwa treść punktu. Lista startowa zostawia dowód, lista
    jednorazowa go nie zostawia — a jednocześnie obie prowadzą do tego
    samego: wykonania kodu przy logowaniu, z uprawnieniami osoby logującej
    się. Na serwerze tą osobą zwykle jest administrator.

    Druga rzecz warta nazwania to moment. Lista jednorazowa jest
    wykonywana po restarcie, czyli dokładnie wtedy, gdy maszyna wraca do
    pracy i nikt nie przygląda się jej szczegółowo — a jeżeli restart był
    częścią aktualizacji albo awarii, tym bardziej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    kodu po restarcie, z uprawnieniami logującego się administratora,
    nieostawiające po sobie wpisu w rejestrze.
  en: |
    The item orders the machine-wide list of programs started once to be
    passed over - the one whose entry disappears after it has run.

    The category is high, and I want to say how this list differs from the
    ordinary startup list, because the difference is what makes it convenient
    for an attacker. A one-off entry runs once and deletes itself. After it
    has run, nothing is left in the registry. Whoever looks into the registry
    later will find no trace of what started, because there is no trace left.

    That is the real substance of the item. The startup list leaves evidence,
    the one-off list does not - and at the same time both lead to the same
    thing: code executed at sign-in, with the rights of the person signing
    in. On a server that person is usually an administrator.

    The second thing worth naming is the moment. The one-off list is carried
    out after a restart, which is exactly when the machine is coming back to
    work and nobody is looking at it closely - and all the more so if the
    restart was part of an update or of a failure.

    What an attacker gains while the item goes unmet: code executed after a
    restart, with the rights of the administrator signing in, leaving behind
    no registry entry.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i tutaj mam ostrzeżenie mocniejsze niż przy
    liście startowej, bo lista jednorazowa ma jedno bardzo konkretne
    zastosowanie zgodne z przeznaczeniem: dokańczanie instalacji po
    restarcie.

    Instalatory odkładają tam to, czego nie dało się zrobić przy
    zablokowanych plikach — podmianę bibliotek, rejestrację składników,
    czyszczenie po sobie. Jeżeli ta lista jest pomijana, instalacja zostaje
    w stanie pośrednim: pakiet zgłosi się jako zainstalowany, ale ostatni
    krok nie zostanie wykonany. To jest awaria trudna do rozpoznania,
    ponieważ nic nie zgłasza błędu.

    Wniosek praktyczny jest taki, że tej reguły nie stosuje się na maszynie
    w trakcie stawiania ani w oknie aktualizacyjnym. Właściwy moment to
    maszyna ustabilizowana, po zakończonych instalacjach, z restartem
    wykonanym co najmniej raz. Na czas większych zmian warto regułę
    świadomie cofnąć i przywrócić po robocie — to zajmuje chwilę i jest
    odwracalne natychmiast.

    Czego to nie psuje: usług, zadań zaplanowanych, aktualizacji systemu ani
    instalacji, które nie potrzebują kroku po restarcie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and here I have a stronger warning than for
    the startup list, because the one-off list has one very concrete use
    entirely in keeping with its purpose: finishing an installation after a
    restart.

    Installers put there what could not be done while files were locked -
    replacing libraries, registering components, clearing up after
    themselves. If that list is passed over, the installation stays in an
    intermediate state: the package will report itself as installed, but the
    last step will not have run. That is a failure hard to recognise, because
    nothing reports an error.

    The practical conclusion is that this rule is not applied to a machine
    being built, nor inside an update window. The right moment is a settled
    machine, after the installations are finished, with a restart carried out
    at least once. For the duration of larger changes it is worth undoing the
    rule deliberately and restoring it after the work - that takes a moment
    and is undone immediately.

    What this does not break: services, scheduled tasks, system updates, or
    installations that need no step after a restart.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Instalatory odkładające ostatni krok na po restarcie nie dokończą pracy, a pakiet zgłosi się jako zainstalowany
      - To awaria trudna do rozpoznania, ponieważ nic nie zgłasza błędu — brakuje tylko ostatniego kroku
      - Nie stosuj tej reguły na maszynie w trakcie stawiania ani w oknie aktualizacyjnym; na czas większych zmian cofnij ją świadomie
      - Usługi, zadania zaplanowane i aktualizacje systemu działają bez zmian
    en:
      - Installers that leave their last step until after a restart will not finish, while the package reports itself as installed
      - That is a failure hard to recognise, because nothing reports an error - only the last step is missing
      - Do not apply this rule to a machine being built or inside an update window; for larger changes undo it deliberately
      - Services, scheduled tasks and system updates work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest w trakcie stawiania, w oknie aktualizacyjnym albo czeka na dokończenie instalacji po restarcie
    en:
      - The machine is being built, is inside an update window, or is waiting for an installation to finish after a restart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'DisableLocalMachineRunOnce'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'DisableLocalMachineRunOnce'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A one-off entry runs once and deletes itself, leaving no trace in the
    # registry, and it runs after a restart - when nobody is looking closely.
    # The same list is used by installers to finish work after a restart, so do
    # not apply this on a machine being built or inside an update window.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalMachineRunOnce' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/setupapi/run-and-runonce-registry-keys

notes:
  pl: |
    Różnica wobec zwykłej listy startowej jest tym, co czyni tę listę
    wygodną dla napastnika: wpis wykonuje się raz i sam się kasuje. Lista
    startowa zostawia dowód, ta go nie zostawia.

    Waży też moment. Lista jednorazowa jest wykonywana po restarcie, czyli
    wtedy, gdy maszyna wraca do pracy i nikt się jej nie przygląda — tym
    bardziej, jeżeli restart był częścią aktualizacji albo awarii.

    Uczciwe ostrzeżenie: z tej samej listy korzystają instalatory,
    dokańczając pracę po restarcie. Pomijana lista zostawia instalację
    w stanie pośrednim, a pakiet zgłasza się jako zainstalowany.
  en: |
    The difference from the ordinary startup list is what makes this one
    convenient for an attacker: the entry runs once and deletes itself. The
    startup list leaves evidence, this one does not.

    The moment weighs too. The one-off list is carried out after a restart -
    when the machine is coming back to work and nobody is looking at it, all
    the more so if the restart was part of an update or of a failure.

    An honest warning: the same list is used by installers finishing work
    after a restart. A list passed over leaves the installation in an
    intermediate state while the package reports itself as installed.
