id: fedora44-issue-net-access

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.7.6
  section: Initial Setup > Configure Command Line Warning Banners
  title:
    pl: Dostęp do /etc/issue.net jest ograniczony
    en: Ensure access to /etc/issue.net is configured
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Treść /etc/issue.net serwer SSH może pokazywać każdemu, kto się z nim
    połączy, zanim poda hasło. Jeśli plik może zmienić zwykły użytkownik,
    może usunąć ostrzeżenie albo podsunąć łączącym się fałszywe instrukcje.

    Punkt wymaga, żeby /etc/issue.net należał do roota i grupy root i miał
    tryb 0644 lub bardziej restrykcyjny. Tak jest domyślnie.
  en: |
    The SSH server can show the content of /etc/issue.net to anyone who
    connects, before they enter a password. If a regular user can change the
    file, they can remove the warning or plant false instructions for the
    people connecting.

    The item requires /etc/issue.net to be owned by the root user and group
    and to have mode 0644 or stricter. This is the default.

disruption_description:
  pl: |
    Nikt tego nie zauważy: plik czytają wszyscy, a zmienia go tylko
    administrator.
  en: |
    Nobody will notice: everyone reads the file and only an administrator
    changes it.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-management
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    f=/etc/issue.net
    if [ ! -e "$f" ]; then echo ABSENT; exit 0; fi
    set -- $(stat -Lc '%a %u %g' "$f")
    if [ $(( 0$1 & 07133 )) -eq 0 ] && [ "$2" = 0 ] && [ "$3" = 0 ]; then echo "RESTRICTED:$1"; else echo "TOO_OPEN:$1:$2:$3"; fi
  expected: '^(RESTRICTED:|ABSENT$)'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/issue.net
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=access-1
        if [ -e "$f" ]; then echo "$(readlink -f "$f") $(stat -Lc '%a %u %g' "$f")"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/issue.net
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      if [ ! -e "$f" ]; then echo "$f does not exist, nothing to change"; exit 0; fi
      tg=$(readlink -f "$f")
      set -- $(stat -c '%a' "$tg")
      chown 0:0 "$tg"
      # Five digits: with fewer, chmod keeps the setuid and setgid bits of a directory.
      chmod "$(printf '0%04o' $(( 0$1 & 0644 )))" "$tg"
      echo "Set owner root:root and mode $(stat -c '%a' "$tg") on $tg"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=access-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      tail -n +2 "$b" | while read -r f mode uid gid; do
        case "$mode" in ""|*[!0-7]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        case "$uid:$gid" in :*|*:|*[!0-9:]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        [ -e "$f" ] || { echo "Skipped $f: it no longer exists"; continue; }
        chown "$uid:$gid" "$f"
        chmod "$(printf '0%04o' $(( 0$mode )))" "$f"
        echo "Restored owner and mode of $f"
      done
    )

privileges: root
runnable: true

sources:
  - https://man.openbsd.org/sshd_config#Banner

notes:
  pl: |
    Sprawdzenie odczytuje właściciela i tryb pliku, na który wskazuje /etc/issue.net,
    i podaje je w wyniku. Na Fedorze /etc/issue.net to domyślnie link do /usr/lib/issue.net, więc
    sprawdzenie i naprawa dotyczą tego pliku. Zmiana trybu w /usr/lib będzie
    widoczna w rpm -V fedora-release-common, a aktualizacja pakietu
    przywróci tryb z pakietu, czyli 0644, który spełnia punkt.

    Naprawa ustawia właściciela root:root i usuwa prawa wykonywania, zapisu
    dla grupy i innych oraz bity specjalne, zostawiając pozostałe prawa.
    Wycofanie przywraca poprzedniego właściciela i tryb.
  en: |
    The check reads the owner and mode of the file /etc/issue.net points to and gives
    them in the result. On Fedora /etc/issue.net is by default a link to /usr/lib/issue.net, so the
    check and the remediation apply to that file. A mode change in /usr/lib
    shows up in rpm -V fedora-release-common, and a package update restores
    the packaged mode, 0644, which meets the item.

    The remediation sets the owner to root:root and removes execute
    permission, write permission for group and others, and special bits,
    keeping the other permissions. Rollback restores the previous owner and
    mode.
