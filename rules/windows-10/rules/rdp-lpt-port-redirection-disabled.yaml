id: win10-rdp-lpt-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów równoległych w sesji pulpitu zdalnego wyłączone
    en: The turning of doors in parallel into the session of the desk from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania udostępniania sesji zdalnej portów równoległych
    maszyny, z której użytkownik się łączy.

    Port równoległy jest jeszcze rzadszy od szeregowego i w praktyce
    służy dziś jednemu: starym drukarkom igłowym, wciąż używanym tam,
    gdzie potrzebny jest wydruk przez kalkę.

    Ocena jest niska i podstawa jest ta sama co przy porcie szeregowym.
    Nie jest to droga przenoszenia danych, tylko warstwa obsługi, która
    zostaje w systemie i nie jest sprawdzana, bo prawie nikt jej nie
    używa.

    Znaczenie ma jeszcze jedno: port ten bywa przekierowywany
    automatycznie razem z drukarkami klienta, więc jego udostępnienie
    następuje bez niczyjej decyzji.

    Odnotowuję, że punkt najczęściej jest bezkosztowy, a wyjątki dają się
    wskazać z nazwy: magazyn, przychodnia, dział wystawiający dokumenty
    przez kalkę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    — warstwę obsługi portu, której nikt nie ogląda.
  en: |
    The setting forbids the giving out to the session from afar of the doors in parallel of the machine the user
    joins themselves from.

    A door in parallel is rarer still than one in series and in practice serves today one thing: old printers of
    needles, used yet where a printing through carbon is needed.

    The grading is low and the ground is the same as at the door in series. It is no road for the carrying of
    data, but a layer of backing that stays in the system and is not looked over, next to nobody using it.

    One thing more has weight: that door is at times turned in of itself together with the client's printers, so
    its giving out comes about with nobody's decision.

    I set down that the item is most often without cost, and the exceptions may be named outright: a storehouse, a
    house of healing, a board making out papers through carbon.

    What an attacker gains while the item goes unmet: little - a layer backing a door nobody looks at.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie sprowadza się do pytania
    o drukarki igłowe.

    Miejscem pierwszym są dokumenty wystawiane przez kalkę: kwity
    magazynowe, recepty, dokumenty przewozowe. Sprzęt ten jest stary, ale
    używany świadomie, bo kopia powstaje w jednym przebiegu.

    Miejscem drugim są drukarki klienta przekierowywane do sesji razem
    z portem. Po zmianie drukarka przyłączona do portu równoległego
    przestanie być widoczna w sesji, choć pozostałe będą działać — i to
    jest objaw mylący.

    Odnotowuję, że drukowanie sieciowe działa dalej i to ono jest tu
    drogą zastępczą wszędzie tam, gdzie kalka nie jest wymagana.

    Skutek jest widoczny natychmiast, w postaci braku drukarki w sesji.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: drukarek sieciowych, drukarek maszyny zdalnej,
    sesji jako takich, pracy programów, logowania.
  en: |
    The class is "needs review", and the review comes to a question about printers of needles.

    The first place is papers made out through carbon: notes of the storehouse, orders of medicine, papers of
    carriage. That gear is old but used knowingly, a copy arising in one pass.

    The second place is the client's printers turned into the session together with the door. After the change a
    printer joined to a door in parallel will cease to be seen within the session, though the rest will work - and
    that is a misleading sign.

    I set down that printing over the network works on, and it is that which stands here in its stead wherever
    carbon is not called for.

    The consequence is seen at once, in the shape of the printer's absence within the session.

    The consequence shows at once, with no restart.

    What this does not break: printers upon the network, the far machine's printers, the sessions themselves, the
    work of programs, or logging on.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - printing
    - legacy-applications
  what_breaks:
    pl:
      - Drukarka igłowa przyłączona do portu równoległego przestanie być widoczna w sesji zdalnej
      - Pozostałe drukarki klienta będą działać dalej, więc objaw wygląda na usterkę jednej drukarki
      - Dokumenty wystawiane przez kalkę w magazynie albo przychodni stracą drogę wydruku z sesji
      - Drukowanie sieciowe działa dalej i jest drogą zastępczą tam, gdzie kalka nie jest wymagana
      - Drukarki maszyny zdalnej, sesje jako takie, praca programów i logowanie pozostają bez zmian
    en:
      - A printer of needles joined to a door in parallel will cease to be seen within the session from afar
      - The client s other printers will work on, so the sign looks like a fault of one printer
      - Papers made out through carbon in a storehouse or a house of healing will lose their road of printing from the session
      - Printing over the network works on and stands in its stead where carbon is not called for
      - The far machine s printers, the sessions themselves, the work of programs and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W sesji zdalnej drukuje się na drukarce igłowej przyłączonej do portu równoległego maszyny użytkownika
    en:
      - Within the session from afar there is printing upon a printer of needles joined to a door in parallel of the user s machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'fDisableLPT'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableLPT'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableLPT' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła jest najtańsza z rodziny przekierowań i warto to powiedzieć
    wprost. Wyjątki dają się wskazać z nazwy: magazyn, przychodnia, dział
    wystawiający dokumenty przez kalkę.

    Argument wart zachowania dotyczy udostępnienia bez decyzji. Port ten
    bywa przekierowywany automatycznie razem z drukarkami klienta, więc
    trafia do sesji, choć nikt o to nie prosił.

    Odnotowuję objaw mylący: pozostałe drukarki klienta będą działać,
    a zniknie jedna. Zgłoszenie przyjdzie jako usterka konkretnej
    drukarki, nie jako skutek zasady.
  en: |
    The rule is the cheapest of the kindred of turnings, and it is well to say so outright. The exceptions may be
    named: a storehouse, a house of healing, a board making out papers through carbon.

    The argument worth keeping touches a giving out with no decision. That door is at times turned in of itself
    together with the client's printers, so it reaches the session though nobody asked for it.

    I set down the misleading sign: the client's other printers will work and one will go. The report will come as
    a fault of that one printer and not as the working of a policy.
