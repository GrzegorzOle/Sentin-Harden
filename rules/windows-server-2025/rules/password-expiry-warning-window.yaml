id: win2025-password-expiry-warning-window

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uprzedzenie o wygaśnięciu hasła od 5 do 14 dni wcześniej
    en: Warning of password expiry between 5 and 14 days ahead
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System uprzedza osobę logującą się na tej maszynie, że jej hasło
    niedługo wygaśnie, na określoną liczbę dni przed tym dniem. Punkt
    wymaga, żeby okno to mieściło się między pięcioma a czternastoma
    dniami.

    Związek z bezpieczeństwem jest pośredni i warto go nazwać uczciwie.
    Hasło zmieniane w pośpiechu, w dniu wygaśnięcia, jest hasłem
    gorszym: powstaje pod presją i najczęściej jest wariantem
    poprzedniego. Uprzedzenie z wyprzedzeniem daje czas na zmianę
    spokojną, a nie odruchową.

    Na serwerze trzeba rozwiać jedno nieporozumienie, bo prowadzi do
    fałszywego poczucia załatwienia sprawy. Ustawienie działa na tej
    maszynie i dotyczy osób logujących się właśnie na niej. Ustawione na
    kontrolerze domeny nie rozsyła ostrzeżeń po domenie — każda maszyna
    ostrzega własnych użytkowników według własnego ustawienia. Na
    kontrolerze domeny dotyczy więc administratorów wchodzących na
    konsolę, a nie użytkowników domeny przy ich stanowiskach.

    Wynika z tego druga rzecz, ważniejsza na serwerze niż gdzie indziej.
    Konta usługowe nie logują się interaktywnie, więc ostrzeżenia nie
    zobaczą nigdy. Ich hasła wygasają w ciszy, a objawem jest usługa,
    która przestała się uwierzytelniać. Ten punkt tego nie rozwiązuje
    i nie udaje, że rozwiązuje — konta usługowe pilnuje się inaczej,
    wykazem terminów albo hasłem zarządzanym przez domenę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    pośrednio — hasła słabsze, tworzone w pośpiechu i podobne do
    poprzednich, a więc podatniejsze na zgadywanie po wzorcu.
  en: |
    The system warns whoever signs in on this machine that their password will soon lapse, a set
    number of days before that day. The item asks that the window lie between five and fourteen
    days.

    The bond with security is roundabout and worth naming honestly. A password changed in haste,
    on the day it lapses, is the worse password: it is made under pressure and is most often a
    variant of the one before. A warning given ahead leaves time for a calm change rather than a
    reflex.

    On a server one misunderstanding must be cleared, leading as it does to a false sense that
    the matter is settled. The setting works on this machine and bears on the people signing in
    upon it. Set on a domain controller it sends no warnings about the domain - every machine
    warns its own users by its own setting. On a domain controller it therefore bears on the
    administrators coming onto the console and not on the domain's users at their stations.

    From that follows a second matter, weightier on a server than elsewhere. Service accounts do
    not sign in interactively and will thus never see the warning. Their passwords lapse in
    silence, and the symptom is a service that has stopped authenticating. This item does not
    answer that and does not pretend to - service accounts are watched otherwise, by a list of
    dates or by a password managed by the domain.

    What an attacker gains while the item goes unmet: roundaboutly - weaker passwords, made in
    haste and like those before them, and so the readier to be guessed by pattern.

disruption_description:
  pl: |
    Nikt tego nie zauważy poza osobami logującymi się na tę maszynę
    kontem z hasłem wygasającym — a te zobaczą komunikat, którego
    wcześniej nie było, i nic poza tym.

    Zmiana niczego nie blokuje i niczego nie wymusza. Ostrzeżenie jest
    komunikatem do zamknięcia; hasło można zmienić od razu albo
    zignorować je do skutku. Termin wygaśnięcia pozostaje ten sam, bo
    ten punkt go nie dotyczy.

    Na serwerze grono odbiorców jest wąskie: administratorzy wchodzący
    na konsolę i pulpitem zdalnym. Kont usługowych to nie dotyczy, bo
    nie logują się interaktywnie.

    Zmiana nie dotyczy też kont, dla których hasło nie wygasa. Tam
    ostrzegać nie ma o czym i nic się nie pojawi.

    Naprawa ustawia czternaście dni, czyli górną granicę zakresu.
    Wybrałem ją dlatego, że przy niej najmniej zgłoszeń kończy się
    kontem zablokowanym po wygaśnięciu — na serwerze, na który
    administrator wchodzi raz na kilka dni, krótkie okno bywa oknem
    przegapionym.

    Zmiana nie wymaga przerwy i wchodzi w życie przy następnym
    logowaniu.
  en: |
    Nobody will mark it beyond the people signing in on this machine with an account whose
    password lapses - and they will see a message that was not there before, and nothing else.

    The change blocks nothing and forces nothing. The warning is a message to be closed; the
    password may be changed at once or passed by until the day comes. The date of lapsing stays
    the same, this item not bearing on it.

    On a server the circle of readers is narrow: the administrators coming onto the console and
    by remote desktop. Service accounts are not touched by it, not signing in interactively.

    Neither does the change bear on accounts whose password does not lapse. There is nothing to
    warn of there and nothing will show.

    The mending sets fourteen days, the upper end of the range. I chose it because at it the
    fewest reports end in an account locked after a lapse - on a server an administrator comes
    onto once in a few days, a short window is at times a window missed.

    The change takes no break and comes into force at the next signing in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Osoba logująca się na tę maszynę zobaczy komunikat o zbliżającym się wygaśnięciu hasła
      - Konta usługowe ostrzeżenia nie zobaczą, bo nie logują się interaktywnie
      - Termin wygaśnięcia hasła pozostaje ten sam, bo ten punkt go nie dotyczy
      - Na kontach z hasłem niewygasającym nie pojawi się nic
    en:
      - A person signing in on this machine will see a message of the password's coming lapse
      - Service accounts will not see the warning, not signing in interactively
      - The date the password lapses stays the same, this item not bearing on it
      - On accounts whose password does not lapse nothing will show
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item sets a range, not a single value, so both ends are reported
      # apart. A value below the range and a value above it are different
      # mistakes and a report should not merge them into one.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'PasswordExpiryWarning'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -lt 5) { 'BELOW_RANGE ' + $value }
        elseif ([int]$value -gt 14) { 'ABOVE_RANGE ' + $value }
        else { 'WITHIN_RANGE' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: WITHIN_RANGE
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'PasswordExpiryWarning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordExpiryWarning' -Value 14 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-prompt-user-to-change-password-before-expiration

notes:
  pl: |
    Ustawienie działa na tej maszynie i dotyczy osób logujących się
    właśnie na niej. Ustawione na kontrolerze domeny nie rozsyła
    ostrzeżeń po domenie — to nieporozumienie warto rozwiać, bo daje
    fałszywe poczucie załatwienia sprawy.

    Konta usługowe ostrzeżenia nie zobaczą nigdy, bo nie logują się
    interaktywnie. Ich hasła wygasają w ciszy i pilnuje się ich inaczej.

    Naprawa ustawia czternaście dni, czyli górną granicę zakresu. Każda
    liczba od pięciu do czternastu spełnia punkt. Reguła rozdziela wynik
    poniżej zakresu od wyniku powyżej, bo są to różne błędy.
  en: |
    The setting works on this machine and bears on the people signing in upon it. Set on a domain
    controller it sends no warnings about the domain - that misunderstanding is worth clearing,
    giving as it does a false sense that the matter is settled.

    Service accounts will never see the warning, not signing in interactively. Their passwords
    lapse in silence and are watched otherwise.

    The mending sets fourteen days, the upper end of the range. Every number from five to
    fourteen meets the item. The rule keeps a result below the range apart from one above it,
    these being different mistakes.
