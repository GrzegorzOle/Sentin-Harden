id: win2016-enable-delegation-none

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Włączanie delegowania nieprzyznane nikomu
    en: Enabling delegation granted to nobody
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy uprawnienie do oznaczania kont jako zaufanych do
    delegowania nie zostało przyznane nikomu.

    Delegowanie to mechanizm, dzięki któremu usługa może połączyć się z inną
    usługą w imieniu użytkownika, który się do niej zgłosił. Serwer stron łączy
    się z bazą danych jako ten użytkownik, a nie jako własne konto — i dzięki
    temu baza sprawdza uprawnienia właściwej osoby.

    Uprawnienie opisane tym punktem nie pozwala delegować. Pozwala rozstrzygnąć,
    komu wolno delegować — czyli oznaczyć dowolne konto komputera lub usługi
    jako zaufane. Konto tak oznaczone może odtąd występować w imieniu każdego,
    kto się do niego zgłosi.

    Kategoria wysoka. Posiadacz może oznaczyć maszynę, nad którą już ma kontrolę,
    jako zaufaną, a potem czekać, aż zgłosi się do niej ktoś silniejszy. Różnica
    wobec zwykłego przejęcia konta polega na tym, że tu napastnik nie potrzebuje
    poświadczeń — potrzebuje tylko cierpliwości.

    Na serwerze 2016 punkt ma znaczenie przede wszystkim na kontrolerze domeny,
    bo tam oznaczanie kont ma skutek dla całej domeny. Na serwerze członkowskim
    lista i tak powinna być pusta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: prawo do
    ustanowienia własnej maszyny pośrednikiem, przez którego przejdą tożsamości
    innych użytkowników.
  en: |
    The item checks that the right to mark accounts as trusted for delegation has
    been granted to nobody.

    Delegation is the mechanism by which a service can connect to another service
    on behalf of a user who came to it. A web server connects to a database as that
    user rather than as its own account - and so the database checks the right
    person's rights.

    The right this item describes does not allow delegation. It allows it to be
    settled who may delegate - that is, any computer or service account to be
    marked as trusted. An account so marked may from then on act in the name of
    everybody who comes to it.

    The category is high. Its holder can mark a machine they already control as
    trusted, and then wait for somebody stronger to come to it. The difference from
    simply taking an account is that here the attacker needs no credentials - only
    patience.

    On Server 2016 the item matters above all on a domain controller, because there
    the marking of accounts has effect across the whole domain. On a member server
    the list should be empty in any case.

    What an attacker gains while the item goes unmet: the right to set up their own
    machine as an intermediary through which other users' identities pass.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i dotyczy to głównie kontrolerów domeny.

    Na serwerze członkowskim lista jest domyślnie pusta i zmiana nie zrobi nic.
    Na kontrolerze domeny uprawnienie mają administratorzy i bywa to stan
    zamierzony, bo ktoś musi móc skonfigurować delegowanie, kiedy jest ono
    naprawdę potrzebne.

    Skutek odebrania go na kontrolerze jest opóźniony: istniejące delegowanie
    działa dalej, a przestaje być możliwe ustanawianie nowego. Objawi się więc
    dopiero przy wdrażaniu kolejnej aplikacji, i to komunikatem, który nie
    wskazuje na tę zmianę.

    Sprawdzenie sprowadza się do ustalenia, czy w organizacji ktoś konfiguruje
    delegowanie i jak często. Jeżeli odpowiedź brzmi „raz na kilka lat", punkt
    warto zastosować i nadawać uprawnienie na czas konkretnego wdrożenia.

    Czego to nie psuje: delegowania już skonfigurowanego, uwierzytelniania,
    pracy domeny ani niczego na serwerze członkowskim.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and it concerns domain controllers above all.

    On a member server the list is empty by default and the change does nothing. On
    a domain controller the administrators hold the right, and that is sometimes
    intended, because somebody has to be able to configure delegation where it is
    genuinely needed.

    The effect of taking it away on a controller is delayed: existing delegation
    carries on working, and only the setting up of new delegation stops being
    possible. It will therefore show at the deployment of the next application, and
    in a message that does not point to this change.

    The check comes down to establishing whether anybody in the organisation
    configures delegation and how often. If the answer is "once every few years",
    the item is worth applying and the right worth granting for the duration of a
    particular deployment.

    What this does not break: delegation already configured, authentication, the
    domain's work, or anything on a member server.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Ustanawianie nowego delegowania na kontrolerze domeny przestaje być możliwe
      - Skutek jest opóźniony i wychodzi dopiero przy wdrażaniu kolejnej aplikacji korzystającej z delegowania
      - Komunikat o niepowodzeniu nie wskazuje na tę zmianę, więc diagnoza bywa długa
      - Delegowanie już skonfigurowane, uwierzytelnianie i praca domeny działają bez zmian
    en:
      - Setting up new delegation on a domain controller stops being possible
      - The effect is delayed and comes out only at the deployment of the next application using delegation
      - The failure message does not point to this change, so diagnosis can take a while
      - Delegation already configured, authentication and the domain's work go on unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest kontrolerem domeny, a w organizacji regularnie konfiguruje się delegowanie dla nowych aplikacji
    en:
      - The machine is a domain controller and delegation is configured regularly in the organisation for new applications
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeEnableDelegationPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list is emptied. The right does not allow delegating - it allows it to be
    # settled who may delegate, so its holder can make a machine they control an
    # intermediary and wait for somebody stronger to arrive.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeEnableDelegationPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeEnableDelegationPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enable-computer-and-user-accounts-to-be-trusted-for-delegation

notes:
  pl: |
    Stan domyślny zależy od roli maszyny. Serwer członkowski ma tu listę pustą,
    kontroler domeny ma administratorów — i to jest wynik niezgodny, ale
    prawdziwy, a nie błąd reguły.

    Uprawnienie to nie dotyczy delegowania ograniczonego do wskazanych usług,
    konfigurowanego na poziomie samego konta. Punkt dotyczy oznaczania konta
    jako zaufanego bez ograniczeń, czyli wariantu najszerszego.

    Punkt warto czytać razem z regułą o podszywaniu się pod klienta. Obie
    opisują przyjmowanie cudzej tożsamości, ale ta działa w skali domeny,
    a tamta w granicach jednej maszyny.
  en: |
    The default state depends on the machine's role. A member server has an empty
    list here; a domain controller has the administrators - and that is a
    non-compliant but true result rather than an error in the rule.

    The right does not bear on delegation limited to named services, which is
    configured on the account itself. The item bears on marking an account as
    trusted without limits, that is, on the widest variant.

    The item is worth reading together with the rule on impersonating a client.
    Both describe taking on somebody else's identity, but this one works at the
    scale of the domain and that one within a single machine.
