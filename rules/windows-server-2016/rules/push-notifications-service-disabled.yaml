id: win2016-push-notifications-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa powiadomień wypychanych z sieci wyłączona
    en: The service for notifications pushed from the network disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa utrzymuje stałe połączenie z usługą producenta, przez które
    aplikacje na tej maszynie mogą otrzymywać powiadomienia wysyłane
    z zewnątrz.

    Kierunek jest tutaj rzeczą kluczową i odróżnia ten punkt od wszystkich
    poprzednich w bloku. Tamte dotyczyły danych wychodzących z maszyny.
    Ten dotyczy kanału, przez który coś przychodzi — a raczej może
    przyjść w dowolnej chwili, bo połączenie stoi otwarte cały czas.

    Połączenie jest wychodzące, więc zapora go przepuszcza. Jest stałe, więc
    nie rzuca się w oczy w nadzorze ruchu. Prowadzi do usługi producenta,
    więc wygląda na uzasadnione. Kanał o takich trzech własnościach jest
    dokładnie tym, czego szuka się, chcąc utrzymać łączność z maszyną bez
    zwracania uwagi.

    Nie znaczy to, że mechanizm jest wrogi. Znaczy to, że serwer utrzymuje
    otwarty kanał przyjmujący polecenia z zewnątrz, nie mając żadnej
    aplikacji, która by z niego korzystała.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obecność na
    maszynie stałego kanału przychodzącego, który zapora przepuszcza,
    nadzór pomija, a żadna aplikacja serwerowa nie potrzebuje.
  en: |
    The service keeps up a standing connection to the maker's service, through which
    applications on this machine may receive notifications sent from outside.

    Direction is here the key matter and sets this item apart from all the foregoing in the
    block. Those concerned data leaving the machine. This one concerns a channel by which
    something comes in - or rather may come in at any moment, the connection standing open all
    the while.

    The connection is an outgoing one, so the firewall lets it through. It is a standing one,
    so it does not catch the eye in the monitoring of traffic. It leads to the maker's service,
    so it looks warranted. A channel with those three properties is exactly what is sought by
    one who would keep touch with a machine without drawing notice.

    That does not mean the mechanism is hostile. It means the server keeps an open channel
    taking in commands from outside while having no application that would use it.

    What an attacker gains while the item goes unmet: the presence on the machine of a standing
    incoming channel the firewall lets through, the monitoring passes over, and no server
    application needs.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy cokolwiek na tej
    maszynie korzysta z powiadomień przychodzących.

    Na serwerze bez aplikacji ze sklepu odpowiedź brzmi nie. Mechanizm
    obsługuje aplikacje pisane pod nowszy model i na maszynie, na której
    takich nie ma, usługa utrzymuje połączenie dla nikogo.

    Sprawdzić warto dwie rzeczy. Pierwsza to aplikacje zarządzania
    urządzeniami i narzędzia konsolowe pisane w nowszym modelu, które
    powiadamiają o zdarzeniach tą drogą. Druga to powiadomienia systemowe
    wyświetlane w rogu ekranu — te przestaną się pojawiać, co na serwerze
    nie ma znaczenia, ale na maszynie obsługiwanej z konsoli bywa zauważone.

    Rzecz do odnotowania: usługa bywa wymagana przez inne składniki jako
    zależność i wtedy jej zatrzymanie zostawia je w stanie, w którym
    działają, ale nie powiadamiają. Jest to strata cicha i podobna do tej
    z reguł o nadzorze — brak powiadomienia wygląda jak brak zdarzenia.

    Czego to nie psuje: usług, sieci, udziałów, uwierzytelniania, dzienników
    zdarzeń.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anything on this machine
    uses incoming notifications.

    On a server without applications from the store the answer is no. The mechanism serves
    applications written to the newer model, and on a machine where there are none the service
    keeps a connection up for nobody.

    Two things are worth checking. The first is device management applications and console tools
    written to the newer model, which give notice of events by this road. The second is system
    notifications shown in the corner of the screen - those will stop appearing, which on a
    server does not matter, but on a machine attended at the console is at times noticed.

    A thing to note: the service is at times called for by other components as a dependency, and
    stopping it then leaves them in a state where they work but do not give notice. It is a
    quiet loss and like the one in the rules about monitoring - an absence of notice looks like
    an absence of an event.

    What this does not break: services, the network, shares, authentication, or event logs.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Aplikacje pisane w nowszym modelu, powiadamiające o zdarzeniach tą drogą, przestaną to robić
      - Składniki mające tę usługę jako zależność będą działać dalej, ale przestaną powiadamiać - brak powiadomienia wygląda jak brak zdarzenia
      - Powiadomienia systemowe w rogu ekranu przestają się pojawiać, co bywa zauważone na maszynie obsługiwanej z konsoli
      - Usługi, sieć, udziały, uwierzytelnianie i dzienniki zdarzeń pozostają bez zmian
    en:
      - Applications written to the newer model, giving notice of events by this road, will stop doing so
      - Components having this service as a dependency will work on but stop giving notice - an absence of notice looks like an absence of an event
      - System notifications in the corner of the screen stop appearing, which is at times noticed on a machine attended at the console
      - Services, the network, shares, authentication and event logs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja pisana w nowszym modelu, która powiadamia o zdarzeniach tą drogą
      - Narzędzie zarządzania urządzeniami w tej organizacji dociera do tej maszyny kanałem powiadomień
    en:
      - An application written to the newer model, giving notice of events by this road, works on the machine
      - A device management tool in this organisation reaches this machine by the notification channel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'WpnService' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This holds a standing outward connection. Applications that expect to be
    # reached through it lose that road.
    Stop-Service -Name 'WpnService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WpnService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'WpnService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/design/shell/tiles-and-notifications/windows-push-notification-services--wns--overview

notes:
  pl: |
    Punkt zamyka blok i odwraca jego kierunek, co warto wykorzystać
    w opisie. Cztery poprzednie punkty odpowiadały na pytanie, co maszyna
    wysyła. Ten odpowiada na pytanie, co maszyna jest gotowa przyjąć.

    Trzy własności kanału — wychodzący, stały, do usługi znanej — warto
    wymienić razem, bo dopiero razem tłumaczą kategorię średnią. Osobno
    każda z nich jest zwyczajna. Razem opisują połączenie, którego
    istnienia nikt nie kwestionuje i którego nikt nie ogląda.

    Warto przy tym uczciwie powiedzieć, czego reguła nie twierdzi. Nie
    twierdzi, że kanał jest wykorzystywany ani że producent robi z nim
    cokolwiek niewłaściwego. Twierdzi, że serwer nie ma powodu go
    utrzymywać — a każdy kanał utrzymywany bez powodu jest kanałem, który
    ktoś kiedyś znajdzie i wykorzysta w sposób, którego nikt nie
    przewidział.
  en: |
    The item shuts the block and turns its direction about, which is worth using in the
    description. The four items before it answered the question what the machine sends. This one
    answers the question what the machine is ready to take in.

    The channel's three properties - outgoing, standing, to a known service - are worth naming
    together, only together explaining the medium category. Apart each of them is ordinary.
    Together they describe a connection whose existence nobody questions and which nobody looks
    at.

    It is worth saying honestly what the rule does not claim. It does not claim the channel is
    used, nor that the maker does anything improper with it. It claims the server has no reason
    to keep it up - and every channel kept up for no reason is a channel somebody will one day
    find and use in a way nobody foresaw.
