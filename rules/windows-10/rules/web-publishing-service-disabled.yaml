id: win10-web-publishing-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa publikowania w sieci World Wide Web wyłączona
    en: The service of publishing in the World Wide Web switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę serwera sieciowego, czyli mechanizm
    udostępniający z tej maszyny strony i aplikacje przez sieć.

    Zastrzeżenie na stanowisku roboczym jest proste: serwer sieciowy to
    nasłuch przyjmujący żądania od każdego, kto do niego dotrze,
    i przekazujący je warstwie wykonującej kod. Stanowisko robocze nie
    ma powodu, żeby taki nasłuch prowadzić.

    Zagrożenie pierwsze to sam nasłuch. Port otwarty na maszynie
    użytkownika jest celem, który nie ma po co istnieć, a bywa
    uruchamiany przez narzędzie deweloperskie i zostaje po nim.

    Zagrożenie drugie to treść. Serwer udostępnia katalog, a katalog
    bywa wskazany szerzej, niż ktokolwiek zamierzał, więc udostępnia
    pliki, o których nikt nie pamięta.

    Zagrożenie trzecie to warstwa wykonująca kod. Aplikacja sieciowa
    działa z uprawnieniami nadanymi puli i bywa to więcej, niż wynika
    z potrzeby.

    Odnotowuję, że na maszynie faktycznie pełniącej rolę serwera punkt
    ten jest błędem i tak trzeba go pokazać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nasłuch
    serwera sieciowego na maszynie, która nie jest serwerem.
  en: |
    The setting switches off the service of the web server - the mechanism giving out from this machine pages and
    applications over the network.

    The reservation upon a station of work is a plain one: a web server is a listening taking in askings from
    whoever reaches it and handing them to a layer that works code. A station of work has no ground to keep such a
    listening.

    The first danger is the listening itself. A door open upon a user's machine is a mark that has no reason to be
    there, and is at times set going by a tool of building and left behind it.

    The second danger is the content. The server gives out a directory, and a directory is at times pointed at
    more broadly than anybody meant, so it gives out files nobody remembers.

    The third danger is the layer working code. An application of the web works with the rights granted to its
    pool, and that is at times more than the need warrants.

    I set down that upon a machine that truly holds the part of a server this item is a mistake, and so it is to
    be shown.

    What an attacker gains while the item goes unmet: a listening of a web server upon a machine that is no
    server.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo skutek jest widoczny
    natychmiast i dotyczy wszystkiego, co maszyna udostępnia.

    Miejscem pierwszym są witryny obsługiwane przez tę maszynę.
    Zatrzymanie usługi zrywa otwarte połączenia, a użytkownicy zobaczą
    brak odpowiedzi.

    Miejscem drugim są programy branżowe z wbudowanym interfejsem
    przeglądarkowym opartym na tym serwerze. Zdarza się to częściej, niż
    wynika z nazwy programu, bo interfejs bywa jedyną widoczną częścią.

    Miejscem trzecim są narzędzia deweloperskie i środowiska testowe
    uruchomione miejscowo. Tam skutkiem jest zatrzymanie pracy osoby,
    która nie spodziewa się, że jej środowisko zależy od usługi
    systemowej.

    Odnotowuję, że przed wdrożeniem trzeba sprawdzić, czy maszyna czegoś
    nie udostępnia. Odpowiedź „nie" czyni punkt bezkosztowym, a bywa
    błędna.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: przeglądania stron w sieci, poczty, sieci,
    logowania, drukowania.
  en: |
    The class is "needs a planned rollout", for the upshot is seen at once and touches everything the machine
    gives out.

    The first place is the sites this machine serves. The stopping of the service breaks open joinings, and the
    users will see no answer.

    The second place is programs of a trade with a face of the browser built upon that server. It happens oftener
    than the program's name would tell, the face being at times its one seen part.

    The third place is tools of building and settings for trial set going upon the spot. There the upshot is the
    stopping of the work of somebody who looks not for their setting to hang upon a service of the system.

    I set down that before the rollout it must be looked at whether the machine gives anything out. The answer
    "no" makes the item without cost, and is at times wrong.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the looking over of pages in the web, the post, the network, logging on, or
    printing.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Witryny obsługiwane przez tę maszynę przestaną odpowiadać, a otwarte połączenia zostaną zerwane
      - Programy branżowe z wbudowanym interfejsem przeglądarkowym opartym na tym serwerze przestaną działać
      - Zdarza się to częściej, niż wynika z nazwy programu, bo interfejs bywa jedyną widoczną częścią
      - Narzędzia deweloperskie i środowiska testowe uruchomione miejscowo zatrzymają pracę
      - Przeglądanie stron w sieci, poczta, sieć, logowanie i drukowanie pozostają bez zmian
    en:
      - The sites this machine serves will cease to answer, and open joinings will be broken
      - Programs of a trade with a face of the browser built upon that server will cease to work
      - It happens oftener than the program s name would tell, the face being at times its one seen part
      - Tools of building and settings for trial set going upon the spot will stop their work
      - The looking over of pages in the web, the post, the network, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna udostępnia witrynę albo aplikację sieciową, choćby wyłącznie dla siebie
      - Program branżowy używany na tej maszynie ma interfejs przeglądarkowy oparty na tym serwerze
    en:
      - The machine gives out a site or an application of the web, if only for itself
      - A program of a trade used upon this machine has a face of the browser built upon that server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off the joinings open to the sites this machine
    # serves.
    Stop-Service -Name 'W3SVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'W3SVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'W3SVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

notes:
  pl: |
    Reguła wymaga sprawdzenia, które bywa udzielane zbyt szybko. Warto,
    żeby aplikacja zapytała wprost, czy maszyna czegoś nie udostępnia,
    bo odpowiedź „nie" bywa błędna — interfejs przeglądarkowy programu
    branżowego często opiera się właśnie na tej usłudze.

    Argument wart postawienia dotyczy roli maszyny. Serwer sieciowy na
    stanowisku roboczym to nasłuch przyjmujący żądania od każdego, kto do
    niego dotrze. Nie ma tam czego bronić, więc nie ma powodu go
    utrzymywać.

    Odnotowuję maszyny faktycznie pełniące rolę serwera. Tam punkt jest
    błędem i aplikacja ma to pokazać, zamiast namawiać do zmiany.
  en: |
    The rule calls for a looking that is at times granted too swiftly. It is well that the application ask
    outright whether the machine gives anything out, the answer "no" being at times wrong - the face of the
    browser of a program of a trade rests often upon that very service.

    The argument worth putting touches the machine's part. A web server upon a station of work is a listening
    taking in askings from whoever reaches it. There is nothing there to guard, so there is no ground to keep it.

    I set down machines that truly hold the part of a server. There the item is a mistake and the application is
    to show it so, rather than urge the change.
