id: win2016-defender-scan-removable-drives

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > Scan
  title:
    pl: Skanowanie nośników wymiennych przy skanowaniu pełnym włączone
    en: Scanning of removable media during a full scan switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza obejmowanie nośników wymiennych skanowaniem pełnym,
    zamiast pomijania ich jako zawartości nienależącej do maszyny.

    Pominięcie było kiedyś decyzją rozsądną: nośnik wymienny bywa duży,
    wolny i podłączony na chwilę, a skanowanie go wydłużało pracę bez
    widocznego pożytku. Rozumowanie to przestaje działać tam, gdzie nośnik
    nie jest podłączany na chwilę, tylko leży w maszynie miesiącami.

    Właśnie tak wygląda to na serwerze. Dysk zewnętrzny z kopiami
    zapasowymi, nośnik z archiwum, dysk przenoszony między maszynami
    w środowisku odciętym od sieci — wszystkie one przedstawiają się
    systemowi jako nośnik wymienny i wszystkie zostają poza skanowaniem.

    Wartość punktu jest jednak ograniczona i warto to powiedzieć wprost.
    Plik na nośniku pominiętym przez skanowanie pełne zostanie mimo to
    sprawdzony w chwili otwarcia albo uruchomienia, bo tym zajmuje się
    warstwa czasu rzeczywistego. Punkt zmienia moment wykrycia, a nie sam
    fakt.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce,
    w którym plik może leżeć nierozpoznany dowolnie długo — a nośnik
    wymienny bywa przenoszony do maszyn gorzej chronionych.
  en: |
    The setting brings removable media within a full scan, instead of passing them
    over as contents not belonging to the machine.

    The passing over was once a sensible decision: removable media can be large,
    slow and attached for a moment, and scanning them lengthened the work with no
    visible good. That reasoning stops working where the medium is not attached for
    a moment but lies in the machine for months.

    That is just how it looks on a server. An external disk with backups, a medium
    holding an archive, a disk carried between machines in an environment cut off
    from the network - all of them present themselves to the system as removable
    media and all stay outside the scan.

    The item's value is limited, though, and that is worth saying outright. A file
    on a medium passed over by a full scan will be checked all the same at its
    opening or running, the real-time layer seeing to that. The item changes the
    moment of detection rather than the fact of it.

    What an attacker gains while the item goes unmet: a place where a file can lie
    unrecognised for as long as one likes - and removable media get carried to
    machines less well protected.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba czas skanowania pełnego.

    Na maszynie z podłączonym dyskiem zewnętrznym o dużej pojemności
    skanowanie pełne przestaje mieścić się w oknie, które mu wyznaczono.
    Jest to najczęstszy skutek tej reguły i zwykle jedyny: skanowanie trwa
    dłużej albo nie kończy się przed rozpoczęciem pracy.

    Przypadek szczególny, wart wymienienia osobno, to magazyn kopii
    zapasowych na nośniku przedstawiającym się jako wymienny. Wtedy nakłada
    się to na skanowanie archiwów i obie reguły razem potrafią wydłużyć
    skanowanie z godzin do dni. Odpowiedzią jest wyłączenie dla katalogu
    magazynu.

    Rzecz druga dotyczy nośników wolnych. Skanowanie nośnika podłączonego
    przez wolne złącze obciąża je na długo i bywa zauważalne dla tego, kto
    z niego w tym czasie korzysta.

    Czego to nie psuje: dostępu do nośników, kopiowania plików, usług,
    logowania, sprawdzania plików w czasie rzeczywistym.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is the time of the full
    scan.

    On a machine with a large external disk attached, the full scan ceases to fit
    the window set for it. That is the commonest consequence of this rule and as a
    rule the only one: the scan takes longer or does not end before work begins.

    A particular case, worth naming apart, is a backup store on a medium presenting
    itself as removable. It then lies atop the scanning of archives, and the two
    rules together can lengthen a scan from hours into days. The answer is an
    exclusion for the store's directory.

    The second thing concerns slow media. Scanning a medium attached through a slow
    connection burdens it for a long while and is at times noticeable to whoever is
    using it at the time.

    What this does not break: access to media, the copying of files, services,
    signing in, or the real-time checking of files.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - removable-media
    - updates-and-servicing
  what_breaks:
    pl:
      - Skanowanie pełne przestaje mieścić się w wyznaczonym oknie, gdy do maszyny podłączony jest dysk zewnętrzny o dużej pojemności
      - Magazyn kopii zapasowych na nośniku wymiennym nakłada się na skanowanie archiwów i obie reguły razem wydłużają skanowanie z godzin do dni
      - Skanowanie nośnika podłączonego przez wolne złącze obciąża je na długo i bywa zauważalne dla korzystającego
      - Dostęp do nośników, kopiowanie plików i sprawdzanie w czasie rzeczywistym pozostają bez zmian
    en:
      - A full scan ceases to fit the window set for it once a large external disk is attached to the machine
      - A backup store on removable media lies atop the scanning of archives, and the two rules together lengthen a scan from hours into days
      - Scanning a medium attached through a slow connection burdens it for a long while and is at times noticeable to whoever is using it
      - Access to media, the copying of files and real-time checking stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do maszyny podłączony jest na stałe magazyn kopii zapasowych na nośniku wymiennym i nie dodano dla niego wyłączenia
      - Okno skanowania pełnego jest wąskie i nie da się go wydłużyć
    en:
      - A backup store on removable media is permanently attached to the machine and no exclusion has been added for it
      - The window for a full scan is narrow and cannot be lengthened
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableRemovableDriveScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableRemovableDriveScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRemovableDriveScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Punkt jest w bloku najlżejszy i najłatwiejszy do odpuszczenia świadomie.
    Warto to powiedzieć, bo lista, która o każdym punkcie mówi tym samym
    tonem, przestaje pomagać w ustalaniu kolejności.

    Na maszynie serwerowej najciekawsze jest to, że pojęcie „nośnik
    wymienny" bywa szersze, niż ktokolwiek zakłada. Dyski podłączone przez
    złącze zewnętrzne, część macierzy i część dysków wirtualnych przedstawia
    się systemowi w ten sposób, choć nikt nigdy ich nie odłącza. Warto
    sprawdzić, co na tej maszynie do tej kategorii należy, zanim uzna się
    punkt za nieistotny.

    Zależność ze skanowaniem archiwów jest tu praktyczna: obie reguły
    dotykają tych samych danych i wdrożone razem bez wyłączeń potrafią dać
    skanowanie, które nigdy się nie kończy.
  en: |
    The item is the lightest in the block and the easiest to let go deliberately.
    That is worth saying, since a list speaking of every item in the same tone stops
    helping to settle an order of work.

    On a server machine the most interesting thing is that the notion of "removable
    media" is at times wider than anybody assumes. Disks attached through an
    external connection, some arrays and some virtual disks present themselves to
    the system that way, though nobody ever detaches them. It is worth checking what
    on this machine belongs to that category before the item is reckoned
    unimportant.

    The relation to the scanning of archives is practical here: both rules touch the
    same data, and rolled out together with no exclusions they can give a scan that
    never ends.
