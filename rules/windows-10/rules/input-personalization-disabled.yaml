id: win10-input-personalization-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Regional and Language Options
  title:
    pl: Zbieranie danych o wprowadzaniu tekstu wyłączone
    en: Collection of data about text input turned off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Dopasowanie podpowiedzi do sposobu pisania wymaga materiału: system zbiera to,
    co człowiek wpisuje, dyktuje i pisze odręcznie, i buduje z tego własny słownik
    użytkownika.

    Materiał ten jest dokładnie tym, przed czym broni się reszta zabezpieczeń.
    Wpisywany tekst to treść dokumentów, nazwy wewnętrzne, adresy, numery spraw —
    a w części przypadków także hasła wpisane w niewłaściwe pole. Zbiór tego
    rodzaju leży na maszynie i wędruje dalej, zależnie od pozostałych ustawień.

    Wyłączenie zbierania zamyka to źródło. Atakujący, który dostanie się do
    profilu użytkownika, nie znajdzie w nim gotowego zapisu tego, co ten człowiek
    pisał.
  en: |
    Fitting suggestions to the way somebody writes calls for material - the system
    gathers what a person types, dictates and writes by hand, and builds a
    dictionary of their own out of it.

    That material is exactly what the rest of the safeguards defend. Typed text is
    the contents of documents, internal names, addresses, case numbers - and in
    some instances passwords typed into the wrong field. A collection of that kind
    lies on the machine and travels onward, depending on the remaining settings.

    Switching the collection off shuts that source. An attacker reaching a user s
    profile does not find in it a ready record of what that person wrote.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo dotyka wygody pisania, a nie tylko zbierania
    danych. Razem z gromadzeniem materiału znika dopasowywanie podpowiedzi do
    człowieka.

    Najmocniej odczują to osoby piszące na klawiaturze ekranowej albo piórem —
    tam podpowiadanie kolejnego słowa realnie przyspiesza pracę. Na stanowisku z
    klawiaturą fizyczną różnica bywa niezauważalna.

    Osobno trzeba pamiętać o dyktowaniu. Rozpoznawanie mowy korzysta z tego samego
    mechanizmu personalizacji, więc po zmianie działa dalej, ale gorzej dopasowuje
    się do wymowy i słownictwa konkretnej osoby.
  en: |
    The change calls for a review, since it touches the comfort of writing rather
    than the gathering of data alone. The fitting of suggestions to a person goes
    together with the gathering of material.

    Those who type on an on-screen keyboard or write with a pen feel it most -
    there suggesting the next word really does speed the work up. On a station
    with a physical keyboard the difference tends to go unnoticed.

    Dictation needs separate thought. Speech recognition uses the same
    personalisation mechanism, so after the change it still works but fits itself
    less well to a particular person s pronunciation and vocabulary.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Podpowiadanie słów na klawiaturze ekranowej i przy pisaniu piórem przestanie się dopasowywać do użytkownika
      - Rozpoznawanie mowy będzie działało dalej, ale gorzej dopasowane do wymowy i słownictwa konkretnej osoby
      - Zebrany dotąd słownik użytkownika przestanie być uzupełniany, co część osób zgłosi jako pogorszenie działania klawiatury
      - Pisanie na klawiaturze fizycznej, układy klawiatury, języki wprowadzania i praca użytkownika pozostają bez zmian
    en:
      - Word suggestion on the on-screen keyboard and when writing with a pen stops fitting itself to the user
      - Speech recognition still works but is fitted less well to a particular person s pronunciation and vocabulary
      - The dictionary gathered so far stops being added to, which some people report as the keyboard working worse
      - Typing on a physical keyboard, keyboard layouts, input languages and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska z ekranem dotykowym albo piórem, na których podpowiadanie słów jest podstawą sposobu pracy
      - Osoby korzystające z dyktowania jako głównej drogi wprowadzania tekstu
      - Środowiska dostępności, w których dopasowane podpowiedzi zastępują pełne wpisywanie
    en:
      - Stations with a touch screen or a pen, where word suggestion underpins the way of working
      - People using dictation as their main road for entering text
      - Accessibility environments, where fitted suggestions stand in for typing in full
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowInputPersonalization'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    $name = 'AllowInputPersonalization'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowInputPersonalization' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy

notes:
  pl: |
    Wyłącznik obejmuje personalizację wprowadzania jako całość: klawiaturę
    ekranową, pismo odręczne i rozpoznawanie mowy. Punkt ocenia się razem ze
    zbieraniem materiału językowego, bo obie zasady dotyczą tego samego strumienia
    danych, ale zapisane są w innych gałęziach.
  en: |
    The switch covers input personalisation as a whole - the on-screen keyboard,
    handwriting and speech recognition. The item is judged together with the
    gathering of language material, since both rules concern the same stream of
    data while being written in different branches.
