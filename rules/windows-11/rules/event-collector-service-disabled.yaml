id: win11-event-collector-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zbierania dzienników z innych maszyn wyłączona
    en: The service collecting logs from other machines disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przyjmuje zdarzenia z dzienników innych maszyn i zapisuje je
    u siebie. Maszyna, na której działa, jest punktem zbiorczym: pozostałe
    przesyłają do niej swoje dzienniki, a ona prowadzi subskrypcje określające,
    czego i od kogo oczekuje.

    Na stacji roboczej rola ta nie ma zastosowania i to jest cała podstawa
    punktu. Zbieranie dzienników prowadzi się na wydzielonym serwerze,
    zabezpieczonym mocniej niż stanowiska, właśnie dlatego, że dzienniki są
    materiałem dowodowym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, ma dwie postaci.
    Pierwsza: usługa przyjmuje połączenia z sieci i obsługuje dane przysyłane
    przez inne maszyny, więc jest powierzchnią, której na stanowisku nic nie
    uzasadnia. Druga, poważniejsza: stanowisko będące punktem zbiorczym
    przechowuje dzienniki z innych maszyn, a stanowisko przejmuje się łatwiej
    niż serwer. Napastnik, który wejdzie na taką maszynę, dostaje nie tylko ją,
    ale i zapis tego, co działo się gdzie indziej — razem z możliwością jego
    usunięcia.

    Punkt jest o tyle nietypowy, że dotyczy mechanizmu służącego
    bezpieczeństwu. Nie chodzi o to, żeby dzienników nie zbierać, tylko o to,
    żeby nie zbierać ich tutaj.
  en: |
    The service takes events from other machines' logs and records them at home. The
    machine it runs on is a collection point: the rest send their logs to it, and it
    keeps subscriptions saying what it expects and from whom.

    At a workstation that role has no use, and that is the whole basis of the item.
    Collecting logs is done on a dedicated server, guarded more strongly than stations,
    precisely because logs are evidence.

    What an attacker gains while the item goes unmet takes two forms. The first: the
    service takes connections from the network and handles data sent by other machines,
    so it is surface nothing at a station justifies. The second, weightier: a station
    acting as a collection point holds logs from other machines, and a station is taken
    over more easily than a server. An attacker who gets onto such a machine gets not
    only it but also the record of what happened elsewhere - along with the means of
    removing it.

    The item is unusual in that it concerns a mechanism serving security. The point is
    not that logs should not be collected, but that they should not be collected here.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna jest punktem zbiorczym dla dzienników
    innych maszyn — a na stanowisku zwykle nie jest.

    Standardowo usługa nie jest uruchamiana i zmiana niczego nie dotyka.

    Jeżeli usługa działa i ma zdefiniowane subskrypcje, sprawa wymaga uwagi
    większej niż zwykle, bo skutkiem jest utrata widoczności. Maszyny
    przesyłające tu swoje dzienniki przestaną mieć dokąd je przesyłać,
    a zdarzenia z okresu po zmianie nie trafią nigdzie. Nie będzie to
    widoczne jako błąd na tej maszynie — będzie widoczne jako cisza
    w dziennikach zbiorczych, czyli dokładnie tak, jak wygląda skuteczny atak.

    Z tego powodu wdrożenie powinno poprzedzić przeniesienie subskrypcji na
    wydzielony serwer, a nie samo wyłączenie usługi. Kolejność ma znaczenie:
    najpierw nowy punkt zbiorczy, potem wyłączenie starego.

    Dzienniki własne tej maszyny są prowadzone dalej bez żadnej zmiany —
    obsługuje je inna usługa. Przesyłanie dzienników z tej maszyny do punktu
    zbiorczego gdzie indziej również działa dalej.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether the machine is a collection point for other machines'
    logs - and at a station it usually is not.

    As a matter of course the service is not started and the change touches nothing.

    If the service is running and has subscriptions defined, the matter calls for more
    care than usual, since the effect is a loss of visibility. Machines sending their
    logs here will have nowhere to send them, and events from the time after the change
    will go nowhere. This will not show as an error on this machine - it will show as
    silence in the collected logs, which is exactly what a successful attack looks like.

    For that reason the rollout should be preceded by moving the subscriptions to a
    dedicated server rather than by disabling the service alone. The order matters: the
    new collection point first, switching the old one off after.

    This machine's own logs go on being kept with no change at all - another service
    handles them. Sending logs from this machine to a collection point elsewhere carries
    on working too.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyny przesyłające tu swoje dzienniki tracą punkt zbiorczy i zdarzenia nie trafiają nigdzie
      - Subskrypcje określające, czego i od kogo oczekiwać, przestają być obsługiwane
      - Utrata ta objawia się ciszą w dziennikach zbiorczych, a nie błędem na tej maszynie
      - Dzienniki własne tej maszyny są prowadzone dalej bez żadnej zmiany
    en:
      - Machines sending their logs here lose the collection point and events go nowhere
      - Subscriptions saying what to expect and from whom stop being served
      - That loss shows as silence in the collected logs rather than an error on this machine
      - This machine's own logs go on being kept with no change at all
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest punktem zbiorczym dla dzienników innych maszyn i nie ma zastępstwa
      - Subskrypcje zbierania dzienników nie zostały jeszcze przeniesione na wydzielony serwer
    en:
      - The machine is the collection point for other machines' logs and has no replacement
      - The log collection subscriptions have not yet been moved to a dedicated server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service ends the collection of events from other machines;
    # events from the time after the change will go nowhere.
    Stop-Service -Name 'Wecsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Wecsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Wecsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wec/windows-event-collector

notes:
  pl: |
    Punkt dotyczy wyłącznie roli punktu zbiorczego. Przesyłanie dzienników
    z tej maszyny gdzie indziej obsługuje inny składnik i wyłączenie tej usługi
    go nie dotyka. Reguła nie zmniejsza więc widoczności tej maszyny
    w systemie monitorowania.

    Przed wdrożeniem warto wypisać subskrypcje zdefiniowane na maszynie.
    Pusta lista oznacza zmianę bez skutków; lista niepusta oznacza, że maszyna
    pełni rolę, o której ktoś zdecydował, i wtedy kolejność opisana wyżej jest
    obowiązkowa.

    Wyłączenie usługi nie usuwa dzienników zebranych wcześniej ani definicji
    subskrypcji. Po cofnięciu zmiany zbieranie podejmuje się od nowa, ale
    zdarzenia z okresu przerwy nie zostaną odtworzone — maszyny źródłowe ich
    nie przechowują w tym celu.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The item concerns the role of collection point alone. Sending logs from this machine
    elsewhere is handled by another component and disabling this service does not touch
    it. The rule therefore does not lessen this machine's visibility in the monitoring
    system.

    Listing the subscriptions defined on the machine is worth doing before a rollout. An
    empty list means a change with no effects; a non-empty list means the machine holds a
    role somebody decided on, and then the order described above is obligatory.

    Disabling the service removes neither the logs collected earlier nor the definitions
    of the subscriptions. Once the change is undone, collection begins afresh, but events
    from the time of the break will not be recovered - the source machines do not keep
    them for that purpose.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
