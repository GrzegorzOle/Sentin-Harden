id: win2025-rdp-security-layer-tls

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Warstwa zabezpieczeń pulpitu zdalnego ustalona na protokół szyfrujący
    en: The remote desktop security layer fixed to the encrypting protocol
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zestawiać sesję pulpitu zdalnego wewnątrz
    standardowego protokołu szyfrującego warstwy transportowej, zamiast
    korzystać z własnego mechanizmu pulpitu zdalnego albo zostawiać
    wybór negocjacji.

    Różnica nie dotyczy siły szyfrowania, tylko czegoś, co waży więcej:
    sprawdzenia, z kim się rozmawia.

    Mechanizm własny pulpitu zdalnego szyfruje ruch, ale nie daje
    klientowi sposobu na upewnienie się, że po drugiej stronie stoi
    ten serwer, o który chodziło. Połączenie jest wtedy poufne wobec
    podsłuchu biernego i bezbronne wobec kogoś, kto stanie w środku.
    Napastnik zestawia dwa szyfrowane połączenia — jedno z klientem,
    drugie z serwerem — i widzi wszystko, co przez nie idzie, łącznie
    z hasłem wpisywanym w sesji.

    Protokół warstwy transportowej wnosi tu jedną rzecz, której tamtemu
    brakuje: certyfikat serwera. Klient może sprawdzić, czy rozmawia
    z maszyną o tej nazwie, a nie z kimś, kto się za nią podaje.

    Na serwerze waży to więcej niż na stanowisku roboczym, bo w sesji
    zdalnej do serwera wpisuje się zwykle poświadczenia administracyjne,
    a droga do niego wiedzie przez więcej odcinków sieci, niż wiedzie
    droga do stanowiska w tym samym pokoju.

    Warto od razu powiedzieć, gdzie kończy się wartość tego punktu.
    Serwer bez własnego certyfikatu wystawia certyfikat samodzielnie
    podpisany, którego klient nie ma jak zweryfikować. Sam protokół jest
    wtedy ustawiony poprawnie, a rozpoznanie serwera dalej nie działa —
    i to jest różnica, której raport zgodności sam z siebie nie pokaże.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość stanięcia w środku połączenia pulpitu zdalnego
    i odczytania wszystkiego, co w sesji zostanie wpisane.
  en: |
    The setting bids a remote desktop session be set up within the standard encrypting protocol of
    the transport layer, instead of using remote desktop's own mechanism or leaving the choice to
    negotiation.

    The difference bears not on the strength of the encryption but on something that weighs more:
    the checking of whom one speaks with.

    Remote desktop's own mechanism encrypts the traffic but gives the client no way of making sure
    that the server meant stands on the other side. The connection is then private against idle
    listening and defenceless against somebody who stands in the middle. The attacker sets up two
    encrypted connections - one with the client, one with the server - and sees all that goes
    through them, the password typed in the session included.

    The transport layer's protocol brings one thing the other lacks: the server's certificate. The
    client may check whether it speaks with a machine of that name and not with somebody giving
    themselves out for it.

    On a server that weighs more than at a working station, administrative credentials being
    usually typed in a remote session to a server, and the road to it leading through more
    stretches of network than the road to a station in the same room.

    It is worth saying at once where this item's worth ends. A server without a certificate of its
    own puts out a certificate signed by itself, which the client has no way of verifying. The
    protocol itself is then set rightly and the telling of the server still does not work - and
    that is a difference a report of compliance will not of itself show.

    What an attacker gains while the item goes unmet: the means of standing in the middle of a
    remote desktop connection and reading all that is typed in the session.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy wszystko, co łączy się z tym serwerem
    pulpitem zdalnym, potrafi rozmawiać protokołem warstwy transportowej.

    Współczesny klient potrafi i robi to domyślnie. Nie potrafią tego
    terminale cienkiego klienta z zamrożonym oprogramowaniem wewnętrznym
    ani oprogramowanie branżowe zestawiające sesję własną biblioteką
    sprzed lat. Objawem jest wtedy odmowa połączenia bez wyjaśnienia
    albo komunikat o niezgodności protokołu.

    Rzecz, którą trzeba rozważyć osobno, jest certyfikat. Ustawienie
    samo w sobie niczego nie psuje, ale kieruje uwagę na to, czym serwer
    się przedstawia. Serwer bez certyfikatu wystawionego przez uznane
    centrum używa własnego, samodzielnie podpisanego — a wtedy klient
    pokazuje ostrzeżenie przy każdym połączeniu.

    Ostrzeżenie to jest gorsze, niż się wydaje, i nie tylko dlatego,
    że przeszkadza. Ludzie uczą się je klikać, a gdy nauczą się klikać
    ostrzeżenie o certyfikacie, przestają odróżniać ostrzeżenie prawdziwe
    od fałszywego. Wdrożenie tego punktu bez wydania serwerowi
    certyfikatu daje zgodność w raporcie i przyzwyczajenie do klikania
    w zamian.

    Wniosek praktyczny: punkt wdraża się razem z certyfikatem pulpitu
    zdalnego wystawionym przez własne centrum certyfikacji. Bez tego
    połowa jego wartości zostaje na papierze.

    Zmiana wchodzi w życie od razu. Sesje już nawiązane pracują dalej,
    warunek sprawdza się przy następnym połączeniu — więc sesja, z której
    wprowadzasz zmianę, nie zostanie przerwana.

    Tak jak przy każdej zmianie w drzwiach wejściowych serwera, droga
    zapasowa do maszyny ma być znana przed zmianą, a nie po niej.
  en: |
    One thing needs checking: whether everything that connects to this server by remote desktop
    can speak the transport layer's protocol.

    A present-day client can and does so by default. It cannot be done by thin client terminals
    with frozen inner software nor by trade software setting up a session with a library of its
    own from years ago. The symptom is then a refusal of the connection with no explaining, or a
    message about a mismatch of protocol.

    The thing to be weighed apart is the certificate. The setting of itself breaks nothing, but it
    turns the attention to what the server presents itself by. A server without a certificate put
    out by a known authority uses its own, signed by itself - and then the client shows a warning
    at every connecting.

    That warning is worse than it seems, and not only because it gets in the way. People learn to
    click it, and once they have learned to click a warning about a certificate they stop telling
    a true warning from a false one. Rolling this item out without giving the server a certificate
    gives compliance in the report and a habit of clicking in exchange.

    The practical conclusion: the item is rolled out together with a remote desktop certificate put
    out by one's own authority of certification. Without that half its worth stays on paper.

    The change comes into force straight away. Sessions already opened work on, the condition being
    checked at the next connecting - so the session you make the change from will not be broken.

    As with every change to a server's front door, the spare road to the machine is to be known
    before the change and not after.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Terminal cienkiego klienta obsługujący wyłącznie starszy sposób nie zestawi sesji
      - Oprogramowanie branżowe zestawiające sesje własną biblioteką sprzed lat przestanie działać
      - Serwer bez certyfikatu z uznanego centrum pokaże ostrzeżenie przy każdym połączeniu
      - Sesje już nawiązane pracują dalej, warunek sprawdza się przy następnym połączeniu
    en:
      - A thin client terminal serving the older way alone will not set up a session
      - Trade software setting up sessions with a library of its own from years ago will stop working
      - A server without a certificate from a known authority will show a warning at every connecting
      - Sessions already opened work on, the condition being checked at the next connecting
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z serwerem łączą się terminale cienkiego klienta obsługujące wyłącznie starszy sposób
      - Serwerowi nie wydano certyfikatu pulpitu zdalnego i nikt nie planuje tego zrobić
    en:
      - Thin client terminals serving the older way alone connect to the server
      - No remote desktop certificate was given to the server and nobody plans to do so
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero is the protocol's own way, one
      # leaves the choice to negotiation, two forces the transport layer.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'SecurityLayer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'SecurityLayer'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SecurityLayer' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Różnica nie dotyczy siły szyfrowania, tylko sprawdzenia, z kim się
    rozmawia. Mechanizm własny pulpitu zdalnego szyfruje ruch, ale nie
    daje klientowi jak zweryfikować serwera — i to jest miejsce dla
    kogoś, kto stanie w środku.

    Punkt wdraża się razem z certyfikatem pulpitu zdalnego wystawionym
    przez własne centrum certyfikacji. Bez tego zgodność jest w raporcie,
    a rozpoznanie serwera dalej nie działa, bo klient nie ma jak
    zweryfikować certyfikatu samodzielnie podpisanego.

    Ostrzeżenie o certyfikacie przy każdym połączeniu uczy ludzi klikać
    ostrzeżenia — a wtedy przestają odróżniać prawdziwe od fałszywego.
  en: |
    The difference bears not on the strength of the encryption but on the checking of whom one
    speaks with. Remote desktop's own mechanism encrypts the traffic but gives the client no way
    of verifying the server - and that is the place for somebody to stand in the middle.

    The item is rolled out together with a remote desktop certificate put out by one's own
    authority of certification. Without it the compliance is in the report and the telling of the
    server still does not work, the client having no way of verifying a certificate signed by
    itself.

    A warning about a certificate at every connecting teaches people to click warnings - and then
    they stop telling a true one from a false one.
