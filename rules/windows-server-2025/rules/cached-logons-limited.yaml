id: win2025-cached-logons-limited

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Liczba zapamiętanych logowań ograniczona
    en: Number of cached sign-ins limited
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza liczbę logowań domenowych zapamiętanych lokalnie
    na wypadek, gdyby kontroler domeny był nieosiągalny, i wymaga wartości
    nie większej niż cztery.

    Mechanizm działa tak: przy udanym logowaniu domenowym maszyna zapisuje
    u siebie materiał pozwalający sprawdzić to samo hasło ponownie, już bez
    pytania kontrolera. Dzięki temu można zalogować się przy zerwanej
    sieci. Ceną jest to, że materiał ten zostaje na dysku i przeżywa
    wylogowanie, restart i upływ miesięcy.

    Na serwerze waży to więcej niż na stanowisku roboczym, i to jest
    najważniejsze zdanie w tym opisie. Na serwerze loguje się nie jego
    właściciel, tylko administratorzy — domenowi, z uprawnieniami sięgającymi
    poza tę maszynę. Serwer przechowujący pamięć po kilkudziesięciu takich
    logowaniach staje się dla napastnika, który już go przejął, spisem
    poświadczeń do reszty infrastruktury.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: materiał
    uwierzytelniający kont uprzywilejowanych, których sam nie zdobył —
    zostawili go tam ludzie logujący się do tej maszyny przez lata.
    Jest to droga awansu z jednego przejętego serwera na całą domenę
    i dlatego kategoria jest wysoka mimo poziomu drugiego.

    Argument „to tylko cztery zamiast dziesięciu" jest tu mylący. Znaczenie
    ma nie liczba, tylko to, czyje logowania w tej liczbie się mieszczą.
  en: |
    The setting bounds the number of domain sign-ins remembered locally in case the domain
    controller were unreachable, and takes a value no greater than four.

    The mechanism works thus: at a successful domain sign-in the machine records at itself
    material letting it check that same password again, now without asking the controller.
    Thanks to that one can sign in with the network cut. The price is that the material
    stays on the disk and outlives signing out, a restart and the passing of months.

    On a server that weighs more than at a working station, and that is the weightiest
    sentence in this description. On a server it is not its owner who signs in but
    administrators - domain ones, with rights reaching beyond this machine. A server keeping
    the memory of a few dozen such sign-ins becomes, for an attacker who has already taken
    it, a list of credentials to the rest of the infrastructure.

    What an attacker gains while the item goes unmet: authenticating material of privileged
    accounts they did not take themselves - it was left there by people signing in to this
    machine over years. It is a road of promotion from one taken server to the whole domain,
    and hence the category is high despite the second level.

    The argument "it is only four rather than ten" misleads here. What matters is not the
    number but whose sign-ins fit within it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy serwer bywa odcięty od kontrolera domeny
    i kto wtedy musi się na niego dostać.

    Zmniejszenie wartości nie usuwa pamięci zapisanej wcześniej. Usuwa
    ją dopiero kolejne logowanie, wypychające najstarszy wpis. Skutek
    wdrożenia jest więc rozłożony w czasie i na serwerze, na którym loguje
    się kilka osób, może nie ujawnić się przez tygodnie.

    Skutek właściwy ujawnia się dopiero przy zerwanej łączności
    z kontrolerem: osoba, której logowania nie ma już w pamięci, nie wejdzie
    na maszynę. Jest to dokładnie ta chwila, w której wejść trzeba —
    awaria sieci bywa powodem, dla którego ktoś idzie do serwerowni.

    Dlatego zmiana jest do przyjęcia tylko tam, gdzie istnieje konto
    lokalne z uprawnieniami administracyjnymi, którego hasło jest zapisane
    poza tą maszyną. Konto lokalne nie korzysta z pamięci logowań i działa
    niezależnie od kontrolera.

    Wartość zero, czyli brak pamięci, jest stanem najostrzejszym i spełnia
    punkt — ale na serwerze bez konta lokalnego oznacza brak wejścia przy
    każdej awarii łączności.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether the server is at times cut off from the domain controller
    and who then has to get onto it.

    Lowering the value does not remove memory recorded earlier. It is removed only by a
    further sign-in pushing the oldest entry out. The rollout's effect is thus spread out
    over time and on a server signed in to by a few people may not come to light for weeks.

    The effect proper comes to light only at a broken link with the controller: a person
    whose sign-in is no longer in the memory will not get onto the machine. It is exactly
    the moment at which one has to get on - a network fault is sometimes the reason somebody
    walks to the server room.

    Hence the change is acceptable only where there is a local account with administrative
    rights whose password is recorded beyond this machine. A local account does not use the
    sign-in memory and works regardless of the controller.

    The value zero, that is no memory at all, is the sharpest state and meets the item - but
    on a server with no local account it means no way in at every break of the link.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Przy zerwanej łączności z kontrolerem zalogują się tylko osoby z pamięci
      - Osoba logująca się rzadko wypada z pamięci i nie wejdzie w czasie awarii
      - Pamięć zapisana wcześniej znika dopiero przy kolejnych logowaniach
      - Konta lokalne nie korzystają z pamięci i działają niezależnie od kontrolera
    en:
      - With the link to the controller broken only people in the memory will sign in
      - Someone signing in rarely drops out of the memory and will not get in during a fault
      - Memory recorded earlier goes only at further sign-ins
      - Local accounts do not use the memory and work regardless of the controller
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze nie ma konta lokalnego z uprawnieniami administracyjnymi i znanym hasłem
      - Serwer pracuje w lokalizacji, w której łączność z kontrolerem bywa przerywana na długo
    en:
      - There is no local account with administrative rights and a known password on the server
      - The server works in a location where the link to the controller is at times broken for long
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'CachedLogonsCount'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $current = (Get-ItemProperty -Path $path -Name 'CachedLogonsCount' -ErrorAction SilentlyContinue).'CachedLogonsCount'
    [pscustomobject]@{
      path        = $path
      name        = 'CachedLogonsCount'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # The value is kept as text - that is the type this setting has carried since
    # it appeared, and writing a number here leaves it unread.
    Set-ItemProperty -Path $path -Name 'CachedLogonsCount' -Value '4' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-number-of-previous-logons-to-cache-in-case-domain-controller-is-not-available

notes:
  pl: |
    Wartość jest przechowywana jako tekst, nie jako liczba — jest to
    osobliwość tego ustawienia, obecna od lat. Zapis liczbowy zostaje przez
    system zignorowany, a ustawienie pozostaje przy wartości poprzedniej,
    więc naprawa wyglądałaby na wykonaną i nie działała.

    Na kontrolerze domeny ustawienie nie ma zastosowania, bo kontroler
    sprawdza poświadczenia u siebie i pamięci logowań nie prowadzi. Wartość
    tam zapisana jest martwa, ale audyt ją czyta i punkt wypada spełniony
    albo nie — zgodnie ze stanem zapisu, nie ze stanem faktycznym. Warto
    o tym wiedzieć przy czytaniu raportu z kontrolera.

    Zmniejszenie wartości nie czyści pamięci już zapisanej. Tam, gdzie
    maszyna jest podejrzewana o przejęcie, samo ograniczenie nie zastępuje
    wymuszenia zmiany haseł kont, które się na nią logowały.
  en: |
    The value is kept as text rather than as a number - a peculiarity of this setting,
    present for years. A numeric record is ignored by the system and the setting stays at
    its former value, so the remedy would look carried out and not work.

    On a domain controller the setting does not apply, since a controller checks credentials
    at itself and keeps no sign-in memory. A value recorded there is dead, but the audit
    reads it and the item comes out met or not - according to the state of the record rather
    than the state of fact. That is worth knowing when reading a report from a controller.

    Lowering the value does not clear memory already recorded. Where a machine is suspected
    of having been taken, the bound alone is no substitute for forcing a change of the
    passwords of the accounts that signed in to it.
