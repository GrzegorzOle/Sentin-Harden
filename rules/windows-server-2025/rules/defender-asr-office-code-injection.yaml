id: win2025-defender-asr-office-code-injection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wstrzykiwania kodu do innych procesów przez aplikacje pakietu biurowego
    en: Office applications blocked from injecting code into other processes
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania aplikacjom pakietu biurowego wstawiania własnego
    kodu do procesów innych programów.

    Jest to jedna z niewielu reguł w całej grupie, przy której nie
    trzeba ważyć zamiaru. Uruchomienie programu przez dokument bywa
    prawidłowe. Utworzenie pliku wykonywalnego przez dokument bywa
    prawidłowe. Wstawienie kodu do cudzego procesu przez edytor tekstu
    nie bywa prawidłowe nigdy — nie ma zastosowania, w którym byłoby to
    potrzebne do czegokolwiek.

    Dla napastnika jest to natomiast technika o dużej wartości, bo
    zmienia miejsce, w którym kod się wykonuje. Kod przeniesiony do
    procesu systemowego przestaje być widoczny jako aktywność aplikacji
    biurowej i zaczyna korzystać z uprawnień gospodarza. Mechanizmy
    obserwujące, co robi edytor tekstu, tracą go z oczu.

    Kategorię obniżam z tego samego powodu, co przy pozostałych regułach
    dotyczących dokumentów: na serwerze pakietu biurowego zwykle nie ma,
    a reguła bez zastosowania nie zdejmuje ryzyka. Tam gdzie pakiet jest
    — na serwerze terminalowym albo aplikacyjnym — ocena wraca wyżej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z pakietem biurowym — możliwość przeniesienia swojego kodu
    z dokumentu do procesu o innych uprawnieniach i o innym nadzorze.
  en: |
    The rule forbids the applications of the office bundle to set their own code into the processes
    of other programs.

    It is one of the few rules of the whole group at which no intent need be weighed. The running
    of a program by a document is at times right. The making of a file to be carried out by a
    document is at times right. The setting of code into another's process by a writer of text is
    never right - there is no use wherein it would be needed for anything.

    For the attacker, though, it is a craft of great worth, altering as it does the place the code
    is carried out in. Code borne into a process of the system stops being seen as the doing of an
    office application and begins using its host's rights. Mechanisms that watch what a writer of
    text does lose it from sight.

    I lower the category for the same ground as at the other rules bearing on documents - on a
    server there is mostly no office bundle, and a rule with no use takes no risk away. Where the
    bundle is - on a terminal server or on one of applications - the reckoning comes back higher.

    What an attacker gains while the item goes unmet: on a machine with an office bundle - the
    means of bearing their code out of a document into a process of other rights and other
    watching.

disruption_description:
  pl: |
    Zostawiam tu klasę „bez uciążliwości" i uważam, że jest to jedna
    z niewielu reguł w tej grupie, przy której można to zrobić
    uczciwie — a nie dlatego, że nic nie przychodzi do głowy.

    Podstawa jest ta sama, co w opisie ochrony. Wstawianie kodu do
    cudzego procesu nie jest czynnością, którą wykonuje jakiekolwiek
    prawidłowe rozwiązanie oparte na pakiecie biurowym. Dodatki, makra,
    integracje i automatyzacja składania dokumentów robią swoje przez
    udostępnione do tego mechanizmy, a nie przez wchodzenie do pamięci
    innych programów.

    Oznacza to, że na serwerze aplikacyjnym składającym raporty ta
    reguła — w odróżnieniu od trzech pozostałych z tej czwórki — nie
    trafia w automatyzację. Warto to powiedzieć wprost, bo wszystkie
    cztery wyglądają na pierwszy rzut oka tak samo.

    Nie dotyczy też pracy ludzi na serwerze terminalowym. Użytkownik nie
    zauważy niczego, bo nic, czego używa, tą drogą nie chodzi.

    Trafienie tej reguły jest samo w sobie informacją i warto ją tak
    traktować. Jeśli mechanizm ją zgłosi, to albo na maszynie jest
    dodatek zbudowany w sposób, który należy obejrzeć, albo dzieje się
    coś, co należy obejrzeć tym bardziej.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    I leave the class "no disruption" here and hold it one of the few rules of this group whereat
    that may honestly be done - and not for nothing coming to mind.

    The ground is the same as in the setting forth of the guard. The setting of code into another's
    process is no act any right way of doing things built upon an office bundle performs.
    Additions, macros, joinings and the making of documents of themselves all do their work by
    mechanisms given out for it, and not by going into other programs' memory.

    That means that on a server of applications setting reports this rule - unlike the three others
    of this four - does not strike the automation. It is worth saying outright, all four looking at
    first sight the same.

    Neither does it bear on people's work on a terminal server. The user will mark nothing, nothing
    they use going by that road.

    A striking of this rule is of itself a tiding and is worth taking for one. If the mechanism
    reports it, then either there is on the machine an addition built in a way that ought to be
    looked at, or something is happening that ought to be looked at the more.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - macros-and-documents
  what_breaks:
    pl:
      - Brak znanych przypadków, w których prawidłowe rozwiązanie wymagałoby tej czynności
      - Automatyzacja składania dokumentów na serwerze aplikacyjnym nie idzie tą drogą i nie zostanie trafiona
      - Praca ludzi na serwerze terminalowym pozostaje bez zmian, bo nic używanego tą drogą nie chodzi
      - Trafienie tej reguły jest samo w sobie informacją wartą obejrzenia
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - No known cases wherein a right way of doing things would take this act
      - The setting of documents of itself on a server of applications goes not by this road and is not struck
      - People's work on a terminal server stays unaltered, nothing used going by that road
      - A striking of this rule is of itself a tiding worth looking at
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Jedna z niewielu reguł w tej grupie, przy której nie trzeba ważyć
    zamiaru: wstawienie kodu do cudzego procesu przez edytor tekstu nie
    bywa prawidłowe nigdy.

    Z tego powodu — w odróżnieniu od trzech pozostałych reguł biurowych —
    ta nie trafia w automatyzację składania raportów po stronie
    serwera. Wszystkie cztery wyglądają na pierwszy rzut oka tak samo
    i warto tę różnicę mieć zapisaną.

    Kategoria obniżona, bo na serwerze pakietu biurowego zwykle nie ma.
    Klasa „bez uciążliwości" jest tu oceną, nie brakiem pomysłu na
    przeciwwskazanie.
  en: |
    One of the few rules of this group at which no intent need be weighed - the setting of code
    into another's process by a writer of text is never right.

    For that ground - unlike the three other office rules - this one does not strike the setting of
    reports of itself on the server's side. All four look at first sight the same and it is worth
    having that difference written down.

    The category is lowered, a server mostly having no office bundle. The class "no disruption" is
    here a reckoning and no want of a thought about what might speak against it.
