id: win2016-lock-pages-in-memory-none

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Blokowanie stron w pamięci nieprzyznane nikomu
    en: Locking pages in memory granted to nobody
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy uprawnienie do blokowania stron w pamięci nie zostało
    przyznane żadnemu kontu ani żadnej grupie.

    Uprawnienie pozwala procesowi zażądać, żeby jego dane pozostały w pamięci
    fizycznej i nigdy nie trafiły do pliku wymiany. Sam zamiar bywa uzasadniony:
    robią tak serwery baz danych, którym zapis do pliku wymiany psuje
    przewidywalność czasu odpowiedzi.

    Ryzyko nie leży w samym zamiarze, tylko w tym, że pamięć fizyczna jest
    zasobem wspólnym i skończonym. Proces, który zablokuje jej dużo, odbiera ją
    całej reszcie systemu — a reszta systemu nie ma jak się temu sprzeciwić.
    Maszyna zaczyna wtedy zwalniać albo zatrzymywać usługi, a przyczyna nie jest
    widoczna w żadnym zwykłym mierniku.

    Kategoria średnia i warto to nazwać uczciwie. To nie jest droga do
    przejęcia maszyny ani do poświadczeń. To jest sposób na jej unieruchomienie
    i na utrudnienie diagnozy.

    Na serwerze 2016 punkt ma jeszcze jeden wymiar. Zablokowana pamięć nie trafia
    do zrzutu awaryjnego w sposób przewidywalny, więc uprawnienie to bywa
    używane po to, żeby zawartość pamięci procesu nie znalazła się w zrzucie
    zbieranym przy awarii.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    wyczerpanie pamięci fizycznej maszyny w sposób, którego zwykłe narzędzia nie
    pokazują jako przyczyny.
  en: |
    The item checks that the right to lock pages in memory has been granted to no
    account and no group.

    The right lets a process demand that its data stay in physical memory and never
    reach the page file. The intent itself is sometimes sound: database servers do
    this, since writing to the page file spoils the predictability of their
    response times.

    The risk lies not in the intent but in physical memory being a shared and
    finite resource. A process that locks a lot of it takes it from the rest of the
    system - and the rest of the system has no way to object. The machine then
    begins to slow or to stop services, and the cause is visible in no ordinary
    measure.

    The category is medium and that is worth stating honestly. This is no road to
    taking the machine or to credentials. It is a way to bring it to a standstill
    and to make diagnosis harder.

    On Server 2016 the item has one further dimension. Locked memory does not reach
    a crash dump predictably, so this right is sometimes used precisely so that a
    process's memory does not end up in the dump collected on a failure.

    What an attacker gains while the item goes unmet: a way to exhaust the
    machine's physical memory that ordinary tools do not show as the cause.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo to jedno z nielicznych uprawnień tej grupy,
    które bywa nadane celowo i z dobrego powodu.

    Najczęstszy przypadek to serwer bazy danych ustawiony na trzymanie stron
    w pamięci. Jest to zalecenie producenta, spotykane w instrukcjach
    strojenia, i konto usługi bazy danych bywa na tej liście świadomie.

    Skutek odebrania uprawnienia takiemu kontu zależy od konfiguracji. Baza
    zwykle wstanie, ale zacznie korzystać z pliku wymiany tam, gdzie wcześniej
    nie korzystała — i objawi się to nie błędem, tylko wydłużeniem czasu
    odpowiedzi. Jest to więc zmiana, którą łatwo wprowadzić i trudno powiązać
    ze skutkiem tydzień później.

    Sprawdzenie sprowadza się do jednego pytania: czy wpis na liście należy do
    bazy danych albo do maszyny wirtualnej, czy do czegoś, czego nikt nie
    rozpoznaje. Drugi przypadek jest ustaleniem audytu.

    Czego to nie psuje: pracy usług, pliku wymiany, zrzutów awaryjnych ani
    wydajności maszyny, na której lista jest pusta.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because this is one of the few rights in this
    group that is sometimes granted deliberately and for a good reason.

    The commonest case is a database server set to keep its pages in memory. That
    is a vendor recommendation, found in tuning instructions, and the database
    service's account is sometimes on this list deliberately.

    The effect of taking the right from such an account depends on the
    configuration. The database will usually start, but will begin using the page
    file where it did not before - and that shows not as an error but as longer
    response times. It is therefore a change easy to make and hard to connect with
    its effect a week later.

    The check comes down to one question: does the entry on the list belong to a
    database or a virtual machine, or to something nobody recognises. The second
    case is a finding of the audit.

    What this does not break: services' work, the page file, crash dumps, or the
    performance of a machine whose list is empty.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - virtualization-and-containers
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Serwer bazy danych ustawiony na trzymanie stron w pamięci zaczyna korzystać z pliku wymiany
      - Skutek objawia się wydłużeniem czasu odpowiedzi, a nie błędem, więc trudno powiązać go ze zmianą
      - Maszyny wirtualne z przypiętą pamięcią tracą możliwość jej zablokowania
      - Praca usług, plik wymiany i zrzuty awaryjne działają bez zmian na maszynie z pustą listą
    en:
      - A database server set to keep its pages in memory starts using the page file
      - The effect shows as longer response times rather than an error, so it is hard to connect with the change
      - Virtual machines with pinned memory lose the ability to lock it
      - Services, the page file and crash dumps work unchanged on a machine whose list is empty
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje serwer bazy danych albo host wirtualizacji, którego instrukcja strojenia wymaga tego uprawnienia
      - Nie ustalono, do czego należy wpis obecny na liście
    en:
      - A database server or a virtualisation host whose tuning instructions require this right runs on the machine
      - It has not been established what the entry present on the list belongs to
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeLockMemoryPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeLockMemoryPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeLockMemoryPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list is emptied. Physical memory is shared and finite, so a process that
    # locks a lot of it takes it from everything else - and the machine slows for a
    # reason no ordinary measure shows.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeLockMemoryPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeLockMemoryPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/lock-pages-in-memory

notes:
  pl: |
    To jest reguła, przy której odpuszczenie punktu bywa decyzją poprawną.
    Serwer bazy danych z zaleceniem producenta jest dokładnie tym przypadkiem,
    dla którego istnieje trzeci status raportu: ryzyko zaakceptowane.

    Uprawnienie nie daje dostępu do cudzych danych ani do poświadczeń.
    Kategoria średnia oddaje to wprost — punkt chroni dostępność maszyny,
    a nie jej tajemnice.

    Domyślnie lista jest pusta na każdej roli, więc wynik niezgodny zawsze
    oznacza, że ktoś coś tu dopisał świadomie.
  en: |
    This is a rule where letting the item go is sometimes the right decision. A
    database server with a vendor recommendation is exactly the case the report's
    third status exists for: risk accepted.

    The right gives no access to other people's data or to credentials. The medium
    category says so outright - the item protects the machine's availability rather
    than its secrets.

    The list is empty by default on every role, so a non-compliant result always
    means somebody added something here deliberately.
