id: win2025-winrm-client-basic-auth-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management
  title:
    pl: Uwierzytelnianie podstawowe klienta zarządzania zdalnego wyłączone
    en: Basic authentication for the remote management client disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi zarządzania zdalnego posługiwania się
    uwierzytelnianiem podstawowym, gdy to on łączy się z inną maszyną.

    Punkt jest bliźniakiem ustawienia po stronie usługi i opisuje tę
    samą rzecz z drugiego końca. Tamto mówi, czego serwer nie przyjmie
    od łączących się. To mówi, czego serwerowi nie wolno wysłać, gdy
    sam się łączy.

    Rozróżnienie to nie jest formalne. Serwer jest nie tylko maszyną,
    do której ktoś sięga — jest też maszyną, która sięga dalej.
    Zarządzanie zbiorcze, zadania obchodzące wszystkie hosty, skrypty
    inwentaryzujące, wdrożenia — wszystko to wychodzi z jakiejś maszyny,
    a tą maszyną zwykle jest serwer.

    Zysk napastnika jest tu inny niż po stronie usługi i warto go nazwać
    osobno. Klient wysyłający hasło uwierzytelnianiem podstawowym wyśle
    je do maszyny, z którą właśnie rozmawia — także wtedy, gdy nie jest
    to ta maszyna, o którą chodziło. Kto podstawi się pod cel połączenia,
    dostaje hasło bez łamania czegokolwiek. Klient nie sprawdza przy tym
    tożsamości drugiej strony, bo uwierzytelnianie podstawowe jest
    jednostronne.

    Na serwerze pełniącym rolę maszyny zarządzającej hasło to jest
    zwykle jednym poświadczeniem do wielu hostów. Jedno przechwycenie
    otwiera nie jedną maszynę, tylko całą listę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wyłudzenia hasła administracyjnego przez podstawienie się
    pod maszynę, z którą ten serwer chciał się połączyć.
  en: |
    The setting forbids the remote management client to use basic authentication when it is the one
    connecting with another machine.

    The item is the twin of the setting at the service's side and describes the same thing from the
    other end. That one says what the server will not take from those connecting. This one says
    what the server may not send when it connects itself.

    The telling apart is not formal. A server is not only a machine somebody reaches for - it is
    also a machine that reaches further. Managing in the gross, jobs going round all the hosts,
    scripts taking stock, rollings out - all of that goes out of some machine, and that machine is
    usually a server.

    The attacker's gain is here other than at the service's side and is worth naming apart. A
    client sending a password by basic authentication will send it to the machine it is just then
    speaking with - also where that is not the machine meant. Whoever puts themselves in the place
    of the connection's aim gets the password with nothing broken. The client does not check the
    other side's name withal, basic authentication being one-sided.

    On a server holding the part of a managing machine that password is usually one credential to
    many hosts. One catching opens not one machine but a whole list.

    What an attacker gains while the item goes unmet: the means of drawing out an administrative
    password by putting themselves in the place of the machine this server meant to connect with.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy z tego serwera zarządza się maszynami,
    które innego mechanizmu nie obsługują.

    Przypadek pierwszy to maszyny spoza domeny — w strefie
    zdemilitaryzowanej, u klienta, w osobnym środowisku testowym.
    Połączenie do nich bywa zestawiane kontem lokalnym
    z uwierzytelnianiem podstawowym, bo mechanizmu domenowego tam nie
    ma. Po zmianie takie połączenie przestanie być nawiązywane.

    Przypadek drugi to urządzenia i usługi mówiące protokołem
    zarządzania, ale niebędące Windowsem: obudowy serwerowe, macierze,
    oprogramowanie zarządzające trzeciej strony. Ich implementacja
    zwykle kończy się na uwierzytelnianiu podstawowym.

    Objaw jest ten sam co po stronie usługi i tak samo mylący:
    połączenie kończy się odmową uwierzytelnienia, choć hasło jest
    poprawne. Ponieważ skrypt zwykle nie mówi, jakim mechanizmem
    próbował, szukanie zaczyna się od konta na maszynie docelowej,
    a nie od ustawienia na maszynie, z której skrypt wyszedł.

    Rzecz warta zapisania: właściwą drogą zastępczą nie jest
    przywrócenie tego ustawienia, tylko przejście na połączenie
    szyfrowane z uwierzytelnianiem certyfikatem albo dopisanie maszyny
    docelowej do listy zaufanych hostów. Jedno i drugie wymaga pracy
    przed zmianą, nie po niej.

    Punkt wdraża się razem z bliźniakiem po stronie usługi — to dwie
    strony tej samej rzeczy i rozpoznanie jest dla nich wspólne.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    trwające nie są przerywane.
  en: |
    One thing needs checking: whether machines are managed from this server which serve no other
    mechanism.

    The first case is machines outside a domain - in a demilitarised zone, at a client's, in a
    testing setting apart. The connection to them is at times set up by a local account with basic
    authentication, there being no domain mechanism there. After the change such a connection will
    stop being opened.

    The second case is devices and services speaking the protocol of management but not being
    Windows: server housings, arrays of disks, third parties' managing software. Their carrying out
    usually ends at basic authentication.

    The symptom is the same as at the service's side and as misleading: the connection ends in a
    refusal of authentication though the password is right. The script usually not saying by which
    mechanism it tried, the looking starts from the account on the aimed-at machine and not from a
    setting on the machine the script went out of.

    A thing worth writing down: the right road in its stead is not the setting back of this item
    but a going over to an encrypted connection with authentication by certificate, or the writing
    of the aimed-at machine into the list of trusted hosts. Either takes work before the change and
    not after it.

    The item is rolled out together with its twin at the service's side - they are two sides of one
    thing and the reconnaissance is common to them.

    The change comes into force straight away and is undone at once. Sessions already running are
    not broken.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - Połączenie do maszyny spoza domeny zestawiane kontem lokalnym przestanie być nawiązywane
      - Zarządzanie obudową serwerową albo macierzą mówiącą tym protokołem przestanie działać
      - Skrypt zgłasza odmowę uwierzytelnienia, choć hasło jest poprawne, i nie mówi, jakiego mechanizmu próbował
      - Szukanie przyczyny zaczyna się od konta na maszynie docelowej, a nie od ustawienia na tym serwerze
      - Sesje zarządzania już trwające nie są przerywane, warunek sprawdza się przy następnym połączeniu
    en:
      - A connection to a machine outside a domain set up by a local account will stop being opened
      - The managing of a server housing or an array of disks speaking this protocol will stop working
      - The script reports a refusal of authentication though the password is right, and does not say which mechanism it tried
      - The looking for the cause starts from the account on the aimed-at machine and not from a setting on this server
      - Sessions of management already running are not broken, the condition being checked at the next connecting
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tego serwera zarządza się maszynami spoza domeny, dla których nie przygotowano innej drogi
      - Skrypty z tego serwera sięgają do urządzeń obsługujących wyłącznie uwierzytelnianie podstawowe
    en:
      - Machines outside a domain are managed from this server and no other road was made ready for them
      - Scripts from this server reach for devices serving basic authentication alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      $name = 'AllowBasic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowBasic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBasic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Bliźniak ustawienia po stronie usługi, opisany z drugiego końca:
    tamto mówi, czego serwer nie przyjmie, to — czego serwerowi nie
    wolno wysłać, gdy sam się łączy.

    Uwierzytelnianie podstawowe jest jednostronne, więc klient nie
    sprawdza, z kim rozmawia. Kto podstawi się pod cel połączenia,
    dostaje hasło bez łamania czegokolwiek.

    Na maszynie zarządzającej jest to zwykle jedno poświadczenie do
    wielu hostów, więc jedno przechwycenie otwiera całą listę.

    Drogą zastępczą nie jest przywrócenie ustawienia, tylko połączenie
    szyfrowane z uwierzytelnianiem certyfikatem albo lista zaufanych
    hostów.
  en: |
    The twin of the setting at the service's side, described from the other end: that one says what
    the server will not take, this one what the server may not send when it connects itself.

    Basic authentication is one-sided, so the client does not check whom it speaks with. Whoever
    puts themselves in the place of the connection's aim gets the password with nothing broken.

    On a managing machine it is usually one credential to many hosts, so one catching opens the
    whole list.

    The road in its stead is not the setting back of the item but an encrypted connection with
    authentication by certificate, or a list of trusted hosts.
