id: win11-windows-tips-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Porady i wskazówki systemu wyłączone
    en: System tips and hints turned off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System wyświetla dymki z poradami — jak korzystać z nowej funkcji, co zmieniło
    się po aktualizacji, co jeszcze warto skonfigurować. Treść porad pobierana
    jest z sieci, więc nie jest to część systemu, tylko materiał dostarczany
    w trakcie pracy.

    Ryzyko jest niewielkie i sprowadza się do tego samego, co przy pozostałych
    treściach dostarczanych do interfejsu: użytkownik przyzwyczaja się do tego,
    że system sam z siebie wyświetla okna i zachęca do klikania. Im częściej to
    robi, tym mniej wyróżnia się okno, które systemem nie jest.

    Dodatkowo porady bywają skierowane na funkcje, których organizacja świadomie
    nie używa — i podpowiadają użytkownikowi, żeby je włączył.
  en: |
    The system displays bubbles with tips - how to use a new feature, what changed
    after an update, what else is worth setting up. The text of the tips is
    fetched from the network, so it is not part of the system but material
    delivered during work.

    The risk is small and comes down to the same thing as with the other content
    delivered into the interface: the user gets used to the system displaying
    windows and inviting clicks of its own accord. The more often it does so, the
    less a window that is not the system stands out.

    On top of that, tips are sometimes aimed at features the organisation
    deliberately does not use - and suggest the user turn them on.

disruption_description:
  pl: |
    Nic nie przestaje działać. Znikają dymki z poradami.

    Skutek uboczny wart odnotowania jest taki, że użytkownik przestaje dostawać
    informację o zmianach wprowadzonych przez aktualizację. Tam, gdzie nikt
    o tych zmianach nie uprzedza inaczej, znika jedyne źródło — i pierwsze
    spotkanie ze zmienionym interfejsem następuje bez ostrzeżenia. Jest to
    argument za tym, żeby o większych zmianach uprzedzać samodzielnie, a nie
    za tym, żeby punkt odpuścić.

    Pomoc systemowa, wyszukiwanie i wszystkie funkcje działają bez zmian.
    Nie ma restartu ani wylogowania.
  en: |
    Nothing stops working. The tip bubbles disappear.

    A side effect worth noting is that the user stops being told about changes an
    update has brought. Where nobody warns about those changes otherwise, the only
    source disappears - and the first encounter with a changed interface comes
    without warning. That is an argument for announcing larger changes yourself,
    not an argument for passing the item over.

    System help, search and every feature work unchanged. There is no restart and
    no sign-out.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Dymki z poradami dotyczącymi nowych funkcji przestaną się pojawiać
      - Zniknie jedyne źródło, z którego użytkownik dowiadywał się o zmianach po aktualizacji
    en:
      - Tip bubbles about new features stop appearing
      - The only source telling the user about changes after an update disappears
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Użytkownicy nie są uprzedzani o zmianach w interfejsie w żaden inny sposób
    en:
      - Users are not warned about interface changes in any other way
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableSoftLanding'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableSoftLanding'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSoftLanding' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt jest w benchmarku na drugim poziomie i zgadza się to z naszą oceną —
    sam z siebie niczego nie zamyka. Wdraża się go dlatego, że kosztuje zero
    i domyka rodzinę ustawień, w której pozostałe mają realne znaczenie.

    Warto pamiętać o odwrotnej stronie: to ostatni kanał, którym użytkownik
    dowiadywał się o zmianach po aktualizacji. Po wdrożeniu wszystkich trzech
    reguł tej rodziny interfejs przestaje cokolwiek tłumaczyć sam z siebie,
    więc tłumaczenie przechodzi na organizację.
  en: |
    The benchmark places this item at the second level and that matches our
    assessment - on its own it closes nothing. It is applied because it costs
    nothing and completes a family of settings where the others matter in earnest.

    Worth remembering the other side: it is the last channel through which the
    user learnt about changes after an update. Once all three rules in this family
    are applied, the interface stops explaining anything of its own accord, so the
    explaining passes to the organisation.
