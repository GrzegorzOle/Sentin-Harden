id: win2025-linux-subsystem-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa podsystemu obcego systemu operacyjnego wyłączona
    en: The service of the foreign operating system subsystem disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę obsługującą podsystem obcego systemu
    operacyjnego — warstwę pozwalającą uruchamiać na tej maszynie
    dystrybucje i programy napisane dla innego systemu.

    Zostawiam kategorię wysoką i chcę wyłożyć, na czym polega rzecz,
    bo nie jest nią sama obecność drugiego systemu.

    Podsystem ten ma własny menedżer pakietów, własny zestaw narzędzi
    i własny widok na dyski gospodarza. Znaczy to, że wewnątrz niego
    można pobrać, zbudować i uruchomić oprogramowanie, nie dotykając
    żadnego z mechanizmów, którymi pilnuje się oprogramowania po stronie
    gospodarza: ani kontroli instalacji, ani list dozwolonych aplikacji,
    ani inwentaryzacji, która wypisuje, co na maszynie stoi.

    Druga połowa sprawy dotyczy obserwacji. Procesy i pliki wewnątrz
    podsystemu nie są widziane przez narzędzia gospodarza tak samo jak
    procesy i pliki gospodarza. Nie twierdzę, że są niewidoczne — to
    zależy od produktu i jego wersji — ale twierdzę, że jest to osobna
    warstwa, o którą trzeba zapytać osobno. Warstwa, która ma dostęp do
    plików maszyny i której nikt nie sprawdził, jest dokładnie tym
    miejscem, w którym wygodnie jest coś zostawić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: środowisko
    wykonawcze z dostępem do dysków maszyny, z własnym sposobem
    pobierania i uruchamiania programów, poza mechanizmami kontroli
    i obserwacji ustawionymi dla gospodarza.
  en: |
    The item switches off the service that backs the under-system of a foreign working system - the
    layer letting spreads and programs written for another system be run upon that machine.

    I leave the category high and would set out wherein the thing lies, it being not the mere being of
    a second system.

    That under-system has a ruler of bundles of its own, a set of tools of its own and a sight of its
    own upon the host's disks. That means that within it software may be drawn down, built and run
    without a touching of any of the workings whereby software is watched on the host's side -
    neither the warding of installing, nor the lists of allowed applications, nor the taking of stock
    that writes out what stands upon the machine.

    The other half of the matter bears upon watching. The workings and the files within the
    under-system are not seen by the host's tools in the same way as the host's own workings and
    files. I say not that they are unseen - that hangs upon the product and its make - but I do say
    that it is a layer of its own, to be asked after on its own. A layer that has a reach to the
    machine's files and that nobody has looked to is just the stead wherein it is handy to leave
    something.

    What an attacker gains while the item goes unmet - a setting for the running of things with a
    reach to the machine's disks, with a way of its own of drawing down and running programs, outside
    the workings of warding and of watching set for the host.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i jest to, w tej grupie
    reguł, jedyny punkt, przy którym tak robię — reszta dotyczy rzeczy,
    których serwer nie ma po co mieć. Ta jest wyjątkiem i dlatego pisze
    się ją inaczej.

    Podsystem ten nie trafia na serwer przypadkiem. Nie instaluje się sam
    i nie przychodzi razem z rolą. Jeżeli działa, to znaczy, że ktoś
    świadomie go włączył, a skoro włączył, to zwykle po coś: agent
    budowania, potok wdrożeniowy, przetwarzanie danych narzędziami
    napisanymi dla tamtego systemu, zestaw narzędzi administracyjnych,
    do których ktoś przywykł.

    Skutek zatrzymania jest natychmiastowy i nieodwracalny w części,
    która boli najbardziej. Zatrzymanie usługi kończy wszystkie działające
    dystrybucje naraz, a praca niezapisana wewnątrz nich przepada — nie
    jest to zamknięcie z prośbą o zapisanie, tylko zerwanie. Zadanie
    budowania trwające w tej chwili kończy się niepowodzeniem, a proces
    przetwarzania danych przerywa się w połowie.

    Tam, gdzie podsystem jest używany, właściwym wynikiem pracy z tą
    regułą jest zapisany wyjątek z uzasadnieniem i datą przeglądu.
    Zabezpieczenia stawia się wtedy wokół niego — kontrolą tego, co
    wewnątrz się instaluje, i objęciem go obserwacją — a nie przez
    wyłączenie warstwy, na której coś stoi.

    Sprawdzenie jest krótkie i jednoznaczne: wypisz zainstalowane
    dystrybucje. Lista pusta znaczy, że usługa działa bez powodu i zmiana
    jest czysta.

    Zmiana cofa się natychmiast, ale uruchomione wcześniej dystrybucje
    trzeba wystartować od nowa.
  en: |
    I leave the class "needs a witting rolling out", and it is in this band of rules the one item
    whereat I do so - the rest bear upon things a server has no cause to have. This one is the
    outtake, and therefore it is written otherwise.

    That under-system comes onto a server by no hap. It installs not itself and comes not along with a
    role. If it work, that means somebody wittingly switched it on, and having switched it on they
    mostly did so for something - an agent of building, a pipe of rolling out, the working of data by
    tools written for that other system, a set of tools of ruling somebody has grown used to.

    The outcome of the stopping is at once, and in the part that hurts the most it may not be undone.
    The stopping of the service ends every running spread at once, and the work unsaved within them is
    lost - it is no shutting with a bidding to save but a breaking off. A task of building lasting at
    that hour ends in failure, and a working of data breaks off in the middle.

    Where the under-system is used, the right outcome of the work with this rule is a written-down
    exception with a standing by it and a day of looking over. The warding is then set about it - by
    a watching of what is installed within and by the taking of it into the watching - and not by the
    switching off of the layer whereon something stands.

    The checking is short and of one meaning - write out the installed spreads. An empty list means
    the service works without ground and the change is clean.

    The change is undone at once, but the spreads that were running must be started anew.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Zatrzymanie usługi kończy wszystkie działające dystrybucje naraz, bez prośby o zapisanie pracy
      - Praca niezapisana wewnątrz dystrybucji przepada i nie da się jej odzyskać
      - Zadanie budowania trwające w tej chwili kończy się niepowodzeniem
      - Proces przetwarzania danych narzędziami tamtego systemu przerywa się w połowie
      - Po cofnięciu zmiany dystrybucje trzeba wystartować od nowa
    en:
      - The stopping of the service ends every running spread at once, with no bidding to save the work
      - The work unsaved within the spreads is lost and may not be won back
      - A task of building lasting at that hour ends in failure
      - A working of data by the tools of that other system breaks off in the middle
      - After the undoing of the change the spreads must be started anew
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie zainstalowane są dystrybucje podsystemu i cokolwiek z nich korzysta
      - Maszyna jest agentem budowania albo przetwarza dane narzędziami napisanymi dla tamtego systemu
    en:
      - Upon the machine there are installed spreads of the under-system and anything draws upon them
      - The machine is an agent of building or works data by tools written for that other system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LxssManager'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # This service comes from an optional component. Where the component was
        # never added, a bare key without a startup value is left behind - that
        # is an absent service, not an unreadable one.
        if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LxssManager'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service ends every running distribution of the subsystem;
    # work not saved in them will be lost. List the installed distributions
    # first - an empty list means nothing here depends on it.
    Stop-Service -Name 'LxssManager' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'LxssManager' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'LxssManager' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/wsl/

notes:
  pl: |
    Rzecz nie polega na samej obecności drugiego systemu. Podsystem ma
    własny menedżer pakietów i własny widok na dyski gospodarza, więc
    można w nim pobrać, zbudować i uruchomić oprogramowanie, nie dotykając
    kontroli instalacji, list dozwolonych aplikacji ani inwentaryzacji.

    Druga połowa dotyczy obserwacji: nie twierdzę, że procesy wewnątrz są
    niewidoczne — to zależy od produktu — ale jest to osobna warstwa,
    o którą trzeba zapytać osobno.

    Jedyny punkt w tej grupie z klasą „świadome wdrożenie". Podsystem nie
    trafia na serwer przypadkiem: jeżeli działa, ktoś go świadomie
    włączył, zwykle po coś. Zatrzymanie kończy wszystkie dystrybucje
    naraz i nie jest to zamknięcie z prośbą o zapisanie, tylko zerwanie.
  en: |
    The thing lies not in the mere being of a second system. The under-system has a ruler of bundles
    of its own and a sight of its own upon the host's disks, so within it software may be drawn down,
    built and run without a touching of the warding of installing, of the lists of allowed
    applications or of the taking of stock.

    The other half bears upon watching - I say not that the workings within are unseen, that hanging
    upon the product, but it is a layer of its own, to be asked after on its own.

    The one item in this band with the class of a witting rolling out. The under-system comes onto a
    server by no hap - if it work, somebody wittingly switched it on, mostly for something. The
    stopping ends every spread at once, and it is no shutting with a bidding to save but a breaking
    off.
