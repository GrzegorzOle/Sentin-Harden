id: win10-ink-workspace-suggested-apps-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Ink Workspace
  title:
    pl: Podpowiadanie aplikacji w obszarze pisma odręcznego wyłączone
    en: Suggestion of applications in the handwriting workspace switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Obszar roboczy pisma odręcznego podpowiada aplikacje ze sklepu, dobrane do
    pracy piórem. Podpowiedź pobierana jest z zewnątrz i prowadzi wprost do
    instalacji.

    Wartość tej zasady jest porządkowa, nie obronna. Chodzi o to, żeby narzędzie
    pracy nie było zarazem miejscem, w którym pojawiają się propozycje
    oprogramowania spoza zestawu przyjętego w organizacji — i żeby lista aplikacji
    na stanowisku wynikała z decyzji, a nie z podpowiedzi.

    Przy okazji znika jeden kanał wychodzący, bo podpowiedzi pobierane są z sieci.
  en: |
    The handwriting workspace suggests applications from the store, picked for work
    with a pen. The suggestion is fetched from outside and leads straight to
    installing something.

    The value of this rule is one of good order rather than defence. The point is
    that a working tool should not also be a place where proposals of software from
    outside the organisation s accepted set appear - and that the list of
    applications on a station should follow from a decision rather than from a
    suggestion.

    One outgoing channel disappears along the way, since the suggestions are
    fetched over the network.

disruption_description:
  pl: |
    Zmiana jest niewidoczna wszędzie tam, gdzie nikt obszaru roboczego nie otwiera,
    a tam, gdzie się go używa, usuwa wyłącznie sekcję z podpowiedziami. Notatnik i
    narzędzie do zrzutów zostają.

    Nie ma przerwy, nie ma restartu, cofnięcie jest natychmiastowe. Jest to
    typowa pozycja do zastosowania hurtem razem z resztą punktów porządkowych.
  en: |
    The change is invisible wherever nobody opens the workspace, and where it is
    used it removes only the section with suggestions. The notepad and the capture
    tool stay.

    There is no interruption, no restart, and reversing it is immediate. It is a
    typical item to apply in bulk along with the rest of the good-order points.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Sekcja z podpowiadanymi aplikacjami zniknie z obszaru roboczego pisma odręcznego
      - Droga do sklepu prowadząca wprost z narzędzia do pisania piórem przestanie być dostępna
      - Notatnik, narzędzie do zrzutów ekranu, pisanie piórem i praca użytkownika pozostają bez zmian
    en:
      - The section with suggested applications vanishes from the handwriting workspace
      - The road to the store leading straight from the pen tool stops being available
      - The notepad, the screen capture tool, writing with a pen and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska, na których instalowanie narzędzi do pracy piórem ze sklepu jest przyjętą drogą
    en:
      - Stations where installing pen tools from the store is the accepted road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowSuggestedAppsInWindowsInkWorkspace'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    $name = 'AllowSuggestedAppsInWindowsInkWorkspace'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSuggestedAppsInWindowsInkWorkspace' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-windows-ink-workspace

notes:
  pl: |
    Wartość leży w tej samej gałęzi co dostępność obszaru roboczego z ekranu
    blokady i obie pozycje ocenia się razem. Wyłączenie podpowiedzi nie zamyka
    samego obszaru roboczego.
  en: |
    The value lies in the same branch as the availability of the workspace from the
    lock screen, and the two items are judged together. Switching the suggestions
    off does not shut the workspace itself.
