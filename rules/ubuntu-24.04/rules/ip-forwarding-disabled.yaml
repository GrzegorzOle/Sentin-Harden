id: ubuntu2404-ip-forwarding-disabled

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 3.3.1
  section: Network > Configure Network Kernel Parameters
  title:
    pl: Przekazywanie pakietów IP jest wyłączone
    en: Ensure ip forwarding is disabled
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Przy włączonym przekazywaniu pakietów serwer działa jak router: pakiety,
    które przyszły jednym interfejsem, a są adresowane gdzie indziej, wysyła
    dalej. Intruz w jednej sieci może wtedy przez ten serwer dotrzeć do
    drugiej, np. z sieci publicznej do sieci zarządzania albo do sieci
    kontenerów i maszyn wirtualnych.

    Punkt wymaga wartości 0 parametrów net.ipv4.ip_forward
    i net.ipv6.conf.all.forwarding. To wartości domyślne jądra, ale
    przekazywanie włączają programy, które same robią z serwera router dla
    kontenerów i maszyn wirtualnych, np. Docker, LXD i libvirt.
  en: |
    With packet forwarding turned on, the server works as a router: it sends
    on packets that came in on one interface but are addressed elsewhere. An
    intruder in one network can then reach another through this server, for
    example from a public network to a management network or to a network of
    containers and virtual machines.

    The item requires the value 0 for net.ipv4.ip_forward and
    net.ipv6.conf.all.forwarding. These are the kernel defaults, but
    forwarding is turned on by programs that make the server a router for
    containers and virtual machines themselves, such as Docker, LXD and
    libvirt.

disruption_description:
  pl: |
    Na serwerze bez kontenerów i maszyn wirtualnych nikt tego nie zauważy.
    Tam, gdzie działa Docker, LXD, Kubernetes albo maszyny wirtualne w sieci
    NAT, kontenery i maszyny od razu tracą dostęp do internetu i sieci
    lokalnej.
  en: |
    On a server without containers and virtual machines nobody will notice.
    Where Docker, LXD, Kubernetes or virtual machines in a NAT network run,
    the containers and machines lose access to the internet and the local
    network at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
  what_breaks:
    pl:
      - Kontenery Dockera i kontenery Podmana uruchamiane przez roota w sieciach typu bridge tracą dostęp do internetu i sieci lokalnej
      - Kontenery i maszyny LXD w sieci lxdbr0 oraz maszyny wirtualne libvirt w sieci NAT tracą dostęp do internetu i sieci lokalnej
      - Węzły Kubernetes, np. MicroK8s i k3s, przestają przekazywać ruch podów
      - Serwer pracujący jako router, brama VPN albo z regułami route zapory ufw przestaje przekazywać ruch
    en:
      - Docker containers and root Podman containers on bridge networks lose access to the internet and the local network
      - LXD containers and machines on the lxdbr0 network and libvirt virtual machines in a NAT network lose access to the internet and the local network
      - Kubernetes nodes, such as MicroK8s and k3s, stop forwarding pod traffic
      - A server working as a router, a VPN gateway or with ufw route rules stops forwarding traffic
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze działa Docker, LXD, Kubernetes albo Podman uruchamiany przez roota z kontenerami w sieciach typu bridge
      - Na serwerze działają maszyny wirtualne libvirt w sieci NAT
      - Serwer pracuje jako router albo brama VPN
    en:
      - Docker, LXD, Kubernetes, or Podman run by root with containers on bridge networks runs on the server
      - libvirt virtual machines in a NAT network run on the server
      - The server works as a router or VPN gateway
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    ufwpath() { sed -n 's/^[[:space:]]*IPT_SYSCTL=//p' /etc/default/ufw 2>/dev/null | tail -n 1 | tr -d "\"'"; }
    ufwconf() { u=$(ufwpath); if [ -n "$u" ] && [ -s "$u" ]; then cat "$u"; fi; }
    if [ ! -x /usr/lib/systemd/systemd-sysctl ] || [ ! -d /proc/sys/net/ipv4 ]; then echo CHECK_ERROR; exit 0; fi
    ok=""; bad=""
    while read -r k want dflt; do
      p=/proc/sys/$(printf '%s' "$k" | tr . /)
      n=${k#net.}
      if [ ! -r "$p" ]; then
        case "$k" in net.ipv6.*) if [ ! -d /proc/sys/net/ipv6 ]; then ok="$ok,$n=no-ipv6"; continue; fi ;; esac
        echo CHECK_ERROR; exit 0
      fi
      r=$(tr -s ' \t' ' ' < "$p")
      c=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null | awk -v k="$k" '
      /^[ \t]*[#;]/ || !/=/ { next }
      { l = $0; sub(/^[ \t]*-/, "", l); i = index(l, "=")
        n = substr(l, 1, i - 1); v = substr(l, i + 1)
        gsub(/^[ \t]+|[ \t]+$/, "", n); gsub(/^[ \t]+|[ \t]+$/, "", v); gsub("/", ".", n)
        gsub(/[ \t]+/, " ", v)
        if (n == k) c = v }
      END { print c }')
      if [ -z "$c" ] && [ "$dflt" = 1 ]; then c=default; fi
      uf=$(ufwconf | awk -v k="$k" '
      /^[ \t]*[#;]/ || !/=/ { next }
      { l = $0; sub(/^[ \t]*-/, "", l); i = index(l, "=")
        n = substr(l, 1, i - 1); v = substr(l, i + 1)
        gsub(/^[ \t]+|[ \t]+$/, "", n); gsub(/^[ \t]+|[ \t]+$/, "", v); gsub("/", ".", n)
        gsub(/[ \t]+/, " ", v)
        if (n == k) c = v }
      END { print c }')
      if [ "$r" = "$want" ] && { [ "$c" = "$want" ] || [ "$c" = default ]; } && { [ -z "$uf" ] || [ "$uf" = "$want" ]; }; then ok="$ok,$n=$r"
      else bad="$bad;$n:runtime=$r,config=${c:-none}${uf:+,ufw=$uf}"; fi
    done <<'EOF'
    net.ipv4.ip_forward 0 1
    net.ipv6.conf.all.forwarding 0 1
    EOF
    # Interfaces with their own value, for information only: the item checks all and default.
    ifs=""
    for spec in ; do
      d=${spec%%:*}; x=${spec#*:}; q=${x%%:*}; want=${x#*:}
      for p in /proc/sys/$d/*/$q; do
        [ -r "$p" ] || continue
        i=${p#/proc/sys/$d/}; i=${i%/$q}
        case "$i" in all|default|lo) continue ;; esac
        v=$(cat "$p")
        [ "$v" = "$want" ] || ifs="$ifs,${d#net/}/$i/$q=$v"
      done
    done
    [ -z "$ifs" ] || ifs=";interfaces:${ifs#,}"
    if [ -n "$bad" ]; then echo "NOT_OK:${bad#;}$ifs"; else echo "OK:${ok#,}$ifs"; fi
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
    ufwpath() { sed -n 's/^[[:space:]]*IPT_SYSCTL=//p' /etc/default/ufw 2>/dev/null | tail -n 1 | tr -d "\"'"; }
    ufwconf() { u=$(ufwpath); if [ -n "$u" ] && [ -s "$u" ]; then cat "$u"; fi; }
      f=/etc/sysctl.d/sentin-harden-forwarding.conf
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=sysctl-ub-1
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        for k in net.ipv4.ip_forward net.ipv6.conf.all.forwarding net.ipv4.conf.all.accept_redirects; do
          p=/proc/sys/$(printf '%s' "$k" | tr . /)
          if [ -r "$p" ]; then echo "rt $k $(tr -s ' \t' ' ' < "$p")"; fi
        done
        # Interface values are stored as paths, because interface names may contain dots.
        for spec in ; do
          d=${spec%%:*}; x=${spec#*:}; q=${x%%:*}
          for p in /proc/sys/$d/*/$q; do
            [ -r "$p" ] || continue
            case "$p" in */all/$q|*/default/$q) continue ;; esac
            echo "if ${p#/proc/sys/} $(cat "$p")"
          done
        done
        # Values the ufw sysctl file sets now, put back by the rollback.
        for k in net.ipv4.ip_forward net.ipv6.conf.all.forwarding; do
          c=$(ufwconf | awk -v k="$k" '
      /^[ \t]*[#;]/ || !/=/ { next }
      { l = $0; sub(/^[ \t]*-/, "", l); i = index(l, "=")
        n = substr(l, 1, i - 1); v = substr(l, i + 1)
        gsub(/^[ \t]+|[ \t]+$/, "", n); gsub(/^[ \t]+|[ \t]+$/, "", v); gsub("/", ".", n)
        gsub(/[ \t]+/, " ", v)
        if (n == k) c = v }
      END { print c }')
          if [ -n "$c" ]; then echo "uf $k $c"; fi
        done
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
    ufwpath() { sed -n 's/^[[:space:]]*IPT_SYSCTL=//p' /etc/default/ufw 2>/dev/null | tail -n 1 | tr -d "\"'"; }
    ufwconf() { u=$(ufwpath); if [ -n "$u" ] && [ -s "$u" ]; then cat "$u"; fi; }
    # Sets every active line of key $2 in the ufw file $1 to $3; other lines stay as they are.
    ufwset() {
      awk -v k="$2" -v w="$3" '
        /^[ \t]*[#;]/ || !/=/ { print; next }
        { l = $0; i = index(l, "="); n = substr(l, 1, i - 1); r = substr(l, i + 1); v = r
          gsub(/^[ \t]+|[ \t]+$/, "", n); sub(/^-/, "", n); gsub("/", ".", n); gsub(/^[ \t]+|[ \t]+$/, "", v)
          if (n == k && v != w) { match(r, /^[ \t]*/); print substr(l, 1, i + RLENGTH) w; next }
          print }' "$1" > "$1.sentin-harden.tmp"
      if cmp -s "$1" "$1.sentin-harden.tmp"; then rm -f "$1.sentin-harden.tmp"; return 0; fi
      cat "$1.sentin-harden.tmp" > "$1"; rm -f "$1.sentin-harden.tmp"
    }
      f=/etc/sysctl.d/sentin-harden-forwarding.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      command -v sysctl >/dev/null 2>&1 || { echo "sysctl is not installed" >&2; exit 1; }
      # Writing some keys makes the kernel reset others; those keep their value.
      keep=""
      for k in net.ipv4.conf.all.accept_redirects; do
        p=/proc/sys/$(printf '%s' "$k" | tr . /)
        if [ -r "$p" ]; then keep="$keep $k=$(cat "$p")"; fi
      done
      printf '%s\n' '# Sentin-Harden: ubuntu2404-ip-forwarding-disabled' 'net.ipv4.ip_forward = 0' '-net.ipv6.conf.all.forwarding = 0' > "$f"
      chmod 0644 "$f"
      # ufw applies its own file after the others each time it starts.
      u=$(ufwpath)
      if [ -n "$u" ] && [ -f "$u" ]; then
        for kv in net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0; do ufwset "$u" "${kv%%=*}" "${kv#*=}"; done
      fi
      for kv in net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0; do
        k=${kv%%=*}
        [ -e "/proc/sys/$(printf '%s' "$k" | tr . /)" ] || { echo "Skipped $k: IPv6 is disabled"; continue; }
        sysctl -q -w "$kv"
      done
      for kv in $keep; do sysctl -q -w "$kv"; done
      # The file covers interfaces added later; the existing ones are set here.
      for spec in ; do
        d=${spec%%:*}; x=${spec#*:}; q=${x%%:*}; want=${x#*:}
        for p in /proc/sys/$d/*/$q; do
          [ -e "$p" ] || continue
          case "$p" in */all/$q|*/default/$q) continue ;; esac
          # An interface can disappear meanwhile, e.g. a container's veth.
          printf '%s\n' "$want" 2>/dev/null > "$p" || [ ! -e "$p" ] || { echo "Cannot write $p" >&2; exit 1; }
        done
      done
      late=""
      for kv in net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0; do
        k=${kv%%=*}
        c=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null | awk -v k="$k" '
      /^[ \t]*[#;]/ || !/=/ { next }
      { l = $0; sub(/^[ \t]*-/, "", l); i = index(l, "=")
        n = substr(l, 1, i - 1); v = substr(l, i + 1)
        gsub(/^[ \t]+|[ \t]+$/, "", n); gsub(/^[ \t]+|[ \t]+$/, "", v); gsub("/", ".", n)
        gsub(/[ \t]+/, " ", v)
        if (n == k) c = v }
      END { print c }')
        [ "$c" = "${kv#*=}" ] || late="$late $k=$c"
        uf=$(ufwconf | awk -v k="$k" '
      /^[ \t]*[#;]/ || !/=/ { next }
      { l = $0; sub(/^[ \t]*-/, "", l); i = index(l, "=")
        n = substr(l, 1, i - 1); v = substr(l, i + 1)
        gsub(/^[ \t]+|[ \t]+$/, "", n); gsub(/^[ \t]+|[ \t]+$/, "", v); gsub("/", ".", n)
        gsub(/[ \t]+/, " ", v)
        if (n == k) c = v }
      END { print c }')
        [ -z "$uf" ] || [ "$uf" = "${kv#*=}" ] || late="$late $k=$uf(ufw)"
      done
      if [ -n "$late" ]; then
        echo "Another sysctl.d file is applied after $f and the next start will set:$late" >&2; exit 1
      fi
      echo "Set net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0 now and in $f"
    )

  rollback_command: |
    (
      set -e
    ufwpath() { sed -n 's/^[[:space:]]*IPT_SYSCTL=//p' /etc/default/ufw 2>/dev/null | tail -n 1 | tr -d "\"'"; }
    ufwconf() { u=$(ufwpath); if [ -n "$u" ] && [ -s "$u" ]; then cat "$u"; fi; }
    # Sets every active line of key $2 in the ufw file $1 to $3; other lines stay as they are.
    ufwset() {
      awk -v k="$2" -v w="$3" '
        /^[ \t]*[#;]/ || !/=/ { print; next }
        { l = $0; i = index(l, "="); n = substr(l, 1, i - 1); r = substr(l, i + 1); v = r
          gsub(/^[ \t]+|[ \t]+$/, "", n); sub(/^-/, "", n); gsub("/", ".", n); gsub(/^[ \t]+|[ \t]+$/, "", v)
          if (n == k && v != w) { match(r, /^[ \t]*/); print substr(l, 1, i + RLENGTH) w; next }
          print }' "$1" > "$1.sentin-harden.tmp"
      if cmp -s "$1" "$1.sentin-harden.tmp"; then rm -f "$1.sentin-harden.tmp"; return 0; fi
      cat "$1.sentin-harden.tmp" > "$1"; rm -f "$1.sentin-harden.tmp"
    }
      f=/etc/sysctl.d/sentin-harden-forwarding.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=sysctl-ub-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      existed=$(sed -n '2s/^existed=//p' "$b")
      case "$existed" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      grep -qx -- --- "$b" || { echo "Backup file is damaged: $b" >&2; exit 1; }
      rts=$(sed -n '3,/^---$/p' "$b" | sed '$d')
      while read -r t k v; do
        [ -n "$t$k$v" ] || continue
        bad=0
        case "$v" in ""|*[!0-9-]*) bad=1 ;; esac
        case "$t" in
          rt|uf) case " net.ipv4.ip_forward net.ipv6.conf.all.forwarding net.ipv4.conf.all.accept_redirects " in *" $k "*) ;; *) bad=1 ;; esac ;;
          if)
            known=0
            for spec in ; do
              d=${spec%%:*}; x=${spec#*:}; q=${x%%:*}
              case "$k" in "$d"/*/"$q") ;; *) continue ;; esac
              i=${k#"$d"/}; i=${i%/"$q"}
              case "$i" in ""|*/*|.|..|all|default) ;; *) known=1 ;; esac
            done
            [ "$known" = 1 ] || bad=1 ;;
          *) bad=1 ;;
        esac
        if [ "$bad" = 1 ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      done <<< "$rts"
      if [ "$existed" = 1 ]; then sed '1,/^---$/d' "$b" > "$f"; else rm -f "$f"; fi
      u=$(ufwpath)
      if [ -n "$u" ] && [ -f "$u" ]; then
        while read -r t k v; do
          [ "$t" = uf ] || continue
          ufwset "$u" "$k" "$v"
        done <<< "$rts"
      fi
      # The kept keys go after the others, because writing those can reset them.
      while read -r t k v; do
        [ "$t" = rt ] || continue
        case " net.ipv4.conf.all.accept_redirects " in *" $k "*) continue ;; esac
        sysctl -q -w "$k=$v"
      done <<< "$rts"
      while read -r t k v; do
        [ "$t" = rt ] || continue
        case " net.ipv4.conf.all.accept_redirects " in *" $k "*) sysctl -q -w "$k=$v" ;; esac
      done <<< "$rts"
      # Interfaces removed since the backup are skipped.
      while read -r t k v; do
        [ "$t" = if ] || continue
        if [ -e "/proc/sys/$k" ]; then printf '%s\n' "$v" > "/proc/sys/$k"; fi
      done <<< "$rts"
      echo "Restored the previous values and the previous state of $f"
    )

privileges: root
runnable: true

sources:
  - https://docs.kernel.org/networking/ip-sysctl.html
  - https://manpages.ubuntu.com/manpages/noble/man5/sysctl.d.5.html
  - https://manpages.ubuntu.com/manpages/noble/man8/ufw.8.html
  - https://docs.docker.com/engine/network/packet-filtering-firewalls/
  - https://documentation.ubuntu.com/lxd/en/latest/reference/network_bridge/

notes:
  pl: |
    Sprawdzenie porównuje dla każdego parametru wartość bieżącą z /proc/sys
    z wartością, którą ustawi następny start. Tę drugą wyznacza
    systemd-sysctl --cat-config, które wypisuje pliki z /usr/lib/sysctl.d,
    /run/sysctl.d i /etc/sysctl.d (także /etc/sysctl.conf przez dowiązanie
    99-sysctl.conf) w kolejności stosowania; liczy się ostatnie przypisanie.
    Brak wpisu oznacza wartość wbudowaną
    w jądro, czyli 0, i też spełnia punkt. Parametr IPv6 jest spełniony, gdy
    IPv6 wyłączono przy starcie jądra, a naprawa zapisuje go z minusem na
    początku, więc systemd-sysctl nie zgłasza wtedy błędu. Osobno sprawdzany jest plik zapory ufw wskazany w IPT_SYSCTL
    w /etc/default/ufw, zwykle /etc/ufw/sysctl.conf: parametr może w nim
    nie występować, a jeśli występuje, musi mieć wymaganą wartość. Wynik
    NOT_OK podaje wartości każdego parametru, który nie spełnia punktu,
    a wartość z pliku ufw jako ufw=.

    Naprawa zapisuje ustawienia w /etc/sysctl.d/sentin-harden-forwarding.conf
    i od razu je stosuje. Nazwa bez numeru na początku sortuje się po
    99-sysctl.conf, więc ustawienia wygrywają z pozostałymi plikami; jeśli
    mimo to inny plik nadpisuje wartość, naprawa kończy się błędem.
    Wycofanie przywraca poprzednią zawartość pliku i poprzednie wartości
    bieżące.

    Zapora ufw przy każdym uruchomieniu, także przy starcie systemu,
    stosuje swój plik poleceniem sysctl -p, więc jego wartości wygrywają
    z sysctl.d. Dlatego naprawa zmienia w nim wartości tych parametrów,
    które są tam ustawione inaczej, a wycofanie przywraca poprzednie. Plik
    jest sprawdzany także przy wyłączonej zaporze, bo zadziała po jej
    włączeniu, którego wymaga rozdział 4.

    Plik /etc/ufw/sysctl.conf ma zakomentowane linie przekazywania, które
    dokumentacja ufw każe odkomentować przy regułach route. Jeśli są
    aktywne, naprawa ustawia w nich 0.

    Docker, LXD i libvirt po uruchomieniu same włączają przekazywanie
    z powrotem, więc naprawa nie wyłączy go na stałe tam, gdzie działają,
    a sprawdzenie znów pokaże NOT_OK z wartością bieżącą 1. Kontenery
    Podmana uruchamiane bez roota mają własną sieć w przestrzeni
    użytkownika i nie potrzebują przekazywania.

    Zmiana net.ipv4.ip_forward ustawia w jądrze
    net.ipv4.conf.all.accept_redirects na wartość przeciwną. Naprawa
    i wycofanie zapamiętują ten parametr i przywracają go po zmianie, żeby
    nie włączyć przyjmowania przekierowań ICMP. Ponowne zastosowanie plików
    przy włączonym przekazywaniu, np. poleceniem sysctl --system po
    uruchomieniu Dockera, może jednak włączyć przyjmowanie przekierowań;
    pokaże to sprawdzenie punktu 3.3.5.
  en: |
    For each parameter, the check compares the current value from /proc/sys
    with the value the next start will set. The latter comes from
    systemd-sysctl --cat-config, which prints the files from
    /usr/lib/sysctl.d, /run/sysctl.d and /etc/sysctl.d (/etc/sysctl.conf
    included, through the 99-sysctl.conf link) in the order they are
    applied; the last assignment counts. No entry means the value built into
    the kernel, which is 0, and also meets the item. The IPv6 parameter is
    met when IPv6 was turned off at kernel start, and the remediation writes
    it with a leading minus, so systemd-sysctl reports no error then. The ufw firewall file
    named by IPT_SYSCTL in /etc/default/ufw, usually /etc/ufw/sysctl.conf,
    is checked separately: the parameter may be absent there, and if it is
    present it must have the required value. The NOT_OK result gives the
    values of every parameter that does not meet the item, the one from the
    ufw file as ufw=.

    The remediation writes the settings to
    /etc/sysctl.d/sentin-harden-forwarding.conf and applies them at once. A name
    without a leading number sorts after 99-sysctl.conf, so the settings win
    over the other files; if another file still overrides a value, the
    remediation ends with an error. Rollback restores the previous file
    content and the previous current values.

    Each time the ufw firewall starts, also at system start, it applies its
    file with sysctl -p, so its values win over sysctl.d. So the remediation
    changes the values of those parameters that are set differently there,
    and rollback restores the previous ones. The file is checked also while
    the firewall is off, because it takes effect once the firewall is turned
    on, which chapter 4 requires.

    The /etc/ufw/sysctl.conf file has commented-out forwarding lines, which
    the ufw documentation says to uncomment for route rules. If they are
    active, the remediation sets 0 in them.

    Docker, LXD and libvirt turn forwarding back on themselves when they
    start, so the remediation does not turn it off for good where they run,
    and the check shows NOT_OK again with the current value 1. Podman
    containers run without root have their own network in user space and do
    not need forwarding.

    Changing net.ipv4.ip_forward makes the kernel set
    net.ipv4.conf.all.accept_redirects to the opposite value. The
    remediation and rollback record that parameter and restore it after the
    change, so that accepting ICMP redirects is not turned on. Applying the
    files again while forwarding is on, for example with sysctl --system
    after Docker started, can still turn on accepting redirects; the check
    of item 3.3.5 shows it.
