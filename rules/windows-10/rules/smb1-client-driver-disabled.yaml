id: win10-smb1-client-driver-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Sterownik klienta SMB w wersji pierwszej wyłączony
    en: The first-version SMB client driver switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zatrzymuje sterownik, dzięki któremu maszyna umie sięgnąć po
    udział pierwszą wersją protokołu udostępniania plików.

    Wersja ta pochodzi z czasów, gdy sieć lokalną uważano za zaufaną
    z definicji. Nie potwierdza tożsamości serwera, nie chroni przesyłanych
    danych przed zmianą po drodze i nie ma w sobie miejsca, w które dałoby
    się takie mechanizmy dołożyć.

    Sterownik klienta jest tą częścią, która rozmowę taką w ogóle umożliwia.
    Dopóki działa, wystarczy doprowadzić do tego, żeby maszyna spróbowała
    połączyć się z udziałem — a wywołuje się to zdalnie, dokumentem
    odwołującym się do ścieżki sieciowej albo skrótem. Maszyna sięga wtedy
    sama, a po drugiej stronie odpowiada, kto zdąży pierwszy.

    Kategoria krytyczna bierze się stąd, że skutkiem nie jest podglądnięcie
    danych, tylko przyjęcie treści od maszyny obcej jako pochodzącej
    z zasobu zaufanego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zmuszenia maszyny do połączenia protokołem, w którym nie da się
    sprawdzić, z kim się rozmawia.
  en: |
    The setting stops the driver by which the machine is able to reach a share over the first version of the
    file-sharing protocol.

    That version comes of a time when a local network was held trusted by definition. It does not confirm a
    server's identity, does not guard data sent from being changed on the way, and has in it no place where such
    mechanisms could be put.

    The client driver is the part that makes such a conversation possible at all. While it runs, it is enough to
    bring the machine to try joining a share - and that is called forth from afar, by a document pointing at a
    network path or by a shortcut. The machine then reaches out of itself, and on the other side answers
    whoever is quickest.

    The critical category comes of the consequence being not the overlooking of data but the taking in of
    content from a strange machine as though it came of a trusted resource.

    What an attacker gains while the item goes unmet: the means of making the machine join over a protocol in
    which it cannot be checked whom one is speaking with.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, po jakie zasoby
    ta maszyna sięga.

    Na stanowisku roboczym sięgającym wyłącznie po udziały serwerowe
    i domowe zmiana jest niewidoczna. Nowsze wersje protokołu obsługują
    wszystko, co obsługiwała pierwsza, i są używane domyślnie od lat.

    Kłopot zaczyna się przy zasobach wystawianych przez sprzęt. Macierze
    dyskowe wycofane ze wsparcia, rejestratory, sterowniki przemysłowe
    i starsze urządzenia wielofunkcyjne bywają zatrzymane na wersji
    pierwszej, bo nikt nie wydał dla nich nowego oprogramowania. Po zmianie
    maszyna przestanie się z nimi łączyć, a komunikat będzie mówił
    o ścieżce niedostępnej, nie o protokole.

    Odnotowuję przerwę: zmiana wchodzi dopiero po restarcie maszyny.
    Do tego czasu ponowny audyt pokaże wynik zgodny, a zachowanie będzie
    jeszcze stare.

    Czego to nie psuje: udziałów obsługiwanych nowszymi wersjami protokołu,
    logowania, kont domenowych, drukowania, aplikacji, sieci.
  en: |
    The class is "needs review", and the review touches what resources this machine reaches for.

    At a workplace reaching only for shares on servers and at home the change is unseen. The newer versions of
    the protocol serve everything the first served, and have been used by default for years.

    The trouble begins at resources set out by gear. Disk arrays out of support, recorders, industrial
    controllers and older multifunction devices are at times stopped at the first version, nobody having issued
    new software for them. After the change the machine will cease joining them, and the message will speak of
    an unreachable path, not of a protocol.

    I set down the break: the change takes hold only after a restart of the machine. Until then a fresh audit
    will show a compliant outcome while the behaviour is still the old one.

    What this does not break: shares served over newer versions of the protocol, logging on, domain accounts,
    printing, applications, or the network.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - legacy-authentication
  what_breaks:
    pl:
      - Połączenia z udziałami obsługiwanymi wyłącznie pierwszą wersją protokołu przestają dochodzić do skutku
      - Macierze dyskowe, rejestratory i sterowniki przemysłowe wycofane ze wsparcia stają się nieosiągalne z tej maszyny
      - Komunikat mówi o ścieżce niedostępnej i nie wskazuje protokołu jako przyczyny
      - Zmiana wchodzi dopiero po restarcie maszyny, więc ponowny audyt pokazuje zgodność wcześniej niż skutek
      - Udziały obsługiwane nowszymi wersjami protokołu, logowanie, drukowanie i aplikacje pozostają bez zmian
    en:
      - Connections to shares served only over the first version of the protocol cease coming about
      - Disk arrays, recorders and industrial controllers out of support become unreachable from this machine
      - The message speaks of an unreachable path and does not point at the protocol as the cause
      - The change takes hold only after a restart, so a fresh audit shows compliance before the consequence
      - Shares served over newer versions of the protocol, logging on, printing and applications stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - W sieci pozostaje zasób obsługujący wyłącznie pierwszą wersję protokołu, którego nie da się jeszcze zastąpić
      - Nie ustalono, po jakie udziały sieciowe ta maszyna sięga w pracy codziennej
    en:
      - A resource serving only the first version of the protocol and not yet replaceable remains on the network
      - It has not been established what network shares this machine reaches for in its everyday work
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # Four means the driver does not start at all. A key without a start value is
      # reported apart, that being what a machine looks like once the component has
      # been taken out - another state than a driver present and left running.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
      $name = 'Start'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_INSTALLED' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'NO_START_VALUE' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(4|NOT_INSTALLED|NO_START_VALUE)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
    $name = 'Start'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change takes hold at the next start of the machine. Until the restart
    # the driver keeps running and the fresh audit will show a compliant value
    # while the old behaviour is still in force.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Start' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds the rest of the driver's
      # registration and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Reguła otwiera blok i jest w nim pierwszą z trzech dotyczących wersji
    pierwszej protokołu. Dotyczy strony sięgającej; następna dotyczy strony
    wystawiającej, a trzecia — samego składnika w systemie.

    Warto, żeby aplikacja pokazywała tę trójkę razem i mówiła, że wyłączenie
    składnika czyni dwie pozostałe bezprzedmiotowymi. Bez tego użytkownik
    zobaczy trzy niezgodności wyglądające na niezależne i naprawi je
    po kolei, choć jedna czynność załatwia wszystkie.

    Odnotowuję rozróżnienie w sprawdzeniu. Klucz bez wartości startowej
    zwraca odpowiedź osobną, bo jest to stan maszyny, z której składnik
    wyjęto — inny niż sterownik obecny i pozostawiony w ruchu. Zlanie ich
    w jedno dałoby raport, w którym nie widać, czy składnika nie ma, czy
    tylko nie startuje.
  en: |
    The rule opens the block and is the first in it of three touching the protocol's first version. This one
    touches the side that reaches out; the next touches the side that sets out; the third, the component itself
    in the system.

    It is well that the application show the three together and say that switching the component off makes the
    other two beside the point. Without that the user will see three mismatches looking independent and will
    mend them one by one, though one act settles them all.

    I set down the parting made in the check. A key without a start value returns an answer of its own, that
    being the state of a machine from which the component has been taken out - other than a driver present and
    left in motion. Running them together would give a report in which it cannot be seen whether the component
    is gone or merely does not start.
