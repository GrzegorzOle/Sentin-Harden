id: win2016-picture-password-domain-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie obrazem dla kont domenowych wyłączone
    en: Picture sign-in for domain accounts switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza możliwość logowania się na konto domenowe gestami
    wykonywanymi na wybranym obrazie zamiast hasłem.

    Mechanizm ten zastępuje hasło trzema gestami — kliknięciami, liniami,
    okręgami — wykonanymi w określonych miejscach obrazu. Pomyślany był dla
    ekranów dotykowych, gdzie wpisanie długiego hasła jest uciążliwe.

    Słabość leży w tym, jak ludzie wybierają gesty. Wybierają je tam, gdzie
    obraz podpowiada: twarze, rogi, wyraźne krawędzie, środki
    charakterystycznych kształtów. Zbiór prawdopodobnych gestów jest przez
    to znacznie mniejszy, niż wynikałoby z liczby punktów obrazu, a obraz
    sam w sobie zawęża go dalej.

    Druga słabość jest praktyczna: gest zostawia ślad na ekranie i jest
    widoczny z odległości, z której hasła wpisywanego na klawiaturze
    odczytać się nie da.

    Tak jak przy kodzie liczbowym, hasło konta domenowego zostaje przy tym
    zapisane w systemie, żeby dało się je podstawić po wykonaniu gestów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: konto
    domenowe chronione trzema gestami z niewielkiego zbioru
    prawdopodobnych, odczytywalnymi z odległości i zostawiającymi ślad
    na ekranie.
  en: |
    The setting switches off the possibility of signing in to a domain account by
    gestures made on a chosen picture instead of by a password.

    That mechanism takes a password's place with three gestures - taps, lines, circles -
    made at certain places on a picture. It was thought up for touch screens, where
    typing a long password is a nuisance.

    The weakness lies in how people choose their gestures. They choose them where the
    picture suggests: faces, corners, clear edges, the middles of distinctive shapes.
    The set of likely gestures is thereby far smaller than the number of points on the
    picture would suggest, and the picture itself narrows it further.

    The second weakness is practical: a gesture leaves a mark on the screen and is
    visible from a distance at which a password typed on a keyboard cannot be read.

    As with a numeric code, a domain account's password is kept in the system along the
    way so that it can be supplied once the gestures are made.

    What an attacker gains while the item goes unmet: a domain account guarded by three
    gestures from a small set of likely ones, readable from a distance and leaving a
    mark on the screen.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze jest to sprawdzenie
    formalne.

    Mechanizm wymaga ekranu dotykowego albo myszy i jest pomyślany dla
    stanowisk, przy których ktoś siedzi. Na serwerze obsługiwanym z konsoli
    zarządzania albo przez sesję zdalną nie ma zastosowania i wdrożenie nie
    zmienia nic.

    Sprawdzić warto jedną rzecz: czy maszyna nie jest stanowiskiem
    dotykowym pełniącym rolę serwera. Zdarza się to przy stanowiskach
    kioskowych, pulpitach informacyjnych i terminalach w hali, gdzie
    klawiatury świadomie nie ma. Tam wdrożenie odbiera jedyną wygodną
    drogę logowania i punkt jest kandydatem do odpuszczenia.

    Wdrożenie nie usuwa ustawionego obrazu ani gestów — wyłącza możliwość
    logowania się nimi. Hasło działa tak jak dotąd.

    Czego to nie psuje: logowania hasłem, logowania kartą, sesji zdalnych,
    usług, sieci.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though on a server that review is a formality.

    The mechanism calls for a touch screen or a mouse and is thought up for positions
    somebody sits at. On a server attended from a management console or through a
    remote session it has no use and the rollout changes nothing.

    One thing is worth checking: whether the machine is not a touch position filling a
    server's role. That happens at kiosk positions, information displays and terminals
    in a hall, where there is deliberately no keyboard. There the rollout takes away the
    one convenient road of signing in and the item is a candidate for being let go.

    The rollout removes neither the set picture nor the gestures - it switches off the
    possibility of signing in with them. The password works as before.

    What this does not break: signing in by password, signing in by card, remote
    sessions, services, or the network.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Stanowisko dotykowe bez klawiatury traci jedyną wygodną drogę logowania, a hasło trzeba wpisać na klawiaturze ekranowej
      - Ustawiony obraz i gesty nie są usuwane - wyłączona zostaje tylko możliwość logowania się nimi
      - Na serwerze obsługiwanym z konsoli zarządzania albo przez sesję zdalną wdrożenie nie zmienia nic
      - Logowanie hasłem, logowanie kartą i sesje zdalne pozostają bez zmian
    en:
      - A touch position without a keyboard loses the one convenient road of signing in, and the password has to be typed on an on-screen keyboard
      - The set picture and gestures are not removed - only the possibility of signing in with them is switched off
      - On a server attended from a management console or through a remote session the rollout changes nothing
      - Signing in by password, signing in by card and remote sessions stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem dotykowym bez klawiatury i logowanie obrazem jest tam jedyną wygodną drogą
    en:
      - The machine is a touch position without a keyboard and picture sign-in is there the one convenient road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'BlockDomainPicturePassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'BlockDomainPicturePassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockDomainPicturePassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/

notes:
  pl: |
    Punkt tworzy parę z regułą o kodzie liczbowym. Oba mechanizmy robią to
    samo: zastępują hasło czymś krótszym i przechowują hasło, żeby dało się
    je podstawić. Różnią się tylko postacią skrótu.

    Kategoria średnia jest tu niższa niż przy kodzie liczbowym i ma to
    uzasadnienie. Gest wymaga obecności przy maszynie — nie da się go
    wykonać zdalnie ani zgadywać w tysiącach prób z drugiej strony sieci.
    Zbiór prawdopodobnych gestów jest mały, ale dostęp do niego wymaga
    stania przy ekranie.

    Klasa „wymaga sprawdzenia" zamiast „bez uciążliwości" bierze się
    wyłącznie ze stanowisk dotykowych. Poza nimi punkt idzie hurtem i warto
    to w interfejsie odnotować, bo formalna klasa stawia go poza trybem
    zbiorczym.
  en: |
    The item makes a pair with the rule about the numeric code. Both mechanisms do the
    same: they take a password's place with something shorter and keep the password so
    that it can be supplied. They differ only in the shortcut's form.

    The medium category is lower here than at the numeric code and it is warranted. A
    gesture calls for presence at the machine - it cannot be made from afar nor guessed
    in thousands of attempts from the other side of the network. The set of likely
    gestures is small, but reaching it calls for standing at the screen.

    The class "needs review" rather than "no disruption" comes solely from touch
    positions. Beyond them the item goes in bulk, and that is worth noting in the
    interface, the formal class putting it outside bulk mode.
