# Impact area dictionary - shared by every system.
#
# The most important dictionary in the project. It is what makes it possible to:
#   1. sum up the consequences of a change before it is applied,
#   2. answer the reverse question: "I use X - which rules will hurt me?",
#   3. tie a warning to what was actually found on the machine.
#
# Areas are DELIBERATELY shared between Windows and Linux. "File sharing" means
# the same thing on both sides, so the reverse question works regardless of the
# operating system.
#
# Adding an area is a design decision, not a detail. Before adding one, check
# whether an existing entry already describes the same thing in other words.

# Signals - what on a machine points at an area being in use.
#
# Read by the inventory, which knows how to match a service or a package name
# but not which of them means file sharing. That judgement is content and
# therefore lives here, with the dictionary, and not in the engine.
#
# A signal is a PREMISE, never a proof. Finding nothing means nothing was
# found, not that nobody uses the area, and an area with no signals at all is
# reported as undetermined rather than as unused. Both readings are kept apart
# in the interface on purpose.
#
# Seven kinds, all matched case-insensitively:
#   listening - a TCP port being listened on; the strongest sign of the lot,
#               since it means something is being offered right now
#   shares    - a shared folder other than an administrative one; '*' matches any
#   printers  - an installed printer; '*' matches any
#   running   - a service currently running, matched whole
#   services  - a service registered on the machine, matched whole
#   features  - an optional feature or role enabled, matched whole
#   packages  - installed software, matched on a fragment of the display name
#
# Signals are chosen for what they DISTINGUISH. A service that exists on every
# installation of the system says nothing, and a signal that is always true is
# worse than none - it turns "you have this here" into noise. Several areas
# therefore carry no signal at all on Windows and come back as undetermined,
# which is the honest answer rather than a comfortable one.

areas:
  - id: file-sharing
    name:
      pl: Udostępnianie plików w sieci
      en: Network file sharing
    description:
      pl: Dostęp do udziałów sieciowych, protokoły plikowe, mapowane dyski.
      en: Access to network shares, file protocols, mapped drives.
    signals:
      # No ports here on purpose. Windows listens on 445 whether or not anything
      # is shared, so the port would be true everywhere and tell nobody anything.
      shares:
        - '*'
      services:
        - smbd
        - nmbd
      features:
        - SMB1Protocol
        - FS-FileServer
      packages:
        - samba

  - id: legacy-authentication
    name:
      pl: Starsze mechanizmy uwierzytelniania
      en: Legacy authentication mechanisms
    description:
      pl: Wycofywane protokoły i metody logowania, uwierzytelnianie między systemami.
      en: Deprecated logon protocols and methods, system-to-system authentication.
    signals:
      services:
        - winbind
      packages:
        - winbind

  - id: accounts-and-passwords
    name:
      pl: Konta i polityka haseł
      en: Accounts and password policy
    description:
      pl: Złożoność, rotacja i blokady haseł, konta lokalne, konta serwisowe.
      en: Password complexity, rotation and lockout, local accounts, service accounts.
    signals:
      services:
        - sssd
      packages:
        - sssd

  - id: macros-and-documents
    name:
      pl: Makra i treść aktywna w dokumentach
      en: Macros and active content in documents
    description:
      pl: Wykonywanie kodu osadzonego w plikach biurowych i podobnych formatach.
      en: Execution of code embedded in office files and similar formats.
    signals:
      packages:
        - microsoft office
        - microsoft 365
        - libreoffice
        - openoffice
        - wps office

  - id: email-and-attachments
    name:
      pl: Poczta i załączniki
      en: Email and attachments
    description:
      pl: Otwieranie i uruchamianie załączników, treść pobrana z poczty i przeglądarki.
      en: Opening and running attachments, content downloaded from mail and the browser.
    signals:
      packages:
        - outlook
        - thunderbird
        - exchange
        - mailbird

  - id: scripting-and-automation
    name:
      pl: Skrypty i automatyzacja
      en: Scripting and automation
    description:
      pl: Uruchamianie skryptów, polityki wykonywania, zadania harmonogramu.
      en: Script execution, execution policies, scheduled tasks.
    signals:
      running:
        - cron
        - crond
        - atd
      packages:
        - powershell 7
        - python
        - perl
        - autoit

  - id: legacy-applications
    name:
      pl: Starsze aplikacje
      en: Legacy applications
    description:
      pl: Zgodność programów pisanych pod starsze wersje systemu, w tym zapis do katalogów chronionych i założenia o uprawnieniach.
      en: Compatibility of programs written for older system versions, including writes to protected directories and assumptions about privileges.
    signals:
      features:
        - NetFx3
        - LegacyComponents
        - DirectPlay
        - MSRDC-Infrastructure

  - id: remote-management
    name:
      pl: Zdalne zarządzanie
      en: Remote management
    description:
      pl: Zdalne wykonywanie poleceń, konsole zarządzania, agenci monitorujący.
      en: Remote command execution, management consoles, monitoring agents.
    signals:
      listening:
        - 5985
        - 5986
        - 22
      running:
        - WinRM
        - sshd
        - ssh
      services:
        - xrdp
      packages:
        - openssh server
        - teamviewer
        - anydesk

  - id: remote-desktop
    name:
      pl: Pulpit zdalny
      en: Remote desktop
    description:
      pl: Graficzny dostęp zdalny do systemu.
      en: Graphical remote access to the system.
    signals:
      # The service runs on a stock installation whether or not remote desktop
      # is allowed, so it says nothing. A listener on the port is the answer.
      listening:
        - 3389
      packages:
        - xrdp
        - vnc

  - id: printing
    name:
      pl: Drukowanie
      en: Printing
    description:
      pl: Kolejki wydruku, serwery druku, instalacja sterowników drukarek.
      en: Print queues, print servers, printer driver installation.
    signals:
      printers:
        - '*'
      services:
        - cups
        - cupsd
      features:
        - Printing-Server-Role
      packages:
        - cups

  - id: drivers-and-devices
    name:
      pl: Sterowniki i urządzenia
      en: Drivers and devices
    description:
      pl: Instalacja i ładowanie sterowników, urządzenia peryferyjne.
      en: Driver installation and loading, peripheral devices.

  - id: removable-media
    name:
      pl: Nośniki wymienne
      en: Removable media
    description:
      pl: Pamięci USB, dyski zewnętrzne, nagrywarki.
      en: USB storage, external drives, optical writers.
    signals:
      packages:
        - udisks

  - id: network-and-firewall
    name:
      pl: Sieć i zapora
      en: Network and firewall
    description:
      pl: Reguły zapory, wykrywanie w sieci, protokoły pomocnicze.
      en: Firewall rules, network discovery, auxiliary protocols.

  - id: encryption-and-tls
    name:
      pl: Szyfrowanie i TLS
      en: Encryption and TLS
    description:
      pl: Wersje protokołów, zestawy szyfrów, wymagania wobec certyfikatów.
      en: Protocol versions, cipher suites, certificate requirements.
    signals:
      packages:
        - openssl
        - stunnel

  - id: virtualization-and-containers
    name:
      pl: Wirtualizacja i kontenery
      en: Virtualization and containers
    description:
      pl: Funkcje hipernadzorcy, izolacja, środowiska kontenerowe.
      en: Hypervisor features, isolation, container environments.
    signals:
      services:
        - vmms
        - vmcompute
        - docker
        - libvirtd
        - containerd
      features:
        - Microsoft-Hyper-V
        - Microsoft-Hyper-V-All
        - Containers
        - HypervisorPlatform
      packages:
        - docker
        - virtualbox
        - vmware
        - qemu

  - id: updates-and-servicing
    name:
      pl: Aktualizacje i serwisowanie
      en: Updates and servicing
    description:
      pl: Pobieranie i instalacja poprawek, okna serwisowe, wymuszony restart.
      en: Patch download and installation, maintenance windows, forced restarts.
    signals:
      features:
        - UpdateServices
      packages:
        - wsus
        - sccm
        - configuration manager

  - id: logging-and-audit
    name:
      pl: Rejestrowanie i audyt
      en: Logging and audit
    description:
      pl: Zakres zdarzeń, rozmiar i retencja dzienników, przekazywanie zdarzeń.
      en: Event scope, log size and retention, event forwarding.
    signals:
      running:
        - Wecsvc
        - auditd
        - rsyslog
      packages:
        - auditd
        - rsyslog
        - nxlog
        - winlogbeat
        - wazuh

  - id: boot-and-firmware
    name:
      pl: Rozruch i oprogramowanie układowe
      en: Boot and firmware
    description:
      pl: Bezpieczny rozruch, szyfrowanie dysku, ustawienia sprzętowe.
      en: Secure boot, disk encryption, hardware settings.

  - id: web-server-services
    name:
      pl: Usługi serwera WWW
      en: Web server services
    description:
      pl: Konfiguracja serwera aplikacyjnego, moduły, nagłówki, obsługa żądań.
      en: Application server configuration, modules, headers, request handling.
    signals:
      listening:
        - 80
        - 443
      services:
        - W3SVC
        - apache2
        - httpd
        - nginx
      features:
        - IIS-WebServer
        - IIS-WebServerRole
      packages:
        - internet information services
        - apache
        - nginx

  - id: user-interface
    name:
      pl: Wygląd i zachowanie systemu
      en: System look and behaviour
    description:
      pl: Ekran blokady, komunikaty, personalizacja, dostępne elementy interfejsu.
      en: Lock screen, messages, personalisation, available interface elements.

  - id: diagnostics-and-reporting
    name:
      pl: Dane diagnostyczne i raportowanie
      en: Diagnostic data and reporting
    description:
      pl: Wysyłanie danych o stanie maszyny do producenta i do usług raportujących, w tym raporty o aktualizacjach, awariach i stanie ochrony.
      en: Sending data about the machine to the vendor and to reporting services, including reports on updates, crashes and protection status.
    signals:
      running:
        - DiagTrack
