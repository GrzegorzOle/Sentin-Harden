id: win2016-audit-process-creation

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Detailed Tracking
  title:
    pl: Inspekcja tworzenia procesów
    en: Audit process creation
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje uruchomienie każdego procesu na tej maszynie: co
    zostało uruchomione, przez kogo i przez jaki proces nadrzędny.

    Pole procesu nadrzędnego jest tym, co czyni ten punkt wyjątkowym.
    Uruchomienie powłoki poleceń samo w sobie nie mówi nic. Uruchomienie
    powłoki poleceń przez proces serwera sieciowego mówi wszystko — bo serwer
    sieciowy nie ma powodu uruchamiać powłoki i jest to jeden
    z najczytelniejszych wzorców wykorzystania luki, jakie istnieją.

    To jest też podkategoria, na której opiera się większość wykrywania opartego
    na zachowaniu. Łańcuch procesów od dokumentu przez program biurowy do
    narzędzia sieciowego jest opowieścią, którą da się odczytać bez żadnej
    dodatkowej wiedzy — ale wyłącznie wtedy, gdy ogniwa tego łańcucha są
    zapisane.

    Rejestruje się powodzenia. Nieudane uruchomienie procesu jest zdarzeniem
    rzadkim i mało wartościowym wobec kosztu.

    Osobno warto wiedzieć, że sama podkategoria nie zapisuje argumentów
    wywołania — to jest przedmiotem odrębnego ustawienia i odrębnej reguły.
    Bez argumentów widać, że uruchomiono interpreter; nie widać, co miał
    wykonać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchamianie
    narzędzi na tej maszynie bez śladu wskazującego, co i z czego zostało
    uruchomione.
  en: |
    The subcategory records the start of every process on this machine: what was
    started, by whom, and through what parent process.

    The parent process field is what makes this item exceptional. The start of a
    command shell says nothing by itself. The start of a command shell by a web
    server process says everything - because a web server has no reason to start a
    shell, and it is one of the most legible patterns of a vulnerability being
    exploited that exist.

    This is also the subcategory most behaviour-based detection rests on. A chain of
    processes from a document through an office program to a network tool is a story
    readable without any further knowledge - but only where the chain's links are
    recorded.

    Successes are recorded. A failed start of a process is a rare event and of
    little worth against the cost.

    Separately, it is worth knowing that the subcategory alone does not record the
    arguments of a call - that is the subject of a distinct setting and a distinct
    rule. Without arguments one sees that an interpreter was started; one does not
    see what it was to carry out.

    What an attacker gains while the item goes unmet: the running of tools on this
    machine with no trace of what was started and out of what.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i chodzi o objętość, która na serwerze bywa
    zaskakująco wysoka.

    Intuicja podpowiada, że na serwerze uruchamia się niewiele procesów, skoro
    nikt przy nim nie siedzi. Jest odwrotnie. Zadania w harmonogramie, skrypty
    monitorujące, agenci zbierający dane i systemy wdrożeniowe uruchamiają
    procesy nieustannie, a każde takie uruchomienie to zdarzenie. Serwer
    z agentem odpytującym stan co minutę dopisze kilkanaście tysięcy zdarzeń
    na dobę, nie robiąc nic poza staniem.

    Dlatego oszacowanie jest tu warunkiem wdrożenia, a nie formalnością.
    Równocześnie jest to jeden z najwartościowszych punktów w całym bloku,
    więc odpuszczenie go powinno być decyzją świadomą, a nie skutkiem
    zaskoczenia objętością.

    Nic przy tym nie przestaje działać, a wpływ na wydajność jest pomijalny —
    zapisanie zdarzenia jest tanie wobec kosztu samego uruchomienia procesu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the matter is volume, which on a server can be
    surprisingly high.

    Intuition suggests few processes start on a server, nobody sitting at it. The
    opposite is true. Scheduled tasks, monitoring scripts, data-gathering agents and
    deployment systems start processes continually, and every such start is an
    event. A server with an agent polling its state every minute will add some tens
    of thousands of events a day while doing nothing but standing there.

    An estimate is therefore a condition of the rollout here, not a formality. At
    the same time this is one of the most valuable items in the whole block, so
    letting it go should be a deliberate decision rather than the result of being
    surprised by the volume.

    Nothing stops working while this goes on, and the effect on performance is
    negligible - recording an event is cheap against the cost of starting the
    process itself.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — rośnie wyłącznie objętość dziennika zabezpieczeń
      - Agent odpytujący stan co minutę dopisuje kilkanaście tysięcy zdarzeń na dobę na maszynie, która nic nie robi
      - Zadania w harmonogramie i systemy wdrożeniowe uruchamiają procesy nieustannie i każde uruchomienie to zdarzenie
      - Wpływ na wydajność jest pomijalny wobec kosztu samego uruchomienia procesu
    en:
      - No regression in the working - only the security log's volume grows
      - An agent polling its state every minute adds some tens of thousands of events a day on a machine doing nothing
      - Scheduled tasks and deployment systems start processes continually and every start is an event
      - The effect on performance is negligible against the cost of starting the process itself
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Objętości zdarzeń nie oszacowano, a na maszynie działają agenci odpytujący stan w krótkich odstępach
      - Dziennik zabezpieczeń ma domyślny rozmiar i nie ma go jak powiększyć
    en:
      - The volume of events has not been estimated and agents polling state at short intervals run on the machine
      - The security log is at its default size and there is no way of enlarging it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE922B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE922B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE922B-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-process-creation

notes:
  pl: |
    Punkt jest kandydatem numer jeden do wysłania zdarzeń poza maszynę.
    Trzymanie ich wyłącznie lokalnie w dzienniku o domyślnym rozmiarze daje
    zapis obracający się w godziny — czyli dokładnie to złudzenie, przed którym
    ostrzega cały blok.

    Zapisywanie argumentów wywołania jest osobnym ustawieniem i osobną regułą.
    Bez niego wartość tej podkategorii spada wyraźnie, bo uruchomienie
    interpretera bez treści polecenia mówi niewiele. Warto je czytać razem.

    Wysokie rejestrowane objętości nie są powodem do odpuszczenia punktu, tylko
    do rozstrzygnięcia, dokąd zdarzenia idą. To jest inna decyzja i aplikacja
    ma to rozróżnienie pokazać.
  en: |
    The item is the first candidate for sending events off the machine. Keeping them
    locally alone, in a log of the default size, gives a record turning over within
    hours - which is exactly the illusion the whole block warns against.

    Recording the arguments of a call is a distinct setting and a distinct rule.
    Without it this subcategory's worth falls markedly, since the start of an
    interpreter without the command's content says little. They are worth reading
    together.

    High recorded volumes are no reason to let the item go, only to settle where the
    events go. That is a different decision and the application is to show the
    distinction.
