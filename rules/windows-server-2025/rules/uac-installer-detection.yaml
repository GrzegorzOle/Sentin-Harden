id: win2025-uac-installer-detection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wykrywanie instalatorów wymagających podniesienia uprawnień
    en: Detection of installers taking an elevation of rights
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi rozpoznawać programy wyglądające na
    instalatory i żądać dla nich podniesienia uprawnień, zanim zaczną
    działać.

    Mechanizm istnieje z powodu historycznego. Starsze instalatory nie
    deklarują, jakich uprawnień potrzebują — powstały, zanim deklaracja
    taka była w ogóle możliwa. Uruchomione bez podniesienia próbują
    pisać do katalogów i gałęzi rejestru, do których nie mają dostępu,
    i albo kończą się błędem, albo — co gorsze — kończą się pozornym
    powodzeniem przy instalacji niekompletnej.

    Wykrywanie rozwiązuje to po stronie systemu: rozpoznaje instalator
    po nazwie pliku i po zawartości, po czym żąda podniesienia z góry.

    Wartość zabezpieczająca bierze się stąd, że instalacja przestaje być
    czynnością cichą. Program, który chce zmienić stan maszyny w sposób
    typowy dla instalatora, musi o to poprosić — i prośba ta jest
    widoczna, a na serwerze także zapisywana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchomienia instalatora bez żądania podniesienia, co usuwa moment,
    w którym ktoś mógłby zauważyć, że coś jest instalowane.
  en: |
    The setting bids the system recognise programs that look like installers and take an
    elevation of rights for them before they begin working.

    The mechanism exists for a historical reason. Older installers do not declare what rights
    they take - they came about before such a declaration was possible at all. Run without an
    elevation they try to write to directories and registry branches they have no access to,
    and either end in an error or - worse - end in a seeming success at an incomplete
    installation.

    The detection settles that on the system's side: it recognises an installer by the file's
    name and by its content, and then takes an elevation in advance.

    The safeguarding worth comes of installation ceasing to be a quiet doing. A program that
    would change the machine's state in a way typical of an installer has to ask for it - and
    that asking is visible, and on a server recorded as well.

    What an attacker gains while the item goes unmet: the means of running an installer with
    no asking for an elevation, which does away with the moment at which somebody might
    notice that something is being installed.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze coś uruchamia instalatory
    bez udziału człowieka, bo takie uruchomienie zatrzyma się na żądaniu
    podniesienia, którego nikt nie potwierdzi.

    Nic nie przestaje działać przy pracy ręcznej. Administrator
    uruchamiający instalator zobaczy okno potwierdzenia — u niego jest to
    czynność normalna i tak też wygląda.

    Skutek dotyczy wyłącznie uruchomień bezobsługowych. Zadanie
    harmonogramu, skrypt wdrożeniowy albo narzędzie zdalne uruchamiające
    plik rozpoznany jako instalator zatrzyma się wtedy w oczekiwaniu na
    potwierdzenie. Objaw bywa mylący: zadanie nie kończy się błędem,
    tylko nie kończy się wcale.

    Dodatkowo mechanizm rozpoznaje po nazwie, więc program nazwany
    „setup" albo „update" zostanie uznany za instalator, nawet jeśli nim
    nie jest. Na serwerze zdarza się to narzędziom własnym i skryptom
    obsługi, które nikt nie przewidział, że będą tak czytane.

    Na serwerze zarządzanym przez narzędzie wdrożeniowe działające na
    koncie systemowym skutku nie ma — konto to jest już podniesione
    i żądanie nie powstaje.
  en: |
    What needs checking is whether anything on this server runs installers with no person's
    part in it, since such a run will halt at an asking for an elevation nobody will confirm.

    Nothing stops working at work by hand. An administrator running an installer will see a
    confirming window - for them it is a normal doing and it looks like one.

    The effect concerns unattended runs alone. A scheduled task, a rollout script or a remote
    tool running a file recognised as an installer will then halt awaiting a confirmation.
    The symptom is at times misleading: the task does not end in an error, it simply does not
    end at all.

    On top of that the mechanism recognises by name, so a program named "setup" or "update"
    will be held an installer even where it is none. On a server that happens to home-made
    tools and handling scripts nobody foresaw would be read that way.

    On a server managed by a rollout tool working under the system account there is no effect
    - that account is elevated already and no asking arises.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Zadanie harmonogramu uruchamiające instalator zatrzyma się w oczekiwaniu na potwierdzenie
      - Objaw jest mylący — zadanie nie zgłasza błędu, tylko nie kończy się wcale
      - Program nazwany setup albo update zostanie uznany za instalator, nawet jeśli nim nie jest
      - Przy pracy ręcznej administratora nie zmienia się nic poza oknem potwierdzenia
      - Narzędzie wdrożeniowe działające na koncie systemowym nie odczuwa zmiany
    en:
      - A scheduled task running an installer will halt awaiting a confirmation
      - The symptom is misleading - the task reports no error, it simply does not end at all
      - A program named setup or update will be held an installer even where it is none
      - At an administrator's work by hand nothing changes beyond the confirming window
      - A rollout tool working under the system account feels no change
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze działają zadania bezobsługowe uruchamiające instalatory z konta użytkownika
      - Narzędzia własne o nazwach typowych dla instalatorów są uruchamiane automatycznie
    en:
      - Unattended tasks running installers from a user account work on the server
      - Home-made tools with names typical of installers are run automatically
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableInstallerDetection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'EnableInstallerDetection' -ErrorAction SilentlyContinue).'EnableInstallerDetection'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableInstallerDetection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableInstallerDetection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-detect-application-installations-and-prompt-for-elevation

notes:
  pl: |
    Rozpoznanie opiera się na nazwie pliku i na jego zawartości, a nie na
    deklaracji programu. Jest to mechanizm przybliżony i daje zarówno
    rozpoznania trafne, jak i mylne — obie strony tej pomyłki są opisane
    w skutkach.

    Punkt czyta się razem z pozostałymi ustawieniami kontroli konta
    użytkownika. Samo wykrywanie bez włączonego mechanizmu podniesienia
    nie ma na czym zadziałać.

    Na maszynie z wyłączoną kontrolą konta użytkownika ustawienie nie
    zmienia zachowania. Nie czyni go to jednak zbędnym — sprawdzenie
    mówi o stanie konfiguracji, a nie o tym, czy mechanizm nadrzędny jest
    w danej chwili czynny.
  en: |
    The recognition rests on the file's name and on its content rather than on the program's
    declaration. It is an approximate mechanism and gives both apt recognitions and mistaken
    ones - both sides of that mistake are described among the effects.

    The item is read together with the remaining settings of user account control. Detection
    alone, with the mechanism of elevation switched off, has nothing to work on.

    On a machine with user account control switched off the setting does not change
    behaviour. That does not make it needless, though - the check speaks of the state of the
    configuration rather than of whether the governing mechanism is at that moment active.
