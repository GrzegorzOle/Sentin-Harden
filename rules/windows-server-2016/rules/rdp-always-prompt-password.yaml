id: win2016-rdp-always-prompt-password

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Zawsze pytaj o hasło przy połączeniu pulpitem zdalnym
    en: Always prompt for a password on Remote Desktop connection
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe serwerowi pytać o hasło przy zestawianiu sesji zdalnej,
    nawet wtedy, gdy klient podał je z zapisanych poświadczeń.

    Treścią punktu nie jest hasło, tylko miejsce, w którym ono leży. Klient
    pulpitu zdalnego potrafi zapamiętać poświadczenie do maszyny i podawać
    je sam. Poświadczenie zostaje wtedy na stanowisku łączącego się —
    w magazynie poświadczeń systemu, w pliku połączenia albo w konfiguracji
    narzędzia, które sesję zestawia.

    Stanowisko jest zaś miejscem, nad którym zespół utrzymujący serwer nie
    ma władzy. Bywa laptopem wynoszonym z biura, komputerem domowym, maszyną
    z oprogramowaniem, którego nikt nie audytował. Zapisane poświadczenie
    do serwera dziedziczy poziom zabezpieczenia tego stanowiska, a nie
    serwera — i to jest cała różnica.

    Skutek praktyczny jest taki, że kto przejmie stanowisko, dostaje wejście
    na serwer bez znajomości hasła. Nie musi go łamać ani wykradać, wystarczy
    że kliknie zapisane połączenie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowe
    wejście na serwer z każdego przejętego stanowiska, na którym ktoś
    zapisał do niego poświadczenie.
  en: |
    The setting has the server ask for a password while the remote session is being
    set up, even where the client has offered one from stored credentials.

    The substance of the item is not the password but the place it lies in. The
    remote desktop client can remember a credential to a machine and offer it
    itself. The credential then stays on the connecting workstation - in the
    system's credential store, in the connection file, or in the configuration of
    whatever tool sets the session up.

    The workstation, meanwhile, is a place the team keeping the server has no power
    over. It is at times a laptop carried out of the office, a home computer, a
    machine with software nobody has audited. A stored credential to the server
    inherits the protection of that workstation rather than of the server - and
    there lies the whole difference.

    The practical upshot is that whoever takes over the workstation gets a way into
    the server without knowing the password. They need not break it or steal it; a
    click on the stored connection is enough.

    What an attacker gains while the item goes unmet: a ready way into the server
    from every taken-over workstation on which somebody has stored a credential to
    it.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powodem nie są ludzie, tylko
    automaty.

    Dla człowieka zmiana jest drobnym utrudnieniem: hasło trzeba wpisać raz
    przy każdym łączeniu, zamiast raz przy zapisaniu połączenia. Osoby
    zarządzające serwerem zwykle wpisują je i tak, więc różnicę zauważą, ale
    nie odczują.

    Gorzej z tym, co łączy się samo. Zadania harmonogramu otwierające sesję
    zdalną, skrypty wdrożeniowe zestawiające połączenie w tle, narzędzia do
    zdalnej pomocy z zapamiętanym poświadczeniem, systemy nadzoru robiące
    zrzut ekranu serwera. Wszystkie one stają przed ekranem hasła, przy
    którym nie ma komu go wpisać, i po prostu przestają działać.

    Skutek bywa opóźniony i to jest tu najgorsze. Zadanie uruchamiane raz
    w tygodniu ujawni problem za tydzień, a zadanie miesięczne — za miesiąc,
    gdy już nikt nie będzie wiązał awarii z tą zmianą. Dlatego trzeba
    najpierw wyliczyć, co zestawia sesje do tej maszyny bez udziału
    człowieka, a dopiero potem zmieniać.

    Czego to nie psuje: sesji już otwartych, konsoli lokalnej, zarządzania
    przez powłokę zdalną, poświadczeń przekazywanych mechanizmem domenowym
    bez zapisu na stanowisku.

    Bez restartu, natychmiast odwracalne — ale skutek dotyka każdego
    kolejnego łączenia.
  en: |
    The class is "needs a planned rollout", and the reason is not people but
    machines.

    For a person the change is a small nuisance: the password has to be typed once
    at each connecting rather than once when the connection was saved. Those
    managing the server as a rule type it anyway, so they will notice the difference
    without feeling it.

    It is worse with what connects by itself. Scheduled tasks opening a remote
    session, deployment scripts setting up a connection in the background, remote
    assistance tools with a remembered credential, monitoring systems taking a
    snapshot of the server's screen. All of them come up against a password screen
    with nobody there to type into it, and simply stop working.

    The effect is at times delayed, and that is the worst of it here. A task run
    once a week will show the problem in a week, and a monthly one in a month, when
    nobody will any longer tie the failure to this change. The things setting up
    sessions to this machine without a person's part in it must therefore be
    enumerated first and the change made only after.

    What this does not break: sessions already open, the local console, management
    through a remote shell, credentials passed by the domain mechanism without being
    stored on the workstation.

    No restart, undone immediately - but the effect touches every further
    connecting.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zadanie harmonogramu otwierające sesję zdalną zatrzymuje się na ekranie hasła i przestaje działać, a objaw pojawia się dopiero przy następnym uruchomieniu
      - Skrypty wdrożeniowe zestawiające połączenie w tle oraz narzędzia do zdalnej pomocy z zapamiętanym poświadczeniem tracą dostęp
      - Systemy nadzoru robiące zrzut ekranu serwera przestają dostarczać obraz
      - Osoby zarządzające serwerem wpisują hasło przy każdym łączeniu zamiast raz przy zapisaniu połączenia
    en:
      - A scheduled task opening a remote session halts at the password screen and stops working, and the symptom appears only at the next run
      - Deployment scripts setting up a connection in the background and remote assistance tools with a remembered credential lose access
      - Monitoring systems taking a snapshot of the server's screen stop delivering the picture
      - Those managing the server type the password at every connecting rather than once when the connection was saved
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie wyliczono, co zestawia sesje zdalne do tej maszyny bez udziału człowieka, łącznie z zadaniami uruchamianymi rzadziej niż raz w tygodniu
      - Sesje zdalne do tej maszyny otwierają zadania harmonogramu albo systemy nadzoru, dla których nie ma innej drogi dostępu
    en:
      - What sets up remote sessions to this machine without a person's part in it has not been enumerated, tasks run less often than weekly included
      - Remote sessions to this machine are opened by scheduled tasks or monitoring systems for which there is no other way in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fPromptForPassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fPromptForPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fPromptForPassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt jest odczuwalny w codziennej pracy i tak został oznaczony. To rzadki
    przypadek w tym zestawie: większość reguł rejestrowych jest dla ludzi
    niewidoczna, a ta zmienia sposób łączenia każdemu, kto korzysta
    z zapisanego poświadczenia.

    Reguła sąsiaduje z punktem o zapisywaniu haseł w kliencie i obie bywają
    mylone, bo brzmią podobnie. Tamta dotyczy tej maszyny jako strony
    łączącej się dalej i zabrania zapisu u siebie. Ta dotyczy jej jako celu
    i nie przyjmuje poświadczenia zapisanego gdzie indziej. Dopiero razem
    zamykają obie strony tego samego zwyczaju.

    Wdrożenie warto poprzedzić przeglądem zadań harmonogramu na stanowiskach,
    z których do tej maszyny się łączą — a nie tylko na niej samej. Zapisane
    poświadczenie leży bowiem po stronie łączącego się, nie serwera.
  en: |
    The item is felt in daily work and has been marked as such. That is a rare case
    in this set: most registry rules are invisible to people, and this one changes
    the way of connecting for everybody using a stored credential.

    The rule neighbours the item on saving passwords in the client, and the two are
    at times confused, since they sound alike. That one concerns this machine as the
    side connecting onward and forbids storing at home. This one concerns it as a
    target and does not accept a credential stored elsewhere. Only together do they
    close both sides of the same habit.

    The rollout is worth preceding with a review of scheduled tasks on the
    workstations connecting to this machine - not on the machine itself alone. The
    stored credential lies, after all, on the connecting side rather than the
    server's.
