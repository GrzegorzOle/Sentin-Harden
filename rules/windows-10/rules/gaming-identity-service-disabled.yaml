id: win10-gaming-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa uwierzytelniania w platformie gier wyłączona
    en: The warranting service of the platform of games switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę logującą maszynę do platformy gier
    i utrzymującą ważność tego logowania.

    Usługa ta przechowuje żeton potwierdzający tożsamość i odnawia go
    w tle, bez udziału użytkownika. Robi to również wtedy, gdy nikt na
    maszynie w nic nie gra, o ile konto zostało kiedyś podłączone.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Nie zamyka
    drogi wejścia i nie broni przed atakiem.

    Znaczenie ma natomiast to, że jest to konto zewnętrzne zalogowane na
    stałe na maszynie służbowej, z żetonem odnawianym w tle i z własnym
    kanałem do sieci producenta. Konto takie zwykle nie podlega żadnemu
    z mechanizmów, którymi organizacja zarządza dostępem.

    Odnotowuję, że usługa ta jest podstawą dla pozostałych z tej rodziny.
    Wyłączenie jej zatrzymuje w praktyce także zapisywanie stanu
    rozgrywki poza maszyną, bo tamto wymaga potwierdzonej tożsamości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zalogowane
    konto zewnętrzne poza zarządzaniem organizacji.
  en: |
    The setting switches off the service logging the machine on to the platform of games and keeping that logging
    on in force.

    That service holds a token warranting who one is and makes it new behind the scene, with no part taken by the
    user. It does so also when nobody upon the machine plays at anything, so long as a reckoning was once joined
    on.

    The grading is low and the item is to be put forward as such. It shuts no road in and guards against no
    assault.

    What has weight, however, is that it is an outward reckoning logged on for good upon a machine of service,
    with a token made new behind the scene and with a channel of its own to the maker's network. Such a reckoning
    commonly falls under none of the mechanisms by which the body orders its reaches.

    I set down that this service is the ground of the rest of its kindred. Its switching off stops in practice
    also the writing of the state of play off the machine, that calling for a warranted name.

    What an attacker gains while the item goes unmet: a logged-on outward reckoning beyond the body's ordering.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie jest krótkie: czy ktokolwiek
    podłączył na tej maszynie konto platformy gier.

    Miejscem pierwszym są stanowiska służące także do rozrywki. Po
    zmianie logowanie do platformy przestanie działać, a wraz z nim
    wszystko, co go wymaga.

    Miejscem drugim są pojedyncze programy rozrywkowe kupione przez
    sklep systemowy i wymagające tego logowania przy uruchomieniu.
    Odmówią startu, choć nie są grami sieciowymi.

    Odnotowuję, że konto używane do logowania do systemu nie jest tym
    samym kontem i zmiana go nie rusza. Warto to powiedzieć, bo obawa
    o utratę dostępu do maszyny pojawia się tu regularnie.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: logowania do systemu, poczty, sieci, drukowania,
    pracy programów.
  en: |
    The class is "needs review", and the review is short: whether anybody has joined a reckoning of the platform
    of games upon this machine.

    The first place is stations serving also for pastime. After the change the logging on to the platform will
    cease to work, and with it everything calling for it.

    The second place is single programs of pastime bought through the system's store and calling for that logging
    on at their setting going. They will refuse to start, though they are no games over the network.

    I set down that the reckoning used for logging on to the system is not that same reckoning and the change
    touches it not. It is worth saying, a fear of losing the reach of the machine coming up here time and again.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: logging on to the system, the post, the network, printing, or the work of programs.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Logowanie do platformy gier przestanie działać, a wraz z nim wszystko, co go wymaga
      - Programy rozrywkowe ze sklepu systemowego wymagające tego logowania odmówią startu
      - Zapisywanie stanu rozgrywki poza maszyną przestanie działać, bo wymaga potwierdzonej tożsamości
      - Konto używane do logowania do systemu nie jest tym samym kontem i zmiana go nie rusza
      - Poczta, sieć, drukowanie i praca pozostałych programów pozostają bez zmian
    en:
      - The logging on to the platform of games will cease to work, and with it everything calling for it
      - Programs of pastime out of the system s store calling for that logging on will refuse to start
      - The writing of the state of play off the machine will cease to work, it calling for a warranted name
      - The reckoning used for logging on to the system is not that same reckoning and the change touches it not
      - The post, the network, printing and the work of other programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na stanowisku podłączone jest konto platformy gier używane do uruchamiania kupionych programów
    en:
      - Upon the station a reckoning of the platform of games is joined on and used for the setting going of bought programs
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XblAuthManager' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XblAuthManager' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XblAuthManager' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła jest podstawą dla reszty rodziny i warto, żeby aplikacja
    pokazała tę zależność. Wyłączenie uwierzytelniania zatrzymuje
    w praktyce także zapisywanie stanu rozgrywki poza maszyną.

    Argument wart postawienia wprost nie dotyczy gier. Chodzi o konto
    zewnętrzne zalogowane na stałe na maszynie służbowej, z żetonem
    odnawianym w tle i własnym kanałem do sieci producenta, poza
    mechanizmami, którymi organizacja zarządza dostępem.

    Odnotowuję nieporozumienie warte uprzedzenia: konto używane do
    logowania do systemu to nie to samo konto. Obawa o utratę dostępu do
    maszyny pojawia się tu regularnie i trzeba ją zdjąć wprost.
  en: |
    The rule is the ground of the rest of its kindred, and it is well that the application show that hanging
    together. The switching off of the warranting stops in practice also the writing of the state of play off the
    machine.

    The argument worth putting outright touches no games. It is an outward reckoning logged on for good upon a
    machine of service, with a token made new behind the scene and a channel of its own to the maker's network,
    beyond the mechanisms by which the body orders its reaches.

    I set down a misunderstanding worth forestalling: the reckoning used for logging on to the system is not that
    same reckoning. A fear of losing the reach of the machine comes up here time and again and is to be taken away
    outright.
