id: win2025-create-symbolic-links-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie dowiązań symbolicznych zastrzeżone dla administratorów
    en: Creating symbolic links restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala utworzyć dowiązanie symboliczne — wpis w systemie
    plików wskazujący na inne miejsce, otwierany tak, jakby był plikiem
    docelowym.

    Zagrożenie bierze się z odstępu czasu. Program uprzywilejowany
    sprawdza ścieżkę, uznaje ją za bezpieczną i dopiero potem ją
    otwiera. Kto w tej szczelinie podmieni wpis na dowiązanie
    wskazujące gdzie indziej, ten sprawia, że program otwiera nie to,
    co sprawdził. Program nie popełnia błędu — wykonuje operację, o którą
    został poproszony, na celu, który w międzyczasie się zmienił.

    Skutkiem bywa zapis w miejscu chronionym, wykonany rękami usługi
    działającej wysoko, albo odczyt pliku, do którego konto dostępu nie
    ma. Wzorzec ten jest jedną z częściej wykorzystywanych dróg
    podniesienia uprawnień na tej platformie.

    Na serwerze pole jest szersze niż na stanowisku roboczym z jednego
    powodu: usług uprzywilejowanych operujących na plikach jest tu
    więcej. Usługi aplikacyjne, agenci, harmonogramy i narzędzia
    wdrożeniowe pracują na koncie systemowym i sięgają do katalogów
    zapisywalnych przez innych — czyli dokładnie tam, gdzie wzorzec ten
    działa.

    Punkt zawęża wykaz do administratorów, dopuszczając konto maszyn
    wirtualnych na serwerze z rolą wirtualizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    na skłonienie usługi uprzywilejowanej, żeby zapisała albo odczytała
    plik, do którego napastnik sam dostępu nie ma.
  en: |
    The right allows a symbolic link to be made - an entry in the file system pointing at
    another place, opened as though it were the target file.

    The danger comes of a gap in time. A privileged program checks a path, holds it safe and
    only then opens it. Whoever in that crack swaps the entry for a link pointing elsewhere
    makes the program open what it never checked. The program makes no mistake - it does the
    operation it was asked to do, upon a target that changed meanwhile.

    The effect is at times a writing in a guarded place, done by the hands of a service working
    high, or a reading of a file the account has no access to. That pattern is one of the more
    often used roads of raising rights on this platform.

    On a server the field is wider than at a working station for one reason: privileged services
    working upon files are more numerous here. Application services, agents, schedulers and
    rollout tools work under the system account and reach into directories others may write in -
    that is, just where the pattern works.

    The item narrows the list to administrators, allowing the virtual machines account on a
    server bearing the virtualisation role.

    What an attacker gains while the item goes unmet: a way of bringing a privileged service to
    write or read a file the attacker has no access to.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze coś tworzy dowiązania
    symboliczne z konta spoza wykazu, bo po zawężeniu przestanie móc to
    robić.

    W stanie domyślnym prawo mają wyłącznie administratorzy — oraz konto
    maszyn wirtualnych, jeżeli zainstalowano rolę wirtualizacji. Na
    większości serwerów naprawa nie zmienia więc niczego.

    Przypadkiem do sprawdzenia są środowiska programistyczne i narzędzia
    budujące. Menedżery pakietów i systemy budowania tworzą dowiązania
    do katalogów zależności i robią to na koncie uruchamiającego. Serwer
    budujący jest tu przypadkiem oczywistym.

    Drugim przypadkiem są kontenery. Warstwy obrazów i woluminy opierają
    się na dowiązaniach, a proces pracujący w kontenerze bywa
    uruchamiany na koncie zwykłym. Warto sprawdzić to przed zmianą,
    jeżeli serwer uruchamia kontenery.

    Trzecim jest oprogramowanie starsze przenoszone z innej platformy,
    gdzie dowiązania są czymś codziennym.

    Objaw jest natychmiastowy i czytelny: operacja tworzenia dowiązania
    kończy się odmową uprawnień. Dowiązania już istniejące działają
    dalej i nie są w żaden sposób dotknięte — naprawa dotyczy tworzenia
    nowych, nie używania starych.

    Zmiana nie wymaga przerwy.
  en: |
    What needs checking is whether anything on this server makes symbolic links from an account
    outside the list, since after the narrowing it will no longer be able to.

    In the default state only administrators hold the right - and the virtual machines account,
    where the virtualisation role was installed. On most servers the mending thus changes
    nothing.

    The cases to be checked are development environments and build tools. Package managers and
    build systems make links to dependency directories and do so under the account of whoever
    starts them. A build server is here the plain case.

    The second case is containers. Images' layers and volumes rest on links, and a process
    working in a container is at times started under an ordinary account. It is worth checking
    before the change where the server runs containers.

    The third is older software carried over from another platform, where links are an everyday
    thing.

    The symptom is immediate and plain: the making of a link ends in a refusal of rights. Links
    already standing go on working and are in no way touched - the mending bears on the making
    of new ones rather than on the use of old.

    The change takes no break.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - scripting-and-automation
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Serwer budujący tworzący dowiązania do katalogów zależności zgłosi odmowę uprawnień
      - Proces w kontenerze uruchomiony na koncie zwykłym nie utworzy dowiązania
      - Dowiązania już istniejące działają dalej, bo naprawa dotyczy tworzenia nowych
      - Konto maszyn wirtualnych zostaje w wykazie na serwerze z rolą wirtualizacji
    en:
      - A build server making links to dependency directories will report a refusal of rights
      - A process in a container started under an ordinary account will not make a link
      - Links already standing go on working, the mending bearing on the making of new ones
      - The virtual machines account stays in the list on a server bearing the virtualisation role
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer jest serwerem budującym, a system budowania tworzy dowiązania z konta zwykłego
      - Serwer uruchamia kontenery, a procesy w nich pracują na kontach spoza wykazu
      - Na serwerze pracuje oprogramowanie przeniesione z innej platformy, opierające się na dowiązaniach
    en:
      - The server is a build server and the build system makes links from an ordinary account
      - The server runs containers and the processes in them work under accounts outside the list
      - Software carried over from another platform and resting on links works on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-83-0)?|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreateSymbolicLinkPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The virtual machines account stays in the list where it is already
    # there, since removing it stops the virtualisation role from working.
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = '*S-1-5-32-544'
    if ($text -match '(?m)^SeCreateSymbolicLinkPrivilege\s*=\s*(.*)$') {
      if ($Matches[1] -match 'S-1-5-83-0') { $value = '*S-1-5-32-544,*S-1-5-83-0' }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateSymbolicLinkPrivilege = ' + $value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateSymbolicLinkPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-symbolic-links

notes:
  pl: |
    Sprawdzenie dopuszcza konto maszyn wirtualnych obok administratorów.
    Pojawia się ono w wykazie po zainstalowaniu roli wirtualizacji,
    a naprawa je zachowuje, jeżeli już tam jest.

    Dowiązania już istniejące działają dalej. Zawężenie dotyczy
    tworzenia nowych, nie używania starych.

    Przy serwerze budującym i przy serwerze uruchamiającym kontenery
    sprawdź to przed zmianą — oba opierają się na dowiązaniach
    tworzonych w trakcie pracy.
  en: |
    The check allows the virtual machines account beside the administrators. It appears in the
    list after the installing of the virtualisation role, and the mending keeps it where it is
    there already.

    Links already standing go on working. The narrowing bears on the making of new ones rather
    than on the use of old.

    At a build server and at a server running containers, check this before the change - both
    rest on links made in the course of their working.
