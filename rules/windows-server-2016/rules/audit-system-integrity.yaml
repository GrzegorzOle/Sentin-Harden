id: win2016-audit-system-integrity

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > System
  title:
    pl: Inspekcja integralności systemu
    en: Audit system integrity
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje naruszenia integralności podsystemu zabezpieczeń:
    utratę zdarzeń przez przepełnienie kolejki, niepowodzenia sprawdzania
    podpisów oraz nieprawidłowości w wywołaniach do lokalnego urzędu
    zabezpieczeń.

    Najważniejsze z tych zdarzeń jest pierwsze i warto powiedzieć dlaczego.
    Kiedy zdarzeń przybywa szybciej, niż system zdąża je zapisywać, część
    z nich przepada. Bez tej podkategorii przepadają po cichu — w dzienniku
    nie ma luki, nie ma błędu, po prostu czegoś nigdy nie było. Z nią powstaje
    wpis mówiący, że zapis był niepełny i od kiedy.

    Jest to więc punkt, który odpowiada na pytanie, czy dziennikowi można ufać
    jako całości. Cały pozostały blok inspekcji opisuje, co zostało zapisane.
    Ten jeden mówi, czy zapisano wszystko.

    Druga część — niepowodzenia sprawdzania podpisów — dotyczy sytuacji,
    w której system odrzuca składnik z powodu nieprawidłowego podpisu. Bywa to
    objaw uszkodzenia pliku, ale bywa też objawem podmiany.

    Rejestruje się powodzenia i niepowodzenia. Zdarzeń jest na zdrowej maszynie
    tyle co nic.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zalanie
    dziennika tak, żeby zapis przepadał, bez zostawiania informacji o tym, że
    cokolwiek przepadło.
  en: |
    The subcategory records breaches of the security subsystem's integrity: events
    lost through a queue overflowing, failures of signature checking, and
    irregularities in calls to the local security authority.

    The first of these events matters most, and it is worth saying why. When events
    accrue faster than the system can write them, some are lost. Without this
    subcategory they are lost quietly - the log has no gap, no error, something
    simply never was. With it an entry arises saying the record was incomplete, and
    from when.

    It is therefore an item answering the question whether the log can be trusted as
    a whole. The whole rest of the audit block describes what was recorded. This one
    alone says whether everything was.

    The second part - failures of signature checking - concerns the system rejecting
    a component on account of a bad signature. That is at times a symptom of a
    damaged file, but at times a symptom of substitution.

    Successes and failures are both recorded. On a healthy machine there are next to
    no events.

    What an attacker gains while the item goes unmet: the flooding of the log so
    that the record is lost, without leaving word that anything was.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Na maszynie działającej poprawnie zdarzeń nie ma
    w ogóle — podkategoria milczy, dopóki coś nie pójdzie nie tak.

    Właśnie dlatego jest tania i warta włączenia bez namysłu. Każde zdarzenie
    w tej podkategorii jest sygnałem, a nie szumem, i nie ma tu problemu
    odfiltrowywania rutyny, bo rutyny nie ma.

    Jedyne, co warto wiedzieć: zdarzenia o utracie wpisów pojawią się dopiero
    wtedy, gdy inne podkategorie zaczną generować więcej, niż maszyna zdąża
    zapisać. Punkt ten wdraża się więc razem z pozostałymi, a nie zamiast nich
    — sam z siebie nie zapisze niczego.

    Czego to nie psuje: niczego. Podsystem zabezpieczeń działa tak samo,
    a zdarzenie powstaje wyłącznie przy nieprawidłowości.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". On a machine working properly there are no events
    at all - the subcategory is silent until something goes wrong.

    That is exactly why it is cheap and worth switching on without deliberation.
    Every event in this subcategory is a signal rather than noise, and there is no
    problem of filtering out routine, there being no routine.

    One thing only is worth knowing: events about lost entries will appear only once
    other subcategories begin generating more than the machine can write. This item
    therefore goes in together with the others rather than instead of them - by
    itself it will record nothing.

    What this does not break: nothing. The security subsystem works as before, and
    an event arises only at an irregularity.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — na maszynie działającej poprawnie nie powstaje żadne zdarzenie
      - Zdarzenia o utracie wpisów pojawią się dopiero wtedy, gdy inne podkategorie przekroczą wydolność zapisu
      - Podsystem zabezpieczeń działa tak samo, a zdarzenie powstaje wyłącznie przy nieprawidłowości
      - Włączenie tego punktu bez pozostałych reguł inspekcji nie zapisze niczego
    en:
      - No regression in the working - on a machine working properly no event arises at all
      - Events about lost entries will appear only once other subcategories outrun the writing capacity
      - The security subsystem works as before, and an event arises only at an irregularity
      - Switching this item on without the other audit rules will record nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — podkategoria milczy, dopóki coś nie pójdzie nie tak
    en:
      - No known contraindication - the subcategory is silent until something goes wrong
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9212-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9212-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9212-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9212-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9212-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-system-integrity

notes:
  pl: |
    Punkt jest odpowiednikiem inspekcji zmiany zasad inspekcji, tylko od innej
    strony. Tamten mówi, czy ktoś wyłączył zapis celowo. Ten mówi, czy zapis
    urwał się sam z powodu przeciążenia. Oba razem odpowiadają na pytanie
    o kompletność.

    Zdarzenie o utracie wpisów jest jedynym sposobem, żeby odróżnić dziennik
    pełny od dziennika, z którego wypadły zdarzenia. Bez tego pusty przedział
    czasu wygląda jak przedział, w którym nic się nie działo.

    Na maszynie z ciasnym dziennikiem i szeroką konfiguracją inspekcji jest to
    pierwszy punkt, który zacznie mówić. Warto to traktować jako wskazówkę
    o konfiguracji, a nie jako usterkę.
  en: |
    The item is the counterpart of the auditing of audit policy change, only from
    another side. That one says whether somebody switched recording off on purpose.
    This one says whether the record broke off by itself through overload. The two
    together answer the question of completeness.

    The event about lost entries is the only way of telling a full log from one
    events have fallen out of. Without it an empty span of time looks like a span in
    which nothing happened.

    On a machine with a tight log and a broad audit configuration this is the first
    item that will begin to speak. That is worth treating as a hint about the
    configuration rather than as a fault.
