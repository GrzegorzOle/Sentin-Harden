id: win2016-deny-rdp-logon-guests-local

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa logowania przez pulpit zdalny dla gości i kont lokalnych
    en: Remote desktop sign-in refused to guests and local accounts
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odmawia logowania przez pulpit zdalny dwóm grupom naraz: gościom
    i wszystkim kontom lokalnym.

    Druga połowa jest tu tą istotną i warto ją postawić na pierwszym miejscu.
    Odmowa dla kont lokalnych oznacza, że do tej maszyny nie zaloguje się zdalnie
    nikt, kto nie ma konta domenowego — a to zamyka najczęściej używaną drogę
    ruchu bocznego w sieci Windows.

    Mechanizm jest prosty. Hasło lokalnego administratora bywa na serwerach
    z czasów wdrożenia takie samo na kilku maszynach, bo tak było wygodniej.
    Napastnik, który zdobędzie je na jednej, ma je na wszystkich pozostałych
    i przechodzi między nimi pulpitem zdalnym, nie dotykając domeny i nie
    zostawiając śladu w kontrolerze.

    Kategoria wysoka, bo ta droga nie wymaga żadnej luki — wymaga tylko jednego
    powtórzonego hasła. Odmowa dla kont lokalnych przerywa ją nawet wtedy, gdy
    hasło jest znane.

    Na serwerze 2016 warto to ustawić ze szczególną uwagą, bo maszyny tego
    rocznika są zwykle starsze niż praktyka niepowtarzania haseł lokalnych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przejście na
    kolejne maszyny z jednym zdobytym hasłem lokalnym, kanałem, który wygląda
    jak zwykła praca administratora.
  en: |
    The item refuses remote desktop sign-in to two groups at once: guests and every
    local account.

    The second half is the material one here and is worth putting first. Refusing
    local accounts means that nobody without a domain account will sign in to this
    machine remotely - and that closes the most commonly used road for lateral
    movement in a Windows network.

    The mechanism is simple. On servers from the time of deployment the local
    administrator's password is sometimes the same on several machines, because
    that was more convenient. An attacker who obtains it on one holds it on all the
    others and moves between them by remote desktop, touching no domain and leaving
    no trace on the controller.

    The category is high, because this road needs no flaw - it needs only one
    repeated password. Refusing local accounts breaks it even where the password is
    known.

    On Server 2016 it is worth setting with particular care, because machines of
    this vintage are usually older than the practice of not repeating local
    passwords.

    What an attacker gains while the item goes unmet: passage to further machines
    with one local password obtained, by a channel that looks like an
    administrator's ordinary work.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedyna reguła tej grupy z taką
    klasą. Powód jest jeden: zmiana potrafi odciąć drogę wejścia na maszynę.

    Sprawdzić trzeba, czy na tę maszynę ktokolwiek loguje się zdalnie na koncie
    lokalnym. Typowe przypadki to serwer poza domeną, serwer w wydzielonej
    sieci, maszyna obsługiwana przez zewnętrznego dostawcę na koncie lokalnym
    oraz procedura awaryjna na wypadek niedostępności kontrolera domeny.

    Ostatni przypadek jest najważniejszy i najczęściej pomijany. Konto lokalne
    bywa jedyną drogą wejścia, kiedy domena nie odpowiada — a właśnie wtedy
    trzeba się na tę maszynę dostać. Po tej zmianie ta droga prowadzi wyłącznie
    przez konsolę.

    Dlatego przed zmianą warto mieć potwierdzony dostęp do konsoli: karty
    zarządzającej albo panelu wirtualizacji. Bez tego zmiana jest wykonalna, ale
    zostawia maszynę bez zapasowego wejścia.

    Czego to nie psuje: logowania kont domenowych przez pulpit zdalny, pracy
    przy konsoli, zarządzania zdalnego innymi kanałami ani udostępniania plików.

    Bez restartu, natychmiast odwracalne — o ile jest czym się zalogować.
  en: |
    The class is "needs planned rollout", and this is the only rule in the group
    with that class. There is one reason: the change can cut off the way into the
    machine.

    What has to be checked is whether anybody signs in to this machine remotely
    under a local account. The usual cases are a server outside the domain, a
    server in a separate network, a machine served by an outside supplier under a
    local account, and an emergency procedure for when the domain controller is
    unreachable.

    The last case is the most important and the most often overlooked. A local
    account is sometimes the only way in when the domain does not answer - and that
    is exactly when the machine has to be reached. After this change that way leads
    through the console alone.

    Before the change, therefore, it is worth having confirmed console access: a
    management card or the virtualisation panel. Without it the change is feasible
    but leaves the machine with no spare entrance.

    What this does not break: domain accounts signing in through remote desktop,
    work at the console, remote management by other channels, or file sharing.

    No restart, undone immediately - provided there is something to sign in with.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Logowanie zdalne na koncie lokalnym przestaje być możliwe, łącznie z kontem lokalnego administratora
      - Procedura awaryjna na wypadek niedostępności domeny przestaje działać przez pulpit zdalny i prowadzi już tylko przez konsolę
      - Zewnętrzny dostawca obsługujący maszynę na koncie lokalnym traci dostęp
      - Konta domenowe, praca przy konsoli i udostępnianie plików działają bez zmian
    en:
      - Remote sign-in under a local account stops being possible, including under the local administrator account
      - The emergency procedure for an unreachable domain stops working through remote desktop and leads through the console alone
      - An outside supplier serving the machine under a local account loses access
      - Domain accounts, work at the console and file sharing work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna stoi poza domeną i konto lokalne jest jedyną drogą logowania zdalnego
      - Nie potwierdzono dostępu do konsoli maszyny przez kartę zarządzającą albo panel wirtualizacji
    en:
      - The machine stands outside the domain and a local account is the only way of signing in remotely
      - Console access through a management card or the virtualisation panel has not been confirmed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '(?=.*S-1-5-32-546)(?=.*S-1-5-113)'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyRemoteInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    if (-not ($members -contains '*S-1-5-32-546')) { $members += '*S-1-5-32-546' }
    if (-not ($members -contains '*S-1-5-113')) { $members += '*S-1-5-113' }
    # Confirm console access before running this. A machine outside the domain, or
    # one reached in an emergency under a local account, loses its spare entrance.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyRemoteInteractiveLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyRemoteInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-log-on-through-remote-desktop-services

notes:
  pl: |
    Druga z wpisywanych grup obejmuje wszystkie konta lokalne, a nie tylko
    administratorów lokalnych. Jest to wybór szerszy i celowy: konto lokalne
    o niskich uprawnieniach też wystarcza do rozpoznania maszyny.

    Ta reguła jest najmocniejszym pojedynczym utrudnieniem ruchu bocznego
    w całej paczce i zarazem tą, która najłatwiej odcina administratora od
    maszyny. Obie te rzeczy są prawdziwe naraz i dlatego klasa jest tu
    najwyższa.

    Odmowa logowania lokalnego jest osobnym uprawnieniem i opisuje ją osobna
    reguła. Ta dotyczy wyłącznie sesji zdalnej; dostęp przy konsoli zostaje
    nietknięty i to on jest tu drogą zapasową.
  en: |
    The second of the groups written in covers every local account, not merely the
    local administrators. That is a wider choice and a deliberate one: a
    low-privilege local account is enough to reconnoitre a machine too.

    This rule is the single strongest obstacle to lateral movement in the whole
    pack and at the same time the one that most easily cuts an administrator off
    from a machine. Both are true at once, and that is why the class here is the
    highest.

    Refusing local sign-in is a separate right and a separate rule describes it.
    This one concerns the remote session alone; access at the console stays
    untouched and is the spare road here.
