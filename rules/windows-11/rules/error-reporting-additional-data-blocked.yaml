id: win11-error-reporting-additional-data-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Error Reporting
  title:
    pl: Dosyłanie danych uzupełniających do raportu o błędzie zablokowane
    en: Sending further data to a fault report blocked
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Zgłoszenie błędu idzie w dwóch krokach. Pierwszy to krótki opis awarii:
    nazwa programu, wersja, miejsce w kodzie. Drugi następuje wtedy, gdy
    producent na podstawie pierwszego uzna, że potrzebuje więcej — i wtedy
    maszyna dosyła dane uzupełniające.

    Zakres drugiego kroku jest ustalany po stronie odbierającej, nie na
    maszynie. Zwykle jest to zrzut pamięci procesu, który się wywalił.
    Zrzut pamięci zawiera to, co program akurat przetwarzał: treść dokumentu,
    zawartość formularza, poświadczenia, jeśli akurat były w pamięci, fragmenty
    danych z bazy. Nie jest to zamierzone — po prostu tak wygląda pamięć
    programu w chwili awarii.

    Dla bezpieczeństwa istotne jest, że to nie maszyna decyduje, co wyśle.
    Wysyła to, o co zostanie poproszona, a prośba przychodzi z zewnątrz.
    Punkt odbiera tę możliwość: pierwszy krok zostaje, drugi nie następuje
    nigdy.

    Nie jest to punkt zamykający drogę wejścia i benchmark stawia go w poziomie
    drugim. Chodzi o to, żeby dane z maszyny nie wychodziły w zakresie ustalanym
    poza nią.
  en: |
    A fault report goes in two steps. The first is a short description of the
    failure: the program's name, its version, the place in the code. The second
    follows when the maker, on the strength of the first, decides more is needed -
    and then the machine sends further data.

    The scope of the second step is settled on the receiving side, not on the
    machine. Usually it is a memory dump of the process that crashed. A memory dump
    holds what the program happened to be working on: a document's text, a form's
    contents, credentials if they happened to be in memory, fragments of data from a
    database. None of it is intended - that is simply what a program's memory looks
    like at the moment of a failure.

    What matters for security is that the machine does not decide what it sends. It
    sends what it is asked for, and the request comes from outside. The item takes
    that away: the first step stays, the second never happens.

    It is not an item closing a way in, and the benchmark places it at the second
    level. The point is that data should not leave the machine in a scope settled
    elsewhere.

disruption_description:
  pl: |
    Nic nie przestaje działać. Zgłaszanie błędów działa dalej, okna dialogowe
    wyglądają tak samo, a programy zachowują się po awarii bez zmian.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego i nie ma scenariusza, w którym użytkownik zauważy różnicę.

    Odczuwalne jest to wyłącznie po stronie diagnozowania awarii, i to nie
    na tej maszynie. Zgłoszenie bez zrzutu pamięci jest dla producenta
    materiałem uboższym, więc jeżeli akurat ten błąd miał zostać rozpoznany
    na podstawie zgłoszeń, to tej maszyny w tym rachunku zabraknie. Jest to
    koszt ponoszony zbiorowo.

    Zrzuty tworzone lokalnie na potrzeby własnej diagnostyki punkt nie dotyczy.
    Jest to osobny mechanizm i osobne ustawienie.

    Nie ma restartu.
  en: |
    Nothing stops working. Fault reporting carries on, the dialogue windows look the
    same, and programs behave after a failure unchanged.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no scenario in which the user notices a difference.

    It is felt only on the side of diagnosing failures, and not on this machine. A
    report without a memory dump is poorer material for the maker, so if this
    particular fault was to be recognised from reports, this machine will be missing
    from that reckoning. It is a cost borne collectively.

    Dumps created locally for one's own diagnostics are not touched by the item. That
    is a separate mechanism and a separate setting.

    There is no restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Zgłoszenie błędu przestanie być uzupełniane o zrzut pamięci na prośbę odbierającego
      - Zgłoszenia z tej maszyny stają się uboższym materiałem do rozpoznania przyczyny awarii
      - Zrzuty tworzone lokalnie na potrzeby własnej diagnostyki działają bez zmian
    en:
      - A fault report stops being supplemented with a memory dump at the receiver's request
      - Reports from this machine become poorer material for recognising a failure's cause
      - Dumps created locally for one's own diagnostics work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Trwa rozpoznawanie awarii prowadzone wspólnie z producentem oprogramowania
    en:
      - A failure is being investigated jointly with the software's maker
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
      $name = 'DontSendAdditionalData'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
    $name = 'DontSendAdditionalData'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontSendAdditionalData' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Ustawienie istnieje w dwóch odmianach — dla maszyny i dla użytkownika —
    pod tą samą nazwą wpisu, ale w innych gałęziach. Reguła czyta odmianę
    maszynową, bo tylko ona obowiązuje niezależnie od tego, kto jest zalogowany.

    Punkt nie wyłącza zgłaszania błędów. Jest osobne ustawienie, które to robi,
    i osobny punkt benchmarku. Wdrożenie tamtego czyni ten bezprzedmiotowym,
    ale nie odwrotnie.

    Nazwa gałęzi zawiera spacje. Jest to nazwa narzucona przez system i nie
    należy jej poprawiać na wyglądającą bardziej regularnie.
  en: |
    The setting exists in two variants - one for the machine and one for the user -
    under the same entry name but in different keys. The rule reads the machine
    variant, because only that one holds whoever is logged on.

    The item does not switch fault reporting off. There is a separate setting that
    does, and a separate item of the benchmark. Applying that one makes this one
    moot, but not the other way round.

    The key's name contains spaces. That name is imposed by the system and should not
    be corrected into one that looks more regular.
