id: win2016-online-identity-authentication-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uwierzytelnianie tożsamościami z usług sieciowych zabronione
    en: Authentication with identities from online services forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania maszynie przyjmować żądania uwierzytelnienia,
    w których strona przedstawia się tożsamością pochodzącą z usługi
    sieciowej, a nie z domeny ani z bazy lokalnej.

    Mechanizm, o który chodzi, powstał po to, żeby dwie maszyny nienależące
    do wspólnej domeny mogły się porozumieć bez zakładania kont po obu
    stronach. Zamiast wspólnego katalogu używa się wspólnej usługi
    zewnętrznej, która poświadcza tożsamość.

    Na serwerze w domenie jest to droga zbędna i dlatego niebezpieczna.
    Zbędna, bo domena robi dokładnie to samo, lepiej i z zapisem
    w dzienniku kontrolera. Niebezpieczna, bo omija katalog: uwierzytelnienie
    przeprowadza strona trzecia, a maszyna przyjmuje wynik.

    Znaczy to, że reguły ustawione w domenie — złożoność hasła, blokada
    konta, wygasanie, grupy — nie mają tu zastosowania. Tożsamość
    przedstawiona tą drogą nie przeszła przez nic, co organizacja
    ustawiła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    uwierzytelnienia się wobec tej maszyny tożsamością, nad którą
    organizacja nie ma kontroli i która nie podlega żadnej z jej zasad.
  en: |
    The setting forbids the machine to take in authentication requests in which the
    other side presents an identity coming from an online service rather than from the
    domain or the local base.

    The mechanism in question came about so that two machines not belonging to a common
    domain could come to terms without accounts being made at both ends. Instead of a
    common directory one uses a common outside service which vouches for an identity.

    On a server in a domain that road is needless and therefore dangerous. Needless,
    the domain doing exactly the same, better and with an entry in the controller's
    log. Dangerous, because it goes round the directory: a third party carries out the
    authentication and the machine takes in the result.

    That means the rules set in the domain - password complexity, account lockout,
    expiry, groups - do not apply here. An identity presented by that road has passed
    through nothing the organisation set up.

    What an attacker gains while the item goes unmet: a road of authenticating towards
    this machine with an identity the organisation has no control over and which falls
    under none of its policies.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest wąska i dotyczy
    maszyn poza domeną.

    W domenie mechanizm ten nie jest używany do niczego. Uwierzytelnianie
    między maszynami idzie mechanizmem domenowym i wdrożenie nie zmienia
    nic.

    Poza domeną bywa inaczej i tu trzeba spojrzeć. Grupa robocza,
    w której maszyny porozumiewają się bez wspólnego katalogu, może opierać
    się właśnie na tym mechanizmie — zwykle przy udostępnianiu plików albo
    przy połączeniach pulpitu zdalnego między maszynami nienależącymi do
    domeny.

    Objawem jest odmowa uwierzytelnienia przy próbie połączenia, więc
    przyczyna jest osiągalna, choć komunikat mówi raczej o odmowie dostępu
    niż o zasadzie.

    Na serwerze przyłączonym do domeny — a więc w przeważającej części
    przypadków — skutek jest żaden.

    Czego to nie psuje: uwierzytelniania domenowego, uwierzytelniania
    kontami lokalnymi, usług, sieci, dostępu do plików w domenie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check is narrow and concerns machines
    outside the domain.

    In a domain that mechanism is used for nothing. Authentication between machines
    goes by the domain mechanism and the rollout changes nothing.

    Outside a domain it is at times otherwise, and here one has to look. A workgroup in
    which machines come to terms without a common directory may rest on just that
    mechanism - as a rule at file sharing or at remote desktop connections between
    machines not belonging to a domain.

    The symptom is a refused authentication at an attempt to connect, so the cause is
    within reach, though the message speaks rather of denied access than of a policy.

    On a server joined to a domain - which is to say in the greater part of cases - the
    consequence is none.

    What this does not break: domain authentication, authentication with local
    accounts, services, the network, or access to files in the domain.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-desktop
    - legacy-authentication
  what_breaks:
    pl:
      - Maszyny w grupie roboczej porozumiewające się bez wspólnego katalogu mogą stracić połączenie, jeżeli opierały się na tym mechanizmie
      - Dotyczy to zwłaszcza udostępniania plików i pulpitu zdalnego między maszynami nienależącymi do domeny
      - Komunikat mówi o odmowie dostępu, a nie o zasadzie, więc powiązanie z regułą wymaga jednego kroku więcej
      - Uwierzytelnianie domenowe i kontami lokalnymi oraz dostęp do plików w domenie pozostają bez zmian
    en:
      - Machines in a workgroup coming to terms without a common directory may lose their connection if they rested on that mechanism
      - That touches above all file sharing and the remote desktop between machines not belonging to a domain
      - The message speaks of denied access rather than of a policy, so tying it to the rule takes one step more
      - Domain authentication, authentication with local accounts and access to files in the domain stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje poza domeną i porozumiewa się z innymi przy użyciu tożsamości z usługi sieciowej
      - Połączenia pulpitu zdalnego do tej maszyny pochodzą od maszyn spoza domeny i opierają się na tym mechanizmie
    en:
      - The machine works outside a domain and comes to terms with others using an identity from an online service
      - Remote desktop connections to this machine come from machines outside the domain and rest on that mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\pku2u'
      $name = 'AllowOnlineID'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\pku2u'
    $name = 'AllowOnlineID'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\pku2u'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowOnlineID' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-pku2u-authentication-requests-to-this-computer-to-use-online-identities

notes:
  pl: |
    Punkt domyka trójkę o tożsamościach spoza organizacji. Dwie pierwsze
    dotyczyły kont konsumenckich; ta dotyczy samego mechanizmu, którym
    tożsamość z zewnątrz może zostać poświadczona.

    Warto zaznaczyć, że reguła nie dotyczy tego, czy takie konto na maszynie
    jest. Dotyczy tego, czy maszyna przyjmie poświadczenie wystawione poza
    katalogiem — a to jest pytanie szersze i niezależne od kont lokalnych.

    Kategoria średnia opisuje rzeczywistą wagę. Droga jest realna, ale
    wymaga od napastnika tożsamości w usłudze zewnętrznej, którą ta maszyna
    uznaje, oraz osiągalności z sieci. Nie jest to droga pierwszego wyboru,
    ale jest to droga, która omija wszystko, co ustawiono w domenie —
    i dlatego nie jest niska.
  en: |
    The item shuts the three about identities from outside the organisation. The first
    two concerned consumer accounts; this one concerns the mechanism itself by which an
    identity from outside may be vouched for.

    Worth marking that the rule does not concern whether such an account is on the
    machine. It concerns whether the machine will take in a vouching issued outside the
    directory - and that is a wider question, independent of local accounts.

    The medium category describes the real weight. The road is real but calls for the
    attacker to hold an identity in an outside service this machine accepts, and for
    reachability from the network. It is no road of first choice, but it is a road that
    goes round everything set up in the domain - and so it is not a low one.
