id: win2025-consumer-cloud-content-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Funkcje konsumenckie z chmury wyłączone
    en: Consumer cloud features disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza funkcje konsumenckie pobierane z chmury: podpowiadane
    aplikacje, kafelki instalujące się same, propozycje treści w menu
    i na ekranie startowym.

    Kategoria średnia, a jej powodem nie jest to, że komuś wyświetla się
    reklama. Powodem jest to, co ten mechanizm potrafi zrobić: doinstalować
    na maszynie oprogramowanie, którego nikt nie zamawiał. Nie jest to
    propozycja do kliknięcia — część tych pozycji pojawia się sama,
    w tle, przy pierwszym zalogowaniu na nowym profilu.

    Na serwerze oznacza to oprogramowanie, którego nie ma w żadnym wykazie
    zatwierdzonym, nie jest objęte procesem łatania organizacji i nie było
    brane pod uwagę przy ocenie ryzyka tej maszyny. Trafia tam poza
    wszystkimi mechanizmami, którymi organizacja pilnuje, co na jej
    serwerach stoi.

    Drugi powód jest prostszy: żeby dobrać te treści, maszyna musi je
    pobrać, a więc nawiązać połączenie wychodzące i powiedzieć o sobie
    tyle, ile taki dobór wymaga. Serwer nie ma powodu prowadzić takiej
    rozmowy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: szansę, że
    na serwerze pojawi się oprogramowanie, o którym nikt nie wie, że tam
    jest — a więc i nikt go nie łata.
  en: |
    The item disables consumer features fetched from the cloud: suggested
    applications, tiles that install themselves, proposed content in the
    menu and on the start screen.

    The category is medium, and the reason is not that somebody sees an
    advertisement. The reason is what this mechanism is able to do: install
    software on the machine that nobody ordered. It is not a proposal to be
    clicked - some of these items appear by themselves, in the background,
    at the first sign-in on a new profile.

    On a server that means software present in no approved inventory,
    outside the organisation's patching process, and not taken into account
    when this machine's risk was assessed. It arrives there outside every
    mechanism by which the organisation keeps watch on what stands on its
    servers.

    The second reason is simpler: to choose this content the machine has to
    fetch it, and so to open an outbound connection and say as much about
    itself as such a choice requires. A server has no reason to hold that
    conversation.

    What an attacker gains while the item goes unmet: the chance that
    software appears on the server which nobody knows is there - and which
    therefore nobody patches.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i chcę postawić tu zastrzeżenie, które
    w wielu regułach bywa wymówką, a tutaj jest po prostu prawdą.

    Na wydaniu serwerowym większości tych funkcji nie ma. Nie ma sklepu
    w takiej postaci jak na stacji roboczej, nie ma kafelków
    dokładających się do menu, nie ma propozycji treści na ekranie
    startowym. Ta reguła w dużej części wpisze zasadę, która nie będzie
    miała na co działać — i dobrze, żeby ktoś to wiedział, zamiast
    zapisywać w sprawozdaniu zabezpieczenie, którego nie ma.

    Mimo to uważam ją za wartą zastosowania i mówię dlaczego. Zakres tych
    funkcji zmienia się między wydaniami systemu, a serwer stoi latami.
    Zasada zapisana raz działa także wtedy, gdy po aktualizacji pojawi się
    coś, czego dziś nie ma. To jest ten rodzaj reguły, której wartość leży
    w przyszłości, nie w stanie bieżącym.

    Czego to nie psuje: nie dotyczy oprogramowania zainstalowanego przez
    organizację, nie odbiera możliwości instalowania czegokolwiek ręcznie
    i nie wpływa na role serwera ani na usługi. Wyłącza wyłącznie
    doinstalowywanie samoczynne.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and I want to state a caveat here which in
    many rules serves as an excuse and here is simply true.

    On a server edition most of these features are not present. There is no
    store in the shape it takes on a workstation, no tiles adding themselves
    to the menu, no proposed content on the start screen. This rule will in
    large part write a policy that has nothing to act on - and it is as well
    that somebody knows it, rather than writing into a report a protection
    that is not there.

    I nevertheless consider it worth applying, and I say why. The scope of
    these features changes between system versions, and a server stands for
    years. A policy written once holds also when an update brings something
    that is not here today. This is the kind of rule whose value lies in the
    future rather than in the present state.

    What this does not break: it does not concern software installed by the
    organisation, does not take away the ability to install anything by
    hand, and does not affect server roles or services. It switches off
    self-installation alone.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - updates-and-servicing
  what_breaks:
    pl:
      - Na wydaniu serwerowym większości tych funkcji nie ma, więc zasada w dużej części nie będzie miała na co działać
      - Wartość reguły leży w przyszłości — serwer stoi latami, a zakres tych funkcji zmienia się między wydaniami systemu
      - Nie dotyczy oprogramowania zainstalowanego przez organizację ani możliwości instalowania czegokolwiek ręcznie
      - Nie wpływa na role serwera ani na usługi — wyłącza wyłącznie doinstalowywanie samoczynne
    en:
      - On a server edition most of these features are absent, so the policy will largely have nothing to act on
      - The rule's value lies in the future - a server stands for years and the scope of these features changes between system versions
      - It does not concern software installed by the organisation, nor the ability to install anything by hand
      - It does not affect server roles or services - it switches off self-installation alone
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym użytkownicy korzystają z aplikacji dostarczanych tą drogą
    en:
      - The machine is a terminal server where users rely on applications delivered by this route
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableWindowsConsumerFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableWindowsConsumerFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a server edition most of these features are absent today, so this
    # largely writes a policy for the future: the scope changes between system
    # versions and a server stands for years. What it stops is software
    # installing itself outside every inventory the organisation keeps.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWindowsConsumerFeatures' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Powodem kategorii nie jest to, że komuś wyświetla się reklama, tylko
    to, co ten mechanizm potrafi zrobić: doinstalować oprogramowanie,
    którego nikt nie zamawiał. Część pozycji pojawia się sama, w tle, przy
    pierwszym zalogowaniu na nowym profilu.

    Na serwerze oznacza to oprogramowanie spoza wykazu, poza procesem
    łatania i poza oceną ryzyka tej maszyny.

    Zastrzeżenie, które tu akurat jest prawdą, a nie wymówką: na wydaniu
    serwerowym większości tych funkcji nie ma. Reguła i tak jest warta
    zastosowania, bo zakres zmienia się między wydaniami, a serwer stoi
    latami — jej wartość leży w przyszłości, nie w stanie bieżącym.
  en: |
    The reason for the category is not that somebody sees an advertisement
    but what this mechanism is able to do: install software nobody ordered.
    Some items appear by themselves, in the background, at the first sign-in
    on a new profile.

    On a server that means software outside the inventory, outside the
    patching process and outside this machine's risk assessment.

    A caveat that here is true rather than an excuse: on a server edition
    most of these features are absent. The rule is worth applying anyway,
    because the scope changes between versions and a server stands for years
    - its value lies in the future rather than in the present state.
