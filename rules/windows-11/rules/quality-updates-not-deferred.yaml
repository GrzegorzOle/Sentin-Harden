id: win11-quality-updates-not-deferred

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Poprawki jakości instalowane bez opóźnienia
    en: Quality updates installed without delay
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Poprawki jakości to comiesięczny zestaw łat, w którym jadą poprawki
    bezpieczeństwa. Punkt każe zapisać wprost, że nie opóźnia się ich ani o dzień.

    Odstęp między wydaniem poprawki a jej wykorzystaniem liczy się dziś w dniach,
    nie w tygodniach. Opis podatności staje się jawny w chwili wydania łaty,
    a narzędzia wykorzystujące ją pojawiają się zaraz potem — opóźnienie
    o tydzień jest więc tygodniem, w którym maszyna jest podatna na coś, co
    napastnik ma już gotowe i o czym wie, gdzie szukać.

    Punkt jest lustrzany wobec opóźnienia aktualizacji funkcji i dopiero razem
    z nim ma sens. Nowe wydanie systemu czeka pół roku, bo jest ryzykowne.
    Poprawki idą od razu, bo ryzykowne jest ich nieinstalowanie. Rozdzielenie
    tych dwóch rzeczy jest całą treścią obu punktów.

    Zapisanie zera jest zabezpieczeniem przed decyzją, nie przed napastnikiem:
    wartość odziedziczona z narzędzia zarządzania albo ustawiona kiedyś doraźnie
    potrafi zostać na maszynie latami i nikt o niej nie wie.
  en: |
    Quality updates are the monthly bundle of patches in which security fixes ride.
    The item says to write down explicitly that they are not put off by even a day.

    The gap between a patch's release and its exploitation is measured today in days,
    not weeks. A vulnerability's description becomes public the moment the patch
    ships, and tools using it appear right afterwards - so a week's delay is a week
    in which the machine is open to something an attacker already has ready and knows
    where to look for.

    The item mirrors the delay on feature updates and only makes sense alongside it.
    A new release of the system waits half a year because it is risky. Patches go in
    at once, because not installing them is what is risky. Keeping those two apart is
    the whole content of both items.

    Writing down a zero guards against a decision rather than against an attacker: a
    value inherited from a management tool, or set ad hoc at some point, can sit on a
    machine for years with nobody aware of it.

disruption_description:
  pl: |
    Nic nie przestaje działać. Wartością wpisywaną jest zero, czyli brak
    opóźnienia — a brak opóźnienia jest tym, co obowiązuje na maszynie, na której
    nikt niczego nie ustawiał.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma okna
    serwisowego, nie ma scenariusza, w którym użytkownik cokolwiek zauważy.

    Odczuwalny jest wyłącznie tam, gdzie opóźnienie ustawiono celowo — na
    przykład po to, żeby poprawki najpierw trafiły na maszyny testowe. Wtedy
    wdrożenie tego punktu ten tryb pracy znosi, a maszyna zaczyna dostawać
    poprawki razem ze wszystkimi. Jest to zmiana zamierzona przez benchmark,
    ale sprzeczna z przyjętym u kogoś sposobem wdrażania poprawek, więc warto
    o niej wiedzieć przed zastosowaniem.
  en: |
    Nothing stops working. The value written is zero - no delay - and no delay is
    what holds on a machine where nobody set anything.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, no scenario in which the user notices anything.

    It is felt only where a delay was set on purpose - for instance so that patches
    reach test machines first. Applying this item then does away with that way of
    working, and the machine starts receiving patches along with everyone else. That
    is a change the benchmark intends, but one at odds with somebody's established
    way of rolling out patches, so it is worth knowing about before applying.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Nic nie przestaje działać; brak opóźnienia jest stanem obowiązującym bez żadnego ustawienia
      - Maszyna z celowo ustawionym opóźnieniem zacznie dostawać poprawki razem ze wszystkimi
    en:
      - Nothing stops working; no delay is the state that holds without any setting
      - A machine with a deliberately set delay starts receiving patches along with everyone else
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Poprawki trafiają najpierw na maszyny testowe i opóźnienie jest częścią tego trybu pracy
    en:
      - Patches reach test machines first and the delay is part of that way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch and the number of days. The item
      # is met only when the switch is set and the number is zero - the setting
      # written down and the delay none.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DeferQualityUpdates'
        $days = $item.'DeferQualityUpdatesPeriodInDays'
        if ($null -eq $switch -or $null -eq $days) { 'MISSING' }
        elseif ([int]$switch -ne 1) { 'NOT_SET' }
        elseif ([int]$days -ne 0) { 'OTHER ' + [int]$days }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path           = $path
      switch         = $item.'DeferQualityUpdates'
      switch_existed = ($null -ne $item.'DeferQualityUpdates')
      days           = $item.'DeferQualityUpdatesPeriodInDays'
      days_existed   = ($null -ne $item.'DeferQualityUpdatesPeriodInDays')
      key_existed    = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeferQualityUpdates' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DeferQualityUpdatesPeriodInDays' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferQualityUpdates' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferQualityUpdates' -ErrorAction SilentlyContinue
    }
    if ($b.days_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferQualityUpdatesPeriodInDays' -Value $b.days -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferQualityUpdatesPeriodInDays' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Punkt wygląda na pusty, bo wymaga wpisania wartości równej stanowi
    domyślnemu. Jego treścią jest jednak samo zapisanie: maszyna bez wpisu
    i maszyna z wpisem zachowują się tak samo, ale tylko o drugiej wiadomo, że
    opóźnienia nie ma z decyzji, a nie z przypadku.

    Zakres liczby dni to 0–30, a więc inny niż przy aktualizacjach funkcji.
    Reguła porównuje przez równość, bo dowolna wartość większa od zera jest
    niezgodnością, nie stopniowaniem.

    Wycofanie nie usuwa gałęzi — jest wspólna z pozostałymi ustawieniami
    aktualizacji.
  en: |
    The item looks empty, because it calls for writing a value equal to the default
    state. Its content, though, is the writing down itself: a machine without the
    entry and a machine with it behave the same, but only of the second is it known
    that the absence of a delay comes from a decision rather than by chance.

    The range for the number of days is 0-30, different from that for feature
    updates. The rule compares by equality, because any value above zero is a
    deviation, not a matter of degree.

    Rollback does not remove the key - it is shared with the remaining update
    settings.
