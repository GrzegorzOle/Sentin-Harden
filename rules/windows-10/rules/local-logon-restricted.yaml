id: win10-local-logon-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie lokalne ograniczone do administratorów i użytkowników
    en: The local signing in bounded to administrators and users
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo logowania przy maszynie do administratorów
    i grupy użytkowników.

    Logowanie lokalne jest wejściem najpełniejszym: daje pulpit, dostęp do
    urządzeń podłączonych do maszyny i możliwość uruchamiania programów
    z interfejsem. Konta, które nie mają służyć do pracy przy maszynie,
    nie powinny tej drogi mieć.

    Wartością jest odcięcie kont usługowych. Konto założone dla usługi
    albo dla zadania zaplanowanego ma hasło zapisane gdzieś
    w konfiguracji, bywa współdzielone i rzadko zmieniane. Napastnik, który
    je pozyska, zyskuje pulpit na maszynie tylko wtedy, gdy to konto może
    się lokalnie zalogować.

    Odnotowuję, że wykaz zawężony do samych administratorów spełnia
    wymaganie tak samo. Maszyna, przy której pracują wyłącznie
    administratorzy, nie jest niezgodna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pulpit na
    maszynie z poświadczeń konta usługowego albo gościa.
  en: |
    The setting bounds the right of signing in at the machine to the administrators and to the group of the users.

    The local signing in is the fullest way in: it gives a desktop, a way to the apparatus plugged into the
    machine and the running of programs with a face. Accounts that are not to serve for work at the machine ought
    not to have that road.

    The worth lies in the cutting off of service accounts. An account laid down for a service or for a task set in
    the timetable has its password written somewhere in a setting, is at times shared and seldom changed. An
    attacker who gets it wins a desktop upon the machine only where that account may sign in locally.

    I set down that a list narrowed to the administrators alone meets the requirement just as well. A machine at
    which none but administrators work is not out of compliance.

    What an attacker gains while the item goes unmet: a desktop upon the machine from the credentials of a service
    account or of a guest.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są konta
    logujące się przy tej maszynie poza dwiema wymienionymi grupami.

    Miejscem najczęstszym jest konto serwisowe dostawcy sprzętu albo
    oprogramowania, założone przy wdrożeniu i używane do pracy przy
    maszynie. Bywa ono poza grupą użytkowników, bo zakładający chciał je
    odróżnić. Po zmianie takie konto nie zaloguje się przy maszynie.

    Miejscem drugim są konta wbudowane pełniące rolę stanowiska
    współdzielonego: recepcja, hala produkcyjna, terminal magazynowy.
    Zwykle należą do grupy użytkowników, ale warto to sprawdzić, a nie
    założyć.

    Sprawdzenie polega na przeczytaniu wykazu przed zmianą i porównaniu go
    z listą osób faktycznie pracujących przy tej maszynie.

    Skutek jest widoczny dla użytkownika: przy próbie zalogowania pojawia
    się komunikat o braku prawa do logowania lokalnego. Jest to jeden
    z nielicznych komunikatów w tej rodzinie, który mówi wprost, o co
    chodzi.

    Skutek pojawia się przy następnym logowaniu. Sesja trwająca nie jest
    przerywana.

    Czego to nie psuje: dostępu przez sieć, udziałów plikowych, usług,
    zadań zaplanowanych, drukowania.
  en: |
    The class is "needs review", and the object of the review is the accounts signing in at this machine beyond
    the two groups named.

    The commonest place is the service account of a maker of gear or of software, laid down at the rollout and
    used for work at the machine. It stands at times outside the group of the users, whoever laid it down having
    wished to set it apart. After the change such an account will not sign in at the machine.

    The second place is built-in accounts bearing the part of a shared station: a reception, a floor of
    production, a terminal of a store. They belong commonly to the group of the users, but that is worth reviewing
    and not taking for granted.

    The review comes down to a reading of the list before the change and a setting of it beside the roll of the
    people who truly work at this machine.

    The consequence is plain to the user: at an attempt to sign in a message shows about a right of local signing
    in that is wanting. It is one of the few messages in this family that says outright what is meant.

    The consequence shows at the next signing in. A session at work is not broken off.

    What this does not break: the way in over the network, file shares, services, tasks set in the timetable, or
    printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Konto serwisowe dostawcy sprzętu albo oprogramowania nie zaloguje się przy maszynie
      - Konta wbudowane stanowiska współdzielonego przestaną działać, jeżeli są poza grupą użytkowników
      - Użytkownik zobaczy komunikat mówiący wprost o braku prawa do logowania lokalnego
      - Skutek pojawia się przy następnym logowaniu, a sesja trwająca nie jest przerywana
      - Dostęp przez sieć, udziały plikowe, usługi, zadania zaplanowane i drukowanie pozostają bez zmian
    en:
      - The service account of a maker of gear or of software will not sign in at the machine
      - Built-in accounts of a shared station will cease to work where they stand outside the group of the users
      - The user will see a message speaking outright of a right of local signing in that is wanting
      - The consequence shows at the next signing in, and a session at work is not broken off
      - The way in over the network, file shares, services, tasks set in the timetable and printing stay unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Przy maszynie pracują konta serwisowe dostawcy, umieszczone poza grupą użytkowników
      - Stanowisko jest współdzielone i działa na koncie wbudowanym spoza grupy użytkowników
    en:
      - At the machine work service accounts of a maker, set outside the group of the users
      - The station is shared and works upon a built-in account from outside the group of the users
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544,S-1-5-32-545|S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators and to the users. A list narrower than
    # that meets the item too.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeInteractiveLogonRight = *S-1-5-32-544,*S-1-5-32-545',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/allow-log-on-locally

notes:
  pl: |
    Reguła jest parą do punktu o odmowie logowania lokalnego i warto, żeby
    aplikacja pokazała je razem. Tamten wskazuje grupy, którym na pewno
    nie wolno; ten ustala zamknięty wykaz tych, którym wolno. Drugi jest
    mocniejszy, ale też droższy w sprawdzeniu.

    Argument wart zachowania dotyczy kont usługowych. Ich hasła żyją
    w plikach konfiguracyjnych, bywają współdzielone między maszynami
    i rzadko są zmieniane. Odebranie im pulpitu nie utrudnia niczego
    w pracy usługi, bo usługa loguje się innym mechanizmem — a napastnik
    traci najwygodniejsze wejście.

    Odnotowuję, że komunikat jest tu wyjątkowo czytelny. W większości
    punktów tej rodziny użytkownik widzi ogólną odmowę dostępu; tutaj
    system mówi wprost, jakiego prawa brakuje. Skraca to diagnozę
    i warto to wymienić, bo obniża realny koszt wdrożenia.
  en: |
    The rule is the pair of the item about the refusal of the local signing in, and it is well that the
    application show them together. That one names the groups that surely may not; this settles a shut list of
    those that may. The second is the stronger but also the dearer to review.

    The argument worth keeping touches service accounts. Their passwords live in files of settings, are at times
    shared between machines and seldom changed. The taking of a desktop from them makes nothing harder in a
    service's work, a service signing in by another mechanism - and the attacker loses the handiest way in.

    I set down that the message is here uncommonly plain. In most items of this family the user sees a general
    refusal of access; here the system says outright which right is wanting. That shortens the looking into it and
    is worth naming, it lowering the real cost of the rollout.
