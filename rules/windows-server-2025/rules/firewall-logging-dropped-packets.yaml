id: win2025-firewall-logging-dropped-packets

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Rejestrowanie pakietów odrzuconych włączone we wszystkich profilach
    en: Logging of dropped packets enabled on all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zaporze zapisywać w dzienniku połączenia, które
    odrzuciła, zamiast odrzucać je bez śladu.

    Zapora odrzucająca po cichu robi swoją pracę i nie zostawia z niej
    niczego. Wiadomo, że coś nie przeszło, dopiero wtedy, gdy ktoś to
    zgłosi — a ruch niepożądany nikt nie zgłasza. Dziennik zamienia
    odrzucenie w fakt, który da się odczytać po czasie.

    Na serwerze zapis ten jest wart więcej niż na stanowisku roboczym
    i to z dwóch powodów naraz. Serwer jest celem: ruch przychodzący,
    którego nikt się nie spodziewa, jest na nim regułą, a nie wyjątkiem,
    i to właśnie wykaz odrzuceń pokazuje, kto i czego na tej maszynie
    szuka. Po drugie, serwer jest maszyną, o której konfigurację pyta się
    po awarii — a wtedy pytanie brzmi zwykle „czy to zapora", i bez
    dziennika odpowiedzi nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    prowadzenia rozpoznania bez pozostawiania śladu. Skanowanie portów,
    próby połączenia do usług, których tu nie ma, i pukanie po kolei do
    zakresu adresów — wszystko to zostaje odrzucone i nie zapisane.

    Punkt nie blokuje ataku, tylko zwiększa jego wykrywalność, i dlatego
    kategoria jest średnia.
  en: |
    The setting has the firewall record in a log the connections it has refused, rather than
    refusing them with no trace.

    A firewall refusing quietly does its work and leaves nothing of it. That something did
    not pass is known only once somebody reports it - and unwanted traffic nobody reports.
    The log turns a refusal into a fact that can be read afterwards.

    On a server that record is worth more than at a working station, and for two reasons at
    once. A server is a target: inbound traffic nobody expects is the rule on it rather than
    the exception, and it is exactly the list of refusals that shows who is looking for what
    on this machine. Secondly, a server is a machine whose configuration is asked after once
    something has failed - and then the question is usually "is it the firewall", and with
    no log there is no answer.

    What an attacker gains while the item goes unmet: the means of carrying out
    reconnaissance while leaving no trace. Port scanning, attempts to connect to services
    that are not here, and knocking one by one through a range of addresses - all of it is
    refused and not recorded.

    The item blocks no attack but raises its detectability, and hence the category is
    medium.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie zostaje dodatkowo zablokowane ani przepuszczone. Zapora
    odrzuca dokładnie to samo, co odrzucała wcześniej — zaczyna to tylko
    zapisywać.

    Koszt jest dwojaki i oba jego składniki dotyczą dysku, nie działania.
    Pierwszy to miejsce: plik dziennika rośnie i na serwerze wystawionym
    do sieci rośnie szybko, bo ruchu odrzucanego jest tam dużo.
    Drugi to zapis: przy bardzo dużej liczbie odrzuceń dziennik generuje
    ruch na dysku systemowym, zwykle nieodczuwalny, ale wart policzenia
    na maszynie mocno obciążonej.

    Obu składników dotyczy osobny punkt o rozmiarze dziennika i to on
    przesądza, jak długo zapis przetrwa. Wdrożenie tego punktu bez
    powiększenia dziennika daje zapis obracający się w ciągu godzin.
  en: |
    The change has no known side effects and takes no break.

    Nothing extra is blocked or let through. The firewall refuses exactly what it refused
    before - it merely starts recording it.

    The cost is twofold and both its parts concern the disk rather than the working. The
    first is space: the log file grows, and on a server put up to the network it grows fast,
    since there is a great deal of refused traffic there. The second is the writing: at a
    very great number of refusals the log makes traffic on the system disk, usually
    imperceptible, but worth counting on a heavily loaded machine.

    Both parts are concerned by a separate item on the log's size, and it is that item which
    settles how long the record survives. Rolling this item out without enlarging the log
    gives a record that turns over within hours.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Brak znanych regresji — zapora odrzuca to samo, co odrzucała wcześniej
      - Plik dziennika zajmuje miejsce na dysku systemowym i na serwerze rośnie szybko
      - Przy bardzo dużej liczbie odrzuceń zapis obciąża dysk, zwykle nieodczuwalnie
      - Bez powiększenia dziennika zapis obraca się w ciągu godzin i nic nie daje
    en:
      - No known regressions - the firewall refuses the same as it refused before
      - The log file takes space on the system disk and on a server grows fast
      - At a very great number of refusals the writing loads the disk, usually imperceptibly
      - Without the log being enlarged the record turns over within hours and yields nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dysk systemowy nie ma zapasu miejsca na dziennik rosnący o kilkadziesiąt megabajtów
    en:
      - The system disk has no spare room for a log growing by a few dozen megabytes
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $silent = @($profiles | Where-Object { $_.LogBlocked -ne 'True' })
        if ($silent.Count -eq 0) { 'ALL_LOGGED' } else { 'SILENT_IN_' + ($silent.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_LOGGED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogBlocked |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogBlocked True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogBlocked $p.LogBlocked
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt czyta się razem z punktem o rozmiarze dziennika i wdraża przed
    nim, nie po. Rejestrowanie włączone przy rozmiarze domyślnym kosztuje
    zapis, a wiedzy nie daje — plik obraca się, zanim ktokolwiek do niego
    zajrzy, a w raporcie wygląda na wdrożone.

    Dziennik zapory jest plikiem tekstowym w katalogu systemowym, nie
    wpisem w dzienniku zdarzeń. Nie trafia więc sam z siebie tam, gdzie
    trafiają zdarzenia zabezpieczeń, i systemy zbierające dzienniki trzeba
    wskazać na niego osobno.

    Punkt dotyczy wyłącznie połączeń odrzuconych. Rejestrowanie połączeń
    nawiązanych jest osobnym ustawieniem w tym samym miejscu i dzieli
    z tym punktem ten sam plik oraz ten sam limit rozmiaru.
  en: |
    The item is read together with the item on the log's size and rolled out before it
    rather than after. Logging switched on at the default size costs the writing and yields
    no knowledge - the file turns over before anybody looks into it, and in the report it
    looks rolled out.

    The firewall's log is a text file in the system directory rather than an entry in the
    event log. So it does not of itself land where security events land, and log-gathering
    systems have to be pointed at it apart.

    The item concerns refused connections alone. Logging of connections made is a separate
    setting in the same place and shares with this item the same file and the same limit of
    size.
