id: win10-act-as-operating-system-none

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Działanie jako część systemu operacyjnego nieprzyznane nikomu
    en: Act as part of the operating system granted to nobody
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera wszystkim prawo do działania jako część systemu
    operacyjnego.

    Jest to najszersze uprawnienie w całym systemie i warto powiedzieć
    wprost, co oznacza. Proces, który je posiada, może podszyć się pod
    dowolnego użytkownika bez znajomości jego hasła — w tym pod konta,
    których w ogóle nie da się użyć do logowania.

    Uprawnienie to nie jest więc drogą do podniesienia praw. Jest już
    szczytem: kto je ma, jest systemem i nie potrzebuje niczego więcej.
    Wszystkie pozostałe zabezpieczenia maszyny stają się dla niego
    uprzejmą sugestią.

    W normalnie działającym systemie nie potrzebuje go nikt. Konto
    systemowe ma je z natury, spoza wykazu, a programy, które kiedyś tego
    prawa wymagały, pochodzą z czasów, gdy uwierzytelnianie wyglądało
    inaczej.

    Odnotowuję, że sprawdzenie rozróżnia brak wpisu i wpis pusty.
    Obie postaci znaczą to samo w skutkach, ale są to dwa różne stany
    maszyny i raport ma je oddawać wiernie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    stania się dowolnym użytkownikiem bez żadnego hasła.
  en: |
    The setting takes from everybody the right to act as part of the operating system.

    It is the widest right in the whole system, and it is worth saying outright what it means. A process holding
    it may take on the person of any user at all without knowing their password - including accounts that cannot
    be used for signing in at all.

    That right is therefore no road to a raising of rights. It is already the summit: whoever holds it is the
    system and needs nothing further. Every other guarding of the machine becomes to them a courteous suggestion.

    In a system working as it should nobody needs it. The system's own account holds it by nature, outside the
    list, and the programs that once called for that right come from a time when authentication looked otherwise.

    I set down that the check tells a missing entry from an empty one. Both shapes mean the same in their effects,
    but they are two different states of a machine and the report is to give them faithfully.

    What an attacker gains while the item goes unmet: the becoming of any user at all with no password whatever.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    W przeważającej większości maszyn wykaz jest pusty już przed zmianą,
    więc zapisanie go pustym nie zmienia nic. Tam, gdzie coś w nim stoi,
    warto spojrzeć, co to jest — bo jest to wpis rzadki i zwykle stary.

    Odnotowuję jedyny realny przypadek: starsze oprogramowanie
    uwierzytelniające, dodające własny sposób logowania. Takie programy
    potrafiły żądać tego prawa dla własnej usługi. Jeżeli coś takiego stoi
    na maszynie, odebranie prawa zatrzyma logowanie tą drogą.

    Skutek pojawia się przy następnym uruchomieniu usługi, która to prawo
    miała, a nie natychmiast. Proces już działający zachowuje swoje
    uprawnienia do końca życia.

    Sprawdzenie sprowadza się do przeczytania wykazu przed zmianą. Wykaz
    pusty znaczy, że zmiana jest zapisem stanu, a nie zmianą.

    Czego to nie psuje: logowania, usług systemowych, dostępu do plików,
    udziałów plikowych, drukowania.
  en: |
    The class is "no disruption".

    Upon the greater part of machines the list stands empty before the change, so the writing of it empty changes
    nothing. Where something stands in it, it is worth looking at what that is - it being a rare entry and
    commonly an old one.

    I set down the one real case: older software of authentication, adding a way of signing in of its own. Such
    programs could call for this right for a service of their own. Where something of the sort stands upon the
    machine, the taking away of the right will hold the signing in by that road.

    The consequence shows at the next running of a service that held the right, and not at once. A process already
    at work keeps its rights to the end of its life.

    The review comes down to a reading of the list before the change. An empty list means the change is a setting
    down of a state and not a change.

    What this does not break: logging on, the system's services, the way to files, file shares, or printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-authentication
  what_breaks:
    pl:
      - Starsze oprogramowanie uwierzytelniające, dodające własny sposób logowania, przestanie działać tą drogą
      - Skutek pojawia się przy następnym uruchomieniu usługi, która to prawo miała, a nie natychmiast
      - Proces już działający zachowuje swoje uprawnienia do końca życia
      - Na maszynie z pustym wykazem zmiana jest zapisem stanu, a nie zmianą
      - Logowanie, usługi systemowe, dostęp do plików, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Older software of authentication, adding a way of signing in of its own, will cease to work by that road
      - The consequence shows at the next running of a service that held the right, and not at once
      - A process already at work keeps its rights to the end of its life
      - Upon a machine with an empty list the change is a setting down of a state and not a change
      - Logging on, the system s services, the way to files, file shares and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi oprogramowanie uwierzytelniające, którego usługa wymaga tego prawa do działania
    en:
      - Upon the machine stands software of authentication whose service calls for this right to work at all
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTcbPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTcbPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTcbPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right goes to nobody at all, so the line is written empty. An empty line
    # is the setting; leaving the line out would keep whatever stood there before.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTcbPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTcbPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/act-as-part-of-the-operating-system

notes:
  pl: |
    Reguła otwiera blok o przywilejach i jest w nim najostrzejsza.
    Warto, żeby aplikacja pokazała ją na pierwszym miejscu, bo koszt
    wdrożenia jest przy niej niemal zawsze zerowy, a zysk największy
    w całym bloku.

    Argument wart postawienia wprost dotyczy tego, czym to prawo różni się
    od bycia administratorem. Administrator może wiele zmienić, ale robi to
    jako on sam i zostawia po sobie ślad pod własną nazwą. Proces
    z tym prawem nie musi niczego zmieniać — staje się kimkolwiek chce,
    a dziennik odnotowuje działania tej drugiej osoby.

    Odnotowuję rozróżnienie braku wpisu od wpisu pustego, bo bywa uznawane
    za drobiazg. Nie jest: maszyna, na której zasada została zapisana
    pusta, różni się od maszyny, na której nikt tej zasady nie dotknął.
    Pierwsza ma decyzję, druga ma wartość domyślną — i tylko pierwsza
    wytrzyma czyjąś późniejszą zmianę bez cichego powrotu do stanu
    sprzed niej.
  en: |
    The rule opens the block about privileges and is the sharpest in it. It is well that the application set it
    first, the cost of its rollout being almost always nought and the gain the greatest of the whole block.

    The argument worth putting outright touches how this right differs from being an administrator. An
    administrator may change much, but does so as themselves and leaves a trace behind under their own name. A
    process with this right need change nothing - it becomes whoever it likes, and the log sets down the doings of
    that other person.

    I set down the telling of a missing entry from an empty one, it being at times held a trifle. It is not: a
    machine upon which the policy was written empty differs from one upon which nobody touched the policy. The
    first has a decision, the second a default value - and only the first will bear somebody's later change
    without a quiet return to what stood before.
