id: win11-app-inventory-collector-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Zbieranie spisu zainstalowanego oprogramowania wyłączone
    en: Collecting an inventory of installed software switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Składnik zgodności aplikacji sporządza spis tego, co na maszynie
    zainstalowano: nazwy programów, wersje, pliki wykonywalne, sposób ich
    uruchamiania. Spis powstaje w tle i jest wysyłany producentowi systemu
    jako materiał do oceny, czy kolejne wydanie czegoś nie zepsuje.

    Problem nie leży w wysyłce, tylko w samym spisie. Jest to gotowa lista
    oprogramowania maszyny — dokładnie to, od czego zaczyna każdy, kto szuka
    drogi wejścia. Napastnik z dostępem do maszyny nie musi niczego
    wyliczać ani zaglądać w katalogi: czyta przygotowany wykaz wersji i od razu
    wie, który program jest nieaktualny i co da się na nim zrobić.

    Wartość spisu dla utrzymania zgodności aplikacji jest przy tym niewielka
    tam, gdzie i tak prowadzi się własną ewidencję oprogramowania. Wysyłka
    danych o zainstalowanych programach jest osobnym kosztem — mówi
    o organizacji więcej, niż wynika z samej listy nazw.

    Punkt wyłącza sporządzanie spisu. Mechanizmy zgodności aplikacji działają
    dalej; znika tylko ich część zbierająca dane.
  en: |
    The application compatibility component draws up a list of what has been
    installed on the machine: program names, versions, executables, the way they are
    started. The list is made in the background and sent to the system's maker as
    material for judging whether the next release will break something.

    The trouble lies not in the sending but in the list itself. It is a ready-made
    inventory of the machine's software - exactly what anyone looking for a way in
    starts from. An attacker with access to the machine need enumerate nothing and
    look into no directories: they read a prepared register of versions and know at
    once which program is out of date and what can be done with it.

    The list's worth for keeping applications compatible is meanwhile small wherever
    an inventory of software is kept anyway. Sending data about installed programs is
    a separate cost - it says more about an organisation than the list of names
    alone suggests.

    The item switches the list's compilation off. The application compatibility
    mechanisms carry on working; only the part of them that gathers data disappears.

disruption_description:
  pl: |
    Nic nie przestaje działać. Spis powstaje w tle, nie ma okna, nie ma
    powiadomienia i żaden program nie zachowuje się inaczej po jego wyłączeniu.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego, użytkownik nie zauważy niczego ani w dniu wdrożenia, ani
    później.

    Odnotować warto jedno: producent systemu przestaje dostawać z tej maszyny
    materiał o zgodności zainstalowanego oprogramowania. Nie zmienia to
    działania maszyny, ale zmienia to, na czym opiera się ocena, czy kolejne
    wydanie systemu nie zepsuje tego konkretnego programu. Jest to koszt
    ponoszony zbiorowo, a nie na tym stanowisku.

    Mechanizmy zgodności aplikacji — w tym dopasowywanie starszych programów do
    nowszego systemu — działają bez zmian. Punkt nie dotyczy ich, tylko
    zbierania danych.
  en: |
    Nothing stops working. The list is made in the background; there is no window, no
    notification, and no program behaves differently once it is switched off.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and the user notices nothing either on the day of the rollout
    or later.

    One thing is worth noting: the system's maker stops receiving material from this
    machine about the compatibility of the software installed on it. That does not
    change how the machine works, but it does change what the judgement rests on as
    to whether the next release will break this particular program. It is a cost
    borne collectively rather than at this station.

    The application compatibility mechanisms - including fitting older programs to a
    newer system - work unchanged. The item does not concern them, only the gathering
    of data.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Nic nie przestaje działać na maszynie; znika wyłącznie sporządzanie spisu w tle
      - Producent systemu przestaje dostawać z tej maszyny materiał o zgodności zainstalowanych programów
    en:
      - Nothing on the machine stops working; only the background compilation of the list disappears
      - The system's maker stops receiving material from this machine about the compatibility of installed programs
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna bierze udział w sprawdzaniu zgodności oprogramowania z nadchodzącym wydaniem systemu
    en:
      - The machine takes part in checking software compatibility with an upcoming system release
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'DisableInventory'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'DisableInventory'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableInventory' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/planning/compatibility-administrator-users-guide

notes:
  pl: |
    Gałąź zgodności aplikacji zbiera trzy osobne punkty benchmarku i każdy
    wyłącza inny sposób zbierania danych. Reguły są trzy, bo trzy są wpisy,
    ale wdrażanie ich pojedynczo nie ma sensu — dopiero razem zamykają
    sporządzanie materiału o oprogramowaniu tej maszyny.

    Wyłączenie spisu nie usuwa danych zebranych wcześniej. Punkt dotyczy
    zbierania nowych, a nie czyszczenia tego, co już powstało.

    Reguła nie sprawdza, czy zadanie zaplanowane odpowiadające za spis jest
    wyłączone. Rozstrzygający jest wpis w zasadach — zadanie i tak nie ma co
    zbierać, gdy wpis jest ustawiony.
  en: |
    The application compatibility key gathers three separate items of the benchmark,
    each switching off a different way of collecting data. There are three rules,
    because there are three entries, but rolling them out one at a time makes little
    sense - only together do they close off the compiling of material about this
    machine's software.

    Switching the list off does not remove data gathered earlier. The item concerns
    gathering new data, not clearing what has already been made.

    The rule does not check whether the scheduled task behind the list is disabled.
    The entry in the policies is what settles it - the task has nothing to gather
    anyway once the entry is set.
