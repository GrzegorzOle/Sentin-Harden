id: win2025-password-complexity-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Wymagania co do budowy hasła włączone
    en: Demands as to a password's make-up switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza sprawdzanie budowy hasła przy jego ustawianiu: hasło
    musi zawierać znaki z co najmniej trzech różnych rodzajów i nie może
    zawierać nazwy konta ani jego pełnej nazwy.

    Druga część tego wymagania jest w praktyce ważniejsza od pierwszej,
    a wspomina się o niej rzadziej. Hasło zawierające nazwę konta jest
    pierwszym, co sprawdza każde narzędzie zgadujące hasła — i na serwerze
    trafia zaskakująco często, bo konta usługowe bywają zakładane szybko,
    a ich nazwa jest jednocześnie najłatwiejszą do zapamiętania podpowiedzią.

    Wymaganie rodzajów znaków ma wartość mniejszą, niż się powszechnie
    sądzi. Poszerza zbiór, z którego napastnik musi zgadywać, ale robi to
    w sposób przewidywalny: wielka litera na początku, cyfra i wykrzyknik na
    końcu to wzorzec, który narzędzia znają.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła
    najprostsze z możliwych — jednowyrazowe, złożone z samych małych liter
    albo powtarzające nazwę konta. Na serwerze są to zwykle konta lokalne
    założone doraźnie, o których nikt nie pamięta.

    Punkt jest uzupełnieniem długości hasła, nie jej zamiennikiem. Długość
    daje więcej; ten punkt odcina przypadki skrajne.
  en: |
    The setting switches on the checking of a password's make-up when it is set: the
    password has to hold characters of at least three different kinds and may not hold the
    account's name nor its full name.

    The second part of that demand matters more in practice than the first, and is spoken
    of less often. A password holding the account's name is the first thing every
    password-guessing tool tries - and on a server it hits surprisingly often, since
    service accounts are sometimes set up in haste and their name is at the same time the
    easiest hint to remember.

    The demand as to kinds of characters has less value than is commonly held. It widens
    the set an attacker has to guess from, but does so in a foreseeable way: a capital at
    the start, a digit and an exclamation mark at the end is a pattern the tools know.

    What an attacker gains while the item goes unmet: the simplest possible passwords -
    single words, made of small letters alone, or repeating the account's name. On a server
    those are usually local accounts set up for the occasion, which nobody remembers.

    The item is a completion of a password's length rather than a substitute for it. Length
    gives more; this item cuts off the extreme cases.

disruption_description:
  pl: |
    Sprawdzenia wymagają procedury ustawiające hasła bez udziału człowieka.

    Hasła bieżące nie są unieważniane, więc w dniu wdrożenia nic nie
    przestaje działać. Skutek pojawia się przy pierwszej zmianie hasła.

    Na serwerze najczęstszym objawem jest zatrzymany skrypt. Skrypty
    zakładające konta generują hasła według własnej reguły, ustalonej
    dawniej i niezmienianej od tamtej pory. Jeżeli reguła ta daje hasła
    z dwóch rodzajów znaków, każde takie założenie konta zakończy się
    błędem — a komunikat rzadko mówi wprost, o który wymóg chodzi.

    Drugim przypadkiem są konta usługowe z hasłem zawierającym nazwę konta.
    Przy zmianie takie hasło przestanie być przyjmowane i procedura, która
    je odtwarzała, straci sens.

    Na serwerze członkowskim zasada obejmuje konta lokalne. Na kontrolerze
    domeny obejmuje wszystkie konta w domenie.

    Zmiana nie wymaga restartu.
  en: |
    Procedures setting passwords without a person's part need checking.

    Current passwords are not voided, so on the day of the rollout nothing stops working.
    The effect appears at the first password change.

    On a server the commonest symptom is a halted script. Scripts setting up accounts make
    passwords by a rule of their own, settled long ago and unchanged since. If that rule
    gives passwords of two kinds of characters, every such setting up of an account will
    end in an error - and the message rarely says outright which demand is meant.

    The second case is service accounts with a password holding the account's name. At a
    change such a password will stop being taken and the procedure that reproduced it will
    lose its sense.

    On a member server the policy takes in local accounts. On a domain controller it takes
    in every account in the domain.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypty generujące hasła według własnej reguły mogą przestać zakładać konta
      - Hasło zawierające nazwę konta przestaje być przyjmowane przy zmianie
      - Komunikat o odrzuceniu rzadko wskazuje, który wymóg nie został spełniony
      - Hasła bieżące nie są unieważniane i działają do czasu zmiany
    en:
      - Scripts making passwords by a rule of their own may stop setting up accounts
      - A password holding the account's name stops being taken at a change
      - The refusal message rarely says which demand was not met
      - Current passwords are not voided and work until they are changed
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zakładanie kont opiera się na skrypcie generującym hasła według reguły niezgodnej z tym wymaganiem
    en:
      - Setting up accounts rests on a script making passwords by a rule at odds with this demand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordComplexity\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^PasswordComplexity\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'PasswordComplexity'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordComplexity = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordComplexity = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/password-must-meet-complexity-requirements

notes:
  pl: |
    Wymaganie obejmuje dwie rzeczy naraz i warto je w raporcie rozróżniać,
    bo mają różną wagę: rodzaje znaków oraz zakaz zawierania nazwy konta.
    Druga z nich zamyka drogę prostszą i częściej wykorzystywaną.

    Punkt nie jest zamiennikiem długości hasła. Hasło ośmioznakowe
    spełniające wszystkie wymagania budowy jest słabsze niż
    czternastoznakowe niespełniające żadnego — i warto o tym pamiętać przy
    ustalaniu kolejności wdrożenia obu punktów.

    Zakres zasady zależy od roli serwera: na członkowskim obejmuje konta
    lokalne, na kontrolerze domeny — całą domenę.
  en: |
    The demand takes in two things at once and it is worth telling them apart in the
    report, since they carry different weight: kinds of characters, and the ban on holding
    the account's name. The second closes the simpler and more often used road.

    The item is no substitute for a password's length. An eight-character password meeting
    every demand of make-up is weaker than a fourteen-character one meeting none - and that
    is worth keeping in mind when the order of rolling out the two items is settled.

    The policy's reach depends on the server's role: on a member server it takes in local
    accounts, on a domain controller the whole domain.
