id: win11-logon-network-provider-notifications-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Powiadamianie dostawców sieciowych o logowaniu wyłączone
    en: Notifying network providers about logon switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Przy logowaniu system może powiadomić zainstalowanych dostawców sieciowych —
    czyli składniki obsługujące logowanie do sieci innych niż własna: klientów
    sieci firm trzecich, agentów logowania jednokrotnego, rozwiązania
    do podłączania zasobów przy starcie sesji. Powiadomienie nie jest samym
    sygnałem: razem z nim przekazywane są poświadczenia, którymi użytkownik się
    właśnie zalogował.

    Jest to mechanizm z czasów, kiedy stanowisko logowało się naraz do kilku
    niezależnych sieci i każda chciała tych samych danych. Dziś jest rzadko
    używany i rzadko zauważany, a przekazywanie hasła składnikowi trzeciej
    strony przy każdym logowaniu pozostaje.

    Dla napastnika jest to droga wygodna. Wystarczy zarejestrować własnego
    dostawcę sieciowego — do czego potrzeba uprawnień administratora, ale które
    zdobywa się wcześniej, a nie przy tym kroku — i poświadczenia każdego
    logującego się użytkownika przychodzą same, w postaci nadającej się do
    użycia, bez dotykania procesu odpowiadającego za bezpieczeństwo.
    Jest to sposób na utrzymanie się w systemie, a nie na wejście do niego.

    Wyłączenie powiadomień zamyka tę drogę u źródła: nie ma czego przechwycić,
    bo nic nie jest wysyłane.
  en: |
    At logon the system may notify the installed network providers - the components
    handling logon to networks other than its own: third-party network clients,
    single sign-on agents, solutions attaching resources at the start of a session.
    The notification is not the signal alone: along with it go the credentials the
    user has just logged on with.

    It is a mechanism from the days when a station logged on to several independent
    networks at once and each wanted the same details. Today it is rarely used and
    rarely noticed, while passing the password to a third party's component at every
    logon remains.

    For an attacker it is a convenient route. Registering a network provider of
    one's own is enough - which takes administrator rights, but those are gained
    earlier rather than at this step - and the credentials of every user logging on
    arrive of their own accord, in a usable form, without touching the process
    answerable for security. It is a way of staying in a system, not of getting into
    it.

    Switching the notifications off closes that route at the source: there is nothing
    to intercept, because nothing is sent.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie jest zainstalowany dostawca sieciowy
    firmy trzeciej, i jest to jedyne miejsce, w którym ten punkt boli.

    Na zwykłym stanowisku nie przestaje działać nic. Logowanie do domeny,
    podłączone dyski sieciowe i drukarki nie korzystają z tego mechanizmu —
    obsługuje je własny składnik systemu, którego punkt nie dotyczy.

    Inaczej wygląda to tam, gdzie zainstalowano klienta sieciowego firmy
    trzeciej albo agenta logowania jednokrotnego. Taki składnik przestanie
    dostawać poświadczenia przy logowaniu i zapyta o nie osobno albo po prostu
    nie zestawi połączenia. Objawem jest okno logowania pojawiające się tam,
    gdzie wcześniej wszystko działo się samo, albo zasób, który przestał się
    podłączać przy starcie sesji.

    Sprawdzenie jest proste: wystarczy zajrzeć, jacy dostawcy sieciowi są na
    maszynie zarejestrowani, i czy jest wśród nich coś spoza systemu.

    Nie ma restartu, ale zmiana obowiązuje od następnego logowania.
  en: |
    What needs checking is whether a third party's network provider is installed on
    the machine, and that is the only place this item hurts.

    On an ordinary station nothing stops working. Domain logon, attached network
    drives and printers do not use this mechanism - they are handled by the system's
    own component, which the item does not touch.

    It looks different where a third party's network client or a single sign-on agent
    has been installed. Such a component stops receiving credentials at logon and
    will either ask for them separately or simply fail to establish the connection.
    The symptom is a logon window appearing where everything used to happen by
    itself, or a resource that has stopped attaching at the start of a session.

    Checking is simple: look at which network providers are registered on the machine
    and whether anything among them comes from outside the system.

    There is no restart, but the change takes effect from the next logon.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Klient sieciowy firmy trzeciej przestanie dostawać poświadczenia przy logowaniu i zapyta o nie osobno
      - Agent logowania jednokrotnego oparty na tym mechanizmie przestanie zestawiać sesję samoczynnie
      - Zasoby podłączane przez dostawcę spoza systemu mogą nie podłączyć się przy starcie sesji
    en:
      - A third party's network client stops receiving credentials at logon and asks for them separately
      - A single sign-on agent resting on this mechanism stops establishing the session by itself
      - Resources attached by a provider from outside the system may fail to attach at the start of a session
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Na stanowisku działa klient sieciowy firmy trzeciej korzystający z poświadczeń logowania
      - Logowanie jednokrotne do systemu zewnętrznego opiera się na tym mechanizmie
    en:
      - A third party's network client using the logon credentials runs on the station
      - Single sign-on to an external system rests on this mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableMPR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableMPR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    Set-ItemProperty -Path $path -Name 'EnableMPR' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/secauthn/network-provider-api

notes:
  pl: |
    Nazwa wpisu w rejestrze jest krótsza niż nazwa ustawienia w edytorze zasad
    i łatwo o pomyłkę przy szukaniu. Rozstrzygająca jest nazwa wpisu.

    Gałąź jest wspólna z ustawieniami kontroli konta użytkownika i z kilkoma
    innymi wpisami, więc ani kopia zapasowa, ani wycofanie nie dotykają samej
    gałęzi — wyłącznie tej jednej wartości. Usunięcie gałęzi cofnęłoby
    kilkanaście niezwiązanych ustawień naraz.

    Reguła nie sprawdza, czy na maszynie jest zarejestrowany jakikolwiek
    dostawca sieciowy spoza systemu. Lista dostawców jest przesłanką przy ocenie
    skutków wdrożenia, ale nie wchodzi do samego sprawdzenia — punkt dotyczy
    ustawienia, a nie tego, kto z niego korzysta.

    Ustawienie nie występuje w wydaniach serwerowych. Przy przenoszeniu reguły
    na inną platformę trzeba to sprawdzić, zamiast zakładać zgodność.
  en: |
    The entry's name in the registry is shorter than the setting's name in the policy
    editor, and it is easy to mistake one for the other when searching. The entry's
    name is what settles it.

    The key is shared with the user account control settings and with several other
    entries, so neither the backup nor the rollback touches the key itself - only
    this one value. Removing the key would undo a dozen unrelated settings at once.

    The rule does not check whether any network provider from outside the system is
    registered on the machine. The list of providers is a premise when weighing the
    rollout's effects, but does not enter the check itself - the item concerns the
    setting, not who uses it.

    The setting is absent from server editions. When carrying the rule to another
    platform that has to be checked rather than assumed.
