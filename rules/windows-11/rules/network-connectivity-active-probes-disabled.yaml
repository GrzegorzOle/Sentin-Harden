id: win11-network-connectivity-active-probes-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Aktywne sprawdzanie dostępu do sieci wyłączone
    en: Active testing of network access switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Żeby rozstrzygnąć, czy maszyna ma dostęp do sieci, system wykonuje próbę:
    pobiera niewielki plik spod ustalonego adresu i sprawdza, czy wróciła
    spodziewana treść. Na tej podstawie rysuje ikonę stanu połączenia i decyduje,
    czy sieć uznać za pełnowartościową.

    Próba idzie zawsze pod ten sam adres i zawsze bez szyfrowania — inaczej
    nie dałoby się rozpoznać sieci wymagającej logowania przez stronę. Jest to
    więc połączenie przewidywalne co do celu, treści i chwili, a przy tym
    nieuwierzytelnione.

    Daje to dwie rzeczy naraz. Po pierwsze, maszyna ogłasza swoją obecność
    zawsze, gdy tylko podłączy się do jakiejkolwiek sieci — jeszcze zanim
    użytkownik cokolwiek zrobi. Po drugie, odpowiedź na tę próbę rozstrzyga,
    jak system zachowa się dalej: kto ją podrobi, ten decyduje, czy maszyna
    uzna sieć za otwartą, czy za wymagającą logowania, i może skierować
    użytkownika na własną stronę logowania.

    Punkt wyłącza próbę. Stan połączenia jest ustalany na podstawie samej
    konfiguracji sieci, bez pytania nikogo z zewnątrz.
  en: |
    To settle whether the machine has access to the network, the system runs a test:
    it fetches a small file from a fixed address and checks whether the expected
    content came back. On that footing it draws the connection's status icon and
    decides whether to count the network as a full one.

    The test always goes to the same address and always unencrypted - otherwise a
    network demanding a sign-in through a page could not be recognised. So it is a
    connection predictable in its destination, its content and its moment, and
    unauthenticated with it.

    That gives two things at once. First, the machine announces its presence whenever
    it attaches to any network at all - before the user does anything. Second, the
    answer to that test settles how the system behaves next: whoever forges it
    decides whether the machine counts the network as open or as demanding a sign-in,
    and can steer the user to a sign-in page of their own.

    The item switches the test off. The connection's state is settled from the
    network's configuration alone, without asking anyone outside.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy stanowiska nie łączą się z sieciami wymagającymi
    logowania przez stronę — bo właśnie tę obsługę punkt psuje.

    Sieć hotelowa, lotniskowa albo konferencyjna rozpoznaje się właśnie tą
    próbą i to ona powoduje, że strona logowania otwiera się sama. Po wdrożeniu
    nie otworzy się. Użytkownik zobaczy sieć wyglądającą na podłączoną
    i nieprzepuszczającą ruchu, a stronę logowania będzie musiał otworzyć sam,
    wpisując dowolny adres bez szyfrowania. Jest to do zrobienia, ale wymaga
    wiedzy, której nikt nie ma w chwili, gdy mu się śpieszy.

    Drugi skutek to ikona stanu sieci. Przestaje rozróżniać sieć z dostępem do
    internetu od sieci bez niego, więc traci część swojej wartości
    diagnostycznej. Programy pytające system o stan łączności mogą dostawać
    odpowiedź mniej dokładną.

    Sama łączność nie zmienia się w żaden sposób. Punkt dotyczy rozpoznawania
    stanu, a nie przepuszczania ruchu.

    Nie ma restartu.
  en: |
    What needs checking is whether the stations connect to networks demanding a
    sign-in through a page - because that is exactly the handling the item breaks.

    A hotel, airport or conference network is recognised by this very test, and it is
    what makes the sign-in page open by itself. After the rollout it will not open.
    The user sees a network that looks attached and passes no traffic, and will have
    to open the sign-in page themselves by typing any unencrypted address. It can be
    done, but it takes knowledge nobody has at the moment they are in a hurry.

    The second effect is the network status icon. It stops telling a network with
    internet access from one without, so it loses part of its diagnostic worth.
    Programs asking the system about connectivity may get a less precise answer.

    Connectivity itself does not change in any way. The item concerns recognising a
    state, not passing traffic.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Strona logowania w sieci hotelowej albo konferencyjnej przestanie otwierać się sama
      - Ikona stanu sieci przestanie odróżniać sieć z dostępem do internetu od sieci bez niego
      - Programy pytające system o stan łączności mogą dostawać mniej dokładną odpowiedź
      - Sama łączność i przepuszczanie ruchu nie zmieniają się
    en:
      - The sign-in page on a hotel or conference network stops opening by itself
      - The network status icon stops telling a network with internet access from one without
      - Programs asking the system about connectivity may get a less precise answer
      - Connectivity itself and the passing of traffic do not change
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Komputery przenośne regularnie łączą się z sieciami wymagającymi logowania przez stronę
      - Narzędzia diagnostyczne opierają się na rozróżnieniu sieci z dostępem do internetu i bez niego
    en:
      - Portable computers regularly connect to networks demanding a sign-in through a page
      - Diagnostic tools rest on telling a network with internet access from one without
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
      $name = 'NoActiveProbe'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    $name = 'NoActiveProbe'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoActiveProbe' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Jest to jeden z nielicznych punktów w tej paczce, w którym utwardzenie
    odbiera funkcję używaną w codziennej pracy poza biurem. Na stanowisku
    stacjonarnym koszt jest zerowy; na komputerze przenośnym bywa odczuwalny
    przy każdym wyjeździe. Ocena zależy więc od tego, jak organizacja pracuje,
    i jest to właściwy powód, dla którego benchmark stawia ten punkt w poziomie
    drugim.

    Adres używany do próby da się zmienić osobnymi wpisami w tej samej gałęzi.
    Wskazanie własnego serwera wewnętrznego jest rozwiązaniem pośrednim:
    zostawia rozpoznawanie stanu sieci, a zabiera przewidywalne połączenie na
    zewnątrz. Benchmark tego nie wymaga, ale warto o tym wiedzieć, rozważając
    odpuszczenie punktu.

    Wyłączenie próby nie wyłącza samej usługi rozpoznawania stanu sieci.
    Usługa działa dalej i opiera ocenę na konfiguracji karty.
  en: |
    This is one of the few items in this pack where hardening takes away a function
    used in everyday work outside the office. At a stationary station the cost is
    nil; on a portable computer it can be felt on every trip. The judgement therefore
    depends on how the organisation works, and that is the proper reason the
    benchmark places this item at the second level.

    The address used for the test can be changed by separate entries in the same key.
    Pointing it at one's own internal server is a middle way: it keeps the
    recognition of the network's state and removes the predictable connection
    outwards. The benchmark does not require it, but it is worth knowing when
    weighing whether to let the item go.

    Switching the test off does not switch off the network state service itself. The
    service carries on and bases its judgement on the adapter's configuration.
