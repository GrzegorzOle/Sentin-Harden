id: win2025-online-tips-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel
  title:
    pl: Pobieranie porad z sieci w ustawieniach wyłączone
    en: Fetching tips from the network in the settings switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza pobieranie z sieci treści pomocniczych wyświetlanych
    w oknie ustawień systemu.

    Kategoria niska, tak samo jak przy poradach systemowych, i z tego
    samego powodu: to jest tekst, nie mechanizm. Różnica leży gdzie
    indziej i jest na tyle ciekawa, że warto ją zapisać.

    Tamte porady pojawiają się same. Te pobierają się wtedy, gdy ktoś
    otworzy konkretną stronę ustawień — a więc połączenie wychodzące jest
    wywoływane czynnością administratora i niesie informację o tym, którą
    stronę otworzył. Na serwerze to znaczy: o której godzinie ktoś
    zaglądał do ustawień sieci, zapory albo kont.

    Nie przeceniam tego. Strumień jest wąski, a wniosek z niego mglisty.
    Uznaję jednak za niewłaściwe, żeby czynności administracyjne na
    serwerze wywoływały jakiekolwiek zapytania na zewnątrz — nie dlatego,
    że ktoś je przechwyci, tylko dlatego, że nikt ich nie zamawiał i nikt
    nie wie, kiedy zachodzą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    konkretnego. Zapisuję to jako porządek i tak to oceniam.
  en: |
    The item switches off the fetching from the network of helper content
    displayed in the system settings window.

    The category is low, just as with the system tips, and for the same
    reason: this is text, not a mechanism. The difference lies elsewhere and
    is interesting enough to be worth recording.

    Those tips appear by themselves. These are fetched when somebody opens a
    particular settings page - so the outbound connection is triggered by an
    administrator's action and carries information about which page they
    opened. On a server that means: at what hour somebody looked into the
    network, firewall or account settings.

    I do not overrate this. The stream is narrow and the conclusion to be
    drawn from it hazy. I do consider it wrong, though, for administrative
    actions on a server to trigger any queries outwards - not because
    somebody will intercept them, but because nobody ordered them and nobody
    knows when they occur.

    What an attacker gains while the item goes unmet: nothing in particular.
    I record this as good order and rate it as such.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jedna uwaga praktyczna, która oszczędzi
    komuś minuty zdziwienia.

    Po zmianie strony ustawień nadal się otwierają i nadal wszystko na nich
    działa. Znika wyłącznie blok z treścią pomocniczą, który na części
    stron zajmuje prawą kolumnę. Strona wygląda przez to ubożej i przy
    pierwszym spojrzeniu można pomyśleć, że coś się nie doładowało. Nie
    doładowało się celowo.

    Warto też wiedzieć, że ten punkt leży w innej gałęzi rejestru niż
    pozostałe reguły o podpowiedziach i porada systemowa nie ma z nim nic
    wspólnego poza tematem. To dwie różne drogi i trzeba zamknąć obie,
    jeżeli zależy na spójnym wyniku.

    Czego to nie psuje: samych ustawień, żadnego panelu, żadnej
    konfiguracji, żadnej usługi. Dokumentacja systemu pozostaje dostępna
    zwykłą drogą.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and one practical note that will save
    somebody a minute of puzzlement.

    After the change the settings pages still open and everything on them
    still works. All that disappears is the block of helper content which on
    some pages takes up the right-hand column. The page therefore looks
    barer, and at first glance one might think something failed to load. It
    failed to load on purpose.

    It is also worth knowing that this item lies in a different registry
    branch from the other rules about hints, and the system tip has nothing
    in common with it beyond the subject. These are two different roads and
    both have to be closed if a coherent result is wanted.

    What this does not break: the settings themselves, any panel, any
    configuration, any service. The system documentation stays available by
    the ordinary route.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Znika blok z treścią pomocniczą, który na części stron ustawień zajmuje prawą kolumnę
      - Strona wygląda ubożej i przy pierwszym spojrzeniu można pomyśleć, że coś się nie doładowało
      - Punkt leży w innej gałęzi rejestru niż reguła o poradach systemu — to dwie różne drogi i trzeba zamknąć obie
      - Same ustawienia, panele, konfiguracja i usługi działają bez zmian
    en:
      - The block of helper content that takes the right-hand column on some settings pages disappears
      - The page looks barer and at first glance one might think something failed to load
      - The item lies in a different registry branch from the system tips rule - two different roads, both to be closed
      - The settings themselves, the panels, the configuration and the services work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym treści pomocnicze w ustawieniach są częścią wsparcia użytkowników
    en:
      - The machine is a terminal server where helper content in the settings is part of the support given to users
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'AllowOnlineTips'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'AllowOnlineTips'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Unlike the system tips, this content is fetched when somebody opens a
    # particular settings page - so the connection is triggered by an
    # administrator's action. A different registry branch from the system tips
    # rule: both roads have to be closed for a coherent result.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowOnlineTips' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Różnica wobec porad systemowych warta zapisania: tamte pojawiają się
    same, te pobierają się, gdy ktoś otworzy konkretną stronę ustawień.
    Połączenie wychodzące jest więc wywoływane czynnością administratora
    i niesie informację o tym, którą stronę otworzył — na serwerze znaczy
    to, o której godzinie ktoś zaglądał do ustawień sieci, zapory albo
    kont.

    Nie przeceniam tego: strumień jest wąski, wniosek mglisty. Uznaję
    jednak za niewłaściwe, żeby czynności administracyjne na serwerze
    wywoływały zapytania, których nikt nie zamawiał i o których nikt nie
    wie, kiedy zachodzą.

    Uwaga praktyczna: strona ustawień będzie wyglądać ubożej. Nie
    doładowała się celowo.
  en: |
    A difference from the system tips worth recording: those appear by
    themselves, these are fetched when somebody opens a particular settings
    page. The outbound connection is therefore triggered by an
    administrator's action and carries which page they opened - on a server
    that means at what hour somebody looked into the network, firewall or
    account settings.

    I do not overrate this: the stream is narrow, the conclusion hazy. I do
    consider it wrong, though, for administrative actions on a server to
    trigger queries nobody ordered and whose timing nobody knows.

    A practical note: the settings page will look barer. It failed to load
    on purpose.
