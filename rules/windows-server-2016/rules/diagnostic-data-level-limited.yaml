id: win2016-diagnostic-data-level-limited

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Zakres wysyłanych danych diagnostycznych ograniczony
    en: Scope of diagnostic data sent limited
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza zakres danych, które system wysyła o sobie do
    producenta.

    Rozumowanie stojące za tym punktem nie dotyczy prywatności, tylko tego,
    co z tych danych da się odczytać. Dane diagnostyczne opisują maszynę:
    jej wersję, zainstalowane składniki, uruchamiane programy, występujące
    błędy. Zebrane razem układają się w opis, który dla kogoś szukającego
    drogi wejścia jest dokładnie tym, czego szuka.

    Nie chodzi przy tym o to, że producent tych danych użyje źle. Chodzi
    o to, że dane raz wysłane przestają być pod kontrolą wysyłającego,
    a serwer w organizacji nie ma powodu opowiadać o sobie na zewnątrz.

    Ustawienie ma kilka stopni. Najniższy nie wysyła nic; następny wysyła
    wyłącznie dane o bezpieczeństwie, potrzebne mechanizmom ochronnym
    samego systemu. Oba są dopuszczalne i wybór między nimi zależy od tego,
    czy na maszynie działają narzędzia korzystające z tego kanału.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: opis maszyny
    zbierany i wysyłany regularnie, bez udziału i wiedzy tego, kto ją
    obsługuje.
  en: |
    The setting limits the scope of the data the system sends about itself to its maker.

    The reasoning behind this item concerns not privacy but what can be read from those data.
    Diagnostic data describe the machine: its version, the components installed, the programs
    started, the errors that occur. Gathered together they compose a description which, to somebody
    looking for a road in, is exactly what they are looking for.

    The matter is not that the maker will use those data badly. It is that data once sent cease to
    be under the sender's control, and a server in an organisation has no reason to talk about
    itself outwardly.

    The setting has several degrees. The lowest sends nothing; the next sends solely data about
    security, needed by the system's own protective mechanisms. Both are admissible and the choice
    between them hangs on whether tools using that channel work on the machine.

    What an attacker gains while the item goes unmet: a description of the machine gathered and sent
    regularly, without the taking part or the knowledge of whoever attends it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy narzędzi, które z tego
    kanału korzystają.

    Trzy rzeczy warto ustalić przed wykonaniem. Pierwsza: czy stan
    załatania tej maszyny jest śledzony w chmurze producenta. Druga: czy
    narzędzie ochronne przekazuje tam próbki albo zgłoszenia. Trzecia: czy
    maszyna jest zarządzana usługą, która stan urządzeń czyta właśnie
    stamtąd.

    Objaw nieudanego wdrożenia jest szczególnie podstępny, bo wygląda na
    porządek. Maszyna nie przestaje działać — przestaje się pojawiać
    w raporcie. Po kilku tygodniach nikt już nie kojarzy jej zniknięcia ze
    zmianą ustawienia, a lista urządzeń krótsza o jedno wygląda tak samo jak
    lista poprawna.

    Stopień najniższy, nie wysyłający nic, bywa z tego powodu za daleko
    idący. Stopień wysyłający wyłącznie dane o bezpieczeństwie zostawia
    mechanizmy ochronne przy pracy i jest wyborem bezpieczniejszym tam,
    gdzie coś z tego kanału korzysta.

    Czego to nie psuje: pracy systemu, usług, sieci, aktualizacji
    pobieranych zwykłą drogą, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the tools that use that channel.

    Three things are worth establishing before execution. The first: whether this machine's patching
    state is tracked in the maker's cloud. The second: whether a protective tool passes samples or
    reports there. The third: whether the machine is managed by a service that reads the state of
    devices from just there.

    The symptom of a failed rollout is uncommonly insidious, looking as it does like good order. The
    machine does not stop working - it stops appearing in a report. After some weeks nobody ties its
    disappearance to a changed setting any longer, and a list of devices shorter by one looks the
    same as a right list.

    The lowest degree, sending nothing, is for that reason at times too far-reaching. The degree
    sending solely data about security leaves the protective mechanisms at work and is the safer
    choice where something uses that channel.

    What this does not break: the system's working, services, the network, updates fetched by the
    ordinary road, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - updates-and-servicing
    - remote-management
  what_breaks:
    pl:
      - Maszyna śledzona w chmurze producenta znika z raportu, nie przestając działać, więc zniknięcie wygląda na porządek
      - Narzędzie ochronne przekazujące próbki tym kanałem przestaje je przekazywać
      - Usługa zarządzająca urządzeniami czytająca stan z tego kanału przestaje widzieć maszynę
      - Po kilku tygodniach nikt nie kojarzy zniknięcia maszyny z listy ze zmianą tego ustawienia
      - Praca systemu, usługi, sieć i aktualizacje pobierane zwykłą drogą pozostają bez zmian
    en:
      - A machine tracked in the maker's cloud vanishes from the report without ceasing to work, so the vanishing looks like good order
      - A protective tool passing samples by this channel stops passing them
      - A service managing devices that reads their state from this channel ceases to see the machine
      - After some weeks nobody ties the machine's vanishing from the list to this setting's change
      - The system's working, services, the network and updates fetched by the ordinary road stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stan załatania tej maszyny jest śledzony w chmurze producenta i nie ma dla tego źródła zastępczego
      - Narzędzie ochronne działające na tej maszynie przekazuje próbki albo zgłoszenia tym kanałem
      - Maszyna jest zarządzana usługą czytającą stan urządzeń właśnie stamtąd
    en:
      - This machine's patching state is tracked in the maker's cloud and there is no source in its stead
      - A protective tool working on this machine passes samples or reports by this channel
      - The machine is managed by a service that reads the state of devices from just there
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'AllowTelemetry'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|1)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'AllowTelemetry'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero means nothing is sent. Where the patching state of this machine is
    # tracked in the maker's cloud, or a protective tool passes samples there,
    # check the required scope first - the machine can vanish from a report
    # without stopping working, which looks like good order.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowTelemetry' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Punkt otwiera blok o tym, co maszyna wysyła o sobie na zewnątrz i co po
    cichu stamtąd pobiera. Wszystkie reguły bloku łączy jedna cecha: opisują
    ruch, którego nikt nie zlecał i którego nieobecności nikt nie zauważy.

    Ta właściwość ma skutek praktyczny wart odnotowania. Reguły, których
    wdrożenie niczego nie psuje w sposób widoczny, są łatwe do wprowadzenia
    i trudne do rozliczenia. Jeżeli coś jednak zależało od tego kanału,
    objaw pojawia się tygodnie później i wygląda na zupełnie inną sprawę.

    Aplikacja powinna przy tym punkcie zadać pytanie o narzędzia, a nie
    poprzestawać na opisie stopni. Wybór między „nic" a „tylko dane
    o bezpieczeństwie" jest w praktyce całą treścią decyzji i nie wynika
    z benchmarku — wynika z tego, co na maszynie stoi.

    Odnotowuję, że audyt dopuszcza tu dwie wartości zamiast jednej.
    Jest to rzadkie w całym zestawie i celowe: obie odpowiadają świadomej
    decyzji, a wymuszanie niższej zamykałoby mechanizmy ochronne bez
    uzasadnienia po stronie ryzyka.
  en: |
    The item opens the block about what the machine sends out about itself and what it quietly fetches
    from there. All the block's rules share one feature: they describe traffic nobody ordered and whose
    absence nobody will notice.

    That property has a practical consequence worth noting. Rules whose rollout breaks nothing that
    shows are easy to bring in and hard to hold to account. If something did hang on that channel, the
    symptom appears weeks later and looks like an altogether different matter.

    The application should at this item ask about tools rather than stop at describing the degrees. The
    choice between "nothing" and "data about security only" is in practice the whole substance of the
    decision and does not follow from the benchmark - it follows from what stands on the machine.

    Worth noting that the audit admits here two values instead of one. That is rare in the whole set and
    is on purpose: both answer a knowing decision, and enforcing the lower would shut the protective
    mechanisms with no warrant on the side of risk.
