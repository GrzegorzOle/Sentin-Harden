id: win10-system-log-size

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > System
  title:
    pl: Maksymalny rozmiar dziennika systemowego
    en: The greatest size of the journal of the system
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby dziennik systemowy mieścił co najmniej
    trzydzieści dwa tysiące kilobajtów zapisów.

    Dziennik systemowy zbiera zdarzenia pochodzące od samego systemu
    i od jego sterowników: uruchomienia i zatrzymania usług, błędy
    urządzeń, zmiany konfiguracji sieci, problemy z dyskiem, przebieg
    startu i zamykania maszyny.

    Dla badania nieprawidłowości jest to dziennik najważniejszy z trzech.
    To w nim widać, że usługa ochrony przestała działać, że sterownik
    został załadowany albo że maszyna wystartowała w chwili, w której
    nikt jej nie uruchamiał.

    Rozmiar rozstrzyga, jak daleko wstecz da się to zobaczyć. Dziennik
    systemowy zapełnia się wolniej niż aplikacyjny, ale na maszynie
    z niesprawnym urządzeniem potrafi urosnąć w tempie kilkuset wpisów na
    godzinę — a wtedy historia skraca się do jednego dnia.

    Odnotowuję, że sprawdzenie przy braku zasady odczytuje rozmiar
    ustawiony wprost na dzienniku, więc maszyna ustawiona ręcznie jest
    oceniana według stanu faktycznego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: krótszy
    okres, z którego widać zatrzymanie usług i załadowane sterowniki.
  en: |
    The setting calls for the journal of the system to hold at least two and thirty thousand kilobytes of records.

    The journal of the system gathers happenings coming from the system itself and from its drivers: the starting
    and the halting of services, faults of apparatus, changes to the setting of the network, troubles with a disk,
    the course of the machine's start and of its shutting down.

    For the looking into a wrongness it is the weightiest of the three. In it is seen that the service of guarding
    has ceased to work, that a driver was loaded, or that the machine started at an hour when nobody started it.

    The size settles how far back that may be seen. The journal of the system fills more slowly than that of
    applications, but upon a machine with an unsound piece of apparatus it can grow at some hundreds of entries to
    the hour - and then the history shortens to a single day.

    I set down that the check, where no policy stands, reads the size set at the journal outright, so a machine set
    by hand is graded by the state as it truly is.

    What an attacker gains while the item goes unmet: a shorter span over which the halting of services and the
    loading of drivers may be seen.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana zwiększa plik dziennika na dysku systemowym o wielkość rzędu
    trzydziestu dwóch megabajtów.

    Odnotowuję, że dziennik systemowy bywa już powiększony ręcznie na
    maszynach, na których ktoś badał problem sprzętowy. Sprawdzenie
    odczyta wtedy wartość faktyczną i pokaże punkt jako spełniony, bo
    rozmiar większy od wymaganego jest zgodny.

    Miejscem wartym uwagi są maszyny z bardzo małym dyskiem systemowym.
    Tam warto policzyć miejsce przed zmianą, licząc wszystkie trzy
    dzienniki razem.

    Skutek pojawia się natychmiast, bez restartu i bez restartu usługi.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, startu
    maszyny, pracy sterowników, drukowania.
  en: |
    The class is "no disruption".

    The change makes the journal's file upon the system's disk greater by some two and thirty megabytes.

    I set down that the journal of the system stands at times already enlarged by hand upon machines where
    somebody looked into a trouble with the gear. The check will then read the value as it truly is and show the
    item as met, a size greater than the one called for being in compliance.

    The place worth notice is machines with a very small system disk. There it is worth reckoning the room before
    the change, counting all three journals together.

    The consequence shows at once, with no restart and no restart of the service.

    What this does not break: the writing of happenings, the reading of the journal, the machine's start, the work
    of drivers, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Plik dziennika systemowego na dysku urośnie o wielkość rzędu trzydziestu dwóch megabajtów
      - Na maszynie z bardzo małym dyskiem systemowym warto policzyć miejsce, licząc wszystkie trzy dzienniki razem
      - Dziennik powiększony wcześniej ręcznie zostanie pokazany jako spełniający punkt, bo rozmiar większy jest zgodny
      - Skutek pojawia się natychmiast, bez restartu maszyny i bez restartu usługi dziennika
      - Zapisywanie zdarzeń, odczyt dziennika, start maszyny, praca sterowników i drukowanie pozostają bez zmian
    en:
      - The file of the journal of the system upon the disk will grow by some two and thirty megabytes
      - Upon a machine with a very small system disk it is worth reckoning the room, counting all three journals together
      - A journal enlarged earlier by hand will be shown as meeting the item, a greater size being in compliance
      - The consequence shows at once, with no restart of the machine and no restart of the service of the journal
      - The writing of happenings, the reading of the journal, the machine s start, the work of drivers and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dysk systemowy jest przycięty do minimum i nie ma na nim zapasu na powiększenie dzienników
    en:
      - The system disk is pared to the least and holds no room to spare for the enlarging of the journals
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Where the policy value is absent the log still has a size in force, set at
      # the log itself. The effective state is read rather than the policy alone,
      # so a machine set by hand is not reported as unmeasured.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        $log = Get-WinEvent -ListLog System -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written in kilobytes, not in bytes - a size given in bytes
    # would be read as a log some thousand times larger than meant.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Reguła jest z trójki dzienników tą, której wartość dla badania
    nieprawidłowości jest największa. Warto, żeby aplikacja to
    powiedziała, bo trzy punkty o rozmiarze wyglądają na powtórzenie tego
    samego, a nie są.

    Argument wart zachowania dotyczy zawartości. W dzienniku systemowym
    widać zatrzymanie usługi ochrony i załadowanie sterownika — czyli dwa
    zdarzenia leżące na drodze niemal każdego poważnego ataku. Dziennik
    aplikacji tego nie pokaże, bo mówi o programach, a nie o systemie.

    Odnotowuję, że tempo zapełniania zależy tu od sprawności sprzętu.
    Maszyna z niesprawnym dyskiem albo niestabilnym sterownikiem zapełni
    dziennik w jeden dzień — i jest to dokładnie ta maszyna, przy której
    historia jest potrzebna najbardziej.
  en: |
    The rule is of the three journals the one whose worth for the looking into a wrongness stands highest. It is
    well that the application say so, three items about size looking like a repeating of one and the same, which
    they are not.

    The argument worth keeping touches the content. In the journal of the system are seen the halting of the
    service of guarding and the loading of a driver - which is to say two happenings lying upon the road of near
    every grave attack. The journal of applications will not show that, speaking of programs and not of the
    system.

    I set down that the pace of the filling hangs here upon the soundness of the gear. A machine with an unsound
    disk or an unsteady driver will fill the journal in a single day - and it is just that machine at which the
    history is needed most.
