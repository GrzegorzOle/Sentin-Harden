id: win2025-block-microsoft-accounts

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Logowanie kontem z usługi sieciowej dostawcy zablokowane
    en: Signing in with an account from the maker's online service blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zakładania na tej maszynie kont powiązanych
    z usługą sieciową dostawcy systemu i logowania się nimi.

    Konto takie jest tożsamością spoza organizacji. Hasło do niego
    zmienia się poza domeną, odzyskuje się je poza domeną i nikt
    w organizacji nie może go unieważnić. Dodane do administratorów na
    serwerze daje osobie prywatnej uprawnienia, których organizacja nie
    odbierze, bo nie ma czym.

    Rzecz nie jest teoretyczna. Droga, którą to się dzieje, prowadzi
    zwykle przez serwer wolno stojący, poza domeną — taki, który
    postawiono do jednego zadania i podpięto do niego konto prywatne,
    bo tak było wygodniej niż zakładać konto lokalne i pamiętać hasło.
    Serwer zostaje na lata, a wraz z nim tożsamość, której organizacja
    nie kontroluje.

    Druga rzecz to rozliczalność. Zapis w dzienniku wskazuje wtedy
    tożsamość zewnętrzną, której nie da się zestawić z wykazem
    pracowników — a zestawienie tych dwóch rzeczy jest podstawą każdego
    przeglądu uprawnień.

    Punkt nie dotyczy kont domenowych ani tożsamości organizacyjnych
    używanych do zarządzania chmurowego. Mowa wyłącznie o kontach
    prywatnych zakładanych w usłudze konsumenckiej dostawcy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość utrwalenia dostępu do serwera tożsamością spoza
    organizacji, której nikt w tej organizacji nie unieważni.
  en: |
    The setting forbids the making on this machine of accounts tied to the system maker's online
    service, and the signing in by them.

    Such an account is an identity from outside the organisation. Its password is changed outside
    the domain, recovered outside the domain, and nobody in the organisation can annul it. Added
    to the administrators on a server it gives a private person rights the organisation will not
    take back, having nothing to take them back with.

    The matter is not of theory. The road it comes by usually leads through a free-standing
    server, outside the domain - one put up for a single task and hung with a private account,
    that having been handier than making a local account and holding its password in mind. The
    server stays for years, and with it an identity the organisation does not govern.

    The second matter is accountability. A record in the log then names an outside identity that
    cannot be set beside the roll of employees - and the setting of those two things side by side
    is the ground of every review of rights.

    The item does not bear on domain accounts or on organisational identities used for management
    from the cloud. What is spoken of are private accounts made in the maker's consumer service
    alone.

    What an attacker gains while the item goes unmet: the means of making access to the server
    lasting by an identity from outside the organisation, which nobody in that organisation will
    annul.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tej maszynie nie istnieje już konto
    tego rodzaju, bo zablokowanie logowania odcięłoby je od dostępu.

    Obniżyłem klasę względem paczki stanowiska roboczego i trzeba
    powiedzieć dlaczego. Na stanowisku roboczym punkt bywa dotkliwy:
    człowiek loguje się kontem prywatnym, ma w nim swoje ustawienia
    i odcięcie go jest zmianą sposobu pracy. Na serwerze taki przypadek
    praktycznie nie występuje — serwery obsługuje się kontami domenowymi
    albo lokalnymi. Utrzymywanie wyższej klasy byłoby ostrożnością
    pozorną.

    Sprawdzenie zostaje z jednego powodu: przypadek rzadki nie znaczy
    żaden. Naprawa odmawia działania, gdy znajdzie na maszynie włączone
    konto tego rodzaju, bo zablokowanie logowania zamknęłoby drogę
    komuś, kto jej dziś używa. Jest to zabezpieczenie w kodzie, nie
    tylko ostrzeżenie w opisie.

    Zmiana nie dotyczy kont domenowych, kont lokalnych ani dołączenia
    maszyny do zarządzania chmurowego kontem organizacyjnym. Nie dotyka
    też pulpitu zdalnego ani zarządzania zdalnego — te działają po niej
    bez różnicy.

    Zmiana nie wymaga przerwy i wchodzi w życie natychmiast.
  en: |
    What needs checking is whether an account of this kind is already on the machine, the
    blocking of signing in being what would cut it off from access.

    I lowered the class against the working station's pack and must say why. At a working station
    the item is at times sore: a person signs in by a private account, holds their settings in
    it, and the cutting off is a change to how they work. On a server such a case practically does
    not arise - servers are tended by domain or local accounts. Keeping the higher class would be
    a seeming carefulness.

    The check stays for one reason: a rare case is not none. The mending refuses to act where it
    finds an enabled account of this kind on the machine, the blocking of signing in being what
    would shut the road to somebody using it today. That is a guard in the code and not a warning
    in the writing alone.

    The change does not bear on domain accounts, local accounts or the joining of the machine to
    management from the cloud by an organisational identity. Neither does it touch remote desktop
    or remote management - those work after it with no difference.

    The change takes no break and comes into force at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Konto powiązane z usługą sieciową dostawcy nie zaloguje się na tej maszynie ani nie zostanie założone
      - Konta domenowe i lokalne działają po zmianie bez różnicy
      - Dołączenie maszyny do zarządzania chmurowego tożsamością organizacyjną nie jest tym punktem dotknięte
      - Pulpit zdalny i zarządzanie zdalne działają bez zmiany
    en:
      - An account tied to the maker's online service will neither sign in on this machine nor be made
      - Domain and local accounts work after the change with no difference
      - The joining of the machine to management from the cloud by an organisational identity is untouched by this item
      - Remote desktop and remote management work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie istnieje włączone konto tego rodzaju i jest dziś używane do wejścia na serwer
    en:
      - An enabled account of this kind is on the machine and is used today to enter the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'NoConnectedUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'NoConnectedUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An account of this kind already in use is cut off from access by the
    # change, so the machine is read first and the change refused where one
    # is found enabled.
    $connected = @(Get-LocalUser -ErrorAction SilentlyContinue | Where-Object {
      $_.Enabled -and $_.PrincipalSource -eq 'MicrosoftAccount'
    })
    if ($connected.Count -gt 0) {
      throw "Enabled online-service accounts on this machine: $($connected.Name -join ', '). Blocking sign-in would lock them out - refusing."
    }
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'NoConnectedUser' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-block-microsoft-accounts

notes:
  pl: |
    Klasę obniżyłem względem paczki stanowiska roboczego do wymagającej
    sprawdzenia. Na serwerze przypadek, który czynił ten punkt dotkliwym
    na stanowisku, praktycznie nie występuje — serwery obsługuje się
    kontami domenowymi albo lokalnymi.

    Naprawa czyta maszynę przed zmianą i odmawia działania, gdy znajdzie
    włączone konto tego rodzaju. Zabezpieczenie leży w kodzie, nie tylko
    w opisie.

    Punkt nie dotyczy tożsamości organizacyjnych używanych do
    zarządzania chmurowego. Mowa wyłącznie o kontach prywatnych
    z usługi konsumenckiej dostawcy — na wolno stojącym serwerze to
    właśnie one bywają drogą utrwalenia cudzego dostępu.
  en: |
    I lowered the class against the working station's pack to one taking a check. On a server the
    case that made the item sore at a station practically does not arise - servers are tended by
    domain or local accounts.

    The mending reads the machine before the change and refuses to act where it finds an enabled
    account of this kind. The guard lies in the code and not in the writing alone.

    The item does not bear on organisational identities used for management from the cloud. What
    is spoken of are private accounts from the maker's consumer service alone - on a
    free-standing server it is those that at times become the road by which another's access is
    made lasting.
