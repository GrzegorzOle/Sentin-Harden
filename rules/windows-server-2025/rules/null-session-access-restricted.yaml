id: win2025-null-session-access-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Dostęp bez uwierzytelnienia do potoków i udziałów ograniczony
    en: Unauthenticated access to pipes and shares restricted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza to, co można osiągnąć na tej maszynie
    połączeniem bez uwierzytelnienia — czyli takim, przy którym druga
    strona nie podaje żadnego konta.

    Połączenie takie istnieje z powodów historycznych. Kiedyś służyło
    maszynom do wzajemnego rozpoznania się, zanim ustalono, kto z kim
    rozmawia. Dziś nie ma zastosowania, ale nadal daje się nawiązać,
    a przez nie dają się osiągnąć nazwane potoki i udziały wymienione
    na osobnych wykazach.

    Na serwerze punkt waży znacznie więcej niż na stanowisku roboczym
    i jest to różnica wynikająca wprost z roli. Stanowisko robocze
    bywa stroną łączącą się; serwer jest stroną, z którą się łączą,
    i to on te potoki oraz udziały wystawia. Połączenie bez
    uwierzytelnienia do stanowiska roboczego daje niewiele, bo niewiele
    tam wystawiono. Do serwera plików albo kontrolera domeny — daje
    wykaz udziałów, wykaz kont i wykaz zasad haseł.

    Rozpoznanie to jest krokiem pierwszym, nie ostatnim. Wykaz kont
    pozwala wybrać konto do próby haseł, a wykaz zasad haseł mówi,
    ile prób wolno podjąć, zanim konto się zablokuje — czyli jak
    prowadzić próbę, żeby nie zostawić po sobie śladu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    rozpoznanie zasobów i kont serwera bez podania jakiegokolwiek
    konta, a przez to punkt wyjścia do doboru hasła prowadzonego tak,
    żeby nie wywołać blokady.
  en: |
    The setting bounds what may be reached on this machine by a connection without
    authentication - that is, one where the other side names no account.

    Such a connection exists for historical reasons. It once served machines in knowing one
    another before it was settled who was talking to whom. Today it has no use, but it can still
    be set up, and through it named pipes and shares written on separate lists can be reached.

    On a server the item weighs far more than at a working station, and that difference follows
    straight from the part. A working station is at times the connecting side; a server is the
    side connected to, and it is the server that puts those pipes and shares out. A connection
    without authentication to a working station gives little, little being put out there. To a
    file server or a domain controller it gives the list of shares, the list of accounts and the
    list of password rules.

    That reconnaissance is a first step, not a last. The list of accounts lets an account be
    chosen for a trying of passwords, and the list of password rules says how many tries may be
    made before the account locks - that is, how to lead the trying so as to leave no trace.

    What an attacker gains while the item goes unmet: reconnaissance of the server's resources
    and accounts without naming any account at all, and thereby a starting point for a guessing
    of passwords led so as to raise no lockout.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy coś w tej sieci łączy się z serwerem bez
    podania konta, bo po zmianie przestanie otrzymywać to, po co
    przychodzi.

    W stanie domyślnym ograniczenie jest włączone na współczesnych
    wersjach systemu, więc na części serwerów naprawa nie zmienia
    niczego. Niezgodność bierze się zwykle z wyłączenia wprowadzonego
    kiedyś pod konkretną aplikację.

    Przypadkiem pierwszym są urządzenia sieciowe zapisujące na udziale:
    skanery, kopiarki i urządzenia pomiarowe. Wiele z nich łączy się
    bez uwierzytelnienia, bo tak zaprojektowano je wiele lat temu.

    Przypadkiem drugim jest oprogramowanie starsze, sięgające do
    nazwanego potoku serwera po dane konfiguracyjne. Bywa to
    oprogramowanie księgowe i przemysłowe, przeniesione przez kolejne
    wersje systemu bez zmiany sposobu łączenia.

    Przypadkiem trzecim jest monitorowanie. Część systemów
    monitorujących odczytuje liczniki wydajności połączeniem bez
    uwierzytelnienia, jeżeli tak je skonfigurowano.

    Objaw jest natychmiastowy, ale bywa mylący: urządzenie albo
    aplikacja zgłasza odmowę dostępu, co kieruje diagnozę na
    uprawnienia do udziału zamiast na sposób łączenia. Zdarza się przez
    to, że w poszukiwaniu przyczyny rozluźnia się uprawnienia udziału,
    co pogarsza stan zamiast go naprawić.

    Zmiana wymaga ponownego uruchomienia usługi serwera, a w praktyce
    wykonuje się ją przy restarcie maszyny.
  en: |
    What needs checking is whether anything in this network connects to the server without
    naming an account, since after the change it will stop getting what it comes for.

    In the default state the bound is on in present-day versions of the system, so on some
    servers the mending changes nothing. Non-compliance usually comes of a switching off brought
    in once for a particular application's sake.

    The first case is network devices writing to a share: scanners, copiers and measuring
    devices. Many of them connect without authentication, having been so designed many years
    ago.

    The second case is older software, reaching to the server's named pipe for configuration
    data. It is at times accounting and industrial software, carried over through version after
    version of the system with no change in how it connects.

    The third case is monitoring. Some monitoring systems read performance counters by a
    connection without authentication, where they were so set up.

    The symptom is immediate but at times misleading: the device or application reports a
    refusal of access, which points the diagnosis at rights on the share rather than at the way
    of connecting. It thus happens that in the seeking of a cause the share's rights are
    loosened, which worsens the state instead of mending it.

    The change takes a restarting of the server service, and in practice it is done at a restart
    of the machine.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - legacy-applications
    - printing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Skanery i kopiarki zapisujące na udziale bez podania konta przestaną zapisywać
      - Oprogramowanie starsze sięgające do nazwanego potoku serwera zgłosi odmowę dostępu
      - System monitorujący odczytujący liczniki bez uwierzytelnienia przestanie je otrzymywać
      - Objaw bywa mylący i kieruje diagnozę na uprawnienia udziału zamiast na sposób łączenia
    en:
      - Scanners and copiers writing to a share without naming an account will stop writing
      - Older software reaching to the server's named pipe will report a refusal of access
      - A monitoring system reading counters without authentication will stop getting them
      - The symptom is at times misleading and points the diagnosis at the share's rights
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na udział serwera zapisują urządzenia sieciowe łączące się bez podania konta
      - Na serwerze pracuje oprogramowanie starsze sięgające do nazwanego potoku bez uwierzytelnienia
      - Nie ustalono, w jaki sposób system monitorujący odczytuje liczniki tej maszyny
    en:
      - Network devices connecting without naming an account write to the server's share
      - Older software reaching to a named pipe without authentication works on the server
      - It has not been settled how the monitoring system reads this machine's counters
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'RestrictNullSessAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'RestrictNullSessAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictNullSessAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-restrict-anonymous-access-to-named-pipes-and-shares

notes:
  pl: |
    Punkt podniosłem względem paczki stanowiska roboczego z ryzyka
    średniego na wysokie. Powodem jest rola: serwer jest stroną
    wystawiającą potoki i udziały, więc połączenie bez uwierzytelnienia
    daje na nim nieporównanie więcej.

    Ograniczenie działa na wykazach potoków i udziałów dostępnych
    bez uwierzytelnienia. Puste wykazy są stanem właściwym; ten punkt
    sprawia, że wykazy te są w ogóle respektowane.

    Zmiana wymaga ponownego uruchomienia usługi serwera, więc cofnięcie
    również nie jest natychmiastowe.
  en: |
    I raised the item from medium risk to high against the working station's pack. The reason is
    the part: a server is the side putting pipes and shares out, so a connection without
    authentication gives on it beyond compare more.

    The bound works upon the lists of pipes and shares reachable without authentication. Empty
    lists are the fitting state; this item makes those lists heeded at all.

    The change takes a restarting of the server service, so the undoing is not immediate either.
