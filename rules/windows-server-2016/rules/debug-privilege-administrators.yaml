id: win2016-debug-privilege-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Debugowanie programów tylko dla administratorów
    en: Debugging programs restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do debugowania programów do grupy
    administratorów lokalnych.

    Nazwa myli, bo sugeruje narzędzie dla programistów. W praktyce to
    uprawnienie daje dostęp do pamięci dowolnego procesu w systemie,
    również procesów obsługujących uwierzytelnianie. A w pamięci tych
    procesów leżą poświadczenia: skróty haseł, bilety, tokeny sesji
    zalogowanych użytkowników.

    To jest dokładnie to uprawnienie, którego potrzebują narzędzia
    wyciągające hasła z pamięci — i jedyne, którego potrzebują. Reszta ich
    działania to odczyt pamięci procesu, czynność zwyczajna i niewymagająca
    żadnej luki.

    Kategoria krytyczna, bo skutek nie ogranicza się do tej maszyny.
    Poświadczenia wyjęte z pamięci serwera należą zwykle do kont
    o uprawnieniach szerszych niż ten serwer — administratorów domeny,
    kont usługowych działających na wielu maszynach, kont obsługi.

    Na serwerze 2016 rzecz waży więcej niż na stanowisku, bo serwer trzyma
    w pamięci poświadczenia wszystkich, którzy się na niego zalogowali,
    a loguje się na niego obsługa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poświadczenia
    każdego, kto na tej maszynie pracował od ostatniego uruchomienia,
    odczytane z pamięci bez wykorzystania żadnej luki.
  en: |
    The item limits the right to debug programs to the local administrators
    group.

    The name misleads, because it suggests a tool for programmers. In practice
    this right gives access to the memory of any process in the system, including
    the processes handling authentication. And in those processes' memory lie
    credentials: password hashes, tickets, the session tokens of signed-in users.

    This is exactly the right that tools extracting passwords from memory need -
    and the only one they need. The rest of what they do is reading a process's
    memory, an ordinary action requiring no flaw at all.

    The critical category applies because the effect does not stop at this
    machine. Credentials taken from a server's memory usually belong to accounts
    with rights wider than that server - domain administrators, service accounts
    running on many machines, administration accounts.

    On Server 2016 this weighs more than on a workstation, because a server holds
    in memory the credentials of everybody who has signed in to it, and it is the
    administrators who sign in.

    What an attacker gains while the item goes unmet: the credentials of everyone
    who worked on this machine since it last started, read from memory with no
    flaw exploited.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Domyślnie uprawnienie ma wyłącznie grupa
    administratorów lokalnych, więc na maszynie nietkniętej zmiana nie robi
    nic.

    Tam, gdzie na liście jest ktoś jeszcze, sprawdzenie dotyczy narzędzi
    diagnostycznych. Część oprogramowania monitorującego wydajność,
    profilerów aplikacji i narzędzi zbierających zrzuty pamięci prosi o to
    uprawnienie przy instalacji — i część z nich rzeczywiście go używa.

    Rozwiązanie zależy od narzędzia. Zwykle wystarczy uruchomić je na koncie
    należącym do administratorów zamiast na osobnym koncie usługowym, bo
    uprawnienie zostaje przy grupie, a nie znika z maszyny.

    Warto powiedzieć wprost, czego zmiana nie robi: nie blokuje
    debugowania przez administratora i nie odbiera możliwości zebrania zrzutu
    pamięci. Przesuwa tylko granicę tam, gdzie leżą inne uprawnienia
    administracyjne.

    Czego to nie psuje: pracy usług, logowania, dzienników zdarzeń ani
    diagnostyki wykonywanej z konta administracyjnego.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". By default the right belongs to the local
    administrators group alone, so on an untouched machine the change does
    nothing.

    Where somebody else is on the list, the check concerns diagnostic tools. Some
    performance monitoring software, application profilers and tools collecting
    memory dumps ask for this right at installation - and some of them genuinely
    use it.

    The answer depends on the tool. Usually it is enough to run it under an
    account belonging to the administrators rather than under a separate service
    account, because the right stays with the group and does not leave the
    machine.

    It is worth saying plainly what the change does not do: it does not block
    debugging by an administrator and takes away no ability to collect a memory
    dump. It merely moves the boundary to where the other administrative rights
    lie.

    What this does not break: services' work, signing in, the event logs, or
    diagnosis carried out from an administrative account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - accounts-and-passwords
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzie monitorujące działające na osobnym koncie usługowym traci dostęp do pamięci cudzych procesów
      - Profiler aplikacji i narzędzie zbierające zrzuty pamięci przestają działać spoza grupy administratorów
      - Debugowanie i zbieranie zrzutów z konta administracyjnego pozostaje możliwe
      - Usługi, logowanie i dzienniki zdarzeń działają bez zmian
    en:
      - A monitoring tool running under a separate service account loses access to other processes' memory
      - An application profiler and a tool collecting memory dumps stop working from outside the administrators group
      - Debugging and collecting dumps from an administrative account remains possible
      - Services, signing in and the event logs work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje narzędzie diagnostyczne wymagające tego uprawnienia na koncie spoza grupy administratorów i nie da się go przenieść
    en:
      - A diagnostic tool needing this right under an account outside the administrators group runs on the machine and cannot be moved
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDebugPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDebugPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDebugPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The group is written by its identifier rather than its name, so the change
    # works the same on an installation in any language.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeDebugPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDebugPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/debug-programs

notes:
  pl: |
    Lista pusta również uchodzi tu za zgodną i bywa wyborem rozsądniejszym
    niż lista z administratorami. Odebranie tego uprawnienia wszystkim
    utrudnia atak nawet po przejęciu konta administracyjnego — kosztem
    utrudnionej diagnostyki, którą trzeba wtedy prowadzić inaczej.

    Reguła zostawia administratorów, bo taki jest stan domyślny systemu
    i taka jest oczekiwana wartość benchmarku. Zawężenie listy do pustej
    jest decyzją idącą dalej i podejmuje się ją świadomie.

    Warto pamiętać, że samo ograniczenie tej listy nie chroni poświadczeń
    w pamięci. Chroni je osobna grupa ustawień i te punkty warto czytać
    razem.
  en: |
    An empty list also counts as compliant here and is sometimes the more
    sensible choice than a list holding the administrators. Taking the right from
    everybody makes an attack harder even after an administrative account has
    been taken - at the cost of harder diagnosis, which then has to be done
    another way.

    The rule leaves the administrators in place, because that is the system's
    default state and the benchmark's expected value. Narrowing the list to empty
    goes further and is a decision taken deliberately.

    It is worth remembering that limiting this list does not by itself protect
    credentials in memory. A separate group of settings does that, and those
    items are worth reading together.
