id: win10-anonymous-share-list-empty

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wykaz udziałów dostępnych bez poświadczeń pusty
    en: The roll of shares reachable without credentials empty
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie opróżnia wykaz udziałów, do których wolno sięgnąć połączeniem
    bez poświadczeń.

    Reguła jest siostrzana wobec poprzedniej, ale dotyczy rzeczy
    poważniejszej. Kanał wystawiony bez uwierzytelnienia daje dostęp do
    usługi; udział wystawiony bez uwierzytelnienia daje dostęp do plików.

    Każdy wpis na tym wykazie znosi dla wskazanego udziału całe
    uwierzytelnianie. Uprawnienia nadane na plikach obowiązują dalej,
    ale obowiązują wobec połączenia, które się nie przedstawiło — a takie
    połączenie występuje jako konto anonimowe, czyli trafia pod uprawnienia
    nadane szeroko.

    Rzecz, która czyni ten punkt trudniejszym do zauważenia niż otwarty
    udział: udział wymieniony na tym wykazie wygląda w konfiguracji
    udostępniania zupełnie normalnie. Zwolnienie nie leży przy udziale,
    tylko w osobnym wykazie, którego nikt nie ogląda przy przeglądzie
    uprawnień.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    plików w udziałach z tego wykazu, bez uwierzytelnienia i bez śladu
    wskazującego, kto czytał.
  en: |
    The setting empties the roll of shares which may be reached by a connection without credentials.

    The rule is sister to the foregoing one but touches a graver matter. A channel set out without
    authentication gives access to a service; a share set out without authentication gives access to files.

    Every entry on that roll lifts the whole of authentication for the share it names. The rights granted upon
    the files hold on, but they hold against a connection that has not named itself - and such a connection
    appears as the anonymous account, which is to say it falls under the rights granted broadly.

    A thing that makes this item harder to notice than an open share: a share named on that roll looks in the
    sharing configuration entirely ordinary. The release does not lie beside the share but in a separate roll,
    which nobody looks at while reviewing rights.

    What an attacker gains while the item goes unmet: access to the files in the shares on that roll, without
    authentication and without a trace saying who read them.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie polega na przeczytaniu wykazu,
    bo to on mówi wszystko.

    Wykaz pusty znaczy, że zmiana nie zrobi nic, i jest to przypadek
    najczęstszy na stanowisku roboczym.

    Wpis istniejący wymaga rozmowy, bo ktoś go dodał po coś. Powodem bywa
    udział dla urządzenia, które poświadczeń podać nie umie — skanera,
    drukarki sieciowej, sterownika przemysłowego. Po zmianie urządzenie
    przestanie dosięgać udziału i objaw będzie natychmiastowy.

    Rozwiązaniem właściwym jest konto dla urządzenia, nie przywrócenie
    wpisu. Warto, żeby aplikacja to powiedziała, bo droga najkrótsza
    prowadzi tu z powrotem do stanu wyjściowego.

    Odnotowuję przerwę, tak jak przy regule poprzedniej: zmiana wchodzi po
    restarcie usługi udostępniania plików, a restart zrywa otwarte
    połączenia.

    Czego to nie psuje: samych udziałów, które działają dalej dla połączeń
    uwierzytelnionych, uprawnień do plików, logowania, kont domenowych,
    drukowania, aplikacji.
  en: |
    The class is "needs review", and the review comes to reading the roll, that saying everything.

    An empty roll means the change will do nothing, and it is the commonest case at a workplace.

    An entry that is there calls for discussion, somebody having added it for something. The reason is at times a
    share for a device unable to give credentials - a scanner, a network printer, an industrial controller.
    After the change the device will cease reaching the share and the symptom will be immediate.

    The right answer is an account for the device, not the putting back of the entry. It is well that the
    application say so, the shortest road here leading back to the state one started from.

    I set down the break, as at the foregoing rule: the change takes hold after a restart of the file-sharing
    service, and the restart tears open connections down.

    What this does not break: the shares themselves, which work on for authenticated connections, the rights
    upon files, logging on, domain accounts, printing, or applications.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
  what_breaks:
    pl:
      - Urządzenie sięgające do udziału bez podawania poświadczeń przestaje go dosięgać natychmiast po wejściu zmiany
      - Restart usługi udostępniania plików, potrzebny do wejścia zmiany, zrywa otwarte połączenia do udziałów tej maszyny
      - Wykaz pusty oznacza, że zmiana nie robi nic, i jest to przypadek najczęstszy na stanowisku roboczym
      - Udziały pozostają czynne dla połączeń uwierzytelnionych, bo reguła zdejmuje zwolnienie, a nie cofa udostępnienie
      - Uprawnienia do plików, logowanie, konta domenowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A device reaching a share without giving credentials ceases reaching it at once when the change takes hold
      - Restarting the file-sharing service, needed for the change to take hold, tears down open connections to this machines shares
      - An empty roll means the change does nothing, and it is the commonest case at a workplace
      - The shares stay open for authenticated connections, the rule taking away a release and not undoing a sharing
      - The rights upon files, logging on, domain accounts, printing and applications stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z udziału na tym wykazie korzysta urządzenie, które poświadczeń podać nie umie, a konta mu jeszcze nie założono
      - Nie ma okna serwisowego na restart usługi udostępniania plików, a połączeń do udziałów nie wolno zrywać
    en:
      - A device unable to give credentials uses a share on that roll and no account has yet been made for it
      - There is no service window for a restart of the file-sharing service and connections to the shares may not be torn down
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a
      # list with nothing on it mean the same thing here - no share is reachable
      # anonymously - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'NullSessionShares'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'EMPTY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'NullSessionShares'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = @($current)
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Emptying the roll does not unshare anything - it takes away the leave to
    # reach the share without authenticating. The file-sharing service reads the
    # roll at its start, so the change takes hold once it has been restarted.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NullSessionShares' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string[]]@($b.value)) -Type MultiString
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-shares-that-can-be-accessed-anonymously

notes:
  pl: |
    Reguła jest w tym bloku najdotkliwsza w skutkach niezgodności, bo
    dotyczy plików, a nie rozpoznania. Warto, żeby aplikacja pokazywała
    nazwy udziałów z wykazu w wyniku sprawdzenia, bo to one rozstrzygają
    o wadze konkretnego przypadku.

    Argument wart postawienia dotyczy widoczności. Udział z tego wykazu
    wygląda w konfiguracji udostępniania normalnie, a zwolnienie leży
    gdzie indziej. Przegląd uprawnień do udziałów tego nie wykryje i właśnie
    dlatego punkt należy do tych, które audyt wnosi realnie.

    Odnotowuję, że droga najkrótsza po awarii prowadzi tu z powrotem do
    stanu wyjściowego, bo przywrócenie wpisu jest łatwiejsze niż założenie
    urządzeniu konta. Aplikacja, która postawi tę alternatywę wprost przy
    opisie skutków, uchroni kogoś przed cofnięciem utwardzenia „na chwilę".
  en: |
    The rule is in this block the gravest in the consequences of a mismatch, touching files rather than
    reconnaissance. It is well that the application show the shares' names from the roll in the check's outcome,
    they settling the weight of the case at hand.

    The argument worth putting touches visibility. A share on that roll looks ordinary in the sharing
    configuration while the release lies elsewhere. A review of the rights upon shares will not find it, and for
    just that the item is among those an audit truly brings.

    I set down that the shortest road after a fault leads here back to the state one started from, putting the
    entry back being easier than making the device an account. An application that puts that choice outright
    beside the description of consequences will keep somebody from undoing the hardening "for a moment".
