id: win2025-defender-scan-archives

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan
  title:
    pl: Skanowanie zawartości archiwów
    en: Archive contents scanned
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt każe zaglądać do środka archiwów zamiast poprzestawać na
    samym pliku archiwum. Bez tego spakowanie narzędzia wystarcza, żeby
    przeszło przez skanowanie pełne — a spakowanie jest czynnością
    darmową.

    Zostawiam kategorię średnią, bo mechanizm nie zamyka drogi. Plik
    wyjęty z archiwum i tak zostanie obejrzany w chwili zapisu przez
    ochronę w czasie rzeczywistym. Ten punkt zmienia moment rozpoznania,
    a nie to, czy w ogóle nastąpi: pozwala zobaczyć rzecz, która leży na
    dysku i czeka, zamiast dopiero wtedy, gdy ktoś ją wypakuje.

    Na serwerze przesuwa to wagę w stronę, którą warto nazwać. Serwer
    jest miejscem, gdzie archiwa nie przechodzą — one tam mieszkają.
    Kopie zapasowe, paczki wdrożeniowe, zbiory przekazane przez inne
    systemy, składnice dokumentów. Rzecz spakowana i odłożona na serwer
    potrafi tam przeleżeć rok, zanim ktokolwiek ją otworzy, i przez ten
    rok jest niewidoczna dla skanowania pełnego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce
    do odłożenia narzędzia na później — widoczne dla skanowania dopiero
    w chwili, gdy będzie już potrzebne.
  en: |
    The item bids the looking inside of stores rather than the stopping at the file of the store
    itself. Without it the packing of a tool is enough for it to go through a full searching - and
    the packing is an act that costs nothing.

    I leave the category middling, the working shutting no road. A file taken out of a store will be
    looked at anyway at the moment of its writing by the guard in real time. This item alters the
    moment of the knowing and not whether it comes to pass at all - it lets a thing be seen that
    lies on the disk and waits, instead of only when somebody unpacks it.

    On a server that shifts the weight in a way worth naming. A server is the place where stores
    pass not through - they dwell there. Keepings of copies, bundles for rolling out, sets handed
    over by other systems, storehouses of documents. A thing packed and laid aside onto a server can
    lie there a year before anyone opens it, and through that year it is unseen by the full
    searching.

    What an attacker gains while the item goes unmet - a place to lay a tool aside for later, seen
    by the searching only at the moment it is already needed.

disruption_description:
  pl: |
    Podnoszę klasę do „wymaga sprawdzenia", choć dla stacji roboczej ta
    reguła idzie hurtem. Powód jest wprost proporcjonalny do tego, co
    na serwerze leży.

    Skanowanie pełne zaczyna rozpakowywać każde archiwum, jakie znajdzie
    na dysku. Na stacji roboczej jest ich kilkadziesiąt. Na serwerze
    plików bywa, że archiwa to większość zajętego miejsca, a na serwerze
    kopii zapasowych — praktycznie całość. Skanowanie, które trwało
    dwie godziny, potrafi wtedy nie skończyć się przed rankiem.

    Skutek jest łagodny w treści i nieprzyjemny w formie. Nic się nie
    psuje i nic nie zostaje zablokowane. Po prostu zadanie nocne wchodzi
    w godziny pracy maszyny i zabiera dyskowi przepustowość wtedy, gdy
    jest potrzebna do czego innego.

    Sprawdzenie sprowadza się więc do jednego: sprawdź, ile czasu
    zajmuje dziś skanowanie pełne i ile miejsca na tej maszynie zajmują
    archiwa. Jeżeli to serwer kopii zapasowych, właściwą odpowiedzią
    jest wyłączenie dla składnicy kopii — zbiór już zapisanych kopii
    i tak był oglądany w chwili powstawania.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    I raise the class to "needs checking", though for a workstation this rule goes in bulk. The
    ground stands in straight measure to what lies on the server.

    A full searching begins to unpack every store it finds on the disk. On a workstation there are
    some tens of them. On a server of files it happens that stores are the greater share of the room
    taken up, and on a server of keepings of copies well nigh the whole. A searching that lasted two
    hours can then not end before morning.

    The outcome is mild in substance and unpleasant in shape. Nothing is spoilt and nothing is
    blocked. The task of the night simply comes into the hours of the machine's work and takes the
    disk's throughput when it is needed for something else.

    The checking comes therefore to one thing - look how long a full searching takes today and how
    much room the stores take up on that machine. If it is a server of keepings of copies, the right
    answer is a leaving-out for the storehouse of copies - the gathering of copies already written
    was looked at anyway at the moment of its coming to be.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Skanowanie pełne rozpakowuje każde archiwum na dysku, a na serwerze plików to większość zajętego miejsca
      - Zadanie nocne potrafi wejść w godziny pracy maszyny i zabrać dyskowi przepustowość
      - Nic nie zostaje zablokowane i nic się nie psuje, zmienia się wyłącznie czas trwania skanowania
      - Na serwerze kopii zapasowych właściwą odpowiedzią jest wyłączenie dla samej składnicy kopii
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy
    en:
      - A full searching unpacks every store on the disk, and on a server of files those are the greater share of the room
      - The task of the night can come into the hours of the machine's work and take the disk's throughput
      - Nothing is blocked and nothing is spoilt, only the lasting of the searching alters
      - On a server of keepings of copies the right answer is a leaving-out for the storehouse of copies itself
      - Where a guarding product of another maker rules, the audit reports the state does not apply
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Skanowanie pełne już dziś ledwo mieści się w oknie nocnym i nie ma zapasu czasu
      - Maszyna jest serwerem kopii zapasowych i nie ustalono wyłączenia dla składnicy kopii
    en:
      - The full searching hardly fits its window of the night as it is and has no spare of time
      - The machine is a server of keepings of copies and no leaving-out was settled for the storehouse
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableArchiveScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableArchiveScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableArchiveScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Punkt zmienia moment rozpoznania, a nie to, czy w ogóle nastąpi:
    plik wyjęty z archiwum i tak zostanie obejrzany w chwili zapisu.

    Waga serwerowa: archiwa na serwerze nie przechodzą, tylko mieszkają.
    Rzecz spakowana i odłożona potrafi przeleżeć rok, zanim ktokolwiek
    ją otworzy, i przez ten rok jest niewidoczna dla skanowania pełnego.

    Klasa podniesiona wobec stacji roboczej wprost proporcjonalnie do
    tego, co na maszynie leży: na serwerze plików archiwa to większość
    zajętego miejsca, a skanowanie, które trwało dwie godziny, potrafi
    nie skończyć się przed rankiem.
  en: |
    The item alters the moment of the knowing and not whether it comes to pass - a file taken out of
    a store will be looked at anyway at the moment of its writing.

    The weight on a server - stores pass not through a server, they dwell there. A thing packed and
    laid aside can lie a year before anyone opens it, and through that year it is unseen by the full
    searching.

    The class is raised against the workstation in straight measure to what lies on the machine - on
    a server of files the stores are the greater share of the room, and a searching that lasted two
    hours can fail to end before morning.
