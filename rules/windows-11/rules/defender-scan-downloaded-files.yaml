id: win11-defender-scan-downloaded-files

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection
  title:
    pl: Sprawdzanie plików pobranych i załączników włączone
    en: Checking of downloaded files and attachments switched on
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy ochrona sprawdza pliki w chwili, gdy trafiają
    na maszynę z zewnątrz: pobrane przeglądarką, zapisane z załącznika,
    przeniesione z udziału sieciowego.

    Jest to sprawdzenie osobne od tego, które zachodzi przy uruchomieniu
    pliku, i warto rozumieć różnicę, bo to ona nadaje punktowi wagę. Ochrona
    przy uruchomieniu działa w ostatniej chwili — plik jest już na dysku,
    użytkownik go właśnie otwiera i jeżeli sprawdzenie zawiedzie, kod
    ruszy. Sprawdzenie przy pobraniu działa wcześniej: zanim plik zostanie
    zapisany tam, gdzie użytkownik go zobaczy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wprowadzenie
    pliku na maszynę bez żadnego sprawdzenia w chwili wejścia. Cała obrona
    przesuwa się wtedy na moment uruchomienia — czyli na chwilę, w której
    użytkownik już podjął decyzję i klika.

    Ma to znaczenie szczególnie przy najczęstszej dziś drodze wejścia:
    wiadomości z załącznikiem albo odnośnikiem do pobrania. Plik dociera na
    maszynę, zostaje zapisany i czeka. Gdy sprawdzenie przy wejściu jest
    wyłączone, nie ma między jego pobraniem a uruchomieniem żadnego punktu,
    w którym cokolwiek się nim zainteresuje.

    Punkt jest w tej paczce jedną z niewielu reguł, które zatrzymują atak
    przed jego początkiem, a nie w jego trakcie. Stąd kategoria krytyczna.
  en: |
    The setting settles whether the protection checks files at the moment they reach the
    machine from outside: fetched by a browser, saved from an attachment, carried over
    from a network share.

    It is a check apart from the one that happens when a file is run, and the difference
    is worth understanding, since it is that which gives the item its weight. Protection
    at running works at the last moment - the file is already on the disk, the user is
    opening it, and if the check fails the code will move. The check on fetching works
    earlier: before the file is saved where the user will see it.

    What an attacker gains while the item goes unmet: the bringing of a file onto the
    machine with no check at all at the moment of entry. The whole defence then shifts to
    the moment of running - that is, to the moment when the user has already decided and
    is clicking.

    This matters above all on today's commonest way in: a message with an attachment or a
    link to fetch. The file reaches the machine, is saved and waits. Where the check at
    entry is switched off, there is between its fetching and its running no point at which
    anything takes an interest in it.

    The item is one of the few rules in this pack that stop an attack before its beginning
    rather than during it. Hence the critical category.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie pobiera się regularnie pliki bardzo
    duże albo bardzo liczne — bo tam sprawdzenie przy wejściu bywa odczuwalne.

    Skutek jest wydajnościowy, nie funkcjonalny. Pobranie pliku kończy się
    chwilę później, niż kończyłoby się bez sprawdzenia, i przez tę chwilę
    obciążony jest dysk. Przy plikach zwykłej wielkości jest to niezauważalne;
    przy obrazach maszyn wirtualnych, archiwach projektowych i zbiorach danych
    liczonych w gigabajtach — już nie.

    Odczuwalne bywa to również przy pobieraniu wielu małych plików naraz, na
    przykład przy pobieraniu zależności przez narzędzia programistyczne.
    W takich miejscach warto rozważyć wyłączenie osobnych katalogów ze
    sprawdzania, zamiast wyłączać sprawdzanie w całości.

    Sprawdzenie przy uruchomieniu działa dalej niezależnie od tej zmiany.
    Wyłączenie tego punktu nie zdejmuje więc ochrony, tylko przesuwa ją
    w czasie — i to jest dokładnie ta różnica, o którą w regule chodzi.

    Zmiana nie wymaga restartu i działa od razu.
  en: |
    What needs checking is whether files that are very large or very many are fetched on
    the machine regularly - since there the check at entry is sometimes felt.

    The effect is one of performance, not of function. Fetching a file ends a moment later
    than it would without the check, and for that moment the disk is loaded. With files of
    ordinary size this is unnoticeable; with virtual machine images, project archives and
    data sets counted in gigabytes it is not.

    It is sometimes felt as well when many small files are fetched at once, for instance
    when development tools fetch dependencies. In such places it is worth weighing the
    exclusion of particular directories from checking rather than switching checking off
    altogether.

    The check at running works on whatever this change says. Switching this item off
    therefore does not take protection away but moves it in time - and that is exactly the
    difference the rule is about.

    The change takes no restart and works at once.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - email-and-attachments
    - file-sharing
  what_breaks:
    pl:
      - Pobranie pliku kończy się chwilę później i przez ten czas obciąża dysk
      - Przy plikach liczonych w gigabajtach opóźnienie bywa odczuwalne
      - Pobieranie wielu małych plików naraz przez narzędzia programistyczne zwalnia
      - Sprawdzenie przy uruchomieniu pliku działa niezależnie od tej zmiany
    en:
      - Fetching a file ends a moment later and loads the disk for that time
      - With files counted in gigabytes the delay is sometimes felt
      - Fetching many small files at once by development tools slows down
      - The check when a file is run works independently of this change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna służy do pobierania zbiorów danych liczonych w gigabajtach, a czas ma znaczenie
    en:
      - The machine serves to fetch data sets counted in gigabytes and time matters
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name reads the other way round: the policy writes 0 where
      # the checking is switched on. The expected entry is therefore zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableIOAVProtection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $current = (Get-ItemProperty -Path $path -Name 'DisableIOAVProtection' -ErrorAction SilentlyContinue).'DisableIOAVProtection'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableIOAVProtection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableIOAVProtection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Nazwa wartości w rejestrze opisuje wyłączenie, a nie włączenie, więc stan
    zgodny to zero. Jest to odwrotność tego, czego spodziewa się ktoś czytający
    samą nazwę, i warto o tym pamiętać przy ręcznym sprawdzaniu.

    Brak wartości nie jest stanem zgodnym, choć sprawdzanie bywa wtedy
    włączone domyślnie. Reguła wymaga zapisania zera wprost, żeby decyzja
    należała do zasady, a nie do ustawienia lokalnego.

    Punkt tworzy zestaw z pozostałymi regułami ochrony działającej na bieżąco
    w tej paczce. Wyłączenie któregokolwiek z nich pozostawia pozostałe
    działające, ale każde z nich pilnuje innego momentu i luki się nie
    zastępują.
  en: |
    The value's name in the registry describes a switching off rather than a switching on,
    so the compliant state is zero. That is the reverse of what somebody reading the name
    alone expects, and is worth remembering when checking by hand.

    A missing value is not a compliant state, though checking is then sometimes on by
    default. The rule takes writing a zero outright, so that the decision belongs to the
    policy rather than to a local setting.

    The item forms a set with the other rules in this pack about protection working
    continuously. Switching any one of them off leaves the rest working, but each of them
    watches a different moment and the gaps do not stand in for one another.
