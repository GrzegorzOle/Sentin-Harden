name: build

# The Linux image is built here rather than on anybody's machine, which is the
# point of having it: the distribution an artifact is built on decides which
# distributions it will start on, and a hosted runner is a controlled one.
#
# Windows is built here too, so that the installer and the image come from the
# same commit and the same rule base. The Windows package is not signed by this
# workflow - the certificate belongs to whoever publishes, not to the
# repository - and the artifact says so.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: rule base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install what the check needs
        # The validator wants the parser and the schema library, not the whole
        # graphical stack; installing that here would add minutes for nothing.
        run: pip install PyYAML jsonschema
      - name: check the rule base
        run: python tools/validate_rules.py

  linux:
    name: AppImage
    needs: rules
    # Deliberately not ubuntu-latest. glibc is compatible forwards and not
    # backwards, so the image is built on the oldest runner available and will
    # then start on everything newer. Moving this to a later runner silently
    # drops the older distributions the rule base covers.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: install what Qt needs to link
        # The freeze loads the Qt libraries to work out what they pull in, and
        # a hosted runner carries none of the X libraries they ask for.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: draw the icon
        run: QT_QPA_PLATFORM=offscreen python tools/make_icon.py

      - name: freeze the application
        run: python tools/build_artifact.py

      - name: build the image
        run: python tools/build_appimage.py

      - name: check that the image starts
        # Only that it starts and stays up. A hosted runner has no display, so
        # the window is drawn offscreen, and it has no FUSE either - the image
        # is asked to unpack itself rather than mount, which is what
        # APPIMAGE_EXTRACT_AND_RUN does. Without it this step fails on every
        # hosted machine for a reason that has nothing to do with the build.
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          IMAGE=$(ls dist/*.AppImage)
          chmod +x "$IMAGE"
          "$IMAGE" &
          PID=$!
          sleep 30
          if kill -0 $PID 2>/dev/null; then
            echo "the image started and stayed up"
            kill $PID
          else
            wait $PID
            echo "the image did not stay up"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sentin-harden-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    name: installer
    needs: rules
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: draw the icon
        run: python tools/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: install the installer toolset
        # WiX 3 ships with the hosted image under a path that has moved before,
        # so it is installed explicitly rather than looked for.
        run: |
          curl -sSL -o wix.exe https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe
          Start-Process -FilePath .\wix.exe -ArgumentList "/install","/quiet","/norestart" -Wait
        shell: pwsh

      - name: freeze the application
        run: python tools/build_artifact.py

      - name: build the installer
        # Unsigned. A release build is signed by whoever publishes it, with
        # their certificate, using the --sign-with option of this script.
        run: python tools/build_installer.py

      - uses: actions/upload-artifact@v4
        with:
          name: sentin-harden-installer
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 30
