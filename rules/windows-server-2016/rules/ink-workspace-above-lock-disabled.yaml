id: win2016-ink-workspace-above-lock-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Ink Workspace
  title:
    pl: Obszar pisma odręcznego niedostępny z ekranu blokady
    en: The handwriting workspace unreachable from the lock screen
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera dostęp do obszaru pisma odręcznego sprzed
    zalogowania.

    Punkt dotyczy tej samej granicy co reguły o ekranie blokady: co da się
    uruchomić, zanim ktokolwiek poda hasło. Obszar pisma odręcznego jest
    aplikacją, która potrafi się tam otworzyć, ma własny zapis na dysk
    i własną listę rzeczy ostatnio otwieranych.

    Znaczy to trzy rzeczy naraz. Pierwsza: przy zablokowanej maszynie
    uruchamia się kod, który normalnie należy do sesji. Druga: powstają
    pliki zapisane przez coś, co działało przed uwierzytelnieniem. Trzecia:
    lista rzeczy ostatnio otwieranych bywa widoczna sprzed zalogowania,
    a nazwy plików mówią o pracy więcej, niż się zwykle zakłada.

    Ustawienie jest wyborem z trzech: zero wyłącza obszar całkowicie,
    jedynka zostawia go w sesji, dwójka otwiera go sprzed blokady. Punkt
    jest spełniony przy zerze i przy jedynce; na serwerze naturalne jest
    zero, bo nikt z obszaru nie korzysta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: aplikację
    uruchamialną przy zablokowanej maszynie, zapisującą pliki i pokazującą
    nazwy rzeczy otwieranych wcześniej.
  en: |
    The setting takes away the reach of the handwriting workspace from before a logon.

    The item concerns the same boundary as the rules about the lock screen: what can be started before anybody
    gives a password. The handwriting workspace is an application that can open there, has its own writing to
    disk and its own list of things lately opened.

    That means three things at once. The first: at a locked machine code starts that belongs by rights to a
    session. The second: files come into being written by something that worked before an authentication. The
    third: a list of things lately opened is at times to be seen from before a logon, and the names of files
    say more about the work than is commonly supposed.

    The setting is a choice out of three: nil switches the workspace off entirely, one leaves it inside a
    session, two opens it from before the lock. The item is met at nil and at one; on a server nil is the
    natural value, nobody using the workspace there.

    What an attacker gains while the item goes unmet: an application to be started at a locked machine, writing
    files and showing the names of things opened earlier.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na serwerze obszar pisma odręcznego nie jest używany, bo używa się go
    piórem, a serwer pióra nie ma. Zmiana nie zabiera więc nikomu niczego,
    z czego korzysta.

    Na maszynie z ekranem dotykowym i piórem skutek jest jeden i wąski:
    notatka robiona przy zablokowanym ekranie wymaga najpierw zalogowania.
    Wewnątrz sesji obszar działa tak jak dotąd.

    Nie ma znanych regresji.

    Czego to nie psuje: pióra i ekranu dotykowego, obszaru pisma
    odręcznego w sesji, notatek już zapisanych, usług, aplikacji, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    On a server the handwriting workspace is not used, it being used with a pen and a server having none. The
    change takes therefore from nobody anything they make use of.

    On a machine with a touch screen and a pen the consequence is one and narrow: a note made at a locked
    screen calls for a logon first. Inside a session the workspace works just as before.

    There are no known regressions.

    What this does not break: the pen and the touch screen, the handwriting workspace inside a session, notes
    already saved, services, applications, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Notatka robiona przy zablokowanym ekranie wymaga najpierw zalogowania się
      - Obszar pisma odręcznego wewnątrz sesji działa tak jak dotąd, o ile ustawiono jedynkę zamiast zera
      - Pióro, ekran dotykowy i notatki już zapisane pozostają bez zmian
      - Na serwerze bez pióra i ekranu dotykowego zmiana nie zabiera nikomu niczego
    en:
      - A note made at a locked screen calls for a logon first
      - The handwriting workspace inside a session works just as before, so far as one was set instead of nil
      - The pen, the touch screen and notes already saved stay unchanged
      - On a server without a pen and a touch screen the change takes from nobody anything
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś robi na tej maszynie notatki przy zablokowanym ekranie i jest to przyjęty sposób pracy
    en:
      - Somebody makes notes on this machine at a locked screen and it is an accepted way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is a choice out of three: zero switches the workspace off
      # entirely, one leaves it inside a session, two opens it above the lock.
      # Both zero and one carry out the item's purpose.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
      $name = 'AllowWindowsInkWorkspace'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[01]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    $name = 'AllowWindowsInkWorkspace'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One leaves the workspace inside a session and takes away only the reach
    # from above the lock; zero switches it off entirely and suits a server,
    # where nobody uses it. The change sets one, the milder of the two.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowWindowsInkWorkspace' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowsinkworkspace

notes:
  pl: |
    Punkt jest piąty w bloku i spina go z blokiem o ekranie blokady. Warto
    to powiązanie pokazać, bo reguła czytana samotnie wygląda na pozycję
    o rysowaniu piórem, a dotyczy uruchamiania kodu przed
    uwierzytelnieniem.

    Rzecz warta wyróżnienia w interfejsie dotyczy odczytu. Ustawienie ma
    trzy wartości, a punkt jest spełniony przy dwóch z nich. Audyt
    porównuje wzorcem, nie równością — zero i jedynka są obie zgodne.
    Raport nie powinien pokazywać zera jako „innej wartości niż
    oczekiwana", bo zero spełnia punkt mocniej niż jedynka.

    Naprawa ustawia jedynkę, czyli wariant łagodniejszy: obszar zostaje
    w sesji, a znika tylko sprzed blokady. Na serwerze rozsądniejsze bywa
    zero i warto o tym powiedzieć wprost, zamiast zostawiać wybór
    w domyśle.

    Odnotowuję, że ten sam klucz niesie drugie ustawienie, o podpowiadaniu
    aplikacji. Są to dwie osobne pozycje pod jedną ścieżką i przy czytaniu
    kopii zapasowej warto o tym pamiętać.
  en: |
    The item is the fifth in the block and binds it to the block about the lock screen. That binding is worth
    showing, the rule read alone looking an entry about drawing with a pen while it concerns the starting of
    code before an authentication.

    A thing worth setting apart in the interface concerns the reading. The setting has three values, and the item
    is met at two of them. The audit compares by a pattern rather than by equality - nil and one are both
    compliant. The report ought not show nil as "a value other than the one expected", nil meeting the item more
    strongly than one.

    The remedy sets one, which is to say the milder variant: the workspace stays inside a session and goes only
    from before the lock. On a server nil is at times the more sensible, and that is worth saying outright rather
    than leaving the choice to be guessed.

    Worth noting that the same key carries a second setting, about the suggesting of applications. They are two
    separate entries under one path and that is worth keeping in mind when reading the backup.
