id: win2025-firewall-all-profiles-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Zapora włączona we wszystkich profilach sieciowych
    en: Firewall enabled on all network profiles
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby zapora była włączona w każdym z trzech profili
    sieciowych, a nie tylko w tym, który jest aktywny w chwili sprawdzenia.

    Rozdzielenie na profile jest tu istotne i bywa źródłem fałszywego
    poczucia bezpieczeństwa. Maszyna używa jednego profilu naraz, wybranego
    według sieci, do której jest podłączona. Zapora wyłączona w profilu
    nieaktywnym nie robi nic dzisiaj — ale włączy się, kiedy maszyna zmieni
    sieć albo kiedy zmieni się sposób wykrywania sieci, a to na serwerze
    zdarza się przy zmianie karty, przy przełączeniu na łącze zapasowe
    i po każdej większej zmianie w konfiguracji sieci.

    Na serwerze zapora jest jedyną warstwą, która oddziela usługi
    nasłuchujące od reszty sieci. Usług tych jest wielokrotnie więcej niż
    na stanowisku roboczym, a część z nich nasłuchuje dlatego, że
    zainstalowano rolę — nie dlatego, że ktoś świadomie ją wystawił.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: bezpośredni
    dostęp do wszystkiego, co na tej maszynie nasłuchuje. Nie musi omijać
    reguł, bo reguł nie ma — zapora wyłączona nie filtruje niczego.

    Jest to jeden z niewielu punktów, przy których niespełnienie oznacza
    brak warstwy ochronnej, a nie jej osłabienie, i dlatego kategoria jest
    krytyczna.
  en: |
    The item takes that the firewall be enabled on each of the three network profiles, and
    not merely on the one active at the moment of the check.

    The splitting into profiles matters here and is at times the source of a false sense of
    safety. A machine uses one profile at a time, chosen by the network it is plugged into.
    A firewall disabled on an inactive profile does nothing today - but it will come into
    force when the machine changes network or when the way networks are detected changes,
    and on a server that happens at a change of adapter, at a switch to a spare link and
    after every larger change in the network's configuration.

    On a server the firewall is the one layer separating listening services from the rest of
    the network. There are many times more of those services than at a working station, and
    some of them listen because a role was installed - not because anybody knowingly put
    them up.

    What an attacker gains while the item goes unmet: direct access to everything listening
    on this machine. They need not go round the rules, since there are none - a disabled
    firewall filters nothing.

    It is one of the few items at which a non-meeting means the absence of a protective
    layer rather than its weakening, and hence the category is critical.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że włączenie zapory tam, gdzie była
    wyłączona, zaczyna filtrować ruch natychmiast — a reguły, które ten
    ruch przepuszczą, muszą już istnieć.

    Jest to najczęstszy powód, dla którego na serwerze zaporę się wyłącza:
    aplikacja nasłuchuje na porcie, dla którego nikt reguły nie napisał,
    a wyłączenie zapory było szybsze niż jej napisanie. Włączenie zapory
    odcina wtedy tę aplikację w tej samej sekundzie.

    Reguły dla ról systemowych tworzą się same przy instalacji roli
    i zwykle są na miejscu. Kłopot dotyczy aplikacji spoza systemu:
    serwerów baz danych, oprogramowania przemysłowego, usług własnych
    i wszystkiego, co instalowano ręcznie.

    Przed włączeniem trzeba wiedzieć, co na maszynie nasłuchuje i na
    których portach. Wykaz portów nasłuchujących odczytuje się z systemu
    i jest to jedyny sposób, żeby nie zgadywać. Reguły trzeba przygotować
    przed zmianą, nie po niej.

    Zmiana nie wymaga restartu, ale zrywa połączenia, których żadna reguła
    nie przepuszcza — w tym możliwe połączenie zarządzające, którym
    zmiana jest wykonywana.
  en: |
    A knowing rollout is needed because enabling the firewall where it was disabled starts
    filtering traffic at once - and the rules that will let that traffic through have to be
    there already.

    It is the commonest reason a firewall is disabled on a server: an application listens on
    a port nobody wrote a rule for, and disabling the firewall was quicker than writing one.
    Enabling the firewall then cuts that application off in the same second.

    Rules for the system's roles make themselves at the role's installation and are usually
    in place. The trouble concerns applications from outside the system: database servers,
    industrial software, services of one's own and everything installed by hand.

    Before enabling it one has to know what listens on the machine and on which ports. The
    list of listening ports is read off the system and is the one way of not guessing. The
    rules have to be prepared before the change rather than after.

    The change takes no restart, but breaks connections no rule lets through - including a
    possible management connection the change is being made over.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Aplikacje nasłuchujące na portach bez napisanej reguły przestają być osiągalne
      - Połączenie zarządzające, którym wykonywana jest zmiana, może zostać zerwane
      - Profile nieaktywne dziś zaczną filtrować po zmianie sieci albo karty
      - Reguły ról systemowych zwykle istnieją i te usługi działają dalej
    en:
      - Applications listening on ports with no rule written stop being reachable
      - The management connection the change is made over may be broken
      - Profiles inactive today will start filtering after a change of network or adapter
      - Rules for the system's roles usually exist and those services go on working
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie odczytano wykazu portów nasłuchujących na tej maszynie
      - Aplikacja spoza systemu nasłuchuje na porcie, dla którego nie ma reguły
      - Jedyna droga zarządzania serwerem przebiega przez port bez napisanej reguły
    en:
      - The list of ports listening on this machine has not been read
      - An application from outside the system listens on a port there is no rule for
      - The one road of managing the server runs over a port with no rule written
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $off = @($profiles | Where-Object { $_.Enabled -ne 'True' })
        if ($off.Count -eq 0) { 'ALL_ENABLED' } else { 'DISABLED_IN_' + ($off.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, Enabled |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -Enabled $p.Enabled
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Sprawdzenie czyta wszystkie trzy profile naraz i wymaga zgodności
    w każdym. Wynik „DISABLED_IN_…" podaje nazwy profili, w których zapora
    jest wyłączona, żeby nie trzeba było ich szukać.

    Punkt sprawdza, czy zapora działa, a nie co przepuszcza. Zapora
    włączona z regułą przepuszczającą wszystko spełnia ten punkt i nie
    chroni niczego — dlatego czyta się go razem z domyślnym blokowaniem
    połączeń przychodzących.

    Na serwerze warto wykonać tę zmianę z konsoli, a nie przez połączenie
    sieciowe. Zapora włączona bez reguły dla drogi zarządzania zamyka ją
    razem z resztą, a wycofanie wymaga wtedy dostępu, którego już nie ma.
  en: |
    The check reads all three profiles at once and takes compliance on each. The result
    "DISABLED_IN_…" gives the names of the profiles the firewall is disabled on, so that
    they need not be looked for.

    The item checks whether the firewall works, not what it lets through. A firewall enabled
    with a rule letting everything through meets this item and guards nothing - hence it is
    read together with the default blocking of inbound connections.

    On a server it is worth making this change from the console rather than over a network
    connection. A firewall enabled with no rule for the management road closes it along with
    the rest, and a rollback then takes access that is no longer there.
