id: win11-appx-trusted-apps-sideload-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji z pominięciem sklepu wyłączone
    en: Installing application packages past the store switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera maszynie możliwość instalowania pakietów aplikacji
    z pominięciem sklepu — czyli wprost z pliku pakietu, byle był podpisany
    certyfikatem, któremu maszyna ufa.

    Droga ta powstała po to, żeby organizacja mogła rozprowadzać własne
    aplikacje bez wystawiania ich publicznie, i w tej roli jest potrzebna.
    Warunkiem jest podpis, więc na pierwszy rzut oka wygląda to na mechanizm
    zamknięty.

    Nie jest zamknięty, i tu leży sedno punktu. Zaufanie nie rozstrzyga się
    przy instalacji pakietu, tylko wcześniej — przy tym, jakie certyfikaty
    trafiły do magazynu zaufanych na tej maszynie. Kto zdołał tam cokolwiek
    dopisać, ma odtąd drogę do instalowania aplikacji, których nikt nie
    przeglądał, z pominięciem jedynego miejsca, gdzie pakiety są sprawdzane
    przed udostępnieniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    umieszczenie na maszynie aplikacji pracującej jak każda inna — z własnymi
    uprawnieniami, ikoną, obecnością w menu i dostępem do danych
    użytkownika — bez przechodzenia przez sklep i bez uruchamiania czegoś,
    co wygląda jak plik wykonywalny. Aplikacja zainstalowana tą drogą jest
    przy tym trwała: przeżywa wylogowanie i restart.

    Punkt jest na poziomie drugim, bo odcina mechanizm, z którego część
    organizacji korzysta świadomie.
  en: |
    The setting takes from the machine the means of installing application packages past
    the store - that is, straight from a package file, so long as it is signed with a
    certificate the machine trusts.

    That road came about so an organisation could distribute its own applications without
    offering them publicly, and in that role it is needed. A signature is the condition, so
    at first glance it looks a closed mechanism.

    It is not closed, and there lies the item's heart. Trust is settled not at the
    installing of the package but earlier - at which certificates reached the trusted store
    on this machine. Whoever managed to add anything there has from then on a road to
    installing applications nobody has reviewed, past the one place where packages are
    checked before being offered.

    What an attacker gains while the item goes unmet: a means of placing on the machine an
    application working like any other - with its own rights, an icon, a presence in the
    menu and access to the user's data - without going through the store and without
    running something that looks like an executable file. An application installed by that
    road is at that lasting: it survives signing out and a restart.

    The item stands at the second level, since it cuts off a mechanism some organisations
    use knowingly.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy organizacja rozprowadza własne aplikacje
    pakietowe — bo jeżeli tak, zmiana odcina jedyną drogę ich instalowania.

    Jest to pytanie, na które odpowiedź bywa mylna. Aplikacje własne bywają
    instalowane raz, przy przygotowaniu maszyny, i przez lata nikt o nich nie
    myśli. Zmiana nie usuwa aplikacji już zainstalowanych — one działają
    dalej — ale uniemożliwia instalowanie ich na maszynach kolejnych
    i aktualizowanie tą samą drogą.

    Skutek ujawnia się więc z opóźnieniem: nie w dniu wdrożenia, tylko przy
    następnym przygotowaniu stanowiska albo przy następnej wersji aplikacji
    własnej. Wtedy objawi się jako odmowa instalacji, bez oczywistego
    związku ze zmianą sprzed miesięcy.

    Na stanowisku korzystającym wyłącznie z aplikacji ze sklepu
    i z programów instalowanych zwykłym instalatorem zmiana jest niewidoczna.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether the organisation distributes its own packaged
    applications - because if so, the change cuts off the only road to installing them.

    It is a question to which the answer is sometimes wrong. Own applications are sometimes
    installed once, at the preparing of a machine, and for years nobody thinks of them. The
    change does not remove applications already installed - they go on working - but makes
    installing them on further machines, and updating them by the same road, impossible.

    The effect thus shows itself late: not on the day of the rollout but at the next
    preparing of a station or at the next version of an own application. It will then show
    as a refused installation, with no plain bearing on a change from months before.

    At a station using applications from the store alone, and programs installed by an
    ordinary installer, the change is invisible.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalowanie pakietów aplikacji wprost z pliku przestaje być możliwe
      - Aktualizowanie aplikacji własnych rozprowadzanych poza sklepem przestaje działać
      - Aplikacje pakietowe już zainstalowane działają bez zmiany
      - Instalowanie programów zwykłym instalatorem nie jest tą zmianą objęte
    en:
      - Installing application packages straight from a file stops being possible
      - Updating own applications distributed outside the store stops working
      - Packaged applications already installed work unchanged
      - Installing programs by an ordinary installer is not taken in by this change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja rozprowadza własne aplikacje pakietowe poza sklepem
      - Stanowisko należy do zespołu przygotowującego takie aplikacje
    en:
      - The organisation distributes its own packaged applications outside the store
      - The station belongs to a team preparing such applications
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowAllTrustedApps'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $current = (Get-ItemProperty -Path $path -Name 'AllowAllTrustedApps' -ErrorAction SilentlyContinue).'AllowAllTrustedApps'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowAllTrustedApps'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAllTrustedApps' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/sideload-apps-in-windows

notes:
  pl: |
    Nazwa wartości mówi o zezwoleniu, więc stanem zgodnym jest zero.

    Reguła należy do trójki opisującej, skąd na maszynę trafiają pakiety
    aplikacji: ta odcina drogę z pliku podpisanego, druga — drogę
    deweloperską, trzecia ogranicza prawo instalowania do administratorów.
    Wszystkie trzy leżą w jednym kluczu i można je wycofywać osobno.

    Reguła nie dotyczy programów instalowanych zwykłym instalatorem. Te
    sterowane są osobnym zestawem ustawień.

    Brak wartości nie jest stanem zgodnym, bo domyślne zachowanie zależy od
    wydania systemu i od tego, czy maszyna należy do domeny.
  en: |
    The value's name speaks of an allowance, and so the compliant state is zero.

    The rule belongs to a trio describing whence application packages reach the machine:
    this one cuts off the road from a signed file, the second the developer's road, the
    third limits the right of installing to administrators. All three lie in one key and
    can be rolled back apart.

    The rule does not concern programs installed by an ordinary installer. Those are
    steered by a separate set of settings.

    A missing value is not a compliant state, since the default behaviour depends on the
    system's edition and on whether the machine belongs to a domain.
