id: win10-audit-account-lockout

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja blokady konta
    en: The audit of an account being locked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje odrzucenie wejścia na konto zablokowane po serii
    błędnych haseł.

    Blokada bywa pomyłką człowieka i bywa ostatnim widocznym śladem
    przerwanego zgadywania. Różnicy między jednym a drugim nie widać
    z pojedynczego wpisu — widać ją z rozkładu wpisów w czasie i z tego,
    których kont dotyczą. Jedna blokada tygodniowo na tym samym koncie to
    osoba, która myli hasło. Pięć blokad na pięciu kontach w ciągu kwadransa
    to coś innego.

    Wartość reguły bierze się stąd, że blokada jest zdarzeniem rzadkim.
    Zapis, który w normalnej pracy jest prawie pusty, ma tę właściwość, że
    każdy jego wpis coś znaczy — a to jest własność, której nie ma żaden
    z pozostałych zapisów tego bloku.

    Odnotowuję, że zapisywany jest wyłącznie wynik nieudany. Blokada jest
    z natury odmową wejścia, więc połowa udana tej podkategorii pozostaje
    pusta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zgadywanie
    haseł przerwane blokadą i niezostawiające żadnego łatwego do zauważenia
    śladu.
  en: |
    The setting writes down the refusal of an entry upon an account locked after a run of wrong passwords.

    A locking out is at times a person's slip and at times the last visible trace of an interrupted guessing.
    The difference between the one and the other does not show in a single entry - it shows in the spread of
    entries over time and in which accounts they touch. One locking a week upon the same account is a person who
    gets a password wrong. Five lockings upon five accounts within a quarter of an hour is something else.

    The rule's value comes of this, that a locking out is a rare happening. A record which in ordinary work is
    near empty has this property, that every entry in it means something - and that is a property none of the
    other records in this block has.

    I set down that only the failed outcome is written. A locking out is by its nature a refusal of entry, so
    this subcategory's successful half stays empty.

    What an attacker gains while the item goes unmet: a guessing of passwords broken off by a locking and
    leaving no trace easy to notice.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia ani progu blokady, ani czasu jej trwania, ani
    sposobu odblokowania konta. Zapisuje wyłącznie to, co i tak następuje.

    Liczba wpisów jest w normalnej pracy bliska zeru, więc dziennika
    zabezpieczeń ta podkategoria nie zapełnia. Jest to najcichszy zapis
    w całym bloku.

    Odnotowuję warunek, bez którego reguła nie daje nic, a wygląda na
    spełnioną: jeśli na maszynie nie jest ustawiony próg blokady konta,
    blokada nie zachodzi, więc nie ma czego zapisywać. Punkt jest wtedy
    zgodny i bezużyteczny jednocześnie.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: logowania, progu blokady, odblokowywania kont,
    udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes neither the threshold of a locking, nor its length, nor the manner of an account's being
    unlocked. It writes down only what follows anyway.

    The number of entries is in ordinary work near nought, so this subcategory does not fill the security log.
    It is the quietest record in the whole block.

    I set down the condition without which the rule gives nothing while looking met: where no threshold of
    locking is set upon the machine, no locking comes about, so there is nothing to write down. The item is then
    compliant and useless at once.

    There are no known regressions for everyday work.

    What this does not break: logging on, the threshold of locking, the unlocking of accounts, file shares,
    printing, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Bez ustawionego progu blokady konta blokada nie zachodzi, więc punkt jest zgodny i bezużyteczny jednocześnie
      - Zapisywany jest wyłącznie wynik nieudany, bo blokada jest z natury odmową wejścia
      - Liczba wpisów jest w normalnej pracy bliska zeru, więc dziennika ta podkategoria nie zapełnia
      - Ustawienie nie zmienia progu blokady, czasu jej trwania ani sposobu odblokowania konta
      - Logowanie, odblokowywanie kont, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - With no threshold of locking set, no locking comes about, so the item is compliant and useless at once
      - Only the failed outcome is written, a locking out being by its nature a refusal of entry
      - The number of entries is in ordinary work near nought, so this subcategory does not fill the log
      - The setting changes neither the threshold of locking, nor its length, nor the manner of unlocking an account
      - Logging on, the unlocking of accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie nie jest ustawiony próg blokady konta i zapis pozostanie pusty niezależnie od tego, co się dzieje
    en:
      - No threshold of locking an account is set upon the machine and the record will stay empty whatever happens
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9217-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[23]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9217-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9217-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the failed outcome is recorded - a locking out is by its nature a refused
    # entry, and the successful half of this subcategory stays empty.
    auditpol /set /subcategory:"{0CCE9217-69AE-11D9-BED3-505054503030}" /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9217-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-account-lockout

notes:
  pl: |
    Reguła jest w tym bloku jedyną, której zapis w normalnej pracy ma być
    pusty — i to jest jej zaleta, nie wada. Wpis, który pojawia się rzadko,
    nie wymaga przeglądania: wystarczy, żeby ktokolwiek go zauważył.

    Warto, żeby aplikacja postawiła to wprost, bo użytkownik oceniający
    zapisy po objętości uzna tę podkategorię za bezwartościową. Miarą jest
    tu gęstość znaczenia na wpis, a nie liczba wpisów.

    Odnotowuję zależność od progu blokady, bo prowadzi do zgodności
    pozornej. Maszyna bez ustawionego progu przejdzie ten punkt i nie
    zapisze nigdy niczego. Warto, żeby aplikacja pokazała obie reguły
    razem — inspekcja bez progu jest zgodnością bez treści.
  en: |
    The rule is the only one in this block whose record in ordinary work is meant to be empty - and that is its
    merit and not its fault. An entry that comes up seldom calls for no looking over: it suffices that anybody
    notice it.

    It is well that the application put that outright, a user weighing records by their bulk holding this
    subcategory worthless. The measure here is the density of meaning to an entry, and not the count of entries.

    I set down the tie to the threshold of locking, it leading to a seeming compliance. A machine with no
    threshold set will pass this item and never write a thing. It is well that the application show the two rules
    together - an audit without a threshold is compliance without substance.
