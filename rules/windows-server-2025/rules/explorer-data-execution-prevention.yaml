id: win2025-explorer-data-execution-prevention

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Ochrona przed wykonaniem danych w powłoce systemu włączona
    en: Protection against executing data left on in the system shell
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt pilnuje, żeby w zasadzie nie leżał wpis wyłączający ochronę
    przed wykonaniem danych w powłoce systemu. Ochrona ta sprawia, że
    obszar pamięci przeznaczony na dane nie może zostać wykonany jako
    kod — a wymuszenie właśnie takiego wykonania jest podstawowym
    sposobem wykorzystania błędu w programie.

    Obniżam kategorię do średniej i powód jest taki sam, jaki podałem
    przy blokadzie wyłączenia ochrony przed złośliwym oprogramowaniem.
    Na dzisiejszym systemie powłoka jest procesem sześćdziesięciu
    czterech bitów, a tam ta ochrona jest stała i nie daje się zdjąć.
    Wpis w zasadzie nie osłabi jej zatem w sposób, o jakim mówi nazwa
    ustawienia.

    Wartością punktu jest to, że wpis osłabiający nie leży w zasadzie
    gotowy zadziałać tam, gdzie jeszcze działa — w procesach trzydziestu
    dwóch bitów uruchamianych przez powłokę. Na serwerze takie procesy
    biorą się z jednego źródła: rozszerzeń powłoki dokładanych przez
    oprogramowanie producenta macierzy, agenta kopii zapasowych albo
    narzędzia archiwizującego. Bywa to kod stary i to on jest tu
    chroniony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wpis
    przygotowany wcześniej, osłabiający najstarszy i najsłabszy kod
    działający w powłoce serwera.
  en: |
    The item sees to it that no entry switching off the guard against the carrying out of data lies
    in the policy for the shell of the system. That guard makes it so that a reach of memory meant
    for data cannot be carried out as code - and the forcing of just such a carrying out is the
    ground way of using a fault in a program.

    I lower the category to middling, and the ground is the same I gave at the blocking of the
    switching off of the guard against ill-meaning software. On today's system the shell is a
    process of sixty-four bits, and there that guard is steadfast and cannot be taken away. An entry
    in the policy will therefore not weaken it in the way the setting's name speaks of.

    The worth of the item is that the weakening entry does not lie in the policy ready to work where
    it still works - in processes of thirty-two bits run by the shell. On a server such processes
    come of one wellspring: the widenings of the shell set alongside by the software of the array's
    maker, of an agent of keepings of copies, or of a tool of storing away. It is at times old code,
    and it is that which is here guarded.

    What an attacker gains while the item goes unmet - an entry made ready beforehand, weakening the
    oldest and the weakest code at work in the server's shell.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i chcę powiedzieć wprost, na
    czym ta ocena stoi, bo „brak znanego wpływu" nie jest tym samym co
    „bezpieczne".

    Na maszynie, na której wpisu nie ma, zmiana zapisuje jawne zero
    w miejsce braku i nie zmienia zachowania systemu w żaden sposób:
    zero jest tym samym, co system robi domyślnie.

    Na maszynie, na której wpis jest i wyłącza ochronę, zmiana ją
    przywraca. Skutek dotyczy wtedy wyłącznie kodu, który polegał na
    wykonywaniu obszaru danych. Taki kod jest błędny albo bardzo stary,
    i w praktyce spotyka się go w dwóch miejscach: w rozszerzeniach
    powłoki z lat, w których ochrony jeszcze nie było, oraz
    w narzędziach, które same podmieniają fragmenty pamięci.

    Objaw przy trafieniu jest jednoznaczny — rozszerzenie przestaje
    działać, a proces powłoki kończy się. Na stacji roboczej byłoby to
    dotkliwe, bo użytkownik traci to, co robił. Na serwerze powłoka nie
    jest miejscem pracy, tylko narzędziem serwisowym, więc koszt
    ogranicza się do ponownego otwarcia okna przez administratora.

    Nie znam serwerowego zastosowania, w którym przywrócenie tej ochrony
    byłoby błędem, i dlatego zostawiam punkt w trybie zbiorczym.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption" and mean to say outright whereon that reckoning stands, "no
    known effect" not being the same as "safe".

    On a machine where the entry is not, the change writes an outright nought in the place of a want
    and alters the system's bearing in no way - a nought is the same as what the system does by
    default.

    On a machine where the entry is and switches the guard off, the change brings it back. The
    outcome then bears on code alone that leaned upon the carrying out of a reach of data. Such code
    is faulty or very old, and in practice it is met with in two places - in widenings of the shell
    out of the years wherein the guard was not yet, and in tools that themselves swap pieces of
    memory.

    The symptom at a striking is plain - the widening stops working and the process of the shell
    ends. On a workstation that would bite, the user losing what they were at. On a server the shell
    is no place of work but a tool for service, so the cost comes to the opening of the window anew
    by the administrator.

    I know of no use on a server wherein the bringing back of that guard would be a mistake, and
    therefore I leave the item in the bulk mode.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Rozszerzenie powłoki opierające się na wykonywaniu obszaru danych przestanie działać
      - Proces powłoki kończy się przy trafieniu, a na serwerze powłoka jest narzędziem serwisowym, nie miejscem pracy
      - Na maszynie bez wpisu zmiana nie zmienia zachowania systemu w żaden sposób
      - Ochrona jest stała w procesach sześćdziesięciu czterech bitów i wpis jej tam nie osłabi
      - Brak znanego zastosowania serwerowego, w którym przywrócenie tej ochrony byłoby błędem
    en:
      - A widening of the shell that leans upon the carrying out of a reach of data will stop working
      - The process of the shell ends at a striking, and on a server the shell is a tool for service and no place of work
      - On a machine with no entry the change alters the system's bearing in no way
      - The guard is steadfast in processes of sixty-four bits and the entry will not weaken it there
      - No known use on a server wherein the bringing back of that guard would be a mistake
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze działa rozszerzenie powłoki z lat, w których tej ochrony jeszcze nie było
    en:
      - A widening of the shell out of the years wherein that guard was not yet works on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      $name = 'NoDataExecutionPrevention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    $name = 'NoDataExecutionPrevention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoDataExecutionPrevention' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/memory/data-execution-prevention

notes:
  pl: |
    Kategoria obniżona z tego samego powodu co przy blokadzie
    wyłączenia ochrony przed złośliwym oprogramowaniem: w procesie
    sześćdziesięciu czterech bitów ochrona jest stała, więc wpis nie
    osłabi jej tam, gdzie nazwa ustawienia obiecuje.

    Wartością jest to, że wpis nie leży gotowy zadziałać tam, gdzie
    jeszcze działa — w procesach trzydziestu dwóch bitów uruchamianych
    przez powłokę. Na serwerze biorą się one z rozszerzeń powłoki
    dokładanych przez oprogramowanie macierzy, agenta kopii albo
    narzędzie archiwizujące.

    Koszt trafienia jest na serwerze mniejszy niż na stacji: powłoka
    nie jest miejscem pracy, tylko narzędziem serwisowym.
  en: |
    The category is lowered of the same ground as at the blocking of the switching off of the guard
    against ill-meaning software - in a process of sixty-four bits the guard is steadfast, so the
    entry will not weaken it where the setting's name promises.

    The worth is that the entry does not lie ready to work where it still works - in processes of
    thirty-two bits run by the shell. On a server those come of widenings of the shell set alongside
    by the software of the array, of an agent of copies or of a tool of storing away.

    The cost of a striking is on a server the smaller - the shell is no place of work but a tool for
    service.
