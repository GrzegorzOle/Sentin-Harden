id: win2025-bluetooth-support-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi łączności bezprzewodowej bliskiego zasięgu wyłączona
    en: The support service for short range wireless connectivity disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę obsługującą łączność bezprzewodową bliskiego
    zasięgu. Usługa ta nasłuchuje, przyjmuje zgłoszenia urządzeń
    i prowadzi parowanie — czyli robi to wszystko niezależnie od tego,
    czy ktokolwiek zamierzał z niej skorzystać.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej
    i powodem jest zasięg. Łączność bliskiego zasięgu wymaga fizycznej
    bliskości, a serwer stoi w pomieszczeniu zamkniętym. Napastnik zdolny
    stanąć przy szafie z serwerem ma do dyspozycji rzeczy poważniejsze niż
    ta usługa.

    Zostawiam natomiast wartość tego punktu nazwaną wprost, bo nie jest
    zerowa i nie chcę, żeby wyglądał na formalność. Serwer, który
    nadajnika nie ma, nie potrzebuje usługi nasłuchującej urządzeń — a to,
    co nie jest potrzebne, a mimo to działa, jest kodem utrzymywanym
    w gotowości bez powodu. Kod, z którego się nie korzysta, nie jest
    przez to kodem nieszkodliwym; jest kodem, którego nikt nie ogląda.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działającą
    usługę przyjmującą zgłoszenia od urządzeń w zasięgu maszyny, na
    serwerze, na którym nikt jej nigdy nie użył.
  en: |
    The item switches off the service that handles the wireless binding of short reach. That service
    listens, takes the callings of gear and leads the pairing - that is, it does all that whether or
    not anybody meant to make use of it.

    I lower the category to low against the reckoning for a workstation, and the ground is the reach.
    A binding of short reach takes a bodily nearness, and a server stands in a shut room. An attacker
    able to stand at the press that holds the server has weightier things at hand than that service.

    I leave, though, the worth of this item named outright, it being not nought and I would not have
    it look a formality. A server that has no sender needs no service listening for gear - and that
    which is not needed and works for all that is code held in readiness without a ground. Code that
    is not used is not thereby harmless code; it is code nobody looks at.

    What an attacker gains while the item goes unmet - a working service taking the callings of gear
    within the machine's reach, upon a server whereon nobody ever used it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" mimo obniżonej
    kategorii i jest to ten sam układ, który opisałem przy instalowaniu
    pakietów przez użytkowników bez uprawnień: ryzyko niskie, uciążliwość
    wysoka, dwie osie rozchodzące się w przeciwne strony.

    Powód jest tu jednak zupełnie inny i znacznie ostrzejszy. Ta usługa
    obsługuje urządzenia wejściowe. Jeżeli klawiatura albo mysz przy
    konsoli serwera łączy się właśnie tą drogą, jej wyłączenie odbiera
    sterowanie maszyną w chwili wykonania polecenia — i odbiera je
    człowiekowi, który to polecenie właśnie wydał.

    Jest to jedna z niewielu zmian w tej paczce, które potrafią odciąć
    administratora od maszyny natychmiast i bez ostrzeżenia. Dlatego
    obowiązuje tu ta sama zasada, którą zapisałem przy zasadach
    dotyczących rozruchu: zanim ruszysz, wiedz, którędy wejdziesz na tę
    maszynę, gdy przestaniesz widzieć konsolę. Karta zarządzająca albo
    konsola hipernadzorcy muszą być sprawdzone wcześniej, nie potem.

    Poza tym jednym skutkiem zmiana nie dotyka niczego. Usługi sieciowe,
    role, zadania i połączenia zdalne działają bez zmian.

    Usługa zostaje zatrzymana i oznaczona jako wyłączona. Cofnięcie
    przywraca poprzedni tryb uruchamiania i, jeżeli usługa działała,
    uruchamia ją z powrotem.
  en: |
    I leave the class "needs a witting rolling out" for all the lowered category, and it is the same
    setting I set forth at the installing of packages by users without rights - the hazard low, the
    disruption high, the two axes going apart in opposite ways.

    The ground is here, though, wholly other and far sharper. That service handles the gear of
    putting in. If the board of keys or the mouse at the server's console binds by that very road,
    its switching off takes the steering of the machine away at the hour the command is carried out -
    and takes it from the person who has just given that command.

    It is one of the few changes in this pack able to cut an administrator off from the machine at
    once and without a forewarning. Therefore there holds here the same rule I wrote at the rules
    bearing on the raising up - before you stir, know by which way you will come onto that machine
    when you stop seeing the console. The card of ruling or the board of the overseer must be looked
    to beforehand and not after.

    Beyond that one outcome the change touches nothing. The services of the net, the roles, the tasks
    and the far-off bindings work unaltered.

    The service is stopped and marked as switched off. The undoing brings back the former manner of
    starting and, if the service was working, starts it again.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Klawiatura albo mysz przy konsoli łącząca się tą drogą przestaje działać natychmiast
      - Odcięcie sterowania następuje w chwili wykonania polecenia i dotyka tego, kto je wydał
      - Przed zmianą trzeba wiedzieć, którędy wejść na maszynę po utracie konsoli
      - Karta zarządzająca albo konsola hipernadzorcy muszą być sprawdzone wcześniej, nie potem
      - Poza tym usługi sieciowe, role, zadania i połączenia zdalne działają bez zmian
    en:
      - A board of keys or a mouse at the console binding by that road stops working at once
      - The cutting off of the steering befalls at the hour the command is carried out and touches the one who gave it
      - Before the change one must know by which way to come onto the machine after the loss of the console
      - The card of ruling or the board of the overseer must be looked to beforehand and not after
      - Beyond that, the services of the net, the roles, the tasks and the far-off bindings work unaltered
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Klawiatura albo mysz przy konsoli serwera łączy się łącznością bliskiego zasięgu
      - Nie sprawdzono drogi wejścia na maszynę poza konsolą, czyli karty zarządzającej albo hipernadzorcy
    en:
      - The board of keys or the mouse at the server's console binds by the wireless of short reach
      - The way onto the machine beside the console was not looked to, that is the card of ruling or the overseer
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # If the console keyboard or mouse connects this way, this cuts the hand
    # that runs the command. Know the out-of-band route onto this machine - the
    # management card or the hypervisor console - before running it.
    Stop-Service -Name 'bthserv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'bthserv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'bthserv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/bluetooth/

notes:
  pl: |
    Kategoria obniżona przez zasięg: łączność bliskiego zasięgu wymaga
    fizycznej bliskości, a napastnik zdolny stanąć przy szafie z serwerem
    ma do dyspozycji rzeczy poważniejsze niż ta usługa.

    Wartość mimo to nazwana wprost, żeby punkt nie wyglądał na
    formalność: kod, z którego się nie korzysta, nie jest przez to kodem
    nieszkodliwym — jest kodem, którego nikt nie ogląda.

    Klasa utrzymana wysoko z powodu zupełnie innego niż ryzyko. Usługa
    obsługuje urządzenia wejściowe, więc jej wyłączenie potrafi odciąć
    administratora od konsoli w chwili wykonania polecenia. Przed zmianą
    trzeba znać drogę wejścia poza konsolą.
  en: |
    The category is lowered by the reach - a binding of short reach takes a bodily nearness, and an
    attacker able to stand at the press that holds the server has weightier things at hand than that
    service.

    The worth is for all that named outright, that the item look no formality - code that is not used
    is not thereby harmless code, it is code nobody looks at.

    The class is held high of a ground wholly other than the hazard. The service handles the gear of
    putting in, so its switching off can cut an administrator off from the console at the hour the
    command is carried out. Before the change one must know the way in beside the console.
