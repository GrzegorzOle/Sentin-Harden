id: win2025-ssdp-discovery-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa wykrywania urządzeń w sieci lokalnej wyłączona
    en: The local network device discovery service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę wykrywania urządzeń w sieci lokalnej. Usługa ta
    rozsyła po sieci pytania o to, co w niej jest, i nasłuchuje
    odpowiedzi oraz ogłoszeń wysyłanych przez inne urządzenia.

    Zostawiam kategorię średnią i chcę oddzielić dwie rzeczy, bo
    sąsiadujący punkt o udostępnianiu maszyny jako urządzenia sieciowego
    dotyczy drugiej strony tej samej rozmowy. Ta usługa jest stroną
    pytającą i słuchającą. Tamta jest stroną ogłaszającą się.

    Wartość punktu leży w dwóch miejscach. Pierwsze: serwer nie ma
    żadnego powodu, żeby pytać sieć lokalną, co w niej jest — nie szuka
    drukarek ani odtwarzaczy, a jego zasoby są mu wskazane
    konfiguracją, nie znalezione. Ruch, który wychodzi z tej usługi,
    to ruch, którego nikt nie zamawiał.

    Drugie jest poważniejsze. Protokół ten opiera się na wysyłaniu do
    grupy i odbieraniu odpowiedzi od dowolnego, kto zechce odpowiedzieć.
    Odpowiedź wskazuje adres, pod który należy się zwrócić po dalsze
    informacje — a to znaczy, że obca strona w tej samej sieci może
    podać serwerowi dowolne miejsce jako miejsce właściwe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: udział
    serwera w rozmowie, w której każdy w sieci może się odezwać
    i wskazać, dokąd pójść po dalsze dane.
  en: |
    The item switches off the service of the finding of devices in the near net. That service sends
    askings about the net as to what is in it and hearkens for answers and for the callings abroad
    sent by other devices.

    I leave the category middling and would sunder two things, the neighbouring item on the dealing
    out of the machine as a device of the net bearing on the other side of that same speech. This
    service is the side that asks and hearkens. That one is the side that calls itself abroad.

    The worth of the item lies in two steads. The first - a server has no ground at all to ask the
    near net what is in it; it seeks neither printers nor players, and its holdings are pointed out to
    it by the settings and not found. The traffic going out of that service is traffic nobody ordered.

    The second is weightier. That reckoning stands upon a sending to a gathering and a taking of an
    answer off whoever will answer. The answer points out a whereabouts to turn to for further tidings
    - and that means a strange side in the same net may name to the server any stead at all as the
    right one.

    What an attacker gains while the item goes unmet - the server's share in a speech wherein everyone
    in the net may speak up and point out whither to go for further data.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" wobec oceny dla stacji roboczej
    i różnica jest tu czysta, bo nie wynika z osądu, tylko z tego, że na
    serwerze po prostu nie ma odbiorcy tej usługi.

    Na stacji roboczej wykrywanie urządzeń jest podstawą kilku rzeczy,
    których ludzie używają codziennie: znajdowania drukarki, znajdowania
    odtwarzacza, przeglądania otoczenia sieciowego w oknie plików. Na
    serwerze żadna z tych rzeczy nie występuje. Zasoby serwera są
    wskazane konfiguracją — ścieżką, nazwą, adresem — i nic z tego nie
    jest znajdowane przez rozglądanie się po sieci.

    Jedno następstwo trzeba jednak wymienić wprost, bo jest to ta sama
    pułapka, co przy usłudze administracyjnej serwera sieciowego, tylko
    o wiele łagodniejsza. Od tej usługi zależy usługa udostępniania
    maszyny jako urządzenia sieciowego, opisana osobnym punktem.
    Zatrzymanie tej zatrzyma też tamtą. W tym przypadku jest to skutek
    pożądany — obie reguły idą w tę samą stronę — ale warto wiedzieć,
    że drugi punkt zrobi się zielony sam, i nie jest to pomyłka
    w raporcie.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease" against the reckoning for a workstation, and the difference is
    here clean, it following not from a judging but from that upon a server there is simply nobody to
    take that service.

    Upon a workstation the finding of devices is the ground of some things people use every day -
    the finding of a printer, the finding of a player, the looking about the neighbourhood of the net
    in the window of files. Upon a server none of those things befalls. The holdings of a server are
    pointed out by the settings - by a path, by a name, by a whereabouts - and none of that is found
    by a looking about the net.

    One following must be named plainly for all that, it being the same snare as at the service of
    ruling of the server of the net, only far milder. Upon that service there hangs the service of the
    dealing out of the machine as a device of the net, set forth in an item of its own. The stopping
    of this one will stop that one too. In this case it is the wanted outcome - both rules go the same
    way - but it is worth knowing that the second item will turn green of itself, and that is no
    mistake in the report.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - printing
  what_breaks:
    pl:
      - Przestaje działać znajdowanie drukarek i odtwarzaczy przez rozglądanie się po sieci
      - Na serwerze nie występuje żaden z tych scenariuszy, bo zasoby są wskazane konfiguracją
      - Zatrzymuje się również usługa udostępniania maszyny jako urządzenia sieciowego, która od tej zależy
      - Sąsiedni punkt zrobi się przez to zielony sam i nie jest to pomyłka w raporcie
    en:
      - The finding of printers and of players by a looking about the net stops working
      - Upon a server none of those happenings befalls, the holdings being pointed out by the settings
      - The service of the dealing out of the machine as a device of the net, which hangs upon this one, stops as well
      - The neighbouring item will thereby turn green of itself, and that is no mistake in the report
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa składnik odnajdujący urządzenia w sieci przez rozgłaszanie, a nie przez wskazany adres
    en:
      - A piece works upon the machine that finds devices in the net by a calling abroad and not by a pointed-out whereabouts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The service that presents this machine as a network device depends on
    # this one and stops with it. Here that is the wanted outcome - the
    # neighbouring item turns green on its own, which is not a reporting error.
    Stop-Service -Name 'SSDPSRV' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SSDPSRV' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SSDPSRV' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Ta usługa jest stroną pytającą i słuchającą. Sąsiedni punkt
    o udostępnianiu maszyny jako urządzenia sieciowego dotyczy strony
    ogłaszającej się — to dwie strony tej samej rozmowy.

    Wartość leży w dwóch miejscach. Serwer nie ma powodu pytać sieci, co
    w niej jest: jego zasoby są mu wskazane konfiguracją, nie
    znalezione. Poważniejsze jest drugie — odpowiedź w tym protokole
    wskazuje adres, pod który należy się zwrócić po dalsze informacje,
    więc obca strona w tej samej sieci może podać serwerowi dowolne
    miejsce jako właściwe.

    Zatrzymanie tej usługi zatrzymuje też usługę zależną z sąsiedniego
    punktu. Tutaj jest to skutek pożądany.
  en: |
    That service is the side that asks and hearkens. The neighbouring item on the dealing out of the
    machine as a device of the net bears on the side that calls itself abroad - two sides of the one
    speech.

    The worth lies in two steads. A server has no ground to ask the net what is in it - its holdings
    are pointed out to it by the settings and not found. The weightier is the second - an answer in
    that reckoning points out a whereabouts to turn to for further tidings, so a strange side in the
    same net may name to the server any stead at all as the right one.

    The stopping of that service stops also the hanging service of the neighbouring item. Here that is
    the wanted outcome.
