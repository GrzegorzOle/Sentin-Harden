id: win10-device-install-deny-sbp2-class

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Zakaz instalacji sterowników pamięci masowej na starszym złączu szeregowym
    en: Drivers of mass memory upon the older serial connector forbidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje instalowania sterowników pamięci masowej
    podłączanej starszym złączem szeregowym i stosuje ten zakaz także
    do urządzeń już zainstalowanych.

    Klasa, której punkt dotyczy, obejmuje dyski i napędy zgłaszające się
    przez ten protokół. Ich obsługa korzysta z bezpośredniego dostępu do
    pamięci, więc urządzenie podłączone tą drogą czyta i zapisuje pamięć
    maszyny w trakcie przesyłania danych.

    Różnica wobec punktu o kontrolerach polega na zakresie. Tamten
    zamyka całe złącze wraz z peryferiami; ten zamyka jedną klasę
    urządzeń — pamięć masową. Sprzęt studyjny i pomiarowy na tym samym
    złączu działa dalej.

    Z tej przyczyny punkt bywa właściwym wyborem tam, gdzie zamknięcie
    całego złącza jest za drogie. Zamyka najczęstszą drogę nadużycia
    i zostawia otwartą drogę użyteczną.

    Odnotowuję, że zakaz stosuje się wstecznie. Bez tego urządzenie
    podłączone wcześniej działałoby dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    do pamięci maszyny przez dysk podłączony starszym złączem szeregowym.
  en: |
    The setting forbids the laying on of drivers of mass memory put in by the older serial connector, and holds
    that ban to devices already laid on as well.

    The class the item touches takes in disks and drives giving themselves out through that way of speaking. Their
    serving uses a straight reach of memory, so a device put in by that road reads and writes the machine's memory
    while the data are carried.

    The difference against the item about controllers lies in the reach. That one shuts the whole connector
    together with the things about it; this one shuts one class of devices - mass memory. Things of a studio and
    of measuring upon that same connector work on.

    For that cause the item is at times the right choice where the shutting of the whole connector is too dear. It
    shuts the commonest road of misuse and leaves the useful road open.

    I set down that the ban holds backward. Without that a device put in earlier would work on.

    What an attacker gains while the item goes unmet: a reach of the machine's memory through a disk put in by the
    older serial connector.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś korzysta z dysku zewnętrznego na tym złączu.

    Miejscem wartym uwagi są stanowiska pracujące z materiałem wideo
    i dźwiękiem. Tam macierze i dyski na tym złączu bywają w użyciu do
    dziś, bo sprzęt jest sprawny, a wymiana kosztowna. Po zmianie dysk
    przestanie się zgłaszać.

    Miejscem drugim są archiwa. Nośniki sprzed lat bywają odczytywane
    wyłącznie tą drogą, bo złącze późniejsze nie było wtedy dostępne.
    Warto sprawdzić, czy na stanowisku nie stoi takie zadanie.

    Odnotowuję, że sprzęt niebędący pamięcią masową działa dalej. Kamera
    albo interfejs dźwiękowy na tym samym złączu nie jest objęty.

    Skutek jest widoczny dla użytkownika i pojawia się natychmiast,
    bez restartu. Powrót również jest natychmiastowy.

    Czego to nie psuje: dysków na złączu uniwersalnym, dysków wewnętrznych,
    kamer i interfejsów dźwiękowych na tym samym złączu, logowania,
    drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody uses an outward disk upon that
    connector.

    The place worth notice is stations working with matter of picture and of sound. There arrays and disks upon
    that connector are at times in use to this day, the things being sound and the changing out dear. After the
    change the disk will cease to give itself out.

    The second place is keepings of old records. Carriers of years past are at times read solely by that road, a
    later connector not having been to be had then. It is worth looking at whether such a task stands at the
    station.

    I set down that things that are no mass memory work on. A picture-taker or a face for sound upon that same
    connector is not held by it.

    The consequence is plain to the user and shows at once, with no restart. The going back is at once too.

    What this does not break: disks upon the universal connector, inward disks, picture-takers and faces for sound
    upon that same connector, logging on, or printing.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Dysk zewnętrzny albo macierz na starszym złączu szeregowym przestanie się zgłaszać w systemie
      - Stanowiska pracujące z materiałem wideo i dźwiękiem korzystają z takiego sprzętu do dziś, bo wymiana jest kosztowna
      - Archiwum odczytywane wyłącznie tą drogą przestanie być dostępne, co warto sprawdzić przed zmianą
      - Kamera i interfejs dźwiękowy na tym samym złączu nie są objęte i działają dalej
      - Dyski na złączu uniwersalnym, dyski wewnętrzne, logowanie, praca programów i drukowanie pozostają bez zmian
    en:
      - An outward disk or array upon the older serial connector will cease to give itself out in the system
      - Stations working with matter of picture and of sound use such things to this day, the changing out being dear
      - A keeping of old records read solely by that road will cease to be within reach, which is worth looking at before the change
      - A picture-taker and a face for sound upon that same connector are not held by it and work on
      - Disks upon the universal connector, inward disks, logging on, the work of programs and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko odczytuje archiwum z macierzy podłączonej starszym złączem szeregowym
      - Praca z materiałem wideo opiera się na dysku na tym złączu i nie ma dla niego zamiennika
    en:
      - The station reads a keeping of old records off an array put in by the older serial connector
      - The work with matter of picture rests upon a disk upon that connector and there is no other in its place
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $deny = $item.DenyDeviceClasses
        $retroactive = $item.DenyDeviceClassesRetroactive
        $listKey = Join-Path $path 'DenyDeviceClasses'
        $listed = @()
        if (Test-Path -Path $listKey) {
          $listed = @(
            (Get-ItemProperty -Path $listKey -ErrorAction Stop).PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { ([string]$_.Value).Trim().ToLowerInvariant() }
          )
        }
        # Naming what is missing matters more than a bare failure: a list set up by
        # halves is a different case from one nobody has touched.
        $absent = @(@('{d48179be-ec20-11d1-b6b8-00c04fa372a7}') | Where-Object { $listed -notcontains $_ })
        if ($null -eq $deny -or $null -eq $retroactive) { 'MISSING' }
        elseif ([int]$deny -eq 1 -and [int]$retroactive -eq 1 -and $absent.Count -eq 0) { 'DENIED_RETROACTIVELY' }
        else { 'DENY=' + $deny + ' RETROACTIVE=' + $retroactive + ' ABSENT=' + ($absent -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DENIED_RETROACTIVELY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $listKey = Join-Path $path 'DenyDeviceClasses'
    $entries = @()
    if (Test-Path -Path $listKey) {
      $entries = @(
        (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties |
          Where-Object { $_.Name -notlike 'PS*' } |
          ForEach-Object { [pscustomobject]@{ name = $_.Name; value = [string]$_.Value } }
      )
    }
    [pscustomobject]@{
      path          = $path
      key_existed   = (Test-Path -Path $path)
      deny          = $item.DenyDeviceClasses
      deny_existed  = ($null -ne $item.DenyDeviceClasses)
      retro         = $item.DenyDeviceClassesRetroactive
      retro_existed = ($null -ne $item.DenyDeviceClassesRetroactive)
      list_key      = $listKey
      list_existed  = (Test-Path -Path $listKey)
      entries       = $entries
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyDeviceClasses' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DenyDeviceClassesRetroactive' -Value 1 -Type DWord
    $listKey = Join-Path $path 'DenyDeviceClasses'
    if (-not (Test-Path -Path $listKey)) { New-Item -Path $listKey -Force | Out-Null }
    # Whatever somebody else put here guards against something this rule knows
    # nothing of, so the list is added to and never written over.
    $taken = @{}
    $present = @()
    foreach ($property in (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties) {
      if ($property.Name -notlike 'PS*') {
        $taken[$property.Name] = $true
        $present += ([string]$property.Value).Trim().ToLowerInvariant()
      }
    }
    $index = 1
    foreach ($class in @('{d48179be-ec20-11d1-b6b8-00c04fa372a7}')) {
      if ($present -notcontains $class) {
        while ($taken.ContainsKey([string]$index)) { $index++ }
        New-ItemProperty -Path $listKey -Name ([string]$index) -Value $class -PropertyType String -Force | Out-Null
        $taken[[string]$index] = $true
      }
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.deny_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceClasses' -Value $b.deny -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceClasses' -ErrorAction SilentlyContinue
    }
    if ($b.retro_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceClassesRetroactive' -Value $b.retro -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceClassesRetroactive' -ErrorAction SilentlyContinue
    }
    Remove-Item -Path $b.list_key -Recurse -Force -ErrorAction SilentlyContinue
    if ($b.list_existed) {
      New-Item -Path $b.list_key -Force | Out-Null
      foreach ($entry in @($b.entries)) {
        New-ItemProperty -Path $b.list_key -Name $entry.name -Value $entry.value -PropertyType String -Force | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-device-installation-with-group-policy

notes:
  pl: |
    Reguła jest tańszym wariantem punktu o kontrolerach i warto, żeby
    aplikacja pokazała je razem jako wybór, a nie jako dwa niezależne
    zadania. Tamten zamyka całe złącze; ten zamyka jedną klasę urządzeń.

    Argument wart postawienia wprost dotyczy tego, co zostaje otwarte.
    Zamknięcie klasy pamięci masowej nie zamyka bezpośredniego dostępu do
    pamięci jako takiego — sprzęt innej klasy na tym samym złączu dalej
    z niego korzysta. Punkt zdejmuje najczęstszą drogę, a nie całą.

    Odnotowuję, że zmiana jest natychmiastowa w obie strony, w odróżnieniu
    od punktu o kontrolerach. To czyni ją dobrym kandydatem do sprawdzenia
    na jednym stanowisku przed decyzją szerszą.
  en: |
    The rule is the cheaper shape of the item about controllers, and it is well that the application show them
    together as a choice and not as two tasks standing apart. That one shuts the whole connector; this one shuts
    one class of devices.

    The argument worth putting outright touches what stays open. The shutting of the class of mass memory shuts
    not the straight reach of memory as such - things of another class upon that same connector use it still. The
    item takes away the commonest road and not the whole of it.

    I set down that the change is at once in both directions, unlike the item about controllers. That makes it a
    good one to try upon a single station before a wider decision.
