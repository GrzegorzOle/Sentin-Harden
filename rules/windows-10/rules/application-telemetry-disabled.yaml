id: win10-application-telemetry-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Wysyłanie danych o uruchamianych programach wyłączone
    en: The sending of data about programs set going switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza przekazywanie producentowi systemu danych o tym,
    jakie programy są na maszynie uruchamiane.

    Mechanizm ten jest sąsiadem spisu zainstalowanego oprogramowania,
    ale dotyczy czegoś innego. Spis mówi, co na maszynie stoi. Ten
    mechanizm mówi, co jest naprawdę używane i jak często.

    Różnica ma znaczenie. Wykaz zainstalowanych programów jest w dużej
    mierze przewidywalny, bo zestaw bywa podobny na wielu maszynach.
    Wykaz programów uruchamianych opisuje konkretnego człowieka przy
    konkretnej maszynie: czym się zajmuje, kiedy pracuje, jakich narzędzi
    używa naprawdę.

    Punkt jest oceniony nisko, bo sam z siebie nie zamyka żadnej drogi
    wejścia i odbiorcą danych jest producent systemu. Wartość polega na
    ograniczeniu tego, co maszyna opowiada o pracy swojego użytkownika.

    Odnotowuję, że wartość w rejestrze działa przeciwnie do nazwy
    ustawienia w edytorze zasad: zero oznacza wyłączenie wysyłania.
    Warto na to uważać przy ręcznym sprawdzaniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost
    — maszyna opisuje na zewnątrz sposób pracy swojego użytkownika.
  en: |
    The setting switches off the handing to the system's maker of data upon which programs are set going upon the
    machine.

    That mechanism is the neighbour of the setting down of laid-on software, but touches another thing. The
    setting down says what stands upon the machine. This mechanism says what is truly used and how often.

    The difference has weight. A roll of laid-on programs is in great part to be foretold, the set being alike
    upon many machines. A roll of programs set going sets out a given person at a given machine: what they busy
    themselves with, when they work, which tools they truly use.

    The item is graded low, closing of itself no road in and the taker of the data being the system's maker. The
    worth lies in the bounding of what the machine tells of its user's work.

    I set down that the value in the register runs contrary to the setting's name in the editor of policy: a zero
    means the sending is switched off. That is worth heeding at a looking by hand.

    What an attacker gains while the item goes unmet: nothing outright - the machine sets out abroad the manner of
    its user's work.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana dotyczy wyłącznie wysyłania danych. Programy uruchamiają się
    tak jak dotąd, a użytkownik niczego nie zauważy.

    Odnotowuję jedyne miejsce warte uwagi, wspólne z punktem o spisie
    oprogramowania: narzędzia planowania aktualizacji po stronie
    producenta, którym te dane służą do oceny, co na maszynach faktycznie
    działa. Po zmianie ich obraz tej maszyny będzie uboższy.

    Jest to zastrzeżenie dotyczące narzędzia po stronie obsługi, a nie
    pracy użytkownika.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: uruchamiania programów, zgodności starszych
    programów, aktualizowania systemu, sklepu systemowego, logowania,
    drukowania.
  en: |
    The class is "no disruption".

    The change touches solely the sending of data. Programs are set going as hitherto, and the user will mark
    nothing.

    I set down the one place worth notice, held in common with the item about the setting down of software: tools
    of the planning of updates upon the maker's side, which these data serve for the weighing of what truly works
    upon the machines. After the change their picture of this machine will be the poorer.

    It is a reservation touching a tool upon the keepers' side and not the user's work.

    The consequence shows at once, with no restart.

    What this does not break: the setting of programs going, the agreement of older programs, the bringing of the
    system up to date, the system's store, logging on, or printing.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia planowania aktualizacji po stronie producenta będą miały uboższy obraz tego, co na tej maszynie faktycznie działa
      - Zastrzeżenie dotyczy narzędzia po stronie obsługi, a nie pracy użytkownika przy maszynie
      - Programy uruchamiają się tak jak dotąd i użytkownik nie zauważy zmiany
      - Wartość w rejestrze działa przeciwnie do nazwy ustawienia, co warto pamiętać przy ręcznym sprawdzaniu
      - Zgodność starszych programów, aktualizowanie systemu, sklep systemowy, logowanie i drukowanie pozostają bez zmian
    en:
      - Tools of the planning of updates upon the maker s side will have a poorer picture of what truly works upon this machine
      - The reservation touches a tool upon the keepers side and not the user s work at the machine
      - Programs are set going as hitherto and the user will mark no change
      - The value in the register runs contrary to the setting s name, which is worth keeping in mind at a looking by hand
      - The agreement of older programs, the bringing of the system up to date, the system s store, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Planowanie aktualizacji opiera się na danych producenta o rzeczywistym użyciu programów na maszynach
    en:
      - The planning of updates rests upon the maker s data of the true use of programs upon the machines
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value runs contrary to the name of the setting in the editor: a zero
      # means the sending is switched off.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AITEnable'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'AITEnable'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AITEnable' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Reguła jest sąsiadem punktu o spisie zainstalowanego oprogramowania
    i warto, żeby aplikacja pokazała je razem, zaznaczając różnicę. Spis
    mówi, co stoi. Ten punkt mówi, co jest używane — a to drugie opisuje
    człowieka, nie maszynę.

    Argument wart zachowania dotyczy właśnie tej różnicy. Zestaw
    zainstalowanych programów bywa podobny na wielu stanowiskach. Zestaw
    programów uruchamianych, z częstotliwością i porą, jest opisem
    konkretnej osoby przy konkretnej pracy.

    Odnotowuję pułapkę w nazwie. Wartość zero w rejestrze oznacza
    wyłączenie wysyłania, czyli przeciwnie do tego, co sugeruje nazwa
    ustawienia w edytorze zasad. Aplikacja powinna to pokazać, bo ręczne
    sprawdzenie bywa tu czytane na odwrót.
  en: |
    The rule is the neighbour of the item about the setting down of laid-on software, and it is well that the
    application show them together, marking the difference. The setting down says what stands. This item says what
    is used - and the latter sets out a person and no machine.

    The argument worth keeping touches that very difference. The set of laid-on programs is at times alike upon
    many stations. The set of programs set going, with how often and at what hour, is a setting out of a given
    person at a given work.

    I set down the snare in the name. A zero in the register means the sending is switched off, which is to say
    contrary to what the setting's name in the editor of policy hints at. The application ought to show that, a
    looking by hand being here at times read the wrong way about.
