id: win10-ftp-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera przesyłania plików starszym protokołem wyłączona
    en: The server service for the carrying of files by the older way of speaking switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę serwera przesyłania plików starszym
    protokołem, czyli zamyka możliwość pobierania i wysyłania plików na
    tę maszynę tą drogą.

    Protokół ten powstał przed szyfrowaniem i w postaci podstawowej go
    nie ma. Nazwa konta i hasło idą przez sieć jawnie, tak samo jak
    przesyłane pliki. Każdy, kto ruch obserwuje, dostaje poświadczenia
    w czytelnej postaci.

    Zagrożeniem drugim jest sposób, w jaki takie serwery bywają
    konfigurowane. Dostęp anonimowy jest tu rozwiązaniem tradycyjnym
    i bywa włączany dla wygody, a wtedy katalog staje się miejscem,
    do którego każdy może coś zapisać.

    Na stanowisku roboczym usługa ta nie ma zastosowania. Jeżeli działa,
    to zwykle dlatego, że ktoś zainstalował rolę serwera sieciowego
    w całości, nie wybierając składników.

    Odnotowuję, że punkt nie dotyczy programów klienckich. Pobieranie
    plików z cudzych serwerów tym protokołem działa dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    poświadczenia przesyłane jawnie i katalog do zapisu na maszynie.
  en: |
    The setting switches off the server service for the carrying of files by the older way of speaking, which is
    to say it shuts the power of drawing files from and sending files to this machine by that road.

    That way of speaking came about before ciphering and in its plain shape has none. The name of a reckoning and
    the word of passing go through the network open, and so do the files carried. Whoever watches the traffic gets
    the warrants in a readable shape.

    The second danger is the manner in which such servers are at times set up. Reach without a name is here the
    old answer and is at times turned on for ease, and then the directory becomes a place into which anybody may
    write something.

    Upon a working station that service has no use. If it works, it is commonly because somebody laid on the
    office of a web server whole, choosing no parts.

    I set down that the item touches not programs upon the client's side. The drawing of files from others'
    servers by that way of speaking works on.

    What an attacker gains while the item goes unmet: warrants carried openly and a directory upon the machine to
    write into.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś wysyła pliki na tę maszynę tą drogą.

    Miejscem wartym uwagi są urządzenia, które umieją wysyłać pliki
    wyłącznie tym protokołem: skanery, drukarki wielofunkcyjne, urządzenia
    pomiarowe, starsze sterowniki przemysłowe. Jeżeli któreś z nich
    odkłada pliki na tej maszynie, po zmianie przestanie.

    Odnotowuję, że rozwiązaniem jest przyjęcie tych plików inną drogą,
    a nie pozostawienie serwera. Większość takich urządzeń umie także
    zapis na udziale sieciowym, a te, które nie umieją, powinny odkładać
    pliki na maszynie do tego przeznaczonej, a nie na stanowisku roboczym.

    Miejscem drugim są własne skrypty wysyłające raporty. Zdarza się,
    że kierują je na stanowisko osoby, która je czyta.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pobierania plików z cudzych serwerów tym
    protokołem, przeglądania stron, dostępu do udziałów, logowania,
    drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody sends files onto this machine by
    that road.

    The place worth notice is devices that can send files only by that way of speaking: scanners, printers of many
    uses, instruments of measuring, older controllers of industry. If any of them lays files down upon this
    machine, after the change it will cease to.

    I set down that the answer is the taking in of those files by another road and no leaving of the server
    standing. Most such devices can also write onto a share of the network, and those that cannot ought to lay
    their files down upon a machine meant for it and not upon a working station.

    The second place is scripts of one's own that send reports. It happens that they are pointed at the station of
    whoever reads them.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the drawing of files from others' servers by that way of speaking, the looking over
    of pages, the reach of shares, logging on, or printing.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Skanery i drukarki wielofunkcyjne odkładające pliki na tej maszynie tym protokołem przestaną to robić
      - Starsze sterowniki przemysłowe i urządzenia pomiarowe umiejące wyłącznie tę drogę stracą miejsce zapisu
      - Rozwiązaniem jest przyjęcie tych plików na udziale sieciowym albo na maszynie do tego przeznaczonej
      - Własne skrypty wysyłające raporty na to stanowisko trzeba będzie skierować gdzie indziej
      - Pobieranie plików z cudzych serwerów tym protokołem, przeglądanie stron, dostęp do udziałów i drukowanie pozostają bez zmian
    en:
      - Scanners and printers of many uses that lay files down upon this machine by that way of speaking will cease to do so
      - Older controllers of industry and instruments of measuring that know only that road will lose their place of writing
      - The answer is the taking in of those files upon a share of the network or upon a machine meant for it
      - Scripts of one s own that send reports onto this station will have to be pointed elsewhere
      - The drawing of files from others servers by that way of speaking, the looking over of pages, the reach of shares and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenie pomiarowe albo skaner odkłada pliki na tej maszynie i umie wyłącznie ten protokół
    en:
      - An instrument of measuring or a scanner lays files down upon this machine and knows only that way of speaking
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'FTPSVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'FTPSVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'FTPSVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/whats-new-in-iis-8/iis-80-ftp-logon-attempt-restrictions

notes:
  pl: |
    Reguła jest z tych, przy których najważniejsze jest pytanie, skąd
    usługa w ogóle wzięła się na stanowisku roboczym. Warto, żeby
    aplikacja to postawiła: zwykle z instalacji roli serwera sieciowego
    w całości, bez wybierania składników.

    Argument wart zachowania dotyczy jawności. Nazwa konta, hasło i pliki
    idą przez sieć w postaci czytelnej. Nie jest to słabość konfiguracji
    do poprawienia — tak protokół został zbudowany, w czasach, gdy sieć
    uważano za zaufaną.

    Odnotowuję rozwiązanie po stronie urządzeń. Skaner albo urządzenie
    pomiarowe umiejące wyłącznie tę drogę nie jest powodem, żeby zostawić
    serwer na stanowisku roboczym — jest powodem, żeby wskazać mu maszynę
    do tego przeznaczoną.
  en: |
    The rule is of those where the weightiest question is whence the service came upon a working station at all.
    It is well that the application put it: commonly from the laying on of the office of a web server whole, with
    no parts chosen.

    The argument worth keeping touches the openness. The name of a reckoning, the word of passing and the files go
    through the network in a readable shape. It is no weakness of the setting up to be put right - the way of
    speaking was so built, in days when a network was held trusted.

    I set down the answer upon the devices' side. A scanner or an instrument of measuring that knows only that
    road is no ground for leaving a server upon a working station - it is ground for pointing it at a machine
    meant for that.
