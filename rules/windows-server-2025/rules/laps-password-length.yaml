id: win2025-laps-password-length

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Długość losowanego hasła lokalnego administratora co najmniej piętnaście znaków
    en: Length of the randomly chosen local administrator password at least fifteen characters
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt ustala dolną granicę długości losowanego hasła lokalnego
    administratora na piętnaście znaków. Dłuższe również spełnia wymaganie.

    Zostawiam kategorię średnią, ale chcę powiedzieć, dlaczego granicą jest
    akurat piętnaście, bo wygląda to na liczbę wziętą z powietrza, a nie
    jest.

    Poniżej piętnastu znaków system przechowuje obok właściwej postaci
    hasła jeszcze jedną, pochodzącą z bardzo starego mechanizmu.
    Ta druga postać jest nieporównanie słabsza i daje się odtworzyć do
    hasła w czasie, który nie robi nikomu różnicy. Od piętnastu znaków
    w górę nie powstaje w ogóle. Granica nie mówi więc „dłuższe jest
    lepsze" — ona wskazuje próg, powyżej którego znika cały słabszy zapis.

    Na serwerze rzecz waży tyle, ile waży samo konto lokalnego
    administratora, czyli dużo — bo to jest konto działające wtedy, gdy nie
    działa nic innego. Skoro i tak nikt tego hasła nie wpisuje z pamięci,
    długość nic nie kosztuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dodatkową,
    łatwiejszą do złamania postać hasła konta, które otwiera maszynę
    niezależnie od stanu katalogu.
  en: |
    The item sets the lower bound on the length of the randomly chosen
    local administrator password at fifteen characters. A longer one meets
    the requirement too.

    I keep the category medium, but I want to say why the bound is fifteen
    in particular, because it looks like a number pulled out of the air and
    is not.

    Below fifteen characters the system keeps, alongside the proper form of
    the password, one more form derived from a very old mechanism. That
    second form is incomparably weaker and can be turned back into the
    password in a time that makes no difference to anybody. From fifteen
    characters up it is not created at all. So the bound does not say
    "longer is better" - it marks the threshold above which the whole
    weaker record disappears.

    On a server the matter weighs as much as the local administrator
    account itself does, which is a great deal - because it is the account
    that works when nothing else does. Since nobody types this password
    from memory anyway, length costs nothing.

    What an attacker gains while the item goes unmet: an additional,
    easier-to-break form of the password for an account that opens the
    machine regardless of the directory's state.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tutaj jest to stwierdzenie ścisłe. Hasło jest
    losowane przez maszynę i odczytywane z katalogu, a nie wpisywane
    z pamięci, więc jego długość nie ma żadnego wpływu na to, jak się z nim
    pracuje. Piętnaście znaków czyta się z ekranu tak samo jak osiem.

    Jedyna rzecz warta sprawdzenia dotyczy oprogramowania, a nie ludzi:
    starsze narzędzia zarządzające potrafią mieć własne, krótsze
    ograniczenie długości w polu, w którym podaje się hasło. Jeżeli
    dostawca utrzymania łączy się przez taki program, dłuższe hasło zostanie
    przez niego ucięte albo odrzucone — i będzie to wyglądać na błędne
    hasło, a nie na ograniczenie narzędzia. To jest przypadek rzadki, ale
    dający się nazwać i łatwy do potwierdzenia przed zmianą.

    Druga uwaga, taka sama jak przy okresie ważności: bez włączonego
    mechanizmu hasła lokalnego administratora ten wpis istnieje i nie robi
    nic.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption", and here that is a precise statement. The
    password is chosen by the machine and read from the directory rather
    than typed from memory, so its length has no bearing on how people work
    with it. Fifteen characters are read off a screen just like eight.

    The one thing worth checking concerns software rather than people:
    older management tools can have their own, shorter limit on the length
    of the field where a password is entered. If a maintenance vendor
    connects through such a program, a longer password will be truncated or
    rejected by it - and that will look like a wrong password rather than a
    limit of the tool. This is a rare case, but a nameable one and easy to
    confirm before the change.

    A second note, the same as at the term of validity: without the local
    administrator password mechanism on, this entry exists and does
    nothing.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Nic w codziennej pracy — hasło jest losowane przez maszynę i odczytywane z katalogu, a nie wpisywane z pamięci
      - Starsze narzędzie zarządzające z własnym, krótszym ograniczeniem długości pola utnie takie hasło albo je odrzuci
      - Wygląda to wtedy na błędne hasło, a nie na ograniczenie narzędzia, więc diagnoza idzie w złą stronę
      - Bez włączonego mechanizmu hasła lokalnego administratora ten wpis istnieje i nie robi nic
    en:
      - Nothing in daily work - the password is chosen by the machine and read from the directory rather than typed from memory
      - An older management tool with its own shorter field limit will truncate or reject such a password
      - That then looks like a wrong password rather than a limit of the tool, so the diagnosis goes the wrong way
      - Without the local administrator password mechanism on, this entry exists and does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dostawca utrzymania łączy się przez narzędzie z własnym, krótszym ograniczeniem długości hasła i nie ma zamiennika
    en:
      - A maintenance vendor connects through a tool with its own shorter password length limit and there is no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordLength'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordLength' -ErrorAction SilentlyContinue).'PasswordLength'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordLength'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Fifteen is the threshold above which the system stops keeping the extra,
    # much weaker form of the password - not merely "longer is better". Where
    # the length in force is already greater, leave it.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Fifteen is the lower bound the item takes; a longer password meets it too.
    Set-ItemProperty -Path $path -Name 'PasswordLength' -Value 15 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Piętnaście nie jest liczbą wziętą z powietrza. Poniżej tej granicy
    system przechowuje obok właściwej postaci hasła jeszcze jedną,
    pochodzącą z bardzo starego mechanizmu, nieporównanie słabszą. Od
    piętnastu znaków w górę nie powstaje ona w ogóle.

    Granica nie mówi więc „dłuższe jest lepsze" — wskazuje próg, powyżej
    którego znika cały słabszy zapis.

    Skoro nikt tego hasła nie wpisuje z pamięci, długość nic nie kosztuje.
    Jedyny przypadek do sprawdzenia dotyczy oprogramowania: starsze
    narzędzie zarządzające z krótszym ograniczeniem pola utnie takie hasło,
    a wygląda to na błędne hasło.
  en: |
    Fifteen is not a number pulled out of the air. Below that bound the
    system keeps, alongside the proper form of the password, one more
    derived from a very old mechanism and incomparably weaker. From fifteen
    characters up it is not created at all.

    So the bound does not say "longer is better" - it marks the threshold
    above which the whole weaker record disappears.

    Since nobody types this password from memory, length costs nothing. The
    one case to check concerns software: an older management tool with a
    shorter field limit will truncate such a password, and that looks like
    a wrong password.
