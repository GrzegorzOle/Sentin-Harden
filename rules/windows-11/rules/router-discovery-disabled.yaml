id: win11-router-discovery-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Samoczynne wyszukiwanie bramy sieciowej wyłączone
    en: Automatic searching for a network gateway switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Maszyna może dowiedzieć się, którędy wychodzi ruch poza sieć lokalną, na
    trzy sposoby: z wpisu ręcznego, z konfiguracji rozdawanej przez serwer
    przydzielający adresy albo z komunikatu rozesłanego po sieci przez
    urządzenie ogłaszające się jako brama. Punkt dotyczy tej trzeciej drogi.

    Komunikat ogłaszający bramę nie jest niczym uwierzytelniany. Wysłać go może
    każde urządzenie w tej samej sieci i nie ma sposobu, by odbiorca sprawdził,
    czy nadawca rzeczywiście jest bramą. Maszyna, która takiego komunikatu
    posłucha, zaczyna kierować cały ruch wychodzący poza sieć lokalną przez
    wskazane urządzenie.

    Jest to przejęcie ruchu w najprostszej możliwej postaci. Napastnik nie musi
    niczego łamać ani podsłuchiwać — wystarczy, że ogłosi się bramą i poczeka.
    Ruch przechodzi przez niego, więc może go czytać, zmieniać i przekazywać
    dalej, a maszyna nie widzi niczego niepokojącego, bo działa zgodnie
    z projektem.

    Punkt zamyka tę drogę. Brama pochodzi odtąd wyłącznie z konfiguracji, a nie
    z ogłoszenia rzuconego w sieć.
  en: |
    A machine can learn which way traffic leaves the local network in three ways: from
    an entry made by hand, from the configuration handed out by the server assigning
    addresses, or from a message sent across the network by a device announcing itself
    as a gateway. The item concerns that third way.

    A message announcing a gateway is not authenticated by anything. Any device on the
    same network can send it and there is no way for a receiver to check whether the
    sender really is a gateway. A machine that listens to such a message starts
    steering all traffic leaving the local network through the named device.

    This is the taking over of traffic in its simplest possible form. The attacker
    need break nothing and listen in on nothing - announcing themselves as a gateway
    and waiting is enough. The traffic passes through them, so they can read it,
    change it and pass it on, and the machine sees nothing untoward because it is
    working as designed.

    The item closes that route. From then on the gateway comes from configuration
    alone, not from an announcement thrown out onto the network.

disruption_description:
  pl: |
    Zmiana zaczyna obowiązywać po ponownym uruchomieniu maszyny i wymaga
    świadomego wdrożenia.

    W sieci firmowej i domowej brama pochodzi z konfiguracji rozdawanej razem
    z adresem, więc wyłączenie tej drogi nie zmienia nic — ruch wychodzi tą samą
    trasą co dotąd. Tak jest w zdecydowanej większości sieci, ale nie zawsze,
    i właśnie to trzeba sprawdzić.

    Miejsca, w których zmiana boli, są dwa. Pierwsze to sieci, w których serwer
    przydzielający adresy w ogóle nie podaje bramy i polega na ogłoszeniach —
    zdarza się to w sieciach budowanych wokół urządzeń przemysłowych
    i w segmentach testowych. Maszyna po wdrożeniu przestanie widzieć cokolwiek
    poza swoją siecią lokalną, a objaw wygląda jak całkowity brak łączności.

    Drugie to sieci z kilkoma bramami, w których zmiana trasy po awarii jednej
    z nich odbywa się właśnie tą drogą. Po wdrożeniu maszyna zostanie przy
    bramie z konfiguracji i nie przejdzie na zapasową sama.

    Nic nie zmienia się w ruchu wewnątrz sieci lokalnej.

    Wymagane jest ponowne uruchomienie maszyny.
  en: |
    The change takes effect once the machine is restarted and calls for a deliberate
    rollout.

    On a company or a household network the gateway comes from the configuration
    handed out with the address, so closing this route changes nothing - traffic
    leaves by the same path as before. That is how it is on the great majority of
    networks, but not always, and that is exactly what has to be checked.

    There are two places where the change hurts. The first is networks where the
    server assigning addresses gives no gateway at all and relies on announcements -
    which happens on networks built around industrial devices and in test segments.
    After the rollout the machine stops seeing anything beyond its own local network,
    and the symptom looks like a complete loss of connectivity.

    The second is networks with several gateways, where changing route after one of
    them fails happens by exactly this means. After the rollout the machine stays with
    the gateway from its configuration and will not move to the spare one by itself.

    Nothing changes in traffic inside the local network.

    A restart of the machine is required.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - W sieci bez bramy podawanej razem z adresem maszyna przestanie widzieć cokolwiek poza siecią lokalną
      - Samoczynne przejście na bramę zapasową po awarii pierwszej przestanie działać
      - Segmenty testowe i sieci wokół urządzeń przemysłowych mogą wymagać wpisania bramy ręcznie
      - Ruch wewnątrz sieci lokalnej nie zmienia się
    en:
      - On a network with no gateway handed out with the address the machine stops seeing anything beyond the local network
      - Moving to a spare gateway by itself after the first one fails stops working
      - Test segments and networks around industrial devices may need a gateway entered by hand
      - Traffic inside the local network does not change
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer przydzielający adresy nie podaje bramy i sieć opiera się na ogłoszeniach
      - Przejście na bramę zapasową odbywa się w tej sieci samoczynnie tą drogą
    en:
      - The server assigning addresses gives no gateway and the network rests on announcements
      - Moving to a spare gateway happens on this network by itself through this means
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'PerformRouterDiscovery'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'PerformRouterDiscovery'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' `
      -Name 'PerformRouterDiscovery' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-and-nbt-configuration-parameters

notes:
  pl: |
    Domyślnie maszyna nasłuchuje ogłoszeń, ale nie szuka bramy sama — robi to
    dopiero wtedy, gdy serwer przydzielający adresy jej to każe. Stan domyślny
    zależy więc od sieci, w której maszyna właśnie pracuje, a nie od jej własnej
    konfiguracji. To jest właśnie powód, dla którego punkt warto wdrożyć:
    o zachowaniu maszyny w obcej sieci rozstrzyga dziś ta sieć.

    Punkt dotyczy protokołu w czwartej wersji. Odpowiednik w wersji szóstej
    działa inaczej i jest częścią normalnego działania tego protokołu —
    wyłącza się go innymi środkami i ten punkt go nie obejmuje.

    Gałąź parametrów stosu sieciowego jest wspólna dla kilku punktów tej paczki,
    więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    By default the machine listens for announcements but does not look for a gateway
    itself - it does that only once the server assigning addresses tells it to. So the
    default state depends on the network the machine happens to be working on rather
    than on its own configuration. That is exactly why the item is worth applying:
    what settles the machine's behaviour on a foreign network is, today, that network.

    The item concerns the protocol's fourth version. The counterpart in the sixth
    version works differently and is part of that protocol's normal working - it is
    switched off by other means and this item does not cover it.

    The network stack's parameters key is shared by several items in this pack, so
    rollback removes the entry alone.
