id: win10-link-layer-topology-mapper-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa odwzorowania topologii sieci wyłączona
    en: The service mapping the network s shape switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę rysującą mapę sieci lokalnej, czyli
    odpowiadającą na pytania o to, jak maszyny i urządzenia są ze sobą
    połączone.

    Mechanizm działa na poziomie łącza, poniżej adresów. Maszyna wysyła
    zapytania do wszystkich urządzeń w zasięgu i zbiera odpowiedzi
    opisujące, co jest do czego podłączone, przez jaki przełącznik i przez
    jaki punkt dostępowy.

    Zagrożenie leży w tym, że maszyna nie tylko pyta, ale i odpowiada.
    Urządzenie w tej samej sieci może zadać jej to pytanie i dostanie
    opis: nazwę, rolę, sposób podłączenia, sąsiadów. Jest to gotowe
    rozpoznanie sieci wykonane cudzymi rękami.

    Zapytania idą przy tym poniżej adresów, więc nie przechodzą przez
    reguły zbudowane na adresach i portach. Podział sieci, który wygląda
    na szczelny, tego ruchu zwykle nie obejmuje.

    Odnotowuję, że mechanizm służy głównie mapie sieci pokazywanej
    w oknie systemowym — czyli rzeczy, z której korzysta się rzadko.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: opis
    sieci i sąsiedztwa maszyny, uzyskany jednym zapytaniem z tej samej
    sieci.
  en: |
    The setting switches off the service drawing a map of the local network, which is to say the one that answers
    questions upon how machines and devices are joined to one another.

    The mechanism works at the level of the link, beneath addresses. The machine sends its askings to every device
    within reach and gathers the answers setting out what is joined to what, through which switch and through
    which point of entry.

    The danger lies in this, that the machine not only asks but also answers. A device in the same network may put
    that question to it and will get a setting out: the name, the office, the manner of joining, the neighbours.
    It is a ready searching out of the network done by another's hands.

    The askings go besides beneath addresses, so they pass not through rules built upon addresses and ports. A
    parting of the network that looks tight commonly does not take that traffic in.

    I set down that the mechanism serves chiefly the map of the network shown in a window of the system - which is
    to say a thing used seldom.

    What an attacker gains while the item goes unmet: a setting out of the network and of the machine's
    neighbourhood, got by one asking from within that same network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    obsługa korzysta z mapy sieci przy rozwiązywaniu problemów.

    Miejscem wartym uwagi są małe sieci bez narzędzi nadzoru, w których
    mapa sieci w oknie systemowym bywa jedynym obrazem tego, co gdzie
    stoi. Po zmianie maszyna zniknie z mapy rysowanej przez inne
    maszyny i sama mapy nie narysuje.

    Miejscem drugim jest rozwiązywanie problemów z siecią bezprzewodową,
    gdzie mechanizm ten pomaga wskazać punkt dostępowy, przez który
    maszyna jest podłączona.

    Odnotowuję, że dostęp do sieci, do udziałów i do internetu nie zależy
    od tej usługi w żadnym stopniu. Traci się obraz sieci, nie łączność.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: łączności sieciowej, dostępu do udziałów,
    przeglądania stron, drukowania sieciowego, logowania, pracy programów.
  en: |
    The class is "needs review", and the object of the review is whether the keepers use the map of the network at
    the untangling of troubles.

    The place worth notice is small networks without tools of watching, in which the map of the network in a
    window of the system is at times the one picture of what stands where. After the change the machine will
    vanish from the map drawn by other machines and will draw no map itself.

    The second place is the untangling of troubles with the network without wires, where that mechanism helps to
    point out the entry point through which the machine is joined.

    I set down that the reach of the network, of shares and of the internet hangs upon this service not at all.
    What is lost is the picture of the network and not the joining.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the joining to the network, the reach of shares, the looking over of pages, printing
    upon the network, logging on, or the work of programs.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Maszyna zniknie z mapy sieci rysowanej przez inne maszyny i sama mapy nie narysuje
      - W małej sieci bez narzędzi nadzoru mapa ta bywa jedynym obrazem tego, co gdzie stoi
      - Rozwiązywanie problemów z siecią bezprzewodową straci wskazanie punktu dostępowego, przez który maszyna jest podłączona
      - Dostęp do sieci, do udziałów i do internetu nie zależy od tej usługi, więc traci się obraz, nie łączność
      - Drukowanie sieciowe, logowanie, praca programów i przeglądanie stron pozostają bez zmian
    en:
      - The machine will vanish from the map of the network drawn by other machines and will draw no map itself
      - In a small network without tools of watching that map is at times the one picture of what stands where
      - The untangling of troubles with the network without wires will lose the pointing out of the entry point through which the machine is joined
      - The reach of the network, of shares and of the internet hangs not upon this service, so the picture is lost and not the joining
      - Printing upon the network, logging on, the work of programs and the looking over of pages stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Mała sieć bez narzędzi nadzoru, w której mapa sieci w oknie systemowym jest jedynym obrazem połączeń
    en:
      - A small network without tools of watching, in which the map of the network in a window of the system is the one picture of the joinings
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'lltdsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lltdsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'lltdsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/lltd/link-layer-topology-discovery-overview

notes:
  pl: |
    Reguła bywa uznawana za drobiazg, bo dotyczy okna, z którego mało kto
    korzysta. Warto, żeby aplikacja przesunęła uwagę na drugą stronę
    mechanizmu: maszyna nie tylko pyta, ale i odpowiada, i to odpowiadanie
    jest tu istotą.

    Argument wart postawienia wprost dotyczy poziomu, na którym to
    działa. Zapytania idą poniżej adresów, więc reguły zbudowane na
    adresach i portach ich nie obejmują. Sieć podzielona na pozór
    szczelnie przepuszcza ten ruch, bo dzieli się wyżej.

    Odnotowuję, że to, co maszyna odpowiada, jest gotowym rozpoznaniem:
    nazwa, rola, sposób podłączenia, sąsiedzi. Napastnik dostaje je
    jednym zapytaniem, nie musząc niczego skanować ani zgadywać.
  en: |
    The rule is at times held a trifle, touching a window few make use of. It is well that the application shift
    the notice to the other side of the mechanism: the machine not only asks but also answers, and that answering
    is here the heart of it.

    The argument worth putting outright touches the level at which this works. The askings go beneath addresses,
    so rules built upon addresses and ports take them not in. A network parted to all seeming tightly lets that
    traffic through, parting itself higher up.

    I set down that what the machine answers is a ready searching out: the name, the office, the manner of
    joining, the neighbours. An attacker gets it by one asking, having to sweep nothing and guess nothing.
