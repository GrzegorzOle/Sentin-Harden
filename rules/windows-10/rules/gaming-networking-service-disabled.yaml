id: win10-gaming-networking-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa łączności sieciowej platformy gier wyłączona
    en: The service of network joining for the platform of games switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę zestawiającą połączenia sieciowe na rzecz
    platformy gier — w tym połączenia bezpośrednie między maszynami.

    Zastrzeżenie dotyczy sposobu, w jaki te połączenia powstają. Usługa
    potrafi przebić się przez mechanizm tłumaczenia adresów, żeby dwie
    maszyny w różnych sieciach domowych mogły rozmawiać bezpośrednio.
    Robi to sama, bez pytania, i bez śladu w regułach zapory.

    Zagrożeniem jest właśnie to przebicie. Połączenie przychodzące
    z zewnątrz trafia do maszyny drogą, której nikt świadomie nie
    otwierał, a zapora sieciowa widzi je jako ruch nawiązany od środka.

    Drugim zastrzeżeniem jest to, że usługa działa na stanowisku
    roboczym, na którym platformy gier nie ma i nie będzie. Utrzymywany
    jest wtedy mechanizm zestawiania połączeń bez żadnego zastosowania.

    Ocena jest średnia, bo z całej rodziny to właśnie ta usługa dotyka
    ruchu sieciowego, a nie samej wygody grania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: mechanizm
    zestawiania połączeń bezpośrednich, omijający reguły ruchu
    przychodzącego.
  en: |
    The setting switches off the service setting up joinings of the network on behalf of the platform of games -
    joinings straight between machines among them.

    The reservation touches the manner in which those joinings come about. The service can break through the
    mechanism that turns addresses about, so that two machines in sundry home networks may speak straight to each
    other. It does so itself, without asking, and with no trace among the rules of the wall of fire.

    The danger is that very breaking through. A joining coming in from without reaches the machine by a road
    nobody knowingly opened, and the wall of fire sees it as traffic begun from within.

    The second reservation is that the service works upon a station of work where there is no platform of games
    and will be none. A mechanism for the setting up of joinings is then kept with no use at all.

    The grading is middling, this being, of the whole kindred, the service that touches traffic of the network and
    not the ease of play alone.

    What an attacker gains while the item goes unmet: a mechanism setting up straight joinings, passing by the
    rules for traffic coming in.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czy ktoś na
    tej maszynie korzysta z platformy gier.

    Miejscem pierwszym są stanowiska służące także do rozrywki poza
    godzinami pracy. Po zmianie rozgrywka sieciowa przestanie działać
    albo zacznie przerywać, a przyczyna nie będzie oczywista.

    Miejscem drugim są programy korzystające z tej samej warstwy poza
    grami. Zdarza się to rzadko, ale zdarza, i wtedy objawem jest
    niemożność zestawienia połączenia bez żadnego komunikatu.

    Odnotowuję, że zwykła łączność sieciowa działa dalej. Usługa ta
    odpowiada za zestawianie połączeń na rzecz jednej platformy, a nie
    za sieć maszyny.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: łączności sieciowej, przeglądania stron, poczty,
    drukowania, logowania.
  en: |
    The class is "needs review", and the review touches whether anybody upon this machine uses the platform of
    games.

    The first place is stations serving also for pastime beyond the hours of work. After the change play over the
    network will cease to work or will begin to break, and the cause will not be plain.

    The second place is programs using that same layer beyond games. It happens seldom, but it happens, and the
    sign of it is then an inability to set up a joining with no message at all.

    I set down that the common joining to the network works on. That service answers for the setting up of
    joinings on behalf of one platform and not for the machine's network.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the joining to the network, the looking over of pages, the post, printing, or
    logging on.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Rozgrywka sieciowa na tym stanowisku przestanie działać albo zacznie przerywać
      - Przyczyna nie będzie oczywista, bo objawem bywa niemożność zestawienia połączenia bez komunikatu
      - Rzadkie programy korzystające z tej samej warstwy poza grami stracą drogę zestawienia połączenia
      - Zwykła łączność sieciowa działa dalej, bo usługa odpowiada za jedną platformę, a nie za sieć maszyny
      - Przeglądanie stron, poczta, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - Play over the network upon this station will cease to work or will begin to break
      - The cause will not be plain, the sign being at times an inability to set up a joining with no message
      - The seldom programs using that same layer beyond games will lose their road to setting up a joining
      - The common joining to the network works on, the service answering for one platform and not for the machine s network
      - The looking over of pages, the post, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko służy także do rozrywki i korzysta z rozgrywki sieciowej tej platformy
    en:
      - The station serves also for pastime and uses play over the network upon that platform
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XboxNetApiSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XboxNetApiSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XboxNetApiSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła jest jedyną w rodzinie gier z oceną średnią i warto, żeby
    aplikacja powiedziała dlaczego. Pozostałe dotyczą wygody grania.
    Ta dotyka ruchu sieciowego.

    Argument wart postawienia wprost dotyczy przebijania się przez
    mechanizm tłumaczenia adresów. Usługa zestawia połączenia
    bezpośrednie sama, bez pytania i bez śladu w regułach zapory, więc
    ruch przychodzący trafia do maszyny drogą, której nikt nie otwierał.

    Odnotowuję częsty przypadek: stanowisko robocze, na którym platformy
    gier nie ma i nie będzie, a mechanizm zestawiania połączeń jest
    utrzymywany. Wtedy punkt jest bezkosztowy.
  en: |
    The rule is the only one of the kindred of games with a middling grading, and it is well that the application
    say why. The rest touch the ease of play. This one touches traffic of the network.

    The argument worth putting outright touches the breaking through of the mechanism that turns addresses about.
    The service sets up straight joinings itself, without asking and with no trace among the rules of the wall of
    fire, so traffic coming in reaches the machine by a road nobody opened.

    I set down the common case: a station of work where there is no platform of games and will be none, and the
    mechanism for the setting up of joinings is kept all the same. The item is then without cost.
