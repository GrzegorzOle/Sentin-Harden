id: win10-bitlocker-fixed-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Szyfrowanie całego dysku stałego z danymi wymuszone
    en: Full encryption of the fixed data drive enforced
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza zaszyfrowanie całego dysku stałego z danymi, a nie
    samego obszaru zajętego w chwili rozpoczęcia.

    Rozumowanie jest tu takie samo jak przy dysku systemowym, ale waga
    większa. Dysk z danymi rzadko jest nowy: zwykle ma za sobą kilka lat
    pracy, w czasie których zapisywano i kasowano na nim dokumenty, kopie
    robocze, wyeksportowane bazy i pliki tymczasowe programów. Wszystko to
    leży w obszarze wolnym, skasowane w sensie księgowym, ale nienaruszone
    w sensie fizycznym.

    Szyfrowanie samego obszaru zajętego zostawia tę zawartość czytelną.
    Dysk wygląda na chroniony, w oknie ustawień jest chroniony, a narzędzie
    czytające go poza systemem dostaje wszystko, co kiedykolwiek na nim
    było i nie zostało zamazane.

    Odnotowuję, że dyski z danymi częściej niż systemowe wędrują między
    maszynami, trafiają do kopii i są wymieniane przy rozbudowie — czyli
    częściej wychodzą poza kontrolę właściciela.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nieszyfrowany
    obszar wolny dysku z danymi, a wraz z nim jego historię.
  en: |
    The setting enforces the enciphering of the whole fixed data drive, and not of the space taken up at the hour
    of beginning.

    The reasoning is here the same as with the system drive, but the weight greater. A drive of data is seldom
    new: it commonly has some years of work behind it, through which documents, working copies, exported bases and
    programs' passing files were written upon it and struck out. All of that lies in the free space, struck out in
    a bookkeeping sense but untouched in a physical one.

    The enciphering of the taken space alone leaves those contents readable. The drive looks guarded, in the
    window of settings is guarded, and a tool reading it outside the system gets everything that ever was upon it
    and was not written over.

    I set down that drives of data wander between machines oftener than system drives do, go into copies and are
    changed out at an enlarging - which is to say they pass outside their owner's hand the oftener.

    What an attacker gains while the item goes unmet: the unenciphered free space of a drive of data, and its
    history with it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest czas
    szyfrowania w zestawieniu z pojemnością dysków.

    Dyski z danymi bywają wielokrotnie większe od systemowego i mają
    zwykle więcej miejsca wolnego. Szyfrowanie całości potrafi trwać
    kilkanaście godzin na dysku kilkunastoterabajtowym, a przez ten czas
    maszyna pracuje wolniej przy każdej operacji dyskowej.

    Nie jest to przerwa w pracy — dysk pozostaje dostępny, pliki dają się
    otwierać i zapisywać. Jest to okres obniżonej wydajności, i tylko tyle.

    Odnotowuję, że zasada obowiązuje szyfrowanie zakładane po jej
    wprowadzeniu. Dysk zaszyfrowany wcześniej wariantem szybszym nie
    zostanie doszyfrowany sam, a punkt pokaże się jako spełniony. Jest to
    sytuacja warta nazwania w raporcie, bo raport mówi wtedy o zasadzie,
    a nie o stanie dysku.

    Czego to nie psuje: dostępu do plików, wydajności po zakończeniu
    szyfrowania, udziałów plikowych, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is the time of enciphering set against the drives'
    size.

    Drives of data are at times many times larger than the system drive and commonly have the more free room. The
    enciphering of the whole can take some tens of hours upon a drive of some tens of terabytes, and through that
    time the machine works the slower at every doing upon the disk.

    It is no break in work - the drive stays within reach, files may be opened and written. It is a span of
    lowered speed, and no more.

    I set down that the policy holds for enciphering laid on after it was brought in. A drive enciphered earlier
    by the quicker variant will not be enciphered the rest of the way of itself, and the item will show as met. It
    is a case worth naming in the report, the report speaking then of the policy and not of the drive's state.

    What this does not break: the way to files, speed once the enciphering has ended, file shares, logging on, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Szyfrowanie całości dysku z danymi potrafi trwać kilkanaście godzin przy dużej pojemności
      - Przez ten czas każda operacja dyskowa jest wolniejsza, choć dysk pozostaje dostępny
      - Dysk zaszyfrowany wcześniej wariantem szybszym nie zostanie doszyfrowany sam
      - Punkt pokaże się wtedy jako spełniony, choć obszar wolny dysku pozostanie czytelny
      - Dostęp do plików, wydajność po zakończeniu szyfrowania, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - The enciphering of a whole drive of data can take some tens of hours where the size is great
      - Through that time every doing upon the disk is the slower, though the drive stays within reach
      - A drive enciphered earlier by the quicker variant will not be enciphered the rest of the way of itself
      - The item will then show as met, though the drive s free space stays readable
      - The way to files, speed once the enciphering has ended, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dyski z danymi są tak duże, że czas szyfrowania nie mieści się w oknie dostępnym na zmianę
    en:
      - The drives of data are so large that the time of enciphering does not fit the window open for the change
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FULL'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'FDVEncryptionType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One means the whole drive, two means the used space alone. Upon a data drive
    # the difference weighs the heavier, such a drive commonly having a past.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest odpowiednikiem punktu o dysku systemowym i warto, żeby
    aplikacja pokazywała je obok siebie. Oba opisują tę samą decyzję dla
    dwóch klas nośników, oba są niewidoczne z zewnątrz i oba dotyczą
    obszaru wolnego.

    Argument wart zachowania dotyczy tego, czym różnią się te dwa
    przypadki. Dysk systemowy bywa nowy, formatowany przy instalacji
    i szyfrowany zanim cokolwiek na nim stanie. Dysk z danymi prawie
    nigdy taki nie jest — ma historię, i to właśnie tę historię zostawia
    odsłoniętą wariant szybszy.

    Odnotowuję sytuację, w której raport wprowadza w błąd, bo powtarza się
    tu tak samo jak przy dysku systemowym: zasada opisuje szyfrowanie
    przyszłe, a nie stan bieżący nośnika. Aplikacja powinna powiedzieć to
    wprost przy obu punktach.
  en: |
    The rule is the counterpart of the item about the system drive, and it is well that the application show them
    beside one another. Both set out the same decision for two classes of drive, both are unseen from outside and
    both touch the free space.

    The argument worth keeping touches how those two cases differ. A system drive is at times new, laid out at the
    installing and enciphered before anything stands upon it. A drive of data almost never is - it has a history,
    and it is that history the quicker variant leaves bare.

    I set down the case in which the report misleads, it repeating here just as with the system drive: the policy
    sets out enciphering to come and not the drive's present state. The application ought to say so outright at
    both items.
