id: win2016-ntlm-session-security-client

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Minimalne zabezpieczenie sesji po stronie klienta
    en: Minimum session security on the client side
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyznacza dolną granicę zabezpieczenia sesji, na jaką maszyna
    zgodzi się, występując jako strona nawiązująca połączenie.

    Rzecz dotyczy nie samego uwierzytelnienia, tylko tego, co dzieje się po
    nim. Po zakończeniu uwierzytelniania obie strony uzgadniają, jak będzie
    chroniony dalszy ruch — czy zostanie podpisany, czy zaszyfrowany i jakiej
    jakości mechanizmami. Bez tego punktu maszyna przyjmuje to, co zaproponuje
    druga strona, łącznie z propozycją najsłabszą z możliwych.

    Dwie rzeczy, których ten punkt żąda, są różne i warto je rozróżnić.
    Szyfrowanie sesji zamyka drogę do podsłuchania treści. Podpis oparty na
    dzisiejszej funkcji skrótu zamyka drogę do podmiany — a także do
    przekazania przechwyconego uwierzytelnienia dalej, bo podpis wiąże je
    z konkretną sesją.

    To drugie jest tu istotniejsze. Przekazanie uwierzytelnienia do trzeciej
    maszyny jest atakiem praktycznym, wykonywanym narzędziami powszechnie
    dostępnymi, i nie wymaga znajomości hasła. Słabe zabezpieczenie sesji jest
    warunkiem jego powodzenia.

    Wartość wymagana łączy oba żądania zapisane jako bity w jednej liczbie —
    stąd jej nieoczywista postać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję, w której
    wolno mu zaproponować najsłabsze zabezpieczenie, a więc czytelną
    i podatną na przekazanie uwierzytelnienia do kolejnej maszyny.
  en: |
    The setting marks the lower bound of session security the machine will consent
    to when it acts as the side opening a connection.

    The matter concerns not the authentication itself but what happens after it.
    Once authentication is done, the two sides settle how the further traffic will
    be protected - whether it will be signed, whether encrypted, and by mechanisms
    of what quality. Without this item the machine takes whatever the other side
    proposes, the weakest proposal possible included.

    The two things this item demands are different and worth telling apart. Session
    encryption shuts the road to overhearing the content. A signature resting on a
    present-day digest function shuts the road to substitution - and to passing a
    captured authentication on, since the signature binds it to a particular
    session.

    The second matters more here. Passing an authentication on to a third machine is
    a practical attack, carried out with commonly available tools, and it calls for
    no knowledge of a password. Weak session security is the condition of its
    success.

    The required value joins both demands set as bits in one number - hence its
    unobvious form.

    What an attacker gains while the item goes unmet: a session in which they may
    propose the weakest protection, and so one that is readable and open to the
    authentication being passed on to a further machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Punkt dotyczy tej maszyny jako strony
    nawiązującej połączenie, więc skutek odczuwają połączenia wychodzące —
    a te są zwykle mniej liczne i lepiej znane niż przychodzące.

    Sprawdzić trzeba, z czym ta maszyna się łączy. Nowsze systemy i usługi
    obsługują wymagane zabezpieczenie od wielu wydań, więc problem dotyczy
    wyłącznie miejsc, których nikt nie modernizował: urządzeń udostępniających
    zasoby sieciowe, serwerów wydruku wbudowanych w sprzęt, macierzy
    z własnym mechanizmem udostępniania plików.

    Objaw jest jednoznaczny — połączenie nie dochodzi do skutku i zgłasza błąd
    odmowy dostępu. Nie ma tu cichego pogorszenia, więc skutek ujawnia się od
    razu, a nie za tydzień.

    Osobno warto spojrzeć na oprogramowanie łączące się z zasobami po adresie
    sieciowym zamiast po nazwie. Taka postać adresu wymusza starszy mechanizm
    uwierzytelniania, więc te połączenia są tymi, które ten punkt faktycznie
    dotyka.

    Czego to nie psuje: połączeń przychodzących do tej maszyny, uwierzytelniania
    domenowego, pracy usług lokalnych ani logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". The item concerns this machine as the side opening
    a connection, so the effect is felt by outgoing connections - and those are as a
    rule fewer and better known than incoming ones.

    What has to be checked is what this machine connects to. Newer systems and
    services have supported the protection demanded for many releases, so the
    problem concerns only places nobody has modernised: devices offering network
    resources, print servers built into hardware, storage arrays with a file sharing
    mechanism of their own.

    The symptom is unambiguous - the connection does not come about and reports an
    access denied error. There is no quiet worsening here, so the effect shows at
    once rather than in a week.

    Software connecting to resources by network address rather than by name is worth
    a separate look. That form of address forces the older authentication mechanism,
    so those connections are the ones this item actually touches.

    What this does not break: connections coming in to this machine, domain
    authentication, the working of local services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - encryption-and-tls
  what_breaks:
    pl:
      - Połączenie do urządzenia udostępniającego zasoby, które nie obsługuje wymaganego zabezpieczenia, kończy się odmową dostępu
      - Serwer wydruku wbudowany w sprzęt albo macierz z własnym mechanizmem udostępniania plików przestaje być osiągalny
      - Oprogramowanie łączące się po adresie sieciowym zamiast po nazwie traci dostęp, bo taka postać adresu wymusza starszy mechanizm
      - Połączenia przychodzące do tej maszyny, uwierzytelnianie domenowe i praca usług lokalnych pozostają bez zmian
    en:
      - A connection to a device offering resources that does not support the protection demanded ends in access denied
      - A print server built into hardware, or a storage array with its own file sharing mechanism, ceases to be reachable
      - Software connecting by network address rather than by name loses access, since that form of address forces the older mechanism
      - Connections coming in to this machine, domain authentication and the working of local services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, z jakimi zasobami sieciowymi łączy się ta maszyna i czy wszystkie obsługują wymagane zabezpieczenie sesji
      - Maszyna sięga po zasoby udostępniane przez urządzenia, których oprogramowania nie da się zaktualizować
    en:
      - It has not been established what network resources this machine connects to and whether all support the session security demanded
      - The machine reaches for resources offered by devices whose software cannot be updated
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'NTLMMinClientSec'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '537395200'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'NTLMMinClientSec'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value joins two demands set as bits: session encryption and a signature
    # resting on a present-day digest function.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NTLMMinClientSec' -Value 537395200 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-minimum-session-security-for-ntlm-ssp-based-including-secure-rpc-clients

notes:
  pl: |
    Wartość jest sumą bitów, a nie liczbą porządkową, i właśnie dlatego wygląda
    przypadkowo. Aplikacja powinna pokazywać obok niej, co ta liczba oznacza,
    bo sama w sobie nie mówi czytelnikowi nic, a przepisana z pamięci bywa
    przekręcana.

    Punkt jest bliźniaczy wobec reguły o stronie serwera i ma z nią wspólną
    wartość, ale nie wspólne ryzyko wdrożenia. Ta dotyczy połączeń
    wychodzących, których jest mniej i które łatwiej wyliczyć; tamta
    przychodzących, których liczby nikt nie zna z góry. Dlatego ta jest klasy
    „wymaga sprawdzenia", a tamta wyżej.

    Kolejność wdrożenia wynika z tej różnicy: najpierw strona klienta, potem
    strona serwera. Odwrotna kolejność odcina dostęp maszynom, których jeszcze
    nie zdążono sprawdzić.
  en: |
    The value is a sum of bits, not an ordinal number, and for that reason it looks
    arbitrary. The application should show beside it what the number means, since by
    itself it tells the reader nothing, and copied from memory it is at times
    garbled.

    The item is a twin to the rule on the server's side and shares its value, though
    not its risk of rollout. This one concerns outgoing connections, which are fewer
    and easier to enumerate; that one incoming connections, whose number nobody
    knows in advance. Hence this one is of the class "needs review" and that one
    higher.

    The order of rollout follows from that difference: the client side first, then
    the server side. The reverse order cuts off access to machines nobody has yet
    managed to check.
