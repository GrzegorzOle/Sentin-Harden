id: win2016-wake-requires-password

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Power Management > Sleep Settings
  title:
    pl: Hasło przy wybudzeniu maszyny wymagane
    en: A password required at the waking of the machine
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga podania hasła przy wybudzeniu maszyny ze stanu
    uśpienia.

    Bez tego wymagania uśpiona maszyna wraca prosto do sesji, która była
    otwarta przed uśpieniem. Znaczy to, że stan uśpienia nie jest żadną
    granicą: kto naciśnie klawisz, ten dostaje zalogowany pulpit razem
    z otwartymi dokumentami, podłączonymi konsolami i zapisanymi
    poświadczeniami.

    Rzecz jest szczególnie warta uwagi dlatego, że uśpienie wygląda
    z zewnątrz jak wyłączenie. Maszyna z wygaszonym ekranem i cichym
    wentylatorem sprawia wrażenie maszyny zamkniętej, a jest maszyną
    otwartą. Nieporozumienie to jest po stronie obsługi powszechne
    i trwałe.

    Ustawienie występuje w dwóch wariantach zasilania: z sieci i z baterii.
    Obydwa trzeba ustawić, bo maszyna jest chroniona tylko tak, jak chroni
    ją wariant słabszy — a przełączenie między nimi potrafi nastąpić samo,
    przy zaniku napięcia albo przy przejęciu zasilania przez podtrzymanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zalogowaną
    sesję za naciśnięciem klawisza, bez znajomości jakiegokolwiek hasła.
  en: |
    The setting calls for a password to be given at the waking of the machine from sleep.

    Without that call a sleeping machine comes back straight into the session that was open before it
    slept. That means the sleeping state is no boundary at all: whoever presses a key gets a logged-on
    desktop along with open documents, attached consoles and saved credentials.

    The thing is particularly worth attention because sleep looks from outside like a switching off. A
    machine with a darkened screen and a quiet fan gives the impression of a closed machine, and is an
    open one. That misunderstanding is on the attendance's side common and lasting.

    The setting comes in two variants of supply: from the mains and from a battery. Both have to be set,
    the machine being guarded only as far as the weaker variant guards it - and a switching between them
    may happen of itself, at a loss of voltage or at a taking over of the supply by a standby unit.

    What an attacker gains while the item goes unmet: a logged-on session for the pressing of a key,
    without the knowledge of any password.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wymaganie hasła po wybudzeniu jest tym, czego każdy się spodziewa,
    i na serwerze nie zmienia niczego w pracy. Maszyna serwerowa zwykle
    nie sypia w ogóle, a jeśli sypia, to wybudza ją obsługa, która i tak
    ma się zalogować.

    Jedyna zmiana widoczna dotyczy maszyn, przy których ktoś pracuje
    i przyzwyczaił się do wracania do sesji bez pytania. Tam dojdzie jeden
    krok — ten sam, który wykonuje po każdym normalnym zalogowaniu.

    Nie ma znanych regresji.

    Czego to nie psuje: usypiania i wybudzania jako takiego, sesji
    otwartych przed uśpieniem, usług, aplikacji, sieci, zdalnego dostępu.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    Calling for a password after a waking is what everybody expects, and on a server it changes nothing in
    the work. A server machine as a rule does not sleep at all, and if it does, it is woken by the
    attendance, who are to log in anyway.

    The one visible change concerns machines somebody works at and has grown used to returning to a session
    without an asking. There one step is added - the same they carry out after every ordinary logon.

    There are no known regressions.

    What this does not break: the sleeping and waking as such, sessions open before the sleep, services,
    applications, the network, or remote access.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Po wybudzeniu maszyny trzeba podać hasło zamiast wracać prosto do otwartej sesji
      - Osoba przyzwyczajona do wracania do sesji bez pytania wykona jeden krok więcej
      - Usypianie i wybudzanie jako takie oraz sesje otwarte przed uśpieniem pozostają bez zmian
      - Usługi, aplikacje, sieć i zdalny dostęp pozostają bez zmian
    en:
      - After the machine is woken a password has to be given instead of returning straight into an open session
      - A person used to returning to a session without an asking will carry out one step more
      - The sleeping and waking as such and the sessions open before the sleep stay unchanged
      - Services, applications, the network and remote access stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest wybudzana zdalnie w trybie bezobsługowym i sesja musi wrócić bez udziału człowieka
    en:
      - The machine is woken remotely and unattended and the session has to return without a person taking part
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One setting in two power variants. The report gives the weaker of them,
      # because the machine is protected only as far as the worse variant
      # protects it - an uninterruptible supply can switch it over by itself.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $ac = $item.ACSettingIndex
        $dc = $item.DCSettingIndex
        if ($null -eq $ac -or $null -eq $dc) { 'MISSING' }
        elseif ([int]$ac -eq 1 -and [int]$dc -eq 1) { 'REQUIRED' }
        else { 'AC=' + $ac + ' DC=' + $dc }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      ac          = $item.ACSettingIndex
      dc          = $item.DCSettingIndex
      ac_existed  = ($null -ne $item.ACSettingIndex)
      dc_existed  = ($null -ne $item.DCSettingIndex)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both variants are set. Leaving one of them weaker protects the machine
    # only as far as that weaker one reaches.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    if (-not (Test-Path -Path $path)) { $null = New-Item -Path $path -Force }
    Set-ItemProperty -Path $path -Name 'ACSettingIndex' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DCSettingIndex' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.ac_existed) {
      Set-ItemProperty -Path $b.path -Name 'ACSettingIndex' -Value $b.ac -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ACSettingIndex' -ErrorAction SilentlyContinue
    }
    if ($b.dc_existed) {
      Set-ItemProperty -Path $b.path -Name 'DCSettingIndex' -Value $b.dc -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DCSettingIndex' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/customize/power-settings/sleep-settings

notes:
  pl: |
    Punkt otwiera blok o tym, co dzieje się z maszyną, gdy nikt przy niej
    nie siedzi — przy uśpieniu, przy wygaszeniu ekranu, przy odejściu od
    konsoli. Wszystkie reguły bloku dotyczą granicy uwierzytelnienia
    widzianej od strony czasu, a nie od strony sieci.

    Ta reguła jest w bloku najmocniejsza i ma rzadkie zestawienie:
    kategoria wysoka przy zerowym koszcie. Aplikacja powinna takie pozycje
    wysuwać na początek listy niezależnie od numeru w benchmarku.

    Rzecz warta pokazania w interfejsie dotyczy dwóch wariantów zasilania.
    Audyt zgłasza wynik zbiorczy, a przy niezgodności podaje obie wartości,
    bo ustawienie jednej z nich bez drugiej jest częstym półśrodkiem.
    Maszyna jest chroniona tak, jak chroni ją wariant słabszy, a przejście
    między wariantami potrafi nastąpić bez niczyjego udziału.

    Warto też nazwać nieporozumienie, które ten punkt naprawia: uśpienie
    wygląda jak wyłączenie i jest tak traktowane. Zdanie o tym w opisie
    robi dla zrozumienia więcej niż cała reszta uzasadnienia.
  en: |
    The item opens the block about what happens to a machine when nobody sits at it - at a sleep, at a
    darkened screen, at a walking away from the console. All the block's rules concern the boundary of
    authentication seen from the side of time rather than from the side of the network.

    This rule is the strongest in the block and holds a rare pairing: a high category at nil cost. The
    application should put such entries at the list's head whatever their number in the benchmark.

    A thing worth showing in the interface concerns the two variants of supply. The audit reports a joint
    outcome, and at a non-compliance gives both values, the setting of one without the other being a common
    half-measure. The machine is guarded as far as the weaker variant guards it, and a passing between the
    variants may happen without anybody's taking part.

    Worth naming too is the misunderstanding this item mends: sleep looks like a switching off and is so
    treated. A sentence about that in the description does more for the understanding than all the rest of
    the warrant.
