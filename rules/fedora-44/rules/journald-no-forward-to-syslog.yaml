id: fedora44-journald-no-forward-to-syslog

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 6.2.2.2
  section: Logging and Auditing > System Logging > Configure journald
  title:
    pl: journald nie przekazuje komunikatów do sysloga
    en: Ensure journald ForwardToSyslog is disabled
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Gdy journald jest jedynym systemem dzienników, przekazywanie komunikatów
    do gniazda sysloga nic nie daje: nikt ich tam nie odbiera, a jeśli
    później pojawi się jakiś odbiorca, te same wpisy trafią do dwóch miejsc
    o różnej ochronie.

    Punkt wymaga, żeby ForwardToSyslog w journald.conf miało wartość no.
    Jest to wartość domyślna.
  en: |
    When journald is the only logging system, forwarding messages to the
    syslog socket gives nothing: nobody receives them there, and if some
    receiver appears later, the same entries end up in two places with
    different protection.

    The item requires ForwardToSyslog in journald.conf to be set to no. This
    is the default value.

disruption_description:
  pl: |
    Nikt tego nie zauważy: na komputerze bez rsysloga komunikaty i tak nie
    są nigdzie odbierane z gniazda sysloga.
  en: |
    Nobody will notice: on a computer without rsyslog nothing receives the
    messages from the syslog socket anyway.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
    if in_use rsyslog || in_use syslog-ng; then echo NOT_APPLICABLE; exit 0; fi
    if ! systemd-analyze cat-config systemd/journald.conf >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    c=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -v s="[Journal]" -v k="ForwardToSyslog" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
    [ -n "$c" ] || c=default
    if printf '%s\n' "$c" | grep -qxE '(no|false|off|0|default)'; then echo "OK:$c"; else echo "NOT_OK:${c:-default}"; fi
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/systemd/journald.conf.d/sentin-harden-forward-to-syslog.conf
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
      if in_use rsyslog || in_use syslog-ng; then
        echo "rsyslog or syslog-ng keeps the logs, so this item does not apply; nothing to change"; exit 0
      fi
      f=/etc/systemd/journald.conf.d/sentin-harden-forward-to-syslog.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      mkdir -p /etc/systemd/journald.conf.d
      printf '%s\n' '# Sentin-Harden: fedora44-journald-no-forward-to-syslog' '[Journal]' 'ForwardToSyslog=no' > "$f"
      chmod 0644 "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      c=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -v s="[Journal]" -v k="ForwardToSyslog" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
      if [ "$c" != "no" ]; then
        echo "Another drop-in sets ForwardToSyslog after $f; the effective value is ${c:-default}" >&2; exit 1
      fi
      echo "Set ForwardToSyslog=no in $f"
      if [ -d /run/systemd/system ]; then systemctl reload systemd-journald.service; echo "Reloaded the systemd-journald configuration"; fi
    )

  rollback_command: |
    (
      set -e
      f=/etc/systemd/journald.conf.d/sentin-harden-forward-to-syslog.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      echo "Restored the previous state of $f"
      if [ -d /run/systemd/system ]; then systemctl reload systemd-journald.service; echo "Reloaded the systemd-journald configuration"; fi
    )

privileges: root
runnable: true

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html

notes:
  pl: |
    Brak wpisu oznacza wartość domyślną no i spełnia punkt. Parametr jądra
    systemd.journald.forward_to_syslog ma pierwszeństwo przed plikami, więc
    trzeba go sprawdzić ręcznie w /proc/cmdline.

    Sprawdzenie odczytuje wartość z polecenia systemd-analyze cat-config
    systemd/journald.conf, które pokazuje plik główny i pliki z katalogów
    journald.conf.d w kolejności stosowania, więc liczy się ostatnie
    przypisanie w sekcji [Journal]. Naprawa zapisuje ustawienie w
    /etc/systemd/journald.conf.d/sentin-harden-forward-to-syslog.conf, kończy się
    błędem, jeśli inny plik je nadpisuje, i przeładowuje konfigurację
    systemd-journald (systemctl reload), żeby zaczęło działać bez restartu
    usługi. Wycofanie przywraca poprzedni stan pliku i również przeładowuje
    konfigurację.

    Punkty 6.2.2 dotyczą komputerów, na których dzienniki prowadzi tylko
    journald. Gdy rsyslog albo syslog-ng jest włączony lub działa, wynik to
    NOT_APPLICABLE, a naprawa niczego nie zmienia (tak samo rozstrzyga punkt
    6.2.1.4).
  en: |
    No entry means the default value no and meets the item. The
    systemd.journald.forward_to_syslog kernel parameter takes precedence over
    the files, so it has to be checked by hand in /proc/cmdline.

    The check reads the value from the systemd-analyze cat-config
    systemd/journald.conf command, which shows the main file and the files
    from the journald.conf.d directories in the order they are applied, so
    the last assignment in the [Journal] section counts. The remediation
    writes the setting to
    /etc/systemd/journald.conf.d/sentin-harden-forward-to-syslog.conf, ends with an
    error if another file overrides it, and reloads the systemd-journald
    configuration (systemctl reload) so that it takes effect without
    restarting the service. Rollback restores the previous state of the file
    and also reloads the configuration.

    Items 6.2.2 apply to computers where only journald keeps the logs. When
    rsyslog or syslog-ng is enabled or running, the result is NOT_APPLICABLE
    and the remediation changes nothing (item 6.2.1.4 decides the same way).
