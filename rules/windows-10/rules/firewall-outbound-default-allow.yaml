id: win10-firewall-outbound-default-allow

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Domyślne zachowanie dla połączeń wychodzących ustalone wprost
    en: The default behaviour for outbound joinings settled outright
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje wprost, że połączenia wychodzące, dla których nie
    ma reguły, są przepuszczane.

    Punkt bywa czytany jako osłabienie zabezpieczenia i warto od razu
    wyjaśnić, dlaczego nim nie jest. Wymaganą wartością jest zachowanie,
    które i tak obowiązuje domyślnie. Zmianą jest to, że zostaje ono
    zapisane jako decyzja, zamiast wynikać z braku ustawienia.

    Blokowanie ruchu wychodzącego na stanowisku roboczym brzmi kusząco,
    ale wymaga wypisania wszystkiego, z czym maszyna się łączy —
    aktualizacji, usług katalogowych, czasu, telemetrii, programów
    użytkowych i ich dostawców. Lista taka jest niemożliwa do utrzymania
    i kończy się regułą przepuszczającą wszystko, tyle że napisaną ręcznie.

    Wartością punktu jest więc jednoznaczność. Profil pozostawiony bez
    ustawienia zachowuje się tak samo jak przepuszczający, ale nie mówi,
    czy ktokolwiek tak postanowił. Sprawdzenie rozróżnia te dwa stany
    i zgłasza je osobno.

    Odnotowuję, że reguły blokujące konkretny ruch wychodzący działają
    niezależnie od tego ustawienia i nie są przez nie znoszone.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — punkt porządkuje stan, a nie zamyka drogę.
  en: |
    The setting writes down outright that outbound joinings for which no rule stands are let through.

    The item is at times read as a weakening of a guarding, and it is worth setting out at once why it is none.
    The called-for value is the behaviour that holds by default in any case. What changes is that it is written
    down as a decision instead of following from a want of setting.

    The blocking of outbound traffic upon a working station sounds tempting, but calls for a writing out of
    everything the machine joins itself to - the servicing, services of directory, time, telemetry, programs of
    use and their makers. Such a roll cannot be kept up and ends in a rule letting everything through, only
    written by hand.

    The item's worth lies therefore in plainness. A profile left unset behaves just as one that lets through, but
    says not whether anybody so decided. The check tells those two states apart and reports them severally.

    I set down that rules blocking some particular outbound traffic work apart from this setting and are not
    undone by it.

    What an attacker gains while the item goes unmet: nothing outright - the item sets a state in order and shuts
    no road.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana odpowiada zachowaniu domyślnemu, więc na maszynie,
    której nikt w tym miejscu nie zmieniał, zmiana jest zapisem stanu.

    Odnotowuję przypadek odwrotny jako jedyny wart uwagi. Maszyna, na
    której ruch wychodzący blokowano celowo — bo pełni rolę wydzieloną,
    bo tak wymaga polityka — po zastosowaniu tego punktu zacznie
    przepuszczać wszystko, czego nie zabrania reguła wyraźna. Jest to
    zmiana odwracająca świadomą decyzję i nie wolno jej zastosować
    bez zauważenia.

    Właśnie dlatego sprawdzenie zgłasza blokowanie osobno, a nie jako
    zwykłą niezgodność.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: reguł blokujących konkretny ruch wychodzący,
    połączeń przychodzących, pracy programów, logowania, drukowania.
  en: |
    The class is "no disruption".

    The called-for value answers the default behaviour, so upon a machine nobody has changed in that place the
    change is a setting down of a state.

    I set down the opposite case as the one worth notice. A machine upon which outbound traffic was blocked on
    purpose - because it bears a part set apart, because a policy so calls for - will after this item is applied
    begin to let through everything no plain rule forbids. It is a change undoing a knowing decision and may not
    be applied without being marked.

    For that very reason the check reports a blocking severally and not as an ordinary want of compliance.

    The consequence shows at once, with no restart.

    What this does not break: rules blocking some particular outbound traffic, inbound joinings, the work of
    programs, logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna, na której ruch wychodzący blokowano celowo, zacznie przepuszczać wszystko poza ruchem zabronionym wyraźnie
      - Jest to odwrócenie świadomej decyzji, więc sprawdzenie zgłasza blokowanie osobno, a nie jako zwykłą niezgodność
      - Wartość wymagana odpowiada zachowaniu domyślnemu, więc na większości maszyn zmiana jest zapisem stanu
      - Reguły blokujące konkretny ruch wychodzący działają dalej i nie są przez to ustawienie znoszone
      - Połączenia przychodzące, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - A machine upon which outbound traffic was blocked on purpose will begin to let through everything not plainly forbidden
      - It is the undoing of a knowing decision, so the check reports a blocking severally and not as an ordinary want of compliance
      - The called-for value answers the default behaviour, so upon most machines the change is a setting down of a state
      - Rules blocking some particular outbound traffic work on and are not undone by this setting
      - Inbound joinings, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę wydzieloną i ruch wychodzący jest na niej blokowany celowo
    en:
      - The machine bears a part set apart and outbound traffic is blocked upon it on purpose
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # Three states are told apart, not two. A profile left unset behaves like
        # one that allows, but says nothing of anybody having decided so.
        $blocking = @($profiles | Where-Object { $_.DefaultOutboundAction -eq 'Block' })
        $unset = @($profiles | Where-Object { $_.DefaultOutboundAction -eq 'NotConfigured' })
        if ($blocking.Count -gt 0) { 'BLOCKING_IN_' + ($blocking.Name -join '_') }
        elseif ($unset.Count -gt 0) { 'NOT_CONFIGURED_IN_' + ($unset.Name -join '_') }
        else { 'ALL_ALLOW' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_ALLOW'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, DefaultOutboundAction |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultOutboundAction Allow

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -DefaultOutboundAction $p.DefaultOutboundAction
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest w całym bloku jedyną, która niczego nie zamyka, i warto,
    żeby aplikacja powiedziała to wprost. Ocena niska wynika z rzeczywistej
    wartości: jest to punkt porządkowy, a nie ochronny.

    Argument wart postawienia dotyczy różnicy między stanem domyślnym
    a decyzją. Maszyna, na której nikt nic nie ustawił, zachowuje się tak
    samo jak maszyna, na której ktoś świadomie zdecydował o przepuszczaniu
    — ale przy przeglądzie konfiguracji te dwa stany znaczą co innego.
    Punkt ten sprawia, że da się je odróżnić.

    Odnotowuję zachowanie sprawdzenia przy maszynie blokującej ruch
    wychodzący. Nie jest to zwykła niezgodność, tylko sygnał, że ktoś
    postanowił inaczej — i zastosowanie punktu byłoby wtedy cofnięciem
    cudzej decyzji. Aplikacja powinna pokazać to jako osobny stan, a nie
    jako punkt do naprawienia jednym kliknięciem.
  en: |
    The rule is the only one of the whole block that shuts nothing, and it is well that the application say so
    outright. The low grading follows from its true worth: it is an item of order and no guarding.

    The argument worth putting touches the difference between a default state and a decision. A machine upon which
    nobody set anything behaves just as one upon which somebody knowingly decided to let through - but at a going
    through of the setting those two states mean several things. This item brings it about that they may be told
    apart.

    I set down the check's behaviour at a machine blocking outbound traffic. It is no ordinary want of compliance
    but a sign that somebody decided otherwise - and the applying of the item would then be the undoing of
    another's decision. The application ought to show that as a state apart and not as an item to be put right
    with one press.
