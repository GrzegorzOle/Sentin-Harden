id: win2025-ldap-client-signing

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wymagania podpisywania klienta LDAP
    en: LDAP client signing requirements
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy klient katalogu na tej maszynie ma żądać
    podpisywania rozmowy z usługą katalogową, czy godzić się na rozmowę
    niepodpisaną.

    Podpisanie nie ukrywa treści zapytania — chroni przed jej zmianą
    w drodze. Bez niego odpowiedź katalogu jest zdaniem, któremu klient
    wierzy na słowo: kto siedzi pomiędzy, może zmienić wynik zapytania
    o członkostwo w grupie, o adres, o uprawnienie. Klient nie ma jak
    tego zauważyć.

    Katalog jest przy tym miejscem, w którym zapisano, kto kim jest.
    Zmiana odpowiedzi z katalogu w drodze jest więc zmianą tożsamości
    w oczach pytającego, a nie drobnym przekłamaniem danych.

    Na serwerze ustawienie ma zastosowanie szersze niż na stanowisku
    roboczym, bo to serwery pytają katalog najczęściej: aplikacje
    sprawdzające uprawnienia, usługi wyliczające członkostwo, narzędzia
    zarządzające. Każde z tych pytań jest pytaniem o to, komu wolno.

    Trzeba jednak powiedzieć uczciwie, gdzie leży ciężar. Ten punkt
    dotyczy strony pytającej i jej gotowości. Stroną, która przesądza
    sprawę, jest kontroler domeny i jego własne wymaganie podpisywania —
    dopóki katalog przyjmuje rozmowy niepodpisane, klient wyrażający
    gotowość niewiele zmienia. Tamto ustawienie jest osobnym punktem
    i to ono niesie większość zysku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zmiany w drodze odpowiedzi katalogu — a więc tego, co ta
    maszyna sądzi o czyichś uprawnieniach i przynależności do grup.
  en: |
    The setting settles whether the directory client on this machine is to demand a signing of
    its conversation with the directory service, or to agree to an unsigned one.

    Signing does not hide the query's contents - it guards against their change on the way.
    Without it the directory's answer is a sentence the client takes on trust: whoever sits
    between may change the outcome of a query about membership in a group, about an address,
    about a right. The client has no way of marking it.

    The directory is withal the place where it is written who is who. A change of the directory's
    answer on the way is thus a change of identity in the asker's eyes and no small garbling of
    data.

    On a server the setting has a wider use than at a working station, servers being what ask the
    directory most often: applications checking rights, services reckoning membership, tools of
    management. Every one of those questions is a question of who may.

    It must be said honestly, though, where the weight lies. This item bears on the asking side
    and its readiness. The side that settles the matter is the domain controller and its own
    demand of signing - while the directory takes unsigned conversations, a client declaring
    readiness changes little. That setting is an item of its own and it carries most of the gain.

    What an attacker gains while the item goes unmet: the means of changing the directory's
    answer on the way - and so what this machine holds about somebody's rights and belonging to
    groups.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze pracują aplikacje pytające
    katalog własnym klientem, bo one tego ustawienia mogą nie
    respektować albo reagować na nie źle.

    Wartość ustawiana przez naprawę oznacza negocjowanie podpisywania:
    klient prosi o podpisanie, a gdy druga strona nie umie, rozmawia
    dalej bez niego. Jest to wybór świadomy — nie zrywa niczego, co
    działa, i dlatego nadaje się do wprowadzenia szeroko. Punkt
    dopuszcza też wartość wyższą, oznaczającą żądanie bezwzględne; ta
    potrafi zerwać rozmowę z katalogiem i nie ustawiam jej za nikogo.

    Przypadkiem do sprawdzenia są aplikacje używające własnej biblioteki
    klienta katalogu, zwłaszcza napisane z myślą o innych systemach.
    Część z nich nie czyta tego ustawienia w ogóle, a część czyta
    i przestaje działać, gdy negocjacja podpisywania nie dochodzi do
    skutku.

    Przypadkiem drugim są połączenia do katalogów obcych — nie do domeny,
    lecz do usług katalogowych innych producentów, używanych przez
    aplikacje do sprawdzania tożsamości. Tam obsługa podpisywania bywa
    niepełna.

    Objawem jest niepowodzenie zapytania, najczęściej widoczne jako brak
    uprawnień albo pusty wynik wyszukiwania — i to jest tu pułapka, bo
    pusty wynik wygląda na poprawną odpowiedź „nie ma takiego wpisu",
    a nie na błąd połączenia.

    Zmiana nie dotyczy uwierzytelniania kont ani logowania do domeny.
    Mowa wyłącznie o rozmowie klienta katalogu.

    Zmiana nie wymaga przerwy i dotyczy połączeń nawiązywanych po niej.
  en: |
    What needs checking is whether applications asking the directory by a client of their own
    work on this server, they being able not to heed this setting or to answer it badly.

    The value the mending sets means the negotiating of signing: the client asks for a signature,
    and where the other side cannot, speaks on without it. It is a knowing choice - it breaks
    nothing that works and hence suits a wide rollout. The item allows a higher value too,
    meaning an unconditional demand; that one can break the conversation with the directory and I
    set it for nobody.

    The case to be checked is applications using a directory client library of their own, above
    all such as were written with other systems in mind. Some of them do not read this setting at
    all, and some read it and stop working where the negotiating of signing comes to nothing.

    The second case is connections to outside directories - not to the domain but to other
    makers' directory services, used by applications for the checking of identity. There the
    bearing of signing is at times incomplete.

    The symptom is a failed query, most often seen as a want of rights or an empty result of a
    search - and therein lies the trap here, an empty result looking like a right answer of "no
    such entry" rather than a fault of connection.

    The change does not bear on the authentication of accounts or on signing in to the domain.
    What is spoken of is the directory client's conversation alone.

    The change takes no break and bears on connections opened after it.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Aplikacja używająca własnej biblioteki klienta katalogu może przestać otrzymywać wyniki zapytań
      - Połączenie do katalogu innego producenta może nie obsłużyć negocjacji podpisywania
      - Objawem bywa pusty wynik wyszukiwania, wyglądający na poprawną odpowiedź, a nie na błąd
      - Uwierzytelnianie kont i logowanie do domeny pozostają bez zmiany
    en:
      - An application using a directory client library of its own may stop getting results of queries
      - A connection to another maker's directory may not bear the negotiating of signing
      - The symptom is at times an empty result of a search, looking like a right answer rather than a fault
      - The authentication of accounts and signing in to the domain stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracują aplikacje pytające katalog własną biblioteką, której obsługi podpisywania nie sprawdzono
      - Aplikacje łączą się z usługą katalogową innego producenta o niepełnej obsłudze podpisywania
    en:
      - Applications asking the directory by a library of their own work on the server and its bearing of signing was never checked
      - Applications connect with another maker's directory service of incomplete bearing of signing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One means the signing is negotiated, two that it is demanded. Both
      # meet the item, so the check keeps them apart from a state that agrees
      # to an unsigned conversation.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
      $name = 'LDAPClientIntegrity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[12]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
    $name = 'LDAPClientIntegrity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One stands for negotiating the signing: the client asks for it and,
    # where the other side cannot, speaks on without it. The higher value
    # demands it outright and can break the conversation, so it is left to a
    # knowing decision rather than set here.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LDAP'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LDAPClientIntegrity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-ldap-client-signing-requirements

notes:
  pl: |
    Punkt dotyczy strony pytającej i jej gotowości. Ciężar niesie
    wymaganie podpisywania po stronie kontrolera domeny — dopóki katalog
    przyjmuje rozmowy niepodpisane, klient wyrażający gotowość niewiele
    zmienia. Piszę to wprost, żeby nie sprawiać wrażenia zamknięcia
    sprawy.

    Naprawa ustawia negocjowanie, a nie żądanie bezwzględne. Wartość
    wyższa spełnia punkt tak samo, ale potrafi zerwać rozmowę
    z katalogiem i wymaga decyzji świadomej.

    Objawem niezgodności bywa pusty wynik wyszukiwania, który wygląda na
    poprawną odpowiedź. Jest to pułapka warta zapamiętania przy
    diagnozie.
  en: |
    The item bears on the asking side and its readiness. The weight is carried by the demand of
    signing on the domain controller's side - while the directory takes unsigned conversations, a
    client declaring readiness changes little. I write it outright, so as not to give an
    impression that the matter is closed.

    The mending sets the negotiating rather than the unconditional demand. The higher value meets
    the item as well but can break the conversation with the directory and takes a knowing
    decision.

    The symptom of non-compliance is at times an empty result of a search, which looks like a
    right answer. That is a trap worth keeping in mind at a diagnosis.
