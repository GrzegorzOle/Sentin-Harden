id: win2016-smb1-client-driver-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Sterownik klienta SMB w wersji pierwszej wyłączony
    en: The first-version SMB client driver switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zatrzymuje sterownik, którym maszyna łączy się do cudzych udziałów
    pierwszą wersją protokołu.

    Kategoria krytyczna, choć strona jest odwrotna niż w punkcie poprzednim.
    Tu nie chodzi o to, co maszynie wolno przysłać, tylko o to, dokąd maszyna
    sama pójdzie. Różnica jest istotna, bo ta strona odpowiada za atak, który
    nie wymaga od napastnika dostępu do serwera — wymaga tylko, żeby serwer
    gdzieś się połączył.

    Mechanizm warto nazwać, bo bywa pomijany. Jeżeli maszyna daje się nakłonić
    do sięgnięcia po zasób sieciowy — skrótem w dokumencie, ścieżką w pliku
    konfiguracyjnym, wpisem w zadaniu — to przy pierwszej wersji protokołu
    idzie tam z poświadczeniem konta, na którym działa. Napastnik nie musi
    niczego łamać: wystarczy, że po drugiej stronie stoi jego maszyna.

    Na serwerze dotyczy to kont o znacznie szerszych uprawnieniach niż na
    stanowisku. Konto usługi, konto zadania harmonogramu albo konto
    administratora wykonującego skrypt to zupełnie inna stawka niż konto
    użytkownika.

    Na wydaniu 2016 sterownik jest obecny i uruchamiany domyślnie, więc punkt
    opisuje stan faktyczny maszyny, a nie sytuację wyjątkową.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyciągnięcia z serwera materiału uwierzytelniającego konta, na którym
    działa połączenie, po samym skłonieniu maszyny do sięgnięcia pod wskazaną
    ścieżkę.
  en: |
    The item stops the driver by which the machine connects to other people's
    shares using the first version of the protocol.

    The category is critical, though the side is the reverse of the previous
    item. This is not about what may be sent to the machine but about where the
    machine goes itself. The difference matters, because this side accounts for
    an attack that does not require the attacker to reach the server - it only
    requires the server to connect somewhere.

    The mechanism is worth naming, since it tends to be skipped. If the machine
    can be induced to reach for a network resource - by a shortcut in a
    document, a path in a configuration file, an entry in a task - then with the
    first version of the protocol it goes there carrying the credential of the
    account it runs under. The attacker need break nothing: it is enough that
    their machine stands at the other end.

    On a server this concerns accounts with far broader rights than on a
    workstation. A service account, a scheduled task's account or the account
    of an administrator running a script is an entirely different stake from a
    user's account.

    On the 2016 release the driver is present and started by default, so the
    item describes the machine's actual state rather than an exceptional
    situation.

    What an attacker gains while the item goes unmet: the ability to draw the
    authentication material of the account the connection runs under out of the
    server, merely by inducing the machine to reach for a given path.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", niższa niż przy stronie przyjmującej, i chcę
    powiedzieć dlaczego. Ta strona dotyczy tylko tego, dokąd maszyna sama się
    łączy, a serwer robi to znacznie rzadziej, niż jest odpytywany.

    Sprawdzić trzeba jednak to, co na tej maszynie sięga po cudze udziały.
    Typowo są to skrypty kopiujące pliki na inny serwer, zadania harmonogramu
    zapisujące raporty na udziale, procedury kopii zapasowej oraz połączenia
    do urządzeń przechowujących dane. Jeżeli druga strona rozumie wyłącznie
    pierwszą wersję protokołu, takie połączenie po zmianie przestanie
    działać.

    Na serwerze 2016 najczęściej trafionym przypadkiem jest starsze urządzenie
    przechowujące dane, ustawione lata temu i od tego czasu nietknięte. Warto
    sprawdzić je z nazwy, zanim zmiana zostanie zastosowana.

    Objaw będzie taki sam jak przy stronie przyjmującej i równie mylący —
    brak ścieżki sieciowej albo odmowa dostępu, a nie informacja o wersji
    protokołu.

    Zmiana działa po ponownym uruchomieniu maszyny. Odwrócenie również.
  en: |
    The class is "needs review", lower than for the receiving side, and I want
    to say why. This side concerns only where the machine connects itself, and
    a server does that far less often than it is asked.

    What does need checking is whatever on this machine reaches for other
    people's shares. Typically that is scripts copying files to another server,
    scheduled tasks writing reports to a share, backup procedures and
    connections to storage devices. If the other end understands only the first
    version of the protocol, such a connection will stop working after the
    change.

    On Server 2016 the case most often hit is an older storage device, set up
    years ago and untouched since. It is worth checking by name before the
    change is applied.

    The symptom will be the same as on the receiving side and just as
    misleading - a missing network path or access denied, not a word about the
    protocol version.

    The change takes effect after the machine is restarted. So does undoing it.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - scripting-and-automation
    - drivers-and-devices
  what_breaks:
    pl:
      - Połączenia tej maszyny do udziałów rozumiejących wyłącznie pierwszą wersję protokołu przestają działać
      - Skrypty i zadania harmonogramu zapisujące pliki na starszym urządzeniu przechowującym dane kończą się błędem
      - Objaw jest mylący — brak ścieżki sieciowej albo odmowa dostępu, a nie informacja o wersji protokołu
      - Punkt dotyczy tylko strony łączącej się, więc nie zamyka przyjmowania połączeń przez tę maszynę
    en:
      - This machine's connections to shares that understand only the first version of the protocol stop working
      - Scripts and scheduled tasks writing files to an older storage device end in an error
      - The symptom is misleading - a missing network path or access denied, not a word about the protocol version
      - The item covers the connecting side only, so it does not close this machine's acceptance of connections
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna zapisuje dane na urządzeniu rozumiejącym wyłącznie pierwszą wersję protokołu i nie ma dla niego zamiennika
    en:
      - The machine writes data to a device that understands only the first version of the protocol and there is no replacement for it
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # A value of four means the driver does not start at all. The key without
      # a start value is reported apart, because it is what a machine looks like
      # after the component has been removed - a different state from a driver
      # present and left running.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
      $name = 'Start'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_INSTALLED' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'NO_START_VALUE' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(4|NOT_INSTALLED|NO_START_VALUE)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
    $name = 'Start'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the connecting side: where the machine goes, carrying the
    # credential of the account it runs under. Four means the driver does not
    # start at all; the change takes effect after a restart.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Start' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Audyt rozróżnia trzy stany, a nie dwa: sterownik zatrzymany, klucz bez
    wartości startu oraz brak klucza w ogóle. Dwa ostatnie opisują maszynę,
    z której składnik został usunięty, i są dla tego punktu poprawne tak samo
    jak wartość zatrzymania.

    Rozróżnienie ma znaczenie przy czytaniu raportu. Sterownik obecny
    i uruchamiany to co innego niż sterownik nieobecny, choć dla zgodności
    liczy się jedno i drugie.

    Punkt uzupełnia wyłączenie strony przyjmującej. Zamknięcie tylko jednej
    z nich zostawia drugą otwartą, a to jest dokładnie ten przypadek, w którym
    raport wygląda lepiej, niż wygląda maszyna.
  en: |
    The audit tells three states apart rather than two: the driver stopped, the
    key with no start value, and no key at all. The last two describe a machine
    from which the component has been removed, and for this item they are as
    correct as the stopped value.

    The distinction matters when reading the report. A driver present and
    started is a different thing from a driver absent, even though both count as
    compliance.

    The item completes the switching off of the receiving side. Closing only one
    of the two leaves the other open, and that is exactly the case where the
    report looks better than the machine does.
