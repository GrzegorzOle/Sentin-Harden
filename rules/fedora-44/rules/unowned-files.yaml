id: fedora44-unowned-files

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 7.1.12
  section: System Maintenance > System File Permissions
  title:
    pl: Nie ma plików ani katalogów bez właściciela lub grupy
    en: Ensure no files or directories without an owner and a group exist
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Plik należący do UID lub GID, którego nie ma w bazie kont, zostaje po
    usuniętym koncie albo przychodzi z rozpakowanego archiwum. Gdy system
    nada ten identyfikator nowemu kontu, dostanie ono cudze pliki razem
    z pełnymi prawami do nich.

    Punkt wymaga, żeby na lokalnych systemach plików każdy plik i katalog
    miał właściciela i grupę znane systemowi.
  en: |
    A file owned by a UID or GID that is missing from the account database
    remains after a deleted account or comes from an unpacked archive. When
    the system gives that identifier to a new account, the account gets
    someone else's files with full rights to them.

    The item requires that every file and directory on the local file
    systems has an owner and a group known to the system.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta atrybuty plików.
  en: |
    Nobody will notice: the check only reads the file attributes.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    lmounts() {
      findmnt -rn -o TARGET,FSTYPE 2>/dev/null |
        awk 'NR == FNR { if (NF == 1) real[$1] = 1; next } ($2 in real) && $2 !~ /^(vfat|exfat|msdos|iso9660|udf|ntfs|ntfs3|fuseblk)$/ { print $1 }' /proc/filesystems - |
        while IFS= read -r m; do printf '%b\n' "$m"; done
    }
    lscan() {
      local m
      lmounts | while IFS= read -r m; do
        find "$m" -xdev \( -path '*/containers/storage' -o -path '*/containerd' -o -path '*/kubelet/pods' -o -path '*/kubelet/plugins' -o -path /var/lib/docker \) -prune -o "$@" 2>/dev/null || true
      done
    }
    [ "$(id -u)" = 0 ] || { echo "NOT_OK:needs-root"; exit 0; }
    ids=$(lscan -printf '%U %G %p\n' | awk '{
      p = substr($0, length($1) + length($2) + 3)
      if (!($1 in u)) u[$1] = p; uc[$1]++
      if (!($2 in g)) g[$2] = p; gc[$2]++
    } END { for (i in u) print "u", i, uc[i], u[i]; for (i in g) print "g", i, gc[i], g[i] }')
    nu=0; ng=0; first=""
    while read -r k i c p; do
      [ -n "$k" ] || continue
      if [ "$k" = u ]; then getent passwd "$i" >/dev/null && continue; nu=$((nu + c))
      else getent group "$i" >/dev/null && continue; ng=$((ng + c)); fi
      [ -n "$first" ] || first="$p"
    done <<< "$ids"
    if [ $((nu + ng)) -gt 0 ]; then echo "NOT_OK:nouser=$nu,nogroup=$ng,$first"
    else echo "OK:nouser=0,nogroup=0"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man1/find.1.html
  - https://man7.org/linux/man-pages/man8/findmnt.8.html
  - https://man7.org/linux/man-pages/man1/getent.1.html
  - https://man7.org/linux/man-pages/man1/chown.1.html

notes:
  pl: |
    Test przeszukuje lokalne systemy plików tak jak skrypt CIS: typy bez
    nodev w /proc/filesystems, każdy punkt montowania z -xdev. Pomija vfat,
    exfat, NTFS, iso9660 i udf, które nie mają uniksowych właścicieli ani
    trybów. Odstępstwem od CIS jest pominięcie warstw obrazów kontenerów
    (containers/storage, containerd, kubelet, /var/lib/docker): należą do
    obrazów i zmieniają się przy każdym pobraniu. Podwoluminy btrfs
    niezamontowane osobno leżą na innym urządzeniu, więc -xdev je pomija,
    tak jak w CIS. Bez roota find nie wejdzie do wszystkich katalogów, więc
    wynik to NOT_OK:needs-root.
    Test zbiera UID i GID wszystkich ścieżek, a każdy identyfikator
    sprawdza raz przez getent, bo find -nouser pyta o każdy plik osobno
    i z modułem NSS systemd trwa to minuty. Wynik NOT_OK podaje liczbę
    ścieżek bez właściciela i bez grupy oraz pierwszą z nich. Użytkownicy
    dynamiczni systemd, na przykład ekran logowania GDM, istnieją tylko
    wtedy, gdy działa ich usługa, więc ich pliki mogą wyglądać na
    bezpańskie. Właściciela zmienia się ręcznie (chown, chgrp) po ustaleniu,
    do kogo pliki należą. Reguła tylko sprawdza stan.
  en: |
    The test searches the local file systems like the CIS script: the
    types without nodev in /proc/filesystems, each mount point with -xdev.
    It leaves out vfat, exfat, NTFS, iso9660 and udf, which have no Unix
    owners or modes. Unlike CIS, it skips container image layers
    (containers/storage, containerd, kubelet, /var/lib/docker): they belong
    to the images and change with every pull. Btrfs subvolumes that are not
    mounted on their own lie on another device, so -xdev skips them, as in
    CIS. Without root, find cannot enter every directory, so the result is
    NOT_OK:needs-root.
    The test collects the UID and GID of every path and resolves each
    identifier once with getent, because find -nouser asks about each file
    separately, which takes minutes with the systemd NSS module. The NOT_OK
    result gives the number of paths without an owner and without a group
    and the first of them. Systemd dynamic users, such as the GDM login
    screen, exist only while their service runs, so their files may appear
    to have no owner. The owner is changed by hand (chown, chgrp) after
    finding out whose files they are. The rule only checks the state.
