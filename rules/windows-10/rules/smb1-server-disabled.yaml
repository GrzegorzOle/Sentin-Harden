id: win10-smb1-server-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Serwer SMB w wersji pierwszej wyłączony
    en: The first-version SMB server switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna przestaje zgadzać się na rozmowę pierwszą
    wersją protokołu z kimś, kto ją o to poprosi.

    Punkt jest bliźniaczy wobec poprzedniego, ale dotyczy strony odwrotnej
    i jest od niego cięższy. Klient naraża się dopiero wtedy, gdy uda się go
    nakłonić do połączenia — trzeba więc czegoś, co maszynę do tego
    przywiedzie. Serwer stoi i czeka.

    Różnica jest praktyczna, nie teoretyczna. Żeby kod obsługujący tę wersję
    protokołu zaczął przetwarzać cudze dane, wystarczy, że ktoś z sieci
    nawiąże połączenie. Nie trzeba użytkownika, nie trzeba dokumentu,
    nie trzeba niczyjej pomyłki. Ta właśnie strona bywała drogą, którą
    złośliwe oprogramowanie rozchodziło się po sieciach lokalnych samo,
    z maszyny na maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: usługę
    osiągalną po sieci, obsługującą protokół bez sprawdzania tożsamości
    i bez ochrony przesyłanych danych.
  en: |
    The setting makes the machine cease agreeing to speak over the first version of the protocol with whoever
    asks it to.

    The item is twin to the foregoing one but touches the opposite side, and is the heavier of the two. A client
    is put at hazard only once it has been brought to join - something is needed, then, that shall bring the
    machine to it. A server stands and waits.

    The difference is a practical one, not a theoretical. For the code serving that version of the protocol to
    begin working upon somebody's data, it is enough that somebody on the network set up a connection. No user
    is needed, no document, nobody's slip. That very side has at times been the road by which malicious software
    went round local networks of itself, from machine to machine.

    What an attacker gains while the item goes unmet: a service reachable over the network, serving a protocol
    without a checking of identity and without a guard upon the data sent.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, kto sięga po
    zasoby tej maszyny.

    Stanowisko robocze udostępnia rzadziej niż serwer, ale udostępnia — folder
    wymiany, drukarka, katalog, do którego zapisuje skaner. Jeśli po drugiej
    stronie stoi urządzenie zatrzymane na wersji pierwszej, po zmianie
    przestanie dochodzić do udziału i zgłosi odmowę dostępu.

    Wiedzieć trzeba przy tym rzecz, której z maszyny nie widać: to, jakiej
    wersji protokołu używa strona łącząca się, nie jest zapisane w żadnym
    ustawieniu. Rozpoznaje się to po urządzeniu, nie po konfiguracji.

    Odnotowuję przerwę: zmiana wchodzi po restarcie maszyny, więc ponowny
    audyt pokaże zgodność, zanim zachowanie się zmieni.

    Czego to nie psuje: udziałów dla stron obsługujących nowsze wersje
    protokołu, uprawnień do zasobów, logowania, kont domenowych, aplikacji.
  en: |
    The class is "needs review", and the review touches who reaches for this machine's resources.

    A workplace shares more seldom than a server, but it shares - an exchange folder, a printer, a directory a
    scanner writes into. If on the other side stands a device stopped at the first version, after the change it
    will cease reaching the share and will report access denied.

    A thing must be known here that cannot be seen from the machine: which version of the protocol the joining
    side uses is written in no setting. It is recognised by the device, not by a configuration.

    I set down the break: the change takes hold after a restart of the machine, so a fresh audit will show
    compliance before the behaviour changes.

    What this does not break: shares for sides serving newer versions of the protocol, the rights upon
    resources, logging on, domain accounts, or applications.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - legacy-authentication
  what_breaks:
    pl:
      - Urządzenia i systemy obsługujące wyłącznie pierwszą wersję protokołu tracą dostęp do udziałów tej maszyny
      - Skanery i urządzenia kopiujące odkładające pliki na udział zaczynają zgłaszać odmowę dostępu
      - Wersji protokołu używanej przez stronę łączącą się nie widać w żadnym ustawieniu tej maszyny
      - Zmiana wchodzi po restarcie maszyny, więc ponowny audyt pokazuje zgodność wcześniej niż skutek
      - Udziały dla stron obsługujących nowsze wersje, uprawnienia do zasobów, logowanie i aplikacje pozostają bez zmian
    en:
      - Devices and systems serving only the first version of the protocol lose access to this machines shares
      - Scanners and copiers dropping files onto a share begin reporting access denied
      - The protocol version used by the joining side is seen in no setting upon this machine
      - The change takes hold after a restart, so a fresh audit shows compliance before the consequence
      - Shares for sides serving newer versions, the rights upon resources, logging on and applications stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z udziału na tej maszynie korzysta urządzenie obsługujące wyłącznie pierwszą wersję protokołu i nie da się go jeszcze wymienić
      - Nie ustalono, jakie urządzenia sięgają po udziały tej maszyny i którą wersją protokołu
    en:
      - A device serving only the first version of the protocol uses a share on this machine and cannot yet be replaced
      - It has not been established what devices reach for this machines shares, nor over which protocol version
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'SMB1'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'SMB1'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change takes hold at the next start of the machine. Until the restart
    # the old behaviour holds, the fresh audit showing a compliant value
    # notwithstanding.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SMB1' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Reguła jest drugą z trzech o wersji pierwszej protokołu i różni się od
    poprzedniej tym, czego wymaga od napastnika. Warto, żeby aplikacja
    postawiła tę różnicę wprost: klient wymaga, żeby maszynę do czegoś
    przywieść; serwer nie wymaga niczego poza dostępem do sieci.

    Odnotowuję odczyt wartości brakującej. Brak wpisu znaczy ustawienie
    domyślne, a domyślne pozostawia tę stronę czynną, więc sprawdzenie
    zwraca „MISSING", nie stan dobry. Jest to jeden z tych przypadków,
    w których cisza w rejestrze znaczy „włączone", i raport nie może jej
    przedstawiać jako zgodności.

    Warto też, żeby aplikacja przypomniała, że wyłączenie całego składnika
    czyni tę regułę bezprzedmiotową. Naprawianie trzech niezgodności po
    kolei jest pracą wykonaną trzy razy.
  en: |
    The rule is the second of the three about the protocol's first version, and differs from the foregoing one
    in what it asks of an attacker. It is well that the application put that difference outright: a client calls
    for the machine to be brought to something; a server calls for nothing beyond a reach to the network.

    I set down the reading of a missing value. An absent entry means the default setting, and the default leaves
    that side open, so the check returns "MISSING" rather than a good state. It is one of those cases in which
    silence in the registry means "switched on", and the report may not present it as compliance.

    It is well, too, that the application recall that switching off the whole component makes this rule beside
    the point. Mending three mismatches one by one is work done three times over.
