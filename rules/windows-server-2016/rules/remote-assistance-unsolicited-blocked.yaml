id: win2016-remote-assistance-unsolicited-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Remote Assistance
  title:
    pl: Pomoc zdalna oferowana bez prośby użytkownika zablokowana
    en: Remote assistance offered without the user asking blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje wariant pomocy zdalnej, w którym połączenie zaczyna
    strona pomagająca, a nie osoba przy maszynie.

    Różnica wobec wariantu proszonego jest zasadnicza. Tam użytkownik prosi
    o pomoc i wystawia zaproszenie, więc połączenie zaczyna się od jego
    decyzji. Tutaj decyzję podejmuje ktoś z zewnątrz: łączy się, gdy uzna to
    za stosowne, a przy maszynie pojawia się co najwyżej pytanie
    o potwierdzenie — pytanie, na które pracujący odpowiada twierdząco
    z przyzwyczajenia.

    Kto może tak się połączyć, wynika z listy pomocników wpisanej
    w konfiguracji. Lista ta bywa dziedziczona z zasad domeny, rozszerzana
    przy okazji wdrożeń i praktycznie nigdy przeglądana. Konto raz na nią
    wpisane zostaje, także wtedy, gdy osoba dawno zmieniła rolę albo
    organizację.

    Wariant ten jest wygodniejszy dla wsparcia i właśnie dlatego groźniejszy.
    Zdejmuje jedyne zabezpieczenie, jakie pomoc zdalna ma z natury — to, że
    bez świadomego działania osoby przy maszynie nic się nie zaczyna.

    Na serwerze zaś, podobnie jak wariant proszony, nie ma zastosowania,
    bo przy serwerze nie ma komu ani prosić, ani potwierdzać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zainicjowania połączenia z pulpitem maszyny z konta wpisanego na listę
    pomocników, bez udziału kogokolwiek po drugiej stronie.
  en: |
    The setting blocks the variant of remote assistance in which the connection is
    begun by the helping side rather than by the person at the machine.

    The difference from the asked-for variant is fundamental. There the user asks
    for help and issues an invitation, so the connection begins with their decision.
    Here the decision is taken by somebody outside: they connect when they see fit,
    and at the machine there appears at most a question asking for confirmation - a
    question the person working answers yes to out of habit.

    Who may connect in this way follows from the list of helpers written into the
    configuration. That list is at times inherited from domain policies, widened
    along the way during rollouts, and practically never reviewed. An account once
    written onto it stays, including where the person has long since changed role or
    organisation.

    The variant is more convenient for support and for that very reason more
    dangerous. It takes away the one safeguard remote assistance has by nature -
    that without a deliberate act by the person at the machine nothing begins.

    On a server, meanwhile, it has no use, just like the asked-for variant, since at
    a server there is nobody either to ask or to confirm.

    What an attacker gains while the item goes unmet: the means of beginning a
    connection to the machine's desktop from an account written onto the helpers'
    list, with nobody's part in it on the other side.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to ocena, nie uprzejmość. Na serwerze
    wariant nieproszony pomocy zdalnej nie ma zastosowania, bo nie ma przy
    maszynie nikogo, do kogo można by się w ten sposób podłączyć.

    Nie znaleziono scenariusza, w którym ta zmiana cokolwiek psuje na
    maszynie serwerowej. Wsparcie łączy się do serwera pulpitem zdalnym albo
    powłoką zdalną, i obie te drogi pozostają nietknięte.

    Warunek, przy którym ocena przestaje obowiązywać, jest jeden i warto go
    nazwać: maszyna pełniąca rolę stanowiska pracy, zbudowana na systemie
    serwerowym. Tam wariant nieproszony bywa narzędziem działu wsparcia
    i zmiana jest odczuwalna. Na takiej maszynie punkt należy rozpatrzyć
    osobno, mimo że klasa mówi co innego.

    Czego to nie psuje: pulpitu zdalnego, powłoki zdalnej, konsoli lokalnej,
    narzędzi wsparcia z własnym mechanizmem dostępu, wariantu proszonego
    pomocy zdalnej — ten zamyka osobna reguła.

    Bez restartu, natychmiast odwracalne, niewidoczne w codziennej pracy.
  en: |
    The class is "none", and that is an assessment rather than a courtesy. On a
    server the unasked-for variant of remote assistance has no use, since there is
    nobody at the machine to be connected to in this way.

    No scenario has been found in which this change breaks anything on a server
    machine. Support connects to a server by the remote desktop or by a remote
    shell, and both those roads stay untouched.

    There is one condition under which the assessment ceases to hold, and it is
    worth naming: a machine serving as a workstation, built on a server system.
    There the unasked-for variant is at times a support department's tool and the
    change is felt. On such a machine the item should be weighed apart, whatever the
    class says.

    What this does not break: the remote desktop, the remote shell, the local
    console, support tools with an access mechanism of their own, or the asked-for
    variant of remote assistance - a separate rule shuts that.

    No restart, undone immediately, invisible in daily work.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Nie znaleziono scenariusza, w którym ta zmiana psuje cokolwiek na maszynie serwerowej
      - Na maszynie pełniącej rolę stanowiska pracy dział wsparcia traci możliwość zainicjowania sesji pomocy bez prośby użytkownika
      - Pulpit zdalny, powłoka zdalna i narzędzia wsparcia z własnym mechanizmem dostępu pozostają bez zmian
      - Wariant proszony pomocy zdalnej zamyka osobna reguła i ta zmiana go nie dotyka
    en:
      - No scenario has been found in which this change breaks anything on a server machine
      - On a machine serving as a workstation the support department loses the means of beginning a help session without the user asking
      - The remote desktop, the remote shell and support tools with an access mechanism of their own stay unchanged
      - The asked-for variant of remote assistance is shut by a separate rule and this change does not touch it
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę stanowiska pracy, a dział wsparcia inicjuje sesje pomocy bez prośby użytkownika i nie ma narzędzia zastępczego
      - Lista pomocników jest w tej organizacji jedyną drogą dostępu wsparcia i nie zastąpiono jej dostępem opartym na koncie
    en:
      - The machine serves as a workstation and the support department begins help sessions without the user asking, with no substitute tool
      - The helpers' list is in this organisation the only road of support access and has not been replaced by access resting on an account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fAllowUnsolicited'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fAllowUnsolicited'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fAllowUnsolicited' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt jest jednym z nielicznych w grupie zdalnego dostępu, który trafia
    do klasy „bez uciążliwości", więc nadaje się do trybu zbiorczego. Warto
    to pokazać, bo w macierzy ryzyka i uciążliwości ląduje w polu szybkich
    wygranych: zysk wysoki, koszt zerowy.

    Reguła jest drugą połową pary z wyłączeniem pomocy zdalnej. Tamta zamyka
    drogę proszoną, ta nieproszoną. Kolejność nie ma znaczenia, ale
    wdrożenie tylko jednej zostawia otwartą drugą i daje w raporcie obraz
    mylący — mechanizm wygląda na zamknięty, a nie jest.

    Lista pomocników zasługuje na osobne spojrzenie przy okazji tego punktu,
    nawet jeśli reguła jej nie dotyka. To ona rozstrzyga, kto mógłby z tej
    drogi skorzystać, a jej przegląd bywa odkładany latami.
  en: |
    The item is one of the few in the remote access group falling into the class
    "none", so it is fit for the bulk mode. Worth showing, since in the risk and
    disruption matrix it lands in the square of quick wins: high gain, no cost.

    The rule is the other half of a pair with the switching off of remote
    assistance. That one shuts the asked-for road, this one the unasked-for. The
    order does not matter, but rolling out only one leaves the other open and gives
    a misleading picture in the report - the mechanism looks shut and is not.

    The helpers' list deserves a separate look at this item, even though the rule
    does not touch it. It is what settles who could use this road, and its review is
    at times put off for years.
