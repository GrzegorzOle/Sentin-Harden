id: win11-remote-desktop-configuration-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konfiguracji pulpitu zdalnego wyłączona
    en: The Remote Desktop configuration service disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przygotowuje maszynę do przyjmowania połączeń pulpitem zdalnym:
    zarządza certyfikatem używanym do zabezpieczenia połączenia, odtwarza
    ustawienia sesji i porządkuje po sesjach zakończonych. Pracuje
    z uprawnieniami systemowymi i startuje zanim ktokolwiek się połączy.

    Sama w sobie nie wystawia portu do sieci i nie przyjmuje połączeń — robi to
    usługa główna, opisana osobną regułą. Wartość wyłączenia tej usługi jest
    więc inna i warto powiedzieć jaka, zamiast powtarzać uzasadnienie
    z poprzedniej reguły.

    Po pierwsze, usługa ta potrafi z powrotem przygotować maszynę do pracy
    zdalnej. Zostawiona włączona na maszynie, na której wyłączono usługę
    główną, jest połową mechanizmu czekającą na uruchomienie drugiej połowy —
    a przywrócenie tamtej jest wtedy zmianą jednego ustawienia.

    Po drugie, jest to kolejny stale uruchomiony proces systemowy o wysokich
    uprawnieniach, istniejący wyłącznie po to, żeby obsługiwać funkcję, której
    na maszynie świadomie nie ma. Zdejmowanie takich procesów jest właściwym
    zastosowaniem tego punktu.
  en: |
    The service prepares the machine for taking Remote Desktop connections: it manages
    the certificate used to secure the connection, restores session settings and tidies
    up after sessions that have ended. It works with system rights and starts before
    anybody connects.

    In itself it puts out no port to the network and takes no connections - the main
    service does that, described by a rule of its own. So the worth of disabling this
    one lies elsewhere, and it is worth saying where rather than repeating the reasoning
    of the previous rule.

    First, this service can prepare the machine for remote work again. Left running on a
    machine where the main service was disabled, it is half a mechanism waiting for the
    other half to be started - and bringing that one back is then a change to a single
    setting.

    Second, it is one more system process running all the time with high rights,
    existing solely to serve a function deliberately absent from the machine. Taking
    such processes away is the proper use of this item.

disruption_description:
  pl: |
    Sprawdzenia wymaga to samo, co przy usłudze głównej: czy ktokolwiek łączy
    się do tej maszyny pulpitem zdalnym.

    Punkt ma sens wyłącznie razem z wyłączeniem usługi głównej i tak należy go
    czytać. Wyłączenie samej tej usługi przy pozostawionej usłudze głównej
    prowadzi do stanu najgorszego z możliwych: połączenia są dalej przyjmowane,
    ale bez zarządzania certyfikatem i bez porządkowania po sesjach.
    W praktyce objawia się to ostrzeżeniem o certyfikacie przy każdym
    połączeniu albo błędem przy zestawianiu sesji, trudnym do powiązania
    z przyczyną.

    Dlatego reguła jest oznaczona jako wymagająca świadomego wdrożenia mimo
    niskiej pozornie wagi: nie dlatego, że sama w sobie wiele psuje, tylko
    dlatego, że wdrożona w złej kolejności psuje więcej niż naprawia.

    Właściwa kolejność to najpierw usługa główna, potem ta. Przy cofaniu —
    odwrotnie.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is the same as with the main service: whether anybody connects
    to this machine over Remote Desktop.

    The item makes sense only together with disabling the main service, and that is how
    it should be read. Disabling this one alone while the main service is left running
    leads to the worst state possible: connections are still taken, but with no
    certificate management and no tidying after sessions. In practice that shows as a
    certificate warning at every connection or an error while setting up a session, hard
    to tie to its cause.

    That is why the rule is marked as taking a planned rollout despite its seemingly low
    weight: not because it breaks much in itself, but because applied in the wrong order
    it breaks more than it mends.

    The right order is the main service first, this one after. When undoing - the other
    way about.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Przy pozostawionej usłudze głównej połączenia zgłaszają ostrzeżenie o certyfikacie
      - Porządkowanie ustawień po zakończonych sesjach przestaje być wykonywane
      - Ponowne włączenie pracy zdalnej wymaga włączenia obu usług, nie jednej
      - Na maszynie bez pracy zdalnej nie zmienia się nic odczuwalnego
    en:
      - With the main service left running, connections report a certificate warning
      - Tidying settings after sessions that have ended stops being done
      - Switching remote work back on takes both services, not one
      - On a machine with no remote work nothing noticeable changes
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Usługa główna pulpitu zdalnego pozostaje włączona i maszyna przyjmuje połączenia
      - Ktokolwiek pracuje na tej maszynie zdalnie i nie ma innej drogi dostępu
    en:
      - The main Remote Desktop service stays on and the machine takes connections
      - Anybody works on this machine remotely and has no other way in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'SessionEnv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SessionEnv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SessionEnv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Reguła jest częścią trójki opisującej usługi pulpitu zdalnego: usługa
    główna przyjmująca połączenia, ta przygotowująca maszynę i przekierowanie
    portów. Wyniki tych trzech reguł należy czytać razem — maszyna z jedną
    wyłączoną i dwiema włączonymi nie jest zabezpieczona ani w połowie, tylko
    w stanie niespójnym.

    Usługa jest zależnością usługi głównej. Zatrzymanie tej usługi zatrzymuje
    tamtą, ale odwrotna zależność nie zachodzi i wyłączenie usługi głównej nie
    zmienia trybu uruchamiania tej.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The rule is part of a trio describing the Remote Desktop services: the main service
    taking connections, this one preparing the machine, and port redirection. The
    results of these three rules should be read together - a machine with one disabled
    and two running is not half guarded but in an inconsistent state.

    The service is a dependency of the main one. Stopping this service stops that one,
    but the reverse does not hold, and disabling the main service does not change this
    one's startup mode.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment.
