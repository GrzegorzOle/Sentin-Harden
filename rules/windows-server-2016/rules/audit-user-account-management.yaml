id: win2016-audit-user-account-management

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Account Management
  title:
    pl: Inspekcja zarządzania kontami użytkowników
    en: Audit user account management
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje wszystko, co dzieje się z kontami użytkowników:
    utworzenie, usunięcie, zmianę nazwy, zmianę hasła, włączenie, wyłączenie,
    odblokowanie i zmianę atrybutów konta.

    Utworzenie konta jest klasycznym sposobem utrwalenia dostępu. Napastnik,
    który wszedł raz, potrzebuje drogi powrotnej niezależnej od tego, czym
    wszedł — a nowe konto, zwłaszcza o nazwie przypominającej konto usługowe,
    jest drogą najwygodniejszą. Bez tej podkategorii takie konto po prostu
    pewnego dnia jest i nie da się powiedzieć, od kiedy ani z czyjej ręki.

    Równie ważna jest zmiana hasła cudzego konta. Jest to typowy krok przejęcia
    tożsamości i jedyny sposób, żeby to zauważyć, o ile właściciel konta nie
    zgłosi, że nie może się zalogować.

    Rejestrowanie niepowodzeń ma tu wartość osobną. Nieudana próba utworzenia
    konta albo zmiany hasła jest sygnałem, że ktoś próbuje rzeczy, do których
    nie ma uprawnień — a to zdarzenie powstaje wyłącznie w tej podkategorii.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    założenia sobie konta na tej maszynie albo przejęcia cudzego bez śladu
    wskazującego, kiedy i kto to zrobił.
  en: |
    The subcategory records everything that happens to user accounts: creation,
    deletion, renaming, a change of password, enabling, disabling, unlocking and a
    change of the account's attributes.

    Creating an account is a classic way of making access last. An attacker who has
    got in once needs a way back independent of the way they came - and a new
    account, especially one named like a service account, is the most convenient
    way. Without this subcategory such an account simply is there one day, and there
    is no saying from when or by whose hand.

    Changing another account's password matters as much. It is the typical step in
    taking over an identity, and the only way of noticing it, unless the account's
    owner reports being unable to sign in.

    Recording failures has a worth of its own here. A failed attempt to create an
    account or change a password signals that somebody is trying things they have no
    right to - and that event arises in this subcategory alone.

    What an attacker gains while the item goes unmet: the means of setting up an
    account for themselves on this machine, or of taking over somebody else's,
    without a trace of when and by whom it was done.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zdarzeń jest mało, bo kont nie zakłada się
    codziennie — nawet na kontrolerze domeny obsługującym dużą organizację
    liczba zmian w kontach idzie w dziesiątki dziennie, nie w tysiące.

    Jest to punkt, który na serwerze wdraża się bez wahania. Koszt objętościowy
    jest pomijalny, a zysk należy do najwyższych w całym bloku: to jest jedyne
    miejsce, w którym widać powstanie nowej tożsamości w systemie.

    Jedyny przypadek wart uwagi dotyczy kontrolerów w organizacjach
    z automatyczną synchronizacją kont z systemu kadrowego. Tam każda tura
    synchronizacji dopisuje zdarzenie dla każdego zmienionego atrybutu i przy
    kilku tysiącach kont potrafi to być wyraźny skok raz na dobę. Nadal jest to
    rząd wielkości mieszczący się w zwykłym dzienniku.

    Czego to nie psuje: zakładania i zmieniania kont, resetów haseł, pracy
    narzędzi administracyjnych ani synchronizacji z systemami zewnętrznymi.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". There are few events, because accounts are not set
    up daily - even on a domain controller serving a large organisation the count of
    changes to accounts runs into the tens a day, not the thousands.

    This is an item that goes in on a server without hesitation. The cost in volume
    is negligible and the gain among the highest in the whole block: this is the one
    place where the coming into being of a new identity in the system is visible.

    The one case worth attention concerns controllers in organisations with
    automatic synchronisation of accounts from a personnel system. There every round
    of synchronisation adds an event for every attribute changed, and with a few
    thousand accounts that can be a marked jump once a day. It is still an order of
    size that fits in an ordinary log.

    What this does not break: setting up and changing accounts, password resets, the
    work of administrative tools, or synchronisation with outside systems.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — liczba zdarzeń idzie za liczbą zmian w kontach, a ta jest niewielka
      - Na kontrolerze z automatyczną synchronizacją kont z systemu kadrowego widać wyraźny skok raz na dobę
      - Zakładanie kont, resety haseł i praca narzędzi administracyjnych działają bez zmian
      - Synchronizacja z systemami zewnętrznymi pozostaje nietknięta
    en:
      - No regression in the working - the count of events follows the count of changes to accounts, and that is small
      - On a controller with automatic synchronisation of accounts from a personnel system a marked jump shows once a day
      - Setting up accounts, password resets and the work of administrative tools work unchanged
      - Synchronisation with outside systems stays untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — koszt objętościowy jest pomijalny nawet przy ciasnym dzienniku
    en:
      - No known contraindication - the cost in volume is negligible even with a tight log
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9235-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9235-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9235-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9235-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9235-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-user-account-management

notes:
  pl: |
    Punkt jest jednym z tych, dla których macierz ryzyka i uciążliwości daje
    jednoznaczną odpowiedź: wysoki zysk, zerowy koszt, do zrobienia od razu.
    W domyślnym sortowaniu powinien trafiać na samą górę.

    Zdarzenia z tej podkategorii są pierwszym miejscem, w które się zagląda
    przy podejrzeniu, że ktoś utrwalił sobie dostęp. Drugim są zadania
    w harmonogramie i usługi — te opisują osobne reguły.

    Podkategoria obejmuje konta użytkowników, nie konta komputerów ani grupy.
    Te ostatnie mają własne podkategorie i własne reguły; warto je w raporcie
    trzymać obok siebie.
  en: |
    The item is one of those for which the matrix of risk and disruption gives an
    unambiguous answer: high gain, no cost, to be done at once. In the default
    sorting it should land at the very top.

    Events from this subcategory are the first place one looks when access is
    suspected of having been made to last. The second is scheduled tasks and
    services - separate rules describe those.

    The subcategory covers user accounts, not computer accounts and not groups.
    Those last have subcategories and rules of their own; they are worth keeping
    side by side in the report.
