id: win11-push-to-install-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa instalowania programów zleconego z innego urządzenia wyłączona
    en: The service installing programs ordered from another device disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa odbiera zlecenia instalacji programów złożone poza tą maszyną —
    w sklepie systemowym otwartym na innym urządzeniu albo przez przeglądarkę
    — i wykonuje je tutaj, bez udziału kogokolwiek siedzącego przy maszynie.

    Warto powiedzieć to jeszcze raz, bo stanowi całe uzasadnienie punktu:
    program pojawia się na maszynie w wyniku decyzji podjętej gdzie indziej,
    a osoba przy maszynie nie jest o nic pytana i nie musi nawet wiedzieć,
    że coś się instaluje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: ktoś, kto
    przejął konto użytkownika — samo konto, bez dostępu do maszyny — może
    zlecić zainstalowanie na niej programu. Nie potrzebuje do tego ani
    poświadczeń administratora, ani obecności przy maszynie, ani dostarczania
    czegokolwiek przez sieć. Wystarczy konto i sklep otwarty w przeglądarce.

    Zakres jest ograniczony do programów ze sklepu systemowego i nie należy
    tego przemilczeć — nie jest to droga do uruchomienia dowolnego kodu.
    Jest to natomiast droga do postawienia na maszynie programu, którego
    użytkownik nie wybierał, i zrobienia tego zdalnie.
  en: |
    The service receives orders to install programs placed off this machine - in the
    system store opened on another device, or through a browser - and carries them out
    here, with no involvement of anybody sitting at the machine.

    It is worth saying again, since it is the whole justification of the item: a program
    appears on the machine as the result of a decision taken elsewhere, and the person at
    the machine is asked nothing and need not even know that anything is being installed.

    What an attacker gains while the item goes unmet: somebody who has taken over a
    user's account - the account alone, with no access to the machine - can order a
    program installed on it. For that they need neither administrator credentials, nor
    presence at the machine, nor to deliver anything over the network. An account and a
    store opened in a browser are enough.

    The range is limited to programs from the system store and that should not be passed
    over in silence - it is not a route to running arbitrary code. It is, however, a
    route to putting a program the user did not choose on the machine, and doing so
    remotely.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek instaluje programy na tej maszynie
    w ten sposób — a jest to zastosowanie rzadkie i zwykle nieznane
    użytkownikowi z nazwy.

    Po wyłączeniu usługi instalacja zlecona z innego urządzenia po prostu nie
    dojdzie do skutku. Objawem bywa brak objawu: zlecenie wygląda na przyjęte
    po tamtej stronie, a program nie pojawia się tutaj. Jest to jedyny skutek
    tej zmiany i warto go znać, żeby nie szukać przyczyny gdzie indziej.

    Instalowanie programów ze sklepu systemowego uruchomionego na tej maszynie
    działa dalej bez żadnej zmiany. Aktualizacje programów już zainstalowanych
    również — obsługuje je inny składnik.

    Na stanowisku, na którym sklep systemowy jest i tak zablokowany zasadami,
    zmiana nie robi nic. Warto wtedy potraktować ją jako domknięcie tamtej
    decyzji: zasada zamyka drogę od strony interfejsu, ta usługa zamyka ją od
    strony zlecenia przychodzącego.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anybody installs programs on this machine in this way -
    and it is a rare use, usually unknown to the user by name.

    Once the service is off, an installation ordered from another device simply will not
    come about. The symptom is sometimes the lack of one: the order looks accepted on
    that side and the program does not appear here. That is the only effect of this
    change, and it is worth knowing so that the cause is not looked for elsewhere.

    Installing programs from the system store started on this machine carries on with no
    change at all. So do updates to programs already installed - another component
    handles them.

    At a station where the system store is blocked by policy anyway, the change does
    nothing. It is then worth taking as the closing of that decision: the policy closes
    the route from the interface's side, this service closes it from the side of the
    incoming order.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Instalacja zlecona ze sklepu otwartego na innym urządzeniu nie dochodzi do skutku
      - Zlecenie wygląda na przyjęte po tamtej stronie, a program nie pojawia się na maszynie
      - Instalowanie ze sklepu uruchomionego na tej maszynie działa dalej bez zmiany
      - Aktualizacje programów już zainstalowanych działają dalej bez zmiany
    en:
      - An installation ordered from a store opened on another device does not come about
      - The order looks accepted on that side and the program does not appear on the machine
      - Installing from the store started on this machine carries on unchanged
      - Updates to programs already installed carry on unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Przyjętym sposobem wyposażania stanowisk jest zlecanie instalacji z innego urządzenia
      - Dział informatyczny instaluje programy ze sklepu zdalnie, bez dostępu do maszyny
    en:
      - The accepted way of equipping stations is ordering installations from another device
      - The computing department installs store programs remotely, with no access to the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PushToInstall'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PushToInstall'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'PushToInstall' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PushToInstall' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PushToInstall' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-pushtoinstall

notes:
  pl: |
    Punkt dobrze czytać razem z regułami dotyczącymi sklepu systemowego
    i instalowania programów. Tamte rozstrzygają, co wolno zainstalować; ta
    rozstrzyga, kto może instalację zlecić i skąd.

    Wyłączenie usługi nie usuwa programów zainstalowanych wcześniej tą drogą
    ani nie cofa zleceń złożonych, a jeszcze niewykonanych. Po cofnięciu
    zmiany zaległe zlecenia mogą zostać wykonane — warto o tym wiedzieć przy
    czasowym przywracaniu usługi.

    Reguła jest przykładem punktu, w którym zysk jest niewidoczny, a koszt
    zerowy dla większości stanowisk. Takie punkty należą do klasy, którą warto
    wdrażać bez wahania — z zastrzeżeniem, że ocena skutków tej reguły wypada
    „wymaga sprawdzenia", a nie „bez uciążliwości", właśnie dlatego, że bywa
    przyjętym sposobem wyposażania stanowisk.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The item is best read together with the rules about the system store and about
    installing programs. Those settle what may be installed; this one settles who may
    order an installation and from where.

    Disabling the service removes neither programs installed by this route earlier nor
    orders already placed but not yet carried out. Once the change is undone, outstanding
    orders may be carried out - worth knowing when the service is brought back
    temporarily.

    The rule is an example of an item where the gain is invisible and the cost nil for
    most stations. Such items belong to the class worth applying without hesitation -
    with the reservation that this rule's assessment of effects comes out as "needs
    review" rather than "no disruption", precisely because it is sometimes the accepted
    way of equipping stations.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
