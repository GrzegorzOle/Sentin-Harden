id: win2025-software-secure-attention-sequence-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Logon Options
  title:
    pl: Wywoływanie bezpiecznej sekwencji uwagi przez programy zablokowane
    en: The raising of the secure attention sequence by programs blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania programom wywoływania bezpiecznej sekwencji uwagi —
    kombinacji klawiszy otwierającej ekran systemowy z opcjami logowania
    i blokowania.

    Kategoria średnia i sedno leży w tym, po co ta sekwencja w ogóle
    powstała. Jest to jedyny sygnał, którego program nie może podrobić:
    naciśnięcie tej kombinacji przechwytuje system, zanim dotrze ona
    gdziekolwiek indziej. Dzięki temu ekran, który się wtedy pojawia,
    na pewno jest ekranem systemu, a nie oknem udającym go.

    Cała wartość tego mechanizmu polega więc na jego niepodrabialności.
    Zezwolenie programom na wywoływanie tej sekwencji odbiera jej dokładnie
    tę własność: skoro sekwencję może wywołać program, użytkownik nie ma
    już sposobu odróżnienia ekranu prawdziwego od podstawionego. Fałszywy
    ekran logowania przestaje być trudny do zrobienia i staje się
    przewidzianą możliwością.

    Na serwerze osobą wpisującą hasło w taki ekran jest administrator,
    a sesja, w której to robi, bywa zdalna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    doprowadzenia do ekranu podania hasła w chwili, którą sam wybiera,
    i bez sposobu, by ofiara rozpoznała podmianę.
  en: |
    The item forbids programs to raise the secure attention sequence - the
    key combination opening the system screen with the sign-in and locking
    options.

    The category is medium, and the heart of it lies in why this sequence
    exists at all. It is the one signal a program cannot counterfeit:
    pressing the combination is caught by the system before it reaches
    anywhere else. Because of that, the screen appearing then is certainly
    the system's screen and not a window imitating it.

    The whole value of the mechanism therefore rests on its being
    uncounterfeitable. Letting programs raise the sequence takes exactly that
    property away: once a program can raise it, a user has no way left of
    telling a real screen from a substituted one. A false sign-in screen
    stops being hard to make and becomes a foreseen possibility.

    On a server the person typing a password into such a screen is an
    administrator, and the session they do it in is often remote.

    What an attacker gains while the item goes unmet: the ability to bring up
    a password screen at a moment of their own choosing, with no way for the
    victim to recognise the substitution.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i tutaj sprawdzenie jest konkretne: chodzi
    o narzędzia zdalnego dostępu i o oprogramowanie ułatwień dostępu.

    Narzędzia zdalnego dostępu używają tego mechanizmu, żeby wysłać tę
    kombinację klawiszy do maszyny zdalnej — bo naciśnięta lokalnie zadziała
    na maszynie lokalnej, a nie tam, gdzie trzeba. Po zmianie osoba
    prowadząca sesję zdalną nie zdoła tą drogą otworzyć ekranu systemowego.
    Warto wiedzieć, że wiele takich narzędzi ma własne przejście dla tej
    kombinacji i zmiana ich nie dotknie, ale trzeba to sprawdzić, zanim
    zostanie się bez dostępu do serwera w niedogodnej chwili.

    Drugi przypadek to klawiatury ekranowe i oprogramowanie ułatwień
    dostępu. Bez tego mechanizmu osoba, która nie używa klawiatury fizycznej,
    nie ma jak tej kombinacji nacisnąć.

    Ustawienie przyjmuje wartości ze zbioru, nie tylko zero i jeden — zero
    nie dopuszcza żadnego oprogramowania, a dalsze pozycje dopuszczają
    usługi, narzędzia ułatwień dostępu albo jedno i drugie. Jeżeli
    sprawdzenie wykaże realną potrzebę, właściwą odpowiedzią jest wybranie
    węższej pozycji, a nie porzucenie punktu.

    Czego to nie psuje: naciśnięcia kombinacji na klawiaturze, ekranu
    logowania, blokowania ekranu ani niczego, co robi człowiek przy
    maszynie.

    Bez przerwy, niewidoczne w codziennej pracy, natychmiast odwracalne.
  en: |
    The class is "needs review", and here the review is definite: it concerns
    remote access tools and accessibility software.

    Remote access tools use this mechanism to send the key combination to the
    remote machine - because pressed locally it acts on the local machine and
    not where it is needed. After the change, somebody running a remote
    session will not be able to open the system screen that way. It is worth
    knowing that many such tools have a passage of their own for this
    combination and will be untouched, but that has to be checked before one
    is left without access to a server at an awkward moment.

    The second case is on-screen keyboards and accessibility software.
    Without this mechanism, somebody who does not use a physical keyboard has
    no way of pressing the combination.

    The setting takes values from a set, not just zero and one - zero admits
    no software at all, and the further positions admit services,
    accessibility tools, or both. If the review shows a real need, the right
    answer is to choose a narrower position rather than abandon the item.

    What this does not break: pressing the combination on a keyboard, the
    sign-in screen, locking the screen, or anything a person does at the
    machine.

    No outage, invisible in daily work, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Narzędzie zdalnego dostępu może stracić możliwość wysłania tej kombinacji klawiszy do maszyny zdalnej
      - Wiele takich narzędzi ma własne przejście dla tej kombinacji, ale trzeba to sprawdzić przed zmianą
      - Klawiatury ekranowe i oprogramowanie ułatwień dostępu tracą sposób wywołania tego ekranu
      - Ustawienie przyjmuje wartości ze zbioru — przy realnej potrzebie wybierz węższą pozycję, zamiast porzucać punkt
    en:
      - A remote access tool may lose the ability to send this key combination to the remote machine
      - Many such tools have a passage of their own for the combination, but that has to be checked before the change
      - On-screen keyboards and accessibility software lose their way of raising this screen
      - The setting takes values from a set - where the need is real, choose a narrower position rather than abandon the item
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dostęp do serwera opiera się na narzędziu zdalnym, które wysyła tę kombinację tym mechanizmem i nie ma własnego przejścia
    en:
      - Access to the server rests on a remote tool that sends this combination by this mechanism and has no passage of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero admits no software at all, and
      # the further positions admit services, accessibility tools, or both.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'SoftwareSASGeneration'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'SoftwareSASGeneration'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The whole value of this sequence rests on a program being unable to
    # counterfeit it. Letting programs raise it removes exactly that property,
    # and a false sign-in screen becomes a foreseen possibility. Check remote
    # access tools first - some send the combination by this route.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SoftwareSASGeneration' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/secauthn/winlogon-and-gina

notes:
  pl: |
    Ta sekwencja jest jedynym sygnałem, którego program nie może podrobić:
    naciśnięcie kombinacji przechwytuje system, zanim dotrze ona gdziekolwiek
    indziej. Dzięki temu ekran, który się wtedy pojawia, na pewno jest
    ekranem systemu.

    Zezwolenie programom na wywoływanie sekwencji odbiera jej dokładnie tę
    własność. Fałszywy ekran logowania przestaje być trudny do zrobienia
    i staje się przewidzianą możliwością.

    Ustawienie przyjmuje wartości ze zbioru, nie tylko zero i jeden. Przy
    realnej potrzebie — narzędzie zdalne albo oprogramowanie ułatwień
    dostępu — wybierz węższą pozycję, zamiast porzucać punkt.
  en: |
    This sequence is the one signal a program cannot counterfeit: pressing
    the combination is caught by the system before it reaches anywhere else.
    Because of that, the screen appearing then is certainly the system's.

    Letting programs raise the sequence takes exactly that property away. A
    false sign-in screen stops being hard to make and becomes a foreseen
    possibility.

    The setting takes values from a set, not just zero and one. Where the
    need is real - a remote tool or accessibility software - choose a
    narrower position rather than abandon the item.
