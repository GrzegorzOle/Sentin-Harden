id: win2016-app-inventory-collector-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Zbieranie spisu zainstalowanego oprogramowania wyłączone
    en: Collecting an inventory of installed software switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza składnik zbierający spis zainstalowanego na maszynie
    oprogramowania i wysyłający go na zewnątrz.

    Różnica wobec punktu poprzedniego jest istotna i warto ją nazwać. Tamten
    dotyczył programów uruchamianych; ten dotyczy zainstalowanych. Spis
    zainstalowanych jest przy tym pełniejszy, bo obejmuje również to, czego
    nikt nie uruchamiał od lat.

    Zagrożenie leży w tym, że spis ten nie jest listą nazw, tylko listą
    wersji. Lista wersji zestawiona z publicznym rejestrem podatności
    odpowiada na pytanie, którędy wejść — bez skanowania, bez próbowania,
    bez zostawiania śladu. Jest to praca, którą napastnik zwykle musi
    wykonać sam i która go kosztuje czas oraz ryzyko wykrycia.

    Wyłączenie tego składnika zamyka kanał na zewnątrz. Nie zamyka wglądu
    administratora we własną maszynę — spis zainstalowanego oprogramowania
    da się zawsze odczytać na miejscu, i tak właśnie robi to etap audytu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową listę
    wersji oprogramowania tej maszyny, zbieraną i wysyłaną bez jego udziału.
  en: |
    The setting switches off the component gathering an inventory of the software installed on the
    machine and sending it outward.

    The difference from the item before matters and is worth naming. That one concerned started
    programs; this one concerns installed ones. The inventory of the installed is besides the fuller,
    taking in also what nobody has started for years.

    The threat lies in that inventory being no list of names but a list of versions. A list of versions
    set against a public register of vulnerabilities answers the question where to get in - with no
    scanning, no trying and no trace left. It is work an attacker as a rule has to do themselves and
    which costs them time and the risk of being found.

    Switching that component off shuts the channel outward. It does not shut an administrator's view of
    their own machine - an inventory of installed software can always be read on the spot, and that is
    just what the audit stage does.

    What an attacker gains while the item goes unmet: a ready list of this machine's software versions,
    gathered and sent without their taking part.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Składnik ten nie służy maszynie, na której działa. Jego wyłączenie nie
    zmienia zachowania żadnego programu ani sposobu instalowania
    czegokolwiek.

    Pytanie warte zadania jest to samo co przy punkcie poprzednim: czy
    planowana jest analiza zgodności przed zmianą wersji systemu. Narzędzia
    takiej analizy korzystają ze spisu zbieranego właśnie tym składnikiem.

    Warto przy tym powiedzieć, czego ten punkt nie zabiera, bo nazwa
    sugeruje więcej, niż ustawienie robi. Nie zabiera możliwości odczytania
    listy zainstalowanego oprogramowania — ta jest dostępna zawsze, lokalnie,
    i nie zależy od tego składnika. Zabiera wyłącznie automatyczne wysyłanie
    tej listy.

    Nie wiąże się z tym restart ani zatrzymanie usługi.

    Czego to nie psuje: instalowania i odinstalowywania programów,
    uruchamiania ich, usług, sieci, aktualizacji, odczytu listy
    oprogramowania na miejscu. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    That component does not serve the machine it works on. Switching it off changes the behaviour of no
    program and no manner of installing anything.

    The question worth asking is the same as at the item before: whether an analysis of compatibility
    before a change of the system's version is planned. Tools of such an analysis use the inventory
    gathered by just that component.

    It is worth saying besides what this item does not take away, the name suggesting more than the
    setting does. It does not take away the possibility of reading the list of installed software - that
    is always to be had, locally, and does not hang on this component. It takes away solely the
    automatic sending of that list.

    No restart or stopping of a service goes with it.

    What this does not break: the installing and uninstalling of programs, their starting, services, the
    network, updates, or the reading of the software list on the spot. There are no known regressions.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia analizy zgodności używane przy migracjach tracą źródło spisu zainstalowanego oprogramowania
      - Odczyt listy zainstalowanych programów na miejscu pozostaje możliwy i nie zależy od tego składnika
      - Instalowanie, odinstalowywanie i uruchamianie programów pozostaje bez zmian
      - Usługi, sieć i aktualizacje pozostają bez zmian
    en:
      - Tools of compatibility analysis used at migrations lose their source for the inventory of installed software
      - Reading the list of installed programs on the spot stays possible and does not hang on this component
      - The installing, uninstalling and starting of programs stay unchanged
      - Services, the network and updates stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie planowana jest analiza zgodności przed zmianą wersji systemu i korzysta ona ze spisu zbieranego tym składnikiem
    en:
      - An analysis of compatibility before a change of the system's version is planned on this machine and it uses the inventory gathered by this component
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'DisableInventory'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'DisableInventory'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The inventory is not a list of programs but a list of versions, and a list
    # of versions set against a public register of vulnerabilities answers the
    # question of where to get in - with no scanning and no trace. What is closed
    # is the channel outwards, not an administrator's view of the machine.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableInventory' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/planning/compatibility-administrator-users-guide

notes:
  pl: |
    Punkt jest czwarty w bloku i najlepiej ze wszystkich pokazuje, dlaczego
    ten blok w ogóle istnieje. Wysyłany spis wersji jest gotową odpowiedzią
    na pytanie, które napastnik musiałby sobie zadać sam — i za odpowiedź na
    które musiałby zapłacić skanowaniem, a więc czasem i ryzykiem wykrycia.

    Argument ten warto stawiać wprost, bo bez niego reguła wygląda na
    punkt o prywatności, a kategoria średnia przy zerowym koszcie wygląda
    wtedy na przesadę. Nie jest przesadą: przedmiotem jest zdjęcie
    z napastnika pracy rozpoznawczej.

    Warto też, żeby aplikacja rozdzieliła dwie rzeczy, które nazwa łączy:
    zbieranie spisu na własny użytek i wysyłanie go na zewnątrz. Punkt
    dotyczy drugiej. Etap audytu tej aplikacji sam inwentaryzuje
    zainstalowane oprogramowanie — lokalnie, bez wysyłania czegokolwiek —
    i warto to zestawienie pokazać, bo odpowiada na obawę, którą użytkownik
    przy tym punkcie zwykle ma.

    Odnotowuję, że ten punkt i poprzedni leżą w tej samej gałęzi rejestru,
    ale opisują dwa różne mechanizmy o różnym zasięgu. Wdrożenie jednego bez
    drugiego zostawia połowę kanału otwartą.
  en: |
    The item is the fourth in the block and shows best of all why this block exists at all. A sent
    inventory of versions is a ready answer to a question an attacker would have to put to themselves -
    and for an answer to which they would have to pay in scanning, which is to say in time and the risk
    of being found.

    That argument is worth putting outright, without it the rule looking like an item about privacy, and
    a medium category at nil cost looking then like an overstatement. It is none: the subject is the
    taking of reconnaissance work off an attacker.

    It is well too that the application part two things the name joins: the gathering of an inventory for
    one's own use and the sending of it outward. The item concerns the second. This application's audit
    stage itself inventories the installed software - locally, sending nothing - and that juxtaposition
    is worth showing, answering as it does the misgiving the user usually has at this item.

    Worth noting that this item and the one before lie in the same branch of the registry but describe
    two different mechanisms of different reach. Rolling one out without the other leaves half the
    channel open.
