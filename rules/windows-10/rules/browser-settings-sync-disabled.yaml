id: win10-browser-settings-sync-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Sync your settings
  title:
    pl: Synchronizowanie ustawień przeglądarki wyłączone
    en: Synchronising the browser s settings switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Przeglądarka przechowuje hasła do usług, ciasteczka sesji i historię odwiedzin.
    Synchronizacja przenosi to wszystko na każdą maszynę, na której ktoś zaloguje
    się tym samym kontem — w tym na sprzęt prywatny i na maszynę, której
    organizacja nie utrzymuje.

    Hasła zapisane w przeglądarce są w praktyce zbiorem poświadczeń do systemów
    używanych w pracy. Przeniesienie ich na sprzęt spoza kontroli organizacji jest
    wyniesieniem tego zbioru poza jej granice, wykonanym przez sam system i bez
    żadnej decyzji.

    Wyłączenie synchronizacji przeglądarki zostawia ten zbiór na maszynie, na
    której powstał.
  en: |
    A browser holds passwords to services, session cookies and the history of
    visits. Synchronisation carries all of that onto every machine somebody signs
    in to with the same account - private hardware and machines the organisation
    does not maintain included.

    Passwords saved in a browser are in practice a set of credentials to the
    systems used at work. Moving them onto hardware outside the organisation s
    control carries that set past its boundary, done by the system itself and with
    no decision at all.

    Switching browser synchronisation off leaves that set on the machine it came
    into being on.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo trafia w nawyk, na którym wielu ludzi opiera
    codzienną pracę: hasła i zakładki pojawiające się same wszędzie tam, gdzie
    się zalogują.

    Wdrożenie bez zamiennika kończy się tym, że ludzie zaczynają zapisywać hasła
    gdzie indziej — w pliku, w notatce, na kartce. Jest to stan gorszy niż ten
    wyjściowy, więc menedżer haseł powinien stać, zanim ta zasada wejdzie.

    Osobno rozstrzyga się, czy odebrać użytkownikowi możliwość włączenia
    synchronizacji z powrotem. Bez tego zasada jest sugestią.
  en: |
    The change calls for a review, because it strikes at a habit many people base
    their daily work on - passwords and bookmarks appearing by themselves wherever
    they sign in.

    Rolling it out with no replacement ends with people starting to keep passwords
    elsewhere - in a file, in a note, on a slip of paper. That is a worse state
    than the one it started from, so a password manager should be in place before
    this rule comes in.

    Whether to take away the user s ability to switch synchronisation back on is
    settled separately. Without that the rule is a suggestion.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Hasła zapisane w przeglądarce przestaną pojawiać się na kolejnych maszynach po zalogowaniu tym samym kontem
      - Zakładki, historia i otwarte karty nie przeniosą się między sprzętem służbowym a prywatnym
      - Bez wdrożonego menedżera haseł ludzie zaczną zapisywać hasła w plikach i notatkach
      - Użytkownik nie włączy synchronizacji z powrotem, jeżeli wdrożono też odebranie mu tego wyboru
      - Przeglądanie stron, logowanie do usług, hasła zapisane lokalnie i praca użytkownika pozostają bez zmian
    en:
      - Passwords saved in the browser stop appearing on further machines after signing in with the same account
      - Bookmarks, history and open tabs do not carry between work and private hardware
      - With no password manager in place people start keeping passwords in files and notes
      - The user cannot switch synchronisation back on, where taking that choice away was rolled out too
      - Browsing pages, signing in to services, passwords saved locally and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Środowiska bez wdrożonego menedżera haseł, gdzie synchronizacja przeglądarki pełni tę rolę
      - Stanowiska używane naprzemiennie przez tę samą osobę na kilku maszynach w ciągu dnia
    en:
      - Environments with no password manager in place, where browser synchronisation fills that role
      - Stations used in turn by the same person across several machines in a day
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch itself and the entry taking the
      # choice away from the user.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DisableWebBrowserSettingSync'
        $override = $item.'DisableWebBrowserSettingSyncUserOverride'
        if ($null -eq $switch -or $null -eq $override) { 'MISSING' }
        elseif ([int]$switch -ne 2) { 'NOT_BLOCKED' }
        elseif ([int]$override -ne 1) { 'USER_CAN_OVERRIDE' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path             = $path
      switch           = $item.'DisableWebBrowserSettingSync'
      switch_existed   = ($null -ne $item.'DisableWebBrowserSettingSync')
      override         = $item.'DisableWebBrowserSettingSyncUserOverride'
      override_existed = ($null -ne $item.'DisableWebBrowserSettingSyncUserOverride')
      key_existed      = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSync' -Value 2 -Type DWord
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSyncUserOverride' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSync' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSync' -ErrorAction SilentlyContinue
    }
    if ($b.override_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSyncUserOverride' -Value $b.override -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSyncUserOverride' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt niosą dwie wartości: wyłącznik i wpis odbierający wybór użytkownikowi.
    Zasada dotyczy mechanizmu systemowego — przeglądarka z własnym kontem i własną
    synchronizacją tego ustawienia nie widzi i wymaga osobnego rozstrzygnięcia po
    stronie tego programu.
  en: |
    Two values carry this item - the switch and the entry taking the choice away
    from the user. The rule covers the system mechanism - a browser with an
    account and a synchronisation of its own does not see this setting and calls
    for a separate settlement on the side of that program.
