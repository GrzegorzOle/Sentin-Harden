id: win10-bitlocker-removable-drives-encryption-control

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zakładanie ochrony nośnika wymiennego dozwolone, zdejmowanie zabronione
    en: Setting up protection of removable media allowed, removing it forbidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala użytkownikowi założyć ochronę na nośniku wymiennym
    i zarazem zabrania mu ją zdjąć.

    Jest to rozdzielenie dwóch uprawnień, które w domyślnym układzie idą
    razem. Kto może zaszyfrować pamięć przenośną, ten zwykle może też ją
    odszyfrować — i właśnie ta druga możliwość znosi wartość pierwszej.
    Nośnik da się bowiem przygotować do wyniesienia przez zdjęcie ochrony,
    i jest to czynność jednego kliknięcia.

    Zabranie prawa do zdejmowania czyni ochronę jednokierunkową. Raz
    założona zostaje, a nośnik przestaje dać się wyczyścić z ochrony na
    tej maszynie. Kto chce dane wynieść bez szyfrowania, musi wyjść poza
    maszynę objętą zasadą — czyli wykonać czynność, której nie da się
    pomylić z przypadkiem.

    Odnotowuję pozostawione prawo do zakładania ochrony. Jest tu celowe:
    zasada ma ułatwiać szyfrowanie, a nie centralizować je. Użytkownik,
    który sam zaszyfruje nośnik przed wyniesieniem, robi dokładnie to,
    o co chodzi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nośnik,
    z którego ochronę można zdjąć jednym kliknięciem przed wyniesieniem.
  en: |
    The setting leaves the user free to lay the guarding upon a removable medium and forbids them at the same time
    to take it off.

    It is a parting of two rights that in the default arrangement go together. Whoever may encipher a travelling
    memory commonly may unencipher it too - and it is that second chance that undoes the worth of the first. A
    medium may then be made ready for carrying out by the taking off of the guarding, and that is a doing of one
    click.

    The taking away of the right to remove makes the guarding one-way. Once laid it stays, and the medium ceases
    to let itself be cleared of the guarding upon that machine. Whoever would carry data out unenciphered has to
    step outside the machine the policy takes in - which is to say to do something nobody could mistake for chance.

    I set down the right to lay the guarding on, which is left standing. It is meant so: the policy is to make
    enciphering easier and not to gather it into one hand. A user who enciphers a medium themselves before
    carrying it out does just what is wanted.

    What an attacker gains while the item goes unmet: a medium whose guarding may be taken off by one click before
    it is carried out.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś w organizacji zdejmuje ochronę z nośników w ramach normalnej pracy.

    Przypadek najczęstszy to nośnik przekazywany dalej: pamięć, która
    krążyła wewnątrz zaszyfrowana, a teraz ma trafić do kogoś z zewnątrz.
    Dotychczas rozwiązywano to zdjęciem ochrony; po zmianie trzeba
    przygotować nośnik osobny.

    Drugi przypadek to nośnik wypożyczony albo zwracany. Pamięć
    zaszyfrowana na tej maszynie wróci zaszyfrowana i właściciel nie
    otworzy jej bez klucza. Jest to skutek, który warto przewidzieć,
    zwłaszcza przy sprzęcie serwisowym i kartach urządzeń pomiarowych.

    Odnotowuję, że sama zmiana nie szyfruje niczego. Nośniki dotychczas
    niezaszyfrowane pozostają niezaszyfrowane i pozostają w pełni
    użyteczne. Zmienia się wyłącznie to, co wolno zrobić z ochroną już
    założoną.

    Odnotowuję też, że zdjęcie ochrony pozostaje możliwe na maszynie
    nieobjętej zasadą. Nie jest to obejście w sensie złamania czegokolwiek
    — to jest granica zasięgu tej reguły i warto o niej wiedzieć.

    Czego to nie psuje: zapisu na nośnikach niezaszyfrowanych, odczytu,
    pracy na dyskach stałych, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody in the body takes the guarding
    off media in the ordinary course of work.

    The commonest case is a medium handed onward: a memory that went about within enciphered and is now to reach
    somebody outside. Until now that was settled by the taking off of the guarding; after the change a medium
    apart has to be made ready.

    The second case is a medium borrowed or given back. A memory enciphered upon this machine will come back
    enciphered and its owner will not open it without a key. It is a consequence worth foreseeing, above all with
    the gear of a workshop and the cards of measuring apparatus.

    I set down that the change enciphers nothing of itself. Media until now unenciphered stay unenciphered and
    stay wholly of use. What changes is only what may be done with a guarding already laid on.

    I set down likewise that the taking off of the guarding stays possible upon a machine the policy does not take
    in. It is no going round in the sense of breaking anything - it is the bound of this rule's reach, and worth
    knowing of.

    What this does not break: writing to unenciphered media, reading, work upon fixed drives, logging on, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nośnik krążący wewnątrz zaszyfrowany nie da się przygotować dla odbiorcy z zewnątrz przez zdjęcie ochrony
      - Pamięć wypożyczona albo zwracana wróci zaszyfrowana i właściciel nie otworzy jej bez klucza
      - Dotyczy to zwłaszcza sprzętu serwisowego i kart urządzeń pomiarowych
      - Zdjęcie ochrony pozostaje możliwe na maszynie nieobjętej zasadą, co wyznacza zasięg reguły
      - Zapis na nośnikach niezaszyfrowanych, odczyt, praca na dyskach stałych i drukowanie pozostają bez zmian
    en:
      - A medium going about within enciphered cannot be made ready for a receiver outside by the taking off of the guarding
      - A memory borrowed or given back will come back enciphered and its owner will not open it without a key
      - That touches above all the gear of a workshop and the cards of measuring apparatus
      - The taking off of the guarding stays possible upon a machine the policy does not take in, which marks the rule s reach
      - Writing to unenciphered media, reading, work upon fixed drives and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki są szyfrowane doraźnie i odszyfrowywane przed przekazaniem dalej w ramach normalnej pracy
    en:
      - The media are enciphered as need arises and unenciphered before being handed onward in the ordinary course of work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item: the policy itself, leave to set the guarding
      # up and leave to take it off. Anything other than may set up, may not remove
      # is reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $configure = $item.'RDVConfigureBDE'
        $allow = $item.'RDVAllowBDE'
        $disable = $item.'RDVDisableBDE'
        if ($null -eq $configure -or $null -eq $allow -or $null -eq $disable) { 'MISSING' }
        elseif ([int]$configure -ne 1) { 'NOT_CONFIGURED' }
        elseif ([int]$allow -ne 1) { 'SETUP_BLOCKED' }
        elseif ([int]$disable -ne 0) { 'REMOVAL_ALLOWED' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      configure         = $item.'RDVConfigureBDE'
      configure_existed = ($null -ne $item.'RDVConfigureBDE')
      allow             = $item.'RDVAllowBDE'
      allow_existed     = ($null -ne $item.'RDVAllowBDE')
      disable           = $item.'RDVDisableBDE'
      disable_existed   = ($null -ne $item.'RDVDisableBDE')
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Three values go in together. The first turns the policy on, the second leaves
    # the setting up of the guarding open, the third shuts the taking of it off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVConfigureBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVAllowBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVDisableBDE' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.configure_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -Value $b.configure -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -ErrorAction SilentlyContinue
    }
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -ErrorAction SilentlyContinue
    }
    if ($b.disable_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -Value $b.disable -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w tej rodzinie jedyną, która czegoś wyraźnie nie zabrania.
    Zostawia użytkownikowi prawo do założenia ochrony i warto, żeby
    aplikacja to podkreśliła, bo zmienia wydźwięk całego bloku.

    Argument wart zachowania dotyczy tego, dlaczego dwa uprawnienia trzeba
    rozdzielić. Ochrona, którą wolno zdjąć jednym kliknięciem, nie jest
    ochroną nośnika — jest ustawieniem domyślnym, które znika w chwili,
    w której zaczyna przeszkadzać. A przeszkadza dokładnie wtedy, kiedy
    nośnik ma wyjść na zewnątrz, czyli wtedy, kiedy jest najbardziej
    potrzebna.

    Odnotowuję granicę zasięgu, bo bywa przemilczana. Zasada obowiązuje na
    maszynach, które ją mają; nośnik podłączony do komputera domowego
    da się odszyfrować bez przeszkód. Reguła podnosi koszt wyniesienia
    danych, a nie czyni go niemożliwym, i aplikacja powinna mówić to
    wprost.
  en: |
    The rule is the only one of this family that plainly forbids nothing. It leaves the user the right to lay the
    guarding on, and it is well that the application stress it, that changing the ring of the whole block.

    The argument worth keeping touches why the two rights have to be parted. A guarding that may be taken off by
    one click is no guarding of a medium - it is a default setting that goes at the hour it begins to get in the
    way. And it gets in the way just when the medium is to go outside, which is to say just when it is needed
    most.

    I set down the bound of the reach, it being at times passed over in silence. The policy holds upon machines
    that have it; a medium plugged into a home computer may be unenciphered with no hindrance. The rule raises the
    cost of carrying data out and does not make it impossible, and the application ought to say so outright.
