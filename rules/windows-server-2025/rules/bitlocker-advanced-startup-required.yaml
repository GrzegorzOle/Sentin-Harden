id: win2025-bitlocker-advanced-startup-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Dodatkowe uwierzytelnienie przy starcie dysku systemowego wymagane
    en: Additional authentication at startup of the system drive required
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby odblokowanie dysku systemowego nie odbywało się
    wyłącznie na podstawie modułu sprzętowego — potrzebny jest jeszcze kod
    wpisany przy starcie albo klucz na nośniku. Druga wartość pilnuje,
    żeby nie dopuścić szyfrowania na maszynie bez modułu, bo wtedy
    wymaganie stałoby się puste.

    Zostawiam kategorię wysoką i chcę nazwać, co ten punkt naprawdę
    zamyka, bo bez tego wygląda na nadgorliwość. Sam moduł sprzętowy
    odblokowuje dysk, gdy rozruch przebiegł zgodnie z zapamiętanym
    wzorcem. Nie pyta, kto włączył maszynę. Dysk chroniony wyłącznie
    modułem odblokowuje się więc sam — również wtedy, gdy maszynę włączył
    ktoś, kto właśnie wyniósł ją z pomieszczenia, i również wtedy, gdy
    ktoś podłączył ją w swoim laboratorium do analizy.

    Na serwerze chcę tę wartość uczciwie ograniczyć. Serwer nie jest
    wynoszony jako całość, a scenariusz, o którym mowa, wymaga, żeby
    napastnik zabrał maszynę razem z płytą główną. To zdarza się rzadziej
    niż scenariusz z sąsiedniego punktu, czyli wyjazd samego dysku na
    gwarancję. Punkt nadal ma sens, ale jego waga na serwerze bierze się
    z czego innego niż na laptopie — z tego, że maszyna stoi w cudzej
    serwerowni albo w oddziale bez kontroli dostępu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę,
    która sama odda mu zawartość zaszyfrowanego dysku, jeżeli zdoła ją
    zabrać w całości i po prostu włączyć.
  en: |
    The item requires that unlocking the system drive not rest on the
    hardware module alone - a code typed at startup or a key on a medium is
    needed as well. The second value ensures that encryption is not
    permitted on a machine without a module, because the requirement would
    then be hollow.

    I keep the category high, and I want to name what this item actually
    closes, because without that it looks like over-zealousness. The
    hardware module on its own unlocks the drive when the boot matched the
    remembered pattern. It does not ask who switched the machine on. A
    drive protected by the module alone therefore unlocks itself - also
    when the machine was switched on by somebody who has just carried it
    out of the room, and also when somebody has connected it in their own
    laboratory for analysis.

    On a server I want to limit that value honestly. A server is not
    carried off whole, and the scenario in question requires the attacker
    to take the machine together with its mainboard. That happens less
    often than the scenario in the neighbouring item, namely a single disk
    leaving under warranty. The item still makes sense, but its weight on a
    server comes from something other than on a laptop: from the machine
    standing in somebody else's data centre, or in a branch office with no
    access control.

    What an attacker gains while the item goes unmet: a machine that will
    hand over the contents of its encrypted drive by itself, if they manage
    to take it whole and simply switch it on.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę powiedzieć rzecz,
    której w benchmarku nie ma, a która na serwerze jest najważniejsza
    w całej tej grupie: ten punkt stoi w sprzeczności ze sposobem, w jaki
    serwery są eksploatowane.

    Kod wpisywany przy starcie znaczy, że przy każdym uruchomieniu maszyny
    ktoś musi być przy konsoli. Nie przy zalogowaniu — przy starcie, zanim
    system istnieje, więc ani zdalny pulpit, ani sesja powłoki nie
    pomogą. Tymczasem serwer restartuje się sam: po aktualizacjach, po
    zaniku zasilania, po decyzji klastra o przeniesieniu roli. Wymuszenie
    tego punktu zamienia każdy taki restart w czynność ręczną, wykonywaną
    przez człowieka, który musi być dostępny o trzeciej w nocy i mieć
    działającą drogę do konsoli zarządzania.

    Alternatywą jest klucz na nośniku, ale nośnik zostawiony na stałe
    w porcie maszyny, żeby ta mogła wstać bez człowieka, przestaje być
    drugim czynnikiem i staje się dekoracją. Uważam, że warto to nazwać,
    zamiast pozwolić, by rozwiązanie pozorne przeszło jako wdrożenie.

    Wniosek jest taki, że na wielu serwerach właściwym wynikiem pracy z tą
    regułą jest zapisany wyjątek z uzasadnieniem: maszyna restartuje się
    bez obsługi i tak ma być, a ryzyko wyniesienia całej maszyny jest
    pokryte kontrolą dostępu do pomieszczenia. To jest decyzja, nie
    zaniedbanie — i dokładnie po to aplikacja pozwala ją zapisać.

    Tam, gdzie punkt się wdraża — maszyny w oddziałach, w cudzych
    serwerowniach, przy braku kontroli dostępu — obowiązuje warunek
    twardy: droga do konsoli zarządzania musi być sprawdzona przez
    faktyczne zalogowanie przed zmianą, bo po zmianie maszyna bez niej nie
    wstanie.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I keep the class "needs a planned rollout" and want to say something
    the benchmark does not, and which on a server is the most important
    thing in this whole group: this item conflicts with the way servers are
    operated.

    A code typed at startup means somebody has to be at the console at
    every start of the machine. Not at sign-in - at startup, before the
    system exists, so neither remote desktop nor a shell session helps.
    Meanwhile a server restarts by itself: after updates, after a power
    event, after a cluster decides to move a role. Enforcing this item
    turns every such restart into a manual operation performed by a person
    who has to be available at three in the morning and have a working
    route to the management console.

    The alternative is a key on a medium, but a medium left permanently in
    the machine's port so that it can come up without a person stops being
    a second factor and becomes decoration. I think that is worth naming
    rather than letting an apparent solution pass as a rollout.

    The conclusion is that on many servers the right result of working with
    this rule is a recorded exception with a justification: the machine
    restarts unattended and is meant to, and the risk of the whole machine
    being carried off is covered by access control to the room. That is a
    decision, not negligence - and it is exactly why the application lets
    it be recorded.

    Where the item is rolled out - machines in branch offices, in somebody
    else's data centre, without access control - one condition is hard: the
    route to the management console must be verified by actually signing in
    before the change, because after the change the machine will not come
    up without it.

    The change binds after a restart and is undone after another one.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - remote-management
  what_breaks:
    pl:
      - Przy każdym uruchomieniu maszyny ktoś musi być przy konsoli, zanim system istnieje
      - Restart po aktualizacji, po zaniku zasilania i po decyzji klastra przestaje być czynnością bezobsługową
      - Ani zdalny pulpit, ani sesja powłoki nie pomagają, bo na tym etapie jeszcze nie działają
      - Nośnik z kluczem zostawiony na stałe w porcie maszyny przestaje być drugim czynnikiem
      - Maszyna bez działającej drogi do konsoli zarządzania po tej zmianie nie wstanie samodzielnie
    en:
      - At every start of the machine somebody has to be at the console, before the system exists
      - A restart after an update, after a power event or after a cluster decision stops being unattended
      - Neither remote desktop nor a shell session helps, because at that stage neither is running yet
      - A key medium left permanently in the machine's port stops being a second factor
      - After this change a machine without a working route to the management console will not come up on its own
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer restartuje się bez obsługi po aktualizacjach albo w ramach klastra i tak ma pozostać
      - Nie ma sprawdzonej przez faktyczne zalogowanie drogi do konsoli zarządzania tej maszyny
      - Ryzyko wyniesienia całej maszyny jest już pokryte kontrolą dostępu do pomieszczenia
      - Wdrożenie miałoby polegać na pozostawieniu nośnika z kluczem na stałe w porcie maszyny
    en:
      - The server restarts unattended after updates or as part of a cluster and is meant to stay that way
      - There is no route to this machine's management console verified by actually signing in
      - The risk of the whole machine being carried off is already covered by access control to the room
      - The rollout would amount to leaving a key medium permanently in the machine's port
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first requires the additional
      # authentication; the second must stay at zero, otherwise encryption
      # without the hardware module is admitted and the requirement is hollow.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $advanced = $item.'UseAdvancedStartup'
        $noTpm = $item.'EnableBDEWithNoTPM'
        if ($null -eq $advanced) { 'MISSING' }
        elseif ([int]$advanced -ne 1) { 'NOT_REQUIRED' }
        elseif ($null -ne $noTpm -and [int]$noTpm -eq 1) { 'WITHOUT_MODULE_ALLOWED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      advanced          = $item.'UseAdvancedStartup'
      advanced_existed  = ($null -ne $item.'UseAdvancedStartup')
      no_tpm            = $item.'EnableBDEWithNoTPM'
      no_tpm_existed    = ($null -ne $item.'EnableBDEWithNoTPM')
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # After this the machine no longer starts unattended: somebody has to be at
    # the console at every boot, before the system exists. Verify the route to
    # the management console by actually signing in first. On a server that
    # restarts by itself after updates, the right answer is often a recorded
    # exception instead of this change.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseAdvancedStartup' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'EnableBDEWithNoTPM' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.advanced_existed) {
      Set-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -Value $b.advanced -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -ErrorAction SilentlyContinue
    }
    if ($b.no_tpm_existed) {
      Set-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -Value $b.no_tpm -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Najważniejsza rzecz w tej grupie, a nie ma jej w benchmarku: ten punkt
    stoi w sprzeczności ze sposobem eksploatacji serwerów. Kod przy
    starcie znaczy, że przy każdym uruchomieniu ktoś musi być przy konsoli,
    zanim system istnieje.

    Nośnik z kluczem zostawiony na stałe w porcie, żeby maszyna wstała bez
    człowieka, przestaje być drugim czynnikiem i staje się dekoracją.

    Na wielu serwerach właściwym wynikiem pracy z tą regułą jest zapisany
    wyjątek z uzasadnieniem, a nie wdrożenie. Tam, gdzie się ją wdraża,
    droga do konsoli zarządzania musi być sprawdzona faktycznym
    zalogowaniem przed zmianą.
  en: |
    The most important thing in this group, and the benchmark does not have
    it: this item conflicts with the way servers are operated. A code at
    startup means somebody has to be at the console at every start, before
    the system exists.

    A key medium left permanently in the port so the machine can come up
    without a person stops being a second factor and becomes decoration.

    On many servers the right result of working with this rule is a
    recorded exception with a justification, not a rollout. Where it is
    rolled out, the route to the management console must be verified by
    actually signing in before the change.
