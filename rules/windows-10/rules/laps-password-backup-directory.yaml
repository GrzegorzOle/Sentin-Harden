id: win10-laps-password-backup-directory

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Miejsce przechowywania hasła lokalnego administratora wskazane
    en: The place of keeping the local administrator password named
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Na większości maszyn konto wbudowanego administratora lokalnego ma to samo
    hasło co na sąsiednich, bo wszystkie powstały z jednego obrazu. Kto zdobędzie
    je na jednej maszynie, wchodzi na wszystkie pozostałe bez żadnego dodatkowego
    wysiłku. To jest najprostsza i wciąż najskuteczniejsza droga rozejścia się
    napastnika po sieci.

    Mechanizm zarządzania tym hasłem losuje je osobno dla każdej maszyny, zmienia
    cyklicznie i odkłada do katalogu, z którego uprawnione osoby mogą je odczytać.
    Wskazanie miejsca przechowywania jest pierwszym krokiem — bez niego cały
    mechanizm pozostaje wyłączony, niezależnie od pozostałych ustawień.

    Zdejmowane ryzyko jest konkretne: jedno zdobyte hasło przestaje otwierać
    wszystko. Napastnik dostaje jedną maszynę zamiast całej sieci.
  en: |
    On most machines the built-in local administrator account carries the same
    password as on its neighbours, because they all came from one image. Whoever
    obtains it on one machine walks into every other with no further effort. That
    is the simplest and still the most effective way for an attacker to spread
    through a network.

    The mechanism that manages this password picks it separately for each machine,
    changes it on a cycle and files it in a directory where authorised people can
    read it. Naming the place of keeping is the first step - without it the whole
    mechanism stays off, whatever the other settings say.

    The risk taken away is concrete. One captured password stops opening
    everything; the attacker gets one machine instead of the whole network.

disruption_description:
  pl: |
    To nie jest ustawienie, które włącza się pojedynczo na maszynie. Po jego
    wdrożeniu hasło lokalnego administratora przestaje być tym, które ktoś zna
    z pamięci, a staje się ciągiem znaków odczytywanym z katalogu. Cała obsługa
    awaryjna musi wiedzieć, skąd je brać.

    Warunki wstępne są twarde: katalog musi mieć przygotowany schemat, uprawnienia
    do odczytu hasła muszą być nadane, a osoby wykonujące naprawy muszą mieć do
    niego dostęp. Wdrożone bez tego odcina dostęp do maszyny w dniu, w którym
    będzie on najpilniej potrzebny.
  en: |
    This is not a setting switched on machine by machine. Once deployed, the local
    administrator password stops being the one somebody knows by heart and becomes
    a string read out of a directory. The whole emergency support path has to know
    where to take it from.

    The preconditions are hard. The directory needs its schema prepared, rights to
    read the password have to be granted, and the people doing repairs need access
    to it. Deployed without that, it cuts off access to the machine on the very
    day it is needed most.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Hasło lokalnego administratora znane z pamięci przestanie działać po pierwszej zmianie i nikt nie zaloguje się nim awaryjnie
      - Skrypty i narzędzia używające wpisanego na stałe hasła administratora lokalnego przestaną się uwierzytelniać
      - Obsługa maszyny bez dostępu do katalogu straci możliwość zalogowania się lokalnie, co przy awarii sieci bywa jedyną drogą
      - Wdrożenie bez przygotowanego katalogu i nadanych uprawnień do odczytu kończy się hasłem, którego nikt nie zna
      - Logowanie kontami domenowymi, konta użytkowników, praca na maszynie i uprawnienia pozostają bez zmian
    en:
      - The local administrator password known by heart stops working after the first change and nobody signs in with it in an emergency
      - Scripts and tools using a hardcoded local administrator password stop authenticating
      - Support without access to the directory loses the ability to sign in locally, which during a network outage is sometimes the only road
      - Deployed without a prepared directory and granted read rights, it ends with a password nobody knows
      - Signing in with domain accounts, user accounts, working on the machine and permissions all stay as they were
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny poza katalogiem sieciowym i poza katalogiem w chmurze, gdzie nie ma dokąd odłożyć hasła
      - Środowiska bez przygotowanego schematu katalogu i bez nadanych uprawnień do odczytu hasła
      - Stanowiska obsługiwane przez osoby bez dostępu do katalogu, dopóki nie zostanie im on nadany
      - Maszyny, na których wbudowane konto administratora jest używane przez skrypty z hasłem wpisanym na stałe
    en:
      - Machines outside the network directory and outside the cloud directory, where there is nowhere to file the password
      - Environments with no directory schema prepared and no read rights granted
      - Stations served by people without access to the directory, until that access is given
      - Machines where the built-in administrator account is used by scripts with a hardcoded password
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # One means the directory in the cloud, two the directory in the network;
      # zero switches the whole mechanism off.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BackupDirectory'
        if ($null -eq $value) { 'MISSING' }
        elseif ($value -eq 1) { 'CLOUD_DIRECTORY' }
        elseif ($value -eq 2) { 'ACTIVE_DIRECTORY' }
        elseif ($value -eq 0) { 'NOT_CONFIGURED' }
        else { 'OTHER ' + [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(CLOUD_DIRECTORY|ACTIVE_DIRECTORY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $name = 'BackupDirectory'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two names the directory in the network. On a machine joined to the
    # cloud directory alone, one is the value to write instead.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BackupDirectory' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-overview

notes:
  pl: |
    Sprawdzenie zwraca nazwę miejsca zamiast liczby, bo dwójka i jedynka znaczą tu
    co innego, a nie mniej i więcej. Dopuszczone są oba katalogi — sieciowy
    i w chmurze — a zero oznacza wyłączony mechanizm i jest zgłaszane osobno.
    Polecenie naprawcze wpisuje dwójkę; na maszynie związanej wyłącznie z
    katalogiem w chmurze trzeba wpisać jedynkę.
  en: |
    The check returns the name of the place rather than a number, because one and
    two mean different things here, not less and more. Both directories are
    allowed - the network one and the cloud one - while zero stands for the
    mechanism being off and is reported apart. The remediation writes two; on a
    machine joined to the cloud directory alone, one is the value to write.
