id: win2025-peer-name-publication-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Publikowanie nazwy maszyny w sieci równorzędnej wyłączone
    en: Publishing the machine's name in peer networking disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę ogłaszającą nazwę tej maszyny w sieci
    równorzędnej, żeby inne węzły mogły ją odnaleźć.

    Zostawiam kategorię niską i chcę wskazać, dlaczego niżej niż przy
    rozpoznawaniu nazw, opisanym osobnym punktem. Jest to dokładnie ten
    sam podział, który poprowadziłem przy wykrywaniu urządzeń w sieci
    lokalnej i ogłaszaniu się jako urządzenie, i sądzę, że wart jest
    zapamiętania jako reguła osądu, nie jako szczegół tych dwóch par.

    Strona pytająca przyjmuje odpowiedź od obcego i coś z nią robi.
    Strona ogłaszająca się tylko mówi, że jest. Pierwsza daje
    napastnikowi wpływ na to, co maszyna zrobi. Druga daje mu wiedzę,
    że maszyna istnieje — i to wszystko.

    Wiedza ta nie jest zupełnie nic warta, bo nazwa serwera bywa
    mówiąca, a ogłoszenie dociera dalej niż jeden segment. Ale jest to
    wiedza, nie wpływ, i dlatego punkt zostaje nisko.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wiedzę,
    że ta maszyna istnieje i jak się nazywa, dostępną poza własnym
    segmentem.
  en: |
    The item switches off the service that calls the name of that machine abroad in the net of equals,
    that other knots may find it.

    I leave the category low and would name why it is lower than at the knowing of names, set forth in
    an item of its own. It is just the same sundering I drew at the finding of devices in the near net
    and at the calling of oneself abroad as a device, and I hold it worth keeping in mind as a rule of
    judging and not as a small thing of those two pairs.

    The side that asks takes an answer off a stranger and does something with it. The side that calls
    itself abroad only says that it is. The first gives an attacker a sway over what the machine will
    do. The second gives them the knowing that the machine is - and that is all.

    That knowing is not worth nothing at all, the name of a server being at times a telling one and
    the calling abroad reaching further than one reach. But it is knowing and not sway, and therefore
    the item stays low.

    What an attacker gains while the item goes unmet - the knowing that that machine is and what it is
    called, to be had beyond their own reach.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i jest to jedyna z czterech
    reguł tej platformy, przy której to robię. Chcę więc powiedzieć,
    czym się różni od pozostałych trzech, bo kryterium jest tu widoczne
    jak rzadko gdzie.

    Przy pozostałych trzech umiem wskazać scenariusz: własna aplikacja
    zbudowana na tej platformie potrzebuje rozpoznawania nazw, grupowania
    i tożsamości, żeby w ogóle działać. Tutaj nie umiem. Ta usługa nie
    jest potrzebna, żeby węzeł korzystał z platformy — jest potrzebna
    tylko po to, żeby inni mogli znaleźć ten węzeł. Aplikacja serwerowa
    zbudowana na tej platformie jest stroną, do której się sięga po
    adresie ustalonym gdzie indziej, a nie stroną, której się szuka
    ogłoszeniem.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt ten nadaje się do
    zastosowania hurtem, a pozostałe trzy punkty tej platformy nie.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease", and it is the one of the four rules of that platform whereat I
    do so. I would therefore say wherein it differs from the other three, the settling mark being here
    seen as seldom anywhere.

    At the other three I can name a happening - an application of one's own built upon that platform
    needs the knowing of names, the grouping and the standing that it may work at all. Here I cannot.
    That service is not needed for a knot to draw upon the platform - it is needed only that others
    may find that knot. An application of a server built upon that platform is the side that is
    reached for by a whereabouts settled elsewhere, and not the side that is sought by a calling
    abroad.

    By the hard rule of the bulk mode this item is fit to be laid on in bulk, and the other three
    items of that platform are not.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Inne węzły przestają odnajdywać tę maszynę przez ogłoszenie nazwy w sieci równorzędnej
      - Węzeł korzystający z platformy działa dalej, bo do tego ta usługa nie jest potrzebna
      - Aplikacja serwerowa na tej platformie jest stroną, do której sięga się po ustalonym adresie
      - Jest to jedyna z czterech usług platformy, przy której nie umiem wskazać scenariusza zależności
    en:
      - Other knots stop finding that machine by the calling abroad of its name in the net of equals
      - A knot drawing upon the platform works on, that service not being needed thereto
      - An application of a server upon that platform is the side reached for by a settled whereabouts
      - It is the one of the four services of the platform whereat I can name no happening of a hanging
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna ma być odnajdywana przez inne węzły przez ogłoszenie nazwy w sieci równorzędnej
    en:
      - The machine is meant to be found by other knots through the calling abroad of its name in the net of equals
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the announcing side only. A node can still use the peer platform
    # without it - the service exists so that others can find this node.
    Stop-Service -Name 'PNRPAutoReg' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPAutoReg' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PNRPAutoReg' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

notes:
  pl: |
    Ten sam podział, co przy wykrywaniu urządzeń w sieci lokalnej
    i ogłaszaniu się jako urządzenie — wart zapamiętania jako reguła
    osądu, nie jako szczegół tych dwóch par. Strona pytająca przyjmuje
    odpowiedź od obcego i coś z nią robi. Strona ogłaszająca się tylko
    mówi, że jest. Pierwsza daje wpływ, druga wiedzę.

    Jedyna z czterech reguł tej platformy z klasą „bez uciążliwości",
    bo jako jedyna nie ma scenariusza zależności: usługa nie jest
    potrzebna, żeby węzeł korzystał z platformy, tylko po to, żeby inni
    mogli ten węzeł znaleźć.
  en: |
    The same sundering as at the finding of devices in the near net and at the calling of oneself
    abroad as a device - worth keeping in mind as a rule of judging and not as a small thing of those
    two pairs. The side that asks takes an answer off a stranger and does something with it. The side
    that calls itself abroad only says that it is. The first gives sway, the second knowing.

    The one of the four rules of that platform with the class "no unease", it being the only one with
    no happening of a hanging - the service is not needed for a knot to draw upon the platform, only
    that others may find that knot.
