id: win11-appx-development-mode-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Tryb deweloperski dla pakietów aplikacji wyłączony
    en: Developer mode for application packages switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera maszynie możliwość uruchamiania i instalowania
    pakietów aplikacji w trybie deweloperskim, czyli bez podpisu.

    Jest to droga o stopień szersza niż instalowanie pakietów podpisanych
    z pominięciem sklepu, i warto tę różnicę zobaczyć wyraźnie. Tamta wymaga
    przynajmniej certyfikatu, któremu maszyna ufa. Ta nie wymaga niczego —
    pakiet niepodpisany, zbudowany przed chwilą, przez kogokolwiek,
    uruchomi się tak samo jak aplikacja ze sklepu.

    Tryb deweloperski powstał do pracy nad aplikacjami i na stanowisku
    programisty jest potrzebny. Na stanowisku, które aplikacji nie tworzy,
    jest wyłącznie otwartą drogą, o której istnieniu nikt nie pamięta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchomienia dowolnego pakietu bez żadnego dowodu pochodzenia. Aplikacja
    uruchomiona tą drogą wygląda w systemie normalnie: ma wpis w menu, ikonę,
    dostęp do danych użytkownika i uprawnienia, o które poprosi. Nic w niej
    nie wskazuje, że nikt jej nie podpisał.

    Włączenie trybu deweloperskiego bywa przy tym skutkiem ubocznym
    instrukcji znalezionej w sieci — „włącz tryb deweloperski, żeby to
    zadziałało" — i zostaje na maszynie na stałe.
  en: |
    The setting takes from the machine the means of running and installing application
    packages in developer mode, that is, without a signature.

    It is a road a degree wider than installing signed packages past the store, and the
    difference is worth seeing clearly. That one takes at least a certificate the machine
    trusts. This one takes nothing - an unsigned package, built a moment ago, by anybody,
    will run just as an application from the store does.

    Developer mode came about for work on applications and at a programmer's station it is
    needed. At a station that makes no applications it is an open road alone, whose
    existence nobody remembers.

    What an attacker gains while the item goes unmet: the means of running any package with
    no proof of origin at all. An application run by that road looks normal in the system:
    it has an entry in the menu, an icon, access to the user's data and the rights it asks
    for. Nothing in it shows that nobody signed it.

    Switching developer mode on is at that sometimes the side effect of an instruction found
    on the network - "switch on developer mode to make this work" - and stays on the
    machine for good.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na stanowisku ktoś tworzy albo testuje
    aplikacje pakietowe — bo tam tryb deweloperski jest narzędziem pracy,
    a nie przeoczeniem.

    Na stanowisku programisty zmiana odcina uruchamianie własnych pakietów
    przed podpisaniem i jest odczuwalna natychmiast. Dla takich stanowisk
    właściwą drogą jest wyjątek świadomie zapisany, a nie rezygnacja z reguły
    na wszystkich maszynach.

    Poza zespołami wytwarzającymi oprogramowanie zmiana jest niewidoczna.
    Aplikacje ze sklepu i programy instalowane zwykłym instalatorem działają
    bez zmiany.

    Sprawdzenia wymaga jeszcze jeden przypadek, łatwy do przeoczenia:
    narzędzia pomocnicze i wewnętrzne dodatki bywają rozprowadzane jako
    pakiety niepodpisane właśnie dlatego, że tryb deweloperski był włączony.
    Po zmianie takie narzędzie przestanie się uruchamiać.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anyone at the station makes or tests packaged
    applications - since there developer mode is a tool of work rather than an oversight.

    At a programmer's station the change cuts off the running of own packages before
    signing and is felt at once. For such stations the right road is a knowingly recorded
    exception rather than giving up the rule on all machines.

    Beyond teams making software the change is invisible. Applications from the store and
    programs installed by an ordinary installer work unchanged.

    One more case needs checking, easily overlooked: helper tools and internal add-ons are
    sometimes distributed as unsigned packages precisely because developer mode was
    switched on. After the change such a tool will stop running.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Uruchamianie i instalowanie pakietów niepodpisanych przestaje być możliwe
      - Narzędzia wewnętrzne rozprowadzane jako pakiety niepodpisane przestają się uruchamiać
      - Praca nad własnymi aplikacjami pakietowymi wymaga wyjątku dla tego stanowiska
      - Aplikacje ze sklepu i programy z instalatora działają bez zmiany
    en:
      - Running and installing unsigned packages stops being possible
      - Internal tools distributed as unsigned packages stop running
      - Work on own packaged applications takes an exception for that station
      - Applications from the store and programs from an installer work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko służy do tworzenia albo testowania aplikacji pakietowych
      - W organizacji działają narzędzia wewnętrzne rozprowadzane jako pakiety niepodpisane
    en:
      - The station serves for making or testing packaged applications
      - Internal tools distributed as unsigned packages work in the organisation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDevelopmentWithoutDevLicense'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $current = (Get-ItemProperty -Path $path -Name 'AllowDevelopmentWithoutDevLicense' -ErrorAction SilentlyContinue).'AllowDevelopmentWithoutDevLicense'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowDevelopmentWithoutDevLicense'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDevelopmentWithoutDevLicense' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/get-started/enable-your-device-for-development

notes:
  pl: |
    Punkt jest mocniejszy niż ten o pakietach podpisanych, choć w benchmarku
    stoi obok niego na tym samym poziomie. Różnica polega na tym, że tam
    wymagany jest podpis, tutaj nie jest wymagane nic.

    Wyjątek dla stanowisk wytwórczych jest właściwym sposobem obsłużenia tej
    reguły. Zapisany w raporcie z uzasadnieniem i datą przeglądu mówi
    dokładnie to, co powinien: że na tych maszynach mechanizm jest potrzebny
    i ktoś o tym wie.

    Wartość leży w kluczu wspólnym z pozostałymi regułami o pakietach
    aplikacji, więc wycofanie jednej nie rusza pozostałych.

    Brak wartości nie jest stanem zgodnym, bo tryb deweloperski daje się
    wtedy włączyć z ustawień systemu.
  en: |
    The item is stronger than the one about signed packages, though in the benchmark it
    stands beside it at the same level. The difference lies in a signature being demanded
    there and nothing being demanded here.

    An exception for stations that make software is the right way of handling this rule.
    Recorded in the report with a ground and a review date, it says exactly what it should:
    that on those machines the mechanism is needed and somebody knows it.

    The value lies in a key shared with the remaining rules about application packages, so
    rolling one back does not disturb the rest.

    A missing value is not a compliant state, since developer mode can then be switched on
    from the system settings.
