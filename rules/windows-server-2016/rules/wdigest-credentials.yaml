id: win2016-wdigest-credentials

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie haseł w pamięci przez mechanizm skrótowy wyłączone
    en: Password caching in memory by the digest mechanism disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania jednemu ze starszych mechanizmów uwierzytelniania
    trzymać w pamięci maszyny hasło zalogowanego konta w postaci, z której
    da się je odczytać.

    Rzecz dotyczy różnicy, którą warto nazwać dokładnie. Wszystkie
    mechanizmy uwierzytelniania trzymają w pamięci coś, co pozwala
    potwierdzić tożsamość bez ponownego pytania o hasło — zwykle jest to
    wynik przekształcenia, z którego hasła nie da się odtworzyć. Ten
    mechanizm trzyma samo hasło, bo jego protokół wymaga go w postaci
    pierwotnej przy każdym użyciu.

    Skutek jest dokładnie taki, jak brzmi. Kto uzyska na maszynie
    uprawnienia wysokie i odczyta pamięć procesu urzędu zabezpieczeń,
    dostaje hasła wszystkich zalogowanych kont — nie skróty do łamania,
    tylko hasła gotowe do wpisania. Narzędzia robiące to są publicznie
    dostępne od dawna i nie wymagają żadnej biegłości.

    Na serwerze znaczy to więcej niż gdzie indziej. Zalogowane bywają tam
    konta usług i konta administracyjne o uprawnieniach domenowych, więc
    jedna przejęta maszyna zamienia się w zestaw haseł do wszystkich
    pozostałych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła
    wszystkich kont zalogowanych na maszynie, w postaci jawnej, natychmiast
    po uzyskaniu na niej uprawnień wysokich.
  en: |
    The setting forbids one of the older authentication mechanisms to keep in the
    machine's memory a signed-in account's password in a form it can be read from.

    The matter concerns a difference worth naming exactly. Every authentication
    mechanism keeps in memory something letting an identity be confirmed without the
    password being asked for again - as a rule the result of a transformation the
    password cannot be recovered from. This mechanism keeps the password itself,
    since its protocol calls for it in its original form at every use.

    The upshot is exactly as it sounds. Whoever gains high privileges on the machine
    and reads the memory of the security authority process gets the passwords of
    every signed-in account - not digests to be broken but passwords ready to be
    typed. The tools doing this have been publicly available for a long time and
    call for no skill at all.

    On a server this means more than elsewhere. Signed in there are at times service
    accounts and administrative accounts with domain privileges, so one taken-over
    machine turns into a set of passwords to all the rest.

    What an attacker gains while the item goes unmet: the passwords of every account
    signed in on the machine, in plain form, the moment they gain high privileges on
    it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to ocena wynikająca z obserwacji, nie
    z ostrożności.

    Mechanizm, którego dotyczy ten punkt, został zaprojektowany do
    uwierzytelniania przeglądarki wobec serwera sieciowego i w tej roli
    zastąpiono go dawno. Nie znaleziono na maszynie serwerowej
    zastosowania, które by go wymagało.

    Warto przy tym wiedzieć, co dokładnie zmiana robi, bo nazwa punktu bywa
    czytana za szeroko. Mechanizm nie zostaje wyłączony — zostaje mu
    odebrane prawo do trzymania hasła w postaci jawnej. Uwierzytelnienie
    nim nadal się powiedzie tam, gdzie hasło zostanie podane na bieżąco.
    Przestanie działać wyłącznie to, co liczyło na pobranie hasła z pamięci
    bez pytania.

    Zastrzeżenie dotyczy wyłącznie oprogramowania bardzo starego,
    uwierzytelniającego się tym protokołem do zasobu sieciowego bez
    interakcji z człowiekiem. Takie przypadki są dziś rzadkie i łatwe do
    rozpoznania, bo dotyczą aplikacji sieciowych sprzed wielu lat.

    Czego to nie psuje: logowania, uwierzytelniania domenowego, dostępu do
    udziałów, usług, pulpitu zdalnego, zadań harmonogramu.

    Bez restartu. Maszyna zapomina zapisane hasła przy następnym logowaniu,
    więc pełny skutek pojawia się po wylogowaniu i zalogowaniu kont.
  en: |
    The class is "none", and that assessment follows from observation rather than
    from caution.

    The mechanism this item concerns was designed to authenticate a browser to a web
    server, and in that role it was replaced long ago. No use calling for it has
    been found on a server machine.

    It is worth knowing what exactly the change does, since the item's name is at
    times read too widely. The mechanism is not switched off - it is deprived of the
    right to keep a password in plain form. Authentication by it will still succeed
    where the password is offered at the time. What will stop working is only what
    counted on fetching the password from memory without asking.

    The reservation concerns software of great age alone, authenticating by this
    protocol to a network resource without a person's part in it. Such cases are
    rare today and easy to recognise, since they concern web applications of many
    years ago.

    What this does not break: signing in, domain authentication, access to shares,
    services, the remote desktop, or scheduled tasks.

    No restart. The machine forgets the stored passwords at the next signing in, so
    the full effect appears once accounts have been signed out and in again.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - legacy-applications
  what_breaks:
    pl:
      - Nie znaleziono na maszynie serwerowej zastosowania wymagającego trzymania hasła w pamięci przez ten mechanizm
      - Bardzo stare oprogramowanie uwierzytelniające się tym protokołem do zasobu sieciowego bez udziału człowieka przestaje pobierać hasło z pamięci
      - Uwierzytelnienie tym mechanizmem nadal się powiedzie tam, gdzie hasło zostanie podane na bieżąco
      - Logowanie, uwierzytelnianie domenowe, dostęp do udziałów, usługi i pulpit zdalny pozostają bez zmian
    en:
      - No use calling for a password to be kept in memory by this mechanism has been found on a server machine
      - Software of great age authenticating by this protocol to a network resource without a person's part in it stops fetching the password from memory
      - Authentication by this mechanism will still succeed where the password is offered at the time
      - Signing in, domain authentication, access to shares, services and the remote desktop stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja sieciowa sprzed wielu lat uwierzytelniająca się tym protokołem bez udziału człowieka
      - Nie da się potwierdzić, czy któreś z zadań automatycznych nie liczy na pobranie hasła z pamięci zamiast na jego podanie
    en:
      - A web application of many years ago authenticating by this protocol without a person's part in it runs on the machine
      - It cannot be confirmed whether some automatic job counts on fetching the password from memory rather than on its being offered
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      $name = 'UseLogonCredential'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|MISSING)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    $name = 'UseLogonCredential'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseLogonCredential' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection

notes:
  pl: |
    Audyt przyjmuje dwa stany jako spełnione: wartość zero oraz brak wpisu.
    Brak wpisu znaczy tu domyślne zachowanie systemu, które na tym wydaniu
    jest już prawidłowe — zgłaszanie go jako niezgodności byłoby fałszywym
    alarmem i zaśmiecałoby raport.

    Punkt trafia w macierzy w pole szybkich wygranych: ryzyko krytyczne,
    koszt zerowy. Takich punktów jest w całym zestawie kilka i to one
    powinny otwierać widok po audycie, bo dają najwięcej za najmniej.

    Reguła jest częścią grupy chroniącej poświadczenia w pamięci maszyny.
    Sama nie wystarcza — zdejmuje postać jawną, ale zostawia to, co można
    wynieść w postaci przekształconej i użyć bez znajomości hasła. Domyka
    ją dopiero ochrona procesu urzędu zabezpieczeń i mechanizm izolujący
    poświadczenia, opisane osobno.
  en: |
    The audit takes two states as satisfied: the value zero and the absence of the
    entry. The absence means here the system's default behaviour, which on this
    release is already correct - reporting it as a non-compliance would be a false
    alarm and would clutter the report.

    In the matrix the item falls in the square of quick wins: critical risk, no
    cost. There are a handful of such items in the whole set and they should open
    the view after an audit, since they give most for least.

    The rule is part of the group guarding credentials in the machine's memory. By
    itself it is not enough - it takes the plain form away but leaves what can be
    carried off in a transformed form and used without knowing the password. Only
    the protection of the security authority process and the mechanism isolating
    credentials, described apart, close it up.
