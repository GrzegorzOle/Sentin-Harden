id: ubuntu2404-sshd-config-access

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.1.1
  section: Access Control > Configure SSH Server
  title:
    pl: Uprawnienia do /etc/ssh/sshd_config są skonfigurowane
    en: Ensure permissions on /etc/ssh/sshd_config are configured
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Plik /etc/ssh/sshd_config i pliki .conf z katalogu /etc/ssh/sshd_config.d
    decydują, kto i jak może się logować przez SSH. Kto może je zmienić,
    może np. dopuścić logowanie roota albo własny klucz, a kto może je
    czytać, poznaje zasady dostępu, które ułatwiają atak.

    Punkt wymaga, żeby te pliki należały do użytkownika i grupy root i miały
    uprawnienia 0600 lub ostrzejsze.
  en: |
    The /etc/ssh/sshd_config file and the .conf files in the
    /etc/ssh/sshd_config.d directory decide who can log in over SSH and how.
    Whoever can change them can, for example, allow root login or their own
    key, and whoever can read them learns access rules that make an attack
    easier.

    The item requires these files to be owned by the root user and group
    and to have the mode 0600 or stricter.

disruption_description:
  pl: |
    Nikt tego nie zauważy: serwer SSH czyta konfigurację jako root. Zwykli
    użytkownicy tracą tylko możliwość jej podglądania.
  en: |
    Nobody will notice: the SSH server reads its configuration as root.
    Regular users only lose the ability to look at it.

implementation_consequences:
  impact_areas:
    - remote-management
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    d=/etc/ssh/sshd_config.d
    # An unreadable directory would hide its files from the check.
    if [ -d "$d" ] && ! { [ -r "$d" ] && [ -x "$d" ]; }; then echo CHECK_ERROR; exit 0; fi
    n=0; bad=""
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      n=$((n + 1))
      set -- $(stat -Lc '%a %u %g %G' "$f")
      ok=0
      if [ "$2" = 0 ]; then
        if [ "$3" = 0 ] && [ $(( 0$1 & 07177 )) -eq 0 ]; then ok=1
        fi
      fi
      [ "$ok" = 1 ] || bad="$bad,$f=$1:$2:$3"
    done <<< "$(for f in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do if [ -f "$f" ]; then echo "$f"; fi; done)"
    if [ "$n" = 0 ]; then echo ABSENT
    elif [ -z "$bad" ]; then echo "RESTRICTED:$n"
    else echo "TOO_OPEN:${bad#,}"; fi
  expected: '^(RESTRICTED:|ABSENT$)'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=access-2
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          echo "$(stat -Lc '%a %u %g' "$f") $(readlink -f "$f")"
        done <<< "$(for f in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do if [ -f "$f" ]; then echo "$f"; fi; done)"
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      n=0
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        tg=$(readlink -f "$f")
        set -- $(stat -c '%a %G' "$tg")
        chown 0:0 "$tg"; m=0600
        # Five digits: with fewer, chmod keeps the setuid and setgid bits of a directory.
        chmod "$(printf '0%04o' $(( 0$1 & m )))" "$tg"
        echo "Set owner root and mode $(stat -c '%a' "$tg") on $tg"
        n=$((n + 1))
      done <<< "$(for f in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do if [ -f "$f" ]; then echo "$f"; fi; done)"
      [ "$n" -gt 0 ] || echo "No files, nothing to change"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=access-2 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      # Every line is checked before anything is restored.
      while read -r mode uid gid f; do
        case "$mode" in ""|*[!0-7]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        case "$uid:$gid" in :*|*:|*[!0-9:]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        case "$f" in /*) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      done < <(tail -n +2 "$b")
      while read -r mode uid gid f; do
        [ -e "$f" ] || { echo "Skipped $f: it no longer exists"; continue; }
        chown "$uid:$gid" "$f"
        chmod "$(printf '0%04o' $(( 0$mode )))" "$f"
        echo "Restored owner and mode of $f"
      done < <(tail -n +2 "$b")
    )

privileges: root
runnable: true

sources:
  - https://man.openbsd.org/sshd_config

notes:
  pl: |
    Sprawdzenie ocenia /etc/ssh/sshd_config i pliki *.conf z katalogu
    /etc/ssh/sshd_config.d, które stockowy sshd_config dołącza dyrektywą
    Include. Wynik RESTRICTED podaje liczbę sprawdzonych plików, a TOO_OPEN
    wymienia pliki z uprawnieniami, właścicielem i grupą. Brak serwera SSH,
    a więc i plików, daje wynik ABSENT, który też jest zgodny. Pliki
    dołączane z innych miejsc własnymi dyrektywami Include nie są
    sprawdzane.

    Ubuntu instaluje /etc/ssh/sshd_config z uprawnieniami 0644, więc na
    świeżym systemie punkt nie jest spełniony. Naprawa ustawia właściciela
    root:root i usuwa nadmiarowe bity uprawnień bez dodawania nowych.
    Wycofanie przywraca poprzedniego właściciela i uprawnienia każdego
    pliku.
  en: |
    The check assesses /etc/ssh/sshd_config and the *.conf files in the
    /etc/ssh/sshd_config.d directory, which the stock sshd_config includes
    with the Include directive. The RESTRICTED result gives the number of
    checked files, and TOO_OPEN lists the files with their mode, owner and
    group. No SSH server, and so no files, gives the ABSENT result, which
    also passes. Files included from other places by custom Include
    directives are not checked.

    Ubuntu installs /etc/ssh/sshd_config with the mode 0644, so a fresh
    system does not meet the item. The remediation sets the owner root:root
    and removes excess mode bits without adding new ones. Rollback restores
    the previous owner and mode of each file.
