id: win11-ssh-server-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera powłoki zdalnej wyłączona
    en: The remote shell server service disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przyjmuje z sieci połączenia do powłoki zdalnej: uwierzytelnia je
    i daje drugiej stronie wiersz poleceń działający na tej maszynie,
    z uprawnieniami konta, którym się przedstawiła.

    Jest to droga wejścia równoważna pulpitowi zdalnemu w skutkach, a w ocenie
    ryzyka bywa traktowana lżej — i to jest właśnie powód, dla którego warto
    o niej powiedzieć osobno. Na stacji roboczej z systemem Windows serwer
    powłoki zdalnej bywa włączony przypadkiem: jest składnikiem opcjonalnym
    systemu, który instaluje się razem z klientem, a część narzędzi
    programistycznych włącza go przy konfiguracji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nasłuch
    przyjmujący próby logowania z sieci, z dostępem do wiersza poleceń po
    udanym uwierzytelnieniu. Nasłuch ten bywa nieobjęty przeglądem — kto szuka
    dróg wejścia na stację roboczą, patrzy na pulpit zdalny i na zdalne
    zarządzanie poleceniami, rzadziej na ten port.

    Osobno liczy się uwierzytelnianie kluczem. Klucz złożony w katalogu
    użytkownika daje wejście bez hasła, nie wygasa i nie podlega zasadom haseł
    ani blokadzie konta. Zostawiony przez kogoś, kto miał dostęp raz, działa
    dalej.
  en: |
    The service takes remote shell connections from the network: it authenticates them
    and gives the other side a command line running on this machine, with the rights of
    the account it presented.

    It is a way in equal to Remote Desktop in its effects, and it is sometimes treated
    more lightly when risk is weighed - and that is exactly why it is worth speaking of
    separately. On a Windows workstation a remote shell server is sometimes on by
    accident: it is an optional component of the system installed together with the
    client, and some programming tools switch it on while being set up.

    What an attacker gains while the item goes unmet: a listener taking sign-in attempts
    from the network, with access to a command line once authentication succeeds. That
    listener is sometimes left out of a review - whoever looks for ways into a
    workstation looks at Remote Desktop and at remote management by commands, less often
    at this port.

    Authentication by key counts separately. A key placed in a user's folder gives entry
    with no password, does not expire and is subject neither to password policy nor to
    account lockout. Left by somebody who had access once, it goes on working.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek łączy się do tej maszyny powłoką
    zdalną — a odpowiedź zależy od tego, czym maszyna jest.

    Na zwykłym stanowisku biurowym usługa zwykle nie powinna w ogóle działać
    i jej wyłączenie nie niesie skutków. Jeżeli działa, warto ustalić dlaczego,
    bo zwykle znaczy to, że została włączona przy instalacji jakiegoś
    narzędzia, a nie świadomie.

    Na stanowisku programisty rzecz wygląda inaczej. Powłoka zdalna bywa tam
    częścią codziennej pracy: uruchamianie zadań na tej maszynie z innego
    komputera, praca zdalna w środowisku programistycznym, przenoszenie plików.
    Wyłączenie usługi przerywa te tory pracy natychmiast.

    Osobno warto sprawdzić narzędzia wdrożeniowe i systemy budowania. Część
    z nich łączy się do maszyn właśnie tą drogą, zwłaszcza tam, gdzie te same
    skrypty obsługują maszyny z różnymi systemami.

    Łączenie się z tej maszyny do innych powłoką zdalną działa dalej bez
    zmiany — punkt dotyczy wyłącznie strony przyjmującej połączenia.

    Zmiana wymaga zatrzymania usługi; sesje otwarte zostaną zerwane.
  en: |
    What needs checking is whether anybody reaches this machine by remote shell - and the
    answer depends on what the machine is.

    At an ordinary office station the service should usually not be running at all and
    disabling it carries no effects. If it is running, it is worth establishing why,
    since it usually means it was switched on while some tool was installed rather than
    deliberately.

    At a programmer's station matters look different. A remote shell is sometimes part of
    daily work there: running tasks on this machine from another computer, working
    remotely in a development environment, moving files. Disabling the service breaks off
    those ways of working at once.

    Deployment tools and build systems are worth checking separately. Some of them reach
    machines by exactly this route, above all where the same scripts serve machines with
    different systems.

    Connecting from this machine to others by remote shell carries on unchanged - the
    item concerns the side taking connections alone.

    The change takes stopping the service; open sessions will be broken off.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna przestaje przyjmować połączenia powłoką zdalną i sesje otwarte zostają zerwane
      - Praca zdalna w środowisku programistycznym prowadzona do tej maszyny przestaje być możliwa
      - Narzędzie wdrożeniowe łączące się tą drogą kończy się błędem połączenia
      - Łączenie się z tej maszyny do innych powłoką zdalną działa dalej bez zmiany
    en:
      - The machine stops taking remote shell connections and open sessions are broken off
      - Remote work in a development environment directed at this machine stops being possible
      - A deployment tool connecting by this route ends in a connection error
      - Connecting from this machine to others by remote shell carries on unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko programisty jest obsługiwane zdalnie powłoką z innego komputera
      - System budowania albo narzędzie wdrożeniowe łączy się do tej maszyny tą drogą
      - Maszyna jest częścią środowiska testowego obsługiwanego wspólnymi skryptami
    en:
      - A programmer's station is worked on remotely by shell from another computer
      - A build system or deployment tool connects to this machine by this route
      - The machine is part of a test environment served by shared scripts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sshd'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sshd'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off any remote shell session open at this
    # moment, including a session this command is being run from.
    Stop-Service -Name 'sshd' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'sshd' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'sshd' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/administration/openssh/openssh_overview

notes:
  pl: |
    Uruchomienie tej reguły przez powłokę zdalną na tej samej maszynie przerywa
    to połączenie. Polecenie wykona się do końca, ale wynik ponownego audytu
    nie wróci. Wdrażać należy z konsoli na miejscu albo inną drogą zdalną.

    Wyłączenie usługi nie usuwa kluczy złożonych w katalogach użytkowników ani
    pliku konfiguracyjnego serwera. Po ponownym włączeniu usługi wszystko to
    działa znów, z tymi samymi uprawnieniami co wcześniej. Jeżeli celem jest
    trwałe zamknięcie tej drogi, właściwym krokiem jest odinstalowanie
    składnika, a nie wyłączenie usługi — reguła tego nie robi i nie udaje,
    że robi.

    Punkt nie dotyczy klienta powłoki zdalnej. Łączenie się z tej maszyny do
    innych działa dalej i obsługuje je osobny składnik.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Na maszynie bez zainstalowanego składnika usługi nie ma
    i audyt zwróci wynik „nie dotyczy".
  en: |
    Running this rule through a remote shell on this same machine breaks that connection
    off. The command will run to the end, but the result of the re-audit will not come
    back. It should be applied from a console in person or by another remote route.

    Disabling the service removes neither the keys placed in users' folders nor the
    server's configuration file. Once the service is switched on again all of it works
    afresh, with the same rights as before. If the aim is to close this route for good,
    the right step is to uninstall the component rather than disable the service - the
    rule does not do this and does not pretend to.

    The item does not concern the remote shell client. Connecting from this machine to
    others carries on working and a separate component handles it.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment. On a machine with the component not installed the service is
    absent and the audit returns "not applicable".
