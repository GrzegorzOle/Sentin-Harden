id: win2025-file-sharing-server-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera udostępniania plików wyłączona
    en: The file sharing server service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę udostępniającą pliki innym maszynom. Usługa ta
    odpowiada na połączenia z sieci i wydaje zawartość udziałów.

    Zostawiam kategorię wysoką. Udostępnianie plików jest tą usługą,
    którą napastnik znajduje najszybciej i wykorzystuje najchętniej:
    do rozpoznania, do rozniesienia plików po sieci, do zaszyfrowania
    zawartości i do wyniesienia danych. Maszyna, która udziałów nie
    wystawia, a usługę ma uruchomioną, oddaje tę powierzchnię za darmo.

    Muszę jednak powiedzieć od razu rzecz, która przy tej regule waży
    więcej niż sam opis ryzyka, bo bez niej ta reguła jest na serwerze
    niebezpieczna.

    Ta usługa nie obsługuje wyłącznie udziałów założonych przez człowieka.
    Obsługuje też udziały administracyjne — a na nich opiera się rzeczy
    znacznie więcej, niż sugeruje nazwa punktu: zdalne zarządzanie,
    agent kopii zapasowych, wdrażanie oprogramowania, narzędzia
    diagnostyczne. Na kontrolerze domeny tą samą drogą wydawane są zasoby,
    z których każda maszyna w domenie pobiera zasady grupy i skrypty
    logowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: usługę
    odpowiadającą na połączenia z sieci i wydającą zawartość, na maszynie,
    która nie ma nic do udostępniania.
  en: |
    The item switches off the service that deals files out to other machines. That service answers
    bindings off the net and gives out what is in the shares.

    I leave the category high. The dealing out of files is that service which an attacker finds the
    soonest and uses the most gladly - for the spying out, for the spreading of files about the net,
    for the locking up of what is there and for the bearing away of data. A machine that sets no
    shares forth and has the service running gives that face away for nothing.

    I must, though, say at once a thing that at this rule weighs more than the setting forth of the
    hazard itself, for without it this rule is upon a server a dangerous one.

    That service handles not only the shares set up by a person. It handles also the shares of ruling
    - and upon those there lean far more things than the item's name would have it - the ruling from
    afar, the agent of keepings of copies, the rolling out of software, the tools for the finding out
    of faults. Upon a warder of the domain there are given out by that same road the holdings
    wherefrom every machine in the domain fetches the policies of its group and the scripts of
    signing in.

    What an attacker gains while the item goes unmet - a service answering bindings off the net and
    giving out what is there, upon a machine that has nothing to deal out.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i uważam, że jest to
    reguła, przy której najłatwiej w całej tej paczce zrobić poważną
    szkodę w przekonaniu, że wyłącza się coś drobnego.

    Powiem to wprost i na początku: na kontrolerze domeny tego punktu nie
    wdrażaj. Zatrzymanie tej usługi odbiera wszystkim maszynom w domenie
    dostęp do zasobów, z których pobierają zasady grupy i skrypty
    logowania. Skutek nie ogranicza się do tej jednej maszyny — obejmuje
    całą domenę i ujawnia się stopniowo, w miarę jak kolejne maszyny
    próbują odświeżyć zasady. Jest to dokładnie ten rodzaj awarii, którego
    przyczyny szuka się najdłużej, bo objaw pojawia się gdzie indziej niż
    zmiana.

    Na serwerze członkowskim skutki są węższe, ale nadal szersze niż
    „przestaną działać udziały". Przestaje działać zdalne zarządzanie
    korzystające z udziałów administracyjnych, agent kopii zapasowych
    sięgający po pliki tą drogą, wdrażanie oprogramowania i część narzędzi
    diagnostycznych. Żadne z nich nie powie, że chodzi o udostępnianie
    plików.

    Zatrzymanie usługi zrywa też połączenia otwarte w tej chwili, w tym
    połączenie narzędzia zarządzającego, którym być może właśnie się
    pracuje.

    Kolejność jest więc taka: ustal, czy maszyna jest kontrolerem domeny
    — jeżeli tak, zapisz wyjątek i zajmij się ograniczeniem dostępu do
    udziałów zamiast wyłączaniem usługi. Jeżeli nie, zbierz listę tego, co
    sięga po udziały administracyjne, i dopiero potem wyłączaj.

    Zmiana cofa się natychmiast i wymaga uruchomienia usługi z powrotem.
  en: |
    I leave the class "needs a witting rolling out" and hold it the rule whereat it is the easiest in
    this whole pack to do a weighty harm in the belief that one is switching off a small thing.

    I shall say it outright and at the beginning - upon a warder of the domain roll this item not
    out. The stopping of that service takes from every machine in the domain the reach to the
    holdings wherefrom they fetch the policies of their group and the scripts of signing in. The
    outcome is not bounded to that one machine - it takes in the whole domain and comes to light by
    degrees, as one machine after another tries to freshen its policies. It is just that kind of
    fault whose ground is sought the longest, the symptom coming forth elsewhere than the change.

    Upon a server that is a member the outcomes are narrower, yet still wider than "the shares will
    stop working". There stops working the ruling from afar that uses the shares of ruling, the agent
    of keepings of copies reaching for files by that road, the rolling out of software and some of
    the tools for the finding out of faults. None of them will say that it is about the dealing out
    of files.

    The stopping of the service breaks off also the bindings open at that hour, among them the
    binding of the tool of ruling one may be working by at that very moment.

    The order is therefore this - settle whether the machine is a warder of the domain; if so, write
    an exception down and take up the bounding of the reach to the shares in place of the switching
    off of the service. If not, gather the list of what reaches for the shares of ruling, and only
    then switch off.

    The change is undone at once and takes the starting of the service again.

implementation_consequences:
  impact_areas:
    - file-sharing
    - remote-management
    - printing
  what_breaks:
    pl:
      - Na kontrolerze domeny wszystkie maszyny tracą dostęp do zasobów z zasadami grupy i skryptami logowania
      - Skutek obejmuje całą domenę i ujawnia się stopniowo, gdy kolejne maszyny próbują odświeżyć zasady
      - Przestaje działać zdalne zarządzanie, agent kopii zapasowych i wdrażanie oprogramowania korzystające z udziałów administracyjnych
      - Żadne z tych narzędzi nie powie, że chodzi o udostępnianie plików
      - Zatrzymanie usługi zrywa połączenia otwarte w tej chwili, w tym połączenie narzędzia zarządzającego
    en:
      - Upon a warder of the domain all the machines lose the reach to the holdings with the policies of their group and the scripts of signing in
      - The outcome takes in the whole domain and comes to light by degrees as one machine after another tries to freshen its policies
      - There stops working the ruling from afar, the agent of keepings of copies and the rolling out of software that use the shares of ruling
      - None of those tools will say that it is about the dealing out of files
      - The stopping of the service breaks off the bindings open at that hour, among them the binding of a tool of ruling
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest kontrolerem domeny i wydaje tą drogą zasady grupy oraz skrypty logowania
      - Maszyna jest serwerem plików i udostępnianie jest jej rolą
      - Nie zebrano listy narzędzi sięgających po udziały administracyjne tej maszyny
    en:
      - The machine is a warder of the domain and gives out by that road the policies of groups and the scripts of signing in
      - The machine is a server of files and the dealing out is its role
      - The list of tools reaching for the shares of ruling of that machine was not gathered
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Do not run this on a domain controller: it serves group policy and logon
    # scripts to every machine in the domain by this same service. Elsewhere it
    # also carries the administrative shares that management, backup and
    # software deployment rely on.
    Stop-Service -Name 'LanmanServer' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'LanmanServer' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'LanmanServer' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/file-server-smb-overview

