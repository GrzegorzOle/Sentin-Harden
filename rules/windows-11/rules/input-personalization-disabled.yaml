id: win11-input-personalization-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Regional and Language Options
  title:
    pl: Zbieranie danych o wprowadzaniu tekstu wyłączone
    en: Collection of data about text input turned off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    System potrafi uczyć się sposobu, w jaki na danej maszynie wprowadza się
    tekst: zbiera słowa pisane z klawiatury, rozpoznane z mowy i z pisma
    odręcznego, żeby lepiej podpowiadać i lepiej rozpoznawać. Zebrany materiał
    trafia do profilu użytkownika, a przy włączonej synchronizacji także do
    usługi producenta.

    Materiałem tym jest treść pisana na stanowisku. Nie da się wskazać, co
    dokładnie w nim wylądowało, bo zbieranie idzie po wszystkim, co przechodzi
    przez pole tekstowe: nazwiska, numery spraw, adresy wewnętrzne, fragmenty
    korespondencji. Trafiają tam również ciągi wpisane omyłkowo w nieswoje pole.

    Osobno liczy się to, że słownik uczony na jednym koncie staje się czytelnym
    zapisem tego, czym ta osoba się zajmuje. Dla kogoś, kto przejął konto, jest
    to gotowe streszczenie pracy właściciela maszyny, dostępne bez sięgania do
    jakiegokolwiek pliku roboczego.
  en: |
    The system can learn the way text is entered on a given machine: it gathers
    words typed on the keyboard, recognised from speech and from handwriting, so
    as to suggest better and recognise better. The gathered material goes into the
    user profile, and with synchronisation on, into the vendor's service as well.

    That material is the text written at the station. There is no telling exactly
    what has landed in it, because the gathering covers everything passing through
    a text field: surnames, case numbers, internal addresses, fragments of
    correspondence. Strings typed by mistake into the wrong field land there too.

    It counts separately that a dictionary trained on one account becomes a
    readable record of what that person deals with. To somebody who has taken the
    account over it is a ready summary of the machine owner's work, available
    without reaching for any working file.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek na tej maszynie pisze ręcznie albo
    dyktuje.

    Rozpoznawanie pisma odręcznego i mowy nadal działa, ale przestaje uczyć się
    tej konkretnej osoby. Dla kogoś, kto korzysta z rysika na maszynie
    z ekranem dotykowym, jest to odczuwalne: rozpoznawanie charakteru pisma
    wraca do poziomu ogólnego i pomyłek będzie więcej niż dotąd. To samo dotyczy
    dyktowania — pozostaje sprawne, ale przestaje przyswajać słownictwo
    branżowe i nazwy własne używane w danym zespole.

    Przy zwykłym pisaniu na klawiaturze nie widać nic. Podpowiedzi słów na
    klawiaturze ekranowej stają się mniej trafne, co ma znaczenie na maszynach
    używanych jak tablet.

    Materiał już zebrany nie znika przy samej zmianie zasady — przestaje
    przyrastać. Usunięcie go jest osobną czynnością, poza zakresem tego punktu.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    What needs checking is whether anybody on this machine writes by hand or
    dictates.

    Handwriting and speech recognition still work, but stop learning that
    particular person. For somebody using a stylus on a machine with a touch
    screen this is noticeable: recognition of their handwriting falls back to the
    general level and there will be more mistakes than before. The same goes for
    dictation - it stays functional, but stops taking in the trade vocabulary and
    proper names used in a given team.

    With ordinary typing on a keyboard nothing shows. Word suggestions on the
    on-screen keyboard become less apt, which matters on machines used as a
    tablet.

    Material already gathered does not disappear on the policy change alone - it
    stops growing. Removing it is a separate action, outside the scope of this
    item.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Rozpoznawanie pisma odręcznego przestanie uczyć się charakteru pisma konkretnej osoby
      - Dyktowanie przestanie przyswajać słownictwo branżowe i nazwy własne używane w zespole
      - Podpowiedzi słów na klawiaturze ekranowej staną się mniej trafne
    en:
      - Handwriting recognition stops learning a particular person's hand
      - Dictation stops taking in trade vocabulary and proper names used in the team
      - Word suggestions on the on-screen keyboard become less apt
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko jest obsługiwane rysikiem i pismo odręczne jest podstawową drogą wprowadzania tekstu
      - Osoba pracująca na tym stanowisku dyktuje treści zamiast je pisać
    en:
      - The station is operated with a stylus and handwriting is the main road for entering text
      - The person working at this station dictates content rather than typing it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
      $name = 'AllowInputPersonalization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    $name = 'AllowInputPersonalization'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowInputPersonalization' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy

notes:
  pl: |
    Reguła sprawdza zasadę obowiązującą całą maszynę. Istnieje odpowiadające jej
    ustawienie per użytkownik, którego zasada ta nie zastępuje, lecz przesłania —
    włączenie zasady odbiera użytkownikowi możliwość zmiany, ale nie zmienia
    wpisu zapisanego wcześniej w jego profilu. Reguła nie czyta tego wpisu
    i nie należy z jej wyniku wnioskować o zawartości profilu.

    Punkt bywa czytany jako ustawienie wygody, bo dotyczy podpowiadania słów.
    Właściwym powodem wdrożenia jest to, co przy okazji podpowiadania powstaje:
    zapis treści pisanych na stanowisku.
  en: |
    The rule checks a policy covering the whole machine. There is a matching
    per-user setting which the policy does not replace but overrides - turning the
    policy on takes the choice away from the user, but does not change an entry
    saved earlier in their profile. The rule does not read that entry and its
    result should not be taken to say anything about the profile's contents.

    The item is sometimes read as a convenience setting, because it concerns word
    suggestions. The real reason to apply it is what arises alongside the
    suggesting: a record of the text written at the station.
