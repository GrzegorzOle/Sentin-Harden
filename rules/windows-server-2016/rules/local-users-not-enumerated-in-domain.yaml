id: win2016-local-users-not-enumerated-in-domain

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Konta lokalne niewyliczane na maszynie w domenie
    en: Local accounts not listed on a machine in a domain
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania ekranowi logowania wyliczać konta lokalne maszyny
    przyłączonej do domeny.

    Wartością tego punktu jest to, czego napastnik nie dostaje za darmo.
    Lista kont lokalnych mówi więcej, niż się wydaje: ile ich jest, jak
    brzmią nazwy, czy któreś odbiega od schematu, czy zostało założone
    konto serwisowe, czy ktoś przemianował konto wbudowane.

    Nazwa konta jest przy tym połową pary potrzebnej do zalogowania.
    Napastnik, który ją zna, ma do zgadnięcia jedną rzecz zamiast dwóch —
    a przy koncie wbudowanym, odpornym na blokadę, zgadywanie to nie ma
    kosztu.

    Na maszynie w domenie konta lokalne są przy tym szczególnie interesujące
    z innego powodu. Są to konta, których zasady domeny nie dotyczą: bez
    wymuszonej zmiany hasła, bez centralnej blokady, bez śladu w dzienniku
    kontrolera. Konto lokalne na serwerze w domenie jest drogą, która omija
    wszystko, co w domenie ustawiono.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowy spis
    nazw kont wymykających się zasadom domeny, otrzymany z samego spojrzenia
    na ekran logowania.
  en: |
    The setting forbids the sign-in screen to list the local accounts of a machine
    joined to a domain.

    This item's worth is what an attacker does not get for free. A list of local
    accounts says more than it seems: how many there are, how the names read, whether
    any departs from the pattern, whether a service account has been made, whether
    somebody has renamed the built-in account.

    An account's name is besides half the pair needed to sign in. An attacker who knows
    it has one thing to guess instead of two - and at the built-in account, proof
    against lockout, that guessing costs nothing.

    On a machine in a domain, local accounts are besides of particular interest for
    another reason. They are accounts the domain's policies do not touch: with no
    forced password change, no central lockout, no trace in the controller's log. A
    local account on a server in a domain is a road going round everything set up in
    the domain.

    What an attacker gains while the item goes unmet: a ready register of the names of
    accounts escaping the domain's policies, had from a glance at the sign-in screen
    alone.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Punkt dotyczy wyłącznie tego, co widać na ekranie logowania, i niczego
    więcej. Konta lokalne nie są usuwane ani wyłączane — przestają być
    wypisywane.

    Zalogować się na konto lokalne nadal można. Trzeba wpisać nazwę ręcznie,
    w postaci wskazującej maszynę zamiast domeny, i podać hasło. Jest to
    czynność o jeden krok dłuższa i nic poza tym.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi. Na
    serwerze bez sesji interaktywnych zmiana nie jest w ogóle widoczna.

    Czego to nie psuje: logowania kontami lokalnymi, logowania kontami
    domenowymi, usług, sieci, pracy użytkowników. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    The item concerns only what is seen on the sign-in screen and nothing more. Local
    accounts are neither removed nor switched off - they stop being written out.

    One can still sign in to a local account. The name has to be typed by hand, in a
    form naming the machine instead of the domain, and the password given. It is an act
    one step longer and nothing besides.

    No restart, sign-out or stopping of a service goes with it. On a server with no
    interactive sessions the change is not visible at all.

    What this does not break: signing in with local accounts, signing in with domain
    accounts, services, the network, or users' work. There are no known regressions.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Konto lokalne trzeba wpisać ręcznie, w postaci wskazującej maszynę zamiast domeny, zamiast wybrać je z listy
      - Konta lokalne nie są usuwane ani wyłączane - przestają być tylko wypisywane
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
      - Na serwerze bez sesji interaktywnych zmiana nie jest w ogóle widoczna
    en:
      - A local account has to be typed by hand, in a form naming the machine instead of the domain, rather than picked from a list
      - Local accounts are neither removed nor switched off - they only stop being written out
      - No restart, no sign-out, no stopping of a service
      - On a server with no interactive sessions the change is not visible at all
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa maszyny loguje się kontami lokalnymi z listy i nie zna postaci nazwy wskazującej maszynę
    en:
      - The machine is attended by people signing in with local accounts from the list who do not know the form of a name naming the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnumerateLocalUsers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnumerateLocalUsers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is named after the listing, so the wanted state is written
    # with a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnumerateLocalUsers' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Punkt jest pierwszym z trzech dotyczących tego, co ekran logowania
    mówi o maszynie, zanim ktokolwiek się przedstawi. Wszystkie trzy są
    w klasie bez uciążliwości i wszystkie trzy warto wdrażać razem —
    osobno każda zasłania jedną szczelinę, a zostają dwie.

    Kategoria średnia jest tu wyższa niż przy dwóch pozostałych i ma to
    uzasadnienie: konto lokalne na maszynie w domenie omija zasady domeny,
    więc ujawnienie jego nazwy jest ujawnieniem drogi, a nie samej nazwy.

    Wpis nosi nazwę opisującą wyliczanie, więc wartością wymaganą jest
    zero. Jest to kolejny punkt w zestawie, w którym zero oznacza stan
    pożądany, i warto to nazwać w raporcie.
  en: |
    The item is the first of three concerning what the sign-in screen says about the
    machine before anybody has presented themselves. All three are of the class no
    disruption and all three are worth rolling out together - apart, each covers one
    chink and two remain.

    The medium category is higher here than at the other two and it is warranted: a
    local account on a machine in a domain goes round the domain's policies, so
    disclosing its name is disclosing a road rather than a name.

    The entry bears a name describing the listing, so the required value is zero. It is
    another item in the set where zero means the wanted state, and that is worth naming
    in the report.
