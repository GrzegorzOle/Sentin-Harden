id: win2016-winrm-client-unencrypted-traffic-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Client
  title:
    pl: Nieszyfrowany ruch klienta zarządzania zdalnego zabroniony
    en: Unencrypted traffic from the remote management client refused
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi zarządzania zdalnego zestawiać sesje,
    w których treść nie jest szyfrowana.

    Reguła domyka blok i warto pokazać, co dokładnie domyka. Strona usługi
    pilnuje, czego ta maszyna nie przyjmie. Strona klienta pilnuje, czego
    ta maszyna nie wyśle — a wysyła polecenia administracyjne i wszystko,
    co w nich zawarte.

    Rzecz, która czyni tę stronę istotną mimo pozornej symetrii: klient
    decyduje o sesji, zanim serwer zdąży cokolwiek powiedzieć. Serwer
    łagodny, przyjmujący ruch nieszyfrowany, nie zmusi klienta do niczego,
    jeżeli klient sam się nie zgodzi. Reguła ta jest więc obroną przed
    serwerem źle skonfigurowanym albo podstawionym.

    Idą tędy nazwy kont, ścieżki, zawartość plików konfiguracyjnych,
    a przy pracy administracyjnej również hasła podawane poleceniom.
    Wszystko to dotyczy maszyn docelowych, a więc zasięg skutku jest
    szerszy niż ta jedna maszyna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    i zmianę poleceń wysyłanych stąd na inne maszyny, przy czym wystarczy
    mu stanąć po drodze.
  en: |
    The setting forbids the remote management client to establish sessions whose
    contents are not encrypted.

    The rule shuts the block, and it is worth showing what exactly it shuts. The
    service's side sees to what this machine will not accept. The client's side sees
    to what this machine will not send - and it sends administrative commands and
    everything contained in them.

    The thing making this side matter despite the seeming symmetry: the client
    settles the session before the server can say anything. A lenient server,
    accepting unencrypted traffic, will force the client to nothing if the client
    does not agree of itself. This rule is therefore a defence against a server
    badly set up or substituted.

    Account names go this way, paths, the contents of configuration files, and in
    administrative work also passwords given to commands. All of that concerns the
    target machines, so the reach of the consequence is wider than this one machine.

    What an attacker gains while the item goes unmet: the reading and the changing
    of commands sent from here to other machines, for which it suffices that they
    stand along the way.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba to samo co przy regule
    usługi, tylko w drugą stronę: dokąd ta maszyna się łączy i czy tamte
    końce zapewniają szyfrowanie.

    W środowisku domenowym wdrożenie zwykle nie zmienia nic, bo
    uwierzytelnianie domenowe szyfruje treść samo z siebie.

    Sprawdzić trzeba połączenia do maszyn spoza domeny, do urządzeń
    z własną implementacją usługi i do hostów, na których nasłuch
    szyfrowany nie został przygotowany. Te połączenia zostaną odrzucone
    przez klienta, zanim w ogóle dojdą do skutku.

    Objaw jest przy tym specyficzny i warto go zapowiedzieć: błąd zgłasza
    maszyna źródłowa, a dotyczy on konfiguracji docelowej. Szukanie
    przyczyny zaczyna się więc po niewłaściwej stronie, a przy wielu celach
    objaw wygląda na przypadkowy, bo dotyka tylko części z nich.

    Czego to nie psuje: połączeń domenowych, przyjmowania połączeń przez tę
    maszynę, pulpitu zdalnego, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is the same as at the
    service's rule, only the other way about: where this machine connects to, and
    whether those far ends provide encryption.

    In domain surroundings the rollout as a rule changes nothing, domain
    authentication encrypting the contents of itself.

    What has to be checked are connections to machines outside the domain, to
    devices with an implementation of the service of their own, and to hosts where
    no encrypted listener has been prepared. Those connections will be refused by
    the client before they come about at all.

    The symptom is peculiar besides and worth foretelling: the error is reported by
    the source machine and concerns the target's configuration. The search for a
    cause therefore begins on the wrong side, and with many targets the symptom
    looks like chance, touching only some of them.

    What this does not break: domain connections, the accepting of connections by
    this machine, the remote desktop, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - encryption-and-tls
    - scripting-and-automation
  what_breaks:
    pl:
      - Połączenia do maszyn spoza domeny i do hostów bez przygotowanego nasłuchu szyfrowanego zostają odrzucone przez klienta
      - Błąd zgłasza maszyna źródłowa, a dotyczy konfiguracji docelowej, więc szukanie przyczyny zaczyna się po niewłaściwej stronie
      - Przy wielu celach objaw wygląda na przypadkowy, bo dotyka tylko części z nich
      - Połączenia domenowe, przyjmowanie połączeń przez tę maszynę i pulpit zdalny pozostają bez zmian
    en:
      - Connections to machines outside the domain and to hosts with no encrypted listener prepared are refused by the client
      - The error is reported by the source machine and concerns the target's configuration, so the search for a cause begins on the wrong side
      - With many targets the symptom looks like chance, touching only some of them
      - Domain connections, the accepting of connections by this machine and the remote desktop stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tej maszyny zarządza się hostami, na których nasłuch szyfrowany nie został przygotowany
      - Skrypty uruchamiane tutaj łączą się z urządzeniami niezapewniającymi szyfrowania treści
    en:
      - Hosts with no encrypted listener prepared are managed from this machine
      - Scripts run here connect to devices that provide no encryption of the contents
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      $name = 'AllowUnencryptedTraffic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowUnencryptedTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowUnencryptedTraffic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Punkt zamyka blok i warto przy nim pokazać całość. Sześć reguł układa
    się w dwie kolumny — usługa i klient — po trzy tematy: kto się
    przedstawia, jak wygląda treść, gdzie usługa jest osiągalna. Kolumna
    klienta jest pełna tylko w dwóch pierwszych, bo wystawianie nasłuchu
    klienta nie dotyczy.

    Rozróżnienie między stronami warto powtórzyć w interfejsie, bo nazwy
    wpisów są po obu stronach identyczne i pomylenie ich prowadzi do
    wdrożenia zabezpieczenia w nie tym kierunku, co zamierzono.

    Uczciwość opisu wymaga przypomnienia, że w środowisku domenowym
    większość tych reguł nie zmienia nic — treść i tak jest szyfrowana,
    a uwierzytelnianie i tak nie jest podstawowe. Wartość bloku ujawnia się
    dopiero tam, gdzie z maszyną rozmawia coś spoza domeny, i tam warto
    kierować uwagę czytelnika.
  en: |
    The item shuts the block, and the whole of it is worth showing here. Six rules
    fall into two columns - the service and the client - across three themes: who
    presents themselves, what the contents look like, and where the service is
    reachable. The client's column is full only in the first two, the exposing of a
    listener not touching the client.

    The distinction between the sides is worth repeating in the interface, the
    entries' names being identical on both sides and confusing them leading to a
    safeguard rolled out in the wrong direction.

    Honesty of description calls for a reminder that in domain surroundings most of
    these rules change nothing - the contents are encrypted anyway and the
    authentication is not basic anyway. The block's value shows only where something
    outside the domain speaks with the machine, and that is where the reader's
    attention is worth directing.
