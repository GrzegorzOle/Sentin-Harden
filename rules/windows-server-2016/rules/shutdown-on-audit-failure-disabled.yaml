id: win2016-shutdown-on-audit-failure-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Serwer nie wyłącza się przy niepowodzeniu zapisu inspekcji
    en: The server does not shut down at a failure to write an audit entry
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że serwer nie zatrzymuje się, gdy nie uda mu się
    zapisać wpisu inspekcji.

    Punkt jest nietypowy, bo w zestawie reguł bezpieczeństwa oczekuje
    braku reakcji, a nie jej obecności. Warto powiedzieć wprost, skąd to
    się bierze, bo inaczej wygląda na pomyłkę.

    Zamysł ustawienia przeciwnego jest poprawny: skoro inspekcja ma być
    kompletna, to praca bez możliwości zapisu nie powinna trwać. Rozumowanie
    to jest do obrony w miejscach, gdzie zupełność dziennika waży więcej
    niż ciągłość usługi.

    Skutek praktyczny jest jednak inny. Dziennik zapełnia się sam, bez
    niczyjego udziału, i to zapełnienie wystarczy, żeby serwer się
    zatrzymał. Otwiera to drogę prostą i niewymagającą żadnych uprawnień:
    wywołać dość zdarzeń, żeby dziennik się zapełnił, i poczekać. Zamiast
    zabezpieczenia powstaje wyłącznik dostępny z zewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania serwera przez samo wywołanie dostatecznej liczby zdarzeń.
  en: |
    The setting makes the server not stop where it fails to write an audit entry.

    The item is an unusual one, expecting as it does in a set of security rules the absence of a reaction rather
    than its presence. It is worth saying outright whence that comes, else it looks a mistake.

    The intent of the opposite setting is sound: if the audit is to be complete, then work without the possibility
    of writing ought not to go on. That reasoning is to be defended in places where a log's completeness weighs
    more than a service's continuity.

    The practical consequence, though, is another. The log fills of itself, without anybody's taking part, and that
    filling is enough for the server to stop. It opens a road simple and calling for no rights at all: raise events
    enough for the log to fill, and wait. Instead of a safeguard there arises a switch to be had from outside.

    What an attacker gains while the item goes unmet: the chance to stop the server by the mere raising of events
    enough in number.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Serwer przestaje zatrzymywać się przy niepowodzeniu zapisu inspekcji
    i pracuje dalej. Sama inspekcja, jej zakres i zapis do dziennika
    pozostają bez zmian.

    Rzecz warta powiedzenia: reguła nie rozwiązuje przyczyny, tylko
    usuwa reakcję. Dziennik, który się zapełnia, nadal się zapełnia,
    i trzeba to obsłużyć osobno — przez rozmiar dziennika, zasadę
    nadpisywania albo zbieranie zdarzeń poza maszynę.

    Nie ma znanych regresji.

    Czego to nie psuje: inspekcji, dzienników zdarzeń, zasad zapisu,
    zbierania zdarzeń, ról serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The server ceases to stop at a failure to write an audit entry and works on. The audit itself, its reach and the
    writing to the log stay unchanged.

    A thing worth saying: the rule does not answer the cause, it only removes the reaction. A log that fills still
    fills, and that has to be dealt with separately - by the log's size, by a policy of overwriting or by the
    gathering of events beyond the machine.

    There are no known regressions.

    What this does not break: the audit, the event logs, the policies of writing, the gathering of events, the
    server's roles, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Serwer przestaje zatrzymywać się przy niepowodzeniu zapisu wpisu inspekcji i pracuje dalej
      - Zupełność dziennika przestaje być wymuszana zatrzymaniem maszyny, więc trzeba ją zapewnić inaczej
      - Dziennik, który się zapełnia, nadal się zapełnia i wymaga obsługi rozmiarem albo zbieraniem zdarzeń
      - Sama inspekcja, jej zakres i zapis do dziennika pozostają bez zmian
      - Role serwera, usługi systemowe i aplikacje pozostają bez zmian
    en:
      - The server ceases to stop at a failure to write an audit entry and works on
      - The log's completeness ceases to be forced by a stopping of the machine, so it has to be secured otherwise
      - A log that fills still fills and calls for handling by size or by the gathering of events
      - The audit itself, its reach and the writing to the log stay unchanged
      - The server roles, system services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wymagania na tej maszynie stawiają zupełność dziennika wyżej niż ciągłość usługi i tak zapisano w polityce
    en:
      - The requirements on this machine set the log's completeness above the service's continuity and so it is written in the policy
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The benchmark takes this setting off, so zero is what is expected here -
      # unusually for a security item, the safeguard is the absence of a reaction.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'CrashOnAuditFail'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'CrashOnAuditFail'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is correct here. Unusually for a security item, what is wanted is
    # the absence of a reaction, not its presence.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'CrashOnAuditFail' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/audit-shut-down-system-immediately-if-unable-to-log-security-audits

notes:
  pl: |
    Punkt jest drugi w bloku i najciekawszy, bo przeczy odruchowi. Wartość
    oczekiwana to zero, czyli brak reakcji — a w zestawie reguł
    bezpieczeństwa brak reakcji wygląda na pomyłkę.

    Zdanie, które trzeba postawić wprost: zamysł ustawienia przeciwnego
    jest poprawny, a skutek praktyczny — odwrotny od zamierzonego.
    Dziennik zapełnia się sam, więc zabezpieczenie zamienia się
    w wyłącznik dostępny dla każdego, kto potrafi wywołać dość zdarzeń.

    Warto, żeby aplikacja pokazała, czego ten punkt nie załatwia. Usuwa
    reakcję, nie przyczynę. Zupełność dziennika trzeba zapewnić inaczej —
    rozmiarem, zasadą nadpisywania albo zbieraniem zdarzeń poza maszynę.
    Bez tego zdania reguła wygląda na rezygnację z inspekcji.

    Odnotowuję, że są środowiska, w których ustawienie przeciwne jest
    właściwe i zapisane w wymaganiach. Jest to jedna z reguł, przy których
    odpuszczenie z uzasadnieniem bywa decyzją zupełnie poprawną.
  en: |
    The item is the second in the block and the most interesting, running as it does against the reflex. The expected
    value is zero, which is to say the absence of a reaction - and in a set of security rules the absence of a
    reaction looks a mistake.

    The sentence that has to be set down outright: the intent of the opposite setting is sound, and the practical
    consequence is the reverse of what was meant. The log fills of itself, so the safeguard turns into a switch to be
    had by anybody able to raise events enough.

    It is well that the application show what this item does not settle. It removes the reaction, not the cause. The
    log's completeness has to be secured otherwise - by size, by a policy of overwriting or by the gathering of events
    beyond the machine. Without that sentence the rule looks a giving up of the audit.

    Worth noting that there are settings in which the opposite is right and written into the requirements. It is one of
    the rules at which a letting go with a justification is at times a wholly sound decision.
