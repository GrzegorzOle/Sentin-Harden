id: win11-anonymous-named-pipes-empty

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista kanałów nazwanych dostępnych anonimowo pusta
    en: The list of named pipes reachable anonymously left empty
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Kanał nazwany to droga, którą usługi systemu przyjmują polecenia przez sieć —
    osobna od udziałów plikowych i znacznie mniej widoczna. Przez kanały idzie
    zarządzanie usługami, zdalne odczyty rejestru, harmonogram zadań i część
    obsługi wydruku.

    Maszyna prowadzi wykaz kanałów, do których wolno sięgnąć bez podania kim się
    jest. Wpis na tej liście oznacza, że dana usługa rozmawia przez sieć
    z każdym, kto się odezwie, nie pytając o tożsamość.

    Jest to droga trudniejsza do zauważenia niż otwarty udział plikowy, bo nie
    widać jej w żadnym przeglądzie zasobów udostępnionych. Napastnik natomiast
    zna ją dobrze: odpytanie kanałów należy do pierwszych czynności po wejściu
    do sieci i nie wymaga żadnego konta.
  en: |
    A named pipe is a road by which the system's services accept commands over the
    network - separate from file shares and far less visible. Service management,
    remote registry reads, the task scheduler and part of print handling all travel
    over pipes.

    The machine keeps a list of pipes that may be reached without saying who one
    is. An entry on that list means the service in question talks over the network
    with anybody who calls, without asking for identity.

    This road is harder to notice than an open file share, because it appears in no
    review of shared resources. An attacker, by contrast, knows it well: querying
    pipes is among the first actions after getting into a network and requires no
    account at all.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, co na liście stoi. Na maszynie z listą już pustą nie
    zmienia się nic.

    Jeżeli wpis istnieje, korzysta z niego jakieś narzędzie zarządzające albo
    stara integracja. Skutek opróżnienia listy jest wtedy odczuwalny po stronie
    tego narzędzia, nie na stanowisku: zdalna operacja zwróci odmowę dostępu,
    zwykle bez wskazania powodu.

    Zdalne zarządzanie prowadzone na koncie z uprawnieniami działa bez zmian.
    Punkt dotyczy wyłącznie dostępu bez podania tożsamości — narzędzie, które
    się przedstawia, nie jest tym objęte.

    Przed wdrożeniem warto odczytać zawartość listy. Reguła podaje odczytane
    wpisy razem z wynikiem, żeby było wiadomo, co dokładnie zostanie odcięte.

    Nie ma restartu maszyny. Zmiana obowiązuje po ponownym uruchomieniu usługi
    udostępniania albo przy następnym starcie systemu.
  en: |
    What needs checking is what stands on the list. On a machine whose list is
    already empty nothing changes.

    If an entry exists, some management tool or an old integration is using it. The
    effect of emptying the list is then felt on that tool's side, not at the
    station: a remote operation returns access denied, usually without saying why.

    Remote management carried out under an account with rights works unchanged. The
    item concerns only access without stating an identity - a tool that introduces
    itself is not covered by it.

    It is worth reading the list's contents before applying the change. The rule
    reports the entries it read together with the result, so it is known exactly
    what will be cut off.

    There is no machine restart. The change takes effect once the sharing service
    restarts, or at the next system start.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Narzędzia zarządzające sięgające do usług maszyny bez podania tożsamości otrzymają odmowę dostępu
      - Stare integracje odczytujące rejestr albo harmonogram zadań przez sieć bez poświadczeń przestaną działać
    en:
      - Management tools reaching the machine's services without stating an identity receive access denied
      - Old integrations reading the registry or the task scheduler over the network without credentials stop working
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z kanału wpisanego na listę korzysta integracja niepotrafiąca podać poświadczeń, której nie da się jeszcze zastąpić
    en:
      - A pipe on the list is used by an integration unable to supply credentials that cannot yet be replaced
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a
      # list with nothing on it mean the same thing here - no pipe is reachable
      # anonymously - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'NullSessionPipes'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: EMPTY
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'NullSessionPipes'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = @($current)
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NullSessionPipes' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value @($b.value) -Type MultiString
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-named-pipes-that-can-be-accessed-anonymously

notes:
  pl: |
    Reguła bliźniacza wobec punktu o udziałach dostępnych anonimowo: ta sama
    postać danych, to samo traktowanie braku wartości, ten sam sposób zgłaszania
    odczytanych wpisów. Różnica leży w tym, co wpis udostępnia — tam pliki,
    tutaj rozmowę z usługą systemu.

    Kanały bywają mylone z usługami. Opróżnienie listy nie wyłącza żadnej
    usługi i nie zmienia jej uprawnień — odbiera jedynie możliwość rozmowy
    z nią bez podania tożsamości. Usługa pozostaje dostępna dla każdego, kto się
    przedstawi i ma prawo.
  en: |
    A twin of the item about shares reachable anonymously: the same shape of data,
    the same treatment of a missing value, the same way of reporting the entries
    read. The difference lies in what an entry gives access to - there files, here
    a conversation with a system service.

    Pipes are sometimes confused with services. Emptying the list switches off no
    service and changes no service's permissions - it merely takes away the
    possibility of talking to it without stating an identity. The service remains
    available to anybody who introduces themselves and has the right.
