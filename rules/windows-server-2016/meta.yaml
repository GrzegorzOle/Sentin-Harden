id: windows-server-2016
nazwa: Windows Server 2016
rodzina: windows
powloka: powershell
profil: server

benchmark:
  nazwa: CIS Microsoft Windows Server 2016 Benchmark
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 2 = kontroler domeny, 3 = serwer członkowski. Kompilacja 14393.
  dopasowanie: '^Microsoft Windows Server 2016.*\|14393\|[23]$'

role:
  polecenie: |
    (Get-WindowsFeature | Where-Object InstallState -eq 'Installed').Name -join ','

uwagi: |
  Najstarszy wspierany cel. Wsparcie rozszerzone kończy się w styczniu 2027 —
  raport dla tego systemu powinien o tym wspominać, bo część ryzyk nie da się
  domknąć konfiguracją.

  Uwaga przy pisaniu reguł: PowerShell 5.1 i starsze polecenia. Składnia działająca
  na Server 2025 potrafi tu nie zadziałać, a część nowszych ustawień po prostu
  nie istnieje — wtedy wynikiem jest NOT_APPLICABLE, nie FAIL.
