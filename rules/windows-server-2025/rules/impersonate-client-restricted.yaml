id: win2025-impersonate-client-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Podszywanie się pod klienta po uwierzytelnieniu ograniczone
    en: Impersonating a client after authentication restricted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala usłudze działać w imieniu klienta, który się do niej
    zgłosił — czyli przyjąć jego tożsamość i sięgać po zasoby z jego
    uprawnieniami, a nie własnymi.

    Bez tego mechanizmu serwer aplikacyjny nie mógłby działać. Usługa
    sieciowa musi odczytać plik z uprawnieniami osoby, która o niego
    poprosiła, bo inaczej albo odczytałaby go dla każdego, albo dla
    nikogo.

    Zagrożenie bierze się z odwrócenia ról. Proces z tym prawem może
    poczekać, aż zgłosi się do niego klient o uprawnieniach wyższych,
    i wtedy tożsamość tę przejąć. Wystarczy, że skłoni proces
    uprzywilejowany do połączenia — a do tego nadaje się każdy kanał
    nazwany, do którego cokolwiek się łączy.

    Na serwerze droga ta jest szczególnie krótka, bo procesów
    pracujących na kontach usługowych i łączących się między sobą jest
    tu wiele. Jest to jedna z częściej wykorzystywanych w praktyce dróg
    podniesienia uprawnień z konta usługowego do konta systemu.

    Punkt zawęża wykaz do kont usług wbudowanych, administratorów
    i usług sieciowych — czyli tych, które mechanizmu faktycznie
    potrzebują do działania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    z konta o uprawnieniach zwykłych do konta systemu, przez samo
    poczekanie na połączenie od procesu uprzywilejowanego.
  en: |
    The right lets a service act in the name of the client that came to it - that is, take on
    its identity and reach for resources with its rights rather than its own.

    Without that mechanism an application server could not work. A network service must read a
    file with the rights of the person who asked for it, since otherwise it would read it
    either for everyone or for nobody.

    The danger comes of the roles being turned about. A process with this right may wait until
    a client of higher rights comes to it and then take that identity on. It is enough that it
    draw a privileged process into connecting - and any named pipe anything connects to serves
    for that.

    On a server the road is particularly short, since processes working under service accounts
    and connecting to one another are here many. It is one of the more often used roads in
    practice from raising rights from a service account to the system's account.

    The item narrows the list to the accounts of built-in services, administrators and network
    services - that is, those that in fact take the mechanism to work.

    What an attacker gains while the item goes unmet: a road from an account of ordinary rights
    to the system's account, through the mere awaiting of a connection from a privileged
    process.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze pracuje usługa na koncie
    własnym, które z tego mechanizmu korzysta, bo po zawężeniu przestanie
    móc działać w imieniu klientów.

    Na serwerze jest to pytanie realne i to jest różnica wobec stanowiska
    roboczego. Serwer aplikacyjny, serwer sieciowy i serwer bazy danych
    opierają się na tym mechanizmie z definicji — to on pozwala im
    obsługiwać żądania z uprawnieniami osoby, która je złożyła.

    Wykaz zgodny obejmuje konta usług wbudowanych, na których takie
    usługi pracują domyślnie. Jeżeli jednak ktoś uruchomił usługę na
    koncie utworzonym celowo — a jest to praktyka zalecana przy
    aplikacjach własnych — konto to w wykazie nie występuje i po zmianie
    straci to prawo.

    Objaw jest wtedy dotkliwy i natychmiastowy: usługa działa, ale każde
    żądanie wymagające sięgnięcia po zasób w imieniu użytkownika kończy
    się odmową dostępu. Z zewnątrz wygląda to na problem z uprawnieniami
    do danych, a nie na problem z konfiguracją serwera.

    Dodanie konta usługi do grupy administratorów nie jest tu
    rozwiązaniem, tylko pogorszeniem. Właściwym krokiem jest nadanie
    temu prawu wyjątku obejmującego wskazane konto usługowe i zapisanie
    go jako świadomej decyzji.
  en: |
    What needs checking is whether a service under an account of its own that uses this
    mechanism works on this server, since after the narrowing it will no longer be able to act
    in clients' names.

    On a server that is a real question, and that is the difference from a working station. An
    application server, a web server and a database server rest on this mechanism by definition
    - it is what lets them serve requests with the rights of the person who made them.

    The compliant list takes in the accounts of built-in services, under which such services
    work by default. Should somebody have started a service under an account made on purpose,
    though - and that is the advised practice at home-made applications - that account does not
    stand in the list and after the change will lose this right.

    The symptom is then biting and immediate: the service works, but every request taking a
    reach for a resource in a user's name ends in a refusal of access. From outside it looks
    like a trouble with rights to the data rather than a trouble with the server's
    configuration.

    Adding the service's account to the administrators' group is here no answer but a
    worsening. The right step is granting this right an exception taking in the named service
    account and recording it as a knowing decision.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Usługa na koncie utworzonym celowo przestanie działać w imieniu swoich klientów
      - Każde żądanie sięgające po zasób w imieniu użytkownika kończy się odmową dostępu
      - Z zewnątrz wygląda to na problem z uprawnieniami do danych, a nie z konfiguracją serwera
      - Usługi na kontach wbudowanych zachowują prawo i działają bez zmiany
    en:
      - A service under an account made on purpose will stop acting in its clients' names
      - Every request reaching for a resource in a user's name ends in a refusal of access
      - From outside it looks like a trouble with rights to the data rather than the server's configuration
      - Services under built-in accounts keep the right and work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje usługa aplikacyjna na koncie utworzonym celowo i obsługuje żądania w imieniu użytkowników
      - Nie ustalono, na jakich kontach pracują usługi sieciowe tego serwera
    en:
      - An application service under an account made on purpose works on the server and serves requests in users' names
      - It has not been settled what accounts this server's network services work under
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeImpersonatePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20,S-1-5-32-544,S-1-5-6|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeImpersonatePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeImpersonatePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeImpersonatePrivilege = *S-1-5-32-544,*S-1-5-6,*S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeImpersonatePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/impersonate-a-client-after-authentication

notes:
  pl: |
    Wykaz zgodny obejmuje konto usługi lokalnej, konto usługi sieciowej,
    administratorów oraz zbiorczy identyfikator usług. Są to konta,
    na których pracują usługi wymagające tego mechanizmu do działania.

    Prawo bywa mylone z tworzeniem obiektu tokenu. Tamto pozwala
    zbudować przepustkę od zera i nie jest niczym ograniczone; to jest
    ograniczone do tożsamości, którą klient faktycznie przedstawił.

    Konto usługi utworzone celowo — praktyka zalecana przy aplikacjach
    własnych — w wykazie nie występuje. Rozwiązaniem nie jest dodanie
    go do administratorów, tylko zapisanie wyjątku obejmującego to
    konkretne konto.
  en: |
    The compliant list takes in the local service account, the network service account,
    administrators and the collective identifier of services. Those are the accounts under
    which services taking this mechanism to work run.

    The right is at times mistaken for the making of a token object. That one lets a pass be
    built from nothing and is bounded by nothing; this one is bounded by the identity the
    client in fact presented.

    A service account made on purpose - the advised practice at home-made applications - does
    not stand in the list. The answer is not adding it to the administrators but recording an
    exception taking in that particular account.
