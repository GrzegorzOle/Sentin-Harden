id: win2025-bitlocker-secure-boot-integrity

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Sprawdzanie spójności startu oparte na bezpiecznym rozruchu
    en: Startup integrity checking based on secure boot
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że o spójności startu rozstrzyga bezpieczny rozruch,
    a nie własna lista pomiarów BitLockera. Obie drogi prowadzą do tego
    samego pytania — czy to, co uruchamia się przed systemem, jest tym, co
    uruchamiało się poprzednio — ale odpowiadają na nie inaczej.

    Zostawiam kategorię średnią. Ten punkt nie dokłada ochrony, tylko
    zmienia jej podstawę, więc nie chcę mu przypisywać wagi, której nie ma.

    Różnica jest praktyczna. Lista pomiarów BitLockera reaguje na każdą
    zmianę w elementach startu, łącznie ze zmianami zupełnie zwyczajnymi:
    aktualizacją oprogramowania układowego, zmianą kolejności rozruchu,
    dołożeniem karty z własnym oprogramowaniem startowym. Bezpieczny
    rozruch pyta o co innego — czy to, co się uruchamia, jest podpisane
    przez zaufanego wystawcę. Zmiana zwyczajna zachowuje podpis, zmiana
    złośliwa zwykle nie.

    Na serwerze przekłada się to wprost na liczbę fałszywych alarmów.
    Oprogramowanie układowe serwera aktualizuje się regularnie i często
    razem z kontrolerem zarządzania, kartami sieciowymi i kontrolerem
    macierzy. Każda z tych czynności potrafi poruszyć listę pomiarów,
    a żadna nie oznacza, że maszyna została naruszona.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio — ale maszyna, która żąda klucza odzyskiwania po każdej
    aktualizacji oprogramowania układowego, uczy obsługę, że to normalne.
    A żądanie klucza po naruszeniu wygląda wtedy tak samo.
  en: |
    The item makes secure boot, rather than BitLocker's own list of
    measurements, the thing that settles startup integrity. Both routes
    lead to the same question - is what starts before the system the same
    as what started last time - but they answer it differently.

    I keep the category medium. This item adds no protection; it changes
    the basis of protection, so I do not want to attribute weight to it
    that it does not have.

    The difference is practical. BitLocker's list of measurements reacts to
    every change in the startup elements, including entirely ordinary ones:
    a firmware update, a change of boot order, adding a card with its own
    startup code. Secure boot asks something else - is what is starting
    signed by a trusted issuer. An ordinary change keeps the signature; a
    malicious one usually does not.

    On a server this translates directly into the number of false alarms. A
    server's firmware is updated regularly and often together with the
    management controller, the network cards and the array controller. Any
    of those can disturb the list of measurements, and none of them means
    the machine has been tampered with.

    What an attacker gains while the item goes unmet: little directly - but
    a machine that demands the recovery key after every firmware update
    teaches the operators that this is normal. And a demand for the key
    after real tampering then looks exactly the same.

disruption_description:
  pl: |
    Podnoszę klasę do „wymaga sprawdzenia" i podaję powód, bo nie zgadzam
    się tu z oceną przeniesioną ze stacji roboczej.

    Zmiana dotyczy tego, jak maszyna zachowa się przy najbliższym
    uruchomieniu, a skutkiem złego wdrożenia jest żądanie klucza
    odzyskiwania przy starcie. Na serwerze oznacza to maszynę, która nie
    wstanie sama po restarcie — a restart serwera zdarza się po
    aktualizacji, po decyzji klastra i po zaniku zasilania, czyli zwykle
    wtedy, gdy nikogo przy nim nie ma. To nie jest zmiana, której nikt nie
    zauważy, i nie wolno jej puszczać hurtem tylko dlatego, że wpis
    w rejestrze wygląda niewinnie.

    Warunkiem jest sprawny bezpieczny rozruch. Włączenie tej reguły na
    maszynie, która startuje w trybie zgodności, zmienia podstawę
    sprawdzania na taką, której nie ma — i to jest dokładnie ten przypadek,
    w którym maszyna zatrzymuje się przy starcie z prośbą o klucz.
    Dlatego przed wdrożeniem trzeba potwierdzić stan bezpiecznego rozruchu,
    a nie zakładać go.

    Druga rzecz do sprawdzenia to ślad po sobie. Zmiana zaczyna obowiązywać
    dopiero po restarcie, więc między jej zapisaniem a skutkiem mija czas —
    czasem tygodnie. Osoba, która zobaczy problem, zwykle nie będzie tą,
    która wpis zrobiła.

    Cofnięcie działa, ale również dopiero po restarcie. Zanim ta reguła
    pójdzie na serwer, trzeba znać drogę dostępu poza systemem i mieć klucz
    odzyskiwania pod ręką, a nie w katalogu, do którego dostęp wymaga
    działającej maszyny.
  en: |
    I raise the class to "needs review" and give the reason, because I do
    not agree with the rating carried over from the workstation.

    The change concerns how the machine will behave at the next start, and
    the consequence of a bad rollout is a demand for the recovery key at
    startup. On a server that means a machine that will not come up by
    itself after a restart - and a server restarts after an update, after a
    cluster decision and after a power loss, that is, usually when nobody
    is next to it. This is not a change nobody will notice, and it must not
    be let through in bulk just because the registry entry looks innocent.

    The condition is a working secure boot. Turning this rule on where the
    machine starts in compatibility mode switches the basis of checking to
    one that is not there - and that is exactly the case in which the
    machine stops at startup asking for the key. So the state of secure
    boot has to be confirmed before the rollout, not assumed.

    The second thing to check is the trace left behind. The change takes
    effect only after a restart, so time passes between writing it and its
    consequence - sometimes weeks. The person who sees the problem will
    usually not be the one who made the entry.

    Undoing it works, but likewise only after a restart. Before this rule
    goes onto a server, the out-of-band route has to be known and the
    recovery key has to be at hand - not in a directory reached only
    through a working machine.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
  what_breaks:
    pl:
      - Na maszynie startującej w trybie zgodności podstawa sprawdzania przestaje istnieć i maszyna prosi o klucz odzyskiwania przy starcie
      - Serwer restartuje się po aktualizacji, po decyzji klastra i po zaniku zasilania, czyli wtedy, gdy nikogo przy nim nie ma
      - Zmiana zaczyna obowiązywać dopiero po restarcie, więc między wpisem a skutkiem mijają czasem tygodnie
      - Osoba, która zobaczy problem, zwykle nie będzie tą, która wpis zrobiła
      - Cofnięcie też działa dopiero po restarcie, więc nie ratuje maszyny stojącej przy prośbie o klucz
    en:
      - Where the machine starts in compatibility mode the basis of checking is absent and it asks for the recovery key at startup
      - A server restarts after an update, after a cluster decision and after a power loss, that is, when nobody is next to it
      - The change takes effect only after a restart, so weeks can pass between the entry and its consequence
      - The person who sees the problem will usually not be the one who made the entry
      - Undoing it likewise takes effect only after a restart, so it does not rescue a machine already asking for the key
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie potwierdzono, że maszyna startuje z włączonym bezpiecznym rozruchem, a nie w trybie zgodności
      - Nie ustalono drogi dostępu poza systemem ani nie sprawdzono jej faktycznym zalogowaniem
      - Klucz odzyskiwania jest dostępny wyłącznie przez katalog, do którego wejście wymaga działającej maszyny
    en:
      - It has not been confirmed that the machine starts with secure boot on rather than in compatibility mode
      - The out-of-band route has not been settled, nor verified by actually signing in
      - The recovery key is reachable only through a directory that needs a working machine to enter
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'OSAllowSecureBootForIntegrity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'OSAllowSecureBootForIntegrity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Confirm secure boot is actually on before this. Where the machine starts
    # in compatibility mode, the basis of checking is absent and the machine
    # stops at the next start asking for the recovery key - which on a server
    # happens after an unattended restart, with nobody at the console.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'OSAllowSecureBootForIntegrity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Podniosłem klasę uciążliwości wobec oceny ze stacji roboczej. Wpis
    w rejestrze wygląda niewinnie, ale skutek złego wdrożenia to maszyna,
    która nie wstanie sama po restarcie — a serwer restartuje się wtedy,
    gdy nikogo przy nim nie ma.

    Ten punkt nie dokłada ochrony, tylko zmienia jej podstawę: z listy
    pomiarów BitLockera na podpis wystawcy. Zwyczajna aktualizacja
    oprogramowania układowego zachowuje podpis, a listę pomiarów porusza.

    Ukryty koszt fałszywych alarmów: maszyna żądająca klucza po każdej
    aktualizacji uczy obsługę, że to normalne. Żądanie klucza po naruszeniu
    wygląda wtedy tak samo.
  en: |
    I raised the disruption class above the workstation rating. The
    registry entry looks innocent, but the consequence of a bad rollout is
    a machine that will not come up by itself after a restart - and a
    server restarts when nobody is next to it.

    This item adds no protection; it changes the basis of protection, from
    BitLocker's list of measurements to an issuer's signature. An ordinary
    firmware update keeps the signature and disturbs the list.

    The hidden cost of false alarms: a machine demanding the key after
    every update teaches the operators that this is normal. A demand for
    the key after real tampering then looks exactly the same.
