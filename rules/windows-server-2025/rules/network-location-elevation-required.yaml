id: win2025-network-location-elevation-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Zmiana typu sieci wymaga podniesienia uprawnień
    en: Changing a network's type requires raised privileges
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Typ sieci — prywatna, publiczna, domenowa — nie jest etykietą. Jest
    wyborem profilu zapory, a wraz z nim zbioru reguł, które w danej
    sieci obowiązują. Ustawienie zabrania zwykłemu użytkownikowi zmieniać
    ten typ bez podniesienia uprawnień.

    Obniżam tu kategorię względem paczki stanowiska roboczego i uważam,
    że uczciwiej jest to zrobić niż przenieść ocenę bez zmiany.

    Powód jest prosty: na serwerze bez interaktywnych użytkowników nie
    ma nikogo, kto mógłby tę zmianę wykonać. Wszyscy, którzy się tam
    logują, są administratorami, a administrator i tak może zmienić typ
    sieci — punkt nie dotyczy jego, tylko użytkownika bez uprawnień.
    Na takiej maszynie jest to zabezpieczenie przed czynnością,
    której nie ma kto wykonać.

    Wartość wraca tam, gdzie wracają ludzie. Na serwerze terminalowym
    użytkownik przestawiający sieć z publicznej na prywatną rozluźnia
    profil zapory dla całej maszyny — nie dla siebie. To jest ten
    przypadek, dla którego punkt istnieje, i tam jego waga jest realna.

    Jest też druga strona, właściwa serwerom. Maszyna, która straciła
    kontakt z kontrolerem domeny, sama przełącza sieć na inny profil.
    Nie dotyczy to wprawdzie tego ustawienia, bo zmiany dokonuje system,
    a nie człowiek — ale tłumaczy, dlaczego profil sieci na serwerze
    bywa inny, niż ktoś zakłada, i warto to sprawdzić, zanim uzna się
    ustawienie za winne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    na maszynie z interaktywnymi użytkownikami możliwość rozluźnienia
    profilu zapory przez osobę bez uprawnień administratora.
  en: |
    A net's kind - private, public, of the domain - is no label. It is the choosing of the
    firewall's profile and with it of the set of rules that hold in that net. The setting forbids
    an ordinary user to alter that kind without raised privileges.

    I lower the category here against the working station's pack and hold it honester to do so than
    to carry the reckoning over unchanged.

    The ground is simple - on a server with no interactive users there is nobody who could make
    that change. All who sign in there are administrators, and an administrator may alter the net's
    kind anyway; the item bears not on them but on a user without rights. On such a machine it is a
    guard against an act there is nobody to do.

    The worth comes back where people come back. On a terminal server a user setting the net over
    from public to private loosens the firewall's profile for the whole machine - not for
    themselves. That is the case for which the item is there, and there its weight is real.

    There is besides another side, proper to servers. A machine that has lost touch with the
    controller of the domain sets the net over to another profile itself. That does not touch this
    setting, the change being made by the system and not by a person - but it sets forth why a
    server's net profile is at times other than somebody supposes, and it is worth checking before
    the setting is held to blame.

    What an attacker gains while the item goes unmet: on a machine with interactive users, the
    means of loosening the firewall's profile by a person without an administrator's rights.

disruption_description:
  pl: |
    Zmiana jest bezpieczna do zastosowania zbiorczo i powód jest ten sam,
    dla którego obniżyłem kategorię: na serwerze bez interaktywnych
    użytkowników nie ma komu niczego odebrać.

    Administrator zachowuje możliwość zmiany typu sieci. Ustawienie nie
    blokuje jej, tylko wymaga podniesienia uprawnień, a administrator
    i tak je ma.

    Na serwerze terminalowym zmiana coś odbiera i wygląda tak: użytkownik,
    który otwiera właściwości sieci, żeby przestawić jej typ, zobaczy
    prośbę o uprawnienia. W praktyce znaczy to, że tej zmiany nie zrobi.
    Jest to dokładnie zamierzony skutek, a nie skutek uboczny, więc nie
    podnoszę z tego powodu klasy.

    Żadne połączenie nie zostaje zerwane. Profil sieci ustalony wcześniej
    zostaje taki, jaki był — punkt dotyczy zmieniania, a nie stanu
    bieżącego. Maszyna, która ma teraz zły profil, będzie go miała także
    po zmianie i trzeba to poprawić osobno.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    The change is safe to apply in bulk, and the ground is the same for which I lowered the
    category - on a server with no interactive users there is nobody to take anything from.

    An administrator keeps the means of altering the net's kind. The setting does not block it, it
    takes a raising of privileges, and an administrator has them anyway.

    On a terminal server the change takes something away and it looks thus - a user who opens the
    net's properties to set its kind over will see an asking for rights. In practice that means
    they will not make the change. That is exactly the meant effect and no side effect, so I do not
    raise the class on its account.

    No connection is broken. A net profile settled beforehand stays as it was - the item bears on
    the altering and not on the standing state. A machine that has now a wrong profile will have it
    after the change too, and that must be mended apart.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Na serwerze terminalowym użytkownik bez uprawnień zobaczy prośbę o uprawnienia zamiast zmiany typu sieci
      - Administrator zachowuje możliwość zmiany typu sieci, bo podniesienie uprawnień i tak ma
      - Profil sieci ustalony wcześniej zostaje bez zmian, punkt dotyczy zmieniania, a nie stanu bieżącego
      - Na serwerze bez interaktywnych użytkowników zmiana nie odbiera niczego nikomu
    en:
      - On a terminal server a user without rights will see an asking for rights instead of the net's kind altering
      - An administrator keeps the means of altering the net's kind, having the raising of rights anyway
      - A net profile settled beforehand stays unaltered, the item bearing on the altering and not on the standing state
      - On a server with no interactive users the change takes nothing from anybody
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze terminalowym użytkownicy bez uprawnień muszą sami przestawiać typ sieci w ramach pracy
    en:
      - On a terminal server users without rights must set the net's kind over themselves as part of their work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_StdDomainUserSetLocation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_StdDomainUserSetLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The item bears on the altering of the net's kind, not on the standing
    # state. A wrong profile already set stays wrong and is mended apart.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_StdDomainUserSetLocation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Obniżyłem kategorię względem paczki stanowiska roboczego, bo na
    serwerze bez interaktywnych użytkowników nie ma nikogo, kto mógłby
    tę zmianę wykonać — wszyscy logujący się są administratorami,
    a punkt dotyczy użytkownika bez uprawnień. Wartość wraca na serwerze
    terminalowym i tam jest realna.

    Rzecz do sprawdzenia, zanim uzna się to ustawienie za winne: maszyna,
    która straciła kontakt z kontrolerem domeny, sama przełącza sieć na
    inny profil. Robi to system, nie człowiek, więc ustawienie tego nie
    dotyczy.

    Punkt nie naprawia profilu już ustalonego. Maszyna z niewłaściwym
    profilem będzie go miała także po zmianie.
  en: |
    I lowered the category against the working station's pack, there being on a server with no
    interactive users nobody who could make that change - all who sign in are administrators, and
    the item bears on a user without rights. The worth comes back on a terminal server and there it
    is real.

    A thing to check before this setting is held to blame - a machine that has lost touch with the
    controller of the domain sets the net over to another profile itself. The system does it and
    not a person, so the setting bears not on that.

    The item mends no profile already settled. A machine with a wrong profile will have it after
    the change too.
