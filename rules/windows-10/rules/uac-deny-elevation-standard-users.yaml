id: win10-uac-deny-elevation-standard-users

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podniesienie uprawnień użytkownikowi zwykłemu odmawiane
    en: Elevation refused to an ordinary user
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że prośba o podniesienie uprawnień zgłoszona z konta
    zwykłego jest odrzucana od razu, zamiast otwierać okno z pytaniem
    o poświadczenia administratora.

    Różnica dotyczy nie tego, co użytkownik zwykły może zrobić — tego nie
    zmienia żadna z tych dwóch wartości — lecz tego, czy system poprosi go
    o podanie cudzego hasła. Okno proszące o poświadczenia administratora,
    pojawiające się na koncie zwykłym, jest wzorcem wygodnym dla napastnika
    z dwóch powodów.

    Po pierwsze, uczy ludzi odruchu: gdy okno prosi o hasło administratora,
    podaje się je. Odruch ten przenosi się na okna podrobione, a podrobić
    takie okno jest łatwo, bo pojawia się ono w sytuacjach zwykłych
    i codziennych.

    Po drugie, gdy człowiek przy stanowisku zna hasło administracyjne,
    program uruchomiony na jego koncie ma drogę do pełnych uprawnień —
    drogę prowadzącą nie przez błąd w systemie, lecz przez zadane pytanie.
    Odrzucenie prośby tę drogę zamyka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno proszące
    o hasło administratora, wyświetlane na koncie zwykłym w sytuacjach
    codziennych, czyli gotowy wzorzec do podrobienia.
  en: |
    The setting makes a request for elevation raised from an ordinary account be refused at once, instead of
    opening a window asking for an administrator's credentials.

    The difference touches not what an ordinary user may do - neither of the two values changes that - but
    whether the system will ask them for somebody else's password. A window asking for an administrator's
    credentials, appearing on an ordinary account, is a pattern convenient for an attacker on two counts.

    First, it teaches people a reflex: where a window asks for an administrator's password, one gives it. That
    reflex carries over to forged windows, and forging such a window is easy, it appearing in ordinary,
    everyday circumstances.

    Second, where the person at the workplace knows the administrative password, a program run on their account
    has a road to full rights - a road leading not through a fault in the system but through a question put.
    Refusing the request closes that road.

    What an attacker gains while the item goes unmet: a window asking for an administrator's password, shown on
    an ordinary account in everyday circumstances, which is a ready pattern to forge.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", choć sama zmiana jest jednym
    zapisem i cofa się natychmiast. Powód leży w sposobie pracy, nie
    w technice.

    Tam, gdzie obsługa rozwiązuje zgłoszenia, podchodząc do stanowiska
    i wpisując hasło administracyjne w oknie użytkownika, ta droga znika.
    Trzeba mieć inną — zalogowanie się na konto administracyjne, sesję
    zdalną, narzędzie do zarządzania. Nie jest to trudne, ale musi być
    ustalone przed zmianą, bo inaczej pierwsze zgłoszenie po wykonaniu
    utknie.

    Zmienia się też komunikat, który widzi użytkownik. Zamiast okna
    z pytaniem dostaje odmowę, a ta bywa czytana jako awaria. Warto
    uprzedzić ludzi, bo inaczej zgłoszeń przybędzie właśnie w tym punkcie.

    Instalacje wymagające podniesienia przestają być możliwe z konta
    zwykłego w ogóle — również te, na które użytkownik miał hasło.

    Czego to nie psuje: pracy codziennej, aplikacji już zainstalowanych,
    profili, drukowania, sieci, kont administracyjnych.
  en: |
    The class is "needs a planned rollout", though the change itself is a single entry and undoes itself at
    once. The reason lies in the way of working, not in the technique.

    Where the attendance settles requests by walking up to the workplace and typing the administrative password
    into the user's window, that road goes. Another has to be had - logging on to an administrative account, a
    remote session, a management tool. It is not hard, but it has to be settled before the change, else the
    first request after the carrying out will stick.

    The message the user sees changes as well. Instead of a window with a question they get a refusal, and that
    gets read at times as a fault. It is well to forewarn people, else requests will grow in number at just
    this point.

    Installations calling for elevation cease to be possible from an ordinary account at all - including those
    for which the user had the password.

    What this does not break: everyday work, applications already installed, profiles, printing, the network,
    or administrative accounts.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - updates-and-servicing
  what_breaks:
    pl:
      - Obsługa rozwiązująca zgłoszenia przez wpisanie hasła administracyjnego w oknie użytkownika traci tę drogę
      - Użytkownik zwykły widzi odmowę zamiast okna z pytaniem, co bywa czytane jako awaria stanowiska
      - Instalacje wymagające podniesienia przestają być możliwe z konta zwykłego, także te z podanym hasłem
      - Programy starsze proszące o podniesienie przy każdym starcie przestają się uruchamiać na koncie zwykłym
      - Praca codzienna, aplikacje już zainstalowane, profile, drukowanie oraz konta administracyjne pozostają bez zmian
    en:
      - The attendance settling requests by typing the administrative password into the users window loses that road
      - An ordinary user sees a refusal instead of a window with a question, which gets read at times as a fault
      - Installations calling for elevation cease to be possible from an ordinary account, including those with the password to hand
      - Older programs asking for elevation at every start cease starting on an ordinary account
      - Everyday work, applications already installed, profiles, printing and administrative accounts stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa nie ma innej drogi niż wpisanie hasła przy stanowisku, a sesji zdalnej na tych maszynach nie ma
      - Na stanowisku działa program wymagający podniesienia przy każdym starcie i nie da się go na razie zastąpić
    en:
      - The attendance has no road other than typing the password at the workplace and there is no remote session to these machines
      - A program works at the workplace that calls for elevation at every start and cannot for now be replaced
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'ConsentPromptBehaviorUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'ConsentPromptBehaviorUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From this point an ordinary account gets a refusal instead of a window
    # asking for an administrator's password. Settle the road by which the
    # attendance will raise rights before carrying this out.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConsentPromptBehaviorUser' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-behavior-of-the-elevation-prompt-for-standard-users

notes:
  pl: |
    Reguła jest w tym bloku najbardziej sporna i opis powinien to przyznać.
    Kategoria średnia bierze się stąd, że zmiana nie zamyka żadnej drogi
    technicznej — użytkownik zwykły i tak nie miał uprawnień. Zamyka drogę
    przez człowieka, a ta bywa najszersza.

    Zestawienie osi jest tu odwrotne niż przy regule pierwszej: zysk
    umiarkowany, koszt organizacyjny wyraźny. Jest to kandydat do świadomego
    odpuszczenia i aplikacja ma pozwolić tak zdecydować, zapisując powód.

    Pytanie, które trzeba postawić, brzmi nie „czy okno jest groźne", tylko
    „czy nasza obsługa ma inną drogę niż wpisanie hasła przy cudzym
    stanowisku". Odpowiedź przesądza całą sprawę.
  en: |
    The rule is the most disputable in the block and the description ought to own it. The medium category comes
    of this, that the change closes no technical road - an ordinary user had no rights anyway. It closes the
    road through a person, and that one is at times the widest.

    The pairing of the axes is here the reverse of the first rule's: a moderate gain, a plain organisational
    cost. It is a candidate for a deliberate letting go, and the application is to allow that decision with the
    reason written down.

    The question to be put runs not "is the window dangerous" but "has our attendance a road other than typing
    the password at somebody else's workplace". The answer settles the whole matter.
