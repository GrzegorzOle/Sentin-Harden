id: win10-defender-asr-office-executable-content

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada tworzenia plików wykonywalnych przez aplikacje pakietu biurowego
    en: Office applications blocked from creating executable content
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania aplikacjom pakietu biurowego zapisywania na dysk
    plików wykonywalnych.

    Jest to druga połowa drogi opisanej przy blokadzie uruchamiania.
    Napastnik, który nie może uruchomić programu wprost z dokumentu,
    zapisuje go na dysk i uruchamia w kolejnym kroku — przez zadanie
    zaplanowane, przez wpis w autostarcie albo przez samego użytkownika.
    Zamknięcie zapisu odbiera mu ten krok pośredni.

    Reguła obejmuje pliki wykonywalne i skrypty. Dokumenty, arkusze
    i pliki danych zapisują się normalnie; punkt nie dotyczy zwykłej pracy
    z plikami.

    Odnotowuję, dlaczego te dwie reguły idą razem. Osobno każda zostawia
    obejście: bez blokady uruchamiania można uruchomić wprost, bez blokady
    zapisu można odłożyć uruchomienie na później. Razem zamykają
    dokumentowi obie drogi wyjścia na zewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: plik
    wykonywalny zapisany na dysk ręką pakietu biurowego, gotowy do
    uruchomienia w dowolnej chwili.
  en: |
    The rule forbids the office suite's applications to write executable files to the disk.

    It is the second half of the road set out at the blocking of starting. An attacker who cannot start a program
    straight from a document writes it to the disk and starts it at the next step - by a scheduled task, by an
    entry in the self-starting list, or by the user themselves. The closing of the writing takes that middle step
    from them.

    The rule takes in executable files and scripts. Documents, sheets and files of data save as they always did;
    the item does not touch ordinary work with files.

    I set down why those two rules go together. Apart, each leaves a going round: without the blocking of
    starting one may start outright; without the blocking of writing one may put the starting off. Together they
    close a document's both roads outward.

    What an attacker gains while the item goes unmet: an executable file written to the disk by the office
    suite's own hand, ready to be started at any hour.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    coś w organizacji generuje pliki przez pakiet biurowy.

    Zdarza się to rzadziej niż uruchamianie programów, ale zdarza. Makro
    zapisujące skrypt do dalszego przetworzenia, szablon generujący plik
    wsadowy, narzędzie do raportowania wypluwające skrypt z wynikami —
    wszystkie przestaną działać.

    Skutek widzi użytkownik: makro kończy pracę błędem zapisu, a plik nie
    powstaje. Jest to komunikat inny niż przy blokadzie uruchamiania
    i łatwiej po nim trafić do przyczyny, bo mowa wprost o zapisie.

    Odnotowuję, że dokumenty i pliki danych nie są objęte. Użytkownik,
    który usłyszy „pakiet biurowy nie może zapisywać plików", zrozumie to
    szerzej, niż reguła sięga — więc opis w aplikacji powinien nazwać
    zakres wprost.

    Wyjątki wskazuje się po ścieżce, tak samo jak przy blokadzie
    uruchamiania.

    Czego to nie psuje: zapisywania dokumentów i arkuszy, eksportu do
    formatów dokumentowych, drukowania, logowania, udziałów plikowych.
  en: |
    The class is "needs review", and the object of the review is whether anything within the body makes files
    through the office suite.

    It happens the seldomer than the starting of programs, but it happens. A macro writing a script for further
    working, a template making a batch file, a reporting tool spitting out a script with its outcomes - all will
    cease to work.

    The user sees the consequence: the macro ends its work with an error of writing, and the file does not come
    about. It is a message other than at the blocking of starting, and it is the easier to trace to its cause,
    speaking outright of a writing.

    I set down that documents and files of data are not taken in. A user who hears "the office suite cannot write
    files" will take it wider than the rule reaches - so the setting out in the application ought to name the
    reach outright.

    Exceptions are named by a path, just as at the blocking of starting.

    What this does not break: the saving of documents and sheets, export into document formats, printing, logging
    on, or file shares.

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - scripting-and-automation
  what_breaks:
    pl:
      - Makro zapisujące skrypt do dalszego przetworzenia kończy pracę błędem zapisu i plik nie powstaje
      - Szablon generujący plik wsadowy i narzędzie raportujące wypluwające skrypt przestają działać tak samo
      - Dokumenty, arkusze i pliki danych zapisują się normalnie, bo reguła obejmuje wyłącznie pliki wykonywalne i skrypty
      - Wyjątki wskazuje się po ścieżce pliku, tak samo jak przy blokadzie uruchamiania programów
      - Zapisywanie dokumentów, eksport do formatów dokumentowych, drukowanie, logowanie i udziały plikowe pozostają bez zmian
    en:
      - A macro writing a script for further working ends with an error of writing and the file does not come about
      - A template making a batch file and a reporting tool spitting out a script cease to work the same way
      - Documents, sheets and files of data save as they always did, the rule taking in executable files and scripts alone
      - Exceptions are named by a file s path, just as at the blocking of the starting of programs
      - The saving of documents, export into document formats, printing, logging on and file shares stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W organizacji pracują szablony generujące pliki wsadowe, a ich ścieżek nie zebrano jako wyjątków
    en:
      - Templates making batch files work within the body and their paths have not been gathered as exceptions
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '3b576869-a4ec-4529-8536-b80a7769e899'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '3b576869-a4ec-4529-8536-b80a7769e899'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '3b576869-a4ec-4529-8536-b80a7769e899' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła jest parą dla blokady uruchamiania i warto pokazywać je obok
    siebie. Osobno każda zostawia obejście, razem zamykają dokumentowi
    obie drogi.

    Argument wart zachowania dotyczy tego, po co napastnikowi zapis na
    dysk. Nie po to, żeby plik tam leżał. Po to, żeby uruchomienie
    oderwać w czasie od otwarcia dokumentu — bo uruchomienie dzień później,
    przez zadanie zaplanowane, nie kojarzy się już z niczym.

    Odnotowuję zakres, bo jest wąższy, niż brzmi tytuł. Objęte są pliki
    wykonywalne i skrypty, nie dokumenty. Aplikacja powinna to powiedzieć,
    zanim użytkownik odmówi wdrożenia w obawie o zwykłą pracę z plikami.
  en: |
    The rule is the mate of the blocking of starting and it is well to show them side by side. Apart, each leaves
    a going round; together they close a document's both roads.

    The argument worth keeping touches what an attacker wants a writing to the disk for. Not so that the file may
    lie there. So that the starting may be torn away in time from the opening of the document - a starting a day
    later, by a scheduled task, calling nothing to mind.

    I set down the reach, it being narrower than the title sounds. Taken in are executable files and scripts, not
    documents. The application ought to say so before a user turns the rollout down for fear over ordinary work
    with files.
