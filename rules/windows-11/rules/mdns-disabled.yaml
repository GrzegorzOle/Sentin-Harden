id: win11-mdns-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozwiązywanie nazw przez rozgłoszenie grupowe wyłączone
    en: Name resolution by multicast switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Mechanizm rozwiązywania nazw przez rozgłoszenie grupowe pozwala maszynom
    w jednej sieci lokalnej znajdować się nawzajem bez żadnego serwera. Maszyna
    pyta całą sieć „kto jest nazwą X", a odpowiada ten, kto uzna, że to o niego
    chodzi.

    Słabość leży w ostatnim zdaniu. Nie ma tu żadnego uwierzytelnienia i nie ma
    rozjemcy: odpowiada ten, kto odpowie, i pierwsza odpowiedź jest przyjmowana
    jako prawdziwa. Napastnik w tej samej sieci odpowiada na każde zapytanie
    i kieruje ruch do siebie.

    W praktyce wygląda to tak: użytkownik wpisuje nazwę z literówką albo
    program sięga po zasób, którego serwer nazw nie zna. Zapytanie schodzi
    wtedy do mechanizmu rozgłoszeniowego, napastnik odpowiada, a maszyna
    nawiązuje połączenie — przesyłając po drodze poświadczenia, jeżeli protokół
    tego wymaga. Do przejęcia poświadczeń wystarczy więc czyjaś literówka.

    Mechanizm ten jest w sieci firmowej zbędny, bo od rozwiązywania nazw jest
    serwer. Bywa używany przez drukarki sieciowe i urządzenia domowe — i to
    jedyne miejsce, w którym jego wyłączenie coś zmienia.
  en: |
    The mechanism for resolving names by multicast lets machines on one local network
    find each other with no server at all. A machine asks the whole network "who is
    name X", and whoever decides it is about them answers.

    The weakness lies in that last sentence. There is no authentication here and no
    arbiter: whoever answers, answers, and the first answer is taken as true. An
    attacker on the same network answers every query and steers the traffic to
    themselves.

    In practice it looks like this: a user types a name with a slip in it, or a
    program reaches for a resource the name server does not know. The query then
    falls through to the multicast mechanism, the attacker answers, and the machine
    makes the connection - sending credentials on the way if the protocol calls for
    them. So somebody's typing slip is enough to capture credentials.

    The mechanism is needless on a company network, because a server is there for
    resolving names. It does get used by network printers and household devices - and
    that is the only place where switching it off changes anything.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w sieci nie ma urządzeń znajdowanych wyłącznie
    tym mechanizmem.

    Pierwsze w kolejności są drukarki sieciowe. Część z nich, zwłaszcza
    podłączonych bez serwera wydruku, jest odnajdywana właśnie przez
    rozgłoszenie grupowe. Po wdrożeniu przestaną się pojawiać na liście
    dostępnych urządzeń, choć pozostaną osiągalne po adresie.

    Drugie to urządzenia do prezentacji bezprzewodowej, skanery i sprzęt
    biurowy odnajdywany „sam". Trzecie — narzędzia programistyczne
    i środowiska kontenerowe, które nazywają maszyny między sobą w ten sposób.

    Nic nie przestaje być osiągalne po adresie albo po nazwie znanej serwerowi.
    Znika wyłącznie odnajdywanie bez serwera.

    W sieci firmowej z własnym serwerem nazw zmiana przechodzi zwykle
    niezauważona. W sieci małej, bez takiego serwera, bywa odwrotnie.

    Nie ma restartu.
  en: |
    What needs checking is whether the network holds devices found by this mechanism
    alone.

    First in line are network printers. Some of them, especially those attached
    without a print server, are found by exactly this multicast. After the rollout
    they stop appearing in the list of available devices, though they stay reachable
    by address.

    Second are wireless presentation devices, scanners and office equipment found "by
    itself". Third - development tools and container environments that name machines
    among themselves this way.

    Nothing stops being reachable by address or by a name the server knows. Only
    finding without a server disappears.

    On a company network with its own name server the change usually passes
    unnoticed. On a small network without such a server it can be the other way
    round.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Drukarki odnajdywane bez serwera wydruku przestaną pojawiać się na liście dostępnych urządzeń
      - Urządzenia do prezentacji bezprzewodowej i skanery odnajdywane samoczynnie przestaną być widoczne
      - Narzędzia nazywające maszyny między sobą tym mechanizmem przestaną się nawzajem znajdować
      - Wszystko pozostaje osiągalne po adresie albo po nazwie znanej serwerowi
    en:
      - Printers found without a print server stop appearing in the list of available devices
      - Wireless presentation devices and scanners found automatically stop being visible
      - Tools naming machines among themselves by this mechanism stop finding each other
      - Everything stays reachable by address or by a name the server knows
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Drukarki i urządzenia biurowe są w sieci odnajdywane wyłącznie tym mechanizmem
      - Sieć nie ma własnego serwera nazw i maszyny znajdują się nawzajem bez niego
    en:
      - Printers and office devices are found on the network by this mechanism alone
      - The network has no name server of its own and machines find each other without one
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'EnableMDNS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'EnableMDNS'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMDNS' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Mechanizm bywa mylony z rozgłoszeniowym rozwiązywaniem nazw w warstwie
    lokalnej, które ma osobną regułę i osobny wpis. Oba robią to samo
    i oba trzeba wyłączyć — wyłączenie jednego zostawia drugi jako drogę
    zastępczą.

    Wyłączenie dotyczy klienta na tej maszynie. Maszyna przestaje pytać
    i przestaje odpowiadać, ale ruch tego rodzaju nadal krąży po sieci, bo
    generują go inne urządzenia.

    Jeżeli po wdrożeniu drukarki znikają z listy, właściwą naprawą jest
    dodanie ich po adresie albo przez serwer wydruku, a nie cofnięcie punktu.
    Odnajdywanie bez serwera i przejmowanie poświadczeń opierają się na tym
    samym mechanizmie i nie da się zostawić jednego bez drugiego.
  en: |
    The mechanism is sometimes confused with broadcast name resolution at the local
    layer, which has a rule and an entry of its own. Both do the same thing and both
    have to be switched off - closing one leaves the other as a fallback route.

    Switching off concerns the client on this machine. The machine stops asking and
    stops answering, but traffic of that kind still circulates on the network,
    because other devices generate it.

    If printers vanish from the list after the rollout, the right fix is adding them
    by address or through a print server, not undoing the item. Finding without a
    server and capturing credentials rest on the same mechanism and one cannot be
    kept without the other.
