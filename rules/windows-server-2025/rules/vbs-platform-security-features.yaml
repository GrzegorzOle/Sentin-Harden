id: win2025-vbs-platform-security-features

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Wymagane zabezpieczenia platformy dla wirtualizacji
    en: Required platform security features for virtualization
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby warstwa wirtualizacji uruchamiała się wyłącznie
    wtedy, gdy platforma zapewnia bezpieczny rozruch oraz ochronę pamięci
    przed bezpośrednim dostępem urządzeń.

    Zostawiam kategorię wysoką i chcę nazwać, czym ten punkt różni się od
    punktu włączającego samą warstwę, bo z nazwy wyglądają na to samo.

    Tamten mówi „ma działać". Ten mówi „ma działać na uczciwym
    fundamencie". Bez niego warstwa wirtualizacji uruchomi się także tam,
    gdzie platforma nie daje pełnych gwarancji, i będzie działać
    w trybie ograniczonym — co w raporcie wygląda dokładnie tak samo jak
    tryb pełny, bo mechanizm jest włączony i działa.

    Rzecz w tym, czego brak zmienia. Bez bezpiecznego rozruchu można
    podmienić to, co wykonuje się przed systemem, a wtedy warstwa
    chroniąca system uruchamia się już w środowisku przygotowanym przez
    kogoś innego. Bez ochrony pamięci przed bezpośrednim dostępem
    urządzeń można sięgnąć do pamięci z pominięciem procesora — a więc
    z pominięciem wszystkiego, co procesor egzekwuje. W obu wypadkach
    granica, której ma pilnować hipernadzorca, jest omijana od spodu,
    a nie przełamywana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: warstwę
    zabezpieczeń, która działa, ale stoi na fundamencie, którego nikt nie
    sprawdził — i której obejście nie wymaga jej łamania.
  en: |
    The item asks that the layer of unbodying start only where the standing-ground gives a safe rising
    and a warding of the memory against the straight reach of devices.

    I leave the category high and would name wherein that item is unlike the item switching on the
    layer itself, for by their names they look the same.

    That one says "it shall work". This one says "it shall work upon an honest ground". Without it the
    layer of unbodying will start also where the standing-ground gives not the full warranties, and
    will work in a bounded mode - which in the writ-up looks just as the full mode does, the working
    being switched on and running.

    The thing lies in what the want alters. Without a safe rising one may swap out what runs before the
    system, and then the layer warding the system starts within a setting made ready by somebody else.
    Without a warding of the memory against the straight reach of devices one may reach into the memory
    with a passing by of the reckoner's heart - and therefore with a passing by of everything that
    heart holds to. In both cases the bound the over-ruler is to watch is gone about from beneath and
    not broken through.

    What an attacker gains while the item goes unmet - a layer of warding that works but stands upon a
    ground nobody looked into, and whose going about takes no breaking of it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i odnotowuję, że jest
    to w tej grupie punkt, przy którym najczęściej okaże się, że zmiana
    jest niewykonalna na tej maszynie — a to jest inny rodzaj kłopotu
    niż zmiana groźna.

    Wymagania dotyczą platformy, nie systemu. Bezpieczny rozruch jest
    ustawieniem oprogramowania układowego i na starszych serwerach bywa
    niedostępny albo wyłączony, a jego włączenie na maszynie
    zainstalowanej w trybie zgodności ze starszym rozruchem oznacza
    przeinstalowanie systemu, nie przestawienie opcji. Ochrona pamięci
    przed bezpośrednim dostępem urządzeń wymaga sprzętu, który ją
    obsługuje, i na maszynie wirtualnej zwykle nie jest dostępna wcale.

    Skutek jest taki, że po tej zmianie warstwa, która przedtem działała
    połowicznie, przestanie uruchamiać się w ogóle. Objaw jest mylący,
    bo wygląda na regres: było włączone, teraz nie ma. W rzeczywistości
    nie zepsuło się nic — po prostu przestał obowiązywać kompromis,
    o którym nikt nie wiedział.

    Dlatego właściwą kolejnością jest najpierw sprawdzić stan platformy:
    czy maszyna rusza w trybie bezpiecznego rozruchu i czy ochrona
    pamięci jest zgłaszana jako obecna. Punkt stosuje się po tym
    sprawdzeniu, a nie przed nim. Tam, gdzie platforma wymagań nie
    spełnia, właściwym wynikiem pracy jest zapisany wyjątek z datą
    przeglądu wskazującą moment wymiany sprzętu.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I leave the class "needs a witting rolling out" and note that it is in that band the item whereat it
    will oftenest come out that the change may not be done upon that machine - and that is another kind
    of trouble than a grim change.

    The demands bear upon the standing-ground and not upon the system. The safe rising is a setting of
    the firmware and upon older servers is at times not to be had or is switched off, and its switching
    on upon a machine installed in the mode of keeping with the older rising means the installing of
    the system afresh and no setting over of a choice. The warding of the memory against the straight
    reach of devices takes gear that bears it, and upon an unbodily machine is mostly not to be had at
    all.

    The outcome is that after that change the layer that worked before by halves will stop starting
    altogether. The showing misleads, looking like a going backward - it was switched on, now it is not
    there. In truth nothing broke - only the bargain nobody knew of stopped holding.

    Therefore the right ordering is first to look into the state of the standing-ground - whether the
    machine rises in the mode of safe rising and whether the warding of the memory is told of as being
    there. The item is laid on after that looking and not before it. Where the standing-ground meets
    the demands not, the right outcome of the work is a written-down exception with a day of looking
    over naming the hour of the swapping of the gear.

    The change binds after a starting anew and is undone after a further one.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - boot-and-firmware
    - drivers-and-devices
  what_breaks:
    pl:
      - Warstwa wirtualizacji, która przedtem działała w trybie ograniczonym, przestaje uruchamiać się w ogóle
      - Objaw wygląda na regres, choć nie zepsuło się nic — przestał obowiązywać kompromis, o którym nikt nie wiedział
      - Bezpieczny rozruch bywa niedostępny na starszych serwerach, a na maszynie z rozruchem starszego typu wymaga przeinstalowania systemu
      - Ochrona pamięci przed bezpośrednim dostępem urządzeń na maszynie wirtualnej zwykle nie jest dostępna wcale
      - Tam, gdzie platforma wymagań nie spełnia, właściwym wynikiem jest zapisany wyjątek z datą wymiany sprzętu
    en:
      - The layer of unbodying that worked before in a bounded mode stops starting altogether
      - The showing looks like a going backward, though nothing broke - the bargain nobody knew of stopped holding
      - The safe rising is at times not to be had upon older servers, and upon a machine with the older rising it takes the installing of the system afresh
      - The warding of the memory against the straight reach of devices is upon an unbodily machine mostly not to be had at all
      - Where the standing-ground meets the demands not, the right outcome is a written-down exception with a day of the swapping of the gear
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie sprawdzono, czy maszyna rusza w trybie bezpiecznego rozruchu i czy ochrona pamięci jest zgłaszana jako obecna
      - Maszyna jest zainstalowana w trybie zgodności ze starszym rozruchem, a przeinstalowanie systemu nie jest zaplanowane
      - Serwer jest maszyną wirtualną bez dostępnej ochrony pamięci przed bezpośrednim dostępem urządzeń
    en:
      - It was not looked into whether the machine rises in the mode of safe rising and whether the warding of the memory is told of as being there
      - The machine is installed in the mode of keeping with the older rising and no installing afresh is planned
      - The server is an unbodily machine without a warding of the memory against the straight reach of devices to be had
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      $name = 'RequirePlatformSecurityFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    $name = 'RequirePlatformSecurityFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Check the platform first: whether the machine boots with secure boot and
    # whether DMA protection is reported as present. Where it is not, the layer
    # that ran in reduced mode will stop starting at all - that looks like a
    # regression but is the hidden compromise ending.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequirePlatformSecurityFeatures' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Różnica wobec punktu włączającego samą warstwę: tamten mówi „ma
    działać", ten „ma działać na uczciwym fundamencie". Bez niego warstwa
    uruchomi się także tam, gdzie platforma nie daje pełnych gwarancji,
    i będzie działać w trybie ograniczonym — co w raporcie wygląda
    identycznie jak tryb pełny.

    Bez bezpiecznego rozruchu i bez ochrony pamięci przed bezpośrednim
    dostępem urządzeń granica pilnowana przez hipernadzorcę jest omijana
    od spodu, a nie przełamywana.

    Punkt, przy którym najczęściej okaże się, że zmiana jest na tej
    maszynie niewykonalna — a to inny rodzaj kłopotu niż zmiana groźna.
    Właściwym wynikiem jest wtedy wyjątek z datą wymiany sprzętu.
  en: |
    The unlikeness from the item switching on the layer itself - that one says "it shall work", this one
    "it shall work upon an honest ground". Without it the layer will start also where the
    standing-ground gives not the full warranties, and will work in a bounded mode - which in the
    writ-up looks just as the full mode does.

    Without a safe rising and without a warding of the memory against the straight reach of devices the
    bound watched by the over-ruler is gone about from beneath and not broken through.

    The item whereat it will oftenest come out that the change may not be done upon that machine - and
    that is another kind of trouble than a grim change. The right outcome is then an exception with a
    day of the swapping of the gear.
