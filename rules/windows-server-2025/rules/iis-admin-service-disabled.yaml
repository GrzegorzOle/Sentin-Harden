id: win2025-iis-admin-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa administracyjna serwera sieciowego wyłączona
    en: The administrative service of the web server disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę administracyjną serwera sieciowego. Usługa ta
    nie obsługuje witryn — utrzymuje starszy magazyn konfiguracji
    i obsługuje składniki, które z niego korzystają.

    Zostawiam kategorię średnią, niżej niż przy usłudze publikowania,
    i chcę powiedzieć, na czym polega różnica. Usługa publikowania
    przyjmuje żądania z sieci i wykonuje kod aplikacji. Ta nie przyjmuje
    niczego z zewnątrz; działa na miejscu i obsługuje konfigurację.
    Napastnik nie zdobywa na niej wejścia.

    Wartość punktu jest inna i mieści się w zdaniu, które powtarzam
    w tej paczce przy usługach: to, co działa, a nie jest potrzebne, jest
    kodem działającym z wysokimi uprawnieniami, którego nikt nie
    obserwuje. Usługa ta pochodzi ze starszej architektury serwera
    sieciowego i na maszynie utrzymywanej na bieżąco zwykle nie ma już
    zastosowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działający
    składnik o wysokich uprawnieniach, pochodzący ze starszej warstwy
    serwera sieciowego, na maszynie, która z tej warstwy nie korzysta.
  en: |
    The item switches off the service of ruling of the server of the net. That service handles no
    sites - it keeps the older holding of settings and serves the pieces that draw upon it.

    I leave the category middling, lower than at the service of publishing, and would say wherein the
    difference lies. The service of publishing takes askings off the net and carries out the code of
    applications. This one takes nothing from without; it works where it stands and serves the
    settings. An attacker wins upon it no way in.

    The worth of the item is other and lies within a sentence I say over in this pack at services -
    what works and is not needed is code working with high leaves that nobody watches. That service
    comes of an older building of the server of the net and upon a machine kept up to date it mostly
    has no use left.

    What an attacker gains while the item goes unmet - a working piece with high leaves, coming of an
    older layer of the server of the net, upon a machine that draws not upon that layer.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia wobec oceny dla stacji
    roboczej i powód jest jeden, ale wystarczający: ta usługa nie
    zatrzymuje się sama.

    Zależy od niej kilka innych składników serwera sieciowego, w tym
    serwer przesyłania plików starszym protokołem. Zatrzymanie jej
    zatrzymuje je wszystkie naraz, niezależnie od tego, że polecenie
    wymienia tylko jedną nazwę. Jest to jedyna reguła w tej grupie,
    w której skutek wykracza poza usługę wskazaną w punkcie, i właśnie
    dlatego nie wolno jej stosować hurtem.

    Objawem jest zatrzymanie czegoś, czego nikt nie zatrzymywał —
    a to jest najgorszy rodzaj objawu, bo szukanie przyczyny zaczyna się
    od złej usługi. Człowiek widzi, że stanął serwer plików, i szuka
    powodu tam, a powód leży w poleceniu wydanym gdzie indziej.

    Sprawdzenie przed zmianą jest krótkie: wypisz usługi zależne od tej
    i zobacz, czy któraś z nich cokolwiek robi. Jeżeli lista jest pusta
    albo zawiera wyłącznie rzeczy zatrzymane, zmiana jest bezpieczna.

    Zmiana cofa się natychmiast, ale uruchomienie usług zależnych
    z powrotem bywa czynnością osobną — to, że przestały działać razem,
    nie znaczy, że razem wrócą.
  en: |
    I raise the class to a witting rolling out against the reckoning for a workstation, and the
    ground is one but enough - that service stops not alone.

    Upon it there hang some other pieces of the server of the net, among them the server of the
    bearing of files by the older reckoning. Its stopping stops them all at once, whatever the
    command name but one name. It is the one rule in this group whose outcome goes beyond the service
    named in the item, and for that very reason it may not be laid on in bulk.

    The symptom is the stopping of a thing nobody stopped - and that is the worst kind of symptom,
    the seeking of the ground beginning at the wrong service. A person sees that the server of files
    has stood still and seeks the ground there, and the ground lies in a command given elsewhere.

    The checking before the change is short - write out the services that hang upon this one and see
    whether any of them does anything at all. If the list be empty or hold only things stopped, the
    change is safe.

    The change is undone at once, but the starting of the hanging services again is at times a doing
    of its own - their having stopped working together means not that they will come back together.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
  what_breaks:
    pl:
      - Zatrzymanie tej usługi zatrzymuje wszystkie składniki od niej zależne, w tym serwer przesyłania plików starszym protokołem
      - Skutek wykracza poza usługę wskazaną w punkcie, choć polecenie wymienia tylko jedną nazwę
      - Objawem jest zatrzymanie czegoś, czego nikt nie zatrzymywał, więc szukanie przyczyny zaczyna się od złej usługi
      - Uruchomienie usług zależnych z powrotem bywa czynnością osobną
      - Usługa pochodzi ze starszej architektury i na maszynie utrzymywanej na bieżąco zwykle nie ma zastosowania
    en:
      - The stopping of that service stops every piece hanging upon it, among them the server of the bearing of files by the older reckoning
      - The outcome goes beyond the service named in the item, though the command names but one name
      - The symptom is the stopping of a thing nobody stopped, so the seeking of the ground begins at the wrong service
      - The starting of the hanging services again is at times a doing of its own
      - The service comes of an older building and upon a machine kept up to date it mostly has no use
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa składnik zależny od tej usługi, w szczególności serwer przesyłania plików starszym protokołem
      - Nie wypisano usług zależnych i nie sprawdzono, czy któraś z nich cokolwiek robi
    en:
      - A piece hanging upon that service works upon the machine, above all the server of the bearing of files by the older reckoning
      - The hanging services were not written out nor was it looked to whether any of them does anything
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This one does not stop alone: everything depending on it stops too, the
    # older file transfer server among them. List the dependent services first,
    # or the symptom will show up at a service nobody touched.
    Stop-Service -Name 'IISADMIN' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'IISADMIN' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'IISADMIN' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

