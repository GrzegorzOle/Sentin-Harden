id: win10-bitlocker-os-drive-encryption-type

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Szyfrowanie całego dysku systemowego wymuszone
    en: Full encryption of the operating system drive enforced
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza zaszyfrowanie całego dysku, a nie samego obszaru
    zajętego w chwili rozpoczęcia.

    Wariant szybszy szyfruje to, co jest zajęte, i zostawia obszar wolny
    bez zmian. Brzmi to rozsądnie, dopóki nie zapyta się, co w obszarze
    wolnym leży. Leżą tam dane skasowane, ale niezamazane: poprzednia
    zawartość dysku sprzed instalacji systemu, pliki usunięte przed
    włączeniem szyfrowania, pozostałości po plikach roboczych i po pliku
    wymiany.

    Dysk zaszyfrowany częściowo oddaje więc tę zawartość każdemu, kto go
    odczyta poza systemem. Ochrona wygląda na włączoną i w raporcie
    wygląda tak samo, a część danych jest czytelna.

    Odnotowuję, że różnica dotyczy wyłącznie maszyn, na których wcześniej
    coś już było. Dysk nowy, szyfrowany przed pierwszym użyciem, nie ma
    w obszarze wolnym niczego — ale tego warunku nie da się sprawdzić po
    fakcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nieszyfrowany
    obszar wolny dysku wraz z tym, co zostało w nim po danych skasowanych.
  en: |
    The setting enforces the enciphering of the whole disk, and not of the space taken up at the hour of
    beginning.

    The quicker variant enciphers what is taken up and leaves the free space unchanged. That sounds sensible until
    one asks what lies in the free space. There lie data struck out but not written over: the disk's earlier
    contents from before the system was installed, files removed before the enciphering was switched on, leavings
    of working files and of the swap file.

    A disk enciphered in part therefore gives those contents up to anybody who reads it outside the system. The
    guarding looks switched on and looks the same in the report, while a part of the data is readable.

    I set down that the difference touches only machines upon which something already was. A new disk, enciphered
    before its first use, has nothing in its free space - but that condition cannot be checked after the fact.

    What an attacker gains while the item goes unmet: the disk's unenciphered free space together with what was
    left in it after data were struck out.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest czas
    i rozmiar dysku.

    Szyfrowanie całego dysku trwa dłużej niż szyfrowanie obszaru zajętego,
    i różnica jest proporcjonalna do ilości miejsca wolnego. Na dysku
    o pojemności terabajta wypełnionym w jednej czwartej różnica sięga
    kilku godzin.

    Przez ten czas maszyna pracuje, ale wolniej — szyfrowanie zajmuje
    dysk. Nie jest to przerwa w pracy, tylko okres obniżonej wydajności,
    zauważalny przy operacjach dyskowych.

    Odnotowuję, że zmiana zasady dotyczy szyfrowania rozpoczynanego po
    jej wprowadzeniu. Dysk zaszyfrowany wcześniej wariantem szybszym nie
    zostanie doszyfrowany automatycznie — wymaga osobnego polecenia albo
    ponownego zaszyfrowania od zera.

    Jest to sytuacja warta nazwania w raporcie, bo punkt pokaże się jako
    spełniony, a dysk pozostanie zaszyfrowany częściowo.

    Czego to nie psuje: pracy z plikami, wydajności po zakończeniu
    szyfrowania, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is time and the disk's size.

    The enciphering of a whole disk takes longer than the enciphering of the space taken up, and the difference is
    in proportion to the amount of free room. Upon a disk of a terabyte filled a quarter of the way the difference
    reaches some hours.

    Through that time the machine works, but the slower - the enciphering keeps the disk busy. It is no break in
    work but a span of lowered speed, noticeable at doings upon the disk.

    I set down that a change of the policy touches enciphering begun after it was brought in. A disk enciphered
    earlier by the quicker variant will not be enciphered the rest of the way of itself - it calls for a command
    apart or for an enciphering again from nought.

    It is a case worth naming in the report, the item showing as met while the disk stays enciphered in part.

    What this does not break: work with files, speed once the enciphering has ended, logging on, file shares, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - updates-and-servicing
  what_breaks:
    pl:
      - Szyfrowanie całego dysku trwa dłużej o czas proporcjonalny do ilości miejsca wolnego
      - Na dysku terabajtowym wypełnionym w jednej czwartej różnica sięga kilku godzin obniżonej wydajności
      - Dysk zaszyfrowany wcześniej wariantem szybszym nie zostanie doszyfrowany automatycznie
      - Punkt pokaże się wtedy jako spełniony, choć dysk pozostanie zaszyfrowany częściowo
      - Praca z plikami, wydajność po zakończeniu szyfrowania, logowanie i drukowanie pozostają bez zmian
    en:
      - The enciphering of a whole disk takes longer by a time in proportion to the amount of free room
      - Upon a terabyte disk filled a quarter of the way the difference reaches some hours of lowered speed
      - A disk enciphered earlier by the quicker variant will not be enciphered the rest of the way of itself
      - The item will then show as met, though the disk stays enciphered in part
      - Work with files, speed once the enciphering has ended, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny są wdrażane z obrazu na dyski nowe, a czas szyfrowania nie mieści się w oknie wdrożenia
    en:
      - The machines are rolled out from an image onto new disks and the time of enciphering does not fit the rollout window
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'OSEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FULL'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'OSEncryptionType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One means the whole drive, two means the used space alone. The difference
    # shows in what is left behind in the free space, not in what is visible.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'OSEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła opisuje różnicę, której nie widać z zewnątrz, i warto, żeby
    aplikacja to podkreśliła. Dysk zaszyfrowany częściowo i dysk
    zaszyfrowany w całości wyglądają identycznie — w systemie, w oknie
    ustawień i w każdym raporcie patrzącym na sam stan ochrony.

    Argument wart zachowania dotyczy tego, co leży w obszarze wolnym.
    Nie jest on pusty w sensie fizycznym; jest wolny w sensie
    księgowym. Poprzednia zawartość dysku leży tam nadal i daje się
    odczytać narzędziem, które nie pyta systemu o zdanie.

    Odnotowuję sytuację, w której raport wprowadza w błąd: dysk
    zaszyfrowany wcześniej wariantem szybszym pozostaje taki po zmianie
    zasady, a punkt pokazuje stan zgodny. Aplikacja powinna powiedzieć
    wprost, że zasada opisuje szyfrowanie przyszłe, a nie stan bieżący
    dysku.
  en: |
    The rule sets out a difference that does not show from outside, and it is well that the application stress it.
    A disk enciphered in part and one enciphered whole look alike - in the system, in the window of settings and
    in every report looking at the state of the guarding alone.

    The argument worth keeping touches what lies in the free space. It is not empty in a physical sense; it is
    free in a bookkeeping one. The disk's earlier contents lie there still and may be read by a tool that asks the
    system no leave.

    I set down the case in which the report misleads: a disk enciphered earlier by the quicker variant stays so
    after the change of the policy, and the item shows a compliant state. The application ought to say outright
    that the policy sets out enciphering to come and not the disk's present state.
