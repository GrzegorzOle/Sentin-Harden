id: win2025-search-encrypted-items-indexing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Indeksowanie zaszyfrowanych plików wyłączone
    en: Indexing of encrypted files disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania indeksowi wyszukiwania sięgania do zawartości plików
    zaszyfrowanych.

    Kategoria średnia, a powód jest jeden i wart wypowiedzenia wprost:
    indeks jest kopią. Nie skrótem, nie wykazem nazw — kopią fragmentów
    treści, przechowywaną w osobnym pliku bazy indeksu, który nie jest
    zaszyfrowany. Zaszyfrowanie pliku traci sens w chwili, w której jego
    zawartość zostaje przepisana obok, w postaci czytelnej.

    Na serwerze waży to bardziej niż na stanowisku, bo pliki szyfruje się
    tam z konkretnego powodu, a nie odruchowo. Jeżeli ktoś zaszyfrował
    katalog na serwerze plików, to zwykle dlatego, że leży w nim coś, czego
    inni użytkownicy tej maszyny widzieć nie powinni. Indeks omija to
    rozróżnienie w całości: dostęp do bazy indeksu nie wymaga klucza, który
    otwiera oryginał.

    Osobno wart uwagi jest zasięg. Nie chodzi o jeden plik — indeks obejmuje
    wszystko, do czego ma dostęp, więc powstaje jeden zbiór z czytelnymi
    fragmentami całej zaszyfrowanej zawartości maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    treści zaszyfrowanych plików, która nie prowadzi przez szyfrowanie.
  en: |
    The item forbids the search index to reach into the contents of encrypted
    files.

    The category is medium, and the reason is single and worth stating
    plainly: the index is a copy. Not a shortcut, not a list of names - a
    copy of fragments of content, kept in a separate index database file that
    is not encrypted. Encrypting a file loses its point at the moment its
    contents are written out alongside it in readable form.

    On a server this weighs more than on a workstation, because files are
    encrypted there for a definite reason rather than by reflex. If somebody
    encrypted a directory on a file server, it is usually because something
    lies in it that other users of that machine should not see. The index
    goes around that distinction entirely: reaching the index database does
    not need the key that opens the original.

    The reach is worth separate attention. This is not about one file - the
    index covers everything it has access to, so one collection arises
    holding readable fragments of all the encrypted content on the machine.

    What an attacker gains while the item goes unmet: a route to the contents
    of encrypted files that does not run through the encryption.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", ale zaznaczam ten punkt jako odczuwalny
    i chcę powiedzieć dla kogo, bo to nie jest zmiana zupełnie niewidoczna.

    Kto przechowuje zaszyfrowane dokumenty i szuka ich po treści, przestanie
    je tą drogą znajdować. Pliki są na miejscu, otwierają się normalnie,
    nazwy i ścieżki działają — nie działa wyłącznie znajdowanie ich po
    słowie ze środka. Na serwerze plików to przypadek rzadki, bo ludzie
    trafiają tam ścieżką, nie wyszukiwaniem, ale rzadki nie znaczy żaden.

    Klasy nie podnoszę, bo ta strata jest dokładnie tym, co reguła ma
    osiągnąć. Możliwość wyszukania po treści bez klucza była tu skutkiem
    ubocznym, nie funkcją, na której ktoś świadomie oparł pracę.

    Rzecz do zapamiętania przy czytaniu sprawozdania: ten punkt leży
    w gałęzi wyszukiwania razem z trzema innymi z tej grupy. Cztery różne
    wartości pod jedną ścieżką — znajoma ścieżka nie znaczy, że pozostałe
    są zrobione.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", but I mark this item as felt and want to
    say by whom, because it is not an entirely invisible change.

    Anybody who keeps encrypted documents and looks for them by their content
    will stop finding them that way. The files are in place, they open
    normally, names and paths work - what does not work is finding them by a
    word from inside. On a file server that case is rare, because people
    arrive there by a path rather than by search, but rare is not none.

    I do not raise the class, because that loss is exactly what the rule is
    meant to achieve. Being able to search by content without the key was a
    side effect here, not a feature somebody deliberately built their work
    on.

    Something to remember when reading the report: this item lies in the
    search branch together with three others in this group. Four different
    values under one path - a familiar path does not mean the rest are done.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - user-interface
  what_breaks:
    pl:
      - Zaszyfrowane dokumenty przestają być znajdowane po słowie z ich treści
      - Pliki są na miejscu, otwierają się normalnie, a nazwy i ścieżki działają bez zmian
      - Na serwerze plików ludzie trafiają do katalogów ścieżką, nie wyszukiwaniem, więc przypadek jest rzadki
      - Punkt leży w gałęzi wyszukiwania razem z trzema innymi — znajoma ścieżka nie znaczy, że pozostałe są zrobione
    en:
      - Encrypted documents stop being found by a word from their content
      - The files are in place, they open normally, and names and paths work unchanged
      - On a file server people reach directories by a path rather than by search, so the case is rare
      - The item lies in the search branch together with three others - a familiar path does not mean the rest are done
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa proces oparty na wyszukiwaniu zaszyfrowanych dokumentów po ich treści i nie ma dla niego zamiennika
    en:
      - A process on the machine relies on searching encrypted documents by their content and has no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowIndexingEncryptedStoresOrItems'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowIndexingEncryptedStoresOrItems'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The index is a copy of fragments of content kept in an index database that
    # is not encrypted, so reaching it needs no key. Existing index contents are
    # not purged by the setting alone - rebuild the index if that matters.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowIndexingEncryptedStoresOrItems' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Indeks jest kopią — nie skrótem i nie wykazem nazw, tylko kopią
    fragmentów treści, przechowywaną w osobnym pliku bazy indeksu, który nie
    jest zaszyfrowany. Dostęp do tej bazy nie wymaga klucza, który otwiera
    oryginał.

    Zasięg jest tu osobną sprawą: indeks obejmuje wszystko, do czego ma
    dostęp, więc powstaje jeden zbiór z czytelnymi fragmentami całej
    zaszyfrowanej zawartości maszyny.

    Zastrzeżenie praktyczne: samo ustawienie nie usuwa tego, co zostało już
    zaindeksowane. Jeżeli baza indeksu zdążyła zebrać treść zaszyfrowanych
    plików, trzeba ją przebudować.
  en: |
    The index is a copy - not a shortcut and not a list of names, but a copy
    of fragments of content kept in a separate index database file that is
    not encrypted. Reaching that database does not need the key that opens
    the original.

    The reach is a separate matter here: the index covers everything it has
    access to, so one collection arises holding readable fragments of all the
    encrypted content on the machine.

    A practical caveat: the setting alone does not remove what has already
    been indexed. If the index database managed to gather the contents of
    encrypted files, it has to be rebuilt.
