id: win10-audit-other-system-events

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > System
  title:
    pl: Inspekcja pozostałych zdarzeń systemowych
    en: The audit of the remaining system events
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zdarzenia usługi zapory oraz operacje na kluczach
    kryptograficznych wykonywane przez system: uruchomienie i zatrzymanie
    zapory, niepowodzenie wczytania zestawu reguł i błędy przy tworzeniu
    kluczy.

    Zatrzymanie usługi zapory jest tu wpisem, po który sięga się
    najczęściej. Zapora wyłączona nie zostawia po sobie niczego w samym
    wykazie reguł — wykaz pozostaje nietknięty i wygląda poprawnie, a ruch
    nie jest filtrowany. Jest to różnica między granicą zmienioną a granicą
    zdjętą, niewidoczna w żadnym przeglądzie konfiguracji.

    Niepowodzenie wczytania zestawu reguł jest wpisem drugiego rodzaju.
    Mówi, że zapora pracuje w stanie innym niż zapisany — i bywa to jedyny
    ślad po zestawie reguł uszkodzonym celowo.

    Odnotowuję zakres, bo nazwa go nie zdradza. Podkategoria zbiera to,
    co nie zmieściło się gdzie indziej, a w praktyce jest to przede
    wszystkim zapora. Aplikacja opisująca ją jako „pozostałe zdarzenia"
    zniechęca do niej użytkownika bez powodu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zatrzymanie
    zapory bez śladu w wykazie reguł i bez śladu w dzienniku.
  en: |
    The setting writes down the events of the firewall service, and the operations upon cryptographic keys
    carried out by the system: the starting and the stopping of the firewall, the failure to load a set of
    rules, and the faults at the making of keys.

    The stopping of the firewall service is here the entry reached for oftenest. A firewall switched off leaves
    nothing behind it in the roll of rules itself - the roll stays untouched and looks proper, while the traffic
    goes unfiltered. It is the difference between a bound changed and a bound lifted, seen in no looking over of
    the setting.

    The failure to load a set of rules is an entry of a second kind. It says the firewall works in a state other
    than the one written down - and that is at times the only trace of a rule set damaged on purpose.

    I set down the reach, the name not betraying it. The subcategory gathers what did not fit elsewhere, and in
    practice that is above all the firewall. An application setting it out as "the remaining events" puts a user
    off it for no reason.

    What an attacker gains while the item goes unmet: the stopping of the firewall with no trace in the roll of
    rules and none in the log.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zatrzymuje ani nie uruchamia zapory i nie zmienia ani
    jednej jej reguły. Zapisuje wyłącznie zdarzenia usługi.

    Liczba wpisów jest niewielka i związana głównie ze startem
    i zamknięciem maszyny, przy których usługa zapory rusza i staje.

    Odnotowuję źródło szumu, które bywa zaskoczeniem: oprogramowanie
    zarządzające połączeniem sieciowym — klient sieci prywatnej, narzędzie
    producenta karty — potrafi zatrzymywać i uruchamiać usługę zapory przy
    zmianie sieci. Wpisy te są wtedy liczne i powtarzalne.

    Zapisywane są oba wyniki. Uruchomienie i zatrzymanie usługi jest
    powodzeniem, a odmowa wczytania zestawu reguł niepowodzeniem — i oba są
    potrzebne.

    Czego to nie psuje: działania zapory, jej reguł, połączeń sieciowych,
    logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting neither stops nor starts the firewall and changes not one of its rules. It writes down the
    service's events alone.

    The number of entries is small and tied mostly to the start and the shutting down of the machine, at which
    the firewall service moves and halts.

    I set down a source of noise that comes at times as a surprise: software handling a network connection - a
    client of a private network, a tool of a card's maker - may stop and start the firewall service at a change
    of network. Those entries are then many and repeating.

    Both outcomes are written. The starting and the stopping of the service is a success, and the refusal to
    load a set of rules a failure - and both are wanted.

    What this does not break: the firewall's working, its rules, network connections, logging on, file shares,
    or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Klient sieci prywatnej albo narzędzie producenta karty potrafi zatrzymywać i uruchamiać usługę zapory przy zmianie sieci
      - Wpisy są wtedy liczne i powtarzalne, a odróżnienie ich od zatrzymania celowego wymaga spojrzenia na porę
      - Zapisywane są oba wyniki, bo odmowa wczytania zestawu reguł jest niepowodzeniem, a start usługi powodzeniem
      - Ustawienie nie zatrzymuje ani nie uruchamia zapory i nie zmienia ani jednej jej reguły
      - Połączenia sieciowe, logowanie, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A client of a private network or a tool of a card s maker may stop and start the firewall service at a change of network
      - The entries are then many and repeating, and parting them from a stopping on purpose calls for a look at the hour
      - Both outcomes are written, the refusal to load a rule set being a failure and the service s start a success
      - The setting neither stops nor starts the firewall and changes not one of its rules
      - Network connections, logging on, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stale zmienia się sieć i oprogramowanie łączące zatrzymuje usługę zapory kilka razy dziennie
    en:
      - The network upon the machine changes without cease and the joining software stops the firewall service several times a day
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9214-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9214-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9214-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. The start and the stop of the firewall service are
    # a success; its refusal to load a rule set is a failure, and both are wanted.
    auditpol /set /subcategory:"{0CCE9214-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9214-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-other-system-events

notes:
  pl: |
    Reguła jest drugą w tej paczce o nazwie mówiącej mniej niż treść.
    Warto, żeby aplikacja wymieniła zdarzenia zapory zamiast powtarzać słowo
    „pozostałe" — inaczej punkt trafia na koniec listy z powodu nazwy,
    a nie z powodu wartości.

    Argument wart zachowania dotyczy różnicy między wykazem a usługą.
    Reguły zapory są danymi i da się je przejrzeć w każdej chwili. Stan
    usługi jest zdarzeniem i po fakcie nie da się go odtworzyć z niczego
    poza tym zapisem. Maszyna z bezbłędnym wykazem reguł i zatrzymaną
    usługą wygląda w audycie konfiguracji na zabezpieczoną.

    Odnotowuję szum od oprogramowania zmieniającego sieć, bo bywa powodem
    wyłączenia podkategorii po tygodniu. Odróżnienie zatrzymania celowego od
    zatrzymania rutynowego opiera się na porze i na tym, co nastąpiło zaraz
    potem — aplikacja powinna umieć pokazać oba wpisy obok siebie.
  en: |
    The rule is the second in this pack with a name saying less than its substance. It is well that the
    application set out the firewall's events rather than repeat the word "remaining" - failing which the item
    lands at the list's end for its name and not for its worth.

    The argument worth keeping touches the difference between a roll and a service. The firewall's rules are
    data and may be looked over at any hour. The service's state is an event, and after the fact cannot be built
    up again out of anything but this record. A machine with a faultless roll of rules and a stopped service
    looks, in an audit of the setting, guarded.

    I set down the noise from software that changes the network, it being at times the reason for switching the
    subcategory off within a week. The parting of a stopping on purpose from a routine one rests upon the hour
    and upon what followed right after - and the application ought to be able to show both entries side by side.
