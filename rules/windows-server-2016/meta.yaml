id: windows-server-2016
name:
  pl: Windows Server 2016
  en: Windows Server 2016
family: windows
shell: powershell
profile: server

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD

detection:
  command: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 2 = domain controller, 3 = member server. Build 14393.
  match: '^Microsoft Windows Server 2016.*\|14393\|[23]$'

roles:
  command: |
    (Get-WindowsFeature | Where-Object InstallState -eq 'Installed').Name -join ','

notes:
  pl: |
    Najstarszy wspierany cel. Wsparcie rozszerzone kończy się w styczniu 2027,
    więc raport dla tego systemu powinien o tym wspominać — części ryzyk nie da
    się domknąć samą konfiguracją.

    Przy pisaniu reguł: PowerShell 5.1 i starsze polecenia. Składnia działająca
    na Server 2025 potrafi tu zawieść, a część nowszych ustawień po prostu nie
    istnieje — wtedy wynikiem jest NOT_APPLICABLE, nie FAIL.
  en: |
    The oldest supported target. Extended support ends in January 2027, so the
    report for this system should say so - some risks cannot be closed by
    configuration alone.

    When writing rules: PowerShell 5.1 and older cmdlets. Syntax that works on
    Server 2025 may fail here, and some newer settings simply do not exist -
    in that case the result is NOT_APPLICABLE, not FAIL.
