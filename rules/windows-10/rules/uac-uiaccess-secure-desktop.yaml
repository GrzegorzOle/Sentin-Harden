id: win10-uac-uiaccess-secure-desktop

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Programy o dostępie do cudzych okien bez prawa gaszenia bezpiecznego pulpitu
    en: Programs reaching into other windows without leave to switch the secure desktop off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera programom o dostępie do cudzych okien prawo do
    wyłączenia bezpiecznego pulpitu przy monicie o podniesienie uprawnień.

    Jest to furtka zostawiona obok reguły o bezpiecznym pulpicie. Monit ma
    pojawiać się na powierzchni osobnej, niedostępnej dla programów
    użytkownika — i pojawia się tam, chyba że o przeniesienie go na pulpit
    zwykły poprosi program mający to szczególne uprawnienie.

    Pomysł był praktyczny: narzędzie udostępniające ekran nie przekazuje
    bezpiecznego pulpitu, więc operator po drugiej stronie widzi ekran
    zamarły. Przeniesienie monitu na pulpit zwykły ten kłopot rozwiązuje.

    Rozwiązuje go jednak przez zdjęcie dokładnie tej ochrony, o którą
    w monicie chodzi. Gdy monit trafia na pulpit zwykły, programy działające
    na koncie użytkownika znów mogą go podrobić albo potwierdzić za
    człowieka. Uprawnienie do cudzych okien staje się wtedy drogą do
    obejścia bezpiecznego pulpitu bez ruszania jego ustawienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    przeniesienie monitu o podniesienie na powierzchnię, na której da się
    go podrobić, mimo włączonego bezpiecznego pulpitu.
  en: |
    The setting takes from programs with access to other windows the leave to switch the secure desktop off at
    an elevation prompt.

    It is a side door left beside the rule about the secure desktop. The prompt is to appear on a separate
    surface out of reach of a user's programs - and it does appear there, unless a program holding that
    particular right asks for it to be moved onto the ordinary desktop.

    The thought was a practical one: a screen-sharing tool does not pass the secure desktop on, so the operator
    on the other side sees a frozen screen. Moving the prompt onto the ordinary desktop settles that trouble.

    It settles it, though, by taking away exactly the protection the prompt is for. Where the prompt lands on
    the ordinary desktop, programs running on the user's account may once more forge it or confirm it for the
    person. The right to other windows becomes then a road round the secure desktop without its setting being
    touched at all.

    What an attacker gains while the item goes unmet: a way of moving the elevation prompt onto a surface where
    it can be forged, the secure desktop being switched on notwithstanding.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślną i na maszynie nietykanej reguła
    potwierdza stan zastany.

    Skutek, gdy wartość była zmieniona, jest jeden i przewidywalny:
    narzędzie do pracy zdalnej, które nie przekazuje bezpiecznego pulpitu,
    znów pokaże operatorowi ekran zamarły przy monicie. Jest to ten sam
    kłopot, który opisuje reguła o bezpiecznym pulpicie, i rozwiązuje się
    go tak samo — narzędziem, które ten pulpit przekazuje.

    Poza tym przypadkiem zmiana nie jest widoczna dla nikogo. Zwykłe
    programy tego uprawnienia nie mają, więc z furtki nie korzystają.

    Nie ma znanych regresji.

    Czego to nie psuje: samego podniesienia uprawnień, pulpitu zdalnego
    systemu, logowania, aplikacji, drukowania, sieci.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The value called for is the default one, and on an untouched machine the rule confirms the state found.

    The consequence, where the value had been changed, is single and foreseeable: a tool for remote work that
    does not pass the secure desktop on will once more show the operator a frozen screen at a prompt. It is the
    same trouble the rule about the secure desktop describes, and it gets settled the same way - by a tool that
    does pass that desktop on.

    Outside that case the change is visible to nobody. Ordinary programs do not hold the right, so they do not
    use the side door.

    There are no known regressions.

    What this does not break: elevation itself, the system's own remote desktop, logging on, applications,
    printing, or the network.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - remote-management
    - user-interface
  what_breaks:
    pl:
      - Narzędzie zdalne nieprzekazujące bezpiecznego pulpitu znów pokazuje operatorowi ekran zamarły przy monicie
      - Program mający dostęp do cudzych okien traci możliwość przeniesienia monitu na pulpit zwykły
      - Ustawienie było domyślne, więc na maszynie nietykanej zmiana nie robi nic poza potwierdzeniem stanu
      - Samo podniesienie uprawnień, pulpit zdalny systemu i logowanie pozostają bez zmian
      - Aplikacje, drukowanie, praca sieci i profile użytkowników pozostają bez zmian
    en:
      - A remote tool not passing the secure desktop on once more shows the operator a frozen screen at a prompt
      - A program with access to other windows loses the means of moving the prompt onto the ordinary desktop
      - The setting was the default one, so on an untouched machine the change does nothing beyond confirming the state
      - Elevation itself, the systems own remote desktop and logging on stay unchanged
      - Applications, printing, the work of the network and users profiles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana wyłącznie narzędziem zdalnym, które nie przekazuje bezpiecznego pulpitu, a zamiennika nie ma
    en:
      - The machine is handled solely by a remote tool that does not pass the secure desktop on and there is no substitute
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableUIADesktopToggle'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableUIADesktopToggle'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value called for is the default one. Where it had been changed, the
    # reason was as a rule a remote tool that does not pass the secure desktop
    # on - settle that road before carrying this out.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableUIADesktopToggle' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-allow-uiaccess-applications-to-prompt-for-elevation-without-using-the-secure-desktop

notes:
  pl: |
    Punkt zamyka rodzinę kontroli konta i jest jej częścią najbardziej
    techniczną. Warto, żeby aplikacja pokazywała go bezpośrednio przy regule
    o bezpiecznym pulpicie, bo osobno wygląda na drobiazg, a razem tworzą
    parę: jedna włącza ochronę, druga zamyka furtkę pozwalającą ją obejść.

    Odnotowuję, że obie reguły o dostępie do cudzych okien opisują to samo
    uprawnienie z dwóch stron. Pierwsza mówi, skąd program może je wziąć,
    druga — czego mu nie wolno z nim zrobić. Widok odwrotny, od skutku do
    reguł, powinien je pokazywać razem, bo dotyczą jednego obszaru pracy.

    Osiem reguł kontroli konta jest już w paczce w całości.
  en: |
    The item closes the control family and is its most technical part. It is well that the application show it
    right beside the rule about the secure desktop, apart it looking a trifle, while together they make a pair:
    one switches the protection on, the other closes the side door letting it be gone round.

    Worth noting that both rules about access to other windows describe the same right from two sides. The first
    says where a program may take it from, the second what it may not do with it. The reverse view, from
    consequence to rules, ought to show them together, they touching one area of work.

    All eight of the control rules are now in the pack.
