id: win2016-run-once-list-not-processed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Lista programów uruchamianych jednorazowo pomijana
    en: The list of programs started once passed over
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe pomijać listę programów, które mają zostać uruchomione
    jeden raz przy najbliższym logowaniu i zaraz potem usunięte z listy.

    Odmiana jednorazowa jest ciekawsza od trwałej i warto powiedzieć
    dlaczego. Wpis na liście trwałej zostaje i daje się znaleźć. Wpis na
    liście jednorazowej znika w chwili wykonania — więc ten, kto po fakcie
    szuka przyczyny, nie znajduje niczego.

    Jest to właściwość cenna dla instalatorów, bo pozwala dokończyć pracę
    po restarcie, i dokładnie tak samo cenna dla napastnika, bo pozwala
    wykonać kod i zatrzeć wpis jednym ruchem.

    Różnica w skutkach ubocznych jest tu istotna. Lista trwała, pominięta,
    zostawia wpisy na miejscu i wszystko wraca po cofnięciu zasady. Lista
    jednorazowa, pominięta, zostawia wpisy niewykonane — a instalator, który
    na wykonanie czekał, czeka dalej i zostaje w stanie niedokończonym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    kodu przy najbliższym logowaniu, po którym po wpisie nie zostaje ślad.
  en: |
    The setting has the list of programs that are to be started once at the next
    signing in, and then removed from the list, passed over.

    The one-time form is more interesting than the lasting one, and it is worth
    saying why. An entry on the lasting list remains and can be found. An entry on
    the one-time list vanishes at the moment of being carried out - so whoever looks
    for a cause after the fact finds nothing.

    That is a valuable property for installers, letting them finish their work after
    a restart, and exactly as valuable to an attacker, letting them run code and
    efface the entry in one move.

    The difference in side effects matters here. The lasting list, passed over,
    leaves its entries in place and everything returns once the policy is undone.
    The one-time list, passed over, leaves its entries uncarried-out - and an
    installer that was waiting to be carried out waits on, and stays in an
    unfinished state.

    What an attacker gains while the item goes unmet: the running of code at the
    next signing in, after which no trace of the entry remains.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przyczyna jest inna niż przy liście
    trwałej i poważniejsza.

    Lista jednorazowa jest używana zgodnie z przeznaczeniem, i to często.
    Instalatory zapisują na niej to, czego nie da się dokończyć przed
    restartem: podmianę pliku zajętego, rejestrację składnika, sprzątanie po
    starej wersji. Pominięcie listy sprawia, że te czynności nie następują.

    Skutkiem bywa instalacja w stanie pośrednim — pakiet zgłoszony jako
    zainstalowany, a część pracy niewykonana. Rozpoznanie tego jest trudne,
    bo objaw pojawia się w aplikacji, a nie w instalatorze, i to nieraz
    długo po wdrożeniu.

    Dlatego kolejność bywa tu ważna. Jeżeli na maszynie trwa wdrożenie albo
    aktualizacja czekająca na restart, punkt należy wykonać po niej, nie
    przed.

    Rzecz druga: lista jest zwykle pusta, bo żyją na niej wpisy tylko do
    najbliższego logowania. Przegląd przed wykonaniem powie tu mniej niż
    przy liście trwałej — pusta lista nie znaczy, że nic z niej nie
    korzysta.

    Czego to nie psuje: usług, zadań zaplanowanych, instalacji
    niewymagających restartu, skryptów logowania z zasad grupy.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the cause differs from that at the lasting list
    and is graver.

    The one-time list is used as intended, and often. Installers write on it what
    cannot be finished before a restart: the replacing of a file in use, the
    registering of a component, the clearing up after an old version. Passing the
    list over means those acts do not happen.

    The upshot is at times an installation in a middle state - the package reported
    as installed, part of the work undone. Establishing that is hard, the symptom
    appearing in the application rather than in the installer, and often long after
    the rollout.

    So the order can matter here. If a rollout or an update waiting for a restart is
    under way on the machine, the item is to be carried out after it and not before.

    The second thing: the list is as a rule empty, entries living on it only until
    the next signing in. Going over it before execution says less here than at the
    lasting list - an empty list does not mean nothing uses it.

    What this does not break: services, scheduled tasks, installations calling for
    no restart, or sign-in scripts from group policy.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Instalator czekający na restart nie dokończy pracy, a pakiet zostanie zgłoszony jako zainstalowany mimo niewykonanej części
      - Podmiana pliku zajętego, rejestracja składnika i sprzątanie po starej wersji nie następują po restarcie
      - Objaw pojawia się w aplikacji, a nie w instalatorze, i nieraz długo po wdrożeniu
      - Usługi, zadania zaplanowane i instalacje niewymagające restartu pozostają bez zmian
    en:
      - An installer waiting for a restart will not finish its work, and the package will be reported as installed though part of the work is undone
      - The replacing of a file in use, the registering of a component and the clearing up after an old version do not happen after the restart
      - The symptom appears in the application rather than in the installer, and often long after the rollout
      - Services, scheduled tasks and installations calling for no restart stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie trwa wdrożenie albo aktualizacja czekająca na restart i punkt zostałby wykonany przed nią
      - Oprogramowanie na tej maszynie kończy instalację po restarcie właśnie tą drogą i nie zna innej
    en:
      - A rollout or an update waiting for a restart is under way on the machine and the item would be carried out before it
      - Software on this machine finishes its installation after a restart by that very road and knows no other
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'DisableLocalMachineRunOnce'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'DisableLocalMachineRunOnce'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalMachineRunOnce' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/setupapi/run-and-runonce-registry-keys

notes:
  pl: |
    Punkt tworzy parę z regułą o liście trwałej i warto je pokazywać
    razem, ale z wyraźnym rozróżnieniem kosztu. Tamta jest łatwiejsza:
    wpisy zostają, nic się nie gubi. Ta potrafi zostawić instalację
    niedokończoną, a taki stan bywa trudniejszy do naprawienia niż stan
    przed instalacją.

    Wskazówka o kolejności jest tu treścią, nie ozdobą. Reguła wykonana
    w trakcie wdrożenia czekającego na restart przerywa to wdrożenie
    w połowie, a raport nie powie o tym ani słowa. Aplikacja powinna
    zapytać o to przed wykonaniem — jest to jeden z niewielu punktów,
    w których chwila wykonania ma znaczenie.

    Warto też zauważyć, że pusty podgląd listy nie jest tu dowodem
    bezpieczeństwa wykonania. Lista bywa pusta dlatego, że właśnie została
    wykonana, a nie dlatego, że nikt z niej nie korzysta.
  en: |
    The item makes a pair with the rule about the lasting list, and they are worth
    showing together, but with the difference in cost plainly marked. That one is
    easier: the entries remain, nothing is lost. This one can leave an installation
    unfinished, and such a state is at times harder to mend than the state before
    the installation.

    The hint about order is substance here, not ornament. The rule carried out in
    the middle of a rollout waiting for a restart breaks that rollout in half, and
    the report will not say a word about it. The application should ask about that
    before execution - it is one of the few items where the moment of execution
    matters.

    Worth noticing too that an empty preview of the list is no proof here that
    execution is safe. The list is at times empty because it has just been carried
    out, rather than because nobody uses it.
