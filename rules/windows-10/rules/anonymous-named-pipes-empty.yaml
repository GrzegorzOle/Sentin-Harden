id: win10-anonymous-named-pipes-empty

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wykaz kanałów dostępnych bez poświadczeń pusty
    en: The roll of channels reachable without credentials empty
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie opróżnia wykaz nazwanych kanałów, do których wolno sięgnąć
    połączeniem bez poświadczeń.

    Nazwany kanał to punkt wymiany danych między programami, dostępny także
    po sieci. Wykaz ten jest wyjątkiem od zasady ogólnej: mówi, do których
    kanałów wolno sięgnąć, nie uwierzytelniając się wcale.

    Wyjątek powstał dla mechanizmów, które musiały rozmawiać z maszyną,
    zanim którakolwiek strona kogokolwiek rozpoznała — przy nawiązywaniu
    relacji zaufania i przy usługach sprzed wprowadzenia dzisiejszego
    uwierzytelniania. Mechanizmy te są niestosowane, a wpisy po nich zostają.

    Znaczenie każdego wpisu w tym wykazie jest takie samo: jest to usługa
    wystawiona na sieć bez żadnego progu wejścia. Jej odporność na błędne
    dane stanowi wtedy cały dostępny mur, bo uwierzytelnienia przed nią
    nie ma.

    Reguła nie zamyka kanałów. Zdejmuje zwolnienie z uwierzytelniania,
    więc kanały działają dalej dla tych, którzy się przedstawią.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: usługi
    osiągalne po sieci bez uwierzytelnienia, w liczbie równej długości tego
    wykazu.
  en: |
    The setting empties the roll of named channels which may be reached by a connection without credentials.

    A named channel is a point of data exchange between programs, to be had over the network as well. That roll
    is an exception to the general rule: it says which channels may be reached without authenticating at all.

    The exception came about for mechanisms that had to speak with the machine before either side knew anybody -
    at the setting up of trust relationships and at services from before today's authentication was brought in.
    Those mechanisms are unused, and the entries left by them remain.

    Every entry in that roll means the same thing: a service set out on the network with no threshold of entry
    at all. Its hardiness against wrong data is then the whole wall to be had, there being no authentication
    before it.

    The rule does not close the channels. It takes away the release from authenticating, so the channels work on
    for those who name themselves.

    What an attacker gains while the item goes unmet: services reachable over the network without
    authentication, in number equal to that roll's length.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, co jest na tym
    wykazie dzisiaj.

    Wykaz pusty albo zawierający wyłącznie wpisy po mechanizmach
    niestosowanych znaczy, że zmiana nie zrobi nic. Jest to przypadek
    najczęstszy i wtedy reguła jest tania.

    Wpisy dodane świadomie są rzadkie, ale się zdarzają — przy starszym
    oprogramowaniu do zarządzania, przy oprogramowaniu przemysłowym i przy
    narzędziach do kopii zapasowych rozmawiających z maszyną kanałem
    własnym. Takie narzędzie po zmianie zacznie dostawać odmowę i objaw
    będzie natychmiastowy.

    Odnotowuję rzecz wymagającą planowania: usługa udostępniania plików
    czyta ten wykaz przy starcie, więc zmiana wchodzi dopiero po jej
    restarcie. Restart usługi zrywa otwarte połączenia do udziałów tej
    maszyny, więc nie robi się go w porze pracy.

    Czego to nie psuje: samych kanałów, które działają dalej dla połączeń
    uwierzytelnionych, udziałów plikowych, logowania, kont domenowych,
    drukowania, aplikacji.
  en: |
    The class is "needs review", and the review touches what stands on that roll today.

    A roll that is empty, or holds only entries left by unused mechanisms, means the change will do nothing. It
    is the commonest case, and then the rule comes cheap.

    Entries added knowingly are rare but do occur - with older management software, with industrial software and
    with backup tools speaking to the machine by a channel of their own. Such a tool will after the change begin
    getting a refusal, and the symptom will be immediate.

    I set down a thing calling for planning: the file-sharing service reads that roll at its start, so the
    change takes hold only once it has been restarted. Restarting the service tears down open connections to
    this machine's shares, so it does not get done during working hours.

    What this does not break: the channels themselves, which work on for authenticated connections, file shares,
    logging on, domain accounts, printing, or applications.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Narzędzie rozmawiające z maszyną kanałem własnym bez uwierzytelnienia zaczyna dostawać odmowę
      - Restart usługi udostępniania plików, potrzebny do wejścia zmiany, zrywa otwarte połączenia do udziałów tej maszyny
      - Wykaz pusty albo zawierający wyłącznie wpisy po mechanizmach niestosowanych oznacza, że zmiana nie robi nic
      - Kanały pozostają czynne dla połączeń uwierzytelnionych, bo reguła zdejmuje zwolnienie, a nie zamyka kanał
      - Udziały plikowe, logowanie, konta domenowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A tool speaking to the machine by a channel of its own without authenticating begins getting a refusal
      - Restarting the file-sharing service, needed for the change to take hold, tears down open connections to this machines shares
      - A roll that is empty or holds only entries left by unused mechanisms means the change does nothing
      - The channels stay open for authenticated connections, the rule taking away a release and not closing a channel
      - File shares, logging on, domain accounts, printing and applications stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na wykazie jest kanał dodany świadomie przez oprogramowanie potrzebne do pracy i nie ma dla niego zamiennika
      - Nie ma okna serwisowego na restart usługi udostępniania plików, a połączeń do udziałów nie wolno zrywać
    en:
      - The roll holds a channel added knowingly by software needed for the work and there is no substitute for it
      - There is no service window for a restart of the file-sharing service and connections to the shares may not be torn down
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a
      # list with nothing on it mean the same thing here - no pipe is reachable
      # anonymously - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'NullSessionPipes'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'EMPTY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'NullSessionPipes'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = @($current)
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Emptying the roll does not close the channels - it takes away the leave to
    # reach them without authenticating. The file-sharing service reads the roll
    # at its start, so the change takes hold once it has been restarted.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NullSessionPipes' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string[]]@($b.value)) -Type MultiString
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-named-pipes-that-can-be-accessed-anonymously

notes:
  pl: |
    Reguła jest w tym bloku jedyną, przy której liczba niezgodności jest
    wprost liczbą usług wystawionych bez progu wejścia. Warto, żeby
    aplikacja pokazała treść wykazu, a nie samą niezgodność — nazwy kanałów
    mówią, czego dotyczy wyjątek, i dopiero one pozwalają zdecydować.

    Sprawdzenie zwraca „EMPTY" zarówno przy wartości brakującej, jak i przy
    wykazie pustym. Są to dwa różne zapisy o tym samym znaczeniu i rozdzielanie
    ich dawałoby raport, w którym maszyna zgodna wygląda na niezgodną.

    Odnotowuję przerwę. Jest to jedna z niewielu reguł w tej paczce,
    przy której samo wykonanie nie wystarcza — do wejścia zmiany potrzebny
    jest restart usługi, a ten zrywa połączenia. Aplikacja powinna postawić
    to w symulacji wprost, bo użytkownik po wykonaniu zobaczy ponowny audyt
    z wynikiem zgodnym, a maszyna będzie jeszcze zachowywać się po staremu.
  en: |
    The rule is the only one in this block at which the count of mismatches is straight off the count of
    services set out with no threshold of entry. It is well that the application show the roll's contents rather
    than the mismatch alone - the channels' names say what the exception touches, and only they let a decision
    be taken.

    The check returns "EMPTY" both at a missing value and at an empty roll. They are two different writings of
    the same meaning, and parting them would give a report in which a compliant machine looks otherwise.

    I set down the break. It is one of the few rules in this pack at which the carrying out alone does not
    suffice - a restart of the service is needed for the change to take hold, and that tears connections down.
    The application ought to put that outright in the simulation, the user seeing after the carrying out a fresh
    audit with a compliant outcome while the machine still behaves as before.
