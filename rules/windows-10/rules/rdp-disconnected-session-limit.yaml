id: win10-rdp-disconnected-session-limit

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits
  title:
    pl: Rozłączona sesja pulpitu zdalnego kończona po minucie
    en: A disconnected remote desktop session ended after a minute
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Rozłączenie pulpitu zdalnego nie kończy sesji. Zamknięcie okna klienta,
    zerwanie łącza albo uśpienie laptopa zostawia sesję żywą po drugiej stronie:
    otwarte dokumenty, zalogowane programy, poświadczenia trzymane w pamięci
    procesów. Taka sesja czeka — i czeka na każdego, kto zdoła się do niej
    podłączyć.

    Ta zasada każe systemowi zamknąć sesję minutę po rozłączeniu. Kto przejmie
    konto albo maszynę później, nie zastanie gotowego, otwartego stanowiska pracy
    poprzednika. Zabiera to atakującemu najwygodniejszą drogę wejścia, jaką jest
    cudza sesja, której nikt nie zamknął, bo nikt o niej nie pamiętał.

    Minuta jest krótka celowo. Sesja rozłączona to sesja, której nikt w tej chwili
    nie pilnuje, a każda dodatkowa godzina to godzina, w której może ją odnaleźć
    ktoś inny.
  en: |
    A dropped remote desktop connection does not end the session. Closing the
    client window, losing the link or putting the laptop to sleep leaves the
    session alive on the far side, with open documents, signed-in programs and
    credentials held in the memory of running processes. That session waits, and
    it waits for anybody who manages to reach it.

    This rule has the system close the session a minute after the link goes. Take
    over the account or the machine later and you will not find a ready, open desk
    left behind by whoever was there before. It takes from an attacker the most
    comfortable way in there is, which is somebody else s session that nobody
    closed because nobody remembered it.

    The minute is short on purpose. A disconnected session is a session nobody is
    watching, and every extra hour is an hour in which somebody else may find it.

disruption_description:
  pl: |
    Ludzie rozłączają się od pulpitu zdalnego celowo. Zamykają okno, żeby wrócić
    po obiedzie do tego samego widoku, albo zostawiają długie zadanie, które ma
    się liczyć bez nich. Po tej zmianie nic z tego nie przetrwa minuty.

    To najczęściej kwestionowana zasada z rodziny limitów czasu i warto wiedzieć,
    dlaczego. Nie chodzi o to, że użytkownicy są nieostrożni — chodzi o to, że
    sposób pracy z pulpitem zdalnym uczy ich traktować rozłączenie jak zamknięcie
    pokrywy laptopa. Zmiana tego nawyku wymaga uprzedzenia, nie samego ustawienia.
  en: |
    People disconnect from a remote desktop on purpose. They close the window to
    come back after lunch to the same view, or they leave a long job to run
    without them. After this change none of that survives a minute.

    This is the most argued-over rule in the time-limit family and it is worth
    knowing why. It is not that users are careless - it is that working over a
    remote desktop teaches them to treat a disconnect like closing a laptop lid.
    Changing that habit takes warning people, not just writing the setting.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - network-and-firewall
  what_breaks:
    pl:
      - Praca porzucona na chwilę przepada — kto zamknie okno klienta i wróci za kwadrans, zastanie ekran logowania, a nie swoje otwarte dokumenty
      - Długie zadania uruchomione w sesji i zostawione bez nadzoru zostaną zabite razem z sesją; raporty, kompilacje i migracje danych trzeba przenieść do zadań harmonogramu albo do usługi
      - Zerwanie łącza na dłużej niż minutę kończy sesję tak samo jak świadome rozłączenie, a przy słabym łączu mobilnym zdarza się to samo z siebie
      - Niezapisane zmiany w programach działających w sesji giną wraz z nią, bo zamknięcie sesji nie pyta o zapis
      - Reszta pracy zdalnej zostaje bez zmian — zalogowanie, przenoszenie plików, drukowanie i sam sposób łączenia się działają jak wcześniej
    en:
      - Work abandoned for a moment is gone - close the client window, come back a quarter of an hour later and you meet the sign-in screen, not your open documents
      - Long jobs started inside a session and left unattended die with it; reports, builds and data migrations have to move to scheduled tasks or to a service
      - Losing the link for more than a minute ends the session exactly as a deliberate disconnect does, and on a weak mobile link that happens by itself
      - Unsaved changes in programs running inside the session go with it, because closing a session does not ask about saving
      - The rest of remote work is untouched - signing in, moving files, printing and the way the connection is made all work as before
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny, na których sesja zdalna jest środowiskiem długich obliczeń — tam limit zabija pracę, a nie ryzyko
      - Stanowiska operatorskie z łącza niepewnego, gdzie rozłączenia są codziennością, a nie wyjątkiem; najpierw łącze, potem limit
      - Konfiguracje, w których sesje zdalne są zamykane i odtwarzane przez osobne narzędzie zarządzające — dwa mechanizmy liczą czas niezależnie
      - Maszyny bez włączonego pulpitu zdalnego, gdzie ustawienie nic nie zmienia i tylko zaśmieca wykaz polityk
    en:
      - Machines where a remote session is the home of long computations - there the limit kills the work, not the risk
      - Operator stations on an unreliable link, where disconnects are daily rather than rare; fix the link first, then set the limit
      - Setups where remote sessions are closed and restored by a separate management tool - two mechanisms then count the time independently
      - Machines with remote desktop switched off, where the setting changes nothing and only clutters the policy listing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it is the absence of a limit, not
      # the shortest one. Reported apart, so a report cannot read it as a very
      # strict setting.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'MaxDisconnectionTime'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_LIMIT' }
        elseif ([int]$value -le 60000) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'MaxDisconnectionTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxDisconnectionTime' -Value 60000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-session-time-limits

notes:
  pl: |
    Wartość jest w milisekundach, więc minuta to 60000. Zero nie znaczy tu
    najkrótszego limitu, tylko jego brak, i dlatego sprawdzenie zgłasza je osobno
    jako NO_LIMIT zamiast wliczać w wynik. Wartość mniejsza niż wymagana też
    przechodzi — zasada mówi o górnej granicy, nie o dokładnej liczbie.
  en: |
    The value is in milliseconds, so a minute is 60000. Zero does not mean the
    shortest limit here but the absence of one, which is why the check reports it
    apart as NO_LIMIT instead of folding it into the result. A value lower than
    the one required passes too - the rule sets a ceiling, not an exact number.
