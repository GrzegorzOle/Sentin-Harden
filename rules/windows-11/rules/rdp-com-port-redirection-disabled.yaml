id: win11-rdp-com-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów szeregowych w sesji pulpitu zdalnego wyłączone
    en: Serial port redirection in Remote Desktop sessions disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Port szeregowy maszyny łączącej się daje się udostępnić maszynie zdalnej tak,
    jakby był do niej podłączony wprost. Jest to mechanizm pomyślany dla sprzętu,
    którego nie da się przenieść: sterowników maszyn, czytników, urządzeń
    pomiarowych, kluczy sprzętowych.

    Znaczenie dla bezpieczeństwa jest tu mniejsze niż przy dyskach czy schowku
    i trzeba to powiedzieć wprost. Port szeregowy przenosi dane wolno, bez
    struktury katalogów i bez wygodnego sposobu zapisania pliku po drugiej
    stronie. Nie jest drogą, którą ktokolwiek wybierze do wyniesienia danych,
    mając do dyspozycji cokolwiek innego.

    Wartością punktu jest co innego: zawężenie tego, co sesja pulpitu zdalnego
    w ogóle łączy. Każde przekierowane urządzenie to sterownik pracujący po
    stronie zdalnej na danych pochodzących z maszyny, nad którą strona zdalna nie
    ma kontroli. Im mniej takich urządzeń, tym mniej miejsc, w których błąd
    sterownika ma znaczenie.

    Na maszynie, do której nikt nie podłącza sprzętu szeregowego — czyli na
    większości — punkt zamyka możliwość, z której nikt nie korzysta.
  en: |
    The serial port of the connecting machine can be shared with the remote machine as
    though it were attached to it directly. This is a mechanism meant for equipment that
    cannot be moved: machine controllers, readers, measuring devices, hardware keys.

    Its weight for security is smaller here than with drives or the clipboard, and that
    is worth saying outright. A serial port carries data slowly, with no directory
    structure and no handy way of saving a file on the other side. It is not a route
    anybody will choose for taking data out while anything else is at hand.

    The item's worth lies elsewhere: in narrowing what a Remote Desktop session joins
    together at all. Every redirected device is a driver working on the remote side on
    data coming from a machine the remote side has no control over. The fewer such
    devices, the fewer places where a fault in a driver matters.

    On a machine nobody attaches serial equipment to - that is, on most of them - the
    item closes a possibility nobody uses.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek korzysta przez sesję zdalną ze sprzętu
    podłączonego portem szeregowym.

    W zdecydowanej większości przypadków odpowiedź brzmi „nie" i zmiana nie robi
    nic. Porty szeregowe zniknęły ze stacji roboczych, a tam, gdzie zostały,
    najczęściej występują jako przejściówka na złącze uniwersalne i obsługuje je
    ten drugi mechanizm.

    Tam, gdzie sprzęt szeregowy jest używany, skutek jest zerojedynkowy:
    urządzenie po prostu przestaje być widoczne w sesji, a program, który je
    obsługuje, zgłosi brak portu. Nie ma tu stopniowania ani obejścia po stronie
    użytkownika — trzeba albo cofnąć zmianę, albo przenieść obsługę urządzenia
    na maszynę, do której jest podłączone.

    Dotyczy to przede wszystkim sprzętu przemysłowego, laboratoryjnego
    i starszych urządzeń fiskalnych, czyli miejsc, w których wymiana sprzętu nie
    jest szybka. Warto to rozpoznać przed wdrożeniem, bo objawem jest zatrzymanie
    pracy, a nie jej utrudnienie.

    Nie ma restartu, ale sesje już otwarte zachowują przekierowane porty do
    rozłączenia.
  en: |
    What needs checking is whether anybody uses equipment attached by a serial port
    through a remote session.

    In the vast majority of cases the answer is no and the change does nothing. Serial
    ports have gone from workstations, and where they remain they most often appear as
    an adapter on a universal connector, handled by that other mechanism.

    Where serial equipment is used, the effect is all or nothing: the device simply
    stops being visible in the session, and the program driving it reports the port
    missing. There is no gradation here and no way round it on the user's part - either
    the change has to be undone, or the handling of the device moved to the machine it
    is attached to.

    This concerns industrial and laboratory equipment above all, along with older till
    devices, that is, places where replacing hardware is not quick. It is worth
    recognising before the rollout, because the symptom is work stopping rather than
    work being made harder.

    There is no restart, but sessions already open keep their redirected ports until
    they disconnect.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - legacy-applications
  what_breaks:
    pl:
      - Urządzenie podłączone portem szeregowym przestaje być widoczne w sesji zdalnej
      - Program obsługujący sterownik maszyny przez port szeregowy zgłosi brak portu
      - Klucz sprzętowy na złączu szeregowym nie zostanie odnaleziony po stronie zdalnej
      - Na maszynie bez sprzętu szeregowego nie zmienia się nic
    en:
      - A device attached by a serial port stops being visible in a remote session
      - A program driving a machine controller over a serial port reports the port missing
      - A hardware key on a serial connector is not found on the remote side
      - On a machine with no serial equipment nothing changes at all
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Sterownik maszyny albo urządzenie pomiarowe jest obsługiwane portem szeregowym przez sesję zdalną
      - Licencja programu jest sprawdzana kluczem sprzętowym na złączu szeregowym maszyny łączącej się
    en:
      - A machine controller or measuring device is driven over a serial port through a remote session
      - A program's licence is checked by a hardware key on the connecting machine's serial connector
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableCcm'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableCcm'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableCcm' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Punkt dotyczy portów szeregowych rozpoznanych przez system jako takie.
    Urządzenie podłączone przejściówką na złącze uniwersalne bywa widziane
    dwojako i wtedy o jego przekierowaniu rozstrzyga reguła dotycząca urządzeń
    rozpoznawanych samoczynnie, a nie ta.

    Nazwa wpisu odwołuje się do dawnego określenia portu komunikacyjnego, przez
    co łatwo pomylić go z ustawieniami dotyczącymi komunikacji sieciowej.
    Pierwsze trzy litery nazwy odnoszą się do złącza szeregowego, nie do
    protokołu.

    Wpis jest częścią gałęzi wspólnej dla wszystkich ustawień pulpitu zdalnego,
    więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The item concerns serial ports the system recognises as such. A device attached by
    an adapter to a universal connector is sometimes seen both ways, and then its
    redirection is settled by the rule concerning devices recognised automatically
    rather than by this one.

    The entry's name harks back to an old term for a communications port, which makes it
    easy to confuse with settings concerning network communication. The first three
    letters of the name refer to the serial connector, not to a protocol.

    The entry belongs to a key shared by every Remote Desktop setting, so rollback
    removes the entry alone.
