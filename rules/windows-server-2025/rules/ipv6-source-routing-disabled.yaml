id: win2025-ipv6-source-routing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Trasowanie źródłowe IPv6 wyłączone
    en: IPv6 source routing disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi odrzucać pakiety szóstej wersji protokołu,
    w których nadawca sam wyznaczył drogę.

    Mechanizm jest ten sam co w wersji czwartej i tak samo się go
    nadużywa: wyznaczenie drogi powrotnej pozwala podać fałszywy adres
    nadawcy i mimo to odebrać odpowiedź, a przez to obejść reguły
    dostępu oparte na adresie.

    Powód, dla którego ten punkt jest osobny, jest praktyczny i warto go
    nazwać wprost. Utwardza się zwykle wersję czwartą, bo to ona jest
    widoczna w dokumentacji sieci, w regułach filtrów i w głowach
    ludzi. Wersja szósta zostaje pominięta — mimo że jest włączona
    domyślnie, ma pierwszeństwo przy nawiązywaniu połączeń i działa
    także tam, gdzie nikt jej świadomie nie wdrażał.

    Na serwerze pominięcie to jest szczególnie kosztowne. Reguły filtra
    bywają pisane wyłącznie dla wersji czwartej, więc usługa opisana
    jako „dostępna tylko z sieci zarządzania" bywa w wersji szóstej
    dostępna bez żadnego ograniczenia. Nadzór jest przy tym zwykle
    słabszy: narzędzia zbierające ruch bywają skonfigurowane pod jeden
    protokół.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tę samą
    możliwość co w wersji czwartej, ale w protokole rzadziej
    filtrowanym i rzadziej obserwowanym.
  en: |
    The setting bids the system turn away packets of the protocol's sixth version in which the
    sender has themselves laid down the road.

    The mechanism is the same as in the fourth version and is misused the same way: the laying
    down of a road back lets a false sender's address be given and the answer taken nonetheless,
    and thereby rules of access resting on an address be gone round.

    The reason this item stands apart is practical and worth naming outright. It is the fourth
    version that is usually hardened, that being what is seen in a network's writings, in a
    filter's rules and in people's heads. The sixth version is passed over - though it is on by
    default, holds precedence at the opening of connections and works also where nobody rolled it
    out knowingly.

    On a server that passing over costs dear. A filter's rules are at times written for the
    fourth version alone, so a service set down as "to be had only from the management network"
    is at times to be had in the sixth version with no bound at all. The watching is withal
    usually weaker: tools gathering traffic are at times set up for one protocol.

    What an attacker gains while the item goes unmet: the same means as in the fourth version,
    but in a protocol seldomer filtered and seldomer watched.

disruption_description:
  pl: |
    Sprawdzenia wymaga tu jedna rzecz i nie jest nią skutek zmiany:
    wartość czyta stos sieciowy przy starcie, więc zmiana zaczyna
    działać dopiero po ponownym uruchomieniu maszyny.

    Z tego powodu podniosłem klasę względem paczki stanowiska
    roboczego. Skutek samej zmiany jest żaden.

    Wyznaczania drogi przez nadawcę nie używa w tej wersji protokołu
    nic, co pracuje w sieciach produkcyjnych. Nagłówek trasowania
    w postaci nadającej się do takiego nadużycia został zresztą
    w samym protokole uznany za wycofany i urządzenia odrzucają go
    domyślnie.

    Zmiana nie wyłącza szóstej wersji protokołu i nie należy jej z tym
    mylić. Adresacja, rozwiązywanie nazw i zwykły ruch działają po niej
    bez różnicy — odrzucany jest wyłącznie pakiet z wyznaczoną drogą.
    Jest to rozróżnienie warte podkreślenia, bo wyłączenie całej wersji
    szóstej bywa wykonywane „przy okazji" i potrafi zepsuć rzeczy, które
    działały.

    Zmiana nie dotyczy tras wpisanych ręcznie ani trasowania między
    interfejsami.
  en: |
    One thing needs checking here and it is not the effect of the change: the network stack reads
    the value at its starting, so the change begins working only after a fresh start of the
    machine.

    For that reason I raised the class against the working station's pack. The effect of the
    change itself is none.

    Nothing working in production networks uses the laying down of a road by the sender in this
    version of the protocol. The routing header in the form fit for such misuse was withal held
    to be withdrawn within the protocol itself, and devices turn it away by default.

    The change does not switch the sixth version of the protocol off and must not be confused
    with that. Addressing, the resolving of names and ordinary traffic all work after it with no
    difference - what is turned away is the packet with a road laid down alone. That difference
    is worth marking, the switching off of the whole sixth version being at times done "along the
    way" and able to break things that worked.

    The change does not bear on routes written by hand or on routing between interfaces.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Adresacja, rozwiązywanie nazw i zwykły ruch szóstej wersji protokołu działają bez różnicy
      - Odrzucany jest wyłącznie pakiet z drogą wyznaczoną przez nadawcę
      - Trasy wpisane ręcznie i trasowanie między interfejsami pozostają bez zmiany
      - Zmiana zaczyna działać dopiero po ponownym uruchomieniu maszyny
    en:
      - Addressing, the resolving of names and ordinary traffic of the sixth version work with no difference
      - What is turned away is the packet with a road laid down by the sender alone
      - Routes written by hand and routing between interfaces stay unchanged
      - The change begins working only after a fresh start of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases in which this setting is a mistake on a server
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
      $name = 'DisableIPSourceRouting'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
    $name = 'DisableIPSourceRouting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value bears on the routing header alone. It does not switch the
    # sixth version of the protocol off - addressing and ordinary traffic
    # work on unchanged.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters' `
      -Name 'DisableIPSourceRouting' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Punkt jest osobny od wersji czwartej z powodu praktycznego:
    utwardza się zwykle wersję czwartą, bo to ona jest widoczna
    w dokumentacji i w regułach filtrów. Wersja szósta zostaje pominięta,
    choć jest włączona domyślnie i ma pierwszeństwo przy nawiązywaniu
    połączeń.

    Zmiana nie wyłącza szóstej wersji protokołu i nie wolno jej z tym
    mylić. Odrzucany jest wyłącznie pakiet z wyznaczoną drogą.

    Na serwerze waży to, że reguły filtra bywają pisane wyłącznie dla
    wersji czwartej, a nadzór zbiera ruch jednego protokołu.
  en: |
    The item stands apart from the fourth version for a practical reason: it is the fourth
    version that is usually hardened, that being what is seen in the writings and in a filter's
    rules. The sixth version is passed over, though it is on by default and holds precedence at
    the opening of connections.

    The change does not switch the sixth version of the protocol off and must not be confused
    with that. What is turned away is the packet with a road laid down alone.

    On a server what weighs is that a filter's rules are at times written for the fourth version
    alone, and the watching gathers the traffic of one protocol.
