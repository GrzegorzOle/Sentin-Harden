id: win2025-laps-post-authentication-reset-delay

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Zwłoka przed sprzątaniem po użyciu hasła najwyżej osiem godzin
    en: Delay before clearing up after the password's use at most eight hours
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza zwłokę między użyciem hasła lokalnego administratora
    a posprzątaniem po nim do ośmiu godzin. Wartość liczona jest
    w godzinach.

    Zostawiam kategorię średnią, bo ten punkt sam z siebie nic nie zamyka —
    on ustala, jak długo trwa okno otwarte przez regułę o sprzątaniu.
    Trzeba je czytać razem: tamta mówi, co się stanie, ta mówi kiedy.

    Jest tu jedna rzecz, którą trzeba znać, bo wygląda odwrotnie, niż
    podpowiada rozsądek. Zero nie oznacza tu „sprzątaj natychmiast".
    Zero wyłącza sprzątanie całkowicie. Ktoś, kto zechce zaostrzyć zasadę,
    wpisując wartość najmniejszą, wyłączy ją zamiast zaostrzyć — a raport
    pokaże wpis obecny. To jest dokładnie ten rodzaj pomyłki, który się
    nie ujawnia, dopóki nie zajrzy się w to miejsce drugi raz.

    Ośmiu godzin nie wybrano przypadkiem: to długość jednej zmiany. Osoba,
    która odczytała hasło na początku swojego dyżuru, ma je ważne do jego
    końca, a nie dłużej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dłuższe
    okno, w którym hasło odczytane z katalogu wciąż działa, mimo że już
    rozeszło się poza niego.
  en: |
    The item limits the delay between the use of the local administrator
    password and the clearing up after it to eight hours. The value is
    counted in hours.

    I keep the category medium, because this item closes nothing by itself
    - it settles how long the window opened by the clearing-up rule lasts.
    The two have to be read together: that one says what will happen, this
    one says when.

    There is one thing here that has to be known, because it works the
    opposite way round from what common sense suggests. Zero does not mean
    "clear up at once". Zero switches the clearing up off entirely.
    Somebody wanting to tighten the policy by writing the smallest value
    will switch it off instead of tightening it - and the report will show
    the entry present. This is exactly the kind of mistake that does not
    come to light until somebody looks at the place a second time.

    Eight hours were not chosen by accident: that is the length of one
    shift. Whoever read the password at the start of their rota has it
    valid until the end of it and no longer.

    What an attacker gains while the item goes unmet: a longer window in
    which a password read from the directory still works, although it has
    already spread beyond it.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", bo dobór tej wartości jest
    decyzją o tym, jak pracuje obsługa, a nie ustawieniem technicznym.

    Zwłoka musi być dłuższa niż najdłuższa czynność prowadzona kontem
    lokalnego administratora na tej maszynie. Na serwerze taką czynnością
    nie jest zalogowanie się i sprawdzenie dziennika, tylko odtworzenie
    kopii, migracja albo aktualizacja oprogramowania układowego
    z restartem w środku. Jeżeli te prace trwają dłużej niż wpisana zwłoka,
    zostaną przerwane wylogowaniem w najmniej dogodnym momencie —
    a przyczyna nie będzie widoczna w żadnym komunikacie.

    Osiem godzin jest górną granicą punktu i zarazem wartością, która
    zwykle wystarcza. Krótsza również spełnia wymaganie, ale krótszej nie
    dobiera się „dla bezpieczeństwa" — dobiera się ją, znając czas
    najdłuższych prac.

    Ostrzeżenie warte powtórzenia: zero nie zaostrza tej reguły, tylko ją
    wyłącza. Kto chce zaostrzyć, wpisuje jeden, nie zero.

    Zmiana nie wymaga przerwy, nikt jej nie zauważy do chwili, w której
    zadziała, i cofa się natychmiast.
  en: |
    I keep the class "needs review", because choosing this value is a
    decision about how the operators work rather than a technical setting.

    The delay has to be longer than the longest activity carried out under
    the local administrator account on this machine. On a server that
    activity is not signing in and checking a log but restoring a backup,
    migrating, or updating firmware with a restart in the middle. If such
    work lasts longer than the delay written here, it will be cut off by a
    sign-out at the least convenient moment - and the cause will not be
    visible in any message.

    Eight hours is the item's upper bound and at the same time a value that
    usually suffices. A shorter one meets the requirement too, but a
    shorter one is not picked "to be safe" - it is picked knowing how long
    the longest works take.

    A warning worth repeating: zero does not tighten this rule, it switches
    it off. Whoever wants to tighten it writes one, not zero.

    The change needs no outage, nobody will notice it until the moment it
    acts, and it is undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Prace prowadzone kontem lokalnego administratora dłuższe niż wpisana zwłoka zostaną przerwane wylogowaniem
      - Na serwerze jest to odtworzenie kopii, migracja albo aktualizacja oprogramowania układowego z restartem w środku
      - Przyczyna przerwania nie będzie widoczna w żadnym komunikacie skierowanym do człowieka
      - Zero nie zaostrza tej reguły, tylko wyłącza sprzątanie całkowicie, a raport pokaże wpis obecny
    en:
      - Work under the local administrator account lasting longer than the delay will be cut off by a sign-out
      - On a server that means a restore, a migration, or a firmware update with a restart in the middle
      - The cause of the interruption will not be visible in any message addressed to a human being
      - Zero does not tighten this rule but switches the clearing up off entirely, while the report shows the entry present
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, jak długo trwają najdłuższe prace prowadzone na tej maszynie kontem lokalnego administratora
      - Prace te regularnie przekraczają osiem godzin i nie da się ich wznowić po wylogowaniu konta
    en:
      - It has not been established how long the longest works under the local administrator account on this machine take
      - Such works regularly exceed eight hours and cannot be resumed after the account is signed out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is counted in hours. Zero means no delay at all, and with it
      # the clearing up does not happen - so zero is not a compliant state.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PostAuthenticationResetDelay'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ^[1-8]$
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PostAuthenticationResetDelay' -ErrorAction SilentlyContinue).'PostAuthenticationResetDelay'
    [pscustomobject]@{
      path        = $path
      name        = 'PostAuthenticationResetDelay'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero here does not tighten the rule - it switches the clearing up off
    # while leaving the entry present in the report. To tighten it, write one.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Eight is the upper bound the item takes and matches one shift.
    Set-ItemProperty -Path $path -Name 'PostAuthenticationResetDelay' -Value 8 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Czytać razem z regułą o sprzątaniu: tamta mówi, co się stanie, ta mówi
    kiedy.

    Rzecz działająca odwrotnie, niż podpowiada rozsądek: zero nie oznacza
    „sprzątaj natychmiast", tylko wyłącza sprzątanie całkowicie. Kto chce
    zaostrzyć zasadę, wpisuje jeden, nie zero — a raport i tak pokaże wpis
    obecny.

    Osiem godzin to długość jednej zmiany. Zwłokę dobiera się, znając czas
    najdłuższych prac prowadzonych tym kontem, a nie „dla bezpieczeństwa".
  en: |
    To be read together with the clearing-up rule: that one says what will
    happen, this one says when.

    Something that works the opposite way round from what common sense
    suggests: zero does not mean "clear up at once" but switches the
    clearing up off entirely. Whoever wants to tighten the policy writes
    one, not zero - and the report will show the entry present regardless.

    Eight hours is the length of one shift. The delay is picked knowing how
    long the longest works under this account take, not "to be safe".
