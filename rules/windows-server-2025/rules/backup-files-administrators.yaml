id: win2025-backup-files-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie kopii zapasowych plików tylko dla administratorów
    en: Backing up files restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala odczytać dowolny plik i dowolną gałąź rejestru
    z pominięciem uprawnień ustawionych na tych zasobach.

    Powstało dlatego, że inaczej nie dałoby się zrobić kopii zapasowej.
    Program kopiujący musi przeczytać wszystko, również katalogi, do
    których jego konto nie ma dostępu — a nadawanie mu uprawnień do
    każdego z osobna byłoby nie do utrzymania.

    Ceną jest to, że prawo nie odróżnia kopiowania od czytania. Konto,
    które je ma, może odczytać każdy plik na maszynie: bazę kont
    lokalnych, klucze prywatne, dokumenty, gałęzie rejestru
    przechowujące materiał poświadczeń. Nie musi przy tym niczego
    kopiować — wystarczy, że otworzy plik.

    Na serwerze konsekwencja jest większa niż na stanowisku roboczym,
    bo większa jest zawartość. Serwer plików trzyma dane całej
    organizacji, serwer aplikacyjny — bazy i klucze, a kontroler domeny
    bazę katalogu wraz z materiałem poświadczeń wszystkich kont.

    Punkt nie każe prawa usunąć, tylko zawęzić do administratorów.
    Kopie zapasowe robi się bowiem na serwerze zawsze i muszą działać
    dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    całej zawartości serwera z pominięciem uprawnień, z konta, które
    z pozoru służy wyłącznie do kopiowania.
  en: |
    The right allows any file and any registry branch to be read while the rights set on those
    resources are passed over.

    It came about because otherwise no backup could be made. A copying program must read
    everything, including directories its account has no access to - and granting it rights to
    each of them apart would be past keeping up.

    The price is that the right does not tell copying from reading. An account holding it may
    read every file on the machine: the base of local accounts, private keys, documents,
    registry branches holding credential matter. It need copy nothing at that - it is enough
    that it open the file.

    On a server the consequence is greater than at a working station, since the contents are
    greater. A file server holds a whole organisation's data, an application server its
    databases and keys, and a domain controller the directory's base together with the
    credential matter of every account.

    The item does not bid the right be removed but narrowed to administrators. Backups, after
    all, are always made on a server and must go on working.

    What an attacker gains while the item goes unmet: the reading of the server's whole
    contents while rights are passed over, from an account that seemingly serves for copying
    alone.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, na jakim koncie pracuje agent kopii
    zapasowych, bo zawężenie prawa do administratorów przesądza, czy
    kopie będą się dalej wykonywać.

    Na serwerze jest to pytanie realne, w odróżnieniu od stanowiska
    roboczego. Oprogramowanie kopii zapasowych na serwerze pracuje
    zwykle na koncie własnym, utworzonym przy instalacji, i to konto
    bywa celowo umieszczone poza grupą administratorów — właśnie po to,
    żeby nie miało uprawnień szerszych, niż potrzebuje.

    Zamiar jest słuszny, ale skutek odwrotny do zamierzonego: konto
    takie i tak ma dostęp do wszystkiego przez to prawo, a przy tym nie
    podlega kontroli, której podlegają konta administracyjne.

    Po zawężeniu agent przestanie odczytywać pliki, do których jego
    konto nie ma uprawnień. Objaw jest przy tym częściowy i przez to
    najgorszy z możliwych: kopia wykonuje się, kończy powodzeniem
    i pomija część danych. Zauważa się to dopiero przy odtwarzaniu.

    Kolejność wdrożenia jest więc taka: najpierw ustalić konto agenta
    i przenieść je do grupy, w której ma zostać, potem zawęzić prawo.
    Wdrożenie odwrotne daje kopie niekompletne bez ostrzeżenia.
  en: |
    What needs checking is what account the backup agent works under, since narrowing the right
    to administrators settles whether backups will go on being made.

    On a server that is a real question, unlike at a working station. Backup software on a
    server usually works under an account of its own, made at the installation, and that
    account is at times deliberately placed outside the administrators' group - just so that it
    should not have rights wider than it takes.

    The intent is sound but the effect the reverse of what was meant: such an account has
    access to everything through this right all the same, and is at that not under the control
    administrative accounts are under.

    After the narrowing the agent will stop reading files its account has no rights to. The
    symptom is at that partial and thereby the worst there is: the backup is made, ends in
    success and passes some of the data over. It is noticed only at a restoring.

    The order of the rollout is thus: first settle the agent's account and move it to the group
    it is to stay in, then narrow the right. The reverse rollout gives incomplete backups with
    no warning.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Agent kopii zapasowych na koncie spoza grupy administratorów pominie część danych
      - Objaw jest częściowy — kopia kończy się powodzeniem i nie ostrzega o pominięciu
      - Brak zauważa się dopiero przy odtwarzaniu, czyli w najgorszym możliwym momencie
      - Zadanie kopiujące rejestr przestanie odczytywać gałęzie chronione
    en:
      - A backup agent under an account outside the administrators' group will pass some data over
      - The symptom is partial - the backup ends in success and gives no warning of what it passed over
      - The want is noticed only at a restoring, that is, at the worst possible moment
      - A task copying the registry will stop reading guarded branches
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Agent kopii zapasowych pracuje na koncie spoza grupy administratorów i nie da się tego zmienić
      - Nie ustalono, na jakim koncie wykonują się kopie zapasowe tego serwera
    en:
      - The backup agent works under an account outside the administrators' group and that cannot be changed
      - It has not been settled what account this server's backups are made under
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeBackupPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeBackupPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeBackupPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeBackupPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeBackupPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/back-up-files-and-directories

notes:
  pl: |
    Prawo nie odróżnia kopiowania od czytania. Konto, które je ma,
    odczyta każdy plik na maszynie niezależnie od uprawnień, także taki,
    którego kopiować nie zamierzało.

    Ocena uciążliwości jest tu wyższa niż w paczce stanowiska roboczego,
    bo na serwerze oprogramowanie kopii zapasowych pracuje zwykle na
    koncie własnym, celowo umieszczonym poza grupą administratorów.

    Objaw częściowej kopii jest najgroźniejszy w całej grupie praw:
    zadanie kończy się powodzeniem, a braku nie widać aż do
    odtwarzania.

    Punkt czyta się razem z prawem odtwarzania. Oba bywają nadane temu
    samemu kontu i oba trzeba domknąć.
  en: |
    The right does not tell copying from reading. An account holding it will read every file on
    the machine whatever its rights, including one it never meant to copy.

    The judgement of disruption is higher here than in the working station's pack, since on a
    server backup software usually works under an account of its own, deliberately placed
    outside the administrators' group.

    The symptom of a partial backup is the gravest in the whole group of rights: the task ends
    in success, and the want does not show until a restoring.

    The item is read together with the right of restoring. Both are at times granted to the
    same account and both have to be shut.
