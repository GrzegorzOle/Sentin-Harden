id: win2025-dont-display-last-username

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nazwa ostatnio zalogowanego użytkownika ukryta na ekranie logowania
    en: Last signed-in user name hidden on the sign-in screen
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby ekran logowania nie pokazywał nazwy osoby, która
    logowała się ostatnio.

    Na serwerze wartość tego punktu jest większa niż na stanowisku roboczym
    i z zupełnie innego powodu. Na stanowisku widoczna nazwa to nazwa jego
    właściciela — informacja, którą i tak każdy zna. Na serwerze widoczna
    nazwa to nazwa konta administracyjnego użytego przy ostatniej pracy na
    konsoli, a więc konta uprzywilejowanego, o którym z zewnątrz nie wiadomo
    nic.

    Dotyczy to szczególnie serwerów, na których konto wbudowanego
    administratora zostało przemianowane. Cała wartość tamtej zmiany polega
    na tym, że nowa nazwa nie jest znana — a ekran logowania wypisuje ją
    każdemu, kto na niego spojrzy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwę konta
    o wysokich uprawnieniach, podaną bez proszenia. Nie jest to dostęp,
    ale jest to połowa pary, której potrzebuje — i połowa trudniejsza do
    odgadnięcia niż hasło, bo hasła da się zgadywać, a nazwy trzeba się
    domyślić.

    Kto spojrzy: osoba w serwerowni, technik serwisu sprzętu, ktokolwiek
    z dostępem do konsoli zarządzania sprzętowego lub do konsoli maszyny
    wirtualnej.
  en: |
    The item takes that the sign-in screen not show the name of whoever signed in last.

    On a server this item's worth is greater than at a working station and for an altogether
    different reason. At a station the visible name is its owner's - a thing everybody knows
    anyway. On a server the visible name is that of the administrative account used at the
    last work on the console, and so of a privileged account about which nothing is known
    from outside.

    That concerns especially servers on which the built-in administrator's account has been
    renamed. That change's whole worth rests on the new name being unknown - and the sign-in
    screen writes it out to anyone who looks at it.

    What an attacker gains while the item goes unmet: the name of a highly privileged
    account, given without asking. It is no access, but it is half of the pair they need -
    and the half harder to work out than the password, since passwords can be guessed while
    a name has to be surmised.

    Who will look: someone in the server room, a hardware service technician, anyone with
    access to the hardware management console or to a virtual machine's console.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek loguje się na tym serwerze
    interaktywnie i jak często — bo skutek jest wyłącznie po stronie
    wygody logowania.

    Po zmianie nazwę konta trzeba wpisać za każdym razem, razem z hasłem.
    Na serwerze, na który wchodzi się raz na kwartał, jest to koszt
    nieodczuwalny. Na serwerze obsługiwanym z konsoli codziennie jest to
    kilka sekund więcej przy każdym logowaniu — i częstszy błąd przy
    wpisywaniu nazwy, zwłaszcza gdy konto administratora zostało
    przemianowane na nazwę losową.

    Zestawienie z blokadą konta jest tu warte uwagi. Ukryta nazwa oznacza
    więcej pomyłek przy wpisywaniu, a pomyłki wliczają się do progu blokady.
    Obsługa, która nie pamięta nowej nazwy konta, jest w stanie zablokować
    je sobie sama.

    Skutek dotyczy wyłącznie logowania przy konsoli i przez pulpit zdalny
    z pełnym ekranem logowania. Połączenia z podanymi poświadczeniami
    nie dotyczy.

    Zmiana nie wymaga restartu; obowiązuje od następnego logowania.
  en: |
    What needs checking is whether anyone signs in on this server interactively and how
    often - since the effect lies solely on the side of the ease of signing in.

    After the change the account's name has to be typed every time, along with the password.
    On a server entered once a quarter that is a cost not felt. On a server worked from the
    console daily it is a few seconds more at every signing in - and a more frequent slip in
    typing the name, especially where the administrator's account has been renamed to a
    random name.

    Setting it beside account lockout is worth notice here. A hidden name means more slips
    in typing, and slips count towards the lockout threshold. Support that does not remember
    the account's new name is able to lock it on itself.

    The effect concerns signing in at the console and through the remote desktop with a full
    sign-in screen alone. It does not concern connections with credentials given.

    The change takes no restart; it binds from the next signing in.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
    - remote-desktop
  what_breaks:
    pl:
      - Nazwę konta trzeba wpisywać przy każdym logowaniu razem z hasłem
      - Pomyłki przy wpisywaniu nazwy wliczają się do progu blokady konta
      - Obsługa niepamiętająca przemianowanej nazwy konta może je sobie zablokować
      - Połączenia z podanymi poświadczeniami działają bez zmiany
    en:
      - The account's name has to be typed at every signing in along with the password
      - Slips in typing the name count towards the account lockout threshold
      - Support not remembering the renamed account's name may lock it on itself
      - Connections with credentials given work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nazwa przemianowanego konta administratora nie jest nigdzie zapisana poza tym ekranem
    en:
      - The renamed administrator account's name is recorded nowhere but on that screen
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'DontDisplayLastUserName'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'DontDisplayLastUserName' -ErrorAction SilentlyContinue).'DontDisplayLastUserName'
    [pscustomobject]@{
      path        = $path
      name        = 'DontDisplayLastUserName'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontDisplayLastUserName' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-do-not-display-last-user-name

notes:
  pl: |
    Punkt czyta się razem z przemianowaniem wbudowanego konta
    administratora. Tamten ukrywa nazwę przed narzędziami automatycznymi,
    ten — przed człowiekiem patrzącym na ekran. Spełniony tylko jeden
    z nich daje ochronę połowiczną i warto pokazywać je w raporcie obok
    siebie.

    Ukrycie nazwy nie ukrywa listy kont. Kto ma na serwerze dostęp
    uwierzytelniony, ten listę kont odczyta osobnymi drogami. Punkt broni
    wyłącznie przed odczytaniem nazwy z ekranu, bez żadnego dostępu.
  en: |
    The item is read together with the renaming of the built-in administrator account. That
    one hides the name from automatic tools, this one from a person looking at the screen.
    Only one of them met gives half protection and it is worth showing them side by side in
    the report.

    Hiding the name does not hide the list of accounts. Whoever has authenticated access on
    the server will read the list of accounts by separate roads. The item guards against the
    reading of a name off the screen with no access at all, and nothing more.
