id: win2016-defender-scan-archives

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > Scan
  title:
    pl: Skanowanie zawartości archiwów włączone
    en: Scanning of archive contents switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zaglądać do wnętrza plików spakowanych, zamiast oceniać
    wyłącznie samo archiwum.

    Archiwum jest opakowaniem i dokładnie tak działa jako sposób obejścia.
    Plik rozpoznawalny po zapakowaniu przestaje być rozpoznawalny, bo na
    dysku leży jako ciąg skompresowanych bajtów niepodobny do niczego.
    Ochrona, która do środka nie zagląda, widzi archiwum i nie ma o czym
    orzekać.

    Jest to jedna z najstarszych i nadal najskuteczniejszych metod
    przemycania plików przez warstwy sprawdzające, zwłaszcza w połączeniu
    z hasłem. Archiwum chronione hasłem nie daje się otworzyć nikomu poza
    odbiorcą — a odbiorca podaje hasło i rozpakowuje je sam.

    Sprawdzanie zawartości zamyka wariant bez hasła, czyli ten najczęstszy.
    Z hasłem nie pomaga i trzeba to powiedzieć wprost: żadne ustawienie
    tego nie zmieni, bo ochrona nie zna hasła.

    Na serwerze archiwa pojawiają się przez udziały sieciowe, przez wgrywanie
    plików, przez kopie zapasowe i przez paczki wdrożeniowe. Każda z tych
    dróg prowadzi do pliku, który wygląda niewinnie, dopóki nikt do niego
    nie zajrzy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przeniesienia na maszynę dowolnego rozpoznawalnego pliku przez samo
    spakowanie go, bez żadnej innej zmiany.
  en: |
    The setting has the inside of packed files looked into, instead of the archive
    alone being judged.

    An archive is a wrapping and works exactly so as a way round. A recognisable
    file, once packed, ceases to be recognisable, lying on disk as a string of
    compressed bytes like nothing at all. Protection that does not look inside sees
    an archive and has nothing to pronounce on.

    This is one of the oldest and still most effective ways of smuggling files past
    checking layers, in company with a password above all. A password-protected
    archive can be opened by nobody but its recipient - and the recipient gives the
    password and unpacks it themselves.

    Checking the contents shuts the variant without a password, which is to say the
    commonest one. With a password it does not help, and that has to be said
    outright: no setting will change it, the protection not knowing the password.

    On a server archives appear through network shares, through uploaded files,
    through backups and through deployment packages. Each of those roads leads to a
    file that looks innocent until somebody looks into it.

    What an attacker gains while the item goes unmet: the means of moving any
    recognisable file at all onto the machine by packing it, with no other change.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczą do sprawdzenia jest obciążenie.

    Zaglądanie do archiwum wymaga jego rozpakowania w pamięci, więc koszt
    jest wprost proporcjonalny do wielkości i liczby archiwów na maszynie.
    Na serwerze, gdzie archiwów jest niewiele, nie znaczy to nic. Na
    serwerze plików albo serwerze kopii zapasowych, gdzie archiwa są treścią
    pracy, potrafi znaczyć sporo — zwłaszcza przy skanowaniu pełnym.

    Przypadek najgorszy to magazyn kopii zapasowych. Leżą tam pliki
    wielkie, spakowane i w całości niepotrzebne do sprawdzania, bo pochodzą
    z maszyn, które i tak są chronione. Skanowanie ich zajmuje godziny
    i nie daje niczego. Odpowiedzią jest wyłączenie dla katalogu magazynu,
    a nie wyłączenie warstwy.

    Rzecz druga, mniej oczywista: archiwa bardzo głęboko zagnieżdżone albo
    spreparowane tak, by rozpakowywały się w nieskończoność, są pomijane po
    przekroczeniu granicy zagnieżdżenia. Nie jest to usterka, tylko
    zabezpieczenie — ale znaczy, że warstwa ma granicę i nie widzi
    wszystkiego.

    Czego to nie psuje: usług, logowania, łączności, dostępu do archiwów,
    możliwości ich rozpakowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check is the load.

    Looking into an archive calls for unpacking it in memory, so the cost is
    directly proportional to the size and number of archives on the machine. On a
    server where archives are few that means nothing. On a file server or a backup
    server, where archives are the substance of the work, it can mean a great deal -
    at a full scan above all.

    The worst case is a backup store. There lie files that are large, packed, and
    wholly needless to check, coming from machines that are protected anyway.
    Scanning them takes hours and gives nothing. The answer is an exclusion for the
    store's directory, not the switching off of the layer.

    The second thing, less obvious: archives nested very deeply, or contrived to
    unpack without end, are passed over once a limit of nesting is crossed. That is
    no fault but a safeguard - but it means the layer has a bound and does not see
    everything.

    What this does not break: services, signing in, connectivity, access to
    archives, or the ability to unpack them.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Na serwerze plików i w magazynie kopii zapasowych skanowanie pełne wydłuża się znacznie, bo każde archiwum trzeba rozpakować w pamięci
      - Archiwa chronione hasłem pozostają niesprawdzone i żadne ustawienie tego nie zmieni, bo ochrona nie zna hasła
      - Archiwa bardzo głęboko zagnieżdżone są pomijane po przekroczeniu granicy zagnieżdżenia, więc warstwa ma granicę i nie widzi wszystkiego
      - Dostęp do archiwów, możliwość ich rozpakowania, usługi i logowanie pozostają bez zmian
    en:
      - On a file server and in a backup store a full scan lengthens greatly, every archive having to be unpacked in memory
      - Password-protected archives stay unchecked and no setting will change it, the protection not knowing the password
      - Archives nested very deeply are passed over once a limit of nesting is crossed, so the layer has a bound and does not see everything
      - Access to archives, the ability to unpack them, services and signing in stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest magazynem kopii zapasowych i nie dodano wyłączenia dla katalogu magazynu
      - Rola maszyny opiera się na stałym przetwarzaniu wielkich archiwów, a obciążenia nie zmierzono
    en:
      - The machine is a backup store and no exclusion has been added for the store's directory
      - The machine's role rests on the constant processing of very large archives and the load has not been measured
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableArchiveScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableArchiveScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableArchiveScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Punkt jest wart pokazania razem z uczciwym opisem granicy. Warstwa ta
    zamyka wariant bez hasła i nie zamyka wariantu z hasłem — i lepiej to
    powiedzieć, niż pozwolić czytelnikowi przyjąć, że archiwa są odtąd
    sprawdzone.

    Ocena średnia, nie wysoka, właśnie z tego powodu. Punkt podnosi koszt
    przemycenia pliku, ale nie zamyka drogi, bo obejście jest tanie
    i powszechnie znane.

    Zalecenie wdrożeniowe brzmi tu inaczej niż przy pozostałych regułach
    bloku: zanim się je włączy, warto wiedzieć, gdzie na maszynie leżą
    archiwa wielkie i niepotrzebne do sprawdzania. Wyłączenie dla takiego
    katalogu jest tańsze niż zrezygnowanie z warstwy.
  en: |
    The item is worth showing along with an honest description of its bound. The
    layer shuts the variant without a password and does not shut the one with a
    password - and it is better said than left for the reader to assume that
    archives are checked from now on.

    The judgement is medium rather than high for just that reason. The item raises
    the cost of smuggling a file in, but shuts no road, the way round being cheap
    and widely known.

    The rollout recommendation here reads otherwise than at the other rules of the
    block: before switching it on, it is worth knowing where on the machine the
    large archives needless to check are lying. An exclusion for such a directory is
    cheaper than giving the layer up.
