id: win11-logon-mpr-notifications-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Przekazywanie zdarzeń logowania dostawcom sieciowym wyłączone
    en: Passing of logon events to network providers disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy system ma powiadamiać zarejestrowanych dostawców
    sieciowych o zdarzeniach logowania i zmiany hasła.

    Dostawca sieciowy to składnik, który można dorejestrować do systemu, żeby
    obsługiwał własny rodzaj zasobów sieciowych — udziały, dyski, połączenia
    w rozwiązaniach innych producentów. Powiadomienie, o którym mówi punkt,
    nie jest samym sygnałem „ktoś się zalogował". Niesie ze sobą to, czym
    użytkownik się przy logowaniu posłużył, żeby dostawca mógł zalogować go
    również u siebie, bez pytania o hasło po raz drugi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    odebranie hasła w postaci jawnej, w chwili jego wpisywania, bez
    dotykania samego mechanizmu logowania. Wystarczy dorejestrować własnego
    dostawcę sieciowego — czynność wymagająca uprawnień administratora, ale
    wykonywana w miejscu, którego nikt nie ogląda, i wyglądająca jak
    instalacja zwykłego składnika sieciowego.

    Jest to droga używana w praktyce i trudna do zauważenia, bo nie zostawia
    śladu w niczym, co dotyczy logowania. Z punktu widzenia systemu wszystko
    dzieje się zgodnie z przeznaczeniem mechanizmu.

    Wyłączenie powiadomień odbiera tę drogę. Dostawcy sieciowi działają dalej,
    tylko nie dostają materiału, którego do działania nie potrzebują.
  en: |
    The setting settles whether the system is to notify registered network providers of
    logon and password change events.

    A network provider is a component that may be registered with the system so as to
    handle its own kind of network resources - shares, drives, connections in other
    makers' solutions. The notification the item speaks of is not the bare signal
    "somebody has logged on". It carries with it what the user used at logon, so that the
    provider may log them on at its end too, without asking for a password a second time.

    What an attacker gains while the item goes unmet: a way of taking a password in the
    clear, at the moment it is typed, without touching the logon mechanism itself. It is
    enough to register their own network provider - an act taking administrator rights,
    but performed in a place nobody looks at, and looking like the installation of an
    ordinary network component.

    It is a route used in practice and hard to notice, since it leaves no trace in
    anything concerning logon. From the system's point of view everything happens
    according to the mechanism's purpose.

    Switching the notifications off takes that route away. Network providers work on, only
    they do not get material they do not need in order to work.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie jest zarejestrowany dostawca
    sieciowy innego producenta, który na tych powiadomieniach polega.

    Na stanowisku z samym systemem zmiana nie zmienia niczego. Wbudowana
    obsługa udziałów sieciowych nie korzysta z tego mechanizmu i logowanie
    działa tak jak wcześniej.

    Skutek pojawia się przy rozwiązaniach, które dokładają własnego dostawcę
    sieciowego i obiecują zalogowanie w jednym kroku: klienci sieciowych
    systemów plików innych producentów, część rozwiązań do zarządzania
    tożsamością, niektóre pakiety kopii zapasowych i klienty wirtualnych
    pulpitów.

    Objaw jest przewidywalny: po zalogowaniu do systemu użytkownik zostanie
    dodatkowo zapytany o hasło przez to rozwiązanie, zamiast wejść do niego
    od razu. Nie jest to utrata dostępu, tylko jego wydłużenie o jeden krok.

    Warto to sprawdzić przed wdrożeniem, bo skutek widać dopiero przy
    następnym logowaniu, a nie od razu po zmianie.

    Zmiana nie wymaga restartu, ale obowiązuje od kolejnego logowania.
  en: |
    What needs checking is whether a network provider from another maker is registered on
    the machine that relies on these notifications.

    At a station with the system alone the change changes nothing. The built-in handling
    of network shares does not use this mechanism and logon works as before.

    The effect appears with solutions that add their own network provider and promise a
    logon in one step: clients of other makers' network file systems, some identity
    management solutions, certain backup packages and virtual desktop clients.

    The symptom is predictable: after logging on to the system the user will additionally
    be asked for a password by that solution instead of entering it straight away. It is
    not a loss of access but a lengthening of it by one step.

    That is worth checking before a rollout, since the effect shows only at the next logon
    rather than at once after the change.

    The change takes no restart but binds from the next logon.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Rozwiązanie z własnym dostawcą sieciowym pyta o hasło osobno zamiast logować w jednym kroku
      - Klienci sieciowych systemów plików innych producentów wymagają ponownego podania hasła
      - Wbudowana obsługa udziałów sieciowych działa tak jak wcześniej
      - Skutek widać dopiero przy następnym logowaniu, a nie od razu po zmianie
    en:
      - A solution with its own network provider asks for a password apart instead of logging on in one step
      - Clients of other makers' network file systems take the password being given again
      - The built-in handling of network shares works as before
      - The effect shows only at the next logon rather than at once after the change
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje klient sieciowego systemu plików logujący użytkownika w jednym kroku
      - Rozwiązanie do zarządzania tożsamością opiera się na tych powiadomieniach
    en:
      - A client of a network file system logging the user on in one step works on the machine
      - An identity management solution rests on these notifications
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The registry value carries a shorter name than the policy does.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableMPR'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'EnableMPR' -ErrorAction SilentlyContinue).'EnableMPR'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableMPR'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMPR' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/secauthn/network-provider-api

notes:
  pl: |
    Nazwa wartości w rejestrze jest krótsza niż nazwa zasady w edytorze i nie
    zgadza się z nią wprost. Warto o tym wiedzieć przy ręcznym sprawdzaniu,
    bo szukanie pełnej nazwy nie da wyniku.

    Punkt dotyczy przekazywania materiału uwierzytelniającego, a nie samego
    istnienia dostawców sieciowych. Ich rejestracja jest osobną sprawą i tej
    reguła nie ogranicza — warto to rozróżnić, bo sam spis dostawców
    zarejestrowanych na maszynie jest wart obejrzenia niezależnie od tego
    ustawienia.

    Brak wartości nie jest stanem zgodnym. Bez ustawienia powiadomienia bywają
    przekazywane, więc reguła wymaga zapisania zera wprost.

    Klucz jest wspólny z kilkunastoma innymi regułami w tej paczce, więc
    wycofanie usuwa wyłącznie tę jedną wartość.
  en: |
    The value's name in the registry is shorter than the policy's name in the editor and
    does not match it outright. Worth knowing when checking by hand, since searching for
    the full name will give nothing.

    The item concerns the passing of authentication material, not the existence of network
    providers as such. Their registration is a separate matter and the rule does not limit
    it - worth telling apart, since the list of providers registered on the machine is
    worth looking at whatever this setting says.

    A missing value is not a compliant state. With no setting the notifications are
    sometimes passed, so the rule takes writing a zero outright.

    The key is shared with more than a dozen other rules in this pack, so undoing removes
    that one value alone.
