id: ubuntu2404-no-duplicate-group-names

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 7.2.8
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Żadna nazwa grupy nie powtarza się w /etc/group
    en: Ensure no duplicate group names exist
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Grupa o powtórzonej nazwie ma dwa GID. Uprawnienia plików i reguły
    takie jak sudoers odwołują się do nazwy, a system rozwiązuje ją na
    pierwszy wpis, więc członkowie drugiego wpisu mają inne prawa, niż
    sugeruje nazwa.

    Punkt wymaga, żeby każda nazwa grupy występowała w /etc/group raz.
  en: |
    A group with a repeated name has two GIDs. File permissions and rules
    such as sudoers refer to the name, and the system resolves it to the
    first entry, so the members of the second entry have other rights than
    the name suggests.

    The item requires every group name to appear in /etc/group once.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/group.
  en: |
    Nobody will notice: the check only reads /etc/group.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/group ] || { echo "NOT_OK:no-/etc/group"; exit 0; }
    o=$(awk -F: '$1 != "" { n[$1]++; w[$1] = w[$1] (w[$1] == "" ? "" : "+") NR }
      END { for (k in n) if (n[k] > 1) print k "=" w[k] }' /etc/group | sort | paste -sd, -)
    if [ -n "$o" ]; then echo "NOT_OK:group-$o"; else echo "OK:no-duplicate-group-names"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/group.5.html
  - https://man7.org/linux/man-pages/man8/grpck.8.html

notes:
  pl: |
    Wynik NOT_OK podaje każdą powtórzoną nazwę z numerami wierszy
    /etc/group, na przykład group-dev=40+52. Zbędny wpis usuwa się albo
    zmienia ręcznie (groupdel, groupmod -n); grpck -r pokazuje też inne
    niespójności. Test działa bez roota. Reguła tylko sprawdza stan.
  en: |
    The NOT_OK result gives each repeated name with the line numbers in
    /etc/group, for example group-dev=40+52. The extra entry is removed or
    renamed by hand (groupdel, groupmod -n); grpck -r also shows other
    inconsistencies. The test works without root. The rule only checks the
    state.
