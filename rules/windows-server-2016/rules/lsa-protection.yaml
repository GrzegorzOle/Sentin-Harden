id: win2016-lsa-protection

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Ochrona procesu urzędu zabezpieczeń włączona
    en: Protection of the security authority process switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie nadaje procesowi urzędu zabezpieczeń status chroniony, przez
    co system odmawia innym procesom wglądu w jego pamięć — nawet tym
    działającym z uprawnieniami administratora.

    Proces ten jest w systemie miejscem szczególnym: to on przechowuje
    wszystko, czym maszyna potwierdza tożsamość zalogowanych kont. Bilety,
    skróty haseł, klucze sesji, a przy starszych mechanizmach także hasła
    w postaci jawnej. Cała wartość, po którą napastnik przychodzi po
    przejęciu maszyny, leży w pamięci tego jednego procesu.

    Bez ochrony uprawnienia administratora wystarczają, by tę pamięć
    przeczytać. Jest to warstwa, której brak zamienia przejęcie maszyny
    w przejęcie poświadczeń — a te działają dalej, na innych maszynach,
    także po naprawieniu tej.

    Ochrona zmienia regułę dostępu. Proces chroniony może być otwarty
    wyłącznie przez kod podpisany w sposób, który system uznaje, więc samo
    zdobycie uprawnień administratora przestaje wystarczać. Nie jest to
    zapora nie do przejścia, ale podnosi koszt z uruchomienia gotowego
    narzędzia do napisania sterownika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: prawo
    odczytu pamięci procesu przechowującego poświadczenia wszystkich
    zalogowanych kont, z samych uprawnień administratora.
  en: |
    The setting gives the security authority process protected status, whereby the
    system refuses other processes a view into its memory - even those running with
    administrator privileges.

    That process is a peculiar place in the system: it is where everything the
    machine confirms the identity of signed-in accounts with is kept. Tickets,
    password digests, session keys, and under older mechanisms passwords in plain
    form as well. All the value an attacker comes for after taking a machine over
    lies in the memory of this one process.

    Without the protection, administrator privileges are enough for that memory to
    be read. It is the layer whose absence turns the taking over of a machine into
    the taking over of credentials - and those work on, on other machines, after
    this one has been mended.

    The protection changes the rule of access. A protected process may be opened
    only by code signed in a way the system accepts, so gaining administrator
    privileges ceases to be enough by itself. It is no impassable wall, but it
    raises the cost from running a ready tool to writing a driver.

    What an attacker gains while the item goes unmet: the right to read the memory
    of the process keeping the credentials of every signed-in account, from
    administrator privileges alone.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód jest jeden: ochrona
    zamyka drzwi także przed oprogramowaniem, które do tego procesu
    zaglądało legalnie.

    Kto tam zagląda. Programy zabezpieczające i wykrywające włamania,
    zwłaszcza starsze albo dostarczone przez mniejszych producentów.
    Narzędzia diagnostyczne zbierające zrzuty pamięci. Oprogramowanie
    jednokrotnego logowania wpinające się w mechanizm uwierzytelniania.
    Biblioteki uwierzytelniania kartą albo czytnikiem biometrycznym
    dostarczone przez producenta sprzętu.

    Wspólną cechą jest to, że wpinają się w proces urzędu zabezpieczeń
    własnym modułem. Po włączeniu ochrony moduł niepodpisany w wymagany
    sposób nie zostanie wczytany, a narzędzie przestanie działać — czasem
    cicho, bo brak modułu bywa raportowany tylko w dzienniku.

    Rzecz, o której trzeba wiedzieć przed zmianą: skutek pojawia się dopiero
    po restarcie maszyny. Znaczy to, że zmiana wprowadzona dziś ujawni się
    przy najbliższym oknie serwisowym, być może za miesiąc — i wtedy trudniej
    będzie ją z objawem powiązać. Restart po zmianie, w oknie kontrolowanym,
    jest tu częścią wdrożenia, a nie jego skutkiem ubocznym.

    Czego to nie psuje: logowania, uwierzytelniania domenowego, usług
    niewpinających się w urząd zabezpieczeń, pulpitu zdalnego.

    Wymaga restartu systemu; odwracalne po restarcie.
  en: |
    The class is "needs a planned rollout", and the reason is one: the protection
    shuts the door on software that looked into that process lawfully as well.

    Who looks in there. Security and intrusion detection programs, older ones
    especially, or those from smaller makers. Diagnostic tools gathering memory
    dumps. Single sign-on software hooking into the authentication mechanism.
    Card or biometric authentication libraries supplied by a hardware maker.

    Their common trait is that they hook into the security authority process with a
    module of their own. Once the protection is on, a module not signed in the
    required way will not be loaded, and the tool will stop working - at times
    quietly, since a missing module is at times reported only in a log.

    A thing to know before the change: the effect appears only after the machine is
    restarted. That means a change made today will show at the next service window,
    perhaps in a month - and it will then be harder to tie to the symptom. A restart
    after the change, in a controlled window, is here part of the rollout rather
    than its side effect.

    What this does not break: signing in, domain authentication, services not
    hooking into the security authority, or the remote desktop.

    Calls for the system to be restarted; undone after a restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - boot-and-firmware
    - legacy-applications
    - remote-management
  what_breaks:
    pl:
      - Program zabezpieczający wpinający się w urząd zabezpieczeń własnym modułem przestaje go wczytywać i bywa, że zgłasza to tylko w dzienniku
      - Oprogramowanie jednokrotnego logowania oraz biblioteki uwierzytelniania kartą dostarczone przez producenta sprzętu przestają działać
      - Narzędzia diagnostyczne zbierające zrzuty pamięci tego procesu przestają go otwierać
      - Skutek pojawia się dopiero po restarcie, więc bez restartu kontrolowanego ujawni się przy najbliższym oknie serwisowym
    en:
      - A security program hooking into the security authority with a module of its own stops loading it, and at times reports this only in a log
      - Single sign-on software and card authentication libraries supplied by a hardware maker stop working
      - Diagnostic tools gathering memory dumps of this process stop opening it
      - The effect appears only after a restart, so without a controlled restart it will show at the next service window
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa program zabezpieczający albo oprogramowanie jednokrotnego logowania wpinające się w urząd zabezpieczeń i nie potwierdzono podpisu jego modułu
      - Nie ma okna serwisowego na restart kontrolowany, a skutek zmiany ujawniłby się dopiero przy przypadkowym restarcie
    en:
      - A security program or single sign-on software hooking into the security authority runs on the machine and its module's signature has not been confirmed
      - There is no service window for a controlled restart and the change would show only at an accidental one
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RunAsPPL'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(1|2)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'RunAsPPL'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One means protection backed by the firmware where the hardware allows it. Two
    # is the same protection without that backing and meets the item as well.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RunAsPPL' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection

notes:
  pl: |
    Audyt przyjmuje dwie wartości jako spełniające zasadę. Jedna oznacza
    ochronę wspartą przez oprogramowanie układowe tam, gdzie sprzęt na to
    pozwala; druga tę samą ochronę bez takiego wsparcia. Obie dają to, o co
    w punkcie chodzi, a wymaganie akurat jednej karałoby maszyny starsze za
    sprzęt, nie za konfigurację.

    Reguła jest środkową warstwą grupy chroniącej poświadczenia. Wyłączenie
    przechowywania haseł w postaci jawnej zdejmuje to, co najłatwiejsze do
    wzięcia; ta reguła zamyka dostęp do pamięci procesu; mechanizm izolujący
    poświadczenia wynosi je poza ten proces w ogóle. Kolejność wdrożenia
    warto zachować właśnie taką, bo koszt rośnie wraz z nią.

    Opóźnienie skutku do restartu jest przy tym punkcie pułapką częstszą
    niż sama niezgodność z oprogramowaniem. Aplikacja powinna mówić wprost,
    że reguła zapisana i nieprzetestowana restartem jest regułą wdrożoną
    w połowie.
  en: |
    The audit takes two values as satisfying the principle. One means protection
    backed by the firmware where the hardware allows it; the other the same
    protection without that backing. Both give what the item is about, and demanding
    one in particular would punish older machines for their hardware rather than for
    their configuration.

    The rule is the middle layer of the group guarding credentials. Switching off
    the keeping of passwords in plain form takes away what is easiest to take; this
    rule shuts access to the process's memory; the mechanism isolating credentials
    carries them outside that process altogether. The order of rollout is worth
    keeping just so, since the cost rises along with it.

    The delaying of the effect until a restart is at this item a commoner trap than
    any incompatibility with software. The application should say outright that a
    rule written and not tested by a restart is a rule half rolled out.
