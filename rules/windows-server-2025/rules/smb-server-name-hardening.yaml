id: win2025-smb-server-name-hardening

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Weryfikacja nazwy, pod którą klient łączy się z zasobami maszyny
    en: Verification of the name a client connects to the machine's resources by
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe serwerowi sprawdzić, czy nazwa, pod którą klient
    się z nim łączy, jest jego własną nazwą — a nie nazwą cudzą,
    podstawioną po drodze.

    Mechanizm ten broni przed przekierowaniem uwierzytelnienia.
    Napastnik nakłania maszynę ofiary do połączenia z sobą — wystarczy
    do tego odnośnik w dokumencie albo zatruta odpowiedź na pytanie
    o nazwę — a następnie przekazuje otrzymane uwierzytelnienie dalej,
    do serwera właściwego. Serwer widzi poprawne uwierzytelnienie
    prawdziwego użytkownika i wpuszcza. Nic nie zostaje złamane;
    zostaje przekazane.

    Weryfikacja nazwy zamyka tę drogę, ponieważ uwierzytelnienie
    zbudowane dla nazwy jednej maszyny nie daje się użyć wobec innej.
    Serwer sprawdza nazwę, stwierdza niezgodność i odmawia.

    Na serwerze punkt waży nieporównanie więcej niż na stanowisku
    roboczym, bo to serwer jest celem przekierowania. Przekierowanie do
    stanowiska roboczego daje dostęp do jednego komputera;
    przekierowanie do serwera plików albo kontrolera domeny daje dostęp
    do tego, po co ludzie do niego przychodzą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość przekierowania uwierzytelnienia cudzego na ten serwer
    i wejścia na nim z uprawnieniami osoby, która niczego nie zrobiła
    poza otwarciem dokumentu.
  en: |
    The setting bids the server check whether the name a client connects to it by is its own
    name - and not another's, set in the way.

    The mechanism guards against a carrying across of authentication. The attacker brings a
    victim's machine to connect to them - a link in a document or a poisoned answer to a
    question about a name is enough for that - and then passes the authentication so got
    onwards, to the true server. The server sees a right authentication of a true user and lets
    them in. Nothing is broken; it is passed on.

    The checking of the name shuts that road, since an authentication built for one machine's
    name cannot be used towards another. The server checks the name, finds a mismatch and
    refuses.

    On a server the item weighs beyond compare more than at a working station, the server being
    the target of the carrying across. A carrying across to a working station gives access to
    one computer; to a file server or a domain controller it gives access to what people come to
    it for.

    What an attacker gains while the item goes unmet: the means of carrying another's
    authentication across to this server and coming in on it with the rights of a person who did
    nothing but open a document.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy części osób, jeżeli serwer
    jest osiągany pod nazwą inną niż własna. Wymaga okna serwisowego
    i przygotowania.

    Warunkiem wstępnym jest ustalenie wszystkich nazw, pod którymi
    ludzie i systemy łączą się z tym serwerem. Nie chodzi wyłącznie
    o nazwę maszyny: serwery plików bywają osiągane pod nazwą
    aliasową, wpisaną kiedyś po to, żeby po przeniesieniu usługi na
    inną maszynę nie trzeba było zmieniać wszystkim skrótów. Alias taki
    bywa starszy niż ludzie, którzy go dziś używają.

    I to jest właśnie skutek tej zmiany. Po włączeniu weryfikacji
    serwer odmawia połączeń nawiązanych pod nazwą aliasową, dopóki
    nazwa ta nie zostanie dla niego zarejestrowana jako nazwa własna.
    Rejestracja jest czynnością osobną, wykonywaną w domenie, i nie
    dzieje się sama.

    Objaw jest gwałtowny i powszechny. Udział przestaje być osiągalny
    pod nazwą, którą wszyscy mają zapisaną — w skrótach, w dyskach
    mapowanych przy logowaniu, w konfiguracji aplikacji. Komunikat mówi
    o odmowie dostępu, więc diagnoza kieruje się na uprawnienia, a nie
    na nazwę.

    Skutek dotyczy wszystkich naraz i ujawnia się przy pierwszym
    porannym logowaniu, więc zmianę wprowadza się przed dniem pracy,
    a nie w jego trakcie.

    Ustawienie ma dwa stopnie. Łagodniejszy sprawdza nazwę wtedy, gdy
    klient ją podaje; ostrzejszy wymaga jej zawsze. Punkt spełnia
    każdy z nich, a wybór stopnia jest decyzją wdrożeniową.
  en: |
    The change surely changes how some people work where the server is reached by a name other
    than its own. It takes a service window and preparation.

    The precondition is settling every name people and systems connect to this server by. It is
    not the machine's name alone: file servers are at times reached by an alias name, written in
    once so that after a service is carried to another machine nobody's shortcuts need changing.
    Such an alias is at times older than the people using it today.

    And that is just the effect of this change. With the checking on, the server refuses
    connections made by an alias name until that name is registered for it as a name of its own.
    The registering is an act apart, done in the domain, and does not happen of itself.

    The symptom is abrupt and widespread. The share stops being reachable by the name everyone
    has written down - in shortcuts, in drives mapped at sign-in, in applications' settings. The
    message speaks of a refusal of access, so the diagnosis turns to rights rather than to the
    name.

    The effect touches everybody at once and shows at the first morning sign-in, so the change
    is brought in before a working day rather than during one.

    The setting has two degrees. The milder checks the name where the client gives one; the
    stricter demands it always. The item is met by either, and the choice of degree is a rollout
    decision.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Udział przestanie być osiągalny pod nazwą aliasową, dopóki nazwa ta nie zostanie zarejestrowana dla serwera
      - Skróty, dyski mapowane przy logowaniu i konfiguracje aplikacji wskazujące na alias przestaną działać
      - Komunikat mówi o odmowie dostępu, więc diagnoza kieruje się na uprawnienia zamiast na nazwę
      - Skutek dotyczy wszystkich naraz i ujawnia się przy pierwszym porannym logowaniu
    en:
      - The share will stop being reachable by an alias name until that name is registered for the server
      - Shortcuts, drives mapped at sign-in and applications' settings pointing at the alias will stop working
      - The message speaks of a refusal of access, so the diagnosis turns to rights rather than to the name
      - The effect touches everybody at once and shows at the first morning sign-in
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer jest osiągany pod nazwą aliasową, która nie została dla niego zarejestrowana w domenie
      - Nie ustalono wszystkich nazw, pod którymi ludzie i systemy łączą się z tym serwerem
      - Zmiana miałaby zostać wprowadzona w trakcie dnia pracy zamiast przed nim
    en:
      - The server is reached by an alias name never registered for it in the domain
      - Not every name people and systems connect to this server by has been settled
      - The change would be brought in during a working day rather than before one
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two settings satisfy the item: accepting the name when the client gives
      # one, and demanding it always. They are reported under one token, because
      # the item is met by either, and the stricter one is a deployment choice.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'SmbServerNameHardeningLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -ge 1) { 'VERIFIED' }
        else { 'NOT_VERIFIED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: VERIFIED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'SmbServerNameHardeningLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The milder degree is set: the name is checked where the client gives one.
    # Demanding it always is a deployment decision and is left to the operator.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SmbServerNameHardeningLevel' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-server-server-spn-target-name-validation-level

notes:
  pl: |
    Punkt podniosłem względem paczki stanowiska roboczego zarówno
    w ryzyku, jak i w klasie uciążliwości. Serwer jest celem
    przekierowania uwierzytelnienia, więc zysk jest tu większy —
    a nazwy aliasowe występują na serwerach plików powszechnie,
    więc koszt również.

    Naprawa ustawia stopień łagodniejszy, czyli sprawdzenie nazwy
    wtedy, gdy klient ją podaje. Stopień ostrzejszy spełnia punkt tak
    samo, ale jest decyzją wdrożeniową i nie wprowadzam go za
    użytkownika.

    Przed zmianą ustal wszystkie nazwy, pod którymi ludzie łączą się
    z tym serwerem, i zarejestruj je dla niego w domenie. Punkt zostaje
    poza trybem zbiorczym.
  en: |
    I raised the item against the working station's pack both in risk and in the class of
    disruption. A server is the target of a carrying across of authentication, so the gain is
    here the greater - and alias names are common on file servers, so the cost is too.

    The mending sets the milder degree, the checking of the name where the client gives one. The
    stricter degree meets the item just as well, but is a rollout decision and I do not bring it
    in for the operator.

    Before the change, settle every name people connect to this server by and register them for
    it in the domain. The item stays outside the bulk mode.
