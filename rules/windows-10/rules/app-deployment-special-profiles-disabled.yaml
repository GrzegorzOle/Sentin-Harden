id: win10-app-deployment-special-profiles-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji w profilach specjalnych zablokowane
    en: The laying on of packages of applications in profiles apart blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość wdrożenia pakietu aplikacji w profilu
    specjalnym, czyli takim, który nie należy do zwykłego użytkownika.

    Profilami specjalnymi są profile kont usługowych, profile obowiązkowe
    i profile tymczasowe tworzone, gdy właściwy profil jest niedostępny.
    Łączy je to, że nikt się na nich nie loguje w zwykłym rozumieniu,
    i nikt ich nie ogląda.

    Zagrożenie polega na tym, że pakiet zainstalowany w takim profilu
    znika z pola widzenia. Nie pojawia się na liście aplikacji żadnego
    użytkownika, bo do żadnego nie należy, a jednocześnie żyje w systemie
    i może być uruchamiany.

    Profil tymczasowy jest przypadkiem osobnym. Powstaje i ginie, więc
    zmiana w nim wprowadzona bywa niepowtarzalna — a to utrudnia zarówno
    wykrycie, jak i późniejsze wyjaśnienie, skąd coś się wzięło.

    Odnotowuję, że punkt nie dotyczy zwykłego instalowania pakietów przez
    użytkowników ani wdrażania przez administratora w profilach
    normalnych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce
    na pakiet, którego nikt nie ogląda i który nie należy do nikogo.
  en: |
    The setting takes away the power of rolling out a package of an application in a profile apart, which is to
    say one not belonging to an ordinary user.

    Profiles apart are the profiles of reckonings of service, profiles laid down as binding, and profiles for the
    while made when the proper profile is not to be had. What joins them is that nobody logs on to them in the
    ordinary sense, and nobody looks at them.

    The danger lies in this, that a package laid on in such a profile goes out of sight. It shows upon no user's
    roll of applications, belonging to none, and at the same time it lives in the system and may be set going.

    A profile for the while is a case apart. It comes to be and it perishes, so a change brought into it is at
    times not to be had again - and that makes both the finding of it and the later setting out of whence a thing
    came the harder.

    I set down that the item touches not the ordinary laying on of packages by users nor the rolling out by an
    administrator in ordinary profiles.

    What an attacker gains while the item goes unmet: a place for a package nobody looks at and that belongs to
    nobody.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    na maszynie działają konta usługowe z własnym profilem, którym
    przypisano pakiety.

    Miejscem wartym uwagi są rozwiązania zbudowane wokół konta usługowego
    uruchamiającego aplikację z pakietu. Spotyka się to w narzędziach
    kiosku, w stanowiskach pokazowych i w rozwiązaniach branżowych.
    Po zmianie wdrożenie takiego pakietu przestanie przechodzić.

    Miejscem drugim są stanowiska z profilami obowiązkowymi, na których
    zestaw aplikacji ustala się raz dla wszystkich. Warto sprawdzić,
    którędy ten zestaw jest wprowadzany.

    Odnotowuję, że na stanowisku zwykłym, bez kont usługowych z profilem
    i bez profili obowiązkowych, punkt nie zmienia nic.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: instalowania pakietów przez użytkowników, sklepu
    systemowego, pakietów już zainstalowanych, programów klasycznych,
    logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether there work upon the machine reckonings of
    service with a profile of their own to which packages were given.

    The place worth notice is answers built about a reckoning of service that sets going an application out of a
    package. That is met with in tools of a kiosk, in stations of showing and in answers of a trade. After the
    change the rolling out of such a package will cease to come through.

    The second place is stations with profiles laid down as binding, upon which the set of applications is settled
    once for all. It is worth looking at by which road that set is brought in.

    I set down that upon an ordinary station, without reckonings of service with a profile and without binding
    profiles, the item changes nothing.

    The consequence shows at once, with no restart.

    What this does not break: the laying on of packages by users, the system's store, packages already laid on,
    programs of the older make, logging on, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Wdrożenie pakietu przypisanego do konta usługowego z własnym profilem przestanie przechodzić
      - Dotyczy to zwłaszcza narzędzi kiosku, stanowisk pokazowych i rozwiązań branżowych zbudowanych wokół takiego konta
      - Stanowiska z profilami obowiązkowymi wymagają sprawdzenia, którędy wprowadzany jest zestaw aplikacji
      - Na stanowisku zwykłym, bez kont usługowych z profilem, zmiana nie robi nic
      - Instalowanie pakietów przez użytkowników, sklep systemowy, programy klasyczne, logowanie i drukowanie pozostają bez zmian
    en:
      - The rolling out of a package given to a reckoning of service with a profile of its own will cease to come through
      - That holds above all of tools of a kiosk, stations of showing and answers of a trade built about such a reckoning
      - Stations with binding profiles call for a look at the road by which the set of applications is brought in
      - Upon an ordinary station, without reckonings of service with a profile, the change does nothing
      - The laying on of packages by users, the system s store, programs of the older make, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Rozwiązanie kiosku albo stanowiska pokazowego opiera się na pakiecie wdrożonym w profilu konta usługowego
    en:
      - An answer of a kiosk or of a station of showing rests upon a package rolled out in the profile of a reckoning of service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDeploymentInSpecialProfiles'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowDeploymentInSpecialProfiles'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDeploymentInSpecialProfiles' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-applicationmanagement

notes:
  pl: |
    Reguła dotyczy przypadku rzadkiego i warto, żeby aplikacja to
    powiedziała wprost — inaczej czytelnik uzna ją za kolejny punkt
    o instalowaniu i przeoczy, czym się różni. Różnica jest w tym, gdzie
    pakiet ląduje, a nie w tym, kto go instaluje.

    Argument wart postawienia wprost dotyczy widoczności. Pakiet w profilu
    specjalnym nie pojawia się na liście aplikacji żadnego użytkownika,
    bo do żadnego nie należy. Znika więc z każdego przeglądu, który
    zaczyna się od pytania, co dany człowiek ma zainstalowane.

    Odnotowuję przypadek profilu tymczasowego. Powstaje i ginie, więc
    zmiana w nim wprowadzona bywa niepowtarzalna — co utrudnia nie tylko
    wykrycie, ale i późniejsze wyjaśnienie zdarzenia.
  en: |
    The rule touches a case seldom met and it is well that the application say so outright - else the reader will
    hold it another item about laying on and will overlook wherein it differs. The difference lies in where the
    package comes to rest and not in who lays it on.

    The argument worth putting outright touches being seen. A package in a profile apart shows upon no user's roll
    of applications, belonging to none. It vanishes therefore from every review that begins with the question what
    a given person has laid on.

    I set down the case of a profile for the while. It comes to be and it perishes, so a change brought into it is
    at times not to be had again - which makes the harder not only the finding of it but the later setting out of
    the happening.
