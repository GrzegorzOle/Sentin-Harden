id: win2016-restrict-ntlm-outgoing

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Ograniczenie wychodzącego ruchu starszego mechanizmu uwierzytelniania
    en: Restriction of outgoing traffic of the older authentication mechanism
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, co maszyna robi, gdy sama uwierzytelnia się
    starszym mechanizmem wobec innego serwera: czy zapisuje to w dzienniku,
    czy odmawia.

    Kierunek wychodzący jest tu ważniejszy niż przychodzący i warto powiedzieć
    dlaczego. Uwierzytelniając się wobec cudzego serwera, maszyna wysyła
    materiał wyprowadzony z hasła konta. Jeżeli po drugiej stronie stoi
    napastnik — albo serwer, który przejął — ten materiał da się przekazać
    dalej, do trzeciej maszyny, i wejść tam jako to konto. Nie trzeba przy tym
    znać hasła ani go łamać.

    Najgroźniejszy wariant nie wymaga nawet, żeby ktoś świadomie się gdzieś
    logował. Wystarczy skłonić maszynę do sięgnięcia po zasób pod wskazanym
    adresem — odnośnikiem w dokumencie, ścieżką w pliku konfiguracyjnym,
    obrazkiem w wiadomości. Uwierzytelnienie pójdzie samo, bo tak działa ten
    mechanizm.

    Na serwerze sprawa jest poważniejsza niż na stacji roboczej, bo usługi
    działają tam na kontach o szerokich uprawnieniach, a ich połączenia
    wychodzące nie są przez nikogo oglądane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: materiał
    uwierzytelniający konta serwera, wywabiony z maszyny bez jednego hasła
    i nadający się do wejścia na kolejną maszynę w sieci.
  en: |
    The setting decides what the machine does when it itself authenticates by the
    older mechanism towards another server: whether it records this in the log or
    refuses.

    The outgoing direction matters more here than the incoming one, and it is worth
    saying why. Authenticating towards somebody else's server, the machine sends
    material derived from an account's password. If an attacker stands on the other
    side - or a server they have taken - that material can be passed on, to a third
    machine, and used to get in there as that account. Neither knowing the password
    nor breaking it is needed for this.

    The most dangerous variant does not even call for somebody knowingly signing in
    anywhere. It suffices to induce the machine to reach for a resource at a given
    address - by a link in a document, a path in a configuration file, a picture in
    a message. The authentication will go of itself, for that is how the mechanism
    works.

    On a server the matter is graver than on a workstation, since services there run
    under accounts with wide privileges, and their outgoing connections are looked
    at by nobody.

    What an attacker gains while the item goes unmet: authentication material for
    the server's account, drawn out of the machine without a single password and fit
    for getting in to the next machine on the network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie sprowadza się do jednego pytania:
    czy wiadomo, do których serwerów ta maszyna uwierzytelnia się starszym
    mechanizmem.

    Reguła wpisuje wariant łagodniejszy — zapis, nie odmowę — i jest to wybór
    świadomy. Odmowa bez znajomości tej listy odcina dostęp do zasobów, o których
    istnieniu nikt nie pamiętał, a lista powstaje dopiero po miesiącu zapisu.
    Wdrożenie od razu wariantu odmawiającego jest najczęstszym sposobem na
    zepsucie kopii zapasowych i monitoringu w jednej chwili.

    Zapis nie psuje niczego. Jego koszt to dodatkowe wpisy w dzienniku, tym
    liczniejsze, im więcej maszyna sięga na zewnątrz.

    Odmowa — do której ten punkt jest przygotowaniem — psuje trzy rzeczy
    i wszystkie warto znać zawczasu. Pierwsza: połączenia do maszyn spoza
    domeny, bo tam nie ma innego mechanizmu. Druga: dostęp do urządzeń
    udostępniających zasoby, które nie znają uwierzytelniania domenowego.
    Trzecia: oprogramowanie łączące się po adresie sieciowym zamiast po nazwie,
    bo taka postać adresu sama wyklucza nowszy mechanizm.

    Czego to nie psuje w wariancie zapisu: połączeń wychodzących, kopii
    zapasowych, monitoringu ani pracy usług.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review comes down to one question: is it
    known to which servers this machine authenticates by the older mechanism.

    The rule writes the milder variant - recording, not refusal - and that is a
    knowing choice. Refusal without knowing that list cuts off access to resources
    nobody remembered existed, and the list arises only after a month of recording.
    Applying the refusing variant at once is the commonest way of breaking the
    backups and the monitoring in a single moment.

    Recording breaks nothing. Its cost is extra entries in the log, the more
    numerous the more the machine reaches outside.

    Refusal - for which this item is the preparation - breaks three things, and all
    three are worth knowing in advance. First: connections to machines outside the
    domain, since there is no other mechanism there. Second: access to devices
    offering resources that know nothing of domain authentication. Third: software
    connecting by network address instead of by name, since that form of address by
    itself rules the newer mechanism out.

    What this does not break in the recording variant: outgoing connections,
    backups, monitoring, or the working of services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - logging-and-audit
    - file-sharing
    - remote-management
  what_breaks:
    pl:
      - W wariancie zapisu przybywa wpisów w dzienniku, tym więcej, im częściej maszyna sięga po zasoby poza domeną
      - W wariancie odmowy połączenia do maszyn spoza domeny przestają się uwierzytelniać, bo nie ma tam innego mechanizmu
      - W wariancie odmowy oprogramowanie łączące się po adresie sieciowym zamiast po nazwie traci dostęp
      - Połączenia wychodzące, kopie zapasowe i monitoring pozostają bez zmian, dopóki wybrany jest wariant zapisu
    en:
      - In the recording variant entries accumulate in the log, the more the oftener the machine reaches for resources outside the domain
      - In the refusing variant connections to machines outside the domain cease to authenticate, since there is no other mechanism there
      - In the refusing variant software connecting by network address instead of by name loses access
      - Outgoing connections, backups and monitoring stay unchanged so long as the recording variant is chosen
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie wiadomo, do których serwerów ta maszyna uwierzytelnia się starszym mechanizmem, bo zapis nie przeszedł pełnego cyklu miesięcznego
      - Maszyna łączy się z zasobami spoza domeny albo z urządzeniami nieznającymi uwierzytelniania domenowego
    en:
      - It is not known to which servers this machine authenticates by the older mechanism, since the recording has not run a full monthly cycle
      - The machine connects to resources outside the domain or to devices that know nothing of domain authentication
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One records, two refuses. Both count as compliant here, since the
      # benchmark takes a knowing choice rather than one particular value.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'RestrictSendingNTLMTraffic'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[12]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'RestrictSendingNTLMTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Audit, not deny: refusing without knowing which servers rely on this mechanism
    # cuts access off, and the list only exists once the recording has run through a
    # full monthly cycle.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictSendingNTLMTraffic' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-outgoing-ntlm-traffic-to-remote-servers

notes:
  pl: |
    Audyt przyjmuje dwie wartości: zapis i odmowę. Obie są zgodne, bo punkt
    żąda świadomego wyboru, a nie jednej konkretnej wartości. Aplikacja
    powinna jednak pokazywać, która z nich jest ustawiona, bo różnica między
    nimi to różnica między przygotowaniem a zabezpieczeniem.

    Punkt czyta się w parze z regułą o zapisie ruchu przychodzącego. Tamta
    odpowiada na pytanie „kto się tak uwierzytelnia u mnie", ta na „gdzie ja
    się tak uwierzytelniam". Dopiero obie razem dają obraz pozwalający
    przejść do odmowy.

    Właściwym zakończeniem pracy z tym punktem jest przejście na odmowę
    z listą wyjątków dla serwerów, które faktycznie tego mechanizmu wymagają.
    Aplikacja nie powinna tego robić za użytkownika, ale powinna to nazwać
    jako następny krok, zamiast zostawiać zgodność w wariancie zapisu jako
    stan docelowy.
  en: |
    The audit accepts two values: recording and refusal. Both are compliant, since
    the item demands a knowing choice rather than one particular value. The
    application should nonetheless show which of them is set, for the difference
    between them is the difference between a preparation and a safeguard.

    The item reads in a pair with the rule on recording incoming traffic. That one
    answers the question "who authenticates thus at my end", this one "where do I
    authenticate thus". Only both together give a picture allowing a move to
    refusal.

    The proper end of working with this item is a move to refusal with a list of
    exceptions for the servers that genuinely need this mechanism. The application
    should not do that for the user, but it should name it as the next step rather
    than leaving compliance in the recording variant as the final state.
