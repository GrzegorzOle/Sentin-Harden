id: fedora44-faillock-root

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.3.3.1.3
  section: Access Control > Pluggable Authentication Modules > Configure pluggable module arguments > Configure pam_faillock module
  title:
    pl: Blokada po nieudanych próbach logowania obejmuje konto root
    en: Ensure password failed attempts lockout includes root account
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    pam_faillock domyślnie nie blokuje konta root, więc hasło roota można
    zgadywać bez limitu tam, gdzie root może się logować hasłem, np. na
    konsoli albo przez su. Opcja even_deny_root obejmuje blokadą także
    roota.

    Punkt wymaga opcji even_deny_root albo root_unlock_time, która ją
    włącza; root_unlock_time musi wynosić co najmniej 60 sekund.
  en: |
    By default pam_faillock does not lock the root account, so the root
    password can be guessed without a limit wherever root can log in with a
    password, for example on the console or through su. The even_deny_root
    option puts root under the lock as well.

    The item requires the even_deny_root option, or root_unlock_time, which
    turns it on; root_unlock_time must be at least 60 seconds.

disruption_description:
  pl: |
    Po kilku błędnych hasłach roota, także przy su, konto root jest
    blokowane na czas unlock_time. W tym czasie root nie zaloguje się
    hasłem, a su do roota nie działa. sudo nie jest objęte blokadą roota,
    bo pyta o hasło użytkownika.
  en: |
    After a few wrong root passwords, also with su, the root account is
    locked for the unlock_time period. During that time root cannot log in
    with a password and su to root does not work. sudo is not affected by
    the root lock, because it asks for the user's password.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Administrator logujący się jako root hasłem po kilku pomyłkach czeka na odblokowanie
      - Każdy, kto może wywołać su, może celowo zablokować konto root błędnymi hasłami
    en:
      - An administrator who logs in as root with a password waits for the unlock after a few mistakes
      - Anyone who can run su can lock the root account on purpose with wrong passwords
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Komputer, na którym root jest jedyną drogą administracji i nie ma sudo ani innego konta z uprawnieniami
    en:
      - A computer where root is the only way to administer it and there is no sudo or other privileged account
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    # conf_get KEY FILE...: value of the last entry in the files read in this order.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name != k || name == "" { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*/, "", v)
          if (v ~ /^=/) sub(/^=[ \t]*/, "", v); else v = ""
          sub(/[ \t]+$/, "", v); val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value and conf=... on active lines of a module, one
    # "file:KEY=value" item each.
    pam_args() {
      local f
      for f in system-auth password-auth; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if (index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    root_ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 60) }'; }
    evaluate() {
      local a v bad="" s="" good=1
      for a in $(pam_args pam_faillock.so root_unlock_time); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          *) root_ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if conf_get even_deny_root /etc/security/faillock.conf >/dev/null; then s=even_deny_root; fi
      if v=$(conf_get root_unlock_time /etc/security/faillock.conf); then
        s="${s:+$s,}root_unlock_time=$v"
        root_ok "$v" || good=0
      fi
      if [ -n "$bad" ]; then echo "NOT_OK:${s:-no-even_deny_root},by-hand:${bad#,}"
      elif [ -n "$s" ] && [ "$good" = 1 ]; then echo "OK:$s"
      else echo "NOT_OK:${s:-no-even_deny_root}"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=secconf-1
        if [ -e /etc/security/faillock.conf ]; then echo existed=1; else echo existed=0; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/faillock.conf
      mark='# Sentin-Harden: fedora44-faillock-root'
      line='even_deny_root'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    # conf_get KEY FILE...: value of the last entry in the files read in this order.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name != k || name == "" { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*/, "", v)
          if (v ~ /^=/) sub(/^=[ \t]*/, "", v); else v = ""
          sub(/[ \t]+$/, "", v); val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value and conf=... on active lines of a module, one
    # "file:KEY=value" item each.
    pam_args() {
      local f
      for f in system-auth password-auth; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if (index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    root_ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 60) }'; }
    evaluate() {
      local a v bad="" s="" good=1
      for a in $(pam_args pam_faillock.so root_unlock_time); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          *) root_ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if conf_get even_deny_root /etc/security/faillock.conf >/dev/null; then s=even_deny_root; fi
      if v=$(conf_get root_unlock_time /etc/security/faillock.conf); then
        s="${s:+$s,}root_unlock_time=$v"
        root_ok "$v" || good=0
      fi
      if [ -n "$bad" ]; then echo "NOT_OK:${s:-no-even_deny_root},by-hand:${bad#,}"
      elif [ -n "$s" ] && [ "$good" = 1 ]; then echo "OK:$s"
      else echo "NOT_OK:${s:-no-even_deny_root}"; fi
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "$f already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        *by-hand:*) echo "The pam_faillock lines in the PAM files have arguments that decide it instead of $f (${r##*by-hand:}); change the authselect profile by hand" >&2; exit 1 ;;
      esac
      d=$(dirname "$f")
      old=$(mktemp "$d/.sentin-harden-old.XXXXXX")
      t=$(mktemp "$d/.sentin-harden.XXXXXX")
      trap 'rm -f "$old" "$t"' EXIT
      if [ -e "$f" ]; then had=1; cat "$f" > "$old"; else had=0; fi
      # The last entry wins, so the line of this rule goes at the end; an older
      # copy of it is removed.
      { if [ "$had" = 1 ]; then awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f"; fi
        echo "$mark"; echo "$line"; } > "$t"
      if [ "$had" = 1 ]; then chmod --reference="$f" "$t"; chown --reference="$f" "$t"; else chmod 644 "$t"; chown root:root "$t"; fi
      mv -f "$t" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) if [ "$had" = 1 ]; then cat "$old" > "$f"; else rm -f "$f"; fi
           echo "$f does not meet the item after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
      echo "Set $line in $f"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/faillock.conf
      mark='# Sentin-Harden: fedora44-faillock-root'
      line='even_deny_root'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      e=$(sed -n '2s/^existed=//p' "$b")
      case "$e" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ ! -f "$f" ] || ! grep -qxF "$mark" "$f"; then echo "The line of this rule is not in $f, nothing to restore"; exit 0; fi
      t=$(mktemp "$(dirname "$f")/.sentin-harden.XXXXXX")
      trap 'rm -f "$t"' EXIT
      # Only the marked line of this rule goes; the rest of the file stays as it is now.
      awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f" > "$t"
      if grep -A 1 -xF "$mark" "$f" | grep -qxF "$line"; then kept=0; else kept=1; fi
      if [ "$e" = 0 ] && ! grep -q '[^[:space:]]' "$t"; then
        rm -f "$f"; echo "Removed $f, which this rule created"; exit 0
      fi
      chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if [ "$kept" = 1 ]; then
        echo "Removed the comment of this rule from $f; the line under it was changed by hand and stays"
      else
        echo "Removed the even_deny_root line of this rule from $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/faillock.conf.5.html
  - https://man7.org/linux/man-pages/man8/pam_faillock.8.html

notes:
  pl: |
    pam_faillock czyta najpierw /etc/security/faillock.conf, a potem
    argumenty ze swoich wierszy w /etc/pam.d/system-auth i password-auth,
    więc argument w pliku PAM wygrywa z plikiem faillock.conf. W pliku
    wygrywa ostatni wpis danego klucza. Sprawdzenie bierze ostatni wpis
    z faillock.conf, a gdy go nie ma, wartość domyślną modułu. Argument
    w wierszu pam_faillock z niepoprawną wartością albo argument conf= daje
    wynik NOT_OK z dopiskiem by-hand; naprawa wtedy niczego nie zmienia, bo
    te wiersze pochodzą z szablonu profilu authselect i trzeba je poprawić
    ręcznie.

    Naprawa dopisuje na końcu faillock.conf wiersz tej reguły pod
    komentarzem Sentin-Harden, a wcześniejsze wpisy zostawia bez zmian.
    Wycofanie usuwa tylko te dwa wiersze. Ustawienie działa dopiero wtedy,
    gdy pam_faillock jest włączony (punkt 5.3.2.2).

    Naprawa dopisuje even_deny_root. root_unlock_time bez tej opcji też
    spełnia punkt, bo ją włącza; wartość poniżej 60 sekund daje wynik NOT_OK
    i naprawa jej nie zmienia. Bez root_unlock_time konto root odblokowuje
    się po unlock_time. Zablokowanego roota odblokowuje się poleceniem
    faillock --user root --reset, np. przez sudo.
  en: |
    pam_faillock reads /etc/security/faillock.conf first and then the
    arguments on its lines in /etc/pam.d/system-auth and password-auth, so
    an argument in the PAM file wins over faillock.conf. In the file the
    last entry of a key wins. The check takes the last entry in
    faillock.conf and, when there is none, the default of the module. An
    argument on a pam_faillock line with a wrong value, or a conf= argument,
    gives the NOT_OK result with a by-hand note; the remediation then
    changes nothing, because these lines come from the authselect profile
    template and have to be fixed by hand.

    The remediation appends the line of this rule at the end of
    faillock.conf under a Sentin-Harden comment and leaves earlier entries
    as they are. Rollback removes only these two lines. The setting only
    works when pam_faillock is enabled (item 5.3.2.2).

    The remediation adds even_deny_root. root_unlock_time without this
    option also meets the item, because it turns it on; a value below 60
    seconds gives the NOT_OK result and the remediation does not change it.
    Without root_unlock_time the root account is unlocked after
    unlock_time. A locked root is unlocked with faillock --user root
    --reset, for example through sudo.
