id: win2016-password-reveal-button-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Przycisk pokazujący wpisywane hasło ukryty
    en: The button revealing a typed password hidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa przycisk pozwalający pokazać wpisywane hasło zamiast
    kropek.

    Przycisk ten powstał z dobrego powodu. Hasło wpisywane na ślepo bywa
    wpisywane błędnie, a przy hasłach długich i złożonych dzieje się to
    często. Możliwość sprawdzenia, co się właściwie wpisało, ogranicza
    liczbę nieudanych prób i blokad konta.

    Cena jest jednak konkretna i łatwa do przeoczenia. Hasło pokazane na
    ekranie przestaje być tajemnicą wobec wszystkiego, co ten ekran widzi.
    A ekran widzi więcej rzeczy, niż się zakłada: osoba obok, kamera
    w pomieszczeniu, sesja zdalna z włączonym udostępnianiem, nagranie
    szkoleniowe, zrzut ekranu dołączony do zgłoszenia.

    Ostatni przypadek jest najczęstszy i najbardziej przewrotny.
    Użytkownik zgłaszający kłopot z logowaniem dołącza zrzut ekranu, na
    którym pokazał hasło, żeby udowodnić, że wpisał je dobrze.

    Na serwerze dochodzi do tego sesja zdalna administratora, w której
    pokazane hasło idzie przez sieć jako obraz i może zostać nagrane przez
    narzędzie po drugiej stronie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    odczytane z obrazu — z nagrania, ze zrzutu, przez ramię — bez dotykania
    maszyny.
  en: |
    The setting removes the button letting a typed password be shown instead of dots.

    That button came about for a good reason. A password typed blind is at times typed
    wrongly, and with long and complex passwords that happens often. Being able to
    check what one actually typed cuts down the number of failed attempts and account
    lockouts.

    The price is particular all the same, and easily passed over. A password shown on
    the screen ceases to be a secret towards everything that sees that screen. And the
    screen is seen by more things than one assumes: a person beside, a camera in the
    room, a remote session with sharing on, a training recording, a screenshot attached
    to a report.

    The last case is the commonest and the most perverse. A user reporting trouble with
    signing in attaches a screenshot in which they revealed the password, to prove they
    typed it right.

    On a server there follows an administrator's remote session, in which a revealed
    password goes over the network as a picture and may be recorded by a tool at the
    other end.

    What an attacker gains while the item goes unmet: a password read from a picture -
    from a recording, from a screenshot, over a shoulder - without touching the
    machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Punkt usuwa jeden przycisk z okien pytających o hasło. Logowanie,
    podnoszenie uprawnień i podawanie poświadczeń działają tak jak dotąd.

    Skutek uboczny istnieje i warto go nazwać, choć jest drobny: bez
    możliwości sprawdzenia wpisanego hasła rośnie liczba nieudanych prób,
    a przy ustawionej blokadzie konta — liczba blokad. Dotyczy to zwłaszcza
    haseł długich wpisywanych na klawiaturze innego układu, co w sesji
    zdalnej zdarza się częściej, niż mogłoby się wydawać.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi.

    Czego to nie psuje: logowania, podnoszenia uprawnień, zapamiętywania
    poświadczeń, usług, sieci.
  en: |
    The class is "no disruption".

    The item removes one button from the windows asking for a password. Signing in,
    raising rights and giving credentials work as before.

    A side effect exists and is worth naming, though a small one: without the
    possibility of checking a typed password the number of failed attempts grows, and
    with account lockout set, the number of lockouts. That touches above all long
    passwords typed on a keyboard of another layout, which in a remote session happens
    more often than it might seem.

    No restart, sign-out or stopping of a service goes with it.

    What this does not break: signing in, raising rights, remembering credentials,
    services, or the network.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Bez możliwości sprawdzenia wpisanego hasła rośnie liczba nieudanych prób, a przy ustawionej blokadzie konta - liczba blokad
      - Dotyczy to zwłaszcza haseł długich wpisywanych na klawiaturze innego układu, co w sesji zdalnej zdarza się często
      - Logowanie, podnoszenie uprawnień i zapamiętywanie poświadczeń działają tak jak dotąd
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
    en:
      - Without the possibility of checking a typed password the number of failed attempts grows, and with account lockout set, the number of lockouts
      - That touches above all long passwords typed on a keyboard of another layout, which happens often in a remote session
      - Signing in, raising rights and remembering credentials work as before
      - No restart, no sign-out, no stopping of a service
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracują osoby wpisujące długie hasła na klawiaturze innego układu i blokada konta jest ustawiona bardzo nisko
    en:
      - People typing long passwords on a keyboard of another layout work at the machine and account lockout is set very low
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
      $name = 'DisablePasswordReveal'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    $name = 'DisablePasswordReveal'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordReveal' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-credentialsui

notes:
  pl: |
    Punkt zamyka blok i jest w nim jedynym dotyczącym chwili wpisywania
    hasła, a nie chwili przed nim. Pozostałe pięć dotyczy tego, co widać,
    zanim ktokolwiek cokolwiek wpisze.

    Kategoria średnia przy klasie bez uciążliwości czyni z niego kandydata
    do trybu zbiorczego. Wyższa niż przy dwóch regułach o wyliczaniu, bo
    przedmiotem jest samo hasło, a nie nazwa konta.

    Blok liczy sześć reguł i rozkłada się nierówno. Jedna wymaga świadomego
    wdrożenia i może odciąć od maszyny osobę uprawnioną. Jedna ma kategorię
    krytyczną i zostawia po sobie hasło w rejestrze, którego nie usuwa.
    Pozostałe cztery są w klasie bez uciążliwości i idą hurtem. Jest to
    dobry przykład na to, że numer punktu w benchmarku nic nie mówi
    o kolejności pracy.
  en: |
    The item shuts the block and is the only one in it concerning the moment of typing
    a password rather than the moment before. The other five concern what is seen
    before anybody types anything.

    A medium category with the class no disruption makes it a candidate for bulk mode.
    Higher than at the two rules about listing, the subject being the password itself
    rather than an account's name.

    The block counts six rules and falls out unevenly. One calls for a planned rollout
    and can cut an entitled person off from the machine. One is of a critical category
    and leaves behind a password in the registry which it does not remove. The other
    four are of the class no disruption and go in bulk. It is a good example of an
    item's number in the benchmark saying nothing about the order of work.
