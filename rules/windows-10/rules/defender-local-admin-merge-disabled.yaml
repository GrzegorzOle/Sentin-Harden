id: win10-defender-local-admin-merge-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Dołączanie lokalnych list wyłączeń do zasady zablokowane
    en: Merging of local exclusion lists into the policy blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że o tym, czego ochrona nie sprawdza, rozstrzyga
    wyłącznie zasada — a lista dopisana na maszynie przestaje mieć
    znaczenie.

    Wyłączenie ze skanowania jest miejscem, w które ochrona nie zagląda
    z założenia. Napastnik z uprawnieniami administratora nie musi
    wyłączać ochrony, żeby ją ominąć: wystarczy, że dopisze do listy
    wyłączeń katalog, z którego zamierza pracować. Ochrona działa dalej,
    raport pokazuje ją jako włączoną, a wskazany katalog jest poza jej
    zasięgiem.

    Jest to droga tańsza od wyłączania mechanizmów, bo nie zmienia
    niczego widocznego. Wszystkie pozostałe punkty tej paczki pozostają
    spełnione, a ochrona i tak nie patrzy tam, gdzie trzeba.

    Odnotowuję, co się dzieje z listami istniejącymi. Nie są kasowane —
    zostają w rejestrze, ale przestają wpływać na skanowanie. Dzięki temu
    zmiana jest odwracalna i nie niszczy stanu zastanego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: katalog
    wyjęty spod skanowania jednym dopisaniem, przy ochronie działającej
    i raportowanej jako sprawna.
  en: |
    The setting makes it so that what the protection does not check is settled by the policy alone - and a list
    written upon the machine ceases to count.

    A leaving out of the scan is a place the protection by design does not look into. An attacker with an
    administrator's rights need not switch the protection off to go round it: it suffices that they write into
    the list of leavings out the folder they mean to work from. The protection goes on working, the report shows
    it as switched on, and the named folder lies outside its reach.

    It is a road cheaper than the switching off of mechanisms, changing nothing that shows. Every other item of
    this pack stays met, and the protection still does not look where it should.

    I set down what becomes of the lists that already are. They are not struck out - they stay in the registry
    but cease to bear upon the scan. By that the change may be undone and does not destroy the state found.

    What an attacker gains while the item goes unmet: a folder taken out from under the scan by one writing, the
    protection working and reported as sound.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana potrafi zatrzymać
    pracę, która dotąd szła.

    Listy wyłączeń robione na maszynie powstają nie bez powodu. Wpisano
    tam katalogi, w których skanowanie kolidowało z pracą: katalog
    kompilacji, katalog maszyn wirtualnych, katalog bazy danych, katalog
    programu, który ochrona rozpoznawała fałszywie. Po zmianie wszystkie
    te wpisy przestają działać naraz.

    Skutki są dwojakie. Tam, gdzie chodziło o wydajność, wraca
    spowolnienie — czasem kilkukrotne. Tam, gdzie chodziło o fałszywe
    trafienie, program przestaje się uruchamiać.

    Postępowanie właściwe jest jedno: przed zmianą zebrać listy istniejące
    z maszyn, przejrzeć je i te uzasadnione przenieść do zasady. Zmiana
    wykonana bez tego kroku jest zmianą, która na części maszyn zatrzyma
    pracę tego samego dnia.

    Odnotowuję, że nie wymaga restartu ani wylogowania i działa od razu —
    co w tym wypadku znaczy, że skutki pojawią się natychmiast, a nie
    przy najbliższej okazji.

    Czego to nie psuje: samego skanowania, wykrywania zagrożeń, logowania,
    udziałów plikowych, drukowania.
  en: |
    The class is "needs a planned rollout", the change being able to stop work that until then went on.

    Lists of leavings out made upon a machine come about for a reason. Written there are the folders in which
    scanning stood in the way of work: the folder of compiling, the folder of virtual machines, the folder of a
    database, the folder of a program the protection knew falsely. After the change all those entries cease to
    work at once.

    The consequences are twofold. Where it was about speed, the slowing returns - at times several times over.
    Where it was about a false hit, the program ceases to start.

    The right course is one: before the change, gather the lists that are from the machines, look them over and
    carry the grounded ones into the policy. A change made without that step is a change that upon a part of the
    machines will stop work the same day.

    I set down that it calls for no restart and no logging off and works at once - which here means the
    consequences will come up straight away and not at the nearest occasion.

    What this does not break: the scan itself, the finding of threats, logging on, file shares, or printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - virtualization-and-containers
    - updates-and-servicing
  what_breaks:
    pl:
      - Katalogi kompilacji, maszyn wirtualnych i baz danych wracają do skanowania, a praca zwalnia nawet kilkukrotnie
      - Program wyłączony ze skanowania z powodu fałszywego trafienia przestaje się uruchamiać
      - Wszystkie wpisy lokalne przestają działać naraz, więc skutki pojawiają się tego samego dnia
      - Listy istniejące nie są kasowane, tylko przestają wpływać na skanowanie, więc zmianę da się cofnąć
      - Samo skanowanie, wykrywanie zagrożeń, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - The folders of compiling, of virtual machines and of databases return to the scan, and work slows several times over
      - A program left out of the scan because of a false hit ceases to start
      - Every local entry ceases to work at once, so the consequences come up the same day
      - The lists that are are not struck out but cease to bear upon the scan, so the change may be undone
      - The scan itself, the finding of threats, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Listy wyłączeń z maszyn nie zostały zebrane i przeniesione do zasady, więc zmiana zatrzyma pracę tego samego dnia
      - Maszyna służy do budowania oprogramowania, a wyłączenia katalogów roboczych są warunkiem jej użyteczności
    en:
      - The lists of leavings out have not been gathered from the machines and carried into the policy, so the change will stop work the same day
      - The machine serves for the building of software and the leaving out of the working folders is the condition of its usefulness
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One here means the merging of local lists is forbidden.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableLocalAdminMerge'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableLocalAdminMerge'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From this moment only the lists written by the policy count. Lists made
    # locally stay in the registry but cease to bear upon the scan.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalAdminMerge' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-exclusions-microsoft-defender-antivirus

notes:
  pl: |
    Reguła otwiera blok i jest w nim jedyną wymagającą świadomego
    wdrożenia. Pozostałe stroją zachowanie ochrony; ta rozstrzyga, kto
    w ogóle może jej zachowanie zmieniać.

    Argument wart postawienia wprost dotyczy tego, że wyłączenie ze
    skanowania nie wygląda na atak. Wszystkie punkty tej paczki
    pozostają spełnione, ochrona działa, raport jest zielony — a katalog
    wskazany na liście jest poza jej zasięgiem. Jest to obejście
    niezostawiające po sobie niczego, co wyglądałoby na wyłączenie.

    Odnotowuję kolejność pracy, bo od niej zależy, czy zmiana przejdzie.
    Najpierw zebranie list z maszyn, potem ich przegląd, potem przeniesienie
    uzasadnionych do zasady, dopiero na końcu ta zmiana. Aplikacja
    powinna to powiedzieć, bo sama reguła jest jednym wpisem i wygląda
    na drobiazg.
  en: |
    The rule opens the block and is the only one in it calling for a planned rollout. The rest tune the
    protection's behaviour; this settles who may change that behaviour at all.

    The argument worth putting outright touches this, that a leaving out of the scan does not look like an
    attack. Every item of this pack stays met, the protection works, the report is green - and the folder named
    upon the list lies outside its reach. It is a going round that leaves behind nothing looking like a switching
    off.

    I set down the order of work, upon which hangs whether the change will pass. First the gathering of the lists
    from the machines, then the looking over of them, then the carrying of the grounded ones into the policy, and
    only at the end this change. The application ought to say so, the rule itself being one entry and looking
    like a trifle.
