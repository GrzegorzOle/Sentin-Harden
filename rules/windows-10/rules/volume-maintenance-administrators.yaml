id: win10-volume-maintenance-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Konserwacja woluminów zastrzeżona dla administratorów
    en: The upkeep of volumes reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo wykonywania zadań konserwacji woluminów dla
    administratorów lokalnych.

    Prawo to obejmuje operacje sięgające dysku z pominięciem systemu
    plików: sprawdzanie i naprawę struktury, porządkowanie rozmieszczenia
    danych oraz odczyt nieprzydzielonych obszarów nośnika.

    Zagrożenie polega na tym, że dysk czytany w ten sposób nie zna
    uprawnień. Uprawnienia są własnością systemu plików, a ten jest
    warstwą leżącą wyżej. Konto z tym prawem odczytuje zawartość nośnika
    wprost, więc pliki, do których nie ma dostępu, przestają być
    niedostępne.

    Wartość dla napastnika jest podwójna. Pierwszą jest odczyt plików
    chronionych uprawnieniami. Drugą, mniej oczywistą, jest odczyt
    obszarów oznaczonych jako wolne — tam leżą fragmenty plików usuniętych,
    w tym takich, które usunięto właśnie dlatego, że były wrażliwe.

    Odnotowuję, że prawo to pozwala także zapisywać. Uszkodzenie struktury
    systemu plików czyni wolumin niedostępnym, a przywrócenie go wymaga
    kopii zapasowej.

    Sprawdzenie przyjmuje wykaz węższy niż wymagany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    całego nośnika z pominięciem uprawnień, łącznie z obszarami wolnymi.
  en: |
    The setting reserves the right of carrying out the tasks of the upkeep of volumes to the local administrators.

    That right holds doings that reach the disk with the system of files passed over: the checking and the mending
    of its build, the ordering of where data lie and the reading of the unallotted stretches of the medium.

    The danger rests in this, that a disk read in that manner knows no rights. Rights are the property of the
    system of files, and that is a layer lying higher. An account with this right reads the medium's content
    outright, so files it has no way into cease to be out of its way.

    The worth to an attacker is twofold. The first is the reading of files guarded by rights. The second, the less
    plain, is the reading of the stretches marked as free - there lie the pieces of files deleted, among them such
    as were deleted for the very reason that they were tender.

    I set down that the right lets there be writing too. A harming of the build of the system of files makes a
    volume not to be come at, and the bringing of it back calls for a copy set aside.

    The check takes a list narrower than the one called for.

    What an attacker gains while the item goes unmet: the reading of a whole medium with rights passed over, the
    free stretches included.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz zawiera samych administratorów i na maszynie
    utrzymywanej normalnie zmiana jest zapisem stanu.

    Odnotowuję dwa miejsca warte spojrzenia. Pierwszym są narzędzia do
    porządkowania dysków i odzyskiwania danych, uruchamiane z konta
    serwisowego. Po zmianie zgłoszą błąd uprawnień. Drugim są bazy danych
    tworzące duże pliki z pominięciem zerowania — bez tego prawa plik
    i tak powstanie, ale jego tworzenie potrwa znacznie dłużej.

    Skutek drugi jest wart wymienienia, bo nie objawia się błędem, tylko
    spowolnieniem. Baza wystartuje i będzie działać, a wydłuży się
    przygotowanie plików przy rozszerzaniu.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: pracy z plikami, sprawdzania dysku uruchamianego
    przez administratora, logowania, wydajności bieżącej, drukowania.
  en: |
    The class is "no disruption".

    The default list holds the administrators alone, and upon a machine kept in the ordinary way the change is a
    setting down of a state.

    I set down two places worth a look. The first is tools for the tidying of disks and the winning back of data,
    run from a service account. After the change they will report a fault of rights. The second is bases of data
    that make great files with the setting of them to nought passed over - without this right the file will come
    about none the less, but the making of it will take far longer.

    The second consequence is worth naming, showing itself not by a fault but by a slowing. The base will start
    and will work, and the readying of files at their widening will draw out.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: work with files, the checking of a disk run by an administrator, logging on, speed
    in the running hour, or printing.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - accounts-and-passwords
  what_breaks:
    pl:
      - Narzędzia do porządkowania dysków i odzyskiwania danych z konta serwisowego zgłoszą błąd uprawnień
      - Bazy danych tworzące duże pliki stracą pominięcie zerowania, więc rozszerzanie plików potrwa dłużej
      - Skutek drugi nie objawia się błędem, tylko spowolnieniem, więc bywa przypisany innej przyczynie
      - Domyślny wykaz zawiera samych administratorów, więc na większości maszyn zmiana jest zapisem stanu
      - Praca z plikami, sprawdzanie dysku przez administratora, logowanie i drukowanie pozostają bez zmian
    en:
      - Tools for the tidying of disks and the winning back of data from a service account will report a fault of rights
      - Bases of data making great files will lose the passing over of the setting to nought, so the widening of files will take longer
      - The second consequence shows itself not by a fault but by a slowing, so it is at times set down to another cause
      - The default list holds the administrators alone, so upon most machines the change is a setting down of a state
      - Work with files, the checking of a disk by an administrator, logging on and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi baza danych tworząca duże pliki i zależna od pominięcia zerowania przy ich rozszerzaniu
      - Konto serwisowe uruchamia narzędzia do porządkowania dysków w ramach swoich obowiązków
    en:
      - Upon the machine stands a base of data making great files and hanging upon the passing over of the setting to nought at their widening
      - A service account runs tools for the tidying of disks as part of its duties
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeManageVolumePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeManageVolumePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeManageVolumePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeManageVolumePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeManageVolumePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/perform-volume-maintenance-tasks

notes:
  pl: |
    Reguła należy do tej samej rodziny co prawa do odczytu i zapisu
    z pominięciem uprawnień, ale działa warstwę niżej. Tamte omijają
    uprawnienia w systemie plików; ta omija sam system plików. Warto, żeby
    aplikacja pokazała tę czwórkę razem.

    Argument wart postawienia wprost dotyczy obszarów wolnych. Plik
    usunięty nie znika z nośnika — znika z wykazu. Do czasu nadpisania
    jego zawartość leży tam, gdzie leżała, a to prawo pozwala ją
    odczytać. Dotyczy to zwłaszcza plików usuwanych świadomie, bo były
    wrażliwe.

    Odnotowuję skutek dotyczący baz danych, bo jest praktycznie ważny
    i łatwo go przeoczyć. Nie objawia się błędem ani odmową, tylko
    wydłużeniem czasu tworzenia plików. Osoba szukająca przyczyny
    spowolnienia nie zajrzy do wykazu przywilejów, więc aplikacja powinna
    wymienić to wprost.
  en: |
    The rule belongs to the same family as the rights of reading and writing with rights passed over, but works a
    layer lower. Those go round rights within the system of files; this goes round the system of files itself. It
    is well that the application show the four together.

    The argument worth putting outright touches the free stretches. A file deleted does not vanish from the medium
    - it vanishes from the list. Until it is written over its content lies where it lay, and this right lets it be
    read. That holds above all of files deleted knowingly, because they were tender.

    I set down the consequence touching bases of data, that being of practical weight and easily overlooked. It
    shows itself by neither a fault nor a refusal, only by a drawing out of the time of the making of files.
    Whoever seeks the cause of a slowing will not look into a list of privileges, so the application ought to name
    it outright.
