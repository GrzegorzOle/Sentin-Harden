id: win2025-smartscreen-bypass-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Ostrzeżenie filtra reputacyjnego bez możliwości pominięcia
    en: The reputation filter's warning with no way past it
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że ostrzeżenie filtra reputacyjnego zatrzymuje
    uruchomienie, zamiast prosić o potwierdzenie.

    Kategoria wysoka i wyższa niż przy samym włączeniu filtra, bo to ten
    punkt decyduje, czy filtr cokolwiek zmienia. Ostrzeżenie, które da się
    pominąć jednym kliknięciem, jest sugestią. Człowiek, który właśnie
    pobrał narzędzie, żeby dokończyć pracę, tę sugestię odrzuci — nie
    dlatego, że lekceważy zagrożenie, tylko dlatego, że akurat wie, po co
    ten plik pobrał, i ostrzeżenie wygląda na pomyłkę.

    To jest właściwa treść punktu. Cała wartość filtra reputacyjnego ujawnia
    się w chwili, gdy użytkownik jest przekonany, że wie lepiej — a to jest
    dokładnie ta chwila, w której napastnik go zastał. Pytanie, na które ten
    punkt odpowiada, brzmi: czy decyzja należy do osoby stojącej przed
    ostrzeżeniem, czy została podjęta wcześniej.

    Na serwerze odpowiedź jest łatwiejsza niż na stanowisku. Serwer nie jest
    miejscem, w którym uruchamia się pobrane narzędzia „na szybko" — a jeżeli
    ktoś to robi, blokada jest odpowiedzią właściwą, nie przeszkodą.

    Uwaga na wpis: wartość jest tekstem, nie liczbą. Audyt porównuje ją bez
    względu na wielkość liter i nazywa wariant łagodniejszy, żeby
    sprawozdanie odróżniało maszynę ustawioną pobłażliwie od maszyny bez
    ustawienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: jedno
    kliknięcie użytkownika dzielące go od uruchomienia programu, przed
    którym system właśnie ostrzegł.
  en: |
    The item makes the reputation filter's warning stop the launch instead of
    asking for confirmation.

    The category is high, and higher than for turning the filter on at all,
    because this is the item that decides whether the filter changes
    anything. A warning that can be got past with one click is a suggestion.
    A person who has just fetched a tool in order to finish their work will
    dismiss that suggestion - not because they take the danger lightly, but
    because they happen to know why they fetched the file, and the warning
    looks like a mistake.

    That is the real substance of the item. The whole value of a reputation
    filter shows itself at the moment the user is sure they know better - and
    that is exactly the moment at which an attacker found them. The question
    this item answers is: does the decision belong to the person standing in
    front of the warning, or was it taken earlier.

    On a server the answer is easier than on a workstation. A server is not a
    place where fetched tools are started "quickly" - and if somebody does
    that, a block is the proper answer rather than an obstacle.

    Mind the entry: the value is text, not a number. The audit compares it
    without regard to letter case and names the milder variant, so that the
    report tells a machine set leniently from a machine with no setting at
    all.

    What an attacker gains while the item goes unmet: one click of a user's
    standing between them and the starting of a program the system has just
    warned about.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie jest krótkie, ale konieczne,
    bo ta reguła zamienia ostrzeżenie w odmowę.

    Pytanie brzmi: czy na tej maszynie uruchamia się coś, co filtr uzna za
    nieznane. W praktyce są to własne, niepodpisane narzędzia i programy
    instalacyjne dostawców sprzętu, pobierane pojedynczo i rzadko. Po
    zastosowaniu reguły takie uruchomienie zostanie zatrzymane, a osoba przy
    maszynie nie będzie miała czym tego przejść — i to jest zamierzone.

    Droga wyjścia jest jedna i warto ją znać z góry: podpisać własne
    narzędzia albo wnieść je na maszynę w sposób, który filtrowi nie podlega,
    zamiast pobierać je powłoką. Wyłączenie reguły jest odpowiedzią
    najgorszą z możliwych, bo znosi ją dla wszystkiego naraz.

    Czego to nie psuje: usług, zadań zaplanowanych, ról serwera, programów
    już zainstalowanych ani plików uruchamianych bez udziału powłoki.

    Rzecz do zapamiętania: ten punkt wymaga, żeby filtr był włączony.
    Ustawiony sam, bez punktu poprzedniego, nie daje nic — dwie reguły, dwa
    wpisy, jedna zależność.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is short but necessary,
    because this rule turns a warning into a refusal.

    The question is: is anything started on this machine that the filter will
    treat as unknown. In practice those are the organisation's own unsigned
    tools and hardware makers' installation programs, fetched one at a time
    and rarely. After the rule is applied such a launch will be stopped, and
    the person at the machine will have nothing to get past it with - and
    that is intended.

    There is one way out and it is worth knowing in advance: sign one's own
    tools, or bring them onto the machine in a way the filter does not cover,
    rather than fetching them through the shell. Switching the rule off is
    the worst possible answer, because it lifts it for everything at once.

    What this does not break: services, scheduled tasks, server roles,
    programs already installed, or files started without the shell.

    Something to remember: this item requires the filter to be on. Set by
    itself, without the preceding item, it gives nothing - two rules, two
    entries, one dependency.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Uruchomienie programu uznanego za nieznany zostanie zatrzymane, a osoba przy maszynie nie będzie miała czym tego przejść
      - Dotyczy to przede wszystkim własnych, niepodpisanych narzędzi i programów instalacyjnych dostawców sprzętu
      - Droga wyjścia to podpisanie narzędzi albo wniesienie ich w sposób, który filtrowi nie podlega — nie wyłączenie reguły
      - Punkt wymaga, żeby filtr był włączony — ustawiony sam, bez punktu poprzedniego, nie daje nic
    en:
      - The launch of a program treated as unknown is stopped, and the person at the machine has nothing to get past it with
      - This concerns above all the organisation's own unsigned tools and hardware makers' installation programs
      - The way out is to sign the tools or bring them in by a route the filter does not cover - not to switch the rule off
      - The item requires the filter to be on - set by itself, without the preceding item, it gives nothing
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na tej maszynie uruchamia się niepodpisane narzędzia pobierane powłoką i nie ma dla nich innej drogi wniesienia
    en:
      - Unsigned tools fetched through the shell are started on this machine and there is no other route for bringing them in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number, and is compared without regard to
      # letter case. The milder variant is reported by name so the report tells
      # a machine set leniently from one with no setting at all.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'ShellSmartScreenLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value -or [string]$value -eq '') { 'MISSING' }
        else { ([string]$value).Trim().ToUpperInvariant() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'BLOCK'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'ShellSmartScreenLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A warning that can be got past with one click is a suggestion. The filter's
    # whole value shows itself at the moment the user is sure they know better -
    # which is the moment an attacker found them. The value here is text, not a
    # number, so it is written as a string.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ShellSmartScreenLevel' -Value 'Block' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/

notes:
  pl: |
    To ten punkt, a nie samo włączenie filtra, decyduje, czy filtr cokolwiek
    zmienia. Ostrzeżenie, które da się pominąć jednym kliknięciem, jest
    sugestią.

    Cała wartość filtra ujawnia się w chwili, gdy użytkownik jest przekonany,
    że wie lepiej — a to jest dokładnie ta chwila, w której napastnik go
    zastał.

    Uwaga na wpis: wartość jest tekstem, nie liczbą, i audyt porównuje ją bez
    względu na wielkość liter. Punkt wymaga, żeby filtr był włączony —
    ustawiony sam nie daje nic.
  en: |
    It is this item, not the turning on of the filter, that decides whether
    the filter changes anything. A warning that can be got past with one
    click is a suggestion.

    The filter's whole value shows itself at the moment the user is sure they
    know better - which is exactly the moment at which an attacker found
    them.

    Mind the entry: the value is text, not a number, and the audit compares
    it without regard to letter case. The item requires the filter to be on -
    set by itself it gives nothing.
