id: win2016-password-reversible-encryption-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Przechowywanie haseł w postaci odwracalnej wyłączone
    en: Storing passwords in a reversible form switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza przechowywanie haseł w postaci, z której da się odtworzyć
    hasło pierwotne.

    Kategoria krytyczna i chcę nazwać różnicę dokładnie, bo nazwa ustawienia
    ją zaciera. Zwykle system przechowuje skrót hasła — wartość, z której
    hasła nie da się odczytać, a jedynie zgadywać. Przy tym ustawieniu
    włączonym przechowuje hasło zaszyfrowane kluczem, który ma u siebie.
    To nie jest skrót. To jest hasło odłożone do sejfu stojącego obok klucza.

    Skutek jest taki, że napastnik z dostępem do bazy kont nie musi niczego
    łamać. Odczytuje hasła w postaci jawnej — te same, których ludzie używają
    w innych miejscach. Długość hasła, jego złożoność i historia zmian
    przestają mieć jakiekolwiek znaczenie, bo nie chronią przed odczytaniem.

    Na serwerze, a zwłaszcza na kontrolerze domeny, oznacza to bazę haseł
    całej organizacji czytelną wprost. Trudno o punkt, w którym jedno
    ustawienie waży więcej.

    Na wydaniu 2016 warto to sprawdzić mimo pozornej oczywistości. To jest
    ustawienie, które ktoś kiedyś włączał świadomie — dla mechanizmu
    uwierzytelniania wymagającego hasła jawnego — i które zostaje włączone
    długo po tym, jak ten mechanizm przestał być używany. Serwer z tego
    rocznika jest dokładnie tą maszyną, na której taka pozostałość może się
    znaleźć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła kont
    w postaci jawnej, bez łamania, bez czasu i bez śladu.
  en: |
    The item switches off the storing of passwords in a form from which the
    original password can be recovered.

    The category is critical, and I want to name the difference exactly,
    because the setting's name blurs it. Normally the system stores a hash of
    the password - a value from which the password cannot be read, only
    guessed. With this setting on, it stores the password encrypted with a key
    it holds itself. That is not a hash. That is a password put in a safe which
    stands beside its key.

    The consequence is that an attacker with access to the account database has
    nothing to break. They read the passwords in plain form - the same ones
    people use elsewhere. Password length, complexity and change history stop
    mattering at all, because they do not protect against being read.

    On a server, and above all on a domain controller, that means the password
    database of the whole organisation legible outright. It is hard to find an
    item where one setting weighs more.

    On the 2016 release this is worth checking despite looking obvious. It is a
    setting somebody once turned on deliberately - for an authentication
    mechanism that needed the password in the clear - and which stays on long
    after that mechanism stopped being used. A server of this vintage is
    exactly the machine where such a leftover may be found.

    What an attacker gains while the item goes unmet: the accounts' passwords
    in plain form, with no breaking, no time and no trace.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i nie chcę udawać, że sprawdzać nie ma czego.
    Ustawienie bywa włączone nie przez pomyłkę, tylko dlatego, że coś go
    wymagało.

    Wymagają go uwierzytelnianie szyfrowaniem z lat dziewięćdziesiątych,
    część starych wdrożeń zdalnego dostępu oraz aplikacje przekazujące hasło
    dalej w postaci, którą muszą znać. Jeżeli któreś z tych rozwiązań tu
    pracuje, wyłączenie ustawienia odbierze mu możliwość uwierzytelnienia
    użytkownika — i będzie to awaria widoczna od razu.

    Na serwerze 2016 prawdopodobieństwo trafienia na taki przypadek jest
    wyższe niż na maszynie świeższej. To jest wydanie, które w wielu miejscach
    utrzymywano właśnie po to, żeby obsłużyć coś starszego od siebie.

    Rzecz istotna dla przebiegu prac: wyłączenie ustawienia nie usuwa haseł
    już zapisanych w postaci odwracalnej. Te znikają dopiero przy najbliższej
    zmianie hasła każdego konta. Dopóki ta zmiana nie nastąpi, materiał wciąż
    tam jest — dlatego samo zastosowanie reguły nie kończy sprawy.

    Czego to nie psuje: logowania zwykłego, kont usługowych, uwierzytelniania
    domenowego ani niczego, co nie wymaga hasła w postaci jawnej.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and I do not want to pretend there is nothing
    to review. The setting is sometimes on not by mistake but because something
    required it.

    It is required by challenge-based authentication from the nineteen-nineties,
    by some old remote-access deployments, and by applications that pass a
    password on in a form they have to know. If any of those runs here,
    switching the setting off takes away its ability to authenticate a user -
    and that will be a failure visible at once.

    On Server 2016 the chance of meeting such a case is higher than on a fresher
    machine. This is the release that in many places was kept precisely to serve
    something older than itself.

    Important for how the work goes: switching the setting off does not remove
    passwords already stored in the reversible form. Those go only at the next
    password change of each account. Until that change happens the material is
    still there - which is why applying the rule does not close the matter.

    What this does not break: ordinary signing in, service accounts, domain
    authentication, or anything that does not need the password in the clear.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Uwierzytelnianie wymagające hasła w postaci jawnej przestaje działać od razu, a nie stopniowo
      - Stare wdrożenia zdalnego dostępu oparte na mechanizmie sprzed lat tracą możliwość uwierzytelnienia użytkownika
      - Hasła już zapisane w postaci odwracalnej znikają dopiero przy najbliższej zmianie hasła każdego konta
      - Logowanie zwykłe, konta usługowe i uwierzytelnianie domenowe działają bez zmian
    en:
      - Authentication that needs the password in the clear stops working at once, not gradually
      - Old remote-access deployments built on a mechanism from years ago lose the ability to authenticate a user
      - Passwords already stored in the reversible form go only at the next password change of each account
      - Ordinary signing in, service accounts and domain authentication work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje uwierzytelnianie wymagające hasła w postaci jawnej i nie przygotowano zamiennika
    en:
      - Authentication that needs the password in the clear runs on the machine and no replacement has been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ClearTextPassword\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^ClearTextPassword\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'ClearTextPassword'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is not a hash but the password itself, encrypted with a key the
    # machine holds. Switching it off stops new passwords being stored that way;
    # the material already recorded goes only at the next change of each
    # account's password.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ClearTextPassword = 0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ClearTextPassword = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption

notes:
  pl: |
    Nazwa ustawienia mówi o szyfrowaniu i przez to brzmi łagodniej, niż
    powinna. Rzecz w tym, że klucz jest po tej samej stronie co dane — więc
    odwracalne znaczy tutaj po prostu czytelne dla tego, kto ma dostęp do
    maszyny.

    Zastosowanie reguły nie kończy sprawy. Hasła zapisane wcześniej w tej
    postaci znikają dopiero przy najbliższej zmianie hasła każdego konta,
    więc po wdrożeniu warto tę zmianę wymusić, zamiast czekać na termin.

    To jedyny punkt w grupie haseł, przy którym długość, złożoność i historia
    nie mają żadnego znaczenia. Nie da się chronić hasła przed odczytaniem
    przez zbudowanie go lepiej.
  en: |
    The setting's name speaks of encryption and so sounds milder than it should.
    The point is that the key sits on the same side as the data - so reversible
    here simply means legible to whoever has access to the machine.

    Applying the rule does not close the matter. Passwords stored earlier in
    this form go only at the next password change of each account, so after the
    rollout it is worth forcing that change rather than waiting for the term.

    This is the one item in the password group where length, complexity and
    history count for nothing. A password cannot be protected against being
    read by being built better.
