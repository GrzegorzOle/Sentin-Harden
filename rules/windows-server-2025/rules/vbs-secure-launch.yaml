id: win2025-vbs-secure-launch

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Bezpieczny start warstwy wirtualizacji włączony
    en: Secure launch of the virtualisation layer switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza bezpieczny start warstwy wirtualizacji: procesor
    przejmuje kontrolę nad rozruchem w znanym stanie i dopiero od tego
    miejsca uruchamia warstwę zabezpieczeń, zamiast ufać wszystkiemu,
    co wykonało się przed nim.

    Zostawiam kategorię wysoką i chcę nazwać, czego ten punkt dotyczy,
    bo dotyczy warstwy, której reszta tej paczki w ogóle nie obejmuje.

    Wszystkie pozostałe reguły mówią o systemie: o usługach, politykach,
    uprawnieniach, dziennikach. Ta mówi o tym, co dzieje się, zanim
    system istnieje. Między włączeniem zasilania a startem systemu
    wykonuje się oprogramowanie układowe, a w nim tryb zarządzania
    pracujący z uprawnieniami wyższymi niż jądro i niewidoczny dla
    niczego, co jądro ma do dyspozycji. Kod, który się tam usadowi,
    przeżywa przeinstalowanie systemu, bo nie leży na dysku, którego
    formatujemy.

    Na serwerze ta warstwa jest istotniejsza niż gdziekolwiek indziej,
    bo jest zarazem warstwą, w której żyje kontroler zarządzania — ta
    część maszyny, która ma własny adres w sieci, własne hasło i działa
    również wtedy, gdy serwer jest wyłączony. Rozmawiamy więc nie
    o abstrakcji, tylko o konkretnym, wystawionym na sieć elemencie
    maszyny, którego żaden mechanizm po stronie systemu nie sprawdza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    umieszczenia się poniżej systemu — w miejscu, w którym nie sięga go
    żadne narzędzie działające w systemie i skąd przetrwa jego
    przeinstalowanie.
  en: |
    The item switches on the safe starting of the layer of unbodying - the reckoner's heart takes the
    rising into its hands in a known state and only thence starts the layer of warding, rather than
    trowing everything that ran before it.

    I leave the category high and would name what that item bears upon, for it bears upon a layer the
    rest of this pack takes not in at all.

    All the other rules speak of the system - of services, of rules, of leaves, of logs. This one
    speaks of what befalls before the system is. Between the switching on of the power and the start of
    the system there runs the firmware, and within it a mode of ruling working with leaves higher than
    the kernel's and unseen by anything the kernel has to hand. Code that settles itself there outlives
    the installing of the system afresh, not lying upon the disk we wipe.

    Upon a server that layer is weightier than anywhere else, it being at the same time the layer
    wherein the ruler of ruling lives - that share of the machine that has an address of its own in the
    net, a watchword of its own, and works also when the server is switched off. We speak therefore not
    of a thing in the abstract but of a set piece of the machine, set out to the net, that no working
    upon the system's side looks into.

    What an attacker gains while the item goes unmet - the might of setting themselves beneath the
    system, in a stead whereto no tool working within the system reaches and whence they outlive its
    installing afresh.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia". Skutek w normalnej
    pracy jest zerowy — ta zmiana niczego nie blokuje, nie odmawia
    żadnemu programowi ani sterownikowi i nie zmienia sposobu pracy.
    Klasa bierze się wyłącznie z tego, kiedy i jak się objawia.

    Objawia się przy rozruchu, a nieudany rozruch na serwerze jest
    najdroższym rodzajem awarii. Wymagania są sprzętowe: procesor musi
    wspierać przejęcie kontroli nad rozruchem, a oprogramowanie układowe
    musi to poprawnie obsługiwać. Sprzęt starszy albo firmware
    z zaniedbanym uaktualnieniem daje maszynę, która po zmianie nie
    wstaje — i nie robi tego w sposób, który cokolwiek tłumaczy, bo na
    tym etapie nie ma jeszcze kto niczego zapisać.

    Dlatego droga do konsoli jest tu, tak jak przy pozostałych punktach
    tej grupy, warunkiem wykonania, a nie ostrożnością. Dochodzi jednak
    rzecz, o której warto pamiętać osobno: jeżeli ta zmiana zablokuje
    rozruch, to naprawa idzie przez oprogramowanie układowe, a nie przez
    system. Środowisko naprawcze systemu może się wtedy nie uruchomić.

    Praktyczną konsekwencją jest zalecenie kolejności: uaktualnienie
    oprogramowania układowego do wersji wspieranej przez producenta
    wykonuje się przed tą zmianą, a nie po niej, kiedy będzie już
    potrzebne pilnie.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I leave the class "needs a witting rolling out". The outcome in everyday work is nothing - that
    change blocks nothing, denies no program and no driver, and alters no way of working. The class
    comes only of when and how it shows itself.

    It shows itself at the rising, and a rising that fails is upon a server the dearest kind of fault.
    The demands are of gear - the reckoner's heart must bear the taking of the rising into its hands,
    and the firmware must deal with it rightly. Older gear, or firmware whose making anew was let slip,
    gives a machine that after the change rises not - and does so in a way that makes nothing plain,
    there being at that step nobody yet to write anything down.

    Therefore the road to the board is here, as at the other items of that band, a forechosen thing of
    the doing and no heedfulness. There comes to it, though, a thing worth holding in mind on its own -
    if that change block the rising, the mending goes through the firmware and not through the system.
    The setting of mending of the system may then not start at all.

    The outcome in practice is a bidding upon ordering - the making anew of the firmware to a make borne
    by the maker is done before that change and not after it, when it will already be needed in haste.

    The change binds after a starting anew and is undone after a further one.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Sprzęt starszy albo oprogramowanie układowe bez uaktualnienia daje maszynę, która po zmianie nie wstaje
      - Nieudany rozruch nie tłumaczy się niczym, bo na tym etapie nie ma jeszcze kto niczego zapisać
      - Naprawa idzie wtedy przez oprogramowanie układowe, a środowisko naprawcze systemu może się nie uruchomić
      - W normalnej pracy skutek jest zerowy — zmiana niczego nie blokuje i nie odmawia żadnemu programowi ani sterownikowi
    en:
      - Older gear or firmware without a making anew gives a machine that after the change rises not
      - A rising that fails makes nothing plain, there being at that step nobody yet to write anything down
      - The mending goes then through the firmware, and the setting of mending of the system may not start at all
      - In everyday work the outcome is nothing - the change blocks nothing and denies no program and no driver
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie układowe nie zostało uaktualnione do wersji wspieranej przez producenta maszyny
      - Nie ma sprawdzonej drogi dostępu do konsoli ani do oprogramowania układowego maszyny
    en:
      - The firmware was not made anew to a make borne by the maker of the machine
      - There is no proven road to the board nor to the firmware of the machine
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ConfigureSystemGuardLaunch'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    $name = 'ConfigureSystemGuardLaunch'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The effect appears only after a restart, and the machine may fail to
    # start where the hardware or the firmware does not meet the demands. Bring
    # the firmware up to a supported version before this change, not after,
    # when it will be needed in a hurry.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConfigureSystemGuardLaunch' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/system-guard-secure-launch-and-smm-protection

notes:
  pl: |
    Punkt dotyczy warstwy, której reszta paczki w ogóle nie obejmuje:
    tego, co dzieje się, zanim system istnieje. Kod, który usadowi się
    w oprogramowaniu układowym, przeżywa przeinstalowanie systemu,
    bo nie leży na dysku, który formatujemy.

    Na serwerze jest to zarazem warstwa, w której żyje kontroler
    zarządzania — część maszyny z własnym adresem w sieci, własnym
    hasłem i działająca, gdy serwer jest wyłączony.

    W normalnej pracy skutek zerowy; klasa bierze się wyłącznie z tego,
    kiedy się objawia. Nieudany rozruch niczego nie tłumaczy, bo nie ma
    jeszcze kto zapisać. Uaktualnienie oprogramowania układowego robi się
    przed tą zmianą, nie po niej.
  en: |
    The item bears upon a layer the rest of the pack takes not in at all - what befalls before the
    system is. Code that settles itself within the firmware outlives the installing of the system
    afresh, not lying upon the disk we wipe.

    Upon a server it is at the same time the layer wherein the ruler of ruling lives - a share of the
    machine with an address of its own in the net, a watchword of its own, and working when the server
    is switched off.

    In everyday work the outcome is nothing; the class comes only of when it shows itself. A rising
    that fails makes nothing plain, there being nobody yet to write. The making anew of the firmware is
    done before that change and not after it.
