id: win2025-clipboard-history-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > OS Policies
  title:
    pl: Historia schowka wyłączona
    en: Clipboard history switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza historię schowka. Bez niego schowek przestaje być
    miejscem na jedną rzecz i staje się listą rzeczy skopiowanych
    wcześniej, dostępną w tej samej sesji.

    Podnoszę kategorię do wysokiej wobec oceny dla stacji roboczej i jest
    to podniesienie, które chcę uzasadnić dokładnie, bo punkt wygląda na
    drobiazg wygody.

    Rzecz sprowadza się do pytania, co administrator kopiuje na serwerze.
    Nie kopiuje tam tekstu do dokumentu. Kopiuje hasła wklejane do
    narzędzi, ciągi połączeń z osadzonym poświadczeniem, klucze
    odzyskiwania, wygenerowane hasła kont usług, odciski certyfikatów.
    Schowek na serwerze jest kanałem, którym przechodzą poświadczenia —
    i przechodzi ich tam więcej niż gdziekolwiek indziej w organizacji.

    Historia zmienia w tym jedną rzecz i jest to rzecz zasadnicza. Bez
    niej wartość znika z chwilą skopiowania następnej. Z nią zostaje
    dostępna do odczytania przez cały czas trwania sesji — a sesja przy
    konsoli serwera trwa tyle, ile okno serwisowe, czyli godziny. Cokolwiek
    czyta schowek tej sesji, czyta nie jedną rzecz, tylko wszystko, co
    przez nią przeszło.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nie
    ostatnie skopiowane hasło, tylko komplet poświadczeń, którymi
    administrator posługiwał się przez całe to wejście.
  en: |
    The item switches off the story of the clipboard. Without it the clipboard stops being a stead
    for one thing and becomes a list of things copied before, come-at-able within the same sitting.

    I raise the category to high against the reckoning for a workstation, and it is a raising I would
    stand by closely, the item looking like a small matter of ease.

    The thing comes to the question what an administrator copies upon a server. They copy there no
    text into a document. They copy passwords pasted into tools, strings of binding with a token of
    leave set within, keys of winning back, made-up passwords of accounts of services, the marks of
    tokens. The clipboard upon a server is a channel whereby tokens of leave pass - and more of them
    pass there than anywhere else in the ordering.

    The story alters in this one thing and it is the root thing. Without it the worth goes at the
    hour the next is copied. With it, it stays there to be read the whole time the sitting lasts -
    and a sitting at a server's board lasts as long as the window of service, that is hours. Whatever
    reads that sitting's clipboard reads not one thing but all that has passed through it.

    What an attacker gains while the item goes unmet - not the last copied password but the whole of
    the tokens of leave the administrator dealt with throughout that coming.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" wobec oceny dla stacji roboczej
    i odwracam też ocenę widoczności. Obie zmiany biorą się z tego
    samego.

    Na stacji roboczej historia schowka jest narzędziem pracy. Ludzie się
    jej uczą, używają jej wielokrotnie w ciągu dnia i natychmiast
    zauważają jej brak. Na serwerze pracy nikt nie wykonuje — serwer jest
    obsługiwany, a nie używany. Administrator wkleja hasło i przechodzi
    dalej; nie wraca do rzeczy skopiowanej dwadzieścia minut wcześniej,
    bo nie prowadzi tu żadnej pracy ciągłej.

    Zmiana nie dotyka samego schowka. Kopiowanie i wklejanie działa bez
    zmian, również między sesją zdalną a maszyną lokalną, jeżeli
    przekierowanie schowka jest włączone. Wyłączona zostaje wyłącznie
    lista rzeczy poprzednich.

    Rzecz warta powiedzenia na koniec: wyłączenie historii nie czyści
    tego, co już zostało zapamiętane w trwającej sesji. Po zmianie
    warto tę sesję zamknąć, jeżeli przechodziły przez nią poświadczenia.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I lower the class to "no disruption" against the reckoning for a workstation, and I turn about
    also the reckoning of being seen. Both alterings come of the same.

    On a workstation the story of the clipboard is a tool of work. People learn it, use it many times
    within a day and mark its want at once. On a server nobody does work - a server is tended and not
    used. An administrator pastes a password and goes on; they come not back to a thing copied twenty
    minutes since, holding here no unbroken work.

    The change touches not the clipboard itself. The copying and the pasting work unaltered, between
    a far-off sitting and the near machine as well, where the turning of the clipboard is switched
    on. What is switched off is the list of the things before alone.

    A thing worth saying at the end - the switching off of the story clears not what has been kept in
    mind already within a lasting sitting. After the change it is worth shutting that sitting, if
    tokens of leave passed through it.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - scripting-and-automation
  what_breaks:
    pl:
      - Lista rzeczy skopiowanych wcześniej przestaje być dostępna
      - Kopiowanie i wklejanie działa bez zmian, również przy przekierowaniu schowka w sesji zdalnej
      - Wyłączenie historii nie czyści tego, co już zapamiętano w trwającej sesji
      - Po zmianie warto zamknąć sesję, przez którą przechodziły poświadczenia
      - Na serwerze nikt nie wraca do rzeczy skopiowanej wcześniej, bo nie prowadzi tu pracy ciągłej
    en:
      - The list of things copied before stops being come-at-able
      - The copying and the pasting work unaltered, at the turning of the clipboard in a far-off sitting as well
      - The switching off of the story clears not what has been kept in mind already within a lasting sitting
      - After the change it is worth shutting the sitting whereby tokens of leave passed
      - On a server nobody comes back to a thing copied before, holding here no unbroken work
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'AllowClipboardHistory'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowClipboardHistory'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This does not clear what an open session already remembers: close that
    # session afterwards if credentials passed through it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowClipboardHistory' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-policies

notes:
  pl: |
    Kategoria podniesiona, bo rzecz sprowadza się do pytania, co
    administrator kopiuje na serwerze. Nie tekst do dokumentu — hasła
    wklejane do narzędzi, ciągi połączeń z osadzonym poświadczeniem,
    klucze odzyskiwania, hasła kont usług. Schowek na serwerze jest
    kanałem, którym przechodzą poświadczenia.

    Historia zmienia w tym jedno: bez niej wartość znika z chwilą
    skopiowania następnej, z nią zostaje na cały czas trwania sesji —
    a sesja przy konsoli serwera trwa tyle, ile okno serwisowe.

    Klasa obniżona i widoczność odwrócona z tego samego powodu: serwer
    jest obsługiwany, a nie używany, więc nikt nie wraca do rzeczy
    skopiowanej dwadzieścia minut wcześniej.
  en: |
    The category is raised, the thing coming to the question what an administrator copies upon a
    server. No text into a document - passwords pasted into tools, strings of binding with a token of
    leave set within, keys of winning back, passwords of accounts of services. The clipboard upon a
    server is a channel whereby tokens of leave pass.

    The story alters in this one thing - without it the worth goes at the hour the next is copied,
    with it it stays the whole time the sitting lasts, and a sitting at a server's board lasts as
    long as the window of service.

    The class is lowered and the being seen turned about of the same ground - a server is tended and
    not used, so nobody comes back to a thing copied twenty minutes since.
