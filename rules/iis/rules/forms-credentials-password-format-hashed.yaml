id: iis-forms-credentials-password-format-hashed

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Configure Authentication and Authorization
  title:
    pl: Hasła w konfiguracji nie leżą jawnym tekstem
    en: Passwords in the configuration do not lie in plain text

  level: 1
  profile: application

platform:
  system: iis

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Jeżeli lista użytkowników mimo wszystko leży w pliku konfiguracyjnym, to
    osobne ustawienie rozstrzyga, w jakiej postaci zapisane są tam hasła. Do
    wyboru jest tekst jawny oraz kilka sposobów zapisu skrótem, różniących się
    tym, jak trudno odtworzyć z nich hasło.

    Co to odbiera atakującemu: gotowe hasła do użycia gdzie indziej. Hasło
    zapisane jawnie można odczytać i wpisać — nie tylko tutaj. Ludzie używają
    tego samego hasła w kilku miejscach, więc plik z jawnymi hasłami jest
    kluczem nie tylko do tej aplikacji, ale i do poczty, i do innych systemów
    tych samych osób. Przy zapisie skrótem odczytanie pliku daje ciąg znaków,
    z którego trzeba dopiero odgadnąć hasło — a to kosztuje czas i udaje się
    tylko dla haseł słabych.

    Po zmianie odczyt pliku przestaje być równoznaczny ze zdobyciem haseł.
    Nie przestaje być incydentem — przestaje być incydentem natychmiastowym.
  en: |
    Where the list of users lies in the configuration file after all, a separate
    setting decides the form in which the passwords are recorded there. The choice
    is plain text and several ways of recording a digest, differing in how hard it
    is to reconstruct the password from them.

    What it takes away from an attacker - ready passwords to use elsewhere. A
    password recorded in the clear can be read and typed in - and not only here.
    People use the same password in several places, so a file of plain passwords is
    a key not only to this application but to those same people's mail and other
    systems. With a digest, reading the file yields a string of characters from
    which the password still has to be guessed - which costs time and succeeds only
    for weak passwords.

    After the change, reading the file stops being the same thing as obtaining the
    passwords. It does not stop being an incident - it stops being an immediate
    one.

disruption_description:
  pl: |
    Zmiana samego ustawienia jest natychmiastowa, ale bezużyteczna, jeśli nie
    towarzyszy jej przeliczenie haseł. Ustawienie mówi środowisku, jak ma
    interpretować to, co jest w pliku — nie przerabia istniejących wpisów. Po
    przestawieniu wartości bez zmiany wpisów żaden użytkownik się nie zaloguje,
    bo środowisko porówna skrót podanego hasła z hasłem zapisanym jawnie.

    Praktycznie znaczy to, że dla każdego konta trzeba wyliczyć skrót i wstawić
    go w miejsce dotychczasowej wartości. To robota ręczna albo skryptowa, ale
    wykonywana raz i bez udziału użytkowników — hasła pozostają te same, więc
    nikomu nie trzeba niczego zgłaszać. Tym ta zmiana różni się od przenoszenia
    kont do innego źródła.

    Warto przy okazji odnotować rzecz, o której łatwo zapomnieć: hasła, które
    do tej pory leżały jawnie, trzeba uznać za ujawnione. Są w kopiach
    zapasowych i w historii systemu kontroli wersji, skąd nie znikną. Jeśli
    ktoś używał tego samego hasła gdzie indziej, samo przeliczenie na skrót
    tego nie naprawia.
  en: |
    Changing the setting itself is immediate but useless unless the passwords are
    recomputed along with it. The setting tells the runtime how to interpret what is
    in the file - it does not rework the existing entries. After switching the value
    without changing the entries, no user signs in, because the runtime compares the
    digest of the password given with a password recorded in the clear.

    In practice that means a digest has to be computed for every account and put in
    place of the present value. That is work by hand or by script, but done once and
    without the users taking part - the passwords stay the same, so nobody has to be
    told anything. That is how this change differs from moving the accounts to
    another source.

    It is worth noting in passing something easily forgotten - passwords that have
    lain in the clear until now must be treated as disclosed. They are in the
    backups and in the version control history, from where they will not vanish. If
    somebody used the same password elsewhere, recomputing a digest here does not
    repair that.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - web-server-services
    - legacy-applications
  what_breaks:
    pl:
      - Przestawienie ustawienia bez przeliczenia istniejących wpisów odcina logowanie wszystkim kontom z tej listy
      - Hasła leżące dotąd jawnie pozostają w kopiach zapasowych i w historii systemu kontroli wersji, więc trzeba je uznać za ujawnione
      - Konta techniczne używane przez integracje przestają działać razem z kontami ludzi, jeśli ich wpisów też się nie przeliczy
      - Skrypty wdrożeniowe nadpisujące plik konfiguracyjny przywrócą stary zapis przy najbliższym wdrożeniu
    en:
      - Switching the setting without recomputing the existing entries cuts off sign-in for every account on that list
      - Passwords that have lain in the clear remain in the backups and in the version control history, so they must be treated as disclosed
      - Technical accounts used by integrations stop working along with people's accounts, where their entries are not recomputed too
      - Deployment scripts overwriting the configuration file restore the old recording at the next deployment
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacje, których wpisów nie da się przeliczyć w tym samym oknie co zmianę ustawienia
      - Środowiska, w których plik konfiguracyjny jest nadpisywany przy wdrożeniu ze źródła trzymanego gdzie indziej
    en:
      - Applications whose entries cannot be recomputed in the same window as the setting is changed
      - Environments where the configuration file is overwritten at deployment from a source kept elsewhere
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $scopes = @([pscustomobject]@{ label = 'framework-root'; path = 'MACHINE/WEBROOT' })
          foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
            $scopes += [pscustomobject]@{ label = $site.Name; path = ('MACHINE/WEBROOT/APPHOST/' + $site.Name) }
          }
          $wrong = @()
          $used = $false
          foreach ($scope in $scopes) {
            $users = Get-WebConfiguration -PSPath $scope.path `
              -Filter 'system.web/authentication/forms/credentials/user' -ErrorAction SilentlyContinue
            # Only a place where accounts are actually listed is judged. The
            # setting on its own, with nothing stored, governs nothing.
            if (@($users).Count -eq 0) { continue }
            $used = $true
            $raw = Get-WebConfigurationProperty -PSPath $scope.path `
              -Filter 'system.web/authentication/forms/credentials' -Name 'passwordFormat' -ErrorAction SilentlyContinue
            $value = $raw
            if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
            if ($null -eq $value) { $wrong += ($scope.label + ':not-set') }
            elseif ([string]$value -eq 'Clear') { $wrong += ($scope.label + ':Clear') }
          }
          # Nowhere storing accounts is the wanted state and belongs to the
          # neighbouring item. It is named here rather than reported as a plain
          # pass, so the report does not read as though a setting had been
          # checked that nothing depends on.
          if (-not $used) { 'NO_CREDENTIALS' }
          elseif ($wrong.Count -eq 0) { 'AS_REQUIRED' }
          else { 'CLEAR ' + ($wrong -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(AS_REQUIRED|NO_CREDENTIALS)$'
  comparison: regex

remediation:
  shell: powershell
  change_command: |
    # Prepared for copying, not for running. Changing the setting alone stops
    # every account on the list from signing in - the entries have to be
    # recomputed in the same breath, and their passwords are not in a form
    # anything here could recompute them from.
    Import-Module WebAdministration -ErrorAction Stop
    # The digest is computed by the runtime's own routine, so that it matches
    # what the runtime will later compare against. The assembly holding it is
    # not loaded in a console session by default.
    Add-Type -AssemblyName System.Web

    $site = 'Default Web Site'
    $scope = 'MACHINE/WEBROOT/APPHOST/' + $site

    # For each account, compute the digest of its present password and put it
    # in place of the current value. The password itself has to be known - a
    # digest cannot be worked out from what is in the file unless the file
    # holds the password in the clear, which is the very thing being repaired.
    $user = 'someone'
    $password = 'the password as it is used today'
    $hash = [System.Web.Security.FormsAuthentication]::HashPasswordForStoringInConfigFile($password, 'SHA1')

    Set-WebConfigurationProperty -PSPath $scope `
      -Filter "system.web/authentication/forms/credentials/user[@name='$user']" `
      -Name 'password' -Value $hash

    # Only once every entry has been recomputed:
    Set-WebConfigurationProperty -PSPath $scope `
      -Filter 'system.web/authentication/forms/credentials' `
      -Name 'passwordFormat' -Value 'SHA1'

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.formsauthenticationcredentials.passwordformat
  - https://learn.microsoft.com/dotnet/api/system.web.security.formsauthentication.hashpasswordforstoringinconfigfile

notes:
  pl: |
    Reguła jest wyłącznie do skopiowania, bo samo przestawienie ustawienia
    odcina logowanie wszystkim kontom z listy. Środowisko zacznie wtedy
    porównywać skrót podanego hasła z hasłem zapisanym jawnie i nigdy się nie
    zgodzi. Przeliczenia wpisów nie da się wykonać automatycznie w każdym
    przypadku, bo wymaga znajomości haseł.

    Sprawdzenie ocenia wyłącznie te miejsca, w których faktycznie leżą konta.
    Ustawienie bez żadnego wpisu nie rządzi niczym, więc serwer bez takich list
    zgłasza osobny stan zamiast zwykłego spełnienia.

    Warto czytać ten punkt razem z sąsiednim. Ten mówi, jak hasła mają być
    zapisane, jeśli już tam leżą; tamten mówi, że nie powinny tam leżeć wcale.
    Spełnienie tego punktu jest poprawą, nie rozwiązaniem.

    Dostępne sposoby zapisu różnią się odpornością. Reguła nie narzuca
    najmocniejszego, bo część starszych aplikacji obsługuje tylko ten
    najstarszy — wybór zostaje przy osobie, która zna aplikację. Nie przechodzi
    wyłącznie zapis jawny.
  en: |
    The rule is for copying only, because switching the setting on its own cuts off
    sign-in for every account on the list. The runtime then compares the digest of
    the password given against a password recorded in the clear and never agrees.
    Recomputing the entries cannot be done automatically in every case, since it
    calls for the passwords to be known.

    The check judges only the places where accounts actually lie. The setting with
    no entry governs nothing, so a server without such lists reports a state of its
    own rather than a plain pass.

    This item is worth reading together with its neighbour. This one says how the
    passwords are to be recorded if they lie there already; that one says they
    should not lie there at all. Meeting this item is an improvement, not a
    solution.

    The available ways of recording differ in resistance. The rule does not impose
    the strongest, because some older applications support only the oldest - the
    choice stays with whoever knows the application. Only recording in the clear
    fails.
