id: win10-create-global-objects-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie obiektów globalnych ograniczone do administratorów i kont usługowych
    en: Creating global objects restricted to administrators and service accounts
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo do tworzenia obiektów globalnych do
    administratorów, dwóch kont usługowych i klasy procesów usługowych.

    Obiekt globalny jest widoczny we wszystkich sesjach maszyny naraz,
    a nie tylko w sesji, która go utworzyła. Na maszynie z jednym
    użytkownikiem różnica jest niewidoczna. Na maszynie, gdzie pracuje
    kilka osób jednocześnie — przez pulpit zdalny albo usługi terminalowe
    — różnica jest zasadnicza.

    Użytkownik, który potrafi utworzyć obiekt globalny, sięga do
    przestrzeni wspólnej dla wszystkich sesji. Może tam podstawić obiekt
    pod nazwą, której oczekuje cudzy program, i przechwycić jego działanie
    w sesji innej osoby. Jest to droga z sesji własnej do sesji cudzej,
    bez żadnego podnoszenia uprawnień po drodze.

    Zysk z ograniczenia jest więc proporcjonalny do liczby sesji
    jednoczesnych. Na stanowisku jednoosobowym punkt jest porządkowy; na
    maszynie z pulpitem zdalnym zamyka realną drogę.

    Odnotowuję, że sprawdzenie przyjmuje także wykaz pusty.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przejście
    z własnej sesji do sesji innej osoby pracującej na tej samej maszynie.
  en: |
    The setting bounds the right of creating global objects to the administrators, to two service accounts and to
    the class of service processes.

    A global object is seen in all the machine's sessions at once, and not in the session that made it alone. Upon
    a machine with one user the difference is unseen. Upon a machine where several people work at the same time -
    by a remote desktop or by services of terminals - the difference is a chief one.

    A user able to make a global object reaches into a room common to every session. They may set there an object
    under a name somebody else's program looks for, and take that program's working over in another person's
    session. It is a road from one's own session into another's, with no raising of rights along the way.

    The gain of the bounding therefore stands in proportion to the number of sessions at once. Upon a
    one-person station the item is a matter of order; upon a machine with a remote desktop it shuts a real road.

    I set down that the check takes an empty list as well.

    What an attacker gains while the item goes unmet: a passage from their own session into that of another person
    working upon the same machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest
    oprogramowanie wielosesyjne.

    Miejscem najczęstszym są programy starsze, zwłaszcza klienci baz
    danych i aplikacje pisane pod jedną sesję, a uruchamiane w wielu.
    Programy takie tworzą obiekty synchronizujące bez określenia
    przestrzeni i przy odebranym prawie zgłaszają błąd przy starcie.

    Objaw jest charakterystyczny: program działa dla pierwszej osoby,
    która go uruchomi, a kolejnym odmawia startu. Rozpoznanie przyczyny
    bywa trudne, bo komunikat mówi zwykle o niemożności utworzenia zasobu,
    a nie o uprawnieniu.

    Sprawdzenie polega na uruchomieniu takiego programu w drugiej sesji na
    jednej maszynie po zmianie. Warto zrobić to przed wdrożeniem szerszym,
    bo objaw pojawia się dopiero przy drugim użytkowniku.

    Zmiana obowiązuje od następnego zalogowania. Sesje trwające nie tracą
    uprawnień w locie.

    Czego to nie psuje: pracy jednosesyjnej, logowania, dostępu do plików,
    udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is software of many sessions.

    The commonest places are older programs, above all clients of bases and applications written for one session
    and run in many. Such programs make objects of synchronising without naming a room and, the right being taken
    away, report a fault at their start.

    The mark of it is telling: the program works for the first person to start it and refuses the start to those
    that follow. The telling of the cause is at times hard, the message commonly speaking of an inability to make
    a resource and not of a right.

    The review is done by starting such a program in a second session upon one machine after the change. It is
    worth doing before a wider rollout, the mark showing only at the second user.

    The change holds from the next signing in. Sessions at work do not lose rights in flight.

    What this does not break: work in one session, logging on, the way to files, file shares, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-desktop
  what_breaks:
    pl:
      - Starszy program tworzący obiekty synchronizujące bez określenia przestrzeni zgłosi błąd przy starcie
      - Objaw jest charakterystyczny — program działa dla pierwszej osoby, a kolejnym odmawia startu
      - Komunikat mówi zwykle o niemożności utworzenia zasobu, a nie o uprawnieniu, więc rozpoznanie bywa trudne
      - Dotyczy to zwłaszcza klientów baz danych i aplikacji pisanych pod jedną sesję
      - Praca jednosesyjna, logowanie, dostęp do plików, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - An older program making objects of synchronising without naming a room will report a fault at its start
      - The mark of it is telling - the program works for the first person and refuses the start to those that follow
      - The message commonly speaks of an inability to make a resource and not of a right, so the telling is at times hard
      - That touches above all clients of bases and applications written for one session
      - Work in one session, logging on, the way to files, file shares and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje wielu użytkowników jednocześnie na starszym programie tworzącym obiekty globalne
    en:
      - Upon the machine many users work at once on an older program that makes global objects
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreateGlobalPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20,S-1-5-32-544,S-1-5-6|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreateGlobalPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreateGlobalPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators, to the two service accounts and to
    # the class of service processes. That is the set a working system takes.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeCreateGlobalPrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-20,*S-1-5-6',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreateGlobalPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-global-objects

notes:
  pl: |
    Reguła jest w tym bloku jedyną, której wartość zależy wprost od tego,
    ilu ludzi pracuje na maszynie naraz. Warto, żeby aplikacja to
    powiedziała, bo na stanowisku jednoosobowym punkt wygląda na pusty
    formalizm, a na maszynie z pulpitem zdalnym jest jednym
    z ważniejszych.

    Argument wart postawienia wprost dotyczy kierunku ataku. Wszystkie
    pozostałe punkty tego bloku opisują drogę w górę — z konta zwykłego
    do systemu. Ten opisuje drogę w bok: z sesji własnej do sesji
    kolegi pracującego na tej samej maszynie. Uprawnienia się przy tym
    nie zmieniają, zmienia się osoba.

    Odnotowuję objaw po wdrożeniu, bo jest tu nietypowy i łatwo go
    przypisać czemu innemu. Program, który działa dla pierwszego
    użytkownika i odmawia kolejnym, wygląda na problem z licencją albo
    z blokadą pliku. Aplikacja powinna wymienić ten objaw wprost, żeby
    dało się skojarzyć go ze zmianą.
  en: |
    The rule is the only one of this block whose worth hangs straight upon how many people work at a machine at
    once. It is well that the application say so: upon a one-person station the item looks an empty formality, and
    upon a machine with a remote desktop it is among the weightier ones.

    The argument worth putting outright touches the way of the attack. Every other item of this block sets out a
    road upward - from an ordinary account to the system. This sets out a road sideways: from one's own session
    into that of a colleague working at the same machine. The rights do not change by it; the person does.

    I set down the mark after the rollout, it being here out of the common and easily laid to something else. A
    program that works for the first user and refuses those that follow looks like a trouble with a licence or
    with a file held fast. The application ought to name that mark outright, that it may be tied to the change.
