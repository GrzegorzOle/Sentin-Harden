id: win2016-audit-removable-storage

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja dostępu do nośników wymiennych
    en: Audit removable storage access
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje próby dostępu do plików na nośnikach wymiennych —
    pamięciach na złączu szeregowym, dyskach zewnętrznych, kartach pamięci.

    Na serwerze rzecz wygląda inaczej niż na stanowisku roboczym i właśnie
    dlatego ma sens. Na stanowisku podłączanie pamięci przenośnych jest
    codziennością i zdarzenia toną w szumie. Na serwerze stojącym w szafie
    podłączenie nośnika wymiennego jest zdarzeniem, które nie powinno się
    zdarzać — a jeżeli się zdarza, to warto wiedzieć, kiedy i z czyjej ręki.

    Dwa scenariusze uzasadniają ten punkt. Pierwszy to wyniesienie danych:
    kopia katalogu na pamięć przenośną jest najprostszą drogą wyprowadzenia
    zawartości serwera i jedyną, która nie zostawia śladu w ruchu sieciowym.
    Drugi to wniesienie: nośnik jest nadal używaną drogą dostarczenia
    oprogramowania na maszynę odciętą od internetu.

    Rejestruje się powodzenia i niepowodzenia, bo zdarzeń na serwerze jest tak
    mało, że koszt rejestrowania obu jest zerowy, a odmowa dostępu do nośnika
    mówi tyle samo co udany odczyt.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wyniesienie
    danych na nośniku albo wniesienie narzędzi bez zapisu wskazującego, że
    nośnik w ogóle się na tej maszynie pojawił.
  en: |
    The subcategory records attempts to reach files on removable media - memory
    sticks, external disks, memory cards.

    On a server the matter looks other than at a working station, and that is
    precisely why it makes sense. At a station the plugging in of portable memory is
    an everyday thing and the events drown in noise. On a server standing in a rack
    the plugging in of removable media is an event that ought not to happen - and if
    it does, it is worth knowing when and by whose hand.

    Two scenarios justify the item. The first is data being carried out: a copy of a
    directory onto portable memory is the simplest way of taking a server's content
    away, and the only one leaving no trace in network traffic. The second is
    something being brought in: media are still a used road for delivering software
    onto a machine cut off from the internet.

    Successes and failures are both recorded, because there are so few events on a
    server that the cost of recording both is nil, and a refusal of access to media
    says as much as a successful read.

    What an attacker gains while the item goes unmet: the carrying out of data on
    media or the bringing in of tools, with no record that media appeared on this
    machine at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Na typowym serwerze liczba zdarzeń wynosi zero
    przez większość czasu, bo nośniki wymienne nie są tam podłączane.

    Dwa przypadki podnoszą objętość i warto o nich wiedzieć. Pierwszy to
    serwer, na którym kopie zapasowe są wykonywane na dysk zewnętrzny — tam
    każda tura kopiowania dopisuje zdarzenia dla całego kopiowanego zbioru.
    Drugi to maszyna wirtualna z podłączonym obrazem nośnika, który system
    rozpoznaje jako wymienny.

    Oba przypadki da się rozpoznać przed zmianą, patrząc na to, jak na tej
    maszynie robi się kopie zapasowe.

    Nic przy tym nie przestaje działać. Nośniki działają tak samo, kopiowanie
    idzie tak samo szybko, użytkownik niczego nie widzi.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". On a typical server the count of events is zero
    most of the time, removable media not being plugged in there.

    Two cases raise the volume and are worth knowing about. The first is a server
    whose backups are taken onto an external disk - there every round of copying
    adds events for the whole set being copied. The second is a virtual machine with
    a media image attached that the system recognises as removable.

    Both cases can be spotted before the change by looking at how backups are taken
    on this machine.

    Nothing stops working while this goes on. Media work as before, copying goes as
    fast, the user sees nothing.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — na typowym serwerze liczba zdarzeń wynosi zero przez większość czasu
      - Kopia zapasowa wykonywana na dysk zewnętrzny dopisuje zdarzenia dla całego kopiowanego zbioru
      - Maszyna wirtualna z podłączonym obrazem nośnika rozpoznanym jako wymienny generuje zdarzenia przy każdym odczycie
      - Nośniki działają tak samo, a szybkość kopiowania nie zmienia się w sposób mierzalny
    en:
      - No regression in the working - on a typical server the count of events is zero most of the time
      - A backup taken onto an external disk adds events for the whole set being copied
      - A virtual machine with an attached media image recognised as removable generates events at every read
      - Media work as before and the speed of copying does not alter measurably
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Kopie zapasowe tej maszyny są wykonywane na dysk zewnętrzny rozpoznawany jako nośnik wymienny, a dziennik ma domyślny rozmiar
    en:
      - This machine's backups are taken onto an external disk recognised as removable media, and the log is at its default size
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9245-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9245-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9245-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9245-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9245-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-removable-storage

notes:
  pl: |
    Punkt nie blokuje korzystania z nośników — to robi osobna reguła
    o urządzeniach. Ten wyłącznie zapisuje. Warto je czytać razem: blokada bez
    zapisu nie mówi, kto próbował, a zapis bez blokady nie powstrzymuje.

    Na serwerze wartość punktu bierze się z rzadkości zdarzeń, a nie z ich
    treści. Jedno zdarzenie w miesiącu na maszynie, na której nikt nośników nie
    podłącza, jest warte więcej niż tysiąc zdarzeń na stanowisku roboczym.

    Definicja nośnika wymiennego należy do systemu i bywa szersza, niż sugeruje
    intuicja — obejmuje między innymi obrazy podłączane w maszynie wirtualnej.
  en: |
    The item does not block the use of media - a separate rule on devices does that.
    This one only records. They are worth reading together: a block without a record
    does not say who tried, and a record without a block does not stop them.

    On a server the item's worth comes of the rarity of the events rather than of
    their content. One event a month on a machine where nobody plugs media in is
    worth more than a thousand events at a working station.

    The definition of removable media belongs to the system and is at times broader
    than intuition suggests - it covers, among other things, images attached in a
    virtual machine.
