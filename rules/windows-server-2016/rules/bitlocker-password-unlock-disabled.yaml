id: win2016-bitlocker-password-unlock-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Odblokowywanie dysków hasłem niedopuszczone
    en: Unlocking drives with a password inadmissible
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zamyka odblokowywanie zaszyfrowanych dysków hasłem, we
    wszystkich trzech klasach woluminów naraz: systemowym, stałym
    i wymiennym.

    Hasło jest wśród sposobów odblokowania najsłabsze i zarazem najwygodniejsze,
    a to połączenie sprawia, że wypiera pozostałe. Tam, gdzie da się wpisać
    hasło, nikt nie sięgnie po kartę ani po nośnik z kluczem.

    Słabość nie leży w samym mechanizmie, tylko w tym, skąd hasła się biorą.
    Hasło do dysku wymyśla człowiek, człowiek je zapamiętuje, a gdy nie
    zapamięta — zapisuje. Zapisuje zaś zwykle w miejscu blisko dysku, bo
    inaczej nie byłoby po co. Hasło do dysku przenośnego bywa naklejone na
    tym dysku.

    Drugi powód jest taki, że hasło daje się odgadywać poza maszyną. Dysk
    wyjęty i podłączony gdzie indziej pozwala próbować bez ograniczeń,
    bez opóźnień i bez śladu — inaczej niż kod startowy, którego strzeże
    układ zabezpieczający.

    Punkt domyka więc to, co opisano wcześniej. Reguły o kodzie startowym
    i o karcie ustalają, czym ma się odblokowywać; ta usuwa drogę
    najwygodniejszą, która w przeciwnym razie zastąpiłaby wszystkie
    pozostałe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    otwarcia dysku hasłem odgadywanym bez ograniczeń poza maszyną albo
    znalezionym w pobliżu dysku.
  en: |
    The setting shuts the unlocking of encrypted drives by a password, in all three classes of
    volume at once: the system, the fixed and the removable one.

    A password is among the ways of unlocking the weakest and at the same time the handiest, and
    that joining makes it drive the others out. Where a password can be typed, nobody will reach
    for a card or for a medium with a key.

    The weakness lies not in the mechanism itself but in where passwords come from. A password to
    a drive is thought up by a person, remembered by a person, and where not remembered - written
    down. And written down as a rule at a place near the drive, else there would be no point. A
    password to a carried drive is at times stuck on that drive.

    The second reason is that a password can be guessed at away from the machine. A drive taken
    out and plugged in elsewhere allows attempts without limit, without delays and without a
    trace - unlike a startup code, which the security chip watches over.

    The item therefore shuts what was described before. The rules about the startup code and about
    the card settle what the unlocking is to be by; this one takes away the handiest road, which
    would otherwise take the place of all the rest.

    What an attacker gains while the item goes unmet: the chance to open the drive by a password
    guessed at without limit away from the machine, or found near the drive.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy dla każdego woluminu
    istnieje już inna droga odblokowania.

    Kolejność jest tu jedyną rzeczą, która decyduje o tym, czy wdrożenie
    boli. Zamknięcie hasła przed ustaleniem drogi zastępczej zostawia
    woluminy, które otwierają się wyłącznie hasłem odzyskiwania — techniką
    awaryjną używaną jako codzienność. Odwrotna kolejność nie boli wcale.

    Zmiana nie dotyka woluminów już zaszyfrowanych. Dysk odblokowywany dziś
    hasłem będzie się nim odblokowywał dalej; wymóg działa dla tego, co
    szyfrowane później. Jest to jednocześnie ulga i pułapka, bo zgodny wpis
    nie mówi nic o tym, co na maszynie już leży.

    Skutek najbardziej odczuwalny dotyczy dysków przenośnych, a nie
    serwerowych. Dysk wożony między maszynami odblokowuje się zwykle hasłem
    właśnie dlatego, że hasło działa wszędzie, a karta i nośnik nie. Po
    zmianie taki dysk trzeba będzie zaszyfrować inaczej.

    Czego to nie psuje: woluminów zaszyfrowanych przed zmianą, dostępu do
    danych, pracy usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and what has to be reviewed is whether for every volume another
    road of unlocking already exists.

    Order is here the one thing that decides whether the rollout hurts. Shutting the password
    before a road in its stead is settled leaves volumes that open solely by a recovery password -
    an emergency technique used as everyday practice. The reverse order does not hurt at all.

    The change does not touch volumes already encrypted. A drive unlocked today by a password will
    go on being unlocked by it; the requirement works for what is encrypted later. That is at once
    a relief and a trap, a compliant entry saying nothing about what already lies on the machine.

    The consequence most felt concerns carried drives rather than server ones. A drive carried
    between machines is as a rule unlocked by a password precisely because a password works
    everywhere and a card and a medium do not. After the change such a drive will have to be
    encrypted otherwise.

    What this does not break: volumes encrypted before the change, access to data, the working of
    services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - accounts-and-passwords
  what_breaks:
    pl:
      - Wolumin zaszyfrowany po zmianie bez ustalonej drogi zastępczej otworzy się wyłącznie hasłem odzyskiwania
      - Dysk wożony między maszynami traci jedyny sposób odblokowania działający wszędzie i trzeba go zaszyfrować inaczej
      - Woluminy zaszyfrowane przed zmianą odblokowują się hasłem dalej, więc zgodny wpis nie mówi nic o stanie maszyny
      - Dostęp do danych, praca usług i sieć pozostają bez zmian
    en:
      - A volume encrypted after the change without a settled road in its stead will open solely by a recovery password
      - A drive carried between machines loses the one way of unlocking that works everywhere and has to be encrypted otherwise
      - Volumes encrypted before the change go on unlocking by a password, so a compliant entry says nothing about the machine's state
      - Access to data, the working of services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ustalono dla każdego woluminu innej drogi odblokowania ani nie sprawdzono, że ta droga działa
      - Na maszynie szyfruje się dyski wożone do miejsc, w których czytnika kart ani nośnika z kluczem nie ma
    en:
      - No other road of unlocking has been settled for every volume, nor checked that that road works
      - Drives carried to places where there is no card reader and no medium with a key are encrypted on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. All three have to
      # be at zero, and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $names = @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $names) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne 0) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'ALL_DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle how each volume unlocks without a password, and verify that it
    # does, before closing this road. The reverse order leaves a medium that
    # opens only with its recovery password - an emergency technique used as
    # everyday practice.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      Set-ItemProperty -Path $path -Name $name -Value 0 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt zamyka blok i jest jedyną regułą, która dotyczy wszystkich trzech
    klas woluminów naraz. Warto to odzwierciedlić w tym, gdzie się go
    pokazuje: nie należy do dysków stałych ani do wymiennych, tylko stoi
    nad nimi.

    Jest to zarazem reguła, której wartość widać wyłącznie w zestawieniu
    z pozostałymi. Sama z siebie zabiera wygodę i niczego nie daje. Dopiero
    razem z regułami o kodzie startowym i o karcie ma sens, bo bez niej te
    reguły są radami, a nie wymogami — zawsze zostaje droga obok.

    Kolejność wdrożenia jest tu warta osobnego zdania w podglądzie.
    Zamknięcie hasła przed ustaleniem drogi zastępczej nie psuje niczego
    dziś, a psuje przy najbliższym szyfrowaniu, gdy nikt już nie pamięta,
    że ta zasada została wprowadzona. Odstęp między przyczyną a skutkiem
    jest w tym punkcie najdłuższy w całym bloku.

    Odnotowuję, że stan pośredni zgłaszany przez audyt wymienia z nazwy tę
    klasę woluminów, która odstaje. Bez tego wynik mówiłby wyłącznie
    „niezgodne", a różnica między maszyną z jedną wartością nieustawioną
    a maszyną bez żadnej jest treścią decyzji.
  en: |
    The item shuts the block and is the one rule that concerns all three classes of volume at once.
    That is worth reflecting in where it is shown: it belongs neither to the fixed drives nor to
    the removable ones but stands above them.

    It is at the same time a rule whose value is seen solely alongside the others. By itself it
    takes convenience away and gives nothing. Only together with the rules about the startup code
    and about the card does it make sense, without it those rules being counsels rather than
    requirements - a road beside always staying open.

    The order of rollout is here worth a sentence of its own in the preview. Shutting the password
    before a road in its stead is settled breaks nothing today and breaks at the next encryption,
    when nobody remembers any longer that this policy was brought in. The gap between cause and
    consequence is at this item the longest in the whole block.

    Worth noting that the middle state the audit reports names outright the class of volume that
    stands out. Without that the outcome would say only "non-compliant", and the difference between
    a machine with one value unset and a machine with none is the substance of the decision.
