id: win10-laps-password-expiration-protection

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Przedłużanie ważności hasła lokalnego administratora ponad zasadę zablokowane
    en: Prolonging the local administrator password term beyond the policy blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Termin następnej zmiany hasła jest zapisany w katalogu i da się go przesunąć.
    Kto potrafi zapisać ten atrybut, może odsunąć zmianę o rok albo o dekadę —
    i wtedy hasło, które zdobył, pozostaje ważne dokładnie tak długo, jak sobie
    zaplanuje.

    To jest cicha droga utrwalenia dostępu: maszyna nadal raportuje, że hasło jest
    zarządzane, katalog nadal je przechowuje, a mechanizm po prostu przestaje je
    zmieniać. Nic nie wygląda na zepsute.

    Ta zasada każe maszynie pilnować własnego terminu: jeśli zapisany w katalogu
    czas przekracza to, co dopuszcza zasada, maszyna zmienia hasło mimo wszystko.
    Przesunięcie terminu przestaje być skuteczne.
  en: |
    The date of the next password change is held in the directory and can be moved.
    Whoever can write that attribute may push the change out by a year or a
    decade - and then the password they obtained stays valid for exactly as long
    as they plan.

    This is a quiet way of making access permanent. The machine still reports the
    password as managed, the directory still holds it, and the mechanism simply
    stops changing it. Nothing looks broken.

    This rule has the machine watch its own term. Where the time held in the
    directory exceeds what the policy allows, the machine changes the password
    regardless. Moving the date stops working.

disruption_description:
  pl: |
    Ustawienie nie zmienia niczego w codziennej pracy i nie dotyka żadnego
    scenariusza użytkownika. Jedyny wpływ dotyczy przypadków, w których termin
    został przesunięty celowo.

    A takie bywają uzasadnione: zamrożenie zmian na czas migracji albo
    utrzymywanie hasła przez okres prac serwisowych. Po tej zmianie takie
    przesunięcie przestaje działać i trzeba zamiast niego zmienić samą zasadę
    okresu ważności.
  en: |
    The setting changes nothing in daily work and touches no user scenario. Its
    only effect is on cases where the date was moved on purpose.

    Such cases do occur with reason - freezing changes during a migration, or
    holding a password for the length of service work. After this change that
    move stops working and the term policy itself has to be adjusted instead.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Termin zmiany hasła przesunięty ręcznie przestanie obowiązywać, a maszyna zmieni hasło zgodnie z zasadą okresu ważności
      - Zamrożenie zmian hasła na czas migracji albo prac serwisowych przestanie być możliwe tą drogą
      - Narzędzia przedłużające ważność hasła na potrzeby własnych procedur stracą ten wpływ na maszynę
      - Losowanie hasła, jego odczyt z katalogu, logowanie lokalne i praca użytkownika pozostają bez zmian
    en:
      - A change date moved by hand stops holding, and the machine changes the password according to the term policy
      - Freezing password changes for a migration or for service work stops being possible this way
      - Tools that extend a password term for their own procedures lose that influence over the machine
      - Picking the password, reading it from the directory, local sign-in and user work are all unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowiska w trakcie migracji, gdzie zamrożenie zmian hasła jest częścią planu i ma swoje uzasadnienie
      - Maszyny objęte procedurą serwisową wymagającą stałego hasła przez wyznaczony czas
    en:
      - Environments mid-migration, where freezing password changes is part of the plan and has its reasons
      - Machines under a service procedure that calls for a fixed password over a set span
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordExpirationProtectionEnabled'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $name = 'PasswordExpirationProtectionEnabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordExpirationProtectionEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Zasada ma sens wyłącznie razem z okresem ważności hasła — pilnuje właśnie
    jego przestrzegania. Wdrożona bez niego nie ma czego bronić, bo nie istnieje
    granica, którą ktoś mógłby przekroczyć.
  en: |
    The rule makes sense only together with the password term - what it guards is
    adherence to that very term. Deployed without one it has nothing to defend,
    because no bound exists for anybody to exceed.
