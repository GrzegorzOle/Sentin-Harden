id: win11-defender-routine-remediation

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Samoczynne usuwanie wykrytych zagrożeń włączone
    en: Automatic removal of detected threats switched on
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy ochrona ma wobec wykrytego zagrożenia podjąć
    działanie sama, czy tylko je zgłosić i czekać na decyzję człowieka.

    Różnica jest większa, niż brzmi, i warto ją rozpisać. Wykrycie bez
    działania kończy się wpisem w dzienniku i powiadomieniem. Plik zostaje
    tam, gdzie był, proces działa dalej, a ochrona przechodzi do następnego
    zdarzenia. Zagrożenie jest wtedy opisane, ale nie usunięte.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czas. Wykrycie
    pozostaje bez skutku aż do chwili, w której ktoś przeczyta powiadomienie
    i zdecyduje. Na stanowisku roboczym ta chwila bywa odległa — powiadomienie
    trafia do użytkownika, który nie wie, co z nim zrobić, a nierzadko zamyka
    je jak każde inne.

    Jest to więc punkt o tym, czy obrona domyka się sama, czy wymaga uwagi
    człowieka, żeby cokolwiek zmienić. Wykrycie bez usunięcia daje pozór
    ochrony i jest jedną z częstszych przyczyn tego, że incydent rozpoznaje
    się z dziennika dopiero po fakcie.

    Wartością zmiany jest to, że od wykrycia do odcięcia nie ma człowieka
    w środku.
  en: |
    The setting settles whether the protection is to act on a detected threat itself, or
    only report it and wait for a person's decision.

    The difference is greater than it sounds and is worth setting out. A detection without
    action ends in a log entry and a notification. The file stays where it was, the
    process runs on, and the protection moves to the next event. The threat is then
    described but not removed.

    What an attacker gains while the item goes unmet: time. The detection stays without
    effect until the moment somebody reads the notification and decides. At a workstation
    that moment is sometimes distant - the notification reaches a user who does not know
    what to do with it and not seldom closes it like any other.

    It is therefore an item about whether the defence closes itself or takes a person's
    attention to change anything. Detection without removal gives an appearance of
    protection and is among the commoner reasons why an incident is recognised from the
    log only after the fact.

    The worth of the change is that between detection and cutting off there is no person
    in the middle.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie pracuje się z narzędziami, które
    ochrona rozpoznaje jako zagrożenie mimo że są używane świadomie — bo dla
    nich zmiana oznacza usunięcie bez pytania.

    Dotyczy to przede wszystkim narzędzi administracyjnych i testowych:
    programów do odzyskiwania haseł, narzędzi diagnostyki sieci, skryptów
    zdalnego dostępu, pakietów do testów bezpieczeństwa. Część z nich jest
    rozpoznawana jako niepożądane z definicji, bo robi dokładnie to, co robi
    napastnik.

    Po zmianie taki plik zostanie usunięty albo odizolowany bez pytania,
    a narzędzie przestanie być dostępne w trakcie pracy. Jest to skutek
    odczuwalny natychmiast i mylący, bo wygląda jak zniknięcie pliku, a nie
    jak działanie ochrony.

    Odpowiedzią nie jest zostawienie wykrycia bez działania, tylko wpisanie
    tych narzędzi na listę wyłączeń przed wdrożeniem. Wtedy zmiana nie dotyka
    pracy, a reguła spełnia swoją rolę.

    Zmiana nie wymaga restartu. U użytkownika, który takich narzędzi nie
    używa, jest niewidoczna.
  en: |
    What needs checking is whether tools are used on the machine that the protection
    recognises as a threat although they are used knowingly - since for them the change
    means removal unasked.

    This concerns above all administrative and testing tools: password recovery programs,
    network diagnosis tools, remote access scripts, security testing packages. Some of
    them are recognised as unwanted by definition, since they do exactly what an attacker
    does.

    After the change such a file will be removed or isolated unasked, and the tool will
    stop being available mid-work. The effect is felt at once and misleads, since it looks
    like a file's disappearance rather than like the protection acting.

    The answer is not to leave detections without action but to enter those tools on an
    exclusion list before the rollout. The change then does not touch the work, while the
    rule serves its purpose.

    The change takes no restart. For a user who does not use such tools it is invisible.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - Narzędzia administracyjne rozpoznawane jako niepożądane zostają usunięte bez pytania
      - Plik znika w trakcie pracy, co wygląda na awarię, a nie na działanie ochrony
      - Skrypty i pakiety do testów bezpieczeństwa przestają być dostępne
      - Wpisanie narzędzi na listę wyłączeń przed wdrożeniem znosi ten skutek
    en:
      - Administrative tools recognised as unwanted are removed unasked
      - A file disappears mid-work, which looks like a failure rather than the protection acting
      - Scripts and security testing packages stop being available
      - Entering the tools on an exclusion list before the rollout removes that effect
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie używa się narzędzi rozpoznawanych jako niepożądane i nie ustalono listy wyłączeń
      - Maszyna służy do analizy próbek złośliwego oprogramowania
    en:
      - Tools recognised as unwanted are used on the machine and no exclusion list has been settled
      - The machine serves to analyse malware samples
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name describes a switching off: zero means the protection
      # acts on its own, one means it only reports.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableRoutinelyTakingAction'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $current = (Get-ItemProperty -Path $path -Name 'DisableRoutinelyTakingAction' -ErrorAction SilentlyContinue).'DisableRoutinelyTakingAction'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableRoutinelyTakingAction'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRoutinelyTakingAction' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-remediation-microsoft-defender-antivirus

notes:
  pl: |
    Reguła nie ustala, jakie działanie ma zostać podjęte wobec konkretnego
    rodzaju zagrożenia — to jest przedmiotem osobnych ustawień. Ustala
    wyłącznie, czy jakiekolwiek działanie ma nastąpić bez pytania.

    Nazwa wartości opisuje wyłączenie, więc stan zgodny to zero. Warto o tym
    pamiętać przy ręcznym sprawdzaniu, bo pomyłka daje skutek odwrotny do
    zamierzonego i nie widać jej w interfejsie.

    Brak wartości nie jest stanem zgodnym, choć działanie samoczynne bywa
    wtedy włączone domyślnie. Reguła wymaga zapisania zera wprost, żeby
    decyzja należała do zasady.

    Wartość jednostkowa w tym miejscu bywa śladem po celowym osłabieniu
    ochrony i zasługuje na sprawdzenie maszyny, a nie tylko na naprawienie
    ustawienia.
  en: |
    The rule does not fix what action is to be taken against a particular kind of threat -
    that is the subject of separate settings. It fixes only whether any action is to follow
    unasked.

    The value's name describes a switching off, so the compliant state is zero. Worth
    remembering when checking by hand, since a slip gives the opposite of the intended
    effect and is not visible in the interface.

    A missing value is not a compliant state, though acting on its own is then sometimes
    on by default. The rule takes writing a zero outright, so that the decision belongs to
    the policy.

    A one in this place is sometimes a trace of a deliberate weakening of protection and
    deserves an examination of the machine rather than only a repair of the setting.
