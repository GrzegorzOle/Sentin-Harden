id: win2025-winrm-service-unencrypted-traffic-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Service
  title:
    pl: Nieszyfrowany ruch usługi zarządzania zdalnego zabroniony
    en: Unencrypted traffic to the remote management service refused
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zarządzania zdalnego przyjmowania
    połączeń, w których treść nie jest zaszyfrowana.

    Punkt ten jest tym, co nadaje moc ustawieniu o uwierzytelnianiu
    podstawowym, i dlatego czyta się je razem. Chcę powiedzieć uczciwie,
    jak to działa, bo sama nazwa sugeruje więcej, niż ustawienie robi.

    Połączenie zarządzania uwierzytelnione mechanizmem domenowym jest
    szyfrowane na poziomie samych komunikatów, niezależnie od tego,
    czy niesie je kanał szyfrowany. Tam ustawienie nic nie zmienia
    i trzeba to wiedzieć, żeby nie przypisywać mu zasługi, której nie ma.

    Rzeczywisty skutek dotyczy połączeń, przy których takiego szyfrowania
    nie ma — czyli przede wszystkim uwierzytelniania podstawowego
    puszczonego kanałem nieszyfrowanym. Ta para jest w praktyce jedynym
    układem, w którym treść sesji zarządzania idzie przez sieć czytelna,
    razem z hasłem. Punkt zamyka właśnie ją.

    Na serwerze waży to więcej niż na stanowisku roboczym, bo treść
    sesji zarządzania serwerem jest inna. Idą nią polecenia zmieniające
    konfigurację, wyniki zapytań o stan, zawartość plików odczytywanych
    zdalnie i poświadczenia podawane w trakcie pracy. Podsłuch takiej
    sesji jest podsłuchem pracy administratora, a nie jednej czynności.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odczytania z ruchu sesji zarządzania serwerem razem
    z hasłem, tam gdzie uwierzytelnienie idzie mechanizmem podstawowym.
  en: |
    The setting forbids the remote management service to take connections wherein the contents are
    not encrypted.

    This item is what gives force to the item about basic authentication, and so they are read
    together. I mean to say honestly how it works, the name alone suggesting more than the setting
    does.

    A connection of management authenticated by the domain's mechanism is encrypted at the level of
    the messages themselves, whether the channel bearing them is encrypted or not. There the
    setting changes nothing, and that must be known lest a merit be laid to it which it has not.

    The true effect bears on connections where such encryption is not there - that is above all on
    basic authentication let through an unencrypted channel. That pair is in practice the one
    arrangement wherein the contents of a session of management go through the network readable,
    along with the password. The item shuts just it.

    On a server that weighs more than at a working station, the contents of a session managing a
    server being other. By it go orders changing the settings, the outcomes of askings after state,
    the contents of files read from afar, and credentials given in the course of the work. The
    listening to such a session is a listening to an administrator's work and not to one act.

    What an attacker gains while the item goes unmet: the means of reading out of the traffic a
    session managing the server, along with the password, where the authentication goes by the
    basic mechanism.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy do tej usługi łączy się coś, co nie
    umie szyfrować.

    W środowisku domenowym odpowiedź brzmi „nie" i zmiana przechodzi
    niezauważona, bo mechanizm domenowy szyfruje komunikaty sam z siebie.
    Dlatego na większości serwerów punkt ten jest formalnością.

    Inaczej jest tam, gdzie zarządza się maszyną kontem lokalnym.
    Połączenie uwierzytelnione podstawowo kanałem nieszyfrowanym po
    zmianie przestanie być przyjmowane, a jest to układ spotykany na
    serwerach w strefie zdemilitaryzowanej, w środowiskach testowych
    i wszędzie tam, gdzie nasłuchiwanie po kanale szyfrowanym wymagałoby
    wystawienia certyfikatu i nikt tego nie zrobił.

    Drugi przypadek to narzędzia spoza świata Windows rozmawiające tym
    protokołem: systemy monitorowania, narzędzia automatyzacji, agenci.
    Część z nich domyślnie łączy się kanałem nieszyfrowanym, bo tak
    jest prościej skonfigurować.

    Objaw jest jednoznaczny, choć mylący co do przyczyny: połączenie
    zostaje odrzucone przy nawiązywaniu, a komunikat mówi o odmowie
    dostępu, nie o braku szyfrowania.

    Kolejność wdrożenia ma tu znaczenie i warto ją zapisać: najpierw
    wystawić certyfikat i uruchomić nasłuchiwanie kanałem szyfrowanym,
    przestawić na nie narzędzia, a dopiero potem zamknąć drogę
    nieszyfrowaną. Odwrotna kolejność odbiera zarządzanie nad maszyną,
    a na serwerze bez drogi zapasowej jest to błąd, którego nie da się
    naprawić zdalnie.

    Zmiana wchodzi w życie od razu, bez restartu usługi, i cofa się
    natychmiast. Sesje już trwające nie są przerywane.
  en: |
    One thing needs checking: whether anything connects to this service that cannot encrypt.

    In a domain setting the answer runs "no" and the change goes by unnoticed, the domain's
    mechanism encrypting the messages of itself. Hence on most servers this item is a formality.

    It is otherwise where the machine is managed by a local account. A connection authenticated
    basically through an unencrypted channel will after the change stop being taken, and that is an
    arrangement met with on servers in a demilitarised zone, in testing settings, and wherever a
    listening on an encrypted channel would take the putting out of a certificate and nobody did
    it.

    The second case is tools from outside the world of Windows speaking this protocol: systems of
    watching, tools of automation, agents. Some of them connect by an unencrypted channel by
    default, it being simpler to set up so.

    The symptom is plain though misleading as to its cause: the connection is thrown out at its
    opening, and the message speaks of a refusal of access and not of a want of encryption.

    The order of the rollout matters here and is worth writing down: first put out a certificate
    and start a listening on an encrypted channel, turn the tools over to it, and only then shut
    the unencrypted road. The other way about takes away the managing of the machine, and on a
    server without a spare road it is a mistake that cannot be mended from afar.

    The change comes into force straight away, with no restart of the service, and is undone at
    once. Sessions already running are not broken.

implementation_consequences:
  impact_areas:
    - remote-management
    - encryption-and-tls
    - network-and-firewall
  what_breaks:
    pl:
      - Zarządzanie kontem lokalnym kanałem nieszyfrowanym przestanie być przyjmowane
      - System monitorowania łączący się domyślnie kanałem nieszyfrowanym przestanie zbierać dane
      - Komunikat mówi o odmowie dostępu, a nie o braku szyfrowania, więc przyczyna nie jest oczywista
      - W środowisku domenowym zmiana przechodzi niezauważona, bo komunikaty są już szyfrowane
      - Sesje zarządzania już trwające nie są przerywane, warunek sprawdza się przy następnym połączeniu
    en:
      - Managing by a local account through an unencrypted channel will stop being taken
      - A system of watching connecting by an unencrypted channel by default will stop gathering readings
      - The message speaks of a refusal of access and not of a want of encryption, so the cause is not plain
      - In a domain setting the change goes by unnoticed, the messages being encrypted already
      - Sessions of management already running are not broken, the condition being checked at the next connecting
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwerowi nie wystawiono certyfikatu i nie uruchomiono nasłuchiwania kanałem szyfrowanym
      - Maszyna jest zarządzana wyłącznie kontem lokalnym kanałem nieszyfrowanym i nie ma drogi zapasowej
    en:
      - No certificate was put out for the server and no listening on an encrypted channel was started
      - The machine is managed by a local account through an unencrypted channel alone and there is no spare road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'AllowUnencryptedTraffic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowUnencryptedTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The listening on an encrypted channel is set up apart and before this
    # change. Shutting the unencrypted road first takes the managing away.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowUnencryptedTraffic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Ograniczenie, które trzeba znać, żeby nie przypisywać punktowi
    zasługi, której nie ma: połączenie uwierzytelnione mechanizmem
    domenowym jest szyfrowane na poziomie komunikatów niezależnie od
    kanału. Tam ustawienie nic nie zmienia.

    Rzeczywisty skutek to zamknięcie pary „uwierzytelnianie podstawowe
    kanałem nieszyfrowanym" — jedynego w praktyce układu, w którym
    sesja zarządzania idzie czytelna razem z hasłem.

    Kolejność wdrożenia: najpierw certyfikat i nasłuchiwanie kanałem
    szyfrowanym, potem przestawienie narzędzi, a dopiero na końcu
    zamknięcie drogi nieszyfrowanej.
  en: |
    A bound to be known lest a merit be laid to the item which it has not: a connection
    authenticated by the domain's mechanism is encrypted at the level of the messages whatever the
    channel. There the setting changes nothing.

    The true effect is the shutting of the pair "basic authentication through an unencrypted
    channel" - in practice the one arrangement wherein a session of management goes readable along
    with the password.

    The order of the rollout: first the certificate and the listening on an encrypted channel, then
    the turning over of the tools, and only at the last the shutting of the unencrypted road.
