id: win10-bitlocker-fixed-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysków stałych ustalony
    en: The way of recovering access to fixed drives settled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, w jaki sposób odzyskuje się dostęp do
    zaszyfrowanego dysku stałego z danymi i gdzie trafia klucz.

    Powód jest ten sam co przy dysku systemowym, ale konsekwencja utraty
    klucza cięższa. Dysk systemowy da się w najgorszym razie wyczyścić
    i postawić od nowa — system odtworzy się z obrazu, a maszyna wróci do
    pracy. Dysk z danymi nie ma takiego wariantu. To, co na nim leży,
    istnieje tylko tam.

    Wymaganie jest jednoznaczne: hasło odzyskiwania zapisywane w katalogu
    domenowym, a szyfrowanie nierozpoczynane, dopóki zapis się nie
    powiedzie. Klucz staje się przez to własnością organizacji, a nie
    osoby, która akurat siedziała przy maszynie w dniu szyfrowania.

    Odnotowuję, że punkt jest jedną decyzją zapisaną w ośmiu wartościach.
    Sprawdzenie czyta je razem i wymienia te, które odstają, bo maszyna
    ustawiona w połowie wygląda z zewnątrz tak samo jak ustawiona
    w całości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: klucz do
    dysku z danymi przechowywany w miejscu przypadkowym albo
    nieprzechowywany wcale.
  en: |
    The setting settles in what manner the way into an enciphered fixed data drive is recovered and where the key
    goes.

    The ground is the same as with the system drive, but the weight of a lost key the heavier. A system drive may
    at the worst be wiped and set up anew - the system comes back from an image and the machine returns to work. A
    drive of data has no such variant. What lies upon it is only there.

    The requirement is plain: the password of recovery written into the domain directory, and the enciphering not
    begun until that writing has come through. The key becomes by that the property of the body and not of the
    person who happened to sit at the machine on the day of the enciphering.

    I set down that the item is one decision written in eight values. The check reads them together and names
    those that differ, a machine set halfway looking from outside just like one set whole.

    What an attacker gains while the item goes unmet: the key to a drive of data kept in a chance place, or not
    kept at all.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", tak samo jak odpowiednik dla dysku
    systemowego i z tego samego powodu: wymaga infrastruktury, której nie
    da się dorobić w dniu zmiany.

    Warunkiem jest katalog domenowy przygotowany do przechowywania kluczy
    oraz procedura po stronie obsługi. Bez tej drugiej części klucz jest
    zapisany, ale nikt nie wie, komu wolno go wydać ani jak sprawdzić, kto
    prosi.

    Po zmianie szyfrowanie nie rozpocznie się na dysku, dla którego nie uda
    się zapisać klucza. Jest to zachowanie zamierzone i chroni przed
    wariantem najgorszym, ale w praktyce znaczy, że dysk w maszynie poza
    domeną nie zaszyfruje się wcale.

    Odnotowuję różnicę wobec punktu o dysku systemowym: hasło i klucz
    odzyskiwania stoją tutaj na wartości dopuszczającej, nie wymuszającej.
    Oba są dozwolone, żaden nie jest jedyną drogą — a wymuszenie zapisu do
    katalogu i tak pilnuje, żeby klucz gdzieś trafił.

    Czego to nie psuje: pracy z zaszyfrowanym dyskiem, odczytu, zapisu,
    udziałów plikowych, logowania.
  en: |
    The class is "needs a planned rollout", as with its counterpart for the system drive and upon the same ground:
    it calls for an estate that cannot be got up on the day of the change.

    The condition is a domain directory made ready to keep the keys, and a procedure upon the support's side.
    Without that second part the key is written down but nobody knows to whom it may be handed out or how to prove
    who asks.

    After the change the enciphering will not begin upon a drive for which the key cannot be written. It is meant
    behaviour and guards against the worst variant, but in practice it means a drive in a machine outside the
    domain will not encipher at all.

    I set down the difference from the item about the system drive: the password and the key of recovery stand
    here at a value that permits and does not enforce. Both are allowed, neither is the only way - and the
    enforcing of the writing into the directory watches anyway that the key goes somewhere.

    What this does not break: work with an enciphered drive, reading, writing, file shares, or logging on.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Dysk w maszynie poza domeną nie zaszyfruje się wcale, bo nie zdoła zapisać klucza do katalogu
      - Dyski już zaszyfrowane zachowują dotychczasowe klucze i wymagają zapisania ich osobno
      - Raport pokaże wtedy stan zgodny przy dyskach, których klucza nikt nie ma
      - Potrzebna jest procedura po stronie obsługi — komu wolno wydać klucz i jak sprawdzić proszącego
      - Praca z zaszyfrowanym dyskiem, odczyt, zapis, udziały plikowe i logowanie pozostają bez zmian
    en:
      - A drive in a machine outside the domain will not encipher at all, being unable to write the key into the directory
      - Drives already enciphered keep the keys they had and call for those to be written down apart
      - The report will then show a compliant state upon drives whose key nobody holds
      - A procedure upon the support s side is needed - to whom a key may be handed out and how the asker is proved
      - Work with an enciphered drive, reading, writing, file shares and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny nie należą do domeny i nie ma katalogu, w którym klucze mogłyby zostać zapisane
      - Nie ma procedury wydawania klucza, więc zapisany klucz i tak nie trafi do proszącego
    en:
      - The machines do not belong to a domain and there is no directory in which the keys could be written
      - There is no procedure for the handing out of a key, so a written key will not reach the asker anyway
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are read
      # at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        FDVRecovery                     = 1
        FDVManageDRA                    = 0
        FDVRecoveryPassword             = 2
        FDVRecoveryKey                  = 2
        FDVHideRecoveryPage             = 1
        FDVActiveDirectoryBackup        = 1
        FDVActiveDirectoryInfoToStore   = 1
        FDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'FDVRecovery', 'FDVManageDRA', 'FDVRecoveryPassword', 'FDVRecoveryKey',
      'FDVHideRecoveryPage', 'FDVActiveDirectoryBackup',
      'FDVActiveDirectoryInfoToStore', 'FDVRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One decision written in several values, so they go in together. The password
    # and the key stand at two, which permits them without making either the only way.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      FDVRecovery                     = 1
      FDVManageDRA                    = 0
      FDVRecoveryPassword             = 2
      FDVRecoveryKey                  = 2
      FDVHideRecoveryPage             = 1
      FDVActiveDirectoryBackup        = 1
      FDVActiveDirectoryInfoToStore   = 1
      FDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła powtarza decyzję znaną z dysku systemowego i warto, żeby
    aplikacja pokazała obie razem — bo wdraża się je jednocześnie albo
    wcale. Katalog przygotowany dla jednej klasy nośników obsłuży drugą bez
    żadnej dodatkowej pracy.

    Argument wart zachowania dotyczy różnicy w skutkach utraty klucza.
    Przy dysku systemowym utrata klucza kosztuje czas: maszyna idzie do
    odtworzenia z obrazu. Przy dysku z danymi utrata klucza kosztuje dane,
    bo obrazu nie ma i nie będzie.

    Odnotowuję, że punkt jest jedną decyzją w ośmiu wartościach i że
    sprawdzenie czyta je razem. Dysk ustawiony w połowie wygląda
    z zewnątrz jak ustawiony, a raport czytający wartości osobno
    wprowadzałby w błąd.
  en: |
    The rule repeats the decision known from the system drive, and it is well that the application show both
    together - they being rolled out at once or not at all. A directory made ready for one class of drive will
    serve the other with no further work.

    The argument worth keeping touches the difference in what a lost key costs. With a system drive a lost key
    costs time: the machine goes for a setting up again from an image. With a drive of data a lost key costs the
    data, there being no image and none to come.

    I set down that the item is one decision in eight values and that the check reads them together. A drive set
    halfway looks from outside like one set whole, and a report reading the values apart would mislead.
