id: win10-firewall-all-profiles-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Zapora włączona we wszystkich profilach sieciowych
    en: The firewall turned on in all profiles of the network
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza zaporę w trzech profilach sieciowych: domenowym,
    prywatnym i publicznym.

    Profil jest wybierany przez system przy każdym podłączeniu do sieci
    i rozstrzyga, który zestaw reguł obowiązuje. Maszyna przenośna zmienia
    profil kilka razy dziennie, przechodząc z sieci biurowej do domowej
    i do publicznej.

    Na tym polega treść tego punktu. Zapora wyłączona w jednym profilu
    wygląda na maszynę chronioną, dopóki maszyna nie trafi do tej właśnie
    sieci. Wyłączenie w profilu publicznym jest najgorsze z możliwych, bo
    dotyczy sieci, w której maszyna jest najbardziej narażona: hotelowej,
    lotniskowej, kawiarnianej.

    Zapora jest przy tym jedynym mechanizmem, który odcina połączenia
    zanim dojdą do programu. Wszystko inne działa później — sprawdza, kto
    się łączy, co przesyła i czy ma prawo. Zapora rozstrzyga, czy w ogóle
    dojdzie do rozmowy.

    Odnotowuję, że sprawdzenie wymienia profile, w których zapora jest
    wyłączona. Maszyna niezgodna w jednym profilu to inny przypadek niż
    maszyna bez zapory w ogóle.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    usług nasłuchujących na maszynie, z pominięciem wszystkich reguł.
  en: |
    The setting turns the firewall on in three profiles of the network: the domain one, the private one and the
    public one.

    The profile is chosen by the system at every joining to a network and settles which set of rules holds good. A
    machine to be carried changes profile some times a day, passing from the network of an office to that of a
    home and to a public one.

    Therein lies the substance of this item. A firewall switched off in one profile looks like a machine guarded,
    until the machine comes into that very network. The switching off in the public profile is the worst of all,
    touching as it does the network in which the machine stands most open: that of a hotel, an airport, a
    coffee-house.

    The firewall is besides the one mechanism that cuts joinings off before ever they come to a program.
    Everything else works later - it weighs who joins, what they send and whether they have the right. The
    firewall settles whether there will be a speaking at all.

    I set down that the check names the profiles in which the firewall stands off. A machine out of compliance in
    one profile is another case than a machine with no firewall at all.

    What an attacker gains while the item goes unmet: a way to the services listening upon the machine, with all
    the rules passed over.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    zapora nie została wyłączona celowo i czy włączenie jej czegoś nie
    odetnie.

    Miejscem najczęstszym jest maszyna, na której zaporę wyłączono przy
    rozwiązywaniu problemu z siecią i nie włączono z powrotem. Włączenie
    jej przywraca stan, w którym reguły faktycznie obowiązują — a jeżeli
    reguła dla jakiejś usługi nigdy nie powstała, usługa ta przestanie
    być dostępna z sieci.

    Miejscem drugim jest oprogramowanie serwerowe uruchomione na
    stanowisku roboczym: baza danych, serwer wydruku, narzędzie
    udostępniające katalog. Instalator zwykle dodaje własną regułę, ale
    przy zaporze wyłączonej mógł tego nie zrobić.

    Sprawdzenie polega na wypisaniu usług nasłuchujących na maszynie
    i porównaniu ich z istniejącymi regułami zapory przed włączeniem.

    Skutek pojawia się natychmiast, bez restartu. Połączenia trwające
    w chwili włączenia nie są zrywane.

    Czego to nie psuje: połączeń wychodzących, pracy lokalnej, logowania,
    dostępu do zasobów sieciowych inicjowanego z tej maszyny, drukowania
    na drukarkach sieciowych.
  en: |
    The class is "needs review", and the object of the review is whether the firewall was switched off on purpose
    and whether the turning of it on will cut something off.

    The commonest place is a machine whose firewall was switched off at the untangling of a trouble with the
    network and never switched back. The turning of it on brings back a state in which the rules truly hold - and
    if a rule for some service never came about, that service will cease to stand open from the network.

    The second place is server software run upon a working station: a base of data, a server of printing, a tool
    sharing a folder. The installer commonly adds a rule of its own, but at a firewall switched off it may not
    have done so.

    The review comes down to a writing out of the services listening upon the machine and a setting of them beside
    the standing rules of the firewall before the turning on.

    The consequence shows at once, with no restart. Joinings at work at the hour of the turning on are not broken
    off.

    What this does not break: outbound joinings, work upon the machine itself, logging on, the way to resources
    upon the network started from this machine, or printing upon printers of the network.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
    - remote-desktop
    - printing
  what_breaks:
    pl:
      - Usługi nasłuchujące na maszynie bez własnej reguły zapory przestaną być dostępne z sieci
      - Dotyczy to zwłaszcza oprogramowania serwerowego zainstalowanego przy zaporze już wyłączonej
      - Włączenie przywraca stan, w którym reguły faktycznie obowiązują, więc luki w regułach wyjdą na jaw dopiero teraz
      - Połączenia trwające w chwili włączenia nie są zrywane, więc objaw pojawia się przy następnej próbie
      - Połączenia wychodzące, praca lokalna, logowanie i drukowanie na drukarkach sieciowych pozostają bez zmian
    en:
      - Services listening upon the machine without a firewall rule of their own will cease to stand open from the network
      - That holds above all of server software installed at a firewall already switched off
      - The turning on brings back a state in which the rules truly hold, so gaps in the rules will come to light only now
      - Joinings at work at the hour of the turning on are not broken off, so the mark shows at the next attempt
      - Outbound joinings, work upon the machine itself, logging on and printing upon printers of the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi oprogramowanie serwerowe bez własnej reguły zapory i nie ma jej kto dopisać
      - Zaporę wyłączono celowo na czas rozwiązywania problemu z siecią i praca ta jeszcze trwa
    en:
      - Upon the machine stands server software without a firewall rule of its own and there is nobody to add one
      - The firewall was switched off on purpose for the untangling of a trouble with the network and that work is still afoot
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # The three profiles are weighed together. Naming the ones that fall out
        # matters, a machine set in two of three being a different case from one
        # set in none.
        $wrong = @($profiles | Where-Object { $_.Enabled -ne 'True' })
        if ($wrong.Count -eq 0) { 'ALL_ENABLED' } else { 'DISABLED_IN_' + ($wrong.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, Enabled |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -Enabled $p.Enabled
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest oceniona krytycznie i jest to jedyna taka ocena w całym
    bloku zapory. Warto, żeby aplikacja postawiła ją na początku:
    pozostałe punkty stroją zachowanie zapory, ten rozstrzyga, czy zapora
    w ogóle działa.

    Argument wart postawienia wprost dotyczy profilu publicznego. Maszyna
    przenośna trafia do sieci obcych regularnie, a właśnie tam zapora jest
    jedyną rzeczą stojącą między nią a wszystkimi innymi urządzeniami
    w tej sieci. Wyłączenie w profilu domenowym bywa decyzją; wyłączenie
    w publicznym nie ma uzasadnienia, które dałoby się nazwać.

    Odnotowuję, że sprawdzenie wymienia profile niezgodne z nazwy.
    Jest to celowe: informacja „wyłączona w profilu publicznym" prowadzi
    do innego działania niż „wyłączona wszędzie", a raport podający samo
    niepowodzenie zmusza do ręcznego sprawdzania.
  en: |
    The rule is graded critical and it is the one such grading in the whole block of the firewall. It is well that
    the application set it at the beginning: the other items tune the firewall's behaviour, this settles whether
    the firewall works at all.

    The argument worth putting outright touches the public profile. A machine to be carried comes into strange
    networks regularly, and there the firewall is the one thing standing between it and every other device upon
    that network. A switching off in the domain profile is at times a decision; a switching off in the public one
    has no ground that may be named.

    I set down that the check names the profiles out of compliance. That is by design: the word "off in the public
    profile" leads to another doing than "off everywhere", and a report giving a bare failure drives one to check
    by hand.
