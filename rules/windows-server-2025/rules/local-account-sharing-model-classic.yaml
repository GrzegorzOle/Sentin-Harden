id: win2025-local-account-sharing-model-classic

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta lokalne uwierzytelniane po sobie, a nie sprowadzane do gościa
    en: Local accounts authenticated as themselves rather than reduced to a guest
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, kim jest konto lokalne, które łączy się
    z tą maszyną przez sieć: sobą samym czy gościem.

    W wariancie niewłaściwym każde takie połączenie sprowadzane jest do
    gościa, niezależnie od tego, jakie konto podano. Znaczy to, że
    uprawnienia przyznane konkretnemu kontu nie obowiązują — obowiązują
    uprawnienia gościa, jednakowe dla wszystkich.

    Skutek jest podwójny i oba kierunki są złe. Pierwszy: uprawnienia
    nadane celowo przestają cokolwiek znaczyć, bo nikt nie występuje
    pod swoim imieniem. Drugi, groźniejszy: kto zna nazwę dowolnego
    konta na maszynie, ten wchodzi jak gość — a wszystko, co gość może
    przeczytać, jest otwarte dla każdego, kto się połączy.

    Na serwerze rzecz waży bardziej niż na stanowisku roboczym, bo
    to serwer trzyma dane, po które ludzie przychodzą. Serwer plików
    w grupie roboczej — czyli poza domeną — uwierzytelnia wyłącznie
    kontami lokalnymi, więc ten właśnie punkt rozstrzyga o całej jego
    kontroli dostępu.

    Trzeci skutek dotyczy dziennika. Zapisy o dostępie wskazują gościa,
    a nie osobę, więc nie da się z nich odtworzyć, kto co otworzył.
    Raport z takiej maszyny nie odpowiada na pytanie, które audyt zada
    jako pierwsze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście
    na uprawnieniach gościa przy znajomości samej nazwy konta oraz
    dziennik, w którym jego dostęp wygląda tak samo jak cudzy.
  en: |
    The setting settles who a local account connecting to this machine over the network is:
    itself, or a guest.

    In the wrong variant every such connection is brought down to a guest, whatever account was
    named. That means rights granted to a particular account hold nothing - the guest's rights
    hold, the same for everybody.

    The effect is twofold and both directions are bad. First: rights granted on purpose stop
    meaning anything, nobody standing under their own name. Second, and graver: whoever knows
    the name of any account on the machine comes in as a guest - and all a guest may read is
    open to anyone who connects.

    On a server the matter weighs more than at a working station, the server holding the data
    people come for. A file server in a workgroup - that is, outside a domain - authenticates by
    local accounts alone, so this item settles the whole of its access control.

    A third effect bears on the log. The entries about access name a guest rather than a person,
    so who opened what cannot be pieced back from them. A report from such a machine does not
    answer the question an audit asks first.

    What an attacker gains while the item goes unmet: entry on a guest's rights by knowing a
    mere account name, and a log in which their access looks the same as anybody else's.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś na tym serwerze korzysta dziś
    z udziałów, licząc na sprowadzenie do gościa.

    W stanie domyślnym konta uwierzytelniane są po sobie na maszynie
    należącej do domeny, więc tam naprawa zwykle nie zmienia niczego.
    Niezgodność występuje przede wszystkim na maszynach w grupie
    roboczej i bierze się zwykle z decyzji podjętej kiedyś dla wygody.

    Bo też wygoda jest tu realna. Wariant z gościem pozwala udostępnić
    katalog bez zakładania kont i bez rozdawania haseł — kto się
    połączy, ten wchodzi. Wdrożenia takie spotyka się przy udziałach
    z materiałami wspólnymi i przy urządzeniach zapisujących na
    serwerze.

    Objaw po zmianie jest natychmiastowy i powszechny: połączenie
    kończy się pytaniem o poświadczenia, a wpisanie nazwy konta, które
    na serwerze nie istnieje, kończy się odmową. Użytkownicy odbierają
    to jako „dysk przestał działać", bo wcześniej nikt niczego nie
    wpisywał.

    Właściwym rozwiązaniem jest założenie kont na serwerze albo
    włączenie go do domeny — nie powrót do wariantu z gościem.
    Przygotowanie kont przed zmianą sprawia, że zmiana przechodzi
    niezauważona przez tych, którzy je dostali.

    Zmiana nie wymaga przerwy. Dotyczy połączeń nawiązywanych po niej,
    więc sesje już otwarte działają do rozłączenia.
  en: |
    What needs checking is whether anybody on this server uses the shares today counting on the
    bringing down to a guest.

    In the default state accounts are authenticated as themselves on a machine belonging to a
    domain, so there the mending usually changes nothing. Non-compliance stands above all on
    machines in a workgroup and usually comes of a decision taken once for convenience.

    For the convenience is real here. The guest variant lets a directory be put out with no
    accounts set up and no passwords handed round - whoever connects comes in. Such rollouts are
    met at shares of common materials and at devices writing to the server.

    The symptom after the change is immediate and widespread: the connection ends in a question
    for credentials, and typing the name of an account that does not stand on the server ends in
    a refusal. Users take it for "the drive has stopped working", nobody having typed anything
    before.

    The right answer is setting accounts up on the server or joining it to a domain - not a
    return to the guest variant. Preparing the accounts before the change makes the change pass
    unmarked by those who got them.

    The change takes no break. It bears on connections made after it, so sessions already open
    work until they are dropped.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - legacy-authentication
    - logging-and-audit
  what_breaks:
    pl:
      - Udział osiągany dotąd bez podawania poświadczeń zacznie ich żądać przy każdym połączeniu
      - Urządzenie zapisujące na serwerze bez własnego konta zgłosi odmowę dostępu
      - Użytkownicy odbierają to jako awarię dysku, bo wcześniej nikt niczego nie wpisywał
      - Sesje już otwarte działają do rozłączenia, więc skutek ujawnia się przy następnym połączeniu
    en:
      - A share reached until now without credentials will begin demanding them at every connection
      - A device writing to the server without an account of its own will report a refusal of access
      - Users take it for a failure of the drive, nobody having typed anything before
      - Sessions already open work until they are dropped, so the effect shows at the next connection
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer pracuje w grupie roboczej, a udziały udostępniono bez zakładania kont dla użytkowników
      - Na serwer zapisują urządzenia sieciowe, dla których nie założono kont lokalnych
      - Nie przygotowano kont dla osób korzystających dziś z udziałów tego serwera
    en:
      - The server works in a workgroup and the shares were put out with no accounts set up for users
      - Network devices for which no local accounts were set up write to the server
      - No accounts were prepared for the people using this server's shares today
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero means every account is authenticated as itself; one reduces each
      # network logon with a local account to the guest.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'ForceGuest'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'ForceGuest'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ForceGuest' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-sharing-and-security-model-for-local-accounts

notes:
  pl: |
    Punkt rozstrzyga o całej kontroli dostępu na serwerze plików
    pracującym w grupie roboczej, bo taki serwer uwierzytelnia
    wyłącznie kontami lokalnymi.

    Dotyczy wyłącznie połączeń sieciowych z kontem lokalnym. Konta
    domenowe i logowanie przy konsoli są od niego niezależne.

    Skutek obejmuje też dziennik. W wariancie z gościem zapisy
    o dostępie wskazują gościa, a nie osobę, więc nie da się odtworzyć,
    kto co otworzył. Jest to często ważniejsze niż samo ograniczenie
    dostępu.
  en: |
    The item settles the whole of the access control on a file server working in a workgroup,
    such a server authenticating by local accounts alone.

    It bears only on network connections with a local account. Domain accounts and signing in at
    the console stand free of it.

    The effect takes in the log as well. In the guest variant the entries about access name a
    guest rather than a person, so who opened what cannot be pieced back. That is often weightier
    than the bounding of access itself.
