id: win2025-defender-asr-office-executable-content

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada tworzenia plików wykonywalnych przez aplikacje pakietu biurowego
    en: Office applications blocked from creating executable content
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania aplikacjom pakietu biurowego zapisywania na dysku
    plików wykonywalnych.

    Jest to druga połowa tego samego ataku, którego pierwszą połowę
    zamyka blokada uruchamiania programów przez te aplikacje. Napastnik
    potrzebuje dwóch rzeczy: zapisać narzędzie i je uruchomić. Obie
    reguły zamykają po jednej z nich i warto je wdrażać razem, bo
    każda osobno zostawia drugą połowę otwartą.

    Przy tej regule trzeba jednak powiedzieć rzecz, która na serwerze
    zmienia jej sens, a którą łatwo przeoczyć.

    Serwer plików przechowujący dokumenty nie jest maszyną, która je
    otwiera. Dokument leży na udziale, a otwiera go aplikacja na
    stanowisku użytkownika — i to tam ta reguła by zadziałała, a nie
    tutaj. Serwer plików pełen dokumentów z makrami nie jest chroniony
    przez tę regułę ani o włos bardziej niż serwer pusty.

    Jest to dokładnie ten przypadek, w którym łatwo przeczytać zielony
    punkt w raporcie jako ochronę, której nie ma. Punkt broni maszyny,
    na której stoi aplikacja, a nie danych, które maszyna udostępnia.

    Ocena ma więc treść tylko tam, gdzie dokumenty są otwierane: na
    serwerze terminalowym i na serwerze składającym dokumenty
    automatycznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z pakietem biurowym — możliwość zapisania własnego
    narzędzia na dysk przy samym otwarciu dokumentu.
  en: |
    The rule forbids the applications of the office bundle to write onto the disk files to be
    carried out.

    It is the second half of the same attack whose first half is shut by the blocking of the
    running of programs by those applications. The attacker needs two things - to write their tool
    down and to run it. Both rules shut one each, and they are worth rolling out together, each
    alone leaving the other half open.

    At this rule, though, a thing must be said that on a server alters its sense and that is easily
    overlooked.

    A server of files that keeps documents is not the machine that opens them. The document lies on
    a share, and an application at the user's station opens it - and it is there that this rule
    would take, and not here. A server of files full of documents with macros is guarded by this
    rule not a hair more than an empty one.

    It is just the case wherein a green item in a report is easily read as a guard that is not. The
    item guards the machine the application stands on and not the readings the machine gives out.

    The reckoning has therefore substance only where documents are opened - on a terminal server
    and on a server that sets documents of itself.

    What an attacker gains while the item goes unmet: on a machine with an office bundle - the
    means of writing their own tool onto the disk at the very opening of a document.

disruption_description:
  pl: |
    Na maszynie bez pakietu biurowego zmiana nie robi nic. Zostaje mimo
    to poza trybem zbiorczym, bo pytania o to, co jest zainstalowane,
    tryb zbiorczy nie zadaje.

    Tam, gdzie pakiet jest, sprawdzenia wymaga jedna rzecz i jest ona
    bardziej szczegółowa niż przy sąsiednich regułach: co aplikacja
    biurowa na tej maszynie zapisuje.

    Rzecz w tym, że „plik wykonywalny" to nie tylko program. Reguła
    obejmuje też skrypty i pliki poleceń, a te bywają wynikiem
    prawidłowej pracy. Arkusz generujący zestaw poleceń do
    późniejszego wykonania, szablon składający skrypt wdrożeniowy,
    narzędzie eksportujące plik wsadowy — wszystko to na serwerze
    aplikacyjnym istnieje i zostanie zablokowane.

    Drugim przypadkiem jest rozpakowywanie. Dokument zawierający
    załącznik, który przy otwarciu ląduje na dysku jako plik
    wykonywalny, jest dla tej reguły nie do odróżnienia od ataku —
    i słusznie, bo zwykle nim jest. Ale bywa też starym sposobem
    dystrybucji narzędzi wewnątrz organizacji.

    Objaw zależy od maszyny. Na serwerze aplikacyjnym jest cichy:
    plik po prostu nie powstaje, a zadanie, które miało go użyć, kończy
    się błędem o brakującym pliku. Na serwerze terminalowym jest
    widoczny dla użytkownika, ale komunikat nie tłumaczy powodu.

    Regułę wdrażaj razem z blokadą uruchamiania programów przez te same
    aplikacje. Osobno każda z nich zostawia drugą połowę ataku otwartą.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    On a machine with no office bundle the change does nothing. It stays outside the bulk mode for
    all that, the bulk mode asking no questions about what is set up.

    Where the bundle is, one thing needs checking and it is finer than at the neighbouring rules -
    what an office application on this machine writes.

    The thing is that "a file to be carried out" is not only a program. The rule takes in scripts
    and files of orders as well, and those are at times the fruit of right work. A sheet that makes
    a set of orders for a later carrying out, a pattern that sets a script of rolling out, a tool
    that sends out a file of batches - all of these are on a server of applications and will be
    blocked.

    The second case is the unpacking. A document bearing an attachment that at its opening lands on
    the disk as a file to be carried out is to this rule not to be told from an attack - and
    rightly, it mostly being one. But it is at times an old way of dealing out tools within a body.

    The symptom hangs upon the machine. On a server of applications it is quiet - the file simply
    does not come to be, and the task that was to use it ends in a fault about a file wanting. On a
    terminal server it is seen by the user, but the word given sets forth no ground.

    Roll the rule out together with the blocking of the running of programs by those same
    applications. Alone each of them leaves the other half of the attack open.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - scripting-and-automation
  what_breaks:
    pl:
      - Arkusz generujący zestaw poleceń albo skrypt do późniejszego wykonania przestanie go zapisywać
      - Zadanie, które miało użyć wygenerowanego pliku, kończy się błędem o brakującym pliku
      - Dokumenty rozpakowujące przy otwarciu narzędzie na dysk przestaną to robić
      - Serwer plików przechowujący dokumenty nie jest przez tę regułę chroniony, bo ich nie otwiera
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - A sheet that makes a set of orders or a script for a later carrying out will stop writing it
      - A task that was to use the made file ends in a fault about a file wanting
      - Documents that unpack a tool onto the disk at their opening will stop doing so
      - A server of files keeping documents is not guarded by this rule, not opening them
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Aplikacja biurowa na tym serwerze zapisuje skrypty albo pliki poleceń jako wynik prawidłowej pracy
      - Narzędzia wewnętrzne są rozprowadzane w postaci dokumentów rozpakowujących plik na dysk
    en:
      - An office application on this server writes scripts or files of orders as the fruit of right work
      - Inward tools are dealt out as documents that unpack a file onto the disk
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '3b576869-a4ec-4529-8536-b80a7769e899'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '3b576869-a4ec-4529-8536-b80a7769e899'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Roll out together with the blocking of programs launched by these same
    # applications. Alone each leaves the other half of the attack open.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '3b576869-a4ec-4529-8536-b80a7769e899' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Rzecz, którą łatwo przeoczyć na serwerze: serwer plików
    przechowujący dokumenty nie jest maszyną, która je otwiera. Punkt
    broni maszyny, na której stoi aplikacja, a nie danych, które maszyna
    udostępnia. Zielony punkt w raporcie na serwerze plików nie oznacza
    ochrony przechowywanych tam dokumentów.

    „Plik wykonywalny" obejmuje też skrypty i pliki poleceń, a te bywają
    wynikiem prawidłowej pracy — arkusz generujący zestaw poleceń,
    szablon składający skrypt wdrożeniowy.

    Wdrażaj razem z blokadą uruchamiania programów przez te same
    aplikacje. Osobno każda zostawia drugą połowę ataku otwartą.
  en: |
    A thing easily overlooked on a server - a server of files that keeps documents is not the
    machine that opens them. The item guards the machine the application stands on and not the
    readings the machine gives out. A green item in a report on a server of files means no guard
    over the documents kept there.

    "A file to be carried out" takes in scripts and files of orders too, and those are at times the
    fruit of right work - a sheet that makes a set of orders, a pattern that sets a script of
    rolling out.

    Roll it out together with the blocking of the running of programs by those same applications.
    Alone each leaves the other half of the attack open.
