id: win11-uac-deny-elevation-standard-users

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Automatyczna odmowa podniesienia uprawnień użytkownikom standardowym
    en: Elevation requests from standard users automatically denied
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy program uruchamiany przez użytkownika standardowego potrzebuje uprawnień
    administratora, system domyślnie pyta o poświadczenia administracyjne. Pytanie
    jest skierowane do tego, kto siedzi przy maszynie — a to znaczy, że może je
    zobaczyć ktoś, kto nie powinien na nie odpowiadać.

    Na tym stoi jeden z najskuteczniejszych sposobów wejścia do systemu, bo nie
    wymaga żadnej luki: wystarczy doprowadzić do wyświetlenia okna i przekonać
    człowieka, żeby wpisał w nie hasło. Ustawienie odbiera oknu prawo się
    pojawić — żądanie zostaje odrzucone od razu, więc nie ma czego wpisywać
    i nie ma kogo przekonywać.
  en: |
    When a program started by a standard user needs administrator rights, the
    system by default asks for administrative credentials. The question is put to
    whoever is sitting at the machine - which means somebody who should not be
    answering it may see it.

    One of the most effective ways into a system rests on this, because it needs
    no flaw at all: it is enough to bring the window up and persuade a person to
    type a password into it. The setting takes from that window the right to
    appear - the request is refused outright, so there is nothing to type into and
    nobody to persuade.

disruption_description:
  pl: |
    To jest zmiana sposobu pracy, nie ustawienie techniczne, i dlatego wymaga
    świadomego wdrożenia.

    Znika droga, na której osoba z działu wsparcia podchodzi do stanowiska
    i wpisuje swoje poświadczenia w oknie, żeby coś zainstalować albo poprawić.
    Ta droga jest w wielu miejscach podstawowym sposobem obsługi zgłoszeń
    i po tej zmianie po prostu przestaje istnieć: okno się nie pojawia, a program
    kończy się błędem o braku uprawnień.

    Zastępcza droga musi być gotowa przed zmianą, nie po. Możliwości są dwie:
    zdalne narzędzie do dystrybucji oprogramowania albo logowanie się na
    stanowisku na osobne konto administracyjne. Obie działają, obie wymagają
    przygotowania, a żadna nie jest szybsza od tej, którą się odbiera.

    Objaw dla użytkownika jest myląco cichy: program po prostu się nie uruchamia
    albo instalacja kończy się niepowodzeniem, bez żadnej wzmianki o tym, że
    żądanie zostało odrzucone polityką.
  en: |
    This is a change in how people work, not a technical setting, and that is why
    it calls for a planned rollout.

    The route where a support person walks up to a workstation and types their own
    credentials into the window to install or fix something disappears. In many
    places that route is the basic way of handling requests, and after this change
    it simply ceases to exist: the window does not appear and the program ends
    with a rights error.

    The replacement route has to be ready before the change, not after. There are
    two options: a remote software distribution tool, or signing in at the station
    on a separate administrative account. Both work, both need preparation, and
    neither is faster than the one being taken away.

    The symptom for the user is misleadingly quiet: the program simply does not
    start, or the installation fails, with no mention that the request was refused
    by policy.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - updates-and-servicing
  what_breaks:
    pl:
      - Osoba z działu wsparcia nie poda już swoich poświadczeń w oknie na stanowisku użytkownika
      - Instalacje wykonywane dotąd przez podanie hasła administratora przy maszynie przestaną być możliwe
      - Program kończy się błędem o braku uprawnień, bez informacji, że żądanie odrzuciła polityka
    en:
      - A support person can no longer supply their credentials in the window at a user's station
      - Installations done so far by typing an administrator password at the machine become impossible
      - The program ends with a rights error, with no word that policy refused the request
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa zgłoszeń opiera się na podawaniu poświadczeń administratora przy stanowisku użytkownika
      - Nie ma narzędzia do zdalnej instalacji oprogramowania ani osobnych kont administracyjnych na stacjach
    en:
      - Support work relies on typing administrator credentials at the user's station
      - There is no remote software installation tool and no separate administrative accounts on stations
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'ConsentPromptBehaviorUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'ConsentPromptBehaviorUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConsentPromptBehaviorUser' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-behavior-of-the-elevation-prompt-for-standard-users

notes:
  pl: |
    Punkt dotyczy wyłącznie kont standardowych i nie zmienia niczego osobie
    zalogowanej na konto administracyjne — ta nadal dostaje swoje pytanie
    o zgodę. To rozróżnienie warto pokazać w interfejsie, bo nazwa ustawienia
    brzmi bardziej kategorycznie, niż wygląda jego zakres.

    Wycofanie jest natychmiastowe i nie wymaga restartu, więc próba na jednym
    stanowisku przed szerszym wdrożeniem kosztuje niewiele. Przy tej klasie
    uciążliwości to najrozsądniejsza droga.
  en: |
    The item covers standard accounts only and changes nothing for somebody signed
    in on an administrative account - they still get their consent question. That
    distinction is worth showing in the interface, because the setting's name
    sounds more categorical than its scope looks.

    Rollback is immediate and needs no restart, so trying it on one station before
    a wider rollout costs little. At this disruption class that is the most
    sensible route.
