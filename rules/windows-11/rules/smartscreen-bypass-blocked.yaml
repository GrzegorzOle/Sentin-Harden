id: win11-smartscreen-bypass-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Ostrzeżenie filtra reputacyjnego bez możliwości pominięcia
    en: The reputation filter's warning with no way past it
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Filtr reputacyjny sprawdza uruchamiany plik i ostrzega, kiedy nie zna go albo
    zna z niedobrej strony. Samo włączenie filtra jest jednak tylko połową
    decyzji — druga połowa rozstrzyga, co się dzieje po ostrzeżeniu.

    W wariancie łagodniejszym ostrzeżenie ma przycisk pozwalający uruchomić plik
    mimo wszystko. Dla napastnika jest to ostatnia przeszkoda, a przeszkoda ta
    ma postać pytania zadanego człowiekowi w momencie, w którym ten człowiek już
    podjął decyzję i chce ją doprowadzić do końca. Odpowiedź jest z góry znana:
    kto kliknął w załącznik i przeszedł przez dwa komunikaty, przejdzie i przez
    trzeci — zwłaszcza że treść wiadomości zwykle go na nie przygotowała.

    Wariant twardszy usuwa przycisk. Ostrzeżenie przestaje być pytaniem i staje
    się rozstrzygnięciem, a decyzja o wyjątku przenosi się z zaskoczonego
    użytkownika na kogoś, kto może plik sprawdzić.
  en: |
    The reputation filter checks the file being started and warns when it does not
    know it, or knows it from a bad side. Switching the filter on is, however, only
    half the decision - the other half settles what happens after the warning.

    In the milder variant the warning carries a button letting the file run all the
    same. To an attacker it is the last obstacle, and that obstacle takes the form
    of a question put to a person at the moment when that person has already made
    their decision and wants to see it through. The answer is known in advance:
    whoever clicked an attachment and walked past two messages will walk past the
    third - the more so as the message's wording usually prepared them for it.

    The firmer variant removes the button. The warning stops being a question and
    becomes a ruling, and the decision about an exception moves from a startled user
    to somebody who can examine the file.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak często na stanowiskach uruchamia się programy,
    których filtr nie zna.

    Ostrzeżenie dotyczy nie tylko rzeczy niedobrych. Program napisany wewnątrz
    firmy, narzędzie pobrane z małego projektu, instalator podpisany świeżym
    certyfikatem albo plik wykonywalny z własnego repozytorium nie mają
    reputacji — i przy tym wariancie nie zostaną uruchomione w ogóle, a nie po
    kliknięciu w ostrzeżenie.

    Skutek jest więc realny i uderza przede wszystkim w zespoły techniczne oraz
    w stanowiska korzystające z oprogramowania niszowego. Objawem jest odmowa
    uruchomienia z komunikatem o zablokowaniu przez filtr, bez przycisku
    pozwalającego przejść dalej.

    Obejściem jest wydanie programu w sposób, który daje mu reputację — podpisanie
    certyfikatem używanym konsekwentnie albo rozprowadzanie go przez mechanizm
    dystrybucji oprogramowania zamiast przez kopiowanie pliku. Warto to
    przygotować przed wdrożeniem, a nie po pierwszym zgłoszeniu.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    What needs checking is how often programs the filter does not know are started
    at the stations.

    The warning concerns more than bad things. A program written inside the company,
    a tool fetched from a small project, an installer signed with a fresh
    certificate or an executable from one's own repository have no reputation - and
    under this variant they will not run at all, rather than running after a click
    on the warning.

    The effect is therefore real and falls above all on technical teams and on
    stations using niche software. The symptom is a refusal to start with a message
    about the filter blocking it, and no button to go on.

    The way around is to release the program in a way that gives it a reputation -
    signing it with a certificate used consistently, or distributing it through a
    software deployment mechanism rather than by copying a file. It is worth
    preparing that before the rollout, not after the first report.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Programy bez ustalonej reputacji nie uruchomią się w ogóle, a nie po potwierdzeniu ostrzeżenia
      - Narzędzia budowane wewnątrz firmy i instalatory z nowym certyfikatem zostaną zablokowane do czasu, aż zyskają reputację
      - Użytkownik nie ma możliwości samodzielnego dopuszczenia pliku i każdy wyjątek wymaga obsługi
    en:
      - Programs with no settled reputation do not run at all, rather than running after the warning is confirmed
      - Tools built inside the company and installers with a new certificate are blocked until they gain a reputation
      - The user cannot admit a file themselves, and every exception needs attending to
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko służy do wytwarzania oprogramowania i uruchamia własne pliki wykonywalne przed ich podpisaniem
    en:
      - The station is used to build software and runs its own executables before they are signed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number, and is compared without regard to
      # letter case. The milder variant is reported by name so the report tells
      # a machine set leniently from one with no setting at all.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'ShellSmartScreenLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value -or [string]$value -eq '') { 'MISSING' }
        else { ([string]$value).Trim().ToUpperInvariant() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: BLOCK
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'ShellSmartScreenLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ShellSmartScreenLevel' -Value 'Block' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/

notes:
  pl: |
    Punkt tworzy parę z regułą włączającą sam filtr i bez niej nie ma skutku —
    ustawiony poziom dotyczy filtra, który musi być włączony. Obie wdraża się
    razem, ale ocena uciążliwości jest różna: włączenie filtra kosztuje
    ostrzeżenie, zablokowanie obejścia kosztuje możliwość uruchomienia.

    Wartość jest tekstem, nie liczbą. Wpis liczbowy w tym miejscu nie jest
    odczytywany i maszyna zachowuje się tak, jakby poziomu nie ustawiono —
    reguła zgłosi wtedy odczytaną treść, a nie brak wpisu.

    Zakres obejmuje uruchamianie plików w powłoce systemu. Sprawdzanie
    reputacji w przeglądarce jest sterowane osobno i ten punkt go nie dotyczy.
  en: |
    The item pairs with the rule switching the filter itself on, and has no effect
    without it - the level set concerns a filter that has to be on. The two are
    applied together, but their disruption differs: switching the filter on costs a
    warning, blocking the way past it costs the ability to run.

    The value is text, not a number. A numeric entry here is not read and the
    machine behaves as if no level had been set - the rule will then report the
    content it read rather than a missing entry.

    Its reach covers starting files in the system shell. Reputation checking in the
    browser is steered separately and this item does not concern it.
