id: win2016-synchronize-directory-data-none

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Synchronizowanie danych usługi katalogowej nieprzyznane nikomu
    en: Synchronising directory service data granted to nobody
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy uprawnienie do synchronizowania danych usługi
    katalogowej nie zostało przyznane żadnemu kontu ani żadnej grupie.

    Uprawnienie to pozwala odczytać całą zawartość katalogu z pominięciem
    uprawnień nałożonych na poszczególne obiekty. Nie jest to szeroki dostęp do
    odczytu — jest to obejście kontroli dostępu w usłudze katalogowej,
    przewidziane pierwotnie dla mechanizmów synchronizacji między katalogami
    różnych producentów.

    Skutek jest taki, jakiego można się spodziewać po pełnym odczycie katalogu:
    wszystkie konta, wszystkie grupy, cała struktura organizacyjna oraz atrybuty,
    których zwykły użytkownik nie widzi, łącznie z tymi, w których przechowuje
    się materiał poświadczeń. Kto to ma, nie potrzebuje już niczego eskalować —
    ma wszystko, po co eskalacja się prowadzi.

    Kategoria krytyczna: to jest jednorazowy odczyt kończący cały atak na
    domenę, wykonywany zgodnie z regułami systemu i w sposób nieodróżnialny od
    pracy narzędzia synchronizującego.

    Na serwerze 2016 lista jest domyślnie pusta i taka ma zostać. Uprawnienie ma
    znaczenie wyłącznie na kontrolerze domeny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełny odczyt
    zawartości katalogu, z atrybutami, do których nie prowadzi żadna inna
    zwykła droga.
  en: |
    The item checks that the right to synchronise directory service data has been
    granted to no account and no group.

    The right allows the whole content of the directory to be read, passing by the
    permissions laid on individual objects. This is not broad read access - it is a
    way round access control in the directory service, foreseen originally for
    mechanisms synchronising directories of different makers.

    The effect is what one would expect of a full read of the directory: every
    account, every group, the whole organisational structure, and attributes an
    ordinary user does not see, those holding credential material among them.
    Whoever has this needs to escalate nothing further - they have everything
    escalation is carried out for.

    The category is critical: this is a single read that ends a whole attack on the
    domain, carried out in accordance with the system's rules and in a way
    indistinguishable from the work of a synchronising tool.

    On Server 2016 the list is empty by default and so it should stay. The right
    carries weight on a domain controller alone.

    What an attacker gains while the item goes unmet: a full read of the directory's
    content, with attributes to which no other ordinary road leads.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Lista jest domyślnie pusta, a usługa katalogowa
    nie potrzebuje tego uprawnienia do własnej replikacji między kontrolerami —
    ta idzie innym mechanizmem i tej zmiany nie dotyka.

    Uprawnienie bywa nadawane przy wdrożeniu narzędzia synchronizującego katalog
    z systemem zewnętrznym: kadrowym, pocztowym albo katalogiem innego
    producenta. Takie wdrożenia są rzadkie, pamiętane i zwykle udokumentowane.
    Jeżeli na liście jest wpis, a nikt nie potrafi wskazać narzędzia, to jest to
    ustalenie audytu, a nie drobiazg.

    Czego to nie psuje: replikacji między kontrolerami domeny, logowania,
    zasad grupy, odczytu katalogu w granicach zwykłych uprawnień ani pracy
    narzędzi administracyjnych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The list is empty by default, and the directory
    service does not need this right for its own replication between controllers -
    that goes by another mechanism and this change does not touch it.

    The right is sometimes granted when a tool synchronising the directory with an
    outside system is put in: a personnel system, a mail system, or another maker's
    directory. Such deployments are rare, remembered and usually documented. If
    there is an entry on the list and nobody can name the tool, that is a finding of
    the audit, not a detail.

    What this does not break: replication between domain controllers, signing in,
    group policy, reading the directory within ordinary permissions, or the work of
    administrative tools.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Narzędzie synchronizujące katalog z systemem kadrowym albo pocztowym przestaje odczytywać atrybuty spoza swoich uprawnień
      - Wdrożona integracja z katalogiem innego producenta zatrzymuje się na niepełnym odczycie
      - Replikacja między kontrolerami domeny idzie innym mechanizmem i działa bez zmian
      - Logowanie, zasady grupy i narzędzia administracyjne pozostają nietknięte
    en:
      - A tool synchronising the directory with a personnel or mail system stops reading attributes beyond its permissions
      - A deployed integration with another maker's directory stops at an incomplete read
      - Replication between domain controllers goes by another mechanism and works unchanged
      - Signing in, group policy and administrative tools stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na kontrolerze działa udokumentowane narzędzie synchronizujące katalog z systemem zewnętrznym, opierające się na tym uprawnieniu
    en:
      - A documented tool synchronising the directory with an outside system and resting on this right runs on the controller
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSyncAgentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A full read of the directory ends the attack rather than advancing it. The
    # service's own replication between controllers uses a different mechanism.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSyncAgentPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSyncAgentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/synchronize-directory-service-data

notes:
  pl: |
    Na serwerze członkowskim uprawnienie nie ma zastosowania. Reguła pozostaje
    tam zgodna i bez skutku — wyniku nie należy czytać jako dowodu utwardzenia
    maszyny członkowskiej.

    Punkt jest jednym z niewielu, w których pusta lista jest stanem docelowym,
    a nie kompromisem. Nie ma tu roli, której trzeba by ustąpić.

    Warto go zestawić z regułami o dostępie do poświadczeń. Tamte utrudniają
    zdobycie jednego hasła; ten dotyczy odczytu wszystkiego naraz.
  en: |
    On a member server the right does not apply. The rule stays compliant there and
    without effect - its result should not be read as evidence that the member
    machine has been hardened.

    The item is one of the few where an empty list is the aim rather than a
    compromise. There is no role here that would have to be given way to.

    It is worth setting beside the rules on access to credentials. Those make
    obtaining one password harder; this one bears on reading everything at once.
