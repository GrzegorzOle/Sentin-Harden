id: win11-machine-account-password-age-limited

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Okres ważności hasła konta maszyny ograniczony do 30 dni
    en: Machine account password validity limited to 30 days
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Hasło konta maszyny zmienia się samo, ale dopiero po upływie zadanego okresu.
    Okres ten wyznacza, jak długo materiał wydobyty z maszyny pozostaje użyteczny
    dla kogoś, kto go zdobył.

    Hasło to pozwala podszyć się pod maszynę wobec domeny: odebrać kierowane do
    niej zasady, nawiązać w jej imieniu kanał służbowy do kontrolera, wystąpić
    jako ona w rozmowach, w których druga strona ufa maszynie, a nie osobie.
    Jest to poświadczenie, którego nikt nie pilnuje, bo nikt go nie zna.

    Skrócenie okresu nie zapobiega wydobyciu hasła — skraca okno, w którym
    wydobyte hasło działa. Stary obraz maszyny, kopia dysku sprzed kwartału
    i sprzęt oddany do serwisu przestają być drogą do domeny po upływie tego
    okresu, i tylko po jego upływie.
  en: |
    The machine account password changes by itself, but only once a set period has
    passed. That period fixes how long material extracted from the machine stays
    useful to whoever obtained it.

    The password allows one to impersonate the machine to the domain: to collect
    the policy aimed at it, to establish the working channel to the controller in
    its name, to appear as it in conversations where the other side trusts the
    machine rather than a person. It is a credential nobody watches over, because
    nobody knows it.

    Shortening the period does not prevent the password being extracted - it
    shortens the window in which an extracted password works. An old machine image,
    a disk copy from a quarter ago and hardware sent out for service stop being a
    road into the domain once that period passes, and only once it passes.

disruption_description:
  pl: |
    Nic nie przestaje działać. Zmiana hasła zachodzi w tle, bez przerwy w pracy
    i bez udziału użytkownika.

    Jedyny odczuwalny skutek dotyczy maszyn odłączanych od sieci firmowej na
    długo. Maszyna, która nie zobaczy kontrolera przez czas znacznie dłuższy niż
    ten okres, może wypaść ze zgodności i wymagać ponownego przyłączenia do
    domeny. Krótszy okres przesuwa tę granicę bliżej, więc na sprzęcie leżącym
    miesiącami w szafie zdarzy się to szybciej niż dotąd.

    Praca zdalna tego nie dotyczy, o ile maszyna okresowo łączy się z siecią
    firmową — wystarczy jeden kontakt z kontrolerem, żeby zmiana zaszła.

    Nie ma restartu. Nowy okres obowiązuje od razu i liczy się od ostatniej
    zmiany hasła, a nie od chwili wdrożenia tego punktu.
  en: |
    Nothing stops working. The password change happens in the background, with no
    break in work and no part played by the user.

    The one noticeable effect concerns machines detached from the company network
    for a long time. A machine that does not see a controller for much longer than
    this period may fall out of step and need rejoining to the domain. A shorter
    period moves that boundary closer, so on hardware lying in a cupboard for
    months it will happen sooner than before.

    Remote work is not affected, as long as the machine connects to the company
    network from time to time - a single contact with a controller is enough for
    the change to happen.

    There is no restart. The new period applies at once and counts from the last
    password change, not from the moment this item is applied.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Maszyny odłączone od sieci firmowej na wiele miesięcy szybciej stracą zgodność z domeną i będą wymagać ponownego przyłączenia
    en:
      - Machines detached from the company network for many months will fall out of step with the domain sooner and need rejoining
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna z założenia pracuje poza siecią firmową dłużej niż przez trzydzieści dni bez kontaktu z kontrolerem
    en:
      - The machine works outside the company network by design for longer than thirty days without contact with a controller
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it stands for a password that never
      # expires, not for the shortest possible period. Reported apart, so a report
      # cannot read it as the strictest setting in the range.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'MaximumPasswordAge'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_EXPIRY' }
        elseif ([int]$value -le 30) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: WITHIN_LIMIT
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'MaximumPasswordAge'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaximumPasswordAge' -Value 30 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-maximum-machine-account-password-age

notes:
  pl: |
    Reguła rozdziela trzy wyniki zamiast dwóch. Wartość zerowa znaczy „hasło nie
    wygasa" i jest najgorszym możliwym ustawieniem, choć porównanie liczbowe
    uznałoby ją za najmniejszą, czyli najostrzejszą. Reguła zgłasza ją osobno,
    żeby raport nie pokazał maszyny z wiecznym hasłem jako wzorowo ustawionej.

    Naprawa ustawia trzydzieści dni, czyli górną granicę dopuszczalną przez
    benchmark. Krótszy okres jest również poprawny i reguła go nie podważa —
    wybrałem granicę, bo jest to wartość, przy której skutki uboczne dla maszyn
    rzadko widujących sieć firmową są najmniejsze.
  en: |
    The rule separates three results rather than two. A value of zero means "the
    password does not expire" and is the worst possible setting, though a numeric
    comparison would count it the smallest and so the strictest. The rule reports
    it apart, so a report does not show a machine with an everlasting password as
    exemplary.

    The fix sets thirty days, the upper bound the benchmark allows. A shorter
    period is equally correct and the rule does not dispute it - the bound was
    chosen because it is the value at which the side effects for machines that
    rarely see the company network are smallest.
