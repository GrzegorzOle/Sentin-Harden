id: win2025-auto-admin-logon-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Automatyczne logowanie administratora wyłączone
    en: Automatic administrator logon disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania systemowi logować się samoczynnie na wskazane
    konto przy uruchomieniu, bez pytania o hasło.

    Mechanizm ten ma dwie wady i każda z nich wystarcza.

    Pierwsza: hasło konta, na które system loguje się sam, musi być
    gdzieś zapisane, żeby dało się go użyć bez człowieka. Jest zapisane
    w rejestrze, w postaci czytelnej, we wpisie sąsiadującym
    z przełącznikiem. Nie jest to zaszyfrowane, nie jest ukryte i nie
    wymaga łamania — wystarczy odczytać. Kto ma dostęp do maszyny
    z prawami pozwalającymi czytać tę gałąź, ma hasło administratora
    podane wprost.

    Druga: po uruchomieniu maszyny sesja jest już otwarta. Nie ma ekranu
    logowania, nie ma pytania o poświadczenia i nie ma nikogo, kogo
    trzeba by przekonać. Wystarczy zobaczyć ekran.

    Na serwerze druga wada waży więcej niż na stanowisku roboczym, bo
    „zobaczyć ekran" nie oznacza tu obecności w pomieszczeniu. Do
    konsoli serwera prowadzi karta zarządzająca i konsola gospodarza
    wirtualizacji — obie osiągalne po sieci. Serwer logujący się sam na
    konto administratora wystawia więc otwartą sesję administracyjną
    każdemu, kto ma dostęp do sieci zarządzania.

    Trzecia rzecz, osobna od obu powyższych: taka sesja trwa. Serwer
    uruchamia się i zostaje z otwartą sesją na miesiące, bo nikt się
    z niej nie wylogowuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    administratora zapisane czytelnie w rejestrze oraz otwartą sesję
    administracyjną na konsoli, dostępną bez podawania czegokolwiek.
  en: |
    The setting forbids the system to sign itself in to a named account at its starting, without
    asking for a password.

    That mechanism bears two flaws, and each of them suffices.

    The first: the password of the account the system signs in to by itself must be written
    somewhere, so that it may be used without a person. It is written in the registry, in a
    readable form, in an entry neighbouring the switch. It is not encrypted, not hidden and takes
    no breaking - it is enough to read it. Whoever can reach the machine with rights letting them
    read that branch holds the administrator's password given plainly.

    The second: after the machine starts the session is already open. There is no sign-in screen,
    no asking after credentials and nobody to be talked round. It is enough to see the screen.

    On a server the second flaw weighs more than at a working station, "seeing the screen" not
    meaning here being in the room. A management card leads to a server's console, and the
    virtualisation host's console - both reachable over the network. A server signing itself in
    to an administrator's account thus holds out an open administrative session to anyone with
    the way to the management network.

    A third matter, apart from both above: such a session lasts. A server starts and stays with
    an open session for months, nobody signing out of it.

    What an attacker gains while the item goes unmet: an administrator's password written
    readably in the registry, and an open administrative session at the console, to be had
    without giving anything at all.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze nie pracuje
    oprogramowanie, które wymaga otwartej sesji graficznej i które
    postawiono właśnie na tym mechanizmie.

    Na serwerze pozostawionym przy ustawieniach domyślnych zmiana nie
    ma skutku, bo mechanizm jest wyłączony. Niezgodność zawsze oznacza,
    że ktoś włączył to celowo — i właśnie dlatego sprawdzenie jest
    potrzebne, zanim się to cofnie.

    Powód, dla którego to włączano, jest zwykle jeden i warto go nazwać:
    aplikacja przemysłowa, sterownik maszyny albo system pomiarowy,
    który nie umie pracować jako usługa i wymaga zalogowanej sesji
    z widokiem pulpitu. Po zmianie taka aplikacja nie wystartuje po
    restarcie serwera, a objaw pojawi się dopiero przy pierwszym
    ponownym uruchomieniu — czyli wtedy, gdy nikt nie będzie tego
    wiązał ze zmianą sprzed tygodni.

    Przypadkiem drugim jest serwer wystawiający widok na ekran
    w pomieszczeniu technicznym. Tutaj rozwiązaniem nie jest utrzymanie
    logowania samoczynnego, tylko przeniesienie tego widoku na maszynę
    do tego przeznaczoną.

    Przy cofaniu tego mechanizmu usuń również zapisane hasło. Sam
    przełącznik wyłącza logowanie, ale wpis z hasłem zostaje w rejestrze
    i pozostaje czytelny — punkt bez tego kroku jest zamknięty tylko
    w raporcie.

    Zmiana nie dotyczy logowania ludzi ani usług pracujących w tle.
    Usługi startują niezależnie od sesji i po zmianie działają bez
    różnicy.

    Zmiana nie wymaga przerwy i wchodzi w życie przy następnym
    uruchomieniu maszyny.
  en: |
    What needs checking is whether software demanding an open graphical session works on this
    server and was built upon just this mechanism.

    On a server left at the default settings the change has no effect, the mechanism being off.
    Non-compliance always means somebody switched it on knowingly - and for just that reason the
    check is wanted before it is undone.

    The reason it was switched on is usually one and worth naming: an industrial application, a
    machine controller or a measuring system that cannot work as a service and demands a signed-in
    session with a desktop in view. After the change such an application will not start once the
    server restarts, and the symptom will show only at the first fresh start - that is, when
    nobody will tie it to a change made weeks before.

    The second case is a server holding out a view onto a screen in a technical room. Here the
    answer is not the keeping of the automatic sign-in but the moving of that view onto a machine
    meant for it.

    At the undoing of this mechanism clear the written password too. The switch alone stops the
    signing in, but the entry with the password stays in the registry and stays readable - the
    item without that step is shut in the report alone.

    The change does not bear on people's signing in or on services working in the background.
    Services start whatever the session and after the change work with no difference.

    The change takes no break and comes into force at the machine's next starting.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Aplikacja wymagająca zalogowanej sesji graficznej nie wystartuje po ponownym uruchomieniu serwera
      - Objaw pojawi się dopiero przy pierwszym restarcie, czyli długo po samej zmianie
      - Usługi pracujące w tle startują niezależnie od sesji i działają bez różnicy
      - Sam przełącznik nie usuwa zapisanego hasła, więc trzeba je skasować osobno
    en:
      - An application demanding a signed-in graphical session will not start once the server restarts
      - The symptom will show only at the first restart, that is long after the change itself
      - Services working in the background start whatever the session and work with no difference
      - The switch alone does not clear the written password, so it must be cleared apart
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje aplikacja niemogąca działać jako usługa i wymagająca zalogowanej sesji graficznej
      - Nie ustalono, po co logowanie samoczynne zostało na tej maszynie włączone
    en:
      - An application that cannot work as a service and demands a signed-in graphical session works on the server
      - It was never settled what the automatic sign-in was switched on for on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $current = (Get-ItemProperty -Path $path -Name 'AutoAdminLogon' -ErrorAction SilentlyContinue).AutoAdminLogon
      # Absence is equivalent to the mechanism being off, and that is what the
      # report says - the machine is described, not the registry.
      if ($null -eq $current) { '0' }
      else { ([string]$current).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'AutoAdminLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the switch is written here. The stored password sits in a
    # neighbouring entry and is left alone on purpose: clearing it is a
    # separate decision, and a backup of this rule does not hold it.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    Set-ItemProperty -Path $path -Name 'AutoAdminLogon' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/user-profiles-and-logon/turn-on-automatic-logon

notes:
  pl: |
    Brak wpisu jest równoznaczny z wyłączonym mechanizmem i tak jest
    raportowany. Opisujemy maszynę, a nie rejestr.

    Naprawa ustawia wyłącznie przełącznik. Zapisane hasło leży we wpisie
    sąsiednim i zostaje nietknięte świadomie — jego skasowanie jest
    osobną decyzją, a kopia zapasowa tej reguły go nie obejmuje.
    Bez tego kroku punkt jest zamknięty tylko w raporcie.

    Na serwerze waży przede wszystkim otwarta sesja na konsoli, bo do
    konsoli prowadzi karta zarządzająca osiągalna po sieci. To nie jest
    ten sam przypadek co komputer w zamkniętym pokoju.
  en: |
    A want of the entry amounts to the mechanism being off, and so it is reported. We set down
    the machine and not the registry.

    The mending writes the switch alone. The written password lies in a neighbouring entry and is
    left untouched knowingly - its clearing is a decision of its own, and this rule's backup does
    not take it in. Without that step the item is shut in the report alone.

    On a server what weighs above all is the open session at the console, a management card
    reachable over the network leading to that console. It is not the same case as a computer in
    a locked room.
