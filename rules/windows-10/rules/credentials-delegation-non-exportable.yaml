id: win10-credentials-delegation-non-exportable

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Credentials Delegation
  title:
    pl: Delegowanie poświadczeń w postaci uniemożliwiającej ich wyniesienie
    en: Credentials delegated in a form that cannot be carried away
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że przy łączeniu się z pulpitem zdalnym maszyna
    przekazuje poświadczenia w postaci, której z maszyny docelowej nie da
    się wynieść.

    Połączenie zdalne wymaga przedstawienia poświadczeń po drugiej stronie.
    W trybie zwykłym trafiają one do pamięci maszyny docelowej i tam
    pozostają na czas sesji. Jeśli maszyna docelowa jest już opanowana,
    poświadczenia osoby łączącej się zostają zebrane — a bywa to konto
    o uprawnieniach wyższych niż te, które napastnik już miał.

    Tryb chroniony odwraca kierunek zaufania. Poświadczenia zostają po
    stronie łączącej się, a maszyna docelowa dostaje wyłącznie odpowiedzi
    na pytania uwierzytelniające. Zbierać nie ma czego.

    Odnotowuję, kogo ta reguła chroni: nie tę maszynę, tylko osobę, która
    się z niej łączy. Jest to zabezpieczenie działające na zewnątrz i warto,
    żeby aplikacja to nazwała.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poświadczenia
    osób łączących się z opanowanej maszyny zdalnej, zebrane z jej pamięci.
  en: |
    The setting makes the machine, in joining a remote desktop, pass its credentials in a form that cannot be
    carried away from the machine at the far end.

    A remote connection calls for credentials to be presented on the other side. In the ordinary mode they go
    into the far machine's memory and stay there for the session. Where the far machine is already in somebody's
    hands, the joining person's credentials are gathered - and that is at times an account of higher rights than
    the attacker already held.

    The guarded mode turns the direction of trust about. The credentials stay on the joining side, and the far
    machine gets only the answers to the authenticating questions. There is nothing to gather.

    I set down whom this rule guards: not this machine but the person joining from it. It is a safeguard working
    outwardly, and it is well that the application name that.

    What an attacker gains while the item goes unmet: the credentials of people joining from a remote machine in
    their hands, gathered out of its memory.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Tryb chroniony jest obsługiwany przez wszystkie wspierane wersje po obu
    stronach połączenia i przy nich nie widać żadnej różnicy.

    Ograniczenie, które trzeba znać: w trybie chronionym nie da się
    przekazać poświadczeń dalej, na maszynę trzecią. Jeśli ktoś łączy się
    przez maszynę pośrednią do kolejnej, drugi krok poprosi o hasło jeszcze
    raz zamiast skorzystać z przekazanych. Nie jest to awaria, tylko
    czynność dodatkowa.

    Na maszynie niełączącej się nigdzie zdalnie zmiana nie robi nic.

    Nie ma znanych regresji dla pracy codziennej.

    Czego to nie psuje: łączenia się z pulpitem zdalnym, logowania, kont
    domenowych, udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The guarded mode is served by every supported version on both sides of a connection, and beside them no
    difference is seen.

    The bound to be known: in the guarded mode credentials cannot be passed on further, to a third machine.
    Where somebody joins through a middle machine to another, the second step will ask for a password again
    instead of using what was passed. It is not a fault but an act the more.

    Upon a machine joining nothing remotely the change does nothing.

    There are no known regressions for everyday work.

    What this does not break: the joining of a remote desktop, logging on, domain accounts, file shares,
    printing, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Połączenie przez maszynę pośrednią do kolejnej poprosi o hasło drugi raz zamiast skorzystać z przekazanych poświadczeń
      - Nie jest to awaria, tylko czynność dodatkowa dla osoby pracującej przez maszynę pośrednią
      - Na maszynie niełączącej się nigdzie zdalnie zmiana nie robi nic
      - Łączenie się z pulpitem zdalnym działa dalej dokładnie tak jak dotąd
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A connection through a middle machine to another will ask for a password a second time instead of using what was passed
      - It is not a fault but an act the more for a person working through a middle machine
      - Upon a machine joining nothing remotely the change does nothing
      - The joining of a remote desktop works on exactly as before
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Praca opiera się na łączeniu przez maszynę pośrednią do kolejnej i drugie pytanie o hasło jest nie do przyjęcia
    en:
      - The work rests upon joining through a middle machine to another and a second question about a password is not to be borne
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
      $name = 'AllowProtectedCreds'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    $name = 'AllowProtectedCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The guard works outwardly - it protects the person joining from this machine,
    # not the machine itself. Passing credentials on to a third machine ceases; the
    # second step asks for a password again.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowProtectedCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/remote-credential-guard

notes:
  pl: |
    Reguła jest w tym bloku jedyną, która chroni kogoś innego niż tę
    maszynę. Warto, żeby aplikacja to powiedziała wprost, bo użytkownik
    oceniający zysk po skutkach dla siebie uzna ją za bezwartościową.

    Argument wart zachowania dotyczy kierunku zaufania. W trybie zwykłym
    osoba łącząca się ufa maszynie docelowej na tyle, żeby oddać jej
    poświadczenia. Tryb chroniony tego zaufania nie wymaga — a przy
    łączeniu się z maszyną, co do której nie ma się pewności, jest to
    dokładnie ta różnica, o którą chodzi.

    Odnotowuję ograniczenie z przekazywaniem dalej, bo jest to jedyny
    realny koszt tej reguły i lepiej, żeby użytkownik dowiedział się o nim
    z opisu niż z drugiego pytania o hasło.
  en: |
    The rule is the only one in this block that guards somebody other than this machine. It is well that the
    application say so outright, a user weighing the gain by its consequences to themselves holding it
    worthless.

    The argument worth keeping touches the direction of trust. In the ordinary mode the joining person trusts
    the far machine enough to give it their credentials. The guarded mode asks for no such trust - and in
    joining a machine one is not sure of, that is exactly the difference at issue.

    I set down the bound upon passing credentials on further, that being this rule's one real cost, and it is
    better the user learn of it from the description than from a second question about a password.
