id: win2016-bitlocker-os-drive

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Szyfrowanie dysku systemowego włączone
    en: System drive encryption enabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy dysk systemowy jest zaszyfrowany i czy ochrona
    jest włączona, a nie jedynie skonfigurowana.

    Zagrożenie, przed którym to broni, nie wymaga żadnej wiedzy
    technicznej. Dysk wyjęty z maszyny i podłączony do innej jest zwykłym
    nośnikiem. Uprawnienia zapisane w systemie plików obowiązują tylko
    ten system, który je egzekwuje; w drugiej maszynie egzekwuje je
    tamtejszy system, a ten o nich nie wie.

    Oznacza to, że cała kontrola dostępu na maszynie niezaszyfrowanej
    opiera się na założeniu, że nikt nie wyjmie dysku. Założenie to
    trzyma się w serwerowni z kontrolą wejścia, a przestaje się trzymać
    przy przenosinach, przy wysyłce sprzętu do naprawy i przy wycofaniu
    maszyny z użycia.

    Szyfrowanie usuwa to założenie. Dysk poza maszyną, w której został
    zaszyfrowany, jest ciągiem znaków bez znaczenia.

    Rozróżnienie między stanem ochrony a stanem szyfrowania jest tu
    istotne i audyt sprawdza pierwszy. Dysk potrafi być zaszyfrowany
    przy ochronie wstrzymanej — stan ten zostawia klucz dostępny i bywa
    włączany na czas aktualizacji oprogramowania układowego. Wstrzymanie,
    o którym zapomniano wyłączyć, jest szyfrowaniem, które nie chroni.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełny
    dostęp do wszystkich danych maszyny po wyjęciu dysku, bez potrzeby
    łamania czegokolwiek.
  en: |
    The item checks whether the system drive is encrypted and whether the protection is
    switched on rather than merely set up.

    The threat this guards against calls for no technical knowledge at all. A drive taken
    out of a machine and plugged into another is an ordinary medium. The rights written
    into the file system hold only for the system that enforces them; in the second machine
    they are enforced by that machine's system, and it knows nothing of them.

    That means the whole of access control on an unencrypted machine rests on an assumption
    that nobody will take the drive out. That assumption holds in a server room with
    controlled entry and ceases to hold at a move, at a sending of hardware for repair and
    at a machine's withdrawal from use.

    Encryption takes that assumption away. A drive outside the machine in which it was
    encrypted is a string of characters without meaning.

    The distinction between the state of protection and the state of encryption matters here
    and the audit checks the first. A drive can be encrypted with the protection suspended -
    a state that leaves the key to be had and is at times switched on for the length of a
    firmware update. A suspension somebody forgot to switch off is an encryption that does
    not guard.

    What an attacker gains while the item goes unmet: full access to all the machine's data
    once the drive is taken out, with no need to break anything.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powodów jest kilka i każdy
    osobno wystarcza.

    Pierwszy dotyczy klucza odzyskiwania. Zaszyfrowanie dysku bez
    zapisania tego klucza poza maszyną kończy się w chwili pierwszego
    kłopotu utratą całej zawartości. Nie ma drogi obejścia, nie ma
    wsparcia producenta, nie ma niczego — dane są nieczytelne i pozostaną
    takie. Klucz trzeba zapisać gdzie indziej i odczytać stamtąd
    z powrotem, żeby wiedzieć, że jest czytelny.

    Drugi dotyczy pierwszego szyfrowania. Przejście przez cały wolumin
    obciąża podsystem dyskowy na godziny, a na macierzy z dyskami
    obrotowymi na dłużej. Przerwanie tego procesu przez restart albo
    zanik zasilania zostawia wolumin w stanie pośrednim.

    Trzeci dotyczy tego, co po wdrożeniu przestaje być rutyną.
    Aktualizacja oprogramowania układowego, wymiana płyty głównej
    i przeniesienie dysku do innej maszyny wymagają odtąd wstrzymania
    ochrony albo klucza odzyskiwania. Czynności te nie stają się
    niemożliwe, ale przestają być czynnościami, które da się wykonać bez
    przygotowania.

    Czwarty dotyczy serwera bez układu zabezpieczającego. Bez niego nie
    ma gdzie trzymać klucza i szyfrowanie wymaga nośnika albo kodu przy
    każdym starcie — a to jest decyzja opisana w regule o dodatkowym
    uwierzytelnieniu, nie w tej.

    Czego to nie psuje: pracy systemu po starcie, wydajności po
    zakończeniu pierwszego szyfrowania, usług, sieci, aplikacji.

    Wymaga restartu; cofnięcie bywa trudne.
  en: |
    The class is "needs a planned rollout", and the reasons are several and each of them
    enough by itself.

    The first concerns the recovery key. Encrypting the drive without that key being written
    down away from the machine ends at the first trouble in the loss of the whole contents.
    There is no road round it, no support from the maker, nothing - the data cannot be read
    and will stay so. The key has to be written elsewhere and read back from there, so as to
    know it can be read.

    The second concerns the first encryption. Going through the whole volume loads the disk
    subsystem for hours, and on an array of spinning disks for longer. Breaking that process
    off by a restart or a loss of power leaves the volume in a middle state.

    The third concerns what after the rollout ceases to be routine. An update of the
    firmware, an exchange of the mainboard and a move of the drive to another machine call
    from then on for the protection to be suspended or for the recovery key. Those acts do
    not become impossible, but they cease to be acts that can be carried out unprepared.

    The fourth concerns a server without a security chip. Without one there is nowhere to
    keep the key and encryption calls for a medium or a code at every start - and that is a
    decision described at the rule about additional authentication, not at this one.

    What this does not break: the system's working after the start, performance once the
    first encryption is done, services, the network, or applications.

    Calls for a restart; the undoing is at times hard.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - updates-and-servicing
    - drivers-and-devices
  what_breaks:
    pl:
      - Brak klucza odzyskiwania zapisanego poza maszyną oznacza utratę całej zawartości dysku przy pierwszym kłopocie
      - Pierwsze szyfrowanie obciąża podsystem dyskowy na godziny, a przerwanie go zostawia wolumin w stanie pośrednim
      - Aktualizacja oprogramowania układowego i wymiana płyty głównej wymagają odtąd wstrzymania ochrony albo klucza odzyskiwania
      - Przeniesienie dysku do innej maszyny przestaje być czynnością, którą da się wykonać bez przygotowania
      - Praca systemu po starcie, usługi, sieć i aplikacje pozostają bez zmian
    en:
      - A recovery key not written down away from the machine means the loss of the drive's whole contents at the first trouble
      - The first encryption loads the disk subsystem for hours, and breaking it off leaves the volume in a middle state
      - An update of the firmware and an exchange of the mainboard call from then on for the protection to be suspended or for the recovery key
      - Moving the drive to another machine ceases to be an act that can be carried out unprepared
      - The system's working after the start, services, the network and applications stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ma zapisanego poza maszyną i odczytanego stamtąd klucza odzyskiwania
      - Nie ma okna, w którym pierwsze szyfrowanie da się przeprowadzić bez ryzyka przerwania
      - Maszyna nie ma układu zabezpieczającego, a decyzja o nośniku lub kodzie przy każdym starcie nie została podjęta
    en:
      - There is no recovery key written down away from the machine and read back from there
      - There is no window in which the first encryption can be run without risk of interruption
      - The machine has no security chip and no decision about a medium or a code at every start has been taken
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $volume = Get-BitLockerVolume -MountPoint $env:SystemDrive -ErrorAction Stop
      if ($null -eq $volume) { 'CHECK_ERROR' } else { [string]$volume.ProtectionStatus }
    } catch {
      # Reading BitLocker state needs elevation, and the feature is absent from
      # some installations. Neither case may be reported as an encrypted drive.
      'CHECK_ERROR'
    }
  expected: 'On'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $volume = Get-BitLockerVolume -MountPoint $env:SystemDrive
    [pscustomobject]@{
      mount_point       = $volume.MountPoint
      protection_status = [string]$volume.ProtectionStatus
      volume_status     = [string]$volume.VolumeStatus
      key_protectors    = @($volume.KeyProtector | ForEach-Object { [string]$_.KeyProtectorType })
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Store the recovery key somewhere off this machine BEFORE going further,
    # and read it back to confirm it is readable. On a server the console that
    # asks for it is remote, and nobody can open a drawer at three in the
    # morning. Run this in a window: the first encryption of a large volume
    # loads the disk subsystem and must not be interrupted.
    $drive = $env:SystemDrive
    Add-BitLockerKeyProtector -MountPoint $drive -RecoveryPasswordProtector
    (Get-BitLockerVolume -MountPoint $drive).KeyProtector |
      Where-Object { $_.KeyProtectorType -eq 'RecoveryPassword' } |
      Select-Object -Property KeyProtectorId, RecoveryPassword |
      Format-List
    Enable-BitLocker -MountPoint $drive -TpmProtector -SkipHardwareTest

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest w bloku ostatni w kolejności pokazywania, a pierwszy
    w kolejności wykonania — i ta rozbieżność jest celowa. Pięć
    poprzednich reguł opisuje, jak dysk systemowy ma być chroniony; ta
    opisuje, czy w ogóle jest.

    Nie ma tu przycisku uruchomienia, choć polecenie istnieje. Powód nie
    jest formalny: nie da się zapisać kopii zapasowej stanu sprzed
    zaszyfrowania dysku, bo tym stanem jest cały dysk. Polecenie zostaje
    do skopiowania, a decyzję o jego wykonaniu podejmuje człowiek mający
    przed sobą klucz odzyskiwania i okno serwisowe.

    Klucz odzyskiwania jest tu jedyną rzeczą, która naprawdę ma znaczenie,
    i warto, żeby aplikacja postawiła to pytanie jako pierwsze — przed
    poleceniem, przed opisem skutków, przed czymkolwiek innym. Wdrożenie
    tego punktu bez klucza zapisanego gdzie indziej nie jest ryzykiem;
    jest pomyłką, której skutkiem bywa utrata wszystkiego.

    Odnotowuję jeszcze rozróżnienie, które audyt tu robi. Sprawdzany jest
    stan ochrony, nie stan szyfrowania. Dysk zaszyfrowany z ochroną
    wstrzymaną zgłosi niezgodność i jest to zachowanie właściwe, bo
    wstrzymanie zostawia klucz dostępny. Opis powinien to tłumaczyć, bo
    inaczej wynik wygląda na błąd narzędzia.
  en: |
    The item is the last in the block in the order of showing and the first in the order of
    doing - and that divergence is on purpose. The five rules before it describe how the
    system drive is to be guarded; this one describes whether it is at all.

    There is no run button here, though a command exists. The reason is no formality: the
    state before the drive is encrypted cannot be backed up, that state being the whole
    drive. The command stays to be copied, and the decision to carry it out is taken by a
    person with the recovery key before them and a service window.

    The recovery key is here the one thing that really matters, and it is well that the
    application put that question first - before the command, before the description of
    consequences, before anything else. Rolling this item out without a key written
    elsewhere is no risk; it is a mistake whose upshot is at times the loss of everything.

    Worth noting too the distinction the audit makes here. What is checked is the state of
    protection, not the state of encryption. A drive encrypted with the protection suspended
    will report non-compliance and that is the right behaviour, a suspension leaving the key
    to be had. The description should explain it, else the outcome looks like a fault in the
    tool.
