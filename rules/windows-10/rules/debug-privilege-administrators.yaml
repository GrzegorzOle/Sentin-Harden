id: win10-debug-privilege-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Debugowanie programów tylko dla administratorów
    en: Debugging programs restricted to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo do debugowania programów do administratorów
    lokalnych.

    Nazwa jest myląca i warto to powiedzieć od razu. Prawo to nie służy
    dzisiaj do pracy z programem uruchomionym pod debuggerem — służy do
    otwierania pamięci cudzych procesów, w tym procesów systemowych,
    i czytania jej.

    W pamięci procesów odpowiadających za uwierzytelnianie leżą
    poświadczenia zalogowanych osób: skróty haseł, bilety i tokeny sesji.
    Narzędzia zbierające je z maszyny opierają się właśnie na tym prawie
    i jest to pierwsza rzecz, po którą sięgają po uzyskaniu dostępu.

    Ograniczenie prawa do administratorów nie broni więc przed
    administratorem — broni przed wszystkimi pozostałymi. Konto usługowe,
    konto operatora kopii zapasowych ani konto z jednym nadanym
    uprawnieniem nie dostanie dostępu do pamięci procesów.

    Odnotowuję, że sprawdzenie przyjmuje wykaz węższy niż wymagany, łącznie
    z pustym. Maszyna ustawiona ostrzej nie jest niezgodna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    poświadczeń wszystkich zalogowanych osób prosto z pamięci.
  en: |
    The setting bounds the right of debugging programs to the local administrators.

    The name misleads, and it is worth saying so at once. That right serves today not for work with a program run
    under a debugger - it serves for the opening of other processes' memory, the system's among them, and the
    reading of it.

    In the memory of the processes answering for authentication lie the credentials of those signed in: the
    digests of passwords, tickets and tokens of sessions. The tools that gather them off a machine rest upon just
    this right, and it is the first thing they reach for once a way in has been had.

    The bounding of the right to administrators therefore guards against no administrator - it guards against all
    the rest. A service account, an account of a backup operator or an account with one right granted will not get
    a way into processes' memory.

    I set down that the check takes a list narrower than the one called for, an empty one among them. A machine
    set the stricter is not out of compliance.

    What an attacker gains while the item goes unmet: a way to the credentials of everybody signed in, straight
    out of memory.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na maszynie roboczej wykaz zawiera już zwykle samych administratorów,
    bo jest to wartość domyślna. Zmiana utrwala wtedy stan zastany.

    Miejscem, w którym warto spojrzeć, jest maszyna deweloperska.
    Narzędzia do diagnozowania programów, profilery i zrzuty pamięci
    działają przez to prawo — ale uruchamiane z podniesionymi
    uprawnieniami działają dalej, bo administratorzy je zachowują.
    Przestaje działać wyłącznie diagnozowanie cudzych procesów z konta
    bez uprawnień administracyjnych.

    Odnotowuję drugie miejsce: oprogramowanie monitorujące, które czyta
    stan innych procesów. Część agentów wymaga tego prawa dla własnego
    konta usługowego. Warto przeczytać wykaz przed zmianą, bo to właśnie
    tam takie konto by stało.

    Skutek pojawia się natychmiast, bez restartu i bez wylogowania.

    Czego to nie psuje: uruchamiania programów, logowania, dostępu do
    plików, wydajności, drukowania.
  en: |
    The class is "no disruption".

    Upon a working machine the list already holds the administrators alone, that being the default value. The
    change then sets down what was found.

    The place worth looking at is a machine of development. Tools for the diagnosing of programs, profilers and
    dumps of memory work by this right - but run with raised rights they work on, the administrators keeping it.
    What ceases to work is the diagnosing of other processes from an account without administrative rights alone.

    I set down a second place: software of watching that reads the state of other processes. Some agents call for
    this right for a service account of their own. It is worth reading the list before the change, such an account
    standing just there if anywhere.

    The consequence shows at once, with no restart and no signing out.

    What this does not break: the running of programs, logging on, the way to files, speed, or printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - Diagnozowanie cudzych procesów z konta bez uprawnień administracyjnych przestaje działać
      - Agent monitorujący, któremu nadano to prawo dla własnego konta usługowego, straci dostęp do pamięci procesów
      - Narzędzia uruchamiane z podniesionymi uprawnieniami działają dalej, bo administratorzy prawo zachowują
      - Sprawdzenie przyjmuje wykaz węższy niż wymagany, więc maszyna ustawiona ostrzej nie jest niezgodna
      - Uruchamianie programów, logowanie, dostęp do plików, wydajność i drukowanie pozostają bez zmian
    en:
      - The diagnosing of other processes from an account without administrative rights ceases to work
      - An agent of watching granted this right for a service account of its own will lose the way into processes memory
      - Tools run with raised rights work on, the administrators keeping the right
      - The check takes a list narrower than the one called for, so a machine set the stricter is not out of compliance
      - The running of programs, logging on, the way to files, speed and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje agent monitorujący, którego konto usługowe wymaga tego prawa do odczytu stanu procesów
    en:
      - Upon the machine works an agent of watching whose service account calls for this right to read processes state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDebugPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDebugPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDebugPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeDebugPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDebugPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/debug-programs

notes:
  pl: |
    Reguła jest w tym bloku najczęściej wykorzystywana w praktyce
    i warto, żeby aplikacja to powiedziała. Pozostałe punkty zamykają drogi
    teoretyczne albo rzadkie; ta zamyka pierwszy krok, który wykonuje
    większość narzędzi po dostaniu się na maszynę.

    Argument wart postawienia wprost dotyczy mylącej nazwy. Czytelnik
    raportu zobaczy „debugowanie programów" i uzna, że rzecz dotyczy
    programistów. Dotyczy odczytywania pamięci cudzych procesów, w tym
    tych, które przechowują poświadczenia — i wartość punktu leży wyłącznie
    w tym drugim znaczeniu.

    Odnotowuję, że reguła nie ogranicza administratora, bo bywa to
    stawiane jako zarzut. Administrator lokalny i tak może nadać sobie to
    prawo z powrotem. Wartość polega na tym, że wszyscy pozostali muszą
    najpierw zostać administratorem — czyli na dołożeniu kroku, który
    widać w dzienniku.
  en: |
    The rule is of this block the most used in practice, and it is well that the application say so. The other
    items shut roads theoretical or rare; this shuts the first step most tools take once they have got onto a
    machine.

    The argument worth putting outright touches the misleading name. Whoever reads the report will see "debugging
    programs" and hold the matter to touch programmers. It touches the reading of other processes' memory, of
    those that keep credentials among them - and the item's worth lies in that second meaning alone.

    I set down that the rule does not bound an administrator, that being at times put as a charge against it. A
    local administrator may grant themselves the right back anyway. The worth lies in this, that all the rest have
    first to become an administrator - which is to say in the adding of a step that shows in the log.
