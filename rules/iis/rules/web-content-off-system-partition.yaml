id: iis-web-content-off-system-partition

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Basic Configurations
  title:
    pl: Zawartość serwisów poza partycją systemową
    en: Site contents off the system partition

  level: 1
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Domyślnie zawartość serwisu leży w katalogu na tym samym dysku, na którym
    zainstalowany jest system. Oddzielenie jej na inną partycję jest jedną
    z tych zmian, które nie zamykają żadnej konkretnej luki, tylko ograniczają
    skutki, gdy coś już pójdzie źle.

    Co to odbiera atakującemu: skrót z katalogu serwisu do plików systemu.
    Podatność pozwalająca wyjść poza katalog i wskazać ścieżkę o poziom wyżej
    prowadzi na tej samej partycji prosto do katalogów systemowych — do
    plików konfiguracyjnych, do kont, do rejestru na dysku. Na osobnej
    partycji ta sama podatność prowadzi najwyżej do korzenia dysku z danymi,
    gdzie nie ma czego zabrać.

    Drugi skutek jest eksploatacyjny i równie ważny: dziennik albo wgrany plik,
    który wypełni dysk, unieruchamia wtedy serwis, a nie cały system. Windows
    z zapełnioną partycją systemową przestaje się logować, zapisywać zdarzenia
    i aktualizować — awaria serwisu zamienia się w awarię maszyny.
  en: |
    By default a site's contents lie in a directory on the same disk the system is
    installed on. Separating them onto another partition is one of those changes
    that close no particular flaw and only limit the consequences once something
    has already gone wrong.

    What it takes away from an attacker - a shortcut from the site directory to the
    system's files. A vulnerability allowing an escape from the directory and a
    path one level up leads, on the same partition, straight into the system
    directories - to configuration files, to accounts, to the registry on disk. On a
    separate partition the same vulnerability leads at worst to the root of a data
    disk, where there is nothing to take.

    The second effect is operational and just as important - a log or an uploaded
    file filling the disk then disables the site rather than the whole system.
    Windows with a full system partition stops signing people in, recording events
    and updating; a site failure turns into a machine failure.

disruption_description:
  pl: |
    To jest przeniesienie plików, więc z natury wymaga okna serwisowego
    i przygotowania. Sama zmiana ścieżki w konfiguracji trwa sekundę —
    problemem jest wszystko wokół niej.

    Kolejność ma znaczenie i błąd w niej kosztuje: najpierw skopiowanie
    zawartości razem z uprawnieniami, potem sprawdzenie, że skopiowała się
    w całości, dopiero potem przestawienie ścieżki, a usunięcie starego
    katalogu na końcu i nie tego samego dnia. Kopiowanie bez zachowania
    uprawnień jest najczęstszą pomyłką — pliki trafiają na miejsce, a serwis
    zwraca odmowę dostępu, bo konto puli aplikacji straciło prawa, które miało
    w starej lokalizacji.

    Rzeczy, które lubią zostać w tyle: ścieżki zapisane na sztywno w kodzie
    i w plikach konfiguracyjnych aplikacji, katalogi wirtualne wskazujące
    poza katalog serwisu, zadania zaplanowane operujące na starej ścieżce,
    kopie zapasowe wskazujące stare miejsce oraz wykluczenia w programie
    antywirusowym, które po przeniesieniu przestają cokolwiek wykluczać.

    Dlatego reguła niczego nie przenosi sama. Aplikacja nie wie, który dysk
    jest przeznaczony na dane, ile tam miejsca ani co jeszcze wskazuje na
    starą ścieżkę.
  en: |
    This is a move of files, so by its nature it calls for a service window and
    preparation. Changing the path in the configuration itself takes a second - the
    problem is everything around it.

    The order matters and a mistake in it costs - first copying the contents along
    with their permissions, then checking that they copied in full, only then
    switching the path over, and removing the old directory last and not on the
    same day. Copying without preserving permissions is the commonest mistake; the
    files arrive in place and the site returns access denied, because the
    application pool account lost rights it had in the old location.

    Things that like to be left behind - paths recorded in code and in the
    application's own configuration files, virtual directories pointing outside the
    site directory, scheduled jobs working on the old path, backups pointing at the
    old place, and exclusions in the antivirus program which after the move exclude
    nothing at all.

    This is why the rule moves nothing by itself. The application does not know
    which disk is meant for data, how much room is there, or what else still points
    at the old path.

implementation_consequences:
  impact_areas:
    - web-server-services
    - file-sharing
    - logging-and-audit
  what_breaks:
    pl:
      - Skopiowanie plików bez zachowania uprawnień kończy się odmową dostępu przy pierwszym żądaniu, mimo że pliki są na miejscu
      - Ścieżki zapisane na sztywno w kodzie aplikacji i w jej plikach konfiguracyjnych wskazują po przeniesieniu w pustkę
      - Katalogi wirtualne i zadania zaplanowane operujące na starej ścieżce przestają działać
      - Wykluczenia w programie antywirusowym przestają obejmować katalog serwisu, co potrafi spowolnić serwer albo zablokować pliki
      - Kopie zapasowe wskazujące starą lokalizację zaczynają zabezpieczać katalog, którego już się nie używa
      - Serwis jest niedostępny na czas przełączenia ścieżki
    en:
      - Copying the files without preserving permissions ends in access denied at the first request, although the files are in place
      - Paths recorded in the application code and its own configuration files point into nothing after the move
      - Virtual directories and scheduled jobs working on the old path stop working
      - Antivirus exclusions stop covering the site directory, which can slow the server down or lock files
      - Backups pointing at the old location start securing a directory no longer in use
      - The site is unavailable for the time the path is switched over
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny z jednym dyskiem, na których osobna partycja oznaczałaby podział istniejącego wolumenu
      - Serwery, na których zawartość serwisu leży na udziale sieciowym, bo wtedy problem wygląda inaczej
      - Środowiska bez ustalonego miejsca na dane, dopóki nie wiadomo, gdzie zawartość ma docelowo leżeć
    en:
      - Machines with a single disk, where a separate partition would mean splitting an existing volume
      - Servers where the site contents lie on a network share, since the problem looks different there
      - Environments with no settled place for data, until it is known where the contents are ultimately to live
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $sites = @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction Stop)
          if ($sites.Count -eq 0) { 'NO_SITES' }
          else {
            # The system drive is read from the environment rather than assumed
            # to be C. A machine installed on another letter is rare but real,
            # and the whole check would be wrong on it.
            $system = ([string]$env:SystemDrive).TrimEnd('\').ToUpperInvariant()
            $on_system = @()
            $unreadable = @()
            foreach ($site in $sites) {
              $path = [string]$site.physicalPath
              if ([string]::IsNullOrWhiteSpace($path)) { $unreadable += $site.Name; continue }
              # The recorded path may hold environment variables, so it is
              # expanded before the drive letter is taken from it.
              $path = [Environment]::ExpandEnvironmentVariables($path)
              # A path on a network share has no drive letter to compare. It is
              # a different arrangement, not a fault, and is named separately
              # rather than counted as either answer.
              if ($path.StartsWith('\\')) { $unreadable += ($site.Name + ':share'); continue }
              $root = ''
              if ($path.Length -ge 2 -and $path[1] -eq ':') { $root = $path.Substring(0, 2).ToUpperInvariant() }
              if ($root -eq '') { $unreadable += ($site.Name + ':unreadable') }
              elseif ($root -eq $system) { $on_system += ($site.Name + ':' + $root) }
            }
            if ($unreadable.Count -gt 0) { 'UNDETERMINED ' + ($unreadable -join ',') }
            elseif ($on_system.Count -eq 0) { 'AS_REQUIRED' }
            else { 'ON_SYSTEM ' + ($on_system -join ',') }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(AS_REQUIRED|NO_SITES)$'
  comparison: regex

remediation:
  shell: powershell
  change_command: |
    # Prepared for copying, not for running. Where the contents are to live is
    # not something the configuration knows, and the move has to be done in this
    # order - the path is switched only once the copy has been checked.
    Import-Module WebAdministration -ErrorAction Stop

    $site = 'Default Web Site'
    $target = 'D:\inetpub\wwwroot'

    $source = (Get-Item ('IIS:\Sites\' + $site)).physicalPath
    $source = [Environment]::ExpandEnvironmentVariables($source)

    # /COPYALL carries the permissions across. Without it the files arrive and
    # the site answers access denied - the commonest way this move goes wrong.
    robocopy $source $target /MIR /COPYALL /R:1 /W:1

    # Anything below 8 from this tool means the copy succeeded; 8 and above
    # means files were left behind, and then nothing may be switched over.
    if ($LASTEXITCODE -ge 8) {
      throw 'The copy did not complete, so the path was not changed.'
    }

    Set-ItemProperty -Path ('IIS:\Sites\' + $site) -Name 'physicalPath' -Value $target

    # The old directory stays where it is on purpose. Remove it after a few days
    # of the site running from the new place, not now.

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/sites/site/application/virtualdirectory
  - https://learn.microsoft.com/windows-server/administration/windows-commands/robocopy

notes:
  pl: |
    Reguła jest wyłącznie do skopiowania. Przeniesienie zawartości to operacja
    na plikach, której nie da się cofnąć jednym poleceniem, a aplikacja nie wie
    ani który dysk jest przeznaczony na dane, ani ile tam miejsca, ani co jeszcze
    wskazuje na starą ścieżkę. Zasada mówiąca, że bez kopii i procedury wycofania
    nie ma przycisku uruchomienia, obowiązuje tu wprost.

    Sprawdzenie rozróżnia trzy rzeczy: zawartość poza partycją systemową,
    zawartość na niej oraz przypadki, w których nie da się tego rozstrzygnąć —
    ścieżkę na udziale sieciowym albo zapisaną w postaci, z której nie wynika
    litera dysku. Ten trzeci stan nie jest zgłaszany jako spełnienie, bo cisza
    czytana jako gwarancja byłaby tu najgorszą możliwą odpowiedzią.

    Litera dysku systemowego jest odczytywana ze środowiska, a nie zakładana.
    Maszyna zainstalowana pod inną literą jest rzadka, ale na niej całe to
    sprawdzenie dawałoby wynik odwrotny do prawdy.
  en: |
    The rule is for copying only. Moving the contents is an operation on files that
    cannot be undone by a single command, and the application knows neither which
    disk is meant for data, nor how much room is there, nor what else still points
    at the old path. The principle that without a backup and an undo procedure
    there is no Run button applies here directly.

    The check distinguishes three things - contents off the system partition,
    contents on it, and cases where the matter cannot be settled: a path on a
    network share or one recorded in a form from which no drive letter follows.
    That third state is not reported as met, because silence read as a guarantee
    would be the worst possible answer here.

    The system drive letter is read from the environment rather than assumed. A
    machine installed under another letter is rare, but on it this whole check
    would give the opposite of the truth.
