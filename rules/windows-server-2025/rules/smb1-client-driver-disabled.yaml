id: win2025-smb1-client-driver-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Sterownik klienta SMB w wersji pierwszej wyłączony
    en: The first-version SMB client driver switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zatrzymuje sterownik obsługujący pierwszą wersję
    protokołu udostępniania plików po stronie klienta, czyli wtedy, gdy
    to ta maszyna sięga do cudzych zasobów.

    Strona kliencka wygląda na mniej ważną i bywa odkładana. Jest to
    błąd, bo napastnik nie potrzebuje wcale, żeby serwer wystawiał stary
    protokół — wystarczy mu, żeby maszyna zgodziła się nim mówić.

    Mechanizm jest prosty i wykorzystywany od lat. Napastnik nakłania
    maszynę do sięgnięcia po zasób sieciowy: wystarczy do tego odwołanie
    w dokumencie, skrót, ścieżka w pliku konfiguracyjnym albo odpowiedź
    na zapytanie o nazwę, której nikt nie zweryfikował. Maszyna łączy
    się z podstawionym serwerem, uzgadnia z nim pierwszą wersję
    protokołu i przekazuje mu to, czym dysponuje: poświadczenie konta,
    na którym pracuje.

    Na serwerze poświadczenie to jest właśnie tym, co czyni ten punkt
    krytycznym. Konto usługi albo konto zadania harmonogramu bywa kontem
    o szerokich uprawnieniach w domenie, a przekazanie go odbywa się bez
    udziału człowieka — nie ma komu się rozmyślić.

    Punkt ten uzupełnia wyłączenie strony serwerowej i usunięcie całego
    składnika. Wszystkie trzy opisują ten sam protokół, ale zamykają
    różne drogi: tę, którą ktoś przychodzi, tę, którą maszyna wychodzi,
    i tę, która usuwa oba kierunki naraz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość skłonienia serwera do połączenia się z podstawionym
    zasobem i odebrania poświadczenia konta, na którym ten serwer
    pracuje.
  en: |
    The setting halts the driver bearing the first version of the file sharing protocol on the
    client's side - that is, where this machine reaches for another's resources.

    The client's side looks the lesser and is at times put off. That is a mistake, for an
    attacker needs not at all that a server hold out the old protocol - it is enough for them
    that a machine agree to speak it.

    The workings are plain and have been used for years. An attacker draws a machine into
    reaching for a network resource: a reference in a document suffices, a shortcut, a path in a
    file of settings, or an answer to a query after a name nobody proved. The machine connects
    with the false server, settles the first version of the protocol with it, and hands it what
    it holds: the credential of the account it works under.

    On a server that credential is just what makes this item critical. The account of a service
    or of a scheduler's job is at times an account of wide rights in the domain, and its handing
    over happens with no person's part - there is nobody to think better of it.

    This item fills out the switching off of the server's side and the removal of the whole
    component. All three set down the same protocol but shut different roads: the one somebody
    comes by, the one the machine goes out by, and the one that removes both ways at once.

    What an attacker gains while the item goes unmet: the means of drawing the server into
    connecting with a false resource and taking the credential of the account that server works
    under.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ten serwer sięga dziś do jakiegokolwiek
    zasobu wystawianego wyłącznie pierwszą wersją protokołu.

    Klasa jest tu niższa niż przy stronie serwerowej i jest to różnica
    świadoma. Wyłączenie strony klienckiej nie odcina nikogo od tego
    serwera — ogranicza wyłącznie to, dokąd on sam sięga. Krąg rzeczy,
    które mogą przestać działać, jest więc znany i policzalny, bo
    wychodzi z tej maszyny.

    Przypadkiem pierwszym jest starsza macierz albo magazyn sieciowy
    używany jako cel kopii zapasowych. Sprzęt sprzed lat bywa wystawia
    zasób wyłącznie starym protokołem i po zmianie zadanie kopii
    przestanie go widzieć.

    Przypadkiem drugim są skrypty i zadania sięgające po pliki na
    starszych serwerach — zwłaszcza po katalogi instalacyjne
    i repozytoria, które postawiono raz i o których nikt nie pamięta.

    Objaw jest natychmiastowy: ścieżka sieciowa przestaje się otwierać,
    a zadanie zgłasza brak dostępu do zasobu. Nie jest to awaria
    narastająca.

    Zmiana nie dotyczy udziałów udostępnianych przez ten serwer. Tamtą
    stronę opisuje punkt o serwerze pierwszej wersji protokołu.

    Wartość wchodzi w życie po ponownym uruchomieniu maszyny, bo
    dotyczy sterownika. Wycofanie przywraca wpis od razu, ale także
    wymaga restartu.
  en: |
    What needs checking is whether this server reaches today for any resource held out by the
    first version of the protocol alone.

    The class is here lower than at the server's side and that difference is knowing. The
    switching off of the client's side cuts nobody off from this server - it bounds only where it
    itself reaches. The circle of things that may stop working is therefore known and countable,
    going out as it does from this machine.

    The first case is an older storage array or network store used as the aim of backups.
    Hardware of years past at times holds out a resource by the old protocol alone, and after the
    change the backup job will stop seeing it.

    The second case is scripts and jobs reaching for files on older servers - above all for
    installation catalogues and repositories put up once and remembered by nobody.

    The symptom is immediate: a network path stops opening and a job reports no access to the
    resource. It is no breakdown that grows.

    The change does not bear on the shares this server holds out. That side is set down by the
    item on the first version's server.

    The value comes into force after a fresh start of the machine, bearing as it does on a
    driver. The undoing restores the entry at once but takes a restart as well.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - scripting-and-automation
    - drivers-and-devices
  what_breaks:
    pl:
      - Zadanie kopii zapasowej zapisujące na starszej macierzy może przestać ją widzieć
      - Skrypty sięgające po pliki na starszych serwerach zgłoszą brak dostępu do zasobu
      - Udziały udostępniane przez ten serwer pozostają bez zmiany
      - Wartość wchodzi w życie dopiero po ponownym uruchomieniu maszyny
    en:
      - A backup job writing to an older storage array may stop seeing it
      - Scripts reaching for files on older servers will report no access to the resource
      - The shares this server holds out stay unchanged
      - The value comes into force only after a fresh start of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer sięga po zasób wystawiany wyłącznie pierwszą wersją protokołu i nie przygotowano zastępstwa
      - Nie przejrzano zadań harmonogramu i skryptów pod kątem ścieżek sieciowych do starszych maszyn
    en:
      - The server reaches for a resource held out by the first version of the protocol alone and no stand-in was made ready
      - The scheduler's jobs and scripts were never looked over as to network paths to older machines
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # A value of four means the driver does not start at all. The key without
      # a start value is reported apart, because it is what a machine looks like
      # after the component has been removed - a different state from a driver
      # present and left running.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
      $name = 'Start'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_INSTALLED' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'NO_START_VALUE' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(4|NOT_INSTALLED|NO_START_VALUE)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
    $name = 'Start'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MrxSmb10'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Start' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Klucz bez wartości startu zgłaszam osobno, bo tak wygląda maszyna po
    usunięciu składnika. Jest to inny stan niż sterownik obecny
    i pozostawiony w działaniu, a raport nie powinien ich sklejać.

    Strona kliencka wygląda na mniej ważną i bywa odkładana. Napastnik
    nie potrzebuje jednak, żeby serwer wystawiał stary protokół —
    wystarczy mu, żeby maszyna zgodziła się nim mówić i oddała
    poświadczenie konta, na którym pracuje.

    Klasa uciążliwości jest niższa niż przy stronie serwerowej
    świadomie: tu ogranicza się wyłącznie to, dokąd ta maszyna sięga,
    więc krąg skutków jest policzalny.
  en: |
    I report a key without a start value apart, that being what a machine looks like after the
    component has been removed. It is a state other than a driver present and left running, and a
    report ought not to glue them together.

    The client's side looks the lesser and is at times put off. An attacker, though, needs not
    that a server hold out the old protocol - it is enough for them that a machine agree to speak
    it and give up the credential of the account it works under.

    The class of disruption is lower than at the server's side knowingly: here only where this
    machine reaches is bounded, so the circle of effects is countable.
