id: win2025-onedrive-file-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > OneDrive
  title:
    pl: Synchronizacja plików z magazynem w chmurze wyłączona
    en: File synchronisation with cloud storage disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza synchronizację plików z magazynem w chmurze — mechanizm,
    który utrzymuje katalog na maszynie i jego odpowiednik poza nią
    w stanie zgodnym.

    Kategoria średnia i chcę być tu dokładny, bo łatwo o ocenę przesadzoną
    w obie strony. To nie jest droga włamania. To jest droga, którą dane
    wychodzą z maszyny bez niczyjej decyzji o wysłaniu — wystarczy zapisać
    plik w katalogu objętym synchronizacją, a reszta dzieje się sama.

    Na serwerze waży to bardziej niż na stanowisku, z jednego powodu: na
    serwerze pliki nie należą do osoby, która je tam położyła. Kopia bazy,
    zrzut konfiguracji, wyeksportowany certyfikat, plik dziennika — rzeczy,
    które człowiek odkłada „na chwilę", żeby coś sprawdzić. W katalogu
    objętym synchronizacją „na chwilę" znaczy „na zewnątrz i na stałe".

    Druga rzecz to kierunek powrotny. Mechanizm nie tylko wysyła, ale
    i przyjmuje: plik dopisany po stronie chmury pojawi się na maszynie.
    Dostęp do konta w chmurze staje się więc dostępem do zapisu na dysku
    serwera, a zwykle nie tak liczy się ten dostęp.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wyniesienia danych z serwera bez wykonania niczego, co wyglądałoby na
    wysyłkę, oraz kanał zapisu na dysk tej maszyny spoza niej.
  en: |
    The item disables the synchronisation of files with cloud storage - the
    mechanism which keeps a folder on the machine and its counterpart outside
    it in agreement.

    The category is medium, and I want to be exact here, because it is easy
    to judge this wrongly in either direction. It is not a way in. It is the
    way by which data leaves the machine without anybody deciding to send it
    - it is enough to save a file in a synchronised folder and the rest
    happens by itself.

    On a server it weighs more than on a workstation, for one reason: on a
    server the files do not belong to the person who put them there. A copy
    of a database, a dump of configuration, an exported certificate, a log
    file - things a person sets aside "for a moment" in order to check
    something. In a synchronised folder "for a moment" means "outside and for
    good".

    The second thing is the return direction. The mechanism does not only
    send but also receives: a file added on the cloud's side will appear on
    the machine. Access to the cloud account therefore becomes access to
    writing on the server's disk, and that is not usually how such access is
    counted.

    What an attacker gains while the item goes unmet: a way of carrying data
    off the server without performing anything that would look like sending,
    and a channel for writing to this machine's disk from outside it.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i przyczyną jest jedno: jeżeli
    synchronizacja jest na tej maszynie używana, reguła zatrzyma przepływ
    danych, na którym coś stoi. Objaw nie jest błędem — pliki po prostu
    przestaną się uzgadniać, a to widać dopiero wtedy, gdy ktoś sięgnie po
    wersję, której nie ma.

    Zanim zastosujesz, sprawdź trzy rzeczy: czy klient synchronizacji jest
    na tej maszynie zainstalowany, czy jakikolwiek katalog jest objęty
    synchronizacją, i czy któreś zadanie albo zapis aplikacji nie celuje
    właśnie w taki katalog. To trzecie jest najłatwiej przeoczyć, bo ścieżka
    wygląda jak zwykła ścieżka na dysku.

    Uczciwe zastrzeżenie: reguła nie usuwa plików ani nie odłącza konta.
    Zatrzymuje uzgadnianie — to, co leży na dysku, zostaje na dysku, a to,
    co leży w chmurze, zostaje w chmurze. Rozejście się obu stron jest
    właśnie tym skutkiem, który trzeba zaplanować.

    Czego to nie psuje: udziałów sieciowych, kopii zapasowych, dostępu do
    chmury przez przeglądarkę ani aplikacji korzystających z magazynu
    w chmurze własnym połączeniem.

    Wymaga wylogowania, żeby zadziałało w bieżącej sesji. Natychmiast
    odwracalne, ale nigdy hurtem.
  en: |
    The class is "needs planned rollout", and the cause is single: if
    synchronisation is in use on this machine, the rule will stop a flow of
    data something rests on. The symptom is not an error - the files simply
    stop being reconciled, and that shows only when somebody reaches for a
    version that is not there.

    Before applying, check three things: whether the synchronisation client
    is installed on this machine, whether any folder is synchronised, and
    whether some task or an application's writing aims at exactly such a
    folder. The third is the easiest to overlook, because the path looks like
    an ordinary path on disk.

    An honest reservation: the rule neither removes files nor detaches the
    account. It stops the reconciling - what lies on disk stays on disk, and
    what lies in the cloud stays in the cloud. The two sides drifting apart
    is precisely the effect that has to be planned for.

    What this does not break: network shares, backups, access to the cloud
    through a browser, or applications using cloud storage over their own
    connection.

    It needs a sign-out to take effect in the current session. Undone
    immediately, but never in bulk.

implementation_consequences:
  impact_areas:
    - file-sharing
    - virtualization-and-containers
  what_breaks:
    pl:
      - Pliki przestaną się uzgadniać między dyskiem a chmurą, a widać to dopiero wtedy, gdy ktoś sięgnie po wersję, której nie ma
      - Sprawdź przed zastosowaniem, czy któreś zadanie albo zapis aplikacji nie celuje w katalog objęty synchronizacją
      - Reguła nie usuwa plików ani nie odłącza konta — zatrzymuje uzgadnianie, więc obie strony zaczynają się rozchodzić
      - Udziały sieciowe, kopie zapasowe i dostęp do chmury przez przeglądarkę działają bez zmian
    en:
      - Files stop being reconciled between disk and cloud, which shows only when somebody reaches for a version that is not there
      - Check before applying whether some task or an application's writing aims at a synchronised folder
      - The rule neither removes files nor detaches the account - it stops the reconciling, so the two sides begin to drift apart
      - Network shares, backups and access to the cloud through a browser work unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Na tej maszynie jakikolwiek katalog objęty synchronizacją jest celem zapisu zadania, aplikacji albo procedury kopii
    en:
      - On this machine a synchronised folder is the target of writing by a task, an application or a backup procedure
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
      $name = 'DisableFileSyncNGSC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
    $name = 'DisableFileSyncNGSC'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Data leaves the machine without anybody deciding to send it: saving a file
    # in a synchronised folder is enough. The mechanism also receives, so access
    # to the cloud account is access to writing on this disk. Check first whether
    # any task or application writes into such a folder.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableFileSyncNGSC' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/sharepoint/use-group-policy

notes:
  pl: |
    To nie droga włamania, tylko droga, którą dane wychodzą z maszyny bez
    niczyjej decyzji o wysłaniu. Wystarczy zapisać plik w katalogu objętym
    synchronizacją.

    Na serwerze waży to bardziej, bo pliki nie należą do osoby, która je
    tam położyła: kopia bazy, zrzut konfiguracji, wyeksportowany certyfikat.
    W takim katalogu „na chwilę" znaczy „na zewnątrz i na stałe".

    Kierunek powrotny jest równie ważny. Mechanizm przyjmuje: plik dopisany
    po stronie chmury pojawi się na maszynie, więc dostęp do konta staje się
    dostępem do zapisu na dysku serwera.
  en: |
    Not a way in, but the way by which data leaves the machine without
    anybody deciding to send it. Saving a file in a synchronised folder is
    enough.

    On a server it weighs more, because the files do not belong to the person
    who put them there: a copy of a database, a dump of configuration, an
    exported certificate. In such a folder "for a moment" means "outside and
    for good".

    The return direction matters as much. The mechanism receives: a file
    added on the cloud's side appears on the machine, so access to the
    account becomes access to writing on the server's disk.
