id: win2016-add-workstations-to-domain-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dodawanie stacji roboczych do domeny tylko dla administratorów
    en: Adding workstations to the domain restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do dodawania stacji roboczych do domeny do grupy
    administratorów.

    Uprawnienie ma znaczenie wyłącznie na kontrolerze domeny i tam domyślnie
    przysługuje wszystkim uwierzytelnionym użytkownikom. Każdy, kto ma konto
    w domenie, może przyłączyć do niej dziesięć maszyn — limit jest wbudowany
    w system i bywa jedyną granicą, jaka tu obowiązuje.

    Konto komputera w domenie to nie jest wpis porządkowy. To jest tożsamość,
    która uwierzytelnia się w usłudze katalogowej, odczytuje zasady grupy,
    należy do grupy komputerów domeny i widzi to, co ta grupa widzi. Maszyna
    przyłączona przez zwykłego użytkownika jest maszyną poza kontrolą działu
    informatycznego, a mimo to zaufaną przez domenę.

    Kategoria wysoka: to jest droga wprowadzenia do domeny hosta, którego nikt
    nie utwardza, nie aktualizuje i nie monitoruje, a z którego da się prowadzić
    rozpoznanie na prawach członka domeny.

    Na serwerze 2016 reguła ma pełną wagę na kontrolerze domeny. Na serwerze
    członkowskim uprawnienie nie ma zastosowania i pozostaje wyłącznie porządkiem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: własną maszynę
    wewnątrz domeny, uwierzytelnioną i zaufaną, postawioną z konta zwykłego
    użytkownika.
  en: |
    The item limits the right to add workstations to the domain to the
    administrators group.

    The right carries weight on a domain controller alone, and there it belongs by
    default to every authenticated user. Anybody with an account in the domain may
    join ten machines to it - the limit is built into the system and is sometimes
    the only boundary that applies here.

    A computer account in a domain is not a housekeeping entry. It is an identity
    that authenticates to the directory service, reads group policy, belongs to the
    domain computers group and sees what that group sees. A machine joined by an
    ordinary user is a machine outside the IT department's control, and trusted by
    the domain nonetheless.

    The category is high: this is a way of bringing into the domain a host that
    nobody hardens, updates or monitors, and from which reconnaissance can be run
    with the rights of a domain member.

    On Server 2016 the rule carries its full weight on a domain controller. On a
    member server the right does not apply and remains housekeeping alone.

    What an attacker gains while the item goes unmet: a machine of their own inside
    the domain, authenticated and trusted, stood up from an ordinary user's account.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo w części organizacji przyłączanie maszyn do
    domeny jest czynnością rozproszoną.

    Typowy przypadek to wdrożenie stanowisk prowadzone przez serwis albo przez
    firmę zewnętrzną na kontach, które nie są administratorami domeny.
    Ograniczenie uprawnienia zatrzymuje taką pracę natychmiast, a komunikat
    mówi o odmowie przyłączenia, nie o uprawnieniu — więc bywa mylnie
    przypisywany awarii sieci albo usługi katalogowej.

    Drugi przypadek to automatyzacja: skrypty przygotowujące maszyny wirtualne
    i systemy wdrożeniowe, które przyłączają nową maszynę do domeny w trakcie
    instalacji. Działają one na koncie usługowym i to konto trzeba sprawdzić
    przed zmianą.

    Rozwiązaniem nie jest odpuszczenie punktu, tylko delegowanie uprawnienia do
    tworzenia obiektów komputera w wybranej jednostce organizacyjnej —
    mechanizm usługi katalogowej, który daje to samo, a nie na całą domenę.

    Czego to nie psuje: pracy maszyn już przyłączonych, logowania do domeny,
    zasad grupy ani odnawiania haseł kont komputerów.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because in some organisations joining machines to
    the domain is a scattered activity.

    The typical case is a rollout of workstations carried out by a service desk or
    by an outside firm under accounts that are not domain administrators. Limiting
    the right stops such work at once, and the message speaks of a refused join, not
    of a right - so it gets wrongly ascribed to a failure of the network or of the
    directory service.

    The second case is automation: scripts preparing virtual machines, and
    deployment systems that join a new machine to the domain during installation.
    They run under a service account and that account has to be checked before the
    change.

    The answer is not to let the item go, but to delegate the right to create
    computer objects in a chosen organisational unit - a directory service mechanism
    that gives the same thing, and not across the whole domain.

    What this does not break: the work of machines already joined, signing in to the
    domain, group policy, or the renewal of computer account passwords.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Wdrożenie stanowisk prowadzone przez serwis na koncie niebędącym administratorem zatrzymuje się na odmowie przyłączenia
      - Skrypt przygotowujący maszyny wirtualne przestaje przyłączać je do domeny, jeżeli działa na koncie usługowym spoza grupy
      - Komunikat mówi o odmowie przyłączenia, a nie o uprawnieniu, więc bywa przypisywany awarii sieci
      - Maszyny już przyłączone, logowanie do domeny i zasady grupy działają bez zmian
    en:
      - A workstation rollout carried out by a service desk under a non-administrator account stops at a refused join
      - A script preparing virtual machines stops joining them to the domain if it runs under a service account outside the group
      - The message speaks of a refused join rather than of a right, so it gets ascribed to a network failure
      - Machines already joined, signing in to the domain and group policy work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Przyłączanie maszyn do domeny prowadzą na tym kontrolerze konta serwisowe albo wdrożeniowe spoza grupy administratorów
      - Nie przygotowano delegowania uprawnienia do tworzenia obiektów komputera w jednostce organizacyjnej
    en:
      - Joining machines to the domain on this controller is carried out by service desk or deployment accounts outside the administrators group
      - No delegation of the right to create computer objects in an organisational unit has been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeMachineAccountPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a domain controller this right belongs to every authenticated user by
    # default. Delegation at the organisational unit gives the same thing without
    # opening the whole domain.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeMachineAccountPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeMachineAccountPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/add-workstations-to-domain

notes:
  pl: |
    Na serwerze członkowskim uprawnienie nie ma zastosowania — obiekty komputera
    powstają w usłudze katalogowej, a nie lokalnie. Reguła pozostaje tam zgodna
    i nie ma skutku, więc nie należy czytać jej wyniku jako dowodu utwardzenia
    maszyny członkowskiej.

    Wbudowany limit dziesięciu maszyn na użytkownika bywa mylony z
    zabezpieczeniem. Nie jest nim: dziesięć nieutwardzonych maszyn w domenie to
    dziesięć razy za dużo, a limit da się obejść, mając do dyspozycji kilka kont.

    Delegowanie tworzenia obiektów komputera w jednostce organizacyjnej jest
    właściwym rozwiązaniem tam, gdzie przyłączanie musi robić ktoś poza grupą
    administratorów. Reguła tego nie konfiguruje — sygnalizuje potrzebę.
  en: |
    On a member server the right does not apply - computer objects come into being
    in the directory service, not locally. The rule stays compliant there and has no
    effect, so its result should not be read as evidence that the member machine has
    been hardened.

    The built-in limit of ten machines per user gets mistaken for a safeguard. It is
    not one: ten unhardened machines in the domain are ten times too many, and the
    limit can be got round given a handful of accounts.

    Delegating the creation of computer objects in an organisational unit is the
    right answer where joining has to be done by somebody outside the administrators
    group. The rule does not configure that - it signals the need.
