id: win10-remote-desktop-configuration-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konfiguracji pulpitu zdalnego wyłączona
    en: The service of the setting up of the desk from afar switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przygotowującą środowisko sesji zdalnej:
    certyfikaty, ustawienia sesji i zadania wykonywane przed jej
    rozpoczęciem.

    Usługa ta nie przyjmuje połączeń. Jest warstwą przygotowawczą,
    działającą z wysokimi uprawnieniami i wykonującą czynności w imieniu
    sesji, zanim sesja jeszcze istnieje. Właśnie ta kolejność czyni ją
    interesującą dla napastnika.

    Zagrożenie polega na tym, że czynności wykonywane przed powstaniem
    sesji są wykonywane poza kontekstem użytkownika, a więc bez jego
    ograniczeń. Błąd w tej warstwie albo podmiana tego, co ma zostać
    wykonane, daje działanie z uprawnieniami systemu.

    Punkt jest uzupełnieniem wyłączenia samego pulpitu zdalnego. Same
    połączenia są już wtedy zamknięte, ale warstwa przygotowawcza
    pozostaje uruchomiona i dalej wykonuje swoje zadania.

    Odnotowuję, że wyłączenie tej usługi bez wyłączenia pulpitu zdalnego
    psuje pulpit zdalny — sesje przestaną się zestawiać poprawnie. Te dwa
    punkty idą razem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: warstwę
    działającą z wysokimi uprawnieniami przed powstaniem sesji.
  en: |
    The setting switches off the service making ready the setting of a sitting from afar: warrants, the settings
    of the sitting and the tasks done before it begins.

    That service takes no joinings. It is a layer of making ready, working with high rights and doing things in
    the sitting's name before the sitting yet is. That very order makes it of interest to an attacker.

    The danger lies in this, that things done before a sitting comes to be are done outside the user's setting,
    and so without their bounds. A fault in that layer, or a changing out of what is to be done, gives a working
    with the system's rights.

    The item fills out the switching off of the desk from afar itself. The joinings are by then shut, but the
    layer of making ready stays set going and does its tasks still.

    I set down that the switching off of this service without the switching off of the desk from afar breaks the
    desk from afar - sittings will cease to be set up rightly. These two items go together.

    What an attacker gains while the item goes unmet: a layer working with high rights before a sitting comes to
    be.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", przede wszystkim z powodu
    zależności.

    Usługa ta jest potrzebna działającemu pulpitowi zdalnemu. Wyłączenie
    jej na maszynie, która pulpit zdalny przyjmuje, sprawia, że sesje
    przestaną się zestawiać poprawnie — i będzie to wyglądało na awarię,
    a nie na skutek zmiany.

    Miejscem pierwszym są więc wszystkie stanowiska, na których pulpit
    zdalny ma zostać. Tam tego punktu nie wolno wdrażać osobno.

    Miejscem drugim są maszyny, na których pulpit zdalny jest wyłączany
    w tej samej operacji. Tam punkt jest naturalnym dopełnieniem i koszt
    jest zerowy.

    Odnotowuję, że kolejność ma znaczenie. Najpierw pulpit zdalny, potem
    warstwa przygotowawcza — odwrotna kolejność zostawia na jakiś czas
    maszynę z pulpitem zdalnym, który nie działa poprawnie.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pracy przy maszynie, zdalnego zarządzania przez
    powłokę, dostępu do udziałów, logowania lokalnego, drukowania.
  en: |
    The class is "needs a planned rollout", above all for the hanging together.

    That service is needed by a working desk from afar. The switching off of it upon a machine that takes the desk
    from afar brings it about that sittings will cease to be set up rightly - and it will look like a breakdown
    and no upshot of a change.

    The first place is therefore every station upon which the desk from afar is to stay. There this item is not to
    be rolled out on its own.

    The second place is machines upon which the desk from afar is being switched off in the same doing. There the
    item is the natural filling out and the cost is none.

    I set down that the order has weight. First the desk from afar, then the layer of making ready - the other way
    about leaves the machine for a while with a desk from afar that works not rightly.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: work at the machine, the governing from afar through the shell, the reach of shares,
    logging on there, or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Na maszynie przyjmującej pulpit zdalny sesje przestaną się zestawiać poprawnie i będzie to wyglądało na awarię
      - Punktu nie wolno wdrażać osobno tam, gdzie pulpit zdalny ma zostać
      - Kolejność ma znaczenie — najpierw pulpit zdalny, potem warstwa przygotowawcza
      - Tam, gdzie pulpit zdalny jest wyłączany w tej samej operacji, koszt punktu jest zerowy
      - Praca przy maszynie, zdalne zarządzanie przez powłokę, dostęp do udziałów i drukowanie pozostają bez zmian
    en:
      - Upon a machine taking the desk from afar sittings will cease to be set up rightly and it will look like a breakdown
      - The item is not to be rolled out on its own where the desk from afar is to stay
      - The order has weight - first the desk from afar, then the layer of making ready
      - Where the desk from afar is being switched off in the same doing the item s cost is none
      - Work at the machine, the governing from afar through the shell, the reach of shares and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Pulpit zdalny na tej maszynie ma zostać włączony i sesje muszą zestawiać się poprawnie
    en:
      - The desk from afar upon this machine is to stay turned on and sittings must be set up rightly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'SessionEnv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SessionEnv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SessionEnv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Reguła nie ma sensu osobno i warto, żeby aplikacja powiedziała to
    wprost. Jest dopełnieniem wyłączenia pulpitu zdalnego; wdrożona sama
    psuje pulpit zdalny, zamiast go zabezpieczać.

    Argument wart zachowania dotyczy tego, czemu warstwa przygotowawcza
    jest osobnym punktem. Działa z wysokimi uprawnieniami i wykonuje
    czynności w imieniu sesji, zanim sesja powstanie — czyli poza
    kontekstem użytkownika i poza jego ograniczeniami.

    Odnotowuję kolejność wdrożenia. Najpierw pulpit zdalny, potem ta
    usługa. Odwrotna kolejność zostawia maszynę w stanie, w którym pulpit
    zdalny jest formalnie dostępny i praktycznie zepsuty, co jest gorsze
    niż oba stany skrajne.
  en: |
    The rule has no sense on its own and it is well that the application say so outright. It is the filling out of
    the switching off of the desk from afar; rolled out alone it breaks the desk from afar instead of guarding it.

    The argument worth keeping touches why the layer of making ready is an item apart. It works with high rights
    and does things in the sitting's name before the sitting comes to be - which is to say outside the user's
    setting and outside their bounds.

    I set down the order of the rollout. First the desk from afar, then this service. The other way about leaves
    the machine in a state where the desk from afar is in form to be had and in practice broken, which is worse
    than either end.
