id: win2025-router-discovery-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Samoczynne wyszukiwanie bramy sieciowej wyłączone
    en: Automatic searching for a network gateway switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania systemowi ustalać własną bramę sieciową na
    podstawie ogłoszeń rozsyłanych po sieci.

    Mechanizm pozwala maszynie zapytać, kto tu jest bramą, i przyjąć
    odpowiedź. Rozwiązuje to problem, którego dziś się nie ma: dawniej
    adresu bramy nie było skąd wziąć, bo nie było usługi przydzielania
    adresów w dzisiejszym kształcie.

    Odpowiedzi nikt nie uwierzytelnia. Maszyna przyjmuje pierwszą, która
    przyjdzie, więc napastnik w tej samej sieci wystarczy, że odezwie
    się szybciej niż brama prawdziwa. Od tej chwili jest bramą: cały
    ruch wychodzący maszyny idzie przez niego.

    Jest to przejęcie szersze niż przy przekierowaniu pojedynczej trasy.
    Tam zmieniała się droga do jednego celu; tutaj zmienia się droga do
    wszystkiego, co leży poza siecią lokalną.

    Na serwerze przejęcie takie obejmuje ruch zbiorczy: replikację,
    kopie zapasowe, ruch do kontrolera domeny, połączenia aplikacji
    z usługami zewnętrznymi. Trwa też dłużej, bo serwer nie wyłącza się
    na noc i nie zmienia sieci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość ogłoszenia się bramą tej maszyny i przeprowadzenia przez
    siebie całego ruchu wychodzącego serwera.
  en: |
    The setting forbids the system to settle its own network gateway upon announcements sent
    about the network.

    The mechanism lets a machine ask who the gateway here is and take the answer. It solves a
    trouble no longer had: in former times there was nowhere to get a gateway's address from,
    there being no service handing out addresses in today's shape.

    Nobody authenticates the answer. The machine takes the first that comes, so it is enough for
    an attacker on the same network to speak sooner than the true gateway. From that moment they
    are the gateway: all the machine's outgoing traffic goes through them.

    It is a wider taking than at the redirection of a single route. There the road to one aim
    changed; here the road to everything lying outside the local network changes.

    On a server such a taking takes in the traffic of many: replication, backups, the traffic to
    a domain controller, an application's connections with outside services. It lasts longer too,
    a server not switching off for the night and not changing networks.

    What an attacker gains while the item goes unmet: the means of announcing themselves this
    machine's gateway and leading the server's whole outgoing traffic through themselves.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy maszyn, które adres bramy
    właśnie tak ustalają, i wymaga sprawdzenia, zanim zostanie
    wprowadzona.

    Warunkiem wstępnym jest ustalenie, skąd ten serwer bierze bramę.
    Odpowiedź jest zwykle jedna z dwóch: adres wpisany na stałe albo
    adres otrzymany z usługi przydzielania adresów. W obu przypadkach
    zmiana nie ma żadnego skutku, bo mechanizm wyszukiwania nie jest
    wtedy do niczego używany.

    Przypadek trzeci jest rzadki i to on przesądza o klasie: maszyna
    w sieci zbudowanej tak, że bramy ogłaszają się same, bez usługi
    przydzielania adresów. Po zmianie taki serwer zostaje bez bramy
    domyślnej — nie traci łączności w sieci lokalnej, ale przestaje
    widzieć cokolwiek poza nią.

    Objaw jest przy tym mylący, bo maszyna odpowiada na zapytania
    z własnej sieci i wygląda na sprawną. Dopiero próba połączenia
    poza sieć pokazuje problem.

    Skutek ujawnia się dopiero po ponownym uruchomieniu maszyny,
    a więc być może wiele tygodni po samej zmianie. Jest to dodatkowy
    powód, żeby ustalić stan przed jej wprowadzeniem, a nie po.

    Sprawdzenie zajmuje chwilę: wystarczy zobaczyć, czy trasa domyślna
    ma źródło we wpisie stałym albo w usłudze przydzielania adresów.

    Zmiana nie dotyczy trasy domyślnej otrzymanej z tej usługi ani tras
    wpisanych ręcznie — te działają po niej bez różnicy.
  en: |
    The change surely changes how machines settling their gateway's address in just that way
    work, and takes a check before it is brought in.

    The precondition is settling where this server gets its gateway from. The answer is usually
    one of two: an address written fast, or an address had from the service handing out
    addresses. In both cases the change has no effect at all, the mechanism of searching being
    then put to no use.

    The third case is rare and it is what settles the class: a machine in a network built so that
    the gateways announce themselves, with no service handing out addresses. After the change
    such a server is left without a default gateway - it loses no connection within the local
    network but stops seeing anything beyond it.

    The symptom withal misleads, the machine answering queries from its own network and looking
    sound. Only a try at connecting beyond the network shows the trouble.

    The effect shows only after a fresh start of the machine, and so perhaps many weeks after the
    change itself. That is a further reason to settle the state before it is brought in rather
    than after.

    The check takes a moment: it is enough to see whether the default route has its source in an
    entry written fast or in the service handing out addresses.

    The change does not bear on a default route had from that service or on routes written by
    hand - those work after it with no difference.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Serwer ustalający bramę wyłącznie przez ogłoszenia zostanie bez trasy domyślnej
      - Maszyna nadal odpowiada w sieci lokalnej, więc wygląda na sprawną mimo braku bramy
      - Skutek ujawnia się dopiero po ponownym uruchomieniu, być może tygodnie po zmianie
      - Trasa domyślna z usługi przydzielania adresów i trasy wpisane ręcznie działają bez różnicy
    en:
      - A server settling its gateway by announcements alone will be left without a default route
      - The machine still answers within the local network and so looks sound despite the want of a gateway
      - The effect shows only after a fresh start, perhaps weeks after the change
      - A default route from the service handing out addresses and routes written by hand work with no difference
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer bierze adres bramy wyłącznie z ogłoszeń rozsyłanych po sieci, bez usługi przydzielania adresów
      - Nie ustalono, skąd ta maszyna bierze trasę domyślną
    en:
      - The server takes its gateway's address from announcements sent about the network alone, with no service handing out addresses
      - It was never settled where this machine takes its default route from
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'PerformRouterDiscovery'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'PerformRouterDiscovery'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' `
      -Name 'PerformRouterDiscovery' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Przejęcie jest tu szersze niż przy przekierowaniu pojedynczej trasy:
    zmienia się droga do wszystkiego, co leży poza siecią lokalną,
    a nie droga do jednego celu.

    Przed zmianą ustal, skąd ten serwer bierze bramę. Adres wpisany na
    stałe albo otrzymany z usługi przydzielania adresów oznacza, że
    zmiana nie ma skutku.

    Skutek ujawnia się dopiero po ponownym uruchomieniu maszyny, więc
    być może wiele tygodni po zmianie. Objaw jest przy tym mylący, bo
    maszyna odpowiada w sieci lokalnej i wygląda na sprawną.
  en: |
    The taking is here wider than at the redirection of a single route: the road to everything
    lying outside the local network changes, and not the road to one aim.

    Before the change settle where this server takes its gateway from. An address written fast or
    had from the service handing out addresses means the change has no effect.

    The effect shows only after a fresh start of the machine, and so perhaps many weeks after the
    change. The symptom withal misleads, the machine answering within the local network and
    looking sound.
