id: win2016-bitlocker-cross-organisation-media-allowed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na nośnikach zaszyfrowanych w innej organizacji dopuszczony
    en: Writing to media encrypted in another organisation admitted
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozostawia otwartą możliwość zapisu na nośnikach
    zaszyfrowanych pod identyfikatorem innej organizacji.

    Jest to jedyny punkt w tym zestawie, w którym zgodność polega na
    niewprowadzaniu ograniczenia. Warto powiedzieć, dlaczego.

    Nośniki zaszyfrowane niosą w sobie identyfikator organizacji, w której
    je zaszyfrowano. Istnieje ustawienie pozwalające odmówić zapisu na
    nośniku z identyfikatorem obcym — pomyślane jako obrona przed
    wynoszeniem danych na nośnikach spoza organizacji.

    Obrona ta jest jednak pozorna, bo identyfikator nie jest zabezpieczeniem,
    tylko etykietą. Kto chce wynieść dane, zaszyfruje nośnik u siebie albo
    nie zaszyfruje go wcale, a wtedy tej zasady on nie dotyczy. Zakaz
    dotyka więc wyłącznie tych, którzy szyfrują — czyli tych, którzy robią
    to, o co chodzi.

    Skutek praktyczny bywa dotkliwy. Nośnik przywieziony przez klienta,
    wykonawcę albo audytora jest zaszyfrowany pod ich identyfikatorem
    i przestaje przyjmować zapis, mimo że jest chroniony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic — a to
    dlatego, że stanem zgodnym jest tu właśnie brak ograniczenia.
  en: |
    The setting leaves open the possibility of writing to media encrypted under another
    organisation's identifier.

    It is the one item in this set where compliance consists in not bringing a restriction in. It is
    worth saying why.

    Encrypted media carry within them the identifier of the organisation they were encrypted in. There
    is a setting allowing writing to a medium with a foreign identifier to be refused - conceived as a
    guard against data being carried out on media from outside the organisation.

    That guard is, though, a seeming one, the identifier being no safeguard but a label. Whoever wants
    to carry data out will encrypt a medium at home or not encrypt it at all, and then this policy
    does not touch them. The ban therefore touches solely those who encrypt - which is to say those
    who do the very thing that is meant.

    The practical consequence is at times severe. A medium brought by a client, a contractor or an
    auditor is encrypted under their identifier and ceases to take writes, for all that it is guarded.

    What an attacker gains while the item goes unmet: nothing - and that because the compliant state
    is here precisely the absence of a restriction.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wdrożenie polega na zapisaniu stanu domyślnego wprost. Na maszynie,
    na której nikt tego ograniczenia nie wprowadzał, nie zmienia się nic
    poza tym, że decyzja zostaje udokumentowana.

    Na maszynie, na której ograniczenie wprowadzono, zmiana je zdejmuje
    i nośniki zaszyfrowane w innych organizacjach zaczynają ponownie
    przyjmować zapis. Jest to poszerzenie możliwości, nie zawężenie, więc
    nic nie przestaje działać.

    Nie wiąże się z tym restart ani zatrzymanie usługi.

    Czego to nie psuje: niczego. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    The rollout consists in writing the default state down explicitly. On a machine where nobody
    brought that restriction in, nothing changes but that the decision gets documented.

    On a machine where the restriction was brought in, the change takes it off and media encrypted in
    other organisations begin to take writes again. It is a widening of possibility, not a narrowing,
    so nothing ceases to work.

    No restart or stopping of a service goes with it.

    What this does not break: nothing. There are no known regressions.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
  what_breaks:
    pl:
      - Na maszynie bez tego ograniczenia nie zmienia się nic poza udokumentowaniem decyzji
      - Na maszynie z ograniczeniem nośniki zaszyfrowane w innych organizacjach zaczynają ponownie przyjmować zapis
      - Jest to poszerzenie możliwości, a nie zawężenie, więc nic nie przestaje działać
      - Odczyt nośników, szyfrowanie, odblokowywanie i odzyskiwanie pozostają bez zmian
    en:
      - On a machine without that restriction nothing changes but the documenting of the decision
      - On a machine with the restriction, media encrypted in other organisations begin to take writes again
      - It is a widening of possibility and not a narrowing, so nothing ceases to work
      - The reading of media, encrypting, unlocking and recovering stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja świadomie przyjęła identyfikator nośnika jako element kontroli obiegu danych i opiera na nim inne procedury
    en:
      - The organisation has knowingly taken the medium's identifier for an element of controlling the flow of data and rests other procedures on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'RDVDenyCrossOrg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVDenyCrossOrg'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is named after the ban, so admitting is written with a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyCrossOrg' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest w całym zestawie osobliwy i warto tę osobliwość pokazać,
    zamiast ją wygładzać. Zgodność polega tu na tym, żeby czegoś nie
    włączać — i jest to jedyny taki przypadek wśród ponad trzystu reguł
    tej platformy.

    Powód jest wart wyłożenia, bo bez niego reguła wygląda na błąd. Zakaz,
    o który chodzi, opiera się na etykiecie, a nie na zabezpieczeniu.
    Etykietę da się zmienić, pominąć albo nie nadać wcale, więc zakaz nie
    zatrzymuje nikogo, kto go nie chce. Zatrzymuje natomiast pracę
    z nośnikami przywożonymi przez ludzi z zewnątrz, którzy je zaszyfrowali
    — czyli karze za zachowanie właściwe.

    Kategoria niska jest tu postawiona zgodnie z kryterium: napastnik nie
    zyskuje przy niespełnieniu tego punktu niczego, bo niespełnienie znaczy
    ograniczenie surowsze, nie luźniejsze. Wartość reguły leży w spójności
    konfiguracji i w tym, że decyzja zostaje zapisana świadomie, a nie
    odziedziczona po kimś, kto włączył wszystko, co dało się włączyć.

    Jest to też dobry przykład na to, że nie każde dostępne ustawienie warto
    włączyć. Aplikacja, która zachęca do zaznaczania wszystkiego, prędzej
    czy później doprowadzi do włączenia właśnie takich zakazów.
  en: |
    The item is in the whole set a singular one and that singularity is worth showing rather than
    smoothing over. Compliance consists here in not switching something on - and it is the one such
    case among over three hundred rules of this platform.

    The reason is worth setting out, without it the rule looking like a mistake. The ban in question
    rests on a label and not on a safeguard. A label can be changed, passed over or not given at all,
    so the ban stops nobody who does not want it. It stops, on the other hand, work with media brought
    by people from outside who encrypted them - which is to say it punishes right behaviour.

    The low category is set here in keeping with the criterion: an attacker gains nothing at this
    item's going unmet, unmet meaning here a stricter restriction rather than a looser one. The rule's
    value lies in the configuration's coherence and in the decision's being written down knowingly
    rather than inherited from somebody who switched on everything that could be switched on.

    It is also a good example that not every available setting is worth switching on. An application
    that encourages ticking everything will sooner or later lead to just such bans being brought in.
