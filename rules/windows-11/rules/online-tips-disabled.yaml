id: win11-online-tips-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel
  title:
    pl: Pobieranie porad z sieci w ustawieniach wyłączone
    en: Fetching tips from the network in the settings switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Okno ustawień systemu pobiera treść porad z serwerów producenta: krótkie
    wskazówki wyświetlane obok poszczególnych stron ustawień. Treść nie jest
    wbudowana w system, tylko ściągana w chwili otwarcia strony.

    Dla bezpieczeństwa liczą się dwie rzeczy, obie skromne. Pierwsza to samo
    połączenie: maszyna odzywa się do sieci przy każdym zajrzeniu do ustawień,
    a z częstotliwości i pór tych połączeń da się odczytać, kiedy ktoś przy niej
    siedzi i co konfiguruje. Druga to treść: porada przychodzi z zewnątrz
    i trafia do okna, któremu użytkownik ufa bez zastanowienia, bo jest to okno
    systemowe.

    Żadne z tych dwóch nie jest drogą wejścia i benchmark słusznie stawia ten
    punkt w poziomie drugim. Wartość polega na zamknięciu jeszcze jednego
    połączenia wychodzącego, którego nikt nie potrzebuje, a nie na odparciu
    ataku.

    Na maszynie pracującej w sieci wydzielonej punkt ma dodatkowy sens
    praktyczny: znika zapytanie, które i tak nie ma dokąd dojść, a które
    zostawia ślad w rejestrach zapory.
  en: |
    The system's settings window fetches the content of tips from the maker's
    servers: short pointers shown beside individual settings pages. The content is
    not built into the system but pulled in the moment a page is opened.

    Two things matter for security, both modest. The first is the connection itself:
    the machine reaches out to the network every time somebody looks into the
    settings, and from the frequency and hours of those connections it can be read
    when someone is sitting at it and what they are configuring. The second is the
    content: a tip arrives from outside and lands in a window the user trusts without
    a second thought, because it is a system window.

    Neither of the two is a way in, and the benchmark rightly places the item at the
    second level. The worth lies in closing one more outgoing connection nobody needs
    rather than in repelling an attack.

    On a machine working in a separated network the item has a further practical
    sense: a request that has nowhere to reach anyway disappears, one that leaves a
    trace in the firewall's logs.

disruption_description:
  pl: |
    Nic nie przestaje działać. Okno ustawień otwiera się tak samo, wszystkie
    strony są dostępne, żadna opcja nie znika.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego i nie ma programu, który po wdrożeniu zachowa się inaczej.

    Jedyna widoczna różnica to brak krótkich porad obok niektórych stron
    ustawień. Są to teksty ogólne, kierujące zwykle do dokumentacji w sieci,
    więc ich brak nie zabiera nikomu możliwości zrobienia czegokolwiek. Pomoc
    systemowa działa dalej.

    Nie ma restartu. Zmiana obowiązuje od następnego otwarcia ustawień.
  en: |
    Nothing stops working. The settings window opens the same way, every page is
    reachable, no option disappears.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no program behaving differently after the rollout.

    The only visible difference is the absence of short tips beside some settings
    pages. They are general texts, usually pointing to documentation on the network,
    so their absence takes away nobody's ability to do anything. The system's help
    carries on working.

    There is no restart. The change takes effect the next time the settings are
    opened.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Krótkie porady pobierane z sieci przestaną pojawiać się obok stron ustawień
      - Nic poza tym nie zmienia się w oknie ustawień; wszystkie strony pozostają dostępne
    en:
      - Short tips fetched from the network stop appearing beside the settings pages
      - Nothing else changes in the settings window; every page stays reachable
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko służy do prowadzenia szkoleń i porady z sieci są w nich używane
    en:
      - The station is used for running training and the tips from the network are used in it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'AllowOnlineTips'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'AllowOnlineTips'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowOnlineTips' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Gałąź jest wspólna z ustawieniami powłoki i kilkoma innymi wpisami zasad,
    więc ani kopia zapasowa, ani wycofanie nie dotykają samej gałęzi —
    wyłącznie tej jednej wartości.

    Wpis leży w gałęzi zasad, ale nie pod ścieżką zasad przypisaną do
    większości ustawień tej paczki. Jest to ścieżka narzucona przez system
    i nie należy jej poprawiać na wyglądającą bardziej regularnie.

    Punkt jest jednym z wielu zamykających połączenia wychodzące składników
    systemu. Pojedynczo żaden z nich nie zmienia obrazu bezpieczeństwa; ich
    wartość polega na tym, że razem zawężają listę rzeczy, które maszyna robi
    bez pytania.
  en: |
    The key is shared with the shell's settings and several other policy entries, so
    neither the backup nor the rollback touches the key itself - only this one value.

    The entry sits in a policies key, but not under the policies path used by most of
    this pack's settings. That path is imposed by the system and should not be
    corrected into one that looks more regular.

    The item is one of many closing off outgoing connections made by the system's
    components. Singly none of them changes the security picture; their worth lies in
    together narrowing the list of things the machine does without asking.
