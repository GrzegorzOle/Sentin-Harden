id: win10-logon-legal-notice-text

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Treść komunikatu wyświetlanego przed zalogowaniem ustalona
    en: The wording of the message shown before sign-in settled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Komunikat wyświetlany przed zalogowaniem jest jedynym miejscem, w którym
    maszyna mówi wprost, czyja jest i na jakich warunkach się z niej korzysta.
    Widzi go każdy, kto do niej podejdzie — także ktoś, kto nie powinien.

    Wartość tego punktu jest prawna, nie techniczna. Komunikat rozstrzyga spór o
    to, czy ktoś wiedział, że wchodzi na cudzą maszynę, i czy wiedział, że
    czynności są rejestrowane. Bez niego obie te rzeczy trzeba dopiero wykazywać,
    a postępowanie w sprawie nadużycia zaczyna się od tego pytania.

    Treść komunikatu należy do organizacji i to ona ją układa.
  en: |
    The message shown before sign-in is the one place where the machine says
    plainly whose it is and on what terms it is used. Everybody who walks up to it
    sees that message - including somebody who should not.

    The value of this item is legal rather than technical. The message settles a
    dispute over whether somebody knew they were entering another party s machine
    and whether they knew their actions were being recorded. Without it both those
    things have to be shown from scratch, and proceedings over misuse begin with
    that question.

    The wording of the message belongs to the organisation and the organisation
    composes it.

disruption_description:
  pl: |
    Zmiana nie kosztuje nic poza jednym dodatkowym kliknięciem przed zalogowaniem.
    Nie ma przerwy, nie ma restartu, a cofnięcie jest natychmiastowe.

    Sprawdzenia wymaga wyłącznie automatyka. Stanowiska logujące się same,
    kioski i maszyny testowe zatrzymają się na komunikacie i będą czekały na
    potwierdzenie — to jedyny realny skutek tej zasady i trzeba go przewidzieć.

    Sama treść nie jest sprawą techniczną. Aplikacja nie układa jej za
    organizację i nie uruchamia polecenia sama — podaje je do skopiowania, żeby
    tekst wpisał ten, kto za niego odpowiada.
  en: |
    The change costs nothing beyond one extra click before signing in. There is no
    interruption, no restart, and reversing it is immediate.

    The only thing calling for a check is automation. Stations that sign themselves
    in, kiosks and test machines stop at the message and wait for a
    confirmation - that is this rule s one real consequence and it has to be
    foreseen.

    The wording itself is not a technical matter. The application does not compose
    it for the organisation and does not run the command by itself - it hands it
    over to be copied, so that the text is entered by whoever answers for it.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Przed każdym zalogowaniem pojawi się okno z komunikatem wymagające potwierdzenia
      - Stanowiska logujące się automatycznie zatrzymają się na komunikacie i będą czekały na potwierdzenie
      - Kioski i maszyny testowe uruchamiane bez obsługi mogą nie dojść do pulpitu
      - Logowanie, uprawnienia, dostęp do zasobów i praca po zalogowaniu pozostają bez zmian
    en:
      - A window with the message, calling for a confirmation, appears before every sign-in
      - Stations that sign themselves in stop at the message and wait for a confirmation
      - Kiosks and test machines started unattended may not reach the desktop
      - Signing in, privileges, access to resources and work after sign-in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska logujące się automatycznie, dopóki nie zostanie dla nich przewidziany wyjątek
      - Kioski i maszyny pomiarowe uruchamiane bez obsługi człowieka
    en:
      - Stations that sign themselves in, until an exception has been provided for them
      - Kiosks and measurement machines started with nobody attending
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is read whatever its type - written by policy it is a single
      # string, written by a security template it is a list of lines. Both are
      # joined and judged by whether anything is left after trimming.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'LegalNoticeText'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'EMPTY' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $text = (@($value) -join ' ').Trim()
          if ($text.Length -eq 0) { 'EMPTY' } else { 'SET' }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'SET'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'LegalNoticeText'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording belongs to the organisation, so the application does not
    # write it by itself. Replace the text below before running the command.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LegalNoticeText' -Value 'Dostep wylacznie dla osob upowaznionych. Czynnosci w systemie sa rejestrowane.' -Type String

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-text-for-users-attempting-to-log-on

notes:
  pl: |
    Treść komunikatu należy do organizacji, więc aplikacja podaje polecenie do
    skopiowania zamiast uruchamiać je sama — tekst w poleceniu jest przykładem do
    zastąpienia, nie wartością docelową. Sprawdzenie rozstrzyga wyłącznie, czy
    komunikat jest niepusty, i nie ocenia jego treści. Punkt ocenia się razem z
    nagłówkiem tego samego okna.
  en: |
    The wording belongs to the organisation, so the application hands the command
    over to be copied instead of running it itself - the text in the command is an
    example to be replaced rather than a target value. The check settles only
    whether the message is non-empty and passes no judgement on its wording. The
    item is judged together with the heading of the same window.
