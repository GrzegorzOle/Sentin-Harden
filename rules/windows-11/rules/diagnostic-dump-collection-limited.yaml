id: win11-diagnostic-dump-collection-limited

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Zbieranie zrzutów pamięci ograniczone
    en: Collection of memory dumps limited
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza to, jakie zrzuty pamięci mogą zostać zebrane
    i wysłane w ramach diagnostyki.

    Zrzut pamięci jest najbardziej wrażliwym materiałem, jaki maszyna potrafi
    o sobie wytworzyć, i warto powiedzieć dlaczego — bo nazwa brzmi
    technicznie i nie sugeruje tego wcale. Zrzut to kopia zawartości pamięci
    z chwili awarii, zapisana tak, jak stała. Znajduje się w niej wszystko,
    z czym program akurat pracował.

    W praktyce znaczy to: hasła wpisane i jeszcze nieusunięte z pamięci,
    materiał kluczy szyfrujących, ciasteczka sesji, treść otwartych
    dokumentów, zawartość zapytań do baz, tokeny dostępu. Zrzut pełny zawiera
    też pamięć jądra i to, co przechodziło przez system.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał, którym
    zawartość pamięci maszyny wychodzi na zewnątrz mechanizmem systemowym,
    bez czyjejkolwiek decyzji, przy okazji zwykłej awarii programu. Nie jest
    do tego potrzebny żaden kod na maszynie — wystarczy doprowadzić do
    awarii programu, który trzyma w pamięci coś wartościowego.

    Jest to punkt, w którym zawodzi rozumowanie „to tylko dane
    diagnostyczne". Zrzut pamięci nie jest opisem awarii. Jest kopią stanu
    maszyny w chwili, gdy do niej doszło.
  en: |
    The setting limits which memory dumps may be collected and sent as part of diagnosis.

    A memory dump is the most sensitive material a machine can produce about itself, and
    it is worth saying why - since the name sounds technical and suggests nothing of the
    kind. A dump is a copy of the contents of memory at the moment of a failure, recorded
    as it stood. In it is everything the program happened to be working with.

    In practice that means: passwords typed and not yet cleared from memory, key material,
    session cookies, the content of open documents, the content of queries to databases,
    access tokens. A full dump holds as well the kernel's memory and what passed through
    the system.

    What an attacker gains while the item goes unmet: a channel by which the contents of
    the machine's memory go outward through a system mechanism, with nobody's decision, on
    the occasion of an ordinary program failure. No code on the machine is needed for that
    - it is enough to bring about the failure of a program holding something valuable in
    memory.

    It is the point at which the reasoning "they are only diagnostic data" fails. A memory
    dump is not a description of a failure. It is a copy of the machine's state at the
    moment it happened.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy rozpoznawanie awarii w organizacji opiera się
    na przesyłaniu zrzutów do analizy.

    Na stanowisku zwykłym zmiana jest niewidoczna. Zrzuty powstają dalej
    i leżą na maszynie tam, gdzie leżały; ograniczeniu podlega wyłącznie ich
    zbieranie mechanizmem diagnostycznym.

    Skutek pojawia się w kontakcie ze wsparciem producenta systemu albo
    dostawcy aplikacji, gdzie analiza zrzutu bywa jedyną drogą rozpoznania
    przyczyny powtarzającej się awarii. Po zmianie zrzut trzeba przekazać
    osobno i świadomie — a przy okazji obejrzeć, co się w nim znajduje.

    Jest to skutek zamierzony. Przekazanie zrzutu pamięci na zewnątrz powinno
    być decyzją podjętą przez człowieka, a nie czynnością wykonywaną
    automatycznie przy każdej awarii.

    Zmiana nie wymaga restartu. Praca użytkownika nie zmienia się w żaden
    sposób.
  en: |
    What needs checking is whether the recognition of failures in the organisation rests
    on sending dumps for analysis.

    At an ordinary station the change is invisible. Dumps go on being made and lie on the
    machine where they lay; what is limited is their collection by the diagnostic
    mechanism alone.

    The effect appears in dealings with the system maker's or an application supplier's
    support, where the analysis of a dump is sometimes the only route to recognising the
    cause of a recurring failure. After the change the dump has to be passed on apart and
    knowingly - and, on that occasion, looked over for what is in it.

    That is the intended effect. Passing a memory dump outward should be a decision taken
    by a person rather than an act performed automatically at every failure.

    The change takes no restart. The user's work does not change in any way.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zbieranie zrzutów pamięci mechanizmem diagnostycznym przestaje być możliwe
      - Analiza powtarzającej się awarii przez wsparcie wymaga przekazania zrzutu osobno
      - Zrzuty powstają dalej i leżą na maszynie tam, gdzie leżały
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - Collecting memory dumps by the diagnostic mechanism stops being possible
      - Analysis of a recurring failure by support takes passing the dump on apart
      - Dumps go on being made and lie on the machine where they lay
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Rozpoznawanie awarii opiera się na przesyłaniu zrzutów mechanizmem diagnostycznym
    en:
      - The recognition of failures rests on sending dumps by the diagnostic mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LimitDumpCollection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'LimitDumpCollection' -ErrorAction SilentlyContinue).'LimitDumpCollection'
    [pscustomobject]@{
      path        = $path
      name        = 'LimitDumpCollection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitDumpCollection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Reguła domyka parę z tą, która ogranicza zbieranie dzienników. Zrzut
    pamięci jest przy tym materiałem znacznie bardziej wrażliwym niż dziennik
    i dlatego ma wyższą kategorię ryzyka mimo identycznego mechanizmu.

    Ograniczenie zbierania nie zmienia tego, czy zrzuty w ogóle powstają ani
    gdzie są zapisywane. Zrzuty leżące na dysku są osobnym zagadnieniem
    i zasługują na osobną decyzję — ta reguła ich nie dotyczy.

    Ustawienie działa dopiero wtedy, gdy dane diagnostyczne są w ogóle
    wysyłane.

    Brak wartości nie jest stanem zgodnym, bo domyślnie zbieranie bywa
    dozwolone.
  en: |
    The rule closes the pair with the one limiting the collection of logs. A memory dump
    is at that far more sensitive material than a log, and so it carries a higher risk
    category despite an identical mechanism.

    Limiting the collection does not change whether dumps are made at all, nor where they
    are recorded. Dumps lying on the disk are a separate matter and deserve a separate
    decision - this rule does not concern them.

    The setting works only where diagnostic data are sent at all.

    A missing value is not a compliant state, since by default the collection is sometimes
    allowed.
