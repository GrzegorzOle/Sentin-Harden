id: win11-password-expiry-warning-window

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uprzedzenie o wygaśnięciu hasła od 5 do 14 dni wcześniej
    en: Warning of password expiry between 5 and 14 days ahead
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System uprzedza użytkownika, że jego hasło niedługo wygaśnie, na określoną
    liczbę dni przed tym dniem. Punkt wymaga, żeby okno to mieściło się między
    pięcioma a czternastoma dniami.

    Związek z bezpieczeństwem jest pośredni i warto go nazwać uczciwie. Hasło
    zmieniane w pośpiechu, w dniu wygaśnięcia, jest hasłem gorszym: powstaje przy
    zablokowanym ekranie, pod presją, i najczęściej jest wariantem poprzedniego.
    Uprzedzenie z wyprzedzeniem daje czas na zmianę przy biurku, a nie przy
    zamkniętych drzwiach.

    Za krótkie okno prowadzi do zmian w ostatniej chwili i do zgłoszeń o koncie,
    do którego nie da się zalogować. Za długie sprawia, że komunikat przestaje
    być zauważany — przez dwa tygodnie widziany codziennie, staje się tłem
    i przestaje cokolwiek znaczyć.
  en: |
    The system warns a user that their password will soon expire, a set number of
    days before that day. The item requires this window to fall between five and
    fourteen days.

    The connection to security is indirect and worth naming honestly. A password
    changed in haste on the day it expires is a worse password: it is made at a
    locked screen, under pressure, and is most often a variant of the previous one.
    A warning given ahead of time allows the change to be made at a desk rather
    than at a closed door.

    Too short a window leads to last-minute changes and to reports of an account
    that cannot be signed into. Too long a one makes the message stop being
    noticed - seen daily for a fortnight, it becomes background and stops meaning
    anything.

disruption_description:
  pl: |
    Nic nie przestaje działać. Zmienia się wyłącznie to, kiedy pojawia się
    komunikat o zbliżającym się wygaśnięciu hasła.

    Skutek jest widoczny dla użytkownika, ale nie przeszkadza w pracy i nie
    wymaga od niego żadnej nowej czynności. Przy skróceniu okna część osób
    zobaczy komunikat później niż dotąd, przy wydłużeniu — wcześniej.

    Punkt nie zmienia okresu ważności hasła ani wymagań co do jego postaci.
    Dotyczy wyłącznie uprzedzenia.

    Na maszynie, na której hasła nie wygasają, ustawienie nie ma czego pokazać
    i pozostaje bez skutku.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    Nothing stops working. All that changes is when the message about an
    approaching password expiry appears.

    The effect is visible to the user but does not get in the way of work and asks
    nothing new of them. Shortening the window means some people see the message
    later than before, lengthening it means earlier.

    The item does not change the password's validity period or the requirements on
    its form. It concerns the warning alone.

    On a machine where passwords do not expire the setting has nothing to show and
    remains without effect.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Komunikat o zbliżającym się wygaśnięciu hasła pojawi się w innym momencie niż dotąd
    en:
      - The message about an approaching password expiry appears at a different moment than before
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item sets a range, not a single value, so both ends are reported
      # apart. A value below the range and a value above it are different
      # mistakes and a report should not merge them into one.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'PasswordExpiryWarning'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -lt 5) { 'BELOW_RANGE ' + $value }
        elseif ([int]$value -gt 14) { 'ABOVE_RANGE ' + $value }
        else { 'WITHIN_RANGE' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: WITHIN_RANGE
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'PasswordExpiryWarning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordExpiryWarning' -Value 14 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-prompt-user-to-change-password-before-expiration

notes:
  pl: |
    Naprawa ustawia czternaście dni, czyli górną granicę zakresu. Jest to wybór,
    a nie jedyna poprawna wartość — każda liczba od pięciu do czternastu spełnia
    punkt i reguła żadnej z nich nie podważa. Górną granicę wybrałem dlatego,
    że przy niej najmniej zgłoszeń kończy się zablokowanym kontem.

    Reguła rozdziela wynik poniżej zakresu od wyniku powyżej, bo są to różne
    błędy: pierwszy grozi zmianą hasła w pośpiechu, drugi — przyzwyczajeniem
    się do komunikatu. Scalenie ich w jeden wynik odebrałoby raportowi tę
    informację.
  en: |
    The fix sets fourteen days, the upper end of the range. It is a choice, not the
    only correct value - every number from five to fourteen meets the item and the
    rule disputes none of them. The upper end was chosen because at it the fewest
    reports end in a locked account.

    The rule separates a result below the range from one above it, because these
    are different mistakes: the first risks a password changed in haste, the second
    getting used to the message. Merging them into one result would take that
    information from the report.
