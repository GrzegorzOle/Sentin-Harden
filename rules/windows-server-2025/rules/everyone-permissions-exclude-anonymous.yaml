id: win2025-everyone-permissions-exclude-anonymous

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uprawnienia nadane wszystkim nie obejmują połączeń anonimowych
    en: Rights granted to everyone do not take in anonymous connections
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy połączenie bez poświadczeń jest zaliczane do
    grupy obejmującej wszystkich, i punkt wymaga, żeby nie było.

    Grupa ta jest w praktyce najczęściej używanym sposobem nadania dostępu.
    Pojawia się w uprawnieniach do udziałów, katalogów, kluczy rejestru
    i drukarek — zwykle wtedy, gdy ktoś chciał, żeby „mogli wszyscy
    pracownicy", i wybrał wpis o takiej właśnie nazwie.

    Rzecz w tym, że nazwa obiecuje co innego niż opisuje. Przy wartości
    niespełniającej punktu do grupy tej należy także połączenie, które
    nie podało żadnego konta. Uprawnienie nadane „wszystkim" przestaje
    znaczyć „każdemu zalogowanemu", a zaczyna znaczyć „każdemu, kto potrafi
    się połączyć".

    Na serwerze rozmiar skutku wyznacza liczba miejsc, w których ta grupa
    występuje — a występuje w wielu, bo jest najprostszym wyborem przy
    nadawaniu dostępu. Jedno ustawienie zmienia więc znaczenie
    kilkudziesięciu wpisów naraz, których nikt nie przegląda.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wszystko,
    co na tej maszynie nadano „wszystkim", bez logowania się na cokolwiek.
    Jest to punkt, w którym pojedyncze ustawienie unieważnia uprawnienia
    nadane w setkach miejsc.
  en: |
    The setting settles whether a connection with no credentials is counted into the group
    taking in everyone, and the item takes that it not be.

    That group is in practice the commonest way of granting access. It shows up in the
    rights to shares, directories, registry keys and printers - usually where somebody
    wanted "all the staff to be able to" and picked the entry with exactly that name.

    The thing is that the name promises something other than it describes. At a value not
    meeting the item, a connection that has given no account belongs to that group as well.
    A right granted to "everyone" stops meaning "everyone signed in" and starts meaning
    "everyone able to connect".

    On a server the size of the effect is set by the number of places that group appears
    in - and it appears in many, since it is the simplest choice when granting access. One
    setting thus changes the meaning of several dozen entries at once, entries nobody looks
    over.

    What an attacker gains while the item goes unmet: everything granted to "everyone" on
    this machine, without signing in to anything. It is an item at which a single setting
    voids rights granted in hundreds of places.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy coś na tym serwerze korzysta z dostępu
    nadanego „wszystkim", nie podając przy tym konta.

    Na większości serwerów nic takiego nie ma i wdrożenie przechodzi
    niezauważone — zwłaszcza że w nowszych systemach stan domyślny jest już
    zgodny z punktem. Wartość niezgodna oznacza zwykle zmianę wykonaną
    kiedyś ręcznie, dla konkretnej aplikacji.

    Aplikacje takie istnieją i są rozpoznawalne po wspólnej cesze: nie mają
    pojęcia konta. Urządzenia zapisujące pliki na udział, sterowniki
    pobierające konfigurację, starsze oprogramowanie przemysłowe łączące się
    z zasobem bez logowania. Wszystkie one działały dzięki temu, że
    połączenie anonimowe zaliczało się do grupy wszystkich.

    Objawem jest odmowa dostępu tam, gdzie dostęp był — przy czym
    uprawnienia na pliku wyglądają dalej tak samo. Jest to przyczyna
    najtrudniejsza do odnalezienia w całej grupie anonimowej, bo miejsce,
    w którym coś się zepsuło, i miejsce, w którym dokonano zmiany, są
    zupełnie różne.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anything on this server uses access granted to
    "everyone" without giving an account.

    On most servers there is no such thing and the rollout passes unnoticed - all the more
    since in newer systems the default state already matches the item. A non-matching value
    usually means a change made by hand once, for a definite application.

    Such applications exist and are recognisable by a common trait: they have no notion of
    an account. Devices recording files onto a share, controllers fetching a configuration,
    older industrial software connecting to a resource without signing in. All of them
    worked thanks to an anonymous connection being counted into the group of everyone.

    The symptom is access being denied where access was - with the rights on the file
    looking the same as before. It is the hardest cause to track down in the whole anonymous
    group, since the place where something broke and the place where the change was made are
    altogether different.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Urządzenia łączące się z udziałem bez konta tracą dostęp nadany wszystkim
      - Uprawnienia na pliku wyglądają dalej tak samo, więc przyczyna nie jest widoczna
      - Drukarki i zasoby udostępnione wszystkim przestają przyjmować połączenia anonimowe
      - Dostęp z podanymi poświadczeniami działa bez zmiany
    en:
      - Devices connecting to a share with no account lose the access granted to everyone
      - The rights on the file look the same as before, so the cause is not visible
      - Printers and resources put up to everyone stop taking anonymous connections
      - Access with credentials given works unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenie bez obsługi kont korzysta z zasobu udostępnionego wszystkim
    en:
      - A device with no support for accounts uses a resource put up to everyone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'EveryoneIncludesAnonymous'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'EveryoneIncludesAnonymous' -ErrorAction SilentlyContinue).'EveryoneIncludesAnonymous'
    [pscustomobject]@{
      path        = $path
      name        = 'EveryoneIncludesAnonymous'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EveryoneIncludesAnonymous' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-let-everyone-permissions-apply-to-anonymous-users

notes:
  pl: |
    Punkt jest w grupie anonimowej jedynym, który dotyczy nie odczytu
    informacji, tylko uprawnień do zasobów. Pozostałe zamykają rozpoznanie;
    ten zamyka dostęp.

    Zmiana nie rusza żadnego wpisu uprawnień. Zmienia się wyłącznie to, kto
    do grupy wszystkich należy. Dlatego przegląd uprawnień po zmianie
    niczego nie pokaże — wpisy wyglądają identycznie, a znaczą co innego.

    Naprawa tego punktu nie zwalnia z przejrzenia miejsc, w których dostęp
    nadano wszystkim. Ustawienie odcina połączenia anonimowe, ale wpis
    dalej otwiera zasób dla każdego zalogowanego konta w sieci, także konta
    gościa — a to bywa dokładnie tym, czego nikt nie zamierzał.
  en: |
    In the anonymous group the item is the only one concerning not the reading of
    information but the rights to resources. The others close reconnaissance; this one
    closes access.

    The change touches no entry of rights. What changes is only who belongs to the group of
    everyone. Hence a review of the rights after the change will show nothing - the entries
    look identical and mean something else.

    Remedying this item does not excuse one from looking over the places access was granted
    to everyone in. The setting cuts off anonymous connections, but the entry goes on
    opening the resource to every signed-in account on the network, the guest account
    included - and that is at times exactly what nobody intended.
