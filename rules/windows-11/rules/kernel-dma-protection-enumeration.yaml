id: win11-kernel-dma-protection-enumeration

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Kernel DMA Protection
  title:
    pl: Blokada urządzeń zewnętrznych sięgających wprost do pamięci
    en: External devices reaching straight into memory blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Część złączy zewnętrznych daje podłączonemu urządzeniu bezpośredni dostęp do
    pamięci operacyjnej, z pominięciem systemu. Zrobiono tak dla szybkości —
    karta graficzna w obudowie zewnętrznej albo stacja dokująca nie zdążyłyby
    inaczej. Skutkiem ubocznym jest to, że urządzenie podłączone do takiego
    złącza może czytać i zapisywać pamięć maszyny.

    Atak z tego korzystający nie wymaga zalogowania się ani znajomości hasła.
    Wystarczy fizyczny dostęp do maszyny na kilka minut, także zablokowanej —
    z pamięci można wyjąć klucze szyfrowania dysku i poświadczenia albo wpisać
    do niej własny kod. Ustawienie każe systemowi nie dopuszczać do pracy
    urządzeń, których nie da się w ten dostęp ograniczyć.
  en: |
    Some external ports give an attached device direct access to working memory,
    bypassing the system. It was done for speed - a graphics card in an external
    enclosure or a docking station would not keep up otherwise. The side effect is
    that a device attached to such a port can read and write the machine's memory.

    An attack using this needs no sign-in and no password. A few minutes of
    physical access to the machine suffices, a locked one included - disk
    encryption keys and credentials can be lifted out of memory, or one's own code
    written into it. The setting tells the system not to let devices work when
    that access cannot be constrained for them.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, co jest podłączane do złączy szybkich. Urządzenia
    obsługujące ograniczanie dostępu do pamięci działają bez zmian — nowszy
    sprzęt zwykle je obsługuje. Starszy nie i taki po prostu przestaje być
    widziany.

    Najczęstszy przypadek to stacja dokująca. Po zmianie może przestać działać
    w całości, razem z monitorami, siecią i portami, które przez nią idą —
    a osoba pracująca na tej maszynie odczyta to jako awarię sprzętu, bo
    urządzenie nie zgłosi się w żaden sposób. Podobnie zachowa się karta
    graficzna w obudowie zewnętrznej i niektóre szybkie macierze dyskowe.

    Drugi przypadek jest cichszy: część urządzeń wbudowanych w komputer,
    zwłaszcza w laptopach kilkuletnich, korzysta z tych samych mechanizmów
    i również może zniknąć. Dlatego sprawdzenie warto wykonać na jednej maszynie
    z każdego posiadanego modelu, a nie na jednej w ogóle.
  en: |
    What gets attached to the fast ports needs checking. Devices that support
    constraining memory access work unchanged - newer hardware usually does. Older
    hardware does not, and such devices simply stop being seen.

    The commonest case is a docking station. After the change it may stop working
    entirely, along with the monitors, network and ports that run through it - and
    the person working on the machine will read that as a hardware failure,
    because the device reports nothing at all. A graphics card in an external
    enclosure and some fast disk arrays behave the same way.

    The second case is quieter: some devices built into the computer, especially
    in laptops a few years old, use the same mechanisms and may likewise
    disappear. That is why the check is worth doing on one machine of every model
    owned, rather than on one machine overall.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Stacja dokująca może przestać działać w całości, razem z monitorami i siecią, które przez nią idą
      - Karta graficzna w obudowie zewnętrznej i szybkie macierze dyskowe mogą nie zostać rozpoznane
      - Urządzenie nie zgłasza błędu, tylko znika, więc objaw wygląda na awarię sprzętu
    en:
      - A docking station may stop working entirely, along with the monitors and network running through it
      - An external graphics enclosure and fast disk arrays may not be recognised
      - The device reports no error but disappears, so the symptom looks like hardware failure
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko pracuje przez stację dokującą i nie sprawdzono, czy obsługuje ona ograniczanie dostępu do pamięci
      - Używany jest sprzęt zewnętrzny wymagający bezpośredniego dostępu do pamięci
    en:
      - The station works through a docking station and it has not been checked whether it supports constrained memory access
      - External hardware requiring direct memory access is in use
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection'
      $name = 'DeviceEnumerationPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection'
    $name = 'DeviceEnumerationPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeviceEnumerationPolicy' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/kernel-dma-protection-for-thunderbolt

notes:
  pl: |
    Ustawienie działa wyłącznie na sprzęcie, który ma sprzętową ochronę pamięci
    przed dostępem bezpośrednim i włączoną wirtualizację. Na maszynie, która jej
    nie ma, zapis jest bez skutku, a ochrona przed opisanym atakiem musi wynikać
    z czegoś innego — na przykład z szyfrowania dysku z uwierzytelnieniem przed
    rozruchem.

    To jest punkt, w którym raport zgodności potrafi wprowadzić w błąd: wartość
    jest ustawiona, więc punkt świeci na zielono, a maszyna nadal jest podatna,
    bo sprzęt tej ochrony nie ma. Sprawdzenie stanu sprzętowego wymagałoby
    odczytu z narzędzia informacji o systemie i nie mieści się w tym punkcie,
    ale użytkownik powinien o tej granicy wiedzieć.
  en: |
    The setting works only on hardware that has hardware protection of memory
    against direct access and virtualization enabled. On a machine without it the
    record has no effect, and protection against the described attack has to come
    from something else - disk encryption with pre-boot authentication, for
    instance.

    This is a point where a compliance report can mislead: the value is set, so
    the item shows green, while the machine is still vulnerable because the
    hardware lacks the protection. Checking the hardware state would mean reading
    from the system information tool and does not fit inside this item, but the
    user should know where that line runs.
