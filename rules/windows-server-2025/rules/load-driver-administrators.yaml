id: win2025-load-driver-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Ładowanie sterowników tylko dla administratorów
    en: Loading drivers restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala załadować sterownik do jądra systemu, czyli umieścić
    własny kod w warstwie, która nie podlega już żadnej kontroli
    dostępu.

    Wszystkie pozostałe zabezpieczenia systemu — uprawnienia, poziomy
    nienaruszalności, izolacja procesów, kontrola konta użytkownika —
    działają w warstwie wyższej i są egzekwowane przez jądro. Kod
    działający w jądrze nie jest im poddany; jest tym, co je egzekwuje.
    Dlatego to prawo nie jest jednym z wielu mocnych uprawnień, tylko
    wyjściem poza cały model uprawnień.

    Skutkiem praktycznym jest możliwość ukrycia się przed wszystkim, co
    działa w warstwie wyższej. Proces, plik i połączenie sieciowe mogą
    zniknąć z wykazów, a oprogramowanie zabezpieczające przestaje widzieć
    to, co się dzieje — bo pyta jądro, a jądro odpowiada tyle, ile mu
    pozwolono.

    Na serwerze jest to szczególnie dotkliwe, bo serwer obserwuje się
    zdalnie i wyłącznie przez to, co sam o sobie powie. Nie ma nikogo,
    kto zauważyłby, że maszyna zachowuje się inaczej niż raportuje.

    Punkt nie każe prawa usunąć, tylko zawęzić do administratorów.
    Instalowanie sterowników na serwerze musi pozostać możliwe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście
    do warstwy, z której może wyłączyć albo oślepić każde zabezpieczenie
    działające na tej maszynie.
  en: |
    The right allows a driver to be loaded into the system's kernel, that is, one's own code to
    be placed in the layer that falls under no access control any more.

    All the system's other safeguards - rights, levels of integrity, the isolating of
    processes, user account control - work in a higher layer and are enforced by the kernel.
    Code working in the kernel is not subject to them; it is what enforces them. Hence this
    right is not one strong power among many but a stepping outside the whole model of rights.

    The practical effect is the means of hiding from everything working in the higher layer. A
    process, a file and a network connection may vanish from the lists, and guarding software
    stops seeing what happens - for it asks the kernel, and the kernel answers as much as it
    has been allowed.

    On a server that bites especially hard, since a server is watched remotely and only through
    what it says of itself. There is nobody to notice that the machine behaves otherwise than
    it reports.

    The item does not bid the right be removed but narrowed to administrators. The installing
    of drivers on a server must stay possible.

    What an attacker gains while the item goes unmet: entry into the layer from which they can
    switch off or blind every safeguard working on this machine.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze coś ładuje sterowniki
    poza instalacją oprogramowania, bo takie ładowanie po zmianie
    przestanie się udawać.

    Nic nie przestaje działać przy pracy normalnej. Sterowniki załadowane
    wcześniej pracują dalej, a instalowanie nowych przez administratora
    przebiega bez zmiany.

    Na serwerze przypadek do sprawdzenia jest konkretny i nie hipotetyczny.
    Oprogramowanie kopii zapasowych ładuje sterownik migawek
    przy każdym zadaniu. Narzędzia diagnostyczne ładują sterowniki na
    czas pomiaru i zwalniają je po zakończeniu. Agenci zabezpieczeń
    ładują własne sterowniki filtrujące przy starcie usługi.

    Jeżeli któreś z nich pracuje na koncie spoza grupy administratorów,
    po zmianie przestanie ładować sterownik. Objaw bywa niejednoznaczny:
    usługa wstaje, zgłasza w dzienniku błąd ładowania i przechodzi
    w tryb ograniczony albo po prostu nie robi tego, po co ją
    zainstalowano.

    Sterowniki ładowane przez system przy starcie nie są objęte tą
    zmianą — system działa z innego tytułu, nie przez ten wykaz. Jest to
    wniosek wart zapamiętania, bo obawa o start maszyny jest
    najczęstszym powodem odpuszczania tego punktu.
  en: |
    What needs checking is whether anything on this server loads drivers outside the
    installation of software, since such loading will after the change stop succeeding.

    Nothing stops working at normal work. Drivers loaded earlier go on working, and the
    installing of new ones by an administrator runs unchanged.

    On a server the case to be checked is concrete rather than notional. Backup software loads
    a snapshot driver at every task. Diagnostic tools load drivers for the time of a measuring
    and release them after. Guarding agents load filtering drivers of their own at the
    service's start.

    Should any of those work under an account outside the administrators' group, after the
    change it will stop loading its driver. The symptom is at times unclear: the service comes
    up, reports a loading error in the log and passes into a limited mode, or simply does not
    do what it was installed for.

    Drivers loaded by the system at the start are not taken in by this change - the system
    works on another title, not through this list. That is a conclusion worth keeping, since
    fear for the machine's start is the commonest reason this item is let go.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - Agent kopii zapasowych na koncie spoza grupy administratorów nie załaduje sterownika migawek
      - Narzędzie diagnostyczne ładujące sterownik na czas pomiaru przestanie działać
      - Objaw bywa niejednoznaczny — usługa wstaje i przechodzi w tryb ograniczony
      - Sterowniki załadowane wcześniej i ładowane przez system przy starcie działają bez zmiany
      - Instalowanie sterowników przez administratora przebiega bez zmiany
    en:
      - A backup agent under an account outside the administrators' group will not load its snapshot driver
      - A diagnostic tool loading a driver for the time of a measuring will stop working
      - The symptom is at times unclear - the service comes up and passes into a limited mode
      - Drivers loaded earlier and those loaded by the system at the start work unchanged
      - The installing of drivers by an administrator runs unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Agent kopii zapasowych albo agent zabezpieczeń ładuje sterownik z konta spoza grupy administratorów
    en:
      - A backup agent or a guarding agent loads a driver from an account outside the administrators' group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeLoadDriverPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeLoadDriverPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeLoadDriverPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeLoadDriverPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeLoadDriverPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/load-and-unload-device-drivers

notes:
  pl: |
    Sterowniki ładowane przez system przy starcie nie zależą od tego
    wykazu. System działa z innego tytułu, więc zawężenie prawa nie
    wpływa na uruchomienie maszyny.

    Punkt czyta się razem z wymaganiem podpisanych sterowników
    i z integralnością kodu. Zawężenie tego, kto może ładować, i
    wymaganie, co wolno załadować, są dwoma różnymi zabezpieczeniami
    i żadne nie zastępuje drugiego.

    Ocena uciążliwości jest tu wyższa niż w paczce stanowiska roboczego,
    bo na serwerze sterowniki ładuje w toku pracy oprogramowanie kopii
    zapasowych i narzędzia diagnostyczne, a nie wyłącznie instalator.
  en: |
    Drivers loaded by the system at the start do not hang on this list. The system works on
    another title, so narrowing the right does not bear on the machine's starting.

    The item is read together with the requirement of signed drivers and with code integrity.
    Narrowing who may load, and requiring what may be loaded, are two different safeguards and
    neither stands in for the other.

    The judgement of disruption is higher here than in the working station's pack, since on a
    server drivers are loaded in the course of work by backup software and diagnostic tools
    rather than by an installer alone.
