id: win11-preview-builds-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Wersje zapoznawcze systemu niedostępne
    en: Preview builds of the system unavailable
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Maszynę można zapisać na wersje zapoznawcze systemu — wydania przedpremierowe,
    które dostaje się wcześniej niż wszyscy, w zamian za to, że są niedokończone.
    Zapisu dokonuje się z poziomu ustawień, więc wystarczy do tego zwykła decyzja
    użytkownika z uprawnieniami administratora.

    Dla bezpieczeństwa znaczy to trzy rzeczy. Wydanie przedpremierowe zawiera kod,
    który nie przeszedł pełnego cyklu sprawdzania, więc niesie błędy jeszcze
    nieznalezione — także takie, które dałoby się wykorzystać. Poprawki dla takiej
    wersji chodzą własnym rytmem i nie pokrywają się z cyklem, na którym opiera
    się zarządzanie aktualizacjami, więc maszyna wypada z rachuby. Wreszcie
    wersje zapoznawcze wysyłają producentowi szerszy zestaw danych o pracy
    systemu, bo po to powstały.

    Zablokowanie zapisu zostawia maszynę na wydaniu, które ma pełne wsparcie
    i przewidywalny cykl poprawek.
  en: |
    A machine can be enrolled onto preview builds of the system - pre-release
    versions received earlier than everyone else's, in exchange for being
    unfinished. Enrolment happens from the settings, so an ordinary decision by a
    user with administrator rights is all it takes.

    For security this means three things. A pre-release build contains code that
    has not been through a full cycle of checking, so it carries bugs not yet
    found - including ones that could be exploited. Fixes for such a build run to
    a rhythm of their own and do not line up with the cycle update management
    rests on, so the machine drops out of the reckoning. Finally, preview builds
    send the vendor a wider set of data about how the system runs, because that is
    what they exist for.

    Blocking enrolment keeps the machine on a build that has full support and a
    predictable cycle of fixes.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy któraś maszyna jest już na wersji zapoznawczej,
    i to jest jedyne miejsce, w którym ten punkt boli.

    Na maszynie, która nigdy nie była zapisana, nie zmienia się nic — znika
    wyłącznie możliwość zapisania się, schowana w ustawieniach aktualizacji.

    Na maszynie już zapisanej rzecz wygląda inaczej. System przestanie pobierać
    kolejne wydania przedpremierowe i zatrzyma się na tym, które ma. Ponieważ
    zainstalowane wydanie jest nowsze niż to ogólnie dostępne, maszyna nie wróci
    na zwykły tor samoczynnie i zostanie na wersji, która w swoim czasie
    przestanie dostawać poprawki. Powrót wymaga ponownej instalacji systemu —
    i to jest właściwy powód, dla którego warto zajrzeć, zanim się zastosuje.

    Dotyczy to zwykle stanowisk deweloperskich i testowych, rzadko zwykłych.
  en: |
    What needs checking is whether any machine is already on a preview build, and
    that is the only place this item hurts.

    On a machine that was never enrolled nothing changes - only the option to
    enrol, tucked away in the update settings, disappears.

    On an already-enrolled machine it looks different. The system stops
    downloading further pre-release builds and halts on the one it has. Because
    the installed build is newer than the generally available one, the machine
    will not return to the ordinary track by itself and stays on a version that
    will in time stop receiving fixes. Going back requires reinstalling the system
    - and that is the real reason to look before applying.

    This usually concerns development and test stations, rarely ordinary ones.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Zapisanie maszyny na wersje zapoznawcze przestanie być możliwe z poziomu ustawień
      - Maszyna już zapisana zatrzyma się na obecnym wydaniu przedpremierowym i nie wróci sama na zwykły tor
      - Powrót takiej maszyny na wydanie ogólnie dostępne wymaga ponownej instalacji systemu
    en:
      - Enrolling the machine onto preview builds stops being possible from the settings
      - An already-enrolled machine halts on its current pre-release build and does not return to the ordinary track by itself
      - Bringing such a machine back to a generally available build requires reinstalling the system
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko służy do sprawdzania oprogramowania na nadchodzących wydaniach systemu
      - Maszyna jest już zapisana na wersje zapoznawcze i nie zaplanowano jej ponownej instalacji
    en:
      - The station is used to test software against upcoming system releases
      - The machine is already enrolled onto preview builds and no reinstall is planned
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
      $name = 'AllowBuildPreview'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
    $name = 'AllowBuildPreview'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBuildPreview' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-insider/business/manage-builds

notes:
  pl: |
    Pole mówiące o odwracalności opisuje samo ustawienie, a nie stan maszyny,
    i tu te dwie rzeczy się rozjeżdżają. Wartość cofa się natychmiast, ale
    maszyna, która w międzyczasie została na wydaniu przedpremierowym, tym
    cofnięciem nie wraca donikąd.

    Jest to przykład punktu, przy którym trzeba spojrzeć na maszynę, zanim się
    zastosuje — mimo że sam zapis jest nieszkodliwy i natychmiast odwracalny.
  en: |
    The reversibility field describes the setting, not the state of the machine,
    and here the two part company. The value reverts at once, but a machine left
    meanwhile on a pre-release build is taken nowhere by that reversion.

    This is an example of an item where the machine has to be looked at before
    applying - even though the write itself is harmless and immediately
    reversible.
