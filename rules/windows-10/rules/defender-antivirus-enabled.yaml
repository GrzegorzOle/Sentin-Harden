id: win10-defender-antivirus-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Wyłączenie wbudowanej ochrony przed złośliwym oprogramowaniem zablokowane
    en: Switching the built-in malware protection off blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wpisuje wprost zakaz wyłączania wbudowanej ochrony przed
    złośliwym oprogramowaniem.

    Wartość ta jest najkrótszą drogą do rozbrojenia maszyny. Jeden wpis
    w rejestrze wyłącza ochronę w całości — nie jedną jej część, nie jedno
    skanowanie, lecz mechanizm. Napastnik, który raz uzyskał uprawnienia
    administratora, sięga po nią, zanim zrobi cokolwiek innego, bo od tej
    chwili nic już go nie zatrzyma.

    Stanem zgodnym jest wpisane zero, a nie brak wpisu. Różnica jest
    istotna i warto ją nazwać: brak wpisu pozostawia rozstrzygnięcie temu,
    kto zapisze do rejestru jako następny. Wpisane zero jest decyzją
    podjętą wcześniej, a napastnik musi ją nadpisać — czyli wykonać
    czynność, która zostawia ślad.

    Odnotowuję sytuację, w której wartość ta bywa ustawiona prawidłowo
    przez kogoś innego niż napastnik: wdrożenie ochrony innego producenta.
    Niektóre z nich wyłączają ochronę wbudowaną właśnie tak. Reguła nie
    odróżnia tych przypadków sama i dlatego jest opatrzona klasą wymagającą
    sprawdzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozbrojenie
    całej ochrony maszyny jednym zapisem do rejestru.
  en: |
    The setting writes down outright the forbidding of the switching off of the built-in protection against
    malicious software.

    That value is the shortest road to the disarming of a machine. One entry in the registry switches the
    protection off whole - not one part of it, not one scan, but the mechanism. An attacker who has once come by
    an administrator's rights reaches for it before they do anything else, for from that hour nothing holds them
    back.

    The compliant state is a written nought and not the want of an entry. The difference matters and is worth
    naming: the want of an entry leaves the settling to whoever writes to the registry next. A written nought is
    a decision taken earlier, and an attacker has to write over it - which is to say carry out an act that
    leaves a trace.

    I set down the case in which that value stands rightly set by somebody other than an attacker: the rolling
    out of another maker's protection. Some of them switch the built-in protection off in just that way. The
    rule does not tell those cases apart of itself, and for that it bears the class calling for a review.

    What an attacker gains while the item goes unmet: the disarming of a machine's whole protection by one
    writing to the registry.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, co na
    tej maszynie chroni.

    Ustawienie nie włącza ochrony wbudowanej. Zakazuje wyłączania jej tą
    wartością. Maszyna, na której ochrona wbudowana już stoi z boku, bo
    przejął ją inny produkt, nie zacznie po tej zmianie skanować podwójnie.

    Sprawdzić trzeba jedno: czy wyłączenie ochrony wbudowanej jest na tej
    maszynie zamierzone. Część wdrożeń ochrony innego producenta opiera się
    dokładnie na tej wartości, a wpisanie zera przekreśla ich instalator.
    Skutkiem bywa wtedy nie podwójna ochrona, lecz konflikt dwóch
    mechanizmów sięgających po te same zdarzenia.

    Odnotowuję, że zmiana nie wymaga restartu i działa od razu. Po
    wpisaniu zera ochrona wbudowana wraca do pracy w ciągu kilku minut,
    bez udziału użytkownika.

    Czego to nie psuje: pracy ochrony innego producenta jako takiej,
    aktualizacji, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is what upon this machine protects.

    The setting does not switch the built-in protection on. It forbids the switching of it off by that value. A
    machine upon which the built-in protection already stands aside, another product having taken over, will
    after this change not begin to scan twice.

    One thing has to be reviewed: whether the switching off of the built-in protection is upon this machine
    meant. A part of the rollouts of another maker's protection rests upon just that value, and the writing of a
    nought strikes their installer out. The consequence is then at times not a twofold protection but a strife
    of two mechanisms reaching for the same happenings.

    I set down that the change calls for no restart and works at once. After the writing of the nought the
    built-in protection returns to work within some few minutes, with no doing on the user's part.

    What this does not break: the working of another maker's protection as such, updates, logging on, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Część wdrożeń ochrony innego producenta opiera się na wyłączeniu ochrony wbudowanej tą wartością
      - Wpisanie zera przekreśla wtedy instalator tamtego produktu i daje konflikt dwóch mechanizmów
      - Ustawienie nie włącza ochrony wbudowanej, lecz zakazuje wyłączania jej tą wartością
      - Zmiana działa od razu i ochrona wbudowana wraca do pracy w ciągu kilku minut
      - Aktualizacje, logowanie, konta domenowe, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A part of the rollouts of another maker s protection rests on switching the built-in one off by this value
      - The writing of a nought then strikes that product s installer out and gives a strife of two mechanisms
      - The setting does not switch the built-in protection on but forbids the switching of it off by this value
      - The change works at once and the built-in protection returns to work within some few minutes
      - Updates, logging on, domain accounts, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrożenie ochrony innego producenta opiera się na wyłączeniu ochrony wbudowanej tą wartością
    en:
      - The rollout of another maker s protection rests on switching the built-in one off by this value
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The compliant state is an explicit zero, not an absent value: without the
      # entry the decision stays with whoever can write to the registry.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableAntiSpyware'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableAntiSpyware'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An explicit zero, not the removal of the entry. Only the written zero closes
    # the road off; an absent value leaves it open to whoever writes next.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableAntiSpyware' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-windows

notes:
  pl: |
    Reguła otwiera blok i jest w nim jedyną ocenioną jako krytyczna.
    Pozostałe opisują poszczególne mechanizmy ochrony; ta opisuje
    możliwość wyłączenia ich wszystkich naraz.

    Argument wart zachowania dotyczy różnicy między brakiem wpisu
    a wpisanym zerem. Sprawdzenie zwraca tu MISSING, a nie zero, i jest to
    celowe. Maszyna bez wpisu nie jest maszyną zgodną — jest maszyną,
    na której nikt tej decyzji nie podjął, a podejmie ją ten, kto zapisze
    do rejestru jako następny.

    Odnotowuję granicę reguły. Wartość ta nie jest jedynym sposobem na
    zatrzymanie ochrony wbudowanej i spełnienie tego punktu nie zamyka
    tematu. Zamyka natomiast drogę najkrótszą i najczęściej wykorzystywaną,
    a to przy ocenie krytycznej wystarczy.
  en: |
    The rule opens the block and is the only one in it weighed as critical. The rest describe the several
    mechanisms of protection; this describes the power to switch them all off at once.

    The argument worth keeping touches the difference between the want of an entry and a written nought. The
    check gives back here MISSING and not a nought, and that is meant. A machine without the entry is no
    compliant machine - it is a machine upon which nobody took that decision, and it will be taken by whoever
    writes to the registry next.

    I set down the rule's bound. That value is not the only means of stopping the built-in protection, and the
    meeting of this item does not close the matter. It closes nonetheless the shortest road and the one most
    often used, and at a critical weighing that suffices.
