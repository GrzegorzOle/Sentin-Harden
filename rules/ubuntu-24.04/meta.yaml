id: ubuntu-24.04
name:
  pl: Ubuntu 24.04 LTS
  en: Ubuntu 24.04 LTS
family: linux
shell: bash
profile: server

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0

detection:
  command: |
    . /etc/os-release
    printf '%s|%s\n' "$ID" "$VERSION_ID"
  match: '^ubuntu\|24\.04$'

notes:
  pl: |
    Bliski Debianowi, ale nie tożsamy — różnice dotyczą między innymi domyślnej
    konfiguracji zapory (ufw), profili AppArmor i obecności snapów. Nie kopiuj
    reguł z paczki Debiana bez sprawdzenia na żywym systemie.

    Menedżer pakietów: apt. Kontrola dostępu: AppArmor.
  en: |
    Close to Debian but not identical - differences include the default
    firewall setup (ufw), AppArmor profiles and the presence of snaps. Do not
    copy rules from the Debian pack without verifying them on a live system.

    Package manager: apt. Access control: AppArmor.
