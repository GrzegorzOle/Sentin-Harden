id: win10-windows-tips-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Porady i wskazówki systemu wyłączone
    en: System tips and hints turned off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Porady i wskazówki to komunikaty pojawiające się przy pracy i opisujące
    funkcje systemu. Treść dobierana jest zdalnie, więc to, co użytkownik
    zobaczy, zależy od usługi, a nie od tego, co stoi na maszynie.

    Kategoria ryzyka jest niska, bo sam mechanizm niczego nie uruchamia i o nic
    nie prosi. Jego znaczenie jest takie samo jak zachęt dotyczących konta:
    przyzwyczaja do komunikatów, które pojawiają się same i coś proponują.
    Odróżnienie takiego okna od podstawionego wymaga uwagi, której nikt nie
    poświęca komunikatowi widzianemu co tydzień.

    Wyłączenie porad porządkuje to, co na maszynie służbowej ma prawo się
    odezwać.
  en: |
    Tips and hints are messages appearing during work and describing features of
    the system. The content is chosen remotely, so what the user sees rests on the
    service rather than on what is installed on the machine.

    The risk rating is low, since the mechanism itself starts nothing and asks for
    nothing. Its significance is the same as that of the account prompts - it
    accustoms people to messages that appear by themselves and suggest something.
    Telling such a window from a planted one calls for an attention nobody gives a
    message seen every week.

    Switching the tips off puts in order what has the right to speak up on a work
    machine.

disruption_description:
  pl: |
    Zmiana nie kosztuje nic i jest niewidoczna poza brakiem komunikatów. Nie
    wymaga przerwy i cofa się natychmiast.

    Jedyną grupą, która może to odczuć, są osoby dopiero poznające system —
    tracą źródło podpowiedzi. W organizacji z własnymi materiałami wprowadzającymi
    nie jest to strata; tam, gdzie takich materiałów nie ma, warto o tym
    pamiętać.
  en: |
    The change costs nothing and is invisible beyond the absence of messages. It
    calls for no interruption and reverses at once.

    The only group that may feel it is people still learning the system - they
    lose a source of hints. In an organisation with introductory materials of its
    own that is no loss; where there are none, it is worth bearing in mind.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Komunikaty z poradami i wskazówkami przestaną pojawiać się przy pracy
      - Osoby dopiero poznające system stracą źródło podpowiedzi o funkcjach
      - Powiadomienia o nowościach po aktualizacji systemu przestaną być wyświetlane
      - Pomoc systemowa wywoływana samodzielnie, zainstalowane aplikacje i praca użytkownika pozostają bez zmian
    en:
      - Messages with tips and hints stop appearing during work
      - People still learning the system lose a source of hints about features
      - Notifications about novelties after a system update stop being shown
      - The system help raised on demand, installed applications and user work are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Środowiska bez własnych materiałów wprowadzających, gdzie porady są jedynym źródłem podpowiedzi
      - Stanowiska szkoleniowe, na których omawia się funkcje systemu wraz z jego komunikatami
    en:
      - Environments with no introductory materials of their own, where the tips are the only source of hints
      - Training stations, where features of the system are discussed along with its messages
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableSoftLanding'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableSoftLanding'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSoftLanding' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt dotyczy porad wstawianych przez system, a nie pomocy wywoływanej
    samodzielnie — ta pozostaje dostępna. Ocenia się go razem z pozostałymi
    punktami gałęzi treści z chmury oraz z pobieraniem porad w ustawieniach, które
    leży w innym miejscu rejestru.
  en: |
    The item covers tips placed by the system rather than help raised on demand -
    that stays available. It is judged together with the other items of the cloud
    content branch and with the fetching of tips in the settings, which lies
    elsewhere in the registry.
