id: win2025-print-rpc-listener-protocols-tcp

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Połączenia przychodzące podsystemu druku wyłącznie przez gniazda sieciowe
    en: Incoming connections of the printing subsystem over network sockets only
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Podsystem druku przyjmuje polecenia z sieci dwiema drogami:
    przez nazwany potok i przez gniazdo sieciowe. Ustawienie zostawia
    wyłącznie tę drugą.

    Różnica nie polega na wydajności, tylko na tym, czym te drogi są
    dla reszty systemu.

    Nazwany potok jest udostępnieniem plikowym. Polecenie do bufora
    wydruku wędruje wtedy tym samym kanałem co dostęp do udziałów,
    na tym samym porcie, przez tę samą usługę serwera. Wynikają z tego
    trzy rzeczy, wszystkie złe. Reguła zapory dopuszczająca dostęp do
    plików dopuszcza przy okazji polecenia do bufora wydruku. Nadzór
    patrzący na ruch wydruku tego ruchu nie widzi, bo z zewnątrz wygląda
    on jak zwykła praca na plikach. A sesja zestawiona po to, żeby
    otworzyć plik, nadaje się bez żadnej dodatkowej pracy do rozmowy
    z buforem.

    Gniazdo sieciowe jest kanałem własnym podsystemu druku. Da się je
    wskazać w regule zapory, da się je zobaczyć w nadzorze i da się
    ograniczyć krąg maszyn, które mogą z niego korzystać. Dopiero
    wtedy zdanie „dostęp do wydruku mają maszyny z tej sieci" znaczy
    cokolwiek.

    Na serwerze różnica ta waży więcej niż gdziekolwiek indziej,
    bo serwer plików i serwer wydruku to bardzo często ta sama maszyna.
    Reguła otwierająca udostępnianie plików dla całej sieci jest tam
    normą, a nie wyjątkiem — i otwiera przy okazji drugą drogę,
    o której nikt nie myślał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    do bufora wydruku przez kanał otwarty dla udostępniania plików,
    niewidoczny dla nadzoru patrzącego na ruch wydruku.
  en: |
    The printing subsystem takes orders from the network by two roads: by a named pipe and by a
    network socket. The setting leaves the second alone.

    The difference lies not in swiftness but in what those roads are for the rest of the system.

    A named pipe is a file share. An order to the print spooler then travels by the same channel
    as access to shares, on the same port, through the same server service. Three things follow
    from that, all bad. A firewall rule admitting access to files admits print spooler orders
    along the way. Watching that looks at print traffic does not see this traffic, it looking from
    outside like ordinary work upon files. And a session set up to open a file is fit, with no
    further work at all, for speaking to the spooler.

    A network socket is the printing subsystem's own channel. It can be named in a firewall rule,
    it can be seen in the watching, and the circle of machines that may use it can be bounded.
    Only then does the sentence "machines from this network have access to printing" mean
    anything.

    On a server that difference weighs more than anywhere else, a file server and a print server
    being very often the same machine. A rule opening file sharing to the whole network is there
    the norm and not the exception - and it opens along the way a second road nobody thought of.

    What an attacker gains while the item goes unmet: access to the print spooler by a channel
    opened for file sharing, unseen by watching that looks at print traffic.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia i na serwerze bardziej niż na
    stanowisku roboczym, bo odcina klientów, a nie siebie.

    Warunki wstępne są dwa i oba trzeba spełnić przed zmianą.

    Pierwszy to zapora. Ruch podsystemu druku przez gniazda sieciowe
    idzie innym portem niż udostępnianie plików, a reguły zapory
    w sieciach utrzymywanych od lat bywają pisane pod nazwane potoki,
    bo tak to kiedyś działało. Jeżeli ten port nie jest przepuszczony,
    po zmianie nie połączy się nikt — zamiast zawężenia drogi dostaje
    się jej zamknięcie.

    Drugi to klienci. Maszyny na systemach sprzed kilku wersji nie
    potrafią rozmawiać z buforem inaczej niż nazwanym potokiem. Na
    serwerze wydruku obsługującym starszy park maszyn oznacza to utratę
    drukowania dla części z nich — i to dla tej części, która zwykle
    jest najmniej zauważana, bo stoi w miejscach, gdzie nikt niczego nie
    wymieniał od lat.

    Objaw po stronie klienta jest czytelny: drukarka sieciowa przestaje
    odpowiadać, a zadania stoją w kolejce. Objaw po stronie serwera to
    brak objawu — serwer działa i nie zgłasza niczego.

    Rozpoznanie robi się przed zmianą i polega na tym, żeby zobaczyć,
    jakie systemy mają klienci tego serwera wydruku. Wykaz połączeń
    do bufora mówi o chwili bieżącej, więc trzeba na niego popatrzeć
    przez kilka dni, a nie raz.

    Zmiana wymaga ponownego uruchomienia bufora wydruku, czyli przerwania
    zadań w toku.

    Punkt czyta się razem z jego odpowiednikiem dla połączeń wychodzących.
    Ten mówi, czym można się dobić do tej maszyny; tamten, czym ta
    maszyna dobija się do innych.
  en: |
    The change takes a knowing rollout, and on a server more than at a working station, it cutting
    off clients and not itself.

    The preconditions are two and both must be met before the change.

    The first is the firewall. The printing subsystem's traffic over network sockets goes by
    another port than file sharing, and a firewall's rules in networks kept up for years are at
    times written for named pipes, that being how it once worked. Where that port is not let
    through, after the change nobody will connect - instead of a narrowing of the road one gets
    its shutting.

    The second is the clients. Machines on systems several versions old cannot speak to the
    spooler otherwise than by a named pipe. On a print server serving an older stock of machines
    that means the loss of printing for some of them - and for just that part which is usually
    least noticed, standing in places where nobody has replaced anything for years.

    The symptom on the client's side is plain: the network printer stops answering and jobs stand
    in the queue. The symptom on the server's side is the want of one - the server works and
    reports nothing.

    The reconnaissance is made before the change and lies in seeing what systems the clients of
    this print server hold. The list of connections to the spooler speaks of the present moment,
    so it must be looked at over several days and not once.

    The change takes a fresh start of the print spooler, that is the breaking of jobs under way.

    The item is read together with its counterpart for outgoing connections. This one says by what
    this machine can be reached; that one, by what this machine reaches others.

implementation_consequences:
  impact_areas:
    - printing
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - Klient na systemie sprzed kilku wersji nie połączy się z udostępnioną tu drukarką
      - Zapora nieprzepuszczająca ruchu wydruku przez gniazda sieciowe zamknie drogę wszystkim
      - Po stronie klienta drukarka przestaje odpowiadać, a zadania stoją w kolejce
      - Po stronie serwera nie ma objawu, bo serwer działa i niczego nie zgłasza
      - Ponowne uruchomienie bufora przerywa zadania w toku
    en:
      - A client on a system several versions old will not connect to a printer shared here
      - A firewall not letting print traffic through over network sockets will shut the road to everyone
      - On the client's side the printer stops answering and jobs stand in the queue
      - On the server's side there is no symptom, the server working and reporting nothing
      - A fresh start of the spooler breaks jobs under way
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer udostępnia drukarki klientom na systemach sprzed kilku wersji
      - Zapora nie przepuszcza ruchu podsystemu druku przez gniazda sieciowe
    en:
      - The server shares printers with clients on systems several versions old
      - The firewall does not let the printing subsystem's traffic through over network sockets
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three means named pipes, five network sockets, seven both at once.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcProtocols'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'RpcProtocols'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcProtocols' -Value 5 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-rpc-connection-settings

notes:
  pl: |
    Nazwany potok jest udostępnieniem plikowym, więc polecenie do bufora
    wydruku idzie tym samym kanałem co dostęp do udziałów. Reguła zapory
    otwierająca pliki otwiera przy okazji bufor, a nadzór patrzący na
    ruch wydruku tego nie widzi.

    Na serwerze waży to, że serwer plików i serwer wydruku to bardzo
    często ta sama maszyna.

    Klasę podniosłem względem paczki stanowiska roboczego, bo zmiana
    odcina klientów, a nie siebie. Przed wdrożeniem sprawdź regułę
    zapory dla portu wydruku i systemy klientów.
  en: |
    A named pipe is a file share, so an order to the print spooler goes by the same channel as
    access to shares. A firewall rule opening files opens the spooler along the way, and watching
    that looks at print traffic does not see it.

    On a server what weighs is that a file server and a print server are very often the same
    machine.

    I raised the class against the working station's pack, the change cutting off clients and not
    itself. Before the rollout check the firewall rule for the print port and the clients'
    systems.
