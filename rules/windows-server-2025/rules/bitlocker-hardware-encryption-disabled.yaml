id: win2025-bitlocker-hardware-encryption-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Szyfrowanie realizowane przez dysk niedopuszczone
    en: Encryption performed by the drive itself inadmissible
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt zabrania powierzania szyfrowania samemu dyskowi. System ma
    szyfrować dane własnym mechanizmem, zamiast polegać na tym, który
    producent nośnika wbudował w jego elektronikę. Trzy wartości, jedna na
    klasę nośnika, wszystkie mają być wyłączone.

    Zostawiam kategorię wysoką i chcę powiedzieć, dlaczego tak wysoko przy
    regule, której nikt nie zauważy.

    Szyfrowanie realizowane przez dysk wygląda korzystnie, bo nic nie
    kosztuje: elektronika nośnika robi to sama, procesor maszyny nie bierze
    w tym udziału. Kłopot polega na tym, że nie da się sprawdzić, czy robi
    to dobrze. Implementacja jest zamknięta, tkwi w oprogramowaniu układowym
    dysku i nie podlega ani przeglądowi, ani poprawianiu z poziomu systemu.
    W praktyce wielokrotnie okazywało się, że niektóre nośniki wykonują to
    zadanie pozornie — klucz jest zapisany na dysku albo wyprowadzany
    w sposób, który nie wymaga niczego od osoby mającej nośnik w ręku.

    Najgorsze jest to, że różnicy nie widać. Dysk zgłasza się jako
    zaszyfrowany, system to potwierdza, raport jest zielony, a nośnik
    można odczytać. To jest właśnie ten przypadek, w którym zgodność
    z benchmarkiem i faktyczna ochrona rozchodzą się bez ostrzeżenia.

    Na serwerze rzecz waży więcej niż na stacji roboczej, bo to właśnie
    tam trafiają nośniki klasy serwerowej z własnym szyfrowaniem
    reklamowanym jako zaleta, i to właśnie tam leżą dane, dla których
    ktoś ten nośnik w ogóle szyfruje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nośnik
    raportowany jako zaszyfrowany, którego zawartość bywa dostępna bez
    znajomości jakiegokolwiek sekretu.
  en: |
    The item forbids entrusting the encryption to the drive itself. The
    system is to encrypt the data with its own mechanism rather than
    relying on the one the medium's maker built into its electronics. Three
    values, one per class of medium, all of which are to be off.

    I keep the category high, and I want to say why so high for a rule
    nobody will notice.

    Encryption performed by the drive looks attractive because it costs
    nothing: the medium's electronics do it themselves and the machine's
    processor takes no part. The trouble is that there is no way to check
    whether it does it well. The implementation is closed, it sits in the
    drive's firmware, and it is subject neither to review nor to correction
    from the system. In practice it has repeatedly turned out that some
    media perform the task only apparently - the key is stored on the disk
    or derived in a way that demands nothing of whoever holds the medium.

    The worst of it is that the difference is invisible. The drive reports
    itself as encrypted, the system confirms it, the report is green, and
    the medium can be read. This is exactly the case in which benchmark
    compliance and actual protection part company without warning.

    On a server the matter weighs more than on a workstation, because
    server-class media with their own encryption advertised as an advantage
    end up precisely there, and precisely there lies the data for which
    anybody encrypts that medium at all.

    What an attacker gains while the item goes unmet: a medium reported as
    encrypted whose contents are sometimes available without knowing any
    secret at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tu chcę podać powód, zamiast poprzestać na
    stwierdzeniu, że nic się nie stanie.

    Zmiana nie dotyka nośników już zaszyfrowanych. Dotyczy wyłącznie tego,
    jak zostanie zaszyfrowany nośnik, na którym ochrona jest dopiero
    zakładana. Żadna usługa nie traci dostępu, żaden wolumen się nie
    zamyka, nie ma restartu ani wylogowania, a cofnięcie wpisu przywraca
    poprzedni stan od razu.

    Jedyny mierzalny skutek jest wydajnościowy i dotyczy przyszłych
    nośników: szyfrowanie wykonuje odtąd procesor maszyny. Na serwerze
    z nowoczesnym procesorem to narzut, którego nie widać w żadnym
    codziennym pomiarze; sprzętowe wsparcie dla tego rodzaju działań jest
    obecne od kilkunastu lat. Piszę o tym nie dlatego, że to boli, tylko
    dlatego, że jest to jedyny argument, jaki pada po drugiej stronie —
    i warto wiedzieć, ile waży.

    Nikt tego nie zauważy w codziennej pracy i wolno to zastosować hurtem.
  en: |
    The class is "no disruption", and here too I want to give the reason
    rather than stop at saying nothing will happen.

    The change does not touch media already encrypted. It concerns only how
    a medium will be encrypted where protection is still being set up. No
    service loses access, no volume closes, there is no restart and no
    sign-out, and undoing the entry restores the previous state at once.

    The only measurable effect is on performance and concerns future media:
    from now on the machine's processor does the encrypting. On a server
    with a modern processor that is an overhead invisible in any everyday
    measurement; hardware support for this kind of work has been present
    for well over a decade. I write about it not because it hurts but
    because it is the only argument raised on the other side - and it is
    worth knowing how much it weighs.

    Nobody will notice this in daily work and it may be applied in bulk.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - drivers-and-devices
  what_breaks:
    pl:
      - Nic nie przestaje działać — zmiana dotyczy wyłącznie nośników, na których ochrona jest dopiero zakładana
      - Nośniki już zaszyfrowane zachowują to, czym zostały zaszyfrowane, także wtedy, gdy zrobił to sam dysk
      - Szyfrowanie przyszłych nośników wykonuje odtąd procesor maszyny, co na nowoczesnym sprzęcie jest narzutem niewidocznym w pomiarach
    en:
      - Nothing stops working - the change concerns only media where protection is still being set up
      - Media already encrypted keep what they were encrypted with, including where the drive itself did it
      - From now on the machine's processor encrypts future media, an overhead invisible in measurements on modern hardware
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje sprzęt bez wsparcia procesora dla tych działań, a obciążenie nośników jest krańcowo duże
      - Przyjęto rozwiązanie szyfrujące na poziomie macierzy, poddane osobnej ocenie i udokumentowane
    en:
      - The machine runs hardware with no processor support for this work and the load on the media is extreme
      - An array-level encryption solution has been adopted, separately assessed and documented
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. All three have to
      # be at zero, and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $names = @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $names) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne 0) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'ALL_DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_DISABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This governs media encrypted from now on. Media already protected by the
    # drive's own mechanism keep it and go on reporting themselves as
    # encrypted, so closing that gap means encrypting them afresh.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    foreach ($name in @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')) {
      Set-ItemProperty -Path $path -Name $name -Value 0 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła, której nikt nie zauważy, a kategoria wysoka — powód jest taki,
    że różnicy nie widać. Dysk zgłasza się jako zaszyfrowany, system to
    potwierdza, raport jest zielony, a nośnik można odczytać. Zgodność
    z benchmarkiem i faktyczna ochrona rozchodzą się tu bez ostrzeżenia.

    Implementacja tkwi w oprogramowaniu układowym dysku, jest zamknięta
    i nie podlega ani przeglądowi, ani poprawianiu z poziomu systemu.

    Jedyny argument po drugiej stronie jest wydajnościowy i na serwerze
    z nowoczesnym procesorem nie waży nic mierzalnego.
  en: |
    A rule nobody will notice, at a high category - the reason is that the
    difference is invisible. The drive reports itself as encrypted, the
    system confirms it, the report is green, and the medium can be read.
    Benchmark compliance and actual protection part company here without
    warning.

    The implementation sits in the drive's firmware, is closed, and is
    subject neither to review nor to correction from the system.

    The only argument on the other side is performance, and on a server
    with a modern processor it weighs nothing measurable.
