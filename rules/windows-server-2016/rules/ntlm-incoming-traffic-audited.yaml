id: win2016-ntlm-incoming-traffic-audited

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przychodzący ruch starszego mechanizmu uwierzytelniania rejestrowany
    en: Incoming traffic of the older authentication mechanism recorded
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zapisywać w dzienniku każde uwierzytelnienie przychodzące
    do tej maszyny starszym mechanizmem, zamiast przyjmować je bez śladu.

    Punkt niczego nie blokuje i nie należy go tak przedstawiać. Jest
    przygotowaniem do decyzji, której bez niego nie da się podjąć.

    Sytuacja wygląda tak. Starszy mechanizm uwierzytelniania jest na serwerze
    niepożądany: przenosi materiał podatny na przekazanie dalej, na
    odtworzenie hasła i na atak pośrednika. Każdy wie, że należałoby go
    wyłączyć. Nikt nie wie, co przez to przestanie działać — bo maszyna
    przyjmuje takie uwierzytelnienia bez żadnego zapisu, więc lista korzystających
    z nich nie istnieje.

    Ta reguła tę listę tworzy. Po miesiącu pracy w dzienniku znajduje się
    komplet: które konta, z których maszyn, do których zasobów. Dopiero na tej
    podstawie wyłączenie mechanizmu przestaje być skokiem w ciemno.

    Warto powiedzieć wprost, że sam zapis nie zmniejsza ryzyka. Zmniejsza je
    dopiero to, co się z nim zrobi. Reguła pozostawiona na lata bez wyciągnięcia
    wniosków jest kosztem bez zysku — i aplikacja powinna to mówić, zamiast
    zaliczać ją jako wygraną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    uwierzytelnienie starszym mechanizmem — także to przekazane z innej maszyny
    — nie zostawi na serwerze śladu, po którym dałoby się je rozpoznać.
  en: |
    The setting bids the log record every authentication coming in to this machine
    by the older mechanism, instead of taking them in without a trace.

    The item blocks nothing and should not be presented as though it did. It is a
    preparation for a decision that cannot be taken without it.

    The situation is this. The older authentication mechanism is unwanted on a
    server: it carries material open to being passed on, to a password being
    recovered, and to an attack from the middle. Everybody knows it ought to be
    switched off. Nobody knows what will stop working if it is - because the machine
    takes such authentications in without any record, so the list of those who use
    them does not exist.

    This rule makes that list. After a month's working the log holds the full set:
    which accounts, from which machines, to which resources. Only on that footing
    does switching the mechanism off cease to be a leap in the dark.

    It is worth saying outright that the recording itself lessens no risk. What
    lessens it is what is done with the recording. A rule left for years with no
    conclusions drawn is a cost without a gain - and the application should say so
    rather than counting it as a win.

    What an attacker gains while the item goes unmet: the certainty that an
    authentication by the older mechanism - one passed on from another machine
    included - will leave no trace on the server by which it might be recognised.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Ustawienie zapisuje i nic poza tym — żadne
    uwierzytelnienie nie zostaje odrzucone, żadne połączenie nie zostaje
    zerwane, żadna usługa nie zmienia zachowania.

    Jedyny koszt jest pojemnościowy i trzeba go policzyć przed zmianą, a nie
    po. Na serwerze plików albo serwerze wydruku takich uwierzytelnień bywa
    kilka tysięcy dziennie, a każde jest osobnym wpisem. Dziennik
    o domyślnym rozmiarze wypełnia się wtedy szybciej i zaczyna nadpisywać
    najstarsze wpisy — czyli dokładnie te, po które sięga się przy analizie.

    Drugi skutek dotyczy zbieracza dzienników. Nagły wzrost strumienia potrafi
    wypełnić przydział u odbiorcy albo przeciążyć łącze do niego.

    Obie rzeczy są przewidywalne i obie mają to samo rozwiązanie: najpierw
    pojemność dziennika, potem zapis. Ta kolejność jest tutaj regułą,
    nie sugestią.

    Czego to nie psuje: uwierzytelniania, dostępu do plików i wydruku, pracy
    usług ani wydajności maszyny w normalnym obciążeniu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The setting records and nothing besides - no
    authentication is refused, no connection severed, no service altered in its
    behaviour.

    The one cost is in capacity and has to be reckoned before the change rather than
    after. On a file or print server such authentications number some thousands a
    day, and each is a separate entry. A log of the default size then fills faster
    and begins overwriting the oldest entries - which is to say precisely those one
    reaches for when analysing.

    The second effect concerns the log collector. A sudden rise in the stream can
    fill the allowance at the receiving end or overload the link to it.

    Both are foreseeable and both have the same answer: the log's capacity first,
    then the recording. That order is a rule here, not a suggestion.

    What this does not break: authentication, access to files and printing, the
    working of services, or the machine's performance under normal load.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - logging-and-audit
    - file-sharing
    - printing
  what_breaks:
    pl:
      - Na serwerze plików albo wydruku przybywa kilka tysięcy wpisów dziennie i dziennik zabezpieczeń zapełnia się szybciej
      - Zbieracz dzienników dostaje większy strumień, co potrafi wypełnić przydział u odbiorcy albo przeciążyć łącze
      - Najstarsze wpisy zaczynają być nadpisywane wcześniej, czyli właśnie te, po które sięga się przy analizie
      - Uwierzytelnianie, dostęp do plików i wydruku oraz praca usług pozostają bez zmian
    en:
      - On a file or print server some thousands of entries a day are added and the security log fills faster
      - The log collector receives a larger stream, which can fill the allowance at the receiving end or overload the link
      - The oldest entries begin to be overwritten sooner - precisely those one reaches for when analysing
      - Authentication, access to files and printing and the working of services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono rozmiaru dziennika zabezpieczeń na tej maszynie ani jego zachowania przy przepełnieniu
      - Zbieracz dzienników pracuje na granicy przydziału albo przepustowości łącza do niego
    en:
      - The size of the security log on this machine and its behaviour on overflow have not been established
      - The log collector works at the edge of its allowance or of the link's capacity
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero records nothing, one records
      # accounts outside the domain, two records every account.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'AuditReceivingNTLMTraffic'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'AuditReceivingNTLMTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two records every account, not only those from outside the domain. The narrower
    # variant leaves out exactly the traffic that a present-day domain should no
    # longer be producing.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AuditReceivingNTLMTraffic' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-audit-incoming-ntlm-traffic

notes:
  pl: |
    Wartością wymaganą jest dwa, czyli zapis wszystkich kont, a nie tylko tych
    spoza domeny. Wariant węższy pomija dokładnie ten ruch, którego w dzisiejszej
    domenie nie powinno już być — a więc ten, o który w tym punkcie chodzi.

    Reguła jest środkiem do celu i aplikacja powinna to pokazywać. Właściwym
    zakończeniem pracy z tym punktem nie jest wynik zgodny, tylko przejrzenie
    zebranych wpisów i decyzja o ograniczeniu ruchu wychodzącego oraz
    przychodzącego. Punkt zgodny przez rok bez tej decyzji nic nie wnosi.

    Kolejność wdrożenia: najpierw pojemność dziennika zabezpieczeń, potem ten
    zapis. Odwrotna kolejność kończy się nadpisaniem zebranego materiału,
    zanim ktokolwiek zdąży go przejrzeć.
  en: |
    The required value is two - the recording of every account, not only of those
    from outside the domain. The narrower variant leaves out exactly the traffic a
    present-day domain should no longer be producing, and so the traffic this item
    is about.

    The rule is a means to an end and the application should show it as such. The
    proper end of working with this item is not a compliant result but a reading of
    the entries gathered and a decision on limiting outgoing and incoming traffic.
    The item compliant for a year without that decision brings nothing.

    The order of rollout: the security log's capacity first, then this recording.
    The reverse order ends with the gathered material overwritten before anybody
    manages to read it.
