id: win2016-automatic-updates-schedule-mode

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Aktualizacje pobierane i instalowane bez pytania użytkownika
    en: Updates fetched and installed without asking the user
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, w którym miejscu mechanizmu aktualizacji system
    zatrzymuje się i pyta człowieka.

    Wariantów jest kilka i różnią się momentem zatrzymania: przed
    pobraniem, po pobraniu a przed instalacją, albo wcale. Wartość wymagana
    wybiera ten ostatni — system pobiera, instaluje i restartuje się
    w wyznaczonym oknie, nie pytając nikogo.

    Na serwerze rozumowanie jest inne niż na stanowisku i warto je
    postawić wprost. Na stanowisku pytanie ma sens, bo przed ekranem siedzi
    ktoś, kto może odpowiedzieć. Na serwerze nie siedzi nikt, więc pytanie
    nie jest pytaniem — jest sposobem na zatrzymanie aktualizacji
    w nieskończoność.

    Stan ten jest przy tym gorszy od wyłączonych aktualizacji, bo wygląda
    lepiej. Maszyna pobrała poprawki, zgłasza je jako gotowe do
    zainstalowania i sprawia wrażenie zadbanej. Luka pozostaje otwarta,
    a raport wygląda spokojnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę,
    która ma poprawkę pobraną i niezainstalowaną, bo czeka na odpowiedź
    kogoś, kto nigdy nie zajrzy.
  en: |
    The setting settles at which point of the update mechanism the system stops and
    asks a person.

    There are several variants, differing in the moment of the stop: before the
    fetching, after the fetching but before the installing, or not at all. The
    required value picks the last - the system fetches, installs and restarts within
    the window set, asking nobody.

    On a server the reasoning differs from that at a workstation, and is worth
    putting outright. At a workstation the question makes sense, somebody sitting
    before the screen who can answer. On a server nobody sits there, so the question
    is not a question - it is a way of holding updates back without end.

    That state is besides worse than switched-off updates, because it looks better.
    The machine has fetched the fixes, reports them as ready to install, and gives
    the impression of being looked after. The gap stays open and the report looks
    calm.

    What an attacker gains while the item goes unmet: a machine with a fix fetched
    and not installed, waiting for an answer from somebody who will never look.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy ktoś tej maszyny
    faktycznie nie pilnuje ręcznie.

    Bywają środowiska, w których aktualizacje serwerów zatwierdza człowiek
    i robi to świadomie — najpierw na maszynie testowej, potem na
    produkcyjnej. Wdrożenie tego punktu odbiera taką kontrolę i jest wtedy
    zmianą procedury, a nie tylko ustawienia.

    Rozróżnienie jest istotne, bo sam wpis nie odróżnia procedury
    świadomej od zaniedbania. Maszyna czekająca na zatwierdzenie wygląda
    tak samo w obu przypadkach.

    Skutek drugi dotyczy tego, co się dzieje po instalacji. Punkt sam
    w sobie restartu nie wymusza — decyduje o tym reguła o wstrzymywaniu
    restartu przez zalogowanego i wyznaczone okno. Wdrożony bez nich daje
    maszynę, która instaluje poprawki i czeka z restartem, czyli stan
    połowiczny.

    Czego to nie psuje: usług, logowania, sieci, możliwości ręcznego
    sprawdzenia aktualizacji.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether somebody
    really does not watch this machine by hand.

    There are surroundings where a person approves servers' updates and does so
    deliberately - first on a test machine, then on a production one. Rolling this
    item out takes such control away and is then a change of procedure rather than
    of a setting alone.

    The distinction matters, since the entry itself does not tell a deliberate
    procedure from neglect. A machine waiting for approval looks the same in both
    cases.

    The second consequence concerns what happens after the installing. The item does
    not by itself force a restart - that is settled by the rule about a signed-in
    user holding the restart back, and by the window set. Rolled out without them it
    gives a machine that installs fixes and waits with the restart, which is to say
    a state half done.

    What this does not break: services, signing in, the network, or the ability to
    check for updates by hand.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Procedura, w której człowiek zatwierdza aktualizacje serwerów po sprawdzeniu ich na maszynie testowej, przestaje mieć zastosowanie
      - Poprawki instalują się bez zapowiedzi w wyznaczonym oknie, a nie w chwili wybranej przez administratora
      - Wdrożony bez reguły o restarcie daje maszynę instalującą poprawki i czekającą z restartem, czyli stan połowiczny
      - Usługi, logowanie, sieć i ręczne sprawdzanie aktualizacji pozostają bez zmian
    en:
      - A procedure where a person approves servers' updates after checking them on a test machine ceases to apply
      - Fixes install without warning within the window set, and not at a moment the administrator chose
      - Rolled out without the rule about the restart it gives a machine installing fixes and waiting with the restart, a state half done
      - Services, signing in, the network and the checking for updates by hand stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Aktualizacje tej maszyny przechodzą świadomą procedurę zatwierdzania po sprawdzeniu ich na maszynie testowej
      - Na maszynie pracuje oprogramowanie, którego dostawca dopuszcza wyłącznie wskazane poziomy poprawek
    en:
      - This machine's updates go through a deliberate approval procedure after being checked on a test machine
      - Software works on the machine whose supplier admits only named levels of fix
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'AUOptions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'AUOptions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AUOptions' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-wu-settings

notes:
  pl: |
    Punkt jest dobrym przykładem stanu pozornie zdrowego. Maszyna
    z poprawkami pobranymi i niezainstalowanymi wygląda w każdym
    zestawieniu lepiej niż maszyna z aktualizacjami wyłączonymi, a jest
    w tym samym miejscu: luka otwarta, poprawka niezastosowana.

    Aplikacja powinna mówić o tej różnicy wprost, bo jest to dokładnie ten
    rodzaj rozróżnienia, którego sam skaner nie zrobi.

    Punkt nie działa bez reguły poprzedniej i nie domyka tematu bez reguły
    o restarcie. Trzy razem opisują pełen cykl: wolno pobierać, wolno
    instalować bez pytania, wolno się zrestartować. Pominięcie którejkolwiek
    zostawia cykl przerwany w innym miejscu, a we wszystkich trzech
    przypadkach skutek jest ten sam — poprawka nie działa.
  en: |
    The item is a good example of a state healthy in appearance. A machine with
    fixes fetched and not installed looks better in any tally than a machine with
    updates switched off, and is in the same place: the gap open, the fix unapplied.

    The application should speak of that difference outright, it being exactly the
    kind of distinction a scanner on its own will not make.

    The item does not work without the previous rule and does not close the matter
    without the rule about the restart. The three together describe the full cycle:
    it may fetch, it may install without asking, it may restart. Leaving any one out
    breaks the cycle at a different place, and in all three cases the consequence is
    the same - the fix does not work.
