id: win2016-spooler-remote-rpc-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Zdalny punkt końcowy bufora wydruku wyłączony
    en: Remote endpoint of the print spooler disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zamyka sieciowy punkt końcowy bufora wydruku — czyli drogę,
    którą inne maszyny wydają tej maszynie polecenia dotyczące drukowania.

    Usługa bufora wydruku jest szczególna w systemie z dwóch powodów naraz.
    Po pierwsze działa z uprawnieniami najwyższymi, bo musi instalować
    sterowniki drukarek. Po drugie przyjmuje polecenia z sieci od maszyn,
    które nie muszą być niczym szczególnym uprawnione. Połączenie tych dwóch
    cech jest źródłem najpoważniejszych błędów, jakie znaleziono w tym
    systemie w ostatnich latach.

    Wzorzec był w nich powtarzalny i warto go nazwać, bo tłumaczy kategorię
    ryzyka. Polecenie zdalne kazało buforowi zainstalować sterownik. Bufor,
    działając z najwyższymi uprawnieniami, sięgał po wskazany plik
    i uruchamiał go. Napastnik uzyskiwał wykonanie kodu z uprawnieniami
    systemu, zdalnie, mając wyłącznie zwykłe konto — a na kontrolerze domeny
    oznaczało to przejęcie całej domeny.

    Zamknięcie punktu końcowego odcina wejście, a nie poszczególne błędy.
    Jest to różnica zasadnicza: poprawka zamyka jedną drogę znaną dziś, ta
    zmiana zamyka powierzchnię, na której znajdowano je wielokrotnie i na
    której znajdowane będą dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    z sieci do usługi działającej z najwyższymi uprawnieniami i instalującej
    sterowniki — czyli do powierzchni o udokumentowanej historii przejęć
    maszyny ze zwykłego konta.
  en: |
    The setting shuts the print spooler's network endpoint - which is to say the
    road by which other machines issue this machine commands concerning printing.

    The spooler service is peculiar in the system for two reasons at once. First it
    runs with the highest privileges, since it must install printer drivers. Second
    it takes commands from the network from machines that need hold no special
    privilege. The joining of those two traits is the source of the gravest faults
    found in this system in recent years.

    The pattern in them was repeatable and worth naming, since it explains the risk
    category. A remote command told the spooler to install a driver. The spooler,
    running with the highest privileges, reached for the file named and ran it. The
    attacker gained the running of code with the system's privileges, remotely,
    holding nothing but an ordinary account - and on a domain controller that meant
    the taking over of the whole domain.

    Shutting the endpoint cuts off the way in rather than the particular faults. The
    difference is fundamental: a fix shuts one road known today, this change shuts
    the surface on which such roads have been found many times and on which they
    will go on being found.

    What an attacker gains while the item goes unmet: access from the network to a
    service running with the highest privileges and installing drivers - which is to
    say to a surface with a documented history of machines being taken over from an
    ordinary account.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i pytanie rozstrzygające jest jedno:
    czy ta maszyna jest serwerem wydruku.

    Jeżeli jest — zmiana odcina jej rolę. Klienci przestają widzieć
    udostępnione kolejki, instalacja drukarki z tego serwera przestaje
    działać, przesyłanie zadań ustaje. Objaw obejmuje wszystkich naraz i jest
    natychmiastowy. Na takiej maszynie punktu nie wdraża się bez przeniesienia
    roli gdzie indziej; odpuszczenie go świadomie, z zapisanym uzasadnieniem,
    jest wtedy decyzją poprawną.

    Jeżeli nie jest — a większość serwerów nie jest — zmiana nie odbiera
    niczego, co ktokolwiek zauważy. Drukowanie z tej maszyny na drukarki
    sieciowe działa dalej, bo dotyczy ruchu wychodzącego, nie przychodzącego.
    To rozróżnienie jest tu najważniejsze i najczęściej mylone: reguła
    zamyka przyjmowanie poleceń, a nie wysyłanie zadań.

    Sprawdzić trzeba jeszcze dwie rzeczy mniej oczywiste. Czy maszyna nie
    udostępnia kolejki przypadkiem, w spadku po dawnym zastosowaniu — takie
    kolejki istnieją częściej, niż ktokolwiek zakłada. I czy nic nie
    instaluje na niej drukarek zdalnie w ramach wdrożeń.

    Czego to nie psuje: drukowania z tej maszyny na drukarki sieciowe
    i lokalne, drukowania w sesji pulpitu zdalnego, kolejek używanych
    miejscowo.

    Wymaga restartu usługi bufora wydruku.
  en: |
    The class is "needs a planned rollout", and the deciding question is one:
    whether this machine is a print server.

    If it is, the change cuts its role away. Clients cease to see the shared queues,
    installing a printer from this server stops working, the sending of jobs ceases.
    The symptom takes in everybody at once and is immediate. On such a machine the
    item is not rolled out without the role being moved elsewhere; letting it go
    deliberately, with the reasons recorded, is then the right decision.

    If it is not - and most servers are not - the change takes away nothing anybody
    will notice. Printing from this machine to network printers works on, since that
    concerns outgoing traffic rather than incoming. That distinction is the chief
    thing here and the one most often confused: the rule shuts the taking of
    commands, not the sending of jobs.

    Two less obvious things have to be checked besides. Whether the machine does not
    share a queue by accident, inherited from a former use - such queues exist more
    often than anybody assumes. And whether nothing installs printers on it remotely
    as part of rollouts.

    What this does not break: printing from this machine to network and local
    printers, printing in a remote desktop session, or queues used in place.

    Calls for the print spooler service to be restarted.

implementation_consequences:
  impact_areas:
    - printing
    - network-and-firewall
  what_breaks:
    pl:
      - Klienci przestają widzieć kolejki udostępnione przez tę maszynę, a instalacja drukarki z tego serwera przestaje działać
      - Kolejka udostępniona przypadkiem, w spadku po dawnym zastosowaniu, przestaje przyjmować zadania i nikt nie skojarzy tego ze zmianą
      - Wdrożenia instalujące drukarki na tej maszynie zdalnie przestają dochodzić do skutku
      - Drukowanie z tej maszyny na drukarki sieciowe i lokalne oraz drukowanie w sesji pulpitu zdalnego pozostają bez zmian
    en:
      - Clients cease to see the queues this machine shares, and installing a printer from this server stops working
      - A queue shared by accident, inherited from a former use, stops taking jobs and nobody will connect that with the change
      - Rollouts installing printers on this machine remotely cease to come about
      - Printing from this machine to network and local printers, and printing in a remote desktop session, stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę serwera wydruku i roli tej nie przeniesiono na inną maszynę
      - Drukarki instalowane są na tej maszynie zdalnie w ramach wdrożeń i nie wskazano innej drogi
      - Nie sprawdzono, czy maszyna nie udostępnia kolejki w spadku po dawnym zastosowaniu
    en:
      - The machine serves as a print server and that role has not been moved to another machine
      - Printers are installed on this machine remotely as part of rollouts and no other road has been named
      - It has not been checked whether the machine shares a queue inherited from a former use
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'RegisterSpoolerRemoteRpcEndPoint'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'RegisterSpoolerRemoteRpcEndPoint'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RegisterSpoolerRemoteRpcEndPoint' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/print-spooler-service-security-hardening

notes:
  pl: |
    Kategoria krytyczna wynika tu z kryterium, a nie z rozgłosu. Powierzchnia
    ta dała w ostatnich latach więcej niż jedną drogę do przejęcia maszyny
    z uprawnieniami systemu, zdalnie, ze zwykłego konta — a na kontrolerze
    domeny konsekwencją było przejęcie domeny. Zamknięcie wejścia jest
    mocniejsze niż nadążanie za poprawkami.

    Wpis, na którym ta reguła stoi, pojawił się w systemie wraz z utwardzeniem
    bufora wydruku wydanym po tamtych zdarzeniach. Na maszynie bez
    aktualizacji z tego okresu ustawienie zostanie zapisane, ale nie
    przyniesie skutku — warto to sprawdzić przed przypisaniem punktowi
    statusu spełnionego.

    Rozróżnienie ruchu przychodzącego od wychodzącego powinno stać
    w interfejsie przy tym punkcie. Obawa, że „przestanie działać
    drukowanie", jest pierwszą reakcją na tę regułę i w większości
    przypadków nieuzasadnioną — a nieodpowiedziana zamienia się w odłożenie
    zmiany o kwartał.
  en: |
    The critical category follows here from the criterion rather than from
    notoriety. In recent years this surface has given more than one road to taking
    over a machine with the system's privileges, remotely, from an ordinary account
    - and on a domain controller the consequence was the taking over of the domain.
    Shutting the way in is stronger than keeping up with fixes.

    The entry this rule rests on came into the system along with the spooler
    hardening released after those events. On a machine without updates from that
    period the setting will be written but will bring no effect - worth checking
    before the item is given the status of satisfied.

    The telling apart of incoming from outgoing traffic should stand in the
    interface at this item. The fear that "printing will stop working" is the first
    reaction to this rule and in most cases groundless - and left unanswered it
    turns into the change being put off by a quarter.
