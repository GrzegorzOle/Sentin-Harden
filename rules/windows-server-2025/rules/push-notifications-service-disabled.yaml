id: win2025-push-notifications-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa powiadomień wypychanych z sieci wyłączona
    en: The service for notifications pushed from the network disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przyjmującą powiadomienia wypychane z sieci.
    Usługa ta utrzymuje stałe połączenie z siecią powiadomień producenta
    i pokazuje to, co przez nie przyjdzie.

    Zostawiam kategorię średnią, ale wyznacza ją co innego niż na stacji
    roboczej. Tam rzecz dotyczy głównie tego, co użytkownik zobaczy na
    ekranie. Tutaj ekranu nie ma, więc zostaje sam kanał — a kanał jest
    tym, co warto obejrzeć.

    Jest to stałe połączenie wychodzące, utrzymywane bez przerwy,
    nawiązywane przez system i traktowane przez otoczenie jako ruch
    normalny, bo taki jest. Kanałem tym przychodzą dane z zewnątrz, które
    maszyna przyjmuje bez niczyjej decyzji. Na serwerze, gdzie ruch
    wychodzący powinien dać się wyliczyć i uzasadnić, stałe połączenie
    utrzymywane po to, żeby pokazywać komunikaty nikomu, jest ruchem bez
    uzasadnienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: stały,
    uznawany za normalny kanał wychodzący z serwera, którym przychodzą
    dane przyjmowane bez niczyjej decyzji.
  en: |
    The item switches off the service that takes in tidings pushed from the net. That service keeps a
    standing binding to the maker's net of tidings and shows what comes through it.

    I leave the category middling, but what marks it out is other than upon a workstation. There the
    thing bears mostly upon what a person will see on the screen. Here there is no screen, so there is
    left the channel alone - and the channel is what is worth looking at.

    It is a standing binding going out, kept up without break, set up by the system and taken by its
    surroundings for common traffic, such being what it is. By that channel there come data from
    without that the machine takes in with nobody's deciding. Upon a server, whereon the traffic going
    out ought to be reckoned up and stood by, a standing binding kept up that messages might be shown
    to nobody is traffic with nothing to stand by it.

    What an attacker gains while the item goes unmet - a standing channel out of the server, held for
    common, whereby there come data taken in with nobody's deciding.

disruption_description:
  pl: |
    Obniżam klasę ze świadomego wdrożenia do „wymaga sprawdzenia" i jest
    to obniżenie oparte wprost na różnicy między stacją a serwerem, więc
    wyłożę je dokładnie.

    Na stacji roboczej zabranie wszystkich powiadomień naraz jest zmianą
    sposobu pracy człowieka i dlatego zasługuje tam na najwyższą klasę.
    Ostrzeżenia oprogramowania ochronnego, przypomnienia, komunikaty
    aplikacji — wszystko to przestaje docierać do osoby, która na to
    patrzy. Na serwerze nikt nie patrzy. Powiadomienie pokazane
    w sesji, do której nikt nie jest zalogowany, nie jest kanałem
    informacji, tylko rysunkiem na pustym ekranie.

    Uwaga producenta o ostrzeżeniach oprogramowania ochronnego zachowuje
    jednak sens także tutaj i nie chcę jej skreślać bez sprawdzenia —
    dlatego klasa nie schodzi do „bez uciążliwości". Trzeba spojrzeć na
    jedno: czy cokolwiek z zainstalowanych narzędzi zarządzania albo
    ochrony zgłasza cokolwiek wyłącznie tą drogą. Odpowiedź brzmi
    zwykle „nie, bo raportuje do swojej konsoli", i wtedy zmiana jest
    czysta. Jeżeli brzmi inaczej, to samo w sobie jest ustaleniem wartym
    zapisania, bo ochrona zgłaszająca się wyłącznie na ekran serwera nie
    zgłasza się nigdzie.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class from a witting rolling out to "needs a checking", and it is a lowering resting
    outright upon the difference between a workstation and a server, so I shall set it out at length.

    Upon a workstation the taking away of all tidings at once is an altering of a person's way of
    working and therefore earns there the highest class. The warnings of software of warding, the
    remindings, the messages of applications - all of that stops coming to the person who looks upon
    it. Upon a server nobody looks. A tiding shown within a sitting whereto nobody is signed in is no
    channel of knowing but a drawing upon an empty screen.

    The maker's note of the warnings of software of warding keeps its sense here for all that, and I
    would not strike it out without a checking - and therefore the class goes not down to "no unease".
    One thing must be looked to - whether anything of the installed tools of ruling or of warding
    gives word of anything by that road alone. The answer runs mostly "no, it reports to its own
    board", and then the change is clean. If it run otherwise, that in itself is a settling worth
    writing down, a warding that gives word upon the server's screen alone giving word nowhere.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - user-interface
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Przestają docierać wszystkie powiadomienia naraz, w tym ostrzeżenia oprogramowania ochronnego
      - Na serwerze powiadomienie pokazane w sesji, do której nikt nie jest zalogowany, nie jest kanałem informacji
      - Narzędzie zgłaszające coś wyłącznie tą drogą traci jedyny sposób odezwania się
      - Ochrona zgłaszająca się wyłącznie na ekran serwera nie zgłasza się nigdzie, co samo w sobie warto zapisać
      - Stałe połączenie wychodzące do sieci powiadomień producenta znika
    en:
      - All tidings stop coming at once, among them the warnings of software of warding
      - Upon a server a tiding shown within a sitting whereto nobody is signed in is no channel of knowing
      - A tool that gives word of anything by that road alone loses its one way of speaking up
      - A warding that gives word upon the server's screen alone gives word nowhere, which in itself is worth writing down
      - The standing binding going out to the maker's net of tidings goes away
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Zainstalowane narzędzie zarządzania albo ochrony zgłasza cokolwiek wyłącznie tą drogą
    en:
      - An installed tool of ruling or of warding gives word of anything by that road alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service takes away every notification at once, warnings from
    # protective software among them. On a server check first that nothing
    # reports solely this way - a warning shown to an empty screen is no report.
    Stop-Service -Name 'WpnService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WpnService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WpnService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/design/shell/tiles-and-notifications/windows-push-notification-services--wns--overview

notes:
  pl: |
    Kategorię wyznacza co innego niż na stacji roboczej. Tam rzecz
    dotyczy głównie tego, co użytkownik zobaczy. Tutaj ekranu nie ma,
    więc zostaje sam kanał — stałe połączenie wychodzące, utrzymywane bez
    przerwy i traktowane przez otoczenie jako ruch normalny.

    Klasa obniżona wprost z różnicy między stacją a serwerem: zabranie
    wszystkich powiadomień jest zmianą sposobu pracy człowieka, a na
    serwerze nikt nie patrzy. Powiadomienie pokazane w sesji, do której
    nikt nie jest zalogowany, nie jest kanałem informacji.

    Nie schodzę do „bez uciążliwości", bo uwaga o ostrzeżeniach
    oprogramowania ochronnego zachowuje sens — a ochrona zgłaszająca się
    wyłącznie na ekran serwera nie zgłasza się nigdzie.
  en: |
    What marks the category out is other than upon a workstation. There the thing bears mostly upon
    what a person will see. Here there is no screen, so there is left the channel alone - a standing
    binding going out, kept up without break and taken by its surroundings for common traffic.

    The class is lowered outright out of the difference between a workstation and a server - the
    taking away of all tidings is an altering of a person's way of working, and upon a server nobody
    looks. A tiding shown within a sitting whereto nobody is signed in is no channel of knowing.

    I go not down to "no unease", the note of the warnings of software of warding keeping its sense -
    and a warding that gives word upon the server's screen alone gives word nowhere.
