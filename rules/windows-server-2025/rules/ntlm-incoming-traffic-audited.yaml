id: win2025-ntlm-incoming-traffic-audited

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przychodzący ruch starszego mechanizmu uwierzytelniania rejestrowany
    en: Incoming traffic of the older authentication mechanism recorded
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy mechanizm uwierzytelniania sieciowego jest w tym systemie
    wciąż obecny i wciąż używany, choć od dawna ma następcę. Jest słabszy
    w sposób nieusuwalny: poświadczenia przesyłane tą drogą dają się
    przekazać dalej i użyć wobec innej maszyny, a przechwycone — łamać
    poza siecią, bez limitu prób.

    Wyłączenie go byłoby rozwiązaniem właściwym i dla wielu maszyn jest
    osiągalne. Nie da się jednak tego zrobić na ślepo: w każdej sieci
    zostaje coś, co innego mechanizmu nie umie.

    Na serwerze pytanie to jest trudniejsze niż na stanowisku roboczym,
    bo serwer jest stroną przyjmującą. Łączą się z nim urządzenia,
    których nikt nie inwentaryzował: drukarki sieciowe, skanery
    zapisujące na udziale, sterowniki maszyn, oprogramowanie sprzed lat
    i konta usługowe, o których wiedział jeden człowiek. Wyłączenie
    mechanizmu bez wykazu odetnie część z nich naraz.

    Ten punkt zbiera właśnie ten wykaz. Nie zmienia zachowania —
    zapisuje, kto się tą drogą uwierzytelnia, skąd i na jakim koncie.
    Dopiero taki wykaz czyni decyzję o wyłączeniu możliwą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność,
    że korzystanie ze słabszego mechanizmu wobec tego serwera nie zostawia
    śladu poddającego się przejrzeniu.
  en: |
    The older mechanism of network authentication is in this system still present and still
    used, though it has long had a successor. It is weaker in a way past mending: credentials
    sent this road can be passed on and used against another machine, and caught, broken off
    the network with no limit of tries.

    Switching it off would be the right answer and for many machines is within reach. It
    cannot be done blind, though: in every network something remains that knows no other
    mechanism.

    On a server that question is harder than at a working station, since the server is the
    taking side. Devices connect to it that nobody has ever inventoried: network printers,
    scanners writing to a share, machine controllers, software from years back and service
    accounts one person knew of. Switching the mechanism off without a list would cut some of
    them off at once.

    This item gathers that very list. It changes no behaviour - it records who authenticates
    by this road, whence and under what account. Only such a list makes a decision about
    switching off possible.

    What an attacker gains while the item goes unmet: the certainty that using the weaker
    mechanism against this server leaves no trace open to review.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie przestaje działać i nikt niczego nie zauważy. Uwierzytelnianie
    przebiega tak samo jak wcześniej — zmienia się wyłącznie to, że
    zostaje zapisane.

    Jedynym kosztem jest objętość. Na serwerze plików albo kontrolerze
    domeny, gdzie połączeń jest dużo, dziennik operacyjny potrafi
    przyrastać szybko, a przy rozmiarze domyślnym starsze wpisy zaczną
    być wypierane w ciągu dni. Sam w sobie nie jest to błąd, ale wykaz
    zbierany po to, żeby go przejrzeć, traci wtedy początek.

    Praktyczna kolejność jest więc taka: najpierw powiększyć dziennik
    albo skierować zdarzenia poza maszynę, potem włączyć rejestrowanie.
    Inaczej po miesiącu widać ostatni tydzień.

    Zmiana nie wymaga restartu i działa od razu.
  en: |
    The change has no known side effects and takes no break.

    Nothing stops working and nobody notices anything. Authentication runs just as before -
    what changes is only that it gets recorded.

    The one cost is volume. On a file server or a domain controller, where connections are
    many, the operational log can grow fast, and at the default size older entries will start
    being crowded out within days. That is no fault in itself, but a list gathered so as to be
    looked through then loses its beginning.

    The practical order is thus: first enlarge the log or send events off the machine, then
    switch the recording on. Otherwise after a month what shows is the last week.

    The change takes no restart and works at once.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - logging-and-audit
    - file-sharing
    - printing
  what_breaks:
    pl:
      - Brak znanych regresji — uwierzytelnianie przebiega tak samo jak wcześniej
      - Dziennik operacyjny przyrasta szybko na serwerze plików i na kontrolerze domeny
      - Przy rozmiarze domyślnym początek zbieranego wykazu zostaje wyparty w ciągu dni
      - Zmiana działa od razu i nie wymaga ponownego uruchomienia maszyny
    en:
      - No known regressions - authentication runs just as before
      - The operational log grows fast on a file server and on a domain controller
      - At the default size the beginning of the gathered list is crowded out within days
      - The change works at once and takes no starting the machine again
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik operacyjny ma rozmiar domyślny i nikt nie zamierza go powiększyć przed zbieraniem wykazu
    en:
      - The operational log is of default size and nobody means to enlarge it before the list is gathered
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero records nothing, one records
      # accounts outside the domain, two records every account.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'AuditReceivingNTLMTraffic'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'AuditReceivingNTLMTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AuditReceivingNTLMTraffic' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-audit-incoming-ntlm-traffic

notes:
  pl: |
    Wymagana jest wartość obejmująca wszystkie konta. Wariant węższy
    pomija konta domenowe, a na serwerze to właśnie one odpowiadają za
    większość połączeń, więc wykaz zebrany w ten sposób nie nadaje się
    do podjęcia decyzji.

    Punkt jest przygotowaniem, nie zabezpieczeniem. Wartość pojawia się
    dopiero wtedy, gdy ktoś zebrany wykaz przeczyta — sam zapis niczego
    nie zamyka.

    Punkt czyta się razem z ograniczeniem ruchu wychodzącego oraz
    z rozmiarem dziennika operacyjnego. Ten ostatni przesądza, jak długi
    okres da się z tego wykazu odtworzyć.
  en: |
    The value taking in every account is what is asked. The narrower variant passes over
    domain accounts, and on a server it is those that answer for most connections, so a list
    gathered that way does not serve for taking a decision.

    The item is a preparing rather than a safeguard. Its worth appears only once somebody
    reads the gathered list - the record alone shuts nothing.

    The item is read together with the restriction of outgoing traffic and with the
    operational log's size. The latter settles how long a stretch can be pieced back from
    that list.
