id: win2016-sehop-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Sprawdzanie łańcucha obsługi wyjątków włączone
    en: Checking of the exception handling chain switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi sprawdzać spójność listy procedur
    obsługujących błędy programu, zanim którąkolwiek z nich wywoła.

    Program spodziewający się błędu zostawia w pamięci listę adresów: gdzie
    skoczyć, gdy coś pójdzie nie tak. Lista ta leży na stosie, czyli
    w miejscu, w którym leżą też dane, jakie program właśnie przetwarza.

    Stąd bierze się cała rzecz. Napastnik, który potrafi zapisać na stosie
    więcej, niż program przewidział, nadpisuje tę listę i wskazuje własny
    adres. Nie musi potem nic uruchamiać — wystarczy doprowadzić do błędu,
    a system sam skoczy tam, gdzie mu wskazano.

    Sprawdzanie łańcucha zamyka tę drogę bez znajomości programu. System
    przechodzi listę przed skokiem i upewnia się, że prowadzi ona tam, gdzie
    prowadzić powinna, a kończy się we właściwym miejscu. Lista nadpisana
    tego nie przechodzi i program zostaje zakończony.

    Mechanizm chroni wszystko, co na maszynie działa, także programy
    zbudowane dawno i bez własnych zabezpieczeń. Jest to jedna z niewielu
    ochron, które nie wymagają niczego od chronionego programu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    własnego kodu przez nadpisanie listy procedur obsługi błędu — drogę
    działającą także na programach, których nikt nie aktualizował od lat.
  en: |
    The setting has the system check the soundness of the list of procedures handling
    a program's errors before it calls any of them.

    A program expecting an error leaves a list of addresses in memory: where to jump
    when something goes wrong. That list lies on the stack, which is to say in the
    place where the data the program is working on lies too.

    Thence comes the whole matter. An attacker able to write more on the stack than
    the program foresaw overwrites that list and names an address of their own. They
    then need start nothing - it is enough to bring about an error, and the system
    will jump itself to where it was pointed.

    Checking the chain shuts that road without any knowledge of the program. The
    system goes through the list before the jump and makes sure it leads where it
    should and ends in the right place. An overwritten list does not pass that and
    the program is stopped.

    The mechanism guards everything working on the machine, programs built long ago
    and without safeguards of their own included. It is one of the few protections
    calling for nothing from the program it guards.

    What an attacker gains while the item goes unmet: the running of their own code
    by overwriting the list of error handling procedures - a road working also on
    programs nobody has updated for years.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na maszynie pracuje
    coś, co obsługę błędów buduje po swojemu.

    Wartość wymagana jest wartością domyślną tego wydania systemu, więc na
    przeważającej części maszyn wdrożenie niczego nie zmienia. Rzecz dotyczy
    maszyn, na których wpis przestawiono — a robi się to z jednego powodu:
    mechanizm coś zatrzymał.

    Zatrzymuje zaś dwie rodziny oprogramowania. Pierwsza to środowiska
    uruchomieniowe budujące kod w czasie działania — starsze maszyny
    wirtualne języków, kompilatory pracujące w locie, silniki skryptowe.
    Bywa, że tworzą one listę obsługi błędów w sposób, którego sprawdzenie
    nie uznaje. Druga to bardzo stare oprogramowanie kompilowane narzędziami
    sprzed wprowadzenia mechanizmu.

    Objaw jest jednoznaczny i natychmiastowy: program kończy pracę przy
    pierwszym błędzie, który miałby obsłużyć. Nie ma tu stanów pośrednich.

    Zmiana wymaga restartu, bo ustawienie czytane jest przy starcie systemu.
    Do czasu restartu raport pokaże zgodność, a system będzie pracował
    po staremu.

    Czego to nie psuje: pracy z plikami, sieci, logowania, usług
    systemowych.
  en: |
    The class is "needs review", and what has to be checked is whether anything works
    on the machine that builds error handling in its own way.

    The required value is this release's default, so on the greater part of machines
    the rollout changes nothing. The matter concerns machines where the entry was
    moved - and that is done for one reason: the mechanism stopped something.

    And it stops two families of software. The first is runtimes building code as
    they run - older virtual machines of languages, compilers working on the fly,
    scripting engines. At times they make the list of error handling in a way the
    check does not accept. The second is very old software compiled with tools from
    before the mechanism was brought in.

    The symptom is unambiguous and immediate: the program stops at the first error it
    was to handle. There are no middle states here.

    The change calls for a restart, the setting being read as the system starts.
    Until the restart the report will show compliance and the system will work in the
    old way.

    What this does not break: work with files, the network, signing in, or system
    services.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - drivers-and-devices
  what_breaks:
    pl:
      - Środowiska uruchomieniowe budujące kod w czasie działania mogą tworzyć listę obsługi błędów w sposób, którego sprawdzenie nie uznaje
      - Bardzo stare oprogramowanie kompilowane narzędziami sprzed wprowadzenia mechanizmu może przestać działać
      - Objaw jest natychmiastowy - program kończy pracę przy pierwszym błędzie, który miałby obsłużyć
      - Do czasu restartu raport pokaże zgodność, a system będzie pracował po staremu
    en:
      - Runtimes building code as they run may make the list of error handling in a way the check does not accept
      - Very old software compiled with tools from before the mechanism was brought in may stop working
      - The symptom is immediate - the program stops at the first error it was to handle
      - Until the restart the report will show compliance and the system will work in the old way
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Wpis przestawiono po to, żeby zadziałało środowisko uruchomieniowe albo stara aplikacja, której nie da się zastąpić
      - Nie da się wyznaczyć okna na restart maszyny, a bez restartu zmiana i tak nie zacznie obowiązywać
    en:
      - The entry was moved to make a runtime or an old application work that cannot be replaced
      - No window can be set for restarting the machine, and without a restart the change will not begin to hold anyway
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is written the other way round than it reads: zero means the
      # check is on. An absent value leaves the system default, which is the
      # check being on, but the item calls for the state to be written down, so
      # the absence is reported apart.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
      $name = 'DisableExceptionChainValidation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
    $name = 'DisableExceptionChainValidation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is written the other way round than it reads - zero means the
    # check is on.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableExceptionChainValidation' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server

notes:
  pl: |
    Punkt jest najmocniejszy z czterech dotyczących pamięci i warto
    powiedzieć dlaczego. Pozostałe trzy chronią jeden proces albo jedną
    rodzinę zachowań. Ten działa na wszystkim, co na maszynie startuje,
    i nie wymaga niczego od chronionego programu.

    Wartość wymagana jest zerem, bo nazwa wpisu opisuje wyłączenie
    sprawdzania. Jest to kolejny punkt, w którym intuicja podpowiada
    kierunek odwrotny do właściwego, i warto to nazwać w raporcie.

    Brak wpisu jest zgłaszany osobno, a nie jako zgodność. Stan domyślny
    tego wydania odpowiada wymaganiu, ale zalecenie mówi o stanie zapisanym —
    a wpis zapisany jest odporny na zmianę wartości domyślnej przy
    aktualizacji albo migracji.
  en: |
    The item is the strongest of the four concerning memory, and it is worth saying
    why. The other three guard one process or one family of behaviours. This one
    works on everything that starts on the machine and calls for nothing from the
    program it guards.

    The required value is zero, the entry's name describing the switching off of the
    check. It is another item where intuition suggests the direction opposite to the
    right one, and that is worth naming in the report.

    An absent entry is reported apart rather than as compliance. This release's
    default answers the requirement, but the recommendation speaks of a state written
    down - and an entry written down withstands a change of default at an update or a
    migration.
