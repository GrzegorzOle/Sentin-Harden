id: win2025-undock-without-logon-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyjęcie maszyny ze stacji dokującej bez zalogowania zabronione
    en: Taking the machine out of a docking station without signing in forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie żąda zalogowania się przed wyjęciem maszyny ze stacji
    dokującej, zamiast pozwalać na to z ekranu logowania.

    Punkt chroni przed zabraniem komputera przenośnego z biurka przez
    osobę, która nie umie się na nim zalogować. Bez tego ustawienia
    wystarczy nacisnąć przycisk zwolnienia blokady, żeby maszyna
    rozłączyła się ze stacją i dała się wynieść.

    Na serwerze punkt ten jest bezprzedmiotowy i nie ma powodu udawać,
    że jest inaczej. Serwery nie stoją w stacjach dokujących. Sprzęt
    serwerowy nie ma takiego złącza, a maszyna wirtualna nie ma go tym
    bardziej.

    Zostawiam regułę w paczce z jednego powodu: punkt nieoceniony i punkt
    oceniony jako nieszkodliwy to nie to samo. Reguła usunięta z paczki
    znika z raportu bez wyjaśnienia, a reguła obecna z oceną niską mówi
    czytelnikowi, że ktoś na to spojrzał i uznał za bez znaczenia w tej
    roli. Jest to informacja, a nie szum.

    Zastosowanie jest jedno i rzadkie: stanowisko przenośne pracujące
    z systemem serwerowym, spotykane w laboratoriach, przy pokazach
    i w zestawach warsztatowych. Tam punkt działa dokładnie tak jak na
    stanowisku roboczym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    typowym serwerze nic. Na maszynie przenośnej — możliwość wyjęcia jej
    ze stacji bez logowania i wyniesienia wraz z dyskiem.
  en: |
    The setting demands a signing in before the machine is taken out of a docking station,
    instead of allowing it from the sign-in screen.

    The item shields against the carrying off of a portable computer from a desk by someone who
    cannot sign in on it. Without the setting it is enough to press the release button for the
    machine to part from the station and let itself be carried away.

    On a server the item is moot and there is no reason to pretend otherwise. Servers do not
    stand in docking stations. Server hardware bears no such socket, and a virtual machine bears
    one still less.

    I leave the rule in the pack for one reason: an item unassessed and an item assessed as
    harmless are not the same. A rule taken out of the pack goes from the report unexplained,
    while a rule present with a low rating tells the reader that somebody looked at it and held
    it of no meaning in this part. That is information rather than noise.

    There is one use, and a rare one: a portable station working with a server system, met with
    in laboratories, at demonstrations and in workshop sets. There the item works exactly as at a
    working station.

    What an attacker gains while the item goes unmet: on a typical server nothing. On a portable
    machine - the means of taking it out of the station without signing in and carrying it off
    along with the disk.

disruption_description:
  pl: |
    Nikt tego nie zauważy. Na sprzęcie serwerowym i na maszynie
    wirtualnej zmiana nie ma czego dotknąć, bo złącza stacji dokującej
    tam nie ma.

    Zaliczyłem punkt do klasy bez uciążliwości i obniżyłem go względem
    paczki stanowiska roboczego, gdzie wymagał sprawdzenia. Powód jest
    prosty i wart powiedzenia wprost: na stanowisku roboczym istniał
    przypadek do sprawdzenia — komputer przenośny wyjmowany ze stacji
    przez osobę bez konta. Na serwerze taki przypadek nie występuje,
    więc podtrzymywanie ostrzeżenia byłoby ostrożnością pozorną, która
    uczy czytelnika pomijać ostrzeżenia.

    Jedyne odstępstwo dotyczy stanowiska przenośnego pracującego
    z systemem serwerowym. Tam po zmianie wyjęcie ze stacji wymaga
    zalogowania — co jest dokładnie tym, o co w tym punkcie chodzi.

    Zmiana nie dotyczy odłączania urządzeń, dysków zewnętrznych ani
    kart rozszerzeń. Mowa wyłącznie o złączu stacji dokującej.

    Zmiana nie wymaga przerwy, wchodzi w życie natychmiast i cofa się
    natychmiast.
  en: |
    Nobody will mark it. On server hardware and on a virtual machine the change has nothing to
    touch, the docking station's socket not being there.

    I counted the item in the class without disruption and lowered it against the working
    station's pack, where it took a check. The reason is plain and worth saying outright: at a
    working station there was a case to be checked - a portable computer taken out of a station
    by someone without an account. On a server no such case arises, so the keeping up of the
    warning would be a seeming carefulness, which teaches the reader to pass warnings by.

    The one exception bears on a portable station working with a server system. There, after the
    change, a taking out of the station takes a signing in - which is exactly what this item is
    about.

    The change does not bear on the unplugging of devices, outside disks or expansion cards.
    What is spoken of is the docking station's socket alone.

    The change takes no break, comes into force at once and is undone at once.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Na sprzęcie serwerowym i na maszynie wirtualnej zmiana nie ma czego dotknąć
      - Na stanowisku przenośnym z systemem serwerowym wyjęcie ze stacji zażąda zalogowania
      - Odłączanie urządzeń, dysków zewnętrznych i kart rozszerzeń pozostaje bez zmiany
    en:
      - On server hardware and on a virtual machine the change has nothing to touch
      - On a portable station with a server system a taking out of the dock will demand a signing in
      - The unplugging of devices, outside disks and expansion cards stays unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - System serwerowy pracuje na maszynie przenośnej wyjmowanej ze stacji przez osobę bez konta na niej
    en:
      - The server system works on a portable machine taken out of a dock by someone without an account on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'UndockWithoutLogon'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'UndockWithoutLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'UndockWithoutLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/devices-allow-undock-without-having-to-log-on

notes:
  pl: |
    Punkt obniżyłem względem paczki stanowiska roboczego z klasy
    wymagającej sprawdzenia do klasy bez uciążliwości. Na serwerze
    przypadek, dla którego tamto ostrzeżenie istniało, nie występuje.

    Regułę zostawiam w paczce mimo bezprzedmiotowości, bo punkt
    nieoceniony i punkt oceniony jako nieszkodliwy to nie to samo.
    Reguła obecna z oceną niską mówi, że ktoś na to spojrzał.

    Czytaj razem z prawem wyjmowania maszyny ze stacji dokującej,
    ocenionym w tej paczce tak samo i z tego samego powodu.
  en: |
    I lowered the item against the working station's pack from the class taking a check to the
    class without disruption. On a server the case that warning stood for does not arise.

    I leave the rule in the pack despite its being moot, an item unassessed and an item assessed
    as harmless not being the same. A rule present with a low rating says that somebody looked at
    it.

    Read together with the right of taking the machine out of a docking station, rated the same
    in this pack and for the same reason.
