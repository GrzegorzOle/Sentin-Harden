id: win2016-lan-manager-auth-level

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Poziom uwierzytelniania menedżera sieci ustawiony najwyżej
    en: Network manager authentication level set at its highest
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustawia najwyższy poziom uwierzytelniania sieciowego: maszyna
    wysyła wyłącznie odpowiedzi w wersji najnowszej i odrzuca przyjmowanie
    wersji starszych.

    Kategoria krytyczna, bo ten jeden wpis rozstrzyga o tym, czym maszyna
    posługuje się przy uwierzytelnianiu w sieci. Wersje starsze tego
    mechanizmu powstały, zanim przechwytywanie ruchu stało się czymś
    zwyczajnym. Odpowiedź w wersji najstarszej daje się przechwycić
    i przeliczyć na hasło w czasie, który nie jest przeszkodą; wersja średnia
    jest lepsza, ale wciąż daje się użyć ponownie w sposób, na który nie ma
    naprawy.

    Rzecz w tym, że o wyborze wersji nie decyduje maszyna silniejsza, tylko
    słabsza. Serwer, który dopuszcza wersje starsze, będzie ich używał
    wtedy, gdy poprosi o to druga strona — a napastnik jest zawsze tą drugą
    stroną, która prosi. Dlatego dopuszczenie starszej wersji jest
    równoznaczne z jej używaniem.

    Na serwerze 2016 punkt ma szczególną wagę, bo domyślne ustawienie tego
    wydania wciąż jest łagodne, a maszyna tego rocznika bywa jedyną
    w instalacji, która starszy mechanizm w ogóle jeszcze dopuszcza. Wtedy
    właśnie przez nią idzie wszystko, co chce rozmawiać po staremu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wymuszenia na maszynie rozmowy mechanizmem, z którego da się odtworzyć
    hasło albo użyć odpowiedzi ponownie wobec innej maszyny.
  en: |
    The item sets the highest level of network authentication: the machine
    sends only responses of the newest kind and refuses to accept older ones.

    The category is critical, because this single entry settles what the machine
    uses when authenticating over the network. The older versions of this
    mechanism were made before intercepting traffic became an ordinary thing. A
    response of the oldest kind can be intercepted and turned back into a
    password in a time that is no obstacle; the middle version is better but can
    still be replayed in a way for which there is no repair.

    The point is that the choice of version is not made by the stronger machine
    but by the weaker one. A server that permits older versions will use them
    whenever the other side asks - and an attacker is always that other side
    asking. Permitting an older version therefore amounts to using it.

    On Server 2016 the item carries particular weight, because this release's
    default is still a lenient one, and a machine of this vintage is sometimes
    the only one in the installation that still permits the older mechanism at
    all. Everything that wants to talk the old way then goes through it.

    What an attacker gains while the item goes unmet: the ability to force the
    machine into a conversation using a mechanism from which a password can be
    recovered, or whose response can be replayed against another machine.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedna z poważniejszych zmian
    w całej paczce. Dotyka uwierzytelniania, a więc rzeczy, bez której nie
    działa nic.

    Odetnie każdego klienta, który nie umie odpowiedzieć w wersji najnowszej.
    Typowo są to urządzenia wielofunkcyjne, sterowniki maszyn, systemy
    wbudowane, starsze urządzenia przechowujące dane oraz oprogramowanie
    pisane pod poprzednie wydania systemu. Na serwerze 2016 lista ta bywa
    najdłuższa z całej instalacji, bo to właśnie tu takie rzeczy zostały.

    Ważna rzecz o kierunku: ustawienie działa w obie strony. Maszyna przestaje
    nie tylko przyjmować starsze odpowiedzi, ale i wysyłać je, gdy sama łączy
    się gdzieś indziej. Jeżeli w instalacji stoi serwer starszy od tego,
    połączenia do niego mogą przestać działać razem z resztą.

    Sposób przygotowania jest znany i warto go wykonać. Przed podniesieniem
    poziomu należy włączyć odnotowywanie prób uwierzytelnienia starszym
    mechanizmem, odczekać cykl pracy obejmujący koniec miesiąca i dopiero
    potem czytać listę. Rzeczy, które łączą się raz na miesiąc, nie pokażą
    się w ciągu tygodnia.

    Zmiana wymaga ponownego uruchomienia maszyny. Odwrócenie również.
  en: |
    The class is "needs planned rollout", and it is one of the weightier changes
    in the whole pack. It touches authentication, and so the thing without which
    nothing works.

    It will cut off every client that cannot answer in the newest version.
    Typically those are multifunction devices, machine controllers, embedded
    systems, older storage devices and software written for earlier releases of
    the system. On Server 2016 that list tends to be the longest in the whole
    installation, because this is where such things were left.

    An important point about direction: the setting works both ways. The machine
    stops not only accepting older responses but also sending them when it
    connects somewhere itself. If a server older than this one stands in the
    installation, connections to it may stop working along with the rest.

    The way to prepare is known and worth carrying out. Before raising the
    level, switch on the recording of authentication attempts using the older
    mechanism, let a working cycle pass that includes a month end, and only then
    read the list. Things that connect once a month will not show up within a
    week.

    The change needs the machine restarted. So does undoing it.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - legacy-applications
    - remote-management
  what_breaks:
    pl:
      - Klienci nieumiejący odpowiedzieć w wersji najnowszej tracą możliwość uwierzytelnienia
      - Ustawienie działa w obie strony, więc połączenia tej maszyny do starszego serwera też mogą przestać działać
      - Urządzenia wielofunkcyjne, sterowniki maszyn i starsze urządzenia przechowujące dane przestają się logować
      - Rzeczy łączące się raz na miesiąc ujawnią się dopiero po pełnym cyklu pracy, a nie w pierwszym tygodniu
    en:
      - Clients unable to answer in the newest version lose the ability to authenticate
      - The setting works both ways, so this machine's connections to an older server may also stop working
      - Multifunction devices, machine controllers and older storage devices stop signing in
      - Things that connect once a month will show up only after a full working cycle, not in the first week
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z maszyną uwierzytelniają się urządzenia lub systemy nieumiejące odpowiedzieć w wersji najnowszej
      - Nie zebrano listy prób uwierzytelnienia starszym mechanizmem przez pełny cykl pracy
    en:
      - Devices or systems unable to answer in the newest version authenticate with the machine
      - The list of authentication attempts using the older mechanism has not been gathered over a full working cycle
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'LmCompatibilityLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'LmCompatibilityLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The version in use is chosen by the weaker side, so permitting an older
    # one amounts to using it. This works both ways - what the machine accepts
    # and what it sends. Takes effect after a restart.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LmCompatibilityLevel' -Value 5 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level

notes:
  pl: |
    Wartość jest numerem z ustalonej skali, a nie miarą — piątka oznacza
    poziom najwyższy, a nie „pięć jednostek czegoś". Porównanie jest
    równością, bo poziom niższy nie jest częściową zgodnością, tylko innym
    ustawieniem.

    Punkt tworzy parę z wyłączeniem przechowywania skrótu LAN Manager. Tamten
    wpis decyduje, czy skrót w ogóle powstaje; ten — czy wolno go użyć
    w sieci. Sam skrót nieużywany w sieci wciąż leży w bazie kont, a sam
    poziom podniesiony nie usuwa tego, co już zapisane.

    To jest reguła, przy której zebranie listy klientów przed zmianą ma
    największy sens z całej paczki. Objawem po stronie urządzenia jest zwykle
    odmowa dostępu, a nie informacja o wersji mechanizmu.
  en: |
    The value is a number from a fixed scale rather than a measure - five means
    the highest level, not "five units of something". The comparison is an
    equality, because a lower level is not partial compliance but a different
    setting.

    The item forms a pair with switching off the storage of the LAN Manager
    hash. That entry decides whether the hash is made at all; this one whether
    it may be used on the network. A hash unused on the network still lies in
    the account database, and a raised level alone removes nothing already
    stored.

    This is the rule where gathering the list of clients before the change makes
    the most sense of any in the pack. The symptom at the device's end is
    usually access denied, not a word about the mechanism's version.
