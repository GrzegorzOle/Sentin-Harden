id: win11-credential-guard-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Credential Guard włączony
    en: Credential Guard enabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Credential Guard przenosi skróty haseł i bilety dostępu do osobnego,
    odizolowanego środowiska opartego na wirtualizacji. Reszta systemu — łącznie
    z kodem działającym na prawach administratora — nie ma do niego dostępu:
    może prosić o wykonanie operacji na poświadczeniach, ale nie może ich
    odczytać.

    To zmienia opłacalność całej klasy ataków. Napastnik, który przejmie stację
    z uprawnieniami administratora, nadal ją kontroluje, ale nie wynosi z niej
    materiału pozwalającego zalogować się gdziekolwiek indziej. Przejęcie jednej
    maszyny przestaje być automatycznie przejęciem kolejnych.
  en: |
    Credential Guard moves password hashes and access tickets into a separate,
    isolated environment built on virtualisation. The rest of the system -
    including code running with administrator rights - has no access to it: it
    can ask for an operation on the credentials, but cannot read them.

    This changes the economics of a whole class of attacks. An attacker who
    takes over the workstation with administrator rights still controls it, but
    carries away no material that would let them sign in anywhere else. Taking
    one machine stops automatically meaning taking the next ones.

disruption_description:
  pl: |
    To najpoważniejsza zmiana w tej paczce i jedyna, której nie da się cofnąć
    z poziomu systemu. Włączenie z blokadą oprogramowania układowego sprawia, że
    późniejsze wyłączenie wymaga fizycznej obecności przy maszynie i potwierdzenia
    w interfejsie rozruchowym — zdalne odkręcenie decyzji nie istnieje.

    Do tego dochodzą wymagania sprzętowe i koszt: izolacja opiera się na
    wirtualizacji, więc zabiera część wydajności i kłóci się z oprogramowaniem,
    które samo potrzebuje bezpośredniego dostępu do sprzętu. Starsze pakiety
    uwierzytelniania i sterowniki niespełniające wymagań zgodności przestaną się
    ładować.
  en: |
    This is the most serious change in this pack and the only one that cannot be
    undone from within the system. Enabling it with the firmware lock means a
    later removal requires physical presence at the machine and confirmation in
    the boot interface - undoing the decision remotely does not exist.

    Added to that are hardware requirements and cost: the isolation rests on
    virtualisation, so it takes away some performance and conflicts with
    software that needs direct access to the hardware itself. Older
    authentication packages and drivers that fail the compatibility requirements
    stop loading.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - legacy-authentication
    - drivers-and-devices
    - boot-and-firmware
  what_breaks:
    pl:
      - Inne rozwiązania wirtualizacji wymagające bezpośredniego dostępu do sprzętu mogą przestać uruchamiać maszyny
      - Starsze pakiety uwierzytelniania i sterowniki niespełniające wymagań zgodności nie zostaną załadowane
      - Aplikacje korzystające ze starszych mechanizmów delegowania poświadczeń stracą możliwość logowania w cudzym imieniu
    en:
      - Other virtualisation products needing direct hardware access may stop starting their machines
      - Older authentication packages and drivers failing the compatibility requirements will not load
      - Applications using older credential delegation mechanisms lose the ability to sign in on someone else's behalf
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna nie spełnia wymagań sprzętowych i włączenie zakończy się nieudanym rozruchem
      - Stacja pracuje zdalnie i nie ma nikogo, kto mógłby podejść do niej przy wycofywaniu zmiany
      - Na maszynie działa oprogramowanie wirtualizacyjne innego producenta wymagające wyłącznego dostępu do sprzętu
    en:
      - The machine does not meet the hardware requirements and enabling it ends in a failed boot
      - The workstation works remotely and nobody is available to approach it when withdrawing the change
      - The machine runs third-party virtualisation software requiring exclusive access to the hardware
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $dg = Get-CimInstance -ClassName Win32_DeviceGuard `
        -Namespace 'root\Microsoft\Windows\DeviceGuard' -ErrorAction Stop
      if ($null -eq $dg) { 'CHECK_ERROR' }
      elseif ($dg.SecurityServicesRunning -contains 1) { 'RUNNING' }
      else { 'NOT_RUNNING' }
    } catch {
      'CHECK_ERROR'
    }
  expected: RUNNING
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $lsa = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $dg  = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    [pscustomobject]@{
      lsa_cfg_flags = (Get-ItemProperty -Path $lsa -Name 'LsaCfgFlags' -ErrorAction SilentlyContinue).LsaCfgFlags
      vbs_enabled   = (Get-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -ErrorAction SilentlyContinue).EnableVirtualizationBasedSecurity
      dg_key_existed = (Test-Path -Path $dg)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $dg = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $dg)) { New-Item -Path $dg -Force | Out-Null }
    Set-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord
    Set-ItemProperty -Path $dg -Name 'RequirePlatformSecurityFeatures' -Value 1 -Type DWord
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'LsaCfgFlags' -Value 1 -Type DWord

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/credential-guard/

notes:
  pl: |
    Ten punkt nie ma przycisku „Uruchom" i nie jest to przeoczenie. Włączenie
    z blokadą oprogramowania układowego zostawia stan, z którego nie da się
    wrócić poleceniem — przywrócenie wartości w rejestrze nie wyłączy funkcji,
    bo decyzja jest zapisana poza systemem. Zgodnie z zasadą projektu punkt bez
    wiarygodnego wycofania można wyłącznie skopiować i wykonać świadomie,
    z dostępem do maszyny.

    Kopia zapasowa jest mimo to dołączona: zapisuje stan obu kluczy przed
    zmianą, żeby było wiadomo, od czego się zaczęło.
  en: |
    This item has no "Run" button, and that is not an oversight. Enabling it
    with the firmware lock leaves a state no command can return from - restoring
    the registry values will not switch the feature off, because the decision is
    recorded outside the system. Following the project's rule, an item without a
    credible rollback can only be copied and executed deliberately, with access
    to the machine.

    The backup is included all the same: it records the state of both keys
    before the change, so that the starting point is known.
