id: iis-asp-net-version-header-disabled

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Nagłówek z wersją środowiska wykonawczego wyłączony
    en: The header naming the runtime version switched off
  level: 1
  profile: application

platform:
  system: iis

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Środowisko wykonawcze dokłada do odpowiedzi własny nagłówek z numerem swojej
    wersji. Jest to ta sama kategoria informacji co nagłówek o technologii, tylko
    dokładniejsza — podaje nie rodzinę, a konkretne wydanie.

    Dokładność jest tu problemem. Numer wersji zestawia się z listą ogłoszonych
    luk w kilka sekund i bez jednego żądania próbnego. Serwer, który sam podaje
    wydanie, oszczędza atakującemu etap rozpoznania, a ten etap jest jedynym,
    który zostawia ślady w dziennikach.

    Wyłączenie nagłówka nie usuwa żadnej luki. Odbiera natomiast gotową odpowiedź
    na pytanie, których luk szukać.
  en: |
    The runtime adds a header of its own to the response holding its version
    number. It is the same class of information as the header naming the
    technology, only more precise - it gives not the family but the particular
    release.

    The precision is the trouble here. A version number is matched against a list
    of announced flaws in seconds and without a single probing request. A server
    that gives out its release saves the attacker the reconnaissance stage, and
    that stage is the only one leaving traces in the logs.

    Switching the header off removes no flaw. It does take away a ready answer to
    the question of which flaws to look for.

disruption_description:
  pl: |
    Dla odwiedzających zmiana jest niewidoczna — nagłówek nie bierze udziału
    w obsłudze żądania. Koszt jest ten sam co przy usuwaniu nagłówka
    o technologii: zapis w konfiguracji odświeża pule aplikacji, więc żądania
    w locie zostaną przerwane, a sesje trzymane w pamięci procesu przepadną.

    Obie zasady warto wdrażać razem, w jednym oknie, zamiast płacić tę samą cenę
    dwa razy.

    Osobno warto sprawdzić narzędzia, które na podstawie tego nagłówka rozpoznają
    wersję środowiska — bywają to inwentaryzacje i skanery zgodności wewnątrz
    organizacji. Po zmianie zaczną raportować wersję jako nieznaną, co przy
    pobieżnym spojrzeniu wygląda na błąd zbierania danych.
  en: |
    For visitors the change is invisible - the header takes no part in serving a
    request. The cost is the same as with removing the header naming the
    technology - writing to the configuration recycles the application pools, so
    requests in flight are broken and sessions held in the process memory are lost.

    Both rules are worth rolling out together, in one window, rather than paying
    the same price twice.

    Apart from that it is worth checking the tools that recognise the runtime
    version from this header - these are sometimes inventories and compliance
    scanners inside the organisation. After the change they begin reporting the
    version as unknown, which at a quick glance looks like a data gathering error.

implementation_consequences:
  impact_areas:
    - web-server-services
  what_breaks:
    pl:
      - Odświeżenie pul aplikacji przerwie żądania w locie i skasuje sesje trzymane w pamięci procesu
      - Inwentaryzacje i skanery rozpoznające wersję środowiska z nagłówka zaczną raportować ją jako nieznaną
      - Dla odwiedzającego zmiana jest niewidoczna, bo nagłówek nie bierze udziału w obsłudze żądania
      - Nagłówek o technologii to osobne ustawienie i trzeba je wyłączyć niezależnie
      - Strony, skrypty, uwierzytelnianie, przesyłanie plików i uprawnienia pozostają bez zmian
    en:
      - The pool recycle breaks requests in flight and clears sessions held in the process memory
      - Inventories and scanners recognising the runtime version from the header begin reporting it as unknown
      - For a visitor the change is invisible, since the header takes no part in serving a request
      - The header naming the technology is a separate setting and has to be switched off on its own
      - Pages, scripts, authentication, file uploads and permissions are all unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwery produkcyjne w godzinach pracy, dopóki nie ma okna na odświeżenie pul aplikacji
      - Środowiska, w których wewnętrzna inwentaryzacja rozpoznaje wersję środowiska wyłącznie z tego nagłówka
    en:
      - Production servers during working hours, until there is a window for the pool recycle
      - Environments where an internal inventory recognises the runtime version from this header alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
            -Filter 'system.web/httpRuntime' -Name 'enableVersionHeader' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([string]$value -eq 'True') { 'TRUE' }
          elseif ([string]$value -eq 'False') { 'FALSE' }
          else { [string]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FALSE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # This setting lives in the framework root configuration and not in the
    # server configuration file, so the server's own backup mechanism does not
    # cover it. The file itself is copied instead - both variants of it,
    # because a 32-bit application pool reads a different copy than a 64-bit
    # one does.
    $files = @()
    foreach ($base in @('Framework', 'Framework64')) {
      $source = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\web.config')
      if (Test-Path $source) {
        $copy = '{{backup_file}}' + '.' + $base + '.web.config'
        Copy-Item -Path $source -Destination $copy -Force
        $files += [pscustomobject]@{ source = $source; copy = $copy }
      }
    }
    if ($files.Count -eq 0) {
      throw 'The framework root configuration was not found, so nothing was secured and nothing may be changed.'
    }
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/httpRuntime' -Name 'enableVersionHeader' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'framework-root'
      filter  = 'system.web/httpRuntime'
      name    = 'enableVersionHeader'
      value   = [string]$value
      existed = ($null -ne $value)
      files   = $files
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and copied the framework root configuration"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # The write goes to the framework root configuration, which is where this
    # section may be set as a server-wide default. The server configuration
    # file does not declare this section group at all, so a write aimed there
    # fails rather than taking effect quietly.
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/httpRuntime' -Name 'enableVersionHeader' -Value $false

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    # The whole file goes back rather than one attribute being rewritten. The
    # copy taken before the change is the only complete record of what the
    # framework root configuration held, and putting it back cannot leave the
    # file half restored.
    foreach ($f in $b.files) {
      if (-not (Test-Path $f.copy)) {
        throw 'A copy recorded in the backup file is missing, so nothing was restored.'
      }
    }
    foreach ($f in $b.files) {
      Copy-Item -Path $f.copy -Destination $f.source -Force
    }
privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.httpruntimesection

notes:
  pl: |
    Zasada dotyczy nagłówka dokładanego przez środowisko wykonawcze i nie obejmuje
    nagłówka o technologii ani nagłówka z nazwą samego serwera — każdy z nich ma
    własne ustawienie i ocenia się go osobno. Zapis idzie na poziomie serwera.

    Ustawienie należy do konfiguracji aplikacji, a nie serwera, więc jego
    miejscem jest główna konfiguracja środowiska wykonawczego, nie plik
    konfiguracyjny serwera — ten ostatni w ogóle nie deklaruje tej grupy sekcji
    i zapis skierowany tam kończy się błędem. Kopia obejmuje ten plik w obu
    odmianach, bo pula aplikacji 32-bitowa czyta inną jego kopię niż
    64-bitowa; tam, gdzie takie pule są używane, zmianę trzeba powtórzyć
    z sesji 32-bitowej. Odczyt sięga po wartość obowiązującą, więc widzi także
    ustawienie odziedziczone z konfiguracji nadrzędnej.
  en: |
    The rule covers the header added by the runtime and reaches neither the header
    naming the technology nor the one naming the server itself - each of them has a
    setting of its own and is judged apart. The setting is written at server level.

    The setting belongs to the application configuration rather than to the
    server, so its place is the framework root configuration and not the server
    configuration file - that last one does not declare this section group at
    all and a write aimed there ends in an error. The backup covers that file
    in both variants, since a 32-bit application pool reads a different copy of
    it than a 64-bit one does; where such pools are in use the change has to be
    repeated from a 32-bit session. The reading reaches for the effective
    value, so it sees a setting inherited from the configuration above as well.
