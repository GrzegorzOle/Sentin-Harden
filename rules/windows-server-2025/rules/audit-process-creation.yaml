id: win2025-audit-process-creation

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Detailed Tracking
  title:
    pl: Inspekcja tworzenia procesów
    en: Audit process creation
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje uruchomienie każdego procesu — nazwę programu,
    konto, z którego wystartował, i proces, który go uruchomił.

    Jest to najbliższa dostępna odpowiedź na pytanie „co się na tej
    maszynie wykonywało". Wszystkie pozostałe inspekcje opisują dostęp,
    uprawnienia i zasady; ta opisuje działanie. Bez niej dochodzenie
    opiera się na tym, co pozostało na dysku, a nie na tym, co zostało
    uruchomione.

    Szczególnie wartościowa jest informacja o procesie nadrzędnym.
    Program uruchomiony przez usługę sieciową, przez serwer bazy danych
    albo przez proces obsługujący żądania z sieci jest zjawiskiem
    zupełnie innym niż ten sam program uruchomiony ręcznie z konsoli —
    a bez tej informacji oba wyglądają tak samo.

    Na serwerze wykaz uruchamianych programów jest krótszy i bardziej
    przewidywalny niż na stanowisku roboczym. To czyni odstępstwa
    widocznymi: narzędzie administracyjne uruchomione w środku nocy przez
    proces usługi sieciowej rzuca się w oczy dokładnie dlatego, że reszta
    wykazu jest nudna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchamiania czegokolwiek bez pozostawiania śladu po samym
    uruchomieniu. Program usunięty po wykonaniu nie zostawia wtedy niczego.
  en: |
    The subcategory records the starting of every process - the program's name, the account
    it started from, and the process that started it.

    It is the nearest available answer to the question "what was being run on this machine".
    All the other auditings describe access, rights and policies; this one describes doing.
    Without it an inquiry rests on what was left on the disk rather than on what was
    started.

    The knowledge of the parent process is especially worth something. A program started by
    a network service, by a database server or by the process serving requests off the
    network is an altogether different thing from the same program started by hand at the
    console - and without that knowledge both look the same.

    On a server the list of programs started is shorter and more foreseeable than at a
    working station. That makes departures visible: an administrative tool started in the
    middle of the night by a network service's process catches the eye exactly because the
    rest of the list is dull.

    What an attacker gains while the item goes unmet: the means of running anything while
    leaving no trace of the running itself. A program deleted after it has done its work
    then leaves nothing behind.

disruption_description:
  pl: |
    Sprawdzenia wymaga objętość, bo zdarzeń jest tyle, ile uruchomień
    programów, a tych na serwerze bywa więcej, niż się wydaje.

    Nic nie przestaje działać i nikt niczego nie zauważy. Koszt jest
    w całości kosztem miejsca.

    Rząd wielkości zależy od tego, co na serwerze pracuje. Serwer
    z aplikacją długo działającą dopisze zdarzeń niewiele. Serwer
    z zadaniami zaplanowanymi, skryptami wdrożeniowymi albo procesem
    budowania uruchamia setki procesów na godzinę i każdy daje wpis.

    Dodatkowy koszt bierze się z wiersza polecenia, jeżeli zapis jego
    treści został włączony. Wiersz polecenia jest najcenniejszą częścią
    tego zdarzenia, bo odróżnia uruchomienie zwykłe od uruchomienia
    z parametrami wskazującymi na nadużycie — ale wydłuża wpis
    i potrafi zawierać hasła podane w wywołaniu.

    Zmiana nie wymaga restartu i działa natychmiast.
  en: |
    What needs checking is the volume, since there are as many events as there are startings
    of programs, and on a server there are at times more of those than it seems.

    Nothing stops working and nobody notices anything. The cost is wholly one of space.

    The order of size hangs on what works on the server. A server with one long-running
    application will add few events. A server with scheduled tasks, rollout scripts or a
    building process starts hundreds of processes an hour and each gives an entry.

    A further cost comes from the command line, where the recording of its content has been
    switched on. The command line is the most precious part of this event, since it tells an
    ordinary start from a start with parameters pointing to an abuse - but it lengthens the
    entry and can hold passwords given in the call.

    The change takes no restart and works at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - Brak regresji w działaniu — rośnie wyłącznie objętość dziennika zabezpieczeń
      - Serwer z zadaniami zaplanowanymi potrafi uruchamiać setki procesów na godzinę
      - Zapis wiersza polecenia wydłuża wpis i może zawierać hasła podane w wywołaniu
      - Systemy zbierające zdarzenia dostaną wyraźnie większy strumień z tej maszyny
    en:
      - No regression in the working - only the security log's volume grows
      - A server with scheduled tasks can start hundreds of processes an hour
      - Recording the command line lengthens the entry and may hold passwords given in the call
      - Event-gathering systems will get a markedly larger stream from this machine
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma domyślny rozmiar i nie ma go jak powiększyć
      - Na serwerze pracuje proces uruchamiający setki podprocesów na godzinę
      - Zdarzenia z tej maszyny są rozliczane objętościowo w systemie zbierającym
    en:
      - The security log is at its default size and there is no way of enlarging it
      - A process starting hundreds of subprocesses an hour works on the server
      - Events from this machine are billed by volume in the gathering system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE922B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE922B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE922B-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-process-creation

notes:
  pl: |
    Wymagane jest rejestrowanie powodzeń. Zdarzenie opisuje proces, który
    wystartował — uruchomienie nieudane nie tworzy procesu i nie daje
    wpisu tego rodzaju.

    Zapis treści wiersza polecenia jest osobnym ustawieniem i nie jest
    objęty tą regułą. Warto go rozważyć osobno, bo dopiero on czyni
    wykaz procesów użytecznym w dochodzeniu — ale wiersz polecenia
    bywa miejscem, w którym trafiają do dziennika hasła podane
    w wywołaniu skryptu.

    Punkt czyta się razem z rozmiarem dziennika zabezpieczeń. Na serwerze
    z zadaniami zaplanowanymi jest to trzecia z podkategorii, które ten
    dziennik zapełniają najszybciej.
  en: |
    Recording of successes is taken. The event describes a process that started - a failed
    start makes no process and gives no entry of this kind.

    The recording of the command line's content is a separate setting and is not taken in by
    this rule. It is worth weighing apart, since only it makes the list of processes useful
    in an inquiry - but the command line is at times the place through which passwords given
    in a script's call land in the log.

    The item is read together with the security log's size. On a server with scheduled tasks
    it is the third of the subcategories that fill that log the fastest.
