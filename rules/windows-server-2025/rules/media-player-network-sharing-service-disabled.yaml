id: win2025-media-player-network-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania biblioteki multimediów w sieci wyłączona
    en: The media library network sharing service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę udostępniającą bibliotekę multimediów innym
    urządzeniom w sieci. Usługa ta ogłasza się w sieci lokalnej,
    nasłuchuje na połączenia i wydaje zawartość biblioteki temu, kto po
    nią sięgnie.

    Zostawiam kategorię niską, bo to, co ta usługa udostępnia, na
    serwerze nie istnieje. Nie ma biblioteki multimediów, więc nie ma
    czego wydać.

    Zostaje jednak rzecz, którą warto nazwać, bo jest w tej paczce
    powtarzalnym wzorcem: biblioteki nie ma, ale nasłuchiwanie jest.
    Usługa ogłasza się w sieci i przyjmuje połączenia niezależnie od
    tego, czy ma cokolwiek do wydania. Z zewnątrz widać więc otwarty
    punkt i odpowiadającą na niego maszynę, a to wystarcza, żeby
    rozpoznać system, jego wersję i to, że nikt tej maszyny nie
    przeglądał pod kątem tego, co na niej działa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kolejny
    punkt odpowiadający z sieci, mówiący więcej o zaniedbaniu maszyny niż
    o jej zawartości.
  en: |
    The item switches off the service that deals the holding of sound and sight out to other devices
    in the net. That service calls itself abroad in the near net, listens for bindings and gives out
    what is in the holding to whoever reaches for it.

    I leave the category low, what that service deals out not being upon a server at all. There is no
    holding of sound and sight, so there is nothing to give out.

    There is left, though, a thing worth naming, it being in this pack a pattern that comes again -
    the holding is not there, but the listening is. The service calls itself abroad in the net and
    takes bindings whether or not it have anything to give out. From without there is therefore seen
    an open stead and a machine answering at it, and that is enough to know the system, its make, and
    that nobody looked over that machine as to what runs upon it.

    What an attacker gains while the item goes unmet - another stead answering off the net, saying
    more of the machine's being uncared for than of what is in it.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i jest to jeden z tych punktów,
    przy których cała treść mieści się w jednym zdaniu: na serwerze nie
    ma biblioteki multimediów, nie ma odtwarzacza i nie ma urządzenia,
    które by po tę bibliotekę sięgało.

    Chcę jednak zapisać jedną uwagę wykraczającą poza tę regułę, bo bywa
    myląca przy sąsiednich punktach. Jeżeli ta usługa na serwerze jest
    uruchomiona, to zwykle nie dlatego, że ktoś ją włączył, tylko
    dlatego, że maszyna powstała z obrazu przygotowanego kiedyś dla
    stacji roboczych. Warto wtedy spojrzeć szerzej niż na jeden punkt,
    bo rzadko jest on wtedy sam.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease", and it is one of those items whereof the whole substance holds
    within one sentence - upon a server there is no holding of sound and sight, no player, and no
    device that would reach for that holding.

    I would set down one note going beyond this rule for all that, it misleading at times at the
    neighbouring items. If that service be running upon a server, it is mostly not because somebody
    switched it on but because the machine came of a likeness made ready once for workstations. It is
    worth then looking wider than at one item, it being then seldom alone.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - Przestaje być możliwe sięgnięcie po bibliotekę multimediów tej maszyny z innego urządzenia
      - Na serwerze nie ma biblioteki, odtwarzacza ani urządzenia, które by po nią sięgało
      - Znika punkt nasłuchujący i ogłaszający się w sieci lokalnej niezależnie od tego, czy ma co wydać
      - Uruchomiona usługa zwykle znaczy, że maszyna powstała z obrazu przygotowanego dla stacji roboczych
    en:
      - The reaching for that machine's holding of sound and sight off another device stops being open to anybody
      - Upon a server there is no holding, no player and no device that would reach for it
      - The stead that listens and calls itself abroad in the near net goes away, whether or not it had anything to give out
      - A running service mostly means the machine came of a likeness made ready for workstations
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna celowo udostępnia bibliotekę multimediów urządzeniom w sieci lokalnej
    en:
      - The machine deals a holding of sound and sight out to devices in the near net on purpose
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The library is not there but the listener is. If this is running on a
    # server the machine most likely came from a workstation image - look
    # wider than this one item.
    Stop-Service -Name 'WMPNetworkSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMPNetworkSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WMPNetworkSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wmp/windows-media-player-sdk

notes:
  pl: |
    Powtarzalny wzorzec tej paczki, wart nazwania: biblioteki nie ma, ale
    nasłuchiwanie jest. Usługa ogłasza się w sieci i przyjmuje połączenia
    niezależnie od tego, czy ma cokolwiek do wydania.

    Z zewnątrz widać otwarty punkt i odpowiadającą maszynę, a to
    wystarcza, żeby rozpoznać system, jego wersję i to, że nikt tej
    maszyny nie przeglądał pod kątem tego, co na niej działa.

    Uwaga wykraczająca poza tę regułę: uruchomiona usługa zwykle znaczy,
    że maszyna powstała z obrazu przygotowanego dla stacji roboczych.
    Warto wtedy spojrzeć szerzej, bo rzadko jest wtedy sama.
  en: |
    A pattern of this pack that comes again and is worth naming - the holding is not there, but the
    listening is. The service calls itself abroad in the net and takes bindings whether or not it have
    anything to give out.

    From without there is seen an open stead and a machine answering at it, and that is enough to know
    the system, its make, and that nobody looked over that machine as to what runs upon it.

    A note going beyond this rule - a running service mostly means the machine came of a likeness made
    ready for workstations. It is worth then looking wider, it being then seldom alone.
