id: win11-infrared-monitor-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa nadzoru łącza podczerwonego wyłączona
    en: The monitor service for the infrared link disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obsługuje łącze podczerwone: wykrywa urządzenia znajdujące się
    w zasięgu nadajnika, zestawia z nimi połączenie i pozwala przesyłać pliki.

    Łącze to wymaga bliskości i widoczności — nadajnik musi być skierowany na
    odbiornik. Bywa to przedstawiane jako zabezpieczenie samo w sobie
    i właśnie tę tezę warto podważyć. Bliskość nie jest kontrolą dostępu.
    Oznacza tylko, że napastnik musi znaleźć się przy maszynie, co w miejscu
    publicznym, na stanowisku obsługi klienta albo w sali konferencyjnej nie
    jest przeszkodą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    przesyłania plików na maszynę i z maszyny, który nie przechodzi przez
    sieć, a więc nie widzi go ani zapora, ani żadne narzędzie obserwujące ruch
    sieciowy. Plik przeniesiony tą drogą nie zostawia śladu w dziennikach
    połączeń, bo żadnego połączenia sieciowego nie było.

    Mechanizm pochodzi z czasów, gdy był jedynym bezprzewodowym sposobem
    wymiany plików. Dziś nie ma zastosowania, a sprzęt go obsługujący spotyka
    się wyłącznie w urządzeniach starszego rodzaju.
  en: |
    The service handles the infrared link: it detects devices within the transmitter's
    range, sets up a connection with them and allows files to be sent.

    That link takes nearness and a line of sight - the transmitter has to be pointed at
    the receiver. This is sometimes presented as a safeguard in itself, and it is exactly
    that claim which is worth challenging. Nearness is not access control. It means only
    that an attacker has to come up to the machine, which in a public place, at a
    customer service station or in a meeting room is no obstacle.

    What an attacker gains while the item goes unmet: a channel for sending files to and
    from the machine that does not pass through the network, so neither the firewall nor
    any tool watching network traffic sees it. A file moved this way leaves no trace in
    connection logs, because there was no network connection.

    The mechanism dates from the days when it was the only wireless way of exchanging
    files. Today it has no use, and hardware supporting it is met with in devices of an
    older kind alone.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna ma w ogóle nadajnik podczerwony — bo
    w zdecydowanej większości przypadków nie ma.

    Na maszynie bez takiego sprzętu składnik nie jest instalowany i audyt
    zwróci wynik „nie dotyczy". Jest to przypadek zdecydowanie najczęstszy.

    Tam, gdzie sprzęt istnieje, skutek dotyczy wymiany plików z urządzeniami
    starszego rodzaju: urządzeniami pomiarowymi odczytywanymi bezprzewodowo,
    rejestratorami, sprzętem medycznym i przemysłowym sprzed lat. W takich
    zastosowaniach łącze podczerwone bywa jedynym interfejsem urządzenia
    i zamiennika po jego stronie nie ma.

    Jest to przypadek, w którym świadome odpuszczenie punktu z zapisanym
    uzasadnieniem bywa wynikiem prawidłowym — pod warunkiem, że wiadomo, które
    urządzenie tego wymaga, i że maszyna nie stoi w miejscu ogólnie dostępnym.

    Drukowanie, sterowanie i inne zastosowania bezprzewodowe oparte na
    łączności bliskiego zasięgu nie mają z tą usługą nic wspólnego i działają
    dalej.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether the machine has an infrared transmitter at all -
    because in the great majority of cases it does not.

    On a machine with no such hardware the component is not installed and the audit will
    return "not applicable". That is by far the commonest case.

    Where the hardware does exist, the effect concerns exchanging files with devices of
    an older kind: measuring devices read wirelessly, recorders, medical and industrial
    equipment from years back. In such uses the infrared link is sometimes a device's
    only interface and there is no replacement on its side.

    It is a case where deliberately accepting the item with a written reason is sometimes
    a proper outcome - provided it is known which device requires it, and that the
    machine does not stand in a place open to all.

    Printing, control and other wireless uses resting on short range connectivity have
    nothing to do with this service and carry on working.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - legacy-applications
    - removable-media
  what_breaks:
    pl:
      - Przesyłanie plików łączem podczerwonym na maszynę i z maszyny przestaje być możliwe
      - Urządzenie pomiarowe odczytywane tą drogą przestaje być odczytywane
      - Wykrywanie urządzeń w zasięgu nadajnika przestaje działać
      - Na maszynie bez nadajnika podczerwonego składnika nie ma i nie zmienia się nic
    en:
      - Sending files over the infrared link to and from the machine stops being possible
      - A measuring device read by this route stops being read
      - Detecting devices within the transmitter's range stops working
      - On a machine with no infrared transmitter the component is absent and nothing changes
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenie pomiarowe albo rejestrator odczytywany jest wyłącznie łączem podczerwonym
      - Sprzęt medyczny lub przemysłowy sprzed lat nie ma innego interfejsu niż podczerwień
    en:
      - A measuring device or recorder is read over the infrared link alone
      - Medical or industrial equipment from years back has no interface other than infrared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'irmon' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'irmon' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'irmon' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/introduction-to-irda

notes:
  pl: |
    Składnik jest instalowany razem ze sprzętem obsługującym łącze podczerwone
    i na maszynie bez takiego sprzętu usługi nie ma. Wynik „nie dotyczy" jest
    tu wynikiem prawidłowym.

    Wynik inny niż „nie dotyczy" wart jest odnotowania przy przeglądzie:
    oznacza, że maszyna ma sprzęt, o którym zwykle nikt nie pamięta, i że
    istnieje na niej kanał wymiany plików pomijający sieć.

    Punktu nie należy mylić z łącznością bliskiego zasięgu, która ma w tej
    paczce własne reguły. Oba mechanizmy są bezprzewodowe i na tym podobieństwo
    się kończy — korzystają z innego sprzętu, innych sterowników i innych
    usług.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The component is installed together with hardware supporting the infrared link and on
    a machine without such hardware the service is absent. A "not applicable" result is a
    proper result here.

    A result other than "not applicable" is worth noting in a review: it means the
    machine has hardware nobody usually remembers, and that a channel for exchanging
    files bypassing the network exists on it.

    The item should not be confused with short range connectivity, which has rules of its
    own in this pack. Both mechanisms are wireless and there the likeness ends - they use
    different hardware, different drivers and different services.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
