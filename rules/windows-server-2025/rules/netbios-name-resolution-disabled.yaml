id: win2025-netbios-name-resolution-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozwiązywanie nazw starszym mechanizmem sieciowym wyłączone
    en: Name resolution by the older net mechanism switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy mechanizm nazw sieciowych pochodzi z czasów, kiedy sieci
    lokalne nie miały serwerów nazw, a komputery ogłaszały się nawzajem
    rozgłoszeniem. Do dziś jest w systemie włączony i do dziś działa jako
    droga zastępcza, gdy zapytania do serwera nazw nie przyniosą
    odpowiedzi.

    Jest to najstarsza i najsłabsza z dróg rozwiązywania nazw. Nie ma
    uwierzytelnienia, nie ma podpisu, nie ma rozjemcy — odpowiada ten,
    kto odpowie pierwszy.

    Na serwerze do ogólnej słabości dochodzi rzecz właściwa tej roli.
    Serwer nie tylko pyta o nazwy, ale i ogłasza własną. Dopóki
    mechanizm działa, maszyna sama opowiada segmentowi sieci, jak się
    nazywa i co na niej jest — a to jest gotowy spis dla każdego, kto
    słucha. Rozpoznanie sieci zaczyna się właśnie od tego nasłuchu,
    a nie od skanowania, bo nasłuch nie zostawia śladu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odpowiedzenia na zapytanie serwera o nazwę i przechwycenia
    tego, czym serwer się uwierzytelnia, oraz gotowy spis maszyn zebrany
    z ich własnych ogłoszeń.
  en: |
    The older mechanism of names in the net comes from the days when local nets had no servers of
    names and computers announced themselves to one another by calling out. To this day it is
    switched on in the system and to this day it works as a road in reserve where askings of the
    server of names bring no answer.

    It is the oldest and the weakest of the roads of resolving names. There is no authentication,
    no signing, no arbiter - whoever answers first answers.

    On a server there comes to the general weakness a thing proper to that part. A server does not
    only ask after names, it announces its own. While the mechanism works, the machine itself tells
    the length of net what it is named and what is upon it - and that is a ready list for anyone
    who listens. The searching out of a net begins with just such listening and not with scanning,
    listening leaving no trace.

    What an attacker gains while the item goes unmet: the means of answering the server's asking
    after a name and of catching what the server authenticates itself with, and a ready list of
    machines gathered from their own announcings.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia i jest w tej trójce tą, która
    faktycznie potrafi coś zepsuć. Pozostałe dwie dotyczą dróg mało
    używanych; ta dotyczy drogi, na której w niejednej sieci nadal
    stoi codzienna praca.

    Sprawdzenia wymaga wszystko, co sięga do tej maszyny albo z niej
    wychodzi po nazwie krótkiej, bez końcówki domeny.

    Przypadek pierwszy i najczęstszy to udziały plików. Ścieżka zapisana
    w skrypcie, w skrócie na pulpicie użytkownika albo w konfiguracji
    aplikacji jako nazwa krótka rozwiązuje się przez serwer nazw tylko
    wtedy, gdy przyrostek domeny jest dopisywany. Tam, gdzie nie jest,
    rozwiązuje się właśnie tym mechanizmem i po zmianie przestanie.

    Przypadek drugi to starsze aplikacje i urządzenia: systemy
    dziedziczone, sterowniki przemysłowe, skanery odkładające pliki na
    udział. Część z nich zna wyłącznie nazwę krótką i nie umie inaczej.

    Przypadek trzeci to przeglądanie otoczenia sieciowego. Po zmianie
    lista maszyn w otoczeniu przestaje się wypełniać. Wygląda to na
    zniknięcie serwera z sieci, choć serwer pracuje normalnie.

    Objaw bywa opóźniony i wybiórczy, i to jest najtrudniejsza część
    tego punktu. Nie wszystko przestaje działać naraz — przestaje to,
    co akurat nie miało wpisu w serwerze nazw. Awaria zgłasza się więc
    tygodniami, po jednym zgłoszeniu, i trudno ją powiązać ze zmianą
    sprzed miesiąca.

    Dlatego kolejność jest tu ważniejsza niż sama zmiana. Najpierw
    wpisy w serwerze nazw dla wszystkiego, co maszyna obsługuje —
    łącznie z aliasami, pod którymi bywa wołana. Potem zmiana, w oknie,
    z listą rzeczy do sprawdzenia.

    Ustawienie cofa się natychmiast, ale zgłoszenia, które ujawniły
    problem, zdążyły już do kogoś trafić.
  en: |
    The change takes a knowing rollout and is of this three the one that can truly break something.
    The other two bear on roads little used; this one bears on a road whereon in many a net daily
    work still stands.

    What needs checking is everything that reaches this machine, or goes out of it, by a short name
    with no ending of the domain.

    The first case and the commonest is shares of files. A path written in a script, in a shortcut
    on a user's desktop or in an application's setup as a short name is resolved through the server
    of names only where the domain's ending is added on. Where it is not, it is resolved by this
    very mechanism and after the change will stop being.

    The second case is older applications and devices - inherited systems, industrial drivers,
    scanners laying files onto a share. Some of them know a short name alone and can do no other.

    The third case is the looking through of the net's surroundings. After the change the list of
    machines in the surroundings stops filling. It looks like the server's going from the net,
    though the server works as ever.

    The symptom is at times late and choosing, and that is this item's hardest part. Not everything
    stops at once - what stops is what happened to have no entry in the server of names. The fault
    reports itself therefore over weeks, one report at a time, and is hard to tie to a change made
    a month ago.

    Therefore the order matters here more than the change itself. First entries in the server of
    names for everything the machine serves - the other names it is called by among them. Then the
    change, in a window, with a list of things to check.

    The setting is undone at once, but the reports that brought the trouble to light have already
    reached somebody.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Ścieżki do udziałów zapisane nazwą krótką bez przyrostka domeny przestaną się rozwiązywać
      - Starsze aplikacje i urządzenia znające wyłącznie nazwę krótką stracą dostęp do tego serwera
      - Lista maszyn w otoczeniu sieciowym przestanie się wypełniać, co wygląda na zniknięcie serwera
      - Objaw jest wybiórczy i opóźniony, bo przestaje działać tylko to, co nie miało wpisu w serwerze nazw
      - Serwer przestanie ogłaszać swoją nazwę w segmencie, więc część klientów przestanie go widzieć
    en:
      - Paths to shares written as a short name with no ending of the domain will stop being resolved
      - Older applications and devices knowing a short name alone will lose access to this server
      - The list of machines in the net's surroundings will stop filling, which looks like the server's going
      - The symptom is choosing and late, only what had no entry in the server of names stopping
      - The server will stop announcing its name in the length, so some clients will stop seeing it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Klienci albo aplikacje sięgają do tego serwera nazwą krótką bez przyrostka domeny
      - Nie uzupełniono wpisów w serwerze nazw dla wszystkich nazw, pod którymi maszyna bywa wołana
    en:
      - Clients or applications reach this server by a short name with no ending of the domain
      - Entries in the server of names were not filled for every name the machine is called by
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero switches the mechanism off, one
      # admits it, and the further positions make it depend on the network.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'EnableNetbios'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'EnableNetbios'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableNetbios' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Jest to reguła, która w tej trójce faktycznie potrafi coś zepsuć.
    Pozostałe dwie dotyczą dróg mało używanych; ta dotyczy drogi,
    na której w niejednej sieci nadal stoi codzienna praca.

    Na serwerze dochodzi rzecz, której na stanowisku nie ma: maszyna nie
    tylko pyta o nazwy, ale i ogłasza własną, więc dopóki mechanizm
    działa, sama podaje segmentowi gotowy spis.

    Najtrudniejszą cechą tego punktu jest objaw wybiórczy i opóźniony.
    Przestaje działać tylko to, co akurat nie miało wpisu w serwerze
    nazw, więc awaria zgłasza się tygodniami, po jednym zgłoszeniu.
    Kolejność wdrożenia jest tu ważniejsza niż sama zmiana.
  en: |
    It is the rule of this three that can truly break something. The other two bear on roads little
    used; this one bears on a road whereon in many a net daily work still stands.

    On a server there comes a thing that at a station is not - the machine does not only ask after
    names, it announces its own, so while the mechanism works it hands the length a ready list
    itself.

    This item's hardest mark is the choosing and late symptom. Only what happened to have no entry
    in the server of names stops working, so the fault reports itself over weeks, one report at a
    time. The order of the rollout matters here more than the change itself.
