id: win2016-bitlocker-removable-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do nośników wymiennych ustalony
    en: The way of recovering access to removable media settled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, skąd bierze się dostęp do zaszyfrowanego nośnika
    wymiennego, gdy zwykła droga zawiedzie, i gdzie ten dostęp jest
    przechowywany.

    Nośnik wymienny różni się od dysku stałego jedną rzeczą, która czyni tę
    regułę ważniejszą, niż wygląda: nośnik nie ma swojego administratora.
    Dysk w serwerze ma opiekuna, który wie, gdzie leży jego klucz. Pamięć
    przenośna należy do człowieka, a klucz do niej — o ile istnieje — leży
    tam, gdzie ten człowiek go zostawił.

    Wymaganie zapisu klucza do katalogu przenosi tę odpowiedzialność
    z człowieka na organizację. Nośnik zaszyfrowany na maszynie w domenie
    zostawia swój klucz tam, gdzie da się go znaleźć rok później, gdy
    właściciel już nie pracuje.

    Pozostałe wartości porządkują to samo: hasło odzyskiwania i klucz na
    nośniku mają być wymagane, strona podpowiadająca ukryta, agent
    odzyskiwania danych wyłączony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę wejścia
    przez agenta odzyskiwania. Co traci organizacja: zawartość każdego
    nośnika, którego właściciel odszedł, zapomniał albo zgubił hasło.
  en: |
    The item settles where access to an encrypted removable medium comes from when the ordinary
    road fails, and where that access is kept.

    A removable medium differs from a fixed drive in one thing that makes this rule weightier than
    it looks: a medium has no administrator of its own. A drive in a server has a keeper who knows
    where its key lies. A carried memory belongs to a person, and the key to it - so far as one
    exists - lies where that person left it.

    Requiring the key to be written to the directory carries that answerability over from the
    person to the organisation. A medium encrypted on a machine in a domain leaves its key where it
    can be found a year later, when the owner no longer works there.

    The other values order the same matter: the recovery password and the key on a medium are to be
    required, the prompting page hidden, the data recovery agent switched off.

    What an attacker gains while the item goes unmet: a road in through the recovery agent. What the
    organisation loses: the contents of every medium whose owner left, forgot or lost the password.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powód jest ten sam co przy
    dyskach stałych i tutaj trafia częściej.

    Obowiązkowy zapis do katalogu wiąże szyfrowanie nośnika z łącznością
    z katalogiem. Nośniki szyfruje się jednak najczęściej przy stanowisku,
    a stanowisko bywa poza siecią organizacji — w domu, w podróży, na
    maszynie w grupie roboczej. W każdym z tych miejsc szyfrowanie po prostu
    się nie uda.

    Komunikat jest przy tym mylący. Mówi o zasadzie, nie o katalogu,
    i wygląda na zakaz szyfrowania — czyli na dokładne przeciwieństwo tego,
    o co chodzi. Osoba, która go zobaczy, uzna, że organizacja zabrania
    szyfrować nośniki, i zapisze plik na nośniku niezaszyfrowanym.

    Drugi skutek dotyczy nośników wożonych poza organizację. Klucz zapisany
    w katalogu jest dostępny tam, gdzie ten katalog sięga. Nośnik, który
    pojechał do kogoś na zewnątrz, nie da się odzyskać z jego strony
    i trzeba to powiedzieć przed, a nie po.

    Wdrożenie nie dotyczy nośników już zaszyfrowanych. Ich klucze zostają
    tam, gdzie trafiły.

    Czego to nie psuje: odczytu nośników zaszyfrowanych, zapisu na nich,
    pracy systemu, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs a planned rollout", and the reason is the same as at the fixed drives and
    strikes here oftener.

    Obligatory writing to the directory binds the encryption of a medium to connectivity with the
    directory. Media, though, are most often encrypted at a workplace, and a workplace is at times
    outside the organisation's network - at home, on a journey, on a machine in a workgroup. At
    every one of those places the encryption will simply not succeed.

    The message is for all that misleading. It speaks of a policy and not of the directory, and
    looks like a ban on encrypting - which is to say the exact opposite of what is meant. Whoever
    sees it will hold that the organisation forbids media to be encrypted, and will write the file
    to an unencrypted medium.

    The second consequence concerns media carried outside the organisation. A key written to the
    directory is to be had where that directory reaches. A medium that travelled to somebody
    outside cannot be recovered from their side, and that has to be said beforehand, not after.

    The rollout does not concern media already encrypted. Their keys stay where they landed.

    What this does not break: the reading of encrypted media, writing to them, the system's working,
    or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Szyfrowanie nośnika poza siecią organizacji nie uda się, a komunikat mówi o zasadzie, nie o katalogu
      - Osoba, która ten komunikat zobaczy, uzna, że szyfrowanie jest zabronione, i zapisze plik na nośniku niezaszyfrowanym
      - Nośnika wywiezionego poza organizację nie da się odzyskać z jego strony, bo klucz został w katalogu
      - Klucze nośników zaszyfrowanych przed zmianą zostają tam, gdzie trafiły
      - Odczyt nośników zaszyfrowanych, zapis na nich i praca systemu pozostają bez zmian
    en:
      - Encrypting a medium outside the organisation's network will not succeed, and the message speaks of a policy, not of the directory
      - Whoever sees that message will hold that encrypting is forbidden and will write the file to an unencrypted medium
      - A medium carried outside the organisation cannot be recovered from its side, the key having stayed in the directory
      - The keys of media encrypted before the change stay where they landed
      - The reading of encrypted media, writing to them and the system's working stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki bywają szyfrowane przy stanowisku poza siecią organizacji i nikt nie wytłumaczył ludziom komunikatu o zasadzie
      - Maszyna pracuje w grupie roboczej i zapisu klucza do katalogu nie ma dokąd wykonać
      - Nośniki wywożone są poza organizację, a odbiorca musi móc je odzyskać samodzielnie
    en:
      - Media are at times encrypted at a workplace outside the organisation's network and nobody has explained the message about a policy to people
      - The machine works in a workgroup and there is nowhere to write the key to a directory
      - Media are carried outside the organisation and the receiver has to be able to recover them themselves
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        RDVRecovery                     = 1
        RDVManageDRA                    = 0
        RDVRecoveryPassword             = 2
        RDVRecoveryKey                  = 2
        RDVHideRecoveryPage             = 1
        RDVActiveDirectoryBackup        = 1
        RDVActiveDirectoryInfoToStore   = 1
        RDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'RDVRecovery', 'RDVManageDRA', 'RDVRecoveryPassword', 'RDVRecoveryKey',
      'RDVHideRecoveryPage', 'RDVActiveDirectoryBackup',
      'RDVActiveDirectoryInfoToStore', 'RDVRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The obligatory writing of the key to the directory binds the encryption of
    # a medium to connectivity with the directory. Somebody encrypting a stick
    # outside the network will simply not encrypt it, and the message will
    # speak of a policy rather than of the directory.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      RDVRecovery                     = 1
      RDVManageDRA                    = 0
      RDVRecoveryPassword             = 2
      RDVRecoveryKey                  = 2
      RDVHideRecoveryPage             = 1
      RDVActiveDirectoryBackup        = 1
      RDVActiveDirectoryInfoToStore   = 1
      RDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest czwarty w bloku i powtarza konstrukcję znaną z dysków
    stałych, ale skutek ma inny i warto ten inny skutek pokazać.

    Przy dysku stałym nieudane szyfrowanie z braku łączności jest
    zdarzeniem rzadkim i technicznym — zauważa je administrator przy
    stawianiu maszyny. Tutaj jest zdarzeniem częstym i ludzkim: ktoś chciał
    zaszyfrować pamięć, nie udało się, więc zapisał plik bez szyfrowania.
    Reguła mająca chronić dane doprowadziła w tym przypadku do zapisania ich
    bez ochrony.

    Jest to jedyne miejsce w całym zestawie, w którym wdrożenie punktu
    potrafi dać skutek odwrotny do zamierzonego nie przez pomyłkę we
    wdrożeniu, tylko przez to, jak ludzie czytają komunikat. Warto, żeby
    opis nazywał to wprost, bo z samego ustawienia nie sposób tego
    wyprowadzić.

    Odnotowuję też różnicę dotyczącą zasięgu. Klucz w katalogu jest
    dostępny wewnątrz organizacji i nigdzie indziej. Dla nośnika, który
    z organizacji wyjeżdża, znaczy to, że odzyskanie dostępu wymaga
    kontaktu z nią — i to jest właściwość, nie wada, ale trzeba ją znać
    przed wręczeniem komuś nośnika.
  en: |
    The item is the fourth in the block and repeats a construction known from the fixed drives, but
    its consequence is another and that other consequence is worth showing.

    At a fixed drive a failed encryption for want of connectivity is a seldom and technical event -
    an administrator notices it when setting a machine up. Here it is a frequent and human one:
    somebody wanted to encrypt a memory, it did not succeed, so they wrote the file without
    encryption. A rule meant to guard data led in that case to their being written unguarded.

    It is the one place in the whole set where an item's rollout can give a consequence opposite to
    the one intended not through a mistake in the rollout but through how people read a message. It
    is well that the description name that outright, it not being derivable from the setting itself.

    Worth noting too a difference of reach. A key in the directory is to be had inside the
    organisation and nowhere else. For a medium that travels out of the organisation that means
    recovering access calls for getting in touch with it - and that is a property, not a fault, but
    it has to be known before a medium is handed to somebody.
