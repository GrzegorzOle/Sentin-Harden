id: win2025-taskbar-chat-icon-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Chat
  title:
    pl: Ikona wbudowanego komunikatora na pasku zadań wyłączona
    en: The built-in messenger's icon on the taskbar switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt usuwa z paska zadań ikonę wbudowanego komunikatora i zamyka drogę
    jej przywrócenia przez użytkownika.

    Kategoria niska i mówię to wprost: ten punkt nie zamyka drogi włamania.
    Komunikator jest osobną aplikacją i wyłączenie ikony jej nie usuwa.
    Zamykana jest jedna droga uruchomienia, a nie sam mechanizm.

    Wartość jest inna i skromniejsza. Wbudowany komunikator działa na koncie
    osobistym, nie organizacyjnym — a więc tworzy na maszynie kanał wymiany
    plików i wiadomości równoległy do tego, którym posługuje się organizacja,
    i pozostający całkowicie poza jej wglądem. Plik przesłany tą drogą nie
    przechodzi przez żadną bramę, nie trafia do żadnego dziennika i nie da
    się go później odtworzyć.

    Na serwerze wniosek jest prosty: nie ma tu powodu, żeby taka droga była
    otwarta, i nie ma też powodu, żeby ikona zajmowała miejsce na pasku
    zadań maszyny, na której nikt nie prowadzi rozmów.

    Ustawienie przyjmuje wartości ze zbioru: jeden pokazuje ikonę, dwa
    ukrywa ją, ale pozwala użytkownikowi przywrócić, trzy wyłącza na stałe.
    Reguła oczekuje trójki, bo tylko ona zamyka sprawę bez odwołania do
    dyscypliny użytkownika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    ale na maszynie istnieje kanał wymiany plików poza wglądem organizacji,
    osiągalny jednym kliknięciem z paska zadań.
  en: |
    The item removes the built-in messenger's icon from the taskbar and
    closes the way for a user to bring it back.

    The category is low, and I say so plainly: this item closes no way in.
    The messenger is a separate application and switching off the icon does
    not remove it. What is closed is one way of starting it, not the
    mechanism itself.

    The value is of another and more modest kind. The built-in messenger
    works on a personal account, not an organisational one - and so it
    creates on the machine a channel for exchanging files and messages
    running parallel to the one the organisation uses, and lying wholly
    outside its view. A file sent this way passes through no gateway, reaches
    no log and cannot be reconstructed afterwards.

    On a server the conclusion is simple: there is no reason for such a road
    to be open here, and no reason either for the icon to take up space on
    the taskbar of a machine where nobody holds conversations.

    The setting takes values from a set: one shows the icon, two hides it but
    lets the user bring it back, three switches it off for good. The rule
    expects a three, because only that closes the matter without appealing to
    a user's discipline.

    What an attacker gains while the item goes unmet: little - but there is a
    channel on the machine for exchanging files outside the organisation's
    view, reachable with one click from the taskbar.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć skutek jest drobny. Powód klasy jest
    jeden: zmiana działa dopiero po ponownym zalogowaniu, a do tego czasu
    pasek zadań wygląda po staremu. Kto zastosuje regułę i od razu sprawdzi,
    uzna, że nie zadziałała.

    Skutek właściwy: ikona znika z paska zadań i nie da się jej przywrócić
    z ustawień. Sam komunikator, jeżeli jest zainstalowany, nadal działa
    i nadal da się go uruchomić inną drogą. Reguła nie jest jego
    odinstalowaniem i nie należy jej tak przedstawiać.

    Na serwerze sprawdzanie jest krótkie, bo ta aplikacja na wydaniu
    serwerowym zwykle nie występuje. Wtedy audyt wykaże brak ustawienia,
    a zastosowanie reguły nic nie zmieni poza sprawozdaniem — co i tak ma
    wartość, bo odróżnia maszynę ustawioną od maszyny, której nikt nie
    dotknął.

    Czego to nie psuje: paska zadań, powiadomień, poczty, komunikatorów
    organizacji ani żadnej usługi.

    Wymaga wylogowania. Natychmiast odwracalne.
  en: |
    The class is "needs review", though the effect is slight. The reason for
    the class is single: the change takes effect only after a fresh sign-in,
    and until then the taskbar looks as before. Whoever applies the rule and
    checks at once will conclude it did not work.

    The actual effect: the icon disappears from the taskbar and cannot be
    brought back from settings. The messenger itself, if installed, still
    works and can still be started another way. The rule is not its removal
    and should not be presented as one.

    On a server the checking is short, because this application is usually
    absent from the server edition. The audit will then show the setting
    missing, and applying the rule will change nothing beyond the report -
    which is of value anyway, because it tells a machine that was set from a
    machine nobody touched.

    What this does not break: the taskbar, notifications, mail, the
    organisation's messengers, or any service.

    It needs a sign-out. Undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - email-and-attachments
  what_breaks:
    pl:
      - Ikona znika z paska zadań i nie da się jej przywrócić z ustawień
      - Zmiana działa dopiero po ponownym zalogowaniu — kto sprawdzi od razu, uzna, że reguła nie zadziałała
      - Sam komunikator, jeżeli jest zainstalowany, nadal działa i da się go uruchomić inną drogą
      - Pasek zadań, powiadomienia, poczta i komunikatory organizacji działają bez zmian
    en:
      - The icon disappears from the taskbar and cannot be brought back from settings
      - The change takes effect only after a fresh sign-in - whoever checks at once will conclude the rule did not work
      - The messenger itself, if installed, still works and can be started another way
      - The taskbar, notifications, mail and the organisation's messengers work unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym wbudowany komunikator jest uzgodnionym narzędziem kontaktu
    en:
      - The machine is a workstation where the built-in messenger is an agreed tool of contact
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: one shows the icon, two hides it but
      # lets the user bring it back, three switches it off for good.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Chat'
      $name = 'ChatIcon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Chat'
    $name = 'ChatIcon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The messenger works on a personal account, so it makes a channel for files
    # and messages parallel to the organisation's and outside its view: what goes
    # that way passes no gateway and reaches no log. Three closes the matter; two
    # would only hide the icon and leave the choice with the user.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Chat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ChatIcon' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-taskbar

notes:
  pl: |
    Kategoria niska powiedziana wprost: punkt nie zamyka drogi włamania,
    a wyłączenie ikony nie usuwa samej aplikacji. Zamykana jest jedna droga
    uruchomienia.

    Wartość jest skromniejsza: wbudowany komunikator działa na koncie
    osobistym, więc tworzy kanał wymiany plików równoległy do kanału
    organizacji i całkowicie poza jej wglądem. Plik przesłany tą drogą nie
    przechodzi przez żadną bramę i nie trafia do żadnego dziennika.

    Ustawienie przyjmuje wartości ze zbioru. Trójka zamyka sprawę bez
    odwołania do dyscypliny użytkownika; dwójka tylko ukrywa ikonę. Zmiana
    działa po ponownym zalogowaniu — sprawdzona od razu wygląda na
    niedziałającą.
  en: |
    The low category said plainly: the item closes no way in, and switching
    off the icon does not remove the application. One way of starting it is
    closed.

    The value is more modest: the built-in messenger works on a personal
    account, so it makes a channel for exchanging files parallel to the
    organisation's and wholly outside its view. A file sent that way passes
    through no gateway and reaches no log.

    The setting takes values from a set. Three closes the matter without
    appealing to a user's discipline; two only hides the icon. The change
    takes effect after a fresh sign-in - checked at once it looks as though
    it did not work.
