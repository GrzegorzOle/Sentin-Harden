id: win2016-null-session-access-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Dostęp bez uwierzytelnienia do potoków i udziałów ograniczony
    en: Unauthenticated access to pipes and shares restricted
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że sesja nawiązana bez uwierzytelnienia sięgnie wyłącznie
    do tych zasobów, które zostały do tego wprost wyznaczone.

    Sesja bez uwierzytelnienia jest pozostałością po czasach, w których
    maszyny w jednej sieci musiały wymieniać się informacjami, zanim
    ktokolwiek się zalogował. Mechanizm pozostał, a wraz z nim możliwość
    dosięgnięcia potoków nazwanych i udziałów przez połączenie, które nie
    podało niczego.

    Kategoria wysoka, bo potok nazwany nie jest plikiem — jest wejściem do
    usługi. Dosięgnięcie potoku znaczy możliwość rozmowy ze składnikiem
    systemu w imieniu nikogo. Tak właśnie wyglądają najstarsze i najlepiej
    opisane drogi wejścia na serwery Windows.

    Na serwerze 2016 punkt ma znaczenie praktyczne, bo domyślna lista
    wyznaczonych zasobów jest na tym wydaniu dłuższa niż na maszynach
    nowszych. Ograniczenie samo w sobie nie usuwa z niej pozycji — sprawia
    natomiast, że wszystko spoza listy przestaje być osiągalne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozmowę
    z usługami tej maszyny przez połączenie, które nie podało żadnego
    poświadczenia, i dostęp do udziałów, które nikt świadomie nie otworzył.
  en: |
    The item makes a session established without authentication reach only
    those resources expressly designated for it.

    An unauthenticated session is a leftover from a time when machines on one
    network had to exchange information before anybody had signed in. The
    mechanism remained, and with it the ability to reach named pipes and shares
    over a connection that supplied nothing.

    The category is high, because a named pipe is not a file - it is a way into
    a service. Reaching a pipe means being able to talk to a system component in
    nobody's name. That is exactly what the oldest and best-documented roads
    into Windows servers look like.

    On Server 2016 the item matters in practice, because the default list of
    designated resources is longer on this release than on newer machines. The
    restriction does not itself remove entries from that list - what it does is
    make everything outside the list unreachable.

    What an attacker gains while the item goes unmet: a conversation with this
    machine's services over a connection that supplied no credential at all, and
    access to shares nobody deliberately opened.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy starych
    rozwiązań rozmawiających z tą maszyną bez logowania.

    Typowe przypadki to oprogramowanie monitorujące pobierające stan usług
    bez podawania poświadczeń, narzędzia zarządzania drukiem, starsze systemy
    inwentaryzacyjne oraz aplikacje branżowe napisane pod poprzednie wydania
    systemu. Każde z nich może korzystać z potoku, który po zmianie
    przestanie być osiągalny.

    Objaw bywa niejednoznaczny. Część takich narzędzi zgłosi odmowę dostępu,
    a część po prostu pokaże brak danych — i to drugie jest gorsze, bo
    wygląda jak stan maszyny, a nie jak skutek ustawienia.

    Rzecz do zapamiętania: reguła nie zamyka dostępu do zasobów wyznaczonych.
    Jeżeli coś musi działać bez uwierzytelnienia, właściwym rozwiązaniem jest
    dopisanie tego zasobu do listy wyznaczonych, a nie pozostawienie
    ograniczenia wyłączonego.

    Na serwerze 2016 warto zrobić to przeglądem, a nie odruchem. Lista
    domyślna jest tu dłuższa i zawiera pozycje, których obecność na nowszej
    maszynie byłaby zaskoczeniem.

    Zmiana wymaga ponownego uruchomienia usługi serwera.
  en: |
    The class is "needs review", and what needs reviewing is old arrangements
    that talk to this machine without signing in.

    The usual cases are monitoring software fetching the state of services
    without supplying credentials, print management tools, older inventory
    systems and line-of-business applications written for earlier releases of
    the system. Each of those may use a pipe that becomes unreachable after the
    change.

    The symptom can be ambiguous. Some such tools will report access denied and
    some will simply show no data - and the second is worse, because it looks
    like the state of the machine rather than the effect of a setting.

    Something to remember: the rule does not close access to the designated
    resources. If something has to work without authentication, the proper
    answer is to add that resource to the designated list, not to leave the
    restriction off.

    On Server 2016 that is worth doing as a review rather than as a reflex. The
    default list is longer here and holds entries whose presence on a newer
    machine would be a surprise.

    The change requires the server service to be restarted.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - legacy-applications
    - printing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Narzędzia pobierające stan usług bez poświadczeń przestają dostawać dane
      - Starsze systemy zarządzania drukiem i inwentaryzacji tracą dostęp do potoków tej maszyny
      - Część narzędzi zgłosi odmowę, a część pokaże brak danych, co wygląda jak stan maszyny
      - Zasoby wyznaczone na liście pozostają osiągalne, więc wyjątek dopisuje się do listy, a nie wyłącza ograniczenie
    en:
      - Tools fetching the state of services without credentials stop receiving data
      - Older print management and inventory systems lose access to this machine's pipes
      - Some tools will report a refusal and some will show no data, which looks like the state of the machine
      - Resources on the designated list stay reachable, so an exception is added to the list rather than by switching the restriction off
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z maszyną rozmawia bez uwierzytelnienia narzędzie, którego zasobu nie dopisano jeszcze do listy wyznaczonych
    en:
      - A tool that talks to the machine without authenticating uses a resource not yet added to the designated list
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'RestrictNullSessAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'RestrictNullSessAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A named pipe is not a file but a way into a service, so reaching one means
    # talking to a system component in nobody's name. Resources on the
    # designated list stay reachable - that is where an exception belongs.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictNullSessAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-restrict-anonymous-access-to-named-pipes-and-shares

notes:
  pl: |
    Reguła włącza ograniczenie, ale nie zarządza samą listą wyznaczonych
    potoków i udziałów. Listę trzeba przejrzeć osobno — i na tym wydaniu warto
    to zrobić, bo bywa dłuższa, niż zespół się spodziewa.

    Wpis leży pod tym samym kluczem usługi serwera co podpisywanie po stronie
    przyjmującej i wyłączenie pierwszej wersji protokołu. Trzy osobne
    ustawienia w jednym miejscu — obecność jednego nie mówi niczego
    o pozostałych.

    Kategoria wysoka bierze się z potoków, nie z udziałów. Udział bez
    uwierzytelnienia jest kłopotem; potok bez uwierzytelnienia jest rozmową
    z usługą.
  en: |
    The rule switches the restriction on, but does not manage the list of
    designated pipes and shares itself. That list has to be reviewed separately
    - and on this release it is worth doing, because it tends to be longer than
    the team expects.

    The entry lies under the same server service key as signing on the receiving
    side and the switching off of the first protocol version. Three separate
    settings in one place - the presence of one says nothing about the others.

    The high category comes from the pipes rather than the shares. A share
    without authentication is a nuisance; a pipe without authentication is a
    conversation with a service.
