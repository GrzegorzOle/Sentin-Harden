id: win2016-null-session-fallback-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Powrót do sesji bez uwierzytelnienia zabroniony
    en: Falling back to an unauthenticated session forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze działającej na koncie systemowym sięgać po
    sesję bez uwierzytelnienia, gdy uwierzytelnione połączenie się nie uda.

    Mechanizm, który ten punkt zamyka, jest wzorcowym przykładem zabezpieczenia
    psutego przez zapasową drogę. Usługa próbuje połączyć się z inną maszyną,
    podając tożsamość konta systemowego. Jeżeli próba się nie powiedzie —
    z powodu niezgodnych ustawień, braku uprawnień albo czegokolwiek innego —
    system nie zgłasza błędu, tylko próbuje ponownie, tym razem bez podawania
    kogokolwiek.

    Skutek jest taki, że każde zaostrzenie uwierzytelniania po drugiej stronie
    zamienia się w ciche obniżenie po tej. Im lepiej zabezpieczony odbiorca,
    tym większa szansa, że połączenie zejdzie do sesji anonimowej. Jest to
    dokładne odwrócenie zamierzonego kierunku.

    Napastnik korzysta z tego wprost: wymusza niepowodzenie pierwszej próby,
    żeby dostać drugą, prowadzoną bez tożsamości i bez podpisu. Połączenie bez
    tożsamości jest przy tym połączeniem, którego nie da się powiązać z niczym
    w dzienniku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wymuszalne
    zejście połączenia do postaci bez uwierzytelnienia, a przez to obejście
    zabezpieczeń, które po drugiej stronie właśnie zadziałały.
  en: |
    The setting forbids a service running under the system account to reach for an
    unauthenticated session when an authenticated connection fails.

    The mechanism this item shuts is a model instance of a safeguard undone by a
    fallback road. A service tries to connect to another machine, giving the system
    account's identity. If the attempt does not succeed - because of mismatched
    settings, a want of rights, or anything else - the system does not report an
    error but tries again, this time giving nobody at all.

    The effect is that every tightening of authentication on the other side turns
    into a quiet loosening on this one. The better guarded the receiver, the greater
    the chance the connection drops to an anonymous session. It is an exact
    reversal of the intended direction.

    An attacker makes use of this directly: they force the first attempt to fail in
    order to get the second, carried on without an identity and without a signature.
    A connection without an identity is, moreover, a connection that cannot be tied
    to anything in the log.

    What an attacker gains while the item goes unmet: a forceable drop of the
    connection to an unauthenticated form, and thereby a way round the safeguards
    that have just taken effect on the other side.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana usuwa drogę zapasową, a nie drogę główną.
    Wszystko, co łączy się poprawnie, łączy się dalej tak samo — bo nie
    korzystało z tej ścieżki.

    Trzeba jednak powiedzieć, czego ta zmiana nie robi, bo tu leży cała
    subtelność. Nie naprawia połączeń, które się nie udają — sprawia, że
    przestają się udawać po cichu. Połączenie, które dotąd schodziło do sesji
    anonimowej i działało, teraz zgłosi błąd.

    Z punktu widzenia bezpieczeństwa jest to poprawa, bo problem staje się
    widoczny. Z punktu widzenia eksploatacji jest to nowy błąd w dzienniku,
    którego wcześniej nie było — i warto to rozróżnić, bo pierwszą reakcją
    bywa cofnięcie zmiany zamiast naprawienia przyczyny.

    Przypadki, w których to się ujawnia, są wąskie: starsze systemy kopii
    zapasowych i starsze rozwiązania monitorujące, łączące się na koncie
    systemowym z maszynami o niezgodnych ustawieniach uwierzytelniania.

    Czego to nie psuje: połączeń uwierzytelnionych, udostępniania plików,
    zasad grupy, uwierzytelniania domenowego ani pracy usług.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The change removes a fallback road, not the main
    one. Everything that connects properly goes on connecting the same way - since
    it did not use that path.

    What the change does not do has to be said, though, for the whole subtlety lies
    there. It does not mend connections that fail - it makes them cease to fail
    quietly. A connection that until now dropped to an anonymous session and worked
    will now report an error.

    From the standpoint of safety that is an improvement, since the problem becomes
    visible. From the standpoint of operations it is a new error in the log that was
    not there before - and worth telling apart, since the first reaction is at times
    to undo the change rather than mend the cause.

    The cases in which this shows are narrow: older backup systems and older
    monitoring solutions connecting under the system account to machines with
    mismatched authentication settings.

    What this does not break: authenticated connections, file sharing, group policy,
    domain authentication, or the working of services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - network-and-firewall
  what_breaks:
    pl:
      - Połączenie, które dotąd po cichu schodziło do sesji anonimowej i działało, zaczyna zgłaszać błąd
      - Starszy system kopii zapasowych łączący się na koncie systemowym z maszyną o niezgodnych ustawieniach przestaje się łączyć
      - W dzienniku pojawia się błąd, którego wcześniej nie było, choć przyczyna istniała od dawna
      - Połączenia uwierzytelnione, udostępnianie plików i uwierzytelnianie domenowe pozostają bez zmian
    en:
      - A connection that until now dropped quietly to an anonymous session and worked begins to report an error
      - An older backup system connecting under the system account to a machine with mismatched settings stops connecting
      - An error appears in the log that was not there before, though its cause had existed all along
      - Authenticated connections, file sharing and domain authentication stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — zmiana usuwa drogę zapasową, z której poprawnie działające połączenia nie korzystają
    en:
      - No known contraindication - the change removes a fallback road that properly working connections do not use
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'AllowNullSessionFallback'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'AllowNullSessionFallback'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A failed authenticated connection now stays failed instead of retrying with no
    # identity at all. The error that appears was there before - only silent.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowNullSessionFallback' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-localsystem-null-session-fallback

notes:
  pl: |
    Reguła jest tania i warto ją tak pokazywać, ale nie należy z tego
    wyprowadzać, że jest nieważna. Jej wartość polega na tym, że przywraca
    sens pozostałym regułom o uwierzytelnianiu sieciowym: dopóki istnieje
    zejście do sesji anonimowej, każda z nich daje się obejść przez wymuszenie
    niepowodzenia.

    Błąd, który po zmianie pojawia się w dzienniku, jest wynikiem poprawnym,
    a nie skutkiem ubocznym. Opisuje stan, który istniał wcześniej i był
    maskowany. Aplikacja powinna to powiedzieć wprost przy podsumowaniu
    skutków, bo inaczej pierwszą reakcją będzie wycofanie zmiany.

    Punkt czyta się razem z regułami o podpisywaniu połączeń sieciowych
    i o poziomie uwierzytelniania. Tamte zaostrzają drogę główną; ta usuwa
    objazd.
  en: |
    The rule is cheap and worth showing as such, but it should not be inferred from
    that that it is unimportant. Its worth lies in giving back sense to the other
    rules on network authentication: so long as a drop to an anonymous session
    exists, each of them can be got round by forcing a failure.

    The error that appears in the log after the change is a correct result, not a
    side effect. It describes a state that existed before and was masked. The
    application should say so outright in the summary of consequences, since
    otherwise the first reaction will be to undo the change.

    The item reads together with the rules on signing network connections and on the
    level of authentication. Those tighten the main road; this one removes the
    detour.
