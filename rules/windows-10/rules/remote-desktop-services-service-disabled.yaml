id: win10-remote-desktop-services-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa pulpitu zdalnego wyłączona
    en: The service of the desk from afar switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przyjmującą połączenia pulpitu zdalnego,
    czyli zamyka możliwość zalogowania się na tę maszynę przez sieć
    z pełnym obrazem pulpitu.

    Pulpit zdalny jest drogą wejścia o pełnych prawach. Kto się nim
    zaloguje, pracuje na maszynie tak samo jak osoba siedząca przy niej:
    widzi to samo, uruchamia to samo, sięga po to samo. Nie ma tu
    ograniczenia zakresu, które istnieje przy innych drogach zdalnych.

    Z tej przyczyny jest to jedna z pierwszych rzeczy, których szuka
    napastnik po zdobyciu poświadczeń. Hasło działające tu daje sesję
    graficzną, a sesja graficzna daje wszystko pozostałe.

    Na stanowisku roboczym usługa ta bywa włączona bez potrzeby. Część
    maszyn ma ją uruchomioną od instalacji, mimo że nikt nigdy nie łączył
    się z nimi zdalnie — a zamknięty port jest zabezpieczeniem
    skuteczniejszym niż dowolne ograniczenie dostępu do otwartego.

    Odnotowuję, że wyłączenie usługi zamyka wszystkie sesje otwarte w tej
    chwili, łącznie z tą, z której polecenie jest wykonywane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełną sesję
    graficzną na maszynie po zdobyciu poświadczeń.
  en: |
    The setting switches off the service taking joinings of the desk from afar, which is to say it shuts the power
    of logging on to this machine across the network with the whole picture of the desk.

    The desk from afar is a road in of full rights. Whoever logs on by it works upon the machine just as the
    person sitting at it: they see the same, set the same going, reach for the same. There is here no bounding of
    reach such as stands at other roads from afar.

    For that cause it is among the first things an attacker seeks once warrants are got. A word of passing that
    works here gives a sitting of pictures, and a sitting of pictures gives all the rest.

    Upon a working station that service is at times turned on without need. Some machines have had it going since
    the laying on, though nobody ever joined themselves to them from afar - and a shut port is a guard surer than
    any bounding of reach upon an open one.

    I set down that the switching off of the service shuts every sitting open at this hour, that one among them
    from which the command is being run.

    What an attacker gains while the item goes unmet: a whole sitting of pictures upon the machine once warrants
    are got.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i jest to jeden z tych punktów,
    przy których słowo „świadomego" trzeba wziąć dosłownie.

    Wyłączenie usługi zrywa sesje otwarte w tej chwili. Jeżeli polecenie
    jest wykonywane przez pulpit zdalny, zrywa też tę sesję — i nie da
    się jej przywrócić tą samą drogą. Powrót wymaga dostępu przy maszynie
    albo inną drogą zdalną.

    Miejscem pierwszym są stanowiska obsługiwane zdalnie przez dział
    wsparcia. Tam punkt zamyka podstawowy sposób pomocy użytkownikowi
    i trzeba mieć gotową drogę zastępczą, zanim się go wdroży.

    Miejscem drugim są maszyny, do których ktoś łączy się z domu. Zdarza
    się to częściej, niż wynika z dokumentacji, i ujawnia dopiero po
    zmianie.

    Miejscem trzecim jest praca zmianowa na jednym stanowisku, gdzie
    sesje zdalne służą do przełączania się między osobami.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast, ale
    wyłącznie z poziomu maszyny albo inną drogą zdalną.

    Czego to nie psuje: pracy przy maszynie, zdalnego zarządzania przez
    powłokę, dostępu do udziałów, logowania lokalnego, drukowania.
  en: |
    The class is "needs a planned rollout", and it is one of those items where the word "planned" is to be taken
    at its word.

    The switching off of the service breaks off the sittings open at this hour. If the command is being run
    through the desk from afar, it breaks off that sitting too - and it is not to be had again by that same road.
    The going back calls for a reach at the machine itself or by another road from afar.

    The first place is stations kept from afar by a board of help. There the item shuts the chief manner of
    helping a user, and a road to stand in its stead has to be ready before it is rolled out.

    The second place is machines somebody joins themselves to from home. That happens oftener than the papers
    show, and comes to light only after the change.

    The third place is work by shifts upon one station, where sittings from afar serve for the going over between
    people.

    The change calls for the service to be stopped and is to be undone at once, but solely from the machine itself
    or by another road from afar.

    What this does not break: work at the machine, the governing from afar through the shell, the reach of shares,
    logging on there, or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Wyłączenie usługi zrywa sesje otwarte w tej chwili, łącznie z tą, z której polecenie jest wykonywane
      - Powrót wymaga dostępu przy maszynie albo inną drogą zdalną, bo tą samą drogą już się nie da
      - Dział wsparcia straci podstawowy sposób pomocy użytkownikowi i potrzebuje drogi zastępczej przed wdrożeniem
      - Osoby łączące się z domu stracą dostęp, a zdarza się to częściej, niż wynika z dokumentacji
      - Praca przy maszynie, zdalne zarządzanie przez powłokę, dostęp do udziałów i drukowanie pozostają bez zmian
    en:
      - The switching off of the service breaks off the sittings open at this hour, that one among them from which the command is being run
      - The going back calls for a reach at the machine itself or by another road from afar, that same road being closed
      - The board of help will lose its chief manner of helping a user and needs a road to stand in its stead before the rollout
      - People joining themselves from home will lose their reach, and that happens oftener than the papers show
      - Work at the machine, the governing from afar through the shell, the reach of shares and printing stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko jest obsługiwane zdalnie przez dział wsparcia i nie ma gotowej drogi zastępczej
      - Użytkownik łączy się z tą maszyną z domu i pulpit zdalny jest jedyną drogą pracy
      - Praca zmianowa na jednym stanowisku opiera się na sesjach zdalnych
    en:
      - The station is kept from afar by a board of help and there is no ready road to stand in its stead
      - The user joins themselves to this machine from home and the desk from afar is the one road of work
      - Work by shifts upon one station rests upon sittings from afar
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TermService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off every session open at this moment, the one
    # this command is being run from among them.
    Stop-Service -Name 'TermService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'TermService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'TermService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Reguła jest na poziomie drugim i warto, żeby aplikacja powiedziała
    czemu. Nie dlatego, że zagrożenie jest małe — jest wysokie. Dlatego,
    że na znacznej części stanowisk pulpit zdalny jest sposobem pracy,
    a nie zaniedbaniem.

    Argument wart postawienia wprost dotyczy tego, czym ta droga różni
    się od pozostałych dróg zdalnych. Nie ma tu ograniczenia zakresu:
    sesja graficzna daje dokładnie to, co daje siedzenie przy maszynie.
    Dlatego hasło działające tu jest warte więcej niż to samo hasło gdzie
    indziej.

    Odnotowuję zastrzeżenie wykonawcze, bo jest tu najważniejsze
    praktycznie. Polecenie wykonane przez pulpit zdalny zrywa własną
    sesję i powrót tą samą drogą jest niemożliwy. Aplikacja powinna
    ostrzec o tym przed uruchomieniem, a nie po.
  en: |
    The rule stands at the second level and it is well that the application say why. Not because the danger is
    small - it is high. Because upon a great part of stations the desk from afar is a manner of work and no
    neglect.

    The argument worth putting outright touches wherein this road differs from the other roads from afar. There is
    here no bounding of reach: a sitting of pictures gives just what the sitting at the machine gives. Therefore a
    word of passing that works here is worth more than the same word elsewhere.

    I set down the reservation of the doing, that being here the weightiest in practice. A command run through the
    desk from afar breaks off its own sitting and the going back by that same road is not to be had. The
    application ought to warn of that before the setting going and not after.
