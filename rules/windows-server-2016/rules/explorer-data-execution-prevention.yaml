id: win2016-explorer-data-execution-prevention

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Ochrona przed wykonaniem danych w powłoce systemu włączona
    en: Protection against executing data left on in the system shell
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pilnuje, żeby powłoka systemu nie wyłączała ochrony
    odmawiającej wykonania kodu z obszarów pamięci przeznaczonych na dane.

    Mechanizm, o który chodzi, jest jednym z najstarszych zabezpieczeń
    pamięci i jednym z najprostszych. Obszar pamięci ma zapisane, do czego
    służy. Jeżeli służy na dane, procesor odmówi wykonania tego, co się
    w nim znajdzie.

    Zamyka to całą rodzinę ataków polegających na tym, że napastnik
    umieszcza własny kod tam, gdzie program spodziewa się danych — w buforze
    na nazwę pliku, w strukturze opisującej obraz, w przesłanym ciągu
    znaków — i doprowadza do skoku pod ten adres.

    Powłoka systemu jest tu miejscem osobnym, bo przyjmuje dane z bardzo
    wielu źródeł. Miniatury plików, opisy właściwości, rozszerzenia menu
    podręcznego, obsługa formatów obrazu — wszystko to jest kodem cudzym
    wywoływanym na treści, której pochodzenia powłoka nie sprawdza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wykonania własnego kodu przez podsunięcie powłoce pliku o odpowiednio
    spreparowanej treści, bez uruchamiania czegokolwiek.
  en: |
    The setting sees to it that the system shell does not switch off the protection
    refusing to run code from areas of memory meant for data.

    The mechanism meant here is among the oldest of memory protections and among the
    simplest. An area of memory has written down what it serves for. If it serves for
    data, the processor will refuse to run whatever is found in it.

    That shuts a whole family of attacks resting on the attacker putting their own
    code where a program expects data - in a buffer for a file name, in a structure
    describing an image, in a sent string of characters - and bringing about a jump
    to that address.

    The system shell is a place apart here, taking in data from a great many sources.
    File thumbnails, property descriptions, context menu extensions, the handling of
    image formats - all of it is somebody else's code called on contents whose origin
    the shell does not check.

    What an attacker gains while the item goes unmet: the chance to run their own
    code by putting a file of suitably prepared contents before the shell, without
    starting anything at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ochrona jest włączona domyślnie i to od wielu wydań systemu. Wpis,
    o którym mowa, służy wyłącznie do jej wyłączenia, więc wdrożenie
    zapisuje stan, który i tak obowiązuje.

    Wyłącza się ją rozmyślnie i z jednego powodu: rozszerzenie powłoki
    napisane dawno, które generuje kod w czasie działania i robi to
    w sposób sprzeczny z tym mechanizmem. Rozszerzenia takie praktycznie
    zniknęły, a te, które zostały, i tak nie działają na współczesnych
    wydaniach systemu z innych powodów.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi.
    Użytkownik niczego nie zobaczy.

    Czego to nie psuje: pracy z plikami, sieci, logowania, usług. Nie ma
    znanych regresji.
  en: |
    The class is "no disruption".

    The protection is on by default and has been for many releases of the system. The
    entry in question serves only to switch it off, so the rollout writes down a
    state that holds anyway.

    It is switched off deliberately and for one reason: a shell extension written
    long ago which makes code as it runs and does so in a way at odds with the
    mechanism. Such extensions have practically vanished, and those that remain do
    not work on present-day releases of the system for other reasons anyway.

    No restart, sign-out or stopping of a service goes with it. The user will see
    nothing.

    What this does not break: work with files, the network, signing in, or services.
    There are no known regressions.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Bardzo stare rozszerzenie powłoki generujące kod w czasie działania może przestać działać, ale takie rozszerzenia praktycznie zniknęły
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
      - Użytkownik nie zobaczy żadnej zmiany w codziennej pracy
      - Praca z plikami, sieć, logowanie i usługi pozostają bez zmian
    en:
      - A very old shell extension making code as it runs may stop working, but such extensions have practically vanished
      - No restart, no sign-out, no stopping of a service
      - The user will see no change in their daily work
      - Work with files, the network, signing in and services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje rozszerzenie powłoki, które wyraźnie wymaga wyłączenia tej ochrony, i nie da się go zastąpić
    en:
      - A shell extension plainly calling for this protection to be switched off works on the machine and cannot be replaced
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      $name = 'NoDataExecutionPrevention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    $name = 'NoDataExecutionPrevention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is named in the negative - zero means the protection is not
    # switched off, so the wanted state is written with a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoDataExecutionPrevention' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/memory/data-execution-prevention

notes:
  pl: |
    Punkt otwiera blok o tym, co system robi, gdy dane próbują zachować się
    jak kod. Cztery pierwsze reguły bloku dotyczą pamięci i są ze sobą
    spokrewnione mocniej, niż wynika z ich rozrzucenia po zasadach.

    Warto zestawić ten punkt z regułą o kończeniu pracy przy uszkodzeniu
    sterty: obie dotyczą powłoki, obie są w klasie bez uciążliwości i obie
    zapisują stan domyślny. Traktowanie ich jako pary upraszcza pracę
    z raportem.

    Kategoria średnia, choć przedmiotem jest wykonanie kodu, bierze się
    z tego, że ochrona i tak działa. Punkt nie wnosi nowego zabezpieczenia —
    pilnuje, żeby istniejące nie zostało zdjęte.
  en: |
    The item opens the block about what the system does when data tries to behave
    like code. The block's first four rules concern memory and are more closely akin
    than their scattering across the policies suggests.

    Worth setting this item beside the rule about stopping on heap corruption: both
    concern the shell, both are of the class no disruption and both write down the
    default state. Treating them as a pair simplifies work with the report.

    The medium category, the subject being the running of code, comes from the
    protection working anyway. The item brings in no new safeguard - it sees to an
    existing one not being taken away.
