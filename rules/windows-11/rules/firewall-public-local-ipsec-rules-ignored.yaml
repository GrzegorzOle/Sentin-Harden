id: win11-firewall-public-local-ipsec-rules-ignored

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Lokalne reguły zabezpieczeń połączenia pomijane w sieci publicznej
    en: Local connection security rules ignored on a public network
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Reguły zabezpieczeń połączenia rozstrzygają, kiedy ruch ma być
    uwierzytelniony i zaszyfrowany na poziomie sieci, a kiedy wolno go puścić
    bez tego. Są więc czymś innym niż reguły zapory: nie mówią, co przepuścić,
    tylko na jakich warunkach.

    Reguły takie mogą powstać na dwa sposoby — przyjść z zasady obowiązującej
    w całej organizacji albo zostać zapisane lokalnie na maszynie. Lokalne
    zapisuje ten, kto ma na maszynie uprawnienia administratora: sam użytkownik,
    instalator programu albo napastnik, który je zdobył.

    Punkt dotyczy zachowania w sieci publicznej, czyli tam, gdzie maszyna stoi
    wśród obcych. Pominięcie reguł lokalnych sprawia, że o warunkach ruchu
    rozstrzyga wyłącznie zasada przyniesiona z organizacji. Lokalny wyjątek
    dopuszczający ruch nieuwierzytelniony — dopisany kiedyś przy rozwiązywaniu
    problemu albo podłożony celowo — przestaje wtedy obowiązywać dokładnie
    w sieci, w której był najgroźniejszy.
  en: |
    Connection security rules settle when traffic is to be authenticated and
    encrypted at the network level, and when it may pass without that. They are
    therefore something other than firewall rules: they do not say what to let
    through, but on what terms.

    Such rules can arise in two ways - they can come from a policy in force across
    the organisation, or be written locally on the machine. Local ones are written
    by whoever holds administrator rights on the machine: the user themselves, a
    program's installer, or an attacker who has gained them.

    The item concerns behaviour on a public network, that is, where the machine
    stands among strangers. Ignoring local rules means the terms of the traffic are
    settled solely by the policy brought from the organisation. A local exception
    admitting unauthenticated traffic - added once while solving a problem, or
    planted on purpose - then stops applying exactly on the network where it was
    most dangerous.

disruption_description:
  pl: |
    Nic nie przestaje działać w typowym środowisku. Reguły zabezpieczeń połączenia
    są mechanizmem rzadkim: spotyka się je tam, gdzie wdrożono uwierzytelnianie
    ruchu wewnątrz sieci, a na zwykłym stanowisku biurowym nie ma ich wcale.

    Ograniczenie dotyczy wyłącznie profilu publicznego. Reguły lokalne pozostają
    w mocy w sieci domenowej i prywatnej, więc rozwiązania zbudowane na nich
    w sieci firmowej działają dalej.

    Skutek pojawi się tam, gdzie lokalną regułą zabezpieczeń połączenia obsłużono
    połączenie nawiązywane spoza firmy — na przykład dostęp do zasobu
    z komputera w podróży. Takie połączenie przestanie dochodzić do skutku,
    dopóki odpowiadająca reguła nie zostanie przeniesiona do zasady obowiązującej
    w organizacji.

    Nie ma restartu. Zmiana obowiązuje od razu.
  en: |
    Nothing stops working in a typical environment. Connection security rules are a
    rare mechanism: they are met where authentication of traffic inside the network
    has been rolled out, and on an ordinary office station there are none at all.

    The limit concerns the public profile only. Local rules stay in force on the
    domain and private networks, so arrangements built on them inside the company
    network keep working.

    An effect will show where a local connection security rule served a connection
    made from outside the company - access to a resource from a computer on the
    road, say. Such a connection will stop coming about until the matching rule is
    moved into a policy in force across the organisation.

    There is no restart. The change takes effect at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - encryption-and-tls
    - remote-management
  what_breaks:
    pl:
      - Połączenia obsłużone lokalną regułą zabezpieczeń połączenia przestaną działać, gdy maszyna stoi w sieci publicznej
      - Rozwiązania zbudowane na regułach zapisanych na maszynie wymagają przeniesienia do zasady obowiązującej w organizacji
    en:
      - Connections served by a local connection security rule stop working while the machine stands on a public network
      - Arrangements built on rules written on the machine need moving into a policy in force across the organisation
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dostęp do zasobów spoza sieci firmowej opiera się na regule zabezpieczeń połączenia zapisanej lokalnie i nie przeniesiono jej jeszcze do zasady
    en:
      - Access to resources from outside the company network rests on a locally written connection security rule not yet moved into a policy
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Only the public profile is read here. The two remaining profiles keep
      # their local rules on purpose and are outside this item.
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' }
      else { [string]$public.AllowLocalIPsecRules }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'False'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public -ErrorAction Stop |
      Select-Object Name, AllowLocalIPsecRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules $b.AllowLocalIPsecRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt tworzy parę z pominięciem lokalnych reguł zapory w sieci publicznej.
    Nie są to duplikaty: tamten rozstrzyga o tym, co wolno przepuścić, ten —
    na jakich warunkach. Maszyna może mieć pominięte jedne, a nie drugie
    i wtedy ochrona jest połowiczna.

    Stan nieustalony jest zgłaszany jako niespełnienie. Zachowanie domyślne
    dopuszcza reguły lokalne, więc brak rozstrzygnięcia znaczy tutaj to samo
    co zgoda — inaczej niż przy domyślnym zachowaniu dla ruchu wychodzącego,
    gdzie wartość domyślna pokrywa się z wymaganą.
  en: |
    The item pairs with ignoring local firewall rules on a public network. They are
    not duplicates: that one settles what may be let through, this one on what
    terms. A machine may ignore the one and not the other, and the protection is
    then half.

    An unsettled state is reported as unmet. The default behaviour admits local
    rules, so no ruling here means the same as consent - unlike the default
    behaviour for outbound traffic, where the default value matches the required
    one.
