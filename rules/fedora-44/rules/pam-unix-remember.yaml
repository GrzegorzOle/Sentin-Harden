id: fedora44-pam-unix-remember

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.3.3.4.2
  section: Access Control > Pluggable Authentication Modules > Configure pluggable module arguments > Configure pam_unix module
  title:
    pl: Moduł pam_unix nie prowadzi historii haseł
    en: Ensure pam_unix does not include remember
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Argument remember= modułu pam_unix to stary sposób pamiętania haseł,
    który zapisuje ich skróty w /etc/security/opasswd obok pam_pwhistory.
    Dwa mechanizmy historii z różnymi ustawieniami trudno sprawdzić
    i utrzymać, a historię haseł obsługuje już pam_pwhistory.

    Punkt wymaga, żeby żaden wiersz pam_unix w /etc/pam.d/system-auth
    i password-auth nie miał argumentu remember=.
  en: |
    The remember= argument of pam_unix is an old way of remembering
    passwords that keeps their hashes in /etc/security/opasswd next to
    pam_pwhistory. Two history mechanisms with different settings are hard
    to check and maintain, and pam_pwhistory already handles the password
    history.

    The item requires that no pam_unix line in /etc/pam.d/system-auth and
    password-auth has the remember= argument.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta pliki PAM.
  en: |
    Nobody will notice: the check only reads the PAM files.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    pam_lines() {
      [ -r "$1" ] || return 0
      awk -v m="$2" '
        { sub(/#.*/, "") }
        NF == 0 { next }
        { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
        p[n] == m { s = $1; for (i = 4; i <= NF; i++) s = s " " $i; print s }' "$1"
    }
    bad=""
    for f in system-auth password-auth; do
      for a in $(pam_lines "/etc/pam.d/$f" pam_unix.so | awk '{ for (i = 2; i <= NF; i++) if ($i ~ /^remember=/) print $1 ":" $i }'); do
        bad="$bad,$f:$a"
      done
    done
    if [ -z "$bad" ]; then echo "OK:no-remember"; else echo "NOT_OK:${bad#,}"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man8/pam_unix.8.html

notes:
  pl: |
    Sprawdzenie czyta aktywne wiersze pam_unix w /etc/pam.d/system-auth
    i password-auth; inne pliki w /etc/pam.d dołączają te dwa. Profile
    local i sssd generują te wiersze z szablonów w /usr/share/authselect,
    więc ręczna zmiana w /etc/authselect znika przy następnym authselect
    select albo enable-feature. Trwałą zmianę robi się we własnym profilu
    w /etc/authselect/custom i poleceniem authselect apply-changes.

    Profile local i sssd nie dodają remember= do pam_unix, więc wynik NOT_OK
    oznacza własny profil albo ręcznie utrzymywane pliki PAM. Liczbę
    pamiętanych haseł ustawia się wtedy w pam_pwhistory (punkt 5.3.3.3.1).
    Reguła tylko sprawdza stan.
  en: |
    The check reads the active pam_unix lines in /etc/pam.d/system-auth and
    password-auth; other files in /etc/pam.d include these two. The local
    and sssd profiles generate these lines from the templates in
    /usr/share/authselect, so a change by hand in /etc/authselect is lost at
    the next authselect select or enable-feature. A lasting change is made
    in a custom profile in /etc/authselect/custom and with authselect
    apply-changes.

    The local and sssd profiles do not add remember= to pam_unix, so the
    NOT_OK result means a custom profile or PAM files kept by hand. The
    number of remembered passwords is then set in pam_pwhistory (item
    5.3.3.3.1). The rule only checks the state.
