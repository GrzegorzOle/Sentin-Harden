id: win10-password-length-limit-relaxation-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Zdjęcie górnego ograniczenia długości hasła w zasadach kont
    en: Removal of the upper limit on password length in account policy
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Zasada minimalnej długości hasła dla kont lokalnych ma wbudowany sufit:
    bez tego ustawienia nie da się zażądać hasła dłuższego niż czternaście znaków.
    Sufit pochodzi z czasów, w których dłuższego hasła system i tak nie
    przechowywał sensownie.

    Skutkiem jest zasada, która wygląda na ustawioną, a nie da się jej podnieść do
    wartości mającej dziś sens. Hasło czternastoznakowe jest poniżej tego, czego
    wymaga się od hasła administratora lokalnego, a właśnie konta lokalne są tym,
    co ta zasada obejmuje.

    Zdjęcie ograniczenia pozwala ustawić minimalną długość powyżej czternastu
    znaków. Samo w sobie niczego nie wymusza — otwiera drogę zasadzie, która to
    robi.
  en: |
    The minimum password length policy for local accounts carries a built-in
    ceiling - without this setting a password longer than fourteen characters
    cannot be demanded. The ceiling comes from a time when the system did not keep
    a longer password sensibly anyway.

    The consequence is a policy that looks set and cannot be raised to a value that
    makes sense today. A fourteen-character password is below what is asked of a
    local administrator s password, and local accounts are exactly what this policy
    covers.

    Removing the limit allows a minimum length above fourteen characters to be set.
    By itself it demands nothing - it opens the road for the policy that does.

disruption_description:
  pl: |
    Zmiana sama w sobie nie dotyka nikogo, bo nie zmienia żadnego wymagania.
    Podnosi jedynie sufit, do którego wolno ustawić minimalną długość.

    Koszt pojawia się dopiero w kroku następnym, gdy ktoś faktycznie podniesie
    wymaganą długość. Wtedy przy najbliższej zmianie hasła użytkownicy kont
    lokalnych napotkają dłuższy wymóg — i to jest moment, który trzeba zaplanować,
    a nie ten.

    Warto zapisać obie zmiany razem w jednej decyzji, bo zdjęcie ograniczenia bez
    podniesienia wymagania nie daje niczego.
  en: |
    The change by itself touches nobody, since it alters no requirement. It merely
    raises the ceiling up to which the minimum length may be set.

    The cost appears only at the next step, when somebody really raises the
    required length. Then, at their next password change, users of local accounts
    meet a longer requirement - and that is the moment to plan for, not this one.

    It is worth recording both changes together in one decision, since removing the
    limit without raising the requirement gives nothing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zasada minimalnej długości hasła będzie mogła przyjąć wartość powyżej czternastu znaków
      - Samo zdjęcie ograniczenia nie zmienia żadnego wymagania wobec haseł już ustawionych
      - Podniesienie wymaganej długości w kroku następnym będzie odczuwalne przy najbliższej zmianie hasła
      - Logowanie, hasła obowiązujące, konta domenowe i praca użytkownika pozostają bez zmian
    en:
      - The minimum password length policy becomes able to take a value above fourteen characters
      - Removing the limit alone changes no requirement upon passwords already set
      - Raising the required length at the next step is felt at the next password change
      - Signing in, passwords in force, domain accounts and user work are all unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowiska ze starszym oprogramowaniem zakładającym hasło nie dłuższe niż czternaście znaków
    en:
      - Environments with older software assuming a password no longer than fourteen characters
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SAM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RelaxMinimumPasswordLengthLimits'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SAM'
    $name = 'RelaxMinimumPasswordLengthLimits'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SAM'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RelaxMinimumPasswordLengthLimits' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/password-policy

notes:
  pl: |
    Wartość leży w gałęzi menedżera kont, a nie wśród zasad — jest ustawieniem
    samego mechanizmu, nie polityką. Zasada otwiera drogę podniesieniu minimalnej
    długości i ocenia się ją razem z tą drugą, bo osobno nie daje niczego.
  en: |
    The value lies in the account manager s branch rather than among the policies -
    it is a setting of the mechanism itself rather than a policy. The rule opens
    the road for the minimum length to be raised and is judged together with that
    other one, since on its own it gives nothing.
