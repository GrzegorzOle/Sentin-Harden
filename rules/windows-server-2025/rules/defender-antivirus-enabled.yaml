id: win2025-defender-antivirus-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Wyłączenie wbudowanej ochrony przed złośliwym oprogramowaniem zablokowane
    en: Switching the built-in malware protection off blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt pilnuje, żeby w polityce nie było wpisu wyłączającego wbudowaną
    ochronę przed złośliwym oprogramowaniem. Stanem zgodnym jest jawne
    zero, a nie brak wpisu — brak wpisu zostawia rozstrzygnięcie temu,
    kto akurat umie pisać do rejestru.

    Na serwerze ten punkt ma inną historię niż na stacji roboczej i warto
    ją nazwać, bo zmienia sposób pracy z wynikiem. Na stacji wyłączona
    ochrona zwykle znaczy, że coś ją wyłączyło. Na serwerze zwykle znaczy,
    że ktoś ją wyłączył — administrator, świadomie, kilka lat temu, „bo
    spowalniała bazę". Decyzja bywa zapisana w głowie osoby, która już tu
    nie pracuje, i od tamtego czasu nikt do niej nie wrócił.

    Dlatego czerwony wynik na tym punkcie prawie nigdy nie jest odkryciem
    włamania. Jest odkryciem starej decyzji, której nikt nie przeglądał.
    Sposób postępowania jest wtedy inny: najpierw ustal, czy maszyna ma
    inny produkt ochronny, potem — czy powód sprzed lat nadal obowiązuje.

    Jest tu granica, której nie wolno przemilczeć. Na systemie z włączoną
    ochroną przed manipulacją ten wpis i tak nie zadziała — system go
    ignoruje. Wartością punktu nie jest więc samo wyłączenie ochrony,
    tylko to, że w polityce nie leży wpis gotowy zadziałać w chwili, gdy
    ochrona przed manipulacją zostanie zdjęta. A zdejmuje się ją podczas
    wdrożeń i serwisu częściej, niż się o tym pamięta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę
    bez nadzoru nad tym, co się na niej uruchamia, albo przygotowany
    wcześniej wpis, który taką maszynę zrobi przy najbliższej okazji.
  en: |
    The item sees to it that no entry switching off the built-in guard against ill-meaning software
    lies in the policy. The meeting state is an outright nought and not a missing entry - a missing
    entry leaves the settling of it to whoever can at the time write to the registry.

    On a server this item has another history than on a workstation, and it is worth naming, it
    altering the way of working with the outcome. On a workstation a switched-off guard mostly means
    that something switched it off. On a server it mostly means that somebody switched it off - an
    administrator, wittingly, some years back, "it slowing the base down". The deciding is at times
    written in the head of a person who no longer works here, and since then nobody has come back to
    it.

    Therefore a red outcome at this item is almost never the finding of a breaking in. It is the
    finding of an old deciding nobody has looked over. The way of going about it is then another -
    settle first whether the machine has a guarding product of another maker, then whether the
    ground of some years back still holds.

    There is here a bound that must not be passed over in silence. On a system with the guard
    against meddling switched on this entry will not work anyway - the system heeds it not. The
    worth of the item is therefore not the switching off of the guard itself, but that no entry lies
    in the policy ready to work at the moment the guard against meddling is taken away. And it is
    taken away during rollings out and service oftener than is borne in mind.

    What an attacker gains while the item goes unmet - a machine with no watch over what is run upon
    it, or an entry made ready beforehand that will make it into one at the first occasion.

disruption_description:
  pl: |
    Sama zmiana jest wpisem w rejestrze i nie włącza ochrony natychmiast
    ani sama z siebie. Sprawdzenia wymaga to, co się stanie potem, i to
    jest jedyny powód, dla którego ten punkt zostaje poza trybem
    zbiorczym.

    Pierwsza rzecz do ustalenia: czy na maszynie stoi produkt ochronny
    innego wytwórcy. Jeżeli tak, wbudowana ochrona i tak pozostanie
    w trybie ustąpienia, a audyt zgłosi stan „nie dotyczy" dla tych
    punktów, które go rozpoznają. Zdjęcie wpisu niczego wtedy nie
    zepsuje, ale też niczego nie doda.

    Druga rzecz to powód, dla którego wpis powstał. Najczęstszy jest
    prawdziwy: serwer bazy danych, serwer plików albo host wirtualizacji
    potrafi stracić zauważalną część wydajności, gdy ochrona w czasie
    rzeczywistym obejmie pliki danych, dyski maszyn wirtualnych albo
    dziennik transakcji. Właściwą odpowiedzią nie jest jednak wyłączenie
    ochrony na całej maszynie, tylko wyłączenia dla konkretnych ścieżek
    i procesów, opisane przez producenta roli. Ustal je przed zmianą,
    nie po.

    Trzecia rzecz to kolejność. Ten punkt zdejmuje blokadę, a dopiero
    następne punkty tej grupy włączają poszczególne mechanizmy. Naprawa
    samego tego punktu nie zmienia jeszcze obciążenia maszyny — zmieni
    je włączenie ochrony w czasie rzeczywistym, i to tam leży ryzyko
    wydajnościowe, nie tutaj.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    The change itself is an entry in the registry and switches the guard on neither at once nor of
    itself. What needs checking is what happens afterwards, and that is the only ground for which
    this item stays outside the bulk mode.

    The first thing to settle - whether a guarding product of another maker stands on the machine.
    If so, the built-in guard will stay in its standing-aside mode anyway, and the audit will report
    the state "does not apply" for those items that know it. The taking away of the entry will then
    spoil nothing, but neither will it add anything.

    The second thing is the ground the entry came of. The commonest is a true one - a server of a
    base of data, a server of files or a host of virtualisation can lose a markable share of its
    doing where the guard in real time takes in the files of data, the disks of the machines made by
    reckoning, or the day-book of dealings. The right answer, though, is not the switching off of
    the guard on the whole machine, but the leavings-out for set paths and processes set forth by
    the maker of the role. Settle them before the change and not after.

    The third thing is the order. This item takes the block away, and only the following items of
    this group switch the several workings on. The mending of this item alone does not yet alter the
    machine's load - the switching on of the guard in real time will alter it, and there lies the
    risk to the doing, not here.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Sama zmiana jest wpisem w rejestrze i nie włącza ochrony natychmiast ani sama z siebie
      - Na systemie z ochroną przed manipulacją wpis i tak nie zadziała, bo system go ignoruje
      - Przy produkcie ochronnym innego wytwórcy zdjęcie wpisu niczego nie zepsuje i niczego nie doda
      - Ryzyko wydajnościowe leży przy włączaniu ochrony w czasie rzeczywistym, a nie przy tym punkcie
      - Wyłączenia dla ścieżek i procesów roli ustal przed zmianą, nie po niej
    en:
      - The change itself is an entry in the registry and switches the guard on neither at once nor of itself
      - On a system with the guard against meddling the entry will not work anyway, the system heeding it not
      - Where a guarding product of another maker stands, taking the entry away spoils nothing and adds nothing
      - The risk to the doing lies at the switching on of the guard in real time and not at this item
      - Settle the leavings-out for the role's paths and processes before the change and not after it
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono jeszcze wyłączeń dla ścieżek i procesów właściwych dla roli serwera
      - Powód, dla którego wpis powstał, nie został przejrzany i nadal nie wiadomo, czy obowiązuje
    en:
      - The leavings-out for the paths and processes proper to the server's role are not yet settled
      - The ground the entry came of was not looked over and it is still unknown whether it holds
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The compliant state is an explicit zero, not an absent value: without
      # the entry the decision stays with whoever can write to the registry.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableAntiSpyware'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableAntiSpyware'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableAntiSpyware' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-windows

notes:
  pl: |
    Czerwony wynik na tym punkcie prawie nigdy nie jest odkryciem
    włamania — jest odkryciem starej decyzji administratora, której
    nikt nie przeglądał. To zmienia sposób postępowania: najpierw
    produkt ochronny innego wytwórcy, potem aktualność powodu.

    Granica, której nie wolno przemilczeć: przy włączonej ochronie
    przed manipulacją system i tak ignoruje ten wpis. Wartością punktu
    jest to, że wpis nie czeka gotowy na chwilę, gdy ochronę przed
    manipulacją ktoś zdejmie podczas serwisu.

    Ryzyko wydajnościowe, przez które wpis zwykle powstał, materializuje
    się przy ochronie w czasie rzeczywistym, a nie tutaj.
  en: |
    A red outcome at this item is almost never the finding of a breaking in - it is the finding of
    an administrator's old deciding nobody has looked over. That alters the way of going about it -
    first the guarding product of another maker, then whether the ground still holds.

    The bound that must not be passed over in silence - with the guard against meddling switched on
    the system heeds this entry not anyway. The worth of the item is that the entry does not wait
    ready for the moment somebody takes the guard against meddling away during service.

    The risk to the doing the entry mostly came of takes shape at the guard in real time and not
    here.
