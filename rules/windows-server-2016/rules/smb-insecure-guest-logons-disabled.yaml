id: win2016-smb-insecure-guest-logons-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Lanman Workstation
  title:
    pl: Niezabezpieczone logowanie gościa do udziałów wyłączone
    en: Insecure guest logons to shares switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania maszynie łączyć się do cudzych udziałów jako gość, gdy
    podane poświadczenia zostaną odrzucone.

    Mechanizm, o który chodzi, warto opisać, bo jest cichy. Maszyna próbuje
    połączyć się z udziałem, podaje poświadczenie, dostaje odmowę — i zamiast
    zgłosić błąd, łączy się ponownie jako gość, bez uwierzytelnienia. Jeżeli
    druga strona gościa przyjmuje, połączenie dochodzi do skutku i nikt się
    nie dowiaduje, że jest nieuwierzytelnione.

    Kategoria wysoka, bo to zachowanie znosi skutek uwierzytelniania właśnie
    w tej chwili, w której miało ono zadziałać. Połączenie nieuwierzytelnione
    nie ma podpisywania, nie ma szyfrowania i nie ma pewności co do drugiej
    strony. Napastnik podstawiający własny udział pod znaną nazwę dostaje
    sesję, o którą nie musiał prosić.

    Na serwerze 2016 waży to podwójnie. To wydanie jeszcze dopuszcza takie
    połączenia domyślnie — w wydaniach późniejszych zostały wyłączone z góry.
    Maszyna tego rocznika zachowuje się więc łagodnie, dopóki nikt jej tego
    nie odbierze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia własnego zasobu pod ścieżkę, po którą serwer sięga,
    i odebrania połączenia, które miało być uwierzytelnione.
  en: |
    The item forbids the machine to connect to other people's shares as a guest
    once the credentials it supplied are refused.

    The mechanism at issue is worth describing, because it is a quiet one. The
    machine tries to connect to a share, supplies a credential, is refused - and
    instead of reporting an error, connects again as a guest, without
    authenticating. If the other side accepts a guest, the connection is made
    and nobody learns that it is unauthenticated.

    The category is high, because this behaviour cancels the effect of
    authentication at exactly the moment it was meant to work. An
    unauthenticated connection has no signing, no encryption and no certainty
    about the other side. An attacker putting their own share behind a familiar
    name gets a session they did not have to ask for.

    On Server 2016 that weighs twice over. This release still permits such
    connections by default - in later releases they were switched off in
    advance. A machine of this vintage therefore behaves leniently until
    somebody takes that leniency away.

    What an attacker gains while the item goes unmet: the ability to put their
    own resource behind a path the server reaches for, and to receive a
    connection that was meant to be authenticated.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, po co ta maszyna
    sięga na zewnątrz.

    Po zmianie przestaną działać połączenia do udziałów otwartych dla
    wszystkich, bez poświadczeń. Typowo są to proste urządzenia przechowujące
    dane ustawione bez kont, udziały na urządzeniach wielofunkcyjnych oraz
    zasoby wystawione doraźnie na czas jednej migracji i pozostawione na
    stałe.

    Ważna rzecz o objawie: zmiana nie zamienia działającego połączenia
    w błąd czytelny. Zamienia je w odmowę dostępu — czyli w komunikat, który
    zespół przeczyta jako problem z uprawnieniami i będzie szukał po stronie
    kont, a nie po stronie ustawienia.

    Rozwiązaniem takiego przypadku jest konto na urządzeniu docelowym,
    a nie powrót do gościa. Warto to zaplanować razem ze zmianą, bo inaczej
    ustawienie wróci pierwszego dnia po zgłoszeniu.

    Czego to nie psuje: połączeń z podanymi poświadczeniami, udziałów
    domenowych, połączeń przychodzących do tej maszyny ani niczego, co się
    uwierzytelnia.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about what this machine
    reaches out for.

    After the change, connections to shares open to everybody without
    credentials will stop working. Typically those are simple storage devices
    set up with no accounts, shares on multifunction devices, and resources put
    up for the duration of one migration and left in place for good.

    An important point about the symptom: the change does not turn a working
    connection into a legible error. It turns it into access denied - a message
    the team will read as a permissions problem and go looking on the accounts
    side rather than the settings side.

    The answer to such a case is an account on the target device, not a return
    to guest. That is worth planning together with the change, or the setting
    will come back on the first day after the ticket.

    What this does not break: connections with credentials supplied, domain
    shares, incoming connections to this machine, or anything that
    authenticates.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - drivers-and-devices
  what_breaks:
    pl:
      - Połączenia tej maszyny do udziałów otwartych bez poświadczeń przestają dochodzić do skutku
      - Proste urządzenia przechowujące dane ustawione bez kont przestają być osiągalne z tej maszyny
      - Objaw to odmowa dostępu, więc szukanie zacznie się od uprawnień, a nie od ustawienia
      - Połączenia z podanymi poświadczeniami i udziały domenowe działają bez zmian
    en:
      - This machine's connections to shares open without credentials stop succeeding
      - Simple storage devices set up with no accounts stop being reachable from this machine
      - The symptom is access denied, so the search will start with permissions rather than the setting
      - Connections with credentials supplied and domain shares work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna zapisuje dane na udziale otwartym bez poświadczeń, a konta na urządzeniu docelowym nie da się założyć
    en:
      - The machine writes data to a share open without credentials and no account can be created on the target device
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
      $name = 'AllowInsecureGuestAuth'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
    $name = 'AllowInsecureGuestAuth'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The behaviour being closed is quiet: a refused credential is followed by a
    # second attempt as a guest, and the connection succeeds unauthenticated.
    # On this release that is still permitted by default.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowInsecureGuestAuth' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/guest-access-in-smb2-is-disabled-by-default

notes:
  pl: |
    Punkt dotyczy strony łączącej się, a nie przyjmującej. Wyłączenie
    wbudowanego konta gościa na tej maszynie jest osobną regułą i zamyka
    sprawę z drugiej strony — te dwie rzeczy bywają mylone, bo w obu pada
    słowo „gość".

    Na tym wydaniu domyślne zachowanie jest łagodne, więc brak wpisu audyt
    zgłasza jako ustawienie brakujące, a nie jako stan dobry.

    Wartość wymagana to zero, czyli zakaz. Intuicja podpowiada tu czasem
    jedynkę, bo nazwa wpisu mówi o dopuszczeniu, a nie o zakazie — to jest
    ten rodzaj pomyłki, który przechodzi niezauważony przy ustawianiu ręcznym.
  en: |
    The item concerns the connecting side, not the receiving one. Switching off
    the built-in guest account on this machine is a separate rule and closes the
    matter from the other end - the two get confused, because the word "guest"
    appears in both.

    On this release the default behaviour is lenient, so the audit reports a
    missing entry as a missing setting rather than a good state.

    The required value is zero, that is, a refusal. Intuition sometimes suggests
    a one here, because the entry's name speaks of permitting rather than
    forbidding - the kind of slip that passes unnoticed when setting it by hand.
