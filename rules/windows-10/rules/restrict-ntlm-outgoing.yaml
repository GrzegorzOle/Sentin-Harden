id: win10-restrict-ntlm-outgoing

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wychodzący ruch starszego mechanizmu uwierzytelniania rejestrowany
    en: Outgoing traffic of the older authentication mechanism recorded
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna odnotowuje każde użycie starszego
    mechanizmu uwierzytelniania wobec serwera zdalnego — a w wariancie
    surowszym odmawia takiego użycia w ogóle.

    Punkt różni się od pozostałych w tym bloku tym, że sam z siebie niczego
    nie zamyka. Jego wartością jest wykaz: po włączeniu rejestrowania
    maszyna zaczyna wypisywać, wobec czego i kiedy sięgnęła po mechanizm
    starszy.

    Jest to warunek wstępny decyzji, której inaczej nie da się podjąć.
    Odmowa użycia mechanizmu starszego jest czynnością krótką i tanią —
    kosztowne jest ustalenie, co po niej przestanie działać. Wykaz z kilku
    tygodni odpowiada na to pytanie danymi, a nie przypuszczeniem.

    Reguła wpisuje wartość rejestrującą, nie odmawiającą. Odmowa bez wiedzy
    o tym, co z mechanizmu starszego korzysta, odcina dostęp, a wykaz
    powstaje dopiero z rejestrowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: użycie
    mechanizmu starszego niepozostawiające śladu, który dałoby się
    przejrzeć.
  en: |
    The setting makes the machine set down every use of the older authentication mechanism against a remote
    server - and, in the stricter variant, refuse such use altogether.

    The item parts from the rest of this block in closing of itself nothing at all. Its value is the roll: once
    the recording is switched on, the machine begins writing out against what and when it reached for the older
    mechanism.

    It is the forerunning condition of a decision that cannot otherwise be taken. Refusing the older mechanism's
    use is a short and cheap act - what comes dear is settling what will cease working after it. A roll of some
    weeks answers that question with data rather than with a supposition.

    The rule writes the recording value, not the refusing one. A refusal without knowledge of what uses the
    older mechanism cuts access off, and the roll comes only of the recording.

    What an attacker gains while the item goes unmet: a use of the older mechanism leaving no trace that could
    be looked over.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć sama wartość wpisywana niczego nie
    odmawia.

    Sprawdzenia wymaga objętość. Rejestrowanie każdego użycia mechanizmu
    starszego na maszynie sięgającej po wiele zasobów sieciowych potrafi
    wypełnić dziennik operacyjny szybciej, niż przewiduje jego rozmiar
    domyślny — a wtedy wpisy najstarsze wypadają i wykaz jest niepełny
    dokładnie w części najciekawszej.

    Rozwiązaniem jest zwiększenie dziennika przed włączeniem rejestrowania,
    nie po. Warto, żeby aplikacja postawiła to jako czynność poprzedzającą.

    Sprawdzenie przyjmuje dwie wartości, bo maszyna już odmawiająca spełnia
    punkt tak samo jak rejestrująca. Reguła wpisuje jednak wartość
    rejestrującą, bo to ona jest krokiem bezpiecznym.

    Poza tym nie ma skutków dla pracy codziennej.

    Czego to nie psuje: dostępu do zasobów sieciowych, logowania, kont
    domenowych, udziałów plikowych, drukowania, aplikacji.
  en: |
    The class is "needs review", though the value written refuses nothing of itself.

    What calls for a review is the bulk. Recording every use of the older mechanism upon a machine reaching for
    many network resources can fill the operational log quicker than its default size allows - and then the
    oldest entries fall out and the roll is wanting in exactly its most interesting part.

    The answer is to enlarge the log before the recording is switched on, not after. It is well that the
    application set that down as a forerunning act.

    The check takes two values, a machine already refusing meeting the item as fully as one recording. The rule
    writes the recording value nonetheless, that being the safe step.

    Beyond this there are no consequences for everyday work.

    What this does not break: the reach to network resources, logging on, domain accounts, file shares,
    printing, or applications.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - logging-and-audit
  what_breaks:
    pl:
      - Dziennik operacyjny zapełnia się szybciej i wpisy najstarsze wypadają, więc wykaz jest niepełny
      - Zwiększenie dziennika trzeba wykonać przed włączeniem rejestrowania, a nie po nim
      - Wartość wpisywana rejestruje, a nie odmawia, więc dostęp do zasobów nie zmienia się wcale
      - Maszyna ustawiona surowiej, czyli odmawiająca, spełnia punkt tak samo i nie jest pokazywana jako niezgodna
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - The operational log fills quicker and the oldest entries fall out, so the roll is wanting
      - The log has to be enlarged before the recording is switched on, not after
      - The value written records and does not refuse, so the reach to resources does not change at all
      - A machine set the stricter way, which is to say refusing, meets the item as fully and is not shown failing
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik operacyjny ma rozmiar domyślny, a maszyna sięga po wiele zasobów sieciowych
      - Nie ma kto przejrzeć powstającego wykazu, więc rejestrowanie nie doprowadzi do żadnej decyzji
    en:
      - The operational log is of its default size and the machine reaches for many network resources
      - There is nobody to look the roll over, so the recording will lead to no decision
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero records nothing, one records every use, two refuses it outright.
      # Both one and two meet the item, so a machine already refusing is not shown
      # as failing for being stricter.
      # The key belongs to the authentication package and is always there, so its
      # absence is a fault rather than a state worth reporting apart.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'RestrictSendingNTLMTraffic'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[12]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'RestrictSendingNTLMTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Recording, not refusing: a refusal without knowing which servers rely upon
    # the older mechanism cuts access off, and the roll comes only once the
    # recording has run a while.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictSendingNTLMTraffic' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-outgoing-ntlm-traffic-to-remote-servers

notes:
  pl: |
    Reguła jest w tej paczce jedną z nielicznych, których celem jest wiedza,
    a nie zabezpieczenie. Warto, żeby aplikacja nazwała to wprost, bo
    użytkownik widzący ją obok reguł zamykających drogi oczekuje po niej
    tego samego.

    Wykonanie tej reguły ma sens tylko wtedy, gdy ktoś wykaz przejrzy.
    Rejestrowanie włączone i nieczytane jest kosztem bez zysku, a przy tym
    zabiera miejsce w dzienniku innym zdarzeniom. Jest to rzadki przypadek,
    w którym odpuszczenie punktu z uzasadnieniem „nie mamy kto tego czytać"
    jest decyzją poprawną.

    Odnotowuję kolejność. Zwiększenie dziennika należy wykonać przed
    włączeniem rejestrowania; odwrotna kolejność daje wykaz z dziurą
    w miejscu najstarszym, czyli tam, gdzie leżą zdarzenia rzadkie.
  en: |
    The rule is one of the few in this pack whose aim is knowledge rather than a safeguard. It is well that the
    application name that outright, the user seeing it beside rules that close roads looking for the same of it.

    Carrying this rule out makes sense only where somebody will look the roll over. A recording switched on and
    unread is a cost without a gain, and it takes room in the log from other events besides. It is a rare case
    in which letting the item go with the justification "we have nobody to read this" is a sound decision.

    I set down the order. The log is to be enlarged before the recording is switched on; the reverse order gives
    a roll with a hole at its oldest place, which is where the seldom events lie.
