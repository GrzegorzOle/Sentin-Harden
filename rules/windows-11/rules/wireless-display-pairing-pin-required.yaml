id: win11-wireless-display-pairing-pin-required

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Connect
  title:
    pl: Parowanie z wyświetlaczem bezprzewodowym wymaga kodu
    en: Pairing with a wireless display requires a code
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Rzutowanie obrazu na wyświetlacz bezprzewodowy zestawia połączenie wprost
    między maszyną a odbiornikiem, z pominięciem sieci lokalnej. Domyślnie
    połączenie to nie wymaga potwierdzenia kodem wyświetlonym na ekranie
    odbiornika — wystarczy wybrać urządzenie z listy.

    Brak kodu znaczy, że o tym, co zostanie pokazane, rozstrzyga wyłącznie
    nazwa widoczna na liście. Odbiornik podszywający się pod ten w sali
    konferencyjnej jest trywialny do przygotowania i nie wymaga niczego poza
    zbliżeniem się na odległość zasięgu. Osoba rzutująca prezentację wybiera
    nazwę, którą zna, i pokazuje zawartość swojego ekranu komuś zupełnie innemu,
    nie mając jak tego zauważyć.

    Ekran pokazuje zwykle więcej, niż zakłada osoba rzutująca: powiadomienia
    poczty, otwarte dokumenty, adresy w przeglądarce, zawartość menedżera haseł
    w chwili nieuwagi. Przechwycenie obrazu jest wyniesieniem danych, nawet gdy
    nie ma tu ani pliku, ani połączenia sieciowego, które dałoby się zauważyć.

    Kod potwierdzany na ekranie odbiornika zamyka tę drogę. Aby połączenie
    doszło do skutku, trzeba widzieć urządzenie, do którego się rzutuje.
  en: |
    Casting a picture to a wireless display sets up a connection straight between the
    machine and the receiver, passing the local network by. By default that connection
    takes no confirmation by a code shown on the receiver's screen - picking the device
    from a list is enough.

    No code means that what gets shown is settled by the name on the list alone. A
    receiver passing itself off as the one in the meeting room is trivial to prepare and
    takes nothing beyond coming within range. The person casting a presentation picks a
    name they know and shows the contents of their screen to somebody else entirely,
    with no way of noticing.

    A screen usually shows more than the person casting assumes: mail notifications,
    open documents, addresses in a browser, the contents of a password manager in a
    moment of inattention. Capturing the picture is data leaving, even though there is
    neither a file nor a network connection here that could be noticed.

    A code confirmed on the receiver's screen closes that route. For the connection to
    come about, one has to see the device being cast to.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy rzutowanie bezprzewodowe jest na tej maszynie
    używane i z jakimi odbiornikami.

    Tam, gdzie nie jest używane — a na maszynie stacjonarnej zwykle nie jest —
    zmiana nie robi nic.

    Tam, gdzie jest, dochodzi jeden krok: po wybraniu urządzenia trzeba przepisać
    kod widoczny na jego ekranie. Dla prowadzącego spotkanie jest to kilkanaście
    sekund na początku, co przy krótkich spotkaniach bywa odbierane jako
    uciążliwość nieproporcjonalna do zysku.

    Istotniejszy jest przypadek, w którym kodu nie ma jak odczytać. Odbiornik
    wbudowany w ekran bez własnego interfejsu, odbiornik ustawiony tyłem albo
    wyświetlacz w miejscu, do którego nie ma dostępu w trakcie rzutowania —
    w każdym z tych przypadków parowanie stanie się niemożliwe, a nie tylko
    wolniejsze. Rozpoznanie tego przed wdrożeniem jest konieczne, bo objawem
    jest zatrzymanie spotkania.

    Wybór między wymaganiem kodu przy pierwszym parowaniu a wymaganiem go za
    każdym razem jest tu istotny. Pierwsza możliwość załatwia zagrożenie przy
    zachowanej wygodzie: urządzenie raz sparowane działa dalej bez pytania.
    Druga jest bezpieczniejsza w miejscach otwartych dla osób z zewnątrz,
    ale kosztuje przy każdym spotkaniu.

    Nie ma restartu. Zmiana dotyczy parowań nawiązywanych po jej wprowadzeniu.
  en: |
    What needs checking is whether wireless casting is used on this machine and with
    which receivers.

    Where it is not used - and on a stationary machine it usually is not - the change
    does nothing.

    Where it is, one step is added: after picking the device one has to type in the code
    shown on its screen. For whoever is running a meeting that is a dozen or so seconds
    at the start, which at short meetings is sometimes felt as a nuisance out of
    proportion to the gain.

    The case where the code cannot be read matters more. A receiver built into a screen
    with no interface of its own, a receiver set back to front, or a display in a place
    there is no reaching during the casting - in each of these pairing becomes
    impossible rather than merely slower. Recognising this before the rollout is
    necessary, because the symptom is a meeting coming to a halt.

    The choice between asking for a code at the first pairing and asking for it every
    time matters here. The first settles the threat while keeping the convenience: a
    device paired once works on without asking. The second is safer in places open to
    people from outside, but costs at every meeting.

    There is no restart. The change concerns pairings made after it.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Rzutowanie na wyświetlacz bezprzewodowy wymaga przepisania kodu z jego ekranu
      - Parowanie z odbiornikiem, którego ekranu nie widać, przestaje być możliwe
      - Rozpoczęcie spotkania z rzutowaniem trwa kilkanaście sekund dłużej
      - Na maszynie, na której rzutowanie nie jest używane, nie zmienia się nic
    en:
      - Casting to a wireless display takes typing in the code from its screen
      - Pairing with a receiver whose screen cannot be seen stops being possible
      - Starting a meeting with casting takes a dozen or so seconds longer
      - On a machine where casting is not used nothing changes at all
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Odbiornik jest wbudowany w ekran i nie pokazuje kodu w sposób możliwy do odczytania
      - Rzutowanie jest uruchamiane samoczynnie przez system rezerwacji sal bez udziału człowieka
    en:
      - The receiver is built into a screen and shows no code in a way that can be read
      - Casting is started automatically by a room booking system with no person involved
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero never asks for a code,
      # one asks at the first pairing, two asks every time.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
      $name = 'RequirePinForPairing'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(1|2)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
    $name = 'RequirePinForPairing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One asks for a code at the first pairing and lets a known receiver through
    # afterwards. Two asks every time and suits places open to outsiders.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequirePinForPairing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-wirelessdisplay

notes:
  pl: |
    Sprawdzenie przechodzi zarówno przy wymaganiu kodu tylko przy pierwszym
    parowaniu, jak i przy wymaganiu go za każdym razem. Ta druga możliwość jest
    ostrzejsza, więc maszyna tak ustawiona nie jest zgłaszana jako niezgodna.
    Naprawa ustawia wariant łagodniejszy, bo to on godzi zysk z wygodą; wariant
    ostrzejszy trzeba wybrać świadomie, zmieniając wartość na dwa.

    Punkt dotyczy wyłącznie rzutowania obrazu na odbiornik bezprzewodowy.
    Nie zmienia niczego w rzutowaniu przez przewód ani w udostępnianiu ekranu
    przez programy do spotkań — tam obowiązują ustawienia tych programów.

    Ustawienie należy do gałęzi zasad przeznaczonej dla tego jednego
    mechanizmu, więc wycofanie usuwa całą gałąź, jeżeli przed zmianą jej nie
    było.
  en: |
    The check passes both where a code is asked for at the first pairing only and where
    it is asked for every time. The second is the stricter, so a machine set that way is
    not reported as deviating. The fix sets the milder variant, since that is the one
    reconciling gain with convenience; the stricter has to be chosen deliberately by
    changing the value to two.

    The item concerns casting a picture to a wireless receiver alone. It changes nothing
    about casting over a cable or about sharing a screen through meeting programs -
    there the settings of those programs hold.

    The setting belongs to a policy key meant for this one mechanism, so rollback
    removes the whole key where it was not there before the change.
