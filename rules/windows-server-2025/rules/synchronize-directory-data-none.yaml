id: win2025-synchronize-directory-data-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Synchronizowanie danych usługi katalogowej nieprzyznane nikomu
    en: Synchronising directory service data granted to no one
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala odczytać zawartość usługi katalogowej z pominięciem
    uprawnień ustawionych na poszczególnych obiektach. Nie jest to
    dostęp szeroki — jest to dostęp całkowity, bo cała kontrola dostępu
    w katalogu opiera się właśnie na tych uprawnieniach.

    Znaczenie tego prawa bierze się stąd, co katalog przechowuje.
    Oprócz nazw kont i przynależności do grup przechowuje on także
    materiał poświadczeń: skróty haseł i klucze, na podstawie których
    wystawiane są bilety uwierzytelniające. Odczyt z pominięciem
    uprawnień obejmuje również te atrybuty.

    Skutkiem nie jest więc wgląd w listę użytkowników, tylko możliwość
    wystawiania biletów dla dowolnego konta w domenie, bezterminowo
    i bez kontaktu z kontrolerem. Jest to przejęcie środowiska w postaci
    najtrwalszej z możliwych, bo zmiana hasła pojedynczego konta niczego
    nie naprawia.

    Prawo to jest sensowne wyłącznie na kontrolerze domeny i wyłącznie
    dla mechanizmu replikacji, który korzysta z niego z innego tytułu,
    nie przez ten wykaz. Na serwerze członkowskim nie ma nawet czego
    synchronizować, a wykaz i tak musi pozostać pusty — wpis w nim
    znaczy, że ktoś przygotował sobie drogę na później.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: materiał
    pozwalający podszyć się pod dowolne konto w domenie, w sposób
    odporny na zmianę haseł i niewidoczny dla kontrolera.
  en: |
    The right allows the contents of the directory service to be read while the rights set on
    particular objects are passed over. That is no wide access - it is total access, since all
    access control in the directory rests on those very rights.

    The right's weight comes of what the directory holds. Besides accounts' names and their
    belonging to groups it holds credential matter as well: the digests of passwords and the
    keys on whose ground authenticating tickets are issued. A reading that passes over rights
    takes in those attributes too.

    The effect is thus not a sight of the list of users, but the means of issuing tickets for
    any account in the domain, without term and without touching the controller. It is a
    taking over of an environment in the most lasting shape there is, since changing a single
    account's password mends nothing.

    The right makes sense only on a domain controller and only for the replication mechanism,
    which uses it on another title, not through this list. On a member server there is not
    even anything to synchronise, and the list must stay empty all the same - an entry in it
    means somebody has readied a road for later.

    What an attacker gains while the item goes unmet: matter letting them take on any account
    in the domain, in a way proof against a change of passwords and unseen by the controller.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym wykaz jest pusty — na serwerze członkowskim
    i na kontrolerze domeny tak samo. Naprawa nie ma wtedy czego usunąć.

    Replikacja między kontrolerami domeny nie zależy od tego wykazu.
    Mechanizm replikacji działa na koncie systemu i sięga po dane
    katalogu z innego tytułu, więc opróżnienie wykazu go nie dotyczy.
    Jest to wniosek wart zapamiętania, bo obawa o replikację jest
    najczęstszym powodem, dla którego tego punktu się nie stosuje.

    Narzędzia migracyjne i synchronizujące katalogi z systemami
    zewnętrznymi bywają wyjątkiem — niektóre proszą o to prawo przy
    instalacji. Jeżeli takie narzędzie tu pracuje, po zmianie przestanie
    odczytywać dane i zgłosi odmowę dostępu.

    Nawet wtedy właściwą odpowiedzią nie jest pozostawienie prawa.
    Narzędzia współczesne potrafią działać na uprawnieniach nadanych
    punktowo, na konkretnych gałęziach katalogu, i taka konfiguracja
    jest wykonalna w każdym znanym przypadku.
  en: |
    The change has no known side effects and takes no break.

    In the default state the list is empty - on a member server and on a domain controller
    alike. The mending then has nothing to remove.

    Replication between domain controllers does not hang on this list. The replication
    mechanism works under the system's account and reaches for the directory's data on another
    title, so emptying the list does not bear on it. That is a conclusion worth keeping, since
    fear for replication is the commonest reason this item goes unapplied.

    Migration tools and ones synchronising directories with outside systems are at times the
    exception - some ask for this right at their installation. Where such a tool works here,
    after the change it will stop reading the data and will report a refusal of access.

    Even then the right answer is not leaving the right in place. Present-day tools can work
    on rights granted point by point, on particular branches of the directory, and such a
    configuration is workable in every known case.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć
      - Replikacja między kontrolerami domeny nie zależy od tego wykazu i działa dalej
      - Narzędzie migracyjne proszące o to prawo zgłosi odmowę dostępu po zmianie
      - Narzędzia współczesne potrafią działać na uprawnieniach nadanych punktowo
    en:
      - In the default state the list is empty and the mending has nothing to remove
      - Replication between domain controllers does not hang on this list and goes on working
      - A migration tool asking for this right will report a refusal of access after the change
      - Present-day tools can work on rights granted point by point
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie migracyjne korzystające z tego prawa pracuje właśnie teraz i nie da się go przekonfigurować przed końcem migracji
    en:
      - A migration tool using this right is at work just now and cannot be reconfigured before the migration ends
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSyncAgentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSyncAgentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSyncAgentPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSyncAgentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/synchronize-directory-service-data

notes:
  pl: |
    Punkt obowiązuje tak samo na serwerze członkowskim i na kontrolerze
    domeny. Na pierwszym nie ma czego synchronizować, więc wykaz jest
    pusty z natury; na drugim replikacja nie korzysta z tego wykazu,
    więc opróżnienie go niczego nie psuje.

    Obawa o replikację jest najczęstszym powodem odpuszczania tego
    punktu i jest nieuzasadniona. Mechanizm replikacji sięga po dane
    katalogu z tytułu konta systemu, a nie przez wykaz praw.

    Sprawdzenie przyjmuje wykaz pusty i brak wpisu jako stany
    równoważne. Wykaz jest porządkowany przed porównaniem, a konta
    wskazywane identyfikatorami.
  en: |
    The item holds alike on a member server and on a domain controller. On the first there is
    nothing to synchronise, so the list is empty by nature; on the second replication does not
    use this list, so emptying it breaks nothing.

    Fear for replication is the commonest reason this item is let go and is unfounded. The
    replication mechanism reaches for the directory's data on the title of the system's
    account rather than through the list of rights.

    The check takes an empty list and no entry as equivalent states. The list is put in order
    before the comparison, and accounts are pointed to by identifier.
