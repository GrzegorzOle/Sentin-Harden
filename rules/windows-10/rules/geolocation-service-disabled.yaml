id: win10-geolocation-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa ustalania położenia wyłączona
    en: The service telling the machine s whereabouts switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę ustalającą, gdzie maszyna się znajduje,
    i udostępniającą tę informację programom.

    Położenie nie jest ustalane z odbiornika satelitarnego, bo stanowisko
    zwykle go nie ma. Jest ustalane z sieci: z adresu, z widocznych sieci
    bezprzewodowych i z ich siły sygnału. Dokładność bywa przy tym
    zaskakująco duża, bo zbiór punktów dostępowych w okolicy jest
    niepowtarzalny.

    Zagrożenie polega na tym, że informacja ta jest dostępna dla
    programów działających na maszynie, w tym dla takich, których nikt
    świadomie nie instalował. Program potrafi więc ustalić, gdzie maszyna
    stoi, bez pytania kogokolwiek o zgodę.

    Drugim skutkiem jest to, że dane o widocznych sieciach bezprzewodowych
    są wysyłane, żeby położenie mogło zostać ustalone. Maszyna opisuje
    więc swoje otoczenie sieciowe na zewnątrz.

    Odnotowuję, że punkt dotyczy usługi. Osobno istnieje punkt wyłączający
    ten mechanizm zasadą, a oba warto wdrożyć razem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: położenie
    maszyny ustalane bez odbiornika i opis jej otoczenia sieciowego.
  en: |
    The setting switches off the service telling where the machine stands and giving that word out to programs.

    The whereabouts is not told from a taker of signals from the sky, a station commonly having none. It is told
    from the network: from the address, from the networks without wires to be seen, and from the strength of their
    signals. The nearness is at times startlingly great, the gathering of points of entry about being one of a
    kind.

    The danger lies in this, that such word is to be had by the programs working upon the machine, those among
    them that nobody knowingly laid on. A program can therefore tell where the machine stands without asking
    anybody's leave.

    The second upshot is that word of the networks without wires to be seen is sent out so that the whereabouts
    may be told. The machine sets out therefore its own surroundings of network abroad.

    I set down that the item touches the service. There stands apart an item switching that mechanism off by
    policy, and both are worth rolling out together.

    What an attacker gains while the item goes unmet: the machine's whereabouts told with no taker of signals, and
    a setting out of its surroundings of network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    któryś z używanych programów potrzebuje położenia.

    Miejscem pierwszym są mapy i narzędzia planowania tras. Po zmianie
    poproszą o podanie miejsca ręcznie zamiast ustalić je same.

    Miejscem drugim jest ustawianie strefy czasowej według położenia.
    Maszyna przewożona między strefami przestanie zmieniać czas sama
    i trzeba będzie zrobić to ręcznie.

    Miejscem trzecim są narzędzia odnajdywania zagubionego urządzenia.
    Na stanowisku przenośnym bywa to funkcja, na którą ktoś liczy, i po
    zmianie przestanie działać — co ujawni się w najgorszym możliwym
    momencie.

    Skutek jest widoczny dla użytkownika i pojawia się natychmiast.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: łączności sieciowej, przeglądania stron, pracy
    programów niekorzystających z położenia, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether any of the programs in use needs the
    whereabouts.

    The first place is maps and tools of the planning of roads. After the change they will ask that the place be
    given by hand rather than tell it themselves.

    The second place is the setting of the belt of time after the whereabouts. A machine carried between belts
    will cease to change the hour itself and it will have to be done by hand.

    The third place is tools for the finding of a lost thing. Upon a station carried about that is at times a
    working somebody counts upon, and after the change it will cease to work - which will come to light at the
    worst hour there could be.

    The consequence is plain to the user and shows at once.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the joining to the network, the looking over of pages, the work of programs that use
    no whereabouts, logging on, or printing.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Mapy i narzędzia planowania tras poproszą o podanie miejsca ręcznie zamiast ustalić je same
      - Maszyna przewożona między strefami czasowymi przestanie zmieniać czas sama
      - Narzędzia odnajdywania zagubionego urządzenia przestaną działać, co ujawni się w najgorszym momencie
      - Punkt dotyczy usługi, a osobno istnieje punkt wyłączający ten mechanizm zasadą
      - Łączność sieciowa, przeglądanie stron, logowanie, drukowanie i praca pozostałych programów pozostają bez zmian
    en:
      - Maps and tools of the planning of roads will ask that the place be given by hand rather than tell it themselves
      - A machine carried between belts of time will cease to change the hour itself
      - Tools for the finding of a lost thing will cease to work, which will come to light at the worst hour
      - The item touches the service, and apart from it stands an item switching that mechanism off by policy
      - The joining to the network, the looking over of pages, logging on, printing and the work of other programs stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko przenośne jest zabezpieczone narzędziem odnajdywania zagubionego urządzenia
      - Praca opiera się na mapach albo planowaniu tras z położeniem ustalanym samoczynnie
    en:
      - A station carried about is guarded by a tool for the finding of a lost thing
      - The work rests upon maps or the planning of roads with the whereabouts told of itself
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'lfsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lfsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'lfsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-windows-11-endpoints

notes:
  pl: |
    Reguła bywa czytana jako punkt o prywatności użytkownika i warto,
    żeby aplikacja przesunęła uwagę o krok dalej. Położenie jest tu
    ustalane z otoczenia sieciowego, więc maszyna musi je opisać na
    zewnątrz — i to jest treść zastrzeżenia.

    Argument wart postawienia wprost dotyczy dokładności. Zbiór punktów
    dostępowych widocznych w danym miejscu jest niepowtarzalny, więc
    położenie ustalone tą drogą bywa dokładniejsze, niż ktokolwiek się
    spodziewa po maszynie bez odbiornika satelitarnego.

    Odnotowuję parę z punktem wyłączającym ten mechanizm zasadą.
    Wdrożenie obu naraz jest właściwe: usługa zamyka wykonanie, zasada
    zamyka możliwość jej włączenia z powrotem przez użytkownika.
  en: |
    The rule is at times read as an item of the user's privacy, and it is well that the application shift the
    notice a step further. The whereabouts is here told out of the surroundings of network, so the machine must
    set those surroundings out abroad - and that is the substance of the reservation.

    The argument worth putting outright touches the nearness. The gathering of points of entry to be seen in a
    given place is one of a kind, so a whereabouts told by that road is at times nearer than anybody looks for
    from a machine with no taker of signals from the sky.

    I set down the pair with the item switching that mechanism off by policy. The rolling out of both at once is
    right: the service shuts the doing, the policy shuts the power of the user turning it back on.
