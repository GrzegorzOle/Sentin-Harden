id: win2025-local-system-computer-identity-for-ntlm

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konto systemowe uwierzytelniane tożsamością maszyny
    en: The system account authenticated with the machine's identity

  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługi pracujące na koncie systemowym sięgają czasem po zasoby na
    innych maszynach. Konto systemowe nie ma jednak własnej tożsamości
    sieciowej — istnieje wyłącznie wewnątrz maszyny. Trzeba więc
    rozstrzygnąć, czym takie połączenie ma się przedstawić.

    Są dwie możliwości. Pierwsza: przedstawić się kontem maszyny, które
    w sieci istnieje, ma hasło zmieniane samoczynnie i da się wobec niego
    nadać uprawnienia. Druga: nie przedstawiać się wcale i sięgnąć po
    zasób jako nikt.

    Wariant drugi wygląda niewinnie i bywa mylony z ostrożnością, bo
    przecież nie wysyła poświadczeń. W praktyce jest gorszy. Połączenie
    anonimowe nie daje się przypisać do maszyny, więc nie widać w zapisie,
    kto po zasób sięgnął. Nie daje się też ograniczyć uprawnieniami, bo
    nie ma komu ich nadać — zasób albo jest otwarty dla wszystkich, albo
    dla nikogo.

    Na serwerze waży to więcej niż na stanowisku roboczym, bo usług
    pracujących na koncie systemowym i sięgających po sieć jest tu
    wielokrotnie więcej: agenci kopii zapasowych, mechanizmy replikacji,
    zadania obsługi, systemy monitorujące.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    zasobów, które musiały zostać otwarte anonimowo, żeby serwer mógł
    z nich korzystać — a otwarte anonimowo są otwarte dla każdego,
    kto o nie poprosi.
  en: |
    Services working under the system account at times reach for resources on other machines.
    The system account has no network identity of its own, though - it exists only within the
    machine. What such a connection is to present itself as must therefore be settled.

    There are two possibilities. The first: to present itself as the machine's account, which
    does exist on the network, has a password changed of itself and can have rights granted
    towards it. The second: to present itself not at all and to reach for the resource as
    nobody.

    The second variant looks harmless and is at times mistaken for caution, since after all it
    sends no credentials. In practice it is worse. An anonymous connection cannot be tied to a
    machine, so the record does not show who reached for the resource. Neither can it be
    limited by rights, since there is nobody to grant them to - the resource is either open to
    all or to none.

    On a server that weighs more than at a working station, since services working under the
    system account and reaching for the network are here many times more numerous: backup
    agents, replication mechanisms, servicing tasks, monitoring systems.

    What an attacker gains while the item goes unmet: access to resources that had to be
    opened anonymously so the server could use them - and what is opened anonymously is open
    to anyone who asks for it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy jakikolwiek zasób sieciowy jest dla tego
    serwera otwarty anonimowo, bo po zmianie serwer przestanie z niego
    korzystać w ten sposób.

    Nic nie przestaje działać tam, gdzie zasób dopuszcza konta maszyn.
    W domenie jest to sytuacja typowa i zmiana przechodzi niezauważona.

    Skutek pojawia się tam, gdzie zasób po drugiej stronie nie zna konta
    tej maszyny. Serwer przedstawi się wtedy tożsamością, której tamta
    strona nie zaakceptuje, i połączenie zostanie odrzucone. Dotyczy to
    przede wszystkim udziałów na urządzeniach spoza domeny — macierzach,
    urządzeniach kopii zapasowych i systemach starszych, które o kontach
    maszyn nic nie wiedzą.

    Objaw jest jednoznaczny i to jedna z niewielu dobrych stron tej
    zmiany: połączenie zgłasza odmowę dostępu, a nie działa gorzej po
    cichu. Winowajcę widać od razu.

    Rozwiązaniem trwałym jest nadanie kontu tej maszyny uprawnień po
    drugiej stronie. Jest to praca do wykonania po tamtej stronie, więc
    warto ją zaplanować przed zmianą, a nie po odcięciu.
  en: |
    What needs checking is whether any network resource is open to this server anonymously,
    since after the change the server will stop using it that way.

    Nothing stops working where the resource admits machine accounts. In a domain that is the
    typical case and the change passes unnoticed.

    The effect appears where the resource on the other side does not know this machine's
    account. The server will then present an identity that side will not accept, and the
    connection will be turned away. That concerns above all shares on devices outside the
    domain - storage arrays, backup appliances and older systems that know nothing of machine
    accounts.

    The symptom is unmistakable, and that is one of the few good sides of this change: the
    connection reports a refusal of access rather than working worse in silence. The culprit
    shows at once.

    The lasting answer is granting this machine's account rights on the other side. That is
    work to be done on that side, so it is worth planning before the change rather than after
    a cutting off.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Udział na urządzeniu spoza domeny odrzuci połączenie, bo nie zna konta tej maszyny
      - Agent kopii zapasowych sięgający po zasób anonimowo przestanie się do niego dostawać
      - Objaw jest jednoznaczny — połączenie zgłasza odmowę dostępu, a nie cichnie
      - Tam, gdzie zasób dopuszcza konta maszyn, zmiana przechodzi niezauważona
      - Naprawa polega na nadaniu uprawnień po drugiej stronie, czyli poza tą maszyną
    en:
      - A share on a device outside the domain will turn the connection away, knowing nothing of this machine's account
      - A backup agent reaching for a resource anonymously will stop getting to it
      - The symptom is unmistakable - the connection reports a refusal of access rather than falling silent
      - Where the resource admits machine accounts the change passes unnoticed
      - The mending lies in granting rights on the other side, that is, outside this machine
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer korzysta z udziału na urządzeniu spoza domeny otwartego wyłącznie anonimowo
      - Konto tej maszyny nie ma uprawnień po drugiej stronie i nikt nie może ich tam nadać
    en:
      - The server uses a share on a device outside the domain opened anonymously alone
      - This machine's account has no rights on the other side and nobody there can grant them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'UseMachineId'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'UseMachineId'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseMachineId' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-local-system-to-use-computer-identity-for-ntlm

notes:
  pl: |
    Zmiana dotyczy wyłącznie połączeń wychodzących nawiązywanych przez
    usługi pracujące na koncie systemowym. Nie zmienia niczego
    w połączeniach nawiązywanych na kontach użytkowników ani
    w przyjmowaniu połączeń z zewnątrz.

    Konto maszyny w domenie zmienia hasło samoczynnie i nie wymaga
    obsługi. Jest to jego przewaga nad kontem usługowym utworzonym
    ręcznie i warto o niej pamiętać przy planowaniu uprawnień po drugiej
    stronie.

    Punkt daje też zysk poboczny w zakresie zapisu: połączenie
    przedstawione tożsamością maszyny daje się przypisać do źródła,
    a anonimowe nie daje się przypisać do niczego.
  en: |
    The change concerns only outgoing connections made by services working under the system
    account. It changes nothing in connections made under users' accounts nor in the taking of
    connections from outside.

    A machine's account in a domain changes its password of itself and takes no handling. That
    is its advantage over a service account made by hand and is worth keeping in mind at the
    planning of rights on the other side.

    The item gives a side gain in the matter of the record as well: a connection presented
    with the machine's identity can be tied to its source, while an anonymous one can be tied
    to nothing.
