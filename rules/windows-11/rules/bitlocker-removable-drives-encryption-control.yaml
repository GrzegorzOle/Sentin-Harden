id: win11-bitlocker-removable-drives-encryption-control

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zakładanie ochrony nośnika wymiennego dozwolone, zdejmowanie zabronione
    en: Setting up protection of removable media allowed, removing it forbidden
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga dwie rzeczy osobno: czy użytkownik może objąć
    nośnik wymienny ochroną i czy może ją z niego zdjąć.

    Rozdzielenie tych dwóch uprawnień jest sednem punktu. Zakładanie ochrony
    ma być dozwolone, bo inaczej nikt nie zaszyfruje nośnika, gdy zajdzie
    potrzeba, a zasada zamiast chronić, stanie na drodze. Zdejmowanie ochrony
    ma być zabronione, bo jest czynnością, która znosi skutek wszystkich
    pozostałych reguł dotyczących nośników.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, trzeba tu
    opisać ostrożnie, bo droga jest pośrednia. Sam napastnik zwykle nie
    odszyfrowuje nośnika — robi to użytkownik, w dobrej wierze, bo nośnik ma
    trafić do kogoś, kto nie zna hasła, albo do urządzenia, które szyfrowania
    nie obsługuje. Po tej czynności dane leżą na nośniku jawnie, a nośnik
    krąży dalej.

    Wartością punktu jest więc odebranie możliwości cofnięcia ochrony jednym
    kliknięciem, bez decyzji kogokolwiek poza osobą, która akurat się
    spieszy. Zawieszenie i zdjęcie ochrony pozostaje możliwe dla
    administratora — przestaje być czynnością codzienną.
  en: |
    The setting decides two things separately: whether the user may bring a removable
    medium under protection, and whether they may take that protection off it.

    Separating those two permissions is the heart of the item. Setting up protection is
    to be allowed, since otherwise nobody will encrypt a medium when the need arises, and
    the policy, instead of guarding, will stand in the way. Taking protection off is to
    be forbidden, since it is an act that undoes the effect of every other rule about
    media.

    What an attacker gains while the item goes unmet has to be described carefully here,
    since the route is an indirect one. The attacker usually does not decrypt the medium
    themselves - the user does, in good faith, because the medium is to go to somebody
    who does not know the password, or to a device that does not support encryption.
    After that act the data lie on the medium in the clear, and the medium goes on
    circulating.

    The item's worth is therefore in taking away the means of undoing protection with one
    click, with nobody's decision but that of the person who happens to be in a hurry.
    Suspending and removing protection stays possible for an administrator - it stops
    being an everyday act.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w obiegu są nośniki, które trzeba czasem
    odszyfrować — bo takie zastosowania istnieją i nie są nadużyciem.

    Pierwsze: przekazanie nośnika na zewnątrz. Kontrahent, urząd albo
    laboratorium nie zna hasła i nie ma powodu go znać. Dotąd rozwiązywano to
    zdjęciem ochrony; po zmianie trzeba nośnik sformatować i zapisać od nowa
    albo przekazać dane inną drogą.

    Drugie: urządzenia, które nie obsługują szyfrowania. Rejestratory, sprzęt
    pomiarowy, drukarki z gniazdem na nośnik, odtwarzacze — wszystkie one
    przyjmą wyłącznie nośnik niezaszyfrowany. Jeżeli ktoś używa do tego
    nośnika wcześniej chronionego, będzie musiał zamiast tego użyć osobnego,
    nigdy nieszyfrowanego.

    Trzecie: zmiana hasła albo naprawa nośnika z błędami, gdzie procedura
    dostawcy zaczyna się od zdjęcia ochrony.

    W każdym z tych przypadków zdjęcie ochrony pozostaje możliwe
    z uprawnieniami administratora. Zmiana nie zamyka drogi — przenosi ją
    z rąk użytkownika w ręce osoby, która za nośniki odpowiada.

    Zakładanie ochrony działa dalej bez zmiany i użytkownik nie potrzebuje
    do niego niczyjej pomocy.
  en: |
    What needs checking is whether media are in circulation that sometimes have to be
    decrypted - because such uses exist and are not abuses.

    The first: handing a medium outside. A contractor, an office or a laboratory does not
    know the password and has no reason to. Until now that was solved by taking
    protection off; after the change the medium has to be formatted and written afresh,
    or the data passed on by another route.

    The second: devices that do not support encryption. Recorders, measuring equipment,
    printers with a slot for a medium, players - all of them will take an unencrypted
    medium alone. If somebody uses for that a medium protected earlier, they will have to
    use instead a separate one, never encrypted.

    The third: changing a password or repairing a medium with errors, where the
    supplier's procedure starts with removing protection.

    In each of these cases removing protection stays possible with administrator rights.
    The change does not close the route - it moves it from the user's hands into those of
    whoever is answerable for the media.

    Setting up protection carries on unchanged and the user needs nobody's help for it.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Użytkownik nie zdejmie ochrony z nośnika wymiennego ani jej nie zawiesi
      - Przekazanie nośnika na zewnątrz wymaga sformatowania go albo innej drogi przekazania danych
      - Urządzenie nieobsługujące szyfrowania wymaga osobnego, nigdy nieszyfrowanego nośnika
      - Zakładanie ochrony przez użytkownika działa dalej bez zmiany
    en:
      - A user will neither take protection off a removable medium nor suspend it
      - Handing a medium outside takes formatting it or another route for the data
      - A device not supporting encryption takes a separate, never encrypted medium
      - Setting up protection by the user carries on unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki krążą między maszyną a urządzeniami nieobsługującymi szyfrowania
      - Przekazywanie nośników na zewnątrz jest częstą czynnością bez innej drogi
    en:
      - Media circulate between the machine and devices that do not support encryption
      - Handing media outside is a frequent act with no other route available
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item: the policy itself, permission to set up
      # protection and permission to take it off. Anything other than
      # "may set up, may not remove" is reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $configure = $item.'RDVConfigureBDE'
        $allow = $item.'RDVAllowBDE'
        $disable = $item.'RDVDisableBDE'
        if ($null -eq $configure -or $null -eq $allow -or $null -eq $disable) { 'MISSING' }
        elseif ([int]$configure -ne 1) { 'NOT_CONFIGURED' }
        elseif ([int]$allow -ne 1) { 'SETUP_BLOCKED' }
        elseif ([int]$disable -ne 0) { 'REMOVAL_ALLOWED' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      configure         = $item.'RDVConfigureBDE'
      configure_existed = ($null -ne $item.'RDVConfigureBDE')
      allow             = $item.'RDVAllowBDE'
      allow_existed     = ($null -ne $item.'RDVAllowBDE')
      disable           = $item.'RDVDisableBDE'
      disable_existed   = ($null -ne $item.'RDVDisableBDE')
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVConfigureBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVAllowBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVDisableBDE' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.configure_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -Value $b.configure -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -ErrorAction SilentlyContinue
    }
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -ErrorAction SilentlyContinue
    }
    if ($b.disable_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -Value $b.disable -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Sprawdzenie rozróżnia stany niezgodne zamiast zgłaszać jeden. Zablokowane
    zakładanie ochrony to co innego niż dozwolone jej zdejmowanie — pierwsze
    przeszkadza chronić, drugie pozwala ochronę cofnąć. Oba są niezgodne, ale
    wymagają innej reakcji i dlatego widać je osobno.

    Punkt nie wymusza szyfrowania nośników. Rozstrzyga, kto może ochronę
    założyć i kto może ją zdjąć. Wymuszenie zapisu wyłącznie na nośniki
    chronione jest przedmiotem osobnej reguły w tej paczce i to ona sprawia,
    że ten punkt ma praktyczne znaczenie.

    Ochrona zdjęta z nośnika przed wdrożeniem reguły nie wraca sama. Nośniki,
    które były chronione, a przestały, trzeba zaszyfrować ponownie — reguła
    tego nie robi i nie ma jak tego wykryć, bo nośnika nieobecnego w maszynie
    nie da się sprawdzić.
  en: |
    The check tells non-compliant states apart instead of reporting one. Blocked setting
    up of protection is a different matter from allowed removal - the first hinders
    guarding, the second allows guarding to be undone. Both are non-compliant, but they
    call for different responses, and so they are shown apart.

    The item does not force media to be encrypted. It settles who may set protection up
    and who may take it off. Forcing writing only to protected media is the subject of a
    separate rule in this pack, and it is that which gives this item its practical
    weight.

    Protection taken off a medium before the rule was applied does not come back by
    itself. Media that were protected and ceased to be have to be encrypted again - the
    rule does not do this and has no way of detecting it, since a medium not present in
    the machine cannot be checked.
