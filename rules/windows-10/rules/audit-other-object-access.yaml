id: win10-audit-other-object-access

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja pozostałych zdarzeń dostępu do obiektów
    en: The audit of the remaining events of access to objects
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zdarzenia dotyczące zadań harmonogramu i obiektów
    pośredniczących w wywołaniach między procesami.

    Nazwa mówi o resztkach, a w środku leży rzecz pierwszej wagi: zapis
    o utworzeniu, zmianie i usunięciu zadania harmonogramu. Zadanie
    harmonogramu jest najczęściej używanym sposobem na to, żeby cokolwiek
    przetrwało restart maszyny — nie wymaga usługi, nie wymaga sterownika
    i wygląda dokładnie tak samo jak setka zadań wpisanych przez system
    i przez oprogramowanie użytkowe.

    Zapisywane jest zarówno powodzenie, jak i niepowodzenie, i obie połowy
    mają tu treść. Zadanie wpisane mówi, co ma się wykonać; zadanie, które
    się nie wykonało, mówi, że ktoś próbował i mu się nie udało.

    Druga część zbioru dotyczy wywołań między procesami. Jest cichsza
    i trudniejsza w czytaniu, ale to właśnie tam widać próby sięgnięcia
    jednego programu do wnętrza drugiego.

    Odnotowuję, że ten zapis jest naturalnym dopełnieniem inspekcji
    tworzenia procesów. Tamta mówi, co ruszyło; ta mówi, kto to zaplanował.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zadanie
    harmonogramu przeżywające każdy restart i nieodróżnialne od setki zadań
    prawidłowych.
  en: |
    The setting writes down the events touching the tasks of the scheduler and the objects that stand between
    processes at their calls.

    The name speaks of leavings, while within lies a thing of the first weight: the record of the making, the
    changing and the taking away of a scheduler's task. A scheduler's task is the means used oftenest to make
    anything outlast a restart of the machine - it calls for no service, for no driver, and looks exactly like
    the hundred tasks written in by the system and by working software.

    Both success and failure are written, and both halves have substance here. A task written in says what is to
    be carried out; a task that failed to run says somebody tried and did not get through.

    The second part of the set touches the calls between processes. It is quieter and harder to read, but it is
    just there that the attempts of one program to reach into another's innards show.

    I set down that this record is the natural rounding out of the audit of the making of processes. That one
    says what moved; this says who planned it.

    What an attacker gains while the item goes unmet: a scheduler's task outlasting every restart and not to be
    told from the hundred proper ones.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia żadnego zadania harmonogramu i nie wpływa na to,
    co wolno zaplanować. Zapisuje wyłącznie czynności na zadaniach.

    Liczba wpisów jest umiarkowana i związana głównie z instalacją
    oprogramowania, bo instalator zwykle wpisuje zadanie aktualizacji.
    Na maszynie o ustalonym zestawie programów zapis jest niemal pusty.

    Odnotowuję źródło szumu, które bywa myląco częste: system sam wpisuje
    i poprawia własne zadania konserwacyjne, zwłaszcza po aktualizacji.
    Wpisy te są powtarzalne i wiążą się z zadaniami w gałęzi systemowej.

    Zapisywane są oba wyniki, bo zadanie, które się nie wykonało, jest tu
    informacją osobną, a nie brakiem informacji.

    Czego to nie psuje: zadań harmonogramu, ich wykonywania, instalowania
    oprogramowania, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no scheduler's task and bears not upon what may be planned. It writes down the acts upon
    tasks alone.

    The number of entries is middling and tied mostly to the installing of software, an installer as a rule
    writing in a task of updating. Upon a machine with a settled set of programs the record is near empty.

    I set down a source of noise misleadingly frequent: the system itself writes in and mends its own tasks of
    upkeep, above all after an update. Those entries repeat and tie to tasks in the system's own branch.

    Both outcomes are written, a task that failed to run being here a word apart and not the want of a word.

    What this does not break: the scheduler's tasks, their carrying out, the installing of software, logging on,
    file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - System sam wpisuje i poprawia własne zadania konserwacyjne, zwłaszcza po aktualizacji, dając wpisy powtarzalne
      - Instalator oprogramowania zwykle wpisuje zadanie aktualizacji i zostawia tu ślad
      - Zapisywane są oba wyniki, bo zadanie, które się nie wykonało, jest informacją osobną
      - Ustawienie nie zmienia żadnego zadania harmonogramu i nie wpływa na to, co wolno zaplanować
      - Wykonywanie zadań, instalowanie oprogramowania, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - The system itself writes in and mends its own tasks of upkeep, above all after an update, giving repeating entries
      - An installer of software as a rule writes in a task of updating and leaves a trace here
      - Both outcomes are written, a task that failed to run being a word apart
      - The setting changes no scheduler s task and bears not upon what may be planned
      - The carrying out of tasks, the installing of software, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto odróżnić zadania wpisanego przez system od wpisanego ręcznie
    en:
      - The record is not gathered away from the machine and there is nobody to part a task written by the system from one written by hand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9227-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9227-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9227-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. A task written and a task that failed to run are
    # two different pieces of knowledge, and both are wanted here.
    auditpol /set /subcategory:"{0CCE9227-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9227-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-other-object-access-events

notes:
  pl: |
    Reguła jest trzecią w tej paczce o nazwie ukrywającej treść, i tym razem
    strata jest największa. „Pozostałe zdarzenia dostępu do obiektów" brzmi
    jak dopełnienie zbioru; w środku leży jedyny zapis o zadaniach
    harmonogramu.

    Warto, żeby aplikacja nazwała to wprost w tytule widocznym na liście.
    Użytkownik szukający punktu o trwałości nie znajdzie go pod tą nazwą
    i odłoży ją jako dopełnienie.

    Argument wart zachowania dotyczy pary z inspekcją tworzenia procesów.
    Tamta pokazuje, co ruszyło; ta pokazuje, kto kazał temu ruszać przy
    każdym starcie. Zadanie harmonogramu jest tanie w założeniu i drogie
    w wykryciu — bo nie odróżnia się niczym od stu zadań prawidłowych poza
    tym, kiedy powstało.
  en: |
    The rule is the third in this pack with a name hiding its substance, and this time the loss is the greatest.
    "The remaining events of access to objects" sounds like the rounding out of a set; within lies the one record
    about the scheduler's tasks.

    It is well that the application name that outright in the title seen upon the list. A user seeking the item
    about lastingness will not find it under that name and will put it aside as a rounding out.

    The argument worth keeping touches its pairing with the audit of the making of processes. That one shows what
    moved; this shows who bade it move at every start. A scheduler's task is cheap to lay and dear to catch - it
    is parted from the hundred proper ones by nothing but when it came about.
