id: win2025-gaming-accessory-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi urządzeń sterujących do gier wyłączona
    en: The service handling game controllers disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę obsługującą urządzenia sterujące do gier —
    rozpoznającą je po podłączeniu i udostępniającą aplikacjom.

    Zostawiam kategorię niską, ale chcę powiedzieć, czym ten punkt różni
    się od pozostałych w rodzinie platformy gier, bo nie jest ich
    powtórzeniem.

    Tamte dotyczą łączności i konta. Ten dotyczy sprzętu. Usługa czeka
    na pojawienie się urządzenia i reaguje na nie sama, bez udziału
    człowieka — podłączenie czegoś do portu jest dla niej zdarzeniem,
    które trzeba obsłużyć. Na stacji roboczej jest to codzienność.
    Na serwerze podłączenie urządzenia jest zdarzeniem, którego nikt się
    nie spodziewa, a każdy składnik reagujący na taki moment
    samoczynnie jest drobnym rozszerzeniem tego, co da się zrobić,
    stojąc przy maszynie.

    Nie przeceniam tego. Jest to jeden składnik obsługi jednej klasy
    urządzeń, a nie otwarta droga. Punkt ma sens w sumie z pozostałymi
    ograniczeniami urządzeń, nie samodzielnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kolejny
    składnik reagujący samoczynnie na sprzęt podłączony do maszyny,
    uruchomiony na serwerze, do którego nikt takiego sprzętu nie
    podłącza.
  en: |
    The item switches off the service that deals with the steering gear for games - that knows it upon
    its being plugged in and deals it out to the applications.

    I leave the category low, but would say wherein this item is unlike the others of the kin of the
    gaming board, it being no saying over of them.

    Those bear upon the binding and upon the standing. This one bears upon gear. The service waits for
    a device to come forth and answers to it of itself, with no doing of a person - the plugging of
    something into a stead is to it a happening that must be dealt with. Upon a workstation that is an
    everyday thing. Upon a server the plugging in of a device is a happening nobody looks for, and
    every piece that answers to such a moment of itself is a small widening of what may be done while
    standing by the machine.

    I overrate it not. It is one piece dealing with one kind of device and no open road. The item has
    sense in the sum with the other bounds upon devices and not on its own.

    What an attacker gains while the item goes unmet - another piece answering of itself to gear
    plugged into the machine, running upon a server whereinto nobody plugs such gear.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Do serwera nie podłącza się
    urządzeń sterujących do gier i nie ma na nim aplikacji, która by
    ich oczekiwała.

    Uwaga, która wykracza poza tę regułę i którą zapisałem już przy
    łączności platformy gier: składników tej rodziny jest w systemie
    kilka i na serwerze wszystkie zapadają tą samą decyzją. Nie ma
    powodu rozważać ich po kolei ani rozkładać na kilka okien pracy.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast, ale urządzenie podłączone po niej nie
    zostanie rozpoznane, dopóki usługa nie wróci i nie zostanie
    uruchomiona.
  en: |
    I lower the class to "no unease". To a server no steering gear for games is plugged, and there is
    upon it no application that would look for it.

    A note going beyond this rule, which I set down already at the net-binding of the gaming board - of
    the pieces of that kin there are several in the system, and upon a server they all fall by one and
    the same deciding. There is no ground to weigh them one after another nor to spread them over
    several windows of work.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once, but a device plugged in after it will not be known until the service
    come back and be started.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Urządzenie sterujące do gier podłączone do maszyny nie zostaje rozpoznane i nie trafia do aplikacji
      - Do serwera nie podłącza się takich urządzeń i nie ma aplikacji, która by ich oczekiwała
      - Znika składnik reagujący samoczynnie na pojawienie się sprzętu w porcie maszyny
      - Po cofnięciu zmiany urządzenie nie zostanie rozpoznane, dopóki usługa nie zostanie uruchomiona
    en:
      - Steering gear for games plugged into the machine is not known and comes not to the applications
      - To a server no such gear is plugged and there is no application that would look for it
      - The piece answering of itself to gear coming forth in a stead of the machine goes away
      - After the undoing of the change a device will not be known until the service be started
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Do maszyny podłącza się urządzenia sterujące, na przykład jako stanowisko do sprawdzania oprogramowania
    en:
      - Steering gear is plugged into the machine, as a stead for the testing of software for a byspel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxGipSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxGipSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Unlike the rest of this family this one is about hardware: a component
    # that reacts on its own when a device appears in a port. The other
    # services of the family fall by the same decision.
    Stop-Service -Name 'XboxGipSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XboxGipSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XboxGipSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/hid/

notes:
  pl: |
    Różnica wobec pozostałych punktów rodziny: tamte dotyczą łączności
    i konta, ten dotyczy sprzętu. Usługa reaguje sama na pojawienie się
    urządzenia w porcie.

    Na serwerze podłączenie urządzenia jest zdarzeniem, którego nikt się
    nie spodziewa, a składnik reagujący na taki moment samoczynnie jest
    drobnym rozszerzeniem tego, co da się zrobić, stojąc przy maszynie.

    Nie przeceniam tego: punkt ma sens w sumie z pozostałymi
    ograniczeniami urządzeń, nie samodzielnie.
  en: |
    The unlikeness from the other items of the kin - those bear upon the binding and upon the standing,
    this one bears upon gear. The service answers of itself to a device coming forth in a stead.

    Upon a server the plugging in of a device is a happening nobody looks for, and a piece answering to
    such a moment of itself is a small widening of what may be done while standing by the machine.

    I overrate it not - the item has sense in the sum with the other bounds upon devices and not on its
    own.
