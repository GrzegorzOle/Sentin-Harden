id: win2016-rdp-single-session-per-user

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Connections
  title:
    pl: Jedna sesja pulpitu zdalnego na użytkownika
    en: One Remote Desktop session per user
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala jednemu kontu mieć na serwerze tylko jedną sesję
    zdalną naraz. Ponowne połączenie tym samym kontem wraca do sesji już
    otwartej zamiast zakładać obok drugą.

    Punkt bywa czytany jako oszczędność zasobów i jest to lektura zbyt
    wąska. Sesja niepotrzebnie otwarta nie tylko zajmuje pamięć — ona trzyma
    zalogowane konto wraz z jego poświadczeniem w pamięci maszyny, a tam
    poświadczenia sięga każdy, kto uzyska na serwerze uprawnienia wysokie.
    Im więcej sesji wisi niepotrzebnie, tym więcej materiału zostaje do
    zebrania.

    Druga rzecz dotyczy rozliczalności. Przy wielu sesjach tego samego konta
    pytanie „kto to zrobił i gdzie" przestaje mieć jednoznaczną odpowiedź.
    Dziennik pokazuje konto, ale nie rozstrzyga, w której z kilku równolegle
    otwartych sesji rzecz się wydarzyła — a przy koncie używanym przez
    zespół to jest różnica między śladem a domysłem.

    Trzecia rzecz jest najbardziej praktyczna. Połączenie wracające do sesji
    już otwartej sprawia, że porzucona sesja przestaje być niewidoczna.
    Każdy, kto zaloguje się tym kontem, zobaczy, co w niej zostało — łącznie
    z tym, że ktoś zostawił otwartą konsolę zarządzania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: więcej
    zalogowanych kont wiszących w pamięci maszyny i mniej jednoznaczny
    ślad w dzienniku.
  en: |
    The setting lets one account have a single remote session on the server at a
    time. Connecting again with the same account returns to the session already open
    instead of setting up a second beside it.

    The item is at times read as a saving of resources, and that reading is too
    narrow. A session left open needlessly does not only take up memory - it holds a
    signed-in account along with its credential in the machine's memory, and there
    the credential is reachable by anybody gaining high privileges on the server.
    The more sessions hang about needlessly, the more material is left to be
    gathered.

    The second thing concerns accountability. With several sessions of the same
    account the question "who did this, and where" ceases to have an unambiguous
    answer. The log shows the account but does not settle in which of several
    sessions open side by side the thing happened - and with an account used by a
    team that is the difference between a trace and a guess.

    The third thing is the most practical. A connection returning to a session
    already open makes an abandoned session stop being invisible. Anybody signing in
    with that account will see what was left in it - including that somebody left a
    management console open.

    What an attacker gains while the item goes unmet: more signed-in accounts
    hanging in the machine's memory, and a less unambiguous trace in the log.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzić trzeba sposób pracy, nie zgodność
    techniczną — po stronie technicznej nic tu nie może nie zadziałać.

    Kto to odczuje. Osoby prowadzące równolegle kilka sesji do tej samej
    maszyny w różnych celach — jedną z konsolą zarządzania, drugą z narzędziem
    diagnostycznym, trzecią z długo trwającym zadaniem. Po zmianie mają jedną
    i muszą wszystko zmieścić w niej. Jest to utrudnienie realne, choć nie
    blokujące.

    Rzecz, o której trzeba uprzedzić, bo bywa zaskoczeniem. Połączenie z innej
    maszyny nie zakłada nowej sesji, tylko przenosi tę istniejącą do siebie —
    razem z otwartymi oknami i trwającą pracą. Kto połączy się z domu, zabierze
    sesję ze stanowiska w biurze. Nic nie ginie, ale zachowanie jest inne niż
    dotąd i pierwszy raz wygląda na awarię.

    Osobno warto spojrzeć na konta używane przez zespół albo przez procesy.
    Jeżeli tym samym kontem loguje się kilka osób naraz — co samo w sobie jest
    problemem — po zmianie będą sobie tę jedną sesję odbierać nawzajem. Punkt
    ujawnia wtedy wadę, której nie tworzy, ale ujawnia ją nagle.

    Czego to nie psuje: sesji różnych kont, konsoli lokalnej, zadań
    harmonogramu, zarządzania przez powłokę zdalną.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is the way of working
    rather than technical support - on the technical side nothing here can fail to
    work.

    Who will feel it. People running several sessions to the same machine side by
    side for different purposes - one with a management console, a second with a
    diagnostic tool, a third with a long running job. After the change they have one
    and must fit everything into it. That is a real nuisance, if not a blocking one.

    A thing to warn of, since it comes as a surprise. A connection from another
    machine does not set up a new session but moves the existing one across -
    together with its open windows and the work in progress. Whoever connects from
    home will take the session away from the workstation in the office. Nothing is
    lost, but the behaviour differs from before and the first time looks like a
    fault.

    Accounts used by a team or by processes are worth a separate look. If several
    people sign in with the same account at once - which is itself a problem - after
    the change they will take that one session from one another. The item then
    brings out a flaw it does not create, but it brings it out suddenly.

    What this does not break: sessions of different accounts, the local console,
    scheduled tasks, or management through a remote shell.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoba prowadząca równolegle kilka sesji do tej samej maszyny w różnych celach zostaje z jedną i musi zmieścić w niej całą pracę
      - Połączenie z innej maszyny przenosi sesję istniejącą razem z otwartymi oknami zamiast zakładać nową, co przy pierwszym razie wygląda na awarię
      - Konto używane równolegle przez kilka osób sprawia, że będą sobie tę jedną sesję odbierać nawzajem
      - Sesje różnych kont, konsola lokalna i zadania harmonogramu pozostają bez zmian
    en:
      - Somebody running several sessions to the same machine side by side for different purposes is left with one and must fit all their work into it
      - A connection from another machine moves the existing session across with its open windows instead of setting up a new one, which the first time looks like a fault
      - An account used by several people at once means they will take that one session from one another
      - Sessions of different accounts, the local console and scheduled tasks stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Tym samym kontem pracuje równolegle kilka osób i nie da się tego rozdzielić przed wprowadzeniem zmiany
      - Praca na tej maszynie wymaga prowadzenia kilku równoległych sesji jednego konta i nie ma dla nich innego miejsca
    en:
      - Several people work with the same account side by side and this cannot be separated before the change is made
      - Work on this machine calls for several sessions of one account side by side and there is no other place for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fSingleSessionPerUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fSingleSessionPerUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fSingleSessionPerUser' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt jest oznaczony jako odczuwalny w codziennej pracy, bo zmienia
    zachowanie widoczne dla człowieka przy pierwszym ponownym połączeniu.
    Przeniesienie sesji zamiast założenia nowej trzeba opisać wprost
    w aplikacji — inaczej pierwsze zetknięcie z tym zachowaniem trafi do
    zgłoszeń jako awaria.

    Reguła bywa mylona z ograniczeniami czasu sesji, bo obie porządkują to
    samo zjawisko: sesje wiszące bez potrzeby. Różnica jest taka, że ta
    zapobiega ich powstawaniu, a tamte je sprzątają. Obie są potrzebne
    i warto je pokazywać razem.

    Ciekawa jest tu rola ujawniająca. Reguła nie tworzy problemu kont
    dzielonych przez zespół, ale sprawia, że staje się on widoczny tego
    samego dnia. Jeżeli wdrożenie wywoła skargi, warto najpierw sprawdzić,
    czy skarżący się nie pracują wszyscy jednym kontem — bo wtedy prawdziwą
    niezgodnością jest coś innego.
  en: |
    The item is marked as felt in daily work, since it changes behaviour visible to
    a person at the first reconnecting. The moving of a session rather than the
    setting up of a new one has to be described outright in the application - or
    else the first meeting with that behaviour will reach the tickets as a fault.

    The rule is at times confused with session time limits, since both put order
    into the same thing: sessions hanging about without need. The difference is that
    this one keeps them from arising and those clear them away. Both are needed and
    worth showing together.

    Its bringing-out role is interesting here. The rule does not create the problem
    of accounts shared by a team, but it makes that problem visible the same day. If
    the rollout draws complaints, it is worth first checking whether those
    complaining all work with one account - for then the real non-compliance is
    something else.
