id: win2016-lock-screen-slideshow-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Personalization
  title:
    pl: Pokaz obrazów przy zablokowanym ekranie wyłączony
    en: The slideshow at a locked screen switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza pokaz obrazów wyświetlany przy zablokowanym ekranie.

    Uzasadnienie wygląda na kosmetyczne, a nie jest, i warto wyłożyć
    dlaczego. Pokaz obrazów bierze pliki z katalogów wskazanych
    w ustawieniach i wyświetla je kolejno. Znaczy to, że przed
    zalogowaniem system otwiera pliki graficzne, dekoduje je i pokazuje
    na ekranie.

    Powstają stąd dwa skutki. Pierwszy: treść tych plików widzi każdy, kto
    stoi przy maszynie. Katalog z obrazami bywa katalogiem roboczym,
    a obraz bywa zrzutem ekranu albo skanem dokumentu — i wtedy zawartość
    dokumentu wyświetla się przed granicą uwierzytelnienia.

    Drugi: dekodowanie obrazu jest czynnością wykonywaną na pliku
    pochodzącym z dysku, przez składnik pracujący przed zalogowaniem.
    Jest to ta sama klasa zagrożenia co przy czcionkach pobieranych
    z sieci, tylko po innej stronie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wyświetlanie
    treści plików przed granicą uwierzytelnienia oraz dekodowanie ich przez
    składnik pracujący przed zalogowaniem.
  en: |
    The setting switches off the slideshow shown at a locked screen.

    The warrant looks cosmetic and is not, and it is worth setting out why. The slideshow takes files
    from directories named in the settings and shows them one after another. That means that before a
    logon the system opens picture files, decodes them and shows them on the screen.

    Two consequences come of that. The first: the content of those files is seen by anybody standing at
    the machine. A directory of pictures is at times a working directory, and a picture is at times a
    screenshot or a scan of a document - and then a document's content shows before the boundary of
    authentication.

    The second: the decoding of a picture is an act carried out upon a file coming from the disk, by a
    component working before a logon. It is the same class of threat as at fonts fetched from the
    network, only on the other side.

    What an attacker gains while the item goes unmet: the showing of files' contents before the boundary
    of authentication, and their decoding by a component working before a logon.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ekran blokady zachowuje obraz tła — znika wyłącznie zmienianie obrazów
    i czytanie katalogów, z których były brane. Nikt nie traci dostępu do
    niczego.

    Na serwerze pokaz obrazów i tak nie jest używany, więc zmiana jest tam
    widoczna wyłącznie w spisie ustawień.

    Rzecz warta wymienienia dotyczy maszyn, na których ekran blokady pełni
    rolę tablicy informacyjnej — zdarza się to w miejscach ogólnie
    dostępnych. Tam zmiana jest widoczna i trzeba ją zapowiedzieć,
    choć sam fakt, że ekran blokady w takim miejscu wyświetla cokolwiek
    z dysku, jest osobnym powodem do wykonania tego punktu.

    Nie ma innych znanych regresji.

    Czego to nie psuje: obrazu tła ekranu blokady, tła pulpitu, plików
    w katalogach z obrazami, pracy aplikacji, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The lock screen keeps its background picture - what goes away is solely the changing of pictures and
    the reading of the directories they were taken from. Nobody loses access to anything.

    On a server the slideshow is not used anyway, so the change shows there solely in the register of
    settings.

    A thing worth naming concerns machines where the lock screen serves as a notice board - that happens
    in places open to all. There the change is visible and has to be announced, though the very fact that
    a lock screen in such a place shows anything from the disk is a separate cause for carrying this item
    out.

    There are no other known regressions.

    What this does not break: the lock screen's background picture, the desktop's background, the files in
    the picture directories, the working of applications, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Ekran blokady przestaje zmieniać obrazy i zachowuje jeden obraz tła
      - Na maszynie, na której ekran blokady pełni rolę tablicy informacyjnej, zmiana jest widoczna i trzeba ją zapowiedzieć
      - Katalogi z obrazami przestają być czytane przed zalogowaniem, a same pliki pozostają nietknięte
      - Tło pulpitu, praca aplikacji, usługi i sieć pozostają bez zmian
    en:
      - The lock screen ceases to change pictures and keeps a single background picture
      - On a machine where the lock screen serves as a notice board the change is visible and has to be announced
      - The picture directories cease to be read before a logon, and the files themselves stay untouched
      - The desktop background, the working of applications, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ekran blokady tej maszyny pełni rolę tablicy informacyjnej i pokaz obrazów jest tam używany świadomie
    en:
      - This machine's lock screen serves as a notice board and the slideshow is used there knowingly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      $name = 'NoLockScreenSlideshow'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    $name = 'NoLockScreenSlideshow'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The lock screen keeps a single background picture. What goes away is the
    # changing of pictures taken from folders, and the reading of those folders
    # before anybody has logged in.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLockScreenSlideshow' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-abovelock

notes:
  pl: |
    Punkt wygląda na najbardziej kosmetyczny w całym zestawie i właśnie
    dlatego warto przy nim zadbać o opis. Kategoria średnia przy zerowym
    koszcie jest uzasadniona dwoma rzeczami, z których żadna nie wynika
    z nazwy ustawienia: wyświetlaniem treści plików przed zalogowaniem
    i dekodowaniem ich przez składnik pracujący przed granicą.

    Pierwszy z tych argumentów jest mocniejszy, niż się wydaje. Katalog
    wskazany jako źródło obrazów bywa katalogiem roboczym, a nie zbiorem
    tapet. Zrzut ekranu albo skan dokumentu wyświetlony na ekranie blokady
    jest wyniesieniem treści poza granicę uwierzytelnienia — i nikt nie
    musi w tym celu niczego robić.

    Warto też zauważyć, że reguła nie odbiera niczego. Ekran blokady
    zachowuje obraz tła, a pliki zostają na miejscu. Jest to jedna
    z niewielu pozycji, przy których opis skutków może uczciwie powiedzieć,
    że nie ma czego opisywać poza jedną rzeczą widoczną gołym okiem.
  en: |
    The item looks the most cosmetic in the whole set, and for just that reason the description is worth
    care at it. The medium category at nil cost is warranted by two things, neither of which follows from
    the setting's name: the showing of files' contents before a logon and their decoding by a component
    working before the boundary.

    The first of those arguments is stronger than it seems. A directory named as the source of pictures is
    at times a working directory and not a store of wallpapers. A screenshot or a scan of a document shown
    on the lock screen is a carrying of content beyond the boundary of authentication - and nobody has to
    do anything to that end.

    Worth noticing too that the rule takes nothing away. The lock screen keeps its background picture and
    the files stay in place. It is one of the few entries at which the account of consequences can honestly
    say there is nothing to describe beyond one thing visible to the naked eye.
