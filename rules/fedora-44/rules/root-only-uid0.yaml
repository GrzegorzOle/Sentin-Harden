id: fedora44-root-only-uid0

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.4.2.1
  section: Access Control > User Accounts and Environment > Configure root and system accounts and environment
  title:
    pl: Tylko konto root ma UID 0
    en: Ensure root is the only UID 0 account
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: high
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Jądro daje pełne uprawnienia każdemu procesowi z UID 0, bez względu na
    nazwę konta. Drugie konto z UID 0 to ukryty root: logowanie na nie nie
    wygląda w dziennikach jak logowanie roota, a zasady ustawione dla roota
    go nie obejmują. Często zostawia je napastnik jako tylne wejście.

    Punkt wymaga, żeby w /etc/passwd tylko konto root miało UID 0.
  en: |
    The kernel gives full privileges to every process with UID 0, whatever
    the name of the account. A second account with UID 0 is a hidden root:
    logging in to it does not look like a root login in the logs, and the
    rules set for root do not cover it. An attacker often leaves one as a
    back door.

    The item requires that only the root account has UID 0 in /etc/passwd.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/passwd.
  en: |
    Nobody will notice: the check only reads /etc/passwd.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd"; exit 0; }
    r=$(awk -F: '$1 == "root" { print $3; exit }' /etc/passwd)
    o=$(awk -F: '$1 != "root" && $3 ~ /^[0-9]+$/ && $3 + 0 == 0 { printf "%s%s", s, $1; s = "," }' /etc/passwd)
    if [ "$r" != 0 ]; then echo "NOT_OK:root-uid=${r:-none}${o:+,uid0=$o}"
    elif [ -n "$o" ]; then echo "NOT_OK:uid0=$o"
    else echo "OK:root-only"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/passwd.5.html

notes:
  pl: |
    Wynik NOT_OK podaje nazwy kont z UID 0 innych niż root. Takiego konta
    nie należy zmieniać automatycznie: trzeba ustalić, kto i po co je
    utworzył, a potem usunąć je poleceniem userdel albo nadać mu inny UID
    poleceniem usermod -u i poprawić właściciela jego plików. Nieoczekiwane
    konto z UID 0 warto traktować jak ślad włamania. Reguła tylko sprawdza
    stan.
  en: |
    The NOT_OK result gives the names of accounts other than root with
    UID 0. Such an account should not be changed automatically: find out
    who created it and why, then remove it with userdel or give it another
    UID with usermod -u and fix the owner of its files. An unexpected UID 0
    account is best treated as a sign of an intrusion. The rule only checks
    the state.
