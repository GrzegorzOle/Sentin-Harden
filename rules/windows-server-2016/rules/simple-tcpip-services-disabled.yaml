id: win2016-simple-tcpip-services-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Proste usługi diagnostyczne protokołu sieciowego wyłączone
    en: The simple diagnostic services of the network protocol disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Składnik uruchamia zestaw drobnych usług diagnostycznych z pierwszych
    lat sieci — takich, które odsyłają otrzymane dane z powrotem, generują
    ciąg znaków albo podają dzień i godzinę.

    Usługi te powstały po to, żeby dało się sprawdzić, czy połączenie
    w ogóle działa, w czasach, gdy nie było ku temu innych narzędzi. Nie
    mają uwierzytelniania, bo nie miały go mieć, i odpowiadają każdemu, kto
    zapyta.

    Zagrożenie nie polega na tym, co te usługi ujawniają, bo nie ujawniają
    prawie nic. Polega na tym, do czego dają się użyć przez kogoś trzeciego.
    Usługa odsyłająca dane z powrotem i usługa generująca ciąg znaków
    tworzą razem wzmacniacz: napastnik wysyła krótkie pytanie z podszytym
    adresem ofiary, a maszyna odpowiada długim strumieniem skierowanym pod
    ten adres. Kosztem napastnika jest jeden pakiet, kosztem ofiary — cały
    ruch, który maszyna wytworzy.

    Maszyna, na której to działa, nie jest celem. Jest narzędziem użytym
    przeciw komuś innemu — i to właśnie czyni ten punkt poważniejszym, niż
    wyglądałby po samej liście funkcji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę,
    którą może posłużyć się do wzmocnienia ruchu kierowanego przeciw
    wybranemu celowi, nie mając na niej żadnych uprawnień.
  en: |
    The component starts a set of small diagnostic services from the network's earliest
    years - such as send received data back, generate a string of characters, or give the
    day and hour.

    Those services came about so that it could be checked whether a connection worked at
    all, in times when there were no other tools for it. They have no authentication,
    having not been meant to, and they answer anyone who asks.

    The threat lies not in what those services disclose, disclosing as they do almost
    nothing. It lies in what they can be used for by a third party. The service sending
    data back and the service generating a string of characters together make an
    amplifier: the attacker sends a short question with the victim's address put on it, and
    the machine answers with a long stream directed at that address. The attacker's cost is
    one packet, the victim's cost is all the traffic the machine makes.

    The machine on which this works is not the target. It is a tool used against somebody
    else - and that is just what makes this item graver than it would look from the bare
    list of features.

    What an attacker gains while the item goes unmet: a machine they may use to amplify
    traffic directed against a chosen target, holding no permissions on it whatever.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Nic w systemie bieżącym z tych usług nie korzysta. Narzędzia
    diagnostyczne, których używa się dziś do sprawdzania łączności,
    działają zupełnie inną drogą i o ten składnik nie pytają.

    Składnik jest przy tym dodatkiem instalowanym osobno i na większości
    maszyn nie ma go w ogóle. Audyt zwraca wtedy stan „nie dotyczy", a nie
    niezgodność — i jest to wynik prawidłowy, nie brak wyniku.

    Tam, gdzie składnik jest, został zwykle zainstalowany dawno i do
    jednorazowego sprawdzenia, po którym nikt go nie usunął. Nie ma znanego
    zastosowania, w którym jego wyłączenie cokolwiek by zepsuło.

    Nie ma znanych regresji.

    Czego to nie psuje: diagnostyki sieci, sprawdzania łączności,
    rozpoznawania nazw, usług, udziałów, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "no disruption".

    Nothing in a current system uses those services. The diagnostic tools used today for
    checking connectivity work by a wholly different road and do not ask after this
    component.

    The component is besides an addition installed apart, and on most machines it is not
    there at all. The audit then returns the state "not applicable" rather than a
    non-compliance - and that is a proper outcome, not an absence of one.

    Where the component is there, it was as a rule installed long ago and for a single
    check, after which nobody removed it. There is no known use in which switching it off
    would break anything.

    There are no known regressions.

    What this does not break: network diagnostics, the checking of connectivity, resolving
    names, services, shares, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Nic w systemie bieżącym z tych usług nie korzysta, więc wyłączenie nie odbiera żadnej funkcji
      - Na większości maszyn składnika nie ma w ogóle i audyt zwraca wtedy stan nie dotyczy
      - Narzędzia sprawdzające łączność działają inną drogą i nie pytają o ten składnik
      - Diagnostyka sieci, rozpoznawanie nazw, usługi i udziały pozostają bez zmian
    en:
      - Nothing in a current system uses those services, so switching them off takes away no feature
      - On most machines the component is not there at all and the audit then returns the state not applicable
      - Tools checking connectivity work by another road and do not ask after this component
      - Network diagnostics, resolving names, services and shares stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenie pomiarowe w tej sieci sprawdza łączność wyłącznie przez odsyłanie danych tą usługą
    en:
      - A measuring device on this network checks connectivity solely by having data sent back by this service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'simptcp' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Nothing uses these. They answer questions from the era before the network
    # had to be guarded.
    Stop-Service -Name 'simptcp' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'simptcp' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'simptcp' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/simple-tcpip-services

notes:
  pl: |
    Punkt zamyka blok i jest w nim jedyny w klasie bez uciążliwości przy
    kategorii wysokiej. Zestawienie to stawia go w polu szybkich wygranych
    i tam powinien trafić w domyślnym sortowaniu — jest darmowy i zdejmuje
    ryzyko realne.

    Rzecz, która ten punkt odróżnia od wszystkich dotychczasowych, dotyczy
    tego, kogo chroni. Wszystkie pozostałe reguły bronią tej maszyny.
    Ta broni kogoś innego przed tą maszyną. Warto to powiedzieć wprost,
    bo uzasadnienie „zdejmuje ryzyko z ciebie" tutaj nie działa i czytelnik
    ma prawo nie zrozumieć, po co to robi.

    Stan „nie dotyczy" jest tu wynikiem częstym i warto pilnować, żeby
    interfejs nie pokazywał go jako braku odpowiedzi. Składnik
    niezainstalowany to najlepszy możliwy stan tego punktu, a nie stan
    nieustalony.
  en: |
    The item shuts the block and is the only one in it of the class no disruption with a
    high category. That pairing puts it in the field of quick wins and there it should land
    in the default sorting - it is free and takes away a real risk.

    What sets this item apart from all the foregoing concerns whom it guards. All the other
    rules guard this machine. This one guards somebody else against this machine. That is
    worth saying outright, the warrant "it takes a risk off you" not working here, and the
    reader has every right not to grasp what they are doing it for.

    The state "not applicable" is here a frequent outcome and it is worth seeing that the
    interface does not show it as an absence of an answer. A component not installed is
    this item's best possible state, not an unsettled one.
