id: win2025-uac-virtualize-write-failures

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nieudane zapisy starszych programów przekierowywane do katalogu użytkownika
    en: Older programs' failed writes redirected to the user's directory
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza przekierowanie: gdy starszy program próbuje zapisać
    dane w miejscu zastrzeżonym dla systemu, zapis nie kończy się błędem,
    tylko trafia do osobnej kopii w katalogu tego użytkownika.

    Nazwa sugeruje udogodnienie i tym po części jest, ale działa tu jako
    zabezpieczenie. Bez przekierowania program napisany w czasach, gdy
    każdy pracował z uprawnieniami pełnymi, przestaje działać — a reakcją
    typową nie jest poprawienie programu, tylko uruchamianie go jako
    administrator. Przekierowanie usuwa powód, dla którego ktoś sięga po
    to obejście.

    Na serwerze scenariusz wygląda inaczej niż na stanowisku roboczym.
    Nie chodzi o wygodę użytkownika, tylko o to, żeby aplikacja sprzed lat
    nie stała się powodem, dla którego na serwerze uruchamia się cokolwiek
    z pełnymi uprawnieniami na stałe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — ale rośnie szansa, że na tej maszynie coś pracuje
    z uprawnieniami wyższymi, niż potrzebuje, i że stan ten uznano za
    normalny. Jest to punkt zmniejszający pole manewru, a nie zamykający
    drogę, i dlatego kategoria jest średnia.

    Przekierowanie ma też skutek uboczny wart odnotowania: zapisy, które
    dawniej trafiłyby do katalogu systemowego, trafiają teraz do katalogu
    jednego użytkownika i nie są widoczne dla pozostałych.
  en: |
    The setting switches on a redirection: where an older program tries to record data in a
    place reserved for the system, the write does not end in an error but lands in a
    separate copy in that user's directory.

    The name suggests a convenience and in part it is one, but here it works as a safeguard.
    Without the redirection a program written in days when everyone worked with full rights
    stops working - and the typical reaction is not to fix the program but to run it as an
    administrator. The redirection removes the reason anyone reaches for that workaround.

    On a server the scenario looks other than at a working station. It is not about a user's
    convenience but about an application from years ago not becoming the reason anything is
    run on the server with full rights for good.

    What an attacker gains while the item goes unmet: nothing directly - but the chance
    grows that something on this machine works with higher rights than it needs, and that
    the state has been held normal. It is an item narrowing room for manoeuvre rather than
    closing a road, and hence the category is medium.

    The redirection has a side effect worth noting as well: writes that would once have
    landed in the system directory now land in one user's directory and are not visible to
    the rest.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Włączenie przekierowania niczego nie odbiera. Programy, które
    zapisywały dane poprawnie, zapisują je dalej w tym samym miejscu —
    przekierowanie dotyczy wyłącznie zapisów, które bez niego zakończyłyby
    się odmową. Program, który dziś działa, będzie działał tak samo.

    Jest jedna rzecz, o której warto wiedzieć, choć nie jest regresją:
    przekierowany zapis staje się widoczny tylko dla tego konta, które go
    wykonało. Na serwerze, na którym z aplikacji korzysta kilka osób albo
    kilka sesji, dane zapisane w ten sposób przestają być wspólne.
    Rozwiązaniem właściwym jest wtedy zmiana miejsca zapisu w samej
    aplikacji, a nie wyłączanie przekierowania.

    Stan domyślny systemu jest zgodny z punktem, więc wdrożenie zwykle
    niczego nie zmienia.
  en: |
    The change has no known side effects and takes no break.

    Switching the redirection on takes nothing away. Programs that recorded data properly go
    on recording it in the same place - the redirection concerns only writes that would
    without it have ended in a refusal. A program that works today will work the same.

    There is one thing worth knowing, though it is no regression: a redirected write becomes
    visible only to the account that made it. On a server an application is used by several
    people or several sessions on, data recorded this way stop being shared. The right
    answer is then changing the place of the write in the application itself rather than
    switching the redirection off.

    The system's default state matches the item, so the rollout usually changes nothing.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Brak znanych regresji — przekierowanie dotyczy tylko zapisów, które i tak by się nie udały
      - Przekierowany zapis jest widoczny wyłącznie dla konta, które go wykonał
      - Dane zapisywane przez kilka sesji tej samej aplikacji przestają być wspólne
      - Programy zapisujące dane poprawnie działają bez żadnej zmiany
    en:
      - No known regressions - the redirection concerns only writes that would have failed anyway
      - A redirected write is visible to the account that made it alone
      - Data recorded by several sessions of the same application stop being shared
      - Programs recording data properly work with no change at all
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja wymaga, żeby kilka sesji zapisywało dane do jednego pliku w katalogu systemowym
    en:
      - An application takes that several sessions record data into one file in the system directory
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableVirtualization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'EnableVirtualization' -ErrorAction SilentlyContinue).'EnableVirtualization'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableVirtualization'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableVirtualization' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-virtualize-file-and-registry-write-failures-to-per-user-locations

notes:
  pl: |
    Jest to jedyny punkt grupy kontroli uprawnień w klasie „bez
    uciążliwości" i wolno go stosować hurtem. Powód jest taki, że nie
    odbiera niczego: przekierowanie obejmuje wyłącznie zapisy, które bez
    niego zakończyłyby się odmową.

    Przekierowanie dotyczy wyłącznie programów starszego typu, bez
    zadeklarowanego poziomu uprawnień. Program współczesny deklaruje,
    czego potrzebuje, i mechanizm go nie obejmuje.

    Punkt ma sens wyłącznie przy włączonej kontroli uprawnień. Przy
    wyłączonej przekierowanie nie działa, bo nie ma nieudanych zapisów —
    wszystko pisze z uprawnieniami pełnymi.
  en: |
    It is the one item of the rights-control group in the "no disruption" class and may be
    applied in bulk. The reason is that it takes nothing away: the redirection takes in only
    writes that would without it have ended in a refusal.

    The redirection concerns programs of the older kind alone, with no declared level of
    rights. A present-day program declares what it needs and the mechanism does not take it
    in.

    The item makes sense only with the control of rights switched on. With it off the
    redirection does not work, since there are no failed writes - everything writes with
    full rights.
