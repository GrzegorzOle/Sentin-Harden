id: win10-defender-sample-submission

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Automatyczne wysyłanie bezpiecznych próbek
    en: Automatic submission of safe samples
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala wysłać do usługi producenta plik, o którym sam opis
    nie wystarczył do rozstrzygnięcia.

    Punkt ten domyka drogę otwartą przez ochronę dostarczaną z chmury.
    Tamta wysyła opis: skrót, nazwę, rozmiar, ścieżkę. Dla pliku
    widzianego po raz pierwszy opis ten bywa bezużyteczny, bo usługa nie
    ma go z czym zestawić. Wysłanie samego pliku daje odpowiedź, której
    inaczej nie będzie wcale.

    Odnotowuję, co dokładnie obejmuje wartość zgodna. Wysyłane są
    wyłącznie pliki uznane za mało prawdopodobne nośniki danych
    osobowych — pliki wykonywalne, biblioteki, skrypty. Dokumenty,
    arkusze i pliki danych do tej kategorii nie należą; dla nich
    mechanizm pyta użytkownika albo nie wysyła nic, zależnie od wartości.

    Wartość zgodna jest wartością środkową. Ustawienie wysyłające
    wszystko i ustawienie niewysyłające nic to wartości inne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: plik
    nierozstrzygnięty, o którym usługa nie dowie się nigdy niczego poza
    tym, co już wie.
  en: |
    The setting allows a file, about which the description alone did not suffice for a settling, to be sent to
    the maker's service.

    This item closes the road the cloud-delivered protection opened. That one sends a description: a digest, a
    name, a size, a path. For a file seen for the first time that description is at times of no use, the service
    having nothing to set it against. The sending of the file itself gives an answer there would otherwise not be
    at all.

    I set down what exactly the compliant value takes in. Sent are only the files held unlikely bearers of
    personal data - executable files, libraries, scripts. Documents, sheets and files of data do not belong to
    that kind; for them the mechanism either asks the user or sends nothing, according to the value.

    The compliant value is the middle one. The setting that sends everything and the setting that sends nothing
    are other values.

    What an attacker gains while the item goes unmet: an unsettled file, about which the service will never learn
    anything beyond what it already knows.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są dane
    wychodzące z maszyny.

    Ustawienie wysyła pliki. Nie opis pliku — sam plik. Jest to różnica
    istotna i trzeba ją postawić wprost, bo pozostałe punkty rodziny mówią
    wyłącznie o metadanych.

    Zakres jest ograniczony do plików wykonywalnych, bibliotek i skryptów.
    Nie obejmuje dokumentów ani plików danych. Mimo to plik wykonywalny
    własnej roboty bywa własnością organizacji, a jego wysłanie —
    wyniesieniem kodu na zewnątrz.

    Trafia to przede wszystkim w organizacje budujące oprogramowanie
    u siebie. Każda nowa wersja programu wewnętrznego jest plikiem
    nieznanym, więc wysyłka dotyczy jej za każdym razem.

    Rozmowę o tym trzeba odbyć przed zmianą. Jeśli kończy się odmową,
    właściwym wynikiem jest zapisany wyjątek z uzasadnieniem, a nie ciche
    pozostawienie punktu na czerwono.

    Czego to nie psuje: pracy ochrony, wykrywania zagrożeń, pracy bez
    sieci, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is data leaving the machine.

    The setting sends files. Not a file's description - the file itself. It is a weighty difference and has to be
    put outright, the other items of the family speaking of metadata alone.

    The reach is bounded to executable files, libraries and scripts. It does not take in documents nor files of
    data. Even so, an executable file of one's own making is at times a body's own property, and the sending of
    it a carrying of code outside.

    That strikes above all at bodies building software at home. Every new build of an inside program is an unknown
    file, so the sending touches it every time.

    The conversation about it has to be held before the change. Where it ends in a refusal, the proper outcome is
    a written exception with its ground, and not the quiet leaving of the item in red.

    What this does not break: the protection's working, the finding of threats, work without a network, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Wysyłany jest sam plik, a nie jego opis, więc kod programu wewnętrznego opuszcza maszynę
      - Każda nowa wersja programu budowanego u siebie jest plikiem nieznanym i podlega wysyłce za każdym razem
      - Zakres obejmuje pliki wykonywalne, biblioteki i skrypty, a nie obejmuje dokumentów ani plików danych
      - Wartość zgodna jest środkowa, a wysyłanie wszystkiego i niewysyłanie niczego to wartości inne
      - Praca ochrony, wykrywanie zagrożeń, praca bez sieci, logowanie i drukowanie pozostają bez zmian
    en:
      - The file itself is sent and not its description, so the code of an inside program leaves the machine
      - Every new build of a program made at home is an unknown file and falls to the sending every time
      - The reach takes in executable files, libraries and scripts, and takes in neither documents nor files of data
      - The compliant value is the middle one, the sending of everything and the sending of nothing being other values
      - The protection s working, the finding of threats, work without a network, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Organizacja buduje oprogramowanie u siebie i wysłanie plików wykonywalnych byłoby wyniesieniem kodu na zewnątrz
      - Maszyna pracuje w sieci odciętej od zewnątrz i wysyłka i tak nie dojdzie
    en:
      - The body builds software at home and the sending of executable files would be a carrying of code outside
      - The machine works in a network cut off from outside and the sending will not get through anyway
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        [string][int](Get-MpPreference -ErrorAction Stop).SubmitSamplesConsent
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'SubmitSamplesConsent'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One means samples are sent without asking, but only those held unlikely to
    # hold personal data. The settings that send everything, or nothing, are other
    # values.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SubmitSamplesConsent' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną, przy której z maszyny wychodzi
    plik, a nie opis. Warto, żeby aplikacja postawiła tę różnicę wprost,
    bo użytkownik, który czytał wcześniejsze punkty o metadanych,
    przeniesie to założenie także tutaj.

    Argument za punktem jest argumentem o odpowiedzi, której inaczej nie
    będzie. Opis pliku widzianego po raz pierwszy nie mówi usłudze nic,
    czego by sama nie wywnioskowała. Sam plik mówi wszystko — i dlatego
    jest to jedyny sposób, żeby zapytanie o plik nowy miało treść.

    Odnotowuję, że odmowa jest tu wynikiem prawidłowym. Organizacja
    budująca oprogramowanie u siebie ma powód, żeby tego punktu nie
    wdrażać, i powód ten należy zapisać jako wyjątek — bo inaczej za pół
    roku nikt nie odróżni decyzji od zaniedbania.
  en: |
    The rule closes the block and is the only one in it at which a file leaves the machine and not a description.
    It is well that the application put that difference outright, a user who read the earlier items about
    metadata carrying that assumption over here as well.

    The argument for the item is an argument about an answer there would otherwise not be. The description of a
    file seen for the first time tells the service nothing it would not work out itself. The file itself tells
    everything - and for that it is the one means by which an asking about a new file has substance.

    I set down that a refusal is here a proper outcome. A body building software at home has a ground for not
    rolling this item out, and that ground ought to be written down as an exception - for otherwise in half a year
    nobody will tell the decision from a neglect.
