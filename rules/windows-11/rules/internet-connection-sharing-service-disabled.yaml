id: win11-internet-connection-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia sieciowego wyłączona
    en: The network connection sharing service disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pozwala maszynie rozdawać własne połączenie innym urządzeniom —
    przez przewód, przez punkt dostępowy albo przez połączenie z telefonem.
    Maszyna staje się wtedy bramą, tłumaczy adresy i przydziela je urządzeniom,
    które się do niej podłączą.

    Skutek dla sieci jest podwójny. Po pierwsze, do sieci organizacji trafiają
    urządzenia, których nikt nie dopuszczał: telefon, prywatny komputer,
    sprzęt gościa. Widziane od strony sieci, cały ich ruch wychodzi z adresu
    stacji roboczej, więc reguły oparte na tym, kto się łączy, przestają
    rozróżniać cokolwiek — a zapis w dzienniku wskazuje maszynę, nie sprawcę.

    Po drugie, przy udostępnianiu połączenia z sieci zewnętrznej powstaje
    połączenie, które omija drogę wyjściową organizacji. Maszyna trzymająca
    jednocześnie połączenie z siecią firmową i z siecią zewnętrzną, i
    rozdająca to drugie dalej, staje się mostem między nimi.

    Wyłączenie usługi zamyka obie te możliwości. Urządzenia trafiają do sieci
    drogą, którą ktoś nadzoruje, albo nie trafiają wcale.
  en: |
    The service lets the machine hand out its own connection to other devices - by a
    cable, by an access point or by a connection to a phone. The machine then becomes a
    gateway, translating addresses and handing them out to devices that attach to it.

    The effect on the network is twofold. First, devices nobody admitted find their way
    onto the organisation's network: a phone, a private computer, a guest's equipment.
    Seen from the network's side, all their traffic leaves from the workstation's
    address, so rules resting on who is connecting stop telling anything apart - and the
    record in the log points at the machine rather than at whoever did it.

    Second, where a connection from an outside network is shared, a connection comes
    into being that goes round the organisation's way out. A machine holding a
    connection to the company network and to an outside network at once, and handing the
    latter on, becomes a bridge between them.

    Disabling the service closes both possibilities. Devices reach the network by a
    route somebody oversees, or they do not reach it at all.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek rozdaje z tej maszyny połączenie.

    Najczęstszym zastosowaniem jest punkt dostępowy uruchamiany doraźnie —
    w podróży, na szkoleniu, w miejscu bez sieci. Po wyłączeniu usługi ta
    możliwość znika całkowicie: przełącznik w ustawieniach pozostaje widoczny,
    ale jego włączenie kończy się błędem. Objaw jest mylący, bo interfejs nie
    mówi, że rzecz została wyłączona zasadą.

    Drugim zastosowaniem jest podłączenie urządzenia, które nie ma własnej
    sieci — drukarki, sprzętu pomiarowego, urządzenia serwisowego — przewodem
    do stacji roboczej i przepuszczenie go do sieci. Spotyka się to przy pracach
    serwisowych i wtedy wyłączenie usługi zatrzymuje pracę.

    Trzecim jest udostępnianie połączenia z telefonu przez przewód. Tu skutek
    bywa odwrotny do oczekiwanego: samo połączenie maszyny przez telefon
    zwykle działa dalej, bo nie wymaga tej usługi — przestaje działać dopiero
    rozdawanie go dalej.

    Uprzedzenie osób pracujących w terenie jest tu ważniejsze niż sama zmiana.

    Nie ma restartu.
  en: |
    What needs checking is whether anybody hands out a connection from this machine.

    The commonest use is an access point started as the need arises - while travelling,
    at a training session, in a place with no network. Once the service is off that
    possibility goes entirely: the switch stays visible in the settings, but switching
    it on ends in an error. The symptom misleads, because the interface does not say the
    thing was switched off by a policy.

    The second use is attaching a device with no network of its own - a printer,
    measuring equipment, a service device - by a cable to the workstation and letting it
    through to the network. This is met during service work, and there disabling the
    service stops the work.

    The third is sharing a phone's connection over a cable. Here the effect is sometimes
    the opposite of what is expected: the machine's own connection through the phone
    usually carries on working, since it does not need this service - what stops working
    is handing it on.

    Warning the people who work in the field matters more here than the change itself.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Uruchomienie punktu dostępowego na tej maszynie kończy się błędem
      - Urządzenie podłączone przewodem do stacji przestaje być przepuszczane do sieci
      - Przełącznik udostępniania pozostaje widoczny w ustawieniach, choć nie zadziała
      - Własne połączenie maszyny przez telefon działa dalej bez zmian
    en:
      - Starting an access point on this machine ends in an error
      - A device attached to the station by a cable stops being let through to the network
      - The sharing switch stays visible in the settings although it will not work
      - The machine's own connection through a phone carries on working unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca w terenie opiera się na uruchamianiu punktu dostępowego z tej maszyny
      - Sprzęt serwisowy bez własnej sieci jest podłączany przewodem i przepuszczany dalej
    en:
      - Work in the field rests on starting an access point from this machine
      - Service equipment with no network of its own is attached by a cable and let through
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'SharedAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SharedAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SharedAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/network-subsystem/net-sub-interface-metric

notes:
  pl: |
    Punkt uzupełnia regułę ukrywającą udostępnianie połączenia w interfejsie
    i nie zastępuje jej. Tamta zdejmuje przełącznik z okna właściwości
    połączenia; ta wyłącza usługę, która to udostępnianie wykonuje. Wdrożone
    osobno pozostawiają lukę: sam ukryty przełącznik nie przeszkadza uruchomić
    udostępniania poleceniem, a sama wyłączona usługa zostawia w interfejsie
    przełącznik kończący się błędem.

    Usługa obsługuje w nowszych systemach także punkt dostępowy, choć
    ustawienia tego ostatniego znajdują się w zupełnie innym miejscu.
    Wyłączenie usługi zatrzymuje obie możliwości naraz.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The item completes the rule hiding connection sharing in the interface and does not
    stand in for it. That one takes the switch off the connection's properties window;
    this one disables the service that does the sharing. Applied separately they leave a
    gap: a hidden switch alone does not stop sharing being started by a command, and a
    disabled service alone leaves a switch in the interface that ends in an error.

    On newer systems the service also handles the access point, though the settings for
    that are in an entirely different place. Disabling the service stops both
    possibilities at once.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment.
