id: win10-winhttp-proxy-autodiscovery-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa samoczynnego wyszukiwania pośrednika sieciowego wyłączona
    en: The service seeking a go-between of the network of itself switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę ustalającą samoczynnie, przez jakiego
    pośrednika maszyna ma wychodzić do sieci.

    Mechanizm ten pyta sieć o adres pliku z regułami wychodzenia, a pyta
    w sposób, który przyjmuje odpowiedź od pierwszego, kto się odezwie.
    Nie ma tu uwierzytelniania ani potwierdzenia, że odpowiada właściwe
    urządzenie.

    Zagrożenie jest bezpośrednie i dobrze znane. Kto odpowie pierwszy,
    ten wskazuje maszynie pośrednika, a pośrednik widzi cały ruch
    wychodzący i może go zmieniać. Jest to przejęcie ruchu bez dotykania
    maszyny.

    Drugim zastrzeżeniem jest to, że pytanie idzie w każdej sieci,
    w której maszyna się znajdzie — także w hotelowej, konferencyjnej
    i domowej, gdzie sąsiedztwo jest przypadkowe.

    Trzecim jest trwałość. Wskazany pośrednik bywa zapamiętany i używany
    także po zmianie sieci, więc skutek przeżywa okoliczności, w których
    powstał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wskazanie
    maszynie własnego pośrednika przez samą odpowiedź w sieci.
  en: |
    The setting switches off the service telling of itself through what go-between the machine is to go out to the
    network.

    That mechanism asks the network for the address of a file of rules of going out, and asks in a manner that
    takes the answer of the first who speaks up. There is here no warranting and no witness that the right thing
    answers.

    The danger is a straight one and well known. Whoever answers first points the machine to a go-between, and a
    go-between sees all the traffic going out and may change it. It is a taking over of the traffic with the
    machine untouched.

    The second reservation is that the question goes out in every network the machine finds itself in - that of an
    inn, of a gathering and of a home among them, where the neighbourhood is come by chance.

    The third is lastingness. The go-between pointed out is at times held in memory and used after the network is
    changed, so the upshot outlives the case in which it arose.

    What an attacker gains while the item goes unmet: the pointing of the machine to a go-between of their own, by
    the mere answering in the network.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i powód jest poważny: tam, gdzie
    wyjście do sieci prowadzi przez pośrednika ustalanego samoczynnie,
    zmiana zatrzymuje cały ruch wychodzący, a nie jedną drogę do niego.

    Miejscem pierwszym są sieci, w których pośrednik jest jedyną drogą
    na zewnątrz, a jego adres nie jest nigdzie wpisany na stałe. Po
    zmianie maszyna straci dostęp do sieci w całości: przeglądarka,
    poczta, aktualizacje.

    Miejscem drugim są aktualizacje systemu i programów, które korzystają
    z tego mechanizmu niezależnie od ustawień przeglądarki. Zatrzymają
    się po cichu, bez komunikatu widocznego dla użytkownika.

    Miejscem trzecim są maszyny przenośne pracujące w wielu sieciach,
    w których adres pośrednika bywa różny.

    Odnotowuję rozwiązanie właściwe: wpisanie adresu pośrednika na stałe
    przed wyłączeniem usługi. Wtedy punkt zdejmuje zagrożenie i nie
    odcina niczego, a to jest kolejność, o której łatwo zapomnieć.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: sieci lokalnej, udostępniania plików, drukowania,
    logowania, pracy programów niekorzystających z sieci zewnętrznej.
  en: |
    The class is "needs a planned rollout", and the ground is a weighty one: where the way out to the network
    leads through a go-between told of itself, the change stops all traffic going out and not one road to it.

    The first place is networks in which the go-between is the one way out and its address is written nowhere for
    good. After the change the machine will lose its reach of the network whole: the browser, the post, the
    bringing up to date.

    The second place is the bringing up to date of the system and of programs, which use that mechanism without
    regard to the browser's settings. They will stop in silence, with no message to be seen by the user.

    The third place is machines carried about that work in many networks, in which the go-between's address is at
    times another.

    I set down the right answer: the writing of the go-between's address for good before the service is switched
    off. The item then takes the danger away and cuts off nothing, and that is an order of things easily
    forgotten.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the near network, the giving out of files, printing, logging on, or the work of
    programs that use no outward network.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
    - legacy-applications
  what_breaks:
    pl:
      - Tam, gdzie pośrednik jest jedyną drogą na zewnątrz, maszyna straci dostęp do sieci w całości
      - Aktualizacje systemu i programów zatrzymają się po cichu, bez komunikatu widocznego dla użytkownika
      - Maszyny przenośne pracujące w wielu sieciach stracą wyjście w każdej z nich
      - Rozwiązaniem właściwym jest wpisanie adresu pośrednika na stałe przed wyłączeniem usługi
      - Sieć lokalna, udostępnianie plików, drukowanie, logowanie i praca programów bez sieci zewnętrznej pozostają bez zmian
    en:
      - Where the go-between is the one way out, the machine will lose its reach of the network whole
      - The bringing up to date of the system and of programs will stop in silence, with no message seen by the user
      - Machines carried about that work in many networks will lose their way out in each of them
      - The right answer is the writing of the go-between s address for good before the service is switched off
      - The near network, the giving out of files, printing, logging on and the work of programs without outward network stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Wyjście do sieci prowadzi przez pośrednika ustalanego samoczynnie, a jego adres nie jest wpisany na stałe
      - Stanowisko przenośne pracuje w wielu sieciach, w których adres pośrednika jest różny
    en:
      - The way out to the network leads through a go-between told of itself, and its address is not written for good
      - A station carried about works in many networks in which the go-between s address is another
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the way out of the network leads through a proxy found of itself, this
    # stops all traffic going out - not one road to it.
    Stop-Service -Name 'WinHttpAutoProxySvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinHttpAutoProxySvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WinHttpAutoProxySvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winhttp/winhttp-autoproxy-api

notes:
  pl: |
    Reguła wymaga kolejności i warto, żeby aplikacja postawiła ją wprost:
    najpierw wpisanie adresu pośrednika na stałe, potem wyłączenie
    usługi. Odwrotna kolejność odcina maszynę od sieci w całości.

    Argument wart postawienia dotyczy mechanizmu pytania. Maszyna pyta
    sieć o reguły wychodzenia i przyjmuje odpowiedź od pierwszego, kto
    się odezwie. Kto odpowie, ten widzi cały ruch wychodzący i może go
    zmieniać, nie dotykając maszyny.

    Odnotowuję aktualizacje jako skutek najmniej widoczny. Korzystają
    z tego mechanizmu niezależnie od ustawień przeglądarki i zatrzymują
    się po cichu, więc brak zauważy się dopiero po tygodniach.
  en: |
    The rule calls for an order of things, and it is well that the application put it outright: first the writing
    of the go-between's address for good, then the switching off of the service. The other way about cuts the
    machine off from the network whole.

    The argument worth putting touches the manner of the asking. The machine asks the network for its rules of
    going out and takes the answer of the first who speaks up. Whoever answers sees all the traffic going out and
    may change it, with the machine untouched.

    I set down the bringing up to date as the least seen upshot. It uses that mechanism without regard to the
    browser's settings and stops in silence, so the want of it will be marked only after weeks.
