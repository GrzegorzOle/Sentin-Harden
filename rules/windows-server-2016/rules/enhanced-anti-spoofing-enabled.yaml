id: win2016-enhanced-anti-spoofing-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Biometrics > Facial Features
  title:
    pl: Wzmocniona kontrola podszycia przy rozpoznawaniu twarzy włączona
    en: The strengthened check against spoofing in face recognition switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza wzmocnioną kontrolę podszycia przy logowaniu
    rozpoznawaniem twarzy.

    Nazwa brzmi jak dostrojenie czułości, a rzecz dotyczy czegoś
    zupełnie innego: czy rozpoznanie twarzy jest uwierzytelnieniem, czy
    tylko wygodnym sposobem odblokowania.

    Twarz nie jest tajemnicą. Zdjęcie da się zdobyć bez żadnego włamania
    i zwykle bez wiedzy osoby, której dotyczy — ze strony firmowej,
    z portalu, z identyfikatora, z nagrania. Bez wzmocnionej kontroli
    przejść potrafi zdjęcie, nagranie odtworzone z ekranu albo wydruk
    w odpowiedniej skali. Kontrola sprawdza, czy przed obiektywem jest
    rzeczywiście twarz żywa, a nie jej płaskie odwzorowanie.

    Rzecz warta podkreślenia: gdy kontrola jest wyłączona, drogą wejścia
    staje się coś, co o osobie jest publicznie dostępne. Nie ma sekretu,
    który dałoby się zmienić po wycieku, bo twarzy się nie wymienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście na
    konto za okazaniem zdjęcia albo nagrania osoby, której nie musi znać.
  en: |
    The setting switches on the strengthened check against spoofing at a logon by face recognition.

    The name sounds like a tuning of sensitivity, and the matter concerns something else entirely: whether the
    recognising of a face is an authentication or only a convenient way of unlocking.

    A face is no secret. A photograph can be had without any break-in and as a rule without the knowledge of
    the person it concerns - from a company page, from a portal, from a badge, from a recording. Without the
    strengthened check, a photograph, a recording played from a screen or a print at a fitting scale may go
    through. The check establishes whether before the lens there is truly a living face and not a flat
    likeness of one.

    A thing worth stressing: where the check is off, the road in becomes something about the person that is
    publicly to be had. There is no secret that could be changed after a leak, a face not being exchanged.

    What an attacker gains while the item goes unmet: entry into an account for the showing of a photograph or
    a recording of a person they need not know.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy sprzętu.

    Wzmocniona kontrola wymaga kamery, która potrafi odróżnić twarz żywą
    od jej odwzorowania — zwykle przez dodatkowy tor podczerwieni. Kamera
    zwykła tego nie potrafi. Na maszynie z kamerą zwykłą logowanie twarzą
    po zmianie przestanie być oferowane w ogóle.

    Objaw jest przy tym mylący. Nie pojawia się komunikat o niezgodnym
    sprzęcie; opcja logowania twarzą po prostu znika z ekranu. Osoba,
    która wchodziła twarzą, zobaczy ekran bez tej możliwości i uzna to za
    awarię.

    Stąd warunek: zanim punkt zostanie wykonany, trzeba wiedzieć, czy
    ktoś na tej maszynie loguje się twarzą i czy ma drogę zapasową.
    Dotyczy to tego samego kręgu osób co punkt o kamerze, więc oba warto
    rozważać razem.

    Na maszynie bez kamery rozpoznającej twarz zmiana nie robi nic
    i jest czystym zapisem decyzji.

    Czego to nie psuje: logowania hasłem, kodem, kluczem sprzętowym
    i kartą, odcisku palca, usług, aplikacji, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established concerns the hardware.

    The strengthened check calls for a camera able to tell a living face from a likeness of one - as a rule by
    an added infra-red path. An ordinary camera cannot. On a machine with an ordinary camera, the logon by face
    will after the change cease to be offered at all.

    The symptom is at that misleading. No message about unfitting hardware appears; the option of a logon by
    face simply goes from the screen. A person who entered by face will see a screen without that possibility
    and take it for a fault.

    Hence the condition: before the item is carried out, one has to know whether anybody logs on at this
    machine by face and whether they have a road in reserve. It concerns the same circle of people as the item
    about the camera, so both are worth weighing together.

    On a machine without a camera that recognises faces the change does nothing and is a pure record of a
    decision.

    What this does not break: logging on by password, by a code, by a hardware key and by a card, the
    fingerprint, services, applications, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Na maszynie z kamerą bez toru podczerwieni logowanie twarzą przestaje być oferowane w ogóle
      - Opcja znika z ekranu bez komunikatu o niezgodnym sprzęcie, więc bywa brana za awarię
      - Osoba wchodząca dotąd twarzą musi mieć hasło albo inną drogę wejścia przygotowaną wcześniej
      - Na maszynie bez kamery rozpoznającej twarz zmiana nie robi nic
      - Logowanie hasłem, kluczem sprzętowym, kartą i odciskiem palca pozostaje bez zmian
    en:
      - On a machine with a camera without an infra-red path the logon by face ceases to be offered at all
      - The option goes from the screen without a message about unfitting hardware, so it is at times taken for a fault
      - A person who entered by face until now must have a password or another road in made ready beforehand
      - On a machine without a camera that recognises faces the change does nothing
      - Logging on by password, by a hardware key, by a card and by a fingerprint stays unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś loguje się na tej maszynie twarzą przez kamerę, która wzmocnionej kontroli nie obsługuje
      - Nie ustalono, czy osoby logujące się twarzą mają przygotowaną inną drogę wejścia
    en:
      - Somebody logs on at this machine by face through a camera that does not support the strengthened check
      - It has not been established whether the people logging on by face have another road in made ready
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
      $name = 'EnhancedAntiSpoofing'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    $name = 'EnhancedAntiSpoofing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The strengthened check calls for suitable hardware. Where the camera does
    # not support it, face recognition stops being offered at all - make sure
    # another way in exists before this is carried out.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnhancedAntiSpoofing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Punkt jest drugi w bloku i stoi obok pierwszego nie przypadkiem: oba
    dotyczą kamery i oba mogą odciąć komuś wejście na własne konto.
    Warto je pokazywać razem, bo warunek do sprawdzenia mają wspólny.

    Zestawienie ocen jest tu warte uwagi. Kategoria wysoka przy klasie
    „wymaga sprawdzenia" oznacza pozycję, której nie wolno odpuścić bez
    zastanowienia, a której nie wolno też wykonać hurtem. Macierz
    z założeń projektu umieszcza takie reguły w polu, gdzie opis skutków
    ma być najlepszy w całej aplikacji.

    Argument wart zachowania dotyczy natury sekretu. Hasło po wycieku się
    zmienia; twarzy się nie wymienia. Wyłączona kontrola podszycia zamienia
    więc uwierzytelnienie w rozpoznanie czegoś, co o człowieku jest
    publicznie dostępne — i nie da się tego naprawić po fakcie.

    Odnotowuję, że sama obecność wpisu nie znaczy, iż kontrola działa.
    Działa wtedy, gdy sprzęt ją obsługuje, a to jest fakt spoza rejestru
    i audyt go nie widzi.
  en: |
    The item is the second in the block and stands beside the first not by chance: both concern the camera and
    both may cut somebody off from their own account. They are worth showing together, having a common
    condition to be checked.

    The pairing of the assessments is here worth attention. A high category at the class "needs review" means an
    entry that must not be let go without thought, and that must not be carried out in bulk either. The matrix
    from the project's premisses puts such rules in the field where the account of consequences is to be the
    best in the whole application.

    The argument worth keeping concerns the nature of a secret. A password is changed after a leak; a face is
    not exchanged. A switched-off check against spoofing turns therefore an authentication into the recognising
    of something about a person that is publicly to be had - and that cannot be mended after the fact.

    Worth noting that the entry's mere presence does not mean the check works. It works where the hardware
    supports it, and that is a fact from outside the registry and the audit does not see it.
