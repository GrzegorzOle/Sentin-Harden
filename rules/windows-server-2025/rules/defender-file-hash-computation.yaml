id: win2025-defender-file-hash-computation

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MpEngine
  title:
    pl: Wyliczanie sumy kontrolnej plików włączone
    en: Computation of a file checksum switched on
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt każe wyliczać sumę kontrolną oglądanych plików i zapisywać ją
    razem ze zdarzeniem. Nie wpływa na to, czy coś zostanie zatrzymane
    — wpływa na to, czy da się potem o tym cokolwiek powiedzieć.

    Zostawiam kategorię średnią. Sama w sobie zmiana niczego nie
    blokuje i nie zwiększa trudności ataku. Zwiększa wykrywalność
    i to jest dokładnie kryterium tej kategorii.

    Na serwerze ten punkt ma jednak wagę, której na stacji roboczej nie
    ma, i chcę ją nazwać. Gdy dochodzi do incydentu, maszyną, którą
    bada się najdokładniej, jest serwer. Pytanie zadawane wtedy jako
    pierwsze brzmi: czy ten sam plik był też gdzie indziej. Bez sumy
    kontrolnej pytanie to jest bezużyteczne, bo nazwa pliku i ścieżka
    zmieniają się między maszynami, a suma nie.

    Ta sama suma pozwala zadać pytanie w drugą stronę — czy plik,
    którego szuka ostrzeżenie otrzymane z zewnątrz, kiedykolwiek był na
    tym serwerze. Bez niej odpowiedź brzmi „nie wiadomo", i to jest
    najczęstsza odpowiedź, jaką dostaje się podczas dochodzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nie
    ułatwienie ataku, tylko to, że po wszystkim nie da się ustalić, co
    właściwie przez tę maszynę przeszło.
  en: |
    The item bids the reckoning of a short sum of the files looked at and its writing down together
    with the happening. It sways not whether anything is stopped - it sways whether anything can be
    said about it afterwards.

    I leave the category middling. The change of itself blocks nothing and makes an attack no
    harder. It makes the finding out likelier, and that is just the measure of this category.

    On a server the item has, though, a weight it has not on a workstation, and I mean to name it.
    Where an unhap comes to pass, the machine looked into the closest is the server. The question
    asked then first is - was that same file also elsewhere. Without the short sum that question is
    of no use, the name of a file and its path altering between machines, and the sum not.

    That same sum lets the question be asked the other way - was the file a warning from without
    seeks ever on that server. Without it the answer is "it is not known", and that is the commonest
    answer got in the course of a seeking.

    What an attacker gains while the item goes unmet - no easing of the attack, only that after all
    is done it cannot be settled what in truth passed through that machine.

disruption_description:
  pl: |
    Zmiana nie blokuje niczego i jest niewidoczna w pracy maszyny.
    Kosztuje natomiast czas procesora i odczyt całego pliku, bo sumy
    kontrolnej nie da się wyliczyć z fragmentu.

    To ostatnie zdanie jest tu całą treścią sprawdzenia. Na serwerze
    plików oglądanych plików są miliony, a wyliczanie sumy oznacza
    przeczytanie każdego z nich w całości. Na stacji roboczej jest to
    niezauważalne; na maszynie przepuszczającej duże zbiory bywa
    mierzalne i należy to zmierzyć, zanim się ustawienie włączy.

    Największy koszt pojawia się tam, gdzie pliki są duże i zmieniają
    się w całości: obrazy maszyn wirtualnych, pliki kopii zapasowych,
    zrzuty baz danych. Każdy zapis oznacza ponowne przeczytanie całości.
    Jeżeli dla tych ścieżek istnieją już wyłączenia zalecane przez
    producenta roli — a przy takich rolach zwykle istnieją — koszt
    znika razem z nimi, bo wyłączony plik nie jest ani oglądany, ani
    liczony.

    Punkt jest drugiego poziomu i nie musi być spełniony wszędzie.
    Świadome odpuszczenie go na maszynie o bardzo dużym przepływie,
    przy jednoczesnym spełnieniu na pozostałych, jest rozsądnym
    rozstrzygnięciem i warto je zapisać jako wyjątek, a nie zostawiać
    jako czerwony wiersz.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    The change blocks nothing and is unseen in the machine's work. It costs, though, the time of the
    reckoner and the reading of the whole file, a short sum not to be reckoned off a piece.

    That last sentence is here the whole substance of the checking. On a server of files the files
    looked at are millions, and the reckoning of a sum means the reading of every one of them whole.
    On a workstation it is not to be marked; on a machine letting great sets through it can be
    measured, and it ought to be measured before the setting is switched on.

    The greatest cost comes where the files are big and alter whole - the likenesses of machines
    made by reckoning, the files of keepings of copies, the droppings of bases of data. Every
    writing means the reading over of the whole. If for those paths leavings-out counselled by the
    maker of the role already are - and at such roles they mostly are - the cost goes away with
    them, a left-out file being neither looked at nor reckoned.

    The item is of the second level and need not be met everywhere. A witting letting go of it on a
    machine of a very great flow, while it is met on the rest, is a sound settling and is worth
    writing down as an exception rather than left as a red line.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Sumy kontrolnej nie da się wyliczyć z fragmentu, więc każdy oglądany plik jest czytany w całości
      - Największy koszt dają pliki duże i zmieniające się w całości — obrazy maszyn wirtualnych i zrzuty baz
      - Tam, gdzie producent roli zaleca wyłączenia, koszt znika razem z nimi
      - Zmiana nie blokuje niczego i jest niewidoczna w codziennej pracy maszyny
      - Punkt jest drugiego poziomu, więc świadome odpuszczenie go przy bardzo dużym przepływie bywa rozsądne
    en:
      - A short sum cannot be reckoned off a piece, so every file looked at is read whole
      - The greatest cost comes of files big and altering whole - the likenesses of machines and the droppings of bases
      - Where the maker of the role counsels leavings-out, the cost goes away with them
      - The change blocks nothing and is unseen in the machine's everyday work
      - The item is of the second level, so a witting letting go of it at a very great flow is at times sound
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna przepuszcza bardzo duże zbiory i nie zmierzono kosztu odczytu całości plików
    en:
      - The machine lets very great sets through and the cost of reading files whole was not measured
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableFileHashComputation'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    $name = 'EnableFileHashComputation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFileHashComputation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Waga serwerowa: gdy dochodzi do incydentu, maszyną badaną
    najdokładniej jest serwer, a pierwsze zadawane pytanie brzmi, czy
    ten sam plik był też gdzie indziej. Nazwa i ścieżka zmieniają się
    między maszynami, suma kontrolna nie.

    Koszt bierze się z jednego zdania: sumy nie da się wyliczyć
    z fragmentu, więc każdy oglądany plik jest czytany w całości.
    Największy przy obrazach maszyn wirtualnych i zrzutach baz.

    Punkt drugiego poziomu, więc świadome odpuszczenie go na maszynie
    o bardzo dużym przepływie jest rozstrzygnięciem rozsądnym i warto
    je zapisać jako wyjątek, nie zostawiać jako czerwony wiersz.
  en: |
    The weight on a server - where an unhap comes to pass, the machine looked into the closest is
    the server, and the first question asked is whether that same file was also elsewhere. The name
    and path alter between machines, the short sum not.

    The cost comes of one sentence - a sum cannot be reckoned off a piece, so every file looked at
    is read whole. Greatest at the likenesses of machines made by reckoning and the droppings of
    bases.

    An item of the second level, so a witting letting go of it on a machine of a very great flow is
    a sound settling and is worth writing down as an exception rather than left as a red line.
