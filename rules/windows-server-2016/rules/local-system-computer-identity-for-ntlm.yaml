id: win2016-local-system-computer-identity-for-ntlm

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konto systemowe uwierzytelniane tożsamością maszyny
    en: The system account authenticated with the machine identity
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie żąda, żeby usługa działająca na koncie systemowym przedstawiała
    się w sieci tożsamością maszyny, a nie łączyła się bez tożsamości.

    Konto systemowe jest kontem lokalnym i poza maszyną nie znaczy nic. Gdy
    usługa działająca na nim sięga po zasób sieciowy, musi się czymś
    przedstawić — a ma do wyboru dwie rzeczy: konto maszyny w domenie albo nic.
    Ten punkt każe wybrać pierwsze.

    Wybór drugiego ma dwie konsekwencje i obie są niedobre. Pierwsza dotyczy
    uprawnień: połączenie bez tożsamości dostaje tylko to, co przysługuje
    anonimowym, więc żeby cokolwiek działało, ktoś musi otworzyć zasób
    anonimowym. W ten sposób jedno ustawienie po stronie klienta wymusza
    rozluźnienie po stronie serwera — i tak powstaje większość udziałów
    otwartych dla wszystkich.

    Druga jest dowodowa. Dziennik na serwerze docelowym zapisuje wtedy dostęp
    anonimowy zamiast nazwy maszyny. Traci się jedyną informację, która
    pozwoliłaby wskazać źródło — a przy analizie incydentu pytanie „z której
    maszyny to przyszło" jest zwykle pierwsze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sieć, w której
    zasoby musiały zostać otwarte anonimowym, żeby cokolwiek działało,
    oraz dzienniki, które nie wskazują na maszynę źródłową.
  en: |
    The setting demands that a service running under the system account present
    itself on the network with the machine's identity rather than connect with no
    identity at all.

    The system account is a local account and means nothing outside the machine.
    When a service running under it reaches for a network resource, it has to
    present something - and it has two things to choose from: the machine's account
    in the domain, or nothing. This item bids it choose the first.

    Choosing the second has two consequences and both are bad. The first concerns
    rights: a connection without an identity gets only what belongs to the
    anonymous, so for anything to work somebody has to open the resource to the
    anonymous. In this way one setting on the client's side forces a loosening on
    the server's - and that is how most shares open to everybody come about.

    The second is evidential. The log on the target server then records anonymous
    access instead of the machine's name. The one piece of information that would
    point to the source is lost - and in analysing an incident the question "which
    machine did this come from" is usually the first.

    What an attacker gains while the item goes unmet: a network in which resources
    had to be opened to the anonymous for anything to work, and logs that point at
    no source machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", i sprawdzenie dotyczy nie tej maszyny, tylko
    tego, do czego ona sięga.

    Po zmianie usługi na koncie systemowym zaczynają przedstawiać się kontem
    maszyny. Jest to inna tożsamość niż dotąd, więc serwer po drugiej stronie
    musi tę tożsamość znać i mieć dla niej uprawnienia. Tam, gdzie zasób był
    otwarty anonimowym, a konto maszyny nie ma do niego praw, dostęp zniknie.

    Scenariusz ten jest częstszy, niż się wydaje, bo jedno bierze się
    z drugiego. Zasoby otwierano anonimowym właśnie dlatego, że połączenia
    przychodziły bez tożsamości. Odwrócenie tego wymaga nadania praw kontu
    maszyny — czynności prostej, ale wykonywanej po stronie serwera, a nie tutaj.

    Sprawdzenie sprowadza się do pytania: do jakich zasobów sieciowych sięgają
    usługi z tej maszyny. Najczęściej są to udziały dla kopii zapasowych,
    katalogi wymiany danych i zasoby oprogramowania monitorującego.

    Czego to nie psuje: połączeń usług działających na kontach nazwanych,
    dostępu użytkowników, zasad grupy ani pracy usług niesięgających poza
    maszynę.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns not this machine but what
    it reaches for.

    After the change, services under the system account begin presenting the
    machine's account. That is a different identity from before, so the server on
    the other side has to know it and have rights for it. Where a resource was open
    to the anonymous and the machine account has no rights to it, access will
    vanish.

    That scenario is commoner than it seems, since one follows from the other.
    Resources were opened to the anonymous precisely because connections came in
    without an identity. Reversing it calls for granting rights to the machine
    account - a simple task, but one carried out on the server's side and not here.

    The review comes down to a question: what network resources do the services on
    this machine reach for. Most often these are shares for backups, data exchange
    directories, and the resources of monitoring software.

    What this does not break: connections of services running under named accounts,
    users' access, group policy, or the working of services that do not reach beyond
    the machine.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Zasób otwarty anonimowym, do którego konto maszyny nie ma praw, przestaje być osiągalny dla usług z tej maszyny
      - Udział dla kopii zapasowych albo katalog wymiany danych wymaga nadania praw kontu maszyny po stronie serwera
      - Naprawa leży po drugiej stronie połączenia, a nie na tej maszynie, więc wymaga uzgodnienia z opiekunem tamtego serwera
      - Usługi na kontach nazwanych, dostęp użytkowników i zasady grupy pozostają bez zmian
    en:
      - A resource open to the anonymous to which the machine account has no rights ceases to be reachable for services on this machine
      - A backup share or a data exchange directory calls for rights granted to the machine account on the server side
      - The mend lies on the other side of the connection, not on this machine, so it calls for agreement with that server's keeper
      - Services under named accounts, users' access and group policy stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, do jakich zasobów sieciowych sięgają usługi działające na koncie systemowym tej maszyny
      - Zasoby, do których sięgają te usługi, są otwarte anonimowym i nie da się szybko nadać praw kontu maszyny
    en:
      - It has not been established what network resources the services under this machine's system account reach for
      - The resources those services reach for are open to the anonymous and rights cannot quickly be granted to the machine account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'UseMachineId'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'UseMachineId'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From here on a service under the system account names the machine on the
    # network, so the target log records a source instead of an anonymous access.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseMachineId' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-local-system-to-use-computer-identity-for-ntlm

notes:
  pl: |
    Reguła ma dwie wartości, które warto w raporcie rozdzielić. Pierwsza jest
    obronna: zdejmuje presję na otwieranie zasobów anonimowym. Druga jest
    dowodowa: przywraca nazwę maszyny w dziennikach po drugiej stronie.

    Ta druga jest tu ważniejsza, niż wynikałoby z kategorii średniej. Dziennik
    zapisujący dostęp anonimowy zamiast nazwy maszyny jest dziennikiem, który
    przy analizie incydentu nie odpowiada na pierwsze zadane pytanie. Reguła
    naprawia to u źródła, a nie po stronie zapisu.

    Punkt czyta się razem z regułami o dostępie anonimowym. Tamte zamykają
    zasoby przed połączeniami bez tożsamości; ta sprawia, że połączenia
    z tej maszyny tożsamość mają. Wdrożone osobno potrafią odciąć dostęp —
    wdrożone razem po prostu przenoszą go na właściwe konto.
  en: |
    The rule has two worths, and they are worth keeping apart in the report. The
    first is defensive: it takes away the pressure to open resources to the
    anonymous. The second is evidential: it gives back the machine's name in the
    logs on the other side.

    The second matters more here than the medium category would imply. A log
    recording anonymous access instead of a machine's name is a log that, in
    analysing an incident, answers none of the first question asked. The rule mends
    that at the source rather than at the recording.

    The item reads together with the rules on anonymous access. Those shut resources
    against connections without an identity; this one gives the connections from
    this machine an identity. Applied apart they can cut access off - applied
    together they merely move it onto the proper account.
