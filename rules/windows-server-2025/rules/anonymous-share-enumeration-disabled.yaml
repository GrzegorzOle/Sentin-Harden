id: win2025-anonymous-share-enumeration-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Anonimowe wyliczanie kont i udziałów zablokowane
    en: Anonymous enumeration of accounts and shares blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje odczytania przez połączenie bez poświadczeń zarówno
    listy kont tej maszyny, jak i listy jej udziałów.

    Jest to punkt szerszy od zakazu wyliczania samych kont i o to
    rozszerzenie tu chodzi. Lista udziałów mówi napastnikowi, co ta maszyna
    udostępnia, pod jakimi nazwami i ile tego jest — a więc gdzie warto
    szukać dalej. Na serwerze plików jest to spis treści całej zawartości,
    wydany przed jakimkolwiek logowaniem.

    Wartość tej informacji jest większa, niż się zwykle przyjmuje. Nazwy
    udziałów bywają opisowe: wskazują dział, projekt, kopię zapasową albo
    zawartość archiwalną. Napastnik, który zobaczy taką listę, nie musi już
    szukać po omacku — wie, gdzie jest to, po co przyszedł, i może całą
    resztę wysiłku skierować w jedno miejsce.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: mapę tej
    maszyny — konta i zasoby — bez uwierzytelnienia i bez pozostawienia
    nazwy w dzienniku.

    Punkt nie zamyka drogi wejścia, tylko drogę rozpoznania. Jest to
    jednak ta część pracy napastnika, która decyduje o tym, ile kosztuje
    reszta.
  en: |
    The setting bans the reading by a connection with no credentials of both this machine's
    list of accounts and its list of shares.

    It is an item wider than the ban on enumerating accounts alone, and that widening is the
    point here. The list of shares tells an attacker what this machine puts up, under what
    names and how much of it there is - and so where it is worth looking next. On a file
    server it is a table of contents for everything, given out before any signing in.

    That information is worth more than is usually assumed. Shares' names tend to be
    descriptive: they point to a department, a project, a backup or archival contents. An
    attacker who sees such a list need no longer grope about - they know where what they
    came for is, and can aim all the rest of the effort at one place.

    What an attacker gains while the item goes unmet: a map of this machine - accounts and
    resources - with no authentication and with no name left in the log.

    The item closes no road in, only the road of reconnaissance. That is, though, the part
    of an attacker's work which settles what the rest costs.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy do listy udziałów tej maszyny sięga coś,
    co nie podaje poświadczeń.

    Zakres skutków jest szerszy niż przy zakazie wyliczania samych kont,
    bo odczyt listy udziałów jest czynnością częstszą i wykonywaną przez
    więcej narzędzi. Robią to: starsze przeglądarki zasobów sieciowych,
    narzędzia inwentaryzacyjne, oprogramowanie kopii zapasowej wykrywające
    zasoby oraz mechanizmy wyszukiwania sieciowego w wersjach sprzed lat.

    Objawem jest pusta lista zamiast pełnej. Narzędzie zwykle nie zgłosi
    błędu — pokaże, że maszyna niczego nie udostępnia. Jest to objaw gorszy
    od błędu, bo wygląda na stan faktyczny i bywa brany za awarię serwera.

    Dostęp do samych udziałów nie zmienia się w niczym. Kto zna nazwę
    udziału i ma poświadczenia, połączy się tak jak dotąd. Znika wyłącznie
    możliwość obejrzenia listy bez konta.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anything not giving credentials reaches this machine's
    list of shares.

    The reach of the effects is wider than with the ban on enumerating accounts alone, since
    reading the list of shares is a commoner doing and one carried out by more tools. Doing
    it are: older browsers of network resources, inventory tools, backup software discovering
    resources, and network search mechanisms in versions from years ago.

    The symptom is an empty list rather than a full one. The tool will usually report no
    error - it will show that the machine puts nothing up. That is a worse symptom than an
    error, since it looks like the state of fact and is at times taken for a fault of the
    server.

    Access to the shares themselves does not change in any way. Whoever knows a share's name
    and has credentials will connect as before. What goes is only the means of looking at
    the list with no account.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Przeglądarki zasobów sieciowych bez poświadczeń pokazują pustą listę udziałów
      - Oprogramowanie kopii zapasowej wykrywające zasoby może ich nie znaleźć
      - Pusta lista nie jest zgłaszana jako błąd i bywa brana za awarię serwera
      - Dostęp do udziału po nazwie z podanymi poświadczeniami działa bez zmiany
    en:
      - Browsers of network resources with no credentials show an empty list of shares
      - Backup software discovering resources may not find them
      - An empty list is not reported as an error and is at times taken for a fault of the server
      - Access to a share by name with credentials given works unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie kopii zapasowej wykrywa zasoby tej maszyny bez podawania poświadczeń
      - Starsza przeglądarka zasobów sieciowych jest jedyną drogą, którą użytkownicy trafiają do udziałów
    en:
      - Backup software discovers this machine's resources without giving credentials
      - An older browser of network resources is the only road by which users reach the shares
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictAnonymous'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'RestrictAnonymous' -ErrorAction SilentlyContinue).'RestrictAnonymous'
    [pscustomobject]@{
      path        = $path
      name        = 'RestrictAnonymous'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictAnonymous' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts-and-shares

notes:
  pl: |
    Ustawienie sąsiaduje w tym samym kluczu z zakazem wyliczania samych
    kont i nazwy obu są mylące: ta bez dopiska obejmuje więcej, nie mniej.
    W raporcie warto pokazywać oba punkty razem, bo wdrożenie tylko
    węższego zostawia listę udziałów otwartą.

    Punkt dotyczy wyliczania, nie dostępu. Udziały pozostają dostępne
    dla tych, którzy znają ich nazwy i mają uprawnienia — zamknięta zostaje
    wyłącznie droga do obejrzenia spisu bez konta.

    Na serwerze plików jest to punkt o wartości największej z całej grupy
    anonimowej, bo lista udziałów jest tam informacją najbardziej
    konkretną, jaką maszyna może wydać przed uwierzytelnieniem.
  en: |
    The setting sits in the same key beside the ban on enumerating accounts alone, and both
    names mislead: the one without the suffix takes in more, not less. In the report it is
    worth showing the two items together, since rolling out only the narrower one leaves the
    list of shares open.

    The item concerns enumeration rather than access. The shares stay reachable to those who
    know their names and have the rights - what is closed is only the road to looking at the
    list with no account.

    On a file server it is the item of the greatest worth in the whole anonymous group,
    since the list of shares is the most concrete thing the machine can give out there
    before authentication.
