id: win2025-rdp-always-prompt-password

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Zawsze pytaj o hasło przy połączeniu pulpitem zdalnym
    en: Always prompt for a password on Remote Desktop connection
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe serwerowi pytać o hasło przy zestawianiu sesji
    zdalnej, nawet wtedy, gdy klient podał je z zapisanych poświadczeń.

    Treścią punktu nie jest hasło, tylko miejsce, w którym ono leży.
    Klient pulpitu zdalnego potrafi zapamiętać poświadczenie do maszyny
    i podawać je sam. Poświadczenie to zostaje wtedy na stanowisku
    łączącego się — w magazynie poświadczeń systemu, w pliku połączenia
    albo w konfiguracji narzędzia, które sesję zestawia.

    Przejęcie takiego stanowiska daje napastnikowi nie hasło, ale coś
    prawie tak dobrego: możliwość zalogowania się tam, gdzie logował
    się jego właściciel, bez potrzeby znania czegokolwiek. Stanowisko
    administratora z zapisanymi poświadczeniami do kilkunastu serwerów
    jest wtedy pękiem kluczy do serwerowni.

    Na serwerze punkt ten ma dwie strony i warto obie nazwać.

    Dla serwera jest to zabezpieczenie: ktokolwiek się łączy, musi
    w tym momencie znać hasło, a nie tylko mieć dostęp do maszyny,
    na której je kiedyś zapisano.

    Dla ludzi pracujących na serwerze terminali jest to zmiana
    codziennego toku pracy, widoczna przy każdym połączeniu. Tego nie
    da się schować i nie warto tego bagatelizować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zalogowania się na serwer z przejętego stanowiska bez
    znajomości hasła, samymi poświadczeniami zapisanymi w kliencie.
  en: |
    The setting bids the server ask for a password at the setting up of a remote session, even
    where the client has given it from stored credentials.

    The item's substance is not the password but the place it lies in. The remote desktop client
    can remember a credential for a machine and give it of itself. That credential stays then at
    the station of the one connecting - in the system's store of credentials, in the file of the
    connection, or in the setting up of the tool that opens the session.

    The taking of such a station gives the attacker not the password but something nearly as good:
    the means of signing in where its owner signed in, with no need to know anything. An
    administrator's station with stored credentials to a dozen or more servers is then a bunch of
    keys to the server room.

    On a server this item has two sides and both are worth naming.

    For the server it is a guard: whoever connects must know the password at that moment, and not
    merely hold access to a machine where it was once written down.

    For the people working on a terminal server it is a change in the daily way of working, seen
    at every connecting. That cannot be hidden and is not worth making light of.

    What an attacker gains while the item goes unmet: the means of signing in to the server from a
    taken station with no knowledge of the password, by the credentials stored in the client
    alone.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy ludzi i dlatego nie idzie
    hurtem. Podniosłem tu klasę względem paczki stanowiska roboczego,
    bo na serwerze dotyczy ona nie jednej osoby, tylko wszystkich,
    którzy się z tym serwerem łączą.

    Pierwsza rzecz do ustalenia to automatyzacja. Zadania, które łączą
    się z tym serwerem pulpitem zdalnym z zapisanym poświadczeniem,
    przestaną działać z dnia na dzień. Nie zgłoszą przy tym błędu
    uwierzytelnienia — zatrzymają się na pytaniu, na które nie ma kto
    odpowiedzieć, i będą czekać albo przerwą po czasie. Objawem jest
    zadanie, które przestało się kończyć.

    Druga to ludzie. Na serwerze terminali obsługującym kilkadziesiąt
    osób każde połączenie będzie teraz wymagało wpisania hasła. Przy
    pracy, w której sesję nawiązuje się kilkanaście razy dziennie,
    jest to koszt realny i trzeba go ludziom zapowiedzieć, a nie
    zafundować.

    Trzecia to zespoły łączące się przez narzędzie pośredniczące —
    bramę pulpitu zdalnego, skoczek administracyjny, konsolę dostępu
    uprzywilejowanego. Część z tych narzędzi podaje poświadczenie
    w imieniu użytkownika i po zmianie przestanie to działać w sposób
    przezroczysty.

    Ostatnia rzecz jest ostrzeżeniem, a nie przeszkodą: ludzie pozbawieni
    możliwości zapisania hasła zaczynają je zapisywać gdzie indziej.
    Wdrożenie tego punktu bez dania im sensownej drogi — menedżera haseł
    albo logowania jednokrotnego przez bramę — przenosi hasło z magazynu
    systemowego do pliku na pulpicie. Warto o tym wiedzieć, planując
    zmianę.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    nawiązane pracują dalej.
  en: |
    The change surely changes how people work and so does not go in bulk. I raised the class here
    against the working station's pack, it bearing on a server not upon one person but upon all
    who connect with that server.

    The first thing to settle is the automation. Jobs that connect with this server by remote
    desktop with a stored credential will stop working from one day to the next. They will report
    no fault of authentication - they will halt at a question nobody is there to answer, and will
    wait or break off after a time. The symptom is a job that has stopped finishing.

    The second is people. On a terminal server serving dozens of them every connecting will now
    take the typing of a password. At work where a session is opened a dozen or more times a day
    that is a real cost, and it must be foretold to people and not served up to them.

    The third is teams connecting through a tool standing between - a remote desktop gateway, an
    administrative jump host, a console of privileged access. Some of those tools give the
    credential in the user's name and after the change that will stop working see-through.

    The last thing is a warning and not a hindrance: people deprived of the means of storing a
    password begin storing it elsewhere. Rolling this item out without giving them a sensible road
    - a keeper of passwords or a single sign-in through a gateway - moves the password from the
    system's store into a file on the desktop. It is worth knowing when planning the change.

    The change comes into force straight away and is undone at once. Sessions already opened work
    on.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zadanie łączące się z serwerem z zapisanym poświadczeniem zatrzyma się na pytaniu, na które nie ma kto odpowiedzieć
      - Objawem jest zadanie, które przestało się kończyć, a nie błąd uwierzytelnienia
      - Na serwerze terminali każde połączenie będzie wymagało wpisania hasła
      - Narzędzie pośredniczące podające poświadczenie w imieniu użytkownika przestanie działać przezroczyście
      - Sesje już nawiązane pracują dalej, warunek sprawdza się przy następnym połączeniu
    en:
      - A job connecting to the server with a stored credential will halt at a question nobody is there to answer
      - The symptom is a job that has stopped finishing and not a fault of authentication
      - On a terminal server every connecting will take the typing of a password
      - A tool standing between that gives the credential in the user's name will stop working see-through
      - Sessions already opened work on, the condition being checked at the next connecting
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Do tego serwera łączy się automatyzacja korzystająca z zapisanych poświadczeń
      - Ludzie nie dostaną w zamian menedżera haseł ani logowania jednokrotnego przez bramę
    en:
      - Automation using stored credentials connects to this server
      - People will get in exchange neither a keeper of passwords nor a single sign-in through a gateway
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fPromptForPassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fPromptForPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fPromptForPassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Treścią punktu nie jest hasło, tylko miejsce, w którym ono leży.
    Stanowisko administratora z zapisanymi poświadczeniami do kilkunastu
    serwerów jest pękiem kluczy do serwerowni.

    Klasę podniosłem względem paczki stanowiska roboczego, bo na
    serwerze zmiana dotyczy wszystkich, którzy się z nim łączą, a nie
    jednej osoby.

    Ostrzeżenie do planowania: ludzie pozbawieni możliwości zapisania
    hasła zaczynają je zapisywać gdzie indziej. Bez menedżera haseł albo
    logowania jednokrotnego przez bramę zmiana przenosi hasło z magazynu
    systemowego do pliku na pulpicie.
  en: |
    The item's substance is not the password but the place it lies in. An administrator's station
    with stored credentials to a dozen or more servers is a bunch of keys to the server room.

    I raised the class against the working station's pack, the change bearing on a server upon all
    who connect with it and not upon one person.

    A warning for the planning: people deprived of the means of storing a password begin storing
    it elsewhere. Without a keeper of passwords or a single sign-in through a gateway the change
    moves the password from the system's store into a file on the desktop.
