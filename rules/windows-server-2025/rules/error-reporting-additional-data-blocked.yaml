id: win2025-error-reporting-additional-data-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Error Reporting
  title:
    pl: Dosyłanie danych uzupełniających do raportu o błędzie zablokowane
    en: Sending further data to a fault report blocked
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje dosyłanie danych uzupełniających do raportu o błędzie.
    Chodzi o drugi etap zgłoszenia: maszyna wysyła krótki opis awarii,
    a w odpowiedzi dostaje prośbę o więcej — i ten etap punkt zamyka.

    Kategoria średnia i chcę zwrócić uwagę na to, co ten mechanizm ma
    w sobie niezwykłego, bo to nie jest zwykłe wysyłanie danych. Tutaj
    o zakresie tego, co opuści maszynę, decyduje strona zewnętrzna, już po
    awarii, na podstawie tego, co w pierwszym zgłoszeniu zobaczyła.
    Organizacja nie wie z góry, o co zostanie poproszona, bo zależy to od
    rodzaju awarii.

    Dosłane dane to zwykle fragment pamięci procesu albo pliki, z którymi
    ten proces pracował. Na serwerze oznacza to fragment pamięci procesu
    obsługującego usługę produkcyjną — czyli ten sam materiał, o którym
    mówi reguła o zrzutach pamięci, tylko dochodzący inną drogą i wtedy,
    gdy nikt się go nie spodziewa.

    I to jest właściwy powód, dla którego ta reguła istnieje osobno:
    ograniczenie zrzutów w danych diagnostycznych nie zamyka tej drogi.
    Kto zastosował tamtą regułę i uznał sprawę za załatwioną, zostawił
    otwarte drugie wejście do tego samego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę,
    którą zawartość pamięci serwera opuszcza organizację w chwili awarii,
    w zakresie ustalonym poza nią.
  en: |
    The item blocks the sending of further data to a fault report. This is
    about the second stage of a report: the machine sends a short
    description of the fault and gets back a request for more - and it is
    that stage the item closes.

    The category is medium, and I want to draw attention to what is unusual
    about this mechanism, because it is not ordinary data-sending. Here the
    scope of what leaves the machine is decided by the outside party, after
    the fault, on the basis of what it saw in the first report. The
    organisation does not know in advance what it will be asked for, because
    that depends on the kind of fault.

    The further data is usually a fragment of a process's memory or the
    files that process was working with. On a server that means a fragment
    of the memory of the process running a production service - the same
    material the rule on memory dumps speaks of, only arriving by another
    road and at a moment nobody expects it.

    And this is the real reason this rule exists separately: limiting dumps
    in the diagnostic data does not close this road. Anybody who applied
    that rule and considered the matter settled left a second entrance to
    the same thing open.

    What an attacker gains while the item goes unmet: a road by which the
    contents of a server's memory leave the organisation at the moment of a
    fault, in a scope settled outside it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i to jest ocena, którą stawiam z przekonaniem,
    chociaż przy poprzednich regułach w tym wątku byłem ostrożniejszy.
    Różnica jest rzeczowa, nie stylistyczna.

    Zgłaszanie błędów jako takie działa dalej. Pierwszy etap — krótki opis
    awarii — idzie tak samo. Zapis awarii w dzienniku zdarzeń tej maszyny
    powstaje tak samo. Zrzut zapisywany lokalnie, po który sięga
    administrator, powstaje tak samo. Znika wyłącznie drugi etap, czyli
    odpowiedź na prośbę o więcej.

    Usługa nie zmienia zachowania: proces, który się zawiesza, zawiesza się
    tak samo i wraca tak samo. Ta reguła nie dotyczy sposobu obsługi awarii
    przez system, tylko sposobu jej opisywania na zewnątrz.

    Jedyny przypadek, w którym trzeba to przemyśleć — i nie podnoszę dla
    niego klasy, bo dotyczy procedury, a nie działania maszyny — to
    organizacja, w której analiza awarii przez producenta jest częścią
    umowy wsparcia. Tam zamiast danych dosłanych samoczynnie wsparcie
    poprosi o materiał przekazany osobno, przez człowieka, który wie, co
    przekazuje. Uważam to za zmianę na lepsze, ale wypada o niej wiedzieć
    wcześniej.

    Bez restartu, niewidoczne w codziennej pracy, natychmiast odwracalne,
    wolno zastosować hurtem.
  en: |
    The class is "no disruption", and it is a rating I give with conviction,
    although I was more careful with the earlier rules in this vein. The
    difference is substantive rather than stylistic.

    Error reporting as such goes on working. The first stage - the short
    description of the fault - goes the same way. The record of the fault in
    this machine's event log is written the same way. The dump written
    locally, the one an administrator reaches for, is written the same way.
    All that disappears is the second stage, the answer to the request for
    more.

    The service does not change its behaviour: a process that crashes
    crashes the same way and comes back the same way. This rule does not
    concern how the system handles a fault, only how it describes it
    outwards.

    The only case that has to be thought through - and I do not raise the
    class for it, because it concerns a procedure rather than the machine's
    working - is an organisation where fault analysis by the maker is part
    of a support contract. There, instead of data sent onward by itself,
    support will ask for material passed separately, by a person who knows
    what they are passing. I consider that a change for the better, but it
    is as well to know about it in advance.

    No restart, invisible in daily work, undone immediately, may be applied
    in bulk.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Zgłaszanie błędów działa dalej — pierwszy etap, czyli krótki opis awarii, idzie tak samo
      - Zapis awarii w dzienniku zdarzeń i zrzut zapisywany lokalnie powstają bez zmian
      - Znika wyłącznie drugi etap, czyli odpowiedź na prośbę o dane uzupełniające
      - Gdzie analiza awarii przez producenta jest częścią umowy wsparcia, materiał trzeba będzie przekazać osobno
    en:
      - Error reporting goes on working - the first stage, the short description of the fault, goes the same way
      - The record of the fault in the event log and the dump written locally are made unchanged
      - All that disappears is the second stage, the answer to the request for further data
      - Where fault analysis by the maker is part of a support contract, the material will have to be passed separately
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Analiza awarii przez producenta jest częścią umowy wsparcia i opiera się na danych dosyłanych samoczynnie
    en:
      - Fault analysis by the maker is part of a support contract and rests on data sent onward by itself
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
      $name = 'DontSendAdditionalData'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
    $name = 'DontSendAdditionalData'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Limiting dumps in the diagnostic data does not close this road - here the
    # scope of what leaves the machine is decided outside it, after the fault.
    # The first stage of reporting, the event log entry and the local dump all
    # stay as they are.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontSendAdditionalData' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    To nie jest zwykłe wysyłanie danych: o zakresie tego, co opuści maszynę,
    decyduje strona zewnętrzna, już po awarii, na podstawie pierwszego
    zgłoszenia. Organizacja nie wie z góry, o co zostanie poproszona.

    Dosłane dane to zwykle fragment pamięci procesu — na serwerze procesu
    obsługującego usługę produkcyjną. Ten sam materiał, o którym mówi
    reguła o zrzutach pamięci, tylko inną drogą i wtedy, gdy nikt się go
    nie spodziewa.

    Dlatego ta reguła istnieje osobno: ograniczenie zrzutów w danych
    diagnostycznych nie zamyka tej drogi. Kto zastosował tamtą i uznał
    sprawę za załatwioną, zostawił otwarte drugie wejście do tego samego.
  en: |
    This is not ordinary data-sending: the scope of what leaves the machine
    is decided by the outside party, after the fault, on the basis of the
    first report. The organisation does not know in advance what it will be
    asked for.

    The further data is usually a fragment of a process's memory - on a
    server, the process running a production service. The same material the
    rule on memory dumps speaks of, only by another road and at a moment
    nobody expects it.

    This is why the rule exists separately: limiting dumps in the diagnostic
    data does not close this road. Anybody who applied that one and
    considered the matter settled left a second entrance to the same thing
    open.
