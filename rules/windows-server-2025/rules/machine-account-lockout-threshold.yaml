id: win2025-machine-account-lockout-threshold

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Próg nieudanych logowań kończący się wejściem w tryb odzyskiwania ustawiony
    en: A failed sign-in threshold ending in the recovery mode set
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe maszynie przejść w tryb odzyskiwania po określonej
    liczbie nieudanych prób zalogowania się przy konsoli.

    Punkt broni przed zgadywaniem hasła na maszynie, do której napastnik
    ma dostęp przy klawiaturze. Zgadywanie takie nie wymaga niczego poza
    czasem, bo próby przy konsoli nie przechodzą przez sieć i nie
    zostawiają śladu widocznego dla nikogo poza tą maszyną.

    Obrona polega na zamknięciu dostępu do dysku. Po przekroczeniu progu
    maszyna nie startuje dalej, dopóki nie poda się klucza odzyskiwania
    szyfrowania dysku. Klucz ten leży poza maszyną — w katalogu domeny
    albo w wykazie prowadzonym przez zespół — więc napastnik, który go
    nie ma, kończy pracę w tym miejscu.

    Wynika z tego warunek, o którym trzeba powiedzieć wprost:
    ustawienie ma sens wyłącznie na maszynie z zaszyfrowanym dyskiem
    systemowym. Bez szyfrowania nie ma czego chronić i nie ma klucza,
    którym można by wyjść z trybu odzyskiwania.

    Na serwerze rzecz waży inaczej niż na stanowisku roboczym, bo
    inaczej wygląda wyjście z tej sytuacji. Stanowisko odblokowuje się
    przy biurku, w kilka minut. Serwer stoi w szafie, często w innym
    budynku, bywa bez klawiatury, a wejście w tryb odzyskiwania oznacza,
    że nie wróci sam — usługi na nim stoją, dopóki ktoś nie dojedzie
    z kluczem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: prawo do
    nieskończonej liczby prób zgadywania hasła przy konsoli serwera,
    bez żadnej konsekwencji po stronie maszyny.
  en: |
    The setting bids the machine pass into the recovery mode after a set number of failed tries
    at signing in at the console.

    The item guards against the guessing of a password on a machine an attacker can reach at the
    keyboard. Such guessing takes nothing but time, the tries at a console passing through no
    network and leaving no trace seen by anyone beyond that machine.

    The guard lies in shutting the way to the disk. Once the threshold is passed the machine
    starts no further until the recovery key of the disk's encryption is given. That key lies
    outside the machine - in the domain's directory or in a roll kept by the team - so an
    attacker without it ends their work at that point.

    From that follows a condition that must be said outright: the setting makes sense only on a
    machine whose system disk is encrypted. Without encryption there is nothing to shield and no
    key by which to leave the recovery mode.

    On a server the matter weighs otherwise than at a working station, the way out of that state
    looking otherwise. A station is unlocked at a desk, in a few minutes. A server stands in a
    rack, often in another building, at times without a keyboard, and a passing into the recovery
    mode means it will not come back of itself - the services upon it stand until somebody
    arrives with the key.

    What an attacker gains while the item goes unmet: the right to an endless number of tries at
    guessing a password at the server's console, with no consequence on the machine's side.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy i wymaga przygotowania
    procedury odzyskiwania, zanim zostanie wprowadzona.

    Warunek pierwszy jest bezwzględny: dysk systemowy musi być
    zaszyfrowany, a klucz odzyskiwania zapisany poza maszyną
    i sprawdzony. Sprawdzony znaczy: ktoś go odczytał z miejsca, w którym
    ma leżeć, a nie założył, że tam jest.

    Skutek najdotkliwszy dotyczy serwerów stojących zdalnie. Maszyna
    w trybie odzyskiwania czeka na klucz wpisany przy konsoli. Karta
    zarządzająca zwykle pozwala go wpisać, ale trzeba mieć do niej
    dostęp i trzeba mieć klucz pod ręką — a zdarza się to w porze, gdy
    nikt się tego nie spodziewa.

    Przypadkiem, który wywołuje ten stan bez udziału napastnika, jest
    zwykła pomyłka. Administrator wpisujący hasło do niewłaściwej
    maszyny, zdalna konsola z inną mapą klawiatury, wklejenie hasła ze
    znakiem końca wiersza — każda z tych rzeczy zużywa próby. Przy progu
    ustawionym nisko maszyna zatrzyma się na pomyłce, a nie na ataku.

    Wartość dziesięciu prób jest granicą, nie zaleceniem. Niższa spełnia
    punkt, ale na serwerze każde obniżenie przybliża zatrzymanie
    z powodu pomyłki. Naprawa ustawia granicę górną świadomie.

    Zero znaczy „nie licz prób", a nie „zatrzymaj od razu" — sprawdzenie
    zgłasza tę wartość osobno, żeby nie przeszła przez porównanie jako
    ustawienie najsurowsze.

    Zmiana nie wymaga przerwy, ale skutek jej zadziałania wymaga
    obecności człowieka przy maszynie albo przy karcie zarządzającej.
  en: |
    The change surely changes how work is done and takes a procedure of recovery made ready
    before it is brought in.

    The first condition is unconditional: the system disk must be encrypted and the recovery key
    kept outside the machine and tried. Tried means: somebody read it from the place it is to lie
    in, rather than holding that it is there.

    The sorest effect bears on servers standing far off. A machine in the recovery mode waits for
    a key typed at the console. A management card usually lets it be typed, but one must hold
    access to the card and have the key at hand - and it happens at an hour when nobody looks for
    it.

    The case that calls this state forth with no attacker at all is a plain slip. An
    administrator typing a password to the wrong machine, a remote console with another keyboard
    map, a password pasted with an end-of-line sign - every one of those spends tries. With the
    threshold set low the machine will halt upon a slip rather than upon an attack.

    The worth of ten tries is a bound, not a counsel. A lower one meets the item, but on a server
    every lowering brings a halt from a slip nearer. The mending sets the upper bound knowingly.

    Zero means "do not count the tries" rather than "halt at once" - the check reports that value
    apart, lest it pass through the comparison as the strictest setting.

    The change takes no break, but the working of its effect takes a person at the machine or at
    the management card.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Po przekroczeniu progu serwer nie wystartuje bez klucza odzyskiwania wpisanego przy konsoli
      - Pomyłka przy wpisywaniu hasła zużywa próby tak samo jak próba ataku
      - Bez zaszyfrowanego dysku systemowego ustawienie nie ma czego chronić
      - Maszyna nie wróci sama, więc usługi stoją do czasu przyjazdu człowieka z kluczem
    en:
      - Once the threshold is passed the server will not start without the recovery key typed at the console
      - A slip at the typing of a password spends tries just as a try at an attack does
      - Without an encrypted system disk the setting has nothing to shield
      - The machine will not come back of itself, so the services stand until a person arrives with the key
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dysk systemowy serwera nie jest zaszyfrowany, więc nie ma czego chronić ani czym wyjść z trybu odzyskiwania
      - Klucz odzyskiwania nie został zapisany poza maszyną i odczytany ze wskazanego miejsca
      - Do konsoli serwera nie ma dostępu poza obecnością na miejscu, a maszyna stoi w innej lokalizacji
    en:
      - The server's system disk is not encrypted, so there is nothing to shield and nothing to leave the recovery mode by
      - The recovery key was never kept outside the machine and read from the place named
      - There is no access to the server's console beyond being there in person, and the machine stands elsewhere
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero switches the threshold off altogether. It must not pass an upper
      # bound comparison as if it were the smallest allowed number of attempts.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'MaxDevicePasswordFailedAttempts'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      elseif ([int]$value -eq 0) { 'NEVER' }
      else { [string][int]$value }
    } catch {
      'CHECK_ERROR'
    }
  expected: '10'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'MaxDevicePasswordFailedAttempts'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Ten is the upper bound the item allows and it is set knowingly: on a
    # server every lowering brings a halt from a mistyped password nearer,
    # and the way out of that halt takes a person with the recovery key.
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'MaxDevicePasswordFailedAttempts' -Value 10 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-machine-account-lockout-threshold

notes:
  pl: |
    Ustawienie ma sens wyłącznie na maszynie z zaszyfrowanym dyskiem
    systemowym. Bez szyfrowania nie ma czego chronić ani czym wyjść
    z trybu odzyskiwania.

    Na serwerze wyjście z tego stanu wymaga człowieka przy konsoli albo
    przy karcie zarządzającej, z kluczem pod ręką. Stąd klasa wymagająca
    świadomego wdrożenia i stąd naprawa ustawiająca granicę górną, a nie
    wartość najsurowszą.

    Zero znaczy „nie licz prób". Sprawdzenie zgłasza tę wartość osobno,
    żeby nie przeszła przez porównanie z granicą jako liczba mała.
  en: |
    The setting makes sense only on a machine whose system disk is encrypted. Without encryption
    there is nothing to shield and nothing to leave the recovery mode by.

    On a server the way out of that state takes a person at the console or at the management
    card, with the key at hand. Thence the class taking a knowing rollout, and thence a mending
    that sets the upper bound rather than the strictest value.

    Zero means "do not count the tries". The check reports that value apart, lest it pass through
    the comparison with the bound as a small number.
