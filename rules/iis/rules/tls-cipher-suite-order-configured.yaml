id: iis-tls-cipher-suite-order-configured

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Transport Encryption
  title:
    pl: Kolejność zestawów szyfrów ustalona wprost
    en: The order of cipher sets settled outright

  level: 1
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Przy zestawianiu połączenia szyfrowanego klient podaje listę zestawów,
    które obsługuje, a serwer wybiera jeden. Wybiera ten, który u niego stoi
    najwyżej na własnej liście. Dopóki ta lista nie jest ustalona wprost,
    kolejność pochodzi z systemu i zmienia się razem z jego wydaniem
    i aktualizacjami.

    Co to odbiera atakującemu: wpływ na to, czym rozmawia z serwerem. Klient
    podaje własną listę i to on decyduje, co się na niej znajdzie — narzędzie
    napastnika poda wyłącznie zestawy, które potrafi zaatakować, i jeśli
    serwer choć jeden z nich obsługuje, a jego kolejność jest przypadkowa,
    wybór może paść właśnie tam. Ustalona kolejność sprawia, że o zestawie
    decyduje serwer, a nie strona, która się łączy.

    Praktycznie chodzi o to, żeby na górze stały zestawy z wymianą klucza
    zapewniającą poufność wsteczną i z szyfrowaniem uwierzytelnionym. Pierwsze
    znaczy, że wykradzenie klucza serwera za rok nie pozwoli odczytać ruchu
    nagranego dziś. Drugie zamyka całą rodzinę ataków na dopełnienie bloku,
    które przez lata wracały pod kolejnymi nazwami.
  en: |
    When an encrypted connection is being established the client gives a list of the
    sets it supports and the server picks one. It picks the one standing highest on
    its own list. Until that list is settled outright, the order comes from the
    system and changes along with its release and its updates.

    What it takes away from an attacker - influence over what the server speaks in.
    The client gives a list of its own and decides what goes on it - an attacker's
    tool will offer only the sets it can attack, and if the server supports even one
    of them while its order is a matter of chance, the choice may fall exactly
    there. A settled order means the server decides on the set, not the party
    connecting.

    In practice the point is that the sets at the top should be those with a key
    exchange giving forward secrecy and with authenticated encryption. The first
    means that stealing the server's key a year from now will not open traffic
    recorded today. The second closes the whole family of attacks on block padding
    that kept returning under new names for years.

disruption_description:
  pl: |
    Sama zmiana kolejności nie odbiera nikomu niczego: te same zestawy nadal są
    obsługiwane, zmienia się tylko to, który zostanie wybrany, gdy klient
    obsługuje kilka. Klient obsługujący wyłącznie jeden dostanie ten jeden, tak
    jak wcześniej.

    Rzecz, którą trzeba sprawdzić, dotyczy długości listy. Pole, w którym ta
    kolejność żyje, ma ograniczoną pojemność, a nazwy zestawów są długie —
    na maszynie obsługującej ich kilkadziesiąt cała lista się nie mieści. Te,
    które nie wejdą, przestają być obsługiwane, a nie tylko schodzą niżej. Są to
    zestawy z końca listy, czyli te, które sami uznaliśmy za najsłabsze —
    w większości przypadków to skutek pożądany, ale jest to odebranie, a nie
    przestawienie, i klient obsługujący tylko taki zestaw przestanie się łączyć.

    Naprawa wypisuje wprost, co się na liście nie zmieściło. Ten wykaz trzeba
    przeczytać, zanim uzna się punkt za zamknięty.

    Drugą rzeczą jest zasięg. Ustawienie obowiązuje całą maszynę, nie sam
    serwer sieciowy — obejmuje też pulpit zdalny, bazę danych, pocztę i każdą
    inną usługę korzystającą z systemowej warstwy szyfrującej, łącznie
    z połączeniami wychodzącymi.

    Zmiana obowiązuje od ponownego uruchomienia maszyny.
  en: |
    Changing the order alone takes nothing from anybody - the same sets remain
    supported, and all that changes is which one is picked when a client supports
    several. A client supporting only one gets that one, as before.

    The thing to check concerns the length of the list. The field this order lives in
    has a limited capacity, and the set names are long - on a machine supporting
    several dozen of them the whole list does not fit. Those that do not get in stop
    being supported rather than merely moving down. They are the sets at the end of
    the list, which is to say the ones we ourselves judged weakest - in most cases
    that is the wanted consequence, but it is a taking away rather than a
    rearrangement, and a client supporting only such a set will stop connecting.

    The fix writes out plainly what did not fit on the list. That account has to be
    read before the item is treated as closed.

    The second thing is reach. The setting governs the whole machine and not the web
    server alone - it covers remote desktop, the database, mail and every other
    service using the system's encrypting layer, outgoing connections included.

    The change applies from the machine's next restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - web-server-services
    - remote-desktop
    - legacy-applications
  what_breaks:
    pl:
      - Zestawy, które nie zmieściły się w polu o ograniczonej pojemności, przestają być obsługiwane, a nie tylko schodzą niżej
      - Klient obsługujący wyłącznie zestaw, który wypadł z listy, przestaje się łączyć i nie dostaje informacji dlaczego
      - Ustawienie obejmuje całą maszynę, więc dotyczy także pulpitu zdalnego, bazy danych i połączeń wychodzących
      - Zmiana zaczyna obowiązywać dopiero po ponownym uruchomieniu maszyny, więc do tego czasu stan zgłaszany i rzeczywisty się różnią
      - Lista jest zapisana na sztywno i nie rośnie o zestawy dodane przez późniejsze aktualizacje systemu
    en:
      - Sets that did not fit in a field of limited capacity stop being supported rather than merely moving down
      - A client supporting only a set that fell off the list stops connecting and is told nothing about why
      - The setting covers the whole machine, so it reaches remote desktop, the database and outgoing connections too
      - The change takes effect only after the machine is restarted, so until then the reported state and the real one differ
      - The list is written down fixed and does not grow with sets added by later system updates
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny obsługujące klientów, o których nie wiadomo, które zestawy obsługują — najpierw przejrzeć wykaz z naprawy
      - Serwery, na których inna usługa korzystająca z systemowej warstwy szyfrującej ma własne wymagania co do zestawów
    en:
      - Machines serving clients whose supported sets are unknown - read the account the fix writes out first
      - Servers where another service using the system's encrypting layer has requirements of its own about the sets
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $path = 'SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002'
        $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
        $key = $base.OpenSubKey($path)
        $value = $null
        if ($null -ne $key) {
          $value = $key.GetValue('Functions', $null)
          $key.Close()
        }
        $base.Close()
        if ($null -eq $value -or [string]::IsNullOrWhiteSpace([string]$value)) { 'NOT_SET' }
        else {
          $list = @([string]$value -split '[,\s]+' | Where-Object { $_ -ne '' })
          $first = $list[0]
          # The set at the top is the one the server picks whenever the client
          # offers it, so it is what the order is judged by. Wanted at the top
          # is a key exchange giving forward secrecy together with
          # authenticated encryption - or a set from the newest version of the
          # protocol, where those two are the only kind there is.
          $good = ($first -match '^TLS_(AES|CHACHA20)') -or
                  ($first -match '^TLS_ECDHE_.*_GCM' ) -or
                  ($first -match '^TLS_ECDHE_.*CHACHA20')
          if ($good) { 'AS_REQUIRED' }
          else { 'WEAK_FIRST ' + $first }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002'
    $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
    $key = $base.OpenSubKey($path)
    $existed = ($null -ne $key)
    $value = $null
    $hadValue = $false
    if ($existed) {
      $value = $key.GetValue('Functions', $null)
      $hadValue = ($null -ne $value)
      $key.Close()
    }
    $base.Close()
    # The list the machine supports today is recorded as well. Should the write
    # turn out to have dropped something needed, this is the only record of
    # what was there before it.
    $supported = @()
    if (Get-Command Get-TlsCipherSuite -ErrorAction SilentlyContinue) {
      # The cmdlet hands back its whole result as one object rather than as a
      # sequence, so it goes through a variable first and is turned into an
      # array only afterwards. Wrapping the call itself yields an array of one.
      $result = Get-TlsCipherSuite
      foreach ($suite in @($result)) { $supported += [string]$suite.Name }
    }
    [pscustomobject]@{
      path          = $path
      key_existed   = $existed
      value_existed = $hadValue
      value         = [string]$value
      supported     = $supported
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    if (-not (Get-Command Get-TlsCipherSuite -ErrorAction SilentlyContinue)) {
      throw 'This release of the system cannot be asked which cipher sets it supports, so an order written here could name sets it does not have. Settle the list by hand on this machine.'
    }
    # The order is built out of what this machine actually supports. A name
    # copied from elsewhere and unknown here would be dead weight on a list of
    # limited length - and a list made up solely of such names leaves the
    # machine with nothing to propose.
    # The cmdlet hands back its whole result as one object rather than as a
    # sequence, so it goes through a variable first and is turned into an array
    # only afterwards. Iterating the call directly runs the loop once, with the
    # whole list in hand instead of a single set.
    $result = Get-TlsCipherSuite
    $suites = @($result)
    if ($suites.Count -eq 0) { throw 'This machine reported no supported cipher sets, so no order could be built.' }
    $index = 0
    $ranked = @()
    foreach ($suite in $suites) {
      $name = [string]$suite.Name
      $rank = 6
      if ($name -match '^TLS_(AES|CHACHA20)') { $rank = 0 }
      elseif ($name -match '^TLS_ECDHE_.*(_GCM|CHACHA20)') { $rank = 1 }
      elseif ($name -match '^TLS_DHE_.*(_GCM|CHACHA20)') { $rank = 2 }
      elseif ($name -match '^TLS_ECDHE_.*_CBC') { $rank = 3 }
      elseif ($name -match '^TLS_DHE_.*_CBC') { $rank = 4 }
      elseif ($name -match '_GCM') { $rank = 5 }
      $ranked += [pscustomobject]@{ name = $name; rank = $rank; index = $index }
      $index++
    }
    # Sorting by the position the system gave as well, so that sets we judge
    # equal keep the order they came in rather than a random one.
    $ordered = @($ranked | Sort-Object rank, index | ForEach-Object { $_.name })

    # The field holding this order has a documented capacity of 1023
    # characters. What does not fit is not merely lowered - it stops being
    # supported - so the list is cut at that length knowingly and what fell off
    # is written out.
    $limit = 1023
    $kept = @()
    $dropped = @()
    $length = 0
    foreach ($name in $ordered) {
      $addition = $name.Length
      if ($kept.Count -gt 0) { $addition = $addition + 1 }
      if (($length + $addition) -le $limit) {
        $kept += $name
        $length = $length + $addition
      }
      else {
        $dropped += $name
      }
    }
    if ($kept.Count -eq 0) { throw 'No cipher set fitted within the length of the field, so nothing was written.' }

    $path = 'SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002'
    $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
    $key = $base.CreateSubKey($path)
    if ($null -eq $key) { throw 'The key holding the cipher set order could not be created.' }
    $key.SetValue('Functions', ($kept -join ','), [Microsoft.Win32.RegistryValueKind]::String)
    $key.Close()
    $base.Close()

    'Kept ' + $kept.Count + ' cipher sets, highest first.'
    if ($dropped.Count -gt 0) {
      'These did not fit and are therefore no longer supported - read this list before treating the item as closed:'
      $dropped | ForEach-Object { '  ' + $_ }
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Default')
    if (-not $b.key_existed) {
      $base.DeleteSubKeyTree($b.path, $false)
    }
    else {
      $key = $base.CreateSubKey($b.path)
      if ($b.value_existed) {
        $key.SetValue('Functions', [string]$b.value, [Microsoft.Win32.RegistryValueKind]::String)
      }
      else {
        $key.DeleteValue('Functions', $false)
      }
      $key.Close()
    }
    $base.Close()

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/secauthn/prioritizing-schannel-cipher-suites
  - https://learn.microsoft.com/powershell/module/tls/get-tlsciphersuite

notes:
  pl: |
    Kolejność budowana jest z tego, co maszyna faktycznie obsługuje, a nie
    z listy przepisanej skądinąd. Nazwa nieznana temu wydaniu systemu byłaby
    martwym wpisem zajmującym miejsce w polu o ograniczonej pojemności,
    a lista złożona z samych takich nazw zostawiłaby maszynę bez czegokolwiek
    do zaproponowania.

    Pojemność pola to 1023 znaki i to jest jedyny powód, dla którego ta reguła
    cokolwiek odbiera. Zestawy, które się nie mieszczą, przestają być
    obsługiwane — naprawa wypisuje je wprost i ten wykaz trzeba przeczytać.
    Odcinane są zestawy z końca kolejności, czyli te, które sami uznaliśmy za
    najsłabsze.

    Sprawdzenie ocenia wyłącznie to, czy kolejność jest ustalona i czy na jej
    czele stoi zestaw z poufnością wsteczną i szyfrowaniem uwierzytelnionym.
    Nie porównuje całej listy z wzorcem, bo wzorzec zależałby od wydania
    systemu i punkt zgłaszałby niespełnienie po każdej aktualizacji.

    Lista jest zapisana na sztywno i nie rośnie o zestawy dodane przez późniejsze
    aktualizacje systemu. Po większej aktualizacji warto ten punkt wykonać
    ponownie.

    Punkt nie włącza ani nie wyłącza pojedynczych szyfrów — tym zajmują się
    osobne reguły w tej samej grupie.
  en: |
    The order is built from what the machine actually supports rather than from a
    list transcribed elsewhere. A name unknown to this release of the system would
    be a dead entry taking up room in a field of limited capacity, and a list made
    up solely of such names would leave the machine with nothing to propose.

    The capacity of the field is 1023 characters, and that is the only reason this
    rule takes anything away. Sets that do not fit stop being supported - the fix
    writes them out plainly and that account has to be read. What gets cut off are
    the sets at the end of the order, which is to say the ones we ourselves judged
    weakest.

    The check judges only whether an order is settled and whether at its head stands
    a set with forward secrecy and authenticated encryption. It does not compare the
    whole list against a pattern, because the pattern would depend on the release of
    the system and the item would report a failure after every update.

    The list is written down fixed and does not grow with sets added by later system
    updates. After a larger update it is worth running this item again.

    The item neither switches individual ciphers on nor off - separate rules in the
    same group see to that.
