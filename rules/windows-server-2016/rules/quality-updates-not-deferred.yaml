id: win2016-quality-updates-not-deferred

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Poprawki jakości instalowane bez opóźnienia
    en: Quality fixes installed without delay
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje wprost, że poprawki jakości nie są opóźniane
    o żaden dzień.

    Rozróżnienie między dwoma rodzajami aktualizacji jest tu całą treścią
    punktu, więc postawię je od razu. Poprawki jakości naprawiają to, co
    w wydanej wersji systemu działa źle albo jest dziurawe — i nie zmieniają
    niczego poza tym. Aktualizacje funkcji podnoszą wersję systemu i zmieniają
    sposób jego działania.

    Mechanizm odkładania traktuje oba rodzaje osobno, i słusznie, bo koszt
    opóźnienia jest przy nich zupełnie inny. Opóźnienie aktualizacji funkcji
    to czas na sprawdzenie zgodności. Opóźnienie poprawki jakości to czas,
    w którym maszyna ma otwartą lukę opisaną publicznie.

    Wartość wymagana nie jest przy tym po prostu brakiem ustawienia.
    Wymaga zapisania decyzji wprost: przełącznik ustawiony, liczba dni
    zerowa. Stan, w którym nikt niczego nie zapisał, i stan, w którym ktoś
    zapisał zero, wyglądają tak samo w działaniu, ale różnią się tym, czy
    decyzja została podjęta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tyle dni
    na maszynie z opisaną luką, ile wynosi ustawione opóźnienie.
  en: |
    The setting writes down outright that quality fixes are put off by no day at
    all.

    The distinction between the two kinds of update is the item's whole substance
    here, so I shall put it at once. Quality fixes mend what works badly or is full
    of holes in a released version of the system - and change nothing besides.
    Feature updates raise the system's version and change the way it works.

    The mechanism of putting off treats the two kinds apart, and rightly, since the
    cost of a delay differs entirely between them. Putting off a feature update is
    time for checking compatibility. Putting off a quality fix is time in which the
    machine has a publicly described gap open.

    The required value is not simply an absent setting, besides. It calls for the
    decision to be written down outright: the switch set, the number of days zero.
    The state where nobody wrote anything and the state where somebody wrote zero
    look the same in operation, but differ in whether a decision was taken.

    What an attacker gains while the item goes unmet: as many days on a machine with
    a described gap as the delay that has been set.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to ocena pewna.

    Punkt nie zmienia niczego w działaniu maszyny, na której nikt opóźnienia
    nie ustawił. Zapisuje stan, który i tak obowiązuje, i czyni z niego
    decyzję zamiast domyślności.

    Na maszynie, na której opóźnienie ustawiono, zmiana oznacza, że poprawki
    zaczną przychodzić wcześniej niż dotąd. Nie jest to skutek uciążliwy
    w rozumieniu tej klasyfikacji — instalacja poprawki jakości i tak by
    nastąpiła, tyle że później.

    Warto jednak powiedzieć, czego punkt nie rozstrzyga. Nie mówi, kiedy
    poprawka zostaje zainstalowana ani kiedy maszyna się restartuje; tym
    zajmują się reguły o harmonogramie. Zgodność tego punktu bez tamtych
    znaczy wyłącznie, że poprawka jest oferowana bez zwłoki.

    Czego to nie psuje: usług, logowania, sieci, harmonogramu instalacji,
    aktualizacji funkcji.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", and that judgement is a sure one.

    The item changes nothing in the working of a machine where nobody set a delay.
    It writes down the state that holds anyway and makes a decision of it instead of
    a default.

    On a machine where a delay was set, the change means fixes will begin arriving
    earlier than before. That is no disruptive consequence in the sense of this
    classification - the installing of a quality fix would have happened anyway,
    only later.

    Worth saying, though, what the item does not settle. It says nothing of when a
    fix is installed nor of when the machine restarts; the rules about the schedule
    see to that. Compliance with this item without those means only that the fix is
    offered without delay.

    What this does not break: services, signing in, the network, the schedule of
    installing, or feature updates.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Na maszynie z ustawionym opóźnieniem poprawki zaczynają przychodzić wcześniej niż dotąd
      - Punkt nie rozstrzyga, kiedy poprawka zostaje zainstalowana ani kiedy maszyna się restartuje
      - Na maszynie bez ustawionego opóźnienia nie zmienia się nic poza zapisaniem decyzji
      - Usługi, logowanie, sieć, harmonogram instalacji i aktualizacje funkcji pozostają bez zmian
    en:
      - On a machine with a delay set, fixes begin arriving earlier than before
      - The item does not settle when a fix is installed nor when the machine restarts
      - On a machine with no delay set nothing changes beyond the writing down of a decision
      - Services, signing in, the network, the schedule of installing and feature updates stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dostawca oprogramowania pracującego na tej maszynie wymaga wstrzymania poprawek do czasu własnego sprawdzenia i termin ten przekracza zero dni
    en:
      - The supplier of software working on this machine requires fixes to be held back pending their own check, and that term is longer than zero days
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch and the number of days.
      # The item is met only when the switch is set and the number is
      # zero - the setting written down and the delay none.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DeferQualityUpdates'
        $days = $item.'DeferQualityUpdatesPeriodInDays'
        if ($null -eq $switch -or $null -eq $days) { 'MISSING' }
        elseif ([int]$switch -ne 1) { 'NOT_SET' }
        elseif ([int]$days -ne 0) { 'OTHER ' + [int]$days }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path           = $path
      key_existed    = (Test-Path -Path $path)
      switch         = $item.'DeferQualityUpdates'
      switch_existed = ($null -ne $item.'DeferQualityUpdates')
      days           = $item.'DeferQualityUpdatesPeriodInDays'
      days_existed   = ($null -ne $item.'DeferQualityUpdatesPeriodInDays')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeferQualityUpdates' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DeferQualityUpdatesPeriodInDays' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferQualityUpdates' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferQualityUpdates' -ErrorAction SilentlyContinue
    }
    if ($b.days_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferQualityUpdatesPeriodInDays' -Value $b.days -Type DWord
    } else {
      # Only these two values are removed. The key holds unrelated update settings
      # and stays.
      Remove-ItemProperty -Path $b.path -Name 'DeferQualityUpdatesPeriodInDays' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Punkt jest jedną z niewielu reguł, których wykonanie nie zmienia
    zachowania maszyny, a mimo to ma sens. Wartość leży w zapisaniu
    decyzji: po wdrożeniu widać, że brak opóźnienia jest wyborem, a nie
    przeoczeniem.

    Wymaganie dwóch wpisów naraz warto tłumaczyć, bo pojedynczy wygląda na
    wystarczający. Liczba dni bez przełącznika nie obowiązuje, a przełącznik
    bez liczby nie mówi, o ile. Audyt rozróżnia te przypadki i nazywa je
    osobno, zamiast zwracać jedno „nie spełnia".

    Reguła stoi w macierzy w rogu najwygodniejszym: zysk realny, koszt
    żaden. Jest to dokładnie ten rodzaj punktu, który aplikacja ma
    proponować do wykonania hurtem w pierwszej kolejności.
  en: |
    The item is one of the few rules whose execution changes nothing in the
    machine's behaviour and makes sense all the same. The value lies in the writing
    down of a decision: after the rollout it can be seen that the absence of a delay
    is a choice rather than an oversight.

    The requirement of two entries at once is worth explaining, a single one looking
    sufficient. A number of days without the switch does not hold, and the switch
    without a number does not say by how much. The audit tells those cases apart and
    names them separately, instead of returning one "does not meet".

    The rule stands in the matrix's most comfortable corner: the gain real, the cost
    none. It is exactly the kind of item the application is to propose for bulk
    execution first.
