id: win11-wireless-connect-now-wizards-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connect Now
  title:
    pl: Dostęp do kreatorów uproszczonego parowania sieci zablokowany
    en: Access to the simplified network pairing wizards blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z systemu kreatory prowadzące użytkownika przez
    uproszczone parowanie z siecią bezprzewodową i przez przenoszenie
    ustawień sieci na pamięć przenośną.

    Reguła domyka parę z tą, która wyłącza sam mechanizm parowania. Podział
    między nimi jest celowy: tamta zamyka mechanizm, ta zamyka drogę, którą
    użytkownik do niego trafia.

    Kreatory są tu osobnym zagadnieniem z dwóch powodów. Pierwszy jest
    oczywisty — prowadzą przez czynność, której skutków użytkownik nie musi
    rozumieć, i kończą się przyłączeniem do sieci albo zapisaniem hasła sieci
    firmowej na nośniku. Drugi jest ważniejszy: kreator przenoszenia ustawień
    zapisuje konfigurację sieci, razem z hasłem, na pamięć przenośną
    w postaci pliku. Plik ten nie jest chroniony niczym poza tym, gdzie leży.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło sieci
    firmowej na nośniku wyniesionym z biura, zapisane tam przez samego
    użytkownika, w dobrej wierze i zgodnie z instrukcją wyświetloną przez
    system. Nie jest do tego potrzebny żaden błąd oprogramowania.

    Zablokowanie kreatorów nie zabiera możliwości przyłączenia się do sieci
    bezprzewodowej zwykłą drogą.
  en: |
    The setting removes from the system the wizards leading the user through simplified
    pairing with a wireless network and through carrying network settings onto portable
    storage.

    The rule closes the pair with the one switching off the pairing mechanism itself. The
    division between them is deliberate: that one closes the mechanism, this one closes the
    road by which the user comes to it.

    The wizards are a separate matter here for two reasons. The first is plain - they lead
    through an act whose effects the user need not understand, and end in joining a network
    or in the firm's network password being recorded on a medium. The second matters more:
    the wizard for carrying settings records the network's configuration, along with the
    password, onto portable storage as a file. That file is guarded by nothing beyond where
    it lies.

    What an attacker gains while the item goes unmet: the firm's network password on a
    medium carried out of the office, recorded there by the user themselves, in good faith
    and according to an instruction shown by the system. No fault of software is needed for
    that.

    Blocking the wizards does not take away the means of joining a wireless network by the
    ordinary road.

disruption_description:
  pl: |
    Zmiana nie odbiera możliwości korzystania z sieci bezprzewodowej ani
    z żadnej funkcji używanej w codziennej pracy.

    Przyłączenie do sieci przez ikonę sieci i wpisanie hasła działa bez
    zmiany — to jest droga, którą chodzi się na co dzień. Sieci już
    skonfigurowane pozostają zapisane.

    Znikają wyłącznie kreatory: ten prowadzący przez parowanie przyciskiem
    albo kodem oraz ten zapisujący ustawienia sieci na pamięć przenośną.
    Użytkownik, który ich nigdy nie widział, nie zauważy niczego, a to jest
    przypadek zdecydowanej większości stanowisk.

    Zmiana nie wymaga restartu i cofa się natychmiast.
  en: |
    The change takes away neither the means of using a wireless network nor any function
    used in daily work.

    Joining a network through the network icon and typing the password works unchanged -
    that is the road walked from day to day. Networks already configured stay saved.

    What vanishes are the wizards alone: the one leading through pairing by a button or a
    code, and the one recording network settings onto portable storage. A user who has
    never seen them will notice nothing, and that is the case at the great majority of
    stations.

    The change takes no restart and reverses at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Kreator uproszczonego parowania z siecią przestaje być dostępny
      - Zapisanie ustawień sieci na pamięć przenośną przestaje być możliwe
      - Przyłączenie do sieci przez ikonę sieci i hasło działa bez zmiany
      - Sieci już skonfigurowane pozostają zapisane i nie są usuwane
    en:
      - The wizard for simplified pairing with a network stops being available
      - Recording network settings onto portable storage stops being possible
      - Joining a network through the network icon and a password works unchanged
      - Networks already configured stay saved and are not removed
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ustawienia sieci są przenoszone między stanowiskami na pamięci przenośnej tym kreatorem
    en:
      - Network settings are carried between stations on portable storage by this wizard
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableWcnUi'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
    $current = (Get-ItemProperty -Path $path -Name 'DisableWcnUi' -ErrorAction SilentlyContinue).'DisableWcnUi'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableWcnUi'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWcnUi' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/mobilebroadband/

notes:
  pl: |
    Ta sama zasada istnieje w wariancie użytkownika i w wariancie maszyny.
    Reguła dotyczy wariantu maszyny, bo tylko on obowiązuje niezależnie od
    tego, kto na stanowisku pracuje.

    Reguła należy do klasy bez uciążliwości i nadaje się do trybu zbiorczego,
    w odróżnieniu od tej, która wyłącza sam mechanizm parowania — tamta
    potrafi odciąć przyłączanie drukarek i wymaga sprawdzenia.

    Klucz interfejsu jest osobny od klucza mechanizmu, więc obie reguły
    wycofuje się niezależnie.

    Brak wartości nie jest stanem zgodnym, bo domyślnie kreatory są dostępne.
  en: |
    The same policy exists in a user variant and in a machine variant. The rule concerns the
    machine variant, since that one alone binds whoever works at the station.

    The rule belongs to the class without disruption and suits the bulk mode, unlike the one
    switching off the pairing mechanism itself - that one can cut off the joining of
    printers and needs checking.

    The interface's key is separate from the mechanism's key, so the two rules are rolled
    back independently.

    A missing value is not a compliant state, since by default the wizards are available.
