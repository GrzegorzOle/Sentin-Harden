id: win2025-computer-browser-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa prowadząca spis maszyn w sieci lokalnej wyłączona
    en: The service keeping a register of machines on the local network disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę prowadzącą spis maszyn widocznych w sieci
    lokalnej. Usługa ta zbiera ogłoszenia rozsyłane przez inne maszyny
    i na żądanie wydaje gotową listę.

    Zostawiam kategorię średnią i chcę wskazać, co ją na serwerze
    wyznacza, bo nie jest to samo istnienie spisu.

    Rolę prowadzącego spis dla całego segmentu maszyny ustalają między
    sobą, a rozstrzygnięcie sprzyja maszynom z nowszym i mocniejszym
    systemem. Serwer wygrywa takie rozstrzygnięcie niemal zawsze. To
    znaczy, że włączona usługa na serwerze nie tyle pozwala mu
    korzystać ze spisu, ile czyni go tym, który spis prowadzi i wydaje
    całemu segmentowi.

    Protokół, na którym to stoi, pochodzi z czasów, gdy nikt nie pytał,
    kto się odzywa. Nie ma w nim uwierzytelnienia ani po stronie
    ogłaszającego, ani po stronie pytającego. Napastnik zyskuje więc dwie
    rzeczy: gotową listę maszyn w segmencie bez skanowania czegokolwiek
    oraz — jeżeli podszyje się pod prowadzącego — możliwość wydawania
    tej listy innym w postaci, jaka mu odpowiada.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: spis
    maszyn segmentu wydany bez pytania o tożsamość, a na serwerze zwykle
    wydawany przez sam serwer.
  en: |
    The item switches off the service that keeps a register of the machines seen in the near net. That
    service gathers the callings abroad sent about by other machines and gives out a ready list upon
    an asking.

    I leave the category middling and would name what marks it out upon a server, it being not the
    being of the register itself.

    The role of the keeper of the register for the whole reach is settled among the machines, and the
    settling favours machines with a newer and stronger system. A server wins such a settling well
    nigh always. That means that the service switched on upon a server lets it not so much draw upon
    the register as makes it the one that keeps the register and gives it out to the whole reach.

    The reckoning whereon that stands comes of days when nobody asked who was speaking. There is in it
    no knowing of who one is, neither on the side that calls abroad nor on the side that asks. An
    attacker wins therefore two things - a ready list of the machines in the reach without a scanning
    of anything, and, should they put on the likeness of the keeper, the leave to give that list out to
    others in whatever shape suits them.

    What an attacker gains while the item goes unmet - a register of the machines of the reach given
    out with no asking after who one is, and upon a server mostly given out by the server itself.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i powód jest jeden, ale nie
    dotyczy serwera — dotyczy tego, kto do niego przychodzi.

    Na samym serwerze nic tego spisu nie potrzebuje. Zasoby, które
    serwer udostępnia, są wskazywane nazwą i ścieżką, a nie odnajdywane
    przez rozglądanie się po sieci. Gdyby chodziło wyłącznie o maszynę,
    byłaby to zmiana bez uciążliwości.

    Chodzi jednak o starsze stacje robocze i starsze aplikacje, które
    otwierają widok otoczenia sieciowego i oczekują, że coś ten widok
    wypełni. Jeżeli spis prowadzi ten serwer — a zwykle prowadzi właśnie
    on — to po zatrzymaniu usługi widok ten robi się pusty dla wszystkich
    w segmencie naraz. Objaw pojawia się na cudzych ekranach, nie na
    serwerze, i brzmi „zniknęła sieć", co jest opisem odległym od
    przyczyny.

    Sprawdzenie polega na ustaleniu, czy ktokolwiek w tej lokalizacji
    odnajduje udziały przez przeglądanie otoczenia zamiast przez wskazaną
    ścieżkę. Jeżeli nie — zmiana jest czysta i warto ją zrobić, bo
    zdejmuje z serwera rolę, o której nikt nie decydował.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a checking", and the ground is one but it bears not upon the server - it
    bears upon those who come to it.

    Upon the server itself nothing needs that register. The holdings a server deals out are pointed
    out by a name and a path and are not found by a looking about the net. Were it the machine alone
    that mattered, it would be a change with no unease.

    It is a matter, though, of older workstations and older applications that open the sight of the
    neighbourhood of the net and look for something to fill that sight. If the register be kept by
    that server - and mostly it is kept by it - then after the stopping of the service that sight
    turns empty for everyone in the reach at once. The symptom comes forth upon other people's screens
    and not upon the server, and it runs "the net is gone", which is a telling far off from the
    ground.

    The checking comes to the settling whether anybody in that stead finds shares by a looking about
    the neighbourhood in the stead of a pointed-out path. If not - the change is clean and worth
    making, it taking off the server a role nobody decided upon.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Widok otoczenia sieciowego robi się pusty dla wszystkich w segmencie naraz
      - Starsze stacje robocze i aplikacje odnajdujące udziały przez przeglądanie przestają je znajdować
      - Objaw pojawia się na cudzych ekranach, a nie na serwerze, i brzmi jak zniknięcie sieci
      - Udziały wskazywane nazwą i ścieżką działają dalej bez żadnej zmiany
      - Na samym serwerze nic tego spisu nie potrzebuje
    en:
      - The sight of the neighbourhood of the net turns empty for everyone in the reach at once
      - Older workstations and applications that find shares by a looking about stop finding them
      - The symptom comes forth upon other people's screens and not upon the server, and sounds like the net having gone
      - Shares pointed out by a name and a path work on without any altering
      - Upon the server itself nothing needs that register
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - W lokalizacji odnajduje się udziały przez przeglądanie otoczenia sieciowego zamiast po wskazanej ścieżce
    en:
      - In that stead shares are found by a looking about the neighbourhood of the net in the stead of a pointed-out path
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A server usually wins the election and keeps the register for the whole
    # segment, so the network neighbourhood view empties for everyone at once.
    # The symptom appears on other people's screens, not here.
    Stop-Service -Name 'Browser' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Browser' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Browser' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/network-browsing-overview

notes:
  pl: |
    Kategorii nie wyznacza samo istnienie spisu. Rolę prowadzącego spis
    maszyny ustalają między sobą, a rozstrzygnięcie sprzyja nowszym
    i mocniejszym systemom — serwer wygrywa je niemal zawsze. Włączona
    usługa czyni go więc tym, który spis prowadzi i wydaje całemu
    segmentowi.

    Protokół pochodzi z czasów, gdy nikt nie pytał, kto się odzywa —
    nie ma uwierzytelnienia po żadnej ze stron.

    Klasa utrzymana nie z powodu serwera, tylko tych, którzy do niego
    przychodzą: po zatrzymaniu usługi widok otoczenia sieciowego robi się
    pusty dla wszystkich w segmencie naraz, a objaw pojawia się na cudzych
    ekranach.
  en: |
    What marks the category out is not the being of the register itself. The role of the keeper is
    settled among the machines, and the settling favours newer and stronger systems - a server wins it
    well nigh always. The service switched on makes it therefore the one that keeps the register and
    gives it out to the whole reach.

    The reckoning comes of days when nobody asked who was speaking - there is in it no knowing of who
    one is on either side.

    The class is held not of the server's ground but of that of those who come to it - after the
    stopping of the service the sight of the neighbourhood of the net turns empty for everyone in the
    reach at once, and the symptom comes forth upon other people's screens.
