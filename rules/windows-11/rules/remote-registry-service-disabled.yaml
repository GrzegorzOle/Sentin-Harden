id: win11-remote-registry-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego dostępu do rejestru wyłączona
    en: The remote registry access service disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia rejestr maszyny przez sieć. Po nawiązaniu połączenia
    można czytać, a przy odpowiednich uprawnieniach także zapisywać gałęzie
    rejestru tak, jakby siedziało się przy tej maszynie.

    Rejestr jest jednocześnie spisem wszystkiego, co na maszynie ustawiono:
    wersji systemu, zainstalowanych programów, konfiguracji usług, list
    uruchamianych przy starcie, ustawień zabezpieczeń. Dla kogoś, kto dopiero
    rozpoznaje sieć, jeden odczyt przez tę usługę zastępuje godziny szukania —
    mówi, co na maszynie stoi, jak jest utwardzona i czym się broni.

    Dostęp do zapisu jest jeszcze poważniejszy. Lista programów uruchamianych
    przy starcie, ścieżka do pliku wykonywalnego usługi, ustawienia
    zabezpieczeń — wszystko to są wpisy w rejestrze. Zdalny zapis do rejestru
    jest w praktyce równoważny z uruchomieniem kodu na maszynie, tyle że
    z opóźnieniem do najbliższego startu.

    Usługa pochodzi z czasów, kiedy zarządzanie maszynami prowadzono właśnie
    tak. Dzisiejsze narzędzia zarządzania nie potrzebują jej do pracy.
  en: |
    The service shares the machine's registry over the network. Once a connection is
    made, registry keys can be read and, with the right permissions, written as well,
    just as if one were sitting at the machine.

    The registry is at the same time an inventory of everything set on the machine: the
    system's version, installed programs, the configuration of services, the lists run
    at startup, security settings. For somebody just getting to know a network, one read
    through this service replaces hours of searching - it says what stands on the
    machine, how it is hardened and what it defends itself with.

    Write access is graver still. The list of programs run at startup, the path to a
    service's executable file, security settings - all of these are registry entries.
    Writing to the registry remotely amounts in practice to running code on the machine,
    only delayed until the next start.

    The service comes from a time when machines were managed in exactly that way. The
    management tools of today do not need it to do their work.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy jakiekolwiek narzędzie sięga do tej maszyny
    przez rejestr zdalny.

    Na maszynie, która jest już wyłączona — a tak jest domyślnie w nowszych
    instalacjach — zmiana nie robi nic.

    Tam, gdzie usługa działa, zwykle włączył ją człowiek albo narzędzie i warto
    ustalić które. Spotyka się trzy przypadki. Pierwszy to starsze narzędzia
    inwentaryzacyjne, zbierające spis oprogramowania właśnie przez rejestr.
    Drugi to skrypty administracyjne odczytujące ustawienia maszyn zdalnie.
    Trzeci to konsole systemowe uruchamiane z innej maszyny — podgląd zdarzeń,
    zarządzanie usługami, zarządzanie dyskami — z których część nawiązuje
    połączenie do rejestru w tle, nie mówiąc o tym wprost.

    Ten trzeci przypadek jest źródłem najczęstszego zaskoczenia po wdrożeniu:
    narzędzie, które nigdy nie wspominało o rejestrze, przestaje się łączyć
    i zgłasza błąd dostępu. Objaw pojawia się u administratora, nie
    u użytkownika.

    Zamiennikiem dla wszystkich trzech przypadków jest zdalne zarządzanie
    oparte na poleceniach, które nie wymaga tej usługi.

    Nie ma restartu.
  en: |
    What needs checking is whether any tool reaches this machine through the remote
    registry.

    On a machine where it is already off - and that is the default in newer
    installations - the change does nothing.

    Where the service runs, it was usually switched on by a person or a tool, and it is
    worth settling which. Three cases are met. The first is older inventory tools,
    gathering a list of software through the registry. The second is administrative
    scripts reading machines' settings remotely. The third is system consoles started
    from another machine - the event viewer, service management, disk management - some
    of which open a connection to the registry in the background without saying so.

    That third case is the source of the commonest surprise after the rollout: a tool
    that never mentioned the registry stops connecting and reports an access error. The
    symptom appears at the administrator, not at the user.

    The replacement for all three cases is remote management resting on commands, which
    does not need this service.

    There is no restart.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia inwentaryzacyjne czytające spis oprogramowania przez rejestr zdalny przestaną zbierać dane
      - Konsole systemowe uruchamiane z innej maszyny zgłoszą błąd dostępu przy podłączeniu
      - Skrypty odczytujące ustawienia tej maszyny zdalnie zakończą się błędem
      - Praca użytkownika przy maszynie nie zmienia się w żaden sposób
    en:
      - Inventory tools reading the list of software through the remote registry stop gathering data
      - System consoles started from another machine report an access error on connecting
      - Scripts reading this machine's settings remotely end in an error
      - A user's work at the machine does not change in any way
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Inwentaryzacja oprogramowania w organizacji opiera się na odczycie rejestru zdalnego
      - Maszyna jest zarządzana wyłącznie konsolami podłączanymi z innej maszyny
    en:
      - Software inventory in the organisation rests on reading the registry remotely
      - The machine is managed only by consoles attached from another machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RemoteRegistry' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteRegistry' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RemoteRegistry' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/sysinfo/registry-functions

notes:
  pl: |
    Punkt bywa mylony z ustawieniami ograniczającymi zdalny dostęp do rejestru,
    które mają w tej paczce osobne reguły: listą ścieżek dostępnych zdalnie
    i uprawnieniami do samego połączenia. Tamte zawężają, co wolno przeczytać
    po nawiązaniu połączenia; ten punkt sprawia, że połączenia nie da się
    nawiązać w ogóle. Wdrożenie tego punktu czyni tamte bez znaczenia, ale
    warto je ustawić mimo wszystko — bronią maszyny, na której ktoś kiedyś tę
    usługę włączy.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa zatrzymana, lecz ustawiona na uruchamianie ręczne,
    wróci przy pierwszym połączeniu — i dlatego to konfiguracja odpowiada na
    pytanie o zabezpieczenie maszyny.

    Brak klucza usługi raportuje jako nieistotny dla tej maszyny, a nie jako
    niezgodność. Usługa bywa usuwana z obrazów instalacyjnych i wynik
    „niespełniony" byłby wtedy nieprawdziwy.
  en: |
    The item is sometimes confused with the settings limiting remote access to the
    registry, which have rules of their own in this pack: the list of paths reachable
    remotely and the permissions on the connection itself. Those narrow what may be read
    once a connection is made; this item means the connection cannot be made at all.
    Applying this item makes those of no consequence, but they are worth setting all the
    same - they guard a machine on which somebody one day switches the service on.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment. A service that is stopped but set to start on demand will
    come back with the first connection - which is why it is the configuration that
    answers the question about the machine being guarded.

    A missing service key is reported as not applicable to this machine rather than as a
    deviation. The service is sometimes removed from installation images and an "unmet"
    verdict would then be untrue.
