id: win2025-rdp-disconnected-session-limit

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits
  title:
    pl: Rozłączona sesja pulpitu zdalnego kończona po minucie
    en: A disconnected remote desktop session ended after a minute
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie kończy sesję pulpitu zdalnego po minucie od jej
    rozłączenia, zamiast zostawiać ją żywą bez końca.

    Sesja rozłączona to sesja, z której ktoś odszedł, nie wylogowując
    się. Jest to stan pośredni, którego system nie traktuje jak końca
    pracy: procesy działają, dokumenty są otwarte, a token dostępu ze
    wszystkimi uprawnieniami tej osoby leży w pamięci maszyny. Zamknięcie
    okna klienta wygląda dla człowieka jak wyjście, a dla serwera jest
    tylko zerwaniem obrazu.

    Podnoszę tu kategorię ryzyka względem paczki stanowiska roboczego
    i powód jest prosty do sprawdzenia. Na stanowisku sesja rozłączona
    jest jedna i należy do właściciela maszyny. Na serwerze terminali
    sesje rozłączone gromadzą się przez miesiące i nikt ich nie liczy.
    Po pół roku maszyna trzyma w pamięci materiał poświadczeniowy
    znacznej części zespołu, a wystarczy jedno przejęcie uprawnień
    administracyjnych na tej maszynie, żeby zebrać go w całości za
    jednym razem.

    Drugi zysk napastnika jest bezpośredni: sesja rozłączona jest
    zalogowana, więc jej przejęcie to praca na cudzych uprawnieniach
    bez hasła. Sesja administratora, rozłączona w piątek po południu,
    czeka przez weekend.

    Trzecia sprawa jest praktyczna i warta zapisania, bo bywa
    pomijana: dopóki sesja żyje, wylogowanie tej osoby nie odbiera jej
    dostępu, a zmiana jej hasła nie unieważnia tego, co już działa
    w sesji. Sesja rozłączona przeżywa czynności, które w mniemaniu
    zespołu odcięły komuś dostęp.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rosnący
    zbiór zalogowanych sesji bez nadzoru, każdą z poświadczeniami
    w pamięci i każdą do przejęcia bez hasła.
  en: |
    The setting ends a remote desktop session a minute after its disconnection, instead of leaving
    it living without end.

    A disconnected session is a session somebody has walked away from without signing off. It is a
    middle state which the system does not take for the end of work: processes run, documents are
    open, and a token of access with all that person's rights lies in the machine's memory. The
    closing of the client's window looks to a person like leaving, and to the server is only a
    severing of the picture.

    I raise the category of risk here against the working station's pack, and the reason is simple
    to check. At a station a disconnected session is one and belongs to the machine's owner. On a
    terminal server disconnected sessions gather over months and nobody counts them. After half a
    year the machine holds in memory the credential matter of a good part of the team, and one
    taking of administrative rights on that machine is enough to gather it whole at one go.

    The attacker's second gain is straightforward: a disconnected session is signed in, so the
    taking of it is working with another's rights with no password. An administrator's session,
    disconnected on a Friday afternoon, waits through the weekend.

    The third matter is practical and worth writing down, being often passed over: while the
    session lives, the signing off of that person does not take their access away, and the changing
    of their password does not undo what already runs in the session. A disconnected session
    outlives acts which in the team's belief cut somebody's access off.

    What an attacker gains while the item goes unmet: a growing body of signed-in sessions with no
    watch over them, each with credentials in memory and each to be taken over with no password.

disruption_description:
  pl: |
    Zaliczam ten punkt do klasy wymagającej świadomego wdrożenia,
    wyżej niż w paczce stanowiska roboczego, i chcę uczciwie nazwać
    dlaczego: minuta jest wartością ostrą, a na serwerze kosztuje
    cudzą pracę.

    Rzecz pierwsza jest najważniejsza. Rozłączenie nie zawsze oznacza,
    że ktoś odszedł. Zerwanie łącza, przełączenie sieci bezprzewodowej,
    uśpienie laptopa, przerwa w tunelu do biura — wszystko to wygląda
    dla serwera identycznie jak zamknięcie okna. Po minucie sesja
    zostanie zakończona razem z tym, co było w niej otwarte,
    i z niezapisanymi zmianami. Człowiek, który wraca po dwóch minutach,
    zastaje pustkę.

    Rzecz druga to złożenie z ograniczeniem sesji bezczynnych.
    Kwadrans bezczynności rozłącza sesję, a ta minuta ją kończy, więc
    szesnaście minut bez dotknięcia klawiatury wystarczy, żeby zginęło
    wszystko, co w sesji działało. Oba punkty wdraża się razem, w jednym
    oknie, i razem o nich uprzedza.

    Rzecz trzecia dotyczy pracy długiej. Import, kopia zapasowa albo
    przebudowa indeksu uruchomiona w sesji ginie razem z sesją. Właściwą
    odpowiedzią nie jest odpuszczenie tego punktu, tylko przeniesienie
    takich zadań do mechanizmu, który nie zależy od czyjejś sesji —
    do zadania zaplanowanego albo do usługi. Warto to powiedzieć
    zawczasu, bo ludzie odkrywają to zwykle po stracie kilku godzin
    pracy maszyny.

    Objaw jest mylący i trzeba go znać. Po ponownym połączeniu człowiek
    dostaje sesję nową, czystą, bez śladu poprzedniej. Wygląda to na
    zwykłe zalogowanie, a nie na utratę poprzedniej sesji — dopiero
    brak otwartych okien mówi, co się stało.

    Na serwerze, na którym minuta jest za ostra dla faktycznej pracy,
    właściwą odpowiedzią jest zapisanie wyjątku z uzasadnieniem
    i terminem przeglądu, a nie ciche pominięcie punktu.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    rozłączone obejmuje przy następnym sprawdzeniu licznika.
  en: |
    I reckon this item to the class taking a knowing rollout, higher than in the working station's
    pack, and mean to name honestly why: a minute is a stern value, and on a server it costs
    another's work.

    The first matter is the weightiest. A disconnection does not always mean somebody has walked
    away. A severed link, a switching of the wireless network, a laptop put to sleep, a break in
    the tunnel to the office - all of that looks to the server just like the closing of a window.
    After a minute the session will be ended along with what was open within it and with unsaved
    changes. A person coming back after two minutes finds emptiness.

    The second matter is the laying together with the bound on idle sessions. A quarter of an hour
    of idleness disconnects the session and this minute ends it, so sixteen minutes without
    touching the keyboard suffice for all that ran in the session to perish. Both items are rolled
    out together, in one window, and foretold together.

    The third matter bears on long work. An import, a backup or a rebuilding of an index started in
    the session perishes along with the session. The right answer is not the letting go of this
    item but the moving of such jobs into a mechanism that does not hang on somebody's session -
    into a planned job or into a service. It is worth saying beforehand, people discovering it
    usually after the loss of some hours of the machine's work.

    The symptom misleads and must be known. After connecting anew a person gets a new session,
    clean, with no trace of the former. It looks like an ordinary signing in and not like the loss
    of the former session - only the want of the open windows says what has happened.

    On a server where a minute is too stern for the actual work, the right answer is the writing of
    an exception with its grounds and a date of review, and not a quiet passing over of the item.

    The change comes into force straight away and is undone at once. It takes in sessions already
    disconnected at the counter's next checking.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Zerwane łącze albo uśpiony laptop wygląda dla serwera jak zamknięcie okna i po minucie sesja ginie
      - Niezapisane zmiany w dokumentach otwartych w sesji przepadają razem z nią
      - Import albo przebudowa indeksu uruchomiona w sesji ginie razem z sesją
      - Razem z ograniczeniem sesji bezczynnych szesnaście minut bez klawiatury kończy wszystko
      - Po ponownym połączeniu człowiek dostaje czystą sesję, co wygląda na zwykłe zalogowanie
    en:
      - A severed link or a sleeping laptop looks to the server like the closing of a window, and after a minute the session perishes
      - Unsaved changes in documents open in the session are lost along with it
      - An import or a rebuilding of an index started in the session perishes along with the session
      - Together with the bound on idle sessions, sixteen minutes without a keyboard ends everything
      - After connecting anew a person gets a clean session, which looks like an ordinary signing in
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze uruchamia się z sesji zadania długie, których nie przeniesiono do zadań zaplanowanych
      - Ludzie łączą się z tym serwerem łączem zrywającym się na tyle często, że minuta jest wartością nierealną
    en:
      - Long jobs are started from a session on the server and have not been moved into planned jobs
      - People connect to this server by a link severing often enough that a minute is an unreal value
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it is the absence of a limit, not
      # the shortest one. Reported apart, so a report cannot read it as a very
      # strict setting.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'MaxDisconnectionTime'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_LIMIT' }
        elseif ([int]$value -le 60000) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: WITHIN_LIMIT
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'MaxDisconnectionTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxDisconnectionTime' -Value 60000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Kategorię podniosłem względem paczki stanowiska roboczego: na
    stanowisku sesja rozłączona jest jedna, na serwerze terminali
    gromadzą się przez miesiące i nikt ich nie liczy.

    Rzecz często pomijana: dopóki sesja żyje, wylogowanie tej osoby nie
    odbiera jej dostępu, a zmiana hasła nie unieważnia tego, co już
    w sesji działa.

    Minuta jest wartością ostrą i kosztuje cudzą pracę, bo zerwane
    łącze wygląda dla serwera jak zamknięcie okna. Gdzie jest za ostra,
    właściwą odpowiedzią jest zapisany wyjątek z terminem przeglądu,
    a nie ciche pominięcie punktu.
  en: |
    I raised the category against the working station's pack: at a station a disconnected session
    is one, on a terminal server they gather over months and nobody counts them.

    A thing often passed over: while the session lives, the signing off of that person does not
    take their access away, and a change of password does not undo what already runs in the
    session.

    A minute is a stern value and costs another's work, a severed link looking to the server like
    the closing of a window. Where it is too stern, the right answer is a written exception with a
    date of review and not a quiet passing over of the item.
