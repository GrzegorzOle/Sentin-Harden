id: win2025-defender-asr-script-downloaded-executable

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania pobranych plików wykonywalnych przez skrypty
    en: Scripts blocked from launching downloaded executable content
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła blokuje wzorzec, w którym skrypt pobiera z sieci plik
    wykonywalny i od razu go uruchamia.

    Wzorzec ten jest szkieletem niemal każdego dzisiejszego włamania.
    Napastnik rzadko wnosi całe narzędzie od razu — wnosi kilka linii,
    które ściągają resztę. Kilka linii przechodzi tam, gdzie plik
    wykonywalny by nie przeszedł: w załączniku, w poleceniu, w cudzym
    skrypcie, w parametrze zadania.

    Blokada uderza dokładnie w przegub między wejściem a właściwym
    narzędziem. Napastnik, który wszedł, dalej jest w środku — ale
    zostaje z tym, co zdołał wnieść, zamiast z tym, co chciałby
    pobrać.

    Na serwerze punkt waży więcej niż na stanowisku z powodu, który
    warto nazwać osobno. Serwer ma zwykle szersze wyjście do sieci niż
    stanowisko, bo pobiera aktualizacje, paczki i dane. Droga wyjścia,
    którą zbudowano dla aktualizacji, jest tą samą drogą, którą wchodzi
    druga część narzędzia napastnika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wniesienia na serwer kilku linii skryptu i dociągnięcia
    nimi właściwego narzędzia z sieci.
  en: |
    The rule blocks the pattern wherein a script fetches from the net a file to be carried out and
    runs it straight away.

    That pattern is the frame of well-nigh every breaking-in of today. An attacker seldom brings in
    the whole tool at once - they bring in a few lines that draw down the rest. A few lines pass
    where a file to be carried out would not - in an attachment, in an order, in another's script,
    in a task's setting.

    The blocking strikes just at the joint between the coming in and the true tool. An attacker who
    has come in is still within - but is left with what they managed to bring, rather than with
    what they would fetch.

    On a server the item weighs more than at a station for a ground worth naming apart. A server
    has mostly a wider way out to the net than a station, fetching as it does freshenings, bundles
    and readings. The way out built for freshenings is the same way by which the second part of the
    attacker's tool comes in.

    What an attacker gains while the item goes unmet: the means of bringing onto the server a few
    lines of script and of drawing the true tool down the net with them.

disruption_description:
  pl: |
    Podnoszę tu klasę do świadomego wdrożenia i powód jest ten sam,
    który daje tej regule wartość: wzorzec, który blokuje, jest
    jednocześnie wzorcem automatycznego wdrażania oprogramowania.

    Skrypt, który pobiera instalator i go uruchamia, to nie jest
    rzadkość na serwerze — to jest sposób, w jaki oprogramowanie
    trafia na serwery w każdej większej organizacji. Systemy
    dystrybucji, skrypty pierwszej konfiguracji maszyny, narzędzia
    zarządzania konfiguracją, mechanizmy samoaktualizacji agentów —
    wszystkie robią dokładnie to.

    Reguła nie odróżnia jednego od drugiego, bo nie ma po czym.
    Zachowanie jest identyczne; różni się zamiar, a zamiaru mechanizm
    nie widzi.

    Skutek trafienia jest na serwerze szczególnie kosztowny w dwóch
    miejscach. Przy stawianiu maszyny od nowa, gdy skrypt pierwszej
    konfiguracji przerwie się w połowie i zostawi serwer w stanie
    nijakim. Oraz przy samoaktualizacji agentów, gdy agent po prostu
    przestaje się aktualizować, nie zgłaszając nic, i po kilku
    miesiącach okazuje się, że pracuje na wersji sprzed roku.

    Wdrożenie wymaga więc dwóch rzeczy. Trybu obserwacji przez pełen
    cykl — z wdrożeniem oprogramowania włącznie, a nie tylko przez
    tydzień zwykłej pracy. I listy wyłączeń dla ścieżek, którymi
    dystrybucja rzeczywiście chodzi, przygotowanej zanim blokada
    zadziała, a nie po pierwszej awarii wdrożenia.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    I raise the class here to a knowing rollout, and the ground is the same that gives this rule
    its worth - the pattern it blocks is at once the pattern of the rolling out of software of
    itself.

    A script that fetches an installer and runs it is on a server no rarity - it is the way
    software comes onto servers in every larger body. Systems of the dealing out of software,
    scripts of a machine's first setting up, tools for the managing of setups, mechanisms whereby
    agents freshen themselves - all do exactly that.

    The rule tells not one from the other, having nothing to tell them by. The behaviour is the
    same; what differs is the intent, and the mechanism sees no intent.

    The effect of a striking is on a server costly above all in two places. At the setting up of a
    machine anew, where the script of first setting up breaks off halfway and leaves the server in
    a middling state. And at the freshening of agents by themselves, where an agent simply stops
    freshening, reporting nothing, and after some months it comes out that it works on a build a
    year old.

    The rollout takes therefore two things. The mode of watching over a full round - with a rolling
    out of software among it, and not over a week of ordinary work alone. And a list of leavings
    out for the paths the dealing out truly goes by, made ready before the blocking takes and not
    after the first failed rolling out.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - System dystrybucji oprogramowania pobierający instalator skryptem przestanie go uruchamiać
      - Skrypt pierwszej konfiguracji maszyny przerwie się w połowie i zostawi serwer w stanie nijakim
      - Agent aktualizujący się samodzielnie przestanie to robić, nie zgłaszając niczego
      - Reguła nie odróżnia wdrożenia od ataku, bo zachowanie jest identyczne, a różni się zamiar
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - A system of the dealing out of software fetching an installer by script will stop running it
      - A script of a machine's first setting up will break off halfway and leave the server middling
      - An agent that freshens itself will stop doing so, reporting nothing
      - The rule tells not a rolling out from an attack, the behaviour being the same and the intent differing
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przygotowano listy wyłączeń dla ścieżek, którymi dystrybucja oprogramowania rzeczywiście chodzi
      - Nie przeszedł pełen cykl obserwacji obejmujący wdrożenie oprogramowania, a nie tylko zwykłą pracę
    en:
      - No list of leavings out was made ready for the paths the dealing out of software truly goes by
      - No full round of watching took in a rolling out of software, but ordinary work alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'd3e037e1-3eb8-44c8-a917-57927947596d'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'd3e037e1-3eb8-44c8-a917-57927947596d'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The blocked pattern is also the pattern of software deployment. Have the
    # leavings out for the deployment paths in place before setting this.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'd3e037e1-3eb8-44c8-a917-57927947596d' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła uderza w przegub między wejściem a właściwym narzędziem.
    Napastnik, który wszedł, zostaje z tym, co zdołał wnieść, zamiast
    z tym, co chciałby pobrać.

    Ta sama rzecz jest jej ceną: blokowany wzorzec to wzorzec
    automatycznego wdrażania oprogramowania. Skrypt pobierający
    instalator i uruchamiający go to sposób, w jaki oprogramowanie
    trafia na serwery. Mechanizm nie odróżnia jednego od drugiego, bo
    różni je zamiar, którego nie widzi.

    Dwa najdroższe trafienia na serwerze: skrypt pierwszej konfiguracji
    przerwany w połowie oraz agent, który po cichu przestał się
    aktualizować.
  en: |
    The rule strikes at the joint between the coming in and the true tool. An attacker who has come
    in is left with what they managed to bring, rather than with what they would fetch.

    That same thing is its price - the blocked pattern is the pattern of the rolling out of
    software of itself. A script that fetches an installer and runs it is the way software comes
    onto servers. The mechanism tells not one from the other, what parts them being an intent it
    does not see.

    The two costliest strikings on a server - a script of first setting up broken off halfway, and
    an agent that has quietly stopped freshening itself.
