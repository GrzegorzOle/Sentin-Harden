id: debian-13
name:
  pl: Debian 13 (trixie)
  en: Debian 13 (trixie)
family: linux
shell: bash
profile: server

benchmark:
  name: CIS Debian Linux Benchmark
  version: TBD

detection:
  command: |
    . /etc/os-release
    printf '%s|%s\n' "$ID" "$VERSION_ID"
  match: '^debian\|13$'

notes:
  pl: |
    UWAGA: cel zapisany pierwotnie jako „Debian 24" — taka wersja nie istnieje.
    Numeracja Debiana to 11 (bullseye), 12 (bookworm), 13 (trixie, sierpień
    2025). Przyjęto 13. Jeśli chodziło o 12, zmień nazwę katalogu i wartość
    detection.match.

    Kontrola dostępu: AppArmor, nie SELinux — reguły dotyczące SELinuksa należą
    wyłącznie do paczki Fedory i nie mają tu odpowiednika.
    Menedżer pakietów: apt.
  en: |
    NOTE: this target was originally written down as "Debian 24", a version
    that does not exist. Debian numbering is 11 (bullseye), 12 (bookworm),
    13 (trixie, August 2025). 13 was assumed. If 12 was meant, rename the
    directory and change detection.match.

    Access control: AppArmor, not SELinux - SELinux rules belong to the Fedora
    pack only and have no counterpart here.
    Package manager: apt.
