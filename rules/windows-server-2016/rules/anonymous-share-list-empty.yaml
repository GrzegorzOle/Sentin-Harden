id: win2016-anonymous-share-list-empty

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista udziałów dostępnych anonimowo pusta
    en: The list of shares reachable anonymously empty
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby lista udziałów osiągalnych bez uwierzytelnienia była
    pusta.

    Różnica wobec poprzedniego punktu jest istotna i warto ją powiedzieć
    wprost. Tam chodziło o kanał rozmowy z usługą; tutaj o katalog z plikami.
    Udział na tej liście nie odpowiada na pytania o maszynę — on wydaje
    zawartość. Każdemu, kto zapyta, bez konta i bez śladu w postaci nieudanego
    logowania.

    Historyczny powód takich wpisów jest dobrze znany: udział z oprogramowaniem
    do instalacji, katalog ze sterownikami drukarek, udostępniony zasób
    dla urządzenia, które nie umie się zalogować. Skaner sieciowy, terminal
    magazynowy, kontroler produkcyjny — sprzęt, któremu nikt nie założył konta,
    bo nie umiałby go użyć.

    Cena jest taka, że ten sam katalog widzi każdy. Napastnik w sieci lokalnej
    nie musi niczego przełamywać: wypisuje zawartość i czyta. Jeżeli leży tam
    plik odpowiedzi instalacyjnej, skrypt wdrożeniowy albo kopia konfiguracji
    z hasłem w środku — a leżą tam takie rzeczy częściej, niż się przypuszcza —
    rozpoznanie kończy się poświadczeniem.

    W roczniku 2016 ta lista bywa niepusta z dokładnie tego powodu: maszyna
    pełniła kiedyś rolę serwera plików dla urządzeń, które od tego czasu
    wymieniono, a wpis został.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czytelny
    katalog na serwerze, bez konta i bez logowania, a w nim to, co zostawiono
    tam dla urządzeń niezdolnych się uwierzytelnić.
  en: |
    The item requires that the list of shares reachable without authentication be
    empty.

    The difference from the previous item matters and is worth saying outright.
    There it was a channel for talking to a service; here it is a directory with
    files. A share on this list does not answer questions about the machine - it
    hands out contents. To anybody who asks, with no account and no trace in the
    shape of a failed sign-in.

    The historical reason for such entries is well known: a share with software to
    install, a directory of printer drivers, a resource opened up for a device that
    cannot sign in. A network scanner, a warehouse terminal, a production controller
    - equipment nobody made an account for, since it would not know how to use one.

    The price is that the same directory is seen by everybody. An attacker on the
    local network need break nothing: they list the contents and read. If an
    installation answer file lies there, or a deployment script, or a copy of a
    configuration with a password inside - and such things lie there more often than
    is supposed - the reconnaissance ends in a credential.

    In the 2016 vintage this list is at times not empty for exactly that reason: the
    machine once served as a file server for devices since replaced, and the entry
    stayed.

    What an attacker gains while the item goes unmet: a readable directory on the
    server, with no account and no sign-in, and in it whatever was left there for
    devices unable to authenticate.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", i jest to sprawdzenie cięższe niż przy
    potokach, bo po drugiej stronie stoi zwykle urządzenie, a nie
    oprogramowanie.

    Urządzenie różni się tym, że nie da się go poprosić o zalogowanie.
    Skaner sieciowy odkładający zeskanowane dokumenty, terminal pobierający
    plik konfiguracyjny przy starcie, sterownik maszyny produkcyjnej czytający
    receptury — wszystkie one albo umieją użyć konta, albo nie, i tego nie
    zmienia się ustawieniem po stronie serwera.

    Dlatego kolejność jest tu odwrotna niż zwykle. Najpierw trzeba ustalić,
    kto sięga do tego udziału — z dziennika dostępu albo z listy połączeń —
    a dopiero potem zamykać. Zamknięcie najpierw i obserwowanie, co się zepsuje,
    jest w tym wypadku metodą kosztowną, bo zepsuje się zwykle w produkcji
    i zwykle nie od razu.

    Wyjątkiem są maszyny, na których lista jest niepusta, a sam udział o tej
    nazwie dawno nie istnieje. To jest najczęstszy przypadek i tam zmiana nie
    kosztuje nic.

    Czego to nie psuje: udziałów dostępnych po uwierzytelnieniu, udziałów
    administracyjnych, zasad grupy ani niczego, co korzysta z konta.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and it is a heavier review than with the pipes,
    since on the other side stands as a rule a device and not a piece of software.

    A device differs in that it cannot be asked to sign in. A network scanner
    depositing scanned documents, a terminal fetching a configuration file at start,
    a production machine's controller reading recipes - each of them either can use
    an account or cannot, and that is not altered by a setting on the server's side.

    The order here is therefore the reverse of the usual. First it has to be
    established who reaches this share - from the access log or from the list of
    connections - and only then closed. Closing first and watching what breaks is in
    this case a costly method, since what breaks is usually in production and
    usually not at once.

    The exception is machines where the list is not empty but the share of that name
    has long since ceased to exist. That is the commonest case and there the change
    costs nothing.

    What this does not break: shares reachable after authentication, administrative
    shares, group policy, or anything that uses an account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
    - scripting-and-automation
  what_breaks:
    pl:
      - Skaner sieciowy odkładający dokumenty na ten udział przestaje je odkładać, zwykle bez widocznego komunikatu
      - Terminal albo sterownik pobierający plik konfiguracyjny przy starcie nie wystartuje po najbliższym restarcie
      - Usterka ujawnia się w produkcji i z opóźnieniem, bo urządzenia sięgają do udziału rzadziej niż ludzie
      - Udziały dostępne po uwierzytelnieniu, udziały administracyjne i zasady grupy pozostają bez zmian
    en:
      - A network scanner depositing documents on this share stops depositing them, usually with no visible message
      - A terminal or controller fetching a configuration file at start will not start after the next restart
      - The fault comes to light in production and with a delay, since devices reach the share less often than people do
      - Shares reachable after authentication, administrative shares and group policy stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono z dziennika dostępu ani z listy połączeń, kto sięga do udziałów wypisanych przez audyt
      - Do udziału sięga urządzenie, które nie umie użyć konta, i nie ma dla niego innej drogi
    en:
      - It has not been established from the access log or the list of connections who reaches the shares the audit reports
      - The share is reached by a device that cannot use an account and has no other road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a list
      # with nothing on it mean the same thing here - no share is reachable
      # anonymously - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'NullSessionShares'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'EMPTY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'NullSessionShares'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # An empty list rather than a removed value - the removed value means the same
    # thing, but an empty list records the decision instead of leaving the state to
    # a default.
    Set-ItemProperty -Path $path -Name 'NullSessionShares' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type MultiString
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-shares-that-can-be-accessed-anonymously

notes:
  pl: |
    Audyt wypisuje nazwy udziałów, a nie sam werdykt, i tutaj ma to znaczenie
    większe niż przy potokach. Nazwa udziału zwykle mówi człowiekowi, do czego
    służy, więc już samo jej przeczytanie rozstrzyga połowę decyzji.

    Bardzo częstym wynikiem jest wpis wskazujący na udział, którego na maszynie
    dawno nie ma. Wpis nie znika sam po usunięciu udziału, więc lista bywa
    archiwum decyzji sprzed kilku migracji. Takie wpisy usuwa się bez ryzyka
    i warto to w raporcie odróżnić od wpisów żywych.

    Gdy urządzenie faktycznie potrzebuje dostępu bez konta, właściwą drogą nie
    jest utrzymanie tego wpisu, tylko wydzielenie osobnego udziału z kontem
    o wąskich uprawnieniach — albo wydzielenie sieci, w której to urządzenie
    pracuje. Świadome odpuszczenie punktu też jest wyjściem i wtedy powinno
    trafić do raportu jako wyjątek z datą przeglądu.
  en: |
    The audit writes out the shares' names, not the bare verdict, and here that
    matters more than with the pipes. A share's name usually tells a person what it
    serves, so reading it alone settles half the decision.

    A very common result is an entry pointing at a share the machine has long since
    lost. The entry does not vanish of itself when the share is removed, so the list
    is at times an archive of decisions from several migrations back. Such entries
    are removed without risk, and it is worth telling them apart in the report from
    living ones.

    Where a device genuinely needs access without an account, the proper road is not
    keeping this entry but setting apart a separate share with a narrowly privileged
    account - or setting apart the network the device works in. Knowingly letting
    the item go is a way out too, and should then reach the report as an exception
    with a review date.
