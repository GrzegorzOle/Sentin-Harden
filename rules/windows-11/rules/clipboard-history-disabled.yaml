id: win11-clipboard-history-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > OS Policies
  title:
    pl: Historia schowka wyłączona
    en: Clipboard history switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Schowek z założenia pamięta jedną rzecz i zapomina ją przy następnym
    kopiowaniu. Historia schowka tę właściwość znosi: wszystko, co użytkownik
    skopiował, zostaje zapisane i daje się przywołać z listy.

    Przez schowek przechodzą rzeczy, których nikt nie zapisuje świadomie. Hasło
    wklejane z menedżera haseł, kod jednorazowy, numer rachunku, fragment umowy,
    klucz dostępowy wklejany do konfiguracji — wszystko to przechodzi przez
    schowek i przy włączonej historii zostaje w nim po zakończeniu czynności.

    Skutkiem jest zbiór najwrażliwszych rzeczy z dnia pracy, dostępny każdemu,
    kto usiądzie przy odblokowanym stanowisku, i każdemu procesowi działającemu
    w sesji użytkownika. Wyłączenie historii przywraca schowkowi jego pierwotną
    właściwość — to, co przeszło, przestaje być dostępne.
  en: |
    A clipboard by design remembers one thing and forgets it at the next copy.
    Clipboard history undoes that trait: everything the user has copied is kept and
    can be called back from a list.

    Things nobody deliberately saves pass through the clipboard. A password pasted
    from a password manager, a one-time code, an account number, a fragment of a
    contract, an access key pasted into a configuration - all of it goes through the
    clipboard, and with history on it stays there after the task is done.

    The upshot is a collection of the most sensitive things from a working day,
    available to anyone who sits down at an unlocked station and to every process
    running in the user's session. Switching history off restores the clipboard's
    original trait - what has passed stops being available.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na stanowiskach ktoś posługuje się historią
    schowka w codziennej pracy.

    Zwykłe kopiowanie i wklejanie działa bez zmian — znika wyłącznie lista
    poprzednich wpisów wywoływana skrótem klawiszowym oraz możliwość przypięcia
    często używanego tekstu. Dla większości ludzi jest to funkcja, o której
    istnieniu nie wiedzą.

    Zauważą ją ci, którzy przepisują dane między systemami: pracownicy wsparcia
    przenoszący identyfikatory między zgłoszeniem a konsolą, księgowość
    przepisująca numery rachunków, tłumacze i redaktorzy pracujący na wielu
    fragmentach naraz. Dla nich jest to realna strata tempa, a nie drobiazg.

    Objawem jest skrót klawiszowy, który przestaje cokolwiek otwierać. Ponieważ
    nie pojawia się żaden komunikat, bywa to brane za usterkę klawiatury albo
    programu.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    What needs checking is whether anyone at the stations uses clipboard history in
    everyday work.

    Ordinary copying and pasting works unchanged - all that goes is the list of
    earlier entries called up by a keyboard shortcut and the ability to pin
    frequently used text. For most people it is a function they do not know exists.

    Those who will notice are the ones transcribing data between systems: support
    staff moving identifiers between a ticket and a console, accounting transcribing
    account numbers, translators and editors working on several fragments at once.
    For them it is a real loss of pace, not a trifle.

    The symptom is a keyboard shortcut that stops opening anything. As no message
    appears, it is sometimes taken for a fault in the keyboard or the program.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
    - scripting-and-automation
  what_breaks:
    pl:
      - Lista poprzednio skopiowanych wpisów przestanie się otwierać skrótem klawiszowym
      - Przypięte w schowku teksty używane często przestaną być dostępne
      - Praca polegająca na przenoszeniu wielu fragmentów naraz między systemami zwolni
    en:
      - The list of previously copied entries stops opening from the keyboard shortcut
      - Texts pinned in the clipboard for frequent use stop being available
      - Work that moves several fragments at once between systems slows down
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na stanowisku pracuje się na wielu fragmentach tekstu naraz i historia schowka jest częścią przyjętego sposobu pracy
    en:
      - The station works on several fragments of text at once and clipboard history is part of the accepted way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'AllowClipboardHistory'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowClipboardHistory'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowClipboardHistory' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-policies

notes:
  pl: |
    Wdrożenie punktu nie czyści historii zapisanej wcześniej — wyłącza gromadzenie
    nowej. Na maszynie, która działała z włączoną historią, wpisy sprzed zmiany
    trzeba usunąć osobno i reguła tego nie robi, bo byłoby to kasowanie danych
    użytkownika bez jego wiedzy.

    Punkt tworzy parę z ustawieniem przesyłania schowka między urządzeniami.
    Historia trzyma dane na maszynie, przesyłanie wynosi je poza nią — to dwie
    różne rzeczy i wyłączenie jednej nie wyłącza drugiej.
  en: |
    Applying the item does not clear history kept earlier - it stops new history
    being gathered. On a machine that ran with history on, entries from before the
    change have to be removed separately, and the rule does not do it, because that
    would be deleting a user's data without their knowledge.

    The item pairs with the setting for passing the clipboard between devices.
    History keeps data on the machine, passing carries it off the machine - two
    different things, and switching one off does not switch the other off.
