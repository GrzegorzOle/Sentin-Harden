id: win2025-mdm-enrollment-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > MDM
  title:
    pl: Rejestracja w zarządzaniu urządzeniami wyłączona
    en: Enrolment in device management disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza możliwość zarejestrowania maszyny w usłudze zarządzania
    urządzeniami.

    Kategoria średnia i chcę wyraźnie powiedzieć, co rejestracja oznacza,
    bo brzmi jak czynność administracyjna. Oznacza przyjęcie drugiego
    zarządcy. Zarejestrowana maszyna wykonuje zasady przysyłane z zewnątrz,
    przyjmuje instalacje oprogramowania i polecenia — w tym polecenie
    wyczyszczenia. To jest kanał sterujący, a nie sposób raportowania.

    Najważniejsze jest jednak to, kto może rejestrację przeprowadzić.
    Nie musi to być administrator tej maszyny. Wystarczy konto mające prawo
    dołączyć urządzenie do organizacji po stronie usługi — a to bywa konto
    zwykłego użytkownika. Rejestracja wykonana z takiego konta wprowadza na
    serwer zarządcę, którego lokalny administrator nie wybierał i o którym
    może się nie dowiedzieć.

    Warto nazwać granicę uczciwie: to nie jest droga włamania, tylko droga
    obejścia ustalonego porządku zarządzania. Ryzyko polega na tym, że
    maszyna zaczyna słuchać dwóch stron naraz, a rozbieżność między nimi
    ujawnia się w najgorszym możliwym momencie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    wprowadzenia na serwer kanału sterującego z zewnątrz, wymagający konta
    o uprawnieniach mniejszych niż administrator maszyny.
  en: |
    The item switches off the ability to enrol the machine in a device
    management service.

    The category is medium, and I want to say clearly what enrolment means,
    because it sounds like an administrative act. It means accepting a second
    master. An enrolled machine carries out policies sent from outside,
    accepts software installations and commands - including the command to
    wipe. This is a control channel, not a way of reporting.

    What matters most, though, is who can carry the enrolment out. It need
    not be an administrator of the machine. An account with the right to join
    a device to the organisation on the service's side is enough - and that
    is sometimes an ordinary user's account. An enrolment done from such an
    account brings onto the server a master the local administrator did not
    choose and may never learn of.

    The boundary is worth naming honestly: this is not a way in, but a way
    round the established order of management. The risk is that the machine
    begins listening to two parties at once, and a divergence between them
    shows itself at the worst possible moment.

    What an attacker gains while the item goes unmet: a way of bringing a
    control channel from outside onto the server, needing an account with
    fewer rights than the machine's administrator.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i to jest tu ocena poważna, a nie
    ostrożnościowa. Powód jest prosty: jeżeli organizacja zarządza swoimi
    maszynami właśnie tą drogą, ten punkt jest wprost sprzeczny z przyjętym
    sposobem pracy.

    Zanim go zastosujesz, trzeba odpowiedzieć na jedno pytanie: czym ten
    serwer jest zarządzany dziś i czym ma być zarządzany jutro. Jeżeli
    odpowiedzią jest usługa zarządzania urządzeniami, reguła nie jest
    utwardzeniem, tylko odcięciem serwera od zarządzania — i skutek pojawi
    się nie teraz, lecz przy kolejnym stawianiu maszyny albo po
    przebudowie, gdy rejestracja nie przejdzie, a nikt nie będzie wiedział
    dlaczego.

    Na serwerach zarządzanych zasadami domenowymi ta sprzeczność nie
    występuje i tam reguła jest właściwa: zamyka drogę, której nikt nie
    używa, a która pozwala tę maszynę podporządkować komuś innemu.

    Czego to nie psuje: maszyn już zarejestrowanych — punkt dotyczy nowej
    rejestracji, nie istniejącej. Nie dotyka też zasad domenowych, zdalnego
    zarządzania, agentów monitorujących ani usług aktualizacji.

    Bez przerwy i natychmiast odwracalne, ale decyzję podejmuj punkt po
    punkcie, nie w trybie zbiorczym.
  en: |
    The class is "needs planned rollout", and that is a serious assessment
    here rather than a cautious one. The reason is simple: if the
    organisation manages its machines by exactly this route, the item is
    directly at odds with the accepted way of working.

    Before applying it, one question has to be answered: what manages this
    server today and what is to manage it tomorrow. If the answer is a device
    management service, the rule is not hardening but cutting the server off
    from management - and the effect will appear not now but at the next
    build or after a rebuild, when the enrolment does not go through and
    nobody knows why.

    On servers managed by domain policy the contradiction does not arise, and
    there the rule is right: it closes a road nobody uses which allows this
    machine to be put under somebody else.

    What this does not break: machines already enrolled - the item concerns a
    new enrolment, not an existing one. Nor does it touch domain policy,
    remote management, monitoring agents or update services.

    No outage and undone immediately, but take the decision item by item, not
    in the bulk mode.

implementation_consequences:
  impact_areas:
    - remote-management
    - updates-and-servicing
  what_breaks:
    pl:
      - Maszyny nie da się zarejestrować w usłudze zarządzania urządzeniami, także przy ponownym stawianiu albo po przebudowie
      - Skutek pojawi się nie od razu, tylko wtedy, gdy rejestracja nie przejdzie, a nikt nie będzie wiedział dlaczego
      - Jeżeli organizacja zarządza maszynami tą drogą, reguła nie jest utwardzeniem, tylko odcięciem serwera od zarządzania
      - Maszyny już zarejestrowane, zasady domenowe, zdalne zarządzanie i agenty monitorujące działają bez zmian
    en:
      - The machine cannot be enrolled in a device management service, including at a rebuild or a fresh build
      - The effect appears not at once but when an enrolment does not go through and nobody knows why
      - If the organisation manages machines by this route, the rule is not hardening but cutting the server off from management
      - Machines already enrolled, domain policy, remote management and monitoring agents work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja zarządza tym serwerem przez usługę zarządzania urządzeniami albo przewiduje to po najbliższej przebudowie
    en:
      - The organisation manages this server through a device management service, or plans to after the next rebuild
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\MDM'
      $name = 'DisableRegistration'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\MDM'
    $name = 'DisableRegistration'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Enrolment means accepting a second master: the machine carries out policies
    # sent from outside and accepts commands, including the command to wipe. It
    # can be done by an account with fewer rights than the local administrator.
    # Do not apply where the organisation manages this server by that route.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\MDM'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRegistration' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/

notes:
  pl: |
    Rejestracja brzmi jak czynność administracyjna, a oznacza przyjęcie
    drugiego zarządcy. Zarejestrowana maszyna wykonuje zasady przysyłane
    z zewnątrz, przyjmuje instalacje i polecenia, w tym polecenie
    wyczyszczenia. To kanał sterujący, nie sposób raportowania.

    Najważniejsze jest to, kto może rejestrację przeprowadzić: wystarczy
    konto mające prawo dołączyć urządzenie do organizacji po stronie usługi,
    a to bywa konto zwykłego użytkownika. Lokalny administrator może się
    o tym nie dowiedzieć.

    Granica nazwana uczciwie: to nie droga włamania, tylko obejścia
    ustalonego porządku zarządzania. Zanim zastosujesz, odpowiedz, czym ten
    serwer jest zarządzany dziś i czym ma być jutro.
  en: |
    Enrolment sounds like an administrative act, yet it means accepting a
    second master. An enrolled machine carries out policies sent from
    outside, accepts installations and commands, including the command to
    wipe. It is a control channel, not a way of reporting.

    What matters most is who can carry it out: an account with the right to
    join a device to the organisation on the service's side is enough, and
    that is sometimes an ordinary user's. The local administrator may never
    learn of it.

    The boundary named honestly: this is not a way in but a way round the
    established order of management. Before applying, answer what manages
    this server today and what is to manage it tomorrow.
