id: iis-hsts-header-enabled

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Request Filtering and Other Restriction Modules
  title:
    pl: Serwis każe przeglądarce łączyć się wyłącznie szyfrowanie
    en: The site tells the browser to connect only over encryption

  level: 2
  profile: application

platform:
  system: iis

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Przekierowanie z adresu nieszyfrowanego na szyfrowany działa dopiero po tym,
    jak pierwsze żądanie poszło nieszyfrowane. Ta pierwsza wymiana — sama
    prośba o przekierowanie i odpowiedź na nią — jest jawna i podatna na
    podmianę. Osobny nagłówek każe przeglądarce zapamiętać, że z tym adresem
    rozmawia się wyłącznie szyfrowanie, i od tej pory zamieniać adres jeszcze
    przed wysłaniem czegokolwiek.

    Co to odbiera atakującemu: możliwość utrzymania połączenia w postaci
    nieszyfrowanej. Wpięty w ruch — w otwartej sieci bezprzewodowej, na bramie,
    w sieci hotelowej — potrafi przechwycić to pierwsze jawne żądanie, dalej
    rozmawiać z użytkownikiem bez szyfrowania, a z serwerem szyfrowanie. Dla
    użytkownika wygląda to jak zwykła strona, tyle że bez kłódki, czego prawie
    nikt nie zauważa. Wszystko, co wpisze, łącznie z hasłem, idzie przez
    napastnika.

    Po zmianie przeglądarka, która raz była na tym serwisie, odmawia połączenia
    nieszyfrowanego bez pytania i nie pozwala klikać dalej przez ostrzeżenie
    o certyfikacie. Chroni to także przed podstawionym certyfikatem, bo znika
    przycisk „kontynuuj mimo to".
  en: |
    A redirect from an unencrypted address to an encrypted one takes effect only
    after the first request has gone unencrypted. That first exchange - the request
    for the redirect and the answer to it - is in the clear and open to substitution.
    A separate header tells the browser to remember that this address is spoken to
    over encryption only, and from then on to change the address before sending
    anything at all.

    What it takes away from an attacker - the ability to keep the connection
    unencrypted. Sitting in the traffic - on an open wireless network, at a gateway,
    on a hotel network - they can intercept that first request in the clear, go on
    talking to the user without encryption and to the server with it. To the user it
    looks like an ordinary page, only without the padlock, which almost nobody
    notices. Everything typed, the password included, goes through the attacker.

    After the change a browser that has once been to this site refuses an
    unencrypted connection without asking, and will not let anyone click through a
    certificate warning. That protects against a substituted certificate too,
    because the "continue anyway" button disappears.

disruption_description:
  pl: |
    Osobliwość tej zmiany polega na tym, że skutek zapada w przeglądarkach
    użytkowników, a nie na serwerze — i to oni go potem niosą. Wyłączenie
    nagłówka nie cofa niczego u kogoś, kto go już dostał. Przeglądarka będzie
    wymuszać szyfrowanie przez cały zadeklarowany okres, niezależnie od tego, co
    serwer robi dalej.

    Stąd wynika jedyny naprawdę groźny scenariusz: serwis, który po jakimś
    czasie traci działające szyfrowanie — wygasa certyfikat, zmienia się nazwa,
    usługa wraca na adres nieszyfrowany. Dla użytkowników, którzy nagłówek
    dostali, serwis staje się wtedy niedostępny i nie da się tego obejść
    kliknięciem. Naprawa jest wyłącznie po stronie serwera: przywrócić
    działające szyfrowanie.

    Drugi przypadek to opcja obejmująca poddomeny. Deklaracja dotyczy wtedy
    wszystkiego poniżej tej nazwy, łącznie z serwisami stojącymi na innych
    maszynach, o których nikt tu nie wie — a wśród nich bywają narzędzia
    wewnętrzne bez certyfikatu. Dlatego naprawa tej opcji nie włącza.

    Trzeci to lista wbudowana w przeglądarki. Wpisanie się na nią jest trwałe
    w praktyce, bo usunięcie trwa miesiącami i wymaga wydania nowych wersji
    przeglądarek. Naprawa tej opcji też nie włącza.

    Samo włączenie jest natomiast dla użytkownika niewidoczne, o ile serwis ma
    działające szyfrowanie. Nic nie przestaje działać w chwili zmiany —
    to zobowiązanie na przyszłość, nie zdarzenie.
  en: |
    What is peculiar about this change is that its effect settles in users'
    browsers, not on the server - and they carry it afterwards. Turning the header
    off undoes nothing for somebody who has already received it. The browser will
    force encryption for the whole declared period, whatever the server does next.

    From that follows the one genuinely dangerous scenario - a site that after a
    while loses working encryption, a certificate expiring, a name changing, a
    service moving back to an unencrypted address. For the users who received the
    header the site then becomes unreachable, and no click gets around it. The
    repair lies wholly on the server side - restore working encryption.

    The second case is the option covering subdomains. The declaration then reaches
    everything below that name, including sites standing on other machines that
    nobody here knows about - and among them there are often internal tools with no
    certificate. This is why the fix does not turn that option on.

    The third is the list built into browsers. Getting onto it is permanent in
    practice, because removal takes months and calls for new browser versions to be
    released. The fix does not turn that option on either.

    Turning it on is, on the other hand, invisible to the user so long as the site
    has working encryption. Nothing stops working at the moment of the change - it
    is an undertaking about the future, not an event.

implementation_consequences:
  impact_areas:
    - web-server-services
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Serwis, który później straci działające szyfrowanie, stanie się niedostępny dla użytkowników, którzy nagłówek już dostali
      - Znika możliwość przeklikania ostrzeżenia o certyfikacie, więc wygasły certyfikat odcina dostęp zamiast pokazać ostrzeżenie
      - Narzędzia i skrypty sięgające po adres nieszyfrowany przestają działać, jeśli korzystają z biblioteki respektującej ten nagłówek
      - Opcja obejmująca poddomeny odcina serwisy na innych maszynach pod tą samą nazwą, także te bez certyfikatu
      - Testowanie serwisu przez adres nieszyfrowany przestaje być możliwe z przeglądarki, która raz odwiedziła adres właściwy
    en:
      - A site that later loses working encryption becomes unreachable for users who already received the header
      - The chance to click through a certificate warning disappears, so an expired certificate cuts off access rather than showing a warning
      - Tools and scripts reaching for the unencrypted address stop working, where they use a library that respects this header
      - The option covering subdomains cuts off sites on other machines under the same name, including those with no certificate
      - Testing the site over the unencrypted address stops being possible from a browser that has once visited the proper one
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwisy bez trwale działającego szyfrowania albo z certyfikatem, którego odnowienie nie jest zapewnione
      - Nazwy, pod którymi poniżej stoją serwisy na innych maszynach, dopóki nie sprawdzono, czy wszystkie mają certyfikat
      - Serwisy wewnętrzne, do których sięga się po adres nieszyfrowany z narzędzi automatycznych
    en:
      - Sites without durably working encryption, or with a certificate whose renewal is not assured
      - Names with sites on other machines below them, until it has been checked that all of them have a certificate
      - Internal sites reached over the unencrypted address from automated tools
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          # Our own figure: one year. A short declaration is worth little,
          # because it lapses between one visit and the next, and the whole
          # point is to cover the first request of a session weeks later.
          $wanted = 31536000
          $judged = 0
          $wrong = @()
          foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
            # Only a site that serves encrypted traffic is judged. Declaring
            # encryption only on a site that has none makes it unreachable.
            $secure = @($site.Bindings.Collection | Where-Object { $_.protocol -eq 'https' })
            if ($secure.Count -eq 0) { continue }
            $judged++
            $filter = "system.applicationHost/sites/site[@name='" + $site.Name + "']/hsts"
            $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
              -Filter $filter -Name 'enabled' -ErrorAction SilentlyContinue
            $enabled = $raw
            if ($null -ne $raw -and $null -ne $raw.Value) { $enabled = $raw.Value }
            if ($enabled -ne $true) { $wrong += ($site.Name + ':off'); continue }
            $ageRaw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
              -Filter $filter -Name 'max-age' -ErrorAction SilentlyContinue
            $age = $ageRaw
            if ($null -ne $ageRaw -and $null -ne $ageRaw.Value) { $age = $ageRaw.Value }
            $number = 0
            if (-not [int64]::TryParse([string]$age, [ref]$number)) { $number = 0 }
            if ($number -lt $wanted) { $wrong += ($site.Name + ':max-age=' + $number) }
          }
          # A machine serving nothing over encryption has nothing to declare.
          # That is a different answer from a pass and is named as such.
          if ($judged -eq 0) { 'NO_SECURE_SITES' }
          elseif ($wrong.Count -eq 0) { 'AS_REQUIRED' }
          else { 'MISSING ' + ($wrong -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $stamp = 'sentin-hsts-' + (Get-Date -Format 'yyyyMMddHHmmss')
    Backup-WebConfiguration -Name $stamp | Out-Null
    $entries = @()
    foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
      $filter = "system.applicationHost/sites/site[@name='" + $site.Name + "']/hsts"
      $state = @{}
      foreach ($name in @('enabled', 'max-age', 'includeSubDomains', 'preload', 'redirectHttpToHttps')) {
        $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
          -Filter $filter -Name $name -ErrorAction SilentlyContinue
        $value = $raw
        if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
        $state[$name] = [string]$value
      }
      $entries += [pscustomobject]@{
        name   = $site.Name
        filter = $filter
        state  = $state
      }
    }
    [pscustomobject]@{
      entries = $entries
      backup  = $stamp
    } | ConvertTo-Json -Depth 5 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and took a server configuration backup named $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $wanted = 31536000
    $touched = @()
    foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
      $secure = @($site.Bindings.Collection | Where-Object { $_.protocol -eq 'https' })
      # A site with no encrypted binding is left alone. Declaring encryption on
      # a site that cannot serve it makes it unreachable for anybody who reads
      # the declaration, and nothing on the server undoes that.
      if ($secure.Count -eq 0) { continue }
      $filter = "system.applicationHost/sites/site[@name='" + $site.Name + "']/hsts"
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $filter -Name 'max-age' -Value $wanted
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $filter -Name 'enabled' -Value $true
      $touched += $site.Name
    }
    # Two options stay as they were on purpose. The one covering subdomains
    # reaches machines this server knows nothing about, and the one asking for
    # the browsers' built-in list is not undone by anything done here.
    if ($touched.Count -eq 0) { 'No site serves encrypted traffic, so nothing was declared.' }
    else { 'Declared on: ' + ($touched -join ', ') }

  rollback_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.entries)) {
      foreach ($name in @('max-age', 'includeSubDomains', 'preload', 'redirectHttpToHttps', 'enabled')) {
        $value = [string]$entry.state.$name
        if ([string]::IsNullOrWhiteSpace($value)) { continue }
        if ($name -eq 'max-age') {
          Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter $entry.filter -Name $name -Value ([int64]$value)
        }
        else {
          Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter $entry.filter -Name $name -Value ([bool]::Parse($value))
        }
      }
    }
    # The configuration is back as it was, and that is all this can restore.
    # Browsers that already received the declaration keep forcing encryption
    # until it lapses. To call it off for them, the header has to be served
    # with a lifetime of zero for as long as they take to come back - that is,
    # keep it enabled and set max-age to 0 instead of turning it off.
    'Configuration restored. Browsers that already received the declaration are not affected by this - see the note above.'

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/whats-new-in-iis-10-version-1709/iis-10-version-1709-hsts
  - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security

notes:
  pl: |
    Okres roku jest naszym wyborem, nie wartością z benchmarku. Krótka
    deklaracja niewiele daje, bo wygasa między jedną wizytą a następną, a cała
    rzecz polega na objęciu pierwszego żądania w sesji sprzed tygodni.

    Sprawdzenie i naprawa obejmują wyłącznie serwisy mające powiązanie
    szyfrowane. Zadeklarowanie szyfrowania na serwisie, który go nie obsługuje,
    czyni go niedostępnym dla każdego, kto tę deklarację przeczyta, i nic po
    stronie serwera tego nie cofa. Maszyna bez takich serwisów zgłasza osobny
    stan.

    Naprawa świadomie nie włącza dwóch opcji. Obejmująca poddomeny sięga
    serwisów stojących na innych maszynach pod tą samą nazwą — ten serwer o nich
    nie wie i nie ma jak sprawdzić, czy mają certyfikat. Wpis na listę wbudowaną
    w przeglądarki jest w praktyce trwały, bo usunięcie z niej trwa miesiącami.

    Wycofanie przywraca konfigurację i tylko ją. Przeglądarki, które deklarację
    już dostały, wymuszają szyfrowanie do końca zadeklarowanego okresu. Żeby je
    zwolnić, trzeba nagłówek dalej wysyłać, ale z okresem zerowym — stąd klasa
    odwracalności „trudno".

    Punkt nie zastępuje przekierowania z adresu nieszyfrowanego. Przekierowanie
    obsługuje pierwsze w życiu żądanie, którego nagłówek nie obejmuje; nagłówek
    obsługuje wszystkie następne, których przekierowanie nie chroni.
  en: |
    The period of a year is our choice, not a figure from the benchmark. A short
    declaration gives little, because it lapses between one visit and the next, and
    the whole point is to cover the first request of a session weeks later.

    The check and the fix cover only sites that have an encrypted binding. Declaring
    encryption on a site that does not serve it makes it unreachable for everybody
    who reads that declaration, and nothing on the server side undoes it. A machine
    without such sites reports a state of its own.

    The fix deliberately leaves two options off. The one covering subdomains reaches
    sites standing on other machines under the same name - this server knows nothing
    of them and has no way to check whether they have a certificate. Getting onto
    the browsers' built-in list is permanent in practice, removal from it taking
    months.

    Rolling back restores the configuration and only that. Browsers that already
    received the declaration force encryption to the end of the declared period. To
    release them the header has to go on being sent, but with a period of zero -
    hence the reversibility class of "difficult".

    The item does not replace redirecting from the unencrypted address. The redirect
    handles the first request ever made, which the header does not cover; the header
    handles all the later ones, which the redirect does not protect.
