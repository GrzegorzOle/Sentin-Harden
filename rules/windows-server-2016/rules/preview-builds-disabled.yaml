id: win2016-preview-builds-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Wersje zapoznawcze systemu niedostępne
    en: Preview builds of the system unavailable
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość przyjmowania na tej maszynie wersji
    zapoznawczych systemu.

    Wersja zapoznawcza nie jest wersją wcześniejszą tego samego wydania.
    Jest wydaniem osobnym, które nie przeszło pełnego cyklu sprawdzania,
    a bywa, że zawiera składniki wycofane przed wydaniem właściwym.

    Dla serwera znaczy to trzy rzeczy. Pierwsza: maszyna przestaje
    odpowiadać temu, co opisuje dokumentacja, a każdy opis konfiguracji
    i każdy raport zgodności odnosi się do wydania, którego już nie ma.
    Druga: poprawki dla wydania właściwego nie zawsze mają odpowiednik
    w wersji zapoznawczej, więc znana podatność potrafi zostać dłużej.
    Trzecia: wersja zapoznawcza wysyła o maszynie więcej niż wydanie
    zwykłe, bo po to powstała.

    Punkt zamyka jedną z dwóch dróg do wersji zapoznawczych. Druga leży po
    stronie ustawień aktualizacji i żadna z nich osobno nie zamyka obu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę
    działającą na wydaniu, dla którego poprawki wychodzą inaczej niż dla
    wydania właściwego.
  en: |
    The setting takes away the possibility of preview builds of the system being taken onto this machine.

    A preview build is no earlier version of the same release. It is a release apart which has not passed the full round
    of checking, and at times holds components withdrawn before the proper release.

    For a server that means three things. The first: the machine ceases to answer to what the documentation describes,
    and every account of the configuration and every report of compliance refers to a release that is no longer there.
    The second: fixes for the proper release do not always have their like in a preview build, so a known weakness may
    stay longer. The third: a preview build sends more about the machine than an ordinary release, having come about for
    that.

    The item shuts one of the two roads to preview builds. The other lies on the side of the update settings, and
    neither of them alone shuts both.

    What an attacker gains while the item goes unmet: a machine running on a release for which fixes come out otherwise
    than for the proper one.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest jedna
    i konkretna.

    Czy ta maszyna jest już zapisana do programu wersji zapoznawczych.
    Jeżeli jest, punkt jej stamtąd nie wypisze. Maszyna zostanie na
    wydaniu zapoznawczym, a wyjście z niego wymaga osobnego planu:
    zwykle przeinstalowania albo przejścia na wydanie właściwe przy
    najbliższej aktualizacji funkcjonalnej. Jest to czynność osobna
    i punkt jej nie zastępuje.

    Rzecz druga dotyczy maszyn zapisanych celowo. Zdarza się, że jedna
    maszyna w środowisku pracuje na wersji zapoznawczej po to, żeby
    sprawdzić zgodność aplikacji przed wydaniem właściwym. Jest to
    zastosowanie sensowne i wtedy punkt należy odpuścić z zapisanym
    uzasadnieniem, a nie wykonać odruchowo.

    Na maszynie niezapisanej zmiana nie robi nic poza zamknięciem drogi.

    Czego to nie psuje: aktualizacji zwykłych, ich źródła, zasad
    instalacji, ról serwera, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established is one and definite.

    Whether this machine is already enrolled in the programme of preview builds. If it is, the item will not take it out
    of there. The machine will stay on the preview release, and the leaving of it calls for a plan of its own: as a rule
    a reinstalling or a passing to the proper release at the next feature update. It is a separate act and the item does
    not stand in its place.

    The second matter concerns machines enrolled on purpose. It happens that one machine in a setting runs on a preview
    build so that the fitness of applications may be checked before the proper release. It is a sensible use, and then
    the item ought to be let go with a written justification and not carried out by reflex.

    On a machine not enrolled the change does nothing beyond the shutting of a road.

    What this does not break: ordinary updates, their source, the policies of installation, the server's roles, services,
    or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Maszyna przestaje móc przyjmować wersje zapoznawcze systemu
      - Maszyna już zapisana do programu nie jest przez ten punkt wypisywana i zostaje na wydaniu zapoznawczym
      - Wyjście z wydania zapoznawczego wymaga osobnego planu, zwykle przeinstalowania albo aktualizacji funkcjonalnej
      - Na maszynie służącej do sprawdzania zgodności aplikacji przed wydaniem właściwym punkt bywa błędem
      - Aktualizacje zwykłe, ich źródło, role serwera i usługi systemowe pozostają bez zmian
    en:
      - The machine ceases to be able to take preview builds of the system
      - A machine already enrolled in the programme is not taken out by this item and stays on the preview release
      - The leaving of a preview release calls for a plan of its own, as a rule a reinstalling or a feature update
      - On a machine serving to check the fitness of applications before the proper release the item is at times a mistake
      - Ordinary updates, their source, the server roles and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ta maszyna pracuje na wersji zapoznawczej celowo, żeby sprawdzić zgodność aplikacji przed wydaniem właściwym
      - Maszyna jest już zapisana do programu i nie przygotowano planu wyjścia z wydania zapoznawczego
    en:
      - This machine runs on a preview build on purpose, to check the fitness of applications before the proper release
      - The machine is already enrolled and no plan for leaving the preview release has been made ready
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
      $name = 'AllowBuildPreview'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
    $name = 'AllowBuildPreview'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A machine already enrolled is not taken out of the programme by this and
    # needs a plan of its own.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PreviewBuilds'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBuildPreview' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-insider/business/manage-builds

notes:
  pl: |
    Punkt jest piąty w bloku i jedyny, przy którym wykonanie bez planu
    zostawia maszynę w stanie gorszym niż przed zmianą: droga zamknięta,
    a maszyna nadal na wydaniu zapoznawczym.

    Zdanie warte postawienia wprost: punkt zamyka wejście, a nie wyprowadza
    tych, którzy już weszli. Bez tego zdania zgodny wynik audytu zostanie
    wzięty za dowód, że maszyna pracuje na wydaniu właściwym — a to są dwie
    różne rzeczy.

    Rzecz druga warta pokazania: istnieje druga droga do wersji
    zapoznawczych, po stronie ustawień aktualizacji, i żadna z nich osobno
    nie zamyka obu. Warto, żeby aplikacja pokazywała je jako parę, tak samo
    jak parę o filtrze reputacyjnym.

    Odnotowuję, że odpuszczenie tego punktu bywa decyzją poprawną. Maszyna
    sprawdzająca zgodność aplikacji przed wydaniem właściwym pracuje na
    wersji zapoznawczej z powodu, a nie z niedopatrzenia.
  en: |
    The item is the fifth in the block and the only one at which a carrying out without a plan leaves the machine in a
    worse state than before the change: the road shut, and the machine still on the preview release.

    A sentence worth setting down outright: the item shuts the way in and does not lead out those who are already in.
    Without that sentence a compliant outcome of the audit will be taken for a proof that the machine runs on the proper
    release - and those are two different things.

    The second thing worth showing: there is a second road to preview builds, on the side of the update settings, and
    neither of them alone shuts both. It is well that the application show them as a pair, just as the pair about the
    reputation filter.

    Worth noting that letting this item go is at times a sound decision. A machine checking the fitness of applications
    before the proper release runs on a preview build for a reason and not through an oversight.
