id: win10-audit-detailed-file-share

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja szczegółowego dostępu do udziałów - niepowodzenia
    en: The audit of detailed access to shares - failures
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje odmowy dostępu do poszczególnych plików i katalogów
    osiąganych przez udział sieciowy.

    Różnica wobec poprzedniej reguły jest różnicą poziomu. Tamta zapisuje
    połączenie z udziałem; ta zapisuje, co w tym udziale ktoś próbował
    otworzyć. Jest to jedyny zapis odpowiadający na pytanie, czego napastnik
    szukał, a nie tylko dokąd zdołał się dostać.

    Zakres zawężono do niepowodzeń i jest to tu decyzja konieczna, nie
    ostrożnościowa. Połowa udana zapisuje wpis dla każdego dotkniętego
    pliku — otwarcie katalogu z tysiącem plików daje tysiąc wpisów. Żaden
    dziennik o rozsądnym rozmiarze tego nie pomieści, a zapis, który
    zapełnia dziennik w godzinę, nie jest zapisem.

    Połowa nieudana ma własność odwrotną: jest cicha, bo w normalnej pracy
    ludzie nie sięgają po pliki, do których nie mają prawa. Seria odmów
    w obrębie jednego udziału jest wtedy obrazem przeszukiwania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przeszukanie
    udziału plik po pliku niezostawiające śladu nawet tam, gdzie mu
    odmówiono.
  en: |
    The setting writes down the refusals of access to the several files and folders come at through a network
    share.

    The difference from the rule before is one of level. That writes down the connection to a share; this writes
    down what within that share somebody tried to open. It is the one record answering what an attacker sought,
    and not merely how far they got.

    The reach was narrowed to failures, and that is here a needful decision and not a cautious one. The
    successful half writes an entry for every file touched - the opening of a folder with a thousand files gives
    a thousand entries. No log of a sensible size will hold that, and a record that fills a log within an hour
    is no record.

    The failed half has the opposite property: it is quiet, people in ordinary work not reaching for files they
    have no right to. A run of refusals within one share is then a picture of a searching.

    What an attacker gains while the item goes unmet: the searching of a share file by file, leaving no trace
    even where they were refused.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia uprawnień do plików i nikomu niczego nie
    odbiera. Zapisuje wyłącznie odmowy, które i tak następują.

    Liczba wpisów jest w normalnej pracy niewielka, bo ludzie rzadko
    sięgają po pliki, do których nie mają prawa.

    Odnotowuję źródło szumu, o którym trzeba wiedzieć przed wykonaniem:
    oprogramowanie przeszukujące udziały — narzędzia do kopii zapasowych,
    indeksowania i wyszukiwania — generuje odmowy przy każdym przejściu
    przez katalogi, do których nie ma dostępu. Wpisy te są liczne,
    powtarzalne i wyglądają dokładnie tak jak przeszukiwanie.

    Zapisywany jest wyłącznie wynik nieudany. Maszyna zapisująca oba wyniki
    jest zgodna z tym punktem, ale jej dziennik zapełnia się w godziny,
    a nie w dni.

    Czego to nie psuje: dostępu do plików, uprawnień, udziałów sieciowych,
    logowania, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no rights upon files and takes nothing from anybody. It writes down the refusals that
    follow anyway.

    The number of entries is in ordinary work small, people seldom reaching for files they have no right to.

    I set down a source of noise to be known of before the carrying out: software that searches shares - tools
    of backup, of indexing and of seeking - raises refusals at every passing through folders it cannot reach.
    Those entries are many, they repeat, and they look exactly like a searching.

    Only the failed outcome is written. A machine writing both outcomes is compliant with this item, but its log
    fills within hours and not within days.

    What this does not break: access to files, rights, network shares, logging on, printing, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - file-sharing
  what_breaks:
    pl:
      - Narzędzia do kopii zapasowych, indeksowania i wyszukiwania generują odmowy przy każdym przejściu przez katalogi bez dostępu
      - Wpisy te są liczne, powtarzalne i wyglądają dokładnie tak jak przeszukiwanie udziału
      - Maszyna zapisująca oba wyniki jest zgodna z tym punktem, ale jej dziennik zapełnia się w godziny, a nie w dni
      - Połowa udana daje wpis dla każdego dotkniętego pliku, więc otwarcie katalogu z tysiącem plików daje tysiąc wpisów
      - Dostęp do plików, uprawnienia, udziały sieciowe, logowanie i drukowanie pozostają bez zmian
    en:
      - Tools of backup, of indexing and of seeking raise refusals at every passing through folders they cannot reach
      - Those entries are many, they repeat, and they look exactly like a searching of a share
      - A machine writing both outcomes is compliant with this item, but its log fills within hours and not within days
      - The successful half gives an entry for every file touched, so opening a folder of a thousand files gives a thousand entries
      - Access to files, rights, network shares, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje narzędzie przeszukujące udziały i jego odmowy zaleją zapis, zanim ktokolwiek go przeczyta
    en:
      - A tool that searches shares works upon the machine and its refusals will flood the record before anybody reads it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9244-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[23]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9244-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9244-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the failed outcome is recorded. The successful half writes an entry for
    # every file touched over a share, which no log of an ordinary size will hold.
    auditpol /set /subcategory:"{0CCE9244-69AE-11D9-BED3-505054503030}" /success:disable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9244-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-detailed-file-share

notes:
  pl: |
    Reguła jest drugą w paczce zawężoną do niepowodzeń i jedyną, w której
    zawężenie wynika z arytmetyki, a nie z doboru. Połowa udana jest tu
    technicznie poprawna i praktycznie nie do utrzymania.

    Warto, żeby aplikacja postawiła to wprost, bo użytkownik widzący zakres
    zawężony zwykle podejrzewa ostrożność. Tutaj chodzi o to, że zapis
    pełny wypiera z dziennika wszystko inne, łącznie z regułami tej paczki
    ocenionymi wyżej.

    Odnotowuję parę z poprzednim punktem. Inspekcja dostępu do udziałów
    mówi, dokąd ktoś wszedł; ta mówi, czego tam szukał. Warto, żeby
    aplikacja pokazywała je razem, bo pojedynczo każda z nich odpowiada na
    pół pytania.
  en: |
    The rule is the second in the pack narrowed to failures, and the only one in which the narrowing follows
    from arithmetic and not from choosing. The successful half is here technically proper and practically not to
    be borne.

    It is well that the application put that outright, a user seeing a narrowed reach as a rule suspecting
    caution. Here the matter is that the full record crowds out of the log everything else, the rules of this
    pack weighed higher among them.

    I set down the pairing with the item before. The audit of access to shares says how far somebody got; this
    says what they sought there. It is well that the application show them together, each alone answering half a
    question.
