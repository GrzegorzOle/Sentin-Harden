id: fedora44-cron-daemon-enabled

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 2.4.1.1
  section: Services > Job Schedulers > Configure cron
  title:
    pl: Demon cron jest włączony i działa
    en: Ensure cron daemon is enabled and active
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Demon cron uruchamia zadania okresowe, także te, które dbają
    o bezpieczeństwo, np. rotację dzienników, sprawdzanie integralności
    plików czy czyszczenie plików tymczasowych. Gdy demon nie działa, takie
    zadania po cichu się nie wykonują.

    Punkt wymaga, żeby usługa crond była włączona i działała, jeśli cronie
    jest zainstalowany. Fedora Workstation go instaluje i uruchamia.
  en: |
    The cron daemon runs periodic jobs, including security-related ones,
    such as log rotation, file integrity checks or cleaning up temporary
    files. When the daemon is not running, such jobs silently do not run.

    The item requires the crond service to be enabled and running when
    cronie is installed. Fedora Workstation installs and runs it.

disruption_description:
  pl: |
    Nikt tego nie zauważy, jeśli crond już działał. W przeciwnym razie
    zaczną się wykonywać zadania z /etc/crontab, /etc/cron.d i crontabów
    użytkowników, które dotąd nie działały.
  en: |
    Nobody will notice if crond was already running. Otherwise the jobs in
    /etc/crontab, /etc/cron.d and the users' crontabs that did not run so
    far start running.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
  what_breaks:
    pl:
      - Zadania z /etc/crontab, /etc/cron.d i crontabów użytkowników, które nie działały, zaczynają się wykonywać
    en:
      - Jobs in /etc/crontab, /etc/cron.d and the users' crontabs that did not run start running
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || ! command -v rpm >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then
      echo CHECK_ERROR; exit 0
    fi
    if ! rpm -q --quiet cronie; then echo NOT_INSTALLED; exit 0; fi
    e=$(systemctl is-enabled crond.service 2>/dev/null) || true
    a=$(systemctl is-active crond.service 2>/dev/null) || true
    if [ "$e" = enabled ] && [ "$a" = active ]; then echo ENABLED_ACTIVE
    else echo "NOT_RUNNING:${e:-none}/${a:-unknown}"; fi
  expected: '^(ENABLED_ACTIVE|NOT_INSTALLED)$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=svc-on-1
        if rpm -q --quiet cronie; then echo installed=1; else echo installed=0; fi
        for u in crond.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          echo "$u ${e:--} ${a:--}"
        done
        find /etc/systemd/system /run/systemd/system -type l \( -name crond.service -o -lname '*/crond.service' \) \
          -printf 'link %p %l\n' 2>/dev/null | sort
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /run/systemd/system ] || { echo "systemd is not running" >&2; exit 1; }
      if ! rpm -q --quiet cronie; then echo "cronie is not installed, nothing to change"; exit 0; fi
      for u in ; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        a=$(systemctl is-active "$u" 2>/dev/null) || true
        case "$e" in enabled|enabled-runtime) systemctl disable -q "$u"; echo "Disabled $u" ;; esac
        case "$a" in active|activating|reloading) systemctl stop "$u"; echo "Stopped $u" ;; esac
      done
      e=$(systemctl is-enabled crond.service 2>/dev/null) || true
      case "$e" in
        masked) systemctl unmask -q crond.service ;;
        masked-runtime) systemctl unmask -q --runtime crond.service ;;
      esac
      systemctl enable -q --now crond.service
      e=$(systemctl is-enabled crond.service 2>/dev/null) || true
      a=$(systemctl is-active crond.service 2>/dev/null) || true
      if [ "$e" != enabled ] || [ "$a" != active ]; then
        echo "crond.service is still not running ($e/$a)" >&2; exit 1
      fi
      echo "Enabled and started crond.service"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=svc-on-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      inst=$(sed -n '2s/^installed=//p' "$b")
      case "$inst" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      lines=$(tail -n +3 "$b" | grep -v '^link ') || true
      links=$(grep '^link ' "$b") || true
      if [ "$(printf '%s\n' "$lines" | cut -d' ' -f1 | tr '\n' ' ')" != "crond.service " ]; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      while read -r u e a x; do
        case "$e$a" in *[!a-z-]*|"") echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        if [ -z "$a" ] || [ -n "$x" ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      done <<< "$lines"
      if [ -n "$links" ]; then
        while read -r k p t x; do
          bad=0
          if [ -z "$t" ] || [ -n "$x" ]; then bad=1; fi
          case "$p" in /etc/systemd/system/*|/run/systemd/system/*) ;; *) bad=1 ;; esac
          case "$p$t" in *..*) bad=1 ;; esac
          if [ "${p##*/}" != crond.service ] && [ "${t##*/}" != crond.service ]; then bad=1; fi
          if [ "$bad" = 1 ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
        done <<< "$links"
      fi
      read -r u e a <<< "$(printf '%s\n' "$lines" | head -n 1)"
      # The unit links in /etc and /run are restored as they were, which also
      # brings back the enabled state hidden under a mask.
      if [ "$inst" = 1 ] && rpm -q --quiet cronie; then
        case "$a" in active|activating|reloading) ;; *) systemctl stop crond.service ;; esac
        find /etc/systemd/system /run/systemd/system -type l \( -name crond.service -o -lname '*/crond.service' \) -delete 2>/dev/null || true
        if [ -n "$links" ]; then
          while read -r k p t; do
            mkdir -p "$(dirname "$p")"
            ln -s "$t" "$p"
            if command -v restorecon >/dev/null 2>&1; then restorecon "$p"; fi
          done <<< "$links"
        fi
        systemctl daemon-reload
      fi
      start=""
      while read -r u e a; do
        [ "$u" = crond.service ] && continue
        case "$e" in
          enabled) systemctl enable -q "$u" ;;
          enabled-runtime) systemctl enable -q --runtime "$u" ;;
        esac
        case "$a" in active|activating|reloading) start="$start $u" ;; esac
      done <<< "$lines"
      if [ -n "$start" ]; then systemctl start $start; fi
      echo "Restored the previous state of crond.service"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man8/cron.8.html
  - https://packages.fedoraproject.org/pkgs/cronie/cronie/
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html

notes:
  pl: |
    Gdy cronie nie jest zainstalowany, reguła jest spełniona (NOT_INSTALLED),
    bo CIS pozwala wtedy pominąć ten punkt. Wynik NOT_RUNNING podaje stan
    włączenia i działania usługi crond.

    Naprawa zdejmuje maskowanie usługi, jeśli było, włącza ją i uruchamia.
    Kopia zapisuje stan działania usługi i jej dowiązania
    w /etc/systemd/system i /run/systemd/system, a wycofanie odtwarza te
    dowiązania, więc wraca także stan włączenia ukryty pod maskowaniem.
  en: |
    When cronie is not installed, the rule is met (NOT_INSTALLED), because
    CIS allows skipping the item then. The NOT_RUNNING result gives the
    enabled and running state of the crond service.

    The remediation unmasks the service if it was masked, enables and starts
    it. The backup records the running state of the service and its links in
    /etc/systemd/system and /run/systemd/system, and rollback recreates
    these links, which also brings back the enabled state hidden under a
    mask.
