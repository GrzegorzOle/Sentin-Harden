id: fedora44-crypto-policy-no-ssh-cbc

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.6.5
  section: Initial Setup > Configure system wide crypto policy
  title:
    pl: Systemowa polityka kryptograficzna wyłącza tryb CBC w SSH
    en: Ensure system wide crypto policy disables cbc for ssh
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    W trybie CBC każdy blok szyfrogramu zależy od poprzedniego. W protokole
    SSH ta konstrukcja ma znane słabości: atak z 2008 roku pozwala w pewnych
    warunkach odzyskać fragmenty jawnego tekstu, a atak Terrapin z 2023 roku
    pozwala usunąć wybrane komunikaty z początku sesji, gdy CBC występuje
    razem z kodami MAC w trybie EtM. Nowoczesne tryby, takie jak GCM, CTR
    i ChaCha20-Poly1305, nie mają tych problemów.

    Punkt wymaga, żeby listy szyfrów dla OpenSSH i libssh w zastosowanej
    polityce nie zawierały trybu CBC. Polityka DEFAULT to spełnia; CBC w SSH
    dopuszcza LEGACY.
  en: |
    In CBC mode every ciphertext block depends on the previous one. In the SSH
    protocol this construction has known weaknesses: a 2008 attack allows
    recovering fragments of plaintext under some conditions, and the 2023
    Terrapin attack allows removing chosen messages from the start of a session
    when CBC is used together with MACs in EtM mode. Modern modes such as GCM,
    CTR and ChaCha20-Poly1305 do not have these problems.

    The item requires the cipher lists for OpenSSH and libssh in the applied
    policy not to contain CBC mode. The DEFAULT policy meets this; LEGACY
    allows CBC in SSH.

disruption_description:
  pl: |
    Nikt tego nie zauważy, chyba że stacja łączy się przez SSH ze starym
    urządzeniem sieciowym, które zna tylko szyfry CBC. Naprawa dodaje własną
    podpolitykę NO-SSHCBC; programy przejmują ją po restarcie systemu.
  en: |
    Nobody will notice unless the workstation connects over SSH to an old
    network device that knows only CBC ciphers. The remediation adds its own
    NO-SSHCBC sub-policy; programs pick it up after a system restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - remote-management
  what_breaks:
    pl:
      - SSH nie łączy się ze starymi przełącznikami, routerami i serwerami, które obsługują wyłącznie szyfry w trybie CBC, np. aes128-cbc
    en:
      - SSH does not connect to old switches, routers and servers that support only CBC-mode ciphers, such as aes128-cbc
  interruption: system-restart
  user_visible: false
  reversibility: after-restart

audit:
  shell: bash
  test_command: |
    f=/etc/crypto-policies/state/CURRENT.pol
    if [ ! -r "$f" ]; then echo CHECK_ERROR; exit 0; fi
    awk '
      function chk(l, s,   v, k, t, i) {
        v = l; sub(/^[^=]*=/, "", v); k = split(v, t, /[ \t]+/)
        for (i = 1; i <= k; i++) if (t[i] ~ /-CBC$/ && !((s ":" t[i]) in seen)) { seen[s ":" t[i]] = 1; r = r "," s ":" t[i] } }
      { l = $0; sub(/#.*/, "", l) }
      l ~ /^[ \t]*cipher@(openssh|libssh|ssh)[^ \t=]*[ \t]*=/ {
        n = l; sub(/[ \t]*=.*/, "", n); gsub(/[ \t]/, "", n); sub(/^cipher@/, "", n); scoped = 1; chk(l, n) }
      l ~ /^[ \t]*cipher[ \t]*=/ { gen = l }
      END {
        if (!scoped && gen != "") chk(gen, "all")
        if (r == "") print "NO_SSH_CBC"; else print "SSH_CBC:" substr(r, 2) }' "$f"
  expected: '^NO_SSH_CBC$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/crypto-policies/policies/modules/NO-SSHCBC.pmod
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      p=$(update-crypto-policies --show)
      [ -n "$p" ] || { echo "Cannot read the system crypto policy" >&2; exit 1; }
      {
        echo "policy=$p"
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/crypto-policies/policies/modules/NO-SSHCBC.pmod
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      cur=$(update-crypto-policies --show)
      [ -n "$cur" ] || { echo "Cannot read the system crypto policy" >&2; exit 1; }
      mod=0
      t=$(mktemp "$f.XXXXXX")
      printf '%s\n' '# Sentin-Harden' 'cipher@SSH = -*-CBC' > "$t"
      if cmp -s "$t" "$f"; then rm -f "$t"; else mv "$t" "$f"; mod=1; fi
      chmod 0644 "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      new="${cur%%:*}"
      subs=""
      case "$cur" in *:*) subs=$(printf '%s' "${cur#*:}" | tr ':' ' ') ;; esac
      for s in $subs; do
        case " NO-SSHCBC " in *" $s "*) ;; *) new="$new:$s" ;; esac
      done
      new="$new:NO-SSHCBC"
      if [ "$new" = "$cur" ] && [ "$mod" = 0 ]; then echo "The system crypto policy is already $cur"; exit 0; fi
      update-crypto-policies --set "$new" >/dev/null
      echo "Set the system crypto policy to $new; restart the system so that all programs use it"
    )

  rollback_command: |
    (
      set -e
      f=/etc/crypto-policies/policies/modules/NO-SSHCBC.pmod
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      p=$(sed -n 's/^policy=//p' "$b" | head -n 1)
      [ -n "$p" ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      case "$existed" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ "$existed" = 1 ]; then sed '1,/^---$/d' "$b" > "$f"; fi
      update-crypto-policies --set "$p" >/dev/null
      if [ "$existed" = 0 ]; then rm -f "$f"; fi
      echo "Restored the system crypto policy $p; restart the system so that all programs use it"
    )

privileges: root
runnable: true

sources:
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/using-the-system-wide-cryptographic-policies_security-hardening
  - https://gitlab.com/redhat-crypto/fedora-crypto-policies
  - https://terrapin-attack.com/

notes:
  pl: |
    Sprawdzenie przegląda w /etc/crypto-policies/state/CURRENT.pol wpisy
    cipher z zakresem dla SSH, np. cipher@openssh i cipher@libssh, i podaje
    w wyniku SSH_CBC zakres i znalezione szyfry. Ogólnej listy cipher nie
    bierze pod uwagę, bo zawiera szyfry CBC potrzebne dla TLS; sprawdza ją
    tylko wtedy, gdy polityka nie ma żadnego wpisu dla SSH.

    Naprawa tworzy moduł /etc/crypto-policies/policies/modules/NO-SSHCBC.pmod
    z regułą cipher@SSH = -*-CBC, tą samą, której używa DEFAULT, i dodaje go
    na końcu polityki.

    Naprawa zmienia politykę poleceniem update-crypto-policies --set, które
    generuje na nowo pliki w /etc/crypto-policies/back-ends. Programy czytają
    je przy starcie, więc działające usługi i otwarte programy używają starych
    ustawień do czasu ich ponownego uruchomienia; dlatego po naprawie i po
    wycofaniu trzeba zrestartować system. Kopia zapisuje wynik
    update-crypto-policies --show, a wycofanie ustawia go z powrotem.
  en: |
    The check goes through the cipher entries scoped to SSH in
    /etc/crypto-policies/state/CURRENT.pol, such as cipher@openssh and
    cipher@libssh, and lists the scope and the ciphers found in the SSH_CBC
    result. It ignores the general cipher list because it holds CBC ciphers
    needed for TLS; it checks it only when the policy has no entry for SSH.

    The remediation creates the
    /etc/crypto-policies/policies/modules/NO-SSHCBC.pmod module with the rule
    cipher@SSH = -*-CBC, the same one DEFAULT uses, and adds it at the end of
    the policy.

    The remediation changes the policy with the update-crypto-policies --set
    command, which regenerates the files in /etc/crypto-policies/back-ends.
    Programs read them at start, so running services and open programs use the
    old settings until they are started again; that is why the system has to be
    restarted after the remediation and after rollback. The backup records the
    output of update-crypto-policies --show, and rollback sets it back.
