id: win10-defender-asr-communication-app-child-processes

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania programów przez aplikację pocztową pakietu biurowego
    en: Office communication application blocked from launching programs
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania programowi pocztowemu pakietu biurowego uruchamiania
    innych programów.

    Program pocztowy jest w tym układzie szczególny, bo łączy dwie role.
    Jest odbiornikiem treści przychodzącej z zewnątrz i zarazem
    programem pakietu biurowego, obsługującym formularze, reguły
    i dodatki. Droga prowadząca przez tę drugą rolę omija punkt o samych
    załącznikach.

    Trafia to w załączniki uruchamiane wprost z okna wiadomości, bez
    zapisywania na dysk, oraz w formularze i reguły skrzynki, które
    potrafią wywołać program przy odebraniu wiadomości. Ta ostatnia droga
    nie wymaga od odbiorcy żadnej czynności — wystarczy, że wiadomość
    dojdzie.

    Odnotowuję relację z poprzednim punktem. Tamten pilnuje pliku
    przyniesionego pocztą; ten pilnuje samego programu pocztowego jako
    uruchamiającego. Są to dwa różne miejsca tej samej drogi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    programu przez odebranie wiadomości, w części przypadków bez udziału
    odbiorcy.
  en: |
    The rule forbids the office suite's mail program to start other programs.

    The mail program is in this arrangement a singular one, joining two parts. It is a taker-in of contents coming
    from outside and at the same time a program of the office suite, handling forms, rules and add-ins. The road
    leading through that second part goes round the item about attachments alone.

    This strikes at attachments started straight from the message's window, without a saving to the disk, and at
    the mailbox's forms and rules, which can call a program at the taking in of a message. That last road calls
    for no act of the receiver - it suffices that the message arrive.

    I set down the tie to the item before. That one watches a file brought by post; this watches the mail program
    itself as a starter. They are two different places of the same road.

    What an attacker gains while the item goes unmet: the starting of a program by the taking in of a message, in
    a part of the cases without the receiver's doing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są reguły
    skrzynki i dodatki.

    Reguły skrzynki uruchamiające program to mechanizm stary i wciąż
    używany: powiadomienie przez zewnętrzne narzędzie, automatyczne
    przekazanie przez skrypt, wywołanie systemu zgłoszeń przy wiadomości
    od klienta. Wszystkie przestaną działać.

    Dotyczy to również dodatków, które uruchamiają osobny program zamiast
    pracować w obrębie programu pocztowego. Są to zwykle dodatki starsze,
    dopisane u siebie albo dostarczone przez dostawcę niszowego.

    Skutek bywa cichy, i to jest tu rzecz najważniejsza. Reguła skrzynki,
    która przestała uruchamiać program, nie zgłasza błędu nikomu —
    przestaje po prostu działać. Nikt tego nie zauważy do chwili, w której
    ktoś zapyta, dlaczego zgłoszenia przestały przychodzić.

    Sprawdzić trzeba wprost, czy takie reguły i dodatki są. Odpowiedź
    „chyba nie" nie wystarcza, bo mechanizm ten bywa ustawiony przez
    pojedynczą osobę lata temu.

    Czego to nie psuje: odbierania i wysyłania poczty, otwierania
    załączników zapisanych na dysk, dodatków działających w obrębie
    programu pocztowego, drukowania, logowania.
  en: |
    The class is "needs review", and the object of the review is the mailbox's rules and the add-ins.

    Mailbox rules that start a program are an old mechanism and one still used: a notice through an outside tool,
    an automatic passing on by a script, a calling of the system of reports at a message from a client. All will
    cease to work.

    It touches likewise the add-ins that start a program apart rather than working within the mail program. Those
    are as a rule older add-ins, written at home or delivered by a small supplier.

    The consequence is at times quiet, and that is here the weightiest thing. A mailbox rule that has ceased to
    start a program reports an error to nobody - it simply ceases to work. Nobody will notice until somebody asks
    why the reports stopped coming.

    What has to be reviewed outright is whether such rules and add-ins are. The answer "probably not" does not
    suffice, that mechanism being at times set by a single person years ago.

    What this does not break: the taking in and the sending of post, the opening of attachments saved to the
    disk, add-ins working within the mail program, printing, or logging on.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - macros-and-documents
  what_breaks:
    pl:
      - Reguły skrzynki uruchamiające zewnętrzne narzędzie przestają działać i nie zgłaszają tego nikomu
      - Automatyczne przekazanie przez skrypt i wywołanie systemu zgłoszeń przy wiadomości od klienta zatrzymują się tak samo
      - Starsze dodatki uruchamiające osobny program przestają działać, a dodatki pracujące w obrębie programu pocztowego działają dalej
      - Skutek bywa cichy i nikt go nie zauważy do chwili, w której ktoś zapyta o brakujące zgłoszenia
      - Odbieranie i wysyłanie poczty, otwieranie załączników zapisanych na dysk, drukowanie i logowanie pozostają bez zmian
    en:
      - Mailbox rules starting an outside tool cease to work and report it to nobody
      - An automatic passing on by a script and a calling of the system of reports at a client s message halt the same way
      - Older add-ins starting a program apart cease to work, while add-ins working within the mail program go on
      - The consequence is at times quiet and nobody will notice until somebody asks about the missing reports
      - The taking in and the sending of post, the opening of attachments saved to the disk, printing and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na skrzynkach działają reguły uruchamiające zewnętrzne narzędzia i nikt nie zebrał ich listy
    en:
      - Rules starting outside tools work upon the mailboxes and nobody has gathered their list
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '26190899-1602-49e8-8b27-eb1d0a1ce869'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '26190899-1602-49e8-8b27-eb1d0a1ce869'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '26190899-1602-49e8-8b27-eb1d0a1ce869' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła jest drugą z trzech o drodze pocztowej i warto, żeby aplikacja
    postawiła ją obok pierwszej. Tamta pilnuje pliku, ta — programu, który
    go podaje.

    Argument wart zachowania dotyczy reguł skrzynki. Jest to jedyne
    miejsce w całej paczce, w którym program uruchamia się bez udziału
    człowieka: wiadomość dochodzi i to wystarczy. Punkt zamykający tę
    drogę zamyka jedyne wejście, które nie wymaga od nikogo kliknięcia.

    Odnotowuję cichy charakter skutków, bo przesądza o sposobie wdrożenia.
    Reguła skrzynki, która przestała działać, nie zgłasza tego nigdzie.
    Aplikacja powinna powiedzieć wprost, żeby listę takich reguł zebrać
    przed zmianą, a nie czekać, aż ktoś zauważy brak.
  en: |
    The rule is the second of three about the road by post, and it is well that the application set it beside the
    first. That one watches the file; this - the program that hands it over.

    The argument worth keeping touches the mailbox's rules. It is the one place in the whole pack at which a
    program starts without a person's doing: the message arrives and that suffices. An item closing that road
    closes the one entry that calls for nobody's click.

    I set down the quiet nature of the consequences, it settling the manner of the rollout. A mailbox rule that
    has ceased to work reports it nowhere. The application ought to say outright that the list of such rules be
    gathered before the change, rather than waiting until somebody notices the want.
