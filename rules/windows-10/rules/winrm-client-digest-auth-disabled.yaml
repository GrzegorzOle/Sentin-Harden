id: win10-winrm-client-digest-auth-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Client
  title:
    pl: Uwierzytelnianie skrótem w kliencie zarządzania zdalnego wyłączone
    en: Warranting by a shortened form in the client of ordering from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania tej maszynie posługiwania się uwierzytelnianiem
    skrótem, gdy sama łączy się z inną maszyną w celu wykonania poleceń.

    Sposób ten bywa brany za bezpieczniejszy od podstawowego, bo hasło
    nie idzie przez sieć wprost. Idzie jego skrót policzony z wartości
    podanej przez drugą stronę, i właśnie tam leży kłopot.

    Zagrożenie pierwsze to serwer wybierający wyzwanie. To strona zdalna
    podaje wartość, z której liczony jest skrót, więc może podać taką,
    która ułatwia późniejsze odtworzenie hasła.

    Zagrożenie drugie to brak potwierdzenia tożsamości strony zdalnej.
    Klient liczy skrót i wysyła go temu, kto poprosił, bez sprawdzenia,
    czy poprosił ten, kto powinien.

    Zagrożenie trzecie to siła samej funkcji skrótu. Mechanizm pochodzi
    z czasów, gdy odtworzenie hasła ze skrótu było kosztowne; dziś nie
    jest.

    Odnotowuję, że sposób ten nie jest używany w sieciach opartych na
    katalogu domenowym, bo tam działa mechanizm mocniejszy. Dlatego punkt
    ma klasę bez uciążliwości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: skrót
    hasła policzony z wartości, którą sam wybrał.
  en: |
    The setting forbids this machine to use warranting by a shortened form when it joins itself to another machine
    to work orders.

    That manner is at times held safer than the plain one, the password going not over the network outright. There
    goes a shortened form of it, reckoned from a worth given by the other side, and there lies the trouble.

    The first danger is a server choosing the challenge. It is the far side that gives the worth from which the
    shortened form is reckoned, so it may give one that eases the later winning back of the password.

    The second danger is the want of a warranting of the far side's name. The client reckons the shortened form
    and sends it to whoever asked, with no looking at whether the one who asked be the one who should.

    The third danger is the strength of the shortening itself. The mechanism comes down from a time when the
    winning back of a password from a shortened form was costly; today it is not.

    I set down that the manner is not used in networks resting upon the domain's catalogue, a stronger mechanism
    working there. For that the item bears the class of no disruption.

    What an attacker gains while the item goes unmet: a shortened form of a password reckoned from a worth they
    chose themselves.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Sposób ten nie jest używany w sieciach
    opartych na katalogu domenowym, a w pozostałych przypadkach zastępuje
    go uwierzytelnianie certyfikatem albo mechanizm katalogowy.

    Odnotowuję, że wyłączenie dotyczy wyłącznie strony nawiązującej
    połączenie. Maszyna przestaje wysyłać skrót; nie zmienia to niczego
    w połączeniach przychodzących.

    Zastrzegam jedyne miejsce warte spojrzenia: skrypt łączący się
    z urządzeniem sieciowym albo z usługą, w której ten sposób
    skonfigurowano jako jedyny. Jest to przypadek rzadki, bo w tej
    rodzinie protokołów sposób skrótem bywa wyłączony po obu stronach
    już domyślnie.

    Skutek pojawia się natychmiast, bez restartu, i nie jest widoczny
    dla użytkownika.

    Czego to nie psuje: uwierzytelniania domenowego, uwierzytelniania
    certyfikatem, połączeń przychodzących, pracy programów, sieci,
    logowania.
  en: |
    The class is "no disruption". That manner is not used in networks resting upon the domain's catalogue, and in
    the other cases warranting by a certificate or the catalogue's mechanism stands in its stead.

    I set down that the switching off touches solely the side making the joining. The machine ceases to send the
    shortened form; it changes nothing in joinings coming in.

    I set down the one place worth a look: a script joining itself to gear of the network or to a service in which
    that manner was set up as the only one. It is a seldom case, the manner by shortened form being in this
    kindred of protocols at times switched off upon both sides already by default.

    The consequence shows at once, with no restart, and is not plain to the user.

    What this does not break: warranting by the domain, warranting by a certificate, joinings coming in, the work
    of programs, the network, or logging on.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Znanych regresji brak, bo sposób ten nie jest używany w sieciach opartych na katalogu domenowym
      - Wyłączenie dotyczy wyłącznie strony nawiązującej połączenie i nie rusza połączeń przychodzących
      - Rzadkim wyjątkiem jest skrypt łączący się z usługą, w której ten sposób skonfigurowano jako jedyny
      - Uwierzytelnianie domenowe i uwierzytelnianie certyfikatem działają bez zmian
      - Praca programów, sieć, drukowanie i logowanie pozostają bez zmian
    en:
      - No known backsliding, that manner being unused in networks resting upon the domain s catalogue
      - The switching off touches solely the side making the joining and touches not joinings coming in
      - A seldom exception is a script joining itself to a service in which that manner was set up as the only one
      - Warranting by the domain and warranting by a certificate work unchanged
      - The work of programs, the network, printing and logging on stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Skrypt z tego stanowiska łączy się z usługą, w której uwierzytelnianie skrótem jest jedynym skonfigurowanym
    en:
      - A script from this station joins itself to a service in which warranting by a shortened form is the only one set up
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDigest'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowDigest'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDigest' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Reguła bywa uznawana za zbędną, bo sposób skrótem wygląda na
    bezpieczniejszy od podstawowego. Warto, żeby aplikacja rozbiła to
    jednym zdaniem: to strona zdalna wybiera wartość, z której liczony
    jest skrót.

    Argument wart zachowania dotyczy braku potwierdzenia tożsamości.
    Klient liczy skrót i wysyła go temu, kto poprosił, nie sprawdzając,
    czy poprosił ten, kto powinien.

    Odnotowuję klasę bez uciążliwości i podstawę tej oceny: sposób ten
    nie jest używany tam, gdzie działa katalog domenowy, a w pozostałych
    przypadkach zastępuje go uwierzytelnianie certyfikatem.
  en: |
    The rule is at times held needless, the manner by shortened form looking safer than the plain one. It is well
    that the application break that in one sentence: it is the far side that chooses the worth from which the
    shortened form is reckoned.

    The argument worth keeping touches the want of a warranting of a name. The client reckons the shortened form
    and sends it to whoever asked, with no looking at whether the one who asked be the one who should.

    I set down the class of no disruption and the ground of that grading: the manner is unused where the domain's
    catalogue works, and in the other cases warranting by a certificate stands in its stead.
