id: win2025-rdp-clipboard-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie schowka w sesji pulpitu zdalnego wyłączone
    en: Clipboard redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina wspólny schowek między sesją zdalną a maszyną,
    z której ktoś się połączył. Kopiowanie w jedną i w drugą stronę
    przestaje działać.

    Schowek jest drogą przenoszenia danych, której nie widzi żaden
    mechanizm pilnujący plików. Nie zostaje po nim wpis w dzienniku
    udziału sieciowego, nie przechodzi przez żadną bramę, nie ma na nim
    nazwy pliku do sprawdzenia. Jest to kanał, którym treść wychodzi
    z maszyny niezauważona.

    Na serwerze waży to inaczej niż na stanowisku roboczym i warto tę
    różnicę nazwać dokładnie.

    Na stanowisku człowiek kopiuje swoje własne dane. Na serwerze
    w sesji zdalnej otwarte są konsole, w których widać dane wszystkich:
    zawartość bazy, listę kont, konfigurację, raport z systemu
    dziedzinowego. Ta sama czynność — zaznacz, skopiuj — przenosi tu
    nie notatkę jednej osoby, tylko wycinek zbioru należącego do
    organizacji.

    Kierunek drugi jest równie istotny. Schowek wnosi na serwer treść
    ze stanowiska, nad którym nikt z zespołu nie ma władzy. Wklejenie
    polecenia z maszyny domowej do konsoli administracyjnej serwera
    to wykonanie na serwerze czegoś, co powstało poza nim.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wyniesienia danych z serwera i wniesienia na niego treści, która nie
    zostawia po sobie śladu w żadnym dzienniku.
  en: |
    The setting cuts off the shared clipboard between the remote session and the machine somebody
    connected from. Copying one way and the other stops working.

    The clipboard is a road for the carrying of data which no mechanism watching files sees. No
    entry is left after it in the log of a network share, it goes through no gateway, there is no
    name of a file upon it to check. It is a channel by which contents leave a machine unnoticed.

    On a server that weighs otherwise than at a working station, and the difference is worth naming
    exactly.

    At a station a person copies their own data. On a server there are open in the remote session
    consoles wherein everyone's data is seen: the contents of a database, the list of accounts, the
    settings, a report out of a trade system. The same act - mark, copy - carries here not one
    person's note but a cutting of a body of data belonging to the organisation.

    The second way is as weighty. The clipboard brings onto the server contents from a station over
    which nobody on the team has power. The pasting of an order from a home machine into the
    server's administrative console is the running on the server of something that arose outside
    it.

    What an attacker gains while the item goes unmet: a road for the carrying of data out of the
    server and of contents into it, leaving no trace behind in any log.

disruption_description:
  pl: |
    Zaliczam ten punkt do klasy wymagającej świadomego wdrożenia i robię
    to wyżej niż w paczce stanowiska roboczego, bo na serwerze schowek
    jest narzędziem pracy używanym co kilka minut.

    Przestaje działać wklejanie polecenia do konsoli administracyjnej
    serwera. Jest to czynność, którą administrator wykonuje
    kilkadziesiąt razy dziennie — bierze polecenie z dokumentacji,
    z notatki, z instrukcji producenta i wkleja je do sesji. Po zmianie
    będzie je przepisywał ręcznie.

    Skutek jest tu gorszy niż sama niewygoda i trzeba to powiedzieć
    wprost: polecenie przepisywane ręcznie bywa przepisane z błędem.
    Na serwerze błąd w przepisanym poleceniu kosztuje więcej niż czas.

    Przestaje też działać droga odwrotna: skopiowanie z serwera treści
    błędu, wycinka dziennika albo wyniku polecenia po to, żeby wkleić je
    do zgłoszenia. Po zmianie zostaje zrzut ekranu, z którego nie da się
    nic wyszukać ani skopiować dalej.

    Na serwerze terminali obsługującym ludzi spoza działu informatyki
    skutek jest szerszy i bardziej odczuwalny. Praca polegająca na
    przenoszeniu treści między aplikacją w sesji a narzędziem na własnej
    maszynie przestaje być możliwa w ogóle.

    Dlatego przed wdrożeniem trzeba ustalić dwie rzeczy: czy ludzie mają
    inną drogę wymiany treści — udział plikowy, system zgłoszeń,
    repozytorium dokumentacji — oraz czy administratorzy mają dostęp do
    swoich poleceń z wnętrza sesji, a nie tylko na własnej maszynie.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    nawiązane zachowują przekierowanie do końca — warunek sprawdza się
    przy następnym połączeniu.
  en: |
    I reckon this item to the class taking a knowing rollout, and I do so higher than in the
    working station's pack, the clipboard being on a server a tool of work used every few minutes.

    The pasting of an order into the server's administrative console stops working. It is an act an
    administrator performs dozens of times a day - they take an order out of documentation, out of
    a note, out of a maker's instruction, and paste it into the session. After the change they will
    write it out by hand.

    The effect here is worse than the awkwardness alone and it must be said plainly: an order
    written out by hand is at times written out with a mistake. On a server a mistake in a written
    out order costs more than time.

    The way back stops working too: the copying out of the server of the text of a fault, a cutting
    of a log or the outcome of an order so as to paste them into a report. After the change there
    is left a shot of the screen, out of which nothing can be searched or copied onward.

    On a terminal server serving people from outside the department of computing the effect is
    wider and more felt. Work consisting in the carrying of contents between an application in the
    session and a tool on one's own machine stops being possible at all.

    Therefore two things must be settled before the rollout: whether people have another road for
    the exchange of contents - a file share, a system of reports, a store of documentation - and
    whether administrators have hold of their orders from within the session and not on their own
    machine alone.

    The change comes into force straight away and is undone at once. Sessions already opened keep
    the redirection to their end - the condition is checked at the next connecting.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Wklejanie polecenia z dokumentacji do konsoli administracyjnej serwera przestanie działać
      - Polecenie przepisywane ręcznie bywa przepisane z błędem, a na serwerze błąd kosztuje więcej niż czas
      - Skopiowanie z serwera treści błędu albo wycinka dziennika do zgłoszenia przestanie być możliwe
      - Na serwerze terminali praca polegająca na przenoszeniu treści między sesją a własną maszyną ustaje
      - Sesje już nawiązane zachowują przekierowanie do końca
    en:
      - The pasting of an order out of documentation into the server's administrative console will stop working
      - An order written out by hand is at times written out with a mistake, and on a server a mistake costs more than time
      - The copying out of the server of a fault's text or a cutting of a log into a report stops being possible
      - On a terminal server work carrying contents between the session and one's own machine ceases
      - Sessions already opened keep the redirection to their end
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze terminali pracują ludzie przenoszący treść między aplikacją w sesji a własną maszyną
      - Administratorzy nie mają dostępu do swojej dokumentacji z wnętrza sesji na serwerze
    en:
      - On a terminal server work people carrying contents between an application in the session and their own machine
      - Administrators have no hold of their documentation from within the session on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableClip'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableClip'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableClip' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Schowek jest drogą przenoszenia danych, której nie widzi żaden
    mechanizm pilnujący plików: bez wpisu w dzienniku, bez bramy, bez
    nazwy pliku do sprawdzenia.

    Na serwerze różnica wobec stanowiska roboczego jest w tym, co się
    kopiuje. Na stanowisku człowiek kopiuje swoje dane, na serwerze —
    wycinek zbioru należącego do organizacji.

    Klasę podniosłem do wymagającej świadomego wdrożenia, bo na serwerze
    schowek jest narzędziem pracy używanym co kilka minut, a polecenie
    przepisywane ręcznie bywa przepisane z błędem.
  en: |
    The clipboard is a road for the carrying of data which no mechanism watching files sees: with
    no entry in a log, no gateway, no name of a file to check.

    On a server the difference against a working station lies in what is copied. At a station a
    person copies their own data, on a server - a cutting of a body of data belonging to the
    organisation.

    I raised the class to one taking a knowing rollout, the clipboard being on a server a tool of
    work used every few minutes, and an order written out by hand being at times written out with a
    mistake.
