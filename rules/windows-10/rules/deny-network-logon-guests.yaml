id: win10-deny-network-logon-guests

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa dostępu z sieci dla grupy Goście
    en: Denial of access from the network for the Guests group
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odmawia grupie Goście dostępu do maszyny z sieci.

    Konto gościa jest w systemie od zawsze i domyślnie jest wyłączone,
    ale wyłączenie nie jest tym samym co odmowa. Konto da się włączyć —
    przez zasadę, przez instalator, przez pomyłkę przy porządkowaniu kont
    — a wtedy wraca do stanu, w którym pozwala wejść bez hasła.

    Odmowa dostępu z sieci działa inaczej niż wyłączenie konta.
    Jest zapisana przy prawie, a nie przy koncie, i obowiązuje także
    wtedy, gdy ktoś konto włączy. Jest to zabezpieczenie drugiej linii,
    ustawione na wypadek, gdy pierwsza zawiedzie.

    Odmowa sieciowa jest w tej rodzinie najważniejsza, bo właśnie tą drogą
    sięga się do maszyny bez fizycznej obecności. Dostęp z sieci oznacza
    udziały plikowe, zdalne zarządzanie i rejestr zdalny — wszystko to,
    co można wykonać z drugiego końca sieci.

    Odnotowuję, że odmowa ma pierwszeństwo przed zezwoleniem. Konto
    w grupie Goście nie wejdzie przez sieć, nawet gdy ma to prawo nadane
    z innego tytułu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    udziałów i zdalnego zarządzania kontem, które można włączyć.
  en: |
    The setting denies the Guests group a way into the machine from the network.

    The guest account has been in the system always and by default stands switched off, but a switching off is not
    the same as a denial. The account may be switched on - by a policy, by an installer, by a slip at a tidying of
    accounts - and then it returns to the state in which it lets one in without a password.

    A denial of access from the network works otherwise than a switching off of the account. It is written at the
    right and not at the account, and holds even where somebody switches the account on. It is a guarding of the
    second line, set for the hour the first gives way.

    The denial from the network is the weightiest of this family, that being the very road by which a machine is
    reached without a bodily presence. Access from the network means file shares, management from afar and the
    registry from afar - all that may be done from the other end of a network.

    I set down that a denial goes before a leave. An account in the Guests group will not come in over the
    network, even holding that right on another title.

    What an attacker gains while the item goes unmet: a road to the shares and to management from afar, by an
    account that may be switched on.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Grupa Goście jest pusta na maszynie utrzymywanej normalnie, a konto
    gościa wyłączone. Odmowa dotyczy więc zbioru, w którym nikogo nie ma,
    i nikt nie zauważy różnicy.

    Odnotowuję jedyny przypadek wart sprawdzenia: maszyna, na której
    udostępnianie plików świadomie opiera się na koncie gościa. Bywa tak
    przy drukarkach sieciowych i udziałach otwartych dla wszystkich
    w małych sieciach — i tam ta zmiana zamknie dostęp.

    Sprawdzenie polega na przejrzeniu członków grupy Goście przed zmianą.
    Grupa pusta znaczy, że zmiana jest zapisem stanu.

    Skutek pojawia się natychmiast, bez restartu i bez wylogowania.
    Sesja sieciowa już nawiązana kończy się normalnie.

    Czego to nie psuje: logowania lokalnego, dostępu do udziałów z kont
    zwykłych, pracy z plikami, drukowania, zdalnego zarządzania kontem
    administratora.
  en: |
    The class is "no disruption".

    The Guests group stands empty upon a machine kept in the ordinary way, and the guest account switched off. The
    denial therefore touches a set with nobody in it, and nobody will mark a difference.

    I set down the one case worth reviewing: a machine where the sharing of files rests knowingly upon the guest
    account. It happens so with network printers and with shares open to all in small networks - and there this
    change will shut the way.

    The review comes down to a looking through of the Guests group's members before the change. An empty group
    means the change is a setting down of a state.

    The consequence shows at once, with no restart and no signing out. A session over the network already made
    ends in the ordinary way.

    What this does not break: logging on locally, the way to shares from ordinary accounts, work with files,
    printing, or management from afar by an administrator's account.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Udział plikowy albo drukarka sieciowa udostępniona przez konto gościa przestaną być osiągalne z sieci
      - Bywa tak w małych sieciach, gdzie udziały otwarto dla wszystkich bez zakładania kont
      - Grupa Goście jest zwykle pusta, więc na większości maszyn zmiana jest zapisem stanu
      - Skutek pojawia się natychmiast, a sesja sieciowa już nawiązana kończy się normalnie
      - Logowanie lokalne, dostęp do udziałów z kont zwykłych, praca z plikami i drukowanie pozostają bez zmian
    en:
      - A file share or a network printer given out through the guest account will cease to be reachable from the network
      - It happens so in small networks where shares were opened to all without accounts being made
      - The Guests group stands commonly empty, so upon most machines the change is a setting down of a state
      - The consequence shows at once, and a session over the network already made ends in the ordinary way
      - Logging on locally, the way to shares from ordinary accounts, work with files and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Udostępnianie plików albo drukarki opiera się świadomie na koncie gościa i nie ma dla niego zastępstwa
    en:
      - The sharing of files or of a printer rests knowingly upon the guest account and has nothing to take its place
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'S-1-5-32-546'
  comparison: contains

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyNetworkLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyNetworkLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    foreach ($sid in @('*S-1-5-32-546')) {
      if (-not ($members -contains $sid)) { $members += $sid }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyNetworkLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyNetworkLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-access-to-this-computer-from-the-network

notes:
  pl: |
    Reguła jest pierwszą z pięciu odmów logowania i najważniejszą wśród
    nich. Warto, żeby aplikacja pokazała je jako grupę, bo osobno każda
    wygląda na drobiazg, a razem zamykają wszystkie drogi wejścia.

    Argument wart postawienia wprost dotyczy różnicy między wyłączeniem
    konta a odmową prawa. Wyłączenie jest stanem konta i da się je cofnąć
    jednym kliknięciem, często przypadkiem. Odmowa jest zapisana przy
    prawie i przeżywa włączenie konta — więc broni przed sytuacją,
    w której ktoś włączył konto, nie zastanawiając się nad skutkami.

    Odnotowuję pierwszeństwo odmowy przed zezwoleniem, bo to ono decyduje
    o sile całej grupy. Nadanie prawa innym tytułem niczego tu nie zmienia:
    konto z odmową nie wejdzie i nie ma sposobu, żeby weszło bez usunięcia
    samej odmowy.
  en: |
    The rule is the first of five denials of signing in and the weightiest among them. It is well that the
    application show them as a group, apart each looking a trifle while together they shut every road in.

    The argument worth putting outright touches the difference between the switching off of an account and the
    denial of a right. A switching off is a state of the account and may be undone by one click, often by chance.
    A denial is written at the right and outlives the switching on of an account - so it guards against the case
    where somebody switched an account on without stopping to think what would follow.

    I set down that a denial goes before a leave, that being what settles the whole group's strength. The granting
    of the right on another title changes nothing here: an account under a denial will not come in, and there is
    no way for it to come in short of the denial itself being taken out.
