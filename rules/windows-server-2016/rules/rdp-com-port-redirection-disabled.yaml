id: win2016-rdp-com-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów szeregowych w sesji pulpitu zdalnego wyłączone
    en: Serial port redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie portów szeregowych stanowiska do sesji
    zdalnej. Program uruchomiony na serwerze przestaje widzieć port
    szeregowy maszyny, z której ktoś się połączył.

    Punkt jest jednym z lżejszych w całym zestawie i uczciwiej powiedzieć to
    wprost, niż nadawać mu wagę, której nie ma. Port szeregowy to kanał
    wolny, wymagający fizycznego urządzenia po drugiej stronie i nienadający
    się do przenoszenia objętości. Nie tędy wychodzą dane i nie tędy wchodzi
    obce oprogramowanie.

    Wartość leży gdzie indziej i jest wartością porządkową. Każde
    przekierowanie to dodatkowy kanał otwarty między maszyną kontrolowaną
    a niekontrolowaną oraz dodatkowy fragment kodu sterownika, który tę
    komunikację obsługuje. Kanał, z którego nikt nie korzysta, jest kosztem
    bez korzyści — utrzymuje powierzchnię, której nie trzeba utrzymywać.

    Tak to należy czytać: nie jest to zamknięcie drogi ataku, tylko
    zdjęcie tego, czego nikt nie używa. Dlatego kategoria ryzyka jest niska,
    a nie średnia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    dodatkowy kanał komunikacji z urządzeniem po stronie klienta i kawałek
    kodu obsługującego przekierowanie, utrzymywany bez potrzeby.
  en: |
    The setting cuts off the attaching of the workstation's serial ports to the
    remote session. A program running on the server ceases to see the serial port of
    the machine somebody connected from.

    The item is one of the lighter ones in the whole set, and it is fairer to say so
    outright than to lend it a weight it has not. A serial port is a slow channel,
    calls for a physical device on the other side, and is unfit for carrying volume.
    Data do not leave this way and foreign software does not come in this way.

    The value lies elsewhere and is a value of order. Every redirection is one more
    channel open between a controlled machine and an uncontrolled one, and one more
    fragment of driver code handling that communication. A channel nobody uses is a
    cost without a benefit - it keeps up a surface that need not be kept up.

    That is how it should be read: this is not the shutting of a road of attack but
    the taking away of what nobody uses. Hence the risk category is low rather than
    medium.

    What an attacker gains while the item goes unmet: not much - one more channel of
    communication with a device on the client's side, and a piece of code handling
    the redirection, kept up without need.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na ogromnej większości maszyn zmiana
    przejdzie niezauważona i nikt nie zgłosi żadnej różnicy.

    Sprawdzić trzeba jedno: czy z sesji zdalnej na tej maszynie ktoś obsługuje
    urządzenie podłączone szeregowo po stronie stanowiska. Takie przypadki
    istnieją i są rozpoznawalne po tym, że wiążą się ze sprzętem starszym niż
    sam serwer. Programatory i konsole serwisowe urządzeń sieciowych. Wagi,
    czytniki i sterowniki na produkcji. Zasilacze awaryjne z własnym kanałem
    zarządzania. Narzędzia diagnostyczne dostarczone przez producenta sprzętu
    wraz z przejściówką.

    Jeżeli takie użycie istnieje, jest ono zwykle znane z imienia i nazwiska —
    obsługuje je konkretna osoba, konkretnym narzędziem, w konkretnym celu.
    To odróżnia ten punkt od przekierowania dysków czy schowka, gdzie
    użytkowników są dziesiątki i nikt ich nie wymieni z pamięci.

    Objaw jest jednoznaczny: program w sesji nie znajduje portu i zgłasza brak
    urządzenia. Nie ma cichego pogorszenia.

    Czego to nie psuje: samej sesji zdalnej, urządzeń podłączonych szeregowo
    bezpośrednio do serwera, drukowania, dostępu do zasobów sieciowych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though on the vast majority of machines the change
    will pass unnoticed and nobody will report any difference at all.

    One thing has to be checked: whether anybody working from a remote session on
    this machine drives a device attached over a serial link on the workstation's
    side. Such cases exist and are recognisable by their involving hardware older
    than the server itself. Programmers and service consoles for network devices.
    Scales, readers and controllers on a production floor. Uninterruptible power
    supplies with a management channel of their own. Diagnostic tools supplied by a
    hardware maker along with an adapter.

    Where such a use exists it is as a rule known by name - a particular person
    handles it, with a particular tool, for a particular purpose. That sets this
    item apart from drive or clipboard redirection, where the users number dozens
    and nobody will list them from memory.

    The symptom is unambiguous: the program in the session does not find the port
    and reports a missing device. There is no quiet worsening.

    What this does not break: the remote session itself, devices attached over a
    serial link directly to the server, printing, or access to network resources.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - legacy-applications
  what_breaks:
    pl:
      - Program uruchomiony w sesji zdalnej przestaje znajdować port szeregowy stanowiska i zgłasza brak urządzenia
      - Programatory i konsole serwisowe urządzeń sieciowych obsługiwane przez przejściówkę po stronie klienta przestają być osiągalne z sesji
      - Narzędzia diagnostyczne dostarczone przez producenta sprzętu wraz z przejściówką przestają widzieć urządzenie
      - Urządzenia podłączone szeregowo bezpośrednio do serwera oraz sama sesja zdalna pozostają bez zmian
    en:
      - A program running in the remote session stops finding the workstation's serial port and reports a missing device
      - Programmers and service consoles for network devices driven through an adapter on the client's side cease to be reachable from the session
      - Diagnostic tools supplied by a hardware maker along with an adapter stop seeing the device
      - Devices attached over a serial link directly to the server, and the remote session itself, stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z sesji zdalnej na tej maszynie obsługiwane jest urządzenie podłączone szeregowo po stronie stanowiska, a innej drogi do niego nie ma
      - Maszyna służy do serwisowania sprzętu wymagającego przejściówki szeregowej podłączanej u osoby wykonującej serwis
    en:
      - A device attached over a serial link on the workstation's side is driven from a remote session on this machine and there is no other road to it
      - The machine serves to service hardware calling for a serial adapter attached at the person doing the servicing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableCcm'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableCcm'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableCcm' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Reguła trafia w macierzy w pole „niskie ryzyko, wymaga sprawdzenia",
    czyli tam, gdzie decyzja należy do użytkownika bardziej niż gdziekolwiek
    indziej. Zysk jest porządkowy, koszt zwykle zerowy, więc zmiana ma sens —
    ale na maszynie serwisującej sprzęt szeregowy odpuszczenie tego punktu
    jest decyzją poprawną, nie zaniedbaniem.

    Punkt idzie w parze z przekierowaniem portów równoległych i te dwa warto
    rozpatrywać razem. Mają tę samą wagę, tę samą klasę i ten sam rodzaj
    wyjątku, a użycie jednego zwykle zapowiada użycie drugiego — oba
    występują na maszynach obsługujących sprzęt starszy niż one same.

    W trybie zbiorczym ta reguła się nie znajdzie, bo klasa jest wyższa niż
    „bez uciążliwości". Jest to celowe: koszt bywa zerowy, ale tam gdzie nie
    jest, jest natychmiastowy i dotyka pracy, której nikt inny nie wykona.
  en: |
    In the matrix the rule falls in the square "low risk, needs review", which is
    where the decision belongs to the user more than anywhere else. The gain is one
    of order, the cost as a rule nil, so the change makes sense - but on a machine
    servicing serial hardware letting this item go is a right decision rather than a
    neglect.

    The item goes in a pair with parallel port redirection and the two are worth
    weighing together. They have the same weight, the same class and the same kind
    of exception, and the use of one as a rule foretells the use of the other - both
    turn up on machines driving hardware older than themselves.

    The rule will not be found in the bulk mode, since its class is higher than
    "none". That is deliberate: the cost is at times nil, but where it is not it is
    immediate and touches work nobody else will do.
