id: win2025-scripted-diagnostics-remote-query-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Troubleshooting and Diagnostics > Scripted Diagnostics
  title:
    pl: Pobieranie treści diagnostycznych z sieci wyłączone
    en: Fetching diagnostic content from the network switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania mechanizmowi diagnostyki skryptowej pobierania treści
    z sieci. To druga strona tej samej sprawy co punkt o narzędziu
    diagnostycznym: tamten dotyczy porozumiewania się z dostawcą wsparcia,
    ten — pobierania samych pakietów.

    Kategoria średnia, czyli o stopień niżej niż punkt sąsiedni, i chcę
    powiedzieć dlaczego, bo mechanizm jest ten sam. Różnica leży w tym, co
    każdy z nich otwiera. Tamten dopuszcza rozmowę, w której strona
    zewnętrzna dobiera treść do sytuacji na maszynie. Ten dopuszcza samo
    pobranie — węższe, bardziej przewidywalne, ale nadal kończące się
    wykonaniem na serwerze czegoś, co przyszło z sieci.

    Bo to jest tutaj sedno i nie chcę go rozmywać: pakiet diagnostyczny to
    zestaw czynności, nie opis. Pobranie go oznacza, że coś pobranego
    z sieci zostanie na tym serwerze wykonane, w kontekście, który nie
    należy do zwykłego użytkownika.

    Nie twierdzę, że to droga łatwa do wykorzystania. Twierdzę, że jest to
    kolejny kanał wykonania, którego serwer nie potrzebuje, a każdy taki
    kanał trzeba potem uwzględniać przy każdej analizie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: jeszcze
    jedno miejsce, w którym treść z sieci zamienia się w wykonanie na
    serwerze.
  en: |
    The item forbids the scripted diagnostics mechanism to fetch content
    from the network. This is the other side of the same matter as the item
    on the diagnostic tool: that one concerns communicating with a support
    provider, this one the fetching of the packages themselves.

    The category is medium, a step below the neighbouring item, and I want
    to say why, since the mechanism is the same. The difference lies in what
    each of them opens. That one permits a conversation in which the outside
    party chooses content to match the situation on the machine. This one
    permits the fetching alone - narrower, more predictable, but still
    ending in something that came from the network being carried out on the
    server.

    Because that is the heart of it here and I do not want to blur it: a
    diagnostic package is a set of actions, not a description. Fetching it
    means something fetched from the network will be carried out on this
    server, in a context that does not belong to an ordinary user.

    I am not claiming this is an easy road to use. I claim it is one more
    channel of execution the server does not need, and every such channel
    then has to be taken into account in every analysis.

    What an attacker gains while the item goes unmet: one more place where
    content from the network turns into execution on the server.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tym razem stawiam ją bez wahania, inaczej
    niż przy punkcie sąsiednim. Powód jest rzeczowy.

    Diagnostyka skryptowa na serwerze produkcyjnym praktycznie nie jest
    używana. Nikt nie naprawia serwera bazodanowego kreatorem pobranym
    z sieci — naprawia się dziennikami, poleceniami i wiedzą o roli
    maszyny, a wszystko to zostaje nietknięte. Pakiety wbudowane w system
    działają dalej, zmienia się wyłącznie to, że nie dochodzą nowe.

    Chcę jednak zapisać rzecz, która nie zmienia klasy, ale zmienia to, jak
    ta reguła wygląda w sprawozdaniu. Ten punkt i punkt o narzędziu
    diagnostycznym wpisują się do tej samej gałęzi rejestru, choć pod
    innymi nazwami. Łatwo zastosować jeden, zobaczyć znajomą ścieżkę
    i uznać, że drugi jest już zrobiony. Nie jest — to dwie różne wartości
    i dwa różne zachowania.

    Do zapamiętania przy sprawdzaniu wyniku: wartość oczekiwana to zero.
    Tutaj nazwa wpisu się z nią zgadza, w odróżnieniu od punktu
    sąsiedniego, w którym jest odwrotnie. Warto mieć to na uwadze, żeby
    nie „poprawić" jednego według drugiego.

    Bez restartu, niewidoczne w codziennej pracy, natychmiast odwracalne,
    wolno zastosować hurtem.
  en: |
    The class is "no disruption", and this time I give it without
    hesitation, unlike the neighbouring item. The reason is substantive.

    Scripted diagnostics is effectively unused on a production server.
    Nobody repairs a database server with a wizard fetched from the network
    - it is repaired with logs, commands and knowledge of the machine's
    role, and all of that stays untouched. The packages built into the
    system go on working; all that changes is that new ones do not arrive.

    I do want to record something that does not change the class but does
    change how this rule looks in a report. This item and the item on the
    diagnostic tool write into the same registry branch, though under
    different names. It is easy to apply one, see the familiar path, and
    decide the other is already done. It is not - these are two different
    values and two different behaviours.

    To remember when checking the result: the expected value is zero. Here
    the entry's name agrees with it, unlike the neighbouring item where it
    is the other way round. Worth bearing in mind, so that one is not
    "corrected" to match the other.

    No restart, invisible in daily work, undone immediately, may be applied
    in bulk.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - scripting-and-automation
  what_breaks:
    pl:
      - Pakiety diagnostyczne wbudowane w system działają dalej — zmienia się to, że nie dochodzą nowe z sieci
      - Naprawa serwera dziennikami, poleceniami i wiedzą o roli maszyny zostaje nietknięta
      - Punkt ten i punkt o narzędziu diagnostycznym piszą do tej samej gałęzi rejestru pod innymi nazwami
      - Zastosowanie jednego z nich nie załatwia drugiego, mimo znajomej ścieżki w rejestrze
    en:
      - Diagnostic packages built into the system go on working - what changes is that new ones do not arrive from the network
      - Repairing the server with logs, commands and knowledge of its role stays untouched
      - This item and the item on the diagnostic tool write into the same registry branch under different names
      - Applying one of them does not settle the other, despite the familiar path in the registry
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedura wsparcia w tej organizacji opiera się na pakietach diagnostycznych pobieranych z sieci
    en:
      - The support procedure in this organisation rests on diagnostic packages fetched from the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
      $name = 'EnableQueryRemoteServer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    $name = 'EnableQueryRemoteServer'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The same registry branch as the diagnostic tool item, under a different
    # value name - applying one does not settle the other. A diagnostic package
    # is a set of actions, not a description, so fetching it ends in execution
    # on this server.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableQueryRemoteServer' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-sdiageng

notes:
  pl: |
    Druga strona tej samej sprawy co punkt o narzędziu diagnostycznym:
    tamten dopuszcza rozmowę, w której strona zewnętrzna dobiera treść do
    sytuacji, ten samo pobranie. Węziej i przewidywalniej, ale nadal
    kończy się wykonaniem na serwerze czegoś, co przyszło z sieci.

    Sedno, którego nie chcę rozmywać: pakiet diagnostyczny to zestaw
    czynności, nie opis.

    Pułapka przy sprawdzaniu: oba punkty piszą do tej samej gałęzi
    rejestru pod innymi nazwami. Łatwo zastosować jeden, zobaczyć znajomą
    ścieżkę i uznać, że drugi jest zrobiony. Tu wartość oczekiwana to zero
    i nazwa wpisu się z nią zgadza — przy punkcie sąsiednim jest odwrotnie.
  en: |
    The other side of the same matter as the item on the diagnostic tool:
    that one permits a conversation in which the outside party chooses
    content to match the situation, this one the fetching alone. Narrower
    and more predictable, but still ending in something from the network
    being carried out on the server.

    The heart of it, which I do not want to blur: a diagnostic package is a
    set of actions, not a description.

    A trap when checking: both items write into the same registry branch
    under different names. It is easy to apply one, see the familiar path,
    and decide the other is done. Here the expected value is zero and the
    entry's name agrees with it - at the neighbouring item it is the other
    way round.
