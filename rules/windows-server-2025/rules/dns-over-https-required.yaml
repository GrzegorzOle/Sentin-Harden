id: win2025-dns-over-https-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Szyfrowane rozpoznawanie nazw wymagane
    en: Encrypted name resolution required
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe maszynie zadawać pytania o nazwy wyłącznie kanałem
    szyfrowanym i nie pozwala jej wrócić do kanału jawnego, gdy
    szyfrowany zawiedzie.

    Wartość jest dwojaka. Po pierwsze, pytania przestają być czytelne
    dla kogoś, kto patrzy na ruch po drodze — a lista nazw, o które
    serwer pyta, jest niezłym opisem tego, co ten serwer robi i z czym
    rozmawia. Po drugie, i ważniejsze, odpowiedź przestaje być podmienialna
    w locie, bo kanał szyfrowany potwierdza, z kim maszyna rozmawia.

    Kategorię trzymam średnią i podaję powód. W sieci wewnętrznej,
    między serwerem a kontrolerem domeny, droga zapytania jest krótka
    i przebiega przez sprzęt, który i tak jest w rękach organizacji.
    Napastnik, który potrafi tam patrzeć na ruch i go zmieniać, ma już
    pozycję, przy której podmiana odpowiedzi o nazwę nie jest jego
    największym narzędziem. Punkt zawęża pole manewru i zwiększa koszt
    ataku, ale sam żadnej drogi wejścia nie zamyka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odczytania, o co serwer pyta, i podmiany odpowiedzi
    w ruchu, jeśli potrafi stanąć na drodze zapytania.
  en: |
    The setting bids the machine put its questions after names by an encrypted way alone and lets
    it not come back to the open way where the encrypted one fails.

    The worth is twofold. First, the questions stop being readable to one who looks at the traffic
    along the road - and the list of names a server asks after is a fair setting forth of what that
    server does and what it speaks with. Second, and weightier, the answer stops being swappable in
    flight, the encrypted way confirming whom the machine speaks with.

    I keep the category middling and give the reason. In an inner net, between a server and the
    controller of the domain, the road of a question is short and runs over gear that is in the
    hands of the body anyway. An attacker who can look at that traffic and alter it already holds a
    place whereat the swapping of an answer after a name is not their greatest tool. The item
    narrows the room to move and raises an attack's cost, but shuts of itself no road in.

    What an attacker gains while the item goes unmet: the means of reading what the server asks
    after and of swapping the answer in flight, if they can stand in the question's road.

disruption_description:
  pl: |
    Jest to punkt, przy którym na serwerze w domenie prawidłowym
    wynikiem pracy z aplikacją bywa zapisany wyjątek, a nie naprawa —
    i lepiej powiedzieć to na wstępie niż na końcu.

    Powód jest prosty. Ustawienie wymaga kanału szyfrowanego
    i zabrania powrotu do jawnego. Serwery nazw w domenie, czyli
    kontrolery domeny, w typowej instalacji kanału szyfrowanego nie
    obsługują. Włączenie tego wymogu na serwerze, który odpytuje
    wyłącznie je, nie utwardza rozpoznawania nazw — kończy je.

    Skutek nie jest przy tym drobny. Serwer, który nie rozwiązuje nazw,
    nie znajduje kontrolera domeny, a to znaczy: nie odświeża zasad,
    nie odnawia biletów, nie uwierzytelnia użytkowników. Objawy
    wyglądają na utratę domeny i przy odrobinie pecha nią są.

    Dlatego kolejność jest tu jedyną rzeczą, która ma znaczenie.
    Najpierw serwer nazw obsługujący kanał szyfrowany, wskazany
    w konfiguracji tej maszyny i sprawdzony pojedynczym zapytaniem.
    Dopiero potem wymóg. Odwrotna kolejność odcina maszynę.

    Sprawdzenia wymaga też to, czy zapora po drodze przepuszcza ruch
    szyfrowanego rozpoznawania nazw. Idzie on innym portem niż zwykłe
    zapytania i bywa zablokowany w sieciach, w których wychodzące
    połączenia są zawężone — czyli akurat w tych, gdzie stoją serwery.

    Zmiana cofa się natychmiast, ale wymaga dostępu do maszyny, a maszyna
    bez rozwiązywania nazw bywa trudna do osiągnięcia. Droga zapasowa
    po adresie, nie po nazwie, ma być znana przed zmianą.

    Jeżeli w tej sieci nie ma serwera nazw z kanałem szyfrowanym,
    zapisz wyjątek z uzasadnieniem i datą przeglądu. Punkt wróci do
    rozpatrzenia, gdy taki serwer się pojawi, i to jest wynik
    prawidłowy, a nie odłożony.
  en: |
    It is an item whereat, on a server in a domain, the right outcome of work with the application
    is at times a written exception and not a mending - and it is better said at the outset than at
    the end.

    The ground is simple. The setting takes an encrypted way and forbids the coming back to the
    open one. Servers of names in a domain, that is the controllers of the domain, in a common
    setup serve no encrypted way. The switching on of this requirement upon a server that asks them
    alone does not harden the resolving of names - it ends it.

    The effect is withal no small one. A server that resolves no names does not find the controller
    of the domain, and that means - it freshens no policy, renews no tickets, authenticates no
    users. The symptoms look like the loss of the domain and with a little ill luck are it.

    Therefore the order is here the one thing that matters. First a server of names serving the
    encrypted way, set in this machine's setup and tried with a single question. Only then the
    requirement. The reverse order cuts the machine off.

    What needs checking besides is whether the firewall along the road lets the traffic of
    encrypted name resolution by. It goes by another port than ordinary questions and is at times
    blocked in nets wherein outgoing connections are narrowed - that is, in just those wherein
    servers stand.

    The change is undone at once, but it takes access to the machine, and a machine without the
    resolving of names is at times hard to reach. The road in reserve by address, and not by name,
    is to be known before the change.

    If there is in this net no server of names with an encrypted way, write down an exception with
    its grounds and a date of review. The item will come back for weighing when such a server
    appears, and that is a right outcome and not a put-off one.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Serwer odpytujący wyłącznie kontrolery domeny przestanie rozwiązywać nazwy w ogóle
      - Maszyna bez rozwiązywania nazw nie znajdzie kontrolera, więc przestanie odświeżać zasady i bilety
      - Zapora zawężająca ruch wychodzący może blokować port szyfrowanego rozpoznawania nazw
      - Objawy wyglądają na utratę domeny i przy odrobinie pecha nią są
      - Cofnięcie wymaga dostępu do maszyny, a maszyna bez rozwiązywania nazw bywa trudna do osiągnięcia
    en:
      - A server asking the controllers of the domain alone will stop resolving names at all
      - A machine without the resolving of names will not find the controller, so it will freshen no policy and no tickets
      - A firewall narrowing outgoing traffic may block the port of encrypted name resolution
      - The symptoms look like the loss of the domain and with a little ill luck are it
      - The undoing takes access to the machine, and a machine without the resolving of names is at times hard to reach
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W tej sieci nie ma serwera nazw obsługującego kanał szyfrowany, a maszyna odpytuje kontrolery domeny
      - Zapora po drodze nie przepuszcza ruchu szyfrowanego rozpoznawania nazw
      - Nie ma drogi zapasowej do maszyny po adresie, na wypadek gdy nazwy przestaną się rozwiązywać
    en:
      - There is in this net no server of names serving an encrypted way and the machine asks the controllers of the domain
      - The firewall along the road does not let the traffic of encrypted name resolution by
      - There is no road in reserve to the machine by address, against the names ceasing to resolve
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'DoHPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'DoHPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Set a server of names serving the encrypted way in this machine's setup
    # first. The reverse order leaves the machine with no name resolution at all.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DoHPolicy' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/doh-client-support

notes:
  pl: |
    Na serwerze w domenie jest to punkt, przy którym prawidłowym
    wynikiem bywa zapisany wyjątek, a nie naprawa. Kontrolery domeny
    w typowej instalacji kanału szyfrowanego nie obsługują, a ustawienie
    zabrania powrotu do kanału jawnego — więc wymóg nałożony na maszynę
    odpytującą wyłącznie je nie utwardza rozpoznawania nazw, tylko je
    kończy.

    Kolejność jest jedyną rzeczą, która ma tu znaczenie: najpierw serwer
    nazw z kanałem szyfrowanym wskazany w konfiguracji i sprawdzony
    pojedynczym zapytaniem, dopiero potem wymóg.

    Kategoria średnia jest oceną, nie ostrożnością. W sieci wewnętrznej
    napastnik zdolny patrzeć na ruch i go zmieniać ma już pozycję,
    przy której podmiana odpowiedzi o nazwę nie jest jego największym
    narzędziem.
  en: |
    On a server in a domain it is an item whereat the right outcome is at times a written exception
    and not a mending. The controllers of the domain in a common setup serve no encrypted way, and
    the setting forbids the coming back to the open one - so the requirement laid upon a machine
    that asks them alone does not harden the resolving of names, it ends it.

    The order is the one thing that matters here - first a server of names with an encrypted way
    set in the setup and tried with a single question, and only then the requirement.

    The middling category is a reckoning and not caution. In an inner net an attacker able to look
    at the traffic and alter it already holds a place whereat the swapping of an answer after a
    name is not their greatest tool.
