id: win10-bitlocker-removable-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Odczyt chronionego nośnika wymiennego w starszych wersjach systemu wyłączony
    en: Reading a protected removable medium on earlier system versions disabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza dokładanie do zaszyfrowanego nośnika wymiennego
    obszaru pozwalającego odczytać go w starszych wersjach systemu.

    Przy nośnikach wymiennych ten obszar robi znacznie więcej szkody niż
    przy dyskach stałych, bo dopiero tutaj bywa używany zgodnie
    z przeznaczeniem. Pamięć przenośna właśnie po to jest przenoszona:
    żeby otworzyć ją na innej maszynie, często nieznanej i często nie
    naszej.

    Dołożony obszar sprawia, że nośnik otwiera się wszędzie — także na
    komputerze w punkcie usługowym, na maszynie kontrahenta i na sprzęcie,
    o którym nic nie wiadomo. Użytkownik wpisuje tam hasło albo wsuwa
    klucz, a maszyna zapamiętuje tyle, ile chce zapamiętać.

    Drugi koszt jest cichszy. Obszar ten jest niezaszyfrowany i opisuje
    nośnik wprost: mówi, że jest chroniony i czym. Nośnik, który miał nie
    zdradzać niczego, zaczyna od przedstawienia się.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: jawny opis
    nośnika oraz nawyk otwierania go na maszynach spoza kontroli.
  en: |
    The setting switches off the adding to an enciphered removable medium of a room that lets it be read upon
    earlier versions of the system.

    With removable media that room does far more harm than with fixed drives, it being only here that it is used
    as it was meant. A travelling memory is carried about for just that end: to be opened upon another machine,
    often an unknown one and often not one's own.

    The added room makes the medium open everywhere - upon the computer of a service counter, upon a contractor's
    machine and upon gear nothing is known of. The user types a password there or puts a key in, and the machine
    remembers as much as it cares to remember.

    The second cost is the quieter. That room is unenciphered and describes the medium outright: it says the
    medium is guarded and by what. A medium that was to give nothing away begins by naming itself.

    What an attacker gains while the item goes unmet: an open description of the medium, and the habit of opening
    it upon machines outside anyone's hand.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, gdzie
    te nośniki są otwierane.

    Skutek jest wyraźniejszy niż przy dyskach stałych, bo dotyka
    scenariusza, dla którego nośniki wymienne w ogóle istnieją. Nośnik
    zaszyfrowany po zmianie nie otworzy się na maszynie ze starszym
    systemem ani na maszynie, która nie potrafi obsłużyć ochrony sama.

    W praktyce dotyczy to przekazywania materiałów na zewnątrz, punktów
    druku, komputerów u kontrahentów i stanowisk pozostawionych przy
    starszym systemie z powodu oprogramowania. Wszędzie tam nośnik po
    prostu nie zostanie otwarty.

    Odnotowuję, że nośniki zaszyfrowane wcześniej zachowują dołożony obszar
    i nadal otwierają się wszędzie. Zmiana obowiązuje przy zakładaniu
    ochrony, nie wstecz, więc stan przejściowy potrwa tyle, ile żywotność
    nośników w obiegu.

    Użytkownik zobaczy tę zmianę dopiero wtedy, gdy nośnik nie otworzy się
    tam, gdzie zawsze się otwierał. Warto uprzedzić wcześniej, bo błąd
    w tym miejscu wygląda na uszkodzenie nośnika, a nie na działanie zasady.

    Czego to nie psuje: otwierania nośników na maszynach bieżących, zapisu,
    pracy na dyskach stałych, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is where these media are opened.

    The consequence is plainer than with fixed drives, touching as it does the very case for which removable media
    exist at all. A medium enciphered after the change will not open upon a machine with an older system, nor upon
    a machine that cannot handle the guarding of itself.

    In practice that touches the handing of materials outside, counters of printing, computers at contractors' and
    stations left upon an older system for the sake of software. In all those places the medium will simply not be
    opened.

    I set down that media enciphered earlier keep the added room and still open everywhere. The change holds at
    the laying on of the guarding and not backwards, so the middle state will last as long as the media in
    circulation do.

    The user will see this change only where a medium does not open in a place it always opened. It is worth
    warning of beforehand, a fault in that place looking like a broken medium and not like a policy at work.

    What this does not break: the opening of media upon machines of the day, writing, work upon fixed drives,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nośnik zaszyfrowany po zmianie nie otworzy się na maszynie ze starszym systemem
      - Dotyczy to przekazywania materiałów na zewnątrz, punktów druku i komputerów u kontrahentów
      - Błąd w tym miejscu wygląda na uszkodzenie nośnika, a nie na działanie zasady
      - Nośniki zaszyfrowane wcześniej zachowują dołożony obszar i nadal otwierają się wszędzie
      - Otwieranie nośników na maszynach bieżących, zapis, praca na dyskach stałych i drukowanie pozostają bez zmian
    en:
      - A medium enciphered after the change will not open upon a machine with an older system
      - That touches the handing of materials outside, counters of printing and computers at contractors
      - A fault in that place looks like a broken medium and not like a policy at work
      - Media enciphered earlier keep the added room and still open everywhere
      - The opening of media upon machines of the day, writing, work upon fixed drives and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki są otwierane u kontrahentów i w punktach usługowych, gdzie stoją starsze systemy
    en:
      - The media are opened at contractors and at service counters, where older systems stand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the word
      # <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '<none>'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVDiscoveryVolumeType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text. The word <none> is the setting, not a stand-in
    # for an empty entry, and an empty string here means something else.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest odpowiednikiem punktu o dyskach stałych, ale warto, żeby
    aplikacja pokazała, że jej skutek jest tu znacznie bardziej odczuwalny.
    Przy dysku stałym obszar zgodności leży nieużywany; przy nośniku
    wymiennym jest używany codziennie i o to właśnie chodzi.

    Argument wart zachowania dotyczy tego, czemu ten obszar służy naprawdę.
    Nie służy zgodności ze starszym systemem — służy otwieraniu nośnika
    tam, gdzie nikt nie panuje nad maszyną. Chroniony nośnik otwarty na
    cudzym komputerze jest otwarty dokładnie tak samo, jakby nie był
    chroniony, i w dodatku zostawia po sobie ślad.

    Odnotowuję postać wartości, bo bywa źródłem pomyłki. Jest to tekst,
    a zasada wyłączona zapisuje w nim słowo, nie pustkę. Wpis pusty znaczy
    tu co innego i sprawdzenie porównujące z pustym łańcuchem odpowiadałoby
    błędnie.
  en: |
    The rule is the counterpart of the item about fixed drives, but it is well that the application show its
    consequence to be far more felt here. With a fixed drive the room of compatibility lies unused; with a
    removable medium it is used daily, and that is the whole point.

    The argument worth keeping touches what that room truly serves. It does not serve compatibility with an older
    system - it serves the opening of a medium where nobody has a hand upon the machine. A guarded medium opened
    upon somebody else's computer is opened just as it would be unguarded, and leaves a trace behind it besides.

    I set down the shape of the value, it being at times a ground of error. It is text, and the policy switched
    off writes a word in it and not a blank. An empty entry means here something other, and a check set against an
    empty string would answer wrongly.
