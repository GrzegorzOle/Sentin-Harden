id: win2025-upnp-device-host-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Udostępnianie maszyny jako urządzenia sieciowego wyłączone
    en: Sharing the machine as a network device disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przedstawiającą tę maszynę w sieci lokalnej jako
    urządzenie, które inni mogą znaleźć i o które mogą zapytać.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej i powód
    jest taki, że po oddzieleniu tego punktu od sąsiedniego zostaje tu
    mniej, niż się na pierwszy rzut oka wydaje. Sąsiedni punkt dotyczy
    wykrywania, czyli pytania i słuchania — i to tam leży sprawa
    poważniejsza, bo tam obca strona może serwerowi coś wskazać. Tutaj
    maszyna tylko się ogłasza.

    Nie schodzę jednak do samego porządku, bo jedna rzecz jest konkretna.
    Ogłoszenie nie jest samą nazwą — niesie wskazanie miejsca z opisem,
    który można pobrać, a opis ten mówi, czym maszyna jest i co
    udostępnia. Jest to informacja oddana każdemu w tej samej sieci, bez
    pytania i bez śladu, komu ją wydano. Dla kogoś, kto dopiero rozgląda
    się po segmencie, jest to darmowy pierwszy krok.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: opis tej
    maszyny wydany każdemu w segmencie bez pytania, czyli gotowy punkt
    zaczepienia przy rozpoznaniu.
  en: |
    The item switches off the service that sets that machine forth in the near net as a device others
    may find and may ask after.

    I lower the category to low against the reckoning for a workstation, and the ground is that after
    the sundering of this item from the neighbouring one there is left here less than at first sight
    it seems. The neighbouring item bears on the finding, that is on asking and hearkening - and there
    lies the weightier matter, a strange side being able there to point something out to the server.
    Here the machine only calls itself abroad.

    I go not down to bare order for all that, one thing being set. The calling abroad is not the name
    alone - it bears a pointing to a stead with a setting forth that may be drawn, and that setting
    forth says what the machine is and what it deals out. It is a tiding given to everyone in the same
    net, without an asking and without a trace of whom it was given to. To one who is but looking
    about a reach it is a free first step.

    What an attacker gains while the item goes unmet - a setting forth of that machine given to
    everyone in the reach without an asking, that is a ready hold to take at the spying out.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i jest to jeden z najczystszych
    przypadków w całej paczce. Serwer nie jest urządzeniem, które ktoś
    znajduje przez rozglądanie się po sieci. Klienci przychodzą do niego
    po nazwie albo po adresie, które ktoś im wcześniej wskazał, i tą
    drogą przychodzą również wtedy, gdy ta usługa nie działa.

    Nie umiem wskazać na serwerze scenariusza, w którym ogłaszanie się
    jako urządzenie do znalezienia miałoby znaczenie dla czyjejkolwiek
    pracy. To jest właśnie ten przypadek, dla którego istnieje klasa
    „bez uciążliwości" — i zgodnie z zasadą twardą o trybie zbiorczym
    punkt ten nadaje się do zastosowania hurtem.

    Jedna uwaga porządkowa: usługa ta zależy od usługi wykrywania
    urządzeń z sąsiedniego punktu. Jeżeli tamta została zatrzymana
    wcześniej, ta przestała działać razem z nią i punkt może być już
    spełniony bez żadnej dodatkowej czynności.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease" and it is one of the cleanest cases in the whole pack. A server
    is no device that somebody finds by looking about the net. Those who come to it come by a name or
    by a whereabouts that somebody pointed out to them beforehand, and by that road they come also
    when that service works not.

    I cannot name upon a server a happening wherein a calling of itself abroad as a device to be found
    would weigh upon anybody's work. It is just that case for which the class "no unease" is there -
    and by the hard rule of the bulk mode this item is fit to be laid on in bulk.

    One note of order - that service hangs upon the service of the finding of devices of the
    neighbouring item. If that one was stopped beforehand, this one stopped along with it and the item
    may already be met without any further doing.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Maszyna przestaje być widoczna przy rozglądaniu się po sieci lokalnej
      - Klienci przychodzą do serwera po nazwie albo adresie i przychodzą tak samo bez tej usługi
      - Na serwerze nie ma scenariusza, w którym ogłaszanie się jako urządzenie miałoby znaczenie dla czyjejś pracy
      - Usługa zależy od wykrywania urządzeń, więc punkt bywa już spełniony po zmianie sąsiedniego
    en:
      - The machine stops being seen at a looking about the near net
      - Those who come to the server come by a name or a whereabouts and come the same without that service
      - Upon a server there is no happening wherein a calling of itself abroad as a device would weigh upon anybody's work
      - The service hangs upon the finding of devices, so the item is at times met already after the change of the neighbouring one
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna celowo przedstawia się w sieci jako urządzenie odnajdywane przez rozgłaszanie
    en:
      - The machine sets itself forth in the net on purpose as a device found by a calling abroad
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Clients reach a server by a name or an address someone gave them, and
    # they keep reaching it without this service. If device discovery was
    # already stopped, this one stopped with it.
    Stop-Service -Name 'upnphost' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'upnphost' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'upnphost' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Po oddzieleniu tego punktu od sąsiedniego zostaje tu mniej, niż się
    na pierwszy rzut oka wydaje. Tam maszyna pyta i słucha, więc obca
    strona może jej coś wskazać. Tutaj maszyna tylko się ogłasza.

    Nie schodzę do samego porządku, bo ogłoszenie nie jest samą nazwą —
    niesie wskazanie miejsca z opisem, który można pobrać, a opis mówi,
    czym maszyna jest i co udostępnia. Informacja wydana każdemu
    w segmencie bez pytania i bez śladu, komu ją wydano.

    Jeden z najczystszych przypadków klasy „bez uciążliwości" w całej
    paczce — nie umiem wskazać na serwerze scenariusza, w którym ta
    usługa miałaby znaczenie dla czyjejkolwiek pracy.
  en: |
    After the sundering of this item from the neighbouring one there is left here less than at first
    sight it seems. There the machine asks and hearkens, so a strange side may point something out to
    it. Here the machine only calls itself abroad.

    I go not down to bare order, the calling abroad being not the name alone - it bears a pointing to
    a stead with a setting forth that may be drawn, and that setting forth says what the machine is
    and what it deals out. A tiding given to everyone in the reach without an asking and without a
    trace of whom it was given to.

    One of the cleanest cases of the class "no unease" in the whole pack - I cannot name upon a server
    a happening wherein that service would weigh upon anybody's work.
