id: win2025-password-history-size

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Liczba pamiętanych poprzednich haseł
    en: Number of remembered previous passwords
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Bez pamięci poprzednich haseł wymuszona zmiana jest pozorna: konto
    ustawia to samo hasło, które właśnie wygasło, i wszystko wraca do punktu
    wyjścia. Materiał, który wyciekł, znów jest aktualny, a data zmiany
    w raporcie sugeruje coś, co się nie wydarzyło.

    Na serwerze rzecz dotyczy przede wszystkim kont, które nie należą do
    nikogo: kont usługowych, kont serwisowych i kont używanych przez zadania
    uruchamiane harmonogramem. To właśnie przy nich zmiana hasła bywa
    czynnością formalną — trzeba coś wpisać, więc wpisuje się to, co było,
    albo to, co było, z doklejoną cyfrą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło zdobyte
    kiedykolwiek w przeszłości pozostaje kandydatem na hasło bieżące.
    Ponieważ listy haseł wyciekłych są trwałe, a konta usługowe żyją latami,
    jest to droga tania i cierpliwa.

    Historia haseł nie jest zabezpieczeniem samodzielnym. Ma sens wyłącznie
    razem z wygasaniem haseł, któremu służy — bez niego wygasanie jest
    kosztem bez efektu.
  en: |
    Without a memory of former passwords a forced change is only apparent: the account sets
    the same password that has just expired, and everything returns to where it started.
    The material that leaked is current again, and the date of change in the report
    suggests something that did not happen.

    On a server the matter concerns above all accounts that belong to nobody: service
    accounts, maintenance accounts and accounts used by tasks started from the scheduler.
    It is with those that a password change is sometimes a formality - something has to be
    typed, so what was there is typed, or what was there with a digit stuck on.

    What an attacker gains while the item goes unmet: a password taken at any time in the
    past stays a candidate for the current one. Since lists of leaked passwords are lasting
    and service accounts live for years, it is a cheap and patient road.

    A password history is no safeguard on its own. It makes sense only together with
    password expiry, which it serves - without that, expiry is a cost with no effect.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na serwerze istnieją konta lokalne,
    których hasła zmienia człowiek.

    Na serwerze członkowskim zasada obejmuje wyłącznie konta lokalne. Konta
    domenowe podlegają zasadzie domeny i ta zmiana ich nie dotyczy — jest to
    najczęstsze nieporozumienie przy tym punkcie i warto je rozstrzygnąć
    przed wdrożeniem.

    Na kontrolerze domeny rzecz ma się odwrotnie: zasada lokalna jest
    zasadą domeny, więc zmiana obejmuje wszystkie konta w domenie naraz.
    Na tej roli punkt nie jest drobiazgiem i wymaga takiego samego
    przygotowania jak każda zmiana obejmująca wszystkich użytkowników.

    Skutek pojawia się przy najbliższej zmianie hasła: poprzednie hasła
    przestają być przyjmowane. Hasła bieżące nie są unieważniane, więc
    w dniu wdrożenia nic nie przestaje działać.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether local accounts whose passwords a person changes exist on
    the server.

    On a member server the policy takes in local accounts alone. Domain accounts are
    subject to the domain's policy and this change does not concern them - that is the
    commonest misunderstanding with this item and is worth settling before the rollout.

    On a domain controller it is the other way round: the local policy is the domain's
    policy, so the change takes in every account in the domain at once. On that role the
    item is no trifle and takes the same preparation as any change reaching every user.

    The effect appears at the next password change: former passwords stop being taken.
    Current passwords are not voided, so on the day of the rollout nothing stops working.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Przy zmianie hasła poprzednie hasła przestają być przyjmowane
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
      - Konta usługowe z hasłem zapisanym w kilku miejscach wymagają zmiany wszędzie naraz
      - Hasła bieżące nie są tą zmianą unieważniane
    en:
      - At a password change former passwords stop being taken
      - On a domain controller the change takes in every account in the domain at once
      - Service accounts with a password recorded in several places take changing everywhere at once
      - Current passwords are not voided by this change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - The server is a domain controller and a change of the domain's policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordHistorySize\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '24'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^PasswordHistorySize\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'PasswordHistorySize'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordHistorySize = 24',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordHistorySize = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enforce-password-history

notes:
  pl: |
    Zakres zasady zależy od roli serwera i jest to rzecz do sprawdzenia
    przed wdrożeniem, a nie po. Na serwerze członkowskim obejmuje konta
    lokalne; na kontrolerze domeny — wszystkie konta w domenie.

    Reguła nie deklaruje roli w polu platform, bo punkt dotyczy obu, ale
    waga skutku jest na nich zupełnie inna. Ta sama wartość liczbowa
    oznacza na jednej roli drobiazg, a na drugiej zmianę dotykającą całej
    organizacji.

    Kategoria ryzyka jest niska, bo sam punkt niczego nie zamyka. Podnosi
    natomiast skuteczność wygasania haseł, z którym tworzy parę.
  en: |
    The policy's reach depends on the server's role and that is a thing to check before the
    rollout rather than after. On a member server it takes in local accounts; on a domain
    controller every account in the domain.

    The rule declares no role in the platform field, since the item concerns both, but the
    weight of the effect on them is wholly different. The same number means a trifle on one
    role and a change touching the whole organisation on the other.

    The risk category is low, because the item closes nothing on its own. What it does is
    make password expiry effective, with which it forms a pair.
