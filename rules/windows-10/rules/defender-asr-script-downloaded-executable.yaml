id: win10-defender-asr-script-downloaded-executable

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania pobranych plików wykonywalnych przez skrypty
    en: Scripts blocked from launching downloaded executable content
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania skryptom uruchamiania plików wykonywalnych pobranych
    z sieci.

    Opisuje to drugi krok drogi, której pierwszym krokiem jest
    uruchomienie skryptu. Skrypt sam w sobie bywa niewielki i niewiele
    robi — jego rolą jest pobrać właściwe narzędzie i je uruchomić. Jest
    to podział, który napastnikowi się opłaca, bo część pobierana może się
    zmieniać, a skrypt pozostaje ten sam.

    Zamknięcie tego powiązania sprawia, że skrypt zostaje sam ze sobą.
    Może pobrać plik, ale nie uruchomi go — a wszystko, co potrafiłby
    zrobić samodzielnie, jest o rząd wielkości mniej groźne.

    Odnotowuję, że reguła patrzy na pochodzenie pliku, a nie na jego
    zawartość. Plik pobrany z sieci jest oznaczony przez system i to
    oznaczenie rozstrzyga. Plik przyniesiony z udziału wewnętrznego nie
    ma tego oznaczenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dowolne
    narzędzie pobrane i uruchomione przez skrypt liczący kilka wierszy.
  en: |
    The rule forbids scripts to start executable files downloaded from the network.

    It sets out the second step of a road whose first step is the starting of a script. The script of itself is at
    times small and does little - its part is to fetch the tool proper and start it. It is a parting that pays the
    attacker, the fetched part being able to change while the script stays the same.

    The closing of that joining leaves the script alone with itself. It may fetch a file but will not start it -
    and everything it could do of itself is an order of magnitude the less dangerous.

    I set down that the rule looks at a file's coming and not at its contents. A file downloaded from the network
    is marked by the system, and that mark settles the matter. A file brought from an inner share does not bear
    it.

    What an attacker gains while the item goes unmet: any tool at all, fetched and started by a script of a few
    lines.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są własne
    skrypty wdrożeniowe.

    Wzorzec „pobierz i uruchom" jest w administracji powszechny. Skrypt
    instalacyjny pobierający instalator, skrypt aktualizacyjny pobierający
    paczkę, skrypt startowy pobierający narzędzie diagnostyczne —
    wszystkie działają dokładnie tak jak droga, którą reguła zamyka.

    Skutek jest widoczny po stronie administratora, a nie użytkownika:
    skrypt kończy pracę błędem uruchomienia. Nie ma komunikatu na
    pulpicie, więc zgłoszenie przychodzi dopiero wtedy, gdy ktoś sprawdzi,
    czy wdrożenie się powiodło.

    Odpowiedź jest dwojaka. Pliki pobierane z zaufanych źródeł można
    odkładać na udział wewnętrzny i uruchamiać stamtąd — wtedy nie mają
    oznaczenia pochodzenia i reguła ich nie dotyczy. Alternatywą jest
    wyjątek po ścieżce.

    Odnotowuję, że oznaczenie pochodzenia da się zdjąć z pliku poleceniem.
    Jest to droga działająca, ale każde jej użycie w skrypcie wdrożeniowym
    warto zapisać, bo jest to świadome ominięcie tej reguły.

    Czego to nie psuje: uruchamiania skryptów, pobierania plików,
    uruchamiania programów zainstalowanych, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is one's own rollout scripts.

    The pattern "fetch and start" is in administration a common one. An installing script fetching an installer,
    an updating script fetching a pack, a starting script fetching a tool of diagnosis - all work exactly as the
    road the rule closes does.

    The consequence shows upon the administrator's side and not the user's: the script ends its work with an error
    of starting. There is no message upon the desktop, so the report comes only once somebody sees whether the
    rollout came through.

    The answer is twofold. Files fetched from trusted sources may be laid upon an inner share and started from
    there - they then bear no mark of coming and the rule does not touch them. The other way is an exception by a
    path.

    I set down that the mark of coming may be taken off a file by a command. It is a road that works, but every
    use of it in a rollout script is worth writing down, it being a knowing going round of this rule.

    What this does not break: the starting of scripts, the downloading of files, the starting of installed
    programs, logging on, or printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
  what_breaks:
    pl:
      - Skrypt instalacyjny pobierający instalator kończy pracę błędem uruchomienia
      - Skrypt aktualizacyjny pobierający paczkę i skrypt startowy pobierający narzędzie diagnostyczne zatrzymują się tak samo
      - Nie ma komunikatu na pulpicie, więc zgłoszenie przychodzi dopiero po sprawdzeniu, czy wdrożenie się powiodło
      - Plik odłożony na udział wewnętrzny nie ma oznaczenia pochodzenia i reguła go nie dotyczy
      - Uruchamianie skryptów, pobieranie plików, uruchamianie programów zainstalowanych i logowanie pozostają bez zmian
    en:
      - An installing script fetching an installer ends its work with an error of starting
      - An updating script fetching a pack and a starting script fetching a tool of diagnosis halt the same way
      - There is no message upon the desktop, so the report comes only after somebody sees whether the rollout came through
      - A file laid upon an inner share bears no mark of coming and the rule does not touch it
      - The starting of scripts, the downloading of files, the starting of installed programs and logging on stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrożenia opierają się na skryptach pobierających instalatory wprost z sieci i nie ma udziału wewnętrznego
    en:
      - The rollouts rest upon scripts fetching installers straight from the network and there is no inner share
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'd3e037e1-3eb8-44c8-a917-57927947596d'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'd3e037e1-3eb8-44c8-a917-57927947596d'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'd3e037e1-3eb8-44c8-a917-57927947596d' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła jest pierwszą z pary o skryptach i warto pokazywać je razem.
    Ta zamyka drugi krok drogi, następna — sposób, w jaki skrypt bywa
    napisany.

    Argument wart zachowania dotyczy podziału pracy po stronie
    napastnika. Skrypt jest częścią stałą, a pobierane narzędzie —
    zmienną. Zamknięcie powiązania między nimi trafia w konstrukcję, a nie
    w konkretną odmianę, więc nie traci ważności przy następnej.

    Odnotowuję, że oznaczenie pochodzenia pliku da się zdjąć poleceniem
    i że jest to droga działająca. Aplikacja nie powinna tego przemilczać,
    bo administrator i tak ją znajdzie — a lepiej, żeby wiedział, że
    używa jej świadomie, niż żeby uznał regułę za omijalną przypadkiem.
  en: |
    The rule is the first of a pair about scripts and it is well to show them together. This closes the road's
    second step; the next - the manner in which a script is at times written.

    The argument worth keeping touches the parting of work upon the attacker's side. The script is the fixed part
    and the fetched tool the changing one. The closing of the joining between them strikes at the build and not at
    a certain strain, so it does not lose its force at the next one.

    I set down that a file's mark of coming may be taken off by a command, and that it is a road that works. The
    application ought not to pass it over in silence, the administrator finding it anyway - and it is better they
    know they use it knowingly than that they hold the rule to be gone round by chance.
