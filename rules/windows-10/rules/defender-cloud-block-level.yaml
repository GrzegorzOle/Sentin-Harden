id: win10-defender-cloud-block-level

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MpEngine
  title:
    pl: Podwyższony poziom blokowania przez usługę w chmurze
    en: Raised cloud blocking level
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie podnosi próg, przy którym usługa producenta odpowiada
    „zablokuj" zamiast „nie wiem".

    Odpowiedź usługi nie jest rozstrzygnięciem zero-jedynkowym. Plik
    nieznany dostaje ocenę, a poziom blokowania rozstrzyga, od której
    oceny ochrona ma go zatrzymać. Domyślnie próg jest ustawiony
    zachowawczo: blokowane jest to, co usługa rozpoznaje jako złośliwe
    z dużą pewnością.

    Podniesienie progu zamyka obszar pośredni — pliki wyglądające
    podejrzanie, ale nierozpoznane jednoznacznie. Jest to dokładnie ten
    obszar, w którym mieści się oprogramowanie przygotowane pod jeden cel
    i widziane po raz pierwszy.

    Odnotowuję, że wartość zgodna nie jest jedna. Poziomy wyższe blokują
    więcej niż ten wymagany, więc maszyna ustawiona ostrzej nie jest
    maszyną niezgodną i sprawdzenie ją przepuszcza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obszar
    pośredni, w którym plik wygląda podejrzanie, a mimo to zostaje
    uruchomiony.
  en: |
    The setting raises the threshold at which the maker's service answers "block" instead of "I do not know".

    The service's answer is no naught-or-one settling. An unknown file is weighed, and the level of blocking
    settles from which weighing on the protection is to stop it. By default the threshold is set cautiously:
    blocked is what the service knows as malicious with great surety.

    The raising of the threshold closes the middle ground - files looking suspect but not known for certain. It
    is just the ground in which software made ready for one end and seen for the first time lies.

    I set down that the compliant value is not one alone. The higher levels block more than the one called for,
    so a machine set the stricter is no machine out of compliance and the check lets it through.

    What an attacker gains while the item goes unmet: the middle ground in which a file looks suspect and is
    started all the same.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczą odczuwalną jest zablokowany plik,
    który był w porządku.

    Podniesienie progu zwiększa liczbę fałszywych trafień z definicji —
    na tym polega. Blokowane zaczyna być to, czego usługa nie rozpoznała
    jednoznacznie, a w tym zbiorze są również programy prawidłowe,
    zwłaszcza nowe, niepodpisane i rozpowszechnione w małej liczbie
    kopii.

    Trafia to przede wszystkim w oprogramowanie narzędziowe własnej
    roboty i w programy budowane na miejscu. Każda nowa wersja jest
    plikiem widzianym po raz pierwszy, więc trafia w obszar pośredni
    za każdym razem.

    Sprawdzić trzeba, czy jest kto obsłuży zgłoszenia. Poziom
    podwyższony bez obsługi zamienia się w listę wyjątków rosnącą
    z tygodnia na tydzień — a ta znosi zysk z samego podniesienia progu.

    Odnotowuję, że poziomy wyższe niż wymagany są dopuszczalne i reguła
    ich nie podważa. Wybór między nimi należy do tego, kto obsługuje
    zgłoszenia, bo to on ponosi koszt.

    Czego to nie psuje: pracy ochrony bez łączności, skanowania
    lokalnego, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the thing that is felt is a blocked file that was sound.

    The raising of the threshold grows the number of false hits by definition - that is what it rests upon.
    Blocked begins to be what the service did not know for certain, and in that set are proper programs as well,
    above all new ones, unsigned and spread in few copies.

    That strikes above all at tool software of one's own making and at programs built in place. Every new build is
    a file seen for the first time, so it falls into the middle ground every time.

    What has to be reviewed is whether there is anybody to handle the reports. A raised level without support
    turns into a list of exceptions growing from week to week - and that undoes the gain of the raising itself.

    I set down that levels higher than the one called for are allowed and the rule does not gainsay them. The
    choice among them belongs to whoever handles the reports, they bearing the cost.

    What this does not break: the protection's working without a link, the local scan, logging on, file shares,
    or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Programy nowe, niepodpisane i rozpowszechnione w małej liczbie kopii zaczynają być blokowane
      - Każda nowa wersja programu budowanego na miejscu trafia w obszar pośredni, bo jest widziana po raz pierwszy
      - Poziom podwyższony bez obsługi zgłoszeń daje listę wyjątków rosnącą z tygodnia na tydzień
      - Poziomy wyższe niż wymagany są dopuszczalne i sprawdzenie ich nie podważa
      - Praca ochrony bez łączności, skanowanie lokalne, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - New programs, unsigned and spread in few copies, begin to be blocked
      - Every new build of a program made in place falls into the middle ground, being seen for the first time
      - A raised level without the handling of reports gives a list of exceptions growing from week to week
      - Levels higher than the one called for are allowed and the check does not gainsay them
      - The protection s working without a link, the local scan, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna służy do budowania oprogramowania i każda nowa wersja byłaby blokowana jako plik nieznany
      - Nie ma kto obsłużyć zgłoszeń, a lista wyjątków rosłaby bez przeglądu
    en:
      - The machine serves for the building of software and every new build would be blocked as an unknown file
      - There is nobody to handle the reports and the list of exceptions would grow unreviewed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        [string][int](Get-MpPreference -ErrorAction Stop).CloudBlockLevel
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(2|4|6)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    $name = 'MpCloudBlockLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two is the first level above the default. The higher ones block more and give
    # more false hits, so the choice of them belongs to whoever handles the reports.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MpCloudBlockLevel' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/specify-cloud-protection-level-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest pierwszą z pary strojącej zachowanie usługi w chmurze.
    Druga dotyczy czasu oczekiwania; ta — progu, od którego odpowiedź
    brzmi „zablokuj".

    Argument wart zachowania dotyczy tego, co leży w obszarze pośrednim.
    Nie są to pliki losowe. Są to pliki nowe, niepodpisane i widziane
    w małej liczbie kopii — czyli zbiór, w którym mieści się zarówno
    narzędzie napastnika przygotowane pod jeden cel, jak i program
    zbudowany wczoraj przez zespół. Ta sama cecha opisuje oba.

    Odnotowuję, że wartości wyższe od wymaganej są przyjmowane, bo
    maszyna ustawiona ostrzej nie może raportować niezgodności. Wybór
    między nimi jest wyborem o koszcie obsługi i należy do człowieka,
    a nie do reguły.
  en: |
    The rule is the first of a pair tuning the cloud service's behaviour. The second touches the time of waiting;
    this - the threshold from which the answer reads "block".

    The argument worth keeping touches what lies in the middle ground. Those are no chance files. They are files
    new, unsigned and seen in few copies - which is to say a set in which both an attacker's tool made ready for
    one end and a program built yesterday by the team lie. The same mark describes both.

    I set down that values higher than the one called for are taken in, a machine set the stricter not being able
    to report a shortfall. The choice among them is a choice about the cost of support and belongs to a person,
    not to a rule.
