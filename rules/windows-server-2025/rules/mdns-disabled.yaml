id: win2025-mdns-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozwiązywanie nazw przez rozgłoszenie grupowe wyłączone
    en: Name resolution by group calling-out switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Mechanizm rozwiązywania nazw przez rozgłoszenie grupowe pozwala
    maszynom w jednej sieci lokalnej znajdować się nawzajem bez żadnego
    serwera. Maszyna pyta całą sieć, kto nazywa się tak a tak, a odpowiada
    ten, kto uzna, że chodzi o niego.

    Słabość leży w ostatnim zdaniu. Nie ma uwierzytelnienia i nie ma
    rozjemcy — odpowiada ten, kto odpowie, a pierwsza odpowiedź jest
    przyjmowana jako prawdziwa.

    Trzymam tu kategorię wysoką i nie podnoszę jej do krytycznej, choć
    sąsiednia reguła o LLMNR została podniesiona. Chcę to uzasadnić,
    bo różnica nie jest oczywista i łatwo byłoby zrównać oba punkty.

    Mechanizm ten jest w świecie Windows używany rzadziej. Drogą
    domyślną dla nieudanego zapytania jest LLMNR i starszy mechanizm
    sieciowy; rozgłoszenie grupowe obsługuje głównie odnajdywanie
    urządzeń — drukarek, sprzętu sieciowego, usług ogłaszających się
    samodzielnie. Zbiór zapytań, które napastnik może tu przechwycić,
    jest przez to mniejszy, a wraz z nim mniejszy jest plon.

    Nie znaczy to, że punkt jest ozdobny. Mechanizm słucha na serwerze
    tak samo jak na stanowisku i odpowiada tak samo bez dowodu. Znaczy
    tylko tyle, że w tej trójce jest trzeci, nie pierwszy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podania się za urządzenie albo usługę, której serwer szuka
    rozgłoszeniem w swoim segmencie sieci.
  en: |
    The mechanism of resolving names by group calling-out lets machines in one local net find one
    another with no server at all. The machine asks the whole net who is named thus and so, and
    whoever reckons it is about them answers.

    The weakness lies in the last sentence. There is no authentication and no arbiter - whoever
    answers answers, and the first answer is taken for true.

    I keep the category high here and do not raise it to critical, though the neighbouring rule on
    LLMNR was raised. I mean to set forth the ground, the difference not being plain and both items
    being easy to level.

    This mechanism is in the world of Windows used seldomer. The road by default for a failed
    asking is LLMNR and the older net mechanism; group calling-out serves mostly the finding of
    devices - printers, gear of the net, services that announce themselves. The gathering of
    askings an attacker may here catch is by that smaller, and with it the harvest is smaller.

    That does not make the item an ornament. The mechanism listens on a server as it does at a
    station and answers as it does without proof. It means only that in this three it is the third
    and not the first.

    What an attacker gains while the item goes unmet: the means of giving themselves out for a
    device or a service the server seeks by calling out in its own length of net.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z tej maszyny odnajduje się urządzenia
    sieciowe bez wpisu w serwerze nazw.

    Na serwerze aplikacyjnym albo plikowym odpowiedź brzmi zwykle nie
    i zmiana nie robi nic. Serwer rozmawia z tym, co ma zapisane
    w konfiguracji, a nie z tym, co się znajdzie.

    Odczują zmianę trzy rodzaje maszyn i warto je nazwać, zamiast pisać
    ogólne ostrzeżenie.

    Serwer druku odnajdujący drukarki ogłaszające się samodzielnie
    przestanie je znajdować. Drukarki wpisane po adresie albo po nazwie
    z serwera nazw działają dalej — chodzi wyłącznie o odnajdywanie.

    Serwer terminalowy, na którym ludzie szukają urządzeń w sieci,
    przestanie je pokazywać. Dla użytkownika wygląda to tak, że
    urządzenia zniknęły.

    Maszyna w sieci serwisowej sprzętu — macierzy, zasilaczy, kart
    zarządzających — może stracić widok tego sprzętu, bo część urządzeń
    ogłasza się właśnie tą drogą.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Punkt wdraża się razem z pozostałymi dwoma z tej trójki. Wyłączenie
    jednej z trzech dróg rozgłoszeniowych nie daje nic — napastnik
    korzysta z tej, która została.
  en: |
    What needs checking is whether devices of the net with no entry in the server of names are
    found from this machine.

    On a server of applications or of files the answer is mostly no, and the change does nothing.
    A server speaks with what it has written in its setup and not with what happens to be found.

    Three kinds of machine will feel the change and it is worth naming them rather than writing a
    warning in general.

    A server of printing that finds printers announcing themselves will stop finding them. Printers
    written in by address, or by a name out of the server of names, work on - it is about the
    finding alone.

    A terminal server whereon people seek devices in the net will stop showing them. To the user it
    looks as though the devices had gone.

    A machine in a net for the service of gear - arrays, feeders of power, cards of management -
    may lose the sight of that gear, a part of such devices announcing themselves by this very
    road.

    The change is undone at once and takes no restart.

    The item is rolled out together with the other two of this three. The switching off of one of
    the three calling-out roads gives nothing - the attacker takes the one that is left.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Serwer druku przestanie odnajdywać drukarki ogłaszające się samodzielnie w sieci
      - Na serwerze terminalowym urządzenia sieciowe znikną z widoku wyszukiwania
      - Sprzęt w sieci serwisowej ogłaszający się rozgłoszeniem może zniknąć z widoku maszyny
      - Urządzenia wpisane po adresie albo po nazwie z serwera nazw działają dalej bez zmian
      - Zmiana nie dotyczy pozostałych dróg rozgłoszeniowych i sama nie zamyka tej rodziny ataków
    en:
      - A server of printing will stop finding printers that announce themselves in the net
      - On a terminal server devices of the net will go from the sight of seeking
      - Gear in a net of service announcing itself by calling out may go from the machine's sight
      - Devices written in by address, or by a name from the server of names, work on unaltered
      - The change bears not on the other calling-out roads and alone shuts not this kin of attacks
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer druku odnajduje drukarki wyłącznie przez ich samodzielne ogłaszanie się
      - Maszyna pracuje w sieci serwisowej sprzętu, który ogłasza się tą właśnie drogą
    en:
      - A server of printing finds printers by their announcing of themselves alone
      - The machine works in a net of gear that announces itself by this very road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'EnableMDNS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'EnableMDNS'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMDNS' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Świadomie nie podnoszę tej reguły do kategorii krytycznej, choć
    sąsiednia reguła o LLMNR została podniesiona. Mechanizm ten jest
    w świecie Windows drogą trzecią, nie pierwszą — obsługuje głównie
    odnajdywanie urządzeń, więc zbiór zapytań do przechwycenia jest
    mniejszy, a plon napastnika mniejszy.

    Reguła ma sens wyłącznie razem z dwiema pozostałymi z tej trójki.
    Zamknięcie jednej drogi rozgłoszeniowej przy dwóch otwartych nie
    daje nic poza punktem w raporcie.
  en: |
    I knowingly do not raise this rule to the critical category, though the neighbouring rule on
    LLMNR was raised. This mechanism is in the world of Windows the third road and not the first -
    it serves mostly the finding of devices, so the gathering of askings to be caught is smaller
    and the attacker's harvest smaller.

    The rule has sense together with the other two of this three alone. The shutting of one
    calling-out road while two stand open gives nothing beyond an item in the report.
