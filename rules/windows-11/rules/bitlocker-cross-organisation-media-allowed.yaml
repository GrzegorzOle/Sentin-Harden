id: win11-bitlocker-cross-organisation-media-allowed

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na nośnikach zaszyfrowanych w innej organizacji dopuszczony
    en: Writing to media encrypted in another organisation admitted
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt jest dopowiedzeniem do zakazu zapisu na niezaszyfrowanych nośnikach
    wymiennych i rozstrzyga rzecz węższą: co zrobić z nośnikiem, który jest
    zaszyfrowany, ale przez kogoś innego.

    Do zaszyfrowanego nośnika przypisany jest identyfikator organizacji, w której
    go przygotowano. Ustawienie pozwala żądać, żeby zapisywać wyłącznie na
    nośnikach z własnym identyfikatorem, i odrzucać cudze — również te
    poprawnie zaszyfrowane.

    Benchmark tego nie wymaga i jest to rozstrzygnięcie przemyślane. Cel
    nadrzędny, czyli „nic nie wychodzi z maszyny bez szyfrowania", jest już
    osiągnięty przez punkt zakazujący zapisu na nośnikach niezaszyfrowanych.
    Dodanie warunku o identyfikatorze nie zdejmuje żadnego dalszego ryzyka —
    dane i tak wychodzą zaszyfrowane — a odcina zwykłą wymianę nośników
    z kontrahentami i między oddziałami. Punkt jest więc porządkowy: wymaga,
    żeby to złagodzenie było zapisane wprost, a nie pozostawione przypadkowi.
  en: |
    The item is a rider to the ban on writing to unencrypted removable media and
    settles a narrower matter: what to do with a medium that is encrypted, but by
    somebody else.

    An encrypted medium carries the identifier of the organisation where it was
    prepared. The setting allows demanding that writes go only to media bearing
    one's own identifier, and refusing others - including correctly encrypted ones.

    The benchmark does not require that, and it is a considered ruling. The
    overriding goal - nothing leaves the machine unencrypted - is already reached by
    the item forbidding writes to unencrypted media. Adding a condition about the
    identifier removes no further risk - the data leaves encrypted either way -
    while cutting off the ordinary exchange of media with counterparties and between
    branches. So the item is one of order: it calls for this easing to be written
    down explicitly rather than left to chance.

disruption_description:
  pl: |
    Nic nie przestaje działać. Wpisywana wartość jest tą, która i tak obowiązuje
    domyślnie — zmienia się wyłącznie to, że przestaje być domyślna.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma
    okna serwisowego i nie ma scenariusza, w którym cokolwiek na maszynie
    zachowa się inaczej niż przed zmianą.

    Warto natomiast odnotować rzecz odwrotną: wdrożenie tego punktu na maszynie,
    na której ktoś świadomie ustawił wymaganie własnego identyfikatora, to
    złagodzenie, a nie utwardzenie. Reguła nie rozpoznaje intencji i zgłosi
    tamten stan jako niespełnienie — decyzja, czy go zmieniać, należy do osoby
    czytającej raport.
  en: |
    Nothing stops working. The value written is the one that holds by default anyway
    - all that changes is that it stops being a default.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and no scenario in which anything on the machine behaves
    differently from before.

    What is worth noting is the reverse: applying this item on a machine where
    somebody deliberately set a requirement for their own identifier is an easing
    rather than a hardening. The rule does not recognise intent and will report that
    state as unmet - whether to change it is for the person reading the report to
    decide.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
  what_breaks:
    pl:
      - Nic nie przestaje działać; wpisywana wartość jest tą, która obowiązywała domyślnie
      - Na maszynie z wymaganiem własnego identyfikatora wdrożenie punktu to złagodzenie, a nie utwardzenie
    en:
      - Nothing stops working; the value written is the one that held by default
      - On a machine requiring its own identifier, applying the item is an easing rather than a hardening
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Świadomie wymaga się, żeby maszyna zapisywała wyłącznie na nośnikach zaszyfrowanych w tej samej organizacji
    en:
      - It is deliberately required that the machine write only to media encrypted in the same organisation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'RDVDenyCrossOrg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVDenyCrossOrg'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyCrossOrg' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Jest to jeden z nielicznych punktów w tej paczce, w którym wymagana wartość
    jest łagodniejsza z dwóch możliwych. Nie jest to przeoczenie benchmarku
    ani błąd w regule — punkt rozstrzyga, że dodatkowy warunek kosztuje więcej,
    niż daje, i każe zapisać to rozstrzygnięcie.

    Wartość jest częścią tego samego ustawienia co zakaz zapisu na nośnikach
    niezaszyfrowanych, ale leży w innej gałęzi rejestru. Reguły są więc dwie
    i każda czyta swoją gałąź — zapisanie jednej nie zapisuje drugiej.

    Identyfikator organizacji ustawia się osobnym wpisem, którego benchmark nie
    obejmuje. Bez niego warunek o zgodności identyfikatorów i tak nie miałby
    czego porównywać.
  en: |
    This is one of the few items in this pack where the required value is the milder
    of the two. That is neither an oversight in the benchmark nor an error in the
    rule - the item settles that the extra condition costs more than it gives, and
    calls for that ruling to be written down.

    The value is part of the same setting as the ban on writing to unencrypted
    media, but sits in a different registry key. So there are two rules and each
    reads its own key - writing one does not write the other.

    The organisation's identifier is set by a separate entry the benchmark does not
    cover. Without it the condition about matching identifiers would have nothing to
    compare anyway.
