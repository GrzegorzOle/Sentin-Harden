id: win2016-vbs-platform-security-features

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Wymagane zabezpieczenia platformy dla wirtualizacji
    en: Required platform security features for virtualisation
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, jakich zabezpieczeń platformy wymagać, zanim
    warstwa oparta na wirtualizacji w ogóle wstanie.

    Powód istnienia tego punktu jest prosty i wart wyłożenia. Warstwa
    oparta na wirtualizacji broni pamięci przed jądrem, ale sama zakłada,
    że jest tym, za co się podaje, i że nikt nie sięga do pamięci obok
    niej. Oba te założenia wymagają wsparcia sprzętu.

    Pierwsze zapewnia bezpieczny rozruch: bez niego nie ma pewności, że
    hipernadzorca, który wstał, jest tym właściwym. Drugie zapewnia ochrona
    przed bezpośrednim dostępem do pamięci: bez niej urządzenie podłączone
    do gniazda rozszerzeń może czytać pamięć z pominięciem procesora —
    a więc z pominięciem całej konstrukcji, którą ta warstwa buduje.

    Wartość trzecia wymaga obu. Wartość pierwsza wymaga tylko bezpiecznego
    rozruchu i zostawia otwartą drogę przez sprzęt. Rozróżnienie to nie
    wynika z nazwy ustawienia i jest jedynym miejscem, w którym ten punkt
    podejmuje decyzję.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: warstwę
    zabezpieczeń zbudowaną na założeniach, których nikt nie sprawdził —
    w szczególności drogę do pamięci przez urządzenie w gnieździe
    rozszerzeń.
  en: |
    The setting names which platform safeguards are to be required before the layer resting on
    virtualisation comes up at all.

    The reason this item exists is a simple one and worth setting out. The layer resting on
    virtualisation guards memory from the kernel, but itself assumes it is what it gives itself
    out to be, and that nobody reaches memory beside it. Both assumptions call for support from
    the hardware.

    The first is furnished by secure boot: without it there is no certainty that the hypervisor
    which came up is the right one. The second is furnished by protection against direct memory
    access: without it a device plugged into an expansion socket may read memory past the
    processor - and so past the whole construction that layer builds.

    The third value requires both. The first value requires secure boot alone and leaves a road
    open through the hardware. That distinction does not follow from the setting's name and is
    the one place where this item takes a decision.

    What an attacker gains while the item goes unmet: a layer of security built on assumptions
    nobody has checked - in particular a road to memory through a device in an expansion socket.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rzecz najważniejsza brzmi:
    wymaganie surowsze niż to, co sprzęt potrafi, kończy się warstwą, która
    w ogóle nie wstaje.

    Jest to skutek odwrotny do zamierzonego i warto go nazwać wprost.
    Ustawienie wartości trzeciej na serwerze bez ochrony przed bezpośrednim
    dostępem do pamięci nie daje ochrony mocniejszej — daje jej brak. System
    uznaje warunek za niespełniony i warstwa nie startuje, a wraz z nią nie
    startuje nic, co na niej stoi.

    Objaw jest przy tym milczący. Nie ma komunikatu, nie ma błędu przy
    starcie, a rejestr nadal mówi, że wszystko jest włączone. Jedyną drogą
    ustalenia stanu faktycznego jest sprawdzenie po restarcie, czy warstwa
    rzeczywiście działa.

    Sprawdzić przed wykonaniem trzeba więc dwie rzeczy: czy maszyna startuje
    w trybie bezpiecznego rozruchu i czy platforma zgłasza ochronę przed
    bezpośrednim dostępem do pamięci. Na serwerach sprzed lat druga bywa
    nieobecna, a na maszynach wirtualnych zależy od nadzorcy.

    Gdy sprzęt nie spełnia wymagań, wartość pierwsza jest wyborem
    poprawnym, a nie porażką. Warstwa wstaje i broni pamięci przed jądrem;
    otwarta zostaje wyłącznie droga przez gniazda rozszerzeń, a ta wymaga
    dostępu fizycznego.

    Czego to nie psuje: usług, sieci, aplikacji, udziałów, uwierzytelniania.

    Wymaga restartu; cofnięcie działa po kolejnym restarcie.
  en: |
    The class is "needs a planned rollout", and the weightiest matter runs: a requirement
    stricter than what the hardware can do ends in a layer that does not come up at all.

    It is a consequence opposite to the one intended and worth naming outright. Setting the
    third value on a server without protection against direct memory access gives no stronger
    guard - it gives its absence. The system holds the condition unmet and the layer does not
    start, and with it nothing standing on it starts either.

    The symptom is for all that a silent one. There is no message, no error at the start, and
    the registry still says everything is switched on. The one road to establishing the state in
    fact is a check after the restart whether the layer really works.

    Two things therefore have to be checked before execution: whether the machine starts in
    secure boot mode and whether the platform reports protection against direct memory access.
    On servers of years past the second is at times absent, and on virtual machines it hangs on
    the supervisor.

    Where the hardware does not meet the requirements, the first value is a right choice rather
    than a defeat. The layer comes up and guards memory from the kernel; what stays open is
    solely the road through the expansion sockets, and that calls for physical access.

    What this does not break: services, the network, applications, shares, or authentication.

    Calls for a restart; the undoing works after a further restart.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - boot-and-firmware
    - drivers-and-devices
  what_breaks:
    pl:
      - Wartość trzecia na sprzęcie bez ochrony przed bezpośrednim dostępem do pamięci sprawia, że warstwa w ogóle nie wstaje
      - Objaw jest milczący - nie ma komunikatu ani błędu przy starcie, a rejestr nadal mówi, że wszystko jest włączone
      - Wraz z warstwą nie startuje nic, co na niej stoi, więc skutek obejmuje reguły sąsiednie
      - Usługi, sieć, aplikacje i udziały pozostają bez zmian
    en:
      - The third value on hardware without protection against direct memory access makes the layer not come up at all
      - The symptom is silent - there is no message and no error at the start, and the registry still says everything is switched on
      - With the layer nothing standing on it starts either, so the consequence takes in the neighbouring rules
      - Services, the network, applications and shares stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Platforma nie zgłasza ochrony przed bezpośrednim dostępem do pamięci, a rozważana jest wartość trzecia
      - Maszyna startuje w trybie zgodności, bez bezpiecznego rozruchu
    en:
      - The platform does not report protection against direct memory access and the third value is being considered
      - The machine starts in compatibility mode, without secure boot
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      $name = 'RequirePlatformSecurityFeatures'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    $name = 'RequirePlatformSecurityFeatures'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One requires secure boot alone, three secure boot together with protection
    # against direct memory access. On hardware without the latter the layer
    # will not come up at three at all.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequirePlatformSecurityFeatures' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Punkt jest w całym zestawie najlepszym przykładem ustawienia, w którym
    surowszy wybór daje gorszy wynik. Nie chodzi o kompromis między
    ochroną a wygodą — chodzi o to, że wymaganie niemożliwe do spełnienia
    wyłącza ochronę zamiast ją wzmacniać.

    Milcząca postać tej porażki czyni punkt trudnym. Ktoś ustawia wartość
    surowszą, restartuje maszynę, widzi w raporcie zgodność i uznaje sprawę
    za załatwioną — a warstwa nie wstała i nie wstanie. Wszystko wygląda
    dobrze, a ochrony nie ma. Jest to najgorszy możliwy układ i aplikacja
    powinna po wdrożeniu tego punktu sprawdzić stan rzeczywisty, a nie
    poprzestać na ponownym odczycie rejestru.

    Wartość pierwsza jako wybór świadomy zasługuje na osobne miejsce
    w interfejsie. Nie jest odpuszczeniem punktu; jest jego wdrożeniem
    w wariancie dopasowanym do sprzętu. Różnica między tymi dwiema rzeczami
    powinna dać się zapisać w raporcie.
  en: |
    The item is in the whole set the best example of a setting where the stricter choice gives
    the worse outcome. It is not a matter of a trade between guard and convenience - it is that
    a requirement impossible to meet switches the guard off instead of strengthening it.

    The silent form of that failure makes the item a hard one. Somebody sets the stricter value,
    restarts the machine, sees compliance in the report and holds the matter settled - and the
    layer did not come up and will not. Everything looks well and the guard is not there. It is
    the worst possible arrangement, and the application should after this item's rollout check
    the real state rather than stop at a further reading of the registry.

    The first value as a knowing choice deserves a place of its own in the interface. It is no
    letting go of the item; it is the item's rollout in a variant fitted to the hardware. The
    difference between those two things should be recordable in the report.
