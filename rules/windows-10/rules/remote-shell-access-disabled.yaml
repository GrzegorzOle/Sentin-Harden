id: win10-remote-shell-access-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Shell
  title:
    pl: Dostęp do powłoki zdalnej wyłączony
    en: The reach of the shell from afar switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zamyka dostęp do powłoki zdalnej, czyli do wykonywania na
    maszynie dowolnych poleceń przez usługę zdalnego zarządzania.

    Różnica wobec punktu o samej usłudze polega na zakresie. Usługa
    obsługuje także żądania o ściśle określonym przeznaczeniu: odczyt
    stanu, pobranie ustawień, wykonanie zdefiniowanej operacji. Powłoka
    zdalna to coś innego — to otwarty wiersz poleceń.

    Zagrożeniem jest właśnie ta dowolność. Ograniczenie powłoki przy
    zachowaniu usługi zostawia zarządzanie działające, a odbiera
    najszerszą z możliwości: wykonanie czegokolwiek.

    Drugim zastrzeżeniem jest to, że powłoka zdalna nie tworzy sesji
    widocznej przy maszynie, a polecenie przekazane wprost nie zostawia
    pliku na dysku.

    Odnotowuję, że jest to punkt pośredni wobec wyłączenia całej usługi.
    Tam, gdzie zdalne zarządzanie jest potrzebne, ale wiersz poleceń nie,
    to jest właściwa granica.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: otwarty
    wiersz poleceń przez usługę zdalnego zarządzania.
  en: |
    The setting shuts the reach of the shell from afar - the working upon the machine of any orders at all through
    the service of ordering from afar.

    The difference against the item about the service itself lies in the reach. The service serves also askings of
    a strictly set purpose: the reading of state, the taking of settings, the working of a set doing. The shell
    from afar is another matter - it is an open line of orders.

    The danger is that very freedom. The bounding of the shell with the service kept leaves the ordering working
    and takes away the broadest of the powers: the working of anything at all.

    The second reservation is that the shell from afar makes no session to be seen at the machine, and an order
    handed over outright leaves no file upon the disk.

    I set down that it is a middle item against the switching off of the whole service. Where the ordering from
    afar is needed but the line of orders is not, that is the right bound.

    What an attacker gains while the item goes unmet: an open line of orders through the service of ordering from
    afar.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo w większości wdrożeń zdalne
    zarządzanie oznacza właśnie wykonywanie poleceń.

    Miejscem pierwszym są skrypty wykonujące polecenia na tej maszynie.
    Po zmianie zostaną odrzucone, choć połączenie z usługą będzie się
    nawiązywać — i to jest objaw mylący, bo maszyna odpowiada, a mimo
    to nic nie da się na niej zrobić.

    Miejscem drugim są narzędzia wdrożeniowe uruchamiające instalatory
    i polecenia naprawcze. Tam skutkiem jest zatrzymanie automatyzacji
    w połowie, bez oczywistego komunikatu.

    Miejscem trzecim jest praca doraźna osoby zarządzającej, która łączy
    się z maszyną, żeby coś sprawdzić. Po zmianie zostaje jej droga przy
    maszynie albo pulpit zdalny.

    Odnotowuję, że żądania o określonym przeznaczeniu działają dalej.
    Odczyt stanu, pobranie ustawień i zdefiniowane operacje pozostają
    dostępne, więc nadzór nie traci maszyny z widoku.

    Zmiana zaczyna obowiązywać po ponownym uruchomieniu usługi.

    Czego to nie psuje: odczytu stanu przez zarządzanie zdalne, pracy
    programów, sieci, logowania, drukowania.
  en: |
    The class is "needs a planned rollout", for in most rollouts the ordering from afar means just the working of
    orders.

    The first place is scripts working orders upon this machine. After the change they will be refused, though the
    joining to the service will be made - and that is a misleading sign, the machine answering and yet nothing to
    be done upon it.

    The second place is tools of rollout setting going layers-on and orders of mending. There the upshot is the
    stopping of the working of itself halfway, with no plain message.

    The third place is the work of the hour of whoever orders the machines and joins themselves to look at
    something. After the change there is left them the road at the machine or the desk from afar.

    I set down that askings of a set purpose work on. The reading of state, the taking of settings and set doings
    stay to be had, so the watching loses not the machine from sight.

    The change comes into force after the service is set going anew.

    What this does not break: the reading of state by the ordering from afar, the work of programs, the network,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypty wykonujące polecenia na tej maszynie zostaną odrzucone, choć połączenie z usługą się nawiąże
      - Objaw jest mylący, bo maszyna odpowiada, a mimo to nic nie da się na niej zrobić
      - Narzędzia wdrożeniowe uruchamiające instalatory zatrzymają automatyzację w połowie
      - Osobie zarządzającej zostaje droga przy maszynie albo pulpit zdalny
      - Odczyt stanu, pobranie ustawień i zdefiniowane operacje pozostają dostępne, więc nadzór nie traci maszyny z widoku
    en:
      - Scripts working orders upon this machine will be refused, though the joining to the service will be made
      - The sign is misleading, the machine answering and yet nothing to be done upon it
      - Tools of rollout setting going layers-on will stop the working of itself halfway
      - To whoever orders the machines there is left the road at the machine or the desk from afar
      - The reading of state, the taking of settings and set doings stay to be had, so the watching loses not the machine from sight
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest utrzymywana skryptami wykonującymi na niej polecenia i nie ma innej drogi
      - Narzędzie wdrożeniowe uruchamia na maszynie instalatory i polecenia naprawcze
    en:
      - The machine is upheld by scripts working orders upon it and there is no other road
      - A tool of rollout sets going upon the machine layers-on and orders of mending
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowRemoteShellAccess'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
    $name = 'AllowRemoteShellAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowRemoteShellAccess' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/windows-remote-shell-scripting-api

notes:
  pl: |
    Reguła jest punktem pośrednim wobec wyłączenia całej usługi i warto,
    żeby aplikacja pokazała je obok siebie z zaznaczeniem różnicy. Tu
    zostaje odczyt stanu i zdefiniowane operacje, znika otwarty wiersz
    poleceń.

    Argument wart postawienia dotyczy właśnie tej granicy. Tam, gdzie
    zdalne zarządzanie jest potrzebne, a wykonywanie dowolnych poleceń
    nie, ten punkt daje dokładnie to rozróżnienie.

    Odnotowuję objaw mylący: maszyna odpowiada, połączenie się nawiązuje,
    a mimo to nic nie da się wykonać. Aplikacja powinna to wymienić, bo
    inaczej diagnoza pójdzie w stronę sieci.
  en: |
    The rule is a middle item against the switching off of the whole service, and it is well that the application
    show them side by side with the difference marked. Here the reading of state and set doings stay; the open
    line of orders goes.

    The argument worth putting touches that very bound. Where the ordering from afar is needed and the working of
    any orders at all is not, this item gives just that telling apart.

    I set down the misleading sign: the machine answers, the joining is made, and for all that nothing is to be
    worked. The application ought to name it, else the telling of the cause will go toward the network.
