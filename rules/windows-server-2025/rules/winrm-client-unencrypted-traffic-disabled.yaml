id: win2025-winrm-client-unencrypted-traffic-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Client
  title:
    pl: Nieszyfrowany ruch klienta zarządzania zdalnego zabroniony
    en: Unencrypted traffic from the remote management client refused
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi zarządzania zdalnego zestawiania
    połączeń, w których treść nie jest zaszyfrowana.

    Jest to druga strona ustawienia po stronie usługi i różnica między
    nimi nie jest formalna. Tamto chroni to, co dzieje się na tym
    serwerze, gdy ktoś nim zarządza. To chroni to, co ten serwer robi
    na innych maszynach — a więc treść, której właścicielem nie jest ta
    maszyna.

    Na maszynie zarządzającej kierunek wychodzący jest tym ważniejszym.
    Serwer obchodzący skryptem kilkadziesiąt hostów wysyła w każdym
    z tych połączeń polecenia, a często także poświadczenia do
    kolejnego kroku. Ruch ten idzie zwykle przez więcej odcinków sieci
    niż ruch przychodzący, bo maszyny docelowe stoją w różnych miejscach
    — w innej serwerowni, w innym oddziale, u dostawcy.

    Warto tu powtórzyć ograniczenie zapisane przy stronie usługi, żeby
    punkt nie obiecywał więcej, niż daje. Połączenie uwierzytelnione
    mechanizmem domenowym jest szyfrowane na poziomie komunikatów samo
    z siebie. Rzeczywisty skutek dotyczy połączeń bez tego szyfrowania,
    czyli przede wszystkim uwierzytelniania podstawowego puszczonego
    kanałem nieszyfrowanym.

    Wartością punktu jest to, że zabezpieczenie nie zależy od dyscypliny
    piszącego skrypt. Jeden skrypt z przełącznikiem wyłączającym
    szyfrowanie, napisany w pośpiechu i zostawiony w zadaniach
    zaplanowanych, wysyła poświadczenia czytelnie przez lata. To
    ustawienie odbiera możliwość zrobienia tego przez nieuwagę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odczytania z ruchu poleceń i poświadczeń, które ten serwer
    wysyła do maszyn zarządzanych.
  en: |
    The setting forbids the remote management client to set up connections wherein the contents are
    not encrypted.

    It is the other side of the setting at the service's side, and the difference between them is
    not formal. That one guards what befalls on this server when somebody manages it. This one
    guards what this server does upon other machines - and so contents whose owner this machine is
    not.

    On a managing machine the going-out way is the weightier one. A server going round a few dozen
    hosts by a script sends in every one of those connections orders, and often credentials for the
    next step besides. That traffic goes usually through more stretches of network than the
    coming-in traffic, the aimed-at machines standing in differing places - in another server room,
    in another branch, at a vendor's.

    It is worth repeating here the bound written at the service's side, lest the item promise more
    than it gives. A connection authenticated by the domain's mechanism is encrypted at the level
    of the messages of itself. The true effect bears on connections without that encryption, that
    is above all on basic authentication let through an unencrypted channel.

    The item's worth is that the guard does not hang upon the discipline of whoever writes the
    script. One script with a switch turning the encryption off, written in haste and left among
    the planned jobs, sends credentials readable for years. This setting takes away the means of
    doing that by inattention.

    What an attacker gains while the item goes unmet: the means of reading out of the traffic the
    orders and credentials this server sends to the machines it manages.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy z tego serwera zarządza się maszynami,
    które nie nasłuchują kanałem szyfrowanym.

    Przypadek pierwszy to maszyny spoza domeny, do których połączenie
    zestawiane jest kontem lokalnym. Bez certyfikatu po ich stronie
    połączenie było dotąd nieszyfrowane i po zmianie przestanie być
    nawiązywane.

    Przypadek drugi to skrypty napisane z jawnym wyłączeniem
    szyfrowania. Zdarza się to częściej, niż wypada przyznać: ktoś
    napotkał błąd certyfikatu, dopisał przełącznik, zadanie zaczęło
    działać i zostało tak na lata. Po zmianie takie zadanie przestanie
    działać, i jest to zresztą jedyny sposób, żeby ktokolwiek się o nim
    dowiedział.

    Przypadek trzeci to urządzenia i usługi obce mówiące tym protokołem,
    których nasłuchiwanie kanałem szyfrowanym wymaga osobnej
    konfiguracji, a często wykupienia certyfikatu.

    Objaw jest jednoznaczny i pojawia się od razu: połączenie kończy się
    błędem przy nawiązywaniu, a skrypt przerywa pracę w pierwszym
    kroku. Zadania zaplanowane zaczynają kończyć się błędem, a nie cicho
    czekać — to akurat ułatwia rozpoznanie.

    Kolejność wdrożenia jest taka sama jak po stronie usługi: najpierw
    przygotować kanał szyfrowany na maszynach docelowych, potem
    przestawić skrypty, a dopiero na końcu zamknąć drogę nieszyfrowaną
    tutaj.

    Punkt wdraża się razem z bliźniakiem po stronie usługi.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    trwające nie są przerywane.
  en: |
    One thing needs checking: whether machines are managed from this server which do not listen on
    an encrypted channel.

    The first case is machines outside a domain, the connection to which is set up by a local
    account. Without a certificate at their side the connection was until now unencrypted and after
    the change will stop being opened.

    The second case is scripts written with the encryption turned off outright. It happens oftener
    than it becomes one to own: somebody met a fault of a certificate, wrote in a switch, the job
    began working and so it stayed for years. After the change such a job will stop working, and
    that is besides the one way anybody will ever learn of it.

    The third case is foreign devices and services speaking this protocol, whose listening on an
    encrypted channel takes a setting up apart and often the buying of a certificate.

    The symptom is plain and shows at once: the connection ends in a fault at its opening and the
    script breaks off at its first step. Planned jobs begin ending in a fault rather than waiting
    quietly - which for once makes the telling easier.

    The order of the rollout is the same as at the service's side: first make ready the encrypted
    channel on the aimed-at machines, then turn the scripts over, and only at the last shut the
    unencrypted road here.

    The item is rolled out together with its twin at the service's side.

    The change comes into force straight away and is undone at once. Sessions already running are
    not broken.

implementation_consequences:
  impact_areas:
    - remote-management
    - encryption-and-tls
    - scripting-and-automation
  what_breaks:
    pl:
      - Połączenie do maszyny spoza domeny bez certyfikatu przestanie być nawiązywane
      - Skrypt napisany z jawnym wyłączeniem szyfrowania przerwie pracę w pierwszym kroku
      - Zarządzanie urządzeniem obcym nienasłuchującym kanałem szyfrowanym przestanie działać
      - Zadania zaplanowane kończą się błędem zamiast czekać, co ułatwia rozpoznanie przyczyny
      - Sesje zarządzania już trwające nie są przerywane, warunek sprawdza się przy następnym połączeniu
    en:
      - A connection to a machine outside a domain without a certificate will stop being opened
      - A script written with the encryption turned off outright will break off at its first step
      - The managing of a foreign device not listening on an encrypted channel will stop working
      - Planned jobs end in a fault rather than waiting, which makes the telling of the cause easier
      - Sessions of management already running are not broken, the condition being checked at the next connecting
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny zarządzane z tego serwera nie nasłuchują kanałem szyfrowanym i nie przygotowano tego
      - Zadania zaplanowane na tym serwerze zestawiają połączenia z jawnie wyłączonym szyfrowaniem
    en:
      - The machines managed from this server do not listen on an encrypted channel and that was not made ready
      - Planned jobs on this server open connections with the encryption turned off outright
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      $name = 'AllowUnencryptedTraffic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowUnencryptedTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowUnencryptedTraffic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Strona wychodząca jest na maszynie zarządzającej tą ważniejszą:
    serwer obchodzący skryptem kilkadziesiąt hostów wysyła w każdym
    połączeniu polecenia, a często poświadczenia do kolejnego kroku.

    Wartością punktu jest to, że zabezpieczenie nie zależy od
    dyscypliny piszącego skrypt. Jeden przełącznik wyłączający
    szyfrowanie, dopisany w pośpiechu, wysyła poświadczenia czytelnie
    przez lata.

    To samo ograniczenie co po stronie usługi: przy mechanizmie
    domenowym komunikaty są szyfrowane niezależnie od kanału.
  en: |
    The going-out side is on a managing machine the weightier one: a server going round a few dozen
    hosts by a script sends in every connection orders, and often credentials for the next step.

    The item's worth is that the guard does not hang upon the discipline of whoever writes the
    script. One switch turning the encryption off, written in haste, sends credentials readable for
    years.

    The same bound as at the service's side: with the domain's mechanism the messages are encrypted
    whatever the channel.
