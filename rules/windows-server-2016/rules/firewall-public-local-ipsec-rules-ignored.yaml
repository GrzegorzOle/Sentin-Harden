id: win2016-firewall-public-local-ipsec-rules-ignored

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Lokalne reguły zabezpieczeń połączeń pomijane w profilu publicznym
    en: Local connection security rules passed over in the public profile
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że w profilu publicznym obowiązują wyłącznie
    przysłane centralnie reguły zabezpieczeń połączeń, a utworzone lokalnie
    są pomijane.

    Reguły te są czymś innym niż zwykłe reguły zapory i warto tę różnicę
    zapamiętać. Zwykła reguła rozstrzyga, czy połączenie wolno nawiązać.
    Reguła zabezpieczeń połączeń rozstrzyga, czy ma być uwierzytelnione
    i zaszyfrowane, oraz czym. Pierwsza opisuje dostęp, druga zaufanie.

    Stąd bierze się waga tego punktu. Reguła utworzona lokalnie potrafi
    zwolnić połączenie z wymogu uwierzytelnienia albo dopuścić słabszy sposób
    zabezpieczenia — i zrobić to niewidocznie dla tego, kto ogląda
    konfigurację centralną. Ruch nadal płynie, nadal wygląda na
    zabezpieczony, a warunki są inne, niż zapisano w zasadach.

    Profil publiczny jest miejscem, w którym wymogi te powinny być najostrzej
    przestrzegane, bo dotyczy sieci nierozpoznanej. Dopuszczenie lokalnego
    wyjątku znosi je akurat tam, gdzie są najbardziej potrzebne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    korzystania z lokalnie utworzonego zwolnienia z uwierzytelnienia lub
    szyfrowania, obowiązującego w sieci nierozpoznanej i niewidocznego
    w konfiguracji centralnej.
  en: |
    The setting brings it about that in the public profile only centrally sent
    connection security rules hold, while those made locally are passed over.

    These rules are something other than ordinary firewall rules, and that
    difference is worth remembering. An ordinary rule settles whether a connection
    may be made. A connection security rule settles whether it is to be
    authenticated and encrypted, and by what. The first describes access, the second
    trust.

    Hence the weight of this item. A rule made locally can release a connection from
    the demand for authentication, or admit a weaker way of securing it - and do so
    invisibly to whoever is looking at the central configuration. The traffic still
    flows, still looks secured, and the terms are other than those written into the
    policy.

    The public profile is where those demands should be kept most strictly, since it
    concerns an unrecognised network. Admitting a local exception lifts them exactly
    where they are most needed.

    What an attacker gains while the item goes unmet: the means of using a locally
    made release from authentication or encryption, holding in an unrecognised
    network and invisible in the central configuration.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", bo reguły zabezpieczeń połączeń tworzone
    lokalnie są na serwerze rzadkością.

    Mechanizm ten jest wdrażany centralnie albo wcale. Konfiguruje się go
    zasadami grupy, bo wymaga zgodności obu stron połączenia — reguła
    utworzona na jednej maszynie i nieznana drugiej nie daje niczego. Reguły
    lokalne w tym zbiorze powstają zatem niemal wyłącznie ręcznie, przy
    diagnostyce albo przy pracach doraźnych, i bywają potem zapomniane.

    Właśnie dlatego zmiana jest tania: pomija coś, czego zwykle nie ma.
    Jeżeli natomiast jest, to znaczy, że ktoś ją napisał ręcznie i warto
    o tym wiedzieć — audyt pokaże wtedy stan niezgodny i będzie to
    informacja sama w sobie.

    Przypadek, w którym zmiana zaboli, jest jeden: maszyna, na której
    zabezpieczenie połączeń skonfigurowano lokalnie, bo nie ma jej
    w zasadach grupy. Wtedy połączenia przestaną spełniać warunki i zostaną
    odrzucone — ale dotyczy to wyłącznie profilu publicznego.

    Czego to nie psuje: reguł przysłanych z zasad grupy, profilu domenowego,
    profilu prywatnego, zwykłych reguł zapory.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", since connection security rules made locally are a
    rarity on a server.

    The mechanism is rolled out centrally or not at all. It is configured by group
    policy, since it calls for agreement on both sides of a connection - a rule made
    on one machine and unknown to the other gives nothing. Local rules in this set
    therefore come into being almost solely by hand, at diagnosis or at makeshift
    work, and are at times forgotten afterwards.

    That is just why the change is cheap: it passes over something that as a rule is
    not there. If, on the other hand, it is there, that means somebody wrote it by
    hand and it is worth knowing - the audit will then show a state out of
    compliance, and that is information in itself.

    There is one case in which the change will hurt: a machine where connection
    security was configured locally, because it is not in group policy. Connections
    will then cease to meet the terms and be rejected - but that concerns the public
    profile alone.

    What this does not break: rules sent down from group policy, the domain profile,
    the private profile, or ordinary firewall rules.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - encryption-and-tls
    - remote-management
  what_breaks:
    pl:
      - Maszyna z zabezpieczeniem połączeń skonfigurowanym lokalnie, poza zasadami grupy, przestaje spełniać warunki i połączenia są odrzucane w profilu publicznym
      - Reguły napisane ręcznie przy diagnostyce i potem zapomniane przestają obowiązywać
      - Na serwerze zarządzanym centralnie zmiana pomija zbiór, który zwykle jest pusty, więc skutku nie ma
      - Reguły z zasad grupy, profil domenowy, profil prywatny i zwykłe reguły zapory pozostają bez zmian
    en:
      - A machine with connection security configured locally, outside group policy, ceases to meet the terms and its connections are rejected in the public profile
      - Rules written by hand at diagnosis and forgotten afterwards cease to hold
      - On a centrally managed server the change passes over a set that is as a rule empty, so there is no effect
      - Rules from group policy, the domain profile, the private profile and ordinary firewall rules stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zabezpieczenie połączeń skonfigurowano na tej maszynie lokalnie, bo nie ma go w zasadach grupy
      - Trwają prace diagnostyczne opierające się na ręcznie utworzonych regułach zabezpieczeń połączeń
    en:
      - Connection security was configured locally on this machine, since it is not in group policy
      - Diagnostic work resting on connection security rules made by hand is under way
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' } else { [string]$public.AllowLocalIPsecRules }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'False'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public |
      Select-Object -Property Name, AllowLocalIPsecRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules $b.AllowLocalIPsecRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt jest bliźniakiem reguły o regułach lokalnych zapory i wdraża się je
    razem. Różnica, którą warto pokazać w interfejsie, dotyczy tego, czego
    każda z nich pilnuje: tamta dostępu, ta zaufania. Reguła lokalna
    zwalniająca z uwierzytelnienia jest groźniejsza od lokalnej reguły
    otwierającej port, bo nie otwiera nowej drogi, tylko obniża wymagania na
    drodze istniejącej — a to znacznie trudniej zauważyć.

    Kategoria średnia, mimo że mechanizm jest na serwerach rzadko używany.
    Ocena odnosi się do tego, co daje wyjątek, jeśli istnieje, a nie do tego,
    jak często istnieje.

    Audyt zwraca tu wprost wartość ustawienia zamiast nazwy stanu, bo
    ustawienie ma tylko dwie wartości i obie są jednoznaczne. Przy regule
    bliźniaczej stan nazwano, bo tam nazwa niesie więcej niż sama wartość.
  en: |
    The item is a twin of the rule on local firewall rules and the two are rolled
    out together. The difference worth showing in the interface concerns what each
    of them watches over: that one access, this one trust. A local rule releasing
    from authentication is more dangerous than a local rule opening a port, since it
    opens no new road but lowers the demands on an existing one - and that is a good
    deal harder to notice.

    The category is medium, though the mechanism is seldom used on servers. The
    judgement refers to what the exception gives if it exists, and not to how often
    it exists.

    The audit here returns the setting's value outright instead of a name for the
    state, since the setting has two values only and both are unambiguous. At the
    twin rule the state was named, since there the name carries more than the value
    alone.
