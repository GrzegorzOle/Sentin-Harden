id: win2025-local-users-not-enumerated-in-domain

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Konta lokalne niewyliczane na maszynie w domenie
    en: Local accounts not listed on a machine in a domain
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt wyłącza pokazywanie listy kont lokalnych na ekranie logowania
    maszyny należącej do domeny.

    Zostawiam kategorię średnią i czytam ten punkt razem z regułą
    o wyliczaniu administratorów przy podnoszeniu uprawnień — obie
    zamykają to samo źródło wiedzy, tylko w innym miejscu ekranu.

    Różnica jest jednak warta nazwania, bo ta reguła mówi coś o maszynie,
    a nie tylko o kontach. Serwer w domenie, który ma konta lokalne inne
    niż wbudowane, zwykle ma je z konkretnego powodu: konto usługi
    założone ręcznie, konto dostawcy, konto dla programu, który nie umie
    pracować z domeną. Lista takich kont na ekranie logowania jest
    opowieścią o tym, co na tej maszynie działa i kto ma do niej dojście
    z pominięciem domeny. Dla kogoś, kto właśnie zobaczył ekran logowania
    serwera, jest to pierwsza użyteczna informacja.

    Warto też zauważyć, że dojście kontem lokalnym na maszynie w domenie
    jest dojściem poza domeną: nie ogląda go zasada domenowa, nie widzi go
    dziennik kontrolera i nie dotyczy go blokowanie konta ustawione
    centralnie. Tym bardziej nie ma powodu, żeby takie konta ogłaszać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykaz
    lokalnych dróg wejścia na maszynę, czytelny z ekranu logowania, bez
    logowania się na nią.
  en: |
    The item switches off showing the list of local accounts on the sign-in
    screen of a machine belonging to a domain.

    I keep the category medium and read this item together with the rule on
    listing administrators when elevating - both close the same source of
    knowledge, only at a different place on the screen.

    The difference is worth naming, though, because this rule says
    something about the machine and not only about the accounts. A server
    in a domain that has local accounts other than the built-in ones
    usually has them for a specific reason: a service account created by
    hand, a vendor's account, an account for a program that cannot work
    with a domain. A list of such accounts on the sign-in screen is a story
    about what runs on this machine and who has a way in that bypasses the
    domain. For somebody who has just seen a server's sign-in screen, that
    is the first useful piece of information.

    It is also worth noticing that a way in through a local account on a
    machine in a domain is a way in outside the domain: no domain policy
    watches it, no controller's log sees it, and account lockout set
    centrally does not apply to it. All the more reason not to announce
    such accounts.

    What an attacker gains while the item goes unmet: a roll of local ways
    into the machine, readable from the sign-in screen without signing in
    at all.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Znika lista, a nie możliwość zalogowania się
    kontem lokalnym. Kto zna nazwę konta, poda ją razem z hasłem i wejdzie
    dokładnie tak jak przedtem.

    Na serwerze skutek jest jeszcze mniejszy niż na stacji roboczej,
    ponieważ do ekranu logowania serwera prawie nikt nie podchodzi.
    Widuje się go w konsoli poza systemem, przy pracach przy maszynie i po
    restarcie, który wymagał obecności — czyli w sytuacjach rzadkich,
    w których i tak pracuje się według procedury, a nie z pamięci.

    Rzecz, którą warto zrobić przy okazji, a nie po fakcie: sprawdzić, czy
    nazwy kont lokalnych tej maszyny są gdziekolwiek zapisane. Jeżeli
    jedynym miejscem, w którym dotąd występowały, był ten ekran, to ta
    zmiana zabiera nie tylko napastnikowi, ale i obsłudze — a obsłudze
    akurat niepotrzebnie.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption". The list goes, not the ability to sign in
    with a local account. Whoever knows the account name will supply it
    along with the password and get in exactly as before.

    On a server the effect is smaller still than on a workstation, because
    almost nobody walks up to a server's sign-in screen. It is seen in an
    out-of-band console, during work at the machine, and after a restart
    that required somebody's presence - that is, in rare situations where
    people work from a procedure anyway rather than from memory.

    Something worth doing on the occasion rather than after the fact: check
    whether this machine's local account names are recorded anywhere. If
    the only place they have appeared until now was that screen, then this
    change takes something not only from an attacker but from the operators
    too - and from the operators quite needlessly.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Znika lista kont lokalnych na ekranie logowania, ale nie znika możliwość zalogowania się nimi
      - Kto zna nazwę konta, poda ją razem z hasłem i wejdzie tak jak przedtem
      - Jeżeli nazwy kont lokalnych nie są nigdzie zapisane, ta zmiana zabiera je również obsłudze
      - Do ekranu logowania serwera prawie nikt nie podchodzi, więc skutek jest mniejszy niż na stacji roboczej
    en:
      - The list of local accounts on the sign-in screen goes, but the ability to sign in with them does not
      - Whoever knows the account name will supply it along with the password and get in as before
      - If the local account names are recorded nowhere, this change takes them from the operators as well
      - Almost nobody walks up to a server's sign-in screen, so the effect is smaller than on a workstation
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nazwy kont lokalnych tej maszyny nie są nigdzie zapisane, a ekran logowania był jedynym miejscem, w którym występowały
    en:
      - This machine's local account names are recorded nowhere and the sign-in screen was the only place they appeared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnumerateLocalUsers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnumerateLocalUsers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Check first whether this machine's local account names are recorded
    # anywhere else. Where the sign-in screen was the only place they appeared,
    # this takes them from the operators too.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnumerateLocalUsers' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Czytać razem z regułą o wyliczaniu administratorów przy podnoszeniu
    uprawnień — obie zamykają to samo źródło wiedzy, tylko w innym miejscu
    ekranu.

    Ta mówi jednak coś o maszynie, a nie tylko o kontach. Serwer w domenie,
    który ma konta lokalne inne niż wbudowane, ma je z konkretnego powodu:
    konto usługi założone ręcznie, konto dostawcy, konto dla programu, który
    nie umie pracować z domeną. Lista takich kont to opowieść o tym, kto ma
    dojście z pominięciem domeny.

    Dojście kontem lokalnym na maszynie w domenie jest dojściem poza
    domeną: nie ogląda go zasada domenowa, nie widzi go dziennik
    kontrolera, nie dotyczy go centralne blokowanie konta.
  en: |
    To be read together with the rule on listing administrators when
    elevating - both close the same source of knowledge, only at a
    different place on the screen.

    This one says something about the machine, though, and not only about
    the accounts. A server in a domain that has local accounts other than
    the built-in ones has them for a specific reason: a service account
    created by hand, a vendor's account, an account for a program that
    cannot work with a domain. A list of such accounts is a story about who
    has a way in that bypasses the domain.

    A way in through a local account on a machine in a domain is a way in
    outside the domain: no domain policy watches it, no controller's log
    sees it, and central account lockout does not apply to it.
