id: win10-bitlocker-smart-card-fixed-drives

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Karta wymagana do odblokowania dysków stałych
    en: A card required to unlock fixed drives
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga karty z certyfikatem do odblokowania zaszyfrowanego
    dysku stałego z danymi.

    Bez tego punktu dysk odblokowuje się razem z zalogowaniem: kto dostał
    się do sesji użytkownika, ten ma dane otwarte. Cała ochrona sprowadza
    się wtedy do hasła konta — a hasło konta chroni przed kimś, kto siada
    przy maszynie, nie przed kimś, kto już w tej sesji jest.

    Karta rozdziela te dwie rzeczy. Zalogowanie daje sesję, karta daje
    dane. Napastnik, który przejął sesję zdalnie albo usiadł przy
    odblokowanej maszynie, nie dostaje dysku, dopóki karty nie ma
    fizycznie.

    Odnotowuję, że punkt składa się z dwóch wartości. Pierwsza dopuszcza
    kartę, druga czyni ją wymaganą, a sama pierwsza zostawia wybór
    użytkownikowi — czyli nie ustala niczego. Sprawdzenie nazywa ten stan
    osobno, bo z zewnątrz wygląda on na zrobiony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zawartość
    dysku z danymi natychmiast po przejęciu sesji użytkownika.
  en: |
    The setting calls for a card bearing a certificate to unlock an enciphered fixed data drive.

    Without this item the drive unlocks together with the signing in: whoever got into the user's session has the
    data open. The whole guarding comes down then to the account's password - and an account's password guards
    against somebody who sits down at the machine, not against somebody already within that session.

    The card parts those two things. The signing in gives the session, the card gives the data. An attacker who
    has taken a session from afar or sat down at an unlocked machine does not get the drive until the card is
    physically there.

    I set down that the item is made of two values. The first admits the card, the second makes it required, and
    the first alone leaves the choice to the user - which is to say it settles nothing. The check names that state
    apart, from outside it looking done.

    What an attacker gains while the item goes unmet: the contents of a drive of data at once upon the taking of a
    user's session.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo wymaga sprzętu i infrastruktury
    po stronie organizacji, a nie samego wpisu.

    Potrzebne są czytniki przy maszynach, karty dla użytkowników
    i urząd wydający certyfikaty. Żadnej z tych rzeczy nie da się
    wprowadzić w dniu zmiany, a bez nich dysk stanie się po prostu
    niedostępny.

    Skutek dla użytkownika jest odczuwalny codziennie. Karta musi być przy
    maszynie w chwili, w której dane są potrzebne — a karta zgubiona,
    zostawiona w domu albo zablokowana po błędnym kodzie oznacza wezwanie
    obsługi i odzyskiwanie dostępu z klucza.

    Odnotowuję skutek dla pracy zdalnej i automatycznej. Zadanie
    uruchamiane w nocy nie odblokuje dysku, bo nikt nie wsunie karty.
    Usługa zapisująca na tym dysku po restarcie maszyny stanie. Wszystko,
    co miało działać bez człowieka, wymaga tu ponownego przemyślenia.

    Odnotowuję też, że zmiana obowiązuje dyski szyfrowane po jej
    wprowadzeniu. Dysk zaszyfrowany wcześniej zachowuje dotychczasowe
    sposoby odblokowania.

    Czego to nie psuje: pracy na dysku systemowym, logowania, drukowania,
    udziałów plikowych wystawianych z innych nośników.
  en: |
    The class is "needs a planned rollout", calling as it does for gear and an estate upon the body's side, and
    not for the entry alone.

    Readers at the machines are needed, cards for the users and an office issuing the certificates. None of those
    may be brought in on the day of the change, and without them the drive will simply be out of reach.

    The consequence for the user is felt daily. The card has to be at the machine at the hour the data are needed
    - and a card lost, left at home or locked after a mistyped code means a calling of the support and a winning
    back of the way in from a key.

    I set down the consequence for work from afar and work without a hand. A task run by night will not unlock the
    drive, nobody being there to put the card in. A service writing upon that drive will stand after a restart of
    the machine. Everything that was to work without a person calls here for a fresh thinking through.

    I set down likewise that the change holds for drives enciphered after it was brought in. A drive enciphered
    earlier keeps the ways of unlocking it had.

    What this does not break: work upon the system drive, logging on, printing, or file shares put out from other
    drives.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - drivers-and-devices
  what_breaks:
    pl:
      - Zadanie uruchamiane w nocy nie odblokuje dysku, bo nikt nie wsunie karty
      - Usługa zapisująca na tym dysku stanie po restarcie maszyny i nie wróci bez człowieka
      - Karta zgubiona, zostawiona w domu albo zablokowana po błędnym kodzie oznacza wezwanie obsługi
      - Bez czytników, kart i urzędu wydającego certyfikaty dysk stanie się po prostu niedostępny
      - Praca na dysku systemowym, logowanie, drukowanie i udziały z innych nośników pozostają bez zmian
    en:
      - A task run by night will not unlock the drive, nobody being there to put the card in
      - A service writing upon that drive will stand after a restart of the machine and not return without a person
      - A card lost, left at home or locked after a mistyped code means a calling of the support
      - Without readers, cards and an office issuing the certificates the drive will simply be out of reach
      - Work upon the system drive, logging on, printing and shares from other drives stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ma czytników kart ani urzędu wydającego certyfikaty, więc dysk stałby się niedostępny
      - Na dysku pracują usługi i zadania uruchamiane bez udziału człowieka, które nie mają jak podać karty
    en:
      - There are no readers of cards nor an office issuing certificates, so the drive would fall out of reach
      - Upon the drive work services and tasks run without a person, which have no way to give a card
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes it
      # required - admitted without required leaves the choice open and is reported
      # apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'FDVAllowUserCert'
        $enforce = $item.'FDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'FDVAllowUserCert'
      allow_existed   = ($null -ne $item.'FDVAllowUserCert')
      enforce         = $item.'FDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'FDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both values go in together. The first alone admits the card without calling
    # for it, and the item would then rest upon each user s own choice.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'FDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -ErrorAction SilentlyContinue
    }
    if ($b.enforce_existed) {
      Set-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -Value $b.enforce -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w tym bloku najbardziej wymagająca infrastrukturalnie
    i warto, żeby aplikacja postawiła to na pierwszym miejscu opisu.
    Pozostałe punkty to wpisy w rejestrze; ten jest projektem
    obejmującym sprzęt, karty i wydawanie certyfikatów.

    Argument wart zachowania dotyczy tego, co karta faktycznie rozdziela.
    Szyfrowanie bez karty broni dysku wyjętego z maszyny. Szyfrowanie
    z kartą broni dodatkowo dysku w maszynie pracującej — bo przejęcie
    sesji przestaje wystarczać. Jest to jedyny punkt w tej rodzinie
    działający przeciwko napastnikowi, który już jest w środku.

    Odnotowuję dwuwartościowość, bo bez niej punkt bywa uznany za
    zrobiony przedwcześnie. Dopuszczenie karty bez jej wymagania zostawia
    decyzję użytkownikowi, a użytkownik wybierze wariant wygodniejszy.
    Sprawdzenie nazywa ten stan osobno i słusznie.
  en: |
    The rule is in this block the most demanding upon the estate, and it is well that the application set that at
    the head of the description. The other items are entries in the registry; this is a work taking in gear, cards
    and the issuing of certificates.

    The argument worth keeping touches what the card truly parts. Enciphering without a card guards a drive taken
    out of the machine. Enciphering with a card guards besides a drive in a machine at work - the taking of a
    session ceasing to be enough. It is the one item of this family that works against an attacker already within.

    I set down the two values, without which the item is at times held done before its time. The admitting of a
    card without the calling for it leaves the decision to the user, and a user will choose the handier variant.
    The check names that state apart, and rightly.
