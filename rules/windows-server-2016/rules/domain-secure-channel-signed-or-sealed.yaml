id: win2016-domain-secure-channel-signed-or-sealed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera zawsze podpisany lub zaszyfrowany
    en: The secure channel to the controller always signed or encrypted
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie żąda, żeby kanał między maszyną a kontrolerem domeny był zawsze
    podpisany albo zaszyfrowany, bez odstępstw.

    Kanał ten nazywa się bezpiecznym, ale sama nazwa niczego nie gwarantuje.
    Bez tego punktu maszyna zgodzi się rozmawiać jawnie, jeżeli druga strona
    tak zaproponuje. Idą tym kanałem rzeczy, przed których ujawnieniem broni
    się wszystko inne: wynik uwierzytelnienia użytkownika, informacja o jego
    przynależności do grup, zmiany hasła konta maszyny.

    Jest to reguła twardsza od dwóch sąsiednich i ta różnica jest jej treścią.
    Tamte mówią „zabezpiecz, jeżeli druga strona potrafi" — a więc zostawiają
    decyzję drugiej stronie. Ta mówi „zabezpiecz albo nie rozmawiaj wcale".
    Różnica ujawnia się dokładnie wtedy, gdy napastnik ustawia się pośrodku
    i podaje za stronę, która nie potrafi.

    Bez tego punktu atak na kanał nie wymaga łamania szyfrowania, tylko
    zgłoszenia braku możliwości. Maszyna wtedy ustępuje, a ustępstwo jest
    ciche i nie zostawia śladu, który ktokolwiek by oglądał.

    Na serwerze 2016 obie strony tej rozmowy — maszyna i kontroler — obsługują
    zabezpieczony kanał od wielu wydań wstecz, więc punkt nie jest żądaniem
    niemożliwego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zejścia kanału do postaci jawnej przez samo zgłoszenie, że inaczej nie
    potrafi — a w tej postaci podsłuch i podmiana są kwestią umiejscowienia,
    nie kryptografii.
  en: |
    The setting demands that the channel between the machine and the domain
    controller always be signed or encrypted, with no exceptions.

    That channel is called secure, but the name alone guarantees nothing. Without
    this item the machine will consent to talk in the clear if the other side
    proposes it. Along that channel travel the very things everything else guards
    against disclosure: the outcome of a user's authentication, word of their group
    membership, changes to the machine account password.

    This is a harder rule than the two beside it, and that difference is its
    substance. Those say "protect it if the other side can" - and so leave the
    decision to the other side. This one says "protect it or do not talk at all".
    The difference shows itself exactly when an attacker places themselves in the
    middle and passes for a side that cannot.

    Without this item an attack on the channel calls for no breaking of encryption,
    only for a declaration of inability. The machine then gives way, and the giving
    way is quiet and leaves no trace anybody would look at.

    On Server 2016 both sides of this conversation - the machine and the controller
    - have supported a protected channel for many releases back, so the item asks
    nothing impossible.

    What an attacker gains while the item goes unmet: the means of dropping the
    channel to the clear by merely declaring an inability to do otherwise - and in
    that form eavesdropping and substitution are a matter of placement rather than
    of cryptography.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia". Na maszynie w domenie złożonej z kontrolerów
    dzisiejszych zmiana nie robi nic widocznego, bo kanał i tak jest
    zabezpieczony — punkt jedynie odbiera możliwość zejścia niżej.

    Sprawdzenie dotyczy wyłącznie tego, co stoi po drugiej stronie. Kontroler
    domeny na systemie sprzed kilkunastu lat, kontroler emulowany przez
    oprogramowanie innego producenta albo relacja zaufania z domeną, której
    nikt od dawna nie dotykał — to są trzy miejsca, w których odmowa rozmowy
    jawnej kończy się brakiem uwierzytelnienia.

    Objaw jest przy tym jednoznaczny i natychmiastowy, co akurat jest zaletą:
    maszyna traci zaufany kanał do domeny, a logowanie kontami domenowymi
    przestaje działać. Nie ma tu cichego pogorszenia rozłożonego w czasie.

    Warto też wiedzieć, że skutek dotyczy wyłącznie tej maszyny. Nie jest to
    zmiana po stronie kontrolera i nie wpływa na inne serwery w domenie.
    Wycofanie jest natychmiastowe.

    Czego to nie psuje: pracy usług lokalnych, kont lokalnych, logowania do
    konsoli, udostępniania plików ani zasad grupy, dopóki kanał działa.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review". On a machine in a domain made up of present-day
    controllers the change does nothing visible, since the channel is protected
    anyway - the item merely takes away the means of dropping lower.

    The review concerns only what stands on the other side. A domain controller on a
    system from a dozen or more years back, a controller emulated by another
    maker's software, or a trust relationship with a domain nobody has touched in
    years - those are the three places where refusing to talk in the clear ends in
    no authentication at all.

    The symptom is unambiguous and immediate, which here is an advantage: the
    machine loses its trusted channel to the domain, and signing in with domain
    accounts stops working. There is no quiet worsening spread over time.

    It is worth knowing too that the effect concerns this machine alone. It is no
    change on the controller's side and does not bear on other servers in the
    domain. Undoing it is immediate.

    What this does not break: the working of local services, local accounts, signing
    in at the console, file sharing, or group policy, so long as the channel works.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
    - network-and-firewall
  what_breaks:
    pl:
      - Kontroler domeny na systemie sprzed kilkunastu lat odmawia zabezpieczonego kanału i maszyna traci uwierzytelnianie domenowe
      - Relacja zaufania z domeną, której dawno nie aktualizowano, przestaje przyznawać dostęp
      - Kontroler emulowany przez oprogramowanie innego producenta może nie obsługiwać żądanego zabezpieczenia
      - Praca usług lokalnych, konta lokalne i logowanie do konsoli pozostają bez zmian
    en:
      - A domain controller on a system from a dozen or more years back refuses a protected channel and the machine loses domain authentication
      - A trust relationship with a domain long unupdated stops granting access
      - A controller emulated by another maker's software may not support the protection demanded
      - The working of local services, local accounts and signing in at the console stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W domenie pracują kontrolery na systemach sprzed kilkunastu lat albo kontrolery emulowane przez oprogramowanie innego producenta
      - Istnieje relacja zaufania z domeną, o której nie wiadomo, czy obsługuje zabezpieczony kanał
    en:
      - The domain runs controllers on systems from a dozen or more years back, or controllers emulated by another maker's software
      - A trust relationship exists with a domain of which it is not known whether it supports a protected channel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'RequireSignOrSeal'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'RequireSignOrSeal'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From here on the machine refuses a channel in the clear instead of giving way
    # to a side that declares it cannot do better.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSignOrSeal' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-encrypt-or-sign-secure-channel-data-always

notes:
  pl: |
    Punkt jest twardą wersją dwóch sąsiednich reguł i to on rozstrzyga.
    Tamte dwie pozwalają zejść niżej, gdy druga strona zgłosi, że nie potrafi;
    ta odbiera taką możliwość. Wdrożenie tamtych bez tej daje zabezpieczenie,
    które napastnik wyłącza jednym komunikatem.

    W raporcie warto pokazywać tę trójkę razem i w tej kolejności: najpierw
    żądanie bezwarunkowe, potem dwa ustawienia opisujące, co się dzieje przy
    rozmowie z kimś, kto potrafi. Sama lista alfabetyczna rozrzuca je po
    raporcie i gubi tę zależność.

    Wynik niespełniony przy braku wartości w rejestrze jest celowy. Zachowanie
    domyślne zależy od wersji systemu i od roli maszyny, więc ustawienie ma być
    zapisane wprost, a nie odziedziczone.
  en: |
    The item is the hard version of the two rules beside it, and it is the one that
    settles matters. Those two allow a drop when the other side declares an
    inability; this one takes that means away. Applying those without this gives a
    safeguard an attacker switches off with a single message.

    In the report the three are worth showing together and in this order: the
    unconditional demand first, then the two settings describing what happens in a
    conversation with somebody who can. An alphabetical list alone scatters them
    through the report and loses that dependency.

    An unmet result where the value is missing from the registry is deliberate. The
    default behaviour depends on the system's version and the machine's role, so the
    setting is to be written outright rather than inherited.
