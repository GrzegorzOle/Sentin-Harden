id: win2016-router-discovery-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Samoczynne wyszukiwanie bramy sieciowej wyłączone
    en: Automatic searching for a network gateway switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania maszynie ustalać bramę domyślną przez nasłuchiwanie
    ogłoszeń rozsyłanych w segmencie sieci.

    Mechanizm pomyślano dla maszyn, które nie mają skąd wziąć adresu bramy.
    Maszyna pyta, kto tu jest routerem, albo czeka na ogłoszenie, i przyjmuje
    pierwszą odpowiedź. Na serwerze sytuacja taka nie zachodzi, bo brama jest
    albo wpisana na stałe, albo podana wraz z adresem przy uruchomieniu.

    Zagrożenie jest tego samego rodzaju co przy przekierowaniach, ale sięga
    dalej. Tam napastnik przestawiał trasę do jednego adresu. Tutaj
    przestawia bramę domyślną, czyli drogę do wszystkiego, co leży poza
    segmentem. Ogłoszenie nie jest uwierzytelniane, więc wystarczy je wysłać
    z dowolnego urządzenia w tym samym segmencie.

    Skutek jest taki, że cały ruch wychodzący maszyny zaczyna przechodzić
    przez urządzenie napastnika. Ten może go czytać, zmieniać albo
    przepuszczać dalej bez zmian, żeby nie wzbudzać podejrzeń — bo z punktu
    widzenia maszyny wszystko działa jak dotąd.

    Warto zauważyć, że napastnik nie musi wygrać z prawdziwą bramą. Wystarczy,
    że ogłosi się w chwili, gdy maszyna pyta, albo że jego ogłoszenie dotrze
    wcześniej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przejęcia całego ruchu wychodzącego maszyny przez ogłoszenie się jako
    brama, bez żadnego uwierzytelnienia.
  en: |
    The setting forbids the machine to establish its default gateway by listening
    for announcements broadcast in the network segment.

    The mechanism was thought up for machines with nowhere to get a gateway address
    from. The machine asks who the router here is, or waits for an announcement, and
    takes the first answer. On a server that situation does not arise, since the
    gateway is either written in permanently or given along with the address at
    startup.

    The danger is of the same kind as with redirects, but it reaches further. There
    the attacker reset the route to one address. Here they reset the default
    gateway, which is to say the road to everything lying outside the segment. The
    announcement is not authenticated, so it is enough to send it from any device in
    the same segment.

    The upshot is that all the machine's outgoing traffic begins passing through the
    attacker's device. They can read it, change it, or pass it on unchanged so as
    not to raise suspicion - since from the machine's point of view everything works
    as before.

    Worth noting that the attacker need not beat the true gateway. It is enough that
    they announce themselves at the moment the machine asks, or that their
    announcement arrives first.

    What an attacker gains while the item goes unmet: the means of taking over all
    the machine's outgoing traffic by announcing themselves as the gateway, with no
    authentication at all.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to klasa nadana ze względu na
    to, co się dzieje, gdy ocena okaże się błędna.

    Na maszynie z bramą wpisaną na stałe zmiana nie robi nic. Na maszynie,
    która bramę faktycznie wyszukuje, zmiana odcina całą łączność poza
    segment — natychmiast i w sposób, który odcina także drogę naprawy, jeśli
    ktoś pracował zdalnie.

    Dlatego sprawdzenie musi poprzedzać zmianę i musi być konkretne: trzeba
    zobaczyć, skąd maszyna ma dziś bramę domyślną. Jeżeli z konfiguracji
    własnej albo z przydziału adresu — zmiana jest bezpieczna. Jeżeli nie
    widać źródła, a brama w tablicy jest — to właśnie przypadek, w którym
    wyszukiwanie działa i zmiana zaboli.

    Sytuacje, w których mechanizm bywa używany: maszyny w segmentach bez
    przydziału adresów, urządzenia wstawione do sieci tymczasowo, segmenty
    z nadmiarową bramą przełączającą się przy awarii. Ostatni przypadek jest
    najtrudniejszy, bo wszystko działa do momentu awarii, a wtedy przełączenie
    nie następuje.

    Objaw jest natychmiastowy i całkowity: maszyna nie dociera nigdzie poza
    własny segment.

    Czego to nie psuje: łączności w obrębie segmentu, bramy wpisanej na
    stałe, bramy podanej przy przydziale adresu, usług lokalnych.

    Bez restartu, ale odzyskanie łączności wymaga dostępu do maszyny.
  en: |
    The class is "needs a planned rollout", and it is a class given on account of
    what happens if the assessment proves wrong.

    On a machine with a gateway written in permanently the change does nothing. On a
    machine that really does search for its gateway, the change cuts off all
    connectivity beyond the segment - at once, and in a way that cuts off the road
    of repair too, if somebody was working remotely.

    The check must therefore come before the change and must be concrete: one has to
    see where the machine gets its default gateway from today. If from its own
    configuration or from the address assignment, the change is safe. If no source
    can be seen while a gateway stands in the table, that is exactly the case in
    which the searching works and the change will hurt.

    Situations in which the mechanism is at times used: machines in segments with no
    address assignment, devices put into a network temporarily, segments with a
    spare gateway that switches over on a failure. The last is the hardest, since
    everything works until the failure, and then the switching over does not happen.

    The symptom is immediate and total: the machine reaches nowhere beyond its own
    segment.

    What this does not break: connectivity within the segment, a gateway written in
    permanently, a gateway given at address assignment, or local services.

    No restart, but regaining connectivity calls for access to the machine.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna faktycznie wyszukująca bramę traci całą łączność poza własny segment, łącznie z drogą naprawy, jeśli ktoś pracował zdalnie
      - Segment z nadmiarową bramą przełączającą się przy awarii działa do momentu awarii, a wtedy przełączenie nie następuje
      - Urządzenia wstawione do sieci tymczasowo, bez przydziału adresów, przestają docierać poza segment
      - Łączność w obrębie segmentu, brama wpisana na stałe i brama podana przy przydziale adresu pozostają bez zmian
    en:
      - A machine that really searches for its gateway loses all connectivity beyond its own segment, the road of repair included if somebody worked remotely
      - A segment with a spare gateway that switches over on a failure works until the failure, and then the switching over does not happen
      - Devices put into a network temporarily, with no address assignment, cease to reach beyond the segment
      - Connectivity within the segment, a gateway written in permanently and a gateway given at address assignment stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, skąd maszyna ma dziś bramę domyślną, a w tablicy tras brama jest
      - Segment korzysta z nadmiarowej bramy przełączającej się przy awarii na podstawie ogłoszeń
      - Zmiana miałaby zostać wprowadzona zdalnie, a brak łączności odciąłby drogę naprawy
    en:
      - It has not been established where the machine gets its default gateway from today, while a gateway stands in the route table
      - The segment uses a spare gateway that switches over on a failure on the strength of announcements
      - The change would be made remotely and a loss of connectivity would cut off the road of repair
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'PerformRouterDiscovery'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'PerformRouterDiscovery'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PerformRouterDiscovery' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Punkt jest cięższy od dwóch sąsiednich mimo tej samej kategorii ryzyka,
    i wynika to z uciążliwości, nie z wagi zagrożenia. Trasowanie źródłowe
    i przekierowania zawodzą częściowo; ten punkt, źle oceniony, odcina
    maszynę całkowicie.

    Ostrzeżenie o odcięciu drogi naprawy powinno być widoczne przy przycisku
    uruchomienia, tak samo jak przy powłoce zdalnej. Są to dwa punkty
    w zestawie serwerowym zdolne odciąć operatora od maszyny w trakcie
    własnego wykonania.

    Reguła zamyka blok trzech ustawień dotyczących tego, skąd maszyna bierze
    wiedzę o drogach w sieci. Wspólna zasada brzmi: droga ma pochodzić
    z konfiguracji, a nie z komunikatu przysłanego przez kogokolwiek
    z segmentu. Aplikacja powinna te trzy punkty pokazywać razem, bo
    pojedynczo wyglądają na drobiazgi, a razem wyrażają jedną decyzję.
  en: |
    The item is heavier than its two neighbours despite the same risk category, and
    that follows from disruption rather than from the weight of the threat. Source
    routing and redirects fail in part; this item, wrongly judged, cuts the machine
    off altogether.

    The warning about cutting off the road of repair should be visible at the run
    button, just as at the remote shell. Those are the two items in the server set
    able to cut the operator off from the machine in the course of its own
    execution.

    The rule closes the block of three settings concerning where the machine gets
    its knowledge of roads in the network from. The shared principle reads: a road
    is to come from configuration, not from a message sent by anybody in the
    segment. The application should show these three items together, since singly
    they look like trifles while together they express one decision.
