id: win10-local-system-computer-identity-for-ntlm

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konto systemowe uwierzytelniane tożsamością maszyny
    en: The system account authenticated by the machine's identity
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że usługi działające na koncie systemowym,
    sięgając po zasób sieciowy, przedstawiają się tożsamością tej maszyny,
    a nie sesją bez uwierzytelnienia.

    Konto systemowe nie ma hasła w zwykłym rozumieniu, więc pierwotnie nie
    miało czym się przedstawić na zewnątrz. Rozwiązaniem było połączenie
    anonimowe: usługa sięgała po zasób jako nikt. Rozwiązaniem obecnym jest
    konto maszyny, które hasło ma i którym da się uwierzytelnić.

    Różnica dla obrony jest dwojaka. Po pierwsze zasób zdalny może
    uprawnienia nadać konkretnej maszynie zamiast wszystkim anonimowym.
    Po drugie dostęp zostaje odnotowany pod nazwą, więc w dzienniku widać,
    kto sięgał — a połączenie anonimowe nie zostawia nazwy.

    Odnotowuję, że reguła nie zamyka drogi, tylko nadaje jej tożsamość.
    Wartość bierze się z tego, że o dostępie da się odtąd decydować
    i da się go przejrzeć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: ruch usług
    systemowych do zasobów sieciowych nieodróżnialny od ruchu anonimowego
    i nieprzypisany do maszyny.
  en: |
    The setting makes services working upon the system account, reaching for a network resource, present
    themselves by this machine's identity rather than by a session without authentication.

    The system account has no password in the ordinary sense, so at first it had nothing to present outwardly.
    The answer was an anonymous connection: the service reached for the resource as nobody. The present-day
    answer is the machine account, which has a password and can authenticate by it.

    The difference to a defence is twofold. First, the remote resource may grant rights to a named machine
    rather than to everybody anonymous. Second, the reach is set down under a name, so it can be seen in the log
    who reached - and an anonymous connection leaves no name.

    I set down that the rule closes no road, it gives the road an identity. Its value comes of the reach being
    from then on something that can be decided upon and looked over.

    What an attacker gains while the item goes unmet: traffic from system services to network resources
    indistinguishable from anonymous traffic and bound to no machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy zasobów zdalnych,
    po które sięgają usługi tej maszyny.

    Jeśli zasób zdalny ma uprawnienia nadane połączeniu anonimowemu,
    a nie kontom maszyn, to po zmianie usługa przedstawi się nazwą,
    dla której uprawnień nie nadano — i dostanie odmowę.

    Jest to przypadek nieoczywisty, bo objaw wystąpi po stronie usługi,
    a nie w pracy użytkownika. Zadanie kopii zapasowej, agent monitorujący
    albo narzędzie inwentaryzacyjne przestanie zapisywać, a użytkownik
    niczego nie zauważy.

    Rozwiązaniem właściwym jest nadanie uprawnień kontu maszyny na zasobie
    zdalnym. Jest to czynność jednorazowa i po niej dostęp jest zarazem
    działający i przypisany.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: pracy użytkownika, logowania, kont domenowych,
    udziałów lokalnych, drukowania, aplikacji uruchamianych przez ludzi.
  en: |
    The class is "needs review", and the review touches the remote resources this machine's services reach for.

    Where a remote resource has its rights granted to an anonymous connection and not to machine accounts, then
    after the change the service will present itself by a name for which no rights were granted - and will be
    refused.

    It is a case that is not obvious, the symptom coming up on the service's side and not in a user's work. A
    backup job, a watching agent or an inventory tool will cease writing, and the user will notice nothing.

    The right answer is to grant the machine account its rights upon the remote resource. It is a one-time act,
    and after it the reach is at once working and bound to a name.

    The change takes hold at once and undoes itself at once.

    What this does not break: a user's work, logging on, domain accounts, local shares, printing, or
    applications started by people.

implementation_consequences:
  impact_areas:
    - remote-management
    - file-sharing
    - legacy-authentication
  what_breaks:
    pl:
      - Usługa sięgająca po zasób zdalny z uprawnieniami nadanymi połączeniu anonimowemu dostaje odmowę
      - Objaw wystąpi po stronie usługi, a nie w pracy użytkownika, więc może zostać zauważony późno
      - Zadanie kopii zapasowej, agent monitorujący albo narzędzie inwentaryzacyjne przestaje zapisywać po cichu
      - Rozwiązaniem jest nadanie uprawnień kontu maszyny na zasobie zdalnym, a nie cofnięcie zmiany
      - Praca użytkownika, logowanie, konta domenowe, udziały lokalne i drukowanie pozostają bez zmian
    en:
      - A service reaching for a remote resource whose rights are granted to an anonymous connection is refused
      - The symptom comes up on the services side and not in a users work, so it may be noticed late
      - A backup job, a watching agent or an inventory tool ceases writing quietly
      - The answer is to grant the machine account its rights upon the remote resource, not to undo the change
      - A users work, logging on, domain accounts, local shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Usługa tej maszyny sięga po zasób zdalny, na którym uprawnienia nadano wyłącznie połączeniu anonimowemu
      - Nie ustalono, po jakie zasoby zdalne sięgają usługi działające na koncie systemowym
    en:
      - A service of this machine reaches for a remote resource whose rights are granted to an anonymous connection alone
      - It has not been established what remote resources the services upon the system account reach for
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'UseMachineId'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'UseMachineId'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where a remote resource grants its rights to an anonymous connection, grant
    # them to this machines account first - the symptom otherwise shows on the
    # services side, quietly, and not in a users work.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseMachineId' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-local-system-to-use-computer-identity-for-ntlm

notes:
  pl: |
    Reguła różni się od pozostałych w bloku tym, że niczego nie zabrania.
    Nadaje tożsamość ruchowi, który dotąd jej nie miał, i dopiero przez to
    czyni go możliwym do przejrzenia i do ograniczenia.

    Warto, żeby aplikacja to powiedziała, bo punkt sam z siebie nie zamyka
    żadnej drogi i przy czytaniu pobieżnym wygląda na neutralny. Jego
    wartość leży w tym, co staje się możliwe później — nadanie uprawnień
    maszynie, odróżnienie jej ruchu w dzienniku.

    Odnotowuję objaw cichy, bo jest tu kosztowniejszy niż sama zmiana.
    Usługa, która przestanie zapisywać, nie zgłosi się do nikogo. Awaria
    wyjdzie na jaw przy najbliższym odtwarzaniu z kopii albo przy przeglądzie
    danych monitoringu, czyli wtedy, gdy jest już droga.
  en: |
    The rule parts from the rest of the block in forbidding nothing. It gives an identity to traffic that had
    none, and only thereby makes it something that can be looked over and bounded.

    It is well that the application say so, the item closing of itself no road and looking, upon a cursory
    reading, neutral. Its value lies in what becomes possible afterwards - the granting of rights to a machine,
    the telling of its traffic apart in a log.

    I set down the quiet symptom, that costing here more than the change itself. A service that ceases writing
    will report itself to nobody. The fault will come to light at the next restoring from a backup, or at a
    review of the watching data - which is to say once it is already dear.
