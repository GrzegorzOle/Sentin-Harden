id: win2016-point-and-print-warning-on-install

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers > Point and Print Restrictions
  title:
    pl: Ostrzeżenie przy instalacji sterownika drukarki sieciowej zachowane
    en: The warning at the installing of a network printer driver kept
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zachowuje ostrzeżenie i prośbę o podniesienie uprawnień
    w chwili, gdy maszyna ma zainstalować sterownik pobrany z serwera
    wydruku.

    Punkt jest warstwą drugą wobec poprzedniego i warto rozumieć, czym się
    od niego różni. Tamten mówi, że bez uprawnień administratora instalacja
    nie nastąpi. Ten mówi, że instalacja nie nastąpi bez wiedzy człowieka —
    nawet wtedy, gdy uprawnienia są.

    Różnica ma znaczenie w dwóch sytuacjach. Pierwsza: ktoś pracuje
    z uprawnieniami administratora i wskazuje drukarkę, nie zastanawiając
    się, że wskazuje przy okazji źródło kodu. Ostrzeżenie zatrzymuje go
    na chwilę i mówi, co się właśnie wydarzy. Druga: poprzednia zasada
    została przestawiona albo nie obowiązuje w danym scenariuszu, a wtedy
    ta zostaje ostatnią przeszkodą.

    Wpis nosi nazwę opisującą zdjęcie ostrzeżenia, więc wartością wymaganą
    jest zero. Jest to wpis, który bywa ustawiany świadomie po to, żeby
    drukarki dodawały się bez pytania — i właśnie dlatego trzeba go
    sprawdzać, a nie zakładać, że stan domyślny się utrzymał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: cichą
    instalację sterownika w chwili wskazania drukarki, bez żadnego
    komunikatu, który mógłby kogoś zatrzymać.
  en: |
    The setting keeps the warning and the request to raise rights at the moment the
    machine is to install a driver fetched from a print server.

    The item is a second layer over the previous one, and it is worth grasping how
    it differs. That one says that without administrator rights the installing will
    not happen. This one says the installing will not happen without a person
    knowing - even where the rights are there.

    The difference matters in two situations. First: somebody works with
    administrator rights and names a printer without pausing to think they are
    naming a source of code along with it. The warning stops them for a moment and
    says what is about to happen. Second: the previous policy has been moved or does
    not hold in a given case, and then this one is the last obstacle.

    The entry bears a name describing the taking away of the warning, so the
    required value is zero. It is an entry at times set deliberately so that
    printers add themselves without asking - and just for that reason it has to be
    checked rather than assumed to have kept its default.

    What an attacker gains while the item goes unmet: a quiet installing of a driver
    the moment a printer is named, with no message at all that might stop somebody.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba to samo co przy regule
    poprzedniej, tylko z innym progiem.

    Na maszynie, na której wdrożono regułę poprzednią, ta nie zmienia
    w praktyce nic: instalacja i tak wymaga administratora, a ostrzeżenie
    dostaje właśnie on.

    Na maszynie, na której poprzedniej reguły nie wdrożono, ta wprowadza
    prośbę o podniesienie uprawnień przy każdym dodaniu drukarki sieciowej.
    Użytkownik bez uprawnień jej nie przejdzie, a użytkownik z uprawnieniami
    zobaczy okno, którego dotąd nie było.

    Rzecz warta wymienienia dotyczy automatyzacji. Skrypt dodający
    drukarki przy logowaniu albo przy nawiązywaniu sesji zdalnej zatrzyma
    się na oknie, którego nikt nie kliknie — a skrypt zatrzymany na oknie
    wygląda jak skrypt wolny, nie jak skrypt zepsuty. Jest to najbardziej
    kłopotliwy objaw tej reguły.

    Czego to nie psuje: drukowania na drukarkach już zainstalowanych,
    kolejek udostępnianych, usług, logowania.

    Wymaga zatrzymania usługi wydruku; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is the same as at the
    previous rule, only at another threshold.

    On a machine where the previous rule has been rolled out this one changes in
    practice nothing: the installing calls for an administrator anyway, and it is
    they who get the warning.

    On a machine where the previous rule has not been rolled out, this one brings in
    a request to raise rights at every adding of a network printer. A user without
    rights will not pass it, and a user with rights will see a window that was not
    there before.

    A thing worth naming concerns automation. A script adding printers at signing in
    or at the establishing of a remote session will stop at a window nobody clicks -
    and a script stopped at a window looks like a slow script rather than a broken
    one. That is this rule's most troublesome symptom.

    What this does not break: printing on printers already installed, shared queues,
    services, or signing in.

    Calls for the print service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
    - remote-desktop
  what_breaks:
    pl:
      - Skrypt dodający drukarki przy logowaniu zatrzyma się na oknie, którego nikt nie kliknie, i będzie wyglądał na wolny, a nie na zepsuty
      - Użytkownik bez uprawnień administratora nie doda drukarki sieciowej, bo nie przejdzie prośby o podniesienie uprawnień
      - Użytkownik z uprawnieniami zobaczy przy każdym dodaniu drukarki okno, którego dotąd nie było
      - Drukowanie na drukarkach już zainstalowanych i kolejki udostępniane pozostają bez zmian
    en:
      - A script adding printers at signing in will stop at a window nobody clicks and will look slow rather than broken
      - A user without administrator rights will not add a network printer, not passing the request to raise rights
      - A user with rights will see at every adding of a printer a window that was not there before
      - Printing on printers already installed and shared queues stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Drukarki są tu dodawane skryptem przy logowaniu albo przy nawiązywaniu sesji i nikt nie kliknie okna ostrzeżenia
      - Maszyna jest serwerem terminali, a użytkownicy dodają sobie drukarki sieciowe bez uprawnień administratora
    en:
      - Printers are added here by a script at signing in or at the establishing of a session and nobody will click a warning window
      - The machine is a terminal server where users add network printers for themselves without administrator rights
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
      $name = 'NoWarningNoElevationOnInstall'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    $name = 'NoWarningNoElevationOnInstall'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoWarningNoElevationOnInstall' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/point-and-print-default-behavior-change

notes:
  pl: |
    Punkt tworzy parę z regułą o aktualizacji sterownika i obie warto
    pokazywać razem, bo różnią się jedynie chwilą, w której pytają.
    Wdrożenie jednej bez drugiej zostawia wariant drugi otwarty, a różnica
    między pierwszą instalacją a aktualizacją jest dla napastnika żadna.

    Objaw w postaci zatrzymanego skryptu jest tu wart osobnej wzmianki.
    Reguła nie zgłasza błędu, tylko czeka — a czekanie w automatyzacji
    bywa gorsze od odmowy, bo nikt go nie zauważa i nikt na nie nie
    reaguje. Warto to zapowiedzieć przed wdrożeniem.

    Wartość wymagana jest zerem, bo nazwa wpisu opisuje zdjęcie
    ostrzeżenia. Jest to kolejny punkt w zestawie, w którym zero oznacza
    stan pożądany, i w raporcie warto to nazwać.
  en: |
    The item makes a pair with the rule about updating a driver, and both are worth
    showing together, differing only in the moment at which they ask. Rolling out
    one without the other leaves the second variant open, and the difference between
    a first installing and an update is, to an attacker, none.

    The symptom of a stopped script deserves a mention of its own here. The rule
    reports no error but waits - and waiting in automation is at times worse than a
    refusal, nobody noticing it and nobody answering it. That is worth foretelling
    before the rollout.

    The required value is zero, the entry's name describing the taking away of the
    warning. It is another item in the set where zero means the wanted state, and in
    the report that is worth naming.
