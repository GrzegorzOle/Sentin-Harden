id: iis-log-directory-off-default-location

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: IIS Logging Recommendations
  title:
    pl: Dzienniki poza domyślną lokalizacją i poza partycją systemową
    en: The logs off the default location and off the system partition

  level: 1
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer zapisuje dzienniki żądań w katalogu, który jest ten sam na każdej
    instalacji i leży na dysku systemowym. Przeniesienie ich gdzie indziej
    załatwia dwie różne sprawy naraz.

    Pierwsza dotyczy ataku. Dziennik jest zapisem tego, co atakujący zrobił,
    więc jest pierwszą rzeczą, którą próbuje usunąć albo przyciąć. Ścieżka
    domyślna jest znana bez szukania — nie trzeba jej odgadywać ani czytać
    z konfiguracji. Przeniesienie nie czyni dziennika nieusuwalnym, ale
    wymusza dodatkowy krok, a każdy dodatkowy krok zostawia ślad i zajmuje
    czas.

    Druga dotyczy eksploatacji i w praktyce bywa ważniejsza. Dziennik rośnie
    proporcjonalnie do ruchu i nikt tego nie zauważa, dopóki nie zabraknie
    miejsca. Gdy leży na partycji systemowej, zapełnienie dysku unieruchamia
    całą maszynę: system przestaje logować użytkowników, zapisywać zdarzenia
    i się aktualizować. Na osobnym dysku ta sama sytuacja kończy się utratą
    dziennika, co jest kłopotem znacznie mniejszym.
  en: |
    The server writes its request logs in a directory that is the same on every
    installation and lies on the system disk. Moving them elsewhere settles two
    different matters at once.

    The first concerns an attack. A log is the record of what an attacker did, so it
    is the first thing they try to remove or trim. The default path is known without
    looking - it need not be guessed at or read out of the configuration. Moving it
    does not make the log unremovable, but it forces a further step, and every
    further step leaves a trace and takes time.

    The second concerns running the thing and in practice often matters more. A log
    grows in proportion to the traffic and nobody notices until the room runs out.
    Where it lies on the system partition, filling the disk disables the whole
    machine - the system stops signing users in, recording events and updating. On a
    separate disk the same situation ends in the loss of the log, which is a far
    smaller trouble.

disruption_description:
  pl: |
    Sama zmiana ścieżki jest natychmiastowa i niewidoczna dla użytkowników
    serwisu. Uderza natomiast we wszystko, co te dzienniki czyta — a to zwykle
    działa gdzieś z boku i przypomina o sobie dopiero wtedy, gdy przestaje
    dostarczać dane.

    Rzeczy do sprawdzenia przed zmianą: zbieranie dzienników do systemu
    centralnego, zadanie kasujące stare pliki, skrypty raportujące ruch oraz
    program antywirusowy, w którym stara ścieżka bywa wykluczona z badania.
    Każde z nich wskazuje ścieżkę zapisaną na sztywno i żadne nie zgłosi
    błędu — po prostu przestaną znajdować pliki. Zbieranie do systemu
    centralnego jest tu najgroźniejsze, bo po cichu przestaje działać
    dokładnie ten mechanizm, który miał świadczyć o zdarzeniach.

    Druga rzecz to uprawnienia do nowego katalogu. Konto usługi zapisującej
    dzienniki musi mieć tam prawo zapisu, inaczej serwer przestanie je
    prowadzić — i zrobi to bez żadnego komunikatu w interfejsie. Nowy katalog
    powinien być przy tym zamknięty dla zwykłych użytkowników, bo dzienniki
    zawierają adresy, nazwy kont i parametry żądań.

    Stare pliki nie przenoszą się same. Zostają tam, gdzie były, i trzeba
    zdecydować, czy je przenieść, czy zostawić do wygaśnięcia.
  en: |
    Changing the path itself is immediate and invisible to the site's users. It
    does strike everything that reads those logs, though - and that usually works
    off to one side and makes itself known only once it stops delivering data.

    Things to check before the change - collection of logs into a central system, a
    job deleting old files, scripts reporting on traffic, and the antivirus program,
    in which the old path is sometimes excluded from scanning. Each of them names a
    path recorded as it stands and none will report an error - they will simply
    stop finding files. Collection into a central system is the most dangerous
    here, because what quietly stops working is precisely the mechanism meant to
    bear witness to events.

    The second thing is permissions on the new directory. The account of the
    service writing the logs must have the right to write there, or the server
    stops keeping them - and does so with no message in the interface at all. The
    new directory should at the same time be closed to ordinary users, since logs
    hold addresses, account names and request parameters.

    Old files do not move themselves. They stay where they were, and it has to be
    decided whether to move them or leave them to expire.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - web-server-services
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Zbieranie dzienników do systemu centralnego przestaje znajdować pliki i robi to bez zgłoszenia błędu
      - Zadanie kasujące stare pliki operuje dalej na starej ścieżce, więc nowe dzienniki rosną bez ograniczenia
      - Skrypty raportujące ruch przestają zwracać dane, choć ruch jest zapisywany
      - Brak prawa zapisu w nowym katalogu sprawia, że serwer przestaje prowadzić dzienniki bez komunikatu w interfejsie
      - Wykluczenia w programie antywirusowym przestają obejmować katalog dzienników, co potrafi spowolnić zapis
      - Stare pliki zostają w poprzedniej lokalizacji i nie przenoszą się same
    en:
      - Collection of logs into a central system stops finding files and does so with no error reported
      - The job deleting old files goes on working on the old path, so the new logs grow without limit
      - Scripts reporting on traffic stop returning data although the traffic is being recorded
      - Without the right to write in the new directory the server stops keeping logs, with no message in the interface
      - Antivirus exclusions stop covering the log directory, which can slow the writing down
      - Old files stay in the previous location and do not move themselves
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny z jednym dyskiem, na których nowa lokalizacja i tak leżałaby na partycji systemowej
      - Środowiska ze zbieraniem dzienników wskazującym ścieżkę domyślną, dopóki nie zostanie ono przestawione
    en:
      - Machines with a single disk, where the new location would lie on the system partition anyway
      - Environments with log collection pointed at the default path, until it has been switched over
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name 'directory' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ([string]::IsNullOrWhiteSpace([string]$value)) { 'MISSING' }
          else {
            # The recorded path holds environment variables, so it is expanded
            # before anything is compared - otherwise the default would never
            # match itself.
            $path = [Environment]::ExpandEnvironmentVariables([string]$value)
            $system = ([string]$env:SystemDrive).TrimEnd('\')
            $default = Join-Path $system 'inetpub\logs\LogFiles'
            $root = ''
            if ($path.Length -ge 2 -and $path[1] -eq ':') { $root = $path.Substring(0, 2) }
            # Two separate faults, reported apart. A path moved off the default
            # but still on the system disk repairs one of them and not the
            # other, and the report should say which.
            if ($path.TrimEnd('\') -ieq $default.TrimEnd('\')) { 'DEFAULT' }
            elseif ($root -ieq $system) { 'ON_SYSTEM_DRIVE' }
            elseif ($path.StartsWith('\\')) { 'ON_SHARE' }
            else { 'AS_REQUIRED' }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $stamp = 'sentin-log-directory-' + (Get-Date -Format 'yyyyMMddHHmmss')
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name 'directory' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    # The recorded form is kept, not the expanded one. Writing an expanded path
    # back would quietly turn a portable entry into one tied to this machine.
    [pscustomobject]@{
      scope  = 'apphost'
      filter = 'system.applicationHost/sites/siteDefaults/logFile'
      name   = 'directory'
      value  = [string]$value
      backup = $stamp
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and took a server configuration backup named $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop

    # The destination is a decision, not a default. Point it at a disk other
    # than the system one; a path on the system drive repairs half the item and
    # the check will say so.
    $target = 'D:\iis-logs'

    $system = ([string]$env:SystemDrive).TrimEnd('\')
    if ($target.Length -ge 2 -and $target.Substring(0, 2) -ieq $system) {
      throw 'The destination lies on the system drive, so the move would not achieve what this item is for. Pick another disk.'
    }
    if (-not (Test-Path $target)) { New-Item -Path $target -ItemType Directory -Force | Out-Null }

    # Without the right to write there the server stops keeping logs and says
    # nothing about it in the interface, so the right is granted before the path
    # is switched rather than after somebody notices the silence.
    $rights = New-Object System.Security.AccessControl.FileSystemAccessRule(
      'NT SERVICE\TrustedInstaller', 'FullControl',
      'ContainerInherit, ObjectInherit', 'None', 'Allow')
    $acl = Get-Acl -Path $target
    $acl.AddAccessRule($rights)
    Set-Acl -Path $target -AclObject $acl

    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name 'directory' -Value $target

    # The files already written stay where they were. Move them or leave them
    # to expire - but point whatever collects them at the new place either way.

  rollback_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ([string]::IsNullOrWhiteSpace([string]$b.value)) {
      throw 'No previous path was recorded, so nothing was restored.'
    }
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name 'directory' -Value $b.value
    # The directory created by the change is left where it is. It holds log
    # files written since, and removing it would destroy the record of exactly
    # the period in which somebody was making changes.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/sites/sitedefaults/logfile/
  - https://learn.microsoft.com/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis

notes:
  pl: |
    Sprawdzenie rozróżnia cztery stany zamiast dwóch: ścieżka domyślna,
    ścieżka przeniesiona ale nadal na dysku systemowym, ścieżka na udziale
    sieciowym oraz stan właściwy. Rozdzielenie ma znaczenie, bo przeniesienie
    z katalogu domyślnego na inny katalog tego samego dysku naprawia połowę
    punktu — utrudnia znalezienie, nie chroni przed zapełnieniem partycji
    systemowej.

    Udział sieciowy zgłaszany jest osobno, bo bywa wyborem świadomym, ale
    wprowadza nową zależność: chwilowa niedostępność udziału oznacza przerwę
    w zapisie dziennika, czyli lukę w zapisie zdarzeń dokładnie wtedy, gdy sieć
    zachowuje się nietypowo.

    Naprawa odmawia zapisu ścieżki na dysku systemowym. Cofnięcie zmiany
    przywraca poprzednią ścieżkę w tej postaci, w jakiej była zapisana —
    ze zmiennymi środowiskowymi, jeśli tam były — i nie usuwa katalogu
    utworzonego przez zmianę, bo leżą w nim dzienniki z okresu, w którym ktoś
    wprowadzał zmiany.
  en: |
    The check distinguishes four states rather than two - the default path, a path
    moved but still on the system disk, a path on a network share, and the wanted
    state. The separation matters, because moving from the default directory to
    another directory on the same disk repairs half the item - it makes the logs
    harder to find and does not protect against the system partition filling up.

    A network share is reported separately, since it is sometimes a deliberate
    choice but introduces a new dependency - a momentary unavailability of the
    share means a break in the writing of the log, which is to say a gap in the
    record of events exactly when the network is behaving unusually.

    The fix refuses to write a path on the system drive. Undoing the change
    restores the previous path in the form in which it was recorded - with
    environment variables, if there were any - and does not remove the directory
    created by the change, because the logs from the period in which somebody was
    making changes lie in it.
