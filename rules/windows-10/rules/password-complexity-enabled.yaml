id: win10-password-complexity-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Wymagania co do budowy hasła włączone
    en: Demands upon a password's make-up switched on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza wbudowane wymagania co do budowy hasła: znaki z trzech
    spośród czterech grup oraz zakaz zawierania w haśle nazwy konta lub
    imienia i nazwiska użytkownika.

    Część tych wymagań jest dziś oceniana ostrożnie i opis nie powinien tego
    ukrywać. Wymuszanie wielkich liter, cyfr i znaków szczególnych daje
    przyrost mniejszy, niż się wydaje, bo ludzie spełniają je w miejscach
    przewidywalnych — wielka litera na początku, cyfra i wykrzyknik na końcu.
    Narzędzia do łamania haseł znają ten wzorzec i biorą go pod uwagę.

    Rzeczywistą wartość niesie druga połowa reguły, o której mówi się rzadko:
    zakaz zawierania w haśle nazwy konta i nazwiska. Zamyka on hasła
    najsłabsze z możliwych, czyli te zbudowane z danych, które napastnik ma
    przed rozpoczęciem — bo nazwę konta ma zawsze.

    Wymaganie to nie zastępuje długości hasła i nie należy go tak
    przedstawiać. Działa jako dolna granica, poniżej której nie da się zejść,
    a nie jako miara siły.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    istnienia haseł zbudowanych wprost z nazwy konta albo z nazwiska
    użytkownika.
  en: |
    The setting switches on the built-in demands upon a password's make-up: characters from three of four groups
    and a ban on the password holding the account's name or the user's own name.

    Part of those demands is today judged warily and the description ought not hide it. Forcing capitals, digits
    and particular marks brings a smaller gain than it seems, people meeting them in foreseeable places - a
    capital at the start, a digit and an exclamation mark at the end. Tools for breaking passwords know that
    pattern and allow for it.

    The real value is carried by the rule's other half, of which little gets said: the ban on the password
    holding the account's name or the user's own. It closes off the weakest passwords to be had, which is those
    built of data an attacker holds before beginning - the account's name they always hold.

    The demand does not stand in for a password's length and ought not be set out as though it did. It works as
    a lower bound beneath which one cannot go, not as a measure of strength.

    What an attacker gains while the item goes unmet: the possibility of passwords built straight out of the
    account's name or the user's own.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", tak jak przy długości hasła i z tego
    samego powodu — skutek pojawia się dopiero przy zmianie hasła.

    Hasła już ustawione zostają nietknięte, nawet jeśli wymagań nie
    spełniają. Wymaganie działa przy następnym ustawieniu hasła i wtedy
    odmowa jest natychmiastowa, z komunikatem mówiącym o niespełnieniu
    wymagań, ale niewskazującym którego.

    Ten brak wskazania jest w praktyce największym kosztem tej reguły.
    Użytkownik próbuje kolejnych haseł i nie wie, czy przeszkadza brak cyfry,
    czy własne nazwisko w haśle. Warto, żeby obsługa znała treść wymagań,
    bo komunikat systemowy jej nie poda.

    Skrypty ustawiające hasła wymagają sprawdzenia tak samo jak przy regule
    o długości. Hasło budowane losowo z samych liter małych zostanie
    odrzucone, a skrypt zwykle zakończy się powodzeniem.

    Czego to nie psuje: haseł już ustawionych, logowania, kont domenowych,
    logowania kodem lub odciskiem palca, usług, sieci, aplikacji.
  en: |
    The class is "needs a planned rollout", as at the length of a password and for the same reason - the
    consequence shows only at a change of password.

    Passwords already set are left untouched, even where they do not meet the demands. The demand works at the
    next setting of a password, and then the refusal is immediate, with a message speaking of demands unmet but
    not naming which.

    That absence of naming is in practice this rule's largest cost. A user tries password after password and
    does not know whether what stands in the way is a missing digit or their own name in the password. It is
    well that the attendance know what the demands hold, the system's message not telling them.

    Scripts setting passwords call for review as at the rule about length. A password built at random out of
    small letters alone will be refused, and the script will as a rule end in success.

    What this does not break: passwords already set, logging on, domain accounts, logging on by a code or a
    fingerprint, services, the network, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypt budujący hasło z samych liter małych dostaje odmowę i zostawia hasło konta niezmienione
      - Komunikat o odmowie mówi o niespełnieniu wymagań, ale nie wskazuje którego, więc szukanie bywa długie
      - Hasło zawierające nazwę konta lub nazwisko użytkownika przestaje dać się ustawić, co bywa zaskoczeniem
      - Hasła już ustawione zostają nietknięte, nawet jeśli wymagań nie spełniają
      - Logowanie, konta domenowe, logowanie kodem lub odciskiem palca oraz praca usług i sieci pozostają bez zmian
    en:
      - A script building a password out of small letters alone gets a refusal and leaves the accounts password unchanged
      - The message of refusal speaks of demands unmet but names none, so the looking takes a while
      - A password holding the accounts name or the users own ceases to be settable, which comes as a surprise
      - Passwords already set are left untouched, even where they do not meet the demands
      - Logging on, domain accounts, logging on by a code or fingerprint and the work of services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Hasła kont lokalnych ustawia skrypt budujący je ze znaków jednej grupy i nie da się go na razie poprawić
      - Na maszynie pracują ludzie, dla których wpisanie znaków szczególnych jest kłopotem, a obsługa nie zna treści wymagań
    en:
      - The passwords of local accounts get set by a script building them of characters from one group and it cannot for now be mended
      - People work on the machine for whom typing particular marks is a trouble and the attendance does not know what the demands hold
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordComplexity\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^PasswordComplexity\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'PasswordComplexity'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Passwords already set stay untouched - the demand works at the next change.
    # The refusal message does not name which demand went unmet, so it is well that
    # the attendance know what they hold before people begin asking.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordComplexity = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordComplexity = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/password-must-meet-complexity-requirements

notes:
  pl: |
    Reguła jest w tym bloku jedyną, przy której uzasadnienie powszechne
    i uzasadnienie rzeczywiste rozchodzą się wyraźnie. Powszechne mówi
    o trzech grupach znaków; rzeczywiste opiera się na zakazie nazwy konta
    w haśle. Warto, żeby aplikacja postawiła to wprost, bo inaczej użytkownik
    oceni regułę po tej jej części, która dziś znaczy najmniej.

    Zestawienie z regułą o długości jest tu istotne. Długość daje przyrost
    mnożony, budowa hasła daje dolną granicę. Obie są potrzebne i żadna nie
    zastępuje drugiej — raport pokazujący tylko jedną z nich wprowadza
    w błąd.

    Odnotowuję, że komunikat systemowy przy odmowie nie mówi, które
    wymaganie nie zostało spełnione. Aplikacja, która wymieni je w opisie
    reguły, oszczędzi obsłudze części zgłoszeń, a jest to jedyne miejsce,
    w którym użytkownik je zobaczy.
  en: |
    The rule is the only one in this block at which the common reasoning and the real one part plainly. The
    common speaks of three groups of character; the real rests on the ban upon the account's name in the
    password. It is well that the application put that outright, else a user will judge the rule by the part of
    it that today means least.

    Setting it beside the rule about length matters here. Length gives a multiplied gain, make-up gives a lower
    bound. Both are needed and neither stands in for the other - a report showing only one of them misleads.

    Worth noting that the system's message at a refusal does not say which demand went unmet. An application
    naming them in the rule's description will spare the attendance part of the requests, and it is the one
    place a user will see them.
