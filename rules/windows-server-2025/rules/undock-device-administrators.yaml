id: win2025-undock-device-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Usuwanie komputera ze stacji dokującej zastrzeżone dla administratorów
    en: Removing the computer from a docking station restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala odłączyć maszynę od stacji dokującej z poziomu
    zalogowanej sesji, bez użycia dźwigni na samej stacji.

    Punkt pochodzi wprost ze świata komputerów przenośnych i na
    serwerze jest w praktyce bezprzedmiotowy. Serwer stoi w szafie albo
    jest maszyną wirtualną; stacji dokującej nie ma ani w jednym, ani
    w drugim przypadku. Warto powiedzieć to wprost, zamiast pozwalać
    czytelnikowi domyślać się, po co ten punkt tu stoi.

    Stoi z dwóch powodów. Pierwszy jest formalny: wykaz praw
    eksportowany z maszyny zawiera tę pozycję niezależnie od sprzętu,
    więc audyt i tak ją widzi i lepiej, żeby wiedział, co o niej
    sądzić. Drugi jest porządkowy: pozycja pozostawiona bez oceny
    figuruje w raporcie jako nieoceniona, a nieoceniona nie jest tym
    samym co niegroźna.

    Wartość obronna sprowadza się więc do spójności konfiguracji.
    Wykaz zawężony do administratorów jest wykazem, który da się
    porównać między maszynami, a odstępstwo od niego jest sygnałem, że
    ktoś tę maszynę konfigurował ręcznie.

    Punkt zawęża wykaz do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    serwerze nic. Punkt należy do porządkowych i tak jest oceniony.
  en: |
    The right allows the machine to be undocked from a docking station from a logged-in session,
    without the lever on the station itself.

    The item comes straight from the world of portable computers and on a server is in practice
    beside the point. A server stands in a rack or is a virtual machine; there is no docking
    station in either case. It is worth saying so outright rather than letting the reader guess
    why the item stands here.

    It stands for two reasons. The first is formal: the list of rights exported from a machine
    holds this entry whatever the hardware, so an audit sees it regardless and had better know
    what to make of it. The second is orderly: an entry left unassessed figures in the report as
    unassessed, and unassessed is not the same as harmless.

    Its worth in defence thus comes down to the consistency of the configuration. A list
    narrowed to administrators is a list that can be set beside another machine's, and a
    departure from it is a sign that somebody configured this machine by hand.

    The item narrows the list to administrators.

    What an attacker gains while the item goes unmet: on a server, nothing. The item belongs
    among the orderly ones and is rated so.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Na serwerze nie ma stacji dokującej, więc nie ma też czynności,
    którą zawężenie mogłoby zatrzymać. Jest to jeden z nielicznych
    punktów w tej paczce, przy którym można to powiedzieć bez
    zastrzeżeń.

    W stanie domyślnym prawo mają na serwerze administratorzy, a na
    części instalacji nikt — pozycja bywa w wykazie nieobecna. Oba
    stany sprawdzenie uznaje za zgodne, bo nieobecność pozycji znaczy
    tu dokładnie to samo co wykaz pusty.

    Odłączanie sprzętu innego rodzaju — nośników wymiennych, kart
    rozszerzeń, urządzeń podłączanych w czasie pracy — nie podlega temu
    prawu i nie jest zmianą dotknięte. Bywa to mylone, bo nazwa punktu
    brzmi ogólniej, niż jest w istocie.

    Skutek w paczce stanowiska roboczego jest inny i tam punkt
    zaliczono do wymagających sprawdzenia. Na serwerze podstawa tamtej
    oceny nie zachodzi.
  en: |
    The change has no known side effects and takes no break.

    There is no docking station on a server, and so no act the narrowing might halt. It is one
    of the few items in this pack where that can be said without reserve.

    In the default state administrators hold the right on a server, and on some installations
    nobody does - the entry is at times absent from the list. The check holds both states
    compliant, an absent entry meaning here exactly what an empty list means.

    The unplugging of hardware of other kinds - removable media, expansion cards, devices
    plugged in while the machine works - does not fall under this right and is untouched by the
    change. That is at times mistaken, the item's name sounding wider than it is in truth.

    The effect in the working station's pack is another, and there the item was counted among
    those needing a check. On a server the ground of that rating does not hold.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Na serwerze nie ma stacji dokującej, więc zawężenie nie zatrzymuje żadnej czynności
      - Odłączanie nośników wymiennych i urządzeń podłączanych w czasie pracy nie podlega temu prawu
      - Nieobecność pozycji w wykazie jest uznawana za stan zgodny na równi z wykazem pustym
      - W paczce stanowiska roboczego ten sam punkt jest oceniony inaczej i jest to celowe
    en:
      - There is no docking station on a server, so the narrowing halts no act
      - The unplugging of removable media and of devices plugged in while the machine works does not fall under this right
      - An entry absent from the list is held compliant on a par with an empty list
      - In the working station's pack the same item is rated otherwise, and that is on purpose
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna nie jest serwerem stojącym w szafie ani maszyną wirtualną, lecz komputerem przenośnym w roli serwera
    en:
      - The machine is neither a racked server nor a virtual machine but a portable computer standing in a server's part
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeUndockPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeUndockPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeUndockPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeUndockPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeUndockPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/remove-computer-from-docking-station

notes:
  pl: |
    Na serwerze punkt jest bezprzedmiotowy w praktyce i jest to
    powiedziane wprost w opisie. Pozostaje w paczce, bo wykaz praw
    eksportowany z maszyny zawiera tę pozycję niezależnie od sprzętu,
    a pozycja nieoceniona nie jest tym samym co niegroźna.

    Nieobecność pozycji w wykazie uznawana jest za stan zgodny na równi
    z wykazem pustym.

    W paczce stanowiska roboczego ten sam punkt zaliczono do
    wymagających sprawdzenia — tam stacja dokująca bywa realna. Różnica
    ocen jest celowa i wynika z roli maszyny, nie z przeoczenia.
  en: |
    On a server the item is beside the point in practice, and that is said outright in the
    description. It stays in the pack because the list of rights exported from a machine holds
    this entry whatever the hardware, and an entry unassessed is not the same as harmless.

    An entry absent from the list is held compliant on a par with an empty list.

    In the working station's pack the same item was counted among those needing a check - there
    a docking station is at times real. The difference of ratings is on purpose and follows from
    the machine's part rather than from an oversight.
