id: win2016-automatic-updates-scheduled-day

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Dzień instalowania aktualizacji ustawiony na codziennie
    en: The day of installing updates set to every day
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wskazuje dzień tygodnia, w którym maszyna instaluje pobrane
    aktualizacje. Wartość wymagana oznacza codziennie.

    Treścią punktu jest długość okna, w którym maszyna ma lukę pobraną,
    opisaną i niezałataną. Instalowanie raz w tygodniu znaczy, że poprawka
    wydana w dzień po tym terminie czeka sześć dni. Instalowanie codziennie
    skraca to okno do jednego dnia.

    Sześć dni brzmi niegroźnie, dopóki nie zestawi się tego z tym, jak
    szybko powstaje narzędzie wykorzystujące świeżo opisaną lukę. Odstęp
    między opublikowaniem poprawki a pojawieniem się gotowego narzędzia
    bywa krótszy niż tydzień, bo sama poprawka pokazuje, gdzie szukać.

    Na serwerze pokusa wyboru jednego dnia jest zrozumiała: łatwiej
    zaplanować jedno okno niż siedem. Warto jednak zauważyć, że dzień
    instalacji nie jest dniem restartu, jeżeli okno restartu jest
    wyznaczone osobno — a wtedy argument o planowaniu przestaje działać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: do sześciu
    dni na maszynie, o której wiadomo, że ma lukę i że poprawka na nią
    istnieje.
  en: |
    The setting names the day of the week on which the machine installs fetched
    updates. The required value means every day.

    The item's substance is the length of the window in which the machine has a gap
    fetched, described and unpatched. Installing once a week means a fix released
    the day after that date waits six days. Installing every day shortens that
    window to one day.

    Six days sounds harmless until set beside how quickly a tool using a freshly
    described gap comes about. The span between a fix being published and a ready
    tool appearing is at times shorter than a week, the fix itself showing where to
    look.

    On a server the temptation to pick one day is understandable: one window is
    easier to plan than seven. Worth noticing, though, that the day of installing is
    not the day of restarting where the restart window is set apart - and then the
    argument from planning stops working.

    What an attacker gains while the item goes unmet: up to six days on a machine
    known to have a gap and known to have a fix for it in existence.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy restartu,
    nie samej instalacji.

    Instalowanie codziennie znaczy również możliwość restartu codziennie,
    o ile nic tego restartu nie ogranicza. Na maszynie, na której restart
    jest wydarzeniem, jest to zmiana warta rozważenia — i rozwiązaniem nie
    jest cofnięcie tego punktu, tylko wyznaczenie okna restartu.

    Rzecz druga to obciążenie. Instalowanie aktualizacji zajmuje procesor
    i dysk, a przy większych poprawkach trwa długo. Siedem okien zamiast
    jednego znaczy siedem takich obciążeń, choć każde zwykle mniejsze.

    Rzecz trzecia dotyczy zespołów maszyn. Gdy wszystkie instalują
    codziennie o tej samej godzinie, restartują się razem — a to bywa
    gorsze niż rzadziej, lecz z rozsunięciem. Odpowiedzią jest rozsunięcie
    godzin, nie dni.

    Czego to nie psuje: usług między instalacjami, logowania, sieci,
    konfiguracji.

    Bez restartu przy samej zmianie ustawienia; natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check concerns the restart rather
    than the installing itself.

    Installing every day also means the possibility of restarting every day, where
    nothing holds that restart back. On a machine where a restart is an event that
    is a change worth weighing - and the answer is not to undo this item but to set
    a restart window.

    The second thing is the load. Installing updates takes processor and disk, and
    with larger fixes it lasts long. Seven windows instead of one means seven such
    loads, though each as a rule smaller.

    The third thing concerns sets of machines. Where all of them install every day
    at the same hour they restart together - and that is at times worse than more
    seldom but spread out. The answer is to spread the hours, not the days.

    What this does not break: services between installings, signing in, the network,
    or the configuration.

    No restart at the change of the setting itself; undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Maszyna może restartować się codziennie, o ile nic tego restartu nie ogranicza, a na serwerze restart bywa wydarzeniem
      - Siedem okien instalacji zamiast jednego oznacza siedem obciążeń procesora i dysku, choć każde zwykle mniejsze
      - Zespół maszyn instalujących codziennie o tej samej godzinie restartuje się razem, co bywa gorsze niż rzadziej z rozsunięciem
      - Usługi między instalacjami, logowanie i sieć pozostają bez zmian
    en:
      - The machine may restart every day where nothing holds that restart back, and on a server a restart is at times an event
      - Seven windows of installing instead of one mean seven loads on processor and disk, though each as a rule smaller
      - A set of machines installing every day at the same hour restarts together, which is at times worse than more seldom and spread out
      - Services between installings, signing in and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna należy do zespołu instalującego aktualizacje w tej samej godzinie i nie rozsunięto godzin instalacji
      - Restart tej maszyny wymaga okna serwisowego, a okna restartu nie wyznaczono osobno
    en:
      - The machine belongs to a set installing updates at the same hour and the hours of installing have not been spread out
      - A restart of this machine calls for a service window, and no restart window has been set apart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'ScheduledInstallDay'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'ScheduledInstallDay'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ScheduledInstallDay' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-wu-settings

notes:
  pl: |
    Punkt jest najmniej ważki w tej trójce i warto to powiedzieć, żeby
    kolejność pracy była czytelna. Bez reguły o włączeniu aktualizacji
    i bez reguły o instalowaniu bez pytania nie znaczy nic — wskazuje dzień
    dla czynności, która i tak nie następuje.

    Częste nieporozumienie dotyczy tego, że wartość „codziennie" bywa
    czytana jako „bez kontroli". Nie jest. Kontrolą jest godzina i okno
    restartu, a nie dzień tygodnia. Rozsunięcie godzin w zespole maszyn
    rozwiązuje ten sam problem, który ktoś próbuje rozwiązać wyborem jednego
    dnia, i nie kosztuje przy tym sześciu dni otwartej luki.

    Wartość „codziennie" jest wyrażona liczbą zero, a nie nazwą dnia,
    i w raporcie warto to tłumaczyć, bo zero łatwo odczytać jako brak
    ustawienia.
  en: |
    The item is the lightest of the three, and that is worth saying so that the
    order of work stays legible. Without the rule switching updates on and the rule
    about installing without asking it means nothing - it names a day for an act
    that does not happen anyway.

    A common misunderstanding is that the value "every day" is read as "without
    control". It is not. The control is the hour and the restart window, not the day
    of the week. Spreading the hours across a set of machines answers the very
    trouble somebody tries to answer by picking one day, and does not cost six days
    of an open gap besides.

    The value "every day" is expressed by the number zero rather than by a day's
    name, and in the report that is worth explaining, zero being easy to read as an
    absent setting.
