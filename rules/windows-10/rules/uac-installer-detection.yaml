id: win10-uac-installer-detection

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wykrywanie instalatorów i pytanie o podniesienie
    en: Installer detection with a question about elevation
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi rozpoznawać programy wyglądające na
    instalatory i pytać o podniesienie uprawnień jeszcze przed ich
    uruchomieniem.

    Rozpoznanie opiera się na przesłankach prostych: nazwa pliku, zawartość
    pola opisu w zasobach, obecność znanych wzorców w kodzie. Nie jest to
    badanie dokładne i nie ma nim być — chodzi o to, żeby program, który
    zaraz zacznie zapisywać do katalogów systemowych, zapytał o to na
    początku, a nie po drodze.

    Wartość reguły bierze się z tego, co dzieje się bez niej. Instalator
    uruchomiony bez uprawnień nie kończy się czystym błędem. Kopiuje część
    plików, zapisuje część wpisów, a przy pierwszym zapisie do miejsca
    chronionego zatrzymuje się albo — gorzej — idzie dalej, pomijając to,
    czego nie mógł zrobić. Zostaje instalacja niepełna, która wygląda na
    udaną.

    Dla bezpieczeństwa liczy się jedno: taka instalacja zostawia pliki
    w miejscach zapisywalnych dla użytkownika, a program pisany pod katalog
    systemowy zaczyna działać z katalogu, do którego każdy może pisać.
    Punkt to zamyka, wymuszając rozstrzygnięcie na początku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalacje
    niepełne, zostawiające pliki programu w miejscach zapisywalnych dla
    konta zwykłego.
  en: |
    The setting bids the system recognise programs that look like installers and ask about elevation before they
    are run at all.

    The recognising rests on plain grounds: the file's name, the contents of the description field in its
    resources, the presence of known patterns in the code. It is not a close examination and is not meant to be
    - the point is that a program about to start writing to system directories should ask about it at the
    beginning rather than along the way.

    The rule's value comes of what happens without it. An installer run without rights does not end in a clean
    error. It copies part of its files, writes part of its entries, and at the first write to a guarded place
    stops, or - worse - goes on, passing over what it could not do. What remains is an incomplete installation
    that looks like a finished one.

    For security one thing counts: such an installation leaves files in places writable by the user, and a
    program written for a system directory begins running from a directory anybody may write to. The item
    closes that by forcing the matter to be settled at the beginning.

    What an attacker gains while the item goes unmet: incomplete installations leaving a program's files in
    places writable by an ordinary account.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest jedna: czy na
    tej maszynie uruchamia się instalatory bez nadzoru.

    Dla człowieka przy ekranie zmiana jest niewidoczna albo wręcz wygodna —
    pytanie pada raz, na początku, zamiast błędu w połowie.

    Kłopot dotyczy wdrożeń automatycznych. Instalator uruchomiony przez
    zadanie albo skrypt, dotąd wykonujący się w ciszy, może teraz trafić na
    pytanie, którego nikt nie potwierdzi. Zadanie skonfigurowane
    z uprawnieniami najwyższymi przejdzie bez zmian; zadanie polegające na
    tym, że instalator sam sobie poradzi, utknie.

    Osobno stoi rozpoznanie fałszywe. Program niebędący instalatorem, ale
    mający w nazwie słowo przypominające instalację, zacznie prosić
    o uprawnienia, choć ich nie potrzebuje. Zdarza się to przy narzędziach
    własnych i przy programach starszych.

    Zmiana wchodzi bez restartu i cofa się natychmiast.

    Czego to nie psuje: programów już zainstalowanych, aktualizacji
    systemowych, pakietów instalowanych przez usługę instalatora, sieci,
    profili.
  en: |
    The class is "needs review", and there is one thing to review: whether installers get run on this machine
    without anybody watching.

    For a person at the screen the change is unseen, or even convenient - the question falls once, at the
    beginning, instead of an error halfway.

    The trouble touches automatic rollouts. An installer run by a task or a script, until now carrying itself
    out in silence, may now meet a question nobody will confirm. A task set up with the highest rights will pass
    unchanged; a task resting on the installer managing by itself will stick.

    A false recognising stands apart. A program that is no installer but carries in its name a word recalling
    installation will begin asking for rights it does not need. That happens with tools of one's own and with
    older programs.

    The change takes hold without a restart and undoes itself at once.

    What this does not break: programs already installed, system updates, packages installed through the
    installer service, the network, or profiles.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - legacy-applications
  what_breaks:
    pl:
      - Instalator uruchamiany przez zadanie lub skrypt bez uprawnień najwyższych trafia na pytanie, którego nikt nie potwierdzi
      - Program niebędący instalatorem, ale mający w nazwie słowo przypominające instalację, zaczyna prosić o uprawnienia
      - Człowiek przy ekranie dostaje pytanie na początku zamiast błędu w połowie instalacji, co jest zmianą na lepsze
      - Programy już zainstalowane, aktualizacje systemowe oraz pakiety instalowane przez usługę instalatora pozostają bez zmian
      - Praca sieci, profile użytkowników i drukowanie pozostają bez zmian
    en:
      - An installer run by a task or script without the highest rights meets a question nobody will confirm
      - A program that is no installer but carries in its name a word recalling installation begins asking for rights
      - A person at the screen gets the question at the beginning instead of an error halfway, which is a change for the better
      - Programs already installed, system updates and packages installed through the installer service stay unchanged
      - The work of the network, users profiles and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Wdrożenia na tej maszynie prowadzą zadania uruchamiające instalatory bez uprawnień najwyższych i bez nadzoru
      - Na maszynie działa narzędzie własne brane za instalator, którego nazwy nie da się na razie zmienić
    en:
      - Rollouts on this machine are led by tasks running installers without the highest rights and without anybody watching
      - A tool of ones own works on the machine that gets taken for an installer and whose name cannot for now be changed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableInstallerDetection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableInstallerDetection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # From this point a program taken for an installer asks about elevation
    # before it starts. Look over the tasks that install without anybody
    # watching - those without the highest rights will stick at the question.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableInstallerDetection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-detect-application-installations-and-prompt-for-elevation

notes:
  pl: |
    Punkt jest piąty w bloku i jako jedyny opiera się na rozpoznaniu
    opartym na przesłankach, a nie na jednoznacznej deklaracji programu.
    Warto, żeby opis to przyznał — reguła bywa oceniana zbyt wysoko właśnie
    dlatego, że brzmi jak zabezpieczenie dokładne.

    Wartość jest realna, ale pośrednia. Reguła nie broni przed instalacją
    złośliwą; wymusza rozstrzygnięcie uprawnień na początku, przez co
    zostaje mniej instalacji niepełnych, a to one zostawiają program
    w katalogu zapisywalnym.

    Odnotowuję, że na maszynach z podpisanymi pakietami instalacyjnymi
    rozpoznanie i tak nie jest potrzebne, bo program deklaruje wymagane
    uprawnienia we własnym manifeście. Reguła dotyczy tego, co manifestu
    nie ma — czyli oprogramowania starszego.
  en: |
    The item is the fifth in the block and the only one resting on a recognising built of grounds rather than on
    a program's plain declaration. It is well that the description own that - the rule gets rated too highly for
    just this reason, that it sounds like a close safeguard.

    Its value is real but indirect. The rule does not guard against a malicious installation; it forces the
    matter of rights to be settled at the beginning, whereby fewer incomplete installations remain, and it is
    those that leave a program in a writable directory.

    Worth noting that on machines with signed installation packages the recognising is not needed anyway, the
    program declaring the rights it calls for in its own manifest. The rule touches what has no manifest, which
    is to say older software.
