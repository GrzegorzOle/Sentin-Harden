id: win2025-ink-workspace-suggested-apps-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Ink Workspace
  title:
    pl: Podpowiadanie aplikacji w obszarze pisma odręcznego wyłączone
    en: Suggestion of applications in the handwriting workspace switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza podpowiadanie aplikacji w obszarze pisma odręcznego —
    listę propozycji do zainstalowania, pobieraną z zewnątrz.

    Kategoria niska i mówię to wprost, zamiast podnosić ją dla powagi.
    Podpowiedź nie uruchamia niczego sama i nie daje napastnikowi żadnej
    drogi. Wartość punktu jest porządkowa, a nie obronna.

    Porządek ma tu jednak konkretną treść. Lista propozycji jest treścią
    pobieraną z sieci i odświeżaną bez udziału użytkownika, a wybór tego, co
    zostanie zaproponowane, nie należy do organizacji. To jest drobny
    przypadek tego samego wzorca, który przy panelu widżetów opisałem jako
    poważny: powierzchnia w interfejsie, która sama z siebie pokazuje cudzą
    treść.

    Druga rzecz to kierunek podpowiedzi. Propozycja instalacji jest
    zaproszeniem do wniesienia na maszynę czegoś, czego nikt nie planował.
    Na serwerze, gdzie zestaw oprogramowania ma być znany i uzasadniony,
    takie zaproszenie jest niepotrzebne niezależnie od tego, co proponuje.

    Warto powiedzieć uczciwie, że na serwerze składnik ten praktycznie nie
    występuje. Punkt zostaje mimo to, bo wyjątki robione „bo to i tak
    nieobecne" są dokładnie tym, przez co lista wyjątków przestaje być
    znana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic wprost —
    ale w interfejsie maszyny pozostaje miejsce pokazujące treść pobraną
    z zewnątrz i zachęcające do instalacji.
  en: |
    The item switches off the suggestion of applications in the handwriting
    workspace - the list of proposals to install, fetched from outside.

    The category is low, and I say so plainly rather than raise it for
    gravity. A suggestion starts nothing by itself and gives an attacker no
    road. The item's value is one of order rather than of defence.

    That order has a concrete content here, though. The list of proposals is
    content fetched from the network and refreshed without the user's
    involvement, and the choice of what gets proposed does not belong to the
    organisation. It is a slight instance of the same pattern I described as
    serious for the widgets panel: a surface in the interface which by itself
    shows somebody else's content.

    The second thing is the direction of the suggestion. A proposal to
    install is an invitation to bring onto the machine something nobody
    planned. On a server, where the body of software is meant to be known and
    justified, such an invitation is unnecessary regardless of what it
    proposes.

    It is worth saying honestly that this component is practically absent
    from a server. The item stays nonetheless, because exceptions made "since
    it is absent anyway" are exactly what stops a list of exceptions from
    being known.

    What an attacker gains while the item goes unmet: nothing directly - but
    a place remains in the machine's interface showing content fetched from
    outside and urging an installation.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i tu naprawdę nie ma czego stracić. Znika lista
    propozycji, a obszar pisma odręcznego — o ile w ogóle jest obecny —
    działa dalej tak samo.

    Czego to nie psuje: samego obszaru pisma odręcznego, pióra, ekranu
    dotykowego, aplikacji już zainstalowanych ani możliwości zainstalowania
    czegokolwiek świadomie. Reguła odbiera zachętę, nie możliwość.

    Rzecz do zapamiętania: ten punkt i odebranie obszarowi dostępu sponad
    ekranu blokady leżą pod tym samym kluczem rejestru i są dwoma osobnymi
    ustawieniami. Tamto ma wagę większą — to jest uzupełnieniem, nie
    zamiennikiem.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption" and here there is truly nothing to lose. The
    list of proposals goes, and the handwriting workspace - if it is present
    at all - works on just the same.

    What this does not break: the handwriting workspace itself, the pen, the
    touch screen, applications already installed, or the ability to install
    anything deliberately. The rule takes away the urging, not the ability.

    Something to remember: this item and the taking away of the workspace's
    access from above the lock screen lie under the same registry key and are
    two separate settings. That one carries more weight - this is a
    completion of it, not a replacement.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Znika lista propozycji aplikacji, a sam obszar pisma odręcznego działa dalej tak samo
      - Pióro, ekran dotykowy i aplikacje już zainstalowane działają bez zmian
      - Reguła odbiera zachętę do instalacji, a nie możliwość zainstalowania czegokolwiek świadomie
      - Punkt i odebranie obszarowi dostępu sponad ekranu blokady leżą pod tym samym kluczem i są dwoma osobnymi ustawieniami
    en:
      - The list of proposed applications goes, and the handwriting workspace itself works on just the same
      - The pen, the touch screen and applications already installed work unchanged
      - The rule takes away the urging to install, not the ability to install anything deliberately
      - This item and the taking away of access from above the lock screen lie under the same key and are two separate settings
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym lista propozycji w obszarze pisma odręcznego jest używanym źródłem narzędzi
    en:
      - The machine is a workstation where the list of proposals in the handwriting workspace is a used source of tools
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The same key holds the item about access from above the lock screen:
      # two separate settings under one path.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
      $name = 'AllowSuggestedAppsInWindowsInkWorkspace'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    $name = 'AllowSuggestedAppsInWindowsInkWorkspace'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list of proposals is content fetched from the network and refreshed
    # without the user's involvement, and what gets proposed is not the
    # organisation's choice. A proposal to install is an invitation to bring in
    # something nobody planned. The rule removes the urging, not the ability.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSuggestedAppsInWindowsInkWorkspace' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-windows-ink-workspace

notes:
  pl: |
    Kategoria niska powiedziana wprost: podpowiedź nie uruchamia niczego
    sama i nie daje napastnikowi żadnej drogi. Wartość jest porządkowa, nie
    obronna.

    Porządek ma jednak treść: lista propozycji jest treścią pobieraną
    z sieci i odświeżaną bez udziału użytkownika, a wybór tego, co zostanie
    zaproponowane, nie należy do organizacji. To drobny przypadek tego
    samego wzorca co panel widżetów.

    Propozycja instalacji jest zaproszeniem do wniesienia na maszynę
    czegoś, czego nikt nie planował — a na serwerze zestaw oprogramowania
    ma być znany i uzasadniony.
  en: |
    The low category said plainly: a suggestion starts nothing by itself and
    gives an attacker no road. The value is one of order, not of defence.

    That order has a content, though: the list of proposals is content
    fetched from the network and refreshed without the user's involvement,
    and what gets proposed is not the organisation's choice. A slight
    instance of the same pattern as the widgets panel.

    A proposal to install is an invitation to bring onto the machine
    something nobody planned - and on a server the body of software is meant
    to be known and justified.
