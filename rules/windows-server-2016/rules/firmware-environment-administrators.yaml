id: win2016-firmware-environment-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana wartości środowiska oprogramowania układowego tylko dla administratorów
    en: Changing firmware environment values restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do zmiany wartości środowiska oprogramowania
    układowego do grupy administratorów lokalnych.

    Chodzi o zmienne przechowywane poza systemem operacyjnym, w pamięci
    oprogramowania układowego maszyny. Rozstrzygają one, co i w jakiej
    kolejności jest uruchamiane przy starcie, a przy włączonym bezpiecznym
    rozruchu również to, czemu maszyna ufa na tym etapie.

    Zmiana tych wartości działa poniżej systemu. Nie obchodzi uprawnień
    plikowych ani zasad grupy, tylko rozstrzyga o tym, co powstanie wcześniej
    niż one. Kto ustawia kolejność rozruchu, ten może wprowadzić własny program
    ładujący, a ten zobaczy dysk, zanim cokolwiek w systemie zdąży go chronić.

    Kategoria wysoka. Atak wymaga dodatkowego warunku — dostępu do maszyny
    i zwykle ponownego uruchomienia — ale jego skutek jest trwały i przeżywa
    ponowną instalację systemu.

    Na serwerze 2016 wartość ma to głównie na maszynach fizycznych. W maszynie
    wirtualnej środowisko rozruchowe należy do platformy wirtualizacji, więc
    skutek jest ograniczony do tego, co platforma wystawia gościowi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    rozstrzygnięcia, co uruchomi się przed systemem operacyjnym, a więc przed
    każdym zabezpieczeniem, które ten system wnosi.
  en: |
    The item limits the right to change firmware environment values to the local
    administrators group.

    The matter concerns variables held outside the operating system, in the
    machine's firmware memory. They settle what is started at boot and in what
    order, and with secure boot on, also what the machine trusts at that stage.

    Changing those values works below the system. It does not go round file
    permissions or group policy; it settles what comes into being earlier than they
    do. Whoever sets the boot order can bring in a loader of their own, and that
    loader will see the disk before anything in the system has had a chance to guard
    it.

    The category is high. The attack needs a further condition - access to the
    machine and usually a restart - but its effect is lasting and outlives a
    reinstallation of the system.

    On Server 2016 this counts mainly on physical machines. In a virtual machine the
    boot environment belongs to the virtualisation platform, so the effect is
    confined to what the platform presents to the guest.

    What an attacker gains while the item goes unmet: the ability to settle what
    starts before the operating system, and so before every safeguard that system
    brings.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Domyślnie uprawnienie ma wyłącznie grupa
    administratorów lokalnych, a zwykła praca systemu go nie dotyka.

    Zmienne środowiska rozruchowego zmienia się przy instalacji systemu,
    przy zmianie dysku rozruchowego i przy aktualizacji oprogramowania
    układowego — czyli przy czynnościach, które i tak wykonuje administrator
    i które i tak wymagają przerwy w pracy.

    Pułapka jest gdzie indziej: narzędzia producenta serwera do aktualizacji
    oprogramowania układowego i zarządzania kartami rozszerzeń bywają
    instalowane jako usługa i uruchamiane na własnym koncie. Takie konto
    warto sprawdzić przed zmianą, choć zwykle ma ono i tak prawa administratora.

    Czego to nie psuje: rozruchu maszyny, bezpiecznego rozruchu, szyfrowania
    dysku, aktualizacji systemu ani pracy sterowników.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". By default the right belongs to the local
    administrators group alone, and the system's ordinary work does not touch it.

    Boot environment variables get changed when the system is installed, when the
    boot disk changes and when firmware is updated - that is, in actions an
    administrator carries out anyway and which call for a break in service anyway.

    The trap lies elsewhere: the server vendor's tools for updating firmware and
    managing expansion cards are sometimes installed as a service and run under an
    account of their own. Such an account is worth checking before the change,
    though it usually holds administrator rights in any case.

    What this does not break: the machine's boot, secure boot, disk encryption,
    system updates, or the work of drivers.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - drivers-and-devices
    - updates-and-servicing
  what_breaks:
    pl:
      - Narzędzie producenta serwera aktualizujące oprogramowanie układowe traci możliwość zapisu, jeżeli działa na koncie spoza grupy administratorów
      - Skrypt ustawiający kolejność rozruchu przed przebudową maszyny zgłasza odmowę
      - Rozruch maszyny, bezpieczny rozruch i szyfrowanie dysku działają bez zmian
      - Aktualizacje systemu i praca sterowników pozostają nietknięte
    en:
      - The server vendor's tool updating firmware loses the ability to write if it runs under an account outside the administrators group
      - A script setting the boot order before a machine is rebuilt reports a refusal
      - The machine's boot, secure boot and disk encryption work unchanged
      - System updates and the work of drivers stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa usługa producenta sprzętu zarządzająca oprogramowaniem układowym na koncie spoza grupy administratorów
    en:
      - A hardware vendor service managing firmware runs on the machine under an account outside the administrators group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemEnvironmentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemEnvironmentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemEnvironmentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # These variables settle what starts before the operating system. The effect of
    # changing them outlives a reinstallation.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSystemEnvironmentPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemEnvironmentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/modify-firmware-environment-values

notes:
  pl: |
    W maszynie wirtualnej znaczenie punktu jest mniejsze, bo środowisko
    rozruchowe gościa jest zarządzane przez platformę. Nie jest jednak zerowe:
    platforma wystawia gościowi część zmiennych, a wpis o bezpiecznym rozruchu
    bywa wśród nich.

    Reguła nie dotyczy odczytu zmiennych, tylko ich zmiany. Odczyt jest
    potrzebny narzędziom inwentaryzacyjnym i pozostaje możliwy.

    Skutek nadużycia tego uprawnienia jest trwały w sposób, jaki rzadko spotyka
    się w ustawieniach systemowych: przeżywa formatowanie dysku i ponowną
    instalację. Stąd kategoria wysoka mimo wąskiego zakresu.
  en: |
    In a virtual machine the item weighs less, because the guest's boot environment
    is managed by the platform. It does not weigh nothing, though: the platform
    presents some variables to the guest, and the secure boot entry is sometimes
    among them.

    The rule does not bear on reading the variables, only on changing them. Reading
    is needed by inventory tools and stays possible.

    The effect of abusing this right is lasting in a way rarely met among system
    settings: it outlives formatting the disk and reinstalling. Hence the high
    category despite the narrow scope.
