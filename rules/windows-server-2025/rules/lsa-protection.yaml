id: win2025-lsa-protection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Ochrona procesu urzędu zabezpieczeń włączona
    en: Protection of the security authority process switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie uruchamia proces odpowiadający za uwierzytelnianie w trybie
    chronionym, w którym inne programy nie mogą zajrzeć do jego pamięci ani
    wstrzyknąć w niego własnego kodu.

    Proces ten przechowuje w pamięci materiał uwierzytelniający kont
    zalogowanych na maszynie: skróty haseł, bilety domenowe, poświadczenia
    kont usługowych. Bez ochrony wystarczy uprawnienie administratora
    lokalnego, żeby ten materiał odczytać w całości — i jest to czynność
    rutynowa, opisana i zautomatyzowana w narzędziach ogólnie dostępnych.

    Na serwerze waży to najwięcej ze wszystkich punktów tej grupy. Serwer
    jest maszyną, na którą logują się administratorzy domenowi, i pamięć
    tego procesu zawiera wtedy materiał sięgający daleko poza tę maszynę.
    Przejęcie jednego serwera z uprawnieniami lokalnymi zamienia się
    w przejęcie poświadczeń, którymi ktoś właśnie się na nim zalogował.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poświadczenia
    wszystkich kont aktywnych na tej maszynie, natychmiast po uzyskaniu na
    niej uprawnień administracyjnych. Jest to dokładnie ten krok, który
    zamienia jedną przejętą maszynę w przejętą domenę, i dlatego kategoria
    jest krytyczna.

    Ochrona nie jest nieprzekraczalna — istnieją drogi jej obejścia przy
    dostępie do jądra systemu. Podnosi jednak koszt z rutyny do operacji
    wymagającej przygotowania, a to na tym poziomie jest różnicą decydującą.
  en: |
    The setting starts the process answering for authentication in a protected mode in which
    other programs can neither look into its memory nor inject their own code into it.

    That process keeps in memory the authenticating material of the accounts signed in on
    the machine: password digests, domain tickets, service accounts' credentials. Without
    protection the right of a local administrator is enough to read that material whole -
    and it is a routine doing, described and automated in generally available tools.

    On a server that weighs the most of all the items of this group. A server is a machine
    domain administrators sign in to, and that process's memory then holds material reaching
    far beyond this machine. The taking of one server with local rights turns into the
    taking of the credentials somebody has just signed in with on it.

    What an attacker gains while the item goes unmet: the credentials of every account
    active on this machine, at once upon gaining administrative rights on it. It is exactly
    the step that turns one taken machine into a taken domain, and hence the category is
    critical.

    The protection is not impassable - there are roads round it with access to the system's
    kernel. It raises the cost, though, from routine to an operation taking preparation, and
    at this level that is the deciding difference.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że proces chroniony przestaje wpuszczać
    do siebie biblioteki, które nie są podpisane w sposób, jakiego wymaga
    ten tryb — a część oprogramowania zabezpieczającego działa właśnie
    przez wstrzyknięcie takiej biblioteki.

    Dotyczy to przede wszystkim rozszerzeń uwierzytelniania: kart
    inteligentnych z własnym dostawcą poświadczeń, uwierzytelniania
    wieloskładnikowego dopinanego do logowania, narzędzi jednokrotnego
    logowania, a także starszego oprogramowania antywirusowego
    i monitorującego. Każde z nich, jeśli nie jest podpisane odpowiednio,
    po prostu przestanie być ładowane.

    Objaw jest poważny i nieoczywisty: logowanie przestaje działać dla
    metody obsługiwanej przez to rozszerzenie, a system nie mówi dlaczego.
    Na serwerze, do którego administrator loguje się kartą, oznacza to
    utratę dostępu — i jest to najważniejszy powód, dla którego ta zmiana
    nie idzie hurtem.

    Ślad po odrzuconych bibliotekach system zapisuje w dzienniku.
    Uruchomienie samego trybu rejestrowania przed właściwym wdrożeniem
    pokazuje, co zostanie odrzucone, bez odrzucania czegokolwiek — i jest
    to droga właściwa wszędzie tam, gdzie serwer ma jedną drogę wejścia.

    Zmiana wymaga restartu systemu i po restarcie nie jest natychmiast
    odwracalna: wyłączenie ochrony wymaga kolejnego restartu.
  en: |
    A knowing rollout is needed because a protected process stops letting in libraries not
    signed in the way that mode takes - and some security software works exactly by
    injecting such a library.

    That concerns above all authentication extensions: smart cards with a credential
    provider of their own, multi-factor authentication pinned to signing in, single sign-on
    tools, and older antivirus and monitoring software as well. Each of them, if not signed
    suitably, will simply stop being loaded.

    The symptom is serious and unobvious: signing in stops working for the method that
    extension serves, and the system does not say why. On a server an administrator signs in
    to with a card that means losing access - and it is the weightiest reason this change
    does not go in bulk.

    The system records a trace of the refused libraries in the log. Starting the recording
    mode alone before the rollout proper shows what will be refused without refusing
    anything - and that is the right road everywhere a server has one road in.

    The change takes a restart of the system and after the restart is not immediately
    reversible: switching the protection off takes a further restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - remote-management
    - boot-and-firmware
  what_breaks:
    pl:
      - Rozszerzenia logowania kartą inteligentną przestają być ładowane, jeśli nie są podpisane odpowiednio
      - Uwierzytelnianie wieloskładnikowe dopięte do logowania może przestać działać
      - Starsze oprogramowanie antywirusowe i monitorujące traci wgląd w proces uwierzytelniania
      - System nie wyjaśnia przyczyny — o odrzuceniu biblioteki mówi dopiero dziennik
    en:
      - Smart card sign-in extensions stop being loaded if they are not signed suitably
      - Multi-factor authentication pinned to signing in may stop working
      - Older antivirus and monitoring software loses its view into the authentication process
      - The system explains no cause - only the log speaks of a library being refused
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Logowanie na serwer odbywa się kartą inteligentną z dostawcą poświadczeń spoza systemu
      - Nie sprawdzono w trybie rejestrowania, które biblioteki zostaną odrzucone
      - Serwer ma jedną drogę wejścia i nie ma dostępu do konsoli sprzętowej
    en:
      - Signing in to the server is done with a smart card with a credential provider from outside the system
      - It has not been checked in the recording mode which libraries will be refused
      - The server has one road in and there is no access to a hardware console
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RunAsPPL'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(1|2)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'RunAsPPL' -ErrorAction SilentlyContinue).'RunAsPPL'
    [pscustomobject]@{
      path        = $path
      name        = 'RunAsPPL'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # One means protection backed by the firmware where the hardware allows it.
    # Two is the same protection without that backing and meets the item as well.
    Set-ItemProperty -Path $path -Name 'RunAsPPL' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection

notes:
  pl: |
    Dopuszczone są dwie wartości. Jedynka włącza ochronę wraz z zapisem
    w oprogramowaniu układowym, dzięki czemu wyłączenie jej przez zwykłą
    zmianę w rejestrze nie zadziała. Dwójka włącza tę samą ochronę bez tego
    zapisu, więc daje się wyłączyć łatwiej. Punkt uznaje obie, ale różnica
    ta jest istotna przy planowaniu wycofania.

    Wycofanie zapisane w tej regule przywraca wartość poprzednią, ale przy
    wariancie z zapisem w oprogramowaniu układowym sama zmiana rejestru może
    nie wystarczyć. Jest to znane ograniczenie i powód, dla którego przed
    wdrożeniem warto wiedzieć, którą wartość się wybiera.

    Ochrona nie chroni przed napastnikiem, który uzyskał dostęp do jądra
    systemu. Czyta się ją razem z punktami o integralności kodu
    i o niepodpisanych sterownikach — one zamykają tamtą drogę.
  en: |
    Two values are admitted. One switches the protection on along with a record in the
    firmware, thanks to which switching it off by an ordinary change in the registry will
    not work. Two switches the same protection on without that record, so it can be switched
    off more easily. The item holds both good, but that difference matters when a rollback
    is planned.

    The rollback recorded in this rule restores the former value, but with the variant
    backed by the firmware a registry change alone may not be enough. That is a known limit
    and the reason it is worth knowing before the rollout which value is being chosen.

    The protection does not guard against an attacker who has gained access to the system's
    kernel. It is read together with the items on code integrity and on unsigned drivers -
    those close that road.
