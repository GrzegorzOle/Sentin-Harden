id: win2025-firmware-environment-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Modyfikowanie wartości środowiska oprogramowania układowego zastrzeżone dla administratorów
    en: Modifying firmware environment values restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala zmieniać wartości przechowywane przez oprogramowanie
    układowe maszyny — czyli ustawienia leżące poniżej systemu
    operacyjnego.

    Poniżej systemu leży kolejność rozruchu, wykaz programów
    rozruchowych i ustawienia rozruchu bezpiecznego. Wszystko to
    rozstrzyga się, zanim jądro zacznie pracować, więc żadne
    zabezpieczenie systemu tego etapu nie pilnuje. Kto zmienia
    ustawienia na tym poziomie, ten przesądza, co zostanie uruchomione
    — a zatem i to, czy zabezpieczenia w ogóle wstaną.

    Zastosowanie napastnika jest dokładnie takie. Dopisanie własnego
    programu rozruchowego daje trwałość przeżywającą ponowną instalację
    systemu. Wyłączenie rozruchu bezpiecznego otwiera drogę sterownikom
    niepodpisanym, a te pracują na poziomie jądra i nie podlegają
    niczemu, co działa wyżej.

    Na serwerze skutek jest dotkliwszy z powodu zdalności. Maszyna,
    która nie wstaje z powodu zmienionej kolejności rozruchu, wymaga
    sięgnięcia po kartę zarządzającą albo po konsolę hosta
    wirtualizacji, a bywa, że po obecność w serwerowni.

    Punkt zawęża wykaz do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałość
    poniżej systemu operacyjnego, przeżywającą ponowną instalację,
    oraz możliwość wyłączenia rozruchu bezpiecznego.
  en: |
    The right allows the values the machine's firmware keeps to be changed - that is, settings
    lying below the operating system.

    Below the system lie the order of boot, the list of boot programs and the settings of secure
    boot. All of that is settled before the kernel begins working, so no guard of the system
    watches that stage. Whoever changes settings at that level settles what will be started -
    and thereby whether the guards come up at all.

    An attacker's use is just that. Adding a boot program of their own gives a persistence that
    outlives a fresh installing of the system. Turning secure boot off opens the road to
    unsigned drivers, and those work at the kernel's level and fall under nothing working above
    it.

    On a server the effect bites harder by reason of remoteness. A machine that does not come up
    for a changed order of boot takes a reach for the management card or for the virtualisation
    host's console, and at times a presence in the server room.

    The item narrows the list to administrators.

    What an attacker gains while the item goes unmet: persistence below the operating system,
    outliving a fresh installing, and the means of turning secure boot off.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc na
    większości serwerów naprawa nie zmienia niczego.

    Ustawienia oprogramowania układowego pozostają takie, jakie są.
    Naprawa dotyczy tego, kto może je zmienić z poziomu uruchomionego
    systemu, a nie wartości bieżących.

    Rozruch maszyny nie jest w żaden sposób dotknięty. Maszyna wstaje
    po zmianie tak samo jak przed nią i jest to zdanie warte
    powtórzenia, bo obawa przed niewstaniem serwera jest tu najczęstszym
    powodem wahania.

    Skutek dotyczy narzędzi, które zapisują wartości oprogramowania
    układowego z poziomu systemu. Na serwerze bywają to narzędzia
    aktualizacji oprogramowania układowego dostarczane przez producenta
    sprzętu — narzędzia te uruchamia się jednak doraźnie i z konta
    administratora, więc skutek bywa zerowy.

    Na maszynie wirtualnej punkt jest zwykle bezprzedmiotowy w praktyce:
    ustawienia rozruchu należą do oprogramowania układowego wirtualnego,
    którym zarządza host, a nie system gościa.

    Objaw, gdyby wystąpił, jest natychmiastowy: narzędzie zgłasza
    odmowę przy próbie zapisu wartości.
  en: |
    The change has no known side effects and takes no break.

    In the default state only administrators hold the right, so on most servers the mending
    changes nothing.

    The firmware's settings stay as they are. The mending bears on who may change them from
    within the running system rather than on the present values.

    The machine's boot is in no way touched. The machine comes up after the change as it did
    before, and that sentence is worth repeating, since fear of the server not coming up is here
    the commonest cause of hesitation.

    The effect concerns tools that write firmware values from within the system. On a server
    those are at times the firmware updating tools the hardware's maker delivers - such tools
    are started as the need arises and under an administrator's account, though, so the effect
    is at times nil.

    On a virtual machine the item is usually beside the point in practice: the boot settings
    belong to the virtual firmware the host manages, not the guest's system.

    The symptom, should it arise, is immediate: the tool reports a refusal at a try to write a
    value.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - drivers-and-devices
    - updates-and-servicing
  what_breaks:
    pl:
      - Narzędzie aktualizacji oprogramowania układowego na koncie spoza grupy administratorów zgłosi odmowę zapisu
      - Rozruch maszyny nie jest dotknięty i serwer wstaje tak samo jak przed zmianą
      - Ustawienia oprogramowania układowego pozostają bez zmiany, bo naprawa nie dotyka wartości bieżących
      - Na maszynie wirtualnej ustawieniami rozruchu zarządza host, więc punkt bywa bezprzedmiotowy
    en:
      - A firmware updating tool under an account outside the administrators' group will report a refusal to write
      - The machine's boot is not touched and the server comes up as it did before the change
      - The firmware's settings stay unchanged, since the mending does not touch the present values
      - On a virtual machine the host manages the boot settings, so the item is at times beside the point
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aktualizacje oprogramowania układowego wykonuje agent producenta sprzętu na koncie spoza grupy administratorów
    en:
      - Firmware updates are made by a hardware maker's agent under an account outside the administrators' group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemEnvironmentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemEnvironmentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemEnvironmentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSystemEnvironmentPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemEnvironmentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/modify-firmware-environment-values

notes:
  pl: |
    Punkt dotyczy warstwy leżącej poniżej systemu operacyjnego,
    a więc poniżej wszystkiego, co system potrafi upilnować. Stąd
    ocena wysoka mimo braku skutków ubocznych.

    Naprawa nie dotyka ustawień rozruchu i nie wpływa na wstawanie
    maszyny. Zmienia wyłącznie to, kto może je zapisać z poziomu
    uruchomionego systemu.

    Na maszynie wirtualnej ustawieniami rozruchu zarządza host
    wirtualizacji, a nie system gościa. Punkt zostaje w paczce, bo
    ta sama paczka obsługuje serwery na sprzęcie własnym, gdzie
    warstwa ta jest realna.
  en: |
    The item bears on a layer lying below the operating system, and so below all the system can
    watch. Thence the high rating despite the want of side effects.

    The mending does not touch the boot settings and does not bear on the machine's coming up.
    It changes only who may write them from within the running system.

    On a virtual machine the virtualisation host manages the boot settings, not the guest's
    system. The item stays in the pack because the same pack serves servers on hardware of their
    own, where that layer is real.
