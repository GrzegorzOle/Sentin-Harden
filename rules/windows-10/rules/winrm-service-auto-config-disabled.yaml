id: win10-winrm-service-auto-config-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Service
  title:
    pl: Automatyczne wystawienie usługi zdalnego zarządzania wyłączone
    en: The setting out of the service of ordering from afar of itself switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania samoczynnego przygotowania maszyny do przyjmowania
    poleceń zdalnych: utworzenia nasłuchu, otwarcia portu i dopisania
    reguły zapory.

    Zastrzeżenie dotyczy nie samego zdalnego zarządzania, tylko tego, że
    maszyna wystawia się sama. Włączona zasada sprawia, że nasłuch
    powstaje bez decyzji o tej konkretnej maszynie, na wszystkich adresach
    objętych zakresem.

    Zagrożeniem jest zasięg. Zakres adresów bywa zapisany szeroko, więc
    nasłuch powstaje także na kartach sieciowych, na których nikt nie
    zamierzał go wystawiać: na łączu do sieci obcej, na interfejsie
    maszyny wirtualnej, na połączeniu przez sieć rozległą.

    Drugim zastrzeżeniem jest reguła zapory. Przygotowanie samoczynne
    dopisuje wyjątek, którego nikt nie zatwierdzał i który nie pojawia
    się w żadnym przeglądzie reguł.

    Odnotowuję, że punkt nie odbiera możliwości zarządzania zdalnego.
    Odbiera samoczynne wystawianie maszyny, zostawiając wystawienie
    świadome.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nasłuch
    zdalnego zarządzania na adresach, których nikt nie wybierał.
  en: |
    The setting forbids the making ready of the machine of itself for the taking in of orders from afar: the
    raising of a listening, the opening of a door and the writing of a rule into the wall of fire.

    The reservation touches not the ordering from afar itself, but this, that the machine sets itself out. The
    policy turned on makes a listening arise with no decision about this particular machine, upon every address
    within the reach set.

    The danger is the reach. The reach of addresses is at times written broadly, so a listening arises also upon
    cards of network where nobody meant to set one out: upon a link to a strange network, upon the face of a
    feigned machine, upon a joining over a far network.

    The second reservation is the rule of the wall of fire. The making ready of itself writes in an exception
    nobody warranted and that shows in no looking over of the rules.

    I set down that the item takes not away the power of ordering from afar. It takes away the setting out of the
    machine of itself and leaves the setting out done knowingly.

    What an attacker gains while the item goes unmet: a listening for the ordering from afar upon addresses nobody
    chose.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    zdalne zarządzanie tą maszyną w ogóle zależy od samoczynnego
    przygotowania.

    Miejscem pierwszym są wdrożenia, w których nasłuch powstaje właśnie
    tą drogą, a nikt go później nie tworzy ręcznie. Po zmianie maszyna
    przestanie odpowiadać, choć usługa będzie działać — i to jest objaw
    najbardziej mylący w całym punkcie.

    Miejscem drugim jest reguła zapory dopisywana samoczynnie. Po
    zmianie trzeba dopisać ją świadomie, zawężając zakres adresów, i to
    jest zysk punktu, a nie jego koszt.

    Odnotowuję, że sama usługa zdalnego zarządzania działa dalej.
    Nasłuch utworzony wcześniej też zostaje — punkt dotyczy tworzenia
    nowego.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: istniejącego nasłuchu, pracy programów, sieci,
    logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether the ordering of this machine from afar
    hangs at all upon the making ready of itself.

    The first place is rollouts in which the listening arises by that very road and nobody afterwards makes one by
    hand. After the change the machine will cease to answer, though the service will work - and that is the sign
    most misleading in the whole item.

    The second place is the rule of the wall of fire written in of itself. After the change it must be written in
    knowingly, with the reach of addresses narrowed, and that is the item's gain and not its cost.

    I set down that the service of ordering from afar works on. A listening raised earlier stays as well - the
    item touches the raising of a new one.

    The consequence shows at once, with no restart.

    What this does not break: a listening already there, the work of programs, the network, logging on, or
    printing.

implementation_consequences:
  impact_areas:
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna przestanie odpowiadać na zdalne zarządzanie, choć usługa będzie działać
      - Jest to objaw najbardziej mylący w całym punkcie, bo usługa wygląda na sprawną
      - Regułę zapory trzeba będzie dopisać świadomie, zawężając zakres adresów
      - Świadome dopisanie reguły jest zyskiem punktu, a nie jego kosztem
      - Istniejący nasłuch, praca programów, sieć, logowanie i drukowanie pozostają bez zmian
    en:
      - The machine will cease to answer the ordering from afar, though the service will work
      - That is the sign most misleading in the whole item, the service looking sound
      - The rule of the wall of fire will have to be written in knowingly, with the reach of addresses narrowed
      - The knowing writing in of the rule is the item s gain and not its cost
      - A listening already there, the work of programs, the network, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nasłuch zdalnego zarządzania powstaje na tej maszynie wyłącznie tą drogą i nikt nie tworzy go ręcznie
    en:
      - The listening for the ordering from afar arises upon this machine by that road alone and nobody makes one by hand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowAutoConfig'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowAutoConfig'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAutoConfig' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

notes:
  pl: |
    Reguła daje objaw wyjątkowo mylący i warto, żeby aplikacja uprzedziła
    o nim wprost: maszyna przestaje odpowiadać, choć usługa działa.
    Szukanie przyczyny idzie wtedy w stronę usługi, a nie w stronę
    nasłuchu.

    Argument wart postawienia dotyczy zasięgu. Zakres adresów w zasadzie
    bywa zapisany szeroko, więc nasłuch powstaje także na łączu do sieci
    obcej i na interfejsie maszyny wirtualnej — tam, gdzie nikt go nie
    zamierzał wystawiać.

    Odnotowuję regułę zapory dopisywaną samoczynnie. Wyjątek, którego
    nikt nie zatwierdzał, nie pojawia się w przeglądzie reguł, a właśnie
    przeglądy mają wyłapywać otwarte drogi.
  en: |
    The rule gives a sign uncommonly misleading, and it is well that the application forestall it outright: the
    machine ceases to answer though the service works. The seeking of the cause then goes toward the service and
    not toward the listening.

    The argument worth putting touches the reach. The reach of addresses in the policy is at times written
    broadly, so a listening arises also upon a link to a strange network and upon the face of a feigned machine -
    where nobody meant to set one out.

    I set down the rule of the wall of fire written in of itself. An exception nobody warranted shows in no
    looking over of the rules, and it is just such lookings over that are to catch open roads.
