id: win2016-winhttp-proxy-autodiscovery-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa automatycznego wyszukiwania pośrednika sieciowego wyłączona
    en: The service automatically searching for a network proxy disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa wyszukuje w sieci pośrednika, przez którego maszyna ma wychodzić
    do internetu, i pobiera od niego plik z regułami kierowania ruchu.

    Wyszukiwanie odbywa się pytaniem rozesłanym po sieci — maszyna pyta,
    kto jest pośrednikiem, i przyjmuje pierwszą odpowiedź, jaka przyjdzie.
    Nie ma tu żadnego sprawdzenia, czy odpowiadający ma do tego prawo.
    Wystarczy być w tej samej sieci i odpowiedzieć szybciej niż ten, kto
    powinien.

    Skutek udanej odpowiedzi jest daleko poważniejszy, niż wygląda. Kto
    zostanie uznany za pośrednika, ten dostaje cały ruch wychodzący tej
    maszyny — może go czytać, zmieniać i przekierowywać. Plik z regułami
    kierowania jest przy tym wykonywalny w swojej naturze, więc napastnik
    nie tylko wskazuje trasę, ale i steruje nią według własnego zapisu.

    Jest to jedna z nielicznych dróg, w których napastnik nie musi
    atakować maszyny — wystarczy, że odpowie na jej pytanie. Droga znana
    od dawna, wielokrotnie używana i nadal skuteczna wszędzie tam, gdzie
    pytanie nadal pada.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: cały ruch
    wychodzący tej maszyny, uzyskany przez samo odpowiedzenie na jej
    pytanie o pośrednika.
  en: |
    The service seeks out on the network a proxy through which the machine is to go out
    to the internet, and fetches from it a file with the rules for steering traffic.

    The seeking is done by a question sent over the network - the machine asks who the
    proxy is and takes in the first answer that comes. There is here no checking whether
    the one answering has any right to. It is enough to be on the same network and to
    answer faster than the one who should.

    The upshot of a successful answer is far graver than it looks. Whoever is taken for
    the proxy gets all this machine's outgoing traffic - they may read it, change it and
    redirect it. The file with the steering rules is besides executable in its nature,
    so the attacker not only names a route but steers along it by their own writing.

    It is one of the few roads on which an attacker need not attack the machine - it is
    enough that they answer its question. A road long known, used many times over and
    still telling wherever the question is still put.

    What an attacker gains while the item goes unmet: all this machine's outgoing
    traffic, got by merely answering its question about a proxy.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo w sieci z pośrednikiem
    wyłączenie tej usługi odcina maszynę od świata zewnętrznego.

    Rozstrzyga jedno pytanie: czy ta sieć ma pośrednika i czy maszyna
    znajduje go właśnie tą drogą. Jeżeli tak, wyłączenie usługi znaczy
    utratę dostępu wychodzącego dla wszystkiego, co korzysta z pośrednika
    znalezionego automatycznie.

    Lista dotkniętych składników jest dłuższa, niż się wydaje, i to jest
    właściwa trudność tego punktu. Aktualizacje systemu, sprawdzanie
    odwołania certyfikatów, usługi w tle sięgające na zewnątrz, część
    agentów nadzoru — wszystkie one pytają o pośrednika tą samą drogą
    i wszystkie stracą go naraz.

    Objawy są przy tym rozproszone i niepodobne do siebie. Aktualizacje
    przestają się pobierać bez wyraźnego błędu, sprawdzanie certyfikatów
    zaczyna trwać długo i kończyć się przeterminowaniem, agent milknie.
    Nikt nie łączy tych trzech rzeczy ze sobą, bo nic ich pozornie nie
    wiąże.

    Droga wyjścia jest prosta i należy ją przejść przed wykonaniem, a nie
    po: pośrednika wpisuje się wprost w konfiguracji, zamiast pozwalać go
    szukać. Reguła nie odbiera wtedy niczego.

    Czego to nie psuje: ruchu wewnątrz sieci, udziałów, uwierzytelniania,
    pulpitu zdalnego, zarządzania zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", since on a network with a proxy switching
    this service off cuts the machine off from the outer world.

    One question settles it: whether this network has a proxy and whether the machine
    finds it by just this road. If so, switching the service off means a loss of outgoing
    access for everything using a proxy found automatically.

    The list of components touched is longer than it seems, and that is this item's real
    difficulty. System updates, the checking of certificate revocation, background
    services reaching outward, some monitoring agents - all of them ask about a proxy by
    the same road and all will lose it at once.

    The symptoms are for all that scattered and unlike one another. Updates stop being
    fetched with no clear error, the checking of certificates begins to take long and to
    end in a timeout, the agent falls silent. Nobody ties those three things together,
    seemingly nothing binding them.

    The way out is a simple one and should be walked before execution rather than after:
    the proxy is entered outright in the configuration instead of being left to be sought.
    The rule then takes nothing away.

    What this does not break: traffic inside the network, shares, authentication, the
    remote desktop, or remote management.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
    - legacy-applications
  what_breaks:
    pl:
      - Aktualizacje systemu przestają się pobierać, zwykle bez wyraźnego błędu wskazującego przyczynę
      - Sprawdzanie odwołania certyfikatów zaczyna trwać długo i kończyć się przeterminowaniem
      - Agenci nadzoru sięgający na zewnątrz przez pośrednika milkną, a objawy tych trzech rzeczy pozornie nic nie wiąże
      - Ruch wewnątrz sieci, udziały, uwierzytelnianie i pulpit zdalny pozostają bez zmian
    en:
      - System updates stop being fetched, as a rule with no clear error pointing at the cause
      - The checking of certificate revocation begins to take long and to end in a timeout
      - Monitoring agents reaching outward through a proxy fall silent, and seemingly nothing binds those three symptoms
      - Traffic inside the network, shares, authentication and the remote desktop stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Sieć ma pośrednika, a maszyna znajduje go automatycznie i nie wpisano go wprost w konfiguracji
      - Aktualizacje i sprawdzanie certyfikatów na tej maszynie wychodzą wyłącznie przez pośrednika znalezionego tą drogą
    en:
      - The network has a proxy, the machine finds it automatically and it has not been entered outright in the configuration
      - Updates and the checking of certificates on this machine go out solely through a proxy found by this road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinHttpAutoProxySvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'WinHttpAutoProxySvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Components reaching outward through a proxy found this way lose it.
    # Enter the proxy explicitly before running, not afterwards.
    Stop-Service -Name 'WinHttpAutoProxySvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinHttpAutoProxySvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'WinHttpAutoProxySvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winhttp/winhttp-autoproxy-api

notes:
  pl: |
    Punkt jest w całym bloku najlepszym przykładem zestawienia, dla którego
    istnieją dwie osie. Zysk jest duży i konkretny, koszt jest duży
    i konkretny, a rozstrzyga jedna okoliczność lokalna.

    Rzecz, którą aplikacja powinna zrobić tutaj lepiej niż gdziekolwiek
    indziej, to pokazanie drogi wyjścia razem z ostrzeżeniem. Punkt ten
    nie jest wyborem między bezpieczeństwem a łącznością — jest wyborem
    między szukaniem pośrednika a wpisaniem go. Opis, który mówi tylko
    o skutkach, prowadzi do odpuszczenia punktu, którego odpuszczać nie
    trzeba.

    Rozproszenie objawów warto wymienić z nazwy, bo jest to najkosztowniejsza
    część tej zmiany. Trzy niezwiązane pozornie awarie, z których żadna nie
    wskazuje przyczyny, potrafią zająć więcej czasu niż całe wdrożenie
    benchmarku.
  en: |
    The item is in the whole block the best example of a pairing for which the two axes
    exist. The gain is large and definite, the cost is large and definite, and one local
    circumstance settles it.

    What the application should do better here than anywhere else is to show the way out
    together with the warning. This item is not a choice between security and
    connectivity - it is a choice between seeking a proxy and entering one. A description
    speaking only of consequences leads to an item being let go that need not be.

    The scattering of symptoms is worth naming outright, being the costliest part of this
    change. Three seemingly unrelated failures, none of which points at the cause, can
    take up more time than the whole rollout of the benchmark.
