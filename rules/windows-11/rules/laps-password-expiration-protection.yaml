id: win11-laps-password-expiration-protection

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Przedłużanie ważności hasła lokalnego administratora ponad zasadę zablokowane
    en: Prolonging the local administrator password's term beyond the policy blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pilnuje, żeby termin ważności hasła lokalnego administratora
    zapisany w katalogu nie mógł być odleglejszy niż wynika z zasady.

    Bez tego zabezpieczenia mechanizm losujący hasła ma dziurę, która wygląda
    niewinnie i właśnie dlatego jest groźna. Termin następnej zmiany hasła
    jest zapisany w katalogu jako zwykły atrybut. Kto może ten atrybut
    zmienić, może przesunąć termin daleko w przyszłość — a wtedy hasło,
    które właśnie poznał, pozostanie ważne tak długo, jak sobie ustawi.

    Znaczy to, że cała wartość mechanizmu może zostać zniesiona bez łamania
    czegokolwiek. Hasła są dalej losowe i różne na każdej maszynie, tylko
    przestają się zmieniać tam, gdzie komuś na tym zależy. Raport pokaże
    mechanizm jako działający.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałość.
    Jednorazowy odczyt hasła zamienia się w dostęp bezterminowy, a ślad po
    tym jest wyłącznie w atrybucie, w który nikt nie zagląda.

    Z ustawieniem włączonym maszyna sprawdza termin sama i skraca go, gdy
    okaże się dłuższy niż dopuszcza zasada. Przesunięcie terminu przestaje
    cokolwiek dawać.
  en: |
    The setting sees to it that the term of the local administrator password's validity
    recorded in the directory cannot be more distant than the policy provides.

    Without that safeguard the mechanism choosing passwords at random has a hole that looks
    innocent and is dangerous for that very reason. The term of the next password change is
    recorded in the directory as an ordinary attribute. Whoever can change that attribute
    can push the term far into the future - and then the password they have just learnt
    will stay valid as long as they set it to.

    That means the whole value of the mechanism can be undone without breaking anything.
    The passwords are still random and different on each machine, they merely stop changing
    where somebody cares about it. The report will show the mechanism as working.

    What an attacker gains while the item goes unmet: permanence. A single reading of the
    password turns into access without term, and the only trace of it is in an attribute
    nobody looks into.

    With the setting switched on the machine checks the term itself and shortens it where
    it proves longer than the policy allows. Pushing the term stops giving anything.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji i nie zmienia sposobu pracy.

    Hasło lokalnego administratora jest zmieniane tak jak dotąd, w rytmie
    wynikającym z zasady. Odczyt hasła z katalogu działa bez zmiany.

    Jedyny przypadek, w którym coś się zmienia, to maszyna z terminem
    przesuniętym ręcznie w przyszłość. Tam po wdrożeniu termin zostanie
    skrócony i hasło zmieni się wcześniej, niż ktoś zaplanował. Jest to
    dokładnie ten skutek, dla którego reguła istnieje.

    Zmiana nie wymaga restartu i cofa się natychmiast.
  en: |
    The change takes away no function and alters no way of working.

    The local administrator's password is changed as until now, at the rhythm the policy
    provides. Reading the password from the directory works unchanged.

    The one case in which anything changes is a machine with the term pushed forward by
    hand. There, after the rollout, the term will be shortened and the password will change
    earlier than somebody planned. That is exactly the effect for which the rule exists.

    The change takes no restart and reverses at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Termin zmiany hasła przesunięty ręcznie w przyszłość zostaje skrócony
      - Hasło na takiej maszynie zmieni się wcześniej, niż ktoś zaplanował
      - Odczyt hasła z katalogu działa bez zmiany
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - A password change term pushed forward by hand is shortened
      - The password on such a machine will change earlier than somebody planned
      - Reading the password from the directory works unchanged
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych konfiguracji, na których ta zmiana byłaby błędem
    en:
      - There are no known configurations on which this change would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordExpirationProtectionEnabled'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordExpirationProtectionEnabled' -ErrorAction SilentlyContinue).'PasswordExpirationProtectionEnabled'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordExpirationProtectionEnabled'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordExpirationProtectionEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Reguła ma sens wyłącznie razem z tą, która wskazuje miejsce
    przechowywania hasła. Osobno nie ma czego pilnować.

    Punkt jest przykładem zabezpieczenia drugiego rzędu: nie chroni hasła,
    tylko chroni mechanizm chroniący hasło. Takie punkty bywają pomijane
    jako drobiazg, a są dokładnie tym miejscem, w którym mechanizm daje się
    wyłączyć od środka, nie pozostawiając śladu w raporcie.

    Wszystkie ustawienia tego mechanizmu leżą w jednym kluczu, więc
    wycofanie jednego nie rusza pozostałych.

    Brak wartości nie jest stanem zgodnym, bo domyślnie termin da się
    przesunąć dowolnie daleko.
  en: |
    The rule makes sense only together with the one naming the place where the password is
    kept. Apart, it has nothing to see to.

    The item is an instance of a second-order safeguard: it guards not the password but the
    mechanism guarding the password. Such items are sometimes passed over as a trifle, and
    they are exactly the place where a mechanism can be switched off from within, leaving
    no trace in the report.

    All the settings of that mechanism lie in one key, so rolling one back does not disturb
    the rest.

    A missing value is not a compliant state, since by default the term can be pushed
    arbitrarily far.
