id: win10-bluetooth-audio-gateway-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa bramy dźwiękowej łączności bliskiego zasięgu wyłączona
    en: The gateway service for sound over joining of short reach switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przenoszącą dźwięk przez łączność
    bezprzewodową bliskiego zasięgu — słuchawki, głośniki i zestawy do
    rozmów.

    Jest to warstwa węższa niż obsługa samej łączności. Nie odpowiada za
    przyłączanie myszy ani za przenoszenie plików, tylko za tę jedną
    rzecz: strumień dźwięku w obie strony.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Droga wejścia
    przez dźwięk nie istnieje, a usługa nie przyjmuje poleceń ani nie
    przenosi plików.

    Znaczenie ma natomiast to, że zestaw do rozmów obejmuje mikrofon.
    Urządzenie przyłączone bez kabla i zapamiętane przez maszynę bywa
    później przyłączane samo, bez udziału użytkownika, a mikrofon nie
    przestaje być mikrofonem dlatego, że leży w szufladzie.

    Odnotowuję, że punkt ma sens przede wszystkim jako uzupełnienie
    wyłączenia całej łączności bliskiego zasięgu. Wdrożony sam zdejmuje
    dźwięk, zostawiając resztę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przyłączany
    samoczynnie mikrofon w urządzeniu poza polem widzenia użytkownika.
  en: |
    The setting switches off the service carrying sound over the wireless joining of short reach - listening
    pieces, speakers and sets for speech.

    It is a narrower layer than the backing of the joining itself. It answers not for the attaching of a mouse nor
    for the carrying of files, but for that one thing: a stream of sound both ways.

    The grading is low and the item is to be put forward as such. A road in through sound there is none, and the
    service takes no orders and carries no files.

    What has weight, however, is that a set for speech takes in a speaking piece. A thing attached with no cable
    and held in the machine's memory is later at times attached of itself, with no part taken by the user, and a
    speaking piece ceases not to be one for lying in a drawer.

    I set down that the item has its sense above all as the filling out of the switching off of the whole joining
    of short reach. Rolled out alone it takes the sound and leaves the rest.

    What an attacker gains while the item goes unmet: a speaking piece attached of itself in a thing beyond the
    user's sight.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie jest tu krótkie i sprowadza
    się do jednego pytania: czy ktoś na tej maszynie używa słuchawek bez
    kabla.

    Miejscem pierwszym są spotkania. Osoba je prowadząca traci zestaw do
    rozmów i musi wrócić do sprzętu przewodowego albo do wbudowanego
    mikrofonu maszyny.

    Miejscem drugim są głośniki bez kabla używane do odtwarzania. Skutek
    jest mniej dotkliwy, ale widoczny od razu.

    Odnotowuję, że sprzęt wejściowy — mysz i klawiatura — działa dalej.
    Ta usługa odpowiada wyłącznie za dźwięk, więc wyłączenie jej nie
    odcina użytkownika od stanowiska, w przeciwieństwie do punktu
    o całej łączności.

    Skutek jest widoczny dla użytkownika natychmiast.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: myszy i klawiatury bez kabla, przenoszenia
    plików, sieci, drukowania, logowania, pracy programów.
  en: |
    The class is "needs review", and the review is here short and comes to one question: whether anybody upon this
    machine uses listening pieces with no cable.

    The first place is meetings. Whoever holds them loses their set for speech and must go back to corded gear or
    to the speaking piece built into the machine.

    The second place is speakers with no cable used for the playing of sound. The upshot is less keenly felt but
    is seen at once.

    I set down that gear of entry - mouse and keyboard - works on. This service answers for sound alone, so its
    switching off cuts no user off from their station, unlike the item about the whole joining.

    The consequence is plain to the user at once.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: mouse and keyboard with no cable, the carrying of files, the network, printing,
    logging on, or the work of programs.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Słuchawki i zestawy do rozmów bez kabla przestaną przenosić dźwięk
      - Osoba prowadząca spotkania wróci do sprzętu przewodowego albo do mikrofonu wbudowanego w maszynę
      - Głośniki bez kabla używane do odtwarzania przestaną działać
      - Mysz i klawiatura bez kabla działają dalej, bo ta usługa odpowiada wyłącznie za dźwięk
      - Przenoszenie plików, sieć, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - Listening pieces and sets for speech with no cable will cease to carry sound
      - Whoever holds meetings will go back to corded gear or to the speaking piece built into the machine
      - Speakers with no cable used for the playing of sound will cease to work
      - A mouse and a keyboard with no cable work on, this service answering for sound alone
      - The carrying of files, the network, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Osoba pracująca przy tej maszynie prowadzi spotkania w zestawie do rozmów bez kabla
    en:
      - Whoever works at this machine holds meetings in a set for speech with no cable
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\BTAGService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\BTAGService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'BTAGService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'BTAGService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'BTAGService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/bluetooth/

notes:
  pl: |
    Reguła jest węższa od punktu o całej łączności bliskiego zasięgu
    i warto, żeby aplikacja pokazała je razem. Wdrożona sama zdejmuje
    dźwięk i nie rusza myszy ani klawiatury, więc nie grozi odcięciem
    użytkownika od stanowiska.

    Argument wart zachowania dotyczy mikrofonu. Zestaw do rozmów to nie
    tylko słuchawki — to także mikrofon w urządzeniu, które maszyna
    zapamiętała i potrafi przyłączyć samoczynnie, także wtedy, gdy leży
    poza polem widzenia użytkownika.

    Odnotowuję niską ocenę uczciwie. Droga wejścia przez dźwięk nie
    istnieje, a wartość punktu polega na zdjęciu jednej usługi
    i zamknięciu samoczynnego przyłączania mikrofonu.
  en: |
    The rule is narrower than the item about the whole joining of short reach, and it is well that the application
    show them together. Rolled out alone it takes the sound and touches neither mouse nor keyboard, so it
    threatens no cutting off of the user from their station.

    The argument worth keeping touches the speaking piece. A set for speech is not listening pieces alone - it is
    also a speaking piece in a thing the machine has held in memory and can attach of itself, even while it lies
    beyond the user's sight.

    I set down the low grading honestly. A road in through sound there is none, and the item's worth lies in the
    taking away of one service and the shutting of the attaching of a speaking piece of itself.
