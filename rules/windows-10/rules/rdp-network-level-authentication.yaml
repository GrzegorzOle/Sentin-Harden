id: win10-rdp-network-level-authentication

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services
  title:
    pl: Uwierzytelnianie na poziomie sieci wymagane dla pulpitu zdalnego
    en: Warranting at the level of the network called for by the desk from afar
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby użytkownik uwierzytelnił się, zanim maszyna
    zestawi pełną sesję pulpitu zdalnego.

    Bez tego wymagania kolejność jest odwrotna. Maszyna najpierw tworzy
    sesję i wyświetla ekran logowania, a dopiero potem pyta o hasło.
    Sesja zostaje więc utworzona na rzecz kogoś, kto niczego jeszcze nie
    udowodnił.

    Zagrożenie pierwsze to zużycie zasobów. Każde połączenie tworzy
    sesję, więc maszynę można obciążyć samym nawiązywaniem połączeń,
    bez znajomości jakiegokolwiek hasła.

    Zagrożenie drugie to powierzchnia ataku. Warstwa rysująca ekran
    logowania jest uruchamiana przed uwierzytelnieniem, a każdy błąd
    w niej jest błędem osiągalnym bez poświadczeń.

    Zagrożenie trzecie to rozpoznanie. Ekran logowania pokazuje nazwę
    maszyny, a czasem nazwy kont, więc daje informację każdemu, kto
    dotrze do portu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    utworzoną przed podaniem hasła i kod uruchamiany bez poświadczeń.
  en: |
    The setting calls for the user to warrant themselves before the machine sets up a full session of the desk
    from afar.

    Without that call the order is the other way about. The machine first makes a session and shows the screen of
    logging on, and only then asks for the password. A session is made therefore on behalf of somebody who has as
    yet proved nothing.

    The first danger is the spending of means. Every joining makes a session, so the machine may be burdened by
    the mere making of joinings, with no password known at all.

    The second danger is the face open to assault. The layer drawing the screen of logging on is set going before
    the warranting, and every fault in it is a fault to be reached with no warrants.

    The third danger is the knowing. The screen of logging on shows the machine's name, and at times the names of
    reckonings, so it gives word to whoever reaches the door.

    What an attacker gains while the item goes unmet: a session made before a password is given, and code set
    going with no warrants.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są klienty
    łączące się z tą maszyną.

    Miejscem pierwszym są starsze klienty pulpitu zdalnego, w tym te
    wbudowane w urządzenia terminalowe i w systemy inne niż Windows.
    Część z nich nie obsługuje tego sposobu i po zmianie nie połączy się
    wcale, a komunikat wskaże problem z protokołem, nie z zasadą.

    Miejscem drugim są konta bez hasła. Uwierzytelnianie na poziomie
    sieci wymaga poświadczeń przed sesją, więc konto bez hasła przestaje
    się łączyć — co jest zyskiem punktu, ale ujawnia się jako awaria.

    Miejscem trzecim są narzędzia wsparcia zestawiające połączenie
    w imieniu użytkownika. Trzeba sprawdzić, czy przekazują poświadczenia
    wcześniej.

    Odnotowuję, że klienty z ostatnich lat obsługują ten sposób domyślnie
    i dla nich zmiana jest niewidoczna.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: sesji już otwartych, pracy programów, sieci,
    logowania przy maszynie, drukowania.
  en: |
    The class is "needs review", and the object of the review is the clients joining themselves to this machine.

    The first place is older clients of the desk from afar, those built into things of the terminal and into
    systems other than Windows among them. Some of them back not that manner and after the change will not join at
    all, and the message will point to a trouble of the protocol and not of the policy.

    The second place is reckonings with no password. Warranting at the level of the network calls for warrants
    before the session, so a reckoning with no password ceases to join - which is the item's gain, but comes to
    light as a breakdown.

    The third place is tools of help setting up a joining on a user's behalf. It must be looked at whether they
    hand over the warrants earlier.

    I set down that clients of the last years back that manner by default, and for them the change is unseen.

    The consequence shows at once, with no restart.

    What this does not break: sessions already open, the work of programs, the network, logging on at the machine,
    or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Starsze klienty pulpitu zdalnego, w tym wbudowane w urządzenia terminalowe, mogą nie połączyć się wcale
      - Komunikat wskaże problem z protokołem, a nie z zasadą, więc szukanie przyczyny potrwa
      - Konta bez hasła przestaną się łączyć, co jest zyskiem punktu, ale ujawnia się jako awaria
      - Narzędzia wsparcia zestawiające połączenie w imieniu użytkownika trzeba sprawdzić przed wdrożeniem
      - Sesje już otwarte, praca programów, sieć, logowanie przy maszynie i drukowanie pozostają bez zmian
    en:
      - Older clients of the desk from afar, those built into things of the terminal among them, may not join at all
      - The message will point to a trouble of the protocol and not of the policy, so the seeking will take time
      - Reckonings with no password will cease to join, which is the item s gain but comes to light as a breakdown
      - Tools of help setting up a joining on a user s behalf must be looked at before the rollout
      - Sessions already open, the work of programs, the network, logging on at the machine and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do maszyny łączą się urządzenia terminalowe albo klienty nieobsługujące uwierzytelniania na poziomie sieci
    en:
      - To the machine join themselves things of the terminal or clients backing no warranting at the level of the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $ts = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $deny = (Get-ItemProperty -Path $ts -Name 'fDenyTSConnections' -ErrorAction Stop).fDenyTSConnections
      if ($deny -eq 1) {
        # The desk from afar is switched off, so there is no layer of session to guard.
        'NOT_APPLICABLE'
      } else {
        $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        $name = 'UserAuthentication'
        if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
        else {
          $item = Get-ItemProperty -Path $path -ErrorAction Stop
          if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    $name = 'UserAuthentication'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
      -Name 'UserAuthentication' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła zmienia kolejność, w jakiej dzieją się dwie rzeczy, i warto,
    żeby aplikacja opisała to właśnie tak. Bez niej maszyna tworzy sesję
    dla kogoś, kto niczego jeszcze nie udowodnił.

    Argument wart postawienia wprost dotyczy powierzchni ataku. Warstwa
    rysująca ekran logowania jest uruchamiana przed uwierzytelnieniem,
    więc każdy błąd w niej jest błędem osiągalnym bez poświadczeń.

    Odnotowuję konta bez hasła. Po wdrożeniu przestaną się łączyć, co
    jest zamierzone, ale zgłoszenie przyjdzie jako awaria. Aplikacja
    powinna wymienić to wcześniej niż dział wsparcia.
  en: |
    The rule changes the order in which two things come to pass, and it is well that the application set it out
    just so. Without it the machine makes a session for somebody who has as yet proved nothing.

    The argument worth putting outright touches the face open to assault. The layer drawing the screen of logging
    on is set going before the warranting, so every fault in it is a fault to be reached with no warrants.

    I set down reckonings with no password. After the rollout they will cease to join, which is meant, but the
    report will come as a breakdown. The application ought to name it sooner than the board of help does.
