id: win2016-llmnr-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozpoznawanie nazw przez rozgłoszenie w segmencie wyłączone
    en: Name resolution by calling out in the segment switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania maszynie pytać o nazwę przez rozgłoszenie do całego
    segmentu sieci, gdy serwer nazw odpowiedzi nie zna.

    Mechanizm pomyślano jako ratunek. Maszyna, która nie potrafi ustalić
    adresu w sposób właściwy, krzyczy w segment „kto się nazywa tak" i przyjmuje
    pierwszą odpowiedź. Nikt tej odpowiedzi nie uwierzytelnia i nikt jej nie
    sprawdza — liczy się wyłącznie to, kto odezwał się pierwszy.

    Stąd bierze się najczęściej spotykany dziś sposób zdobywania poświadczeń
    w sieci lokalnej. Napastnik nie musi atakować niczego: nasłuchuje pytań
    i odpowiada na wszystkie, podając własny adres. Maszyna pytająca łączy
    się z nim w przekonaniu, że rozmawia z zasobem, którego szukała —
    i podaje przy tym swoje poświadczenia, bo tak wygląda zwykłe łączenie
    się z udziałem sieciowym.

    Pytania te padają częściej, niż ktokolwiek przypuszcza. Wystarczy
    literówka w nazwie, nieistniejący już serwer w skrypcie logowania albo
    odwołanie do zasobu, którego dawno nie ma. Każde takie pytanie jest
    okazją.

    Zdobyte poświadczenia napastnik albo łamie w spokoju, albo — co gorsze —
    przekazuje dalej w tej samej chwili, uwierzytelniając się nimi na innej
    maszynie bez łamania czegokolwiek.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: strumień
    poświadczeń z tego segmentu sieci, zbierany biernie, bez ataku na
    cokolwiek i bez śladu wyglądającego na włamanie.
  en: |
    The setting forbids the machine to ask after a name by calling out to the whole
    network segment when the name server does not know the answer.

    The mechanism was thought up as a rescue. A machine unable to establish an
    address in the proper way shouts into the segment "who is called this" and takes
    the first answer. Nobody authenticates that answer and nobody checks it - all
    that counts is who spoke first.

    Hence the commonest way of gaining credentials on a local network today. The
    attacker need attack nothing: they listen for questions and answer them all,
    giving their own address. The asking machine connects to them in the belief that
    it is talking to the resource it sought - and hands over its credentials in
    doing so, since that is what ordinary connecting to a network share looks like.

    Such questions are asked more often than anybody supposes. A typing slip in a
    name is enough, or a server long gone that still stands in a sign-in script, or
    a reference to a resource that has not existed for years. Every such question is
    an opening.

    The credentials gained the attacker either breaks at leisure or - worse - passes
    on in the same moment, authenticating with them on another machine without
    breaking anything at all.

    What an attacker gains while the item goes unmet: a stream of credentials from
    this network segment, gathered passively, with no attack on anything and no
    trace that looks like a break-in.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć w praktyce zmiana przechodzi niemal
    zawsze bez echa.

    Powód jest taki, że mechanizm ten nie jest sposobem rozwiązywania nazw,
    tylko sposobem ratowania się, gdy właściwy zawiódł. Dopóki serwer nazw
    odpowiada, nic się nie zmienia — maszyna po prostu przestaje zadawać
    pytania, na które i tak nie powinna dostawać odpowiedzi od przypadkowego
    sąsiada.

    Zabolałoby to tam, gdzie serwera nazw nie ma albo gdzie nazwy nie są
    w nim zapisane. Na serwerze w domenie sytuacja taka nie zachodzi. Zdarza
    się na maszynach w małych sieciach roboczych, gdzie maszyny odnajdują
    się wzajemnie właśnie tak.

    Sprawdzić warto natomiast rzecz mniej oczywistą: nazwy używane
    w skryptach i zadaniach, które dziś rozwiązują się tym mechanizmem, bo
    nikt ich nigdy nie wpisał do serwera nazw. Działają, więc nikt o nich nie
    wie. Po zmianie przestaną działać, a objaw pojawi się dopiero przy
    najbliższym uruchomieniu zadania.

    Czego to nie psuje: rozwiązywania nazw przez serwer nazw, nazw wpisanych
    do pliku lokalnego, łączności po adresie, udziałów sieciowych
    odnajdywanych po pełnej nazwie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though in practice the change nearly always passes
    without echo.

    The reason is that the mechanism is not a way of resolving names but a way of
    rescuing oneself when the proper one has failed. So long as the name server
    answers, nothing changes - the machine simply stops asking questions it should
    not be getting answers to from a chance neighbour anyway.

    It would hurt where there is no name server, or where the names are not written
    into it. On a server in a domain that situation does not arise. It happens on
    machines in small working networks, where machines find one another in just that
    way.

    What is worth checking is something less obvious: the names used in scripts and
    scheduled tasks that resolve by this mechanism today because nobody ever wrote
    them into the name server. They work, so nobody knows of them. After the change
    they will stop working, and the symptom will appear only at the task's next run.

    What this does not break: name resolution by the name server, names written into
    the local file, connectivity by address, or network shares found by their full
    name.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Nazwy używane w skryptach i zadaniach, których nikt nie wpisał do serwera nazw, przestają się rozwiązywać, a objaw pojawia się przy najbliższym uruchomieniu
      - W małych sieciach roboczych bez serwera nazw maszyny przestają odnajdywać się wzajemnie po nazwie
      - Zasoby wskazywane nazwą krótką, a nie pełną, mogą przestać być odnajdywane, jeśli nie ma ich w przyrostkach wyszukiwania
      - Rozwiązywanie nazw przez serwer nazw, nazwy z pliku lokalnego i łączność po adresie pozostają bez zmian
    en:
      - Names used in scripts and scheduled tasks that nobody wrote into the name server cease to resolve, and the symptom appears at the next run
      - In small working networks with no name server, machines cease to find one another by name
      - Resources pointed at by a short name rather than a full one may cease to be found if they are not in the search suffixes
      - Name resolution by the name server, names from the local file and connectivity by address stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna stoi w sieci bez serwera nazw i odnajduje sąsiadów wyłącznie przez rozgłoszenie
      - Nie przejrzano skryptów i zadań pod kątem nazw, których nigdy nie wpisano do serwera nazw
    en:
      - The machine stands in a network with no name server and finds its neighbours by calling out alone
      - Scripts and scheduled tasks have not been reviewed for names that were never written into the name server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'EnableMulticast'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'EnableMulticast'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMulticast' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Punkt otwiera blok rozwiązywania nazw i jest w całym zestawie serwerowym
    jedną z najtańszych zmian o wadze krytycznej. Nic nie przestaje działać,
    restartu nie ma, cofnięcie jest natychmiastowe — a zdejmowana droga
    należy do najczęściej używanych w sieciach lokalnych.

    Kategoria krytyczna nie odnosi się tutaj do trudności ataku, tylko do
    tego, co napastnik dostaje: poświadczenia użytkownika, często
    uprzywilejowanego, bez łamania czegokolwiek. Droga od nasłuchu do
    uwierzytelnienia się na innej maszynie bywa krótsza niż jedno
    posiedzenie.

    Reguła ma sens dopiero razem z regułą o rozwiązywaniu nazw starszym
    mechanizmem sieciowym. Obie zamykają ten sam wzorzec — pytanie
    rozgłoszone do segmentu i przyjęcie pierwszej odpowiedzi — tyle że
    w dwóch niezależnych warstwach. Zamknięcie jednej zostawia drugą i nie
    daje żadnej ochrony; aplikacja powinna pokazywać je razem i mówić
    o tym wprost.
  en: |
    The item opens the block on name resolution and is, in the whole server set, one
    of the cheapest changes of critical weight. Nothing stops working, there is no
    restart, undoing is immediate - while the road taken away is among the most used
    on local networks.

    The critical category refers here not to the difficulty of the attack but to
    what the attacker gets: a user's credentials, often a privileged user's, without
    breaking anything. The road from listening to authenticating on another machine
    is at times shorter than a single sitting.

    The rule makes sense only together with the rule on name resolution by the older
    net mechanism. Both shut the same pattern - a question called out to the segment
    and the first answer taken - only in two independent layers. Shutting one leaves
    the other and gives no protection at all; the application should show them
    together and say so outright.
