id: win11-wdigest-credentials

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie haseł w pamięci przez WDigest wyłączone
    en: WDigest credential caching disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy dostawca uwierzytelniania WDigest przechowuje w pamięci hasło
    zalogowanego użytkownika w postaci umożliwiającej jego odtworzenie.
    Napastnik z uprawnieniami administratora odczytuje wtedy nie skrót, lecz
    hasło w czytelnej postaci — gotowe do użycia w dowolnym systemie, także tam,
    gdzie pracownik użył tego samego hasła prywatnie.

    Po wyłączeniu tego zachowania system przestaje trzymać hasło w pamięci
    w odwracalnej formie. Napastnikowi zostają wyłącznie skróty, których nie da
    się użyć wszędzie tam, gdzie wymagane jest hasło wpisywane.
  en: |
    The legacy WDigest authentication provider keeps the signed-in user's
    password in memory in a form that can be recovered. An attacker with
    administrator rights then reads not a hash but the password in clear form,
    ready to use on any system, including places where the employee reused the
    same password privately.

    With this behaviour disabled the system stops holding the password in
    memory in a reversible form. Only hashes remain, and those cannot be used
    wherever a typed password is required.

disruption_description:
  pl: |
    Na tej platformie zmiana nie odbiera niczego, czego ktokolwiek używa.
    Dostawca, o którym mowa, obsługiwał mechanizm uwierzytelniania wyszły
    z użycia lata temu; domyślnie hasło i tak nie jest przechowywane, a wpis
    w rejestrze jedynie zamyka drogę powrotu.

    Dwie rzeczy wymagają odnotowania. Pierwsza: zmiana wchodzi dopiero po
    ponownym uruchomieniu maszyny, bo dostawca czyta to ustawienie przy starcie.
    Do tego czasu hasła osób już zalogowanych pozostają w pamięci mimo
    wykonania reguły — punkt zgłasza spełnienie, a maszyna zachowuje się tak
    jak wcześniej.

    Druga: jeśli wartość jest dziś ustawiona na jedynkę, ktoś ją tam wpisał.
    Robi się tak zwykle po to, żeby pogodzić system z bardzo starą aplikacją
    webową żądającą uwierzytelnienia tym mechanizmem. Taka aplikacja przestanie
    uwierzytelniać użytkowników po restarcie i to jedyny znany przypadek, w
    którym ta zmiana coś psuje. Wtedy jednak właściwym wnioskiem jest wymiana
    aplikacji, nie pozostawienie haseł w pamięci.
  en: |
    On this platform the change takes away nothing that anybody uses. The
    provider in question served an authentication mechanism that went out of use
    years ago; by default the password is not kept anyway, and the registry entry
    merely closes the road back.

    Two things are worth noting. The first - the change takes effect only after
    the machine is restarted, because the provider reads this setting at start-up.
    Until then the passwords of those already signed in stay in memory despite
    the rule having run - the item reports a pass while the machine behaves as
    before.

    The second - if the value is set to one today, somebody put it there. That is
    usually done to reconcile the system with a very old web application
    demanding authentication by this mechanism. Such an application will stop
    authenticating users after the restart, and that is the one known case in
    which this change breaks something. Even then the right conclusion is to
    replace the application, not to leave passwords in memory.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zmiana wchodzi dopiero po ponownym uruchomieniu maszyny, bo dostawca czyta ustawienie przy starcie
      - Do czasu restartu hasła osób już zalogowanych pozostają w pamięci mimo wykonania reguły
      - Bardzo stara aplikacja webowa żądająca uwierzytelnienia tym mechanizmem przestaje uwierzytelniać użytkowników
      - Brak wpisu w rejestrze jest na tej platformie stanem poprawnym, bo domyślnie hasło nie jest przechowywane
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i pozostałe aplikacje pozostają bez zmian
    en:
      - The change takes effect only after the machine is restarted, because the provider reads the setting at start-up
      - Until the restart the passwords of those already signed in stay in memory despite the rule having run
      - A very old web application demanding authentication by this mechanism stops authenticating users
      - A missing registry entry is the correct state on this platform, the password not being kept by default
      - Signing in, domain accounts, file shares, printing and other applications are unaffected
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowisko wymaga uwierzytelniania WDigest wobec bardzo starej aplikacji webowej
    en:
      - The environment still requires WDigest authentication against a very old web application
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      $name = 'UseLogonCredential'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|MISSING)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    $name = 'UseLogonCredential'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseLogonCredential' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/kerberos/credentials-protection-and-management

notes:
  pl: |
    Brak wartości w rejestrze jest na Windows 11 stanem poprawnym — domyślnie
    hasło nie jest przechowywane. Jawne ustawienie zera zabezpiecza przed
    sytuacją, w której inne oprogramowanie włączy tę funkcję z powrotem.
  en: |
    A missing registry value is the correct state on Windows 11 - by default the
    password is not cached. Setting the value explicitly to zero guards against
    other software turning the feature back on.
