id: win2016-bitlocker-secure-boot-integrity

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Sprawdzanie spójności startu oparte na bezpiecznym rozruchu
    en: Startup integrity checking based on secure boot
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala oprzeć sprawdzanie spójności startu na bezpiecznym
    rozruchu zamiast na własnym wykazie mierzonych elementów.

    Szyfrowanie dysku systemowego oddaje klucz dopiero wtedy, gdy start
    maszyny przebiegł tak jak poprzednio. Sprawdzenie polega na porównaniu
    pomiarów kolejnych elementów rozruchu z wartościami zapamiętanymi przy
    włączaniu szyfrowania. Zmiana czegokolwiek w tym łańcuchu kończy się
    pytaniem o klucz odzyskiwania.

    Mechanizm ten jest starszy niż bezpieczny rozruch i robi to samo w sposób
    bardziej kruchy. Pomiary obejmują między innymi oprogramowanie układowe
    i jego ustawienia, więc aktualizacja tego oprogramowania — czynność
    zwykła i zalecana — bywa odczytana jako naruszenie spójności.

    Oparcie sprawdzenia na bezpiecznym rozruchu zmienia pytanie. Zamiast
    „czy wszystko jest bitowo takie samo" pyta się „czy łańcuch rozruchowy
    jest podpisany i zgodny z zasadami" — a to jest pytanie odporniejsze na
    zmiany, które nie są atakiem.

    Punkt wymaga więc bezpiecznego rozruchu jako warunku wstępnego. Bez niego
    ustawienie nie ma na czym się oprzeć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — traci natomiast na tym dostępność maszyny, bo zwykłe
    czynności serwisowe zaczynają wyglądać jak naruszenie.
  en: |
    The setting allows the checking of startup integrity to rest on secure boot instead of on a
    list of measured elements of its own.

    Encryption of the system drive gives the key up only where the machine's start went as it
    did before. The check consists in comparing the measurements of the boot's successive
    elements with values remembered when the encryption was switched on. A change of anything in
    that chain ends in a question about the recovery key.

    That mechanism is older than secure boot and does the same thing in a more brittle way. The
    measurements take in among others the firmware and its settings, so an update of that
    firmware - an ordinary and advised act - is at times read as a breach of integrity.

    Resting the check on secure boot changes the question. Instead of "is everything the same bit
    for bit" one asks "is the boot chain signed and in keeping with the rules" - and that is a
    question hardier against changes that are no attack.

    The item therefore calls for secure boot as a prior condition. Without it the setting has
    nothing to rest on.

    What an attacker gains while the item goes unmet: nothing directly - what suffers instead is
    the machine's availability, ordinary service acts beginning to look like a breach.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba przede wszystkim warunek
    wstępny.

    Bez bezpiecznego rozruchu ustawienie to nie działa. Na maszynie
    startującej starym sposobem wpis w rejestrze pozostanie, a sprawdzanie
    spójności będzie się nadal opierać na wykazie pomiarów — czyli nic się
    nie zmieni poza raportem.

    Zmiana obowiązuje od następnego startu i dotyczy dysków szyfrowanych po
    jej wprowadzeniu. Dysk zaszyfrowany wcześniej pracuje dalej na dotychczasowym
    sposobie sprawdzania. Jest to różnica warta odnotowania, bo wdrożenie na
    maszynie już zaszyfrowanej nie przyniesie spodziewanej ulgi przy
    najbliższej aktualizacji oprogramowania układowego.

    Przed wykonaniem warto mieć klucz odzyskiwania pod ręką i sprawdzony.
    Każda zmiana sposobu sprawdzania spójności niesie ryzyko, że maszyna
    zapyta o ten klucz przy najbliższym starcie — i jest to ryzyko małe, ale
    niezerowe, a jego skutkiem jest maszyna stojąca przy pytaniu.

    Czego to nie psuje: pracy systemu, usług, sieci, aplikacji, dostępu do
    danych.

    Wymaga restartu; cofnięcie działa po kolejnym restarcie.
  en: |
    The class is "needs review", and what has above all to be reviewed is the prior condition.

    Without secure boot this setting does not work. On a machine starting the old way the
    registry entry will stay and the checking of integrity will go on resting on the list of
    measurements - which is to say nothing will change but the report.

    The change holds from the next start and concerns drives encrypted after it is brought in. A
    drive encrypted earlier works on by the manner of checking used until now. It is a difference
    worth noting, a rollout on an already encrypted machine not bringing the looked-for relief at
    the next update of the firmware.

    Before execution it is worth having the recovery key at hand and checked. Every change to the
    manner of checking integrity carries a risk that the machine will ask for that key at the
    next start - and it is a small risk but not a nil one, and its upshot is a machine standing at
    the question.

    What this does not break: the system's working, services, the network, applications, or
    access to data.

    Calls for a restart; the undoing works after a further restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
  what_breaks:
    pl:
      - Na maszynie startującej starym sposobem ustawienie nie działa, a wpis w rejestrze i tak pozostanie
      - Dysk zaszyfrowany przed wdrożeniem pracuje dalej na dotychczasowym sposobie sprawdzania spójności
      - Zmiana sposobu sprawdzania niesie małe, ale niezerowe ryzyko pytania o klucz odzyskiwania przy najbliższym starcie
      - Praca systemu, usługi, sieć i dostęp do danych pozostają bez zmian
    en:
      - On a machine starting the old way the setting does not work, and the registry entry will stay all the same
      - A drive encrypted before the rollout works on by the manner of checking integrity used until now
      - The change of the manner of checking carries a small but not nil risk of a question about the recovery key at the next start
      - The system's working, services, the network and access to data stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna startuje w trybie zgodności ze starszym rozruchem, więc ustawienie nie ma na czym się oprzeć
      - Klucz odzyskiwania nie został odczytany i sprawdzony przed zmianą sposobu sprawdzania spójności
    en:
      - The machine starts in compatibility mode with the older boot, so the setting has nothing to rest on
      - The recovery key has not been read and checked before the change to the manner of checking integrity
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'OSAllowSecureBootForIntegrity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'OSAllowSecureBootForIntegrity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'OSAllowSecureBootForIntegrity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest w bloku piąty i jedyny, który podnosi dostępność, a nie
    tajność. Reszta bloku utrudnia dostęp do dysku; ten sprawia, że dostęp
    prawowity przestaje się psuć przy zwykłych czynnościach serwisowych.

    Warto to powiedzieć wprost, bo inaczej punkt wygląda na luzowanie
    zabezpieczenia i bywa z tego powodu odpuszczany. Nie jest luzowaniem —
    jest wymianą kruchego sprawdzenia na sprawdzenie równie mocne, a mniej
    podatne na fałszywy alarm.

    Powiązanie z bezpiecznym rozruchem jest tu zależnością twardą i aplikacja
    powinna ją znać. Zgłoszenie niezgodności tego punktu na maszynie
    startującej starym sposobem prowadzi donikąd: użytkownik wykona zmianę,
    zobaczy zieleń i nic nie uzyska. Właściwym ruchem jest pokazanie obu
    punktów razem, z bezpiecznym rozruchem jako pierwszym.

    Kategoria średnia odzwierciedla to, że punkt nie zamyka żadnej drogi
    wejścia. Kryterium tej osi pyta, co zyskuje napastnik — a tu nie zyskuje
    nic. Wartość leży gdzie indziej i warto, żeby opis to przyznawał zamiast
    naciągać uzasadnienie.
  en: |
    The item is the fifth in the block and the only one that raises availability rather than
    secrecy. The rest of the block makes access to the drive harder; this one makes lawful access
    stop breaking at ordinary service acts.

    That is worth saying outright, else the item looks like a loosening of a safeguard and gets
    let go on that account. It is no loosening - it is an exchange of a brittle check for one as
    strong and less prone to a false alarm.

    The tie to secure boot is here a hard dependency and the application should know it.
    Reporting this item's non-compliance on a machine starting the old way leads nowhere: the
    user will make the change, see green and gain nothing. The right move is to show both items
    together, with secure boot first.

    The medium category reflects the item shutting no road in. This axis's criterion asks what an
    attacker gains - and here they gain nothing. The value lies elsewhere and it is well that the
    description own it rather than strain the warrant.
