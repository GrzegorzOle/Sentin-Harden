id: win11-upnp-device-host-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Udostępnianie maszyny jako urządzenia sieciowego wyłączone
    en: Sharing the machine as a network device disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa jest drugą stroną wykrywania urządzeń w sieci lokalnej: nie szuka
    cudzych urządzeń, tylko udostępnia tę maszynę jako urządzenie. Ogłasza ją
    w sieci, odpowiada na zapytania i wystawia opis tego, co maszyna potrafi
    obsłużyć.

    Wystawienie usługi sieciowej bez uwierzytelnienia jest samo w sobie
    powiększeniem powierzchni ataku i tak należy to czytać. Kod przetwarzający
    przychodzące zapytania pracuje na danych od dowolnego nadawcy w sieci
    lokalnej, a rozpoznanie nadawcy nie następuje w ogóle — protokół tego nie
    przewiduje.

    Do tego dochodzi skutek uboczny, który bywa ważniejszy od samego ryzyka
    technicznego: maszyna sama opowiada sieci, czym jest. Nazwa, adres, wersja
    systemu, lista obsługiwanych funkcji — wszystko to wychodzi w odpowiedzi
    na zapytanie, które może wysłać każdy. Rozpoznanie sieci przestaje wymagać
    skanowania, bo maszyny odpowiadają same.

    Stacja robocza nie ma powodu udostępniać się jako urządzenie. Wyłączenie
    usługi zdejmuje tę rolę, nie odbierając maszynie niczego z jej własnej
    pracy.
  en: |
    The service is the other side of finding devices on the local network: it does not
    look for other people's devices but shares this machine as one. It announces it on
    the network, answers enquiries and puts out a description of what the machine can
    handle.

    Putting out a network service with no authentication is in itself an enlargement of
    the attack surface, and that is how it should be read. The code handling incoming
    enquiries works on data from any sender at all on the local network, and the sender
    is not identified in the least - the protocol makes no provision for it.

    On top of that comes a side effect sometimes weightier than the technical risk
    itself: the machine tells the network what it is. The name, the address, the
    system's version, the list of functions handled - all of it goes out in answer to an
    enquiry anybody can send. Getting to know a network stops taking a scan, because the
    machines answer of their own accord.

    A workstation has no reason to share itself as a device. Disabling the service takes
    that role away without taking anything from the machine's own work.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna udostępnia cokolwiek urządzeniom
    w sieci lokalnej.

    Na stacji roboczej zwykle nie udostępnia i zmiana nie robi nic
    zauważalnego. Usługa jest domyślnie uruchamiana ręcznie i bardzo często
    w ogóle nie startuje.

    Skutki, gdy wystąpią, są dwojakie. Pierwszy: przestaje działać wysyłanie
    treści z tej maszyny na urządzenie odtwarzające — telewizor, głośnik,
    odbiornik obrazu. Objawem jest zniknięcie urządzenia z listy albo odmowa
    połączenia.

    Drugi dotyczy gier i programów wymagających połączenia przychodzącego
    z sieci zewnętrznej. Część z nich prosi router o otwarcie portu właśnie
    tą drogą; po wyłączeniu usługi port nie zostanie otwarty i połączenie
    będzie zestawiane gorzej albo wcale. W sieci firmowej takie otwieranie
    portów i tak zwykle nie działa, więc skutek dotyczy przede wszystkim
    maszyn pracujących w sieciach domowych.

    Ten drugi przypadek warto czytać odwrotnie, niż podpowiada objaw:
    samoczynne otwieranie portów na routerze przez program jest tym, co ten
    punkt ma zatrzymać, a nie skutkiem ubocznym do żałowania.

    Nie ma restartu.
  en: |
    What needs checking is whether the machine shares anything with devices on the local
    network.

    At a workstation it usually does not, and the change does nothing noticeable. The
    service starts on demand by default and very often does not start at all.

    The effects, where they appear, are twofold. The first: sending content from this
    machine to a playing device - a television, a speaker, a picture receiver - stops
    working. The symptom is the device disappearing from the list or the connection
    being refused.

    The second concerns games and programs needing an incoming connection from an
    outside network. Some of them ask the router to open a port by exactly this route;
    once the service is off the port will not be opened and the connection will be made
    worse, or not at all. On a company network such port opening usually does not work
    anyway, so the effect concerns machines working on household networks above all.

    That second case is worth reading the opposite way to what the symptom suggests: a
    program opening ports on the router of its own accord is what this item is meant to
    stop, not a side effect to regret.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Wysyłanie treści z tej maszyny na telewizor lub głośnik w sieci przestaje działać
      - Programy proszące router o otwarcie portu tą drogą przestaną je otrzymywać
      - Maszyna przestaje odpowiadać na zapytania o to, czym jest i co obsługuje
      - Zwykła praca sieciowa, udziały i drukarki nie zmieniają się w żaden sposób
    en:
      - Sending content from this machine to a television or speaker on the network stops working
      - Programs asking the router to open a port by this route stop receiving them
      - The machine stops answering enquiries about what it is and what it handles
      - Ordinary network work, shares and printers do not change in any way
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest używana do wysyłania obrazu lub dźwięku na urządzenia odtwarzające w sieci
      - Program wymagający połączenia przychodzącego otwiera port na routerze wyłącznie tą drogą
    en:
      - The machine is used for sending picture or sound to playing devices on the network
      - A program needing an incoming connection opens a port on the router by this route alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'upnphost' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'upnphost' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'upnphost' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Usługa zależy od usługi wykrywania urządzeń w sieci lokalnej, opisanej
    osobną regułą. Wyłączenie tamtej zatrzymuje tę, ale nie zmienia jej
    ustawienia uruchamiania — po restarcie wróciłaby. Dlatego obie reguły są
    osobne i obie trzeba wdrożyć.

    Kolejność wdrażania nie ma znaczenia; znaczenie ma wdrożenie obu.
    Sprawdzenie jednej z nich nie jest dowodem na stan drugiej.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa uruchamiana na żądanie bywa zatrzymana i mimo to
    jest niezgodna, bo wystarczy jedno zapytanie z sieci, żeby wystartowała.
  en: |
    The service depends on the local network device discovery service, described by a
    rule of its own. Disabling that one stops this one, but does not change its startup
    setting - after a restart it would come back. That is why the two rules are separate
    and why both have to be applied.

    The order of the rollout does not matter; what matters is applying both. Checking
    one of them is no proof of the other's state.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment. A service that starts on demand is sometimes stopped and
    deviating all the same, since one enquiry from the network is enough to start it.
