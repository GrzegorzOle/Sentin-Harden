id: win2016-remote-registry-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego dostępu do rejestru wyłączona
    en: The remote registry access service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę pozwalającą czytać i zapisywać rejestr tej
    maszyny z innej maszyny w sieci.

    Rejestr jest miejscem, w którym leży konfiguracja całego systemu:
    ustawienia zabezpieczeń, listy zainstalowanego oprogramowania, sposób
    uruchamiania usług, ścieżki do plików wykonywalnych. Dostęp zdalny do
    niego daje zatem obraz maszyny pełniejszy niż jakiekolwiek pojedyncze
    zapytanie — i to bez logowania się na nią.

    Dla napastnika rozpoznającego sieć jest to narzędzie pierwszego wyboru.
    Pozwala ustalić, co na maszynie stoi, jakie ma zabezpieczenia, które
    z nich są wyłączone i gdzie szukać słabości — zanim podejmie
    jakąkolwiek próbę wejścia. Rozpoznanie takie nie wygląda na atak
    i rzadko cokolwiek uruchamia.

    Groźniejsza jest druga strona. Dostęp zdalny do rejestru bywa dostępem
    do zapisu, a wpis w rejestrze potrafi wskazać plik uruchamiany przy
    starcie usługi. Droga od odczytu konfiguracji do wykonania własnego kodu
    jest tu krótsza, niż wygląda, i nie prowadzi przez żaden ekran logowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełen obraz
    konfiguracji maszyny bez logowania się na nią, a przy dostępie do zapisu
    — drogę do uruchomienia własnego kodu przez podmianę wpisu.
  en: |
    The setting switches off the service letting this machine's registry be read and
    written from another machine on the network.

    The registry is the place holding the whole system's configuration: security
    settings, lists of installed software, the way services are started, paths to
    executable files. Remote access to it therefore gives a fuller picture of the
    machine than any single query - and that without signing in to it.

    For an attacker reconnoitring a network this is a tool of first choice. It lets
    them establish what stands on the machine, what protections it has, which of
    them are switched off and where to look for weaknesses - before they make any
    attempt to get in. Such reconnaissance does not look like an attack and rarely
    sets anything off.

    The other side is more dangerous. Remote access to the registry is at times
    write access, and an entry in the registry can point at a file started when a
    service starts. The road from reading a configuration to running one's own code
    is shorter here than it looks, and it leads through no sign-in screen.

    What an attacker gains while the item goes unmet: a full picture of the
    machine's configuration without signing in to it, and, with write access, a road
    to running their own code by substituting an entry.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba to, co odczytuje stan tej
    maszyny bez wgrywania na nią własnego oprogramowania.

    Najczęstszy przypadek to nadzór i inwentaryzacja bezagentowe. Narzędzia
    takie czytają rejestr zdalnie właśnie dlatego, że nie chcą instalować
    agenta — i po wyłączeniu usługi tracą źródło danych. Ważne jest to, jak
    tę stratę zgłaszają: zwykle nie zgłaszają jej wcale. Maszyna przestaje
    pojawiać się na liście, a cisza na pulpicie nadzoru wygląda jak zdrowie.
    Jest to jedyny naprawdę trudny skutek tej reguły, bo ujawnia się jako
    brak informacji, a nie jako błąd.

    Drugi przypadek to narzędzia zarządzania i skrypty odczytujące
    konfigurację zdalnie, w tym część wbudowanych przystawek konsoli. Te
    zgłaszają błąd wprost, więc rozpoznanie przyczyny jest szybkie.

    Trzeci to oprogramowanie do wdrażania pakietów, sprawdzające przed
    instalacją, co na maszynie już jest.

    Usługa bywa domyślnie uruchamiana ręcznie, nie automatycznie, więc na
    części maszyn jest w praktyce nieużywana i zmiana nie zmienia nic poza
    zapisem.

    Czego to nie psuje: pulpitu zdalnego, powłoki zdalnej, zarządzania przez
    mechanizm zarządzania zdalnego, odczytu rejestru lokalnie.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whatever reads this
    machine's state without having its own software installed on it.

    The commonest case is agentless monitoring and inventory. Such tools read the
    registry remotely precisely because they will not install an agent - and once
    the service is off they lose their source of data. What matters is how they
    report that loss: as a rule they do not report it at all. The machine stops
    appearing on the list, and silence on a monitoring dashboard looks like health.
    It is the one truly hard consequence of this rule, since it shows as an absence
    of information rather than as an error.

    The second case is management tools and scripts reading the configuration
    remotely, some built-in console snap-ins among them. These report an error
    outright, so the cause is quickly established.

    The third is package deployment software checking, before installing, what is on
    the machine already.

    The service is at times set to start by hand rather than automatically, so on
    some machines it is in practice unused and the change alters nothing but the
    entry.

    What this does not break: the remote desktop, the remote shell, management
    through the remote management mechanism, or reading the registry locally.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Nadzór i inwentaryzacja bezagentowe tracą źródło danych i nie zgłaszają błędu - maszyna po prostu przestaje pojawiać się na liście
      - Przystawki konsoli i skrypty odczytujące konfigurację zdalnie zgłaszają błąd dostępu przy próbie połączenia
      - Oprogramowanie do wdrażania pakietów nie sprawdzi przed instalacją, co na maszynie już jest
      - Pulpit zdalny, powłoka zdalna i odczyt rejestru lokalnie pozostają bez zmian
    en:
      - Agentless monitoring and inventory lose their source of data and report no error - the machine simply stops appearing on the list
      - Console snap-ins and scripts reading the configuration remotely report an access error on connecting
      - Package deployment software will not check, before installing, what is on the machine already
      - The remote desktop, the remote shell and reading the registry locally stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nadzór nad tą maszyną jest bezagentowy i opiera się na zdalnym odczycie rejestru, a nie przewidziano zastąpienia go agentem
      - Inwentaryzacja oprogramowania w tej organizacji czyta rejestr zdalnie i wyłączenie usługi zabrałoby maszynę z ewidencji po cichu
    en:
      - Monitoring of this machine is agentless and rests on reading the registry remotely, and no replacement by an agent has been planned
      - Software inventory in this organisation reads the registry remotely and switching the service off would quietly take the machine out of the records
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
    $name = 'Start'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Agentless monitoring and inventory read machine state through this service. If
    # they lose it they report no failure - the machine just stops appearing, and
    # silence on a dashboard looks like health.
    Stop-Service -Name 'RemoteRegistry' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteRegistry' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RemoteRegistry' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/sysinfo/registry-functions

notes:
  pl: |
    Cicha postać skutku jest przy tym punkcie ważniejsza niż sam skutek
    i powinna trafić do interfejsu. Reguła nie łamie niczego głośno —
    zabiera maszynę z pola widzenia nadzoru, a nadzór milczy. Przy wdrożeniu
    warto więc po kilku dniach sprawdzić, czy maszyna nadal jest widoczna
    tam, gdzie powinna.

    Punkt stoi wyżej niż dwie reguły o listach gałęzi dostępnych zdalnie
    i warto tę zależność pokazać. Tamte ograniczają, co da się przeczytać
    przez tę usługę; ta zamyka samą usługę. Gdzie usługa jest wyłączona,
    tamte przestają mieć znaczenie praktyczne, ale zostają jako
    zabezpieczenie na wypadek jej ponownego włączenia.

    Audyt zwraca stan „nie dotyczy", gdy usługi nie ma w systemie w ogóle.
    Jest to sytuacja rzadka na serwerze, ale możliwa po usunięciu roli,
    i lepiej ją nazwać, niż zgłaszać jako niezgodność.
  en: |
    The quiet form of the consequence matters more at this item than the consequence
    itself, and it should reach the interface. The rule breaks nothing loudly - it
    takes the machine out of the monitoring's field of view, and the monitoring says
    nothing. At rollout it is therefore worth checking, a few days on, whether the
    machine is still visible where it should be.

    The item stands higher than the two rules on the lists of remotely reachable
    keys, and that relation is worth showing. Those limit what can be read through
    this service; this one shuts the service itself. Where the service is off, those
    cease to matter in practice but remain as a safeguard should it be switched back
    on.

    The audit returns the state "not applicable" where the service is not in the
    system at all. That is rare on a server but possible after a role has been
    removed, and better named than reported as a non-compliance.
