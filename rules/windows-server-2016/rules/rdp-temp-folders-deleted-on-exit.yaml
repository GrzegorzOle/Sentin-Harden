id: win2016-rdp-temp-folders-deleted-on-exit

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary Folders
  title:
    pl: Foldery tymczasowe sesji zdalnej usuwane po jej zakończeniu
    en: A remote session's temporary folders removed once it ends
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe usuwać folder plików tymczasowych sesji zdalnej w chwili,
    gdy sesja się kończy, zamiast zostawiać jego zawartość na dysku.

    Bez tego punktu treść przechodząca przez folder tymczasowy zostaje na
    serwerze po tym, jak przestała być komukolwiek potrzebna. Nie chodzi
    o dzień ani o tydzień — pliki te leżą tam, dopóki ktoś ich świadomie nie
    skasuje, a nikt nie kasuje katalogu, którego nazwa mówi „tymczasowy".

    Zawartość jest przy tym reprezentatywna dla całej pracy wykonanej na
    maszynie: podglądane dokumenty, otwierane załączniki, rozpakowane
    archiwa, wyniki zapytań, wydruki przygotowane do wysłania. Po roku
    folder taki jest pełniejszym obrazem tego, czym zajmuje się organizacja,
    niż niejeden katalog trzymany celowo.

    Dla napastnika, który uzyskał na serwerze dostęp, jest to materiał
    gotowy i leżący poza wszelką kontrolą dostępu przewidzianą dla danych
    właściwych. Nie musi sięgać do baz ani do udziałów — wystarczy przejrzeć
    to, co zostało po cudzych sesjach.

    Druga strona jest porządkowa: pliki te zajmują miejsce, którego nikt nie
    rozlicza, i potrafią zapełnić dysk systemowy maszyny wieloletniej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zbiór treści
    przechodzącej przez maszynę, narastający bez ograniczenia i leżący poza
    kontrolą dostępu do danych właściwych.
  en: |
    The setting has a remote session's temporary file folder removed at the moment
    the session ends, instead of its contents being left on the disk.

    Without this item the content passing through the temporary folder stays on the
    server after it has ceased to be of use to anybody. Not for a day or a week -
    those files lie there until somebody deliberately deletes them, and nobody
    deletes a directory whose name says "temporary".

    The contents are, at that, representative of all the work done on the machine:
    documents viewed, attachments opened, archives unpacked, query results, print
    jobs prepared for sending. After a year such a folder is a fuller picture of
    what an organisation busies itself with than many a directory kept on purpose.

    For an attacker who has gained access on the server this is ready material,
    lying beyond whatever access control was meant for the data proper. They need
    not reach for databases or shares - looking through what other people's sessions
    left behind is enough.

    The other side is one of tidiness: those files take up room nobody accounts for,
    and on a machine of many years they can fill the system disk.

    What an attacker gains while the item goes unmet: a collection of the content
    passing through the machine, piling up without limit and lying beyond the access
    control set over the data proper.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", przy czym dla ogromnej większości pracy
    zmiana jest niewidoczna — pliki tymczasowe z definicji nie są nikomu
    potrzebne po zakończeniu sesji.

    Sprawdzić trzeba dwa wzorce użycia, oba wynikające z przyzwyczajenia,
    nie z projektu. Pierwszy: ktoś traktuje folder tymczasowy jak schowek
    podręczny i odkłada tam pliki, do których wraca następnego dnia. Po
    zmianie znajdzie pusto. Drugi: narzędzia diagnostyczne zapisujące tam
    dzienniki i zrzuty, po które sięga się po awarii — a awaria kończy
    sesję, więc materiał znika razem z nią, dokładnie wtedy, gdy jest
    potrzebny.

    Drugi wzorzec zasługuje na uwagę, bo skutek jest przewrotny: reguła
    utrudnia rozpoznanie przyczyny awarii, którą miała pomóc opisać.
    Zanim wejdzie, warto wskazać narzędziom trwałą ścieżkę zapisu zamiast
    katalogu tymczasowego.

    Objaw jest natychmiastowy, ale ujawnia się dopiero przy następnym
    zalogowaniu i wygląda na utratę plików.

    Czego to nie psuje: pracy w trwającej sesji, katalogów trwałych,
    dzienników systemowych, zadań harmonogramu.

    Wymaga wylogowania: usuwanie następuje przy zakończeniu sesji, więc
    zmiana obowiązuje od następnej.
  en: |
    The class is "needs review", though for the vast majority of work the change is
    invisible - temporary files are by definition of no use to anybody once the
    session ends.

    Two patterns of use have to be checked, both arising from habit rather than from
    design. The first: somebody treats the temporary folder as a handy drawer and
    lays there files they come back to the next day. After the change they will find
    it empty. The second: diagnostic tools writing their logs and dumps there, to be
    reached for after a failure - and a failure ends the session, so the material
    vanishes along with it, exactly when it is needed.

    The second pattern deserves attention, since the effect is perverse: the rule
    makes it harder to establish the cause of the very failure it was to help
    describe. Before it goes in, those tools are worth pointing at a permanent path
    of writing rather than a temporary directory.

    The symptom is immediate but shows only at the next signing in, and looks like a
    loss of files.

    What this does not break: work in a session under way, permanent directories,
    system logs, or scheduled tasks.

    Calls for signing out: the removal happens as a session ends, so the change
    holds from the next one on.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Pliki odkładane w folderze tymczasowym jako w schowku podręcznym znikają po zakończeniu sesji i nie da się do nich wrócić następnego dnia
      - Dzienniki i zrzuty narzędzi diagnostycznych zapisywane w katalogu tymczasowym giną razem z sesją przerwaną przez awarię
      - Objaw ujawnia się dopiero przy następnym zalogowaniu i wygląda na utratę plików, a nie na zmianę zasady
      - Praca w trwającej sesji, katalogi trwałe, dzienniki systemowe i zadania harmonogramu pozostają bez zmian
    en:
      - Files laid in the temporary folder as in a handy drawer vanish once the session ends and cannot be returned to the next day
      - Logs and dumps of diagnostic tools written into the temporary directory are lost along with a session broken off by a failure
      - The symptom shows only at the next signing in and looks like a loss of files rather than a change of policy
      - Work in a session under way, permanent directories, system logs and scheduled tasks stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzia diagnostyczne na tej maszynie zapisują dzienniki i zrzuty do katalogu tymczasowego sesji i nie wskazano im ścieżki trwałej
      - Osoby pracujące na maszynie odkładają w folderze tymczasowym pliki, do których wracają, i nie wskazano im innego miejsca
    en:
      - Diagnostic tools on this machine write their logs and dumps into the session's temporary directory and have not been pointed at a permanent path
      - The people working on the machine lay files they come back to in the temporary folder and have not been shown another place
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'DeleteTempDirsOnExit'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'DeleteTempDirsOnExit'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeleteTempDirsOnExit' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Reguła jest drugą połową pary z osobnym folderem na sesję. Tamta
    rozdziela katalog między sesje i zamyka drogę do cudzych plików; ta
    sprząta po sesjach i zamyka narastanie. Wdrożone osobno każda zostawia
    dziurę, o którą zadbała druga, więc aplikacja powinna pokazywać je razem
    i proponować wspólnie.

    Kategoria ryzyka jest tu niższa niż przy rozdzieleniu folderów i wynika
    to z kryterium. Brak rozdzielenia daje dostęp do cudzych plików teraz
    i pozwala podstawić plik pod cudzą nazwę. Brak sprzątania daje dostęp do
    plików dawnych — materiał obszerniejszy, ale wymagający od napastnika
    uzyskania dostępu do maszyny najpierw.

    Uwaga o narzędziach diagnostycznych powinna trafić do interfejsu, bo
    jest to jedyny przypadek, w którym ta reguła działa wbrew temu, czemu ma
    służyć. Wskazanie trwałej ścieżki zapisu rozwiązuje sprawę i nie
    wymaga odpuszczania punktu.
  en: |
    The rule is the other half of a pair with the separate folder per session. That
    one divides the directory between sessions and shuts the road to other people's
    files; this one clears up after the sessions and shuts the piling up. Rolled out
    apart, each leaves the hole the other saw to, so the application should show
    them together and propose them jointly.

    The risk category here is lower than at the dividing of folders, and that
    follows from the criterion. The lack of dividing gives access to other people's
    files now and lets a file be planted under another's name. The lack of clearing
    up gives access to files of the past - fuller material, but calling for the
    attacker to gain access to the machine first.

    The remark about diagnostic tools should reach the interface, since it is the
    one case in which this rule works against what it is to serve. Pointing them at
    a permanent path of writing answers the matter and calls for no letting the item
    go.
