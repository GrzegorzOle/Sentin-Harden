id: win10-password-expiry-warning-window

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uprzedzenie o wygaśnięciu hasła od 5 do 14 dni wcześniej
    en: Warning of password expiry between 5 and 14 days ahead
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Uprzedzenie o wygaśnięciu hasła jest punktem o niskiej kategorii ryzyka, bo
    nie zamyka żadnej drogi atakującemu. Jego wartość leży gdzie indziej: w tym,
    co ludzie robią, gdy hasło wygaśnie im bez ostrzeżenia.

    Hasło zmieniane w pośpiechu, na ekranie blokującym pracę, jest hasłem słabym
    i najczęściej wariantem poprzedniego z dopisaną cyfrą. Hasło zmieniane na
    spokojnie, z tygodniowym wyprzedzeniem, bywa hasłem przemyślanym. Ten punkt
    kupuje ten spokój.

    Zbyt wczesne uprzedzenie działa odwrotnie: komunikat powtarzany przez miesiąc
    przestaje być czytany i staje się tłem.
  en: |
    A warning of password expiry is an item of low risk, since it shuts no road to
    an attacker. Its value lies elsewhere - in what people do when a password
    expires on them with no warning.

    A password changed in a hurry, on a screen blocking the work, is a weak
    password and usually a variant of the previous one with a digit added. A
    password changed in peace, a week ahead, tends to be a considered one. This
    item buys that peace.

    A warning given too early works the other way - a message repeated for a month
    stops being read and becomes background.

disruption_description:
  pl: |
    Zmiana nie kosztuje nic poza pojawieniem się komunikatu przy logowaniu w
    ostatnich dniach ważności hasła. Nie wymaga przerwy i cofa się natychmiast.

    Na maszynach, na których hasła nie wygasają, ustawienie leży bez skutku.
    Warto to wiedzieć, bo w raporcie taki punkt wygląda tak samo jak na maszynie,
    gdzie ma znaczenie — sam wpis nie mówi, czy polityka wygasania w ogóle
    obowiązuje.
  en: |
    The change costs nothing beyond a message appearing at sign-in during the last
    days of a password s validity. It calls for no interruption and reverses at
    once.

    On machines where passwords do not expire the setting sits without effect.
    That is worth knowing, because in the report such an item looks the same as on
    a machine where it matters - the entry alone does not say whether an expiry
    policy is in force at all.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Przy logowaniu pojawi się komunikat o zbliżającym się wygaśnięciu hasła w ostatnich dniach jego ważności
      - Stanowiska logujące się samoczynnie mogą zatrzymać się na tym komunikacie zamiast dojść do pulpitu
      - Użytkownicy przyzwyczajeni do braku ostrzeżeń zgłoszą komunikat jako nowość wymagającą wyjaśnienia
      - Sama polityka wygasania haseł, ich złożoność, logowanie i praca po zalogowaniu pozostają bez zmian
    en:
      - A message about a password nearing expiry appears at sign-in during the last days of its validity
      - Stations signing in by themselves may stop at that message instead of reaching the desktop
      - Users used to no warnings report the message as a novelty calling for an explanation
      - The expiry policy itself, password complexity, signing in and work after signing in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny logujące się samoczynnie, na których komunikat przy logowaniu przerywa uruchamianie stanowiska
      - Środowiska bez polityki wygasania haseł, gdzie ustawienie nie ma czego dotyczyć
    en:
      - Machines signing in by themselves, where a message at sign-in breaks the station s start-up
      - Environments with no password expiry policy, where the setting has nothing to apply to
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item sets a range, not a single value, so both ends are reported
      # apart. A value below the range and a value above it are different
      # mistakes and a report should not merge them into one.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'PasswordExpiryWarning'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -lt 5) { 'BELOW_RANGE ' + $value }
        elseif ([int]$value -gt 14) { 'ABOVE_RANGE ' + $value }
        else { 'WITHIN_RANGE' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_RANGE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'PasswordExpiryWarning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordExpiryWarning' -Value 14 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-prompt-user-to-change-password-before-expiration

notes:
  pl: |
    Punkt ustala przedział, a nie pojedynczą wartość, więc sprawdzenie zgłasza oba
    jego końce osobno. Wartość poniżej przedziału i wartość powyżej to dwa różne
    błędy i raport nie powinien ich sklejać w jeden. Ustawienie ma znaczenie tylko
    tam, gdzie hasła w ogóle wygasają.
  en: |
    The item sets a range rather than a single value, so the check reports both of
    its ends apart. A value below the range and one above it are two different
    mistakes and the report should not merge them into one. The setting matters
    only where passwords expire at all.
