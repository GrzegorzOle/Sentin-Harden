id: iis-dotnet-trust-level-limited

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Poziom zaufania kodu aplikacji ograniczony
    en: The trust level of application code limited

  level: 2
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Poziom zaufania rozstrzyga, co wolno kodowi aplikacji poza nią samą.
    Domyślnie wolno mu wszystko, co wolno kontu, na którym działa pula:
    czytać i zapisywać dowolne pliki, sięgać do rejestru, otwierać połączenia
    sieciowe, wywoływać kod niezarządzany, uruchamiać procesy. Obniżenie
    poziomu odbiera te możliwości grupami.

    Co to odbiera atakującemu: przełożenie wykonania kodu na dostęp do
    systemu. Podatność w aplikacji, która pozwala wykonać cudzy kod, przy
    pełnym zaufaniu daje od razu tyle, ile ma konto puli. Przy poziomie
    ograniczonym ten sam kod nie sięgnie poza katalog aplikacji, nie otworzy
    połączenia na zewnątrz i nie uruchomi programu — a to znaczy, że
    atakujący musi znaleźć drugą lukę, żeby cokolwiek z pierwszej wynikło.

    Trzeba jednak wiedzieć, czego ten mechanizm nie robi. Nie jest granicą
    bezpieczeństwa, na której można polegać wobec kodu celowo wrogiego —
    twórcy środowiska powiedzieli to wprost i przestali go rozwijać. Broni
    przed skutkiem błędu w kodzie własnym albo w bibliotece, nie przed kimś,
    kto od początku próbuje się z niego wyrwać.
  en: |
    The trust level decides what an application's code may do outside itself. By
    default it may do everything the account running the pool may do - read and
    write any files, reach into the registry, open network connections, call
    unmanaged code, start processes. Lowering the level takes those away in groups.

    What it takes away from an attacker - the translation from running code to
    access to the system. A vulnerability in the application that allows somebody
    else's code to run gives, under full trust, everything the pool account has at
    once. At a limited level that same code will not reach outside the application
    directory, will not open an outward connection and will not start a program -
    which means the attacker has to find a second flaw for anything to follow from
    the first.

    It has to be known what this mechanism does not do, though. It is not a
    security boundary to be relied on against code that is deliberately hostile -
    the makers of the runtime said so outright and stopped developing it. It
    defends against the consequences of a fault in one's own code or in a library,
    not against somebody trying from the start to break out of it.

disruption_description:
  pl: |
    To jest zmiana, która psuje aplikacje, i trzeba ją traktować poważnie.
    Obniżenie poziomu zaufania odbiera kodowi uprawnienia, z których część
    aplikacji korzysta w sposób zupełnie zwyczajny i nieudokumentowany.

    Rzeczy, które przestają działać najczęściej: zapis pliku poza katalogiem
    aplikacji — w tym logowanie do własnego pliku w innym miejscu, odczyt
    i zapis rejestru, wywołanie biblioteki niezarządzanej, otwarcie połączenia
    do usługi sieciowej innej niż baza danych, odczyt zmiennych środowiskowych,
    użycie mechanizmu odbicia do sięgnięcia po składowe niepubliczne oraz
    część bibliotek generujących kod w locie — w tym stare mechanizmy
    serializacji i niektóre generatory raportów.

    Objaw jest za to czytelny, w odróżnieniu od większości zmian w tej
    aplikacji: kod zgłasza wyjątek bezpieczeństwa z nazwą brakującego
    uprawnienia. Problem polega na tym, że pojawia się dopiero wtedy, gdy
    wykonana zostanie akurat ta ścieżka w kodzie — więc aplikacja może
    wystartować, przejść pobieżny test i wywalić się przy eksporcie raportu
    na koniec miesiąca.

    Dlatego ten punkt wdraża się na środowisku testowym, przechodząc przez
    pełną ścieżkę funkcjonalną każdej aplikacji na serwerze, a nie na
    produkcji po godzinach. Zapis obejmuje wszystkie aplikacje naraz.
  en: |
    This is a change that breaks applications, and it has to be taken seriously.
    Lowering the trust level takes away privileges some applications use in an
    entirely ordinary and undocumented way.

    The things that most often stop working - writing a file outside the
    application directory, including logging to a file of one's own elsewhere,
    reading and writing the registry, calling an unmanaged library, opening a
    connection to a network service other than the database, reading environment
    variables, using reflection to reach non-public members, and some libraries
    that generate code on the fly - among them old serialisation mechanisms and
    certain report generators.

    The symptom is legible, though, unlike most changes in this application - the
    code raises a security exception naming the missing privilege. The trouble is
    that it appears only once that particular path through the code is taken, so an
    application may start, pass a cursory test and fall over exporting a report at
    the end of the month.

    This is why this item is rolled out on a test environment, going through the
    full functional path of every application on the server, rather than on
    production after hours. The write covers every application at once.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Zapis pliku poza katalogiem aplikacji przestaje działać, w tym logowanie do własnego pliku w innej lokalizacji
      - Odczyt i zapis rejestru z poziomu aplikacji kończy się wyjątkiem bezpieczeństwa
      - Wywołanie biblioteki niezarządzanej przestaje być możliwe, co odcina część starszych składników
      - Połączenia sieciowe do usług innych niż baza danych zostają zablokowane
      - Biblioteki generujące kod w locie, w tym stare mechanizmy serializacji i część generatorów raportów, przestają działać
      - Błąd ujawnia się dopiero przy wykonaniu konkretnej ścieżki w kodzie, więc aplikacja może wystartować i wywalić się tydzień później
      - Zmiana obejmuje wszystkie aplikacje na serwerze naraz
    en:
      - Writing a file outside the application directory stops working, including logging to a file of one's own elsewhere
      - Reading and writing the registry from the application ends in a security exception
      - Calling an unmanaged library stops being possible, which cuts off some older components
      - Network connections to services other than the database are blocked
      - Libraries generating code on the fly, among them old serialisation mechanisms and some report generators, stop working
      - The fault shows itself only when a particular path through the code is taken, so an application may start and fall over a week later
      - The change covers every application on the server at once
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwery z aplikacjami, których pełnej ścieżki funkcjonalnej nie da się przejść na środowisku testowym
      - Aplikacje korzystające ze składników niezarządzanych albo z bibliotek generujących kod w locie
      - Środowiska, w których kod aplikacji pochodzi od zaufanego dostawcy, a koszt regresji przewyższa zysk z ograniczenia
    en:
      - Servers with applications whose full functional path cannot be walked through on a test environment
      - Applications using unmanaged components or libraries that generate code on the fly
      - Environments where the application code comes from a trusted supplier and the cost of a regression outweighs the gain from the limitation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          # The section lives in the framework root configuration. The server
          # configuration file does not declare it, so a reading aimed there
          # comes back empty on a machine where the value is in fact set.
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
            -Filter 'system.web/trust' -Name 'level' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          else {
            # The levels are reported as they stand rather than folded into a
            # verdict. Which one is in place decides how much a move costs, and
            # that is the whole conversation this item is for.
            [string]$value
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(Medium|Low|Minimal)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # The framework root configuration again, which the server's own backup
    # mechanism does not cover. Both variants of the file are copied, because a
    # 32-bit application pool reads a different one than a 64-bit pool does.
    $files = @()
    foreach ($base in @('Framework', 'Framework64')) {
      $source = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\web.config')
      if (Test-Path $source) {
        $copy = '{{backup_file}}' + '.' + $base + '.web.config'
        Copy-Item -Path $source -Destination $copy -Force
        $files += [pscustomobject]@{ source = $source; copy = $copy }
      }
    }
    if ($files.Count -eq 0) {
      throw 'The framework root configuration was not found, so nothing was secured and nothing may be changed.'
    }
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/trust' -Name 'level' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'framework-root'
      filter  = 'system.web/trust'
      name    = 'level'
      value   = [string]$value
      existed = ($null -ne $value)
      files   = $files
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and copied the framework root configuration"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # The middle level is written, not the lowest. It takes away the privileges
    # that turn a fault into access to the system while leaving what an ordinary
    # application actually uses - a database connection above all. Going lower
    # is a separate decision and calls for testing of its own.
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/trust' -Name 'level' -Value 'Medium'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    # The whole file goes back rather than the one attribute being rewritten.
    # The copy taken before the change is the only complete record of what the
    # framework root configuration held.
    foreach ($f in $b.files) {
      if (-not (Test-Path $f.copy)) {
        throw 'A copy recorded in the backup file is missing, so nothing was restored.'
      }
    }
    foreach ($f in $b.files) {
      Copy-Item -Path $f.copy -Destination $f.source -Force
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.trustsection.level
  - https://learn.microsoft.com/aspnet/whitepapers/aspnet4/breaking-changes

notes:
  pl: |
    Naprawa ustawia poziom średni, nie najniższy. Średni odbiera to, co zamienia
    błąd w dostęp do systemu, a zostawia połączenie do bazy danych — czyli
    rzecz, bez której zwykła aplikacja i tak nie ruszy. Zejście niżej jest
    osobną decyzją i wymaga własnych testów.

    Sprawdzenie przechodzi przy trzech poziomach, nie przy jednym. Serwer już
    dostrojony niżej nie jest podnoszony do średniego tylko dlatego, że taka
    wartość jest tu wpisywana.

    Zapis idzie do konfiguracji głównej środowiska uruchomieniowego, czyli
    obejmuje wszystkie aplikacje na serwerze. Aplikacja z własnym wpisem
    w swoim pliku konfiguracyjnym nadpisuje tę wartość u siebie — i to jest
    właściwe miejsce na wyjątek dla jednej aplikacji, która bez pełnych
    uprawnień nie zadziała.

    Warto mieć w pamięci ograniczenie tego mechanizmu: nie jest granicą,
    na której można polegać wobec kodu celowo wrogiego. Wartość leży
    w ograniczeniu skutków błędu, nie w powstrzymaniu napastnika, który już
    wykonuje kod i zna to ograniczenie.
  en: |
    The fix sets the middle level, not the lowest. The middle one takes away what
    turns a fault into access to the system and leaves the database connection -
    the thing without which an ordinary application will not start anyway. Going
    lower is a separate decision and calls for testing of its own.

    The check passes at three levels, not one. A server already tuned lower is not
    raised to the middle merely because that is the value written here.

    The write goes to the framework root configuration, so it covers every
    application on the server. An application with an entry of its own in its
    configuration file overrides that value there - and that is the right place for
    an exception for the one application that will not work without full
    privileges.

    The limitation of this mechanism is worth keeping in mind - it is not a
    boundary to be relied on against deliberately hostile code. The worth lies in
    limiting the consequences of a fault, not in stopping an attacker who is
    already running code and knows about the limitation.
