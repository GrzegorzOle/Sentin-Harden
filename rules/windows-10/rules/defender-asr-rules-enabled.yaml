id: win10-defender-asr-rules-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Reguły ograniczania powierzchni ataku włączone
    en: Attack surface reduction rules enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza mechanizm ograniczania powierzchni ataku jako
    całość. Bez niego wszystkie reguły szczegółowe leżą w rejestrze
    i nie robią nic.

    Mechanizm ten różni się od skanowania tym, czego pilnuje. Skanowanie
    pyta, czym jest plik. Ograniczanie powierzchni ataku pyta, czy
    w systemie wolno wykonać pewne powiązanie czynności — na przykład czy
    pakiet biurowy może uruchomić powłokę. Odpowiedź nie zależy od tego,
    jaki dokument jest otwarty i czym napisano makro.

    Przesądza to o trwałości tej ochrony. Sygnatura opisuje jedną odmianę
    i traci ważność, gdy powstanie następna. Zablokowane powiązanie
    czynności pozostaje zablokowane niezależnie od tego, ile odmian
    powstanie, bo wszystkie muszą przez nie przejść.

    Odnotowuję rolę tego punktu w paczce: jest przełącznikiem nadrzędnym.
    Reguły szczegółowe opisane osobno mają sens wyłącznie po jego
    włączeniu, a raport pokazujący je jako spełnione przy wyłączonym
    przełączniku opisywałby stan, którego nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wszystkie
    powiązania czynności, których ten mechanizm zabrania, otwarte naraz.
  en: |
    The setting switches on the mechanism of attack surface reduction whole. Without it every detailed rule lies
    in the registry and does nothing.

    That mechanism differs from scanning in what it watches. Scanning asks what a file is. Attack surface
    reduction asks whether a certain joining of acts may be carried out in the system at all - for instance
    whether the office suite may start a shell. The answer does not hang upon which document is open nor upon
    what the macro was written in.

    That settles the lastingness of this guarding. A signature describes one strain and loses its force once the
    next comes about. A joining of acts once blocked stays blocked however many strains come about, every one of
    them having to go through it.

    I set down this item's part in the pack: it is the overriding switch. The detailed rules set out apart make
    sense only once it is switched on, and a report showing them as met with the switch off would describe a
    state that is not.

    What an attacker gains while the item goes unmet: every joining of acts this mechanism forbids, open at once.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, co
    w ślad za tym przełącznikiem zostanie włączone.

    Sam przełącznik niczego nie blokuje. Blokują reguły szczegółowe,
    a każda z nich ma własny opis skutków. Włączenie mechanizmu przy
    pustej liście reguł nie zmienia niczego w pracy maszyny.

    Sprawdzić trzeba więc nie ten punkt, lecz to, co obok niego stoi.
    Aplikacja powinna pokazać tu listę reguł szczegółowych, które są albo
    będą włączone — bo skutki wynikają z nich, a nie z przełącznika.

    Odnotowuję kolejność, bo ma znaczenie praktyczne. Bezpieczniej jest
    najpierw włączyć mechanizm z regułami ustawionymi na sam zapis,
    przejrzeć zdarzenia przez tydzień, a dopiero potem przestawić je na
    blokowanie. Reguła nie opisuje tej ścieżki, ale nic jej nie
    przekreśla.

    Czego to nie psuje: pracy pakietu biurowego, uruchamiania skryptów,
    wydajności, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "needs review", and the object of the review is what will be switched on in this switch's train.

    The switch of itself blocks nothing. The detailed rules block, and each of them has its own setting out of
    consequences. The switching on of the mechanism with an empty list of rules changes nothing in the machine's
    work.

    What has to be reviewed is therefore not this item but what stands beside it. The application ought to show
    here the list of the detailed rules that are or will be switched on - the consequences following from them
    and not from the switch.

    I set down the order, it mattering in practice. It is the safer to switch the mechanism on first with the
    rules set to a mere writing down, look the happenings over for a week, and only then set them to blocking.
    The rule does not describe that path, but nothing strikes it out.

    What this does not break: the office suite's working, the starting of scripts, the speed of work, logging on,
    file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - scripting-and-automation
  what_breaks:
    pl:
      - Sam przełącznik niczego nie blokuje, bo blokują reguły szczegółowe stojące obok niego
      - Skutki wynikają z reguł szczegółowych, a każda z nich ma własny opis i własną klasę uciążliwości
      - Włączenie mechanizmu przy pustej liście reguł nie zmienia niczego w pracy maszyny
      - Bezpieczniej jest przejrzeć zdarzenia przez tydzień przy regułach ustawionych na sam zapis, zanim przejdą na blokowanie
      - Praca pakietu biurowego, uruchamianie skryptów, wydajność, logowanie i drukowanie pozostają bez zmian
    en:
      - The switch of itself blocks nothing, the detailed rules standing beside it being what blocks
      - The consequences follow from the detailed rules, each of which has its own setting out and its own class of disruption
      - The switching on of the mechanism with an empty list of rules changes nothing in the machine s work
      - It is the safer to look the happenings over for a week with the rules set to a mere writing down, before they pass to blocking
      - The office suite s working, the starting of scripts, the speed of work, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ochronę na tej maszynie przejął produkt innego producenta i mechanizm pozostanie bezczynny
    en:
      - Another maker s product took the protection over upon this machine and the mechanism will stay idle
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ExploitGuard_ASR_Rules'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
    $name = 'ExploitGuard_ASR_Rules'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The switch turns the whole mechanism on. Without it the rules written beside
    # it stay in the registry and do nothing.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ExploitGuard_ASR_Rules' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction

notes:
  pl: |
    Reguła otwiera blok i jest w nim jedyną, która sama z siebie niczego
    nie blokuje. Warto, żeby aplikacja pokazała ją jako warunek
    pozostałych, a nie jako punkt równorzędny — inaczej użytkownik,
    który spełni wyłącznie ten, uzna mechanizm za wdrożony.

    Argument wart zachowania dotyczy tego, czym ta rodzina reguł różni się
    od skanowania. Skanowanie opisuje plik i traci ważność wraz
    z pojawieniem się nowej odmiany. Ograniczanie powierzchni ataku
    opisuje powiązanie czynności, a tego napastnik nie zmieni bez
    rezygnacji z celu.

    Odnotowuję wariant ostrożny, bo aplikacja może go zaproponować:
    włączenie mechanizmu z regułami ustawionymi na sam zapis, tydzień
    obserwacji, dopiero potem blokowanie. Nie jest to wymaganie punktu,
    ale jest to sposób na uniknięcie zaskoczenia na maszynach, których
    nikt wcześniej nie oglądał.
  en: |
    The rule opens the block and is the only one in it that of itself blocks nothing. It is well that the
    application show it as the condition of the rest and not as an item of equal standing - otherwise a user who
    meets this one alone will hold the mechanism rolled out.

    The argument worth keeping touches how this family of rules differs from scanning. Scanning describes a file
    and loses its force as a new strain comes up. Attack surface reduction describes a joining of acts, and that
    an attacker will not change without giving the end up.

    I set down the cautious variant, the application being able to offer it: the switching on of the mechanism
    with the rules set to a mere writing down, a week of watching, and only then the blocking. It is no
    requirement of the item, but it is a means of shunning a surprise upon machines nobody has looked at before.
