id: win2025-bitlocker-fixed-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Szyfrowanie całego dysku stałego z danymi wymuszone
    en: Full encryption of the fixed data drive enforced
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymusza szyfrowanie całego wolumenu z danymi zamiast samego
    miejsca zajętego przez pliki.

    Zostawiam kategorię wysoką. Mechanika jest ta sama co przy dysku
    systemowym, ale chcę pokazać, dlaczego na serwerze ten wariant waży
    więcej niż tamten, a nie tyle samo.

    Na stacji roboczej dysk z danymi to druga partycja, na której leżą
    dokumenty. Na serwerze dysk z danymi jest samą usługą: pliki bazy,
    zawartość udziałów, repozytorium kopii zapasowych. Cała wartość, dla
    której ta maszyna istnieje, leży właśnie tam, a nie na wolumenie
    systemowym, który da się odtworzyć z instalatora w godzinę.

    Do tego dochodzi rzecz specyficzna dla wolumenów danych: one nie tyle
    się starzeją, co krążą. Wolumen rozszerza się o nową przestrzeń,
    przenosi się na inną macierz, wraca z odtworzenia, bywa sklonowany na
    potrzeby środowiska testowego. Każda z tych operacji wnosi bloki
    z poprzedniego życia nośnika — a tryb częściowy zostawia je czytelne,
    bo z punktu widzenia systemu plików nic tam nie leży.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czytelną
    zawartość wolnej przestrzeni wolumenu, który przeszedł przez
    rozszerzenia, migracje i odtworzenia — czyli najbogatszy materiał,
    jaki na tej maszynie jest.
  en: |
    The item enforces encryption of the whole data volume rather than only
    the space occupied by files.

    I keep the category high. The mechanics are the same as at the system
    drive, but I want to show why on a server this variant weighs more than
    that one rather than the same.

    On a workstation the data drive is a second partition holding
    documents. On a server the data drive is the service itself: the
    database files, the contents of the shares, the backup repository. All
    the value this machine exists for lies there, not on the system volume,
    which can be rebuilt from an installer in an hour.

    On top of that comes something specific to data volumes: they do not so
    much age as circulate. A volume is extended with new space, moved to
    another array, returned from a restore, cloned for a test environment.
    Each of those operations brings in blocks from the medium's previous
    life - and partial mode leaves them readable, because as far as the
    file system is concerned nothing is there.

    What an attacker gains while the item goes unmet: the readable contents
    of the free space on a volume that has been through extensions,
    migrations and restores - that is, the richest material on this
    machine.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać koszt, który przy
    wolumenie danych jest inny niż przy systemowym, oraz powtórzyć jedno
    ograniczenie, bo warto je usłyszeć dwa razy.

    Koszt: wolumeny danych bywają wielokrotnie większe od systemowego.
    Pełne szyfrowanie idzie przez całą pojemność, także przez przestrzeń
    nigdy niezapisaną, więc na wolumenie liczonym w terabajtach jest to
    operacja na godziny albo doby, przez cały ten czas obciążająca
    macierz. Na maszynie, która z tego samego wolumenu obsługuje bazę,
    trzeba to policzyć razem z obciążeniem produkcyjnym, a nie osobno.

    Ograniczenie jest to samo co przy dysku systemowym i dotyczy tu
    większej liczby nośników: ustawienie działa w przód. Wolumeny
    zaszyfrowane wcześniej w trybie częściowym nie zmienią się, a wpis
    będzie zgodny. Na serwerze z kilkoma wolumenami danych łatwo o stan,
    w którym raport jest zielony, a połowa nośników ma czytelną wolną
    przestrzeń. Sprawdzenie trybu każdego wolumenu z osobna jest tu
    częścią pracy, a nie nadgorliwością.

    Sama zmiana wpisu nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review" and want to point out a cost that
    differs from the system volume, and to repeat one limitation, because
    it is worth hearing twice.

    The cost: data volumes are often many times larger than the system one.
    Full encryption goes through the entire capacity, including space never
    written to, so on a volume measured in terabytes it is an operation of
    hours or days, loading the array throughout. On a machine that serves a
    database from the same volume, that has to be counted together with the
    production load, not separately.

    The limitation is the same as at the system drive and here concerns
    more media: the setting works forward. Volumes encrypted earlier in
    partial mode will not change, and the entry will be compliant. On a
    server with several data volumes it is easy to end up with a green
    report and half the media holding readable free space. Checking the
    mode of each volume separately is part of the work here, not
    over-zealousness.

    The change to the entry itself needs no outage and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Pełne szyfrowanie wolumenu liczonego w terabajtach trwa godziny albo doby i przez cały ten czas obciąża macierz
      - Na maszynie obsługującej bazę z tego samego wolumenu obciążenie dodaje się do produkcyjnego
      - Wolumeny zaszyfrowane wcześniej w trybie częściowym nie zmienią się, a wpis będzie zgodny
      - Przy kilku wolumenach danych raport bywa zielony, choć połowa nośników ma czytelną wolną przestrzeń
    en:
      - Full encryption of a volume measured in terabytes takes hours or days and loads the array throughout
      - On a machine serving a database from the same volume, that load adds to the production load
      - Volumes encrypted earlier in partial mode will not change, and the entry will be compliant
      - With several data volumes the report may be green while half the media hold readable free space
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wolumen danych jest na tyle duży, że pełne szyfrowanie nie mieści się w żadnym dostępnym oknie
      - Macierz obsługująca ten wolumen pracuje już blisko granicy przepustowości
      - Ustawienie ma zastąpić sprawdzenie, w jakim trybie zaszyfrowano poszczególne wolumeny
    en:
      - The data volume is large enough that full encryption does not fit into any available window
      - The array serving this volume already works close to its throughput limit
      - The setting is meant to stand in for checking which mode each volume was encrypted in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: FULL
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'FDVEncryptionType' -ErrorAction SilentlyContinue).'FDVEncryptionType'
    [pscustomobject]@{
      path        = $path
      name        = 'FDVEncryptionType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This decides how volumes yet to be encrypted will be encrypted. Volumes
    # already encrypted in partial mode report compliant and keep their
    # readable free space - check each volume's actual mode separately.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Na stacji roboczej dysk z danymi to druga partycja z dokumentami. Na
    serwerze jest samą usługą — pliki bazy, zawartość udziałów,
    repozytorium kopii. Wolumen systemowy da się odtworzyć z instalatora
    w godzinę, ten nie.

    Wolumeny danych nie tyle się starzeją, co krążą: rozszerzenie,
    migracja na inną macierz, powrót z odtworzenia, klon na środowisko
    testowe. Każda z tych operacji wnosi bloki z poprzedniego życia
    nośnika.

    Ograniczenie powtarzam świadomie: ustawienie działa w przód. Przy kilku
    wolumenach łatwo o zielony raport i połowę nośników z czytelną wolną
    przestrzenią.
  en: |
    On a workstation the data drive is a second partition with documents.
    On a server it is the service itself - the database files, the contents
    of the shares, the backup repository. The system volume can be rebuilt
    from an installer in an hour; this one cannot.

    Data volumes do not so much age as circulate: an extension, a migration
    to another array, a return from a restore, a clone for a test
    environment. Each of those brings in blocks from the medium's previous
    life.

    I repeat the limitation deliberately: the setting works forward. With
    several volumes it is easy to end up with a green report and half the
    media holding readable free space.
