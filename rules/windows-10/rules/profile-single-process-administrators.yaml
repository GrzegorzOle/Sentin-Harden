id: win10-profile-single-process-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Profilowanie pojedynczego procesu zastrzeżone dla administratorów
    en: The measuring of a single process reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo profilowania pojedynczego procesu dla
    administratorów lokalnych.

    Profilowanie procesu pokazuje, co dany program robi w czasie: które
    fragmenty kodu wykonuje, jak często i jak długo. Służy do szukania
    przyczyn spowolnień w konkretnym programie.

    Zagrożenie polega na obserwacji cudzego procesu. Konto z tym prawem
    może przyglądać się programowi, którego nie uruchomiło — także
    procesowi ochrony przed złośliwym kodem albo programowi obsługującemu
    poświadczenia. Z przebiegu wykonania da się wywnioskować, co ten
    program właśnie robi i kiedy jest najbardziej zajęty.

    Odnotowuję, że nie jest to odczyt pamięci procesu. Pomiar pokazuje
    zachowanie, a nie zawartość — i właśnie dlatego ocena jest średnia,
    a nie wyższa. Materiał ten przydaje się do przygotowania kroku
    następnego, nie do wykonania go.

    Sprawdzenie przyjmuje wykaz węższy niż wymagany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wgląd
    w zachowanie cudzych procesów, w tym oprogramowania ochronnego.
  en: |
    The setting reserves the right of measuring a single process to the local administrators.

    The measuring of a process shows what a given program does in time: which pieces of code it carries out, how
    often and how long. It serves for the seeking of the grounds of slownesses in one program.

    The danger rests upon the watching of another's process. An account with this right may look upon a program it
    did not start - upon the process of the guarding against harmful code too, or a program that handles
    credentials. From the course of the carrying out it may be gathered what that program is now doing and when it
    is busiest.

    I set down that it is no reading of a process's memory. The measuring shows behaviour and not content - and
    for that very reason the grading is middling and no higher. That matter serves for the laying of the next step
    and not for the doing of it.

    The check takes a list narrower than the one called for.

    What an attacker gains while the item goes unmet: a sight of the behaviour of others' processes, the guarding
    software among them.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz zawiera samych administratorów i na maszynie
    utrzymywanej normalnie zmiana jest zapisem stanu.

    Odnotowuję jedyne miejsce warte spojrzenia: narzędzia programistyczne
    mierzące wydajność własnych programów. Działają one na procesach
    uruchomionych przez tego samego użytkownika i w większości nie
    przechodzą przez ten mechanizm, ale część starszych narzędzi tak.
    Po zmianie zgłoszą błąd uprawnień przy próbie pomiaru.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: pracy programów użytkowych, wydajności maszyny,
    logowania, dostępu do plików, drukowania.
  en: |
    The class is "no disruption".

    The default list holds the administrators alone, and upon a machine kept in the ordinary way the change is a
    setting down of a state.

    I set down the one place worth a look: tools of programming that measure the performance of programs of their
    own. They work upon processes started by that same user and for the most part do not pass through this
    mechanism, but some of the older tools do. After the change they will report a fault of rights at an attempt
    to measure.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the work of programs of use, the machine's speed, logging on, the way to files, or
    printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Starsze narzędzia programistyczne mierzące wydajność zgłoszą błąd uprawnień przy próbie pomiaru
      - Nowsze narzędzia pracujące na procesach tego samego użytkownika zwykle przez ten mechanizm nie przechodzą
      - Domyślny wykaz zawiera samych administratorów, więc na większości maszyn zmiana jest zapisem stanu
      - Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo
      - Praca programów użytkowych, wydajność maszyny, logowanie, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - Older tools of programming that measure performance will report a fault of rights at an attempt to measure
      - Newer tools working upon processes of that same user commonly do not pass through this mechanism
      - The default list holds the administrators alone, so upon most machines the change is a setting down of a state
      - The consequence shows at the next signing in of an account that loses the right
      - The work of programs of use, the machine s speed, logging on, the way to files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko służy do programowania i starsze narzędzia pomiaru wydajności wymagają tego prawa
    en:
      - The station serves for programming and older tools of the measuring of performance call for this right
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeProfileSingleProcessPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeProfileSingleProcessPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeProfileSingleProcessPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeProfileSingleProcessPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeProfileSingleProcessPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/profile-single-process

notes:
  pl: |
    Reguła jest węższą parą punktu o profilowaniu całego systemu i warto,
    żeby aplikacja pokazała je razem. Różnica zasięgu jest tu treścią:
    tamten daje obraz maszyny, ten pozwala przyjrzeć się jednemu
    wybranemu programowi.

    Argument wart postawienia wprost dotyczy granicy między zachowaniem
    a zawartością. Pomiar nie odczytuje pamięci i nie da się z niego wyjąć
    hasła. Da się natomiast ustalić, kiedy program obsługujący
    poświadczenia jest zajęty, a kiedy stoi — a to wystarcza do wyboru
    momentu.

    Odnotowuję, że na stanowisku programistycznym punkt ten bywa jedynym
    z całego bloku, który komuś realnie przeszkodzi. Warto to wymienić
    zamiast zapewniać, że zmiana nie kosztuje nic — bo na takiej maszynie
    kosztuje.
  en: |
    The rule is the narrower pair of the item about the measuring of the whole system, and it is well that the
    application show them together. The difference of reach is here the substance: that one gives a picture of the
    machine, this lets one look upon a single chosen program.

    The argument worth putting outright touches the bound between behaviour and content. The measuring does not
    read memory and no password may be taken out of it. There may however be settled when a program that handles
    credentials is busy and when it stands idle - and that is enough for the choosing of the hour.

    I set down that upon a station for programming this item is at times the only one of the whole block that will
    truly hinder somebody. That is worth naming rather than an assurance that the change costs nothing - upon such
    a machine it costs.
