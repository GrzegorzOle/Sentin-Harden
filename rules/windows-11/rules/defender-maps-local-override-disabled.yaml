id: win11-defender-maps-local-override-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Lokalne nadpisanie ustawień zgłaszania do usługi rozpoznawania zablokowane
    en: Local overriding of the reporting settings for the recognition service blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy użytkownik pracujący na tej maszynie może
    zmienić to, co ochrona zgłasza do usługi rozpoznawania nowych zagrożeń —
    czyli nadpisać własnym wyborem decyzję zapisaną w zasadzie.

    Punkt nie mówi, ile ma być zgłaszane. To rozstrzyga osobna reguła w tej
    paczce. Ten punkt mówi, kto o tym decyduje, a taka zasada ma sens tylko
    wtedy, gdy jej nie da się na miejscu odkręcić.

    Warto nazwać rzecz wprost: zasada, którą użytkownik może nadpisać, jest
    zapisem intencji, a nie zabezpieczeniem. W raporcie wygląda tak samo jak
    zasada obowiązująca, a nie obowiązuje. Ta różnica jest całą treścią
    punktu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    ograniczenia tego, co ochrona zgłasza, bez naruszania samej zasady. Jest
    to czynność cicha — nie wyłącza ochrony, nie zmienia jej stanu w żadnym
    widocznym miejscu, a odcina ją od materiału, który pozwala rozpoznać
    zagrożenie jeszcze nieopisane. Ochrona pracuje dalej i wygląda na
    sprawną, tylko rozpoznaje mniej.

    Zablokowanie nadpisania sprawia, że stan zgłaszania jest taki, jak
    zapisano w zasadzie, i pozostaje taki niezależnie od tego, co ktoś zrobi
    na miejscu.
  en: |
    The setting settles whether a user working on this machine may change what the
    protection reports to the service recognising new threats - that is, override by their
    own choice the decision written into the policy.

    The item does not say how much is to be reported. A separate rule in this pack settles
    that. This item says who decides it, and such a policy makes sense only where it
    cannot be undone on the spot.

    The thing is worth naming outright: a policy a user may override is a record of intent
    rather than a safeguard. In the report it looks just like a binding policy, and it
    does not bind. That difference is the whole content of the item.

    What an attacker gains while the item goes unmet: the means of limiting what the
    protection reports without touching the policy itself. It is a quiet act - it does not
    switch protection off, does not change its state in any visible place, and cuts it off
    from the material that allows a threat not yet described to be recognised. The
    protection works on and looks sound, only it recognises less.

    Blocking the override makes the state of reporting what the policy says, and keeps it
    so whatever anybody does on the spot.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek na maszynie zmienia te ustawienia
    świadomie — bo dla niego zmiana odbiera możliwość, z której korzystał.

    Skutek jest wąski. Przełącznik dotyczący zgłaszania w ustawieniach ochrony
    przestaje reagować albo znika, a w jego miejscu pojawia się informacja
    o decyzji administratora. Nie dotyczy to pozostałych ustawień ochrony.

    Odczuje to osoba, która wyłączała zgłaszanie na czas pracy z materiałem,
    którego nie chce wysyłać na zewnątrz — na przykład przy analizie próbek
    albo pracy na danych objętych szczególnym reżimem. Po zmianie takie
    wyłączenie przestaje być możliwe z poziomu maszyny i wymaga zmiany zasady.

    Dla użytkownika, który tych ustawień nie dotyka, a takich jest większość,
    zmiana jest niewidoczna.

    Zmiana nie wymaga restartu i działa od razu.
  en: |
    What needs checking is whether anybody on the machine changes these settings
    knowingly - since for them the change takes away something they used.

    The effect is narrow. The switch concerning reporting in the protection settings stops
    responding or disappears, and in its place a note about an administrator's decision
    appears. It does not concern the other protection settings.

    It will be felt by whoever switched reporting off for the time of work with material
    they do not wish to send outward - for instance when analysing samples or working on
    data under a particular regime. After the change such a switching off stops being
    possible from the machine and takes a change of policy.

    For a user who does not touch these settings, and most do not, the change is invisible.

    The change takes no restart and works at once.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Przełącznik zgłaszania w ustawieniach ochrony przestaje reagować na zmianę
      - Wyłączenie zgłaszania na czas pracy z materiałem wrażliwym wymaga zmiany zasady
      - Pozostałe ustawienia ochrony pozostają dostępne bez zmiany
    en:
      - The reporting switch in the protection settings stops responding to change
      - Switching reporting off for work with sensitive material takes a change of policy
      - The other protection settings stay available unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie prowadzi się analizę próbek i zgłaszanie bywa świadomie wyłączane
      - Praca odbywa się na danych, których wysyłanie na zewnątrz jest zabronione regulaminem
    en:
      - Samples are analysed on the machine and reporting is sometimes switched off knowingly
      - The work is on data whose sending outward is forbidden by rule
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero here means the local setting may not override the policy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LocalSettingOverrideSpynetReporting'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $current = (Get-ItemProperty -Path $path -Name 'LocalSettingOverrideSpynetReporting' -ErrorAction SilentlyContinue).'LocalSettingOverrideSpynetReporting'
    [pscustomobject]@{
      path        = $path
      name        = 'LocalSettingOverrideSpynetReporting'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LocalSettingOverrideSpynetReporting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła nie ma sensu samodzielnie i warto ją czytać razem z tą, która
    ustala poziom zgłaszania. Zablokowanie nadpisania przy niezapisanym
    poziomie utrwala stan domyślny, a nie zamierzony.

    Jest to jedna z kilku reguł w tej paczce, których treścią jest nie sam
    stan ustawienia, lecz to, czy da się go zmienić na miejscu. Warto je
    czytać jako osobną warstwę: bez niej pozostałe zasady opisują zamiar,
    a nie stan faktyczny.

    Brak wartości nie jest stanem zgodnym. Domyślnie nadpisanie bywa możliwe,
    więc reguła wymaga zapisania zera wprost.
  en: |
    The rule makes no sense on its own and is worth reading together with the one that
    fixes the level of reporting. Blocking the override where the level is not written
    down fixes the default state rather than the intended one.

    It is one of several rules in this pack whose content is not the state of a setting
    but whether it can be changed on the spot. They are worth reading as a separate layer:
    without it the other policies describe an intent rather than a state of fact.

    A missing value is not a compliant state. By default overriding is sometimes possible,
    so the rule takes writing a zero outright.
