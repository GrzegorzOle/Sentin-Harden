id: win10-rdp-single-session-per-user

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Connections
  title:
    pl: Jedna sesja pulpitu zdalnego na użytkownika
    en: One session of the desk from afar to a user
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza, żeby jedno konto miało na maszynie najwyżej jedną
    sesję pulpitu zdalnego naraz.

    Bez tego ograniczenia połączenie tym samym kontem otwiera sesję nową,
    zostawiając poprzednią działającą w tle. Użytkownik nie widzi tamtej
    i nie ma powodu podejrzewać, że istnieje.

    Zagrożenie pierwsze to sesja pozostawiona. Napastnik posługujący się
    przejętym kontem otwiera własną sesję, nie przerywając pracy
    prawowitego użytkownika, więc nic nie zwraca niczyjej uwagi.

    Zagrożenie drugie to porzucone sesje. Każda z nich trzyma w pamięci
    poświadczenia, a poświadczenia w pamięci są tym, po co sięga się
    najpierw po przejęciu maszyny.

    Zagrożenie trzecie to rozliczalność. Przy wielu sesjach jednego
    konta nie da się powiedzieć, która z nich wykonała daną czynność,
    a właśnie to pytanie zadaje audyt.

    Odnotowuję zysk uboczny: ograniczenie porządkuje zasoby, bo sesje
    porzucone przestają się mnożyć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: własną
    sesję obok sesji użytkownika, niewidoczną dla niego.
  en: |
    The setting drives that one reckoning have upon the machine at most one session of the desk from afar at a
    time.

    Without that bound a joining by that same reckoning opens a new session and leaves the former working behind
    the scene. The user sees not that one and has no ground to suspect it is there.

    The first danger is a session left behind. An attacker using a taken reckoning opens a session of their own
    without breaking the work of the rightful user, so nothing draws anybody's notice.

    The second danger is sessions cast aside. Each holds warrants in memory, and warrants in memory are what is
    reached for first after a machine is taken.

    The third danger is the answering for deeds. With many sessions of one reckoning it cannot be told which of
    them worked a given doing, and that is just the question an audit asks.

    I set down a gain upon the side: the bound sets the means in order, sessions cast aside ceasing to multiply.

    What an attacker gains while the item goes unmet: a session of their own beside the user's, unseen by them.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś celowo pracuje w kilku sesjach naraz.

    Miejscem pierwszym są osoby zarządzające, które zostawiają otwartą
    sesję z długo działającym zadaniem i otwierają drugą do bieżącej
    pracy. Po zmianie połączenie przejmie sesję istniejącą zamiast
    tworzyć nową — co dla zadania w tle jest zwykle bezpieczne, ale
    zmienia sposób pracy.

    Miejscem drugim są konta współdzielone, na których pracuje kilka
    osób naraz. Po zmianie będą odbierać sobie sesję nawzajem, a objaw
    wygląda jak rozłączanie bez powodu.

    Odnotowuję, że konta współdzielone są tu problemem właściwym, a nie
    skutkiem ubocznym punktu. Właściwym rozwiązaniem jest konto na osobę,
    a nie odpuszczenie ograniczenia.

    Skutek jest widoczny dla użytkownika w postaci powrotu do sesji
    zamiast otwarcia nowej.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: pracy w jednej sesji, pracy programów, sieci,
    logowania przy maszynie, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody works of set purpose in several
    sessions at once.

    The first place is those who order machines and leave a session open with a long-running task while opening a
    second for the work of the hour. After the change the joining will take up the session that is there instead
    of making a new one - which for a task behind the scene is commonly safe, but changes the manner of work.

    The second place is shared reckonings upon which several people work at once. After the change they will take
    the session from one another, and the sign of it looks like a breaking off for no cause.

    I set down that shared reckonings are here the true trouble and no side upshot of the item. The right answer
    is a reckoning to a person and not the letting go of the bound.

    The consequence is plain to the user in the shape of a return to the session instead of the opening of a new
    one.

    The consequence shows at once, with no restart.

    What this does not break: work in one session, the work of programs, the network, logging on at the machine,
    or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Połączenie przejmie sesję istniejącą zamiast tworzyć nową, co zmienia sposób pracy osób zarządzających
      - Na koncie współdzielonym kilka osób będzie odbierać sobie sesję nawzajem
      - Objaw wygląda jak rozłączanie bez powodu, więc trafi do wsparcia jako usterka
      - Konta współdzielone są tu problemem właściwym, a rozwiązaniem jest konto na osobę
      - Praca w jednej sesji, praca programów, sieć, logowanie przy maszynie i drukowanie pozostają bez zmian
    en:
      - The joining will take up the session that is there instead of making a new one, which changes the manner of work
      - Upon a shared reckoning several people will take the session from one another
      - The sign of it looks like a breaking off for no cause and will reach the board of help as a fault
      - Shared reckonings are here the true trouble, and the answer is a reckoning to a person
      - Work in one session, the work of programs, the network, logging on at the machine and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje kilka osób jednocześnie na jednym koncie współdzielonym
    en:
      - Upon the machine several people work at once upon one shared reckoning
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'fSingleSessionPerUser'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fSingleSessionPerUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fSingleSessionPerUser' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła daje objaw, który trafia do wsparcia jako usterka, i warto,
    żeby aplikacja uprzedziła o nim wprost: przy koncie współdzielonym
    użytkownicy zaczną odbierać sobie sesję nawzajem.

    Argument wart postawienia dotyczy sesji niewidocznej. Napastnik
    posługujący się przejętym kontem otwiera własną sesję, nie przerywając
    pracy prawowitego użytkownika, więc nic nie zwraca niczyjej uwagi.

    Odnotowuję konta współdzielone jako problem właściwy, a nie skutek
    uboczny punktu. Aplikacja powinna to nazwać, bo pokusa odpuszczenia
    ograniczenia jest tu największa, a przyczyna leży gdzie indziej.
  en: |
    The rule gives a sign that reaches the board of help as a fault, and it is well that the application forestall
    it outright: upon a shared reckoning the users will begin to take the session from one another.

    The argument worth putting touches the unseen session. An attacker using a taken reckoning opens a session of
    their own without breaking the rightful user's work, so nothing draws anybody's notice.

    I set down shared reckonings as the true trouble and no side upshot of the item. The application ought to name
    it, the draw toward letting the bound go being here at its greatest while the cause lies elsewhere.
