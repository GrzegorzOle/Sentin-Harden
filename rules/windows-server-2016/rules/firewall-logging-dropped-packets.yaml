id: win2016-firewall-logging-dropped-packets

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Rejestrowanie pakietów odrzuconych włączone we wszystkich profilach
    en: Logging of dropped packets switched on in all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zaporze zapisywać połączenia, które odrzuciła, zamiast
    odrzucać je w milczeniu.

    Zapora bez dziennika działa poprawnie i nie zostawia po sobie wiedzy.
    Blokuje, co ma blokować, i nikt nigdy się nie dowie, co to było. Dla
    maszyny nie ma to znaczenia; dla człowieka, który ma ustalić, co się na
    niej działo, jest to różnica między śledztwem a zgadywaniem.

    Wartość zapisu jest dwojaka. Po pierwsze rozpoznanie: napastnik badający
    sieć próbuje kolejnych portów, a to zostawia w dzienniku wzór nie do
    pomylenia z niczym innym — wiele prób z jednego adresu, w krótkim czasie,
    na porty, które nikogo nie interesują. Bez dziennika ten etap ataku jest
    całkowicie niewidoczny.

    Po drugie ustalanie przebiegu po fakcie. Gdy już wiadomo, że coś się
    stało, pytanie brzmi zwykle „skąd i kiedy zaczęli". Dziennik odrzuceń
    odpowiada na nie dokładnie, bo notuje też próby nieudane — czyli
    wszystko, co poprzedza udane wejście.

    Zapis ten ma także zastosowanie codzienne, niezwiązane z atakiem: jest
    jedynym miejscem, w którym widać, że usługa nie działa dlatego, że zapora
    ją odcięła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    badania maszyny portem po porcie bez zostawiania jakiegokolwiek śladu
    i pewność, że etap rozpoznania nie trafi do żadnego dziennika.
  en: |
    The setting has the firewall write down the connections it has rejected, instead
    of rejecting them in silence.

    A firewall with no log works properly and leaves no knowledge behind. It blocks
    what it is to block, and nobody will ever learn what that was. To the machine it
    makes no difference; to a person who has to establish what happened on it, it is
    the difference between an inquiry and guesswork.

    The value of the record is twofold. First, recognition: an attacker probing a
    network tries port after port, and that leaves in the log a pattern not to be
    mistaken for anything else - many attempts from one address, in a short time, at
    ports nobody is interested in. Without the log that stage of an attack is wholly
    invisible.

    Second, establishing the course of events after the fact. Once it is known that
    something has happened, the question as a rule reads "from where and when did
    they begin". The log of rejections answers it exactly, since it notes failed
    attempts too - which is to say everything that comes before a successful entry.

    The record has an everyday use as well, unconnected with attack: it is the one
    place where it can be seen that a service does not work because the firewall has
    cut it off.

    What an attacker gains while the item goes unmet: the means of probing the
    machine port by port without leaving any trace at all, and the certainty that
    the reconnaissance stage will reach no log.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zapis do dziennika nie zmienia niczego w tym,
    co zapora przepuszcza i co blokuje — zmienia wyłącznie to, czy zostaje
    po tym ślad.

    Jedyny koszt jest wydajnościowy i na maszynie serwerowej pomijalny.
    Zapis odrzuceń jest zwykle rzadki, bo odrzuca się to, czego nikt nie
    wysyła świadomie. Wyjątkiem jest maszyna wystawiona do sieci publicznej,
    gdzie tło skanowania bywa stałe — tam dziennik rośnie szybciej i warto
    sprawdzić, czy jego rozmiar jest ustawiony rozsądnie.

    Rzecz warta odnotowania: dziennik zapory ma domyślny rozmiar i po jego
    osiągnięciu zaczyna się nadpisywać. Na maszynie zalewanej próbami
    połączeń najstarsze wpisy znikają w ciągu godzin, więc sam zapis nie
    wystarcza — potrzebna jest albo większa pojemność, albo zbieranie
    dziennika na zewnątrz.

    Czego to nie psuje: działania zapory, reguł, usług, połączeń,
    wydajności sieci.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Writing to a log changes nothing in what the
    firewall lets through and what it blocks - it changes only whether a trace is
    left behind.

    The one cost is one of performance and is negligible on a server machine. The
    record of rejections is as a rule sparse, since what gets rejected is what
    nobody sends deliberately. The exception is a machine exposed to a public
    network, where a background of scanning can be constant - there the log grows
    faster and it is worth checking that its size is set sensibly.

    Worth noting: the firewall log has a default size and begins overwriting itself
    once it reaches it. On a machine flooded with connection attempts the oldest
    entries vanish within hours, so the record alone does not suffice - either a
    larger capacity is needed, or the log must be gathered elsewhere.

    What this does not break: the firewall's working, rules, services, connections,
    or network performance.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Na maszynie wystawionej do sieci publicznej dziennik rośnie szybko i przy domyślnym rozmiarze najstarsze wpisy znikają w ciągu godzin
      - Sam zapis nie wystarcza do ustalania przebiegu po fakcie, jeśli nie zwiększono pojemności ani nie zbiera się dziennika na zewnątrz
      - Zapis zajmuje miejsce na woluminie systemowym, więc warto sprawdzić wolną przestrzeń przed wdrożeniem
      - Działanie zapory, reguły, usługi i połączenia pozostają bez zmian
    en:
      - On a machine exposed to a public network the log grows fast and at the default size the oldest entries vanish within hours
      - The record alone does not suffice for establishing the course of events after the fact, if the capacity has not been raised nor the log gathered elsewhere
      - The record takes up room on the system volume, so free space is worth checking before rollout
      - The firewall's working, rules, services and connections stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na woluminie systemowym brakuje wolnego miejsca i zapis dziennika pogłębiłby ten stan
      - Maszyna jest zalewana próbami połączeń, a rozmiar dziennika pozostał domyślny, więc zapis nadpisze się zanim ktokolwiek go przeczyta
    en:
      - There is no free room on the system volume and writing the log would worsen that state
      - The machine is flooded with connection attempts while the log size has been left at its default, so the record will overwrite itself before anybody reads it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $silent = @($profiles | Where-Object { $_.LogBlocked -ne 'True' })
        if ($silent.Count -eq 0) { 'ALL_LOGGED' } else { 'SILENT_IN_' + ($silent.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_LOGGED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogBlocked |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogBlocked True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogBlocked $p.LogBlocked
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt jest naturalną przeciwwagą dla reguły o wyłączeniu powiadomień
    zapory. Tamta odbiera sygnał głośny i podawany w złym miejscu; ta daje
    ten sam sygnał cicho i we właściwym. Wdrażane osobno pogarszają sytuację
    — razem ją poprawiają, i tak warto je pokazywać.

    Ocena średnia jest tu nadana świadomie. Dziennik sam z siebie niczego nie
    blokuje; jego wartość ujawnia się dopiero wtedy, gdy ktoś go czyta albo
    zbiera. Reguła, która daje dane nieczytane przez nikogo, daje mniej, niż
    się wydaje, i warto to powiedzieć wprost.

    Zastrzeżenie o rozmiarze dziennika powinno być widoczne przy punkcie,
    bo bez niego reguła bywa spełniona formalnie i bezużyteczna praktycznie.
    Osobny plik dziennika dla każdego profilu, opisany w regule sąsiedniej,
    ten problem częściowo łagodzi.
  en: |
    The item is the natural counterweight to the rule on switching firewall
    notifications off. That one takes away a signal that is loud and given in the
    wrong place; this one gives the same signal quietly and in the right one. Rolled
    out apart they worsen the situation - together they improve it, and that is how
    they are worth showing.

    The medium judgement is given deliberately here. The log blocks nothing of
    itself; its value shows only where somebody reads or gathers it. A rule giving
    data nobody reads gives less than it seems to, and that is worth saying
    outright.

    The reservation about log size should be visible at the item, since without it
    the rule is at times met in form and useless in practice. A separate log file
    for each profile, described in the neighbouring rule, eases that problem in
    part.
