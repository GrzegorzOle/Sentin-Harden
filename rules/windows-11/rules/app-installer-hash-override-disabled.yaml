id: win11-app-installer-hash-override-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Pomijanie sprawdzenia skrótu pakietu zablokowane
    en: Skipping the check of a package digest blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Opis pakietu w repozytorium niesie skrót treści pliku instalacyjnego.
    Instalator pobiera plik, liczy skrót i porównuje go z tym z opisu. Gdy się
    nie zgadza, instalacja jest przerywana.

    Jest to jedyny mechanizm, który w tej drodze instalacji rozstrzyga, czy
    pobrany plik jest tym, co opisano. Repozytorium podaje adres pliku, ale
    plik leży gdzie indziej — na serwerze producenta, w sieci dostarczania
    treści, za przekierowaniem. Skrót jest jedynym wiązaniem między opisem
    a treścią.

    Instalator ma jednak przełącznik pozwalający to porównanie pominąć.
    Z przełącznikiem dostępnym cały mechanizm staje się dobrowolny: wystarczy
    dodać do polecenia jeden przełącznik, żeby zainstalować plik, który się nie
    zgadza. Przełącznik trafia do skryptów jako obejście błędu i zostaje tam
    na stałe, bo raz wpisany przestaje być widoczny.

    Zablokowanie przełącznika sprawia, że sprawdzenie skrótu jest
    obowiązkowe — a przez to znaczy to, co ma znaczyć.
  en: |
    A package's description in a repository carries a digest of the installation file's
    content. The installer fetches the file, works out the digest and compares it with
    the one from the description. Where they do not agree, the installation is broken
    off.

    It is the only mechanism that, on this installation route, settles whether the
    fetched file is what was described. The repository gives the file's address, but the
    file lies elsewhere - on the maker's server, in a content delivery network, behind a
    redirection. The digest is the only binding between description and content.

    The installer, though, has a switch allowing that comparison to be passed over. With
    the switch available the whole mechanism becomes voluntary: adding one switch to the
    command is enough to install a file that does not agree. The switch finds its way
    into scripts as a way round an error and stays there for good, because once typed it
    stops being visible.

    Blocking the switch makes checking the digest compulsory - and by that makes it mean
    what it is meant to mean.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w skryptach instalacyjnych używanych w organizacji
    występuje przełącznik pomijający sprawdzenie skrótu.

    Tam, gdzie nie występuje, zmiana nie robi nic. Instalacja zgodnych pakietów
    przebiega tak samo jak wcześniej, bo dla nich porównanie i tak wypada
    pomyślnie.

    Tam, gdzie występuje, skrypt zakończy się błędem. Ważne jest, jak to
    odczytać: przełącznik trafił do skryptu dlatego, że sprawdzenie skrótu
    kiedyś nie przeszło. Błąd po wdrożeniu nie jest więc nową usterką, tylko
    powrotem starej, dotąd zagłuszonej. Rozwiązaniem jest poprawienie opisu
    pakietu albo wskazanie właściwego pliku, nie cofnięcie zmiany.

    Osobnym przypadkiem są pakiety z repozytorium wewnętrznego, w którym opisy
    są przygotowywane ręcznie. Tam niezgodność skrótu bywa regułą, a nie
    wyjątkiem, bo plik podmienia się bez poprawienia opisu. Wdrożenie wymusi
    uporządkowanie tego repozytorium i jest to praca, którą trzeba przewidzieć.

    Nie ma restartu.
  en: |
    What needs checking is whether the switch passing the digest check over appears in
    the installation scripts used in the organisation.

    Where it does not, the change does nothing. Installing agreeing packages runs just
    as before, since for them the comparison comes out right anyway.

    Where it does, the script will end in an error. How to read that matters: the switch
    found its way into the script because the digest check once did not pass. So an
    error after the rollout is not a new fault but the return of an old one, muffled
    until now. The answer is correcting the package description or pointing at the right
    file, not undoing the change.

    Packages from an internal repository whose descriptions are prepared by hand are a
    case of their own. There a disagreeing digest is the rule rather than the exception,
    because the file is swapped without the description being corrected. The rollout
    will force that repository to be put in order, and that is work to be reckoned with.

    There is no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypt instalacyjny z przełącznikiem pomijającym sprawdzenie skrótu kończy się błędem
      - Pakiet z repozytorium wewnętrznego o nieaktualnym opisie nie da się zainstalować
      - Instalacja pakietu, którego skrót się zgadza, przebiega bez żadnej zmiany
      - Programy zainstalowane wcześniej działają dalej bez zmian
    en:
      - An installation script with the switch passing the digest check over ends in an error
      - A package from an internal repository with an out of date description cannot be installed
      - Installing a package whose digest agrees runs with no change at all
      - Programs installed earlier carry on working unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Repozytorium wewnętrzne ma opisy pakietów niezgodne z plikami i nie da się ich teraz poprawić
      - Wdrożenie oprogramowania jest pilne, a poprawienie opisu pakietu wymaga udziału dostawcy
    en:
      - An internal repository has package descriptions disagreeing with the files and they cannot be corrected now
      - A software rollout is urgent and correcting the package description takes the supplier's part
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableHashOverride'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableHashOverride'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableHashOverride' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Punkt ma znaczenie tylko wtedy, gdy instalator pozostaje włączony.
    Na maszynie, na której wyłączono go w całości osobną regułą, jest
    zgodnością bez skutku — i warto go tam mimo wszystko ustawić, bo broni
    maszyny po ewentualnym cofnięciu tamtej zmiany.

    Sprawdzenie skrótu nie zastępuje podpisu pliku i nie należy go tak czytać.
    Skrót mówi, że pobrano to, co opisano w repozytorium; o tym, czy opis
    w repozytorium jest godny zaufania, rozstrzygają ustawienia źródeł,
    a o pochodzeniu samego pliku — jego podpis.

    Gałąź zasad jest wspólna dla wszystkich ustawień tego instalatora, więc
    wycofanie usuwa wyłącznie sam wpis.
  en: |
    The item matters only while the installer stays on. On a machine where it was
    switched off altogether by a rule of its own, this is compliance with no effect -
    and it is worth setting there all the same, since it guards the machine should that
    change ever be undone.

    Checking the digest does not stand in for a file's signature and should not be read
    that way. The digest says that what was fetched is what the repository described;
    whether the repository's description is worthy of trust is settled by the settings
    on sources, and where the file itself came from, by its signature.

    The policy key is shared by every setting of this installer, so rollback removes the
    entry alone.
