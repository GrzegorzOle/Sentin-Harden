id: win2016-firewall-inbound-default-block

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Domyślne blokowanie połączeń przychodzących we wszystkich profilach
    en: Inbound connections blocked by default in all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, co zapora robi z połączeniem przychodzącym,
    którego nie opisuje żadna reguła.

    Jest to pytanie o domyślną odpowiedź, nie o żadną konkretną usługę.
    Reguły opisują wyjątki; ustawienie domyślne opisuje wszystko pozostałe —
    a wszystko pozostałe jest z natury tym, czego nikt nie przewidział.

    Zapora włączona, ale przepuszczająca domyślnie, daje ochronę pozorną.
    Odpowiada na pytanie „czy zapora działa" twierdząco, a jednocześnie
    przepuszcza każde połączenie, dla którego nie napisano reguły
    blokującej. Odwraca to porządek: zamiast wyliczać, co wolno, trzeba
    wyliczyć, czego nie wolno — czyli przewidzieć wszystko.

    Wartość zmiany bierze się stąd, że usługi uruchamiają się na maszynie
    bez pytania administratora. Rola dodana do systemu, zainstalowana
    aplikacja, narzędzie diagnostyczne zostawione po awarii — każde z nich
    potrafi otworzyć port. Przy blokowaniu domyślnym taki port pozostaje
    niedostępny z sieci, dopóki ktoś świadomie nie napisze reguły.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    każdego portu, dla którego nikt nie pomyślał o regule blokującej, czyli
    przede wszystkim do usług otwartych bez wiedzy administratora.
  en: |
    The setting settles what the firewall does with an inbound connection no rule
    describes.

    This is a question about the default answer rather than about any particular
    service. Rules describe exceptions; the default setting describes all the rest -
    and all the rest is by its nature what nobody foresaw.

    A firewall switched on but letting through by default gives protection in
    appearance. It answers the question "is the firewall working" in the
    affirmative, and lets through at the same time every connection for which no
    blocking rule has been written. That reverses the order: instead of enumerating
    what is allowed, one has to enumerate what is not - which is to foresee
    everything.

    The value of the change comes of services starting on a machine without asking
    the administrator. A role added to the system, an installed application, a
    diagnostic tool left behind after a breakdown - each of them can open a port.
    With blocking by default such a port stays unreachable from the network until
    somebody deliberately writes a rule.

    What an attacker gains while the item goes unmet: access to every port nobody
    thought to write a blocking rule for, which is to say above all to services
    opened without the administrator's knowledge.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", choć na większości maszyn wartość ta
    jest już ustawiona, bo tak wygląda stan domyślny systemu.

    Kłopot pojawia się tam, gdzie ktoś ją kiedyś zmienił — i zwykle zrobił
    to po to, żeby coś zaczęło działać. Zmiana wsteczna przywraca wtedy
    dokładnie ten problem, który wcześniej obszedł, a od tamtej decyzji
    zwykle minęły lata i nikt nie pamięta, czego dotyczyła.

    Sprawdzenie polega na wyliczeniu usług osiągalnych z sieci i upewnieniu
    się, że każda ma regułę dopuszczającą. Rzecz, która najczęściej umyka:
    reguły bywają przypisane do jednego profilu, a ustawienie domyślne
    zmienia się we wszystkich trzech.

    Osobno trzeba wymienić ruch wewnętrzny maszyn wirtualnych i klastrów.
    Połączenia między węzłami, ruch replikacji i komunikacja przez
    przełącznik wirtualny potrafią nie mieć własnych reguł, bo dotąd
    przechodziły domyślnie.

    Objaw jest natychmiastowy i ostry: usługa przestaje być osiągalna. Tak
    samo jak przy włączaniu zapory, zmiana wprowadzana zdalnie potrafi
    odciąć drogę naprawy.

    Czego to nie psuje: połączeń wychodzących, ruchu lokalnego, usług
    z regułą dopuszczającą, odpowiedzi na połączenia nawiązane przez
    maszynę.

    Bez restartu, natychmiast odwracalne — o ile ma się jeszcze dostęp do
    maszyny.
  en: |
    The class is "needs a planned rollout", though on most machines the value is set
    already, since that is what the system's default state looks like.

    The trouble appears where somebody once changed it - and as a rule they did so
    to make something work. Changing it back then restores exactly the problem they
    went round before, and years have usually passed since that decision with nobody
    remembering what it concerned.

    The check consists in enumerating the services reachable from the network and
    making sure each has an admitting rule. The thing that most often escapes
    notice: rules can be bound to one profile while the default setting changes in
    all three.

    The internal traffic of virtual machines and clusters has to be named apart.
    Connections between nodes, replication traffic and communication through a
    virtual switch can lack rules of their own, since until now they passed by
    default.

    The symptom is immediate and sharp: a service ceases to be reachable. Just as
    with switching the firewall on, a change made remotely can cut off the road of
    repair.

    What this does not break: outbound connections, local traffic, services with an
    admitting rule, or answers to connections the machine itself made.

    No restart, undone immediately - provided one still has access to the machine.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
    - virtualization-and-containers
  what_breaks:
    pl:
      - Usługi osiągalne z sieci bez reguły dopuszczającej przestają odpowiadać natychmiast, łącznie z dostępem zarządzającym
      - Ruch replikacji, połączenia między węzłami klastra i komunikacja przez przełącznik wirtualny przestają przechodzić, jeśli nie mają własnych reguł
      - Reguła przypisana do jednego profilu nie pokryje pozostałych, a ustawienie domyślne zmienia się we wszystkich trzech
      - Połączenia wychodzące, ruch lokalny i odpowiedzi na połączenia nawiązane przez maszynę pozostają bez zmian
    en:
      - Services reachable from the network with no admitting rule cease to answer at once, management access included
      - Replication traffic, connections between cluster nodes and communication through a virtual switch cease to pass if they have no rules of their own
      - A rule bound to one profile will not cover the rest, while the default setting changes in all three
      - Outbound connections, local traffic and answers to connections the machine made stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ustawienie zmieniono kiedyś celowo, żeby jakaś usługa działała, i nie ustalono, o którą chodziło
      - Ruch wewnętrzny klastra albo maszyn wirtualnych przechodzi dziś domyślnie i nie ma dla niego reguł
      - Zmiana miałaby zostać wprowadzona zdalnie bez sprawdzenia reguły dla dostępu zarządzającego
    en:
      - The setting was once changed deliberately so that some service might work, and it has not been established which
      - The internal traffic of a cluster or of virtual machines passes by default today and has no rules of its own
      - The change would be made remotely with no check of the rule for management access
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $open = @($profiles | Where-Object { $_.DefaultInboundAction -ne 'Block' })
        if ($open.Count -eq 0) { 'ALL_BLOCK' } else { 'OPEN_IN_' + ($open.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_BLOCK'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, DefaultInboundAction |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultInboundAction Block

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -DefaultInboundAction $p.DefaultInboundAction
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt jest naturalnym dopełnieniem reguły o włączeniu zapory i osobno
    żaden z nich nie wystarcza. Zapora wyłączona nie blokuje niczego; zapora
    włączona, ale przepuszczająca domyślnie, blokuje tylko to, co ktoś
    wymienił z nazwy. Aplikacja powinna pokazywać oba punkty razem, bo
    użytkownik, który zobaczy tylko pierwszy, uzna sprawę za zamkniętą.

    Audyt wymienia profile, w których ustawienie jest słabsze, z tego samego
    powodu co przy regule sąsiedniej: praca polega na ustaleniu, gdzie
    brakuje reguł, a nie na stwierdzeniu, że czegoś brakuje.

    Warto odnotować, że stan domyślny systemu jest tu już zgodny. Punkt
    wygląda więc na formalność — i bywa nią, dopóki nie trafi się na maszynę,
    na której ktoś ustawienie zmienił. Właśnie dlatego audytuje się je
    wprost, zamiast zakładać.
  en: |
    The item is the natural completion of the rule on switching the firewall on, and
    apart neither suffices. A firewall switched off blocks nothing; a firewall
    switched on but letting through by default blocks only what somebody named. The
    application should show both items together, since a user seeing the first alone
    will take the matter for closed.

    The audit names the profiles in which the setting is weaker, for the same reason
    as at the neighbouring rule: the work consists in establishing where the rules
    are missing rather than in stating that something is missing.

    Worth noting that the system's default state already agrees here. The item
    therefore looks like a formality - and is one, until one meets a machine where
    somebody changed the setting. That is exactly why it is audited outright instead
    of assumed.
