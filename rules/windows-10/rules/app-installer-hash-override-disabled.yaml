id: win10-app-installer-hash-override-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Pomijanie sprawdzenia skrótu pakietu zablokowane
    en: The passing over of the check of a package digest blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość zainstalowania pakietu, którego skrót nie
    zgadza się z zapisanym w opisie.

    Instalator pakietów liczy skrót pobranego pliku i porównuje go
    z wartością podaną w opisie pakietu. Niezgodność znaczy, że plik
    pobrany nie jest plikiem opisanym — i domyślnie instalacja zostaje
    wtedy przerwana.

    Istnieje jednak przełącznik pozwalający tę niezgodność zignorować.
    Powstał dla przypadków, w których opis pakietu został dopisany
    niedbale, a plik jest w porządku. W praktyce jego użycie znaczy: pobrałem
    coś innego, niż miało być, i instaluję to mimo wszystko.

    Dokładnie na tym polega zagrożenie. Podmiana pliku w drodze albo
    w pośredniczącym serwerze plików jest wykrywana właśnie przez ten
    skrót. Przełącznik pozwalający go zignorować zamienia ochronę
    w ostrzeżenie, a ostrzeżenie w skrypcie znika w ogóle.

    Odnotowuję, że punkt nie utrudnia niczego, co jest w porządku. Pakiet
    o zgodnym skrócie instaluje się tak jak dotąd.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    pliku podmienionego względem opisu pakietu.
  en: |
    The setting takes away the power of laying on a package whose digest does not agree with the one written in
    its description.

    The installer of packages reckons the digest of the drawn file and sets it beside the value given in the
    package's description. A disagreement means that the drawn file is not the described file - and by default the
    laying on is then broken off.

    There is however a switch letting that disagreement be passed over. It came about for cases where a package's
    description was written carelessly while the file is sound. In practice its use means: I drew something other
    than was meant, and I am laying it on all the same.

    Just there lies the danger. The changing out of a file on the road or in a go-between server of files is found
    by this very digest. A switch letting it be passed over turns a guard into a warning, and a warning in a
    script vanishes altogether.

    I set down that the item makes nothing sound the harder. A package of agreeing digest is laid on as hitherto.

    What an attacker gains while the item goes unmet: the laying on of a file changed out against the package's
    description.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś w organizacji utrzymuje własne opisy pakietów.

    Miejscem wartym uwagi jest własne repozytorium wewnętrzne. Opisy
    pisane na miejscu bywają niedokładne, a przełącznik bywa tam używany
    jako obejście, o którym nikt nie pamięta. Po zmianie instalacja takiego
    pakietu przestanie przechodzić.

    Odnotowuję, że rozwiązaniem jest poprawienie opisu, a nie zniesienie
    zasady. Skrót policzony raz i wpisany do opisu kosztuje minutę,
    a przywraca sens całego mechanizmu.

    Miejscem drugim są pakiety producentów, którzy publikują plik pod tym
    samym adresem i podmieniają go przy każdym wydaniu. Tam niezgodność
    pojawia się sama, bez niczyjej winy, i jest sygnałem do pobrania
    nowszego opisu.

    Skutek pojawia się natychmiast, bez restartu, i jest niewidoczny
    dopóki ktoś nie sięgnie po przełącznik.

    Czego to nie psuje: instalowania pakietów zgodnych z opisem, programów
    już zainstalowanych, sklepu systemowego, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody in the body keeps descriptions of
    packages of their own.

    The place worth notice is an inner store of one's own. Descriptions written on the spot are at times not
    exact, and the switch is at times used there as a way round that nobody remembers. After the change the laying
    on of such a package will cease to come through.

    I set down that the answer is the putting right of the description and no lifting of the policy. A digest
    reckoned once and written into the description costs a minute and gives back the sense of the whole mechanism.

    The second place is packages of makers who put out a file under the same address and change it out at every
    issue. There the disagreement arises of itself, through nobody's fault, and is a sign to draw a newer
    description.

    The consequence shows at once, with no restart, and is unseen until somebody reaches for the switch.

    What this does not break: the laying on of packages agreeing with their description, programs already laid on,
    the system's store, logging on, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalacja pakietu z własnego repozytorium wewnętrznego przestanie przechodzić, jeżeli opis ma nieaktualny skrót
      - Rozwiązaniem jest poprawienie opisu, a nie zniesienie zasady, bo skrót policzony raz kosztuje minutę
      - Pakiety producentów podmieniających plik pod tym samym adresem będą wymagały pobrania nowszego opisu
      - Skutek jest niewidoczny dopóki ktoś nie sięgnie po przełącznik pomijania skrótu
      - Instalowanie pakietów zgodnych z opisem, programy już zainstalowane, sklep systemowy i drukowanie pozostają bez zmian
    en:
      - The laying on of a package from an inner store of one s own will cease to come through if the description holds a stale digest
      - The answer is the putting right of the description and no lifting of the policy, a digest reckoned once costing a minute
      - Packages of makers who change out a file under the same address will call for a newer description to be drawn
      - The consequence is unseen until somebody reaches for the switch of passing over the digest
      - The laying on of packages agreeing with their description, programs already laid on, the system s store and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Własne repozytorium wewnętrzne ma opisy pakietów ze skrótami, których nikt nie utrzymuje w zgodzie z plikami
    en:
      - An inner store of one s own holds descriptions of packages with digests nobody keeps in agreement with the files
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableHashOverride'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableHashOverride'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableHashOverride' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Reguła bywa uznawana za drobiazg, bo przełącznik trzeba podać
    świadomie. Warto, żeby aplikacja podważyła to wprost: przełącznik
    podany raz w skrypcie działa dalej bez niczyjej decyzji, a skrypty
    instalacyjne żyją latami.

    Argument wart zachowania dotyczy tego, co ten skrót właściwie chroni.
    Nie chroni przed złym pakietem w repozytorium — na to jest inna
    warstwa. Chroni przed tym, że pobrany plik nie jest plikiem opisanym,
    czyli przed podmianą w drodze albo na serwerze pośredniczącym.

    Odnotowuję rozwiązanie po stronie obsługi. Jeżeli własne opisy nie
    zgadzają się z plikami, odpowiedzią jest policzenie skrótów, a nie
    zniesienie punktu. Aplikacja powinna to wymienić, bo pierwszym
    odruchem bywa uznanie mechanizmu za przeszkodę.
  en: |
    The rule is at times held a trifle, the switch having to be given knowingly. It is well that the application
    gainsay that outright: a switch given once in a script works on without anybody's decision, and scripts of
    installing live for years.

    The argument worth keeping touches what this digest truly guards. It guards not against a bad package in the
    store - for that there is another layer. It guards against the drawn file not being the described file, which
    is to say against a changing out on the road or upon a go-between server.

    I set down the answer upon the keepers' side. If one's own descriptions do not agree with the files, the
    answer is the reckoning of digests and no lifting of the item. The application ought to name that, the first
    reflex being at times to hold the mechanism a hindrance.
